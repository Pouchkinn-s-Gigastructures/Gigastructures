# $schema: dataschema.json

# GIGATOOLS DATA

########################################################################################################################
# Tags for annotating object types
tags:
  #################################################

  megastructure:

    technical:
      desc: "Technical Mega"
      fullDesc: "This megastructure isn't really a mega, it just uses the system for it. e.g. frameworld asteroid harvest, wrecked ship scrapping"

    ruined:
      desc: "Ruined Megastructure"
      fullDesc: "This is a ruined megastructure and should be included in the trigger for checking whether a mega is ruined or not."

    restored:
      desc: "Restored Megastructure"
      fullDesc: "This is a repaired megastructure and should be included in the trigger for checking whether a mega has been restored."

    megaproject:
      desc: "Non-megastructure Project"
      fullDesc: "This mega is a construction project which doesn't result in an actual megastructure, so shouldn't count against supertensiles."

    force_kilo:
      desc: "Kilostructure Override"
      fullDesc: "This mega should be classed as a kilostructure for trigger purposes even if it doesn't have the right economic category."

    force_giga:
      desc: "Gigastructure Override"
      fullDesc: "This mega should be classed as a gigastructure for trigger purposes even if it doesn't have the right economic category."

    force_final:
      desc: "Final Stage Override"
      fullDesc: "This mega should count as the final mega in its series even if other non-technical megas upgrade from it."

  #################################################

  scripted_trigger:

    test:
      desc: "test desc"
      fullDesc: "longer desc"

########################################################################################################################
# Formats for auto-generated list blocks
list_formats:
  #################################################

  scripted_trigger:
    prefix: |
      or = {
    suffix: |
      }
    entry: "$trigger = £name # £locName"

########################################################################################################################