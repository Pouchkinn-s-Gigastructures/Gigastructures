# $schema: dataschema.json

# GIGATOOLS DATA

########################################################################################################################
# Tags for annotating object types
tags:
  #################################################

  economic_category:
    kilostructure:
      desc: "Kilostructure"
      fullDesc: "Megastructures with this economic category are considered kilostructures. Can be overridden on mega definitions."
      incompatible:
        - megastructure
        - gigastructure

    megastructure:
      desc: "Megastructure"
      fullDesc: "Megastructures with this economic category are neither a kilostructure nor gigastructure. Can be overridden on mega definitions."
      incompatible:
        - kilostructure
        - gigastructure

    gigastructure:
      desc: "Gigastructure"
      fullDesc: "Megastructures with this economic category are considered gigastructures. Can be overridden on mega definitions."
      incompatible:
        - kilostructure
        - megastructure

  #################################################

  megastructure:
    kilostructure:
      desc: "Kilostructure"
      fullDesc: "This megastructure is a kilostructure and should be treated as such by triggers.\nInherited by megas from their economic category, can be used to override."

    megastructure:
      desc: "Megastructure"
      fullDesc: "This megastructure is neither a kilostructure nor gigastructure and should be treated as such by triggers.\nInherited by megas from their economic category, can be used to override."

    gigastructure:
      desc: "Gigastructure"
      fullDesc: "This megastructure is a gigastructure and should be treated as such by triggers.\nInherited by megas from their economic category, can be used to override."

    technical:
      desc: "Technical Mega"
      fullDesc: "This megastructure isn't really a mega, it just uses the system for it. e.g. frameworld asteroid harvest, wrecked ship scrapping"

    ruined:
      desc: "Ruined Megastructure"
      fullDesc: "This is a ruined megastructure and should be included in the trigger for checking whether a mega is ruined or not."

    restored:
      desc: "Restored Megastructure"
      fullDesc: "This is a repaired megastructure and should be included in the trigger for checking whether a mega has been restored."

    megaproject:
      desc: "Non-megastructure Project"
      fullDesc: "This mega is a construction project which doesn't result in an actual megastructure, so shouldn't count against supertensiles."

    first_stage:
      desc: "First Stage Megastructure"
      fullDesc: "Applied automatically to the first stage of megastructures."

    final_stage:
      desc: "Final Stage Megastructure"
      fullDesc: "Applied automatically to the final stage of megastructures."

    force_final_stage:
      desc: "Final Stage Megastructure Override"
      fullDesc: "This mega should be considered the final step in a chain even though it has further upgrades."
      classify: false

    dummy:
      desc: "Dummy Mega"
      fullDesc: "Dummy mega for mod compat or similar purposes, should not be included in mega categorisation, and generally ignored by the tools."
      classify: false

    buildable:
      desc: "Buildable"
      fullDesc: "Will be considered in construction ship related triggers and effects. Automatically applied to first stage megas where potential isn't always = no."
      classify: false

  #################################################

  scripted_trigger:

    test:
      desc: "test desc"
      fullDesc: "longer desc"

########################################################################################################################
# Formats for auto-generated list blocks
list_formats:
  #################################################

  scripted_trigger:
    prefix: |
      or = {
    suffix: |
      }
    entry: "$trigger = £name # £locName"

########################################################################################################################
# Auto generated economic category modifier localisation
eco_category_loc:
  # Includes planet_jobs and all of its descendants by default, plus these inclusions, minus exclusions
  categories:
    include:
      - "pop_category_civilians"
    exclude:
      - "planet_managers" # defunct

  # Includes all resources by default, minus exclusions
  resources:
    exclude:
      - "biomass"
      - "ai_unobtainium"
      - "giga_sr_bulk_matter"
      - "giga_sr_quasaric_energy"
      - "giga_sr_bulk_matter"
########################################################################################################################