  sm_giga_ehof_resource_module_desc:99 "This module is the culmination of advances in scientific and industrial examinations of the foreign materials we encountered through our usage of the $sm_giga_arkship_ehof$. The joint efforts have yielded a process which allows us to harvest these materials."
