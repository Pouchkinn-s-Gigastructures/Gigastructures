  sm_giga_arkship_negative_mass_arc_emitter:99 "$QNM_ARC_EMITTER$"
  sm_giga_arkship_negative_mass_arc_emitter_desc:99 "This module houses an emitter capable of creating randomly polarized, everchanging arcs of negative mass. Their incomprehensive volatile nature allows these arcs to bypass enemy defenses with ease."
