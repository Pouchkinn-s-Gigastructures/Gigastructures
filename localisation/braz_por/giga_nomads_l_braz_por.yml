l_braz_por:
  
  
  ##########################
  ### DECISIONS
  ##########################
  
  giga_nomad_claim_unowned_nomad_compat_megas:99 "Claim Unowned Nomad Compatible Megastructures"
  giga_nomad_claim_unowned_nomad_compat_megas_desc:99 "If this system contains unowned megastructures which nomads are capable of using, this decision lets us assert our rightful claims."
  giga_nomad_claim_unowned_nomad_compat_megas_effect:99 "This will transfer all §Ynomad compatible megastructures§! within this system to our direct control."
  giga_nomad_claim_unowned_nomad_compat_megas_fail1:99 "$TRIGGER_FAIL$System must be unclaimed."
  giga_nomad_claim_unowned_nomad_compat_megas_fail2:99 "$TRIGGER_FAIL$No unowned megastructures that are nomad compatible in this system."
  
  ############################################################################################################################################################
  ####### NOMAD CELESTIALS
  ############################################################################################################################################################
  
  giga_list_category_nomad_warship:99 "§MNOMAD WARSHIP§!"
  
  ##########################
  ### Nomad War Moon ###
  ##########################
  giga_nomad_war_moon:99 "Heavy Artillery Platform"
  giga_nomad_war_moon_plural:99 "Heavy Artillery Platforms"
  giga_nomad_war_moon_cap:99 "$giga_nomad_war_moon$"
  allow_nomad_war_moon:99 "§HUnlocks Megastructure:§! $giga_nomad_war_moon$"
  desc_nomad_war_moon:99 "In order to counter these "celestials", we have devised a prototype warship made to lay them low through the application of judicious amounts of firepower. This does leave it a little more fragile than would be appreciated, but so long as it is properly escorted, that vulnerability will not be relevant."
  
  giga_nomad_war_moon_section_alpha:99 "Spinal Megaweapon"
  giga_nomad_war_moon_section_beta:99 "Secondary Batteries"
  giga_nomad_war_moon_section_charlie:99 "Escort Hangars"
  giga_nomad_war_moon_section_delta:99 "Counterfire Batteries"
  
  giga_tech_nomad_war_moon_pre:99 "$giga_tech_war_moon_1$"
  giga_tech_nomad_war_moon_pre_desc:99 "$giga_tech_war_moon_1_desc$"
  giga_tech_nomad_war_moon:99 "Anti-Celestial Prototype"
  giga_tech_nomad_war_moon_desc:99 "A prototype design, rushed to counter the threat of $giga_war_moon_plural$. Less durable, but with a weapon specialized to defeat them."
  
  GIGA_NOMAD_WAR_MOON_ANTI_CELESTIAL:99 "Purgation Lance"
  GIGA_NOMAD_WAR_MOON_ANTI_CELESTIAL_DESC:99 "A weapon specifically created to crack open planetary crust, and anything protecting it."
  GIGA_NOMAD_WAR_MOON_COMPUTER:99 "$giga_nomad_war_moon$ Combat Computer"
  GIGA_NOMAD_WAR_MOON_COMPUTER_DESC:99 "The $giga_nomad_war_moon$ will stay at very long range (§Y3250§!) range and fire its array of weapons at available targets."
  REACTOR_NOMAD_WAR_MOON:99 "Prototype Heavy Reactor"
  REACTOR_NOMAD_WAR_MOON_DESC:99 "A special reactor, specifically created and tuned to power the $giga_nomad_war_moon$ and its specialized systems."
  
  nomad_war_moon_0:99 "$giga_nomad_war_moon$ Construction Site"
  nomad_war_moon_0_DESC:99 "The construction site for a future $giga_nomad_war_moon$, a warship made to counter celestial craft."
  nomad_war_moon_0_MEGASTRUCTURE_DETAILS:99 "$giga_list_category_megastructure$ - $giga_list_category_nomad_warship$ - $giga_list_category_ship_production$\nA warship specially created to fight celestials, doing more damage to large targets.\n§LThe $giga_nomad_war_moon_cap$ is a prototype weapons system, sacrificing some of the defensive power usually seen on a craft of this size for a massive primary weapon."
  nomad_war_moon_1:99 "$giga_nomad_war_moon$ Hull"
  nomad_war_moon_1_DESC:99 "The $giga_nomad_war_moon$ has almost been completed. Only the main weapon system and directly connected infrastructure remains."
  nomad_war_moon_2:99 "$giga_nomad_war_moon$"
  nomad_war_moon_2_DESC:99 "A completed $giga_nomad_war_moon$, ready to take to the stars."
  nomad_war_moon_debris:99 "Wrecked $giga_nomad_war_moon$"
  nomad_war_moon_debris_DESC:99 "The remnants of a massive warship built by an advanced civilization, which has remained largely intact due to its reinforced armored hull. Built around a massive primary weapon that is remarkably intact, it might be possible to restore this fearsome craft to its former glory, provided we have plenty of resources and the technology to do so."
  nomad_war_moon_debris_MEGASTRUCTURE_DETAILS:99 "$nomad_war_moon_0_MEGASTRUCTURE_DETAILS$"
  nomad_war_moon_restored:99 "$giga_nomad_war_moon$"
  nomad_war_moon_restored_DESC:99 "$nomad_war_moon_2_DESC$"
  nomad_war_moon_restored_MEGASTRUCTURE_DETAILS:99 "$war_moon_0_MEGASTRUCTURE_DETAILS$"
  
  giga_nomad_dialog.000.name:99 "$giga_nomad_war_moon$ Construction Site Built"
  giga_nomad_dialog.000.desc:99 "The Construction Site for a future $giga_nomad_war_moon$ is now complete. This deep-space construction site will serve as a staging depot in order to begin constructing the $giga_nomad_war_moon$ itself.\n\n§INOTE: Don't forget to design the $giga_nomad_war_moon$ in the ship designer!§!"
  giga_nomad_dialog.000.a:99 "Marvelous."
  giga_nomad_dialog.002.name:99 "$giga_nomad_war_moon$ Hull Complete"
  giga_nomad_dialog.002.desc:99 "The hull of the $giga_nomad_war_moon$ is now complete! Everything except the core weapons systems and reactor has been installed and tested."
  giga_nomad_dialog.002.a:99 "One step closer."
  giga_nomad_dialog.004.name:99 "A Gun Pointed At the Head of The Moon"
  giga_nomad_dialog.004.desc:99 "We have done it. With the $giga_nomad_war_moon$ main weapon operational, this monstrous spaceship is now operational. A prototype to counter $giga_war_moon_plural$, the data will be invaluable in creating more potent countermeasures. The ship has engaged its engines, and is now ready to join our fleets."
  giga_nomad_dialog.004.a:99 "Truly a marvelous accomplishment."
  
  MESSAGE_NOMAD_WAR_MOON_DESTROYED:99 "$giga_nomad_war_moon$ Destroyed"
  MESSAGE_NOMAD_WAR_MOON_DESTROYED_DESC:99 "The $NOMAD_CELESTIAL_WARSHIP_NAME|Y$ $giga_nomad_war_moon$ has been destroyed by the $ENEMY_NAME|Y$ in the $SYSTEM_NAME|Y$ system.\n\nIt has been reduced to an immobile wreck which may be repaired if we have the necessary resources and are friendly with the system owner, if they exist."
  
  giga_nomad_dialog.010.name:99 "$giga_nomad_war_moon$ Dismantled"
  giga_nomad_dialog.010.desc:99 "We have dismantled the incomplete $giga_nomad_war_moon$ found within the [giga_debris_system.GetName] system."
  giga_nomad_dialog.010.a:99 "Good."
  giga_nomad_dialog.012.name:99 "$Wrecked $giga_nomad_war_moon$ Scrapped"
  giga_nomad_dialog.012.desc:99 "Our scavenging teams have now completed the dismantlement of the ruined $giga_nomad_war_moon$ found within the [giga_debris_system.GetName] system. The dismantlement of the $giga_nomad_war_planet$'s colossal weapons array and movement systems has netted us significant amounts of alloys and engineering research."
  giga_nomad_dialog.012.a:99 "Good."
  giga_nomad_actions.501.name:99 "$giga_nomad_war_moon$ Repaired!"
  giga_nomad_actions.501.desc:99 "Wonderful news! We have managed to restore the ruined $giga_nomad_war_moon$ in the §Y[from.GetName]§! system. It has taken quite a lot of work, and most of its internals had to be completely rebuilt from scratch, but this mighty warship is now operational once more."
  giga_nomad_actions.501.a:99 "Wonderful."
  
  ##########################
  ### Nomad War Planet ###
  ##########################
  
  giga_nomad_war_planet:99 "Super-Heavy Siegecraft"
  giga_nomad_war_planet_plural:99 "Super-Heavy Siegecraft"
  giga_nomad_war_planet_cap:99 "$giga_nomad_war_planet$"
  allow_nomad_war_planet:99 "§HUnlocks Megastructure:§! $giga_nomad_war_planet$"
  desc_nomad_war_planet:99 "A supermassive warship optimized for combat against celestials. Made of planetary amounts of alloys, and equipped with a weapon that can obliterate §Ranything.§!"
  
  giga_nomad_war_planet_section_alpha:99 "Celestial Decimator"
  giga_nomad_war_planet_section_beta:99 "Reinforced Primary Weapons"
  giga_nomad_war_planet_section_charlie:99 "Reinforced Primary Weapons"
  giga_nomad_war_planet_section_delta:99 "Macro-Fabricator Hangars"
  giga_nomad_war_planet_section_echo:99 "Secondary Batteries"
  
  giga_tech_nomad_war_planet:99 "Super-Planetary Counter Doctrine"
  giga_tech_nomad_war_planet_desc:99 "The $giga_nomad_war_moon$ was thought to be enough to counter the weaponized celestials. The arms race will always continue, and we must think bigger and better. Combining several incredibly advanced technologies, will allow us to create a warship of immense size. Such an incredibly massive spaceship would be near-indestructible, and could wipe out entire Fallen Empires by itself."
  
  GIGA_SUPER_OMEGA_LANCE_1_NOMAD:99 "Ohrmuzd Heavy Purgation Lance"
  GIGA_SUPER_OMEGA_LANCE_1_NOMAD_DESC:99 "A massive energy lance directly fed with city wide conduits from the main reactor, made to serve as a massive general purpose weapon."
  GIGA_PLANETARY_RAILGUN_NOMAD:99 "Ahzek Prototype Celestial Penetrator"
  GIGA_PLANETARY_RAILGUN_NOMAD_DESC:99 "A massive railgun that has been scaled up thousandfold, specially formulated to crack through the strongest defense, whether specialized alloys or mundane crust."
  GIGA_PLANET_MISSILE_1_NOMAD:99 "Macro Missile Batteries"
  GIGA_PLANET_MISSILE_1_NOMAD_DESC:99 "Massive rows of missile batteries, hidden within large armored silos, capable of massive destruction."
  GIGA_NOMAD_WAR_PLANET_COMPUTER:99 "$giga_nomad_war_planet$ Combat Computer"
  GIGA_NOMAD_WAR_PLANET_COMPUTER_DESC:99 "The $giga_nomad_war_planet$ will stay at very long range (§Y300§!) range and fire its array of weapons at available targets."
  REACTOR_NOMAD_WAR_PLANET:99 "Superheavy Reactor"
  REACTOR_NOMAD_WAR_PLANET_DESC:99 "A minor planetoid sized reactor, greedily drawn from to feed the $giga_nomad_war_planet$."
  
  nomad_war_planet_0:99 "$giga_nomad_war_planet$ Construction Site"
  nomad_war_planet_0_DESC:99 "The construction site for a future $giga_nomad_war_planet$, a massive warship made to fight celestials on their own terms."
  nomad_war_planet_0_MEGASTRUCTURE_DETAILS:99 "$giga_list_category_gigastructure$ - $giga_list_category_nomad_warship$ - $giga_list_category_ship_production$\nA massive warship made to fight celestials on their own terms.\n§LThe $giga_nomad_war_planet_cap$ is the fully realized prototype of the $giga_nomad_war_moon$, fixing its defensive weaknesses while also improving its already incredible lethality."
  nomad_war_planet_1:99 "$giga_nomad_war_planet$ Hull"
  nomad_war_planet_1_DESC:99 "The $giga_nomad_war_planet$'s internal systems have been installed the vast hull. A gigantically gigantic reactor is installed within the armored citadel, capable of powering the most powerful weapons."
  nomad_war_planet_2:99 "$giga_nomad_war_planet$ Defensive Arrays"
  nomad_war_planet_2_DESC:99 "Installed defensive systems allow this massive warship to absorb damage that would sunder worlds."
  nomad_war_planet_3:99 "$giga_nomad_war_planet$"
  nomad_war_planet_3_DESC:99 "A completed $giga_nomad_war_planet$, ready to take to the stars."
  nomad_war_planet_debris:99 "Wrecked $giga_nomad_war_planet$"
  nomad_war_planet_debris_DESC:99 "The remnants of a massive warship built by an advanced civilization, which has remained largely intact due to its massively armored hull. It once possessed some of the largest weaponry known to the galaxy, and although it has taken quite the beating, it might be possible to restore this fearsome craft to its former glory, provided we have plenty of resources and the technology to do so."
  nomad_war_planet_debris_MEGASTRUCTURE_DETAILS:99 "$nomad_war_planet_0_MEGASTRUCTURE_DETAILS$"
  nomad_war_planet_restored:99 "$nomad_war_planet_3$"
  nomad_war_planet_restored_DESC:99 "$nomad_war_planet_3_DESC$"
  nomad_war_planet_restored_MEGASTRUCTURE_DETAILS:99 "$war_planet_0_MEGASTRUCTURE_DETAILS$"
  
  giga_nomad_dialog.050.name:99 "$giga_nomad_war_planet$ Construction Site Built"
  giga_nomad_dialog.050.desc:99 "The Construction Site for a future $giga_nomad_war_planet$ is now complete. This deep-space construction site will serve as a staging depot in order to begin constructing the $giga_nomad_war_planet$ itself.\n\n§INOTE: Don't forget to design the $giga_nomad_war_planet$ in the ship designer!§!"
  giga_nomad_dialog.050.a:99 "Marvelous."
  giga_nomad_dialog.052.name:99 "$giga_nomad_war_planet$ Hull Complete"
  giga_nomad_dialog.052.desc:99 "The hull of the $giga_nomad_war_planet$ is now complete! All general systems have been installed, including the massive planetary scale reactor, capable of powering the ship's future thrusters and main weapons."
  giga_nomad_dialog.052.a:99 "One step closer."
  giga_nomad_dialog.053.name:99 "$giga_nomad_war_planet$ Defensive Systems Complete"
  giga_nomad_dialog.053.desc:99 "Our $giga_nomad_war_planet$'s defensive systems have been completed. Kilometers thick steel stands behind planetary strength shields, all mounted on a massive frame with an equally massive and over-engineered FTL Drive. The final step is to install the weapons systems."
  giga_nomad_dialog.053.a:99 "We are close."
  giga_nomad_dialog.054.name:99 "The Chariot of Judgement is at Hand"
  giga_nomad_dialog.054.desc:99 "We have done it. With the $giga_nomad_war_planet$ main weapon arrays completed, this monstrous spaceship is now operational. Over ten thousand kilometers long, this truly massive construct is the logical evolution of the the $giga_nomad_war_moon$. The ship has engaged its engines, and is now ready to join our fleets."
  giga_nomad_dialog.054.a:99 "Truly a marvelous accomplishment."
  
  MESSAGE_NOMAD_WAR_PLANET_DESTROYED:99 "$giga_nomad_war_planet$ Destroyed"
  MESSAGE_NOMAD_WAR_PLANET_DESTROYED_DESC:99 "The $NOMAD_CELESTIAL_WARSHIP_NAME|Y$ $giga_nomad_war_planet$ has been destroyed by the $ENEMY_NAME|Y$ in the $SYSTEM_NAME|Y$ system.\n\nIt has been reduced to an immobile wreck which may be repaired if we have the necessary resources and are friendly with the system owner, if they exist."
  
  giga_nomad_dialog.060.name:99 "$giga_nomad_war_planet$ Dismantled"
  giga_nomad_dialog.060.desc:99 "We have dismantled the incomplete $giga_nomad_war_planet$ found within the [giga_debris_system.GetName] system."
  giga_nomad_dialog.060.a:99 "Good."
  giga_nomad_dialog.063.name:99 "Wrecked $giga_nomad_war_planet$ Scrapped"
  giga_nomad_dialog.063.desc:99 "Our scavenging teams have now completed the dismantlement of the ruined $giga_nomad_war_planet$ found within the [giga_debris_system.GetName] system. The dismantlement of the $giga_nomad_war_planet$'s colossal weapons array and movement systems has netted us significant amounts of alloys and engineering research."
  giga_nomad_dialog.063.a:99 "Good."
  giga_nomad_actions.551.name:99 "$giga_nomad_war_planet$ Repaired!"
  giga_nomad_actions.551.desc:99 "Wonderful news! We have managed to restore the ruined $giga_nomad_war_planet$ in the §Y[from.GetName]§! system. It has taken quite a lot of work, and most of its internals had to be completely rebuilt from scratch, but this mighty warship is now operational once more."
  giga_nomad_actions.551.a:99 "Wonderful."
  
  giga_nomad_war_planet_disband_activity_key:99 "Disband this $giga_nomad_war_planet$"
  giga_nomad_war_planet_disband_title:99 "Disband this $giga_nomad_war_planet$"
  giga_nomad_war_planet_disband_button:99 "Due to hero ships not being disbandable, this will let you destroy your own $giga_nomad_war_planet$.\n\n§ROBVIOUSLY THIS KILLS THE SHIP§!"
  giga_nomad_actions.560.name:99 "Disband [this.fleet.GetName]?"
  giga_nomad_actions.560.desc:99 "Do you wish to disband the $giga_nomad_war_planet$ [this.fleet.GetName]?"
  giga_nomad_actions.560.no:99 "I WANT TO KEEP MY SHIP"
  giga_nomad_actions.560.yes:99 "§RBLOW IT UP!§!"
  giga_nomad_actions.560.yes.tt:99 "§ROBVIOUSLY THIS KILLS THE SHIP, WITH NO DEBRIS§!"
  
  ##########################
  ### Neutronium Harvest ###
  ##########################
  
  giga_tech_arkship_neutronium_harvester:99 "$giga_tech_neutronium_gigaforge$"
  giga_tech_arkship_neutronium_harvester_desc:99 "By providing our $arkship_cap_plural$ with the means to harvest stellar remnants such as $pc_neutron_star_plural$, we can guarantee a reliable source of valuable alloys for aeons to come."
  
  sm_giga_arkship_neutronium_harvester:99 "Mass Neutronium Harvester"
  sm_giga_arkship_neutronium_harvester_tt:99 "$ARKSHIP_ACTION_HEADER$ $TABBED_NEW_LINE$['scripted_action:giga_arkship_harvest_neutronium']"
  has_giga_arkship_neutronium_harvester_tt:99 "Has a §Y$sm_giga_arkship_neutronium_harvester$§!"
  has_giga_arkship_neutronium_deposit_modifier_tt:99 "The $arkship_cap$ is §Rstill processing§! excess neutronium."
  GIGA_ARKSHIP_NEUTRONIUM_HARVESTER:99 "$sm_giga_arkship_neutronium_harvester$"
  
  giga_arkship_harvest_neutronium:99 "$giga_tech_neutronium_gigaforge$"
  giga_arkship_harvest_neutronium_desc:99 "§LWith the extensive and incredibly careful use of gravity bores and magnetic field projectors, small fractions of this stellar remnants outer layers are harvested for immediate processing into hyper-dense neutronium alloys.§!"
  giga_arkship_harvest_neutronium_effect:99 "$giga_arkship_harvest_neutronium_planet_effect$ $DOUBLE_NEW_LINE$ $giga_arkship_harvest_neutronium_arkship_effect$"
  giga_arkship_harvest_neutronium_planet_effect:99 "$TABBED_NEW_LINE$ $PLANET_EFFECTS_HEADER$ $TABBED_NEW_LINE$- §Y$giga_arkship_neutronium_harvested$§! modifier added for for £time£ §H$@arkship_strip_mine_duration_doubled|0$ Months§!: $TABBED_NEW_LINE$$t$ $mod_station_gatherers_produces_mult$: $@arkship_harvest_resources_station_penalty|0%+$ $TABBED_NEW_LINE$$t$ $giga_harvested_neutronium_tt$"
  giga_arkship_harvest_neutronium_arkship_effect:99 " $ARKSHIP_EFFECTS_HEADER$ $TABBED_NEW_LINE$- §Y$giga_arkship_neutronium_deposit$§! added for §Y15§! years: $TABBED_NEW_LINE$$t$ $mod_planet_metallurgists_alloys_produces_add$: §G+1.5§! $TABBED_NEW_LINE$$t$ $mod_planet_metallurgists_energy_upkeep_add$: §R+2§!"
  giga_arkship_harvest_neutronium_ship_button:99 "$giga_arkship_harvest_neutronium_effect$"
  giga_arkship_harvest_neutronium_activity_key:99 "Preparing Gravity Bores"
  giga_arkship_harvest_neutronium_progress_activity_key:99 "Harvesting Neutronium (§Y$PROGRESS$%§!)"
  giga_arkship_harvest_neutronium_required_progress_key:99 "£time£ $@arkship_reprocess_planet_required_progress|0$ §WDays§!"
  
  giga_arkship_neutronium_deposit:99 "Harvested Neutronium Deposit"
  giga_arkship_neutronium_deposit_desc:99 "A massive deposit of neutronium, lifted directly from the surface of a dying star for processing by our finest [Owner.GetAlloyProducerPlural].\n\n§EMonths Until Processing Complete:§! §Y[planet.GetMonthsUntilNeutroniumDepositHarvested]§!"
  giga_arkship_neutronium_harvested:99 "Harvestable Neutronium Deposits Exhausted"
  giga_arkship_neutronium_harvested_desc:99 "All easily reachable neutronium sources have been collected. It will take time to uncover new deposits and set up the infrastructure to harvest them."
  giga_harvested_neutronium_tt:99 "§RBlocks all $giga_arkship_harvest_neutronium$ Actions§!"
  
  GIGA_NOMAD_NEUTRONIUM_HARVEST_READY_TITLE:99 "$sm_giga_arkship_neutronium_harvester$ Ready For Use"
  GIGA_NOMAD_NEUTRONIUM_HARVEST_READY_DESC:99 "$giga_arkship_harvest_neutronium$ is off cooldown and ready for use."