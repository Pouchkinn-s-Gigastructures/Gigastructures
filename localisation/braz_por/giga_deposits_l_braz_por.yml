  d_flusio_arcology_wreck:99 "Wrecked Megacities"
  d_flusio_arcology_wreck_desc:99 "Cities partially or completely destroyed in the fighting that occurred on the Flusio-Arcology."
  d_flusio_arcology_anarchy:99 "Flusionian Anarchy"
  d_flusio_arcology_anarchy_desc:99 "Large swathes of Flusion have fallen into complete anarchy as a result of collateral damage from the devastating fighting to dislodge the Kaiser from the planet."
  d_flusio_arcology_anarchy_collapse:99 "Flusionian Anarchy"
  d_flusio_arcology_anarchy_collapse_desc:99 "Large swathes of Flusion have fallen into complete anarchy as a result of brutal warlord conflicts over the power vacuum left by the Kaiser."
  
  d_flusio_arcology_administration:99 "Flusio-Arcology Administration"
  d_flusio_arcology_administration_desc:99 "Administering the logistical nightmare that surrounds Flusion is no easy task. Due to the immense number of districts the Flusio-Arcology can support, more care must be taken to manage it properly."
  
  d_flusio_arcology_administration_tooltip:99 "[giga_flusion_administration_mechanics]"
  
  d_solaktropa_project:99 "Roqualtropa Project"
  d_solaktropa_project_desc:99 "The Roqualtropa Project creates vast quantities of useable land for the Katzens to build upon as well as tremendous quantities of water for agriculture, at the cost of disturbing Flusion's natural climate."
  
  d_solaktropa_project_wreck:99 "Roqualtropa Wreck"
  d_solaktropa_project_wreck_desc:99 "The destruction of the Roqualtropa Dam has caused untold quantities of devastation to Flusion and its inhabitants."
  
  d_katlantropa_project:99 "Katlantropa Project"
  d_katlantropa_project_desc:99 "The Katlantropa Project irrigates formerly desertic areas, rendering them suitable for agriculture and irrigation."
  
  d_katlantropa_project_wreck:99 "Katlantropa Desertification"
  d_katlantropa_project_wreck_desc:99 "The destruction of Katlantropa has reverted formerly arable areas into vast deserts."
  
  d_flusion_katown_central:99 "Zentralkatown"
  d_flusion_katown_central_desc:99 "Designed by architect Dietrich Videafurr, the Katown Megalopolis is the shining jewel of Flusion.\n\nA colossal and perfectly-built megacity, it spans the entire northern part of the Katzen Herzlands. Blending natural spaces and rivers with elegant yet efficient Katzen architecture, it can house billions of inhabitants.\n\nHere in Inner Katown lie civic monuments such the Grand Katown Pyramid, a colossal pyramid that stretches miles into the sky: the architectural embodiment of galactic power."
  
  d_flusion_bundengrad:99 "Bundengrad"
  d_flusion_bundengrad_desc:99 "The semi-aquatic megacity of Bundengrad encompasses the remnants of the Katspian (previously Crabspian) sea, historic home to species such as the Kronks and Yinjites.\n\nCentral to this city's design purpose is the monumental Bundeshalle, built as the part-time residence and office of Katzenartig governor Loris von Kattensbach.\n\nThe Bundeshalle, alongside its army of ancillary bureaucratic offices, is designed to manage not only much of the day-to-day governance of Flusion, but also to wield authority over the many distant provinces of an interstellar empire."
  
  d_flusion_katown_submerged:99 "Katownunterseeisch"
  d_flusion_katown_submerged_desc:99 "Many thousands of square kilometres of Katown lie underwater, including the whole of the northern Sonne Meer sea and stretches of the Pacwific Ocean. These sectors are built for the aquatic species of the Katzenartig Imperium.\n\nSuch intimate contact with the open ocean also has bountiful industrial and logistical uses, benefitting the import, processing and export of Flusionian goods from Katown."
  
  d_flusion_teho:99 "Teho"
  d_flusion_teho_desc:99 "Straddling Flusion's southern pole, the frigid megacity of Teho holds many secrets, both old and new.\n\nIn the depths of the city lie grand remains from an era over ten thousand years ago, from where the Haranians dominated southern Flusion till a dimming Jublio froze their pole over.\n\nMore recently, the Kaiser has filled every nook and cranny of the expanded city with black sites for some of the Imperium's less... good-looking research projects."
  
  d_flusion_lutecien:99 "Lutecien"
  d_flusion_lutecien_desc:99 "Even though Lutecien became the megacity of today under Katzen rule, the Roqualian heritage shines through. Reliable, easily-upgradeable, high-speed communications infrastructure keeps the future-focused streets of Lutecien wired in and up to date.\n\nThis Roqualian-style first-class digital infrastructure, with its scope widened by the Katzens from recreation to cyberwarfare, is now capable of performing a wide variety of high-tech purposes."
  
  d_flusion_uranstadt:99 "Uranstadt"
  d_flusion_uranstadt_desc:99 "Renowned as an engine of industrial progress, Uranstadt's heritage is that of a literal and metaphorical powerhouse of the Imperium.\n\nVast power cables, ubiquitous transformers, and old cooling towers repurposed for every task imaginable, characterise the aptly-named \"Uranium City\" of Flusion."
  
  d_flusion_grosslaurendaar:99 "Großlaurendaar"
  d_flusion_grosslaurendaar_desc:99 "The capital city of Laurendaar reflects the character of the continent as a whole under Katzenartig rule: a showpiece paradisaical realm. This constructed utopia was designed to be an ideal city, a tourist resort, and a giant propaganda set simultaneously.\n\nVast ecospheres cluster like raindrops on an overgrown metal grille, each containing a hand-perfected imitation of an alien world. In Großlaurendaar like nowhere else can one can turn a corner in an urban canyon to see anything from a sunbathed desert to a fungal cavern or thick jungle."
  
  d_flusion_katown_outer:99 "Äußerekatown"
  d_flusion_katown_outer_desc:99 "Outer Katown sprawls ever-south across the Herzlands of central Flusion, practically turning the Katown Megalopolis into a continent unto itself.\n\nImmense overland transport corridors tear open the heart of the city to trans- and inter- continental logistics, their burden lessened by countless spaceports.\n\nFactories in districts such as Brandenpurr are the size of small cities themselves, built for unthinkable efficiencies of scale and by unthinkable economic ambition."
  
  d_flusion_gardenwilds:99 "Flusionian Gardenwilds"
  d_flusion_gardenwilds_desc:99 "Within and without the mighty eperopoleis, the Flusio-Arcology is a garden as much as an megafactory, rich in somewhat tame but nonetheless beautiful nature."
  
  #########################################
  ### Birch Deposits ######################
  #########################################
  
  d_aeternum_gigantic_fission_reactor:0 "Reator de Fissão Colossal"
  d_aeternum_gigantic_fission_reactor_desc:0 "Um estranho reator de fissão construído por Aeternum na parte distante, liberando um pedaço gigantesco de urânio e produzindo grandes quantidades de eletricidade."
  
  d_exp_civ_primitive_preserve:0 "Reserva de Vidoeiro da Civilização Primitiva"
  d_exp_civ_primitive_preserve_desc:0 "Uma civilização primitiva inteira reside em um pedaço do Mundo do Vidoeiro.Estudá-los representa um potencial científico incrível. "
  
  d_exp_civ_space_preserve:0 "Reserva de Vidoeiro da Civilização da Era Espacial"
  d_exp_civ_space_preserve_desc:0 "Uma civilização da era espacial inteira reside em um pedaço do Mundo do Vidoeiro. Estudá-los representa um potencial científico incrível."
  
  d_exp_civ_fe_preserve:0 "Reserva de Vidoeiro da Civilização Precursora"
  d_exp_civ_fe_preserve_desc:0 "Uma antiga civilização precursora inteira reside em um pedaço do Mundo do Vidoeiro. Estudá-los representa um potencial científico incrível."
  
  d_aeternum_decaying_hyperstructure:99 "Decaying Hyperstructure"
  d_aeternum_decaying_hyperstructure_desc:0 "Grandes áreas deste mundo do vidoeiro caíram em ruínas após milhares de anos de negligência. Repará-los seria, sem dúvida, um grande empreendimento, mas nos permitiria expandir mais uma vez a área habitável do mundo do vidoeiro. nos concederá§G3§!$aeternum_tech_intel$. "
  
  