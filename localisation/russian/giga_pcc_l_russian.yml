l_russian:
  #########################################
  ### Planetary Computer ##################
  #########################################
  
  giga_tech_planetary_computer:0 "Вычислительные комплексы планетарного масштаба"
  giga_tech_planetary_computer_desc:0 "Решение постоянно растущих потребностей в вычислительных мощностях: вся планета превращается в компьютер! Используя специальные техники терраформирования, этот, казалось бы, глупый проект может стать реальностью."
  
  giga_dialog.1301.name:0 "Строительная площадка $name_planetary_computer$ завершена"
  giga_dialog.1301.desc:0 "Строительная площадка будущего $name_planetary_computer$ завершена в системе [giga_system.GetName]. На этой площадке мы в конечном итоге превратим всю планету в огромный компьютер, обладающий огромной вычислительной мощностью."
  giga_dialog.1301.a:0 "Прекрасно."
  
  giga_dialog.1302.name:0 "Внутренний каркас $name_planetary_computer$ завершен"
  giga_dialog.1302.desc:0 "Мы еще на один шаг ближе к завершению $name_planetary_computer$ в системе [giga_system.GetName]. Теперь, когда внутренний каркас установлен, мы готовы должным образом завершить этот колоссальный проект, уходящий глубоко в мантию планеты. Вскоре в нашем распоряжении будут немыслимые вычислительные мощности."
  giga_dialog.1302.a:0 "Чудесно."
  
  giga_dialog.1303.name:0 "$name_planetary_computer$ построен!"
  giga_dialog.1303.desc:0 "Отличные новости! В системе [giga_system.GetName] мы полностью заключили планету в массивный суперкомпьютер, который простирается от поверхности до мантии планеты. Эта поистине впечатляющая конструкция предоставит исследователям огромные возможности для исследований на своей поверхности и, безусловно, станет большим подспорьем для наших исследований."
  giga_dialog.1303.a:0 "Невероятно."
  
  planetary_computer_0:0 "Строительная площадка $name_planetary_computer$"
  planetary_computer_0_DESC:0 "Строительная площадка для будущего $name_planetary_computer$, который будет построен вокруг планеты внизу. Этот огромный компьютер однажды проникнет глубоко в мантию планеты и будет обладать невероятной вычислительной мощностью. Все районы на планете, кроме жилых, будут заменены уникальными, ориентированными на исследования."
  planetary_computer_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_megastructure$ - $giga_list_category_science_production$ - $giga_list_category_habitable_mega$\nПреобразует любой §YКаменистый мир§! в §YПланетарный компьютер§! эффективный для проведения £physics_research£ £society_research£ £engineering_research£ §YИсследований§! и увеличения §YАдминистративного лимита§!\n§LКомпьютер, охватывающий всю планету, с огромной вычислительной мощностью§!.§!" #megalistentry PLANETARY COMPUTER
  
  planetary_computer_1:0 "Внутренний каркас $name_planetary_computer$"
  planetary_computer_1_DESC:0 "Первые шаги к полному $name_planetary_computer$. Предварительные внутренние конструкции и специализированная инфраструктура."
  
  planetary_computer_2:99 "$name_planetary_computer$"
  planetary_computer_2_DESC:0 "Полноценный $name_planetary_computer$, обеспечивающий огромные исследовательские возможности для работ на его поверхности."
  
