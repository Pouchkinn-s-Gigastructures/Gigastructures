l_simp_chinese:
  
  dyson_sphere_0:0 "$gc_mega$戴森球基址"
  dyson_sphere_0_MEGASTRUCTURE_DETAILS:1 "£gigastructural£$giga_list_category_megastructure$——$giga_list_category_basic_resource_production$\n收获§Y恒星§!的全部能量，产出£energy£§Y能量币§!——$giga_list_scales_with_star_size$\n$giga_list_freezes_system$\n§L一个$dyson_sphere_5$完全的包裹住一个特定的恒星，直接将恒星辐射输出转化为能量。§!" #gigalistentry DYSON SPHERE
  
  ring_world_1:0 "$gc_mega$环形世界基址"
  ring_world_1_MEGASTRUCTURE_DETAILS:1 "$giga_list_category_megastructure$——$giga_list_category_habitable_mega$\n创造§Y4个§!类似§Y盖亚星球§!的庞大§Y区段§!，可以被改造为§Y理想城§!、§Y机械§!或§Y蜂巢§!型——$giga_list_removes_system_planets$\n§L一个$pc_ringworld_habitable$容纳了数个行星大小的区块。" #gigalistentry RINGWORLD
  
  add_research_options_galactic_wonders_utopia:0 "获得研究选项：\n£engineering_research£ §Y$tech_ring_world$§!\n£physics_research£ §Y$tech_dyson_sphere$§!\n\n需要此项的研究选项：\n£physics_research£ §Y$giga_tech_fusion_suppressor$§!\n£physics_research£ §Y$giga_tech_penrose_sphere_2$§!\n£physics_research£ §Y$giga_tech_ringworld_titanic_1$§!\n£society_research£ §Y$giga_tech_planetary_computer$§!\n£engineering_research£ §Y$giga_tech_neutronium_gigaforge$§!\n£engineering_research£ §Y$giga_tech_star_lifter$§!\n£engineering_research£ §Y$giga_tech_penrose_sphere_3$§!\n£engineering_research£ §Y$giga_tech_ringworld_upgrade$§!\n£engineering_research£ §Y$giga_tech_ringworld_titanic_2$§!\n£engineering_research£ §Y$giga_tech_interstellar_ringworld$§!\n£engineering_research£ §Y$giga_tech_war_moon_2$§!\n£engineering_research£ §Y$tech_sm_megastructure$§!\n\n需要此项的飞升：\n§Y$ap_gigastructural_constructs$§!"
  add_research_options_galactic_wonders_utopia_megacorp:0 "获得研究选项：\n£engineering_research£ §Y$tech_ring_world$§!\n£physics_research£ §Y$tech_matter_decompressor$§!\n£physics_research£ §Y$tech_dyson_sphere$§!\n\n需要此项的研究选项：\n£physics_research£ §Y$giga_tech_fusion_suppressor$§!\n£physics_research£ §Y$giga_tech_penrose_sphere_2$§!\n£physics_research£ §Y$giga_tech_ringworld_titanic_1$§!\n£society_research£ §Y$giga_tech_planetary_computer$§!\n£engineering_research£ §Y$giga_tech_star_lifter$§!\n£engineering_research£ §Y$giga_tech_neutronium_gigaforge$§!\n£engineering_research£ §Y$giga_tech_penrose_sphere_3$§!\n£engineering_research£ §Y$giga_tech_ringworld_upgrade$§!\n£engineering_research£ §Y$giga_tech_ringworld_titanic_2$§!\n£engineering_research£ §Y$giga_tech_interstellar_ringworld$§!\n£engineering_research£ §Y$giga_tech_war_moon_2$§!\n£engineering_research£ §Y$tech_sm_megastructure$§!\n\n需要此项的飞升：\n§Y$ap_gigastructural_constructs$§!"
  
  giga_galactic_wonders_tooltip_ring_world_construction:99 "\n£engineering_research£§Y$giga_tech_ring_world_swap$§!" # See [GigaGalwonTooltipGetRingworld] for usage
  giga_galactic_wonders_tooltip_ring_world_no_habitables:99 "\n£engineering_research£§Y$giga_tech_ring_world_swap_no_habitables$§!" # See [GigaGalwonTooltipGetRingworld] for usage
  giga_galactic_wonders_tooltip_ring_world_no_habitables_bio:99 "\n£society_research£§Y$giga_tech_ring_world_swap_no_habitables_bio$§!" # See [GigaGalwonTooltipGetRingworld] for usage
  
  ap_master_builders_desc:0 "建造巨构建筑需要难以想象的资源和统筹。我们正在迈向宏观工程学的全新领域。\n\n需要此项的研究选项：\n£engineering_research£ §Y$giga_tech_ringworld_gargantuan_1$§!\n\n需要此项的飞升：\n§Y$ap_vast_expanses$§!"
  
  transcendence_tooltip:0 "需要此项的研究选项：\n£society_research£ §Y$giga_tech_psychic_hypersiphon_1$§!\n\n我们物种的全部成员将解放其全部的灵能潜力。"
  
  ap_voidborn_desc:1 "曾经寒冷而不可逾越的虚空，现在已经成为了我们的第二个家园。我们已经适应了永久居住在虚空之中，这将降低建造基础设施的资源需求，并使我们的居住站提供更多空间以用于其他功能。\n\n需要此项的研究选项：\n£society_research£ §Y$giga_tech_stellar_ring_habitat$§!\n£engineering_research£ §Y$giga_tech_interstellar_habitat$§!"
  
  enable_colossus_project:0 "发布特殊项目：巨像计划\n\n需要此项的飞升：\n§Y$ap_vast_expanses$§!\n\n"
  
  # Overwrite Unyielding Traditions text to show Maginot World
  tr_unyielding_federations_finish_desc:1 "\n§E解锁独特巨构：§! §R$name_maginot$§!\n研究需求：\n£society_research£§Y$giga_tech_maginot_world$§!\n\n$MOD_STARBASE_DEFENSE_PLATFORM_CAPACITY_MULT$ §G+50%§!\n$mod_starbases_upkeep_mult$ §G-20%§!\n有权组建§Y$military_federation$§!联邦。\n解锁飞升天赋：§G+1§!"
  
  #NEW MEGAS FOR THE LIST
  gateway_0:0 "$gc_kilo$星门"
  gateway_0_MEGASTRUCTURE_DETAILS:1 "$giga_list_category_kilostructure$：$giga_list_category_transportation$\n可以§Y瞬间移动§!到其它所有§Y星门§!\n§L星门是一个帝国的星际交通运输网络的重要组成部分。如果建造在合适的位置，星门可以大量缩短舰队的移动时间。§!" #gigalistentry GATEWAY
  
  gateway_final:0 "$gc_kilo$星门"
  gateway_final_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$ - $giga_list_category_transportation$\n启用前往所有其他§Y星门§!的§Y瞬间移动§!\n§L星门是任何星际帝国银河交通网络的重要组成部分。如果位置得当，星门可以大幅缩短航行时间。§!" #gigalistentry GATEWAY
  
  habitat_central_complex:0 "$gc_kilo$居住站中央复合体"
  habitat_central_complex_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$ - $giga_list_category_habitable_mega$\n创造一座人工§Y居住站§!，可以通过建造额外§Y轨道站§!来扩展\n§L$habitat_complex$是一组为永久居住而设计的自持空间站。额外的卫星站点可以让整个恒星系得到开发。§!" #gigalistentry HABITAT
  
  giga_ring_upgrade_tt_TEXT:0 "§Y升级§! - 允许将一个§Y环形世界科技区段§!升级为§G宜居区段§!"
  
  major_orbital:0 "$gc_kilo$居住站大型轨道站"
  major_orbital_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$ - $giga_list_category_habitable_upgrade$\n为§Y$habitat_complex$§!提供£district£§Y$MOD_PLANET_MAX_DISTRICTS_ADD$§!、§Y资源区划§!和£building£§Y$MOD_PLANET_MAX_BUILDINGS_ADD$§!\n§L大型基础轨道站，旨在为当地居住站复合体的人口提供额外居住和工作空间。§!"
  
  minor_orbital:0 "$gc_kilo$居住站小型轨道站"
  minor_orbital_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$ - $giga_list_category_habitable_upgrade$\n为§Y$habitat_complex$§!提供§Y资源区划§!和£building£§Y$MOD_PLANET_MAX_BUILDINGS_ADD$§!\n§L小型基础轨道站，旨在为当地居住站复合体的人口提供额外居住和工作空间。§!"
  
  interstellar_assembly_0:0 "$gc_mega$星际集会基址"
  interstellar_assembly_0_MEGASTRUCTURE_DETAILS:0 "£galwonders£$giga_list_category_megastructure$：$giga_list_category_miscellaneous$\n增加§Y外交权重§!和§Y特使数量§!\n§L星际集会是星际各国的会议场地，可提高我国对外来移民的吸引力以及他国对我国的评价。§!" #gigalistentry INTERSTELLAR ASSEMBLY
  
  mega_art_installation_0:0 "$gc_mega$巨型艺术设施基址"
  mega_art_installation_0_MEGASTRUCTURE_DETAILS:0 "£galwonders£$giga_list_category_megastructure$：$giga_list_category_miscellaneous$\n产出£unity£§Y凝聚力§!和§Y舒适度§!\n§L星际规模的艺术信标。此设施可以鼓舞人民的士气。§!" #megalistentry MEGAART
  
  mega_shipyard_0:0 "$gc_mega$巨型船坞"
  mega_shipyard_0_MEGASTRUCTURE_DETAILS:0 "£galwonders£$giga_list_category_megastructure$：$giga_list_category_ship_production$§H（20个船坞）§!\n组装§Y舰船§!并且增加§Y舰船建造速度§!\n§L一个巨型恒星基地，专事舰船建造，这个$mega_shipyard_3$拥有20处用于建造及升级舰船的锚地。§!" #megalistentry MEGASHIPYARD
  
  matter_decompressor_0:0 "$gc_mega$物质解压器"
  matter_decompressor_0_MEGASTRUCTURE_DETAILS:3 "£gigastructural£$giga_list_category_megastructure$：$giga_list_category_basic_resource_production$\n从§Y黑洞§!中获取£minerals£§Y矿物§!\n§L这个$matter_decompressor_4$将黑洞的引力聚焦于一处，形成了一个引力钻头，我们可以用这个钻头从黑洞的奇点中钻取物质，并转化为矿物。§!" #megalistentry MATTER DECOMPRESSOR
  
  think_tank_0:0 "$gc_mega$科学枢纽基址"
  think_tank_0_MEGASTRUCTURE_DETAILS:1 "£galwonders£$giga_list_category_megastructure$：$giga_list_category_science_production$\n产出£physics_research£、£society_research£、£engineering_research£§Y科研点数§!并增加§Y15%§!的§Y科研速度§!\n§L$think_tank_3$的研究实验室和数据库能够产出源源不断的原生数据流。§!" #megalistentry SCIENCE NEXUS
  
  spy_orb_0:0 "$gc_mega$哨兵阵列基址"
  spy_orb_0_MEGASTRUCTURE_DETAILS:3 "£galwonders£$giga_list_category_megastructure$：$giga_list_category_miscellaneous$\n将§Y探测范围§!延伸至§Y整个星系§!\n§L随着工程的不断推进，$spy_orb_4$会逐步的扩展传感器范围，最终将囊括整个星系。§!"
  #megalistentry SENTRY ARRAY
  
  strategic_coordination_center_0:0 "$gc_mega$合成协调中心"
  strategic_coordination_center_0_MEGASTRUCTURE_DETAILS:0 "£galwonders£$giga_list_category_megastructure$：$giga_list_category_military$\n增加§Y海军容量§!、§Y船速§!、§Y恒星基地容量§!和§Y防御平台数量§!\n§L可以将全国上下恒星基地网络进行同步化处理的设施，提升基地的防御及攻击能力。§!" #megalistentry STRATEGIC COORDINATION CENTER
  
  orbital_ring:0 "$gc_kilo$星环基地"
  orbital_ring_tier_1_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$ - $giga_list_category_miscellaneous$\n为所处§Y行星§!提供额外§Y特化§!和§Y防御§!功能\n§L§Y$orbital_ring_tier_1$§!是一种环绕行星的环带状恒星基地§!" #megalistentry ORBITAL RING
  
  orbital_ring_tier_1_CONSTRUCTION_INFO_DELAYED:1 "$giga_list_additional_data$ - 星环基地可以为行星提供防卫增益，上面可以修建许多恒星基地模块和建筑，同时还有居住模块或在轨生产设施。"
  
  quantum_catapult_0:0 "$gc_mega$量子弹弓"
  quantum_catapult_0_MEGASTRUCTURE_DETAILS:1 "£galwonders£$giga_list_category_megastructure$ - $giga_list_category_transportation$\n能够将§Y舰队§!抛出遥远距离的装置，其距离能横跨河系，但§Y精度有限§!\n§L一个用来汇聚中子星或脉冲星引力以扭曲空间，将舰队传送至遥远距离之外的装置。§!" #megalistentry QUANTUM CATAPULT
  
  quantum_catapult_0_CONSTRUCTION_INFO_DELAYED:1 "$giga_list_additional_data$ - 量子弹弓的每一次运行都会让舰队到达预定目的地§H之外§!的恒星系。这个“§Y散射半径§!”能够通过后续升级减少。"
  
  hyper_relay:0 "$gc_kilo$超空间中继器"
  hyper_relay_MEGASTRUCTURE_DETAILS:1 "$giga_list_category_kilostructure$ - $giga_list_category_transportation$\n若在§Y多个星系§!中建成并形成§Y链条§!的话，能够极大缩减§Y舰船的转移时间§!\n§L尽管单独不起作用，形成链式结构的超空间中继器可以显著减少相邻恒星系间的转移时间。§!" #megalistentry HYPER RELAY
  
  
  orbital_arc_furnace_1:0 "$gc_kilo$$orbital_arc_furnace_4$：赤道带"
  orbital_arc_furnace_1_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$ - $giga_list_category_advanced_resource_production$\n§Y$orbital_arc_furnace_4$§!利用熔融行星的原始能量，开采原本无法取得的矿物，并改进全星系采矿作业。\n§L一种能将大型星系转化为高产工业中心的装置。§!"
  
  dyson_swarm_1:0 "$gc_kilo$$dyson_swarm_3$：阵列"
  dyson_swarm_1_MEGASTRUCTURE_DETAILS:0 "£gigastructural£ £megaupgrade£ $giga_list_category_kilostructure$ - $giga_list_category_basic_resource_production$\n§Y$dyson_swarm_3$§!是一组相互连接的卫星阵列，旨在提升恒星矿藏的产出。\n§L§Y$dyson_swarm_3$§!是通向§Y$dyson_sphere_5$§!庞大力量的踏脚石。§!"
  
  dyson_swarm_1_DESC:0 "§Y$dyson_swarm_3$§!是一组相互连接的卫星阵列，旨在提升恒星矿藏的产出。"
  
  dyson_swarm_2_DESC:0 "§Y$dyson_swarm_3$§!是一组相互连接的卫星阵列，旨在提升恒星矿藏的产出。"
  
  dyson_swarm_3_DESC:0 "§Y$dyson_swarm_3$§!是一组相互连接的卫星阵列，旨在提升恒星矿藏的产出。"
  
  cosmogenesis_world_0:99 "$gc_crisis$$pc_cosmogenesis_world$"
  cosmogenesis_world_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_crisis$ - $giga_list_category_science_production$\n一座巨型池式计算机，会实际消耗人口以生成§Y研究§!和§Y高级逻辑§!。效率与燃尽速度都会随人口增加而上升。\n§L若想从现实的内脏中汲取意义，我们需要一种全新的科学……§!"
  
  cosmogenesis_needle:99 "$gc_crisis$$NAME_Cosmogenesis_Sphere$"
  cosmogenesis_needle_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_crisis$ - $giga_list_category_special$\n若要飞升至我们亲手创造的现实，我们必须让整个文明登上视界之针，随后永远离开这个宇宙。\n§L对宇宙法则的公然违背。§!"
  
  crisis_sphere_0:0 "$gc_crisis$以太相引擎框架"
  crisis_sphere_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_crisis$ - $giga_list_category_special$\n$crisis_sphere_0_DESC$\n§L我们的心智将不再受孱弱肉体的物理限制，现实本身也将任由我们摆布。确实，再没有比这更高的存在位阶了。§!"
  
  galactic_crucible_0:0 "$gc_crisis$星系熔炉框架"
  galactic_crucible_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_crisis$ - $giga_list_category_special$\n这座庞大的空间站会从其宿主恒星抽取能量，为自动船坞供能，以生产能够重塑恒星命运的§Y$entropy_conduit_plural$§!。\n§L$galactic_crucible_0_DESC$§!"
  
  grand_archive_0:99 "$gc_kilo$$grand_archive$"
  grand_archive_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$ - $giga_list_category_miscellaneous$\n保存并展出我们在银河中收集到的最珍贵文物。\n§L一座专用轨道结构，用于容纳并展示我们在银河中收集到的珍贵标本，其中包括活体太空兽群。§!"
  
  deep_space_citadel_0:99 "$gc_kilo$$tech_deep_space_citadel$"
  deep_space_citadel_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$ - $giga_list_category_defensive$\n§Y$deep_space_citadel_0$§!是一座装甲恒星基地，专为在恒星引力井内提供最大防御而设计。\n§L$deep_space_citadel_0_DESC$§!"
  
  shroud_seal:99 "$gc_kilo$$SHROUD_SEAL$"
  shroud_seal_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$ - $giga_list_category_psionics$\n§Y$SHROUD_SEAL$§!会削弱附近的§Y$PSIONIC_AURA_PLURAL$§!。本星系内的§Y$PSIONIC_AURA$§!强度衰减$@shroud_seal_decrease|0$，相邻星系衰减1。\n§L$shroud_seal_DESC$§!"
  
  behemoth_egg:0 "$gc_crisis$巨兽之卵"
  behemoth_egg_DESC:0 "一艘巨大的有机容器，孕育着一头§Y巨兽§!。"
  behemoth_egg_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_crisis$ - $giga_list_category_special$\n该结构支撑§Y巨兽之卵§!的发育。\n§L$behemoth_egg_DESC$§!"
  
  waystation_megastructure:99 "$gc_kilo$$waystation$"
  waystation_megastructure_MEGASTRUCTURE_DETAILS:99 "$giga_list_category_kilostructure$ - $giga_list_category_special$\n§L$waystation_desc$§!"
  
  civilian_arkship_megastructure:0 "$gc_kilo$方舟舰（$civilian_arkship_class$）"
  civilian_arkship_megastructure_MEGASTRUCTURE_DETAILS:99 "$giga_list_category_kilostructure$ - $giga_list_category_special$\n§L$tech_civilian_arkship_desc$§!"
  
  science_arkship_megastructure:0 "$gc_kilo$方舟舰（$science_arkship_class$）"
  science_arkship_megastructure_MEGASTRUCTURE_DETAILS:99 "$giga_list_category_kilostructure$ - $giga_list_category_special$\n§L$tech_science_arkship_desc$§!"
  
  military_arkship_megastructure:0 "$gc_kilo$方舟舰（$military_arkship_class$）"
  military_arkship_megastructure_MEGASTRUCTURE_DETAILS:99 "$giga_list_category_kilostructure$ - $giga_list_category_special$\n§L$tech_military_arkship_desc$§!"
  
  dyson_gun_0:0 "$gc_mega$星际大炮建造基址"
  dyson_gun_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$ - $giga_list_category_weaponry$\n建造一门§Y大炮§!，可以从远距离对§Y敌方结构、舰船和星球§!造成伤害。\n§L允许我们将储备能量射向目标星系，可能造成毁灭性的效果。§!"
  
  # Concept Override
  # added alderson trait
  concept_automodding_hab_preference_desc:0 "常规：\n- ['trait:trait_auto_dry_preference']\n- ['trait:trait_auto_wet_preference']\n- ['trait:trait_auto_cold_preference']\n\n特殊：\n- ['trait:trait_auto_pc_nuked_preference']\n- ['trait:trait_auto_pc_gaia_preference']\n- ['trait:trait_auto_pc_hive_preference']\n\n人工：\n- ['trait:trait_auto_pc_city_preference']\n- ['trait:trait_auto_pc_relic_preference']\n- ['trait:trait_auto_pc_habitat_preference']\n- ['trait:trait_auto_pc_ringworld_habitable_preference']\n- ['trait:trait_auto_pc_cosmogenesis_world_preference']\n- ['trait:trait_auto_pc_alderson_slice_preference']"
  
  # Photoadaptive trait overwrites
  concept_trait_photoadaptive_stars_desc:0 "一些物种会从恒星['concept_star_luminosity']获得$worker_and_simple_drone_cat_bonus_workforce_mult$。 \n\n- $pc_pulsar_plural$、$pc_neutron_star_plural$或$pc_giga_o_star_plural$：§G+15%§! \n- $pc_b_star_short$、$pc_a_star_short$或$pc_f_star_short$恒星：§G+10%§! \n- $pc_g_star_short$或$pc_k_star_short$恒星：§G+5%§! \n- $pc_m_star_short$或$pc_gigaignited_star_plural$：§R-5%§! \n- $pc_t_star_short_plural$、$pc_protostar_plural$或$pc_black_hole_plural$：§R-15%§!"
