 # giga_incandescent_efficiency_tooltip: ""

 giga_situation_scorched:0 "Immolated Origins"
 giga_situation_scorched_type:0 "$giga_situation_scorched$"
 giga_situation_scorched_monthly_change_tooltip:0 "The progress of this situation is dependent on the §YApproach§! we pick and our responses to related §YEvents§! that occur."
 giga_situation_scorched_desc:0 "The discovery that our homeworld is the wreck of an ancient planet-cum-warship has thrown our identity into crisis. We must seek firm ground on which to rebase our civilisation."
 giga_situation_scorched_stage_renewal:0 "Renewal"
 giga_situation_scorched_stage_synthesis:0 "Synthesis"
 giga_situation_scorched_stage_continuity:0 "Continuity"

 #relentless_industrialists_situation_completion_tooltip:0 "§Y[Target.GetName]§! will become a §YTomb World§!.\nFurther effects may happen, depending on the §YApproach§! picked." #TODO
 # giga_situation_scorched_outcome: "The situation will end once we have answered four §YQuestions§! events that will pop up roughly every §Y2 years§!.\n\nThe outcome will depend on which §YStage§! we are in upon the situation's conclusion.\n\n§YQuestions Answered:§! [giga_scorched_questions_answered]/4" #couldn't get this simpler version to work
 giga_situation_scorched_outcome: "The outcome will depend on which §YStage§! we are in upon the situation's conclusion.\n\nThe situation will end once we have answered four §YQuestions§! that will arise every few years. §YQuestions Answered:§! [owner.GigaOriginScorchedQuestionsAnswered]"
 giga_situation_scorched_questions_answered_zero: "0/4"
 giga_situation_scorched_questions_answered_one: "1/4"
 giga_situation_scorched_questions_answered_two: "2/4"
 giga_situation_scorched_questions_answered_three: "3/4"
 giga_situation_scorched_questions_answered_four: "4/4"

 giga_situation_scorched_approach_renewal:0 "Revival"
 giga_situation_scorched_approach_renewal_desc:0 "Our history was stolen from us - but we will take it back, and will not let any opposition stand in our way."
 giga_situation_scorched_approach_renewal_tooltip:0 "We will work to reclaim as much of our historical culture and environment as possible."
 giga_situation_scorched_approach_synthesis:0 "Debate"
 giga_situation_scorched_approach_synthesis_desc:0 "We are swamped by differences, and if we do not learn to respect them all simultaneously, they will tear us apart."
 giga_situation_scorched_approach_synthesis_tooltip:0 "By facilitating productive debate we can face and resolve this cultural unrest."
 giga_situation_scorched_approach_continuity:0 "Autochthony"
 giga_situation_scorched_approach_continuity_desc:0 "This is our home, and it always has been. We reject any who seek to make our planet a stranger to us."
 giga_situation_scorched_approach_continuity_tooltip:0 "We will further embrace the current state of the world we are indigenous to."
 giga_situation_scorched_progress:0 "Cultural Momentum"

 giga_scorched.002.name: "From the Dustbin of History"
 giga_scorched.002.desc: "A wave of archaeological studies across [root.GetHomeWorldName] are racing to present their conclusions to the wider public; the revelation is stunning, but the overwhelming evidence cannot be faulted. Our planet is not a natural world, but the husk of an entire planet turned into a starfaring vessel by ancestors far more powerful than our folk histories ever fantasised. And it was destroyed by... something even stronger.\n\nFirst came initial strikes that crippled the planetary warship, followed by a rain of bombardment from the skies that melted away the past - nearly including our entire species. Biologists have also chimed in, claiming that our genetic code is ill-suited to the current environment. All the lands we have ever known and loved apparently make up a barely-hospitable wreck of a world. Horrifyingly, we cannot even conclusively determine that our species is originally from this \"homeworld\" we hold so dear.\n\nThese discoveries have thrown our society into turmoil as we grapple with the consequences of having so much history upended. Bitter resentments and divisions are erupting over the correction of oral histories; over the legitimacy of festivals and traditions; and over whether or not these precursor [root.GetSpeciesNamePlural] are also "us." We have no choice but to respond to such fundamental questions, lest our civilisation be torn apart."
 giga_scorched.002.a.renewal: "We must recover our lost culture!"
 giga_scorched.002.a.renewal.tooltip: "Sets situation approach to §Y$giga_situation_scorched_approach_renewal$§!. Our situation approach can be changed at any time."
 giga_scorched.002.a.synthesis: "A challenging question."
 giga_scorched.002.a.synthesis.tooltip: "Sets situation approach to §Y$giga_situation_scorched_approach_synthesis$§!. Our situation approach can be changed at any time."
 giga_scorched.002.a.continuity: "We mustn't rewrite our culture!"
 giga_scorched.002.a.continuity.tooltip: "Sets situation approach to §Y$giga_situation_scorched_approach_continuity$§!. Our situation approach can be changed at any time."

 giga_scorched.004.name: "Immolated Origins: Evocation"
 giga_scorched.004.desc: "A regional festival is coming up, marking the traditionally-given date for the crafting of the [root.GetSpeciesAdj] species from fire. However, in the current social climate, this simple festival has somehow become the centre of a fierce planetwide argument over whether it's appropriate to celebrate the day [root.GetHomeWorldName] suffered such terrible calamity.\n\nTo some, the celebration is glorifying a grievous loss - but to others, the festival's specific origins are less important than the celebration of community it has become. More still simply lament that a day of coming-together has now become a source of division. As preparations falter and emotions rise, we have to ask ourselves: what happened on that fateful day?"
 giga_scorched.004.a.renewal: "We remember a terrible tragedy."
 giga_scorched.004.a.continuity: "We remember a beautiful beginning."

 giga_scorched.005.name: "Immolated Origins: Heritage"
 giga_scorched.005.desc: "What is our heritage? It has never been a simple question, but in recent times, it has also never been so complicated. The answer used to be that we inherit the blazing skies, earthen caves and rocky plains from preceding generations. But some now suggest that these things are not what our ancestors gave us, but merely the rubble left over from the destruction of our people. These individuals say that our true heritage is something to be rediscovered. As with everything these days, this is a fiercely contested perspective. We are forced to answer: is our heritage something to be reclaimed, or protected?"
 giga_scorched.005.a.renewal: "Recover what was taken."
 giga_scorched_archaeologists: "Impassioned Archaeologists"
 giga_scorched_archaeologists_desc: "This civilisation is driven to uncover their lost prehistory."
 giga_scorched.005.a.continuity: "Preserve what we know."
 giga_scorched_conservation: "Historical Conservation"
 giga_scorched_conservation_desc: "This civilisation is determined to preserve the achievements of recent historical ages - artifacts, architecture, literature and all."
 #giga_scorched.005.a.continuity.tooltip: "The §Y$trait_giga_incandescent$§! trait will be upgraded with §Y+5% £unity£ Unity from jobs§!, doubled on §YIrradiated Desert Worlds§!."

 giga_scorched.006.name: "Immolated Origins: Pride"
 giga_scorched.006.desc: "Our peoples have long united around our pride in shared achievements, but that unity is hard to find when people don't share the same stories. New movements have begun which see the the greatest moments of [root.GetSpeciesAdj] heroism as during the desperate days when [root.GetHomeWorldName] was relentlessly bombarded from orbit. This has caused others to dig in even more firmly, protecting the prevailing stories of hardy pioneers who tamed the wilderness in service to future generations.\n\nWe can't go on like this, with different memories tearing history in two directions. It's time to decide who our heroic ancestors were."
 giga_scorched.006.a.renewal: "Starfarers, fighting to protect what they could."
 giga_scorched_tenacity: "Tenacious Heroes"
 giga_scorched_tenacity_desc: "Those who refuse to die, no matter how dire the odds, are held up as role models."
 giga_scorched.006.a.continuity: "Pioneers, toiling to build a better home."
 giga_scorched_pioneers: "Ascetic Heritage"
 giga_scorched_pioneers_desc: "Our ancestors thrived on so little, and we are proud to do the same."
 #giga_scorched.006.a.continuity.tooltip: "The §Y$trait_giga_incandescent$§! trait will be upgraded with §Y-5% $MOD_POP_AMENITIES_USAGE_BASE$§!, doubled on §YIrradiated Desert Worlds§!."

 giga_scorched.007.name: "Immolated Origins: Homeland"
 giga_scorched.007.desc: "What is our homeworld? Can it be [root.GetHomeWorldName], when we cannot prove our origins on this planet? Even if we are, is it really the same world we evolved on anymore? Alternatively, perhaps the origin of the [root.GetSpeciesNamePlural] species is irrelevant, and it is madness to suggest our civilisation could possibly not be native to [root.GetHomeWorldName] when our way of life is so intrinsically connected to it.\n\nIt is too important a question to avoid asking, and too simple an answer to avoid giving: is [root.GetHomeWorldName] our homeworld?"
 giga_scorched.007.a.renewal: "We may never know our birthplace."
 giga_scorched_everseeking: "Ever-seeking"
 giga_scorched_everseeking_desc: "We may never conclusively discover our real homeworld, but we will also never stop searching."
 giga_scorched.007.a.continuity: "We are from [root.GetHomeWorldName]."
 giga_scorched.007.a.continuity.tooltip: "The §Y$trait_giga_incandescent$§! trait will be upgraded with §Y+5% $MOD_POP_BONUS_WORKFORCE_MULT$, doubled on §YIrradiated Desert Worlds§!."

 giga_scorched.008.name: "Immolated Origins: A New Chapter"
 giga_scorched.008.desc: "What did we lose that day? What is our heritage? What are our proudest moments? What is our homeworld? We have asked, and answered, every question. We have battled with every idea, and looked within ourselves more closely than we may have found comfortable.\n\nNow, communities once rifted by such existential disagreements are tentatively coming back together, embracing around a new story of the [root.GetSpeciesAdj] civilisation. There is one final question, but by now, we already know the answer. Who are we?"
 giga_scorched.008.a.renewal: "We are an ancient race of the stars."
 giga_scorched_interstellar_tradition: "Interstellar Tradition"
 giga_scorched_interstellar_tradition_desc: "This nation proudly inherits a long history of life across the stars."
 irradiated_desert_planet_rehabilitated: "Rehabilitated Wasteland"
 irradiated_desert_planet_rehabilitated_desc: "This planet was subjected to untold amounts of nuclear weaponry in the distant past. Its surface still suffers from high background radiation, dust storms, and extreme heatwaves, but is in the process of recovery. The upsides of the the sheer quantity of explosives unleashed on this world are beginning to shine through, since the crust was violently loaded with heavy elements, and minerals were melted into almost alloy-like materials."
 giga_scorched.008.a.synthesis: "Sometimes, answers are complex."
 giga_scorched_alloyed_identity: "Alloyed Identity"
 giga_scorched_alloyed_identity_desc: "Our unity is tempered in the forges of debate, where every obstacle must be faced to be overcome."
 giga_scorched.008.a.continuity: "We are a young race of the wastelands."
 giga_scorched.008.a.continuity.tooltip: "§Y$trait_pc_katzenland_preference$§! is now available for species habitability modification if we have the §Y$tech_glandular_acclimation$§! technology."