 giga_qso.008.name:0 "$name_quasistellar$: Parameters"
 # giga_qso.008.desc:0 "Here, you can manage the power output/consumption of the QS-O itself.\n\nAltering the charging rate will modify the hyperweapon's £giga_sr_quasaric_energy£ §Y$giga_sr_quasaric_energy$§! output.\nA lower charging rate will generate less £giga_sr_quasaric_energy£ §Y$giga_sr_quasaric_energy$§!. However, the QS-0 will  £energy£ §Y$energy$§! in return, converted from £giga_sr_quasaric_energy£. A higher charging rate will generate more, but will cost some £energy£ in return, as it is necessary to overcharge the structure.\n\nYou can also choose to dump some resources (£minerals£ £food£ £consumer_goods£ £alloys£ £pops£) into the quasar. The resources will collide with the bright accretion disk, and generate a cascade of highly-energetic particles that can then be used to provide some more £giga_sr_quasaric_energy£ to the hyperweapon."
 giga_qso.008.desc:0 "Here, you can manage the power output/consumption of the QS-O itself.\n\nIncreasing the §YCharging Rate§! of the QS-O will increase its £giga_sr_quasaric_energy£ §Y$giga_sr_quasaric_energy$§! output at the expense of a higher £energy£ §Y$energy$§! upkeep.\n\nDecreasing the charging rate will decrease its £giga_sr_quasaric_energy£ §Y$giga_sr_quasaric_energy$§! output, in return, the QS-Os £energy£ §Y$energy$§! upkeep will be reduced, nullified or even turned into £energy£ §Y$energy$§! production.\n\nYou can also dump various resources, such as £minerals£§Y$minerals$§!, £food£§Y$food$§!, £consumer_goods£ §Y$consumer_goods$§! and £alloys£ §Y$alloys$§! into the black hole below to quickly gain small amounts of £giga_sr_quasaric_energy£ §Y$giga_sr_quasaric_energy$§!."

 giga_qso.009.name:0 "$name_quasistellar$: Resource Dumping"
 giga_qso.009.desc:0 "You can dump various resources into the supermassive quasar to fuel the bright accretion disk, and generate energy to be converted into £giga_sr_quasaric_energy£\n\nPlease choose what you wish to dump into the quasar."

 giga_qso.008.dump:0 "Dump Resources..."

 giga_qso.008.minerals:0 "Dump 100k £minerals£ --> 25 £giga_sr_quasaric_energy£"
 giga_qso.008.alloys:0 "Dump 50k £alloys£ --> 30 £giga_sr_quasaric_energy£"
 giga_qso.008.food:0 "Dump 50k £food£ --> 30 £giga_sr_quasaric_energy£"
 giga_qso.008.goods:0 "Dump 100k £consumer_goods£ --> 30 £giga_sr_quasaric_energy£"
