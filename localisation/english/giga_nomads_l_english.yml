 ##########################
 ### Nomad War Moon ###
 ##########################
 giga_nomad_war_moon:0 "Artillery Mega-Platform"
 giga_nomad_war_moon_plural:0 "Artillery Mega-Platforms"

 ##########################
 ### Nomad War Planet ###
 ##########################

 giga_nomad_war_planet:0 "Superheavy Siegecraft"
 giga_nomad_war_planet_plural:0 "Superheavy Siegecraft"
 giga_nomad_war_planet_cap:0 "$giga_nomad_war_planet$"
 allow_nomad_war_planet:0 "§HUnlocks Megastructure:§! $giga_nomad_war_planet$"
 desc_nomad_war_planet:0 "A supermassive warship optimized for combat against celestials. Made of planetary amounts of alloys, and equipped with a weapon that can obliterate §Ranything.§!"

 giga_nomad_war_planet_section_alpha: "Celestial Decimator"
 giga_nomad_war_planet_section_beta: "Reinforced Primary Weapons"
 giga_nomad_war_planet_section_charlie: "Reinforced Primary Weapons"
 giga_nomad_war_planet_section_delta: "Macro-Fabricator Hangars"
 giga_nomad_war_planet_section_echo: "Secondary Batteries"

 giga_tech_nomad_war_planet:0 "Super-Planetary Counter Doctrine"
 giga_tech_nomad_war_planet_desc:0 "The Super-Heavy Dreadnought was thought to be enough to counter the weaponized celestials. The arms race will always continue, and we must think bigger and better. Combining several incredibly advanced technologies, will allow us to create a warship of immense size. Such an incredibly massive spaceship would be near-indestructible, and could wipe out entire Fallen Empires by itself."

 GIGA_SUPER_OMEGA_LANCE_1_NOMAD:0 "$GIGA_SUPER_OMEGA_LANCE_1$"
 GIGA_SUPER_OMEGA_LANCE_1_NOMAD_DESC:0 "A massive energy lance directly fed with city wide conduits from the main reactor, made to penetrate any target."
 GIGA_PLANETARY_RAILGUN_NOMAD:0 "$GIGA_PLANETARY_RAILGUN$"
 GIGA_PLANETARY_RAILGUN_NOMAD_DESC:0 "$GIGA_PLANETARY_RAILGUN_DESC$"
 GIGA_PLANET_MISSILE_1_NOMAD:0 "Macro Missile Batteries"
 GIGA_PLANET_MISSILE_1_NOMAD_DESC:0 "Massive rows of missile batteries, hidden within large armored silos, capable of massive destruction."
 GIGA_NOMAD_WAR_PLANET_COMPUTER:0 "$giga_nomad_war_planet$ Combat Computer"
 GIGA_NOMAD_WAR_PLANET_COMPUTER_DESC:0 "The $giga_nomad_war_planet$ will stay at very long range (§Y300§!) range and fire its array of weapons at available targets."

 nomad_war_planet_0:0 "$giga_nomad_war_planet$ Construction Site"
 nomad_war_planet_0_DESC:0 "The construction site for a future $giga_nomad_war_planet$, a massive warship made to fight celestials on their own terms."
 nomad_war_planet_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_gigastructure$ - $giga_list_category_nomad_warship$ - $giga_list_category_ship_production$\nA massive warship made to fight celestials on their own terms.\n§LThe $giga_nomad_war_planet_cap$ is the fully realized prototype of the $giga_nomad_war_moon$, fixing it's defensive weaknesses while also improving its already incredible lethality."
 nomad_war_planet_1:0 "$giga_nomad_war_planet$ Hull"
 nomad_war_planet_1_DESC:0  "The $giga_nomad_war_planet$'s internal systems have been installed the vast hull. A gigantically gigantic reactor is installed within the armored citadel, capable of powering the most powerful weapons."
 nomad_war_planet_2:0 "$giga_nomad_war_planet$ Defensive Arrays"
 nomad_war_planet_2_DESC:0 "Installed defensive systems allow this massive warship to absorb damage that would sunder worlds."
 nomad_war_planet_3:0 "$giga_nomad_war_planet$"
 nomad_war_planet_3_DESC:0 "A completed $giga_nomad_war_planet$, ready to take to the stars."
 nomad_war_planet_debris:0 "Wrecked $giga_nomad_war_planet$"
 nomad_war_planet_debris_DESC:0 "The remnants of a massive warship built by an advanced civilization, which has remained largely intact due to it's massively armored hull. It once possessed some of the largest weaponry known to the galaxy, and although it has taken quite the beating, it might be possible to restore this fearsome craft to its former glory, provided we have plenty of resources and the technology to do so."
 nomad_war_planet_debris_MEGASTRUCTURE_DETAILS:0 "$nomad_war_planet_0_MEGASTRUCTURE_DETAILS$"
 nomad_war_planet_restored:0 "$nomad_war_planet_3$"
 nomad_war_planet_restored_DESC:0 "$nomad_war_planet_3_DESC$"
 nomad_war_planet_restored_MEGASTRUCTURE_DETAILS:0 "$war_planet_0_MEGASTRUCTURE_DETAILS$"

 giga_nomad_dialog.010.name:0 "$giga_nomad_war_planet$ Construction Site Built"
 giga_nomad_dialog.010.desc:0 "The Construction Site for a future $giga_nomad_war_planet$ is now complete. This deep-space construction site will serve as a staging depot in order to begin constructing the $giga_nomad_war_planet$ itself.\n\n§INOTE: Don't forget to design the $giga_nomad_war_planet$ in the ship designer!§!"
 giga_nomad_dialog.010.a:0 "Marvelous."
 giga_nomad_dialog.012.name:0 "$giga_nomad_war_planet$ Hull Complete"
 giga_nomad_dialog.012.desc:0 "The hull of the $giga_nomad_war_planet$ is now complete! All general systems have been installed, including the massive planetary scale reactor, capable of powering the ship's future thrusters and main weapons."
 giga_nomad_dialog.012.a:0 "One step closer."
 giga_nomad_dialog.013.name:0 "$giga_nomad_war_planet$ Defensive Systems Complete"
 giga_nomad_dialog.013.desc:0 "Our $giga_nomad_war_planet$'s defensive systems have been completed. Kilometers thick steel stands behind planetary strength shields, all mounted on a massive frame with an equally massive and over-engineered FTL Drive. The final step is to install the weapons systems."
 giga_nomad_dialog.013.a:0 "We are close."
 giga_nomad_dialog.014.name:0 "The Chariot of Judgement is at Hand"
 giga_nomad_dialog.014.desc:0 "We have done it. With the $giga_nomad_war_planet$ main weapon arrays completed, this monstrous spaceship is now operational. Over ten thousand kilometers long, this truly massive construct is the logical evolution of the the $giga_nomad_war_moon$. The ship has engaged it's engines, and is now ready to join our fleets."
 giga_nomad_dialog.014.a:0 "Truly a marvelous accomplishment."

 MESSAGE_NOMAD_WAR_PLANET_DESTROYED:0 "$giga_nomad_war_planet$ Destroyed"
 MESSAGE_NOMAD_WAR_PLANET_DESTROYED_DESC:0 "The $NOMAD_CELESTIAL_WARSHIP_NAME|Y$ $giga_nomad_war_planet$ has been destroyed by the $ENEMY_NAME|Y$ in the $SYSTEM_NAME|Y$ system.\n\nIt has been reduced to an immobile wreck which may be repaired if we have the necessary resources and control of the system."
 giga_nomad_actions.551.name:0 "$giga_nomad_war_planet$ Repaired!"
 giga_nomad_actions.551.desc:0 "Wonderful news! We have managed to restore the ruined $giga_nomad_war_planet$ in the [giga_debris_system.GetName] system. It has taken quite a lot of work, and most of its internals had to be completely rebuilt from scratch, but this mighty warship is now operational once more."
 giga_nomad_actions.551.a:0 "Wonderful."

 giga_nomad_actions.552.name:0 "Wrecked $giga_nomad_war_planet$ Scrapped"
 giga_nomad_actions.552.desc:0 "Our scavenging teams have now completed the dismantlement of the ruined $giga_nomad_war_planet$ found within the §Y[from.GetName]§! system. The dismantlement of the $giga_nomad_war_planet$'s colossal weapons array and movement systems has netted us significant amounts of alloys and engineering research. Additionally, its devastated hull was scoured for valuable elements."
 giga_nomad_actions.552.a:0 "Good."

 ##########################
 ### Neutronium Harvest ###
 ##########################

 giga_tech_arkship_neutronium_harvester:0 "$giga_tech_neutronium_gigaforge$"
 giga_tech_arkship_neutronium_harvester_desc:0 "By providing our $arkship_cap_plural$ with the means to harvest stellar remnants such as $pc_neutron_star_plural$, we can guarantee a reliable source of valuable alloys for aeons to come."

 sm_giga_arkship_neutronium_harvester:0 "Mass Neutronium Harvester"
 sm_giga_arkship_neutronium_harvester_tt:0 "$ARKSHIP_ACTION_HEADER$ $TABBED_NEW_LINE$['scripted_action:giga_arkship_harvest_neutronium']"
 has_giga_arkship_neutronium_harvester_tt: "Has a §Y$sm_giga_arkship_neutronium_harvester$§!"
 has_giga_arkship_neutronium_deposit_modifier_tt: "The $arkship_cap$ is §Rstill processing§! excess neutronium."
 GIGA_ARKSHIP_NEUTRONIUM_HARVESTER:0 "$sm_giga_arkship_neutronium_harvester$"

 giga_arkship_harvest_neutronium:0 "$giga_tech_neutronium_gigaforge$"
 giga_arkship_harvest_neutronium_desc:0 "§LWith the extensive and incredibly careful use of gravity bores and magnetic field projectors, small fractions of this stellar remnants outer layers are harvested for immediate processing into hyper-dense neutronium alloys.§!"
 giga_arkship_harvest_neutronium_effect:0 "$giga_arkship_harvest_neutronium_planet_effect$ $DOUBLE_NEW_LINE$ $giga_arkship_harvest_neutronium_arkship_effect$"
 giga_arkship_harvest_neutronium_planet_effect:0 "$TABBED_NEW_LINE$ $PLANET_EFFECTS_HEADER$ $TABBED_NEW_LINE$- §Y$giga_arkship_neutronium_harvested$§! modifier added for for £time£ §H$@arkship_strip_mine_duration_doubled|0$ Months§!: $TABBED_NEW_LINE$$t$ $mod_station_gatherers_produces_mult$: $@arkship_harvest_resources_station_penalty|0%+$ $TABBED_NEW_LINE$$t$ $giga_harvested_neutronium_tt$"
 giga_arkship_harvest_neutronium_arkship_effect:0 " $ARKSHIP_EFFECTS_HEADER$ $TABBED_NEW_LINE$- §Y$giga_arkship_neutronium_deposit$§! added for §Y15§! years: $TABBED_NEW_LINE$$t$ $mod_planet_metallurgists_alloys_produces_add$: §G+1.5§! $TABBED_NEW_LINE$$t$ $mod_planet_metallurgists_energy_upkeep_add$: §R+2§!"
 giga_arkship_harvest_neutronium_ship_button:0 "$giga_arkship_harvest_neutronium_effect$"
 giga_arkship_harvest_neutronium_activity_key:0 "Preparing Gravity Bores"
 giga_arkship_harvest_neutronium_progress_activity_key:0 "Harvesting Neutronium (§Y$PROGRESS$%§!)"
 giga_arkship_harvest_neutronium_required_progress_key:0 "£time£ $@arkship_reprocess_planet_required_progress|0$ §WDays§!"

 giga_arkship_neutronium_deposit:0 "Harvested Neutronium Deposit"
 giga_arkship_neutronium_deposit_desc:0 "A massive deposit of neutronium, lifted directly from the surface of a dying star for processing by our finest [Owner.GetAlloyProducerPlural].\n\n§EMonths Until Processing Complete:§! §Y[planet.GetMonthsUntilNeutroniumDepositHarvested]§!"
 giga_arkship_neutronium_harvested:0 "Harvestable Neutronium Deposits Exhausted"
 giga_arkship_neutronium_harvested_desc:0 "All easily reachable neutronium sources have been collected. It will take time to uncover new deposits and set up the infrastructure to harvest them."
 giga_harvested_neutronium_tt:0 "§RBlocks all $giga_arkship_harvest_neutronium$ Actions§!"

 GIGA_NOMAD_NEUTRONIUM_HARVEST_READY_TITLE:0 "$sm_giga_arkship_neutronium_harvester$ Ready For Use"
 GIGA_NOMAD_NEUTRONIUM_HARVEST_READY_DESC:0 "$giga_arkship_harvest_neutronium$ is off cooldown and ready for use."