l_english:
  #########################################
  ### Planetary Computer ##################
  #########################################

  giga_tech_planetary_computer:0 "Planetary Scale Computing Complexes"
  giga_tech_planetary_computer_desc:0 "The solution to ever-expanding needs for computing power: an entire planet transformed into a computer. Using specialized terraforming techniques, this gargantuan project can become a reality."

  giga_dialog.1301.name:0 "$name_planetary_computer$ Construction Site Complete"
  giga_dialog.1301.desc:0 "The construction site for a future $name_planetary_computer$ has now been completed in the [giga_system.GetName] system. Upon this scaffold, we will eventually convert this entire planet into a massive computer, possessing immense processing power."
  giga_dialog.1301.a:0 "$EXCELLENT$"

  giga_dialog.1302.name:0 "$name_planetary_computer$ Internals Complete"
  giga_dialog.1302.desc:0 "We are another step closer to completing a $name_planetary_computer$ in the [giga_system.GetName] system. With the internal frame now in place, we are now ready to properly complete this colossal project stretching deep into the planet's mantle. We shall soon have unthinkable computing power at our disposal."
  giga_dialog.1302.a:0 "$MARVELOUS$"

  giga_dialog.1303.name:0 "$name_planetary_computer$ Complete!"
  giga_dialog.1303.desc:0 "Fantastic news! In the [giga_system.GetName] system, we have completely encased a planet in a massive supercomputer, which stretches from the surface to the planet's mantle. This truly awe-inspiring construct will provide immense research opportunities to researchers on its surface, and it will certainly be a great boon to our research."
  giga_dialog.1303.a:0 "$INCREDIBLE$"

  planetary_computer_0:0 "$gc_mega$$name_planetary_computer$ Construction Site"
  planetary_computer_0_DESC:0 "The Construction Site for a future $name_planetary_computer$ to be built around the planet below. This massive computer will one day stretch deep into the planet's mantle, and will possess unthinkable processing power. All districts on the planet aside from housing will be replaced with unique ones, focused on research."
  planetary_computer_0_MEGASTRUCTURE_DETAILS:0 "£gigastructural£ $giga_list_category_megastructure$ - $giga_list_category_science_production$ - $giga_list_category_habitable_mega$\nConverts a §YHabitable World§! into a §YPlanetary Computer§! capable of enhancing ['concept_pcc_jobs'].\n§LA computer engulfing an entire planet with immense processing power.§!" #megalistentry PLANETARY COMPUTER

  planetary_computer_1:0 "$name_planetary_computer$ Internals"
  planetary_computer_1_DESC:0 "The first steps towards a complete $name_planetary_computer$. Preliminary internal structures and specialized infrastructure."

  planetary_computer_2:0 "$name_planetary_computer$"
  planetary_computer_2_DESC:0 "A complete $name_planetary_computer$, providing bonuses to relevant jobs on its surface."

  #########################################
  ### PCC districts #######################
  #########################################

  district_giga_pcc_processor:0 "Processing Unit Array"
  district_giga_pcc_processor_plural:0 "Processing Unit Arrays"
  district_giga_pcc_processor_desc:0 "Each bank, packed high with processors, will be used to improve productivity across the entire planet."

  district_giga_pcc_memory:0 "Memory Bank"
  district_giga_pcc_memory_plural:0 "Memory Banks"
  district_giga_pcc_memory_desc:0 "The cache hits have never been higher!"

  district_giga_pcc_storage:0 "Non-Volatile Storage Cell"
  district_giga_pcc_storage_plural:0 "Non-Volatile Storage Cells"
  district_giga_pcc_storage_desc:0 "Benefiting for additional storage, longer and more experimental tasks can be carried out to a higher degree of success."

  district_giga_pcc_hab:0 "$district_hab_housing$"
  district_giga_pcc_hab_plural:0 "$district_hab_housing_plural$"
  district_giga_pcc_hab_desc:0 "This housing district provides comfortable, if compact residences for its population."

  #########################################
  ### ORIGIN #############################
  #########################################

  giga_planetary_computer_start_NAME:0 "Planetary Computer"
  giga_planetary_computer_start_DESC:0 "Start on a Planetary Computing Complex."

  origin_planetary_computer:0 "Central Processing"
  origin_planetary_computer_desc:0 "With most of its data lost, the robotic species originally created to take care of this planet-scale computer is now on its own."
  origin_planetary_computer_effects:0 "Start on a Planetary Computing Complex."

  building_solar_farm:0 "Solar Farm"
  building_solar_farm_desc:0 "A large solar array which generates enough energy to power the planet's systems."

  building_giga_pcc_scrap_pile:0 "Colossal Scrap Heap"
  building_giga_pcc_scrap_pile_desc:0 "A huge pile of scrap material, ripe for recycling."

  pcc_rogue_ai_army:0 "Rogue AI Killbots"
  pcc_rogue_ai_army_desc:0 "Ravenous killbots designed to exterminate all unauthorized entities from the Planetary Computing Complex."

  #########################################
  ### ORIGIN #############################
  #########################################

  system_storm_influence_add:0 "Storm Influence"

