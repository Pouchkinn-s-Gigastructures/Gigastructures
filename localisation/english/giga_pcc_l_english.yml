  district_giga_pcc_processor:0 "Processing Unit Array"
  district_giga_pcc_processor_plural:0 "Processing Unit Arrays"
  district_giga_pcc_processor_desc:0 "Each bank, packed high with processors, will be used to improve productivity across the entire planet."

  district_giga_pcc_memory:0 "Memory Bank"
  district_giga_pcc_memory_plural:0 "Memory Banks"
  district_giga_pcc_memory_desc:0 "The cache hits have never been higher!"

  district_giga_pcc_storage:0 "Non-Volatile Storage Cell"
  district_giga_pcc_storage_plural:0 "Non-Volatile Storage Cells"
  district_giga_pcc_storage_desc:0 "Benefiting for additional storage, longer and more experimental tasks can be carried out to a higher degree of success."

  district_giga_pcc_hab:0 "$district_hab_housing$"
  district_giga_pcc_hab_plural:0 "$district_hab_housing_plural$"
  district_giga_pcc_hab_desc:0 "This housing district provides comfortable, if compact residences for its population."

