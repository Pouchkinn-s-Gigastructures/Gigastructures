 giga_planetary_computer_start_NAME:0 "Planetary Computer"
 giga_planetary_computer_start_DESC:0 "Start on a Planetary Computing Complex."

 origin_planetary_computer:0 "Central Processing"
 origin_planetary_computer_desc:0 "With most of its data lost, the robotic species originally created to take care of this planet-scale computer is now on its own."
 origin_planetary_computer_effects:0 "Start on a Planetary Computing Complex."

 building_solar_farm:0 "Solar Farm"
 building_solar_farm_desc:0 "A large solar array which generates enough energy to power the planet's systems."

 building_giga_pcc_scrap_pile:0 "Colossal Scrap Heap"
 building_giga_pcc_scrap_pile_desc:0 "A huge pile of scrap material, ripe for recycling."

 pcc_rogue_ai_army:0 "Rogue AI Killbots"
 pcc_rogue_ai_army_desc:0 "Ravenous killbots designed to exterminate all unauthorized entities from the Planetary Computing Complex."