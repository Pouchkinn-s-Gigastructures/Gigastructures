  concept_pc_giga_elysium_desc:0 "- Base Habitability: §Y100%§!\n- $MOD_PLANET_COLONY_DEVELOPMENT_SPEED_MULT$: §G+400%§!\n- $MOD_PLANET_RESETTLEMENT_UNEMPLOYED_DESTINATION_MULT$: §Y+25%§!\n- $mod_pop_cat_ruler_happiness$: §G+10%§!\n- $mod_pop_cat_ruler_bonus_workforce_mult$: §G+25%§!\n- $mod_pop_cat_worker_bonus_workforce_mult$: §R-50%§!\n- $MOD_PLANET_AMENITIES_MULT$: §G+15%§!\n- $mod_giga_virtual_colony_size$: §Y-0.5§!\n\n§L$pc_giga_elysium_desc$§!"

  concept_giga_elysium:0 "$name_orb_elysium$ Mechanics Reference"
  concept_giga_elysium_desc:0 "Building an §Y$name_orb_elysium$§! Kilostructure over a £planet£ Planetary ['concept_colony'] creates a ['concept_pc_giga_elysium', Habitable Station] (Size: £planetsize£ $@giga_elysium_base_size|0$), and designates the Colony as a §YHost Planet§!.\n\n§HStation:§!\n- Focused on [this.GetGigaEliteAndSpecialist] Jobs\n- Penalties to [this.GetGigaWorker] Jobs\n- £district£ ['concept_districts'] for £research£ §Y$research$§!, £unity£ §Y$unity$§!, [this.GigaAmenitiesIcon] §Y$concept_amenities$§!, and maintaining £stability£ §Y$concept_stability$§! on the Host Planet[this.GetElysiumHiveDistricts]\n- Upgrading the £building£ Capital Building on the Host Planet provides [this.GetElysiumUpgradeDistricts]\n\n§HHost Planet:§!\n- Modifier: ['modifier:giga_elysium_host_planet']\n- Job distribution biased towards [this.GetGigaWorker] Jobs\n- Heavy penalties to £research£ §Y$research$§! Output\n- £district£ Primary District:$TABBED_NEW_LINE$- $mod_zone_building_slots_add$: §R-3§!$TABBED_NEW_LINE$- Replacement Capital: £building£ [this.building_giga_elysium_host_capital]$TABBED_NEW_LINE$- Building: £building£ [this.building_giga_elysium_host_jobs]$TABBED_NEW_LINE$- Building: £building£ ['building:building_giga_elysium_trash_heap']$TABBED_NEW_LINE$- £zone£ $concept_district_specializations$ for £basic_resources£ §YBasic Resources§! are available"

  giga_elysium_districts_hive:0 "\n- $hive_mind$ Bonus: §G+$@giga_elysium_base_size_hive|0$§! $MOD_PLANET_MAX_DISTRICTS_ADD$"

  giga_elysium_upgrade_non_hive:0 "§G+$@giga_elysium_upgrade_size|0$§! $MOD_PLANET_MAX_DISTRICTS_ADD$ per upgrade"
  giga_elysium_upgrade_hive:0 "§G+$@giga_elysium_upgrade_size_hive|0$§! $MOD_PLANET_MAX_DISTRICTS_ADD$"

  concept_giga_elysium_zones:0 "$giga_elysium_host_planet$ $concept_district_specializations$"
  concept_giga_elysium_zones_desc:0 "The £building£ [this.building_giga_elysium_host_jobs] Building provides §Y$@giga_elysium_jobs_per_100|*0$§! £job£ Jobs for every §Y100§! £pop£ Pops on an $giga_elysium_host_planet$.\nThe distribution of these jobs depends upon the type of the owning Empire, and the £zone£ ['concept_district_specializations'] present on the Planet.\n\nMost £zone£ Specializations shift the distribution to provide their primary £job£ Job. Urban and Amenities £zone£ Specializations do not contribute to the distribution. ['concept_giga_elysium_zone_splits', Some Specializations] provide several types of Jobs in varying proportion.\n\nWhen the planet has §Y3 or fewer contributing £zone£ Specializations§!, each one contributes §Y1/3§! of the distribution, and the remaining Jobs are of a general mix based on Empire Type.\nWhen the planet has §Y4 or more contributing £zone£ Specializations§!, each one contributes an equal share of the distribution."

  concept_giga_elysium_zone_splits:0 "$giga_elysium_host_planet$ Split $concept_district_specializations$"
  concept_giga_elysium_zone_splits_desc:0 "Some £zone£ ['concept_district_specializations'] provide a split of £job£ Jobs to the £building£ [this.building_giga_elysium_host_jobs]. They are considered a mix of other Specialization types in varying proportions.\n\n$zone_industrial$:\n1/2 £alloys£ §Y$alloys$§!, 1/2 £consumer_goods£ §Y$consumer_goods$§!\n\n$zone_research$:\n1/3 £physics_research£ §Y$physics_research$§!, 1/3 £society_research£ §Y$society_research$§!, 1/3 £engineering_research£ §Y$engineering_research$§!\n\n$zone_research_unity$:\n6/9 £unity£ §Y$unity$§!, 1/9 £physics_research£ §Y$physics_research$§!, 1/9 £society_research£ §Y$society_research$§!, 1/9 £engineering_research£ §Y$engineering_research$§!\n\n$zone_subterranean_urban$ (['civic:origin_subterranean'] Origin):\n3/4 £minerals£ §Y$minerals$§!, 1/4 £trade£ §Y$trade$§!\n\n$zone_agrarian_urban$ (['civic:civic_agrarian_idyll'] Civic):\n3/4 £food£ §Y$food$§!, 1/4 £trade£ §Y$trade$§!\n\n$zone_anglers$ (['civic:civic_anglers'] Civic):\n3/4 £food£ §Y$food$§!, 1/4 £consumer_goods£ §Y$consumer_goods$§!\n\n$zone_agrarian_anglers$ (['civic:civic_agrarian_idyll'] and ['civic:civic_anglers'] Civics):\n3/5 £food£ §Y$food$§!, 1/5 £consumer_goods£ §Y$consumer_goods$§!, 1/5 £trade£ §Y$trade$§!"
