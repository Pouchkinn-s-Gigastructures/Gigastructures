  building_giga_elysium_host_jobs_effect:0 "Provides §Y$@giga_elysium_jobs_per_100|0$§! £job£ Jobs for every §Y100§! £pop£ Pops on the planet, suited to our §YEmpire Type§! and the £zone£ ['concept_giga_elysium_zones', Current District Specializations]."

