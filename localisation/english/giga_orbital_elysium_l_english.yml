  job_giga_elysium_controller_drone_effect_desc:0 "$job_giga_elysium_controller_drone_swap_plural_with_icon$ turn £energy£ §Y$energy$§! into £stability£ §Y$MOD_PLANET_STABILITY_ADD$§! for the station's host planet"
