  district_giga_elysium_control_plural:0 "Control Districts"
  district_giga_elysium_control_desc:0 "The nerve center for planetside operations, where overseers ensure compliance from the population below."
  district_giga_elysium_control_subtitle:0 "Orbital Command Center"

  district_giga_elysium_archive:0 "Cultural Development District"
  district_giga_elysium_archive_plural:0 "Cultural Development Districts"
  district_giga_elysium_archive_desc:0 "A state-of-the-art research and administration installation, managing communications for the station and its host planet."

  district_giga_elysium_entertainment:0 "Entertainment District"
  district_giga_elysium_entertainment_plural:0 "Entertainment Districts"
  district_giga_elysium_entertainment_desc:0 "A center of broadcast media production, able to produce an endless stream of content to satisfy the masses."
  district_giga_elysium_entertainment_subtitle:0 "Media Megaplex"

  district_giga_elysium_maintenance:0 "Maintenance District"
  district_giga_elysium_maintenance_plural:0 "Maintenance Districts"
  district_giga_elysium_maintenance_desc:0 "A orbital maintenance depot, able to deploy response drones to anywhere on the station's host planet within a standard day."
  district_giga_elysium_maintenance_subtitle:0 "Rapid Deployment Arrays"

