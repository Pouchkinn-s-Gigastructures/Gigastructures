  zone_giga_elysium_host_food:0 "Urban Homesteading"
  zone_giga_elysium_host_food_desc:0 "Where space is at a premium, urban greenery can be made productive."

  zone_giga_entertainment:0 "Entertainment Multiplex"
  zone_giga_entertainment_desc:0 "A cradle of creativity, where dreams become broadcast programming."

  zone_giga_maintenance:0 "Self-Correcting Works"
  zone_giga_maintenance_desc:0 "Who maintains the maintainers?"

