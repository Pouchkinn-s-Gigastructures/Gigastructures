  building_giga_elysium_host_system_capital_plural:0 "Elysium Planetary Control Omnicomplexes"
  building_giga_elysium_host_system_capital_desc:0 "A planetary panopticon, managing every aspect of governance on behalf of the paradise above."

  giga_elysium_dystopian_stability_desc:0 "\n§H$civic_dystopian_society$:§! Additionally receives §Y50%§! of the £stability£ §YStability§! of the orbiting Elysium"

