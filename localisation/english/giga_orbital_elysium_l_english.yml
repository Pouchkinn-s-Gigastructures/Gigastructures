  #########################################
  origin_elysium:0 "Elysian Overseers"
  origin_elysium_desc:0 "This civilization believes that the best way to rule the masses is from a safe vantage point."
  origin_elysium_effects:0 "- Start with your Empire Capital on an ['concept_pc_giga_elysium'] (Size: £planetsize£ $@giga_elysium_base_size|0$) orbiting your Homeworld as a second Colony\n- Starting Technology: ['technology:giga_tech_orbital_elysium']\n- Newly settled Colonies immediately start construction of an §Y$name_orb_elysium$§! if they are able to support one\n- Needs fewer pops to upgrade Capital Buildings on §Y$giga_elysium_host_planet_plural$§!"
  origin_elysium_effects_negative:0 "- Homeworld Modifier: ['modifier:giga_elysium_host_planet']\n- Colonies which are able to support an §Y$name_orb_elysium$§! but are lacking one suffer the ['modifier:giga_origin_no_elysium'] penalty\n- Unable to decommission §Y$name_orb_elysium$§! stations\n\n§ESee the ['concept_giga_elysium'] for more information.§!"

