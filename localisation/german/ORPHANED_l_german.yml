  giga_succ_mode_standard:0 "Standard Extraktion"
  giga_succ_mode_standard_desc:0 "§LDiese $name_succ_full$ wird mit Standardgeschwindigkeit arbeiten.\n\nUnveränderte §YMegastruktur Laufzeit§! £time£\nUnveränderte §YProduktion§!§! £energy£ £volatile_motes£ £exotic_gases£"
  giga_succ_mode_fast:0 "Beschleunigte Extraktion"
