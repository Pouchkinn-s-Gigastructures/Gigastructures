l_german:
  giga_katzen.7000.name:99 "Strategic Shifts on Flusion"
  giga_katzen.7000.desc:99 "Recent reports from the Katzenartig Imperium all suggest that a strategic and political shift is underway. The Kaiser seems to believe that Flusion's rule has expanded far enough for the time being, and is ordering his aides to draft an array of plans for substantial administrative restructuring.\n\nWhile we shouldn't expect anything like a renunciation of Katzen militarism, it seems a respite is on the horizon for free nations on the Imperium's borders - and a tighter grip is closing for those who are already under the Kaiser's thumb.\n\nPractically, this means the Kaiser is seeking to wind down ongoing conflicts in the coming years, and will reign in his relentless expansionism. We should review the galactic situation with our new intel in case this provides any opportunities."
  giga_katzen.7000.a:99 "Very welcome news."
  giga_katzen.7000.a.tooltip:99 "The Katzens are too preoccupied to give external diplomacy as much attention, §Rhalving§! the likelihood of §YKatzen Attachés§! increasing opinion during the §BKatzen Reformation§!."
  giga_katzen.7000.b:99 "An opportunity to grow closer to Flusion?"
  giga_katzen.7000.c:99 "We're running out of time to escape Flusion's control..."
  giga_katzen.7000.d:99 "Fudge numbers to undermine their bureaucracy's planning."
  
  katzen_instability_up:99 "This will §Gincrease§! the chance of the Imperium suffering potentially-fatal instability."
  katzen_instability_up_lots:99 "This will §Gsignificantly increase§! the chance of the Imperium suffering potentially-fatal instability."
  katzen_instability_down:99 "This will §Rdecrease§! the chance of the Imperium suffering potentially-fatal instability."
  
  giga_katzen.7001.name:99 "Katzens Propose Peace"
  giga_katzen.7001.desc:99 "High-level incoming communications from the Katzenartig Imperium are proposing that we end our war with them, leaving the borders as they currently stand. While this is an unusual proposal from the notoriously violent and expansionistic Katzens, it isn't wholly unexpected in light of their recent shift from external to internal affairs.\n\nThe peace offer seems genuine, but the Katzens have made it clear that they aren't simply going soft, and are prepared to continue the war with their full effort should we refuse. Of course, if we're feeling confident, we could continue fighting for now, and ask them for peace when we're in a more favourable position... or not give them peace at all."
  giga_katzen.7001.a:99 "Continue fighting."
  giga_katzen.7001.militarist.a:99 "They might be losing their nerve, but we aren't."
  giga_katzen.7001.b:99 "Begin the ceasefire."
  giga_katzen.7001.pacifist.b:99 "Finally, a moment of reason from them."
  
  giga_katzen.7002.name:99 "Katzenartig Reformation Begins"
  giga_katzen.7002.desc:99 "Increasingly public information from the Katzenartig Imperium confirms that the Kaiser has gone ahead with his once-clandestine reformation plans. According to our best intel, we expect the Kaiser to spend roughly two decades occupied with enacting a range of far-reaching administrative reforms designed to consolidate Flusion's planetside and imperial authority.\n\nReform is, of course, risky business, with programs such as accelerating Katzenification and reshuffling regional political privileges particularly likely to cause backlash. Whether the Kaiser can come out of this era with his reign strengthened will depend heavily on whether his citizens and subordinates feel he has fulfilled his promises..."
  giga_katzen.7002.a:99 "Let's hope they stay this way..."
  giga_katzen.7002.b:99 "Order and we will obey."
  giga_katzen.7002.c:99 "We can only hope it all unravels."
  giga_katzen.7002.d:99 "I'm sure we could mishandle implementing a few reforms..."
  
  giga_katzen.7012.name:99 "Instability in Katzenartig Imperium!"
  giga_katzen.7012.desc:99 "It appears that the Katzenartig citizenry don't feel the Kaiser is delivering his utopian vision. Open unrest has broken out on the capital itself, and while the Kaiser has responded with a heavy hand to reassert his authority, a spike in high-profile treason convictions suggests that not all in the Imperium's upper echelons are enthusiastic about enforcing the Kaiser's will.\n\nDespite this test to the Kaiser's rule, it's still too soon to say whether the Kaiserist government will collapse, or reassert itself for another generation - and with the crisis playing out on numerous societal battlefields, it may be a few years before we have an answer.\n\nRegardless, during this period, the Katzenartig Imperium may not have the capacity to handle further threats, and a war could help stretch the Katzen government too far..."
  giga_katzen.7012.a:99 "Promising news."
  giga_katzen.7012.b:99 "We'll pile on the pressure!"
  giga_katzen.7012.b.tooltip:99 "We will §Rdeclare war§! on the §YKatzenartig Imperium§!. A successful offensive in the next few years will §Gincrease§! the chance of the Imperium collapsing."
  giga_katzen.7012.c:99 "Traitors! We believe in the Kaiser."
  giga_katzen.7012.c.tooltip:99 "§YSupporting or opposing the Kaiser will affect his chances of maintaining power.§!"
  giga_katzen.7012.d:99 "This may be our last chance for rebellion!"
  giga_katzen.7012.d.tooltip:99 "$giga_katzen.0033.a.tooltip$\n\n$giga_katzen.7012.c.tooltip$"
  giga_katzen.7012.e:99 "Our population will overthrow the Imperium from within!"
  
  giga_katzen.7013.name:99 "Kaiser Maintains Power"
  giga_katzen.7013.desc:99 "Recent unrest in the Katzenartig Imperium has wound down, with the Kaiser's grip on power emerging tested yet unbroken. Through an uncannily lucky series of apparent gambles on when to make concessions and when to crack down brutally, the Kaiserist regime successfully neutralised most flashpoint issues.\n\nThough this episode has dealt a hefty blow to the Kaiser's quasi-divine image, the Katzenartig Imperium appears to be back on track with its reforms, albeit behind schedule."
  giga_katzen.7013.a:99 "Blast!"
  giga_katzen.7013.b:99 "Righteousness wins today."
  giga_katzen.7013.c:99 "We missed our chance..."
  
  giga_katzen.7014.name:99 "Katzenartig Imperium Implodes!"
  giga_katzen.7014.desc:99 "The deteriorating situation in the Katzenartig Imperium has taken a sudden turn, with the Kaiser having disappeared! In the chaotic situation, there is no knowing which of many jostling factions may have deposed him, or whether the Kaiser himself saw the writing on the wall and organised a clean escape from his crumbling project. In any case, without the Kaiser, his regime has utterly collapsed.\n\nAttempts by several leaders to either seize absolute power or simply mediate the situation have all failed. With so much tension squished into the Imperium's limited territory, the result has been a complete breakdown of any recognisable central authority. There is nothing now but brutal planetary power struggles.\n\nThe great projects of the Kaiser's era are up in flames, along with the dreams of his supporters and detractors alike. While Flusion theoretically still has fearsome industrial potential, would take a political miracle for the sorry vestiges of the Imperium to return to the galactic stage anytime soon."
  giga_katzen.7014.b:99 "Their violent ways brought such a horrible end..."
  
  giga_katzen.7020.name:99 "Katzenartig Imperium Fractures!"
  giga_katzen.7020.loris.desc:99 "The deteriorating situation in the Katzenartig Imperium has taken a sudden turn, with the Kaiser having disappeared! In the chaotic situation, there is no knowing which of many jostling factions may have deposed him, or whether the Kaiser himself saw the writing on the wall and organised a clean escape from his crumbling project. In any case, without the Kaiser, his regime has utterly collapsed.\n\nKatzen space has now broken down into the vicious §YKatzen Civil War§! between four factions: the §Y[katzen_civil_war_realm.GetName]§!, §Y[katzen_civil_war_republic.GetName]§!, §Y[katzen_civil_war_socialist.GetName]§! and §Y[katzen_civil_war_junta.GetName]§!. Each self-proclaimed rightful successor is led by a prominent leader from the late Imperium, with irreconcilable visions of how to rebuild the Katzen state.\n\nImpressively, Loris von Kattensbach - previously governor of Flusion - has managed to carve out a relatively stable neutral zone around Flusion itself, the §YFlusionian Provisional Authority§!. There is a shaky understanding in ex-Katzenartig space that should the civil war be definitively resolved, the victor will reunify with Flusion's civilian government to confer legitimacy and stability. While the more pacifistic contenders led by Kibbles and Kitti Luft - who leave room to place the wellbeing of citizens first - are widely suspected to have Loris's personal sympathies, it seems the Flusionian leader is putting the preservation of Flusion's assets and Katzen unity first."
  giga_katzen.7020.douclaw.desc:99 "The deteriorating situation in the Katzenartig Imperium has taken a sudden turn, with the Kaiser having disappeared! In the chaotic situation, there is no knowing which of many jostling factions may have deposed him, or whether the Kaiser himself saw the writing on the wall and organised a clean escape from his crumbling project. In any case, without the Kaiser, his regime has utterly collapsed.\n\nKatzen space has now broken down into the vicious §YKatzen Civil War§! between four factions: the §Y[katzen_civil_war_realm.GetName]§!, §Y[katzen_civil_war_republic.GetName]§!, §Y[katzen_civil_war_socialist.GetName]§! and §Y[katzen_civil_war_junta.GetName]§!. Each self-proclaimed rightful successor is led by a prominent leader from the late Imperium, with irreconcilable visions of how to rebuild the Katzen state.\n\nImpressively, Douclaw MacCathur - previously head of the Katzen admiralty - has managed to carve out a relatively stable neutral zone around Flusion itself, the §YKatzenartig Emergency Command§!. There is a shaky understanding in ex-Katzenartig space that should the civil war be definitively resolved, the victor will reunify with Flusion's military government to confer legitimacy and stability. While the more militaristic contenders led by Katlinin and Elwin - who prioritise Kaiser-like martial values - are widely suspected to have Douclaw's personal sympathies, it seems the Flusionian leader is putting the preservation of Flusion's assets and Katzen unity first."
  giga_katzen.7020.b:99 "Snivelling traitors have stolen our future!"
  giga_katzen.7020.b.tooltip:99 "§RWe have become independent.§!"
  giga_katzen.7020.c:99 "Free again, at last!"
  giga_katzen.7020.c.tooltip:99 "§GWe have become independent.§!"
  
  giga_katzen.7021.name:99 "[GigaFlusionProvisionalGovernmentName]"
  giga_katzen.7021.name.loris:99 "Flusionian Provisional Authority"
  giga_katzen.7021.name.douclaw:99 "Katzenartig Emergency Command"
  giga_katzen.7021.intro.loris.desc:99 "Greetings again from Flusion, aliens. §YDouclaw MacCathur§! here, speaking on behalf of our current leader §YLoris von Kattensbach§!.\n\nThanks to Loris's work, we've managed to shield Flusion and its direct territories from the civil war, and we intend to keep their people safe until the Katzen state reunifies.\n\nWe don't want any conflict with outsiders, but as always, we are more than ready to protect ourselves."
  giga_katzen.7021.intro.loris.succession.desc:99 "Greetings again from Flusion, Katzens. §YDouclaw MacCathur§! here, speaking on behalf of our current leader §YLoris von Kattensbach§!.\n\nThanks to Loris's work, we've managed to shield Flusion and its direct territories from the civil war, and we intend to keep their people safe until the Katzen state reunifies.\n\nAs always, we are more than ready to protect ourselves - but I expect you understand the importance of keeping our civilisation's capital safe."
  giga_katzen.7021.intro.douclaw.desc:99 "Greetings again from Flusion, aliens. §YDouclaw MacCathur§! here, leader of the Imperium's interim government.\n\nThanks to the military's swift action, we've managed to shield Flusion and its direct territories from the civil war, and we intend to keep these lands safe until the Katzen state reunifies.\n\nWe don't want any conflict with outsiders, but as always, we are more than ready to protect ourselves."
  giga_katzen.7021.intro.douclaw.succession.desc:99 "Greetings again from Flusion, Katzens. §YDouclaw MacCathur§! here, leader of the Imperium's interim government.\n\nThanks to the military's swift action, we've managed to shield Flusion and its direct territories from the civil war, and we intend to keep these lands safe until the Katzen state reunifies.\n\nAs always, we are more than ready to protect ourselves - but I expect you understand the importance of keeping our civilisation's capital safe."
  giga_katzen.7021.whatareyou:99 "Who is in charge of Flusion now?"
  giga_katzen.7021.whatareyou.response:99 "We, the [GigaFlusionProvisionalGovernmentName], continue to run the direct successors of the Katzenartig Imperium's institutions. Our mandate is to ensure the ongoing civil war doesn't wreck our civilisation's capital here on Flusion."
  giga_katzen.7021.howalive:99 "How did the [GigaFlusionProvisionalGovernmentName] come to be?"
  giga_katzen.7021.howalive.loris.response:99 "We barely rode out the chaos in the days after the Kaiser disappeared, but Loris von Kattensbach is widely respected by Flusion's diverse races, and by treating them well he's kept us all from turning on one another."
  giga_katzen.7021.howalive.douclaw.response:99 "Things were grim when the Kaiser disappeared, but I gained plenty of experience by his side, and that came in handy. I quickly gathered fellow officers who recognised the name Douclaw MacCathur as a loyal aide of the Kaiser, and we moved in to hold things together."
  giga_katzen.7021.futureplans:99 "What do you intend to do?"
  giga_katzen.7021.futureplans.response:99 "When the civil war is resolved, we'll begin the process of reunification. Flusion will be transferred from the custodianship of our stable institutions to the incoming leadership - with our advice, of course."
  giga_katzen.7021.whoseside:99 " Whose side are you on in the civil war?"
  giga_katzen.7021.whoseside.response:99 "We are very strictly neutral - and no, don't push us for more. It's a dangerous subject. You may think that each warring faction sees us as traitors, but as long as we don't take sides, they understand how important our role is here."
  giga_katzen.7021.whoseside.succession.response:99 "We are very strictly neutral - and no, don't ask us for support.  We've convinced the other warring factions that we're not traitors, but that will only work as long as we don't take sides. I hope you understand how important our role is here."
  giga_katzen.7021.a:99 "You're speaking to the legitimate interim government of Flusion."
  giga_katzen.7021.b:99 "Flusionian neutrality is the key to protecting our civilisation's greatest assets from fleeting power struggles."
  giga_katzen.7021.c:99 "Be assured, we are still plenty capable of defending ourselves."
  giga_katzen.7021.d:99 "The Kaiser has abandoned us, but we haven't abandoned ourselves."
  giga_katzen.7021.e:99 "Flusionkind's inheritance must not, will not, be squandered."
  giga_katzen.7021.f:99 "We on Flusion hope for a speedy resolution to the war. Well... some of us do."
  giga_katzen.7021.g:99 "Some Flusionians might prefer our current independence, but whatever our future state looks like, it first and foremost must be whole."
  giga_katzen.7021.h:99 "Stability is the highest priority."
  giga_katzen.7021.i:99 "Our civilisation will be united again, even if it looks quite different to during the Kaiser's days."
  giga_katzen.7021.j:99 "We can't take sides if you interfere in the civil war, but we will act without hesitation if you move against Flusion."
  giga_katzen.7021.k:99 "Flusionians are strong. We'll survive this too."
  giga_katzen.7021.war.a:99 "Will nothing teach you? We Katzens don't give up."
  giga_katzen.7021.war.b:99 "Do you think our martial skills vanished with the Kaiser?"
  giga_katzen.7021.war.c:99 "From Projekt Mondkanone to fighting you, nothing brings Flusionians together like a common threat."
  giga_katzen.7021.diplowar:99 "§RYou've clung on to Flusion long enough!§!"
  giga_katzen.7021.diplowar.response:99 "If we must... Come at us!"
  giga_katzen.7021.diplowar.tooltip:99 "We will §Rdeclare war§! on the §Y[GigaFlusionProvisionalGovernmentName]§!. They will accept peace at any time. Any existing Katzen Splinter States will §Rjoin the war§! against us to defend Flusion."
  cant_flusiokrieg_contender:99 "We have committed to reunifying with Flusion only through winning the Katzen Civil War."
  giga_katzen.7021.diplopeace:99 "§BLet's end this fighting, Flusionians.§!"
  giga_katzen.7021.diplopeace.response:99 "Excellent. An end to this pointless bickering."
  giga_katzen.7021.diplopeace.tooltip:99 "We will §Bend the war§! with the §Y[GigaFlusionProvisionalGovernmentName]§! and any Katzen Splinter States that are currently intervening in their defence. All current borders will be kept."
  
  giga_katzen.7022.name:99 "Succession"
  giga_katzen.7022.desc:99 "The Kaiser is gone, the Imperium is shattered, and the future of Katzenkind is uncertain. But we are still standing. And just a few short years ago, the word of the Kaiser was that we, too, are \"Katzens\". Katlinin, Elwin, Kibbles and Kitti Luft have made their claims of succession, but why are we any less worthy?\n\nWe are faced with a choice that will define our civilisation's history: do we walk away from the ruins of the Kaiser's project, or do we stake our claim in reunifying the Katzen state? Should we enter the §YKatzen Civil War§! and emerge victorious, the [GigaFlusionProvisionalGovernmentName]'s assets will be ours: perhaps most important among them, the legacy of Kattail will belong to our name and be clay in our [root.species.GetHandNamePlural]." #legacy of Kattail haha what could that be
  giga_katzen.7022.a:99 "We will reforge the Katzenartig Imperium."
  giga_katzen.7022.a.tooltip:99 "We will §Rjoin the§! §YKatzen Civil War§!, and should we defeat all other succession rivals, we will annex the §Y[GigaFlusionProvisionalGovernmentName]§! and become the §B[root.GetAdj] Katzimperium§!. Leaving the war will §Rnot be possible§!." # However, leaving the Katzen Civil War will only be possible by renouncing our claim, incurring §Rimmense societal penalties§!!
  giga_katzen.7022.b:99 "No. No more."
  giga_katzen.7022.b.tooltip:99 "§YThis opportunity will not come again.§!"
  
  giga_katzen.7023.name:99 "Assuming the Mantle"
  giga_katzen.7023.loris.desc:99 "At long last, the Katzen Civil War has come to an end. First came the chaos after the Kaiser disappeared, then years of brutal conflict, and then silence - now displaced by a thunderous roar of triumph. The visionary cries of Katlinin, Elwin, Kibbles and Kitti Luft have been drowned out in history - for with only us left standing on the battlefield, no rivals remain to contest our claims of legitimate inheritance.\n\n§YLoris von Kattensbach§! has now surrendered the custodianship of the §YFlusionian Provisional Authority§!, entrusting the heart of Katzen civilisation to us and our vision for the future. With this, the Katzen state is reborn: the galaxy now knows the §B$katzen_new_imperium_name$§!."
  giga_katzen.7023.douclaw.desc:99 "At long last, the Katzen Civil War has come to an end. First came the chaos after the Kaiser disappeared, then years of brutal conflict, and then silence - now displaced by a thunderous roar of triumph. The visionary cries of Katlinin, Elwin, Kibbles and Kitti Luft have been drowned out in history - for with only us left standing on the battlefield, no rivals remain to contest our claims of legitimate inheritance.\n\n§YDouclaw MacCathur§! has now surrendered the custodianship of the §YKatzenartig Emergency Command§!, entrusting the heart of Katzen civilisation to us and our vision for the future. With this, the Katzen state is reborn: the galaxy now knows the §B$katzen_new_imperium_name$§!."
  giga_katzen.7023.noprovisional.desc:99 "At long last, the Katzen Civil War has come to an end. First came the chaos after the Kaiser disappeared, then years of brutal conflict, and then silence - now displaced by a thunderous roar of triumph. The visionary cries of Katlinin, Elwin, Kibbles and Kitti Luft have been drowned out in history - for with only us left standing on the battlefield, no rivals remain to contest our claims of legitimate inheritance.\n\nA joyous reunion with the [GigaFlusionProvisionalGovernmentName] may have been stolen from us, but nonetheless, Katzenkind has been united again under our vision for the future. With this, the Katzen state is reborn: the galaxy now knows the §B$katzen_new_imperium_name$§!."
  giga_katzen.7023.a:99 "The Kaiser is gone, but the Imperium stands."
  giga_katzen.7023.a.tooltip:99 "We will §Gintegrate§! the §Y[GigaFlusionProvisionalGovernmentName]§! and become the §B[root.GetAdj] Katzimperium§!."
  katzen_new_imperium_name:99 "[root.GetAdj] Katzimperium"
  
  giga_katzen.7024.name:99 "[katzen_civil_war_player.GetName] Reunifies Katzenartig Imperium!"
  giga_katzen.7024.loris.desc:99 "With the destruction of all other belligerents of the Katzen Civil War, the §Y[katzen_civil_war_player.GetName]§! now stands as the supreme victor of the deadly feline civil conflict.\n\nAfter the civil conflict concluded, §YLoris von Kattensbach§! entered negotiations to unify the §YFlusionian Provisional Authority§! with the victorious party, culminating in the formation of the §Y[katzen_civil_war_player.GetAdj] Katzimperium§!.\n\nThis triumphant new state, recently unburdened by its Katzen rivals and now armed with the economic powerhouse of Flusion, is ascendant in galactic affairs. The question now is what vision this reformed empire has for itself and the galaxy."
  giga_katzen.7024.douclaw.desc:99 "With the destruction of all other belligerents of the Katzen Civil War, the §Y[katzen_civil_war_player.GetName]§! now stands as the supreme victor of the deadly feline civil conflict.\n\nAfter the civil conflict concluded, §YDouclaw MacCathur§! entered negotiations to unify the §YKatzenartig Emergency Command§! with the victorious party, culminating in the formation of the §Y[katzen_civil_war_player.GetAdj] Katzimperium§!.\n\nThis triumphant new state, recently unburdened by its Katzen rivals and now armed with the economic powerhouse of Flusion, is ascendant in galactic affairs. The question now is what vision this reformed empire has for itself and the galaxy."
  giga_katzen.7024.noprovisional.desc:99 "With the destruction of all other belligerents of the Katzen Civil War, the §Y[katzen_civil_war_player.GetName]§! now stands as the supreme victor of the deadly feline civil conflict.\n\nAfter the civil conflict concluded, the victorious party underwent a national metamorphosis, culminating in the emergence of the §Y[katzen_civil_war_player.GetAdj] Katzimperium§!.\n\nThis triumphant new state, recently unburdened by its Katzen rivals and now armed with the economic powerhouse of Flusion, is ascendant in galactic affairs. The question now is what vision this reformed empire has for itself and the galaxy."
  giga_katzen.7024.a:99 "Please, no more..."
  giga_katzen.7024.b:99 "We shall see what path they take."
  giga_katzen.7024.c:99 "A righteous day in history."
  
  giga_katzen.7031.name:99 "Katzen Planetcraft Construction on Nesar!"
  giga_katzen.7031.desc:99 "The latest child of the Kaiser's love for engineering megaprojects is gestating on the magmatic world of §YNesar§!. We already know what it is; after all, it's hard to hide §Rturning an entire planet into a warship§!. Therefore, the Katzenartig Imperium has instead been loudly using this new megaproject as a unifying ambition, promising that the under-construction \"§YKaiserübermacht§!\" will be a leap forwards in Katzen history comparable to the completion of the old Kaiser Moon.\n\nOnce the new flagship comes online, the Kaiser Moon will become second-rate, but the model won't be obsolete - rather, §RKaiser Moons will enter general production§!, signifying new heights of Katzen military industry. However, there is a key distinction between the Kaiserübermacht's and old Kaiser Moon's roles: a theoretical defeat of the Kaiserübermacht §Rwill not plunge the Imperium into chaos§!. We expect that once the §BReformation§! has completed its administrative strengthening, nothing short of losing Flusion could decapitate the Kaiser's machine.\n\nIf we aim to defeat the Katzen threat, we likely §Ronly have a decade§! before the Kaiserübermacht is functional and the Kaiser's galactic conquest begins anew..."
  giga_katzen.7031.ally.desc:99 "The latest child of the Kaiser's love for engineering megaprojects is gestating on the magmatic world of §YNesar§!. We already know what it is; after all, it's hard to hide §Rturning an entire planet into a warship§!. Therefore, the Katzenartig Imperium has instead been loudly using this new megaproject as a unifying ambition, promising that the under-construction \"§YKaiserübermacht§!\" will be a leap forwards in Katzen history comparable to the completion of the old Kaiser Moon.\n\nOnce the new flagship comes online, the Kaiser Moon will become second-rate, but the model won't be obsolete - rather, §RKaiser Moons will enter general production§!, signifying new heights of Katzen military industry. However, there is a key distinction between the Kaiserübermacht's and old Kaiser Moon's roles: a theoretical defeat of the Kaiserübermacht §Rwill not plunge the Imperium into chaos§!. We expect that once the §BReformation§! has completed its administrative strengthening, nothing short of losing Flusion could decapitate the Kaiser's machine.\n\nFor those who aim to defeat the Imperium, they likely §Ronly have a decade§! before the Kaiserübermacht is functional and the Kaiser's galactic conquest begins anew..."
  giga_katzen.7031.a:99 "Oh no..."
  giga_katzen.7031.b:99 "Stop them now, while we still have time!"
  giga_katzen.7031.b.tooltip:99 "We will §Rdeclare war§! on the Katzenartig Imperium."
  giga_katzen.7031.c:99 "Glory to the Kaiser."
  
  giga_katzen.7032.name:99 "The Second Katzen Conquest"
  giga_katzen.7032.desc:99 "Katzen strategy is pivoting once again on Flusion - but this time, from internal affairs back to external. The administrative frenzy is winding down, and the warforges are winding up. Meanwhile, the Kaiser appears more secure than ever in his power. It seems the §BKatzen Reformation§! is complete - as is the mighty planetary warship once known as Nesar, now as the §IKaiserübermacht§!.\n\nThe Kaiser has vowed that the light of Katzen civilisation will shine from the depths of the Pawcific to the edge of the galaxy - and then, beyond. The §RSecond Katzen Conquest§! has begun."
  giga_katzen.7032.a:99 "So it begins again."
  giga_katzen.7032.a.tooltip:99 "§RThe Katzenartig Imperium has returned to its expansionistic behaviour. They will now construct additional Kaiser Moons and deploy stronger Mark II ships. The Kaiser Moon can no longer be sabotaged, nor will the Katzens enter Disarray if one is destroyed.§!"
  giga_katzen.7032.b:99 "Katzenkind marches forwards."
  
  ### Vassalhood events ###
  giga_katzen.7040.name:99 "A Patriotic Request"
  giga_katzen.7040.desc:99 "A group calling themselves the Citizens for the Kaiser have applied for a grant to fund a major pro-Katzen rally, stating their mission \"to affirm the enthusiasm of the [root.GetAdj] people for the Kaiser's great mission.\"\n\nWhile we are under no legal obligation to provide the funding, media outlets on Flusion are already praising the petitioners' patriotism, so the burden would be on our reputation if we chose to shut down the application. Additionally, unverifiable intelligence hints that there may be Flusionian agents among the organisers. If true, this situation is likely a ploy to force our hand into a display of fealty... And if not, well, the result is the same."
  giga_katzen.7040.a:99 "Sign off on the grant."
  giga_katzen.7040.b:99 "We won't budget for this."
  giga_katzen.7040.c:99 "Prosecute the organisers for treason."
  
  giga_katzen.7041.name:99 "Flusion's Floundering Finances"
  giga_katzen.7041.desc:99 "Recent news coverage from Flusion reports that a major construction company is on the verge of financial insolvency after a major city-building contract gone wrong, leaving hundreds of half-built structures with barely enough funding for critical maintenance. While this usually wouldn't concern us, the most recent news is that we're now a part of the story! The Flusionian administration is pressuring us to bail out the struggling company, which would put construction back on track.\n\nIf we can't or won't scrounge up the funds, the Flusionian liaisons are hinting that some of our Katzenartig trade zone privileges could be suspended..."
  giga_katzen.7041.a:99 "Find the funds."
  giga_katzen.7041.corporate.a:99 "A clever investment could partly fund itself..."
  giga_katzen.7041.b:99 "We aren't liable for Flusionian finances."
  
  giga_katzen.7042.name:99 "Flusiocratic Friction"
  giga_katzen.7042.desc:99 "The central government on Flusion has picked up on the not-insignificant rate of data-sharing mishaps between  itself and [root.GetCapitalName], blaming our bureaucracy which mostly uses our own processes rather than Katzenartig standard. Flusion is offering to fully pay for a standardisation and integration program that will give the Kaiser's officials smoother access to our data - which, they assure us, will be used to maximise the benefits of being part of the Imperium. We can choose to stick with our current processes, but Flusion has warned that our budget will have full responsibility from here on out for running so many duplicate processes."
  giga_katzen.7042.a:99 "A reasonable suggestion."
  giga_katzen.7042.b:99 "We know how to administrate ourselves."
  
  giga_katzen.7043.name:99 "[VassalEventTitleCultural]]"
  giga_katzen.7043.individualist.name:99 "Cultural Protection Demands"
  giga_katzen.7043.desc:99 "Ever since becoming a Katzenartig subject, all aspects of our culture have been undergoing \"Katzenification\" to better align with Imperium-decreed cultural norms. Recently though, discontent with these assimilation policies has been picking up steam: traditionalists and radical cultural reformers alike have put aside their differences to voice their shared anger against enforced Katzenification. Ignoring the dissenters will only intensify their resentment, but hearing them out would mean representing their issues to Flusion, which will not be happy to hear any of it..."
  giga_katzen.7043.a:99 "Ignore them. They'll get used to it."
  giga_katzen.7043.b:99 "Relay our population's concerns to Flusion."
  giga_katzen.7043.hive.name:99 "Collective Confusion"
  giga_katzen.7043.hive.desc:99 "Ever since becoming a Katzenartig subject, all aspects of our behaviour have been undergoing \"Katzenification\" to better slot the hive mind in alongside Imperium-decreed cultural norms. Recently though, the psychological costs of these assimilation policies have been surfacing: older drones birthed for pre-Katzen times or even just prior Katzen policies have been struggling to adapt their activities.\n\nTo handle this internally would unfortunately mean purging these drones before their malconformity becomes outright deviancy, but avoiding such an outcome would mean asking Flusion to slow down Katzenification to match our population replacement rate, which would not be a happily-received request..."
  giga_katzen.7043.hive.a:99 "Reprocess drones that fall behind pace."
  giga_katzen.7043.gestalt.b:99 "Request a slow-down to Katzenification."
  giga_katzen.7043.machine.name:99 "Unplanned Obsolescence"
  giga_katzen.7043.machine.desc:99 "Ever since becoming a Katzenartig subject, all aspects of our behaviour have been undergoing \"Katzenification\" to better slot the machine collective in alongside Imperium-decreed cultural norms. Recently though, the operating costs of these assimilation policies have been surfacing: older drones built for pre-Katzen times or even just prior Katzen policies require particular reprogramming to adjust their activities, and we cannot keep up the pace of updates.\n\nTo handle this internally would unfortunately mean dismantling these drones before their version incompatibility becomes outright deviancy, but avoiding such an outcome would mean asking Flusion to slow down Katzenification to match our standard update cycles, which would not be a happily-received request..."
  giga_katzen.7043.machine.a:99 "Dismantle drones that fall behind pace."
  
  giga_katzen.7044.name:99 "Flusion Proposes Exchange Program"
  giga_katzen.7044.desc:99 "The latest proposal from Flusion would see some aspects of our officials' training outsourced to academies in Katown and Bundengrad - no doubt to establish favourable contacts with our next generation of political elites and instil a deference for Katzen governance methods. While these elite schools are renowned for their practical exposure to high-level affairs, this program would mean relinquishing some of our control over our leaders' education.\n\nIf this cost is unacceptable, we could outright reject the proposal, but Flusion may retaliate by locking our leaders out of existing co-training programs. A more moderate way to retain control would be to send our officials to Flusion, but then re-run their training courses under our supervision to ensure our preferences win out. Or... we could simply comply."
  giga_katzen.7044.a:99 "We'll cooperate fully."
  giga_katzen.7044.b:99 "Run parallel domestic training."
  giga_katzen.7044.c:99 "Reject the exchange program entirely."
  
  giga_katzen.7045.name:99 "Propaganda Commissioned"
  giga_katzen.7045.desc:99 "The Katzenartig cultural bureau in Großlaurendaar is requesting our cooperation to run an information campaign extolling how submitting to the Kaiser has benefited [Root.GetAjd] society. While this messaging would be targeted towards those outside our borders, we have to consider the domestic perceptions: denigrating our past in this way would be an insult to those segments of our population that think life was better before the Katzens.\n\nPragmatically, however, the Katzenartig agency has indicated that the campaign will go ahead with or without our help, and if we aren't involved the portrayal of us may be even less flattering, upsetting our populace... The choice is lose-lose for us, but if we so desire, we can at least choose to lose standing up for our history and challenging the Katzens for control of the narrative."
  giga_katzen.7045.a:99 "It's best to have a seat at the table."
  giga_katzen.7045.b:99 "We won't sign off on lies about ourselves."
  
  giga_katzen.7046.name:99 "Katzen Joint Military Exercises"
  giga_katzen.7046.desc:99 "The latest round of the Katzenartig navy's Exercise Katzpazität is coming up, and this time, we've been nominated to host. For all the prestige we could gain, there is the simple fact of cost: Katzpazität is a serious event, and the strain hosting would put on our military infrastructure is hefty to match. Of course, turning down the opportunity - especially now that Katzenartig High Command has put the pressure on us by making our nomination public - could be interpreted as a lack of commitment to martial values: a very serious accusation for an Imperium territory.\n\nIt's likely that refusing to host would result in our military integration being leveraged for punishment, so we'll need to weigh up our response carefully with consideration of our current security situation."
  giga_katzen.7046.a:99 "Bring on Katzpazität."
  giga_katzen.7046.b:99 "Our logistics are simply unequipped to host."
  
  giga_katzen.7047.name:99 "[VassalEventTitleAcademic]"
  giga_katzen.7047.individualist.name:99 "Academic Overcompetence"
  giga_katzen.7047.desc:99 "A prominent team of sociologists recently authored a rather critical work on Katzen cultural assimilation. Despite the stir in academic circles, normally such a work wouldn't be worth our noting, but this one has drawn the ire of universities in Katown and Bundengrad. These reliably pro-Kaiser publishers aren't well-respected by our own sociologists, but they have too much influence to be dismissed, and are sending us a very clear message: either we bring our academics in line, or they cut our academics off."
  giga_katzen.7047.a:99 "Update research-ethics guidelines to ban disruptive papers."
  giga_katzen.7047.b:99 "We won't let our researchers be gagged."
  giga_katzen.7047.materialist.b:99 "An intolerable attack on knowledge."
  giga_katzen.7047.hive.name:99 "Intimidatingly-Large-Brain Drone" #not accepting complaints on this title at this time
  giga_katzen.7047.hive.desc:99 "A high-level cluster of sociology brain drones recently concluded a rather critical work on the efficiency of Katzen-vassal economic relations. Despite the valuable insights to us, normally such a work wouldn't be diplomatically relevant, but this one has drawn the ire of universities in Katown and Bundengrad. Our brain drones typically dismiss these reliably pro-Kaiser publishers, but they have too much influence for our diplomatic subnodes to dismiss, and are sending us a very clear message: either we change our research priorities, or they cut our research cooperation off."
  giga_katzen.7047.machine.name:99 "Superoptimal Subroutines"
  giga_katzen.7047.machine.desc:99 "A high-level circuit of sociology subroutines recently concluded a rather critical work on the efficiency of Katzen-vassal economic relations. Despite the valuable insights to us, normally such a work wouldn't be diplomatically relevant, but this one has drawn the ire of universities in Katown and Bundengrad. Our research subroutines typically dismiss these reliably pro-Kaiser publishers, but they have too much influence for our diplomatic subnodes to dismiss, and are sending us a very clear message: either we change our research priorities, or they cut our research cooperation off."
  giga_katzen.7047.gestalt.a:99 "Deprioritise any disruptive research going forwards."
  giga_katzen.7047.gestalt.b:99 "Truth is the collective's priority."
  
  giga_katzen.7048.name:99 "Katzgouverneur's Legitimacy Questioned"
  giga_katzen.7048.desc_opening:99 "Katzgouverneur [Root.GetRulerName], the figure sent to rule us from the Katzenartig Imperium, is struggling to exert their authority, undermining the efficacy of our government. It seems broad swathes of our society reject their right to rule over us, and are cooperating with orders very half-heartedly."
  giga_katzen.7048.democratic.desc:99 "$giga_katzen.7048.desc_opening$\n\nThere isn't much room in reality to deny that [Root.GetRulerName] lacks a democratic mandate, and Flusion would never let us take their leadership to the polls. The best we could do to fabricate some legitimacy is to downplay the extent of their power and shift some de facto-ceremonial elected subordinates into the spotlight... but can we really betray the spirit of our democratic traditions like that? If we can't, Flusion and the Katzgouverneur will simply have to work uphill through the public's anger."
  giga_katzen.7048.democratic.a:99 "Let the masses think they're in charge."
  giga_katzen.7048.democratic.b:99 "Transparency of power is non-negotiable."
  giga_katzen.7048.oligarchic.desc:99 "$giga_katzen.7048.desc_opening$\n\nOur traditional elites are chafing at their lost influence now that they have to work with a governor's rigid foreign loyalties rather than the familiar pliable figures of the past. If they begin to conspire openly with one another for their common interests, the governor's rule could be seriously weakened. The best way to avoid such a situation would be to manoeuvre the oligarchs against one another, thereby preventing the formation of a united front through paranoia and competition. Though that would undermine other aspects of our government, naturally..."
  giga_katzen.7048.oligarchic.a:99 "Adapting means playing power games."
  giga_katzen.7048.oligarchic.b:99 "We are built on oligarchic common interest."
  giga_katzen.7048.dictatorial.desc:99 "$giga_katzen.7048.desc_opening$\n\nThere are certain assumptions about how a [Root.GetAdj] dictator rules that [Root.GetRulerName] doesn't seem aware of, and there are certain deeply-rooted connections that [Root.GetRulerName] lacks. Our foreign-born ruler's unfamiliarity with our institutions makes them vulnerable. We could win favour with Flusion by assembling a team of advisors to solidify the Katzgouverneur's position... but is that what we really want to achieve?"
  giga_katzen.7048.dictatorial.a:99 "Stability demands a truly authoritative leader."
  giga_katzen.7048.dictatorial.b:99 "The true dictatorship will outlast this puppet."
  giga_katzen.7048.imperial.desc:99 "$giga_katzen.7048.desc_opening$\n\nThe simple fact is that the Katzgouverneur doesn't have the right background to sit in succession to the imperial line, and never will... unless we rewrite our society around them to metaphorically mould the throne into a Katzen shape. Of course, the cultural consequences of such a move are not to be taken lightly... nor are the consequences of letting a ruler without legitimacy retain power."
  giga_katzen.7048.imperial.a:99 "Who controls the present controls the past."
  giga_katzen.7048.imperial.b:99 "History will be moved past but never betrayed."
  giga_katzen.7048.corporate.desc:99 "$giga_katzen.7048.desc_opening$\n\nThe market's mood is shaky as investors scramble to handle the shocks of the constant decrees from the Kaiser's regulators. Private consultants are pitching a high-impact proposal to establish a dynamic response team that would keep innovators up-to-date with the regulatory environment... but lobbyists are up in arms over the costs of compliance on their profit margins, and advocating for a whole-of-market competitive escalation against Flusion's economic intervention."
  giga_katzen.7048.corporate.a:99 "Always take the cheapest path in the now."
  giga_katzen.7048.corporate.b:99 "Market principles come before everything."
  
  giga_katzen.7049.name:99 "Criminal Responsibility"
  giga_katzen.7049.desc:99 "A delegation of Katzen counterintelligence officers has suddenly descended on [Capital.GetName], claiming reason to believe that a notorious partisan group is operating in our territory to smuggle weapon components. They refuse to offer any evidence on the grounds that they don't know how just how compromised we are, yet are demanding a one-sided cooperation from our security forces to hand over... basically any intel requested. Due to the lack of sharing on their part, we can't even confirm if these partisans are real, or merely a fabrication for Katzenartig security agencies to gain leverage over our own.\n\nFor obvious reasons, opening so many holes in our intelligence networks is hugely risky - not to mention bureaucratically expensive - but if we refused to cooperate then the partisans turn out to be real and successfully carry out an attack against the Imperium... we can only imagine the Kaiser's wrath."
  giga_katzen.7049.a:99 "We can't risk harbouring partisans."
  giga_katzen.7049.b:99 "Minimal cooperation - protect our sources."
  giga_katzen.7049.b.tooltip:99 "§RThis may have unpredictable consequences in the near future.§!"
  
  giga_katzen.70491.name:99 "Territorial Violation"
  giga_katzen.70491.desc:99 "Our security forces on [katzen_partisan_raid_planet] were caught badly off guard when a modified Katzen transport decloaked in close proximity, and a flurry of spaceplanes and drop-pods descended on a region of the colony. In a lightning operation, these special forces overran a surprised nest of partisans in a brief but destructive firefight, then extracted with captured partisan fighters before we could mobilise a response.\n\nEvidently, the Katzens decided we weren't taking our counter-partisan cooperation seriously, and worked behind our back to take out the (evidently real) rebels... and now we're humiliated, left scrambling to clean up the consequences and explain to our people why we were caught unawares."
  giga_katzen.70491.gestalt.desc:99 "Our security forces on [katzen_partisan_raid_planet] were caught badly off guard when a modified Katzen transport decloaked in close proximity, and a flurry of spaceplanes and drop-pods descended on a region of the colony. In a lightning operation, these special forces overran a surprised nest of partisans in a brief but destructive firefight, then extracted with captured partisan fighters before we could mobilise a response.\n\nEvidently, the Katzens decided we weren't taking our counter-partisan cooperation seriously, and worked behind our back to take out the (evidently real) rebels... and in doing so, proved that the collective lacks awareness or control of affairs in our own territory."
  giga_katzen.70491.a:99 "We're not in the best position to object..."
  giga_katzen.70491.b:99 "Outrageous! OUTRAGEOUS!"
  
  giga_katzen.70492.name:99 "Atom Bombing in Katown!"
  giga_katzen.70492.desc:99 "Today began as a normal day on Flusion, but ended as one that history wouldn't forget. A firestorm of chaotic reports overran Katzenartig media controls, exposing to the galaxy footage of a Katown cityscape backlit by flames.\n\nThe intel is still coming in, but everything points to the detonation of a nuclear bomb, somehow, in an arms manufacturing precinct, with thousands of factory workers unaccounted for in the immediate aftermath. A partisan group has claimed responsibility for this \"tragic but necessary\" attack on the Katzen war machine - a group with a name we've heard mentioned recently..."
  giga_katzen.70492.a:99 "Oh... that - that group..."
