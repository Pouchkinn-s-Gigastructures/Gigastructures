  katzen_subversion_bureaucratic_imperium:99 "Bureaucratic Subversion"
  katzen_subversion_bureaucratic_imperium_desc:99 "Average project budget overrun"
  
  katzen_subversion_heavyhanded:99 "Clumsy Communications"
  katzen_subversion_heavyhanded_desc:99 "An abrasive information campaign here and a cultural blunder there can ensure the Kaiser's reforms go down like a lead balloon in the public eye."
  katzen_subversion_heavyhanded_gestalt:99 "Clumsy Communications"
  katzen_subversion_heavyhanded_gestalt_desc:99 "Filtering contradictory orders about the Kaiser's ordered reforms down to our drones will impede their productivity, but also burden Flusion's administrative liaisons."
  katzen_subversion_heavyhanded_imperium:99 "Clumsy Communications"
  katzen_subversion_heavyhanded_imperium_desc:99 "Brb firing the media bureau"
  
  katzen_subversion_unrest:99 "Apathetic Crackdown"
  katzen_subversion_unrest_desc:99 "Intentionally-incompetent security forces are only exacerbating protests against Katzen rule."
  katzen_subversion_unrest_imperium:99 "Apathetic Crackdown"
  katzen_subversion_unrest_imperium_desc:99 "Reisigerkatzenpanzer Man is blocking the road smh"
  katzen_subversion_unrest_gestalt:99 "Unhampered Deviancy"
  katzen_subversion_unrest_gestalt_desc:99 "We are deliberately failing to rein in deviant cells who have concluded that overthrowing Katzen rule will protect the collective."
  katzen_subversion_unrest_gestalt_imperium:99 "Unhampered Deviancy"
  katzen_subversion_unrest_gestalt_imperium_desc:99 "Reisigerkatzenpanzer Man is blocking the road smh"
  
  katzen_subversion_rally_compliance:99 "Backing Rally"
  katzen_subversion_rally_compliance_desc:99 "We are funding a controversial rally organised in support of the Kaiser."
  katzen_subversion_rally_compliance_imperium:99 "Patriotic Rally"
  katzen_subversion_rally_compliance_imperium_desc:99 "He is the messiah!"
  katzen_subversion_rally_noncompliance:99 "Unsupportive State"
  katzen_subversion_rally_noncompliance_desc:99 "Pro-Kaiser are grumbling about our lack of support for their beliefs."
  katzen_subversion_rally_noncompliance_imperium:99 "Disunited Imperium"
  katzen_subversion_rally_noncompliance_imperium_desc:99 "He is not the messiah..."
  katzen_subversion_rally_severe_noncompliance:99 "Kaiserist Repression"
  katzen_subversion_rally_severe_noncompliance_desc:99 "Legal officials rushed to prosecute citizens for foreign loyalties after they tried to organise a pro-Kaiser rally. These judges have since been reprimanded for their obviously rogue actions, of course."
  katzen_subversion_rally_severe_noncompliance_imperium:99 "Resentful Imperium"
  katzen_subversion_rally_severe_noncompliance_imperium_desc:99 "Decisively messiahn't"
  katzen_subversion_building_compliance:99 "Credit Crunch"
  katzen_subversion_building_compliance_desc:99 "Our finances are under more strain than we budgeted for after bailout funds were sent to a Flusionian construction company."
  katzen_subversion_building_compliance_corporate:99 "$katzen_subversion_building_compliance$"
  katzen_subversion_building_compliance_corporate_desc:99 "Our finances are under more strain than we budgeted for after bailout funds were sent to a Flusionian construction company - though we have recovered a portion of the costs."
  katzen_subversion_building_compliance_imperium:99 "Coerced Liquidity"
  katzen_subversion_building_compliance_imperium_desc:99 "katzen_subversion_building_compliance_imperium_desc"
  katzen_subversion_building_noncompliance:99 "Financial Sanctions"
  katzen_subversion_building_noncompliance_desc:99 "Certain Katzen trade zone privileges have been temporarily revoked after we refused to bail out a Flusionian company."
  katzen_subversion_building_noncompliance_imperium:99 "Financial Woes"
  katzen_subversion_building_noncompliance_imperium_desc:99 "katzen_subversion_building_noncompliance_imperium_desc"
  katzen_subversion_standards_compliance:99 "Bureaucratic Restructuring"
  katzen_subversion_standards_compliance_desc:99 "The bureaucracy is undergoing a restandardisation to align with Katzenartig norms."
  katzen_subversion_standards_compliance_imperium:99 "Standardised Bureaucracy"
  katzen_subversion_standards_compliance_imperium_desc:99 "What the heck is a mile? We only use the superior metric, Kaiserometres"
  katzen_subversion_standards_noncompliance:99 "Parallel Bureaucracy"
  katzen_subversion_standards_noncompliance_desc:99 "We've chosen to bear the cost of maintaining a parallel bureaucratic standard to the one used on Flusion."
  katzen_subversion_standards_noncompliance_imperium:99 "Flusiocratic Friction"
  katzen_subversion_standards_noncompliance_imperium_desc:99 "Sunny Smiles is about to lose her house"
  katzen_subversion_cultural_compliance:99 "Cultural Unrest"
  katzen_subversion_cultural_compliance_desc:99 "Cultural traditionalists and radicals alike are upset about the enforcement of Katzen culture."
  katzen_subversion_cultural_compliance_hive:99 "Early Termination"
  katzen_subversion_cultural_compliance_hive_desc:99 "Drones that fall out of pace with Katzenification experience an early termination."
  katzen_subversion_cultural_compliance_machine:99 "$katzen_subversion_cultural_compliance_hive$"
  katzen_subversion_cultural_compliance_machine_desc:99 "$katzen_subversion_cultural_compliance_hive_desc$"
  katzen_subversion_cultural_compliance_imperium:99 "Rapid Katzenification"
  katzen_subversion_cultural_compliance_imperium_desc:99 "Superior Katzen government has ABOLISHED schedule overruns :)"
  katzen_subversion_cultural_noncompliance:99 "Cultural Advocacy"
  katzen_subversion_cultural_noncompliance_desc:99 "The populace's concern about the pace of Katzenification is being relayed to Flusion to defuse domestic tensions."
  katzen_subversion_cultural_noncompliance_gestalt:99 "Pragmatic Pace"
  katzen_subversion_cultural_noncompliance_gestalt_desc:99 "Developmental concerns about the pace of Katzenification are being relayed to Flusion to reduce domestic economic costs."
  katzen_subversion_cultural_noncompliance_imperium:99 "Delayed Katzenification"
  katzen_subversion_cultural_noncompliance_imperium_desc:99 "Inferior Katzen government suffered schedule overruns :("
  katzen_subversion_cultural_noncompliance_gestalt_imperium:99 "$katzen_subversion_cultural_noncompliance_imperium$"
  katzen_subversion_cultural_noncompliance_gestalt_imperium_desc:99 "$katzen_subversion_cultural_noncompliance_imperium_desc$"
  katzen_subversion_exchange_compliance:99 "Outsourced Leadership"
  katzen_subversion_exchange_compliance_desc:99 "Our leaders spent a portion of their training in Katzen institutions rather than our own, reducing the integration of our council."
  katzen_subversion_exchange_compliance_imperium:99 "Streamlined Education"
  katzen_subversion_exchange_compliance_imperium_desc:99 "We offer world-class education on how great the Kaiser is"
  katzen_subversion_exchange_noncompliance:99 "Doubled Training"
  katzen_subversion_exchange_noncompliance_desc:99 "Our leaders have to redo portions of their training in our own institutions after having learnt overlapping content in Katzen ones."
  katzen_subversion_exchange_noncompliance_imperium:99 "Conflicting Educations"
  katzen_subversion_exchange_noncompliance_imperium_desc:99 "2+2=4.5"
  katzen_subversion_exchange_severe_noncompliance:99 "Isolated Education"
  katzen_subversion_exchange_severe_noncompliance_desc:99 "Since we rejected a closer educational exchange program with Flusionian institutions, our leaders-in-training have instead been cut off."
  katzen_subversion_exchange_severe_noncompliance_imperium:99 "Rival Methodologies"
  katzen_subversion_exchange_severe_noncompliance_imperium_desc:99 "Most respectful academic disagreement"
  katzen_subversion_propaganda_compliance:99 "Insulting Representations"
  katzen_subversion_propaganda_compliance_desc:99 "Our government has cooperated in developing what many perceive as degrading lies about our history."
  katzen_subversion_propaganda_compliance_imperium:99 "Tales of Progress"
  katzen_subversion_propaganda_compliance_imperium_desc:99 "A rising Kaiser lifts all species"
  katzen_subversion_propaganda_noncompliance:99 "Humiliating Reputation"
  katzen_subversion_propaganda_noncompliance_desc:99 "The Katzens are publishing extremely crude propaganda that has given our culture a poor reputation."
  katzen_subversion_propaganda_noncompliance_imperium:99 "Dubious Achievements"
  katzen_subversion_propaganda_noncompliance_imperium_desc:99 "No trust me this is EXACTLY how it went"
  katzen_subversion_exercises_compliance:99 "Katzpazität Host"
  katzen_subversion_exercises_compliance_desc:99 "Our logistics are under strain as we host major military exercises with other Katzenartig navies."
  katzen_subversion_exercises_compliance_imperium:99 "Exercise Katzpazität"
  katzen_subversion_exercises_compliance_imperium_desc:99 "Colossus-measuring contest"
  katzen_subversion_exercises_noncompliance:99 "Strategic Overdependence Fee"
  katzen_subversion_exercises_noncompliance_desc:99 "Over-integration with Katzen military structures is now being leveraged to leave us exposed after we angered the central Katzen navy."
  katzen_subversion_exercises_noncompliance_imperium:99 "Missed Military Exercises"
  katzen_subversion_exercises_noncompliance_imperium_desc:99 "So which end is the barrel again?"
  katzen_subversion_sociology_compliance:99 "Chilling Effect"
  katzen_subversion_sociology_compliance_desc:99 "Our academics are scared to genuinely analyse Katzen society after the passing of dangerously-vague research-ethics guidelines."
  katzen_subversion_sociology_compliance_gestalt:99 "Forbidden Knowledge"
  katzen_subversion_sociology_compliance_gestalt_desc:99 "Studies into Katzen economic structures have been deprioritised to avoid any further insulting revelations."
  katzen_subversion_sociology_compliance_imperium:99 "Thought Leaders"
  katzen_subversion_sociology_compliance_imperium_desc:99 "Mm yes I am very clever only look at me"
  katzen_subversion_sociology_noncompliance:99 "Grants Embargo"
  katzen_subversion_sociology_noncompliance_desc:99 "Flusionian universities with deep pockets have placed an embargo on our research projects."
  katzen_subversion_sociology_noncompliance_gestalt:99 "$katzen_subversion_sociology_noncompliance$"
  katzen_subversion_sociology_noncompliance_gestalt_desc:99 "$katzen_subversion_sociology_noncompliance_desc$"
  katzen_subversion_sociology_noncompliance_imperium:99 "Challenged Consensus"
