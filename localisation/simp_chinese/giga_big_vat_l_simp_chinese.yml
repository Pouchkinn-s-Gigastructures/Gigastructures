  giga_maximum_mutation_title:0 "§c极限突变§!"
  giga_maximum_mutation_desc:0 "为了追求我们的基因天命，所有可能路径都必须纳入考虑，不论它们显得多么怪异而深奥。"
  
  giga_prethoryn_larvae:0 "突变幼虫"
  giga_prethoryn_larvae_desc_short:0 "一条蠕动的小幼虫。生长速度极快。可以被一脚踩碎。"
  giga_prethoryn_larvae_desc_details:99 ""
  
  giga_vat_maximum_mutation_1:0 "极限突变：始源型"
  giga_vat_maximum_mutation_2:0 "极限突变：毒烈型"
  giga_vat_maximum_mutation_3:0 "极限突变：金耀型"
  giga_vat_maximum_mutation_4:0 "极限突变：至高型"
  giga_vat_maximum_mutation_1_DESC:0 "开端至关重要，它将决定我们的突变会如何推进。这个项目能否像资助者所说那样结出硕果，只有时间能够证明。"
  giga_vat_maximum_mutation_2_DESC:0 "接下来的步骤与第一步同样重要。若地基不能层层垒高，又如何支撑起宫殿？"
  giga_vat_maximum_mutation_3_DESC:0 "任何项目都必须修订与复核。我们该如何改进设计？又能把哪些缺陷降到最低？现在正是让样本升向完美的时候。"
  giga_vat_maximum_mutation_4_DESC:0 "封顶石完成一切伟业，以免它在自身重量下崩塌。"
  
  giga_vat_events.100.name:0 "最大化突变"
  giga_vat_events.100.desc:0 "既然能够使用如此庞大而高效的克隆设备阵列，我们的科学家提出了一个相当古怪的想法：把帝国曾经收集到的每一种遗传材料样本，无论其来源为何，全部组合并诱导突变，会产生什么结果？这个想法固然怪异，却可能带来生物学进展；而该项目孕育出的生物，也许能在星际战争舞台上找到用途。"
  giga_vat_events.100.a:0 "还能出什么问题呢？"
  
  giga_vat_events.101.name:0 "始源型"
  giga_vat_events.101.desc:0 "初步成果颇有希望，[capital.GetName]上的科学家开始准备更大规模的实验。借助$name_the_vat$中广阔的实验设施，他们打算培育出一只护卫舰大小的样本。它的能力究竟会低于还是高于护卫舰，还有待观察。"
  giga_vat_events.101.a:99 "$INTRIGUING$"
  
  giga_vat_events.1011.name:0 "始源受孕"
  giga_vat_events.1011.desc:0 "我们看着它成长，看着它进食。整个过程中，只有愤怒、恐惧、挫败。我们不知道自己为何能感知它的情绪。它如此庞大，却仍然如此渺小，仍然惧怕着我们。它能在一瞬间碾碎我们或融化我们。它为什么害怕？是害怕它攻击我们后我们会对它做什么？还是害怕我们接下来会创造出什么？"
  giga_vat_events.1011.a:99 "$DISCONCERTING$"
  
  giga_vat_events.102.name:0 "毒烈型"
  giga_vat_events.102.desc:0 "始源型取得成功后，首席科学家提议进行一次更大的实验，目标尺寸相当于驱逐舰。团队中许多人对此持保留意见，但许可已经下达，进一步突变的工作也已经开始。"
  giga_vat_events.102.a:99 "$GOOD$"
  
  giga_vat_events.1021.name:0 "毒烈之力"
  giga_vat_events.1021.desc:0 "狂怒。所有情绪都屈居于暴力与愤怒的混合物之下。它猛烈撞击束缚装置，而正是这些装置阻止它将空间站撕碎。它撞击了数日，怒火难道永无止境？与此同时，我们感知到较小样本也发生了变化，它们同样混杂着愤怒与恐惧。它们似乎共享某种联系，远胜简单的亲缘纽带，仿佛它们都是某个更大有机体的一部分。"
  giga_vat_events.1021.a:99 "$DISTURBING$"
  
  giga_vat_events.103.name:0 "金耀型"
  giga_vat_events.103.desc:0 "自项目开始以来，我们的舰队司令和其他军事人员就对此表现出强烈兴趣。他们要求培育一种几乎拥有航母级能力的样本。驻守$name_the_vat$的许多科学家已经辞职或拒绝工作，但仍有少数人继续向完美迈进。"
  giga_vat_events.103.a:99 "$INCREDIBLE$"
  
  giga_vat_events.1031.name:0 "生物飞升"
  giga_vat_events.1031.desc:0 "又是狂怒。相比此前更加宏伟，撞击也更为猛烈。某一天，一切都停了下来。那天我们只感受到一种情绪：服从。他们做到了，他们控制住了自己创造出的这头桀骜生物。它臣服了，其他所有样本也随之臣服。不再有愤怒、恐惧或挫败，只有服从清晰透出。这个有机体接受了我们。"
  giga_vat_events.1031.a:99 "$ASTOUNDING$"
  
  giga_vat_events.104.name:0 "至高型"
  giga_vat_events.104.desc:0 "我们已经实现了完美，但如果还能更进一步呢？在达成伟大之后，是否仍有更多可能？团队中有人认为，为什么不尽可能攀得更高？如果成功，进化的最终一步或许就能实现。"
  giga_vat_events.104.a:99 "$UNDERSTOOD$"
  
  giga_vat_events.1041.name:0 "突变最大化"
  giga_vat_events.1041.desc:0 "终极生命体，我们美丽的样本，终于在我们面前被创造并实现了。它们的力量将使敌人在星海舞台上挑战我们之前三思。我们也从这个项目中获得了独特之物。我们的样本与我们之间存在一种联系，我们的心智与它们的心智交织成一个整体。如果这样的力量被释放到银河之中，没人知道会发生什么。整个项目期间，样本曾有过数次逃脱尝试。幸运的是，它们全都被消灭了。虽然仍有少数逃往了星系际空间。它们当然不会惹出什么麻烦。"
  giga_vat_events.1041.a:0 "当然……"
  
