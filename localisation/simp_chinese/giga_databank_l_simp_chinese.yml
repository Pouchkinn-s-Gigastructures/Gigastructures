  concept_giga_sr_amb_megaconstruction:99 "$giga_sr_amb_megaconstruction$"
  concept_giga_sr_amb_megaconstruction_desc:0 "£giga_sr_amb_megaconstruction£§H$giga_sr_amb_megaconstruction$§!代表能够承受惊人拉应力的先进材料，是建造最大型太空设施不可或缺的资源。\n\n我们的该资源收入越高，['concept_megastructures']建造速度就越快。它们会在所有正在建造的巨构建筑之间§H分摊§!，也就是说同时建造多个巨构建筑会§H降低§!总体建造速度。因此，它们相当于我们并行建造巨构建筑能力的“软”上限。\n\n此外，多数巨构建筑都有一定的该资源§H维护费§!，规模越大的巨构维护费越高。\n\n提高产量：\n- 建造£building£['building:building_giga_megaworkshop_hub']或£building£ ['building:building_giga_megaworkshop']\n- 在带有超抗拉材料矿藏的['concept_celestial_objects']上建造£mining_station£ ['concept_mining_stations']"
  
  concept_giga_sr_bulk_matter:99 "$giga_sr_bulk_matter$"
  concept_giga_sr_bulk_matter_desc:0 "£giga_sr_bulk_matter£§H$giga_sr_bulk_matter$§!代表从天体上采集的大量低价值未精炼材料，用作建造超大型['concept_megastructures']或模拟行星环境的巨构建筑时的填充物。\n\n它可以从§H小行星§!、§H岩石行星§!和§H气态巨行星§!采集，每1点['concept_planet_size']可获得§Y1§!£giga_sr_bulk_matter£§H$giga_sr_bulk_matter$§!。\n\n建造§H环形世界§!、§H套娃脑§!、§H$name_alderson$§!、§H伯奇世界§!、§H类星天陨§!、§H超大质量E.H.O.F.§!和§H尼科尔-戴森光束§!需要这种资源。\n\n§H月球宏观制造厂§!和§H贝希摩斯装配厂§!也会分别使用它来制造§H战争之月§!和§H贝希摩斯行星飞船§!。\n\n如果巨构建筑在建造过程中会§H移除行星§!，则该星系行星内含的£giga_sr_bulk_matter£§H$giga_sr_bulk_matter$§!会从初始建造阶段中§H抵扣§!。剩余部分会储存在星系恒星上方的§H行星物质缓存§!中，之后可以采集并取回其内容物。\n\n举例来说，如果一个星系含有§Y75§!£giga_sr_bulk_matter£，则通常需要§Y100§!£giga_sr_bulk_matter£的§H环形世界框架§!只需要§Y25§!£giga_sr_bulk_matter£。但是，如果该星系含有§Y150§!£giga_sr_bulk_matter£，则该巨构建筑的初始阶段不消耗£giga_sr_bulk_matter£，且§H缓存§!中会有§Y50§!£giga_sr_bulk_matter£可供采集。后续建造阶段不受此机制影响，仍需要已储存的£giga_sr_bulk_matter£。\n\n提高产量：\n- 对非恒星['concept_celestial_object']使用§H$decision_harvest_matter_for_planetary_printing$§!['concept_decision']，建造§H$moon_printer_orbital_mass_harvester_1$§!并拆解该行星，每§Y6§!个月产出§Y1§!£giga_sr_bulk_matter£§H$giga_sr_bulk_matter$§!。此过程无法停止，并最终会彻底§R移除§!该行星。\n- 对星系的['concept_star']选择该决议，即可在该['concept_system']内每颗行星上开始这一流程。"
  
