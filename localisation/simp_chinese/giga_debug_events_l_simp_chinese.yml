  giga_log.500.title:0 "可选数据日志"
  giga_log.500.desc:0 "感谢游玩《更多巨构》！\n\n过去，我们曾根据玩家反馈做出调整。随着我们继续努力把本模组做到最好，我们认为收集玩家数据对平衡决策会非常有价值。\n\n如果愿意，你可以启用日志功能，在使用“更多巨构”游玩时记录你的银河状态。游戏结束后，你可以将game.log文件和模组列表上传到链接<SOMEWHERE>中的调查表。日志记录可能会在每年年初造成少量卡顿。对此带来的不便，我们深表歉意。\n\n§H注意§!：由于日志文件的工作方式，每次打开《群星》时，你的日志文件都会被清空。你将无法发送或查看上一次会话的日志文件。\n\n§L更多巨构，或者任何《群星》模组，都没有能力存储你的数据并向任何地方发送遥测。发送给“更多巨构”或其开发团队任何成员的唯一数据，就是你自愿提供的数据。除非你自愿输入可识别数据，否则《群星》日志文件不包含可识别数据。§!"
  giga_log.500.a:0 "是，我想启用日志记录。"
  giga_log.500.b:0 "不，我不想启用日志记录。"
  
  
  