  giga_qso.008.name:0 "$name_quasistellar$：参数"
  giga_qso.008.desc:0 "在这里，你可以管理Q.S.O.本身的功率输出与消耗。\n\n提高Q.S.O.的§Y充能速率§!会提高其£giga_sr_quasaric_energy£§Y$giga_sr_quasaric_energy$§!产出，但代价是更高的£energy£§Y$energy$§!维护费。\n\n降低充能速率会减少其£giga_sr_quasaric_energy£§Y$giga_sr_quasaric_energy$§!产出，作为回报，Q.S.O.的£energy£§Y$energy$§!维护费会降低、归零，甚至转为£energy£§Y$energy$§!产出。\n\n你也可以将各种资源倾倒进下方的黑洞，例如£minerals£§Y$minerals$§!、£food£§Y$food$§!、£consumer_goods£§Y$consumer_goods$§!、£alloys£§Y$alloys$§!、£giga_sr_bulk_matter£§Y$giga_sr_bulk_matter$§!以及§R其他东西……§!，以快速获得少量£giga_sr_quasaric_energy£§Y$giga_sr_quasaric_energy$§!。"
  
  giga_qso.009.name:0 "$name_quasistellar$：资源倾倒"
  giga_qso.009.desc:0 "在这里，你可以将各种资源倾倒进下方的黑洞，例如£minerals£§Y$minerals$§!、£food£§Y$food$§!、£consumer_goods£§Y$consumer_goods$§!、£alloys£§Y$alloys$§!、£giga_sr_bulk_matter£§Y$giga_sr_bulk_matter$§!以及§R其他东西……§!，以快速获得少量£giga_sr_quasaric_energy£§Y$giga_sr_quasaric_energy$§!。"
  
  giga_qso.008.dump:0 "倾倒资源……"
  
