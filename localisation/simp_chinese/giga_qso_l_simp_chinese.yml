  qso_intensity_none:0 "类星天陨：非充能状态"
  qso_intensity_none_desc:0 "类星天陨没有进行充能，它的全部输出都被转换为能量币。"
  
  qso_intensity_minimal:0 "类星天陨：最低充能状态"
