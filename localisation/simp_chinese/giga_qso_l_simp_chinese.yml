  giga_qso.002.name:0 "类星天陨"
  giga_qso.002.desc:0 "这里是$name_quasistellar$的§E目标管理菜单§!，你可以根据各国对§Y[root.GetName]§!的关系选择目标国家。\n\n§R敌对§!目标通常包括：['concept_marauder_empires']、['concept_endgame_crises']以及正与我们交战的帝国。\n\n§Y中立§!目标通常包括：['concept_preftl_civilizations']，与我们和平但未与我们共享['concept_subject_agreement']、['concept_federation']或特定['concept_diplomatic_pacts']的帝国。\n\n§G友好§!目标包括：我国边境内的自有星系。"
  giga_qso.002.a:0 "§E目标选择§!"
  giga_qso.002.b:0 "敌对"
  giga_qso.002.c:0 "中立"
  giga_qso.002.d:0 "友好"
