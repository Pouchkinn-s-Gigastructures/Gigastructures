  giga_qso.005.desc:0 "请选择要瞄准的星系。"
  
  giga_qso.006.desc:0 "请选择Q.S.O.的瞄准模式。\n\n瞄准§Y星团§!会将该星系本身及所有相邻星系标记为摧毁目标。受$giga_fe_shield$或$d_maginot_subspace_disruptor$保护的相邻星系不会受到影响。\n\n瞄准§Y恒星系§!只会将该星系标记为摧毁目标，周边星系保持完整。\n§T当前已瞄准星系：§! §Y[root.giga_qso_targeted_systems]/4§!\n\n瞄准§Y行星§!会将选定行星标记为摧毁目标，星系本身保持完整。你最多可以同时瞄准跨越多个星系或帝国的§Y10§!颗行星。\n§T当前已瞄准行星：§! §Y[root.giga_qso_targeted_planets]/10§!"
  giga_qso.006.a:0 "瞄准星团"
  giga_qso.006.b:0 "瞄准恒星系"
  giga_qso.006.c:0 "瞄准一颗行星"
  
  giga_qso.007.desc:0 "请选择最多§Y10§!颗要瞄准的行星。这些行星不需要位于同一星系，甚至不需要属于同一帝国。\n\n§T当前已瞄准行星：§! §Y[root.giga_qso_targeted_planets]/10§!"
  giga_qso.0070.desc:0 "请确认要向指定星团开火。越过这一步后便无法回头，§R指定星团将被摧毁。§!"
  giga_qso.0071.desc:0 "请确认要向指定星系开火。越过这一步后便无法回头，§R指定星系将被摧毁。§!\n\n§T当前已瞄准星系：§! §Y[root.giga_qso_targeted_systems]/4§!"
  giga_qso.0072.desc:0 "请选择要停止瞄准的星系。\n\n§T当前已瞄准星系：§! §Y[root.giga_qso_targeted_systems]/4§!"
  giga_qso.0073.desc:0 "请确认要向指定行星开火。越过这一步后便无法回头，§R指定行星将被摧毁。§!\n\n§T当前已瞄准行星：§! §Y[root.giga_qso_targeted_planets]/10§!"
