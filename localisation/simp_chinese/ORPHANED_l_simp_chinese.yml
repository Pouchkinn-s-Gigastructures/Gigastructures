  trait_pc_alderson_slice_pc_preference:0 "行星计算机偏好"
  trait_pc_alderson_slice_pc_preference_desc:0 "§L气候偏好由基因水平决定，这是由世代进化或者人工操纵形成的。§!"
  trait_pc_alderson_slice_ecu_preference:0 "都市星球偏好"
  trait_pc_alderson_slice_ecu_preference_desc:0 "§L气候偏好由基因水平决定，这是由世代进化或者人工操纵形成的。§!"
  trait_pc_alderson_slice_hive_preference:0 "蜂巢偏好"
  trait_pc_alderson_slice_hive_preference_desc:0 "§L气候偏好由基因水平决定，这是由世代进化或者人工操纵形成的。§!"
  trait_pc_alderson_slice_machine_preference:0 "机械偏好"
  trait_pc_alderson_slice_machine_preference_desc:0 "§L气候偏好由基因水平决定，这是由世代进化或者人工操纵形成的。§!"
  building_giga_planetary_shield_generator_1:0 "超护盾防御屏障"
  building_giga_planetary_shield_generator_1_desc:0 "$building_giga_planetary_shield_generator_1$是传统行星护盾发生器的加强版，能为下方的行星提供更强的保护。"
  district_giga_alderson_city:0 "居住超区划"
  district_giga_alderson_city_plural:0 "居住超区划"
  district_giga_alderson_city_desc:0 "这里建造了大到匪夷所思的城市住房，向各个方向延伸了成千上万公里。"
  district_giga_alderson_nexus:0 "中枢超区划"
  district_giga_alderson_nexus_plural:0 "中枢超区划"
  district_giga_alderson_nexus_desc:0 "庞大、高效的区划填满了这一部分，并为子个体提供了他们在被部署到其工作任务之前得到保养和修理的地方。"
  district_giga_alderson_hive:0 "蜂房超区划"
  district_giga_alderson_hive_plural:0 "蜂房超区划"
  district_giga_alderson_hive_desc:0 "高耸的尖塔在这一部分延伸开来，这种尖塔让子工蜂在不工作时聚集起来，恢复活力并消耗营养。"
  district_giga_alderson_generator:0 "恒星发电超区划"
  district_giga_alderson_generator_plural:0 "恒星发电超区划"
  district_giga_alderson_generator_desc:0 "这里建造了巨大的恒星能电池板复合体，从恒星中生成不可计量的能量，以地下聚变反应堆作为补充。"
  district_giga_alderson_farming:0 "农业超区划"
  district_giga_alderson_farming_plural:0 "农业超区划"
  district_giga_alderson_farming_desc:0 "塔式种植与经典农田相结合的田园风光，占地广大。从集约式环境到自由放牧，牲畜的生活环境类型多样。这些过程多数是自动化的；对于一般农夫而言，动植物都可以变得相当危险。"
  district_giga_alderson_mining:0 "物质合成超区划"
  district_giga_alderson_mining_plural:0 "物质合成超区划"
  district_giga_alderson_mining_desc:0 "巨大的、完全由行星规模的变电站和复杂机械构成的景观，用于各种基本材料的合成。"
  district_giga_alderson_commercial:0 "商业超区划"
  district_giga_alderson_commercial_plural:0 "商业超区划"
  district_giga_alderson_commercial_desc:0 "民用工厂和基础设施填满了这个专注于贸易的超区划。"
  pc_alderson_slice_ecu:0 "都市奥尔德森盘"
  pc_alderson_slice_ecu_desc:0 "横跨恒星系的真正巨无霸城市。完全被都市工业的扩张所吞噬，这个奥尔德森片区表面可以承载难以计数的工业和人口。"
  pc_alderson_slice_hive:0 "蜂巢奥尔德森盘"
  pc_alderson_slice_hive_desc:0 "整个片区都是一个巨大的活体组织，通过灵能与将之塑成的蜂巢意志进行链接。任何踏足此地而不属于蜂巢一份子的存在都受到地形本身的攻击。"
  pc_alderson_slice_machine:0 "机械奥尔德森盘"
  pc_alderson_slice_machine_desc:0 "被人造结构覆盖。稀薄大气主要由工业污染物组成，无法支持生物生命。"
  pc_alderson_slice_pc:0 "奥尔德森计算复合体"
  pc_alderson_slice_pc_desc:0 "一个真正巨大的计算综合体，类似于行星计算复合体，但却绵延在整个奥尔德森片区上。它的处理能力难以估量，并为研究提供不可思议的加成。还是带不动孤岛危机。"
  tech_giga_planetary_shield_generator_1:0 "超护盾防御屏障"
  tech_giga_planetary_shield_generator_1_desc:0 "$tech_giga_planetary_shield_generator_1$是传统护盾发生器的加强版，能够为下方的行星提供更强的保护。"
  district_giga_alderson_industrial:0 "工业超区划"
  district_giga_alderson_industrial_plural:0 "工业超区划"
  district_giga_alderson_industrial_desc:0 "完全由真正巨大的超级轨道，巨型机甲，以及难以置信的工厂组成的景观。普通工人在此没有立足之地。"
  giga_dialog.2501.title:0 "奥尔德森片区特化"
  giga_dialog.2501.desc:0 "是时候决定将这一超区段升级为何种奥尔德森片区了。在超区段完成后，可通过环境改造修改类型。"
  giga_dialog.2505.title:0 "奥尔德森计算复合体完成！"
  giga_dialog.2505.desc:0 "$name_alderson$其中的一个片区终于完工！这个巨大的居住区横跨了数个天文单位，可为我们的人口与工业提供难以计数的活动空间。这一片区完全由强大的计算机与处理器层层覆盖，能够为科研人员提供近乎无限的算力，并无延迟访问帝国知识数据库。这个强大的建筑一定能帮我们远比以往更轻松地堪破宇宙奥秘。"
  giga_dialog.2505.a:0 "真了不起！那它能跑得动孤岛危机吗？"
  giga_dialog.2505.a.tooltip:0 "不能。"
  giga_dialog.2506.title:0 "理想城奥尔德森片区完成！"
  giga_dialog.2506.desc:0 "$name_alderson$其中的一个片区终于完工！这个巨大的居住区横跨了数个天文单位，将为我们的人口与工业提供难以计数的活动空间。这个片区完全被城市工业的扩张覆盖，为市民提供了大量的工业产能与住房。"
  giga_dialog.2506.a:0 "棒极了！"
  giga_dialog.25061.title:0 "蜂巢奥尔德森片区完工！"
  giga_dialog.25061.desc:0 "$name_alderson$其中的一个片区终于完工！这个巨大的居住区横跨了数个天文单位，将为我们的人口与工业提供难以计数的活动空间。这个片区是一个巨大的有机体，与塑造它的蜂巢思维通过灵能连接。任何不属于蜂群的物种踏足这里都会受到地形本身攻击。"
  giga_dialog.25061.a:0 "棒极了！"
  giga_dialog.25062.title:0 "机械奥尔德森片区完工！"
  giga_dialog.25062.desc:0 "$name_alderson$其中的一个片区终于完工！这个巨大的居住区横跨了数个天文单位，将为我们的人口与工业提供难以计数的活动空间。这个片区完全被人工结构覆盖，稀薄的大气主要由工业污染物组成，无法支持有机生命体。"
  giga_dialog.25062.a:0 "棒极了！"
