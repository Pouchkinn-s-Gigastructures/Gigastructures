  aeternum_buff_2:0 "青色永世增益"
  aeternum_buff_2_desc:0 "他们那边拥有动漫的力量！"
  the_vat_menu_desc_01:0 "---------------------------------------------------------------"
  the_vat_menu_desc_02:0 "这个巨·舱本质上是个生物船坞。"
  the_vat_menu_desc_03:0 "同一时间内每个舱仅能生长一种事物。"
