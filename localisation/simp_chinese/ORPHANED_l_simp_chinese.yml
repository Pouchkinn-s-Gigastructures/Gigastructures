l_simp_chinese:
  # These entries were in the previous [simp_chinese] loc files but are not present in the current [english] files.
  giga_dialog.4003.name:0 "$name_terraform_molten$完工！"
  giga_dialog.4003.desc:0 "我们的$name_terraform_molten$现在完工了。使用三个巨大的超大规模冷却光束和激光钻机，我们将能够同时冷却和稳定这个星球的地热活动。现在，我们必须开始真正的地貌改造过程了。"
  giga_dialog.4003.a:0 "我们应该立刻这样做。"
  terraform_molten_2:0 "$name_terraform_molten$"
  terraform_molten_2_DESC:0 "一个完整的$name_terraform_molten$，配备了一组巨大的轨道冷却装置和激光钻机，来冷却并稳定星球的表面。现在唯一剩下要做的就是开始实际地貌改造过程。"
  terraform_molten_3:0 "开始地貌改造"
  terraform_molten_3_DESC:0 "命令$name_terraform_molten$团队开始改造这颗星球的熔融表面和地壳构造，使之变成某种适宜大多数生命生存的形式。"
  giga_dialog.3803.name:0 "$name_terraform_barren$大气生成器完工"
  giga_dialog.3803.desc:0 "$name_terraform_barren$的大气生成器刚刚完工。这个包住荒芜星球的巨大网格能够产生大量的大气，还能在未来调整这个星球的气候。\n现在唯一剩下要做的就是实际开始地貌改造过程。"
  giga_dialog.3803.a:0 "很好。"
  terraform_barren_2:0 "$name_terraform_barren$"
  terraform_barren_2_DESC:0 "$name_terraform_barren$现在配备了很多的大气操纵装置，可以在这个星球的表面散播水和一个可呼吸的大气圈。唯一还需要做的就是开始这个过程了。"
  terraform_barren_3:0 "开始地貌改造"
  terraform_barren_3_DESC:0 "命令$name_terraform_barren$团队开始重新活化星球磁场的大规模过程，并随后产生一个可呼吸的大气圈和一个稳定的水圈。"
  giga_dialog.3903.name:0 "$name_terraform_toxic$宏观操纵器完工"
  giga_dialog.3903.desc:0 "$name_terraform_toxic$的宏观稳定器已经完工！它们由两个巨大的泵组成，能够从行星大气中抽出和注入大量的气体。\n\n随着$name_terraform_toxic$完成，我们现在必须开始进行地貌改造过程本身了……"
  giga_dialog.3903.a:0 "好极了。"
  terraform_toxic_2:0 "$name_terraform_toxic$宏观操纵器"
  terraform_toxic_2_DESC:0 "这个$name_terraform_toxic$已经配备了两个巨大的泵，能够操纵星球的大气层，使它变得密度更高或者密度更小，以及重新分配它的组成气体。"
  terraform_toxic_3:0 "开始地貌改造"
  terraform_toxic_3_DESC:0 "命令大气操纵器团队开始改造这颗行星的大气圈和水圈，使之成为某种适宜大多数生命体生存的形式。"
  giga_dialog.3502.name:0 "$name_crystal_megabore$主要结构建造完成"
  giga_dialog.3502.desc:0 "我们的工程师已经完成了[giga_system.GetName]星系中$name_crystal_megabore$主要枢纽的建设。这个巨大的空间站环绕着一个熔融星球运行，里面有熔炉和精炼厂，专门把熔融的岩石提纯成稀有的晶体，如果我们想要有效地开采下面的世界，这是必不可少的。"
  giga_dialog.3502.a:0 "很好。"
  giga_dialog.3503.name:0 "$name_crystal_megabore$重力发生器完工"
  giga_dialog.3503.desc:0 "我们$name_crystal_megabore$的重力发生器已经完工！这个大型结构完全环绕着巨型钻探装置的核心，并将为其提供能量。它还将作为巨型钻探装置的主钻机的触媒，大幅度提升其引力牵引光束的强度。"
  giga_dialog.3503.a:0 "棒极了。"
  crystal_megabore_2:0 "$name_crystal_megabore$重力发生器"
  crystal_megabore_2_DESC:0 "重力发生器在开采下方行星的过程中扮演着至关重要的角色，因为它提供能量，还充当了钻探装置的主钻的触媒。"
  district_giga_gas_giant_habitat_hive:0 "$district_hive$"
  district_giga_gas_giant_habitat_hive_plural:0 "$district_hive_plural$"
  district_giga_gas_giant_habitat_hive_desc:0 "$district_hive_desc$"
  district_giga_gas_giant_habitat_nexus:0 "$district_nexus$"
  district_giga_gas_giant_habitat_nexus_plural:0 "$district_nexus_plural$"
  district_giga_gas_giant_habitat_nexus_desc:0 "$district_nexus_desc$"
  giga_toxic_god:0 "毒圣"
  giga_toxic_god_plural:0 "毒圣"
  giga_dialog.401.name:0 "$name_eng_test_site$基址"
  giga_dialog.401.desc:0 "大型$name_eng_test_site$的基址已在[giga_system.GetName]星系完工。建成后，这座瑰丽的空间站是测试从轨道站到新宇宙飞船等诸多工程设计的好地方。它环绕的行星将成为突破性工程的试验场。"
  giga_dialog.401.a:0 "做得好。"
  giga_dialog.402.name:0 "$name_eng_test_site$建造"
  giga_dialog.402.desc:0 "建于[giga_system.GetName]星系的$name_eng_test_site$现在可以运行了。它将成为工程师对飞船、建筑等最复杂、致命设计的实验场。实验已经在行星上开始，我们可以期待不久的将来会有更多实验，极大促进我们的工程研究。"
  giga_dialog.402.a:0 "优秀。"
  giga_dialog.404.name:0 "$name_eng_test_site$修复完成！"
  giga_dialog.404.desc:0 "我们的工程队伍已经修复了之前被毁的$name_eng_test_site$。\n\n它目前完全可运行，可以用于开展科研。"
  giga_dialog.404.a:0 "优秀。"
  giga_tech_planetary_matter_harvesting:0 "超高效岩土拆卸"
  giga_tech_planetary_matter_harvesting_desc:0 "为了装配我们自己的天体战舰，我们需要数量巨大的原料行星物质。利用廉价和快速建造的引力牵引光束，我们可以在几个月内字面意义上地拆除整个行星。由于不需要提炼物质，这个过程非常迅速，行星可以被简单地分解为小行星，然后被运到我们需要的地方。"
  alderson_disk_2_ecu:0 "普世奥尔德森片区"
  alderson_disk_2_ecu_DESC:0 "巨大的$name_alderson$片区，沿各个方向一直延伸到恒星系的边缘。它类似一座巨大的城市，可以容纳极为庞大的工业和人口。\n\n特化区划产出£consumer_goods£§Y消费品§!、£alloys£§Y合金§!与£amenities£§Y舒适度§!"
  alderson_disk_2_hive:0 "蜂巢奥尔德森片区"
  alderson_disk_2_hive_DESC:0 "巨大的$name_alderson$片区，沿各个方向一直延伸到恒星系的边缘。它类似一座巨大的城市，可以容纳极为庞大的工业和子个体。\n\n特化区划产出£minerals£§Y矿物§!!与£alloys£§Y合金§!"
  alderson_disk_2_machine:0 "机械奥尔德森片区"
  alderson_disk_2_machine_DESC:0 "巨大的$name_alderson$片区，沿各个方向一直延伸到恒星系的边缘。它类似一座巨大的城市，可以容纳极为庞大的工业和人口。\n\n特化区划产出£minerals£§Y矿物§!!与£alloys£§Y合金§!"
  alderson_disk_2_pc:0 "奥尔德森计算复合体"
  alderson_disk_2_pc_DESC:0 "巨大的$name_alderson$片区，沿各个方向一直延伸到恒星系的边缘。足以容纳难以计数的算力。\n\n特化区划产出£physics££society££engineering£§Y研究点数§!与£unity£§Y凝聚力§!"
  district_giga_birch_ktisma_refinery:0 "精炼区划"
  district_giga_birch_ktisma_refinery_plural:0 "精炼区划"
  district_giga_birch_ktisma_refinery_desc:0 "专用于生产战略资源的巨大设施。"
  district_giga_birch_physma_trade:0 "贸易论坛"
  district_giga_birch_physma_trade_plural:0 "贸易论坛"
  district_giga_birch_physma_trade_desc:0 "商业基础设施充斥着这一区划，交易大厅内活动不断。"
  district_giga_birch_physma_bureaucratic:0 "官僚复合体"
  district_giga_birch_physma_bureaucratic_plural:0 "官僚复合体"
  district_giga_birch_physma_bureaucratic_desc:0 "成千上万的行政人员辛勤工作，以满足不断扩大的官僚机构日益增长的期望。"
  district_giga_birch_physma_temple:0 "神庙群"
  district_giga_birch_physma_temple_plural:0 "神庙群"
  district_giga_birch_physma_temple_desc:0 "礼拜场所及其配套基础设施充斥着这个区划，致力于我们帝国的精神福祉。"
  district_giga_birch_physma_relay:0 "中继复合体"
  district_giga_birch_physma_relay_plural:0 "中继复合体"
  district_giga_birch_physma_relay_desc:0 "来自中央意识的信号在这个巨大的信号处理中心在被传输前清理过滤掉噪音。"
  district_giga_birch_physma_sanctuary:0 "有机庇护所"
  district_giga_birch_physma_sanctuary_plural:0 "有机庇护所"
  district_giga_birch_physma_sanctuary_desc:0 "宽敞的生活区，有机体可以以愉快、充实和——最重要的——可控的方式生活。"
  job_nanotech_researcher_icon:0 "£job_nanotech_researcher£"
  job_nanotech_research_unit_icon:0 "£job_nanotech_research_unit£"
  job_giga_virtual_livestock_effect_desc:0 "£job_giga_virtual_livestock£$job_giga_virtual_livestock_plural$产出£food£§Y$food$§!（或£minerals£§Y$minerals$§!）和£unity£§Y$unity$§!，同时减少整颗行星的£mod_energy_upkeep_mult£§Y$mod_planet_pops_energy_upkeep_mult$§!和£mod_energy_upkeep_mult£§Y$mod_planet_jobs_energy_upkeep_mult$§!"
  job_giga_virtual_organic_battery_effect_desc:0 "£job_giga_virtual_organic_battery£$job_giga_virtual_organic_battery_plural$人口产出£energy£§Y$energy$§!和£unity£§Y$unity$§!同时减少整颗行星的£mod_energy_upkeep_mult£§Y$mod_planet_pops_energy_upkeep_mult$§!和£mod_energy_upkeep_mult£§Y$mod_planet_jobs_energy_upkeep_mult$§!"
