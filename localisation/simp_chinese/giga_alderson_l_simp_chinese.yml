  job_ald_matter_synthesizer_drone_plural:0 "奥尔德森物质生成子个体"
  job_ald_matter_synthesizer_drone_desc:0 "大量用能源产生矿物的子个体。尽管这个过程需要海量的能量和大量的空间，但它还是做到了。"
  mod_job_ald_matter_synthesizer_drone_add:0 "$job_ald_matter_synthesizer_drone$岗位"
  
