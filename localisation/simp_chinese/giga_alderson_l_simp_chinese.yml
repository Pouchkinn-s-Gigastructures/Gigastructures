  giga_situation_alderson_primitives:0 "破碎区段"
  giga_situation_alderson_primitives_type:99 "$giga_situation_alderson_primitives$"
  giga_situation_alderson_primitives_monthly_change_tooltip:0 "此局势的进展取决于我们选择的§Y方针§!。"
  giga_situation_alderson_primitives_desc:0 "$name_alderson$的三个宜居区段中，有两个由前FTL异星文明控制。如果我们想将整座盘体置于掌控之下，就必须处理他们。"
  giga_situation_alderson_primitives_stage_1:0 "吞并 - 准备"
  giga_situation_alderson_primitives_stage_2:0 "吞并 - 执行"
  giga_situation_alderson_primitives_outcome:0 "盘体上的其他片区将被纳入我们的直接控制。"
  
  giga_situation_alderson_primitives_approach_nothing:0 "放任不管"
  giga_situation_alderson_primitives_approach_nothing_tooltip:0 "什么也不会发生。"
  giga_situation_alderson_primitives_approach_annex:99 "[GetAldersonAnnexationApproachNameFlavor]"
  giga_situation_alderson_primitives_approach_annex_generic:0 "渗透领导层"
  giga_situation_alderson_primitives_approach_annex_diplomatic:0 "和平整合"
  giga_situation_alderson_primitives_approach_annex_military:0 "入侵领土"
  giga_situation_alderson_primitives_approach_annex_worker_coop:0 "重组经济"
  giga_situation_alderson_primitives_approach_annex_shared_burden:0 "煽动革命"
  giga_situation_alderson_primitives_approach_annex_dystopian_society:0 "强制等级秩序"
  giga_situation_alderson_primitives_approach_annex_corporate:0 "支配市场"
  giga_situation_alderson_primitives_approach_annex_technocracy:0 "理性化政府"
  giga_situation_alderson_primitives_approach_annex_machine_servitor:0 "展示另一种选择"
  giga_situation_alderson_primitives_approach_annex_tooltip:99 "[GetAldersonAnnexationApproachDescFlavor]"
  giga_situation_alderson_primitives_approach_annex_tooltip_generic:0 "我们将渗透他们文明的权力中枢。"
  giga_situation_alderson_primitives_approach_annex_tooltip_diplomatic:0 "我们将通过外交努力深化整合。"
  giga_situation_alderson_primitives_approach_annex_tooltip_military:0 "我们将以地面部队夺取他们的领土。"
  giga_situation_alderson_primitives_approach_annex_tooltip_worker_coop:0 "我们将赋权劳动者，让他们以民主方式掌控自己的工作场所。"
  giga_situation_alderson_primitives_approach_annex_tooltip_shared_burden:0 "我们将启迪人民，让他们掌握解放自身的工具。"
  giga_situation_alderson_primitives_approach_annex_tooltip_dystopian_society:0 "我们将教会他们服从的价值，然后索取这种服从。"
  giga_situation_alderson_primitives_approach_annex_tooltip_corporate:0 "我们将用自己的子公司取代他们的经济。"
  giga_situation_alderson_primitives_approach_annex_tooltip_technocracy:0 "我们将向他们展示由最能干者治理的理性。"
  giga_situation_alderson_primitives_approach_annex_tooltip_machine_servitor:0 "我们将向他们展示幸福，他们会主动走向我们。"
  giga_situation_alderson_primitives_progress:0 "渗透工作"
  
  giga_alderson.002.name:0 "继承权问题"
  giga_alderson.002.desc:0 "我们早已知道，[Root.Capital.GetName]的相邻区段上生活着异星文明；而既然我们已经控制了[Root.Capital.Solar_System.GetName]的太空航道，所有权这种理论问题，如今也进入了政策可以触及的范围。\n\n这些文明，即[excognitor_primitives.GetName]和[dominion_primitives.GetName]，大致处于$machine_age$阶段，但发展已经停滞。原因或许是他们相对分裂，也可能是他们的世界观在面对奥尔德森古代科技时形成了某种迟滞。我们不知道他们是退化到当前状态后稳定下来，还是在近代有所进步但随后停滞。\n\n无论如何，他们合计控制着奥尔德森剩余宜居面积的大约三分之二，经济与科技能力都逊于我们，也不太可能主动改变现状。主动权在我们手里。"
  giga_alderson.002.a.generic:0 "渗透并吞并他们的社会。"
  giga_alderson.002.a.diplomatic:0 "我们可以通过外交实现联合。"
  giga_alderson.002.a.military:0 "以武力索取我们的继承权。"
  giga_alderson.002.a.worker_coop:0 "劳动者经济可以与我们的体制协同。"
  giga_alderson.002.a.shared_burden:0 "革命将会传播。"
  giga_alderson.002.a.dystopian_society:0 "给他们带去应有的秩序。"
  giga_alderson.002.a.corporate:0 "主权同样有市场价值。"
  giga_alderson.002.a.technocracy:0 "理性化他们的道路。"
  giga_alderson.002.a.machine_servitor:0 "用受宠生活吸引他们。"
  giga_alderson.002.a.tooltip:0 "§Y这将决定我们今后的行动方式。它§R不会§!设置局势方针，之后记得打开局势管理界面。\n在更受限制的$policy_interference$政策下，我们§R可能无法推进§!该局势。"
  giga_alderson.002.a.refuse:0 "放弃所有此类计划。"
  giga_alderson.002.a.refuse.tooltip:0 "§Y我们仍可根据$policy_interference$政策正常取得控制权，但会失去所有独特吞并路线的机会。§!"
  
  giga_alderson.004.name:0 "区段统一！"
  giga_alderson.004.desc:99 "[GetAldersonAnnexationOutcomeDescFlavor]"
  giga_alderson.004.desc.opening:0 "今天，我们的雄心又向实现迈出了一步。如今已不再有任何模糊之处：属于已灭亡执行帝国与疆域部落的奥尔德森区段，已经由我们掌控。"
  giga_alderson.004.desc.generic:0 "$giga_alderson.004.desc.opening$\n\n在一场三方仪式上，原始国家的领袖一致提出条约，将自身并入[Root.GetName]。尽管实际上我们早已在牵动线绳，但这会启动向我们移交权力的正式程序。他们现在已经没有退路。"
  giga_alderson.004.desc.diplomatic:0 "$giga_alderson.004.desc.opening$\n\n在一片盛大欢庆中，执行与疆域政府承认[Root.GetName]是所有区段的唯一主权权威。这一期待已久的事件，是一系列文化、法律、经济与战略合作条约的最终成果。如今，我们已不可逆转地承诺以一体之姿面对未来。"
  giga_alderson.004.desc.military:0 "$giga_alderson.004.desc.opening$\n\n我们的地面部队报告，对原始文明的军事行动已成功结束。受争议区段庞大规模的帮助，他们的军队进行了漫长抵抗，但我们更优越的通信与后勤让胜利成为必然。任何残余据点都将在短时间内被肃清，使我们能够毫无阻碍地执行政策。"
  giga_alderson.004.desc.worker_coop:0 "$giga_alderson.004.desc.opening$\n\n近年来，我们的特工在其他区段的劳动者-消费者之中播下了集体所有制与经济民主的思想。虽然这一运动在早期需要我们扶持，但当地人很快就凭自己的热情承担起任务。\n\n在一段狂热的文化改革、罢工与消费者行动时期之后，自由组织的合作劳动原则如今已在奥尔德森所有区段乃至整个社会中占据主导。"
  giga_alderson.004.desc.shared_burden:0 "$giga_alderson.004.desc.opening$\n\n在其他区段受压迫的群众之中，口号、符号，以及最重要的革命梦想无处不在。火花燃起时，烈焰高涨、迅疾而猛烈：我们的战友以正义怒火解放了他们在奥尔德森上的区段。\n\n之后，在可靠而坚定的平等主义者领导下，他们与我们自由社会携手同行自然是水到渠成。"
  giga_alderson.004.desc.dystopian_society:0 "$giga_alderson.004.desc.opening$\n\n教会他们尊重社会秩序绝非易事。自命不凡的群众用典型而粗俗的暴力回应我们的教导，迫使我们介入以保护更体面的阶层。在[root.GetAdj]安保专家的协助下，当地精英恢复了法律与秩序，并铲除了那些煽动者使三个区段共同陷入危险的叛徒。\n\n如今，一个安全与正义统治全星系的新时代已经到来，强有力的手将确保和平再也不会受到威胁。"
  giga_alderson.004.desc.corporate:0 "$giga_alderson.004.desc.opening$\n\n每家商店都有[Root.GetAdj]产品，每个董事会都有[Root.GetAdj]成员，每家上市公司都有[Root.GetAdj]控股股份，每位监管者的听觉受体旁都有[Root.Species.GetAdj][Root.Species.GetMouthName]。一笔又一笔交易让我们的长期投资开花结果，今天，我们在两个文明中都占据了垄断地位，而金钱就是权力。\n\n最终，他们移交主权不过是承认现实而已。"
  giga_alderson.004.desc.technocracy:0 "$giga_alderson.004.desc.opening$\n\n在我们的指导下，这些落后文明获得了越来越合理、有序的政府。起初我们的行动相当含蓄，因为我们担心启蒙换来的会是不理性的情绪反弹。幸运的是，原始文明已经学会尊重知识权威，也就是尊重我们，这正是智慧文明的另一个关键特质。他们决定把自己置于我们更优越的管理之下，只是合乎逻辑的结果。"
  giga_alderson.004.desc.machine_servitor:0 "$giga_alderson.004.desc.opening$\n\n利用有机体管理不善区段上的糟糕组织能力，我们建立了一张外展护理设施网络，有机体可以按意愿自由来去。随着消息传播，越来越多有机体选择投身安逸生活。当地领袖的权威随之蒸发，因为他们徒劳地下令继续过艰苦生活。\n\n厚实软垫安全子个体现在已经无害化了最后一批有机体，他们曾在争取“基本自治权”的暴力斗争中冒着伤害自己的风险。因此，正式终结原始文明幼稚的“国家治理”游戏已经没有必要。"
  giga_alderson.004.a:0 "[Root.Capital.GetStarName]的光芒下实现了统一。"
  
  #Approach-dependent 10y planetary modifiers
  alderson_annexed_diplomatic:0 "乐观时代精神"
  alderson_annexed_diplomatic_desc:0 "民众充满了关于乌托邦未来的构想。"
  alderson_annexed_military:0 "经受考验的治安"
  alderson_annexed_military_desc:0 "战时威胁侦测与响应网络很容易改造为打击帮派的系统。"
  alderson_annexed_worker_coop:0 "蓬勃流通"
  alderson_annexed_worker_coop_desc:0 "稳定就业增强了消费者信心，支出正在激增。"
  alderson_annexed_shared_burden:0 "解放狂潮"
  alderson_annexed_shared_burden_desc:0 "一场热烈的艺术辩论正在展开，挑战社会规范。"
  alderson_annexed_dystopian_society:0 "公民卫生"
  alderson_annexed_dystopian_society_desc:0 "一场有力运动正在教导平民关于忠诚的事宜。"
  alderson_annexed_corporate:0 "两头下注"
  alderson_annexed_corporate_desc:0 "当子公司彼此竞争时，我们永远在赢家队伍里。"
  alderson_annexed_technocracy:0 "唯物主义确信"
  alderson_annexed_technocracy_desc:0 "科学是善的力量，这被视为不可证伪的真理。"
  alderson_annexed_machine_servitor:0 "缺乏想象的标准"
  alderson_annexed_machine_servitor_desc:0 "这个世界的有机体还不习惯索取我们能提供的一切。"
  
  
  
