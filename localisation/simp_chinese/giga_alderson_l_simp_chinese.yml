  #########################################
  
  building_automation_1_giga:0 "巨构自动化建筑"
  building_automation_1_giga_desc:0 "墙上有一块城市大小的牌匾，上面写着：“它会自动化。”"
  mod_building_automation_1_giga_max:0 "最大巨构自动化建筑"
  
  building_automation_2_giga:0 "巨构优化建筑"
  building_automation_2_giga_desc:0 "它真的会优化吗？"
  mod_building_automation_2_giga_max:0 "最大巨构优化建筑"
  
  building_automation_1_giga_alderson_tooltip:0 "每个自动化区划的建筑维护费：§R£energy£+$@automation_district_upkeep_1_alderson$§!"
  building_automation_2_giga_alderson_tooltip:0 "每个自动化区划的建筑维护费：§R£energy£+$@automation_district_upkeep_2_alderson$§!"
  
  
  district_alderson_logistics:0 "后勤超区划"
  district_alderson_logistics_desc:0 "这些后勤区划坐落于奥尔德森片区的框架与壁层之内，容纳了该结构的大量管理系统，同时监督并优化其内外运作。"
  district_alderson_logistics_plural:0 "后勤超区划"
  district_alderson_gaia:0 "盖亚超区划"
  district_alderson_gaia_desc:0 "规模令人难以置信的田园自然广袤地域，面积堪比整个恒星系，已准备好进行轻度城市或工业开发。"
  district_alderson_gaia_plural:0 "盖亚超区划"
  district_alderson_hive:0 "蜂巢超区划"
  district_alderson_hive_desc:0 "规模令人难以置信的蜂巢化地貌广袤地域，面积堪比整个恒星系，已准备好进行轻度城市或工业开发。"
  district_alderson_hive_plural:0 "蜂巢超区划"
  district_alderson_machine:0 "机械超区划"
  district_alderson_machine_desc:0 "规模令人难以置信的机械化地貌广袤地域，面积堪比整个恒星系，已准备好进行轻度城市或工业开发。"
  district_alderson_machine_plural:0 "机械超区划"
  district_alderson_ecu:0 "理想城超区划"
  district_alderson_ecu_desc:0 "以天文单位计量的面积被各种城市工业蔓延所吞没，其产能足以超过整个恒星系。"
  district_alderson_ecu_plural:0 "理想城超区划"
  district_alderson_pcc:0 "计算超区划"
  district_alderson_pcc_desc:0 "这是一座真正庞大的计算复合体，类似于行星级计算机，但延展覆盖了整个奥尔德森片区。它拥有不可估量的处理能力，并为研究提供惊人的增益。仍然跑不了《孤岛危机》。"
  district_alderson_pcc_plural:0 "计算超区划"
  
  zone_alderson_energy:0 "太级电容阵列"
  zone_alderson_energy_desc:0 "从物理定律允许的范围内榨出每一丝能量。"
  zone_alderson_food:0 "奥尔德森超级农场"
  zone_alderson_food_desc:0 "每片田野都能吞下数个世界，却在起伏的日光下安静生长。"
  zone_alderson_housing:0 "居住枢纽"
  zone_alderson_housing_desc:0 "无穷无尽的宽敞住房，足以容纳整个银河的智慧生命。人在其中走上一千年，可能仍在同一条街上。"
  zone_alderson_minerals:0 "整体物质合成器"
  zone_alderson_minerals_desc:0 "通过大规模运用质能等价原理，将整个月球分量的物质召入现实。"
  
  zone_alderson_alloys:0 "超重型熔炉"
  zone_alderson_alloys_desc:0 "这些熔炉宏伟庞大，足以将整艘战列舰一体铸造成型。"
  zone_alderson_cg:0 "超重型制造厂"
  zone_alderson_cg_desc:0 "数十亿平方公里完全用于生产流行商品。它几乎快到能跟上现代潮流。"
  zone_alderson_factory:0 "巨域制造厂"
  zone_alderson_factory_desc:0 "智慧心智曾经设计过的任何固态物品，都能在这数百万、数十亿座高耸排气烟囱之间的某个地方找到。别问具体在哪。"
  zone_alderson_fortress:0 "恒星壁垒"
  zone_alderson_fortress_desc:0 "由堡垒与军营组成的不可穿透网络，维持着比整颗星球人口还多的军队。"
  
  zone_alderson_research_physics:0 "恒星粒子加速器"
  zone_alderson_research_physics_desc:0 "寻找越来越好的方法，让粒子加速得越来越快。"
  zone_alderson_research_society:0 "社会超级模拟器"
  zone_alderson_research_society_desc:0 "以智慧生命清洁设备中处理速度的十六万亿倍，模拟社会与生物互动。"
  zone_alderson_research_engineering:0 "巨构工程研究节点"
  zone_alderson_research_engineering_desc:0 "用巨大的东西研究如何建造更巨大的东西。"
  zone_alderson_research:0 "恒星计算复合体"
  zone_alderson_research_desc:0 "徒劳地尝试运行《孤岛危机》。"
  zone_alderson_unity:0 "官僚巨处理器"
  zone_alderson_unity_desc:0 "无尽成排的处理器专门用于处理数字文书。"
  zone_alderson_unity_spiritualist:0 "圣化巨神殿"
  zone_alderson_unity_spiritualist_desc:0 "无穷无尽的礼拜建筑点缀着地景，朝圣者与崇拜者的队列一直延伸到地平线。"
  zone_alderson_unity_servitor:0 "有机体巨庇护所"
  zone_alderson_unity_servitor_desc:0 "无尽成排的摩天大楼塞满了智慧有机体，他们在完美环境中获得所需的一切奢侈享受。"
  zone_alderson_trade:0 "生态物流全域预测机"
  zone_alderson_trade_desc:0 "过劳处理器为我们整个帝国处理后勤与经济预测。"
  
  zone_alderson_housing_optimization:0 "住房优化"
  zone_alderson_housing_optimization_desc:0 "逐个公民地解决如此庞大结构上住房分配不可避免的低效问题。"
  zone_alderson_infrastructure_optimization:0 "基础设施优化"
  zone_alderson_infrastructure_optimization_desc:0 "研究怎样才能不花费太秒级时间，把太吨级货物跨越太米级距离运走。"
  zone_alderson_pop_growth:0 "人口优化"
  zone_alderson_pop_growth_desc:0 "监督并优化行为、社会与生物模式。"
  
  pc_alderson_slice_gaia_shattered:0 "破碎的超区段"
  pc_alderson_slice_gaia_shattered_desc:0 "一个失效的、巨大的奥尔德森盘世界区段"
  pc_alderson_slice_gaia_shattered_adj:0 "快去Giga Discord的general-talk频道发表这个！"
  
