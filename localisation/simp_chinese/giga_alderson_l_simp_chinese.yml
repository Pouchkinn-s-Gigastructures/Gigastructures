  job_ald_supergenerator:0 "奥尔德森技工"
  job_ald_supergenerator_plural:0 "奥尔德森技工"
  job_ald_supergenerator_desc:0 "大量维持电力生产的管理员和工人。他们维修面积比整个星球还要大的面板和任何其他地方都不可能有的反应堆。"
  mod_job_ald_supergenerator_add:0 "$job_ald_supergenerator$岗位"
  
  job_ald_supergenerator_drone:0 "奥尔德森科技子个体"
  job_ald_supergenerator_drone_plural:0 "奥尔德森科技子个体"
  job_ald_supergenerator_drone_desc:0 "大量维持电力生产的子个体。它们维修巨大的面板和反应堆。"
  mod_job_ald_supergenerator_drone_add:0 "$job_ald_supergenerator$岗位"
  
  # farmers
  job_ald_superfarmer:0 "超规模农民"
  job_ald_superfarmer_plural:0 "超规模农民"
  job_ald_superfarmer_desc:0 "大量维护动植物的管理员和工人。其中的一些动植物足以支持一家人取用数月之久。"
  mod_job_ald_superfarmer_add:0 "$job_ald_superfarmer$岗位"
  
  job_ald_superfarmer_drone:0 "奥尔德森农业子个体"
  job_ald_superfarmer_drone_plural:0 "奥尔德森农业子个体"
  job_ald_superfarmer_drone_desc:0 "大量维护动植物的子个体。其中一些需要巨大的空间，但产量极高。"
  mod_job_ald_superfarmer_drone_add:0 "$job_ald_superfarmer_drone$岗位"
  
  # exotic gas refiners
  job_ald_gases:0 "精炼厂专家"
  job_ald_gases_plural:0 "精炼厂专家"
  job_ald_gases_desc:0 "一大群管理员和技工监督着大规模的精炼厂。理论上来说，这些建筑将使我们能够用稀有气体取代整个大气层。"
  mod_job_ald_gases_add:0 "$job_ald_gases$岗位"
  
  job_ald_gases_drone:0 "奥尔德森精炼子个体"
  job_ald_gases_drone_plural:0 "奥尔德森精炼子个体"
  job_ald_gases_drone_desc:0 "一大堆专注于监管庞大的精炼厂群的子个体。这些精炼厂在稀有气体方面的产量超越了整颗星球所能生产的量。"
  mod_job_ald_gases_drone_add:0 "$job_ald_gases_drone$岗位"
  
  # volatile motes chemists
  job_ald_motes:0 "超规模化学家"
  job_ald_motes_plural:0 "超规模化学家"
  job_ald_motes_desc:0 "一大群管理员和技工监督着大规模的化工厂。这些设施能在短时间内转化一个星球的质量。"
  mod_job_ald_motes_add:0 "$job_ald_motes$岗位"
  
  job_ald_motes_drone:0 "奥尔德森化合子个体"
  job_ald_motes_drone_plural:0 "奥尔德森化合子个体"
  job_ald_motes_drone_desc:0 "一大群子个体监督着大规模的化工厂。其消耗的材料数量很快就能与整个行星的质量相媲美。"
  mod_job_ald_motes_drone_add:0 "$job_ald_motes_drone$岗位"
  
  # rare crystal translucers
  job_ald_crystals:0 "水晶监督者"
  job_ald_crystals_plural:0 "水晶监督者"
  job_ald_crystals_desc:0 "一大群管理员和技工监督着大量的工厂。其中单个工厂的规模大到让大多数城市感到羞愧。"
  mod_job_ald_crystals_add:0 "$job_ald_crystals$岗位"
  
  job_ald_crystals_drone:0 "奥尔德森透镜子个体"
  job_ald_crystals_drone_plural:0 "奥尔德森透镜子个体"
  job_ald_crystals_drone_desc:0 "一大群子个体专门负责监督大规模的工厂。这种尺寸的工厂只能被建造在奥尔德森盘区上。"
  mod_job_ald_crystals_drone_add:0 "$job_ald_crystals_drone$岗位"
  
  # metallurgists
  job_ald_hyperfoundry:0 "超规模金属工匠"
  job_ald_hyperfoundry_plural:0 "超规模金属工匠"
  job_ald_hyperfoundry_desc:0 "巨型铸造厂里的一大群冶金师。他们身着制服，运用巨大的工具来制造大量的珍贵合金。"
  mod_job_ald_hyperfoundry_add:0 "$job_ald_hyperfoundry$岗位"
  
  job_ald_hyperfoundry_drone:0 "奥尔德森铸造子个体"
  job_ald_hyperfoundry_drone_plural:0 "奥尔德森铸造子个体"
  job_ald_hyperfoundry_drone_desc:0 "负责运转巨型铸造厂的一大群子个体。由他们所精炼的金属是建筑物的命脉。"
  mod_job_ald_hyperfoundry_drone_add:0 "$job_ald_hyperfoundry_drone$岗位"
  
  # artisans
  job_ald_hyperfactorio:0 "超规模工匠"
  job_ald_hyperfactorio_plural:0 "超规模工匠"
  job_ald_hyperfactorio_desc:0 "巨型工厂中的大群工人。他们使用极其庞大的工具，生产出数量多到难以置信的奢侈品和消费品。"
  mod_job_ald_hyperfactorio_add:0 "$job_ald_hyperfactorio$岗位"
  
  job_ald_hyperartificer:0 "大匠师"
  job_ald_hyperartificer_plural:0 "大匠师"
  job_ald_hyperartificer_desc:0 "庞大工厂中的一大群极有天赋的匠师。他们将普通消费品改造为奇迹。"
  mod_job_ald_hyperartificer_add:0 "$job_ald_hyperartificer$岗位"
  
  job_ald_hyperfactorio_drone:0 "奥尔德森工匠子个体"
  job_ald_hyperfactorio_drone_plural:0 "奥尔德森工匠子个体"
  job_ald_hyperfactorio_drone_desc:0 "庞大工厂中工作的一大群子个体。他们生产出值得“生命”继续活下去的商品。"
  mod_job_ald_hyperfactorio_drone_add:0 "$job_ald_hyperfactorio_drone$岗位"
  
  # researchers
  job_ald_megascience:0 "智库"
  job_ald_megascience_plural:0 "智库"
  job_ald_megascience_desc:0 "由一群最聪明的人组成的巨大团体。尽管不总能达成一致，但他们无疑都在为科学做出贡献。"
  mod_job_ald_megascience_add:0 "$job_ald_megascience$岗位"
  
  job_ald_megascience_mind:0 "心灵链接"
  job_ald_megascience_mind_plural:0 "心灵链接"
  job_ald_megascience_mind_desc:0 "一大群合作无间的子个体。它们正为科学贡献自己的一切精神力量。"
  mod_job_ald_megascience_mind_add:0 "$job_ald_megascience_mind$岗位"
  
  job_ald_megascience_robot:0 "奥尔德森神经网络"
  job_ald_megascience_robot_plural:0 "奥尔德森神经网络"
  job_ald_megascience_robot_desc:0 "一大群合作无间的子个体。它们每秒都在进行数不胜数的运算。"
  mod_job_ald_megascience_robot_add:0 "$job_ald_megascience_robot$岗位"
  
  # duelist only
  job_ald_duelists:0 "娱乐营地"
  job_ald_duelists_plural:0 "娱乐营地"
  job_ald_duelists_desc:0 "使用整个营地宽广的开放空间提供娱乐。庞大的规模让核武器都可以用于表演。"
  mod_job_ald_duelists_add:0 "$job_ald_duelists$岗位"
  
  # not used
  job_ald_duelist_effect_desc:0 "£job_duelist£$job_ald_duelists_plural$把£alloys£§Y$alloys$§!转变为£unity£§Y$unity$§!，£mod_planet_amenities_add£§Y$PLANET_AMENITIES_TITLE$§!和£mod_country_naval_cap_add£§Y$MOD_COUNTRY_NAVAL_CAP_ADD$§!"
  
  # priests
  job_ald_priest:0 "大祭司"
  job_ald_priest_plural:0 "大祭司"
  job_ald_priest_desc:0 "庞大的演讲者和信众网络。神父们为维护传统和核心信仰而不懈努力。"
  mod_job_ald_priest_add:0 "$job_ald_priest$岗位"
  
  job_ald_deathpriest:0 "流逝祭司"
  job_ald_deathpriest_plural:0 "流逝祭司"
  job_ald_deathpriest_desc:0 "一个由冷酷的传教士和信众组成的庞大网络。这些祭司为人们祈祷到最后一刻，确保人们的牺牲不会白费。"
  mod_job_ald_deathpriest_add:0 "$job_ald_deathpriest$岗位"
  
  # culture workers
  job_ald_cultureworker:0 "奥尔德森文化专家"
  job_ald_cultureworker_plural:0 "奥尔德森文化专家"
  job_ald_cultureworker_desc:0 "产生、表演并再现艺术的完整剧团。展示历史的博物馆。最终比我们历史上的整个城市还要庞大的艺术展览。"
  mod_job_ald_cultureworker_add:0 "$job_ald_cultureworker$岗位"
  
  job_ald_corpmanager:0 "地区经理"
  job_ald_corpmanager_plural:0 "地区经理"
  job_ald_corpmanager_desc:0 "大批的中层管理人员。他们无情地竞争，以看到自己的那片奥尔德森盘带来最大的收入。"
  mod_job_ald_corpmanager_add:0 "$job_ald_corpmanager$岗位"
  
  job_ald_memorialist:0 "静谧书吏"
  job_ald_memorialist_plural:0 "静谧书吏"
  job_ald_memorialist_desc:0 "致力于泛星系的延续和永恒的众多个体。他们使用自己的空间重塑古代的城市和地标，以更好地理解他们所研究的事物。"
  mod_job_ald_memorialist_add:0 "$job_ald_memorialist$岗位"
  
  # merchants
  job_ald_merchant:0 "贸易大亨"
  job_ald_merchant_plural:0 "贸易大亨"
  job_ald_merchant_desc:0 "巨量精明的销售人员能够在午餐前售出整个星球上的所有物资。他们控制着大部分的土地与其易手。"
  mod_job_ald_merchant_add:0 "$job_ald_merchant$岗位"
  
  
  
  
