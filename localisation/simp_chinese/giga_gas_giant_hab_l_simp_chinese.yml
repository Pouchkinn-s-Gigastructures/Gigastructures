  job_giga_gas_extraction_manager_drone_desc:0 "由于大气富集或其他异星环境特性，这些管理者会确保我们的$job_technician_drone_plural$最大限度地开发这些资源。"
  giga_gas_extraction_manager_drone_wilderness_desc:0 "这些翱翔生物会根据大气变化释放气载激素，向附近的$job_photosymbiont_plural$传递环境条件信号。"
  job_giga_gas_extraction_manager_drone_wilderness_desc:99 "$giga_gas_extraction_manager_drone_wilderness_desc$"
