  district_giga_gas_giant_habitat_science_wilderness:0 "神经蒸汽结"
  district_giga_gas_giant_habitat_science_wilderness_plural:0 "神经蒸汽结"
  district_giga_gas_giant_habitat_science_wilderness_desc:0 "电化学和生物性的思维流在此处风涌中交汇，以思想相互授粉。"
  
