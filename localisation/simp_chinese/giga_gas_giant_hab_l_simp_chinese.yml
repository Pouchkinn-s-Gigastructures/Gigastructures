l_simp_chinese:
  
  giga_gas_giant_home_system_NAME:0 "气态巨星家园"
  giga_gas_giant_home_system_DESC:0 "在一个宜居气态巨行星上开局，你原来的母星已经毁灭。"
  origin_gas_giant:0 "气态巨行星起航"
  origin_gas_giant_desc:0 "在这个物种的太空时代早期，一颗巨大的彗星撞上了他们的母星，致使他们失去了家园。值得幸庆的是，他们已经在太空中建立了足够的设施，从而避免了整个种族的灭亡。一颗气态巨行星——其大气层异常平静，被他们用于开采燃料——成为了他们的主要殖民地。"
  origin_gas_giant_robot:0 "气态巨行星升空"
  origin_gas_giant_robot_desc:0 "在这个帝国的早期太空时代，它们的母星遭到一颗流浪彗星撞击。由于它们已经拥有足以暂时维生的太空基础设施，一座气态巨行星采矿站成为了它们的新家。多年来，这颗气态巨行星反复满足了它们的需求，也让它们对银河中存在的各种气体有了新的认识。由于该帝国发展过程中异星天然气极为丰富，利用这些气体的改良工业技术已得到完善，只是连最基础的工业都需要依赖这些气体。"
  
  origin_gas_giant_effects:0 "在一个$pc_habitable_gas_giant$上开局，你的原始母星已经被毁灭。\n——获得£engineering_research£ §L$tech_space_mining_1$§!科技。\n——如果帝国有生物人口，获得£society_research£ §L$tech_hydroponics$§!科技。"
  origin_gas_giant_effects_robot:0 "- $HOMEWORLD$ ['concept_giga_habitable_gas_giant']（规模：£planetsize£ 16-28）$NEW_LINE$- 物种特质：$TABBED_NEW_LINE$- ['trait:trait_giga_gas_giant_hab_robot']$NEW_LINE$- $ADDITONAL_TECHNOLOGIES_STRING$ ['technology:tech_space_mining_1', £engineering_research£ $tech_space_mining_1$]"
  
  concept_giga_habitable_gas_giant:99 "$pc_habitable_gas_giant$"
  concept_giga_habitable_gas_giant_desc:99 "$pc_habitable_gas_giant_desc$"
  
  concept_giga_gas_worlds:0 "气态世界"
  concept_giga_gas_worlds_desc:0 "宜居气态巨行星、大气经过人工气体充盈的行星，甚至一些略微更适宜居住的剧毒世界，都归类为“气态世界”。"
  
  building_giga_gas_giant_habitation_module:0 "气态巨星居住模块"
  building_giga_gas_giant_habitation_module_desc:0 "用于在气态巨行星上维持一个殖民地所需的设施的集合，该殖民地由原属于这个行星的人口组成。这些设施包括了为殖民地供能的反应堆，卸下采集自当地卫星的矿物的太空港，以及可以被用于水培农场的大型气候控制库。此外，这些设施还作为资源分配网络的总部，为当地人口提供多种服务。"
  
  trait_giga_gas_giant_hab:0 "异星天然气依赖"
  trait_giga_gas_giant_hab_desc:0 "§L数百年来生活在气态巨行星上并暴露于异星天然气中，使该物种的日常机能在一定程度上依赖这些气体。§!"
  trait_giga_gas_giant_hab_tooltip:0 "§Y科研§!和§Y工业§!岗位异星天然气维护费：§R+0.03§!\n    - ['concept_giga_gas_worlds', §Y气态§!]世界上的住房使用：§G-10%§!\n    - ['concept_giga_gas_worlds', §Y气态§!]世界上的£job_researcher£$job_researcher$维护费：§G-10%§!\n    - ['concept_giga_gas_worlds', §Y气态§!]世界上的岗位异星天然气维护费：§G-33%§!\n    - 非['concept_giga_gas_worlds', §Y气态§!]世界上的住房使用：§R+30%§!\n    - 非['concept_giga_gas_worlds', §Y气态§!]世界上的宜居度：§R-20%§!\n    - 非['concept_giga_gas_worlds', §Y气态§!]世界上的岗位异星天然气维护费：§R+50%§!"
  trait_giga_gas_giant_hab_robot:0 "异星天然气驱动"
  trait_giga_gas_giant_hab_robot_desc:0 "§L随时间积累的微小自我改造，使这些机械几乎依赖异星天然气作为燃料。§!"
  trait_giga_gas_giant_hab_robot_tooltip:99 "$trait_giga_gas_giant_hab_tooltip$"
  
  giga_gas_giant_hab_colony_tt:0 "对气态巨行星升空物种视为['concept_giga_gas_worlds', §Y气态§!]世界。"
  
  giga_gas_giant_hab_colony:0 "充盈大气"
  giga_gas_giant_hab_colony_desc:0 "这里浓厚的大气成分与气态巨行星上的大气颇为相似。"
  
  decision_giga_flood_atmosphere:0 "充盈行星大气"
  decision_giga_flood_atmosphere_desc:0 "我们将修改大气成分，使其适合我们的生理机能。"
  
