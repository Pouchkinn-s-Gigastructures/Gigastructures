l_french:
  
  giga_gas_giant_home_system_NAME:0 "Foyer de la géante gazeuse"
  giga_gas_giant_home_system_DESC:0 "Démarrez sur une géante gazeuse habitable avec votre monde natal d'origine détruit."
  origin_gas_giant:0 "Décollage depuis la géante gazeuse"
  origin_gas_giant_desc:0 "Durant l'ère spatiale primitive de cet empire, leur monde natal fut frappé par une comète errante. Possédant déjà suffisamment d'infrastructures spatiales pour survivre temporairement, une station minière sur une géante gazeuse devint leur nouveau foyer. Au fil des années, la géante gazeuse a comblé leurs besoins bien au-delà de leurs attentes, apportant de nouvelles perspectives sur les différents gaz présents dans la galaxie. En raison de l'abondance de gaz exotiques durant le développement de cet empire, des techniques industrielles améliorées utilisant ces gaz ont été perfectionnées, bien qu'avec une dépendance à ces gaz même pour l'industrie la plus élémentaire."
  origin_gas_giant_robot:0 "Décollage depuis la géante gazeuse"
  origin_gas_giant_robot_desc:0 "Durant l'ère spatiale primitive de cet empire, leur monde natal fut frappé par une comète errante. Possédant déjà suffisamment d'infrastructures spatiales pour survivre temporairement, une station minière sur une géante gazeuse devint leur nouveau foyer. Au fil des années, la géante gazeuse a comblé leurs besoins bien au-delà de leurs attentes, apportant de nouvelles perspectives sur les différents gaz présents dans la galaxie. En raison de l'abondance de gaz exotiques durant le développement de cet empire, des techniques industrielles améliorées utilisant ces gaz ont été perfectionnées, bien qu'avec une dépendance à ces gaz même pour l'industrie la plus élémentaire."
  
  origin_gas_giant_effects:0 "- $HOMEWORLD$ ['concept_giga_habitable_gas_giant'] (Taille : £planetsize£ 16-28)$NEW_LINE$- Trait d'espèce :$TABBED_NEW_LINE$- ['trait:trait_giga_gas_giant_hab']$NEW_LINE$- $ADDITONAL_TECHNOLOGIES_STRING$$TABBED_NEW_LINE$- ['technology:tech_space_mining_1', £engineering_research£ $tech_space_mining_1$]$TABBED_NEW_LINE$- ['technology:tech_hydroponics', £society_research£ $tech_hydroponics$]"
  origin_gas_giant_effects_robot:0 "- $HOMEWORLD$ ['concept_giga_habitable_gas_giant'] (Taille : £planetsize£ 16-28)$NEW_LINE$- Trait d'espèce :$TABBED_NEW_LINE$- ['trait:trait_giga_gas_giant_hab_robot']$NEW_LINE$- $ADDITONAL_TECHNOLOGIES_STRING$ ['technology:tech_space_mining_1', £engineering_research£ $tech_space_mining_1$]"
  
  concept_giga_habitable_gas_giant:0 "$pc_habitable_gas_giant$"
  concept_giga_habitable_gas_giant_desc:0 "$pc_habitable_gas_giant_desc$"
  
  concept_giga_gas_worlds:0 "Monde gazeux"
  concept_giga_gas_worlds_desc:0 "Les géantes gazeuses habitables, les planètes à l'atmosphère artificiellement saturée de gaz, et même certains mondes toxiques légèrement plus habitables sont catégorisés comme « Mondes gazeux »."
  
  building_giga_gas_giant_habitation_module:0 "Module d'habitation pour géante gazeuse"
  building_giga_gas_giant_habitation_module_desc:0 "Ensemble d'installations nécessaires au maintien d'une colonie sur une géante gazeuse, assemblé par la population d'origine de cette planète. Ces installations comprennent des réacteurs pour alimenter la colonie en énergie, des baies d'amarrage pour décharger les minéraux collectés sur les lunes locales, et de vastes hangars climatisés pouvant servir de fermes hydroponiques. En outre, ces installations servent de quartier général au réseau de distribution des ressources et fournissent divers services aux populations locales."
  
  trait_giga_gas_giant_hab:0 "Dépendant aux gaz exotiques"
  trait_giga_gas_giant_hab_desc:0 "§LAprès des siècles d'exposition aux gaz exotiques en vivant sur une géante gazeuse, cette espèce est devenue quelque peu dépendante de ces gaz dans ses fonctions quotidiennes.§!"
  trait_giga_gas_giant_hab_tooltip:0 "Entretien en gaz exotiques des emplois §Yscientifiques§! et §Yindustriels§! : §R+0.03§!\nUtilisation de logement sur les mondes ['concept_giga_gas_worlds', §Ygazeux§!] : §G-10 %§!\nEntretien des £job_researcher£ $job_researcher$ sur les mondes ['concept_giga_gas_worlds', §Ygazeux§!] : §G-10 %§!\nEntretien en gaz exotiques des emplois sur les mondes ['concept_giga_gas_worlds', §Ygazeux§!] : §G-33 %§!\nUtilisation de logement sur les mondes non ['concept_giga_gas_worlds', §Ygazeux§!] : §R+30 %§!\nHabitabilité sur les mondes non ['concept_giga_gas_worlds', §Ygazeux§!] : §R-20 %§!\nEntretien en gaz exotiques des emplois sur les mondes non ['concept_giga_gas_worlds', §Ygazeux§!] : §R+50 %§!"
  trait_giga_gas_giant_hab_robot:0 "Alimenté aux gaz exotiques"
  trait_giga_gas_giant_hab_robot_desc:0 "§LDe petites auto-modifications au fil du temps ont engendré une quasi-dépendance aux gaz exotiques pour alimenter ces machines.§!"
  trait_giga_gas_giant_hab_robot_tooltip:0 "$trait_giga_gas_giant_hab_tooltip$"
  
  giga_gas_giant_hab_colony_tt:0 "Considéré comme un monde ['concept_giga_gas_worlds', §Ygazeux§!] pour les espèces de l'origine Décollage depuis la géante gazeuse."
  
