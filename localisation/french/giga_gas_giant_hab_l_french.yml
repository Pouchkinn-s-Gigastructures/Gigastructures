l_french:

    giga_gas_giant_home_system_NAME:99 "Foyer sur géante gazeuse"
    giga_gas_giant_home_system_DESC:99 "Commencez sur une géante gazeuse habitable, votre monde natal d'origine ayant été détruit."
    origin_gas_giant:99 "Décollage depuis une géante gazeuse"
    origin_gas_giant_desc:99 "Durant les premiers temps de l'ère spatiale de cet empire, leur monde natal fut frappé par une comète errante. Possédant déjà suffisamment d'infrastructures dans l'espace pour survivre temporairement, une station minière sur une géante gazeuse devint leur nouveau foyer. Au fil des années, la géante gazeuse a comblé leurs besoins à maintes reprises, apportant de nouvelles connaissances sur les divers gaz présents dans la galaxie. En raison d'une abondance de gaz exotiques durant le développement de cet empire, des techniques industrielles améliorées utilisant ces gaz ont été perfectionnées, bien qu'avec une dépendance à ces gaz même pour l'industrie la plus élémentaire."
    origin_gas_giant_robot:99 "Décollage depuis une géante gazeuse"
    origin_gas_giant_robot_desc:99 "Durant les premiers temps de l'ère spatiale de cet empire, leur monde natal fut frappé par une comète errante. Possédant déjà suffisamment d'infrastructures dans l'espace pour survivre temporairement, une station minière sur une géante gazeuse devint leur nouveau foyer. Au fil des années, la géante gazeuse a comblé leurs besoins à maintes reprises, apportant de nouvelles connaissances sur les divers gaz présents dans la galaxie. En raison d'une abondance de gaz exotiques durant le développement de cet empire, des techniques industrielles améliorées utilisant ces gaz ont été perfectionnées, bien qu'avec une dépendance à ces gaz même pour l'industrie la plus élémentaire."

    origin_gas_giant_effects:99 "- $HOMEWORLD$ ['concept_giga_habitable_gas_giant'] (Taille : £planetsize£ 16-28)$NEW_LINE$- Trait d'espèce :$TABBED_NEW_LINE$- ['trait:trait_giga_gas_giant_hab']$NEW_LINE$- $ADDITONAL_TECHNOLOGIES_STRING$$TABBED_NEW_LINE$- ['technology:tech_space_mining_1', £engineering_research£ $tech_space_mining_1$]$TABBED_NEW_LINE$- ['technology:tech_hydroponics', £society_research£ $tech_hydroponics$]"
    origin_gas_giant_effects_robot:99 "- $HOMEWORLD$ ['concept_giga_habitable_gas_giant'] (Taille : £planetsize£ 16-28)$NEW_LINE$- Trait d'espèce :$TABBED_NEW_LINE$- ['trait:trait_giga_gas_giant_hab_robot']$NEW_LINE$- $ADDITONAL_TECHNOLOGIES_STRING$ ['technology:tech_space_mining_1', £engineering_research£ $tech_space_mining_1$]"

    concept_giga_habitable_gas_giant:99 "$pc_habitable_gas_giant$"
    concept_giga_habitable_gas_giant_desc:99 "$pc_habitable_gas_giant_desc$"

    concept_giga_gas_worlds:99 "Monde gazeux"
    concept_giga_gas_worlds_desc:99 "Les géantes gazeuses habitables, les planètes dont l'atmosphère a été artificiellement saturée de gaz, et même certains mondes toxiques légèrement plus habitables sont catégorisés comme « mondes gazeux »."

    building_giga_gas_giant_habitation_module:99 "Module d'habitation pour géante gazeuse"
    building_giga_gas_giant_habitation_module_desc:99 "Ensemble d'installations nécessaires au maintien d'une colonie sur une géante gazeuse, assemblé par la population d'origine de cette planète. Ces installations comprennent des réacteurs pour fournir de l'énergie à la colonie, des baies d'amarrage pour décharger les minéraux collectés sur les lunes locales et de vastes hangars climatisés pouvant être utilisés pour des fermes hydroponiques. De plus, ces installations servent de quartier général au réseau de distribution des ressources et fournissent divers services aux populations locales."

    trait_giga_gas_giant_hab:99 "Dépendance aux gaz exotiques"
    trait_giga_gas_giant_hab_desc:99 "§LAprès des siècles d'exposition aux gaz exotiques en vivant sur une géante gazeuse, cette espèce est devenue quelque peu dépendante de ceux-ci dans ses fonctions quotidiennes.§!"
    trait_giga_gas_giant_hab_tooltip:99 "Entretien en gaz exotiques des emplois §Yscientifiques§! et §Yindustriels§! : §R+0,03§!\n    - Utilisation de logements sur les mondes ['concept_giga_gas_worlds', §Ygazeux§!] : §G-10 %§!\n    - Entretien des £job_researcher£ $job_researcher$ sur les mondes ['concept_giga_gas_worlds', §Ygazeux§!] : §G-10 %§!\n    - Entretien en gaz exotiques des emplois sur les mondes ['concept_giga_gas_worlds', §Ygazeux§!] : §G-33 %§!\n    - Utilisation de logements sur les mondes non ['concept_giga_gas_worlds', §Ygazeux§!] : §R+30 %§!\n    - Habitabilité sur les mondes non ['concept_giga_gas_worlds', §Ygazeux§!] : §R-20 %§!\n    - Entretien en gaz exotiques des emplois sur les mondes non ['concept_giga_gas_worlds', §Ygazeux§!] : §R+50 %§!"
    trait_giga_gas_giant_hab_robot:99 "Alimenté par les gaz exotiques"
    trait_giga_gas_giant_hab_robot_desc:99 "§LDe petites auto-modifications au fil du temps se sont accumulées jusqu'à créer une quasi-dépendance aux gaz exotiques pour alimenter ces machines."
    trait_giga_gas_giant_hab_robot_tooltip:99 "$trait_giga_gas_giant_hab_tooltip$"

    giga_gas_giant_hab_colony_tt:99 "Considéré comme un monde ['concept_giga_gas_worlds', §Ygazeux§!] pour les espèces de l'origine Décollage depuis une géante gazeuse."

