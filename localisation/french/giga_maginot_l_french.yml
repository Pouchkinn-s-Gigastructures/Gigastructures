    ### Dead Hand Failsafe ###
    # capture, explosive disarmed
    maginot_destruction.2000.name:99 "$name_maginot_world$ capturé"
    maginot_destruction.2000.desc:99 "Nos forces rapportent la capture réussie du $name_maginot_world$ [From.GetName] dans le système [From.GetStarName]. Les combats se sont étendus profondément dans la croûte de la planète à travers un vaste labyrinthe de bunkers et de défenses, mais au final nos forces se sont avérées supérieures. Le système de sécurité insidieux de la Main Morte a été empêché de tirer, même si les commandants ennemis qui le tenaient ont combattu jusqu'au bout. La destruction planétaire a été évitée avec succès, et nous pouvons maintenant prendre le contrôle total de toutes les fonctions du $name_maginot_world$. §YNotez que le système de perturbation sous-spatiale devra être réactivé manuellement.§!"
    maginot_destruction.2000.a:99 "Excellent."
    # owner informed of capture
    maginot_destruction.2010.name:99 "$name_maginot_world$ capturé"
    maginot_destruction.2010.desc:99 "Nous avons perdu le $name_maginot_world$ [From.GetName] dans le système [From.GetStarName]. Malgré le vaste labyrinthe de bunkers et de défenses s'étendant profondément dans la croûte de la planète, les forces ennemies ont tout de même pénétré nos périmètres et capturé nos centres de commandement. Ils ont réussi à désactiver le système de sécurité de la Main Morte, ce qui signifie que la destruction planétaire a été évitée. L'ennemi contrôle maintenant une puissante structure défensive et un élément clé de nos lignes de protection. \nSi notre état-major actuel n'était pas déjà mort, il y aurait un terrible règlement de comptes pour cet échec."
    maginot_destruction.2010.a:99 "En effet."
    # defender popup about fleet destruction
    maginot_destruction.2001.name:99 "Activation réussie de la Main Morte dans [From.GetStarName] !"
    maginot_destruction.2001.desc:99 "Le pire s'est produit. Le $name_maginot_world$ [From.GetName] dans le système [From.GetStarName] a été perdu avec tout son équipage.\n\nAprès que notre ennemi a déployé un armement suffisamment puissant pour détruire le monde, le système de confinement d'antimatière de la Main Morte a échoué comme prévu et a rapidement entraîné la libération de vastes quantités d'énergie. Grâce à un placement astucieux et à une géo-ingénierie à grande échelle, l'explosion a été redirigée comme prévu et a effectivement transformé un morceau de croûte de la taille d'un continent en une unique charge creuse surpuissante.\n\nNous pouvons nous réjouir que le sacrifice de [From.GetName] n'ait pas été vain, car tous les vaisseaux restés en orbite auraient dû être anéantis par cette arme. Seul un vaisseau bien plus grand que la planète elle-même serait capable de résister à notre courroux.\n\n§YNote : Le système de perturbation sous-spatiale a été violemment désactivé, et la rétroaction aura forcé l'arrêt de tout dispositif similaire dans les systèmes voisins. Tout $name_maginot_world_plural$ restant devrait voir ses systèmes réactivés manuellement.§!"
    maginot_destruction.2001.a:99 "Ça leur apprendra à faire exploser nos mondes."
    # attacker popup about fleet destruction
    maginot_destruction.2002.name:99 "Désastre dans [From.GetStarName] !"
    maginot_destruction.2002.desc:99 "§RUn désastre a frappé notre flotte chargée d'anéantir le $name_maginot_world$ [From.GetName] dans le système [From.GetStarName] !§!\n\nLe déploiement des armes se déroulait comme prévu, jusqu'à ce que le monde se fissure soudainement alors qu'un morceau de masse de la taille d'un continent a jailli à des vitesses quasi-relativistes, créant une lance de plasma surchauffé d'une taille inimaginable. Tous les vaisseaux en orbite ont vu leurs boucliers instantanément surchargés par le burst massif de rayonnement à spectre complet et l'assaut incessant d'énergie cinétique, et ont par conséquent subi des dommages structurels massifs, potentiellement fatals. Les vaisseaux plus petits ont été instantanément détruits avec la perte de tout leur équipage.\n\nIl semble que l'ennemi ait stocké des quantités ridicules d'antimatière comme système de sécurité au cas où quelqu'un tenterait de détruire leur monde. Nous nous attendons à trouver des systèmes de sécurité similaires dans tout autre $name_maginot_world_plural$ que nous rencontrerons. Si nous n'utilisons pas d'équipes au sol pour désactiver soigneusement ces machines, nous pouvons nous attendre à plus de pertes de vaisseaux alors que la planète elle-même est utilisée comme arme ultime."
    maginot_destruction.2002.a:99 "Déshonorant."
    # attacker popup about colossal failure
    maginot_destruction.2003.name:99 "Échec colossal dans [From.GetStarName] !"
    maginot_destruction.2003.desc:99 "§RUn désastre a frappé notre colosse chargé d'anéantir le $name_maginot_world$ [From.GetName] dans le système [From.GetStarName] !§!\n\nLa planète semblait avoir été détruite comme ordonné, mais juste au moment où les dernières fortifications devaient céder, un morceau de masse de la taille d'un continent a été projeté à des vitesses quasi-relativistes, créant une lance de plasma surchauffé d'une taille inimaginable. Notre colosse et ses systèmes ont été instantanément surchargés par le burst massif de rayonnement à spectre complet et l'assaut incessant d'énergie cinétique, subissant des dommages structurels directs massifs. Nous essayons encore de déterminer s'il a même survécu. Comme si cela ne suffisait pas, tous les vaisseaux restés en orbite ont été similairement affectés, anéantissant instantanément tous les vaisseaux plus petits.\n\nIl semble que l'ennemi ait stocké des quantités ridicules d'antimatière comme système de sécurité au cas où quelqu'un tenterait de détruire leur monde. Nous nous attendons à trouver des systèmes de sécurité similaires dans tout autre $name_maginot_world_plural$ que nous rencontrerons. Si nous n'utilisons pas d'équipes au sol pour désactiver soigneusement ces machines, nous pouvons nous attendre à plus de pertes alors que la planète elle-même est utilisée comme arme ultime."
    maginot_destruction.2003.a:99 "Ça a coûté une fortune !"
    # cosmogenesis horizon needle popup
    maginot_destruction.2004.name:99 "$name_maginot_world$ embarqué à [From.GetStarName]"
    maginot_destruction.2004.desc:99 "Le $name_maginot_world$ [From.GetName] dans le système [From.GetStarName] a été embarqué dans l'Aiguille de l'Horizon.\n\nLe système de confinement d'antimatière de la Main Morte a été autorisé à échouer comme prévu après l'embarquement des derniers officiers, car nous ne souhaitons certainement pas laisser de tels systèmes défensifs puissants sans équipage et facilement disponibles pour d'autres nations.\nL'explosion en charge creuse de plasma de la taille d'un continent a été dirigée vers l'espace vide, évitant une perte très coûteuse de nos colonies déjà embarquées et des systèmes de l'Aiguille de l'Horizon. Bien que l'Aiguille elle-même soit bien protégée contre le recul spatial et les effets secondaires, les autres plateformes et systèmes spatiaux appartenant au $name_maginot_world$ ne le sont pas, et tout ce qui orbitait autour a été réduit en poussière spatiale. Nous espérons certainement qu'aucun vaisseau militaire ou civil n'était resté en orbite.\n\nEn route vers notre prochaine colonie !"
    maginot_destruction.2004.a:99 "Tout selon le plan."

    ### Orbital Defense Events ###
    # destroyed
    maginot_orbital_defence.1004.name:99 "Commandement de défense stratégique Maginot détruit !"
    maginot_orbital_defence.1004.desc:99 "Les stations de commandement orbital protectrices en orbite autour du $name_maginot_world$ §Y[maginot_world_location.GetName]§! ont été détruites à la suite d'un combat acharné avec §Y[maginot_orbital_defence_destroyer.GetName]§!.\n\nNos défenses orbitales ont été réduites à des débris épars, mais la station de défense centrale peut être reconstruite avec le temps. Le Monde Maginot lui-même reste intact et résistera toujours à une invasion terrestre. Si des améliorations avaient été appliquées, la réparation de nos défenses conservera les améliorations qu'elles auraient pu avoir. Les plateformes DS secondaires ne seront pas restaurées et devront être construites à partir de zéro."
    maginot_orbital_defence.1004.a:99 "Maudits soient-ils !"
    # repaired
    maginot_orbital_defence.1006.name:99 "Commandement de défense stratégique Maginot réparé !"
    maginot_orbital_defence.1006.desc:99 "Nous avons réussi à réparer notre station de commandement en orbite autour du $name_maginot_world$ §Y[maginot_world_location.GetName]§!. La structure a été remise en état de marche et est maintenant prête à défendre notre territoire.\n\nToutes les améliorations précédemment appliquées à la structure ont été conservées, mais pas les plateformes DS secondaires."
    maginot_orbital_defence.1006.a:99 "Excellent !"

