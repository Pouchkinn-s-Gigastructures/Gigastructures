    ##############
    ### Dead Hand Failsafe ###
    # capture, explosive disarmed
    maginot_destruction.2000.name:0 "$name_maginot_world$ capturé"
    maginot_destruction.2000.desc:0 "Nos forces rapportent la capture réussie du $name_maginot_world$ [From.GetName] dans le système [From.GetStarName]. Les combats se sont étendus profondément dans la croûte planétaire à travers un vaste labyrinthe de bunkers et de défenses, mais au final, nos forces ont prouvé leur supériorité. Le système de sécurité insidieux de la Main morte a été empêché de se déclencher, même si les commandants ennemis qui le contrôlaient ont combattu jusqu'au bout. La destruction planétaire a été évitée avec succès, et nous pouvons maintenant prendre le contrôle total de toutes les fonctions du $name_maginot_world$. §YNotez que le système de perturbation sous-spatiale devra être réactivé manuellement.§!"
    maginot_destruction.2000.a:0 "Excellent."
    # owner informed of capture
    maginot_destruction.2010.name:0 "$name_maginot_world$ capturé"
    maginot_destruction.2010.desc:0 "Nous avons perdu le $name_maginot_world$ [From.GetName] dans le système [From.GetStarName]. Malgré le vaste labyrinthe de bunkers et de défenses s'étendant profondément dans la croûte planétaire, les forces ennemies ont tout de même percé nos périmètres et capturé nos centres de commandement. Ils ont réussi à désactiver le système de sécurité de la Main morte, ce qui signifie que la destruction planétaire a été évitée. L'ennemi contrôle désormais une puissante structure défensive et un élément clé de nos lignes de protection. \nSi notre état-major actuel n'était pas déjà mort, un règlement de comptes infernal s'ensuivrait pour cet échec."
    maginot_destruction.2010.a:0 "En effet."
    # defender popup about fleet destruction
    maginot_destruction.2001.name:0 "Activation réussie de la Main morte dans [From.GetStarName] !"
    maginot_destruction.2001.desc:0 "Le pire s'est produit. Le $name_maginot_world$ [From.GetName] dans le système [From.GetStarName] a été perdu corps et biens.\n\nAprès que notre ennemi a déployé un armement suffisamment puissant pour détruire le monde, le système de confinement d'antimatière de la Main morte a cédé comme prévu, libérant instantanément de vastes quantités d'énergie. Grâce à un placement ingénieux et à une géo-ingénierie à grande échelle, l'explosion a été redirigée comme prévu et a effectivement transformé un morceau de croûte de la taille d'un continent en une unique charge creuse surpuissante.\n\nNous pouvons nous réjouir que le sacrifice de [From.GetName] n'ait pas été vain, car tout vaisseau resté en orbite devrait avoir été anéanti par cette arme. Seul un vaisseau bien plus grand que la planète elle-même pourrait résister à notre courroux.\n\n§YNote : Le système de perturbation sous-spatiale a été violemment désactivé, et le retour de signal aura forcé l'arrêt de tout dispositif similaire dans les systèmes voisins. Tout $name_maginot_world_plural$ restant devrait voir ses systèmes réactivés manuellement.§!"
    maginot_destruction.2001.a:0 "Cela devrait leur apprendre à faire exploser nos mondes."
    # attacker popup about fleet destruction
    maginot_destruction.2002.name:0 "Désastre dans [From.GetStarName] !"
    maginot_destruction.2002.desc:0 "§RUn désastre a frappé notre flotte chargée d'anéantir le $name_maginot_world$ [From.GetName] dans le système [From.GetStarName] !§!\n\nLe déploiement des armes se déroulait comme prévu, jusqu'à ce que le monde se fissure soudainement alors qu'un morceau de masse de la taille d'un continent a été propulsé à des vitesses quasi-relativistes, créant une lance de plasma surchauffé d'une taille inimaginable. Tous les vaisseaux en orbite ont vu leurs boucliers instantanément surchargés par l'énorme rafale de rayonnement sur tout le spectre et l'assaut incessant d'énergie cinétique, et ont par conséquent subi des dommages structurels massifs, potentiellement fatals. Les vaisseaux plus petits ont été instantanément détruits, tous les équipages perdus.\n\nIl apparaît que l'ennemi avait stocké des quantités ridicules d'antimatière comme système de sécurité au cas où quelqu'un tenterait de détruire leur monde. Nous nous attendons à trouver des dispositifs de sécurité similaires dans tout autre $name_maginot_world_plural$ que nous rencontrerons. Si nous n'utilisons pas d'équipes au sol pour désactiver soigneusement ces mécanismes, nous pouvons nous attendre à d'autres pertes de vaisseaux alors que la planète elle-même est utilisée comme arme ultime."
    maginot_destruction.2002.a:0 "Déshonorant."
    # attacker popup about colossal failure
    maginot_destruction.2003.name:0 "Échec colossal dans [From.GetStarName] !"
    maginot_destruction.2003.desc:0 "§RUn désastre a frappé notre colosse chargé d'anéantir le $name_maginot_world$ [From.GetName] dans le système [From.GetStarName] !§!\n\nLa planète semblait avoir été détruite comme ordonné, mais juste au moment où les dernières fortifications devaient céder, un morceau de masse de la taille d'un continent a été projeté à des vitesses quasi-relativistes, créant une lance de plasma surchauffé d'une taille inimaginable. Notre colosse et ses systèmes ont été instantanément surchargés par l'énorme rafale de rayonnement sur tout le spectre et l'assaut incessant d'énergie cinétique, subissant des dommages structurels directs massifs. Nous essayons encore de déterminer s'il a même survécu. Comme si cela ne suffisait pas, tout vaisseau resté en orbite a été similairement affecté, anéantissant instantanément tout vaisseau plus petit.\n\nIl apparaît que l'ennemi avait stocké des quantités ridicules d'antimatière comme système de sécurité au cas où quelqu'un tenterait de détruire leur monde. Nous nous attendons à trouver des dispositifs de sécurité similaires dans tout autre $name_maginot_world_plural$ que nous rencontrerons. Si nous n'utilisons pas d'équipes au sol pour désactiver soigneusement ces mécanismes, nous pouvons nous attendre à d'autres pertes alors que la planète elle-même est utilisée comme arme ultime."
    maginot_destruction.2003.a:0 "Cette chose a coûté une fortune !"
    # cosmogenesis horizon needle popup
    maginot_destruction.2004.name:0 "$name_maginot_world$ embarqué à [From.GetStarName]"
    maginot_destruction.2004.desc:0 "Le $name_maginot_world$ [From.GetName] dans le système [From.GetStarName] a été embarqué dans l'Aiguille de l'Horizon.\n\nLe système de confinement d'antimatière de la Main morte a été autorisé à céder comme prévu après l'embarquement des derniers officiers, car nous ne souhaitons certainement pas laisser de tels systèmes défensifs puissants sans équipage et facilement accessibles à d'autres nations.\nL'explosion plasma en charge creuse de la taille d'un continent a été dirigée vers l'espace vide, évitant une perte très coûteuse de nos colonies déjà embarquées et des systèmes de l'Aiguille de l'Horizon. Bien que l'Aiguille elle-même soit bien protégée contre le recul spatial et les effets secondaires, les autres plateformes et systèmes spatiaux appartenant au $name_maginot_world$ ne le sont pas, et tout ce qui était en orbite a été réduit en poussière spatiale. Nous espérons sincèrement qu'aucun vaisseau militaire ou civil n'était resté en orbite.\n\nEn route vers notre prochaine colonie !"
    maginot_destruction.2004.a:0 "Tout s'est déroulé comme prévu."

    ### Orbital Defense Events ###
    # destroyed
    maginot_orbital_defence.1004.name:0 "Commandement de défense stratégique Maginot détruit !"
    maginot_orbital_defence.1004.desc:0 "Les stations de commandement orbitales protectrices en orbite autour du $name_maginot_world$ §Y[maginot_world_location.GetName]§! ont été détruites suite à de violents combats contre le §Y[maginot_orbital_defence_destroyer.GetName]§!.\n\nNos défenses orbitales ont été réduites à des débris aléatoires, mais la station de défense centrale peut être reconstruite avec le temps. Le Monde Maginot lui-même reste intact et résistera toujours à une invasion terrestre. Si des améliorations avaient été appliquées, la réparation de nos défenses conservera les améliorations qu'elles auraient pu avoir. Les plateformes DS secondaires ne seront pas restaurées et devront être reconstruites de zéro."
    maginot_orbital_defence.1004.a:0 "Malédiction !"
    # repaired
    maginot_orbital_defence.1006.name:0 "Commandement de défense stratégique Maginot réparé !"
    maginot_orbital_defence.1006.desc:0 "Nous avons réussi à réparer notre station de commandement en orbite autour du $name_maginot_world$ §Y[maginot_world_location.GetName]§!. La structure a été remise en état de fonctionnement et est maintenant prête à défendre notre territoire.\n\nToutes les améliorations précédemment appliquées à la structure ont été conservées, mais pas les plateformes DS secondaires."
    maginot_orbital_defence.1006.a:0 "Excellent !"

