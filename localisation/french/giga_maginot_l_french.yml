    GIGA_MAGINOT_PLANET_REACTOR:0 "Système d'alimentation Maginot amélioré"
    GIGA_MAGINOT_PLANET_REACTOR_DESC:0 "La technologie des planétovaisseaux a permis plusieurs améliorations des installations d'alimentation liées à la planète."

    GIGA_MAGINOT_STAR_REACTOR:0 "Réseau de captation coronale"
    GIGA_MAGINOT_STAR_REACTOR_DESC:0 "L'ingénierie hyperdimensionnelle et la maîtrise du contrôle stellaire permettent aux capteurs d'étoiles non locaux d'alimenter tous les systèmes Maginot."

    GIGA_MAGINOT_OMEGA_LANCE:0 "Lance d'annihilation Oméga"
    GIGA_MAGINOT_OMEGA_LANCE_DESC:0 "Une arme littéralement de la taille d'une lune, rien de moins ne suffira pour protéger notre $name_maginot_world$. Alimentée par un réacteur massif installé dans le noyau de la planète hôte, et régulée par une pléthore de systèmes sous la croûte, cette lance énergétique peut, et va déchiqueter tout ce qui se trouve sur son chemin."

    GIGA_MAGINOT_KINETIC_BATTERY:0 "Batteries planétaires lourdes"
    GIGA_MAGINOT_KINETIC_BATTERY_DESC:0 "D'immenses batteries cinétiques construites à la surface du $name_maginot_world$, capables de dévastations immenses lorsqu'elles sont interconnectées aux systèmes orbitaux."

    GIGA_MAGINOT_DEFENCE_DRONE_SWARM:0 "Essaim de drones de défense orbitale"
    GIGA_MAGINOT_DEFENCE_DRONE_SWARM_DESC:0 "Un essaim de drones liés à leur $name_maginot_world$ hôte, ils ne nécessitent aucun équipage, générateurs de boucliers embarqués ou noyaux de commandement indépendants, et peuvent ainsi opérer plus efficacement au combat que des astronefs de combat de taille similaire en vol libre."

    ##################
    ### Technology ###
    ##################
    giga_tech_maginot_world:0 "Théorie de la défense du point d'appui ultime"
    giga_tech_maginot_world_desc:0 "Pour défendre notre empire, nous devons construire le point d'appui défensif ultime et transformer une planète entière en un immense complexe fortifié — le $name_maginot_world$. \n\nCe monde sera équipé de défenses orbitales, de canons planétaires, d'innombrables bunkers, de complexes de commandement souterrains profonds et de générateurs de boucliers de la taille de continents. De plus, un système de Main morte sera développé pour dissuader les navires de guerre de classe Colosse ennemis.\n\n§YLe bâtiment planétaire est nécessaire pour commencer la construction du $name_maginot_world$§!, mais le bâtiment peut également être construit dans d'autres emplacements non adaptés au développement complet."
    maginot_desc:0 "Une vaste forteresse couvrant toute la planète qui aspire à être totalement imprenable pour toute force ennemie."
    allow_maginot:0 "§HDébloque la mégastructure :§! $name_maginot_world$"

    giga_tech_maginot_firepower_1:0 "Puissance de feu Maginot améliorée"
    giga_tech_maginot_firepower_1_desc:0 "Les développements pratiques étant terminés, nous pouvons maintenant nous concentrer sur l'optimisation des différents systèmes du $name_maginot_world$. En particulier, une puissance de feu toujours plus grande."
    allow_giga_maginot_firepower_1:0 "Dégâts des armes Maginot : §G+25 %§! \nCadence de tir des armes Maginot : §G+10 %§! \nPortée des armes Maginot : §G+20 %§!"
    # display upgrade in decisions tooltip
    maginot_display_firepower_1:0 "\n§BTech. $giga_tech_maginot_firepower_1$§! : \n§G+25 %§! $MOD_SHIP_WEAPON_DAMAGE$ \n§G+10 %§! $MOD_SHIP_FIRE_RATE_MULT$ \n§G+20 %§! $MOD_SHIP_WEAPON_RANGE_MULT$"

    giga_tech_maginot_planetcraft_upgrade:0 "Techniques de renforcement Maginot actualisées"
    giga_tech_maginot_planetcraft_upgrade_desc:0 "La nouvelle génération de vaisseaux de guerre célestes a révélé plusieurs améliorations possibles dans le renforcement Maginot, nous permettant de rendre ces structures toujours plus durables face aux menaces croissantes. De plus, certaines améliorations d'armes et de réacteurs peuvent être modernisées."
    allow_giga_maginot_planetcraft_upgrade:0 "§HDébloque la section de plateforme :§! Plateforme de défense stratégique Maginot améliorée \nDégâts des armes Maginot : §G+50 %§! \nCoque Maginot : §G+500 000§! \nBlindage Maginot : §G+200 000§! \nBoucliers Maginot : §G+200 000§!"
    # display upgrade in decisions tooltip
    maginot_display_planetcraft_upgrade:0 "§BTech. $giga_tech_maginot_planetcraft_upgrade$§! : \n§G+50 %§! $MOD_SHIP_WEAPON_DAMAGE$ \n§G+500 000§! $MOD_SHIP_HULL_ADD$ \n§G+200 000§! $MOD_SHIP_ARMOR_ADD$ \n§G+200 000§! $MOD_SHIP_SHIELD_ADD$"

    giga_tech_maginot_systemcraft_upgrade:0 "Modernisation stellaire"
    giga_tech_maginot_systemcraft_upgrade_desc:0 "Même si les étoiles elles-mêmes se déplacent désormais à notre commandement, nous ne devons pas négliger nos défenses. Nos innovations les plus récentes permettent plusieurs améliorations fondamentales des mesures de protection Maginot."
    allow_giga_maginot_systemcraft_upgrade:0 "§HDébloque la section de plateforme :§! Plateforme de défense stratégique Maginot de niveau vaisseau-système \nDégâts des armes Maginot : §G+250 %§! \nCadence de tir des armes Maginot : §G+100 %§! \nPrécision Maginot : §G+20§! \nSuivi Maginot : §G+10§! \nCoque Maginot : §G+5 000 000§! \nBlindage Maginot : §G+2 000 000§! \nBoucliers Maginot : §G+2 000 000§!"
    # display upgrade in decisions tooltip
    maginot_display_systemcraft_upgrade:0 "§BTech. $giga_tech_maginot_systemcraft_upgrade$§! : \n§G+250 %§! $MOD_SHIP_WEAPON_DAMAGE$ \n§G+100 %§! $MOD_SHIP_FIRE_RATE_MULT$ \n§G+20§! $MOD_SHIP_ACCURACY_ADD$ \n§G+10§! $MOD_SHIP_TRACKING_ADD$ \n§G+5 000 000§! $MOD_SHIP_HULL_ADD$ \n§G+2 000 000§! $MOD_SHIP_ARMOR_ADD$ \n§G+2 000 000§! $MOD_SHIP_SHIELD_ADD$"
