    maginot_world_0_DESC:0 "Le site de construction d'un futur $name_maginot_world$ qui sera intégré à la planète en dessous. Cette forteresse massive s'étendra un jour profondément dans le manteau planétaire et au-delà de l'atmosphère vers l'espace profond, présentant un obstacle quasi imprenable aux ennemis. Tous les districts de la planète seront remplacés par des districts défensifs uniques, et la gestion des plateformes de défense planétaire deviendra disponible. Les $orbital_ring_tier_1_plural$ seront incorporés et retirés."
    maginot_world_0_MEGASTRUCTURE_DETAILS:0 "£gigastructural£ $giga_list_category_megastructure$ - $giga_list_category_defensive$ \nFournit de grandes quantités d'§YArmées de défense§!, d'§YInhibiteurs PRL§! et bloque les §YPropulseurs de saut§! — §BNÉCESSITE UN MONDE AVEC LE BÂTIMENT COMPLEXE FORTIFIÉ MAGINOT§ !\n§LUn vaste complexe-forteresse englobant une planète entière, fournissant la défense planétaire ultime.§!"
