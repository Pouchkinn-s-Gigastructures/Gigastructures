    ### Dead Hand Failsafe ###
    # capture, explosive disarmed
    maginot_destruction.2000.name:99 "$name_maginot_world$ capturé"
    maginot_destruction.2000.desc:99 "Nos forces rapportent la capture réussie du $name_maginot_world$ [From.GetName] dans le système [From.GetStarName]. Les combats se sont étendus profondément dans la croûte planétaire à travers un vaste labyrinthe de bunkers et de défenses, mais finalement nos forces se sont avérées supérieures. Le système de sécurité insidieux Main Morte a été empêché de se déclencher, même si les commandants ennemis qui l'opéraient se sont battus jusqu'au bout. La destruction planétaire a été évitée avec succès, et nous pouvons maintenant prendre le contrôle total de toutes les fonctions du $name_maginot_world$. §YNotez que le système de perturbation sous-spatiale devra être réactivé manuellement.§!"
    maginot_destruction.2000.a:99 "Excellent."
    # owner informed of capture
    maginot_destruction.2010.name:99 "$name_maginot_world$ capturé"
    maginot_destruction.2010.desc:99 "Nous avons perdu le $name_maginot_world$ [From.GetName] dans le système [From.GetStarName]. Malgré le vaste labyrinthe de bunkers et de défenses s'étendant profondément dans la croûte planétaire, les forces ennemies ont quand même pénétré nos périmètres et capturé nos centres de commandement. Ils ont réussi à désactiver le système de sécurité Main Morte, ce qui signifie que la destruction planétaire a été évitée. L'ennemi contrôle désormais une puissante structure défensive et un élément clé de nos lignes de protection. \nSi notre état-major actuel n'était pas déjà mort, il y aurait un règlement de comptes infernal pour cet échec."
    maginot_destruction.2010.a:99 "En effet."
    # defender popup about fleet destruction
    maginot_destruction.2001.name:99 "Activation réussie de la Main Morte dans [From.GetStarName] !"
    maginot_destruction.2001.desc:99 "Le pire s'est produit. Le $name_maginot_world$ [From.GetName] dans le système [From.GetStarName] a été perdu avec tout son équipage.\n\nAprès que notre ennemi a déployé un armement suffisamment puissant pour détruire le monde, le système de confinement d'antimatière Main Morte a échoué comme prévu et a rapidement entraîné la libération de vastes quantités d'énergie. Avec un positionnement astucieux et une géo-ingénierie à grande échelle, l'explosion a été redirigée comme prévu et a effectivement transformé un morceau de croûte de la taille d'un continent en une seule charge creuse surpuissante.\n\nNous pouvons nous réjouir que le sacrifice de [From.GetName] n'ait pas été vain, puisque tous les vaisseaux restés en orbite devraient avoir été anéantis par cette arme. Seul un vaisseau beaucoup plus grand que la planète elle-même serait capable de résister à notre colère.\n\n§YNote : Le système de perturbation sous-spatiale a été violemment désactivé, et le feedback aura forcé l'arrêt de tout dispositif similaire dans les systèmes voisins. Les $name_maginot_world_plural$ restants devraient voir leurs systèmes réactivés manuellement.§!"
    maginot_destruction.2001.a:99 "Ça devrait leur apprendre à détruire nos mondes."
    # attacker popup about fleet destruction
    maginot_destruction.2002.name:99 "Désastre dans [From.GetStarName] !"
    maginot_destruction.2002.desc:99 "§RUn désastre a frappé notre flotte chargée d'anéantir le $name_maginot_world$ [From.GetName] dans le système [From.GetStarName] !§!\n\nLe déploiement des armes se déroulait comme prévu, jusqu'à ce que le monde se fissure soudainement alors qu'un morceau de masse de la taille d'un continent jaillissait à des vitesses quasi-relativistes, créant une lance de plasma surchauffé d'une taille inconcevable. Tous les vaisseaux en orbite ont vu leurs boucliers instantanément surchargés par l'énorme décharge de rayonnement sur tout le spectre et l'assaut implacable d'énergie cinétique, et en conséquence ont subi des dommages structurels massifs, potentiellement fatals. Les vaisseaux plus petits ont été instantanément détruits avec la perte de tout leur équipage.\n\nIl semble que l'ennemi ait stocké des quantités ridicules d'antimatière comme sécurité au cas où quelqu'un tenterait de détruire leur monde. Nous nous attendons à trouver des sécurités similaires dans tous les autres $name_maginot_world_plural$ que nous rencontrerons. Si nous n'utilisons pas d'équipes au sol pour désactiver soigneusement de telles machineries, nous pouvons nous attendre à d'autres pertes de vaisseaux car la planète elle-même est utilisée comme arme ultime."
    maginot_destruction.2002.a:99 "Honteux."
    # attacker popup about colossal failure
    maginot_destruction.2003.name:99 "Échec colossal dans [From.GetStarName] !"
    maginot_destruction.2003.desc:99 "§RUn désastre a frappé notre colosse chargé d'anéantir le $name_maginot_world$ [From.GetName] dans le système [From.GetStarName] !§!\n\nLa planète a apparemment été détruite comme ordonné, mais juste au moment où les dernières fortifications devaient céder, un morceau de masse de la taille d'un continent a été projeté à des vitesses quasi-relativistes, créant une lance de plasma surchauffé d'une taille inconcevable. Notre colosse et ses systèmes ont été instantanément surchargés par l'énorme décharge de rayonnement sur tout le spectre et l'assaut implacable d'énergie cinétique, subissant des dommages structurels directs massifs. Nous essayons toujours de déterminer s'il a même survécu. Comme si cela ne suffisait pas, tous les vaisseaux restés en orbite ont été similairement affectés, anéantissant instantanément tous les vaisseaux plus petits.\n\nIl semble que l'ennemi ait stocké des quantités ridicules d'antimatière comme sécurité au cas où quelqu'un tenterait de détruire leur monde. Nous nous attendons à trouver des sécurités similaires dans tous les autres $name_maginot_world_plural$ que nous rencontrerons. Si nous n'utilisons pas d'équipes au sol pour désactiver soigneusement de telles machineries, nous pouvons nous attendre à d'autres pertes car la planète elle-même est utilisée comme arme ultime."
    maginot_destruction.2003.a:99 "Ce truc a coûté une fortune !"
    # cosmogenesis horizon needle popup
    maginot_destruction.2004.name:99 "$name_maginot_world$ embarqué à [From.GetStarName]"
    maginot_destruction.2004.desc:99 "Le $name_maginot_world$ [From.GetName] dans le système [From.GetStarName] a été embarqué dans l'Aiguille de l'Horizon.\n\nLe système de confinement d'antimatière Main Morte a été laissé s'effondrer comme prévu après l'embarquement des derniers officiers, car nous ne souhaitons certainement pas laisser de tels systèmes défensifs puissants sans équipage et facilement disponibles pour d'autres nations.\nL'explosion de plasma en forme de continent a été dirigée vers l'espace vide, évitant une perte très coûteuse de nos colonies déjà embarquées et des systèmes de l'Aiguille de l'Horizon. Bien que l'Aiguille elle-même soit bien protégée des reculs spatiaux et des effets secondaires, les autres plateformes et systèmes spatiaux appartenant au $name_maginot_world$ ne le sont pas, et tout ce qui était en orbite a été réduit en poussière spatiale. Nous espérons sincèrement qu'aucun vaisseau militaire ou civil n'était resté en orbite.\n\nEn route vers notre prochaine colonie !"
    maginot_destruction.2004.a:99 "Tout se passe comme prévu."

    ### Orbital Defense Events ###
    # destroyed
    maginot_orbital_defence.1004.name:99 "Commandement de défense stratégique Maginot détruit !"
    maginot_orbital_defence.1004.desc:99 "Les stations de commandement orbitales protectrices en orbite autour du $name_maginot_world$ §Y[maginot_world_location.GetName]§! ont été détruites suite à un combat acharné avec §Y[maginot_orbital_defence_destroyer.GetName]§!.\n\nNos défenses orbitales ont été réduites à des débris aléatoires, mais la station de défense centrale peut être reconstruite avec le temps. Le Monde Maginot lui-même reste intact et résistera toujours à une invasion terrestre. Si des améliorations avaient été appliquées, la réparation de nos défenses conservera toutes les améliorations qu'elles auraient pu avoir. Les plateformes DS secondaires ne seront pas restaurées et devront être construites depuis le début."
    maginot_orbital_defence.1004.a:99 "Malédiction !"
    # repaired
    maginot_orbital_defence.1006.name:99 "Commandement de défense stratégique Maginot réparé !"
    maginot_orbital_defence.1006.desc:99 "Nous avons réparé avec succès notre station de commandement en orbite autour du $name_maginot_world$ §Y[maginot_world_location.GetName]§!. La structure a été remise en état de fonctionnement et est maintenant prête à défendre notre territoire.\n\nToutes les améliorations précédemment appliquées à la structure ont été conservées, mais les plateformes DS secondaires n'ont pas été restaurées."
    maginot_orbital_defence.1006.a:99 "Excellent !"

