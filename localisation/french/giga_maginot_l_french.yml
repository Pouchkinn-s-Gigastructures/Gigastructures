    #############
    ### Zones ###
    #############
    zone_maginot_housing:99 "Extension des casernes"
    zone_maginot_housing_desc:99 "Un vaste complexe de casernes abritant du personnel militaire de tous grades et spécialisations, s'étendant au-delà de l'horizon."
    # zone_maginot_ringworld_housing:99 "$zone_maginot_housing$"
    # zone_maginot_ringworld_housing_desc:99 "$zone_maginot_housing_desc$"

    zone_maginot_entertainment:99 "Zones de loisirs pour soldats"
    zone_maginot_entertainment_desc:99 "Des rangées de vastes dômes abritant presque tous les luxes civils que les soldats pourraient souhaiter expérimenter entre les déploiements."
    zone_maginot_ringworld_entertainment:99 "$zone_maginot_entertainment$"
    zone_maginot_ringworld_entertainment_desc:99 "$zone_maginot_entertainment_desc$"

    zone_maginot_logistics:99 "Centres d'approvisionnement naval"
    zone_maginot_logistics_desc:99 "Centres commerciaux civils axés sur l'approvisionnement et la livraison de provisions pour les flottes actives."
    zone_maginot_ringworld_logistics:99 "$zone_maginot_logistics$"
    zone_maginot_ringworld_logistics_desc:99 "$zone_maginot_logistics_desc$"

    zone_maginot_shield_generators:99 "Batteries de boucliers supplémentaires"
    zone_maginot_shield_generators_desc:99 "Des réacteurs à antimatière massifs renforcent les boucliers planétaires déjà immensément puissants, les préparant à l'éventualité de munitions hostiles franchissant nos défenses ponctuelles."
    zone_maginot_ringworld_shield_generators:99 "$zone_maginot_shield_generators$"
    zone_maginot_ringworld_shield_generators_desc:99 "$zone_maginot_shield_generators_desc$"

    zone_maginot_orbital_defense_grids:99 "Canons de défense planétaire"
    zone_maginot_orbital_defense_grids_desc:99 "Des canons accélérateurs magnétiques géants surveillent le ciel à la recherche d'ennemis assez téméraires pour s'approcher de la planète."
