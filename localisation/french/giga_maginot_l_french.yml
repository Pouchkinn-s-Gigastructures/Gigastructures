l_french:

    ###############
    ### Maginot ###
    ###############
    name_maginot:99 "Monde Maginot"
    is_giga_maginot_world:99 "$TRIGGER_FAIL$§RDoit être un Monde Maginot.§!"
    giga_tech_repeatable_maginot_cap:99 "Protocoles de gestion des Mondes Maginot"
    giga_tech_repeatable_maginot_cap_desc:99 "Des protocoles avancés de construction et de maintenance permettant la construction et la gestion de §YMondes Maginot§! supplémentaires au sein des frontières de notre empire."
    giga_maginot_capacity_increase_title:99 "Capacité de §YMonde Maginot§! : §G+1§!"
    giga_maginot_capacity_increase_desc:99 "La capacité de l'empire en §YMondes Maginot§! est augmentée de §G+1§!"

    d_maginot_subspace_disruptor:99 "Système de perturbation sous-spatiale Maginot"
    d_maginot_subspace_disruptor_desc:99 "Ce $name_maginot_world$ génère un puissant champ de perturbation qui se propage à travers le sous-espace, empêchant l'utilisation des trous de ver dans ce système. De plus, les propulseurs de saut sont rendus inopérants dans ce système et les systèmes voisins."

    ##############
    ### Armies ###
    ##############
    heavy_defender:99 "Défenseur lourd"
    heavy_defender_desc:99 "Une force d'intervention spéciale dédiée à la défense planétaire."
    heavy_defender_plural:99 "Défenseurs lourds"

    robot_heavy_defender:99 "Défenseur lourd robotique"
    robot_heavy_defender_desc:99 "Une force d'intervention robotique spéciale dédiée à la défense planétaire."
    robot_heavy_defender_plural:99 "Défenseurs lourds robotiques"

    machine_heavy_defender:99 "Défenseur machine lourd"
    machine_heavy_defender_desc:99 "Unités de combat lourdes spécialisées dans la défense planétaire."
    machine_heavy_defender_plural:99 "Défenseurs machines"

    maginot_artillery_army:99 "Artillerie planétaire"
    maginot_artillery_army_desc:99 "D'énormes canons d'artillerie capables de pulvériser les forces d'invasion, mais relativement fragiles."
    maginot_artillery_army_plural:99 "Artilleries planétaires"

    maginot_shield_army:99 "Batterie de bouclier"
    maginot_shield_army_desc:99 "D'immenses générateurs de bouclier conçus pour absorber les dégâts des forces ennemies."
    maginot_shield_army_plural:99 "Batteries de bouclier"

    maginot_bunker_army:99 "Réseau de fortifications"
    maginot_bunker_army_desc:99 "De vastes réseaux de bunkers, de tranchées et de canons dissimulés destinés à entraver autant que possible les avancées ennemies."
    maginot_bunker_army_plural:99 "Réseaux de fortifications"

    maginot_assault_unit:99 "Unité d'assaut Maginot"
    maginot_assault_unit_desc:99 "Une unité spéciale entraînée dans les installations d'un $name_maginot$ pour les opérations offensives et les invasions planétaires."

    maginot_machine_assault_unit:99 "$maginot_assault_unit$"
    maginot_machine_assault_unit_desc:99 "$maginot_assault_unit_desc$"

    # names given when spawning
    NAME_planetary_artillery:99 "Artillerie planétaire"
    NAME_shield_battery:99 "Batterie de bouclier"
    NAME_fortification_network:99 "Réseau de fortifications"
    NAME_heavy_defender:99 "Unité de défense lourde"

    #################
    ### Buildings ###
    #################
    building_giga_maginot_stronghold:99 "Complexe fortifié Maginot"
    building_giga_maginot_stronghold_desc:99 "De nouvelles techniques dans le domaine de la fortification excessive permettent la construction de complexes comme celui-ci. Construire un $name_maginot_world$ ici étendra ces défenses pour couvrir la planète entière."

    building_giga_maginot_global_bunker:99 "Système de bunkers global Maginot"
    building_giga_maginot_global_bunker_desc:99 "Un système de bunkers profonds couvrant le monde entier confère à nos armées une puissance de frappe sans précédent sur ce monde."

    #################
    ### Decisions ###
    #################
    # subspace disruptor
    decision_maginot_anti_jump_on:99 "£maginot_bunker_01£ Maginot : activer le champ de perturbation sous-spatiale"
    decision_maginot_anti_jump_on_desc:99 "Le $name_maginot_world$ commence à générer un champ de perturbation sous-spatiale, qui interfère avec l'utilisation du sous-espace dans ce système et les systèmes voisins. L'effet est plus faible dans les autres systèmes, cependant."
    # TODO: the value here could be dynamic based on a country value for subspace disruptor range
    decision_maginot_anti_jump_on_effect:99 "Ce système solaire et tous les systèmes solaires à §Y1 saut de distance§! qui sont §Ypossédés par votre empire (ou un vassal)§! reçoivent un modificateur spécial qui empêche l'§Yutilisation des propulseurs de saut§! et le §Yvoyage sous-spatial§!. Le système solaire du $name_maginot_world$ lui-même §Yne peut pas être ciblé par le FND ou l'OQS§!. La vérification est effectuée lorsque la décision est déclenchée, activez et désactivez-la donc pour protéger les systèmes nouvellement apparus/conquis."
    decision_maginot_anti_jump_on_must_not_already_be_active:99 "£trigger_no£ Un autre $name_maginot_world$ dans ce système ou un système voisin génère déjà un champ de perturbation sous-spatiale."

    decision_maginot_anti_jump_off:99 "£maginot_bunker_01£ Maginot : désactiver le champ de perturbation sous-spatiale"
    decision_maginot_anti_jump_off_desc:99 "Le champ est désactivé pour économiser sur l'entretien ou mettre à jour les paramètres de ciblage."
    decision_maginot_anti_jump_off_effect:99 "Ce système et tous les systèmes à §Y1 saut de distance§! qui sont §Ypossédés par votre empire (ou un vassal)§! voient leur protection contre les propulseurs de saut désactivée. Désactivez et réactivez le champ pour couvrir les systèmes nouvellement apparus/conquis."

    # garrison
    decision_maginot_basic_garrison_check:99 "£maginot_bunker_08£ Maginot : actualisation de la garnison"
    decision_maginot_basic_garrison_check_desc:99 "Faire un appel, s'assurer que la garnison est alerte et prête."
    decision_maginot_basic_garrison_check_effect:99 "Supprime et rajoute la §Ygarnison de base de 5 armées§! qui devrait être présente, fournissant une défense terrestre de base pour le $name_maginot_world$.\nActualise les armées accordées par les §YGrilles de défense orbitale§!, les §YRéseaux de générateurs de bouclier§! et les §YComplexes de bunkers§!."
    maginot_wait_for_army_refresh:99 "£trigger_no£ Relancez le jeu pour laisser l'effet se mettre à jour avant de réessayer."

    # orbital defenses
    decision_maginot_repair_strategic_defence_command:99 "£maginot_bunker_02£ Maginot : réparer le commandement de défense stratégique"
    decision_maginot_repair_strategic_defence_command_effect:99 "Répare les systèmes de défense orbitale. Réactive la gestion de la défense orbitale."
    decision_maginot_repair_strategic_defence_command_desc:99 "Ce monde se remet encore d'une bataille récente."
    decision_maginot_repair_strategic_defence_command_no_bombardment:99 "£trigger_no£ La $strategic_defence_command_platform$ ne peut pas être réparée pendant que la planète est bombardée."

    decision_maginot_basic_point_check:99 "£maginot_bunker_03£ §GValeurs des points Maginot§!"
    decision_maginot_basic_point_check_effect:99 "§YValeurs actuelles des points :§! \n§E[this.giga_maginot_current_SD_platform_count] plateformes DS§! \n§E[this.maginot_offensive_upgrade_points_current] $offensive_upgrade_point_plural$ disponibles§! | [this.maginot_offensive_upgrade_points_max] max. depuis les emplois \n§E[this.maginot_defensive_upgrade_points_current] $defensive_upgrade_point_plural$ disponibles§! | [this.maginot_defensive_upgrade_points_max] max. depuis les emplois \n§YModificateurs Maginot actuels :§! \n§S[this.maginot_orbital_defence_hp_upgrades] améliorations PV§! \n§G+[this.maginot_orbital_defence_hp_display] %§! $MOD_SHIP_HULL_MULT$ \n§G+[this.maginot_orbital_defence_hp_display] %§! $MOD_SHIP_ARMOR_MULT$ \n§G+[this.maginot_orbital_defence_hp_display] %§! $MOD_SHIP_SHIELD_MULT$ \n§G+[this.maginot_orbital_defence_hp_regen_display]§! $MOD_SHIP_HULL_REGEN_ADD_STATIC$ \n§G+[this.maginot_orbital_defence_hp_regen_display]§! $MOD_SHIP_ARMOR_REGEN_ADD_STATIC$ \n§G+[this.maginot_orbital_defence_hp_regen_display]§! $MOD_SHIP_SHIELD_REGEN_ADD_STATIC$ \n§S[this.maginot_orbital_defence_atk_upgrades] améliorations ATQ§! \n§G+[this.maginot_orbital_defence_atk_display] %§! $MOD_SHIP_WEAPON_DAMAGE$ \n§G+[this.maginot_orbital_defence_atk_display] %§! $MOD_SHIP_FIRE_RATE_MULT$ \n§S[this.maginot_orbital_defence_trg_upgrades] améliorations CIB§! \n§G+[this.maginot_orbital_defence_range_display] %§! $MOD_SHIP_WEAPON_RANGE_MULT$ \n§G+[this.maginot_orbital_defence_tracking_display]§! $MOD_SHIP_TRACKING_ADD$"
    decision_maginot_basic_point_check_desc:99 "Cliquer sur cette décision actualisera les valeurs comme les points d'amélioration et le nombre de plateformes DS pour utilisation dans d'autres décisions."

    decision_maginot_construct_secondary_SD_platform:99 "£maginot_bunker_04£ §SMaginot : construire une plateforme DS secondaire§!"
    decision_maginot_construct_secondary_SD_platform_effect:99 "Dépensez §Y2§! $offensive_upgrade_point_plural$ pour créer un nouveau $name_asteroid_artillery$ à utiliser comme plateforme de défense stratégique de soutien \n§YPlateformes actuelles :§! [this.giga_maginot_current_SD_platform_count] \n§E[this.maginot_offensive_upgrade_points_current] $offensive_upgrade_point_plural$ disponibles§!"
    decision_maginot_construct_secondary_SD_platform_desc:99 "Placer des astéroïdes en orbite pour l'exploitation minière est dépassé, les évider pour les utiliser comme plateformes de défense est bien plus intéressant."

    decision_maginot_orbital_defence_hp_upgrade:99 "£maginot_bunker_05£ §BMaginot : améliorer les systèmes de protection orbitale§!"
    decision_maginot_orbital_defence_hp_upgrade_effect:99 "§RCoût : [this.maginot_orbital_defence_hp_cost] £alloys£ $alloys$§! \nDépensez §Y1§! $defensive_upgrade_point$ pour \n+25 % $MOD_SHIP_HULL_MULT$ | Actuel §G+[this.maginot_orbital_defence_hp_display] %§! \n+25 % $MOD_SHIP_ARMOR_MULT$ | Actuel §G+[this.maginot_orbital_defence_hp_display] %§! \n+25 % $MOD_SHIP_SHIELD_MULT$ | Actuel §G+[this.maginot_orbital_defence_hp_display] %§! \n+500 $MOD_SHIP_HULL_REGEN_ADD_STATIC$ | Actuel §G+[this.maginot_orbital_defence_hp_regen_display]§! \n+500 $MOD_SHIP_ARMOR_REGEN_ADD_STATIC$ | Actuel §G+[this.maginot_orbital_defence_hp_regen_display]§! \n+500 $MOD_SHIP_SHIELD_REGEN_ADD_STATIC$ | Actuel §G+[this.maginot_orbital_defence_hp_regen_display]§! \n§YNiveau actuel :§! [this.maginot_orbital_defence_hp_upgrades] \n§E[this.maginot_defensive_upgrade_points_current] $defensive_upgrade_point_plural$ disponibles§!"
    decision_maginot_orbital_defence_hp_upgrade_desc:99 "Non seulement les générateurs de bouclier peuvent contribuer leurs boucliers aux plateformes orbitales, mais ils peuvent également être convertis en générateurs de liaison moléculaire pour renforcer l'intégrité de la coque."

    decision_maginot_orbital_defence_atk_upgrade:99 "£maginot_bunker_06£ §RMaginot : améliorer la puissance de feu orbitale§!"
    decision_maginot_orbital_defence_atk_upgrade_effect:99 "§RCoût : [this.maginot_orbital_defence_atk_cost] £alloys£ $alloys$§! \nDépensez §Y1§! $offensive_upgrade_point$ pour \n+10 % $MOD_SHIP_WEAPON_DAMAGE$ | Actuel §G+[this.maginot_orbital_defence_atk_display] %§! \n+10 % $MOD_SHIP_FIRE_RATE_MULT$ | Actuel §G+[this.maginot_orbital_defence_atk_display] %§! \n§YNiveau actuel :§! [this.maginot_orbital_defence_atk_upgrades] \n§E[this.maginot_offensive_upgrade_points_current] $offensive_upgrade_point_plural$ disponibles§!"
    decision_maginot_orbital_defence_atk_upgrade_desc:99 "Plus de canons, c'est toujours mieux. Étendre les installations de liaison pour une coordination sans cesse améliorée de vastes essaims de défense orbitale ne fait jamais de mal non plus."

    decision_maginot_orbital_defence_trg_upgrade:99 "£maginot_bunker_07£ §MMaginot : systèmes de ciblage orbital§!"
    decision_maginot_orbital_defence_trg_upgrade_effect:99 "§RCoût : [this.maginot_orbital_defence_trg_cost] £alloys£ $alloys$§! \nDépensez §Y1§! $defensive_upgrade_point$ pour \n+20 % $MOD_SHIP_WEAPON_RANGE_MULT$ | Actuel §G+[this.maginot_orbital_defence_range_display] %§! \n+5 $MOD_SHIP_TRACKING_ADD$ | Actuel §G+[this.maginot_orbital_defence_tracking_display]§! \n§YNiveau actuel :§! [this.maginot_orbital_defence_trg_upgrades] \n§E[this.maginot_defensive_upgrade_points_current] $defensive_upgrade_point_plural$ disponibles§!"
    decision_maginot_orbital_defence_trg_upgrade_desc:99 "Les stations de capteurs planétaires peuvent remplacer les générateurs de bouclier pour fournir des informations de ciblage améliorées et surveiller l'ensemble du système solaire."

    # upgrade points
    defensive_upgrade_point:99 "£job_maginot_shield_generator_operator£ Point d'amélioration défensive"
    defensive_upgrade_point_plural:99 "$defensive_upgrade_point$s"
    offensive_upgrade_point:99 "£job_maginot_planetary_cannon_operator£ Point d'amélioration offensive"
    offensive_upgrade_point_plural:99 "$offensive_upgrade_point$s"
    # upgrade points triggers
    maginot_no_offensive_upgrade_points_available:99 "£trigger_no£ Aucun $offensive_upgrade_point_plural$ disponible"
    maginot_no_defensive_upgrade_points_available:99 "£trigger_no£ Aucun $defensive_upgrade_point_plural$ disponible"
    maginot_targetting_upgrade_hard_cap:99 "£trigger_no£ Les systèmes de ciblage ne peuvent être améliorés que §Y5 fois§! au total."

    # Mass recruitment decision
    decision_maginot_mass_recruitment:99 "£maginot_bunker_09£ Maginot : recrutement massif"
    decision_maginot_mass_recruitment_desc:99 "Les installations Maginot permettent l'entraînement simultané de grands nombres d'armées spécialisées, soutenant les conquêtes offensives de notre empire."
    decision_maginot_mass_recruitment_effect:99 "Recrute §Y[this.maginot_bunker_count]§! armées d'assaut Maginot spéciales simultanément. \n\nLe nombre d'armées est basé sur le nombre de districts §Y[maginot_world_bunker_name]§! sur la planète, avec un minimum de §Y1§!."

    decision_maginot_mass_recruitment_katzenpanzer:99 "£maginot_bunker_10£ Maginot : recrutement massif de Katzenpanzer"
    decision_maginot_mass_recruitment_katzenpanzer_desc:99 "Un $name_maginot$ est l'endroit parfait pour construire de grandes quantités de $riesigerkatzenpanzer_assault$ des Katzen."
    decision_maginot_mass_recruitment_katzenpanzer_effect:99 "Recrute §Y[this.maginot_bunker_count]§! armées de $riesigerkatzenpanzer_assault$ simultanément. \n\nLe nombre d'armées est basé sur le nombre de districts §Y[maginot_world_bunker_name]§! sur la planète, avec un minimum de §Y1§!."

    #################
    ### Districts ###
    #################
    # housing district
    district_maginot_world_barracks:99 "District de casernes"
    district_maginot_world_barracks_desc:99 "De vastes installations de soutien pour loger les troupes en surface et sous terre, incluant diverses zones de loisirs et de détente."
    district_maginot_world_barracks_plural:99 "Districts de casernes"

    # shield district
    district_maginot_world_shield_generators:99 "Réseau de générateurs de bouclier"
    district_maginot_world_shield_generators_desc:99 "Des émetteurs d'une échelle inouïe pour un seul vaisseau génèrent des champs de force rivalisant avec des flottes entières. Des armements de défense rapprochée supplémentaires et des silos de missiles antimissiles empêchent la plupart des munitions d'aller aussi loin. Des installations de soutien spécialisées peuvent être utilisées pour renforcer les boucliers des plateformes orbitales."
    district_maginot_world_shield_generators_plural:99 "Réseaux de générateurs de bouclier"
    job_maginot_planetary_shield_effect_desc:99 "Fournit 1 armée de §YBatterie de bouclier§! capable d'absorber de vastes quantités de tirs ennemis et 1 §Y$defensive_upgrade_point$§! par tranche de 100 emplois."

    # cannon/orbital uplink district
    district_maginot_world_planetary_cannons:99 "Grille de défense orbitale"
    district_maginot_world_planetary_cannons_desc:99 "Les imposants canons planétaires sont tout à fait capables de pulvériser tout vaisseau en orbite basse — s'assurant que les capitaines de vaisseaux restent bien en dehors de leurs enveloppes de tir. En tant que tels, les canons sont principalement préparés pour des missions d'interception contre les munitions ennemies et les navettes de débarquement. De vastes complexes de commandement et de contrôle s'interfacent avec les systèmes de défense stratégique orbitaux, permettant le déploiement de plus grandes quantités de plateformes, ainsi que le renforcement de celles existantes."
    district_maginot_world_planetary_cannons_plural:99 "Grilles de défense orbitale"

    job_maginot_planetary_artillery_effect_desc:99 "Fournit 1 armée d'§YArtillerie planétaire§! qui inflige des dégâts extrêmes mais est relativement fragile et 1 §Y$offensive_upgrade_point$§! par tranche de 100 emplois."

    # bunker district
    district_maginot_world_bunkers:99 "Complexe de bunkers"
    district_maginot_world_bunkers_desc:99 "Des bunkers et des armements lourds anti-terrestres à perte de vue. Le sol est sillonné de tranchées sans fin, de pièges à chars et de lourdes barrières qui garantissent que rien ne se déplace jamais en ligne droite sur ce monde. Des emplacements de canons camouflés sont prêts à faire pleuvoir l'enfer sur les forces ennemies, leurs champs de tir croisés couvrant chaque mètre carré de la planète. De vastes installations d'entraînement garantissent que nos troupes sont préparées à toute éventualité, et des exercices sont constamment organisés sur tous types de terrain."
    district_maginot_world_bunkers_plural:99 "Complexes de bunkers"
    job_maginot_planetary_bunker_effect_desc:99 "Fournit 1 armée de §YRéseau de fortifications§! qui brise le moral des troupes ennemies tout en infligeant des dégâts constants."

    ### Ringworld versions ###
    # housing district
    district_maginot_ringworld_barracks:99 "Segment de casernes"
    district_maginot_ringworld_barracks_desc:99 "De vastes installations de soutien pour loger les troupes sur et à l'intérieur de ce monde-anneau, incluant diverses zones de loisirs et de détente."
    district_maginot_ringworld_barracks_plural:99 "Segments de casernes"

    # shield district
    district_maginot_ringworld_shield_generators:99 "Segment de générateurs de bouclier"
    district_maginot_ringworld_shield_generators_desc:99 "Des émetteurs d'une échelle inouïe pour un seul vaisseau génèrent des champs de force rivalisant avec des flottes entières. Des armements de défense rapprochée supplémentaires et des silos de missiles antimissiles empêchent la plupart des munitions d'aller aussi loin. Des installations de soutien spécialisées peuvent être utilisées pour renforcer les boucliers des plateformes de l'espace proche."
    district_maginot_ringworld_shield_generators_plural:99 "Segments de générateurs de bouclier"

    # cannon/orbital uplink district
    district_maginot_ringworld_planetary_cannons:99 "Segment de défense orbitale"
    district_maginot_ringworld_planetary_cannons_desc:99 "Équiper notre monde-anneau de batteries d'armes massives le rend tout à fait capable de pulvériser tout vaisseau en orbite basse — s'assurant que les capitaines de vaisseaux restent bien en dehors de toute enveloppe de tir. En tant que tels, les canons sont principalement préparés pour des missions d'interception contre les munitions ennemies et les navettes de débarquement. De vastes complexes de commandement et de contrôle s'interfacent avec les systèmes de défense stratégique de l'espace proche, permettant le déploiement de plus grandes quantités de plateformes, ainsi que le renforcement de celles existantes."
    district_maginot_ringworld_planetary_cannons_plural:99 "Segments de défense orbitale"


    # bunker district
    district_maginot_ringworld_bunkers:99 "Segment de bunkers"
    district_maginot_ringworld_bunkers_desc:99 "Des bunkers et des armements lourds anti-terrestres à perte de vue, s'étendant même jusqu'aux terres incurvées au-dessus. Cette section du monde-anneau n'est pas équipée d'une surface conventionnelle, créant un paysage accidenté avec de nombreuses chutes abruptes semblant mener vers l'espace profond. Des emplacements de canons camouflés sont prêts à faire pleuvoir l'enfer sur les forces ennemies, leurs champs de tir croisés couvrant chaque mètre cube de volume. De vastes installations d'entraînement garantissent que nos troupes sont préparées à toute éventualité, et des exercices sont constamment organisés sur tous types de terrain, y compris l'espace proche et les opérations d'abordage."
    district_maginot_ringworld_bunkers_plural:99 "Segments de bunkers"

    ######################################
    ### District Triggered Names/Descs ###
    ######################################
    #housing district

    #shield district
    zone_maginot_shield_generators_global_shield_network:99 "Réseau de bouclier global" #this only exists because the original zone name is too long to fit :clueless:

    #cannon/orbital uplink district

    # bunker district

    #############
    ### Zones ###
    #############
    zone_maginot_housing:99 "Extension des casernes"
    zone_maginot_housing_desc:99 "Un vaste complexe de casernes abritant du personnel militaire de tous rangs et spécialisations, s'étendant au-delà de l'horizon."
    # zone_maginot_ringworld_housing:99 "$zone_maginot_housing$"
    # zone_maginot_ringworld_housing_desc:99 "$zone_maginot_housing_desc$"

    zone_maginot_entertainment:99 "Zones de loisirs des soldats"
    zone_maginot_entertainment_desc:99 "Des rangées de vastes dômes abritant presque tous les luxes civils que les soldats peuvent souhaiter expérimenter entre les déploiements."
    zone_maginot_ringworld_entertainment:99 "$zone_maginot_entertainment$"
    zone_maginot_ringworld_entertainment_desc:99 "$zone_maginot_entertainment_desc$"

    zone_maginot_logistics:99 "Centres d'approvisionnement naval"
    zone_maginot_logistics_desc:99 "Centres commerciaux civils axés sur l'approvisionnement et la livraison de provisions pour les flottes actives."
    zone_maginot_ringworld_logistics:99 "$zone_maginot_logistics$"
    zone_maginot_ringworld_logistics_desc:99 "$zone_maginot_logistics_desc$"

    zone_maginot_shield_generators:99 "Batteries de bouclier supplémentaires"
    zone_maginot_shield_generators_desc:99 "D'énormes réacteurs à antimatière renforcent les boucliers planétaires déjà immensément puissants, les préparant à la possibilité que des munitions hostiles franchissent nos défenses rapprochées."
    zone_maginot_ringworld_shield_generators:99 "$zone_maginot_shield_generators$"
    zone_maginot_ringworld_shield_generators_desc:99 "$zone_maginot_shield_generators_desc$"

    zone_maginot_orbital_defense_grids:99 "Canons de défense planétaire"
