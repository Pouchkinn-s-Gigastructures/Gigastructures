    maginot_world_0_DESC:99 "Le site de construction d'un futur $name_maginot_world$ à construire dans la planète ci-dessous. Cette forteresse massive s'étendra un jour loin dans le manteau de la planète et au-delà de l'atmosphère jusque dans l'espace profond, présentant un obstacle quasi inexpugnable pour les ennemis. Tous les districts de la planète seront remplacés par des districts défensifs uniques, et la gestion des plateformes de défense planétaire deviendra disponible. Les $orbital_ring_tier_1_plural$ seront incorporés et retirés."
    maginot_world_0_MEGASTRUCTURE_DETAILS:99 "£gigastructural£ $giga_list_category_megastructure$ - $giga_list_category_defensive$ \nFournit de grandes quantités d'§Yarmées de défense§!, d'§Yinhibiteurs FTL§! et bloque les §Ypropulseurs de saut§! — §BNÉCESSITE UN MONDE AVEC UN BÂTIMENT DE COMPLEXE FORTIFIÉ MAGINOT§!\n§LUn vaste complexe-forteresse englobant une planète entière, fournissant la défense planétaire ultime.§!"
