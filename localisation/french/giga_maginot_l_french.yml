    # event popups for stages
    giga_dialog.5001.name:99 "Site de construction du $name_maginot_world$ terminé"
    giga_dialog.5001.desc:99 "Le site de construction d'un futur $name_maginot_world$ est maintenant terminé dans le système [giga_system.GetName]. Bientôt la planète deviendra un immense complexe-forteresse, et nous disposerons de la défense ultime. \n\n§STous les districts de la planète seront remplacés par des districts défensifs uniques, et la gestion de la défense planétaire deviendra disponible. Les $orbital_ring_tier_1_plural$ seront incorporés et retirés.§! \n\n§RATTENTION : Le $name_maginot_world$ est équipé d'un système de sécurité qui fait exploser la planète et anéantit tous les vaisseaux en orbite en cas de destruction de la colonie !§!"
    giga_dialog.5001.a:99 "Excellent."

    giga_dialog.5002.name:99 "Intérieurs du $name_maginot_world$ terminés"
    giga_dialog.5002.desc:99 "Nous sommes un pas plus près d'achever un $name_maginot_world$ dans le système [giga_system.GetName]. La géoformation et la construction spatiale avancent bien, et nous avons creusé les espaces pour les bunkers les plus profonds et les centres de commandement. Nous sommes maintenant prêts à installer le système de sécurité à base d'antimatière et à finaliser les défenses planétaires initiales."
    giga_dialog.5002.a:99 "Excellent."

    giga_dialog.5003.name:99 "$name_maginot_world$ terminé !"
    giga_dialog.5003.desc:99 "Nouvelles fantastiques ! Dans le système [giga_system.GetName], nous avons achevé notre forteresse ultime, qui s'étend de l'espace extra-atmosphérique jusqu'au manteau de la planète. Cette construction véritablement impressionnante est quasi inexpugnable par n'importe quelle force, comportant des défenses orbitales intégrées, des canons planétaires, de vastes bunkers de surface, des complexes de commandement souterrains profonds, et des générateurs de bouclier surpassant de loin les capacités de génération de flottes navales entières. \nDe plus, le système final de la Main Morte protège même contre la destruction planétaire totale, en utilisant la planète entière comme une vaste charge creuse alimentée à l'antimatière en cas d'activation du système de sécurité — §Ranéantissant complètement toute force hostile en orbite.§! \n\nLes différents systèmes de défense peuvent être gérés via les §Ydécisions§!. Construisez des §Ydistricts§! et pourvoyez les §Yemplois§! pour obtenir des §E$defensive_upgrade_point_plural$§! et des §E$offensive_upgrade_point_plural$§! à utiliser avec ces décisions."
    giga_dialog.5003.a:99 "Enfin, nous sommes en sécurité."

    # ringworld versions
    giga_dialog.5004.name:99 "Site de construction du $name_maginot_ringworld$ terminé"
    giga_dialog.5004.desc:99 "Le site de construction d'un futur $name_maginot_ringworld$ est maintenant terminé dans le système [giga_system.GetName]. Bientôt cette partie de l'anneau deviendra un immense complexe-forteresse, et nous disposerons de la défense ultime. \n\n§STous les districts de la planète seront remplacés par des districts défensifs uniques, et la gestion des plateformes de défense de l'espace proche deviendra disponible.§! \n\n§RATTENTION : Le $name_maginot_ringworld$ est équipé d'un système de sécurité qui fait exploser le monde et anéantit tous les vaisseaux en orbite en cas de destruction de la colonie !§!"
    giga_dialog.5004.a:99 "Excellent."

    giga_dialog.5005.name:99 "Extérieurs du $name_maginot_ringworld$ terminés"
    giga_dialog.5005.desc:99 "Nous sommes un pas plus près d'achever un $name_maginot_ringworld$ dans le système [giga_system.GetName]. La construction spatiale et le remodelage de surface avancent bien, et nous avons sélectionné les espaces pour les bunkers les plus profonds et les centres de commandement. Nous sommes maintenant prêts à installer le système de sécurité à base d'antimatière et à finaliser les défenses initiales de l'anneau."
    giga_dialog.5005.a:99 "Excellent."

    giga_dialog.5006.name:99 "$name_maginot_ringworld$ terminé !"
    giga_dialog.5006.desc:99 "Nouvelles fantastiques ! Dans le système [giga_system.GetName], nous avons achevé notre forteresse ultime, qui encercle partiellement une étoile entière. Cette construction véritablement impressionnante est quasi inexpugnable par n'importe quelle force, comportant des défenses de l'espace proche intégrées, des batteries superstructurelles, de vastes segments de bunkers, des complexes de commandement profondément enfouis, et des générateurs de bouclier surpassant de loin les capacités de génération de flottes navales entières. \nDe plus, le système final de la Main Morte protège même contre la destruction totale du segment, en utilisant la superstructure entière comme une vaste charge creuse alimentée à l'antimatière en cas d'activation du système de sécurité — §Ranéantissant complètement toute force hostile en orbite.§! \n\nLes différents systèmes de défense peuvent être gérés via les §Ydécisions§!. Construisez des §Ydistricts§! et pourvoyez les §Yemplois§! pour obtenir des §E$defensive_upgrade_point_plural$§! et des §E$offensive_upgrade_point_plural$§! à utiliser avec ces décisions."
    giga_dialog.5006.a:99 "Enfin, nous sommes en sécurité."

