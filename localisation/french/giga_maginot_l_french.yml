l_french:

    ###############
    ### Maginot ###
    ###############
    name_maginot:0 "Monde Maginot"
    is_giga_maginot_world:0 "$TRIGGER_FAIL$§RDoit être un Monde Maginot.§!"
    giga_tech_repeatable_maginot_cap:0 "Protocoles de gestion des Mondes Maginot"
    giga_tech_repeatable_maginot_cap_desc:0 "Des protocoles avancés de construction et de maintenance permettant la construction et la gestion de §YMondes Maginot§! supplémentaires au sein des frontières de notre empire."
    giga_maginot_capacity_increase_title:0 "Capacité de §YMondes Maginot§! : §G+1§!"
    giga_maginot_capacity_increase_desc:0 "La capacité impériale de §YMondes Maginot§! est augmentée de §G+1§!"

    d_maginot_subspace_disruptor:0 "Système de perturbation sous-spatiale Maginot"
    d_maginot_subspace_disruptor_desc:0 "Ce $name_maginot_world$ génère un puissant champ de perturbation qui se propage à travers le sous-espace, empêchant le fonctionnement des trous de ver dans ce système. De plus, les propulseurs à saut sont rendus inopérants dans ce système et les systèmes adjacents."

    ##############
    ### Armies ###
    ##############
    heavy_defender:0 "Défenseur lourd"
    heavy_defender_desc:0 "Une force opérationnelle spéciale dédiée à la défense planétaire."
    heavy_defender_plural:0 "Défenseurs lourds"

    robot_heavy_defender:0 "Défenseur lourd robotique"
    robot_heavy_defender_desc:0 "Une force opérationnelle robotique spéciale dédiée à la défense planétaire."
    robot_heavy_defender_plural:0 "Défenseurs lourds robotiques"

    machine_heavy_defender:0 "Défenseur machine lourd"
    machine_heavy_defender_desc:0 "Unités de combat lourdes spécialisées dans la défense planétaire."
    machine_heavy_defender_plural:0 "Défenseurs machines"

    maginot_artillery_army:0 "Artillerie planétaire"
    maginot_artillery_army_desc:0 "D'immenses canons d'artillerie capables de pulvériser les forces d'invasion, mais relativement fragiles."
    maginot_artillery_army_plural:0 "Artilleries planétaires"

    maginot_shield_army:0 "Batterie de boucliers"
    maginot_shield_army_desc:0 "D'énormes générateurs de boucliers conçus pour absorber les dégâts des forces ennemies."
    maginot_shield_army_plural:0 "Batteries de boucliers"

    maginot_bunker_army:0 "Réseau de fortifications"
    maginot_bunker_army_desc:0 "De vastes réseaux de bunkers, de tranchées et de canons dissimulés destinés à entraver autant que possible l'avancée ennemie."
    maginot_bunker_army_plural:0 "Réseaux de fortifications"

    maginot_assault_unit:0 "Unité d'assaut Maginot"
    maginot_assault_unit_desc:0 "Une unité spéciale entraînée dans les installations d'un $name_maginot$ pour les opérations offensives et les invasions planétaires."

    maginot_machine_assault_unit:0 "$maginot_assault_unit$"
    maginot_machine_assault_unit_desc:0 "$maginot_assault_unit_desc$"

    # names given when spawning
    NAME_planetary_artillery:0 "Artillerie planétaire"
    NAME_shield_battery:0 "Batterie de boucliers"
    NAME_fortification_network:0 "Réseau de fortifications"
    NAME_heavy_defender:0 "Unité de défense lourde"

    #################
    ### Buildings ###
    #################
    building_giga_maginot_stronghold:0 "Complexe fortifié Maginot"
    building_giga_maginot_stronghold_desc:0 "De nouvelles techniques dans le domaine de la fortification excessive permettent la construction de complexes comme celui-ci. Construire un $name_maginot_world$ ici étendra ces défenses pour couvrir l'ensemble de la planète."

    building_giga_maginot_global_bunker:0 "Système de bunkers planétaire Maginot"
    building_giga_maginot_global_bunker_desc:0 "Un système de bunkers profonds couvrant toute la planète confère à nos armées une puissance de frappe sans précédent sur ce monde."

    #################
    ### Decisions ###
    #################
    # subspace disruptor
    decision_maginot_anti_jump_on:0 "£maginot_bunker_01£ Maginot : activer le champ de perturbation sous-spatiale"
    decision_maginot_anti_jump_on_desc:0 "Le $name_maginot_world$ commence à générer un champ de perturbation sous-spatiale qui interfère avec l'utilisation du sous-espace dans ce système et les systèmes adjacents. L'effet est cependant plus faible dans les autres systèmes."
    # TODO: the value here could be dynamic based on a country value for subspace disruptor range
    decision_maginot_anti_jump_on_effect:0 "Ce système solaire ainsi que tous les systèmes solaires situés §Yà 1 saut§! et §Yappartenant à votre empire (ou un vassal)§! reçoivent un modificateur spécial qui bloque §Yl'utilisation des propulseurs à saut§! et §Yle voyage sous-spatial§!. Le système solaire du $name_maginot_world$ lui-même §Yne peut pas être ciblé par le FND ou l'OQS§!. La vérification s'effectue au déclenchement de la décision : activez et désactivez-la pour protéger les systèmes nouvellement créés ou conquis."
    decision_maginot_anti_jump_on_must_not_already_be_active:0 "£trigger_no£ Un autre $name_maginot_world$ dans ce système ou un système adjacent génère déjà un champ de perturbation sous-spatiale."

    decision_maginot_anti_jump_off:0 "£maginot_bunker_01£ Maginot : désactiver le champ de perturbation sous-spatiale"
    decision_maginot_anti_jump_off_desc:0 "Le champ est désactivé pour économiser sur la maintenance ou mettre à jour les paramètres de ciblage."
    decision_maginot_anti_jump_off_effect:0 "Ce système ainsi que tous les systèmes situés §Yà 1 saut§! et §Yappartenant à votre empire (ou un vassal)§! voient leur protection contre les propulseurs à saut désactivée. Désactivez et réactivez le champ pour couvrir les systèmes nouvellement créés ou conquis."

    # garrison
    decision_maginot_basic_garrison_check:0 "£maginot_bunker_08£ Maginot : actualisation de la garnison"
    decision_maginot_basic_garrison_check_desc:0 "Effectuer un appel, s'assurer que la garnison est en alerte et préparée."
    decision_maginot_basic_garrison_check_effect:0 "Supprime et réajoute la §Ygarnison de base de 5 armées§! qui devrait être présente, fournissant une défense terrestre de base au $name_maginot_world$.\nActualise les armées octroyées par les §YGrilles de défense orbitale§!, les §YRéseaux de générateurs de boucliers§! et les §YComplexes de bunkers§!."
    maginot_wait_for_army_refresh:0 "£trigger_no£ Relancez le jeu pour que l'effet se mette à jour avant de réessayer."

    # orbital defenses
    decision_maginot_repair_strategic_defence_command:0 "£maginot_bunker_02£ Maginot : réparer le commandement de défense stratégique"
    decision_maginot_repair_strategic_defence_command_effect:0 "Réparer les systèmes de défense orbitale. Réactive la gestion des défenses orbitales."
    decision_maginot_repair_strategic_defence_command_desc:0 "Ce monde se remet encore d'une bataille récente."
    decision_maginot_repair_strategic_defence_command_no_bombardment:0 "£trigger_no£ La $strategic_defence_command_platform$ ne peut pas être réparée pendant que la planète est bombardée."

    decision_maginot_basic_point_check:0 "£maginot_bunker_03£ §GValeurs des points Maginot§!"
    decision_maginot_basic_point_check_effect:0 "§YValeurs actuelles des points :§! \n§E[this.giga_maginot_current_SD_platform_count] plateformes DS§! \n§E[this.maginot_offensive_upgrade_points_current] $offensive_upgrade_point_plural$ disponibles§! | [this.maginot_offensive_upgrade_points_max] max. selon les emplois \n§E[this.maginot_defensive_upgrade_points_current] $defensive_upgrade_point_plural$ disponibles§! | [this.maginot_defensive_upgrade_points_max] max. selon les emplois \n§YModificateurs Maginot actuels :§! \n§S[this.maginot_orbital_defence_hp_upgrades] améliorations PV§! \n§G+[this.maginot_orbital_defence_hp_display]%§! $MOD_SHIP_HULL_MULT$ \n§G+[this.maginot_orbital_defence_hp_display]%§! $MOD_SHIP_ARMOR_MULT$ \n§G+[this.maginot_orbital_defence_hp_display]%§! $MOD_SHIP_SHIELD_MULT$ \n§G+[this.maginot_orbital_defence_hp_regen_display]§! $MOD_SHIP_HULL_REGEN_ADD_STATIC$ \n§G+[this.maginot_orbital_defence_hp_regen_display]§! $MOD_SHIP_ARMOR_REGEN_ADD_STATIC$ \n§G+[this.maginot_orbital_defence_hp_regen_display]§! $MOD_SHIP_SHIELD_REGEN_ADD_STATIC$ \n§S[this.maginot_orbital_defence_atk_upgrades] améliorations ATQ§! \n§G+[this.maginot_orbital_defence_atk_display]%§! $MOD_SHIP_WEAPON_DAMAGE$ \n§G+[this.maginot_orbital_defence_atk_display]%§! $MOD_SHIP_FIRE_RATE_MULT$ \n§S[this.maginot_orbital_defence_trg_upgrades] améliorations CIB§! \n§G+[this.maginot_orbital_defence_range_display]%§! $MOD_SHIP_WEAPON_RANGE_MULT$ \n§G+[this.maginot_orbital_defence_tracking_display]§! $MOD_SHIP_TRACKING_ADD$"
    decision_maginot_basic_point_check_desc:0 "Cliquer sur cette décision actualisera des valeurs comme les points d'amélioration et le nombre de plateformes DS pour utilisation dans d'autres décisions."

    decision_maginot_construct_secondary_SD_platform:0 "£maginot_bunker_04£ §SMaginot : construire une plateforme DS secondaire§!"
    decision_maginot_construct_secondary_SD_platform_effect:0 "Dépenser §Y2§! $offensive_upgrade_point_plural$ pour créer un nouvel $name_asteroid_artillery$ à utiliser comme plateforme de défense stratégique de soutien \n§YPlateformes actuelles :§! [this.giga_maginot_current_SD_platform_count] \n§E[this.maginot_offensive_upgrade_points_current] $offensive_upgrade_point_plural$ disponibles§!"
    decision_maginot_construct_secondary_SD_platform_desc:0 "Mettre des astéroïdes en orbite pour l'exploitation minière est démodé ; les évider pour les utiliser comme plateformes de défense est bien plus intéressant."

    decision_maginot_orbital_defence_hp_upgrade:0 "£maginot_bunker_05£ §BMaginot : améliorer les systèmes de protection orbitale§!"
    decision_maginot_orbital_defence_hp_upgrade_effect:0 "§RCoût : [this.maginot_orbital_defence_hp_cost] £alloys£ $alloys$§! \nDépenser §Y1§! $defensive_upgrade_point$ pour \n+25 % $MOD_SHIP_HULL_MULT$ | Actuel §G+[this.maginot_orbital_defence_hp_display]%§! \n+25 % $MOD_SHIP_ARMOR_MULT$ | Actuel §G+[this.maginot_orbital_defence_hp_display]%§! \n+25 % $MOD_SHIP_SHIELD_MULT$ | Actuel §G+[this.maginot_orbital_defence_hp_display]%§! \n+500 $MOD_SHIP_HULL_REGEN_ADD_STATIC$ | Actuel §G+[this.maginot_orbital_defence_hp_regen_display]§! \n+500 $MOD_SHIP_ARMOR_REGEN_ADD_STATIC$ | Actuel §G+[this.maginot_orbital_defence_hp_regen_display]§! \n+500 $MOD_SHIP_SHIELD_REGEN_ADD_STATIC$ | Actuel §G+[this.maginot_orbital_defence_hp_regen_display]§! \n§YNiveau actuel :§! [this.maginot_orbital_defence_hp_upgrades] \n§E[this.maginot_defensive_upgrade_points_current] $defensive_upgrade_point_plural$ disponibles§!"
    decision_maginot_orbital_defence_hp_upgrade_desc:0 "Les générateurs de boucliers peuvent non seulement contribuer leurs boucliers aux plateformes orbitales, mais peuvent également être convertis en générateurs de liaison moléculaire pour renforcer l'intégrité structurelle."

    decision_maginot_orbital_defence_atk_upgrade:0 "£maginot_bunker_06£ §RMaginot : améliorer la puissance de feu orbitale§!"
    decision_maginot_orbital_defence_atk_upgrade_effect:0 "§RCoût : [this.maginot_orbital_defence_atk_cost] £alloys£ $alloys$§! \nDépenser §Y1§! $offensive_upgrade_point$ pour \n+10 % $MOD_SHIP_WEAPON_DAMAGE$ | Actuel §G+[this.maginot_orbital_defence_atk_display]%§! \n+10 % $MOD_SHIP_FIRE_RATE_MULT$ | Actuel §G+[this.maginot_orbital_defence_atk_display]%§! \n§YNiveau actuel :§! [this.maginot_orbital_defence_atk_upgrades] \n§E[this.maginot_offensive_upgrade_points_current] $offensive_upgrade_point_plural$ disponibles§!"
    decision_maginot_orbital_defence_atk_upgrade_desc:0 "Plus de canons, c'est toujours mieux. Développer les installations de liaison pour une coordination toujours meilleure des vastes essaims de défense orbitale ne fait jamais de mal non plus."

    decision_maginot_orbital_defence_trg_upgrade:0 "£maginot_bunker_07£ §MMaginot : systèmes de ciblage orbitaux§!"
    decision_maginot_orbital_defence_trg_upgrade_effect:0 "§RCoût : [this.maginot_orbital_defence_trg_cost] £alloys£ $alloys$§! \nDépenser §Y1§! $defensive_upgrade_point$ pour \n+20 % $MOD_SHIP_WEAPON_RANGE_MULT$ | Actuel §G+[this.maginot_orbital_defence_range_display]%§! \n+5 $MOD_SHIP_TRACKING_ADD$ | Actuel §G+[this.maginot_orbital_defence_tracking_display]§! \n§YNiveau actuel :§! [this.maginot_orbital_defence_trg_upgrades] \n§E[this.maginot_defensive_upgrade_points_current] $defensive_upgrade_point_plural$ disponibles§!"
    decision_maginot_orbital_defence_trg_upgrade_desc:0 "Les stations de détection planétaires peuvent remplacer les générateurs de boucliers pour fournir des informations de ciblage améliorées et surveiller l'ensemble du système solaire."

    # upgrade points
    defensive_upgrade_point:0 "£job_maginot_shield_generator_operator£ Point d'amélioration défensive"
    defensive_upgrade_point_plural:0 "$defensive_upgrade_point$s"
    offensive_upgrade_point:0 "£job_maginot_planetary_cannon_operator£ Point d'amélioration offensive"
    offensive_upgrade_point_plural:0 "$offensive_upgrade_point$s"
    # upgrade points triggers
    maginot_no_offensive_upgrade_points_available:0 "£trigger_no£ Aucun $offensive_upgrade_point_plural$ disponible"
    maginot_no_defensive_upgrade_points_available:0 "£trigger_no£ Aucun $defensive_upgrade_point_plural$ disponible"
    maginot_targetting_upgrade_hard_cap:0 "£trigger_no£ Les systèmes de ciblage ne peuvent être améliorés que §Y5 fois§! au total."

    # Mass recruitment decision
    decision_maginot_mass_recruitment:0 "£maginot_bunker_09£ Maginot : recrutement massif"
    decision_maginot_mass_recruitment_desc:0 "Les installations Maginot permettent l'entraînement simultané d'un grand nombre d'armées spécialisées, soutenant les conquêtes offensives de notre empire."
    decision_maginot_mass_recruitment_effect:0 "Recrute §Y[this.maginot_bunker_count]§! armées d'assaut Maginot spéciales simultanément. \n\nLe nombre d'armées est basé sur le nombre de districts §Y[maginot_world_bunker_name]§! sur la planète, avec un minimum de §Y1§!."

    decision_maginot_mass_recruitment_katzenpanzer:0 "£maginot_bunker_10£ Maginot : recrutement massif de Katzenpanzers"
    decision_maginot_mass_recruitment_katzenpanzer_desc:0 "Un $name_maginot$ est l'endroit idéal pour construire de grandes quantités de $riesigerkatzenpanzer_assault$ des Katzen."
    decision_maginot_mass_recruitment_katzenpanzer_effect:0 "Recrute §Y[this.maginot_bunker_count]§! armées de $riesigerkatzenpanzer_assault$ simultanément. \n\nLe nombre d'armées est basé sur le nombre de districts §Y[maginot_world_bunker_name]§! sur la planète, avec un minimum de §Y1§!."

    #################
    ### Districts ###
    #################
    # housing district
    district_maginot_world_barracks:0 "District de casernes"
    district_maginot_world_barracks_desc:0 "De vastes installations de soutien pour loger les troupes en surface et sous terre, comprenant diverses zones de loisirs et de détente."
    district_maginot_world_barracks_plural:0 "Districts de casernes"

    # shield district
    district_maginot_world_shield_generators:0 "Réseau de générateurs de boucliers"
    district_maginot_world_shield_generators_desc:0 "Des émetteurs d'une échelle inouïe pour un seul vaisseau génèrent des champs de force rivalisant avec des flottes entières. Des armements de défense rapprochée et des silos de missiles anti-missiles supplémentaires empêchent la plupart des munitions d'aller aussi loin. Des installations de soutien spécialisées peuvent être utilisées pour renforcer les boucliers des plateformes orbitales."
    district_maginot_world_shield_generators_plural:0 "Réseaux de générateurs de boucliers"
    job_maginot_planetary_shield_effect_desc:0 "Fournit 1 armée §YBatterie de boucliers§! capable d'absorber d'énormes quantités de tir ennemi et 1 §Y$defensive_upgrade_point$§! pour 100 emplois."

    # cannon/orbital uplink district
    district_maginot_world_planetary_cannons:0 "Grille de défense orbitale"
    district_maginot_world_planetary_cannons_desc:0 "Les imposants canons planétaires sont parfaitement capables de déchiqueter tout vaisseau en orbite basse, obligeant les capitaines de vaisseaux à rester bien en dehors de leurs enveloppes de tir. Ces canons sont donc principalement préparés pour des missions d'interception contre les munitions et les vaisseaux de débarquement ennemis. De vastes complexes de commandement et de contrôle s'interfacent avec les systèmes de défense stratégique orbitaux, permettant le déploiement d'un plus grand nombre de plateformes ainsi que le renforcement de celles existantes."
    district_maginot_world_planetary_cannons_plural:0 "Grilles de défense orbitale"

    job_maginot_planetary_artillery_effect_desc:0 "Fournit 1 armée §YArtillerie planétaire§! qui inflige des dégâts extrêmes mais est relativement fragile, et 1 §Y$offensive_upgrade_point$§! pour 100 emplois."

    # bunker district
    district_maginot_world_bunkers:0 "Complexe de bunkers"
    district_maginot_world_bunkers_desc:0 "Des bunkers et de l'armement lourd anti-sol à perte de vue. Le terrain est sillonné de tranchées interminables, de pièges antichars et de lourdes barrières qui garantissent que rien ne se déplace jamais en ligne droite sur ce monde. Des emplacements de canons camouflés sont prêts à faire pleuvoir l'enfer sur les forces ennemies, leurs champs de tir croisés couvrant chaque mètre carré de la planète. Des installations d'entraînement étendues garantissent que nos troupes sont préparées à toute éventualité, et des exercices sont constamment organisés sur tous types de terrain."
    district_maginot_world_bunkers_plural:0 "Complexes de bunkers"
    job_maginot_planetary_bunker_effect_desc:0 "Fournit 1 armée §YRéseau de fortifications§! qui sape le moral des troupes ennemies tout en infligeant des dégâts réguliers."

    ### Ringworld versions ###
    # housing district
    district_maginot_ringworld_barracks:0 "Segment de casernes"
    district_maginot_ringworld_barracks_desc:0 "De vastes installations de soutien pour loger les troupes sur et à l'intérieur de ce monde-anneau, comprenant diverses zones de loisirs et de détente."
    district_maginot_ringworld_barracks_plural:0 "Segments de casernes"

    # shield district
    district_maginot_ringworld_shield_generators:0 "Segment de générateurs de boucliers"
    district_maginot_ringworld_shield_generators_desc:0 "Des émetteurs d'une échelle inouïe pour un seul vaisseau génèrent des champs de force rivalisant avec des flottes entières. Des armements de défense rapprochée et des silos de missiles anti-missiles supplémentaires empêchent la plupart des munitions d'aller aussi loin. Des installations de soutien spécialisées peuvent être utilisées pour renforcer les boucliers des plateformes spatiales proches."
    district_maginot_ringworld_shield_generators_plural:0 "Segments de générateurs de boucliers"

    # cannon/orbital uplink district
    district_maginot_ringworld_planetary_cannons:0 "Segment de défense orbitale"
    district_maginot_ringworld_planetary_cannons_desc:0 "Équiper notre monde-anneau de batteries d'armes massives le rend parfaitement capable de déchiqueter tout vaisseau en orbite basse, obligeant les capitaines de vaisseaux à rester bien en dehors de toute enveloppe de tir. Ces canons sont donc principalement préparés pour des missions d'interception contre les munitions et les vaisseaux de débarquement ennemis. De vastes complexes de commandement et de contrôle s'interfacent avec les systèmes de défense stratégique de l'espace proche, permettant le déploiement d'un plus grand nombre de plateformes ainsi que le renforcement de celles existantes."
    district_maginot_ringworld_planetary_cannons_plural:0 "Segments de défense orbitale"


    # bunker district
    district_maginot_ringworld_bunkers:0 "Segment de bunkers"
    district_maginot_ringworld_bunkers_desc:0 "Des bunkers et de l'armement lourd anti-sol à perte de vue, s'étendant même jusqu'aux terres courbées au-dessus. Cette section du monde-anneau n'est pas équipée d'une surface conventionnelle, créant un paysage chaotique avec de nombreuses chutes abruptes semblant mener vers l'espace profond. Des emplacements de canons camouflés sont prêts à faire pleuvoir l'enfer sur les forces ennemies, leurs champs de tir croisés couvrant chaque mètre cube de volume. Des installations d'entraînement étendues garantissent que nos troupes sont préparées à toute éventualité, et des exercices sont constamment organisés sur tous types de terrain, y compris des opérations en espace proche et d'abordage."
    district_maginot_ringworld_bunkers_plural:0 "Segments de bunkers"

    ######################################
    ### District Triggered Names/Descs ###
    ######################################
    #housing district

    #shield district
    zone_maginot_shield_generators_global_shield_network:0 "Réseau de boucliers planétaire" #this only exists because the original zone name is too long to fit :clueless:

    #cannon/orbital uplink district

    # bunker district

    #############
    ### Zones ###
    #############
    zone_maginot_housing:0 "Extension des casernes"
    zone_maginot_housing_desc:0 "Un vaste complexe de casernes abritant du personnel militaire de tous grades et spécialisations, s'étendant au-delà de l'horizon."
    # zone_maginot_ringworld_housing:0 "$zone_maginot_housing$"
    # zone_maginot_ringworld_housing_desc:0 "$zone_maginot_housing_desc$"

    zone_maginot_entertainment:0 "Zones de loisirs pour soldats"
    zone_maginot_entertainment_desc:0 "Des rangées de vastes dômes abritant presque tous les luxes civils que les soldats pourraient souhaiter entre les déploiements."
    zone_maginot_ringworld_entertainment:0 "$zone_maginot_entertainment$"
    zone_maginot_ringworld_entertainment_desc:0 "$zone_maginot_entertainment_desc$"

    zone_maginot_logistics:0 "Centres d'approvisionnement naval"
    zone_maginot_logistics_desc:0 "Centres de commerce civils spécialisés dans l'approvisionnement et la livraison de provisions pour les flottes actives."
    zone_maginot_ringworld_logistics:0 "$zone_maginot_logistics$"
    zone_maginot_ringworld_logistics_desc:0 "$zone_maginot_logistics_desc$"

    zone_maginot_shield_generators:0 "Batteries de boucliers supplémentaires"
    zone_maginot_shield_generators_desc:0 "D'immenses réacteurs à antimatière renforcent les boucliers planétaires déjà extrêmement puissants, les préparant à l'éventualité de munitions hostiles perçant nos défenses rapprochées."
    zone_maginot_ringworld_shield_generators:0 "$zone_maginot_shield_generators$"
    zone_maginot_ringworld_shield_generators_desc:0 "$zone_maginot_shield_generators_desc$"

