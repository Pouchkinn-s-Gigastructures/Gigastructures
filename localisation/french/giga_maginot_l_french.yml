    # event popups for stages
    giga_dialog.5001.name:0 "Site de construction du $name_maginot_world$ achevé"
    giga_dialog.5001.desc:0 "Le site de construction d'un futur $name_maginot_world$ est maintenant achevé dans le système [giga_system.GetName]. Bientôt, la planète deviendra un immense complexe fortifié, et nous disposerons de la défense ultime. \n\n§STous les districts de la planète seront remplacés par des districts défensifs uniques, et la gestion de la défense planétaire deviendra disponible. Les $orbital_ring_tier_1_plural$ seront incorporés et retirés.§! \n\n§RATTENTION : Le $name_maginot_world$ est équipé d'un système de sécurité qui fait exploser la planète et anéantit tout vaisseau en orbite en cas de destruction de la colonie !§!"
    giga_dialog.5001.a:0 "Excellent."

    giga_dialog.5002.name:0 "Intérieurs du $name_maginot_world$ achevés"
    giga_dialog.5002.desc:0 "Nous sommes un pas plus près d'achever un $name_maginot_world$ dans le système [giga_system.GetName]. La géoformation et la construction spatiale sont bien avancées, et nous avons creusé les espaces pour les bunkers et centres de commandement les plus profonds. Nous sommes maintenant prêts à installer le système de sécurité à antimatière et à finaliser les défenses planétaires initiales."
    giga_dialog.5002.a:0 "Excellent."

    giga_dialog.5003.name:0 "$name_maginot_world$ achevé !"
    giga_dialog.5003.desc:0 "Nouvelles fantastiques ! Dans le système [giga_system.GetName], nous avons achevé notre forteresse ultime, qui s'étend de l'espace jusqu'au manteau planétaire. Cette construction véritablement impressionnante est quasiment imprenable par n'importe quelle force, comprenant des défenses orbitales intégrées, des canons planétaires, de vastes bunkers de surface, des complexes de commandement souterrains profonds et des générateurs de boucliers surpassant largement les capacités de génération de flottes navales entières. \nDe plus, le système final de la Main morte protège contre même la destruction planétaire totale, en utilisant la planète entière comme une vaste charge creuse alimentée à l'antimatière en cas d'activation du système de sécurité — §Ranéantissant complètement toute force hostile en orbite.§! \n\nLes différents systèmes de défense peuvent être gérés via les §Ydécisions§!. Construisez des §Ydistricts§! et pourvoyez les §Yemplois§! pour obtenir des §E$defensive_upgrade_point_plural$§! et des §E$offensive_upgrade_point_plural$§! à utiliser avec ces décisions."
    giga_dialog.5003.a:0 "Enfin, nous sommes en sécurité."

    # ringworld versions
    giga_dialog.5004.name:0 "Site de construction du $name_maginot_ringworld$ achevé"
    giga_dialog.5004.desc:0 "Le site de construction d'un futur $name_maginot_ringworld$ est maintenant achevé dans le système [giga_system.GetName]. Bientôt, cette partie de l'anneau deviendra un immense complexe fortifié, et nous disposerons de la défense ultime. \n\n§STous les districts de la planète seront remplacés par des districts défensifs uniques, et la gestion des plateformes de défense de l'espace proche deviendra disponible.§! \n\n§RATTENTION : Le $name_maginot_ringworld$ est équipé d'un système de sécurité qui fait exploser le monde et anéantit tout vaisseau en orbite en cas de destruction de la colonie !§!"
    giga_dialog.5004.a:0 "Excellent."

    giga_dialog.5005.name:0 "Extérieurs du $name_maginot_ringworld$ achevés"
    giga_dialog.5005.desc:0 "Nous sommes un pas plus près d'achever un $name_maginot_ringworld$ dans le système [giga_system.GetName]. La construction spatiale et le remodelage de la surface sont bien avancés, et nous avons sélectionné les espaces pour les bunkers et centres de commandement les plus profonds. Nous sommes maintenant prêts à installer le système de sécurité à antimatière et à finaliser les défenses initiales de l'anneau."
    giga_dialog.5005.a:0 "Excellent."

    giga_dialog.5006.name:0 "$name_maginot_ringworld$ achevé !"
    giga_dialog.5006.desc:0 "Nouvelles fantastiques ! Dans le système [giga_system.GetName], nous avons achevé notre forteresse ultime, qui encercle partiellement une étoile entière. Cette construction véritablement impressionnante est quasiment imprenable par n'importe quelle force, comprenant des défenses spatiales proches intégrées, des batteries superstructurelles, de vastes segments de bunkers, des complexes de commandement profondément enfouis et des générateurs de boucliers surpassant largement les capacités de génération de flottes navales entières. \nDe plus, le système final de la Main morte protège contre même la destruction totale du segment, en utilisant la superstructure entière comme une vaste charge creuse alimentée à l'antimatière en cas d'activation du système de sécurité — §Ranéantissant complètement toute force hostile en orbite.§! \n\nLes différents systèmes de défense peuvent être gérés via les §Ydécisions§!. Construisez des §Ydistricts§! et pourvoyez les §Yemplois§! pour obtenir des §E$defensive_upgrade_point_plural$§! et des §E$offensive_upgrade_point_plural$§! à utiliser avec ces décisions."
    giga_dialog.5006.a:0 "Enfin, nous sommes en sécurité."

