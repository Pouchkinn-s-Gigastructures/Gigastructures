    maginot_world_0_DESC:99 "Le site de construction d'un futur $name_maginot_world$ à bâtir dans la planète ci-dessous. Cette forteresse massive s'étendra un jour profondément dans le manteau planétaire et au-delà de l'atmosphère jusque dans l'espace profond, présentant un obstacle quasi inexpugnable aux ennemis. Tous les districts de la planète seront remplacés par des districts défensifs uniques, et la gestion des plateformes de défense planétaire deviendra disponible. Les $orbital_ring_tier_1_plural$ seront intégrés et supprimés."
    maginot_world_0_MEGASTRUCTURE_DETAILS:99 "£gigastructural£ $giga_list_category_megastructure$ - $giga_list_category_defensive$ \nFournit de grandes quantités d'§YArmées de défense§!, des §YInhibiteurs FTL§! et bloque les §YPropulseurs de saut§! — §BNÉCESSITE UN MONDE AVEC LE BÂTIMENT COMPLEXE FORTIFIÉ MAGINOT§ !\n§LUne vaste forteresse englobant une planète entière, offrant la défense planétaire ultime.§!"
