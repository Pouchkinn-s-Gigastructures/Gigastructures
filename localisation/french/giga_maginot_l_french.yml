    GIGA_MAGINOT_STAR_REACTOR:99 "Réseau de captage coronal"
    GIGA_MAGINOT_STAR_REACTOR_DESC:99 "L'ingénierie hyperdimensionnelle et la maîtrise du contrôle stellaire permettent à des capteurs stellaires non locaux d'alimenter tous les systèmes Maginot."

    GIGA_MAGINOT_OMEGA_LANCE:99 "Lance d'annihilation Oméga"
    GIGA_MAGINOT_OMEGA_LANCE_DESC:99 "Une arme littéralement de la taille d'une lune ; rien de moins ne fera l'affaire pour protéger notre $name_maginot_world$. Alimentée par un réacteur massif installé dans le noyau de la planète hôte et régulée par une pléthore de systèmes sous la croûte, cette lance énergétique peut et va déchiqueter tout ce qui se trouve sur son chemin."

    GIGA_MAGINOT_KINETIC_BATTERY:99 "Batteries planétaires lourdes"
    GIGA_MAGINOT_KINETIC_BATTERY_DESC:99 "Batteries cinétiques massives construites à la surface du $name_maginot_world$, capables d'une dévastation immense lorsqu'elles sont interconnectées avec les systèmes orbitaux."

    GIGA_MAGINOT_DEFENCE_DRONE_SWARM:99 "Essaim de drones de défense orbitale"
    GIGA_MAGINOT_DEFENCE_DRONE_SWARM_DESC:99 "Un essaim de drones liés à leur $name_maginot_world$ hôte ; ils ne nécessitent ni équipage, ni générateurs de boucliers embarqués, ni noyaux de commandement indépendants, et peuvent ainsi opérer plus efficacement au combat que des chasseurs en vol libre de taille similaire."

    ##################
    ### Technology ###
    ##################
    giga_tech_maginot_world:99 "Théorie de la défense par point d'appui ultime"
    giga_tech_maginot_world_desc:99 "Pour défendre notre empire, nous devons construire le point d'appui défensif ultime et transformer une planète entière en un complexe fortifié massif — le $name_maginot_world$. \n\nCe monde sera équipé de défenses orbitales, de canons planétaires, d'innombrables bunkers, de complexes de commandement souterrains profonds et de générateurs de boucliers de la taille d'un continent. De plus, un système Main Morte sera développé pour dissuader les vaisseaux de guerre de classe Colosse ennemis.\n\n§YLe bâtiment planétaire est nécessaire pour commencer la construction du $name_maginot_world$§!, mais le bâtiment peut également être construit dans d'autres emplacements non adaptés au développement complet."
    maginot_desc:99 "Une vaste forteresse couvrant une planète entière qui aspire à être totalement inexpugnable pour toute force ennemie."
    allow_maginot:99 "§HDébloque la mégastructure :§! $name_maginot_world$"

    giga_tech_maginot_firepower_1:99 "Puissance de feu Maginot améliorée"
    giga_tech_maginot_firepower_1_desc:99 "Les développements pratiques étant achevés, nous pouvons maintenant nous concentrer sur le fait de repousser encore les limites concernant diverses optimisations pour les systèmes du $name_maginot_world$. En particulier, une puissance de feu toujours plus grande."
    allow_giga_maginot_firepower_1:99 "Dégâts des armes Maginot : §G+25 %§! \nCadence de tir des armes Maginot : §G+10 %§! \nPortée des armes Maginot : §G+20 %§!"
    # display upgrade in decisions tooltip
    maginot_display_firepower_1:99 "\n§BTech. $giga_tech_maginot_firepower_1$§! : \n§G+25 %§! $MOD_SHIP_WEAPON_DAMAGE$ \n§G+10 %§! $MOD_SHIP_FIRE_RATE_MULT$ \n§G+20 %§! $MOD_SHIP_WEAPON_RANGE_MULT$"

    giga_tech_maginot_planetcraft_upgrade:99 "Techniques de renforcement Maginot mises à jour"
    giga_tech_maginot_planetcraft_upgrade_desc:99 "La nouvelle génération de vaisseaux de guerre célestes a révélé plusieurs améliorations possibles dans le renforcement Maginot, nous permettant de rendre ces structures toujours plus durables face à des menaces croissantes. De plus, certaines améliorations d'armes et de réacteur peuvent être rétrofit."
    allow_giga_maginot_planetcraft_upgrade:99 "§HDébloque la section de plateforme :§! Plateforme de défense stratégique Maginot améliorée \nDégâts des armes Maginot : §G+50 %§! \nCoque Maginot : §G+500 000§! \nBlindage Maginot : §G+200 000§! \nBoucliers Maginot : §G+200 000§!"
    # display upgrade in decisions tooltip
    maginot_display_planetcraft_upgrade:99 "§BTech. $giga_tech_maginot_planetcraft_upgrade$§! : \n§G+50 %§! $MOD_SHIP_WEAPON_DAMAGE$ \n§G+500 000§! $MOD_SHIP_HULL_ADD$ \n§G+200 000§! $MOD_SHIP_ARMOR_ADD$ \n§G+200 000§! $MOD_SHIP_SHIELD_ADD$"

    giga_tech_maginot_systemcraft_upgrade:99 "Retrofit stellaire"
    giga_tech_maginot_systemcraft_upgrade_desc:99 "Même si les étoiles elles-mêmes se déplacent désormais à notre commandement, nous ne devons pas négliger nos défenses. Nos innovations les plus récentes permettent plusieurs améliorations fondamentales des mesures de protection Maginot."
    allow_giga_maginot_systemcraft_upgrade:99 "§HDébloque la section de plateforme :§! Plateforme de défense stratégique Maginot niveau vaisseau-système \nDégâts des armes Maginot : §G+250 %§! \nCadence de tir des armes Maginot : §G+100 %§! \nPrécision Maginot : §G+20§! \nTracking Maginot : §G+10§! \nCoque Maginot : §G+5 000 000§! \nBlindage Maginot : §G+2 000 000§! \nBoucliers Maginot : §G+2 000 000§!"
    # display upgrade in decisions tooltip
    maginot_display_systemcraft_upgrade:99 "§BTech. $giga_tech_maginot_systemcraft_upgrade$§! : \n§G+250 %§! $MOD_SHIP_WEAPON_DAMAGE$ \n§G+100 %§! $MOD_SHIP_FIRE_RATE_MULT$ \n§G+20§! $MOD_SHIP_ACCURACY_ADD$ \n§G+10§! $MOD_SHIP_TRACKING_ADD$ \n§G+5 000 000§! $MOD_SHIP_HULL_ADD$ \n§G+2 000 000§! $MOD_SHIP_ARMOR_ADD$ \n§G+2 000 000§! $MOD_SHIP_SHIELD_ADD$"
