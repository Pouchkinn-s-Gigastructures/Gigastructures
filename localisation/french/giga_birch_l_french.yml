    origin_birch:99 "Monde de Birch déclinant"
    origin_birch_desc:99 "La vision du monde de cette civilisation a été bouleversée lorsqu'un impact massif d'astéroïde a percé un trou dans leur ciel. Réalisant que leur monde est une vaste et antique mégastructure, ils se sont tournés vers l'intérieur à la recherche d'un moyen de sauver leur foyer déclinant."
    origin_birch_effects:99 "— Commencez avec un §H$pc_origin_birch$§! dans le §HCoeur galactique§! comme monde natal.\n— Le §HCoeur galactique§! commence ouvert à la galaxie.\n— Commencez avec la situation §H« $giga_situation_birch_origin$ »§!.\n— Accès à des §H$district_giga_origin_birch_lab_plural$§! uniques sur votre monde natal, améliorables par l'§HExploration§!.\n— Débloquez de puissants modificateurs pour votre monde natal grâce à l'§HExploration§!.\n— Le §H$pc_origin_birch$§! peut être réparé, débloquant des districts §HInsula§! et §HSecteur§! spéciaux du §H$pc_birch$§!.\n— Préférence d'habitabilité fixée à §H$trait_pc_birch_preference$§!, rendant la colonisation de la plupart des planètes bien plus difficile.\n— Une planète proche pourrait détenir la clé d'une colonisation élargie.\n\n§RPlusieurs joueurs ne peuvent pas utiliser cette origine. Tout empire avec cette origine après le premier sera généré avec $origin_default$ à la place.§!"

    #giga_birch_start_dialog:99 "We do not know what happened to our ancestors. Enemies, plague, civil war? They exist now as myths and legends, their knowledge and power lost. They somehow built this vast world around the black hole at the centre of our galaxy, now we live in the vast, echoing expanse designed to house a million times more people than are left.\nAs all but the last sections have fallen into disrepair and uselessness our people have been filled with a new sense of purpose: we must unite and take our place against in the stars, or we will be lost forever to history.\n\nOur first order of business will be to appoint a governor. Then we need to make sure we are working the right jobs:\n"

    #giga_start_screen_birch:99 "$giga_birch_start_dialog$We need a §Y$job_structure_manager$§! to stop the place falling to ruins.\n\nWe may have to make some people redundant from their preferred job to make that happen."

    #giga_start_screen_birch_hive:99 "$giga_birch_start_dialog$We need a §Y$job_structure_process$§! to stop the place falling to ruins."

    #giga_start_screen_birch_machine:99 "$giga_birch_start_dialog$We need a §Y$job_structure_process$§! to stop the place falling to ruins."

    giga_start_screen_birch:99 "Nous ne savons presque rien de notre lointain passé. Jusqu'à il y a quelques siècles, nous pensions que [GetHomeWorldName] était tout ce qui existait — une barrière impénétrable en dessous de nous, une autre maintenue à un millier de kilomètres au-dessus par de grandes flèches, et les étoiles roulantes traçant leur chemin à travers le ciel pour marquer le jour et la nuit.\n\nUn impact massif d'astéroïde a fracassé nos certitudes en perçant un trou droit à travers la barrière supérieure, nous révélant l'univers au-delà. En nous appuyant sur la flèche la plus proche, nous avons construit une tour pour atteindre la brèche et fait nos premiers pas hésitants vers la galaxie élargie.\n\nLes antiques spatioports et chantiers navals que nous avons trouvés sur la surface extérieure ont tout changé. Alors que nos premiers vaisseaux spatiaux voyageaient vers l'extérieur, nous avons réalisé que notre foyer n'était pas naturel. C'était plutôt une colossale sphère artificielle, manifestement en état de délabrement.\n\nN'ayant trouvé aucune réponse supplémentaire là-haut, nous planifions maintenant une grande expédition pour trouver un moyen d'accéder aux couches théoriques en dessous."

    giga_birch.title:99 "Hyper-lignes du coeur découvertes"
    giga_birch.desc:99 "Nous avons réussi à faire fonctionner correctement nos capteurs et avons découvert que nous ne sommes pas seuls au centre de la galaxie. Il existe un petit nombre de systèmes qui ont été attirés plus près que l'anneau galactique principal par la gravité du trou noir.\n\nPour l'instant, il ne semble y avoir aucune connexion avec le reste de la galaxie. D'après notre traduction de fragments de journaux, nous pensons que la gravité du trou noir interfère avec les connexions entre les systèmes intérieurs et les systèmes réguliers, et que toutes les hyper-lignes entre eux s'affaibliraient et s'estomperaient sans trafic.\n\nNous avons lancé un §Yprojet spécial§! pour les localiser et les ouvrir."

    giga_birch.003.name:99 "Le coeur galactique connecté à la galaxie"
    giga_birch.003.desc:99 "Avec une décharge détectable sur tous nos instruments, des hyper-lignes se sont ouvertes entre le coeur galactique et le reste de la galaxie.\n\nNous pouvons partir. Mais que trouverons-nous là-bas ?"
    giga_birch.003.desc2:99 "Avec une décharge détectable sur tous nos instruments, des hyper-lignes se sont ouvertes entre le coeur galactique et le reste de la galaxie.\n\nCe n'est pas nous qui avons causé cela, nous en sommes certains ! La galaxie arrive."

    decision_giga_origin_birch_restore:99 "Restaurer le $pc_birch$"
    decision_giga_origin_birch_restore_desc:99 "Nous sommes enfin en mesure de restaurer notre foyer dans sa gloire originelle."
    decision_giga_origin_birch_restore_tooltip:99 "Les caractéristiques planétaires et districts existants seront remplacés."

    giga_birch_origin_motivated_explorers:99 "Explorateurs inspirés"
    giga_birch_origin_motivated_explorers_desc:99 "§LGrâce aux informations nouvellement découvertes, nos explorateurs sont plus compétents que jamais.§!"
    giga_birch_origin_motivated_explorers_effect:99 "Progression mensuelle de la situation d'exploration : §G+25 %§!"

