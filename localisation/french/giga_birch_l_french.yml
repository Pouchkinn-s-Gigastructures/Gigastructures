    edict_giga_migrate_birch_world:0 "Monde Birch : La grande migration"
    edict_giga_migrate_birch_world_desc:0 "Les vastes étendues du Monde Birch présentent des opportunités illimitées. Nous devrions encourager nos pops au chômage à y vivre à la place."
    edict_giga_migrate_birch_world_tooltip:0 "La réinstallation automatique sera §Ynettement§! plus susceptible de choisir le Monde Birch comme destination.\nDes emplois supplémentaires resteront ouverts pour encourager la migration."

    #####################
    ### Megastructure ###
    #####################

    giga_mega.402.name:0 "Le noyau galactique"
    giga_mega.402.desc:0 "Depuis que notre espèce a atteint le vol spatial et s'est aventurée dans les étoiles, un aspect de la géographie galactique a échappé aux astronomes et aux physiciens : le noyau galactique. En effet, jusqu'à présent, le noyau était complètement détaché du reste de la galaxie. Cependant, de nouvelles avancées dans les technologies de cartographie hyperspaciale ont conduit nos scientifiques à croire que le noyau pourrait en fait être accessible en utilisant le réseau d'hypercouloirs, si nous pouvons déterminer exactement où se trouvent les faibles points de brèche hyperspaciale.\nUn projet spécial a été préparé pour trouver et exploiter ces points afin d'accéder au noyau galactique. Quelques hypercouloirs menant au noyau seront créés une fois terminé, nos scientifiques conseillent donc de commencer le projet après s'être assuré que nos rivaux ne pourront pas les utiliser. Il n'y a cependant aucun moyen de prédire où les hypercouloirs finiront par se trouver."
    giga_mega.402.a:0 "Bien reçu."

    giga_mega.403.name:0 "Hypercouloirs du noyau galactique localisés !"
    giga_mega.403.desc:0 "Nouvelles fantastiques ! Après de nombreuses recherches et cartographies intensives, nos scientifiques ont annoncé que des points de brèche hyperspaciale menant au cluster central ont été découverts ! Nos équipes de recherche ont utilisé un faisceau tachyonique à longue portée pour ouvrir à distance ces points de brèche, créant ainsi de nouveaux hypercouloirs. Cela signifie que le noyau est maintenant accessible (pour nous, et pour tous les autres également), et nos chercheurs conseillent vivement d'envoyer un vaisseau pour l'explorer."
    giga_mega.403.a:0 "Extraordinaire !"
    giga_mega.403.a.tooltip:0 "Le noyau galactique est maintenant accessible"

    giga_dialog.4101.name:0 "Supermassif"
    giga_dialog.4101.desc:0 "Après un voyage ardu, notre vaisseau scientifique a finalement atteint le centre de notre galaxie.\nEn entrant dans le système, l'équipage a été stupéfait par la vue d'un §YTrou noir supermassif inactif§! absolument massif.\n\nCet objet gargantuesque pèse plusieurs milliards de masses stellaires et a un diamètre de plusieurs centaines d'unités astronomiques. Une planète océanique solitaire a également été repérée en orbite autour de lui, et l'un des scientifiques a spéculé qu'elle aurait certainement des vagues gigantesques en raison des immenses forces de marée du trou noir.\nBien que ce ne soit que de la spéculation pour l'instant, certains des éléments les plus audacieux de la communauté scientifique théorisent qu'il serait possible de construire une sphère massive autour de ce trou noir, qui pourrait être habitée par des quadrillions d'êtres vivants."
    giga_dialog.4101.a:0 "Incroyable !"

    giga_dialog.4102.name:0 "Site de construction du $name_birch$ terminé !"
    giga_dialog.4102.desc:0 "Le site de construction d'un futur $name_birch$ est maintenant terminé autour du trou noir central de notre galaxie. Cet échafaudage servira de base pour commencer à construire la structure elle-même, qui sera une coque géante de super-alliages juste au-dessus de l'horizon des événements, où la gravité est vivable."
    giga_dialog.4102.a:0 "Excellent."

    giga_dialog.4103.name:0 "Cadre équatorial du $name_birch$ terminé !"
    giga_dialog.4103.desc:0 "La première étape de la construction de notre $name_birch$ est terminée. Nous avons construit un anneau massif qui entoure le trou noir, et qui servira de base pour construire le reste du cadre massif de la structure."
    giga_dialog.4103.a:0 "Merveilleux."

    giga_dialog.4104.name:0 "Cadre du $name_birch$ terminé !"
    giga_dialog.4104.desc:0 "Le cadre de notre $name_birch$ est entièrement terminé ! Un échafaudage massif entoure maintenant le trou noir, et nous devons maintenant commencer la partie la plus difficile : construire la coque massive elle-même. Ce sera une tâche longue et ardue, mais une fois terminée, nous aurons accès à un espace de vie infini."
    giga_dialog.4104.a:0 "Nous approchons du but."

    giga_dialog.4105.name:0 "$name_birch$ terminé !"
    giga_dialog.4105.desc:0 "Aujourd'hui est un jour incroyable dans l'Histoire Galactique. En effet, après des décennies de travail dangereux, nous avons maintenant terminé la construction d'un $name_birch$ absolument massif autour du noyau galactique. Cette coque massive est actuellement stérile, mais son immense surface signifie qu'elle peut effectivement abriter une quantité virtuellement infinie de personnes une fois colonisée. Avec ce projet terminé, nous avons définitivement atteint le sommet de l'ingénierie des habitats, et cette grande construction éclipse probablement toutes les autres mégastructures jamais construites dans l'histoire galactique !\n\n§YLe $name_birch$ gagnera automatiquement plus d'emplacements de district à mesure que sa population augmente, jusqu'à une quantité infinie.§!\n\nNous avons maintenant un édit disponible pour commencer §YLa grande migration§! pour peupler ce vaste monde."
    giga_dialog.4105.a:0 "Grandiose !"

    birch_world_0:0 "$gc_tera$Site de construction du $name_birch$"
    birch_world_0_DESC:0 "Le site de construction d'un futur $name_birch$, abritant le personnel et l'infrastructure nécessaires pour commencer à construire une sphère massive autour d'un trou noir supermassif."
    birch_world_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_terastructure$ - $giga_list_category_habitable_mega$\nConstruit un habitat autour d'un §YTrou noir supermassif§! avec des §Ydistricts infinis§!\n§LUne coque gigantesque construite autour d'un trou noir supermassif, qui peut abriter une population infinie. L'ultime habitat.§!" #megalistentry BIRCH WORLD
    birch_world_0_CONSTRUCTION_INFO_DELAYED:0 "$giga_list_additional_data$ - Le §YMonde Birch§! gagnera §Y1 emplacement de district§! par §Y10000§! pops. Ses districts sont très puissants et fournissent une pléthore d'emplois. Si §YAncient Caches of Technologies§! est activé et que les §YSphères du vide§! sont débloquées, il peut être amélioré en §YMonde Birch Sphère du vide§!, l'habitat le plus puissant qui existe"

    birch_world_1:0 "Cadre équatorial du $name_birch$"
    birch_world_1_DESC:0 "Cet anneau massif encercle l'équateur du trou noir, et constitue la première étape vers l'achèvement du cadre massif du $name_birch$."

    birch_world_2:0 "Cadre du $name_birch$"
    birch_world_2_DESC:0 "Le cadre d'un futur $name_birch$ construit autour d'un trou noir supermassif. Nous pouvons maintenant commencer à construire la coque du $name_birch$ elle-même."

    birch_world_3:0 "$name_birch$"
    birch_world_3_DESC:0 "Un $name_birch$ achevé construit autour d'un trou noir supermassif. Ce n'est guère plus qu'une coque de métal au-dessus de l'horizon des événements, mais offre un espace de vie pratiquement infini."

    ####################
    ### Technologies ###
    ####################

    giga_tech_birch_world_1:0 "Le $name_birch$"
    giga_tech_birch_world_1_desc:0 "Le $name_birch$ n'était qu'une construction artificielle théorique destinée aux habitations les plus vastes, c'est maintenant une réalité. Construit autour des plus grands trous noirs, ces mondes-coque spacieux sont spécialement conçus pour être construits sur l'horizon des événements desdits trous noirs, niveau auquel la gravité de surface est comparable à celle de notre monde natal."

    giga_tech_birch_world_2:0 "Construction Physma"
    giga_tech_birch_world_2_desc:0 "L'Insula Physma est une terre massive dédiée aux choses de la nature. C'est le lieu de l'agriculture, de la recherche et des loisirs."

    giga_tech_birch_world_3:0 "Construction Ktisma"
    giga_tech_birch_world_3_desc:0 "L'Insula Ktisma est une terre massive dédiée aux choses de la création. C'est le lieu de l'habitation et de l'industrie."

    giga_tech_birch_world_4:0 "Construction Orykta"
    giga_tech_birch_world_4_desc:0 "Vivre sur un trou noir signifie que nous pouvons utiliser nos technologies de décompresseur et de matière noire pour extraire des ressources de sa surface."

