	### Districts ###
	#################

    district_giga_birch_structure:99 "Insula primaire"
    district_giga_birch_structure_plural:99 "Insula primaire" # deliberately singular
    district_giga_birch_structure_subtitle:99 "Opérations structurelles"
    district_giga_birch_structure_desc:99 "Cette petite Insula est conçue pour héberger des équipes d'experts en expansion capables de construire des Insulae permettant davantage d'infrastructures sur ce $name_birch$."
    mod_district_giga_birch_structure_max:99 "Max. $district_giga_birch_structure_plural$"

    district_giga_birch_structure_aiondia:99 "$district_giga_birch_structure$"
    district_giga_birch_structure_aiondia_plural:99 "$district_giga_birch_structure_plural$"
    district_giga_birch_structure_aiondia_desc:99 "Jadis capitale rayonnante de l'ensemble de la sphère Aeternite, la mégapole de §H$district_giga_birch_structure_aiondia_subtitle$§! a connu des jours meilleurs. Bien qu'encore incroyablement impressionnante selon presque tous les standards imaginables, une observation plus attentive révèle des signes subtils de dégradation — des bâtiments déformés en configurations absurdes en l'absence d'habitants, des réseaux de transport avec des arrêts fantômes, et un sentiment oppressant d'apathie dans les moindres détails de la vie quotidienne.\n\nNous ne pouvons qu'imaginer ce que cela devait être à son apogée."
    district_giga_birch_structure_aiondia_subtitle:99 "Elätyksenkaupunki"

    district_giga_birch_structure_info_title:99 "Capacité $giga_birch_insula_name$"
    district_giga_birch_structure_info_value:99 "[GetGigaBirchInsulae]/[GetGigaBirchFinalInsulae]"
    district_giga_birch_structure_info_tooltip:99 "§HInsulae§!\nEmplacements d'Insula : §Y[GetGigaBirchFinalInsulae]§![GetGigaBirchMinInsulaePart1]\nDes modificateurs : §G+[GetGigaBirchMaxInsulaeBase]§![GetGigaBirchInsulaeFromPops][GetGigaBirchMinInsulaePart2][GetGigaBirchNextInsulaFromPops]\n\nEmplacements d'Insula utilisés : §Y[GetGigaBirchInsulae]§!\nEmplacements d'Insula libres : §Y[GetGigaBirchInsulaeFree]§!\n\n§W--------------§!\n§t$giga_birch_district_insula_tooltip$§!"
    district_giga_birch_structure_info_tooltip_per_pops:99 "\nDes pops : §G+[GetGigaBirchInsulaeFromPopsValue]§!"
    district_giga_birch_structure_info_tooltip_per_pops_next:99 "\n\nProchain emplacement d'Insula à §Y[GetGigaBirchNextInsulaFromPopsValue]§! £pop£ pops"
    district_giga_birch_structure_info_tooltip_max_title:99 "\n\n§HEmplacements d'Insula de base :§! §Y[GetGigaBirchMaxInsulae]§!"
    district_giga_birch_structure_info_tooltip_min:99 "\n\n§H['concept_giga_birch_minimum_insulae', Minimum] emplacements d'Insula :§! §Y[GetGigaBirchMinInsulaeModifier]§!\nDes modificateurs : §G+[GetGigaBirchMinInsulaeModifier]§!"
    slot_giga_birch_structure_extra_prereq:99 "Un total de §Y$@giga_birch_structure_extra_prereq|0$§! $giga_birch_insula_icon$$giga_birch_insula_name_plural$"

    concept_giga_birch_minimum_insulae:99 "Minimum d'Insulae"
    concept_giga_birch_minimum_insulae_desc:99 "La capacité d'Insula est toujours au moins égale à cette valeur."

    giga_birch_manager_replace:99 "sont ['concept_giga_birch_manager_replacement', remplacés] par"
    concept_giga_birch_manager_replacement:99 "Échanges de gestionnaires d'Insula du Monde de Birch"
    concept_giga_birch_manager_replacement_desc:99 "Les remplacements de gestionnaires d'Insula sont additifs et combineront leurs effets."

    zone_giga_birch_structure_ops_extra:99 "Extension des opérations structurelles"
    zone_giga_birch_structure_ops_extra_desc:99 "Espace supplémentaire alloué au développement des systèmes de Birch."

    zone_giga_birch_structure_ops_aiondia:99 "Complexe palatial"
    zone_giga_birch_structure_ops_aiondia_desc:99 "Grandeur. Opulence. Grâce. Des concepts incarnés par le gigantesque complexe palatial au centre de la disposition hexagonale de la capitale Aeternite. Immaculé en apparence, les visiteurs s'éloignant des sentiers battus découvriront rapidement des systèmes automatisés peinant à trouver des matériaux pour l'entretien de la structure, ses murs moins visibles alvéolés et creux pour maintenir le vernis de perfection superficielle."

