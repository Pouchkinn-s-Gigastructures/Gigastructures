    d_giga_birch_expedition_8:99 "Centre de contrôle majeur"
    d_giga_birch_expedition_8_desc:99 "Un système de contrôle maître pour les systèmes de la Structure ; cette installation manque d'énergie et ne peut actuellement pas déployer toute sa puissance."

    d_giga_birch_expedition_8_restored:99 "Centre de contrôle majeur"
