    origin_birch:0 "Monde Birch en déclin"
    origin_birch_desc:0 "La vision du monde de cette civilisation a été brisée lorsqu'un impact massif d'astéroïde a percé un trou dans leur ciel. Réalisant que leur monde est une vaste et ancienne mégastructure, ils se sont tournés vers l'intérieur à la recherche d'un moyen de sauver leur foyer en déclin."
    origin_birch_effects:0 "- Commence avec un §H$pc_origin_birch$§! dans le §Ynoyau galactique§! comme monde natal.\n- Le §Ynoyau galactique§! commence ouvert à la galaxie.\n- Commence avec la situation §H« $giga_situation_birch_origin$ »§!.\n- Accès à des §H$district_giga_origin_birch_lab_plural$§! uniques sur votre monde natal, améliorables par l'§Hexploration§!.\n- Débloquez de puissants modificateurs pour votre monde natal grâce à l'§Hexploration§!.\n- Le §H$pc_origin_birch$§! peut être réparé, débloquant des districts §HInsula§! et §HSecteur§! spéciaux du §H$pc_birch$§!.\n- Préférence d'habitabilité définie sur §H$trait_pc_birch_preference$§!, rendant l'établissement sur la plupart des planètes beaucoup plus difficile.\n- Une planète proche pourrait détenir la clé d'une colonisation future.\n\n§RPlusieurs personnes ne peuvent pas utiliser cette origine. Tout empire avec cette origine après le premier sera généré avec $origin_default$ à la place.§!"

    #giga_birch_start_dialog:0 "We do not know what happened to our ancestors. Enemies, plague, civil war? They exist now as myths and legends, their knowledge and power lost. They somehow built this vast world around the black hole at the centre of our galaxy, now we live in the vast, echoing expanse designed to house a million times more people than are left.\nAs all but the last sections have fallen into disrepair and uselessness our people have been filled with a new sense of purpose: we must unite and take our place against in the stars, or we will be lost forever to history.\n\nOur first order of business will be to appoint a governor. Then we need to make sure we are working the right jobs:\n"

    #giga_start_screen_birch:0 "$giga_birch_start_dialog$We need a §Y$job_structure_manager$§! to stop the place falling to ruins.\n\nWe may have to make some people redundant from their preferred job to make that happen."

    #giga_start_screen_birch_hive:0 "$giga_birch_start_dialog$We need a §Y$job_structure_process$§! to stop the place falling to ruins."

    #giga_start_screen_birch_machine:0 "$giga_birch_start_dialog$We need a §Y$job_structure_process$§! to stop the place falling to ruins."

    giga_start_screen_birch:0 "Nous savons précieusement peu de choses sur notre passé ancien. Jusqu'à il y a quelques siècles, nous pensions que [GetHomeWorldName] était tout ce qui existait - une barrière impénétrable sous nos pieds, une autre maintenue à mille kilomètres au-dessus par de grandes flèches, et les étoiles roulantes traçant un chemin dans le ciel pour marquer le jour et la nuit.\n\nUn impact massif d'astéroïde a brisé nos certitudes en perçant un trou droit à travers la barrière supérieure, nous révélant l'univers extérieur. En utilisant la flèche la plus proche comme support, nous avons construit une tour pour atteindre la brèche et fait nos premiers pas hésitants vers la galaxie élargie.\n\nLes anciens spatioports et cales sèches que nous avons trouvés sur la surface extérieure ont tout changé. Alors que notre premier vaisseau spatial voyageait vers l'extérieur, nous avons réalisé que notre foyer n'était pas naturel. C'était plutôt une sphère artificielle colossale, visiblement en état de délabrement.\n\nN'ayant trouvé aucune réponse supplémentaire en haut, nous planifions maintenant une grande expédition pour trouver un chemin vers les couches théoriques en dessous."

    giga_birch.title:0 "Hypercouloirs du noyau découverts"
    giga_birch.desc:0 "Nous avons réussi à remettre nos capteurs en état de marche et avons découvert que nous ne sommes pas seuls au centre de la galaxie. Il y a un petit nombre de systèmes qui ont été attirés plus près que l'anneau galactique principal par la gravité du trou noir.\n\nActuellement, il ne semble y avoir aucune connexion avec le reste de la galaxie. D'après notre traduction de fragments de journaux, nous croyons que la gravité du trou noir interfère avec les connexions entre les systèmes intérieurs et les systèmes réguliers, et que tout hypercouloir entre eux serait affaibli et estompé sans passage.\n\nNous avons émis un §Yprojet spécial§! pour les localiser et les ouvrir"

    giga_birch.003.name:0 "Le noyau galactique se connecte à la galaxie"
    giga_birch.003.desc:0 "Avec une poussée détectable sur tous nos instruments, des hypercouloirs se sont ouverts entre le noyau galactique et le reste de la galaxie.\n\nNous pouvons partir. Mais que trouverons-nous qui nous attend ?"
    giga_birch.003.desc2:0 "Avec une poussée détectable sur tous nos instruments, des hypercouloirs se sont ouverts entre le noyau galactique et le reste de la galaxie.\n\nCe n'est pas nous qui avons causé cela, nous en sommes sûrs ! La galaxie arrive."

    decision_giga_origin_birch_restore:0 "Restaurer le $pc_birch$"
    decision_giga_origin_birch_restore_desc:0 "Nous sommes enfin en mesure de restaurer notre foyer à sa gloire originelle."
    decision_giga_origin_birch_restore_tooltip:0 "Les caractéristiques planétaires et districts existants seront remplacés."

    giga_birch_origin_motivated_explorers:0 "Explorateurs inspirés"
