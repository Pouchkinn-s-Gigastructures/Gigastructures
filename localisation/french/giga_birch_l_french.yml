    d_giga_birch_expedition_6_farm_desc:99 "Des cavernes à l'abri des conditions hostiles de la couche arctique, où l'on cultive actuellement une souche nutritive de lichen local."

    d_giga_birch_expedition_6_generator:99 "Avant-poste des cavernes arctiques — Puits de gaz"
    d_giga_birch_expedition_6_generator_desc:99 "Des cavernes à l'abri des conditions hostiles de la couche arctique, avec une centrale exploitant un puits de gaz local."

    d_giga_birch_expedition_6_restored:99 "Colonie des cavernes arctiques"
