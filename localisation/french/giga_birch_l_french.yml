    zone_giga_birch_orykta_insula_minerals_flavour_desc:0 "Cette Insula héberge une connexion à haute capacité vers l'horizon des événements en contrebas, où d'immenses foreuses gravitiques extraient de la matière du $pc_core_black_hole$."

    zone_giga_birch_orykta_insula_minerals_refinery_flavour:0 "Zones industrielles de puits profond"
    zone_giga_birch_orykta_insula_minerals_refinery_flavour_desc:0 "Cette Insula héberge une connexion directe à l'horizon des événements en contrebas, où d'immenses constructions extraient de la matière du $pc_core_black_hole$ et la fusionnent en éléments plus lourds."

    zone_giga_birch_orykta_insula_minerals_dark_matter_flavour:0 "Extracteurs de matière à large bande"
    zone_giga_birch_orykta_insula_minerals_dark_matter_flavour_desc:0 "Cette Insula héberge une connexion directe à l'horizon des événements en contrebas, où d'immenses constructions utilisent la gravité pour extraire toutes sortes de matière du $pc_core_black_hole$, baryonique ou non."

    zone_giga_birch_orykta_insula_minerals_negative_mass_flavour:0 "Séparateurs anisotropes"
    zone_giga_birch_orykta_insula_minerals_negative_mass_flavour_desc:0 "Cette Insula héberge une connexion directe à l'horizon des événements en contrebas, où d'immenses constructions séparent la ligne d'univers de la matière extraite pour défaire sa séquestration de deux manières à la fois."

