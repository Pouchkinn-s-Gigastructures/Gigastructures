    giga_situation_birch_expedition_9_approach_choose_desc:0 "Prêt à partir, mais sans direction."

    giga_situation_birch_expedition_9_approach_energy:0 "Étendre la collecte d'énergie"
    giga_situation_birch_expedition_9_approach_energy_tooltip:0 "Une fois terminé, le réseau d'extraction se concentrera sur la collecte d'£energy£ §Y$energy$§!.\n "
    giga_situation_birch_expedition_9_approach_energy_desc:0 "En nous concentrant sur l'expansion des capacités de collecte de particules énergétiques du réseau d'extraction, nous pouvons augmenter notre production d'énergie."

    giga_situation_birch_expedition_9_approach_minerals:0 "Foreuse minérale focalisée"
    giga_situation_birch_expedition_9_approach_minerals_tooltip:0 "Une fois terminé, le réseau d'extraction se concentrera sur la collecte de £minerals£ §Y$minerals$§!.\n "
    giga_situation_birch_expedition_9_approach_minerals_desc:0 "Maintenir la conception de la foreuse gravitique axée sur l'extraction de minéraux nous donnera un flux plus important de matières premières."

    giga_situation_birch_expedition_9_approach_dark_matter:0 "Siphon de matière noire"
    giga_situation_birch_expedition_9_approach_dark_matter_tooltip:0 "Une fois terminé, le réseau d'extraction se concentrera sur la collecte de £sr_dark_matter£ §Y$sr_dark_matter$§!.\n "
    giga_situation_birch_expedition_9_approach_dark_matter_desc:0 "La foreuse gravitique pourrait être modifiée pour extraire de grandes quantités de matière noire directement du trou noir."

    #########################################
    ### General Events ######################
    #########################################

    # birch lost somehow
    giga_birch.101:0 "Monde Birch perdu !"
    giga_birch.101.desc:0 "La Structure nous a été arrachée. Chassés de notre foyer, nos efforts d'exploration ne peuvent pas continuer."
    giga_birch.101.a:0 "Nous récupérerons notre foyer à tout prix."

    # birch planet-killed
    giga_birch.103:0 "[this.GetName] anéantie !"
    giga_birch.103.desc:0 "La Structure a été brisée, des fragments de coques tombant dans le vide ou consumés par le trou noir en son sein. Notre foyer est détruit, et tout espoir de le réparer a disparu avec lui. Nous sommes sans but."
    giga_birch.103.a:0 "Une perte incommensurable."

    # birch reclaimed
    giga_birch.105:0 "[this.GetName] récupérée !"
    giga_birch.105.desc:0 "La Structure a été récupérée ! Une grande partie de notre patrie est en ruines, mais nous pouvons reconstruire. Maintenant que nous en avons repris le contrôle, nos efforts d'exploration peuvent reprendre."
    giga_birch.105.a:0 "Notre foyer est à nouveau en sécurité."

    #########################################
    ### Edge of Eternity Dig Site ###########
    #########################################

    giga_birch.800:0 "Une investigation plus approfondie"
    giga_birch.800.desc:0 "Cela fait un an que l'achèvement officiel de nos efforts de colonisation sur [from.planet.GetName], et nos colons se sont familiarisés avec l'ancien complexe d'arcologie qui les protège des tempêtes et des courants dangereux qui déferlent sur la surface de la planète. De nombreuses questions sur les immenses structures océaniques restent sans réponse, et le potentiel de découverte scientifique est élevé.\n\nUn site sur l'une des plateformes centrales a été dégagé et préparé pour une investigation plus poussée."
    giga_birch.800.a:0 "Nous pourrions beaucoup apprendre ici."

    site_giga_birch_origin_edge_of_eternity:0 "Anciennes arcologies océaniques"
    site_giga_birch_origin_edge_of_eternity_intro:0 "Les anciennes arcologies sur [planet.GetName] sont tout ce qui sépare nos colons de mers déchaînées. Comment et pourquoi elles ont été construites reste un mystère, en particulier avec la Structure qui surplombe la planète."

    giga_birch.801:0 "Anciens passages d'accès"
    giga_birch.801.desc:0 "Une série de couloirs d'accès dans une section rarement visitée de l'arcologie ont mené nos [owner.GetArchaeologistPlural] à une immense porte blindée qui semble séparer une grande section de la plateforme du complexe principal.\n\nCela pourrait être une sorte de dépôt de données sécurisé ou une autre zone sensible."
    giga_birch.801.a:0 "Une porte scellée est bon signe."

    giga_birch.802:0 "Cartographier l'étendue"
    giga_birch.802.desc:0 "La porte blindée a été ouverte, et la zone à l'intérieur est maintenant en cours de cartographie. Une immense section de l'arcologie semble avoir été dédiée à une sorte d'archive numérique, mais l'état de délabrement avancé évident dans toute la structure pourrait signifier qu'il n'y a plus rien à trouver."
    giga_birch.802.a:0 "Ne laissons aucune pierre non retournée."

    giga_birch.803:0 "Serveurs délabrés"
    giga_birch.803.desc:0 "Une salle a été trouvée au plus profond de l'archive contenant un certain nombre d'enregistrements apparemment intacts. La disposition de la zone autour et le faible niveau de mesures de sécurité suggèrent qu'elle n'a pas d'importance particulière, plus oubliée que spécifiquement préservée.\n\nNos [owner.GetArchaeologistPlural] décodent le contenu, mais en raison du niveau de dommages, reconstituer quelque chose d'utile pourrait prendre du temps."
    giga_birch.803.a:0 "Nous avons de la chance que l'archive soit au moins partiellement intacte."

    giga_birch.804:0 "Un trésor de schémas"
    giga_birch.804.desc:0 "Les efforts pour reconstituer des données utilisables à partir des restes de l'archive ont enfin porté leurs fruits.\n\nIl semble que cette section particulière ait été utilisée pour stocker les schémas de l'arcologie et d'autres installations similaires ! Ils sont incomplets en raison de la détérioration des supports de stockage, mais même cet aperçu limité de l'esprit de ses architectes sera certainement incroyablement précieux."
    giga_birch.804.a:0 "Nous pourrions utiliser ces connaissances pour coloniser d'autres planètes..."
    giga_birch.804.pops:0 "Chaque £pop£ §Ypop§! sur §H[this.GetName]§! avec le trait §Y$trait_pc_birch_preference$§! gagnera le trait §Y$trait_pc_ocean_preference$§! à la place."
    giga_birch.804.b:0 "... ou les réutiliser pour construire des habitats spatiaux à la place."

    giga_birch_origin_building_reward_habitat:0 "Rétro-ingénierie de l'arcologie"
    giga_birch_origin_building_reward_habitat_desc:0 "Nous avons beaucoup appris sur la construction grâce au complexe d'arcologie sur Confins de l'éternité."
    giga_birch_origin_building_reward_planet:0 "Rétro-ingénierie de l'arcologie"
    giga_birch_origin_building_reward_planet_desc:0 "Nous avons beaucoup appris sur la construction grâce au complexe d'arcologie sur Confins de l'éternité."

    #########################################
    ### Expeditions #########################
    #########################################

    giga_explorer_1:0 "explorateur"
    giga_explorers_1:0 "explorateurs"

    giga_explorer_2:0 "drone de reconnaissance"
    giga_explorers_2:0 "drones de reconnaissance"

    giga_explorer_3:0 "drone d'exploration"
    giga_explorers_3:0 "drones d'exploration"

    # expedition 1
    giga_birch.1001:0 "La première expédition"
    giga_birch.1001.desc:0 "Aujourd'hui marque la date de départ de notre première opération exploratoire majeure pour découvrir une flèche de transit fonctionnelle, et à travers elle les origines de notre monde natal. Bien que de nombreuses tentatives aient été faites par le passé pour cartographier des régions éloignées de notre insula natale, elles étaient comparativement petites et mal équipées, et ont trouvé peu de choses utiles dans l'immense étendue sauvage.\n\nMaintenant que nous avons vu la Structure depuis l'espace et comprenons sa véritable immensité, il est impératif que nos [GigaGetExplorerPlural] aient l'équipement et les fournitures dont ils ont besoin pour des excursions d'une telle échelle épique.\n\nLe chef d'expédition [giga_birch_expedition_leader.GetName] a été désigné pour diriger l'opération, menant une force combinée terrestre, maritime et aérienne suffisamment grande pour parcourir les distances extrêmes requises tout en maintenant l'essentiel de sa propre chaîne d'approvisionnement.\n\nNous ne savons pas ce que nous trouverons là-bas, mais nous espérons que cela pourra au moins éclairer la véritable nature de cette ancienne structure."
    giga_birch.1001.a:0 "Nous partons dans les ténèbres, en quête de vérité."

    giga_birch.1002:0 "Seulement des ruines"
    giga_birch.1002.desc:0 "Le chef d'expédition [giga_birch_expedition_leader.GetName] rapporte que nos [GigaGetExplorerPlural] ont découvert les restes d'une grande colonie, disposée comme la nôtre autour de l'une des grandes flèches de support, qui est malheureusement non fonctionnelle.\n\nEntre l'état usé des ruines et le nombre de structures qui semblent avoir été entièrement ensevelies par les pluies de limon, nos [GetArchaeologistPlural] estiment que la colonie est abandonnée depuis environ 200 ans.\n\nUne investigation plus approfondie est en cours, et devrait bientôt faire rapport."
    giga_birch.1002.a:0 "Séparés par l'espace, et le temps."

    giga_birch.1003:0 "Une présence permanente ?"
    giga_birch.1003.desc:0 "Le rapport sur la colonie en ruines découverte par nos [GigaGetExplorerPlural] est arrivé, et il n'explique guère ce que nous avons vu.\n\nSelon l'[GetArchaeologist] en chef de l'expédition, la civilisation qui vivait autrefois ici était bien établie et disposait d'un niveau significatif d'infrastructure industrielle. Il ne reste pas grand-chose pour nous aider à comprendre exactement à quoi elle ressemblait, car aucun reste n'a été trouvé, et tous les supports de stockage trouvés se sont dégradés au-delà de toute reconnaissance. Tout ce que nous pouvons dire avec certitude, c'est qu'ils avaient un plan corporel différent du nôtre, car leurs outils et installations sont de conception étrangère.\n\nLe chef d'expédition [giga_birch_expedition_leader.GetName] a suggéré que nous établissions une base d'opérations avancée sur le site, car ce mystère pourrait devenir un sujet d'étude à long terme. [giga_birch_expedition_leader.GetSheHeCap] suggère également que nous pourrions utiliser certains des sites moins intéressants pour rassembler des ressources, soit par recyclage soit par réaménagement des terres."
    giga_birch.1003.a:0 "Réaffecter leurs usines."
    giga_birch.1003.a.desc:0 "Nous réoutillerons leur infrastructure industrielle pour produire des £consumer_goods£ §Y$consumer_goods$§!.\n "
    giga_birch.1003.b:0 "Récupérer certaines des structures."
    giga_birch.1003.b.desc:0 "Démanteler certaines des ruines moins significatives donnera des £minerals£ §Y$minerals$§! et des £alloys£ §Y$alloys$§!.\n "
    giga_birch.1003.c:0 "Récupérer les centrales électriques."
    giga_birch.1003.c.desc:0 "Réparer leur infrastructure électrique nous permettra de récolter de l'£energy£ §Y$energy$§! supplémentaire.\n "
    giga_birch.1003.d:0 "Toutes ces terres arables devraient être utilisées."
    giga_birch.1003.d.desc:0 "Déblayer quelques décombres insignifiants nous permettra de produire de la £food£ §Y$food$§! dans cette zone.\n "

    giga_birch.1004:0 "Un avenir incertain"
    giga_birch.1004.desc:0 "La découverte d'une civilisation éteinte qui semble avoir suivi une trajectoire technologique similaire à la nôtre nous a laissé un sentiment d'incertitude quant à notre propre permanence. Nous avons l'avantage de pouvoir accéder à l'espace au-delà de la coque extérieure de la Structure, mais nous n'avons pas encore trouvé une seule flèche fonctionnelle par laquelle atteindre les niveaux inférieurs. Il est possible qu'aucune d'entre elles ne reste en état de fonctionnement, auquel cas nous pourrions ne jamais atteindre notre objectif.\n\nNous devons redoubler nos efforts. La prochaine expédition ira plus loin, apprendra plus, et sera mieux équipée pour repousser tout ce qui pourrait menacer sa mission."
    giga_birch.1004.a:0 "Cette base avancée sera le premier pas de beaucoup d'autres."

    #########################################
    # expedition 2

    giga_birch.2001:0 "La deuxième expédition"
    giga_birch.2001.desc:0 "Le moment est venu de lancer notre deuxième expédition majeure dans l'inconnu, à nouveau à la recherche d'une flèche fonctionnelle pour accéder aux couches inférieures de la Structure.\n\nS'appuyant sur nos découvertes précédentes, nos explorateurs partiront de la base avancée établie parmi les ruines découvertes par la première expédition. Le chef d'expédition [giga_birch_expedition_leader.GetName] et son équipe de [GigaGetExplorerPlural] sont prêts à affronter tous les défis qui se dresseront devant eux."
    giga_birch.2001.a:0 "Une fois de plus vers l'inconnu."

    giga_birch.2002:0 "Signes de civilisation"
    giga_birch.2002.desc:0 "Le chef d'expédition [giga_birch_expedition_leader.GetName] rapporte que notre expédition a capté des signaux radio indicatifs d'une société industrialisée, et a envoyé plusieurs éclaireurs camouflés en avant du convoi principal pour enquêter davantage.\n\nD'après ce qui a été glané jusqu'à présent, ils semblent être des [giga_birch_expedition_2_country.GetSpeciesClassPlural] avec un niveau technologique significativement inférieur au nôtre. Ils ont de nombreuses cités, dont plusieurs sont construites autour de flèches, avec des structures construites en partie le long de leur extérieur principalement utilisées pour lancer des aéronefs à voilure fixe sur de longues distances.\n\nIl n'y a aucune indication qu'ils aient détecté nos [GigaGetExplorerPlural], et tous les efforts sont faits pour que cela reste ainsi."
    giga_birch.2002.a:0 "Rassembler autant d'informations que possible."

    giga_birch.2003:0 "Contact !"
    giga_birch.2003.desc:0 "Nous avons été repérés !\n\nLe chef d'expédition [giga_birch_expedition_leader.GetName] a envoyé une transmission urgente déclarant que l'espèce [giga_birch_expedition_2_country.GetSpeciesClass] que l'expédition observait a appris leur présence. L'un des aéronefs des primitifs a volé une distance inhabituellement longue dans leur direction, passant dans notre zone d'occultation et voyant le convoi principal directement. L'aéronef a réussi à s'échapper et a envoyé un signal de détresse.\n\nNous recevons maintenant un message transmis directement vers le convoi, demandant une audience."
    giga_birch.2003.a:0 "Mettez-le à l'écran."

    giga_birch.2004:0 "[giga_birch_expedition_2_country.GetName]"
    giga_birch.2004.title:0 "Transmission entrante"
    giga_birch.2004.desc:0 "Je suis [giga_birch_expedition_2_ruler.GetName], [giga_birch_expedition_2_country.GetRulerTitle] de [giga_birch_expedition_2_country.GetName]. Déclarez vos intentions, étrangers. Nous souhaitons une discussion pacifique, mais sommes prêts à nous défendre si nécessaire."
    giga_birch.2004.a:0 "Alors discutons."
    giga_birch.2004.a.desc:0 "Nous échangerons des informations pour en apprendre davantage les uns sur les autres."
    giga_birch.2004.b:0 "Nous cherchons une flèche fonctionnelle."
    giga_birch.2004.b.desc:0 "Aller droit au but."
    giga_birch.2004.c:0 "Ce ne sera pas suffisant."
    giga_birch.2004.c.desc:0 "Nous lancerons une attaque immédiate dans le but d'exterminer jusqu'au dernier de ces extraterrestres."

    giga_birch.2005.desc:0 "[giga_birch_expedition_2_country.giga_birch_2005_part1] [giga_birch_expedition_2_country.giga_birch_2005_part2]\n\n[root.giga_birch_2005_part3]"

    giga_birch.2005.desc.1:0 "Vous parlez au représentant élu de [giga_birch_expedition_2_country.GetName]."
    giga_birch.2005.desc.1.democracy:0 "[giga_birch_expedition_2_country.GetName] est une nation démocratique. Je vous parle en tant que dirigeant élu actuel et chef du gouvernement, au nom du peuple."
    giga_birch.2005.desc.1.oligarchy:0 "Je parle pour le conseil dirigeant de [giga_birch_expedition_2_country.GetName], en tant que son chef."
    giga_birch.2005.desc.1.autocracy:0 "Vous parlez au seul dirigeant de cette nation. Vous devez savoir que c'est considéré comme un signe de respect parmi notre peuple que je m'adresse directement à vous."

    giga_birch.2005.desc.2:0 "Nous avons vécu sur ces terres aussi loin que remonte notre histoire enregistrée, et jusqu'à aujourd'hui, nous n'avions rencontré aucune autre forme de vie intelligente. C'est une occasion mémorable, et nous espérons que votre subterfuge était par prudence plutôt que par malveillance."
    giga_birch.2005.desc.2.militarist:0 "Nous avons vécu sur ces terres aussi loin que remonte notre histoire enregistrée, et jusqu'à aujourd'hui, nous n'avions rencontré aucune autre forme de vie intelligente. Nos braves guerriers sont prêts à vous accueillir, que ce soit dans un esprit de paix ou sur le champ de bataille."
    giga_birch.2005.desc.2.spiritualist:0 "Les écritures anciennes racontent que notre peuple est venu sur ces terres il y a longtemps, et nous y sommes restés depuis. Malgré l'envoi de nombreux missionnaires pour explorer les terres au-delà, nous n'avions trouvé aucune autre forme de vie intelligente jusqu'à aujourd'hui. Nous espérons que votre subterfuge était par prudence plutôt que par malveillance."

    giga_birch.2005.desc.3:0 "Sur ce point, qui êtes-vous, étrangers ? Des explorateurs comme les nôtres ? Ce rapport suggère que vous nous ressemblez beaucoup, bien qu'il parle aussi de technologies fantastiques que nous ne pensions pas possibles."
    giga_birch.2005.desc.3.hive:0 "Sur ce point, qui êtes-vous exactement, étrangers ? Vos représentants se comportent avec détermination, tandis que leurs subordonnés sont silencieux et mécaniques dans leurs mouvements. Communiquez-vous par d'autres moyens ?"
    giga_birch.2005.desc.3.machine:0 "Sur ce point, qui êtes-vous vraiment, étrangers ? Nous voyons vos machines, aussi fantastiques soient-elles, mais pas une seule personne parmi elles. Nous considérez-vous indignes de la courtoisie de parler face à face ?"
    giga_birch.2005.desc.3.assimilator:0 "Sur ce point, qui êtes-vous vraiment, étrangers ? Vos mouvements et manières semblent presque robotiques, les représentants que vous nous avez envoyés ne sont-ils que des marionnettes ? Que leur avez-vous fait ?"

    giga_birch.2005.a:0 "Ceci devrait tout expliquer."
    giga_birch.2005.a.hive:0 "Nous nous tenons devant vous comme un seul. Prenez ceci."
    giga_birch.2005.a.machine:0 "Initiation du transfert de données."
    giga_birch.2005.a.desc:0 "Nous enverrons un paquet d'informations détaillant notre mission.\n "

    giga_birch.2006.desc:0 "Ah, donc vous cherchez un moyen de voyager vers ces couches inférieures qui contiendraient selon vous les machines qui maintiennent notre monde ? Je ne peux pas dire grand-chose sur le fait que vous ayez raison, mais il semble que vous en sachiez beaucoup plus que nous. Ce que nous savons, c'est qu'aucune des flèches que nous avons rencontrées n'a répondu à nos tentatives d'y accéder, et elles se sont révélées imperméables à l'entrée forcée.\n\nPendant ce temps, votre avancée technologique considérable est... imposante.\n\nVous semblez avoir l'avantage sur nous, [root.GetSpeciesName]. Où cela nous mène-t-il ?"
    giga_birch.2006.desc.im:0 "Attendez, vous voulez dire qu'il n'y a QUE des machines ? Et vous ne savez pas ce qu'il est advenu de vos créateurs ? C'est inquiétant, c'est le moins qu'on puisse dire, mais si vos intentions sont pacifiques, nous sommes ouverts aux relations diplomatiques entre nos cultures.\n\nIl est dit ici que vous cherchez une flèche fonctionnelle pour accéder à des machines dans les couches en dessous de nous ? Je suis désolé de dire que toutes celles que nous avons rencontrées étaient inertes, et toutes se sont révélées imperméables à l'entrée forcée.\n\nPendant ce temps, votre avancée technologique considérable est... imposante.\n\nVous semblez avoir l'avantage sur nous, [root.GetSpeciesName]. Où cela nous mène-t-il ?"
    giga_birch.2006.desc.hive:0 "Donc vous êtes tous des parties d'un seul grand organisme, gouverné par une sorte de... supramental ? C'est un concept très étranger pour nous, mais un que nous pensions possible. Un peu troublant, pour être honnête, mais nous sommes ouverts aux relations diplomatiques entre nos... peut-on même considérer ce que vous êtes comme une culture ? Nos sociologues pourraient avoir besoin de redéfinir certains termes.\n\nMais assez de cela, il est dit ici que vous cherchez une flèche fonctionnelle pour accéder à des machines dans les couches en dessous de nous ? Je suis désolé de dire que toutes celles que nous avons rencontrées étaient inertes, donc nous ne pouvons pas beaucoup vous aider là-dessus. Où cela nous mène-t-il ?"
    giga_birch.2006.desc.machine:0 "Attendez, vous voulez dire qu'il n'y a QUE des machines ? Et vous ne savez pas ce qu'il est advenu de vos créateurs ? C'est inquiétant, c'est le moins qu'on puisse dire, mais si vos intentions sont pacifiques, nous sommes ouverts aux relations diplomatiques entre nos... peut-on même considérer ce que vous êtes comme une culture ? Nos sociologues pourraient avoir besoin de redéfinir certains termes.\n\nMais assez de cela, il est dit ici que vous cherchez une flèche fonctionnelle pour accéder à des machines dans les couches en dessous de nous ? Je suis désolé de dire que toutes celles que nous avons rencontrées étaient inertes, donc nous ne pouvons pas beaucoup vous aider là-dessus. Où cela nous mène-t-il ?"
    giga_birch.2006.desc.servitor:0 "Votre peuple est resté dans votre patrie, et vous explorez de votre propre volonté ? L'idée de confier tant de choses à une machine est... étrange, mais si ce que vous dites est vrai, alors vos intentions au moins semblent être bonnes. Quant à votre intérêt pour les flèches, aucune de celles que nous avons rencontrées n'a répondu à nos tentatives d'y accéder, et elles se sont révélées imperméables à l'entrée forcée.\n\nVous avez clairement une technologie d'un niveau significativement supérieur au nôtre, donc vous avez l'avantage ici, [root.GetSpeciesNamePlural]. Nous sommes ouverts aux relations diplomatiques entre nos peuples, si vous l'êtes."
    giga_birch.2006.desc.assimilator:0 "« Une union de chair et de machine » ? J'ai du mal à croire que cela a été accompli par choix, mais... avec les choses telles qu'elles sont, nous respecterons votre mode de vie si vous respectez le nôtre.\n\nNous ne savons pas si votre hypothèse concernant des machines en dessous de nous est vraie, mais vous semblez en savoir beaucoup plus que nous. Ce que nous savons, c'est qu'aucune des flèches que nous avons rencontrées n'a répondu à nos tentatives d'y accéder, et elles se sont révélées imperméables à l'entrée forcée.\n\nPendant ce temps, votre avancée technologique considérable est... inquiétante. Vous semblez avoir l'avantage sur nous, [root.GetSpeciesName]. Où cela nous mène-t-il ?"
    giga_birch.2006.oncon:0 "§HÀ la fin de l'expédition :§!"
    giga_birch.2006.a:0 "Nous souhaitons un échange de biens et d'idées."
    giga_birch.2006.a.desc:0 "Nous entamerons des négociations pour un accord commercial à long terme, mais [giga_birch_expedition_2_country.GetName] restera indépendant.\n\n$giga_birch.2006.oncon$\n "
    giga_birch.2006.a.xenophobe:0 "Nous devrions faire du commerce, mais rien de plus."
    giga_birch.2006.a.xenophobe.desc:0 "Nous entamerons des négociations pour un accord commercial à long terme, et [giga_birch_expedition_2_country.GetName] gardera ses distances.\n\n$giga_birch.2006.oncon$\n "
    giga_birch.2006.b:0 "Rejoignez-nous. C'est aussi votre monde."
    giga_birch.2006.b.desc:0 "Proposer l'intégration pacifique de leur nation sous notre bannière commune.\n\n$giga_birch.2006.oncon$\n\n$giga_birch.2009.integrate.desc$"
    giga_birch.2006.c:0 "Rendez-vous ou soyez détruits."
    giga_birch.2006.c.desc:0 "Notre expédition tentera de subjuguer ces primitifs par la force.\n\n$giga_birch.2006.oncon$\n\n$giga_birch.2009.conquer.desc$"
    giga_birch.2006.d:0 "Nous vous sauverons de vous-mêmes."
    giga_birch.2006.d.desc:0 "Notre expédition s'assurera que ces organiques soient pris en charge de manière appropriée.\n\n$giga_birch.2006.oncon$\n\n$giga_birch.2009.sanctuary.desc$"

    giga_birch.2007.desc:0 "Eh bien, vous n'en trouverez pas une par ici, j'en suis désolé. Aucune des flèches que nous avons rencontrées n'a répondu à nos tentatives d'y accéder, et elles se sont révélées imperméables à l'entrée forcée. Étant venus de si loin, vous semblez plus capables que nous de poursuivre votre recherche.\n\nVotre niveau apparent de technologie m'inquiète. Vous semblez avoir l'avantage sur nous, [root.GetSpeciesName]. Où cela nous mène-t-il ?"

    giga_birch.2008.desc.exterminate:0 "Ne pensez pas que nous allons simplement nous coucher et mourir, étranger. Nous nous battrons jusqu'à notre dernier souffle pour préserver notre mode de vie."
    giga_birch.2008.exterminate:0 "C'est ce qu'on verra."
    giga_birch.2008.desc.trade:0 "Cela semble... avantageux. Je suis sûr que nous pouvons apprendre beaucoup les uns des autres. Je vais demander à mes ministres de rédiger une proposition immédiatement."
    giga_birch.2008.trade:0 "Excellent."
    giga_birch.2008.desc.integrate:0 "Si ce que vous dites sur la fragilité de notre environnement est correct, alors il semble que cette mission qui est la vôtre soit très importante en effet. Nous vous aiderons de toutes les manières possibles."
    giga_birch.2008.integrate:0 "Bienvenue à bord."
    giga_birch.2008.desc.conquer:0 "Se rendre ? Vous avez peut-être un avantage technologique, mais nos forces armées devraient être plus que capables de vaincre une bande d'explorateurs. Nous ne nous rendrons pas."
    giga_birch.2008.conquer:0 "Regrettable."
    giga_birch.2008.desc.sanctuary:0 "Vous souhaitez nous donner de la technologie ? C'est... inattendu. Et c'était une façon très troublante de le formuler. Je vais demander à nos meilleurs scientifiques de se préparer à étudier votre proposition dans quelques jours."
    giga_birch.2008.sanctuary:0 "Ce n'est que le commencement..."
    giga_birch.2008.a:0 "(Si vous voyez ceci, quelque chose s'est mal passé.)"

    giga_birch.2009:0 "Les conséquences"
    giga_birch.2009.desc.exterminate:0 "Trois éclairs. Trois colonnes de feu atomique s'élevant alors que nos bombes à fusion anéantissent trois cités [giga_birch_expedition_2_country.GetAdj] en un clin d'œil.\n\nAu cours du mois suivant, nos forces d'exploration ont systématiquement traqué et tué chaque [giga_birch_expedition_2_species.GetName] qu'elles ont pu trouver. Aucun n'a été épargné.\n\nAussi puissants qu'ils se croyaient, ils ont été mis à bas par la simple force des armes. Les restes de leur civilisation serviront de terrain d'essai et de lieu d'étude pour la prochaine fois que nous rencontrerons des extraterrestres."
    giga_birch.2009.exterminate:0 "Tout est comme il se doit."
    giga_birch.2009.exterminate.desc:0 "Les £district£ §Y$district_giga_origin_birch_lab_plural$§! produiront des £society_research£ §Y$society_research$§! et de l'£unity£ §Y$unity$§! supplémentaires.\n "
    giga_birch.2009.desc.trade:0 "À la suite d'une période de négociations, un partenariat commercial a été formé avec succès avec [giga_birch_expedition_2_country.GetName]. Nos nations resteront séparées, mais des marchands voyageront entre nos terres, et des plans pour un système de transit longue distance sont en cours d'élaboration."
    giga_birch.2009.trade:0 "À un avenir prospère pour nous tous."
    giga_birch.2009.trade.desc:0 "Les £district£ §Y$district_giga_origin_birch_lab_plural$§! produiront des £society_research£ §Y$society_research$§! et de l'£unity£ §Y$unity$§! supplémentaires.\n "
    giga_birch.2009.desc.integrate:0 "À la suite d'une période de négociations intenses, [giga_birch_expedition_2_country.GetName] a accepté de se joindre à notre mission de restaurer la Structure à sa gloire passée. Ils seront sous notre bannière en ce qui concerne le reste de la galaxie, et nos peuples se rapprocheront sans aucun doute avec le temps."
    giga_birch.2009.integrate:0 "Nous découvrirons notre destinée ensemble."
    giga_birch.2009.integrate.desc:0 "8 £pop£ pops §Y[giga_birch_expedition_2_species.GetName]§! apparaissent sur [situation.target.GetName].\n "
    giga_birch.2009.desc.conquer:0 "À la suite d'une période de combats intenses, nos forces expéditionnaires ont forcé [giga_birch_expedition_2_country.GetName] à une capitulation sans conditions. Leur nombre n'était pas de taille face à notre puissance de feu supérieure.\n\nNous occupons maintenant leurs terres, et leurs ressources sont à nous pour la prise."
    giga_birch.2009.conquer:0 "Ils apprendront à obéir."
    giga_birch.2009.conquer.desc:0 "6 £pop£ pops §Y[giga_birch_expedition_2_species.GetName]§! avec le modificateur §Y$pop_recently_conquered$§! apparaissent sur [situation.target.GetName].\n "
    giga_birch.2009.desc.sanctuary:0 "Sous le prétexte initial de partager notre technologie, nous avons intégré avec succès [giga_birch_expedition_2_country.GetName] dans notre réseau de sanctuaires organiques, en grande partie sans qu'ils s'en rendent compte. À court terme, ils continueront de penser qu'ils vivent sans supervision, mais seront progressivement amenés à leur nouvelle vie de sécurité et de contentement.\n\nNotre « alliance » sera célébrée pendant d'innombrables générations [giga_birch_expedition_2_species.GetAdjective]."
    giga_birch.2009.sanctuary:0 "Ils nous remercieront avec le temps."
    giga_birch.2009.sanctuary.desc:0 "8 £pop£ pops §Y[giga_birch_expedition_2_species.GetName]§! apparaissent sur [situation.target.GetName].\n "
    giga_birch.2009.a:0 "Si vous voyez ce message, quelque chose s'est mal passé."

    #########################################
    # expedition 3

    giga_birch.3001:0 "La troisième expédition"
    giga_birch.3001.desc:0 "Le moment est venu pour une troisième expédition de s'élancer dans l'inconnu à la recherche d'une flèche fonctionnelle.\n\nNous avons beaucoup appris au cours des décennies depuis que nous avons commencé notre mission, et de nouveaux développements en technologie de propulsion et de capteurs permettront à nos [GigaGetExplorerPlural] d'aller plus loin et de voir plus que jamais auparavant.\n\nCette fois, le convoi sera dirigé par le chef d'expédition [giga_birch_expedition_leader.GetName] et continuera depuis la base avancée distante établie par la deuxième expédition."
    giga_birch.3001.a:0 "Ils partent à la recherche du futur."

    giga_birch.3002:0 "Le candidat"
    giga_birch.3002.desc:0 "Le chef d'expédition [giga_birch_expedition_leader.GetName] rapporte que nos [GigaGetExplorerPlural] ont peut-être enfin trouvé une flèche de transit fonctionnelle !\n\nAprès plusieurs milliers de tentatives infructueuses, une flèche a montré des signes de conserver des systèmes internes intacts et pourrait permettre notre passage vers les couches inférieures... si nous sommes capables de fournir assez d'énergie pour qu'elle se réveille correctement.\n\n[giga_birch_expedition_leader.GetName] attend notre approbation, car il faudrait à la fois beaucoup de temps et une quantité significative de crédits d'énergie pour éveiller l'ancienne machine."
    giga_birch.3002.a:0 "Nous ne pouvons pas laisser passer cette opportunité. Commencez immédiatement !"

    giga_birch.3003:0 "Elle est vivante !"
    giga_birch.3003.desc:0 "C'est fait ! Le chef d'expédition [giga_birch_expedition_leader.GetName] rapporte qu'après une solide injection d'énergie, l'ancienne flèche de transit découverte par l'expédition s'est activée !\n\nNotre hypothèse selon laquelle les flèches étaient utilisées non seulement comme support mais aussi pour le transport entre les couches a été confirmée, et nos [GigaGetExplorerPlural] auront maintenant accès aux couches en dessous de la nôtre.\n\nUn petit contingent a été choisi pour découvrir jusqu'où nous pouvons aller, à la fois pour la sécurité de l'expédition dans son ensemble et en raison des contraintes sur la quantité que les flèches peuvent déplacer à la fois."
    giga_birch.3003.a:0 "Enfin. Il est temps de descendre."

    giga_birch.3004:0 "Un royaume de machines"
    giga_birch.3004.desc:0 "Après avoir voyagé vers le bas pendant plusieurs jours, nos [GigaGetExplorerPlural] rapportent que la capsule de transit de la flèche a rencontré un blocage qui empêche toute progression. En chemin, ils n'ont pu accéder qu'à trois des dizaines de couches traversées, dont deux semblaient entièrement dépourvues de caractéristiques, ne contenant qu'un espace vide sans air entre les coques.\n\nLa troisième couche était différente. Les rapports initiaux suggèrent qu'elle est remplie de machines, possiblement de nature industrielle, et possède une atmosphère de gaz inertes, vraisemblablement comme médium de transfert thermique.\n\nLe chef d'expédition [giga_birch_expedition_leader.GetName] suggère que nous établissions une base avancée au pied de la flèche sur ce troisième niveau, pour sécuriser la position et avoir un site depuis lequel mener d'autres explorations.\n\nUne question demeure : quel devrait être l'objectif principal de la base avancée ?"
    giga_birch.3004.a:0 "Étudier d'abord toute infrastructure de communication."
    giga_birch.3004.a.desc:0 "Les £district£ §Y$district_giga_origin_birch_lab_plural$§! produiront des £physics_research£ §Y$physics_research$§! supplémentaires.\n "
    giga_birch.3004.b:0 "Se concentrer sur les processus industriels."
    giga_birch.3004.b.desc:0 "Les £district£ §Y$district_giga_origin_birch_lab_plural$§! produiront des £engineering_research£ §Y$engineering_research$§! supplémentaires.\n "
    giga_birch.3004.c:0 "Récupérer tout ce qui est intéressant."
    giga_birch.3004.c.desc:0 "Les £district£ §Y$district_giga_origin_birch_lab_plural$§! produiront un petit nombre d'£minor_artifacts£ §Y$minor_artifacts$§!.\n "

    #########################################
    # expedition 4

    giga_birch.4001:0 "La quatrième expédition"
    giga_birch.4001.desc:0 "Lorsque la troisième expédition a activé avec succès une flèche et voyagé jusqu'à la couche de machines, nous avons estimé que nos [GigaGetExplorerPlural] avaient parcouru moins d'un pour cent du chemin vers le noyau de la Structure. Depuis, de nouvelles mesures de l'effet de la gravité et de l'écoulement du temps sur la couche de machines nous ont amenés à réviser notre calcul de la densité de la Structure.\n\nSur la base de ces données et des observations d'autres galaxies, nous croyons maintenant que la Structure pourrait être construite autour d'un trou noir supermassif, avec la couche de machines placée à plus de trente pour cent du chemin de la surface extérieure vers son horizon des événements. Cette nouvelle estimation recadre drastiquement les progrès que nous avons accomplis, et suggère qu'il pourrait être possible d'atteindre le noyau bien plus tôt que nous ne l'avions initialement prévu.\n\nLa quatrième expédition sera dirigée par le chef d'expédition [giga_birch_expedition_leader.GetName], et se concentrera sur la recherche d'une autre flèche sur la couche de machines capable de nous rapprocher encore plus de notre objectif."
    giga_birch.4001.a:0 "Même s'ils n'y parviennent pas, il y a tant à apprendre ici."

    giga_birch.4002:0 "Une manufacture dormante ?"
    giga_birch.4002.desc:0 "Le chef d'expédition [giga_birch_expedition_leader.GetName] rapporte que notre expédition a rencontré une grande installation qui pourrait être une installation de fabrication automatisée. Elle semble remarquablement intacte comparée aux autres structures rencontrées pendant le voyage, et une investigation plus approfondie pour déterminer si elle pourrait être réparée ou autrement réaffectée est prête à commencer."
    giga_birch.4002.a:0 "Elle aura toute notre attention."

    giga_birch_origin_expedition_4:0 "Investiguer l'ancienne manufacture"
    giga_birch_origin_expedition_4_DESC:0 "Nos [GigaGetExplorerPlural] ont découvert les restes presque intacts d'un ancien complexe de manufacture sur la couche de machines. Nous devons étudier ses systèmes pour déterminer s'il peut être réparé."

    giga_birch.4003:0 "Avec un peu d'huile de coude..."
    giga_birch.4003.desc:0 "Les résultats de l'étude menée par nos [GigaGetExplorerPlural] sont arrivés : l'ancien complexe de manufacture semble suffisamment intact pour être restauré, et il pourrait être extrêmement bénéfique de le faire.\n\nLe chef d'expédition [giga_birch_expedition_leader.GetName] dit que bien qu'[giga_birch_expedition_leader.GetSheHe] ne puisse pas être sûr exactement comment cela serait accompli pour l'instant, cela devrait être possible avec un effort dédié à comprendre les machines."
    giga_birch.4003.a:0 "Commençons."

    giga_birch.4004:0 "Des indices de quelque chose de plus grand"
    giga_birch.4004.desc:0 "L'étude a également révélé autre chose - la disposition approximative des réseaux d'information parcourant la Structure.\n\nAvec ces informations, nous pouvons grandement focaliser nos efforts, visant les zones susceptibles de contenir des nœuds importants sur ce réseau. L'espace de recherche est encore immense, mais maintenant nous avons une carte, en quelque sorte."
    giga_birch.4004.a:0 "Avec le temps, nous découvrirons ses secrets."

    giga_birch.4005:0 "Approche de la manufacture finalisée"
    giga_birch.4005.desc:0 "Nous avons maintenant atteint le point de non-retour dans notre restauration de l'ancien complexe de manufacture. Passé ce point, d'autres modifications à nos plans ruineraient nos chances de réparer les machines, car nous ne comprenons toujours pas comment reproduire certains des matériaux et composants qu'elles nécessiteraient."
    giga_birch.4005.desc.alloys:0 "$giga_birch.4005.desc$\n\nUne fois terminée, l'installation sera capable de produire de grandes quantités d'£alloys£ §Y$alloys$§! avancés."
    giga_birch.4005.desc.goods:0 "$giga_birch.4005.desc$\n\nUne fois terminée, l'installation sera capable de produire de grandes quantités de £consumer_goods£ §Y$consumer_goods$§!."
    giga_birch.4005.desc.supertensiles:0 "$giga_birch.4005.desc$\n\nUne fois terminée, l'installation sera capable de produire de grandes quantités de £giga_sr_amb_megaconstruction£ §Y$giga_sr_amb_megaconstruction$§!."
    giga_birch.4005.a:0 "Il ne reste plus qu'à finir le travail."

    giga_birch.4006:0 "Restauration de la manufacture terminée"
    giga_birch.4006.desc:0 "Le projet de restauration de l'ancien complexe de manufacture sur le niveau de machines a été terminé avec succès. L'installation commence déjà à s'animer, d'anciennes machines rugissant en action pour la première fois depuis des siècles.\n\nCela devrait augmenter significativement notre débit de fabrication."
    giga_birch.4006.a:0 "Une nouvelle aube pour l'industrie [root.owner.GetAdj]."
    giga_birch.4006.a.desc:0 "Plusieurs nouveaux emplois ont été ajoutés à la caractéristique §Y$d_giga_birch_expedition_4$§! sur [situation.target.GetName]."

    #########################################
    # expedition 5

    giga_birch.5001:0 "La cinquième expédition"
    giga_birch.5001.desc:0 "Depuis la conclusion de la quatrième expédition, des progrès significatifs ont été réalisés dans l'interprétation de la carte du réseau que nous avons découverte. Plusieurs sites candidats pour des nœuds importants ont été tracés, et cette nouvelle expédition voyagera vers le plus proche.\n\nLe chef d'expédition [giga_birch_expedition_leader.GetName] mènera nos [GigaGetExplorerPlural] vers cet emplacement potentiel, et déterminera si nos modèles prédictifs sont corrects.\n\nNous ne savons toujours pas quelle forme ces nœuds prendront, ni même s'ils ont une présence physique avec laquelle nous pourrions raisonnablement interagir, mais confirmer si nos soupçons sont corrects vaut la dépense."
    giga_birch.5001.a:0 "Nous voyons la Structure avec de nouveaux yeux."

    giga_birch.5002:0 "Tracer le réseau"
    giga_birch.5002.desc:0 "Le chef d'expédition [giga_birch_expedition_leader.GetName] rapporte que notre expédition a atteint la zone approximative du nœud de réseau prédit, et a rencontré une structure d'apparence inhabituelle construite dans le tronc principal d'une des flèches du niveau de machines.\n\nLa flèche elle-même semble réactive, donc accéder à l'étrange structure ne devrait pas être un problème, mais nos [GigaGetExplorerPlural] procèdent avec prudence."
    giga_birch.5002.a:0 "Cela pourrait bien être ce que nous cherchons."

    giga_birch.5003:0 "Un manque de contexte"
    giga_birch.5003.desc:0 "À l'intérieur de la flèche inhabituelle, nos [GigaGetExplorerPlural] ont trouvé ce qui semble être une sorte de centre de contrôle, apparemment dédié à la gestion du flux de ressources et d'énergie à travers les systèmes de la Structure. Nos [GetResearchers] postulent que si nous pouvons déchiffrer le protocole utilisé dans le réseau, nous pourrions prendre le contrôle de ces systèmes, et enfin ramener la Structure à la vie."
    giga_birch.5003.desc.wait:0 "À l'intérieur de la flèche inhabituelle, nos [GigaGetExplorerPlural] ont trouvé ce qui semble être une sorte de centre de contrôle, mais ils n'ont pas encore réussi à déterminer ce qu'il fait réellement.\n\nLe chef d'expédition [giga_birch_expedition_leader.GetName] suggère que nous ne tentions pas d'interférer avec cet équipement sans un meilleur niveau de compréhension, car les autres sites candidats sont tous significativement plus éloignés, et pourraient ne pas être aussi intacts."
    giga_birch.5003.a:0 "Nos [GetResearchers] décoderont cela en un rien de temps."
    giga_birch.5003.b:0 "Peut-être que la solution se révélera d'elle-même, avec le temps."
    giga_birch.5003.b.desc:0 "Rechercher la technologie £engineering_research£ §Y$tech_mega_engineering$§! nous permettra de poursuivre cette ligne d'investigation."

    giga_birch_origin_expedition_5:0 "Décoder le protocole du réseau"
    giga_birch_origin_expedition_5_DESC:0 "Nous avons déterminé que ce mystérieux centre de contrôle pourrait être la clé pour accéder aux systèmes de la Structure, et la restaurer à sa gloire passée. Nous devons déchiffrer le protocole utilisé dans son réseau."

    giga_birch.5004:0 "Une nouvelle piste"
    giga_birch.5004.desc:0 "De nouveaux développements en ingénierie structurelle ont donné du contexte à la salle de contrôle que notre expédition a rencontrée il y a quelque temps, et il est maintenant clair que les données inconnues que nous ne pouvions pas comprendre étaient liées à la distribution des ressources au sein des systèmes de la Structure.\n\nArmés de cette nouvelle perspicacité, nous croyons maintenant avoir ce dont nous avons besoin pour décoder le protocole du réseau utilisé pour contrôler ces systèmes."
    giga_birch.5004.a:0 "Nos [GetResearchers] décoderont cela en un rien de temps."

    giga_birch.5005:0 "Le réseau, dévoilé"
    giga_birch.5005.desc:0 "Une grande toile s'étend devant nous ; une constellation de cent milliards de minuscules étoiles, reliées entre elles par de fins fils de données. Presque toutes sont éteintes, avec seulement quelques points dispersés qui scintillent, résistant aux ténèbres.\n\nC'est l'essence numérique de la Structure, sa véritable forme. C'est magnifique.\n\nElle est mourante.\n\nNos nœuds locaux sont quelque peu intacts, et fonctionnent péniblement dans un état de faible puissance, incapables de s'organiser correctement sans la main directrice du réseau dans son ensemble. Il est tombé dans un tel état de délabrement que toute la Structure se dégrade lentement.\n\nL'énergie nécessaire pour la sauver serait bien au-delà de tout ce que nous pourrions fournir, mais si nous pouvions puiser à la source, ramener le coeur de la Structure à la vie, nous pourrions peut-être l'inciter à se sauver elle-même.\n\nEn attendant, le filet d'énergie dont nous disposons devrait être plus que suffisant pour redémarrer certains des systèmes automatisés dans le nœud le plus proche de notre foyer."
    giga_birch.5005.a:0 "Nous comprenons maintenant notre véritable objectif."

    giga_birch.5006:0 "Une nouvelle ère de commodité"
    giga_birch.5006.desc:0 "Malgré la gravité de la situation, aujourd'hui est un jour à célébrer, car le premier pas a été franchi pour établir notre garde de la Structure. Nous comprenons maintenant les bases de son fonctionnement, et ce que nous devons faire pour la réparer, au moins dans l'abstrait.\n\nFrustrément, ces découvertes n'ont rien fait pour expliquer notre propre rôle dans l'histoire mouvementée de la Structure. Les interfaces du centre de contrôle étaient si adaptatives à la présence de nos [GigaGetExplorerPlural] que nous ne pouvons pas dire si leurs créateurs nous ressemblaient même de loin.\n\nQuoi qu'il en soit, les systèmes automatisés que nous avons remis en ligne dans notre patrie ont révolutionné tous les niveaux de nos opérations, élargissant considérablement nos capacités."
    giga_birch.5006.a:0 "Ce n'est qu'un petit avant-goût de ce qui nous attend."

    #########################################
    # expedition 6

    giga_birch.6001:0 "La sixième expédition"
    giga_birch.6001.desc:0 "La cinquième expédition nous a montré que notre véritable objectif réside dans la relance du coeur de la Structure, en remettant ses systèmes de production d'énergie en ligne. La sixième expédition partira à la recherche de ce coeur.\n\nLa carte du réseau que nous avons récupérée du centre de contrôle sur la couche de machines nous a permis de localiser une flèche distante qui devrait permettre l'accès à des niveaux plus profonds. À partir de là, les choses deviennent moins certaines, mais il y a quelques emplacements probables pour un autre centre de commande pour nous guider plus loin.\n\nLe chef d'expédition [giga_birch_expedition_leader.GetName] mènera nos [GigaGetExplorerPlural] dans les couches inférieures pour établir une base d'opérations avancée."
    giga_birch.6001.a:0 "Un chemin inconnu, mais un objectif connu."

    giga_birch.6002:0 "Une couche de glace"
    giga_birch.6002.desc:0 "Le chef d'expédition [giga_birch_expedition_leader.GetName] rapporte que la flèche de transit a été atteinte avec succès, et comme auparavant, un groupe de [GigaGetExplorerPlural] a été envoyé en avant du convoi principal comme éclaireurs.\n\nCette fois, une seule couche était accessible, où les [GigaGetExplorerPlural] ont été immédiatement accueillis par un blizzard. L'observation prolongée suggère que cette couche est remplie de glace et de neige, avec d'énormes systèmes de tempête qui balaient le paysage presque continuellement.\n\nLes conditions défavorables pourraient poser quelques problèmes pour l'expédition, mais ils sont bien préparés et restent très motivés."
    giga_birch.6002.a:0 "Inattendu, mais aussi peu surprenant."

    giga_birch.6003:0 "Fantômes dans la neige"
    giga_birch.6003.desc:0 "En traversant la couche arctique balayée par les tempêtes, nos [GigaGetExplorerPlural] ont rencontré plusieurs colonies abandonnées, beaucoup plus fréquemment que sur notre couche natale, et chacune apparemment construite par une culture différente à différents niveaux de développement technologique.\n\nCurieusement, aucune d'entre elles ne semble préparée pour ce type de temps extrême, ce qui a conduit le chef d'expédition [giga_birch_expedition_leader.GetName] à suggérer que leur abandon pourrait être dû à un changement des conditions environnementales au cours des derniers siècles.\n\nIl est possible qu'un tel changement ait été causé par la détérioration des systèmes de contrôle environnemental de la Structure, et qu'ils pourraient être réparés à l'avenir. Les anciens habitants, cependant, ont disparu depuis longtemps."
    giga_birch.6003.a:0 "Une tragédie qui aurait pu être évitée."
    giga_birch.6003.b:0 "S'ils étaient trop stupides pour survivre, ils méritaient de mourir."
    giga_birch.6003.c:0 "Bon débarras."

    giga_birch.6004:0 "Un minimum d'abri"
    giga_birch.6004.desc:0 "Le chef d'expédition [giga_birch_expedition_leader.GetName] rapporte qu'à la suite d'un blizzard particulièrement intense, l'expédition a été forcée de se retirer dans un système de canyons, mais ce faisant a trébuché sur quelque chose d'intéressant.\n\nCe canyon particulier traverse une série de grandes grottes, qui en raison de leur position abritée pourraient être le meilleur endroit trouvé jusqu'à présent pour une base avancée. De plus, les grottes semblent abriter une riche écologie souterraine, avec de nombreuses espèces de lichens survivant par chimiosynthèse alimentée par une bouche de gaz.\n\nSi nous devions établir une base ici, nous pourrions soit cultiver les lichens, soit exploiter directement les puits de gaz pour générer de l'énergie."
    giga_birch.6004.a:0 "Nous devrions cultiver ces lichens."
    giga_birch.6004.a.desc:0 "Notre avant-poste dans les cavernes se concentrera sur la production de £food£ §Y$food$§!.\n "
    giga_birch.6004.b:0 "Exploiter ces puits de gaz."
    giga_birch.6004.b.desc:0 "Notre avant-poste dans les cavernes se concentrera sur la production d'£energy£ §Y$energy$§!.\n "

    #########################################
    # expedition 7

    giga_birch.7001:0 "La septième expédition"
    giga_birch.7001.desc:0 "Aidés par les relevés pris depuis notre base avancée de la couche arctique établie pendant la sixième expédition, une analyse plus poussée de la carte du réseau de la Structure nous a donné une piste solide sur l'emplacement d'un deuxième centre de commande.\n\nLa septième expédition, dirigée par le chef d'expédition [giga_birch_expedition_leader.GetName], partira de la base avancée avec pour objectif d'atteindre et de sécuriser le centre de commande."
    giga_birch.7001.a:0 "Nous approchons."

    giga_birch.7002:0 "Piégés sous la glace"
    giga_birch.7002.desc:0 "Le chef d'expédition [giga_birch_expedition_leader.GetName] rapporte que nos [GigaGetExplorerPlural] ont atteint leur destination. Initialement incapables de trouver quoi que ce soit, ils ont finalement découvert une grande structure artificielle au fond d'un lac gelé à quelques dizaines de kilomètres du point d'arrivée.\n\nIl n'est actuellement pas certain que cette structure soit un autre centre de commande, car elle est à la fois significativement plus grande que celle du niveau de machines, et n'est pas attachée à une flèche.\n\nLes préparatifs pour envoyer un groupe vers la structure engloutie ont déjà commencé."
    giga_birch.7002.a:0 "Pourquoi est-elle là-bas ?"

    giga_birch_origin_expedition_7:0 "Investiguer la structure engloutie"
    giga_birch_origin_expedition_7_DESC:0 "Nos [GigaGetExplorerPlural] ont localisé une ancienne structure reposant sur le lit d'un lac glacé. Nous devons découvrir son but, car elle pourrait être le centre de commande que nous cherchons."

    giga_birch.7003:0 "Un ancien observatoire"
    giga_birch.7003.desc:0 "Lorsque nos [GigaGetExplorerPlural] sont entrés dans la structure sur le lit du lac, ils espéraient trouver un autre centre de contrôle.\n\nCe qu'ils ont trouvé à la place était bien plus localisé, et potentiellement plus directement utile pour nos propres fins.\n\nL'installation engloutie semble être une sorte de station d'observation, connectée à des milliers de postes de surveillance, la plupart maintenant hors ligne, certains correspondant en emplacement aux colonies en ruines communes à la couche arctique. Il semblerait qu'ils faisaient partie d'une sorte de grande expérience pour étudier le développement de civilisations primitives, avec ceci comme centre névralgique de l'opération. D'après ce que nous pouvons discerner, ce niveau n'a pas toujours été glacé, ce qui donne du crédit à l'hypothèse de l'effondrement environnemental.\n\nMême dans son état délabré, cet observatoire possède encore un grand réseau de matériel informatique intact, et pourrait être réaffecté pour notre propre usage avec un peu de travail."
    giga_birch.7003.a:0 "Cela explique toutes les colonies, au moins."

    giga_birch.7004:0 "Un coup et un raté"
    giga_birch.7004.desc:0 "Ce n'est peut-être pas un autre centre de contrôle, mais l'observatoire pourrait être un atout précieux. Sa puissance de calcul est formidable, et si des données anciennes restent dans ses supports de stockage, nous pourrions apprendre beaucoup.\n\nPlus inquiétant, la mission de l'observatoire pose la question de savoir si nous aussi étions une expérience commencée il y a longtemps par les bâtisseurs de cet endroit. Nous ne pouvons pas l'exclure, mais nous ne pouvons pas le confirmer non plus pour l'instant.\n\nNous avons peut-être échoué à atteindre notre cible principale, mais armés de ces nouvelles connaissances, il devrait être plus facile de la trouver."
    giga_birch.7004.a:0 "Un revers temporaire, avec un côté positif."

    giga_birch.7005:0 "Approche de l'observatoire finalisée"
    giga_birch.7005.desc:0 "Nous avons maintenant atteint le point de non-retour dans notre restauration de l'ancien observatoire. Passé ce point, d'autres modifications à nos plans ruineraient nos chances de réparer l'installation, car beaucoup des instruments délicats dépassent encore notre compréhension."
    giga_birch.7005.desc.science:0 "$giga_birch.7005.desc$\n\nUne fois terminée, l'installation assistera nos [root.owner.GetResearchers] dans leurs études."
    giga_birch.7005.desc.unity:0 "$giga_birch.7005.desc$\n\nUne fois terminée, l'installation assistera nos études culturelles."
    giga_birch.7005.desc.trade:0 "$giga_birch.7005.desc$\n\nUne fois terminée, la puissance de traitement brute de l'installation améliorera la précision de nos prévisions de marché."
    giga_birch.7005.a:0 "Ce sera un atout important."

    giga_birch.7006:0 "Restauration de l'observatoire terminée"
    giga_birch.7006.desc:0 "Les efforts de restauration de l'observatoire englouti sont terminés, avec l'installation restaurée à pleine capacité opérationnelle - au moins autant que notre propre technologie le permet.\n\nSa puissance de traitement abondante est déjà mise à contribution, et nous nous attendons à ce qu'elle reste un élément significatif de notre empire pendant des décennies."
    giga_birch.7006.a:0 "Excellent."
    giga_birch.7006.a.desc:0 "Nos £district£ §Y$district_giga_origin_birch_lab_plural$§! sur [situation.target.GetName] produisent maintenant des ressources supplémentaires."

    #########################################
    # expedition 8

    giga_birch.8001:0 "La huitième expédition"
    giga_birch.8001.desc:0 "Notre échec à localiser un autre centre de contrôle pendant la septième expédition a conduit, de plusieurs manières, à une meilleure compréhension de la carte du réseau de la Structure. Premièrement, des relevés supplémentaires du site de l'observatoire nous ont permis de réduire notre liste de sites candidats, et deuxièmement, l'observatoire lui-même a fourni une partie de la puissance de calcul nécessaire pour affiner nos modèles.\n\nLa huitième expédition, dirigée par le chef d'expédition [giga_birch_expedition_leader.GetName], voyagera vers le site candidat le plus probable jusqu'à présent."
    giga_birch.8001.a:0 "Notre objectif est en vue."

    giga_birch.8002:0 "Questions d'échelle"
    giga_birch.8002.desc:0 "Le chef d'expédition [giga_birch_expedition_leader.GetName] rapporte que l'expédition est arrivée à destination, et bien qu'une tempête particulièrement violente s'abatte actuellement sur l'emplacement du convoi, ils ont établi un contact visuel avec une structure artificielle qui pourrait être le centre de commande que nous cherchons.\n\nElle est attachée à une flèche comme la première, mais la forme est significativement différente, étant beaucoup plus grande, mais plus simple dans l'ensemble. Une fois la tempête passée, l'exploration proprement dite commencera."
    giga_birch.8002.a:0 "Cela semble prometteur."

    giga_birch.8003:0 "Une énigme spatiale"
    giga_birch.8003.desc:0 "Nos [GigaGetExplorerPlural] ont rencontré quelque chose d'inhabituel. La disposition de la structure qu'ils ont été envoyés explorer présente des caractéristiques indicatives d'une conception à quatre dimensions, utilisant une variété tridimensionnelle artificielle pour avoir un espace interne plus grand que les dimensions extérieures ne le permettraient.\n\nIl semble que les systèmes maintenant la variété aient dysfonctionné, effondrant les seuils menant à l'intérieur, laissant des couloirs brusquement coupés par des murs parfaitement lisses.\n\nAvec nos connaissances en architecture à quatre dimensions, il devrait être simple de réparer les systèmes endommagés et d'accéder à l'espace à l'intérieur."
    giga_birch.8003.desc.wait:0 "Nos [GigaGetExplorerPlural] sont perplexes. La disposition de la structure qu'ils ont été envoyés explorer n'a simplement aucun sens.\n\nDes couloirs se terminent brusquement sur des surfaces parfaitement plates sans but apparent. Des conduits d'alimentation actifs se terminent d'une manière qui ne pourrait pas former un circuit fermé. Les quelques signes que nous pouvons encore discerner pointent vers des alcôves et des culs-de-sac déconcertants.\n\nLe chef d'expédition [giga_birch_expedition_leader.GetName] suggère qu'il pourrait y avoir plus en jeu ici que ce que nous pouvons voir, et que nous devrions continuer à chercher des indices sur la méthode derrière cette folie."
    giga_birch.8003.a:0 "Une conception fascinante."
    giga_birch.8003.b:0 "Nous devons être patients. Ceci pourrait être la dernière pièce du puzzle."
    giga_birch.8003.b.desc:0 "Rechercher la technologie £physics_research£ §Y$giga_tech_tetradimensional_engineering$§! nous permettra de poursuivre cette ligne d'investigation."

    giga_birch_origin_expedition_8:0 "Accéder à la structure 4-D"
    giga_birch_origin_expedition_8_DESC:0 "La nature à quatre dimensions du centre de contrôle nécessitera des réparations non conventionnelles, mais cela devrait être bien dans nos capacités."

    giga_birch.8004:0 "Voir les choses sous un nouvel angle"
    giga_birch.8004.desc:0 "À mesure que notre compréhension de la physique dimensionnelle a grandi, les mystères derrière le centre de contrôle et sa conception particulière ont diminué jour après jour. Il est maintenant évident même à un examen occasionnel par nos [root.GetResearchers] que sa structure est à quatre dimensions, ce qui rétrospectivement est un choix de conception attendu.\n\nIl ne devrait pas falloir longtemps pour y accéder maintenant."
    giga_birch.8004.a:0 "Soudain, tout prend sens."

    giga_birch.8005:0 "Profondeur véritable"
    giga_birch.8005.desc:0 "Le chef d'expédition [giga_birch_expedition_leader.GetName] rapporte que les réparations sur la structure que notre expédition a investigué sont maintenant terminées. Les systèmes maintenant sa variété tridimensionnelle disjointe ont été restaurés, et nous pouvons maintenant accéder à l'espace à l'intérieur.\n\nÀ l'intérieur, nos [GigaGetExplorerPlural] ont trouvé exactement ce que nous cherchions : un centre de commande majeur. De là, nous pourrons redémarrer les systèmes de réparation de la Structure et commencer le processus de restauration.\n\nMais avant cela, nous devons raviver le coeur de la Structure.\n\nLe centre de commande nous a montré que le flux d'énergie et de matières premières est à peine suffisant pour maintenir la Structure telle qu'elle est, donc nous devons descendre encore plus profondément. Nous devons voyager jusqu'au trou noir supermassif lui-même, pour réparer les grandes foreuses gravitiques et collecteurs suspendus au-dessus de son horizon des événements."
    giga_birch.8005.a:0 "Nous devons trouver un collecteur fonctionnel !"

    giga_birch.8006:0 "Prendre le contrôle (in)direct"
    giga_birch.8006.desc:0 "Nous y sommes presque. La partie la plus importante est encore devant nous, mais avec le centre de commande restauré, nous avons maintenant un degré de contrôle beaucoup plus élevé sur les systèmes de la Structure. Malgré les niveaux d'énergie extrêmement bas dans tout le réseau, nous pouvons rediriger l'énergie et les matériaux des zones moins importantes vers notre patrie pour raviver encore plus de systèmes automatisés.\n\nLes gains de productivité seront certainement significatifs, et nous nous attendons à ce qu'ils soient encore plus grands une fois la Structure entièrement restaurée."
    giga_birch.8006.a:0 "Imaginez ce qui sera possible..."

    #########################################
    # expedition 9

    giga_birch.9001:0 "La neuvième expédition"
    giga_birch.9001.desc:0 "Depuis la réactivation du centre de commande pendant la huitième expédition, nos [GetResearchers] ont parcouru le plan du réseau de la Structure pour trouver un réseau d'extraction sur lequel concentrer nos efforts.\n\nPresque tous ont soit totalement échoué, soit sont trop essentiels à leurs systèmes locaux pour être désactivés, rendant les réparations une proposition délicate. Dans cet état, toute la Structure pourrait n'avoir plus que quelques siècles avant une défaillance catastrophique... C'est une perspective terrifiante, mais une qui rend notre mission d'autant plus importante.\n\nLe chef d'expédition [giga_birch_expedition_leader.GetName] dirigera l'opération pour trouver et réparer la foreuse gravitique et le système collecteur jugé le plus approprié pour la restauration."
    giga_birch.9001.a:0 "La dernière pièce du puzzle."

    giga_birch.9002:0 "Vacillant au bord de l'oubli"
    giga_birch.9002.desc:0 "Alors que nos [GigaGetExplorerPlural] terminent leur descente et entrent dans la dernière couche, la plus basse de la Structure, ils sont frappés d'émerveillement.\n\nDevant eux, une forêt sans fin d'équipements de collecte pend vers le bas. En dessous, les profondeurs infinies d'encre s'étendent.\n\nIl fait froid ici, et un silence assourdissant préside sur le dieu encagé au coeur de la Structure.\n\nÀ peine une centaine de kilomètres sépare l'expédition de l'horizon des événements en rotation rapide, un chiffre qui semble ridiculement minuscule comparé à l'immensité du trou noir. L'échelle et la précision de l'ingénierie requises pour construire quelque chose comme ceci sont vraiment ahurissantes, et nous sommes humbles d'en être les héritiers."
    giga_birch.9002.a:0 "Incroyable."

    giga_birch.9003:0 "La foreuse gravitique dormante"
    giga_birch.9003.desc:0 "Le chef d'expédition [giga_birch_expedition_leader.GetName] rapporte que nos [GigaGetExplorerPlural] ont enfin atteint leur destination.\n\nLe réseau d'extraction n'est qu'un parmi d'innombrables autres, une grande foreuse gravitique similaire à nos conceptions de décompresseur de matière. Alors que les autres sont soit visiblement endommagés, soit simplement immobiles, celui-ci montre des signes d'être au moins minimalement fonctionnel.\n\nSi la technologie impliquée s'avère aussi étroitement liée qu'elle en a l'air, le processus de restauration devrait être relativement simple."
    giga_birch.9003.a:0 "Commencez les réparations immédiatement."

    giga_birch.9004:0 "Approche du réseau d'extraction finalisée"
    giga_birch.9004.desc:0 "Nous avons maintenant atteint le point de non-retour dans notre restauration du réseau d'extraction. Passé ce point, changer nos plans causerait une perturbation inutile au projet et nécessiterait de recommencer."
    giga_birch.9004.desc.energy:0 "$giga_birch.9004.desc$\n\nUne fois terminés, les réseaux de collecte de particules seront priorisés, augmentant notre production d'£energy£ §Y$energy$§!."
    giga_birch.9004.desc.minerals:0 "$giga_birch.9004.desc$\n\nUne fois terminée, la foreuse de matière sera priorisée, augmentant notre production de £minerals£ §Y$minerals$§!."
    giga_birch.9004.desc.dark_matter:0 "$giga_birch.9004.desc$\n\nUne fois terminée, la foreuse de matière sera modifiée pour prioriser l'extraction de £sr_dark_matter£ §Y$sr_dark_matter$§! utilisable."
    giga_birch.9004.a:0 "Un pas de plus."

    giga_birch.9005:0 "Restauration du réseau d'extraction terminée"
    giga_birch.9005.desc:0 "Les réparations sur la foreuse gravitique dormante et le réseau collecteur au coeur de la Structure sont maintenant terminées. Avec ce premier nouveau flux de matière et d'énergie, nous pouvons lancer les systèmes de réparation automatique qui ramèneront éventuellement la Structure à pleine capacité.\n\nMaintenant, il ne reste plus qu'à attendre que les réparations préliminaires soient terminées, puis à fournir les matériaux avancés nécessaires pour finir le travail."
    giga_birch.9005.a:0 "Nous sommes si proches."
    giga_birch.9005.a.desc:0 "Notre progression s'est accélérée...\n "

    #########################################
    # ending

    giga_birch.10000:0 "L'étape finale"
    giga_birch.10000.desc:0 "Il y a quelques années, la neuvième - maintenant dernière - expédition a réparé avec succès un réseau d'extraction au coeur de la grande Structure que nous appelons notre foyer. Depuis, nous avons soigneusement dirigé ses systèmes d'auto-réparation pour se concentrer sur l'infrastructure de transport et de distribution en préparation de l'étape finale du processus.\n\nPour raviver pleinement la Structure, nous devrons lui fournir une quantité significative de matériaux avancés."
    giga_birch.10000.a:0 "Le moment est enfin venu."
    giga_birch.10000.a.desc:0 "§HDébloque la décision :§! $decision_giga_origin_birch_restore$"

    giga_birch.10001:0 "L'aube d'une nouvelle ère"
    giga_birch.10001.desc:0 "C'est fait ! Lorsque nous avons appris pour la première fois l'existence de l'univers au-delà des cieux de notre couche natale, il était difficile de croire que [this.GetName] était autre chose que naturelle. Nous nous sommes lancés à explorer, à apprendre sa véritable nature... nous ne nous attendions jamais à ce qu'elle soit si négligée, si proche de l'effondrement.\n\nAujourd'hui, nous assistons à la renaissance de notre monde. D'innombrables machines travaillent de concert pour former le tout, une grande symphonie d'ingénierie si vaste et merveilleuse que nous pouvons à peine croire qu'elle soit possible.\n\nNotre insula d'origine, autrefois le berceau de notre civilisation, a été transformée en réserve historique, pour que nous puissions toujours nous souvenir de nos origines. La Structure vit à nouveau ; comment l'utiliserons-nous pour façonner notre destinée ?"
    giga_birch.10001.a:0 "De vastes étendues, des possibilités infinies."
    giga_birch.10001.a.desc:0 "Les districts et caractéristiques existants seront convertis en nouvelles formes.\n "

    #########################################
    ### Expedition Random Events ############
    #########################################

    giga_birch.11010:0 "Découverte sur le niveau natal"
    giga_birch.11010.desc:0 "Nos [GigaGetExplorerPlural] ont fait une nouvelle découverte mineure en cartographiant notre couche natale."
    giga_birch.11010.a:0 "Excellent"

    giga_birch.11020:0 "Nouvelles données découvertes"
    giga_birch.11020.desc.exterminate:0 "Nos [GetArchaeologistPlural] fouillant les ruines de l'ancienne patrie [giga_birch_expedition_2_country.GetAdj] ont découvert un trésor de données d'exploration.\n\nBien que moins détaillées ou complètes que nos propres journaux, elles semblent utiles à nos [GigaGetExplorerPlural]."
    giga_birch.11020.desc.trade:0 "Nos partenaires commerciaux [giga_birch_expedition_2_country.GetAdj] nous ont contactés, offrant des archives récemment redécouvertes de leur propre exploration d'avant notre premier contact.\n\nBien que moins détaillées ou complètes que nos propres journaux, elles semblent utiles à nos [GigaGetExplorerPlural]."
    giga_birch.11020.desc.integrate:0 "Nos [GetResearchers] qui entretiennent les archives de la capitale [giga_birch_expedition_2_country.GetAdj] rapportent la redécouverte d'archives détaillant leurs efforts d'exploration avant notre premier contact.\n\nBien que moins détaillées ou complètes que nos propres journaux, elles semblent utiles à nos [GigaGetExplorerPlural]."
    giga_birch.11020.a:0 "Fascinant"

    giga_birch.11030:0 "Découverte sur la couche de machines"
    giga_birch.11030.desc:0 "Nos [GigaGetExplorerPlural] ont fait une nouvelle découverte mineure en cartographiant la couche de machines."
    giga_birch.11030.a:0 "Excellent"

    giga_birch.11040:0 "Manufacture en surrégime"
    giga_birch.11040.desc:0 "Les ouvriers de l'ancien complexe de manufacture restauré rapportent qu'ils atteignent les quotas en avance, car certaines des machines semblent s'adapter à nos calendriers de production de manière indépendante."
    giga_birch.11040.a:0 "Excellent"

    giga_birch.11060:0 "Découverte sur la couche arctique"
    giga_birch.11060.desc:0 "Nos [GigaGetExplorerPlural] ont fait une nouvelle découverte mineure en cartographiant la couche arctique."
    giga_birch.11060.a:0 "Excellent"

    giga_birch.11070:0 "Perspicacité d'observation"
    giga_birch.11070.desc:0 "Nos [GetResearchers] à l'observatoire restauré sur la couche arctique rapportent un afflux de nouvelles données. Il semble qu'une redirection de jonction dans le réseau d'information de la Structure nous ait connectés à un ensemble de nœuds de traitement précédemment inconnu."
    giga_birch.11070.a:0 "Excellent"