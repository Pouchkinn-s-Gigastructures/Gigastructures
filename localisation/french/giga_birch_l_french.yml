    d_giga_birch_mechanics:0 "Systèmes centraux du Monde Birch"
    d_giga_birch_mechanics_desc:0 "Des machines incroyablement avancées parcourent chaque facette de cette construction colossale."
    d_giga_birch_mechanics_tooltip:0 "Cette caractéristique planétaire gère de nombreuses fonctions de jeu du $name_birch$ et est nécessaire à son bon fonctionnement."

    # aiondia

    d_giga_aiondia_blocker_structure:0 "Salles de contrôle abandonnées"
    d_giga_aiondia_blocker_structure_desc:0 "§P$d_aeternum_decaying_hyperstructure$§!\n\nDans le palais au centre de §H$district_giga_birch_structure_aiondia_subtitle$§!, il existe une salle de contrôle d'une complexité si stupéfiante que nos experts ont été totalement incapables d'y trouver un sens. Soit les systèmes contrôlant les opérations structurelles d'Aiondia sont à un niveau au-delà de notre compréhension, soit nous sommes victimes d'une plaisanterie vieille de plusieurs éons. Quelle que soit la raison de leur nature baroque, si nous voulons un jour étendre notre influence au-delà des mégapoles, nous devrons déchiffrer les contrôles des systèmes de maintenance d'Aiondia."

    d_giga_aiondia_blocker_orykta:0 "Extracteurs en sommeil"
    d_giga_aiondia_blocker_orykta_desc:0 "§P$d_aeternum_decaying_hyperstructure$§!\n\nMême au sommet de l'âge d'or Aeternite, Aiondia n'a jamais été conçue pour être alimentée en tirant toutes ses matières premières du trou noir en contrebas, les réseaux d'extraction étant destinés à servir de réserve de secours en cas d'urgence. Si nous souhaitons exploiter pleinement ces ressources, nous devrons mettre ces systèmes en ligne et élargir considérablement leur portée."
    slot_giga_birch_orykta_insula_clear_blocker_prereq:0 "Éliminer $d_giga_aiondia_blocker_orykta$"

    d_giga_aiondia_blocker_ktisma:0 "Œuvres malformées"
    d_giga_aiondia_blocker_ktisma_desc:0 "§P$d_aeternum_decaying_hyperstructure$§!\n\nDes centaines de milliers d'années d'inactivité, ponctuées par des demandes de fabrication occasionnelles et excentriques, ont laissé les systèmes contrôlant les usines et fonderies des $district_giga_birch_ktisma_plural$ avec peu de choses sur lesquelles se concentrer. Au fil du temps, cela a conduit au développement d'un pseudo-écosystème indiscipliné de machines autoréplicatives mutées. Si nous souhaitons utiliser ces installations, nous devrons créer de l'ordre à partir de ce chaos."
    slot_giga_birch_ktisma_insula_clear_blocker_prereq:0 "Éliminer $d_giga_aiondia_blocker_ktisma$"

    d_giga_aiondia_blocker_physma:0 "Écologies effondrées"
    d_giga_aiondia_blocker_physma_desc:0 "§P$d_aeternum_decaying_hyperstructure$§!\n\nSans régulation appropriée, d'immenses étendues des $district_giga_birch_physma_plural$ ont succombé à l'effondrement écologique et ne sont guère plus que des terres désolées. Si nous souhaitons utiliser pleinement cette région, nous devons réparer les systèmes de contrôle environnemental qui la maintiennent."
    slot_giga_birch_physma_insula_clear_blocker_prereq:0 "Éliminer $d_giga_aiondia_blocker_physma$"

    # origin insula stuff

    d_giga_birch_origin_home_insula:0 "Insula d'origine"
    d_giga_birch_origin_home_insula_desc:0 "Le berceau de la civilisation."

    d_giga_birch_origin_home_insula_restored:0 "Insula d'origine"
    d_giga_birch_origin_home_insula_restored_desc:0 "Autrefois le berceau de la civilisation, cette région est maintenant essentiellement dépeuplée et conservée comme réserve naturelle."

    d_giga_birch_origin_home_farms:0 "Champs d'or"
    d_giga_birch_origin_home_farms_desc:0 "Terres agricoles de premier choix, cette vallée riche et fertile a longtemps fourni des récoltes abondantes."

    d_giga_birch_origin_home_catalytic_farms:0 "Sols minéralisés"
    d_giga_birch_origin_home_catalytic_farms_desc:0 "Creuser des tunnels dans la base de la Montagne sans fond nous a permis de siphonner une partie du limon qu'elle contient et d'étendre considérablement notre surface cultivable totale."

    d_giga_birch_origin_home_mines:0 "La Montagne sans fond"
    d_giga_birch_origin_home_mines_desc:0 "Les archives anciennes racontent qu'une montagne surgit de la terre, regorgeant de richesses minérales inépuisables. L'analyse moderne suggère qu'elle provient d'un conduit rompu dans le système de pluie de limon de la Structure, le limon minéral poussant continuellement la surface vers le haut et durcissant au fil des années."

    d_giga_birch_origin_home_lithoid_mines:0 "Pièges à pluie de limon"
    d_giga_birch_origin_home_lithoid_mines_desc:0 "De vastes zones encadrées par des digues peu profondes nous permettent de concentrer la pluie de limon qui s'écoulerait partiellement vers d'autres régions. La réduction du réapprovisionnement des sols érodés en aval est considérée comme un compromis acceptable pour les minéraux supplémentaires que nous pouvons récolter."

    d_giga_birch_origin_home_generators:0 "Installations génératrices"
    d_giga_birch_origin_home_generators_desc:0 "Des combustibles accessibles et des conditions favorables à la construction de centrales électriques."

    d_giga_birch_origin_home_machine_generators:0 "Champs de gaz"
    d_giga_birch_origin_home_machine_generators_desc:0 "D'abondants gisements de gaz offrent de nombreuses possibilités de production d'énergie."

    d_giga_birch_origin_home_labs:0 "Ruines anciennes"
    d_giga_birch_origin_home_labs_desc:0 "Étudiées de près par nos archéologues, ces ruines nous ont fourni nos premiers indices sur la véritable nature de la Structure."

