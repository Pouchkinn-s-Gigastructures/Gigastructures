    d_giga_birch_mechanics:99 "Systèmes centraux du Monde de Birch"
    d_giga_birch_mechanics_desc:99 "Des machines d'une sophistication stupéfiante parcourent chaque facette de cette colossale construction."
    d_giga_birch_mechanics_tooltip:99 "Ce modificateur planétaire gère de nombreuses fonctions de jeu du $name_birch$ et est nécessaire à son bon fonctionnement."

    # aiondia

    d_giga_aiondia_blocker_structure:99 "Salles de contrôle abandonnées"
    d_giga_aiondia_blocker_structure_desc:99 "§P$d_aeternum_decaying_hyperstructure$§!\n\nAu sein du palais au centre de §H$district_giga_birch_structure_aiondia_subtitle$§! se trouve une salle de contrôle d'une complexité si stupéfiante que nos experts n'ont absolument pas réussi à en comprendre le fonctionnement. Soit les systèmes contrôlant les opérations structurelles d'Aiondia sont à un niveau au-delà de notre compréhension, soit nous sommes victimes d'une farce vieille de plusieurs éons. Quelle qu'en soit la raison baroque, si nous voulons un jour étendre notre influence au-delà des mégacités, nous devrons déchiffrer les contrôles des systèmes de maintenance d'Aiondia."

    d_giga_aiondia_blocker_orykta:99 "Extracteurs mis en sommeil"
    d_giga_aiondia_blocker_orykta_desc:99 "§P$d_aeternum_decaying_hyperstructure$§!\n\nMême à l'apogée de l'âge d'or des Aeternites, Aiondia n'était jamais censée être alimentée uniquement par l'extraction de ses matières premières du trou noir en contrebas, les matrices d'extraction étant conçues comme une réserve de secours en cas d'urgence. Si nous souhaitons exploiter pleinement ces ressources, nous devrons activer ces systèmes et considérablement élargir leur portée."
    slot_giga_birch_orykta_insula_clear_blocker_prereq:99 "Nettoyer $d_giga_aiondia_blocker_orykta$"

    d_giga_aiondia_blocker_ktisma:99 "Oeuvres malformées"
    d_giga_aiondia_blocker_ktisma_desc:99 "§P$d_aeternum_decaying_hyperstructure$§!\n\nDes centaines de milliers d'années d'inactivité, ponctuées par des demandes de fabrication occasionnelles et excentriques, ont laissé les systèmes contrôlant les usines et fonderies des $district_giga_birch_ktisma_plural$ sans grand-chose sur quoi se concentrer. Avec le temps, cela a conduit au développement d'un pseudo-écosystème indiscipliné de machines autoréplicantes mutées. Si nous souhaitons utiliser ces installations, nous devrons créer de l'ordre à partir de ce chaos."
    slot_giga_birch_ktisma_insula_clear_blocker_prereq:99 "Nettoyer $d_giga_aiondia_blocker_ktisma$"

    d_giga_aiondia_blocker_physma:99 "Écologies effondrées"
    d_giga_aiondia_blocker_physma_desc:99 "§P$d_aeternum_decaying_hyperstructure$§!\n\nSans régulation appropriée, d'immenses étendues des $district_giga_birch_physma_plural$ ont succombé à l'effondrement écologique et ne sont guère plus que des friches stériles. Si nous souhaitons pleinement utiliser cette région, nous devons réparer les systèmes de contrôle environnemental qui la maintiennent."
    slot_giga_birch_physma_insula_clear_blocker_prereq:99 "Nettoyer $d_giga_aiondia_blocker_physma$"

    # origin insula stuff

    d_giga_birch_origin_home_insula:99 "Insula d'origine"
    d_giga_birch_origin_home_insula_desc:99 "Le berceau de la civilisation."

    d_giga_birch_origin_home_insula_restored:99 "Insula d'origine"
    d_giga_birch_origin_home_insula_restored_desc:99 "Autrefois berceau de la civilisation, cette région est aujourd'hui en grande partie dépeuplée et conservée comme réserve naturelle."

    d_giga_birch_origin_home_farms:99 "Champs dorés"
    d_giga_birch_origin_home_farms_desc:99 "Terres agricoles de premier choix, cette vallée riche et fertile a longtemps fourni des récoltes abondantes."

    d_giga_birch_origin_home_catalytic_farms:99 "Sols minéralisés"
    d_giga_birch_origin_home_catalytic_farms_desc:99 "En creusant des tunnels à la base de la Montagne sans fond, nous avons pu siphonner une partie de la boue qu'elle contient et étendre considérablement nos terres arables."

    d_giga_birch_origin_home_mines:99 "La Montagne sans fond"
    d_giga_birch_origin_home_mines_desc:99 "Les archives anciennes parlent d'une montagne s'élevant de la terre, regorgeant de richesses minérales inépuisables. L'analyse moderne suggère qu'elle provient d'un conduit rompu dans le système de pluie de limon de la Structure, la boue minérale poussant continuellement la surface vers le haut et se solidifiant au fil des années."

    d_giga_birch_origin_home_lithoid_mines:99 "Pièges à pluie de limon"
    d_giga_birch_origin_home_lithoid_mines_desc:99 "De vastes zones encadrées par des digues peu profondes nous permettent de concentrer la pluie de limon qui se drainerait partiellement vers d'autres régions. La réduction du réapprovisionnement des sols érodés en aval est considérée comme un compromis acceptable pour les minéraux supplémentaires que nous pouvons récolter."

    d_giga_birch_origin_home_generators:99 "Installations génératrices"
    d_giga_birch_origin_home_generators_desc:99 "Carburants accessibles et conditions favorables à la construction de centrales électriques."

    d_giga_birch_origin_home_machine_generators:99 "Champs de gaz"
    d_giga_birch_origin_home_machine_generators_desc:99 "D'abondants gisements de gaz offrent de nombreuses possibilités de production d'énergie."

    d_giga_birch_origin_home_labs:99 "Ruines anciennes"
    d_giga_birch_origin_home_labs_desc:99 "Étroitement étudiées par nos archéologues, ces ruines nous ont fourni les premiers indices sur la véritable nature de la Structure."

