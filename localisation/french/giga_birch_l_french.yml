l_french:

    name_birch:99 "Monde de Birch"
    allow_birch:99 "§HDébloque la mégastructure :§! $name_birch$"
    desc_birch:99 "Le Monde de Birch est un habitat véritablement titanesque construit autour d'un trou noir supermassif, capable d'abriter une quantité pratiquement infinie d'êtres vivants."
    allow_district_birch_orykta:99 "§HDébloque le district :§! $name_birch$ $district_giga_birch_orykta$"
    desc_district_birch_orykta:0  "Permet la construction de $district_giga_birch_orykta_plural$ sur le $name_birch$"
    allow_district_birch_ktisma:99 "§HDébloque le district :§! $name_birch$ $district_giga_birch_ktisma$"
    desc_district_birch_ktisma:0  "Permet la construction de $district_giga_birch_ktisma_plural$ sur le $name_birch$"
    allow_district_birch_physma:99 "§HDébloque le district :§! $name_birch$ $district_giga_birch_physma$"
    desc_district_birch_physma:0  "Permet la construction de $district_giga_birch_physma_plural$ sur le $name_birch$"

    pc_birch:99 "$name_birch$"
    pc_birch_desc:99 "Composé de centaines de couches concentriques disposées autour d'un trou noir supermassif, le $pc_birch$ est le plus grand exemple concevable de Monde-coque — une structure artificielle dotée de multiples coques solides autour d'une source gravitationnelle. Avec des billions de planètes en superficie utilisable, il peut accueillir une population effectivement illimitée."
    pc_birch_adj:99 "de Birch"

    pc_origin_birch:99 "$pc_birch$ décrépit"
    pc_origin_birch_desc:99 "$pc_birch_desc$\n\nCe $pc_birch$ particulier est dans un état de délabrement considérable, la plupart de ses systèmes étant actuellement hors ligne. La civilisation principale de ce monde vit sur un unique continent artificiel ou Insula, et accède à l'espace par une brèche dans la coque externe."
    pc_origin_birch_adj:99 "de Birch"

    pc_origin_dummy_birch:99 "$pc_origin_birch$"
    pc_origin_dummy_birch_desc:99 "$pc_origin_birch_desc$"
    pc_origin_dummy_birch_adj:99 "$pc_origin_birch_adj$"

    pc_giga_edge_of_eternity:99 "$pc_melted_frozen$"
    pc_giga_edge_of_eternity_desc:99 "Une planète recouverte d'océans de plusieurs kilomètres de profondeur. Des tempêtes planétaires font rage à la surface, et des vagues incroyablement hautes sont monnaie courante. L'environnement de cette planète serait trop tumultueux pour permettre la colonisation, sans un ancien complexe d'arcologie situé près du pôle sud."
    pc_giga_edge_of_eternity_adj:99 "$pc_melted_frozen_adj$"

    giga_birch_dummy_system:99 "Écho"
    giga_birch_dummy_system_star:99 "$giga_birch_dummy_system$"
    giga_birch_dummy_system_planet_1:99 "$giga_birch_dummy_system_star$ I"
    giga_birch_dummy_system_planet_2:99 "$giga_birch_dummy_system_star$ II"
    giga_birch_dummy_system_planet_3:99 "$giga_birch_dummy_system_star$ III"
    giga_birch_dummy_system_planet_3_moon_1:99 "$giga_birch_dummy_system_planet_3$a"
    giga_birch_dummy_system_planet_3_moon_2:99 "$giga_birch_dummy_system_planet_3$b"
    giga_birch_dummy_system_planet_3_moon_3:99 "$giga_birch_dummy_system_planet_3$c"

    giga_birch_origin_critters:99 "Gardiens antiques"
    giga_birch_origin_critters_fleet:99 "Veilleurs décrépits"
    giga_birch_origin_critters_ship:99 "Veilleur décrépit"

    giga_birch_start_NAME:99 "Coeur décrépit"
    giga_birch_start_DESC:99 "Commencer dans le noyau galactique avec un $pc_origin_birch$."

