    edict_giga_migrate_birch_world:99 "Monde de Birch : La Grande Migration"
    edict_giga_migrate_birch_world_desc:99 "Les vastes étendues du Monde de Birch offrent des opportunités illimitées. Nous devrions encourager nos Pops sans emploi à y vivre."
    edict_giga_migrate_birch_world_tooltip:99 "La réinstallation automatique sera §Ybien§! plus susceptible de choisir le Monde de Birch comme destination.\nDes postes supplémentaires seront laissés vacants pour encourager la migration."

    #####################
    ### Megastructure ###
    #####################

    giga_mega.402.name:99 "Le Coeur galactique"
    giga_mega.402.desc:99 "Depuis que notre espèce a atteint le vol spatial et s'est aventurée parmi les étoiles, un aspect de la géographie galactique a échappé aux astronomes comme aux physiciens : le coeur galactique. En effet, jusqu'à présent, ce coeur est resté totalement isolé du reste de la galaxie. Cependant, de nouvelles avancées dans les technologies de cartographie hyperespatiale ont conduit nos scientifiques à penser que le coeur pourrait être accessible via le réseau d'hyper-lignes, si nous parvenons à déterminer l'emplacement exact des points de brèche hyperespatiale affaiblis.\nUn projet spécial a été préparé pour localiser et exploiter ces points afin d'accéder au coeur galactique. Quelques hyper-lignes menant au coeur seront créées une fois le projet achevé ; nos scientifiques conseillent donc de ne lancer le projet qu'après s'être assuré que nos rivaux ne pourront pas les utiliser. Il est toutefois impossible de prédire où ces hyper-lignes aboutiront."
    giga_mega.402.a:99 "Bien reçu."

    giga_mega.403.name:99 "Hyper-lignes du coeur galactique localisées !"
    giga_mega.403.desc:99 "Excellente nouvelle ! Après d'intenses recherches et cartographies, nos scientifiques ont annoncé la découverte de points de brèche hyperespatiale menant à l'amas central ! Nos équipes de recherche ont utilisé un faisceau tachyonique longue portée pour ouvrir ces points à distance, créant ainsi de nouvelles hyper-lignes. Le coeur est désormais accessible (pour nous, mais aussi pour tous les autres), et nos chercheurs conseillent vivement d'y envoyer un vaisseau pour l'explorer."
    giga_mega.403.a:99 "Extraordinaire !"
    giga_mega.403.a.tooltip:99 "Le Coeur galactique est désormais accessible"

    giga_dialog.4101.name:99 "Supermassif"
    giga_dialog.4101.desc:99 "Après un voyage ardu, notre vaisseau scientifique a enfin atteint le centre de notre galaxie.\nEn entrant dans le système, l'équipage a été stupéfié par la vue d'un §YTrou noir supermassif inactif§! d'une taille absolument colossale.\n\nCet objet gargantuesque pèse plusieurs milliards de masses stellaires et possède un diamètre de plusieurs centaines d'unités astronomiques. Une planète océanique solitaire a également été repérée en orbite ; l'un des scientifiques a supposé qu'elle devait certainement connaître des vagues gigantesques en raison des immenses forces de marée du trou noir.\nBien que cela reste pour l'instant de la pure spéculation, certains éléments les plus audacieux de la communauté scientifique émettent la théorie qu'il serait possible de construire une sphère massive autour de ce trou noir, capable d'abriter des quadrillions d'êtres vivants."
    giga_dialog.4101.a:99 "Incroyable !"

    giga_dialog.4102.name:99 "Site de construction du $name_birch$ terminé !"
    giga_dialog.4102.desc:99 "Le site de construction d'un futur $name_birch$ est maintenant achevé autour du trou noir central de notre galaxie. Cet échafaudage servira de base de départ pour commencer la construction de la structure elle-même : une gigantesque coquille de superalliages située juste au-dessus de l'horizon des événements, là où la gravité est supportable."
    giga_dialog.4102.a:99 "Parfait."

    giga_dialog.4103.name:99 "Armature équatoriale du $name_birch$ terminée !"
    giga_dialog.4103.desc:99 "La première étape de la construction de notre $name_birch$ est achevée. Nous avons construit un anneau massif qui entoure l'équateur du trou noir et servira de base pour construire le reste de l'immense armature de la structure."
    giga_dialog.4103.a:99 "Merveilleux."

    giga_dialog.4104.name:99 "Armature du $name_birch$ terminée !"
    giga_dialog.4104.desc:99 "L'armature de notre $name_birch$ est entièrement achevée ! Un échafaudage massif entoure désormais le trou noir, et nous devons maintenant entamer la partie la plus difficile : construire la coquille massive elle-même. Ce sera une tâche longue et ardue, mais une fois terminée, nous aurons accès à un espace vital infini."
    giga_dialog.4104.a:99 "Nous approchons du but."

    giga_dialog.4105.name:99 "$name_birch$ terminé !"
    giga_dialog.4105.desc:99 "Aujourd'hui est un jour incroyable dans l'histoire galactique. En effet, après des décennies de travaux dangereux, nous avons achevé la construction d'un $name_birch$ absolument massif autour du coeur galactique. Cette coquille immense est actuellement déserte, mais son immense superficie signifie qu'elle peut effectivement abriter une quantité virtuellement infinie de personnes une fois colonisée. Avec ce projet achevé, nous avons définitivement atteint le sommet de l'ingénierie de l'habitat, et cette grande construction éclipse probablement toute autre mégastructure jamais construite dans l'histoire galactique !\n\n§YLe $name_birch$ gagnera automatiquement plus d'emplacements de districts à mesure que sa population augmentera, jusqu'à un nombre infini.§!\n\nNous disposons maintenant d'un édit pour lancer §YLa Grande Migration§! afin de peupler ce vaste monde."
    giga_dialog.4105.a:99 "Grandiose !"

    birch_world_0:99 "$gc_tera$Site de construction du $name_birch$"
    birch_world_0_DESC:99 "Le site de construction d'un futur $name_birch$, abritant le personnel et les infrastructures nécessaires pour commencer la construction d'une sphère massive autour d'un trou noir supermassif."
    birch_world_0_MEGASTRUCTURE_DETAILS:99 "$giga_list_category_terastructure$ - $giga_list_category_habitable_mega$\nConstruit un habitat autour d'un §YTrou noir supermassif§! avec des §YDistricts infinis§!\n§LUne coquille gigantesque construite autour d'un trou noir supermassif, pouvant abriter une population infinie. L'habitat ultime.§!" #megalistentry BIRCH WORLD
    birch_world_0_CONSTRUCTION_INFO_DELAYED:99 "$giga_list_additional_data$ - Le §YMonde de Birch§! gagnera §Y1 emplacement de district§! par tranche de §Y10000§! pops. Ses districts sont très puissants et fournissent une pléthore d'emplois. Si §YAncient Caches of Technologies§! est activé et que les §YSphères du vide§! sont débloquées, il peut être amélioré en §YSphère du vide de Birch§!, l'habitat le plus puissant qui existe"

    birch_world_1:99 "Armature équatoriale du $name_birch$"
    birch_world_1_DESC:99 "Cet anneau massif encercle l'équateur du trou noir et constitue la première étape vers l'achèvement de l'immense armature du $name_birch$."

    birch_world_2:99 "Armature du $name_birch$"
    birch_world_2_DESC:99 "L'armature d'un futur $name_birch$ construite autour d'un trou noir supermassif. Nous pouvons maintenant commencer la construction de la coquille du $name_birch$ elle-même."

    birch_world_3:99 "$name_birch$"
    birch_world_3_DESC:99 "Un $name_birch$ achevé, construit autour d'un trou noir supermassif. Ce n'est guère plus qu'une coquille de métal au-dessus de l'horizon des événements, mais il offre un espace vital quasi infini."

    ####################
    ### Technologies ###
    ####################

    giga_tech_birch_world_1:99 "Le $name_birch$"
    giga_tech_birch_world_1_desc:99 "Le $name_birch$ n'était qu'une construction artificielle théorique destinée aux habitations les plus expansives ; c'est maintenant une réalité. Construits autour des plus grands trous noirs, ces mondes-coquilles spacieux sont spécialement conçus pour être édifiés sur l'horizon des événements desdits trous noirs, niveau auquel la gravité de surface est comparable à celle de notre monde natal."

    giga_tech_birch_world_2:99 "Construction de Physma"
    giga_tech_birch_world_2_desc:99 "L'Insula Physma est une vaste terre dédiée aux choses de la nature. C'est le lieu de l'agriculture, de la recherche et des loisirs."

    giga_tech_birch_world_3:99 "Construction de Ktisma"
    giga_tech_birch_world_3_desc:99 "L'Insula Ktisma est une vaste terre dédiée aux choses de la création. C'est le lieu de l'habitation et de l'industrie."

    giga_tech_birch_world_4:99 "Construction d'Oryta"
    giga_tech_birch_world_4_desc:99 "Vivre sur un trou noir signifie que nous pouvons utiliser nos technologies de décompresseur et de matière noire pour extraire des ressources de sa surface."

