    zone_giga_birch_orykta_insula_energy_refinery_flavour:99 "Extracteurs à fusion gravitique"
    zone_giga_birch_orykta_insula_energy_refinery_flavour_desc:99 "Cette Insula héberge une connexion directe vers l'horizon des événements en contrebas, où d'immenses structures extraient l'énergie du $pc_core_black_hole$ et fusionnent la matière libérée en matériaux exotiques."

    zone_giga_birch_orykta_insula_energy_dark_matter_flavour:99 "Réseaux de collecte de particules"
    zone_giga_birch_orykta_insula_energy_dark_matter_flavour_desc:99 "Cette Insula héberge une connexion directe vers l'horizon des événements en contrebas, où d'immenses structures captent énergie et matière noire du $pc_core_black_hole$."

    zone_giga_birch_orykta_insula_energy_negative_mass_flavour:99 "Réseau de lentilles superradiantes"
