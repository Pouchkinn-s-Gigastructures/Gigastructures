    d_giga_birch_expedition_7:99 "Observatoire englouti"
    d_giga_birch_expedition_7_desc:99 "Une ancienne installation scientifique apparemment dédiée à l'étude des civilisations se développant sur la couche arctique."

    d_giga_birch_expedition_7_restored:99 "Observatoire englouti"
