    d_giga_birch_expedition_9_energy:99 "Appareil d'extraction — Priorité énergie"
    d_giga_birch_expedition_9_energy_desc:99 "Une immense structure suspendue au-dessus de l'horizon des événements du trou noir supermassif au coeur de la Structure. Les efforts de réparation récents se sont concentrés sur la production d'énergie."

    d_giga_birch_expedition_9_minerals:99 "Appareil d'extraction — Priorité minéraux"
    d_giga_birch_expedition_9_minerals_desc:99 "Une immense structure suspendue au-dessus de l'horizon des événements du trou noir supermassif au coeur de la Structure. Les efforts de réparation récents se sont concentrés sur l'extraction de minéraux."

    d_giga_birch_expedition_9_dark_matter:99 "Appareil d'extraction — Priorité matière noire"
    d_giga_birch_expedition_9_dark_matter_desc:99 "Une immense structure suspendue au-dessus de l'horizon des événements du trou noir supermassif au coeur de la Structure. Les efforts de réparation récents se sont concentrés sur l'extraction de matière noire utilisable."

    d_giga_birch_expedition_9_restored:99 "Appareil d'extraction"
    d_giga_birch_expedition_9_restored_desc:99 "D'immenses structures suspendues au-dessus de l'horizon des événements du trou noir supermassif au coeur de la Structure, fournissant à celle-ci des matières premières en quantité effectivement illimitée."

    # edge of eternity

    d_giga_birch_edge_of_eternity:99 "Complexe d'arcologies océaniques"
    d_giga_birch_edge_of_eternity_desc:99 "Une série d'immenses structures érigées depuis le fond océanique, offrant des conditions de vie habitables sur ce monde autrement entièrement recouvert d'eau."

    d_giga_birch_edge_of_eternity_ruins:99 "£blocker£ Infrastructure de surface défaillante"
    d_giga_birch_edge_of_eternity_ruins_desc:99 "Des siècles de conditions météorologiques difficiles sans entretien ont laissé ces plateformes dans un état de délabrement avancé."


    d_giga_birch_edge_of_eternity_farms:99 "Fermes marines"
    d_giga_birch_edge_of_eternity_farms_desc:99 "Des enclos étagés remplis d'algues marines comestibles et de la faune qui les accompagne."

    d_giga_birch_edge_of_eternity_farms_blocker:99 "£blocker£ Faune marine hostile"
