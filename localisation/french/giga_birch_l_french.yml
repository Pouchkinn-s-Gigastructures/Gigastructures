    zone_giga_birch_orykta_insula_refinery_dark_matter_flavour:0 "Transmutation non-baryonique"
    zone_giga_birch_orykta_insula_refinery_dark_matter_flavour_desc:0 "Cette Insula héberge une connexion directe à l'horizon des événements en contrebas, où d'immenses constructions fusionnent la matière extraite du $pc_core_black_hole$ en matériaux exotiques, capturant de la matière noire dans le processus."

