    d_giga_void_birch_mechanics:99 "Systèmes centraux du Birch du vide"
    d_giga_void_birch_mechanics_desc:99 "$d_giga_birch_mechanics_desc$"

    district_giga_birch_void_structure:99 "Opérations structurelles Alpha"
    district_giga_birch_void_structure_desc:99 "Les plus grands dirigeants de notre empire se rassemblent au sommet de cette merveilleuse construction, supervisant toutes les opérations."
    district_giga_birch_void_structure_plural:99 "$district_giga_birch_void_structure$"
    mod_district_giga_birch_void_structure_max:99 "Max $district_giga_birch_void_structure_plural$"

    district_giga_birch_void_orykta:99 "Opérations d'extraction Alpha"
    district_giga_birch_void_orykta_desc:99 "Nous exploiterons et explorerons ce gargantuesque trou noir, car nous avons été intronisés seigneurs du cosmos. L'horizon des événements et autres concepts primitifs ne sont plus une préoccupation pour nous."
    district_giga_birch_void_orykta_plural:99 "$district_giga_birch_void_orykta$"
    mod_district_giga_birch_void_orykta_max:99 "Max $district_giga_birch_void_orykta_plural$"

    district_giga_birch_void_ktisma:99 "Hypercomplexe Nidavellir Alpha"
    district_giga_birch_void_ktisma_desc:99 "Nous ne sommes plus limités par les contraintes de ressources physiques. Ce que nous voulons, nous l'obtiendrons."
    district_giga_birch_void_ktisma_plural:99 "Hypercomplexes Nidavellir Alpha"
    mod_district_giga_birch_void_ktisma_max:99 "Max $district_giga_birch_void_ktisma_plural$"

    district_giga_birch_void_physma:99 "Installation Matriochka Alpha"
    district_giga_birch_void_physma_desc:99 "Notre univers recèle encore bien des secrets, et il est de notre devoir d'en dévoiler les réponses. Nous devons toujours pousser notre civilisation vers l'avant, sous peine de stagner et de suivre les traces des Empires déchus."
    district_giga_birch_void_physma_plural:99 "Installations Matriochka Alpha"
    mod_district_giga_birch_void_physma_max:99 "Max $district_giga_birch_void_physma_plural$"

    vsbw.1.title:99 "C'est fait."
    vsbw.1.desc:99 "Après 20 ans de construction à l'échelle titanesque, c'est enfin achevé.\n[center_of_the_universe.GetName] a été transformé avec succès en une Sphère céleste du vide enveloppant l'intégralité de l'hyperstructure d'une année-lumière d'envergure.\n\nCertains qualifieront de folie ce projet qui a effectivement créé l'habitat le plus grand et le plus avancé jamais construit dans l'histoire galactique.\n\nMais ce ne sont que des sots, car nous préférons l'appeler par son vrai nom.\n\nL'Ambition."

    vsbw.1.a:99 "J'en ai mal aux yeux."

