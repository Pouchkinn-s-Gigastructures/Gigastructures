    vsbw_begin:0 "Une étendue infinie"
    vsbw_begin_desc:0 "Il est temps de transformer ce Monde Birch en l'habitat ultime. Il n'y aura pas de demi-mesures, toute sa surface sera améliorée avec les technologies les plus avancées connues de notre civilisation."
    pc_void_birch:0 "Sphère du vide Birch supermassive"
    pc_void_birch_desc:0 ""
    pc_void_birch_adj:0 ""
    mod_pc_void_birch_habitability:0 "Habitabilité Birch"
    trait_pc_void_birch_preference:0 "Préférence pour le Monde Birch"
