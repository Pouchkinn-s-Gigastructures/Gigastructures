    d_giga_birch_mechanics:99 "Systèmes centraux du Monde de Birch"
    d_giga_birch_mechanics_desc:99 "Des machines extraordinairement avancées traversent chaque facette de cette construction colossale."
    d_giga_birch_mechanics_tooltip:99 "Ce trait planétaire gère de nombreuses fonctions de jeu du $name_birch$ et est nécessaire à son bon fonctionnement."

    # aiondia

    d_giga_aiondia_blocker_structure:99 "Salles de contrôle abandonnées"
    d_giga_aiondia_blocker_structure_desc:99 "§P$d_aeternum_decaying_hyperstructure$§!\n\nAu sein du palais au centre de §H$district_giga_birch_structure_aiondia_subtitle$§!, il existe une salle de contrôle d'une complexité si stupéfiante que nos experts ont été totalement incapables d'en comprendre le fonctionnement. Soit les systèmes contrôlant les opérations structurelles d'Aiondia sont d'un niveau dépassant notre entendement, soit nous sommes victimes d'une plaisanterie millénaire. Quelle que soit la raison de leur nature baroque, si nous voulons un jour étendre notre influence au-delà des mégapoles, nous devrons déchiffrer les commandes des systèmes de maintenance d'Aiondia."

    d_giga_aiondia_blocker_orykta:99 "Extracteurs mis en réserve"
    d_giga_aiondia_blocker_orykta_desc:99 "§P$d_aeternum_decaying_hyperstructure$§!\n\nMême à l'apogée de l'âge d'or Aeternite, Aiondia n'était jamais censée être alimentée en tirant toutes ses matières premières du trou noir en contrebas, les réseaux d'extraction étant conçus comme une réserve de secours en cas d'urgence. Si nous souhaitons exploiter pleinement ces ressources, nous devrons mettre ces systèmes en ligne et considérablement élargir leur portée."
    slot_giga_birch_orykta_insula_clear_blocker_prereq:99 "Éliminer $d_giga_aiondia_blocker_orykta$"

    d_giga_aiondia_blocker_ktisma:99 "Oeuvres difformes"
    d_giga_aiondia_blocker_ktisma_desc:99 "§P$d_aeternum_decaying_hyperstructure$§!\n\nDes centaines de milliers d'années de mise en veille, ponctuées de demandes de fabrication occasionnelles et excentriques, ont laissé les systèmes contrôlant les usines et fonderies des $district_giga_birch_ktisma_plural$ avec peu de choses sur lesquelles se concentrer. Au fil du temps, cela a conduit au développement d'un pseudo-écosystème indiscipliné de machines autoréplicantes mutantes. Si nous souhaitons utiliser ces installations, nous devrons faire l'ordre à partir de ce chaos."
    slot_giga_birch_ktisma_insula_clear_blocker_prereq:99 "Éliminer $d_giga_aiondia_blocker_ktisma$"

    d_giga_aiondia_blocker_physma:99 "Écologies effondrées"
    d_giga_aiondia_blocker_physma_desc:99 "§P$d_aeternum_decaying_hyperstructure$§!\n\nSans régulation appropriée, d'immenses étendues des $district_giga_birch_physma_plural$ ont succombé à l'effondrement écologique et ne sont guère plus que des friches désolées. Si nous souhaitons exploiter pleinement cette région, nous devons réparer les systèmes de contrôle environnemental qui la maintiennent."
    slot_giga_birch_physma_insula_clear_blocker_prereq:99 "Éliminer $d_giga_aiondia_blocker_physma$"

    # origin insula stuff

    d_giga_birch_origin_home_insula:99 "Insula d'origine"
    d_giga_birch_origin_home_insula_desc:99 "Le berceau de la civilisation."

    d_giga_birch_origin_home_insula_restored:99 "Insula d'origine"
    d_giga_birch_origin_home_insula_restored_desc:99 "Jadis berceau de la civilisation, cette région est aujourd'hui en grande partie dépeuplée et conservée comme réserve naturelle."

    d_giga_birch_origin_home_farms:99 "Champs d'or"
    d_giga_birch_origin_home_farms_desc:99 "Terres agricoles de premier choix, cette vallée riche et fertile fournit depuis longtemps des récoltes abondantes."

    d_giga_birch_origin_home_catalytic_farms:99 "Sols minéralisés"
    d_giga_birch_origin_home_catalytic_farms_desc:99 "Des tunnels creusés à la base de la Montagne sans fond nous ont permis de siphonner une partie de la boue qu'elle contient et d'étendre considérablement nos terres arables totales."

    d_giga_birch_origin_home_mines:99 "La Montagne sans fond"
    d_giga_birch_origin_home_mines_desc:99 "D'anciens registres parlent d'une montagne surgissant de la terre, regorgeant de richesses minérales inépuisables. L'analyse moderne suggère qu'elle provient d'un conduit rompu dans le système de pluie de limon de la Structure, avec de la boue minérale poussant continuellement la surface vers le haut et durcissant au fil des ans."

    d_giga_birch_origin_home_lithoid_mines:99 "Pièges à pluie de limon"
    d_giga_birch_origin_home_lithoid_mines_desc:99 "De vastes zones encerclées par des digues peu profondes nous permettent de concentrer la pluie de limon qui s'écoulerait partiellement vers d'autres régions. La réduction du réapprovisionnement des sols érodés en aval est considérée comme un compromis acceptable pour les minéraux supplémentaires que nous pouvons collecter."

    d_giga_birch_origin_home_generators:99 "Installations génératrices"
    d_giga_birch_origin_home_generators_desc:99 "Des combustibles accessibles et des conditions favorables à la construction de centrales électriques."

    d_giga_birch_origin_home_machine_generators:99 "Champs de gaz"
    d_giga_birch_origin_home_machine_generators_desc:99 "D'abondants gisements de gaz offrent d'amples possibilités de génération d'énergie."

    d_giga_birch_origin_home_labs:99 "Ruines anciennes"
    d_giga_birch_origin_home_labs_desc:99 "Étroitement étudiées par nos archéologues, ces ruines ont fourni nos premiers indices sur la véritable nature de la Structure."

