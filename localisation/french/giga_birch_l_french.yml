    zone_giga_birch_orykta_insula_energy_flavour_desc:0 "Cette Insula héberge une connexion augmentée à l'horizon des événements en contrebas, où des réseaux de collecteurs améliorés extraient d'énormes quantités d'énergie du $pc_core_black_hole$."

    zone_giga_birch_orykta_insula_energy_minerals_flavour:0 "Extraction masse-énergie"
    zone_giga_birch_orykta_insula_energy_minerals_flavour_desc:0 "Cette Insula héberge une connexion augmentée à l'horizon des événements en contrebas, où d'immenses constructions extraient matière et énergie du $pc_core_black_hole$ à un rythme prodigieux."

    zone_giga_birch_orykta_insula_energy_refinery_flavour:0 "Extracteurs à fusion gravitique"
    zone_giga_birch_orykta_insula_energy_refinery_flavour_desc:0 "Cette Insula héberge une connexion directe à l'horizon des événements en contrebas, où d'immenses constructions extraient de l'énergie du $pc_core_black_hole$ et fusionnent la matière libérée en matériaux exotiques."

    zone_giga_birch_orykta_insula_energy_dark_matter_flavour:0 "Réseaux de collecte de particules"
    zone_giga_birch_orykta_insula_energy_dark_matter_flavour_desc:0 "Cette Insula héberge une connexion directe à l'horizon des événements en contrebas, où d'immenses constructions capturent énergie et matière noire du $pc_core_black_hole$."

    zone_giga_birch_orykta_insula_energy_negative_mass_flavour:0 "Réseau de lentilles superradiantes"
    zone_giga_birch_orykta_insula_energy_negative_mass_flavour_desc:0 "Cette Insula héberge une connexion directe à l'horizon des événements en contrebas, où d'immenses constructions collectent de l'énergie du $pc_core_black_hole$ et la focalisent dans des convertisseurs de $giga_sr_negative_mass$."

