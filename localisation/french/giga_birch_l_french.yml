    zone_giga_birch_orykta_insula_energy:0 "Focalisation génératrice"
    zone_giga_birch_orykta_insula_energy_desc:0 "Des conduits de plasma et des lignes de transmission supraconductrices traversent la superstructure blindée, puisant dans la fureur silencieuse au coeur du $name_birch$."
    zone_giga_birch_orykta_insula_energy_effect:0 "£job_giga_birch_orykta_manager£ §Y$job_giga_birch_orykta_manager_plural$§! $giga_birch_manager_replace$ §Y$job_giga_birch_orykta_manager_energy_plural$§!\n\n$job_giga_birch_orykta_manager_energy_effect_desc$"
