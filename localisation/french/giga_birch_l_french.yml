    vsbw_begin:99 "Une étendue infinie"
    vsbw_begin_desc:99 "Il est temps de transformer ce Monde de Birch en l'habitat ultime. Il n'y aura pas de demi-mesures : toute sa surface sera améliorée avec les technologies les plus avancées connues de notre civilisation."
    pc_void_birch:99 "Sphère du vide supermassive de Birch"
