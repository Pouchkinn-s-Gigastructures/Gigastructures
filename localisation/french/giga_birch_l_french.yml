    zone_giga_birch_orykta_insula_minerals:0 "Focalisation minière"
    zone_giga_birch_orykta_insula_minerals_desc:0 "Des canaux de transport élargis et d'immenses installations de traitement, transformant la matière brute récupérée du $pc_core_black_hole$ en fondations de la civilisation."
    zone_giga_birch_orykta_insula_minerals_effect:0 "£job_giga_birch_orykta_manager£ §Y$job_giga_birch_orykta_manager_plural$§! $giga_birch_manager_replace$ §Y$job_giga_birch_orykta_manager_minerals_plural$§!\n\n$job_giga_birch_orykta_manager_minerals_effect_desc$"
