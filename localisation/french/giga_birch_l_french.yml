    vsbw_begin:99 "Une Étendue infinie"
    vsbw_begin_desc:99 "Il est temps de transformer ce Monde de Birch en l'habitat ultime. Il n'y aura pas de demi-mesure ; toute sa surface sera améliorée avec les technologies les plus avancées connues de notre civilisation."
    pc_void_birch:99 "Sphère du vide de Birch supermassive"
    pc_void_birch_desc:99 ""
    pc_void_birch_adj:99 ""
    mod_pc_void_birch_habitability:99 "Habitabilité de Birch"
    trait_pc_void_birch_preference:99 "Préférence pour le Monde de Birch"
    trait_pc_void_birch_preference_desc:99 "L'habitat ultime pour notre population. Légendaire dans tous les sens du terme."
    sc_void_birch_built:99 "$pc_void_birch$"

    d_giga_void_birch_mechanics:99 "Systèmes centraux du Birch du vide"
    d_giga_void_birch_mechanics_desc:99 "$d_giga_birch_mechanics_desc$"

    district_giga_birch_void_structure:99 "Opérations structurelles Alpha"
    district_giga_birch_void_structure_desc:99 "Les plus grands dirigeants de notre empire se réunissent au sommet de cette merveilleuse construction, supervisant toutes les opérations."
    district_giga_birch_void_structure_plural:99 "$district_giga_birch_void_structure$"
    mod_district_giga_birch_void_structure_max:99 "Max $district_giga_birch_void_structure_plural$"

    district_giga_birch_void_orykta:99 "Opérations d'extraction Alpha"
    district_giga_birch_void_orykta_desc:99 "Nous exploiterons et explorerons ce trou noir gargantuesque, car nous avons été intronisés seigneurs du cosmos. L'horizon des événements et autres concepts primitifs ne sont plus une préoccupation pour nous."
    district_giga_birch_void_orykta_plural:99 "$district_giga_birch_void_orykta$"
    mod_district_giga_birch_void_orykta_max:99 "Max $district_giga_birch_void_orykta_plural$"

    district_giga_birch_void_ktisma:99 "Hypercomplexe Nidavellir Alpha"
    district_giga_birch_void_ktisma_desc:99 "Nous ne sommes plus limités par les contraintes de ressources physiques. Ce que nous voulons, nous l'obtiendrons."
    district_giga_birch_void_ktisma_plural:99 "Hypercomplexes Nidavellir Alpha"
    mod_district_giga_birch_void_ktisma_max:99 "Max $district_giga_birch_void_ktisma_plural$"

    district_giga_birch_void_physma:99 "Installation Matriochka Alpha"
    district_giga_birch_void_physma_desc:99 "Notre univers recèle encore de nombreux secrets, et il est de notre devoir d'en dévoiler les réponses. Nous devons toujours faire avancer notre civilisation, sous peine de stagner et de suivre les traces des Empires déchus."
    district_giga_birch_void_physma_plural:99 "Installations Matriochka Alpha"
    mod_district_giga_birch_void_physma_max:99 "Max $district_giga_birch_void_physma_plural$"

    vsbw.1.title:99 "C'est fait."
    vsbw.1.desc:99 "Après 20 ans de construction ardue à l'échelle gigantesque, c'est enfin terminé.\n[center_of_the_universe.GetName] a été transformé avec succès en une Sphère du vide céleste englobant l'intégralité de l'hyperstructure s'étendant sur une année-lumière.\n\nCertains pourraient qualifier ce projet, qui a effectivement créé l'habitat le plus grand et le plus avancé jamais construit dans l'histoire galactique, de folie.\n\nMais ce sont de simples imbéciles, car nous préférons l'appeler par son vrai nom.\n\nAmbition."

    vsbw.1.a:99 "J'ai mal aux yeux."

