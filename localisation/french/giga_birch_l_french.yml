    d_giga_void_birch_mechanics:0 "Systèmes centraux du Birch du vide"
    d_giga_void_birch_mechanics_desc:0 "$d_giga_birch_mechanics_desc$"

    district_giga_birch_void_structure:0 "Opérations structurelles Alpha"
    district_giga_birch_void_structure_desc:0 "Les plus grands dirigeants de notre empire se réunissent au sommet de cette construction merveilleuse, supervisant toutes les opérations."
    district_giga_birch_void_structure_plural:0 "$district_giga_birch_void_structure$"
    mod_district_giga_birch_void_structure_max:0 "Max $district_giga_birch_void_structure_plural$"

    district_giga_birch_void_orykta:0 "Opérations d'extraction Alpha"
    district_giga_birch_void_orykta_desc:0 "Nous exploiterons et explorerons ce trou noir gargantuesque, car nous avons été intronisés comme les seigneurs du cosmos. L'horizon des événements et autres concepts primitifs ne sont plus une préoccupation pour nous."
    district_giga_birch_void_orykta_plural:0 "$district_giga_birch_void_orykta$"
    mod_district_giga_birch_void_orykta_max:0 "Max $district_giga_birch_void_orykta_plural$"

    district_giga_birch_void_ktisma:0 "Hypercomplexe Nidavellir Alpha"
    district_giga_birch_void_ktisma_desc:0 "Nous ne sommes plus liés par les contraintes de ressources physiques. Ce que nous voulons, nous l'obtiendrons."
    district_giga_birch_void_ktisma_plural:0 "Hypercomplexes Nidavellir Alpha"
    mod_district_giga_birch_void_ktisma_max:0 "Max $district_giga_birch_void_ktisma_plural$"

    district_giga_birch_void_physma:0 "Installation Matriochka Alpha"
    district_giga_birch_void_physma_desc:0 "Notre univers recèle encore de nombreux secrets, et c'est notre devoir d'en dévoiler les réponses. Nous devons toujours pousser notre civilisation en avant, de peur de stagner et de suivre les traces des Empires déchus."
    district_giga_birch_void_physma_plural:0 "Installations Matriochka Alpha"
    mod_district_giga_birch_void_physma_max:0 "Max $district_giga_birch_void_physma_plural$"

    vsbw.1.title:0 "C'est fait."
    vsbw.1.desc:0 "Après 20 ans de construction gigantesque ardue, c'est enfin terminé.\n[center_of_the_universe.GetName] a été transformé avec succès en une Sphère du vide céleste englobant l'intégralité de l'hyperstructure s'étendant sur des années-lumière.\n\nCertains qualifieraient ce projet, qui a effectivement créé l'habitat le plus grand et le plus avancé jamais construit dans l'histoire galactique, de folie.\n\nMais ce ne sont que des imbéciles, car nous préférons l'appeler par ce qu'il est vraiment.\n\nL'ambition."

    vsbw.1.a:0 "J'ai mal aux yeux."

