    d_giga_birch_expedition_4:99 "Complexe industriel ancien"
    d_giga_birch_expedition_4_desc:99 "Les autoforges anciennes rugissent à nouveau de flammes, élargissant considérablement nos capacités industrielles."

    d_giga_birch_expedition_4_restored:99 "Complexe industriel restauré"
    d_giga_birch_expedition_4_restored_desc:99 "Les autoforges anciennes restaurées dans leur ancienne gloire, produisant un flux ininterrompu de matériaux."


    d_giga_birch_expedition_5:99 "Centre de contrôle régional"
