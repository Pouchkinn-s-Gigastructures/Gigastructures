    origin_birch:99 "Monde de Birch décrépit"
    origin_birch_desc:99 "La vision du monde de cette civilisation a volé en éclats quand un impact massif d'astéroïde a percé un trou dans leur ciel. Réalisant que leur monde est une vaste et ancienne mégastructure, ils se sont tournés vers l'intérieur à la recherche d'un moyen de sauver leur foyer en décrépitude."
    origin_birch_effects:99 "- Commence avec un §H$pc_origin_birch$§! dans le §HCoeur galactique§! comme monde natal.\n- Le §HCoeur galactique§! commence ouvert à la galaxie.\n- Commence avec la Situation §H« $giga_situation_birch_origin$ »§!.\n- Accès à des §H$district_giga_origin_birch_lab_plural$§! uniques sur votre monde natal, améliorables par l'§HExploration§!.\n- Débloquez de puissants modificateurs pour votre monde natal grâce à l'§HExploration§!.\n- Le §H$pc_origin_birch$§! peut être réparé, débloquant des districts §HInsula§! et §HSecteur§! spéciaux du §H$pc_birch$§!.\n- Préférence d'habitabilité définie sur §H$trait_pc_birch_preference$§!, rendant la colonisation de la plupart des planètes beaucoup plus difficile.\n- Une planète proche pourrait détenir la clé d'une colonisation plus poussée.\n\n§RPlusieurs joueurs ne peuvent pas utiliser cette Origine. Tout empire avec cette origine après le premier sera généré avec $origin_default$ à la place.§!"

    #giga_birch_start_dialog:99 "We do not know what happened to our ancestors. Enemies, plague, civil war? They exist now as myths and legends, their knowledge and power lost. They somehow built this vast world around the black hole at the centre of our galaxy, now we live in the vast, echoing expanse designed to house a million times more people than are left.\nAs all but the last sections have fallen into disrepair and uselessness our people have been filled with a new sense of purpose: we must unite and take our place against in the stars, or we will be lost forever to history.\n\nOur first order of business will be to appoint a governor. Then we need to make sure we are working the right jobs:\n"

    #giga_start_screen_birch:99 "$giga_birch_start_dialog$We need a §Y$job_structure_manager$§! to stop the place falling to ruins.\n\nWe may have to make some people redundant from their preferred job to make that happen."

    #giga_start_screen_birch_hive:99 "$giga_birch_start_dialog$We need a §Y$job_structure_process$§! to stop the place falling to ruins."

    #giga_start_screen_birch_machine:99 "$giga_birch_start_dialog$We need a §Y$job_structure_process$§! to stop the place falling to ruins."

    giga_start_screen_birch:99 "Nous savons peu de choses de notre passé ancien. Jusqu'à il y a quelques siècles, nous pensions que [GetHomeWorldName] était tout ce qui existait — une barrière impénétrable sous nos pieds, une autre maintenue à un millier de kilomètres au-dessus par de grandes flèches, et les étoiles roulantes traçant un chemin dans le ciel pour marquer le jour et la nuit.\n\nUn impact massif d'astéroïde a pulvérisé nos certitudes en perçant un trou droit à travers la barrière supérieure, nous révélant l'univers extérieur. En utilisant la flèche la plus proche comme support, nous avons construit une tour pour atteindre la brèche et fait nos premiers pas hésitants dans la galaxie élargie.\n\nLes anciens spatioports et cales sèches que nous avons trouvés sur la surface extérieure ont tout changé. Alors que nos premiers vaisseaux spatiaux voyageaient vers l'extérieur, nous avons réalisé que notre foyer n'était pas naturel. C'était plutôt une sphère artificielle colossale, manifestement en état de délabrement.\n\nN'ayant trouvé aucune autre réponse au-dessus, nous planifions maintenant une grande expédition pour chercher un passage vers les couches théoriques en dessous."

    giga_birch.title:99 "Hyper-lignes du coeur découvertes"
    giga_birch.desc:99 "Nous avons réussi à faire fonctionner correctement les capteurs et avons découvert que nous ne sommes pas seuls au centre de la galaxie. Il existe un petit nombre de systèmes qui ont été attirés plus près que l'anneau galactique principal par la gravité du trou noir.\n\nActuellement, il ne semble y avoir aucune connexion avec le reste de la galaxie. D'après notre traduction de fragments de journaux, nous pensons que la gravité du trou noir interfère avec les connexions entre les systèmes intérieurs et les systèmes normaux, et que toute hyper-ligne entre eux s'affaiblirait et s'estomperait sans voyage.\n\nNous avons lancé un §Yprojet spécial§! pour les localiser et les ouvrir"

    giga_birch.003.name:99 "Le Coeur galactique connecté à la galaxie"
    giga_birch.003.desc:99 "Avec une surtension détectable sur tous nos instruments, des hyper-lignes se sont ouvertes entre le Coeur galactique et le reste de la galaxie.\n\nNous pouvons partir. Mais que trouverons-nous en nous attendant ?"
    giga_birch.003.desc2:99 "Avec une surtension détectable sur tous nos instruments, des hyper-lignes se sont ouvertes entre le Coeur galactique et le reste de la galaxie.\n\nCe n'est pas nous qui avons causé cela, nous en sommes certains ! La galaxie arrive."

    decision_giga_origin_birch_restore:99 "Restaurer le $pc_birch$"
    decision_giga_origin_birch_restore_desc:99 "Nous sommes enfin capables de restaurer notre foyer dans sa gloire originelle."
    decision_giga_origin_birch_restore_tooltip:99 "Les caractéristiques planétaires et les districts existants seront remplacés."

    giga_birch_origin_motivated_explorers:99 "Explorateurs inspirés"
    giga_birch_origin_motivated_explorers_desc:99 "§LGrâce aux informations nouvellement découvertes, nos explorateurs sont plus compétents que jamais.§!"
    giga_birch_origin_motivated_explorers_effect:99 "Progression mensuelle de la situation d'exploration : §G+25 %§!"

