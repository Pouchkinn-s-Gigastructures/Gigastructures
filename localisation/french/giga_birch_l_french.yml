    edict_giga_migrate_birch_world:99 "Monde de Birch : la Grande Migration"
    edict_giga_migrate_birch_world_desc:99 "Les vastes étendues du Monde de Birch offrent des opportunités illimitées. Nous devrions encourager nos pops sans emploi à y vivre plutôt."
    edict_giga_migrate_birch_world_tooltip:99 "La réinstallation automatique sera §Ybien plus§! susceptible de choisir le Monde de Birch comme destination.\nDes emplois supplémentaires resteront vacants pour encourager la migration."

    #####################
    ### Megastructure ###
    #####################

    giga_mega.402.name:99 "Le coeur galactique"
    giga_mega.402.desc:99 "Depuis que notre espèce a atteint le vol spatial et s'est aventurée parmi les étoiles, un aspect de la géographie galactique a échappé aux astronomes comme aux physiciens : le coeur galactique. En effet, jusqu'à présent, le coeur était totalement isolé du reste de la galaxie. Cependant, de nouvelles avancées dans les technologies de cartographie hyperspaciale ont conduit nos scientifiques à croire que le coeur pourrait en réalité être accessible via le réseau d'hyper-lignes, si nous parvenons à déterminer l'emplacement exact des faibles points de brèche hyperspaciale.\nUn projet spécial a été préparé pour trouver et exploiter ces points afin d'accéder au coeur galactique. Quelques hyper-lignes menant au coeur seront créées à l'achèvement, aussi nos scientifiques conseillent-ils de lancer le projet après nous être assurés que nos rivaux ne pourront pas les utiliser. Il n'y a cependant aucun moyen de prédire où les hyper-lignes aboutiront."
    giga_mega.402.a:99 "Compris."

    giga_mega.403.name:99 "Hyper-lignes du coeur galactique localisées !"
    giga_mega.403.desc:99 "Excellente nouvelle ! Après d'intenses recherches et travaux de cartographie, nos scientifiques ont annoncé la découverte de points de brèche hyperspaciale menant à l'amas central ! Nos équipes de recherche ont utilisé un faisceau tachyonique à longue portée pour ouvrir ces points de brèche à distance, créant ainsi de nouvelles hyper-lignes. Cela signifie que le coeur est désormais accessible (pour nous, et pour tous les autres également), et nos chercheurs recommandent vivement d'envoyer un vaisseau pour l'explorer."
    giga_mega.403.a:99 "Extraordinaire !"
    giga_mega.403.a.tooltip:99 "Le coeur galactique est désormais accessible"

    giga_dialog.4101.name:99 "Supermassif"
    giga_dialog.4101.desc:99 "Après un voyage ardu, notre vaisseau scientifique a enfin atteint le centre de notre galaxie.\nEn pénétrant dans le système, l'équipage a été stupéfait par la vue d'un §YTrou noir supermassif inactif§! absolument colossal.\n\nCet objet gargantuesque pèse plusieurs milliards de masses stellaires et a un diamètre de plusieurs centaines d'unités astronomiques. Une planète océanique solitaire a également été repérée en orbite autour de lui, et l'un des scientifiques a supposé qu'elle devait certainement avoir des vagues gigantesques en raison des immenses forces de marée du trou noir.\nBien que ce ne soit pour l'instant que de la spéculation, certains des esprits les plus audacieux de la communauté scientifique théorisent qu'il serait possible de construire une sphère massive autour de ce trou noir, qui pourrait être habitée par des quadrillions d'êtres vivants."
    giga_dialog.4101.a:99 "Incroyable !"

    giga_dialog.4102.name:99 "Site de construction du $name_birch$ achevé !"
    giga_dialog.4102.desc:99 "Le site de construction d'un futur $name_birch$ est maintenant achevé autour du trou noir central de notre galaxie. Cet échafaudage servira de base d'opérations pour commencer à construire la structure elle-même, qui sera une coque géante de superalliages juste au-dessus de l'horizon des événements, là où la gravité est supportable."
    giga_dialog.4102.a:99 "Parfait."

    giga_dialog.4103.name:99 "Cadre équatorial du $name_birch$ achevé !"
    giga_dialog.4103.desc:99 "La première étape de la construction de notre $name_birch$ est terminée. Nous avons construit un anneau massif qui entoure l'équateur du trou noir et servira de base pour construire le reste du cadre massif de la structure."
    giga_dialog.4103.a:99 "Merveilleux."

    giga_dialog.4104.name:99 "Cadre du $name_birch$ achevé !"
    giga_dialog.4104.desc:99 "Le cadre de notre $name_birch$ est entièrement terminé ! Un échafaudage massif entoure maintenant le trou noir, et nous devons désormais commencer la partie la plus difficile : construire la coque massive elle-même. Ce sera une tâche longue et ardue, mais une fois achevée, nous aurons accès à un espace de vie infini."
    giga_dialog.4104.a:99 "Nous approchons du but."

    giga_dialog.4105.name:99 "$name_birch$ achevé !"
    giga_dialog.4105.desc:99 "Aujourd'hui est un jour incroyable dans l'histoire galactique. En effet, après des décennies de travaux dangereux, nous avons maintenant achevé la construction d'un $name_birch$ absolument massif autour du coeur galactique. Cette coque massive est actuellement déserte, mais son immense superficie signifie qu'elle peut effectivement accueillir une quantité virtuellement infinie de personnes une fois colonisée. Avec ce projet achevé, nous avons définitivement atteint le sommet de l'ingénierie d'habitat, et cette grandiose construction éclipse probablement toutes les autres mégastructures jamais construites dans l'histoire galactique !\n\n§YLe $name_birch$ gagnera automatiquement plus d'emplacements de districts à mesure que sa population augmentera, jusqu'à un nombre infini.§!\n\nNous avons maintenant un édit disponible pour lancer §YLa Grande Migration§! afin de peupler ce vaste monde."
    giga_dialog.4105.a:99 "Grandiose !"

    birch_world_0:99 "$gc_tera$Site de construction du $name_birch$"
    birch_world_0_DESC:99 "Le site de construction d'un futur $name_birch$, abritant le personnel et l'infrastructure nécessaires pour commencer à construire une sphère massive autour d'un trou noir supermassif."
    birch_world_0_MEGASTRUCTURE_DETAILS:99 "$giga_list_category_terastructure$ - $giga_list_category_habitable_mega$\nConstruit un habitat autour d'un §YTrou noir supermassif§! avec des §YDistricts infinis§!\n§LUne coque gigantesque construite autour d'un trou noir supermassif, pouvant accueillir une population infinie. L'habitat ultime.§!" #megalistentry BIRCH WORLD
    birch_world_0_CONSTRUCTION_INFO_DELAYED:99 "$giga_list_additional_data$ — Le §YMonde de Birch§! gagnera §Y1 emplacement de district§! par §Y10 000§! pops. Ses districts sont très puissants et fournissent une pléthore d'emplois. Si §YAncient Caches of Technologies§! est activé et que les §YSphères du vide§! sont débloquées, il peut être amélioré en §YSphère du vide Monde de Birch§!, l'habitat le plus puissant qui soit"

    birch_world_1:99 "Cadre équatorial du $name_birch$"
    birch_world_1_DESC:99 "Cet anneau massif encercle l'équateur du trou noir et constitue la première étape vers l'achèvement du cadre massif du $name_birch$."

    birch_world_2:99 "Cadre du $name_birch$"
    birch_world_2_DESC:99 "Le cadre d'un futur $name_birch$ construit autour d'un trou noir supermassif. Nous pouvons maintenant commencer à construire la coque du $name_birch$ elle-même."

    birch_world_3:99 "$name_birch$"
    birch_world_3_DESC:99 "Un $name_birch$ achevé construit autour d'un trou noir supermassif. Ce n'est guère plus qu'une coque métallique au-dessus de l'horizon des événements, mais il offre un espace de vie quasi infini."

    ####################
    ### Technologies ###
    ####################

    giga_tech_birch_world_1:99 "Le $name_birch$"
    giga_tech_birch_world_1_desc:99 "Le $name_birch$ n'était qu'une construction artificielle théorique destinée aux habitations les plus vastes ; c'est maintenant une réalité. Construit autour des plus grands trous noirs, ces mondes-coques spacieux sont spécialement conçus pour être édifiés sur l'horizon des événements desdits trous noirs, niveau auquel la gravité de surface est comparable à celle de notre monde natal."

    giga_tech_birch_world_2:99 "Construction Physma"
    giga_tech_birch_world_2_desc:99 "L'Insula Physma est une vaste terre dédiée aux choses de la nature. C'est le lieu de l'agriculture, de la recherche et des loisirs."

    giga_tech_birch_world_3:99 "Construction Ktisma"
    giga_tech_birch_world_3_desc:99 "L'Insula Ktisma est une vaste terre dédiée aux choses de la création. C'est le lieu de l'habitation et de l'industrie."

    giga_tech_birch_world_4:99 "Construction Orykta"
    giga_tech_birch_world_4_desc:99 "Vivre sur un trou noir signifie que nous pouvons utiliser nos technologies de décompresseur et de matière noire pour extraire des ressources de sa surface."

