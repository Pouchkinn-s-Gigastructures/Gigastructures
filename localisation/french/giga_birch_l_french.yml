    giga_situation_birch_expedition_9_approach_choose_desc:99 "Prêt à partir, mais sans direction."

    giga_situation_birch_expedition_9_approach_energy:99 "Étendre la collecte d'énergie"
    giga_situation_birch_expedition_9_approach_energy_tooltip:99 "Une fois achevé, le réseau d'extraction se concentrera sur la collecte d'£energy£ §Y$energy$§!.\n "
    giga_situation_birch_expedition_9_approach_energy_desc:99 "En nous concentrant sur l'expansion des capacités de collecte de particules énergétiques du réseau d'extraction, nous pouvons augmenter notre production d'énergie."

    giga_situation_birch_expedition_9_approach_minerals:99 "Foreuse de minéraux ciblée"
    giga_situation_birch_expedition_9_approach_minerals_tooltip:99 "Une fois achevé, le réseau d'extraction se concentrera sur la collecte de £minerals£ §Y$minerals$§!.\n "
    giga_situation_birch_expedition_9_approach_minerals_desc:99 "Garder la conception de la foreuse gravitationnelle concentrée sur l'extraction minérale nous donnera un flux plus important de matières premières."

    giga_situation_birch_expedition_9_approach_dark_matter:99 "Siphon de matière noire"
    giga_situation_birch_expedition_9_approach_dark_matter_tooltip:99 "Une fois achevé, le réseau d'extraction se concentrera sur la collecte de £sr_dark_matter£ §Y$sr_dark_matter$§!.\n "
    giga_situation_birch_expedition_9_approach_dark_matter_desc:99 "La foreuse gravitationnelle pourrait être modifiée pour extraire de grandes quantités de matière noire directement du trou noir."

    #########################################
    ### General Events ######################
    #########################################

    # birch lost somehow
    giga_birch.101:99 "Monde de Birch perdu !"
    giga_birch.101.desc:99 "La Structure nous a été arrachée. Chassés de notre foyer, nos efforts d'exploration ne peuvent pas continuer."
    giga_birch.101.a:99 "Nous reprendrons notre foyer à tout prix."

    # birch planet-killed
    giga_birch.103:99 "[this.GetName] anéanti !"
    giga_birch.103.desc:99 "La Structure a été fracassée, ses fragments de coquilles basculant dans le vide ou engloutis par le trou noir en son sein. Notre foyer est détruit, et tout espoir de le réparer s'est envolé avec lui. Nous sommes sans but."
    giga_birch.103.a:99 "Une perte incommensurable."

    # birch reclaimed
    giga_birch.105:99 "[this.GetName] repris !"
    giga_birch.105.desc:99 "La Structure a été reprise ! Une grande partie de notre patrie gît en ruines, mais nous pouvons reconstruire. Maintenant que nous avons repris le contrôle, nos efforts d'exploration peuvent reprendre."
    giga_birch.105.a:99 "Notre foyer est à nouveau en sécurité."

    #########################################
    ### Edge of Eternity Dig Site ###########
    #########################################

    giga_birch.800:99 "Une investigation plus approfondie"
    giga_birch.800.desc:99 "Un an s'est écoulé depuis l'achèvement officiel de nos efforts de colonisation sur [from.planet.GetName], et nos colons se sont familiarisés avec l'ancien complexe d'arcologies qui les abrite des tempêtes et des courants dangereux qui déferlent sur la surface de la planète. De nombreuses questions sur ces immenses structures océaniques restent sans réponse, et le potentiel de découverte scientifique est élevé.\n\nUn site sur l'une des plateformes centrales a été dégagé et préparé pour une investigation plus poussée."
    giga_birch.800.a:99 "Nous pourrions apprendre beaucoup ici."

    site_giga_birch_origin_edge_of_eternity:99 "Arcologies océaniques anciennes"
    site_giga_birch_origin_edge_of_eternity_intro:99 "Les anciennes arcologies sur [planet.GetName] sont tout ce qui sépare nos colons des mers furieuses. Comment et pourquoi elles ont été construites reste un mystère, surtout avec la Structure surplombant la planète."

    giga_birch.801:99 "Anciens passages d'accès"
    giga_birch.801.desc:99 "Une série de couloirs d'accès dans une section rarement visitée de l'arcologie a conduit nos [owner.GetArchaeologistPlural] à une immense porte blindée qui semble séparer une grande section de la plateforme du complexe principal.\n\nIl pourrait s'agir d'un dépôt de données sécurisé ou d'une autre zone sensible."
    giga_birch.801.a:99 "Une porte scellée est bon signe."

    giga_birch.802:99 "Cartographier l'étendue"
    giga_birch.802.desc:99 "La porte blindée a été ouverte, et la zone qu'elle renferme est en cours de cartographie. Une grande section de l'arcologie semble avoir été dédiée à une sorte d'archive numérique, mais l'état avancé de dégradation visible dans toute la structure pourrait signifier qu'il ne reste rien à trouver."
    giga_birch.802.a:99 "Ne laissons aucune pierre non retournée."

    giga_birch.803:99 "Serveurs délabrés"
    giga_birch.803.desc:99 "Une salle a été trouvée au plus profond de l'archive, contenant un certain nombre d'enregistrements apparemment intacts. La disposition de la zone environnante et le faible niveau de mesures de sécurité suggèrent qu'elle n'a pas d'importance particulière, plus oubliée que spécifiquement préservée.\n\nNos [owner.GetArchaeologistPlural] décodent le contenu, mais en raison du niveau de dégradation, reconstituer quoi que ce soit d'utile pourrait prendre un certain temps."
    giga_birch.803.a:99 "Nous avons de la chance que l'archive soit au moins partiellement intacte."

    giga_birch.804:99 "Un trésor de schémas"
    giga_birch.804.desc:99 "Les efforts pour reconstituer des données utilisables à partir des restes de l'archive ont enfin porté leurs fruits.\n\nIl semble que cette section particulière était utilisée pour stocker les schémas de l'arcologie et d'autres installations similaires ! Ils sont incomplets en raison de la détérioration des supports de stockage, mais même ce bref aperçu de l'esprit de ses architectes sera certainement incroyablement précieux."
    giga_birch.804.a:99 "Nous pourrions utiliser ces connaissances pour coloniser d'autres planètes..."
    giga_birch.804.pops:99 "Chaque £pop£ §YPop§! sur §H[this.GetName]§! ayant le trait §Y$trait_pc_birch_preference$§! gagnera le trait §Y$trait_pc_ocean_preference$§! à la place."
    giga_birch.804.b:99 "... ou les réutiliser pour construire des habitats spatiaux à la place."

    giga_birch_origin_building_reward_habitat:99 "Rétro-ingénierie d'arcologie"
    giga_birch_origin_building_reward_habitat_desc:99 "Nous avons beaucoup appris sur la construction grâce au complexe d'arcologies sur le Bord de l'éternité."
    giga_birch_origin_building_reward_planet:99 "Rétro-ingénierie d'arcologie"
    giga_birch_origin_building_reward_planet_desc:99 "Nous avons beaucoup appris sur la construction grâce au complexe d'arcologies sur le Bord de l'éternité."

    #########################################
    ### Expeditions #########################
    #########################################

    giga_explorer_1:99 "explorateur"
    giga_explorers_1:99 "explorateurs"

    giga_explorer_2:99 "drone de reconnaissance"
    giga_explorers_2:99 "drones de reconnaissance"

    giga_explorer_3:99 "drone d'exploration"
    giga_explorers_3:99 "drones d'exploration"

    # expedition 1
    giga_birch.1001:99 "La Première Expédition"
    giga_birch.1001.desc:99 "Aujourd'hui marque la date de départ de notre première grande opération d'exploration pour découvrir une flèche de transit fonctionnelle, et à travers elle les origines de notre monde natal. Bien que de nombreuses tentatives aient été faites par le passé pour cartographier des régions éloignées de notre insula natale, elles étaient comparativement petites et mal équipées, et n'ont trouvé que peu d'éléments utiles dans la vaste étendue sauvage.\n\nMaintenant que nous avons vu la Structure depuis l'espace et compris son immensité véritable, il est impératif que nos [GigaGetExplorerPlural] disposent de l'équipement et des fournitures nécessaires pour des excursions d'une telle échelle épique.\n\nLe chef d'expédition [giga_birch_expedition_leader.GetName] a été assigné pour diriger l'opération, menant une force combinée terrestre, maritime et aérienne suffisamment grande pour parcourir les distances extrêmes requises tout en maintenant la majeure partie de leur propre chaîne d'approvisionnement.\n\nNous ne savons pas ce que nous trouverons là-bas, mais nous espérons que cela pourra au moins éclairer la véritable nature de cette structure ancienne."
    giga_birch.1001.a:99 "Nous nous élançons dans les ténèbres, en quête de vérité."

    giga_birch.1002:99 "Seulement des ruines"
    giga_birch.1002.desc:99 "Le chef d'expédition [giga_birch_expedition_leader.GetName] rapporte que nos [GigaGetExplorerPlural] ont découvert les vestiges d'une grande colonie, disposée comme la nôtre autour de l'une des grandes flèches de support, malheureusement non fonctionnelle.\n\nEntre l'état usé des ruines et le nombre de structures qui semblent avoir été entièrement ensevelies par les pluies de limon, nos [GetArchaeologistPlural] estiment que la colonie est abandonnée depuis environ 200 ans.\n\nUne investigation plus approfondie est en cours et devrait bientôt faire son rapport."
    giga_birch.1002.a:99 "Séparés par l'espace et le temps."

    giga_birch.1003:99 "Une présence permanente ?"
    giga_birch.1003.desc:99 "Le rapport sur la colonie en ruines découverte par nos [GigaGetExplorerPlural] est arrivé, et il fait peu pour expliquer ce que nous avons vu.\n\nSelon le chef [GetArchaeologist] de l'expédition, la civilisation qui vivait ici autrefois était bien établie et possédait un niveau significatif d'infrastructure industrielle. Il ne reste pas grand-chose pour nous aider à comprendre exactement à quoi ils ressemblaient, car aucun reste n'a été trouvé, et tous les supports de stockage trouvés se sont dégradés au-delà de toute reconnaissance. Tout ce que nous pouvons dire avec certitude, c'est qu'ils avaient une morphologie différente de la nôtre, car leurs outils et équipements sont de conception étrangère.\n\nLe chef d'expédition [giga_birch_expedition_leader.GetName] a suggéré que nous établissions une base d'opérations avancée sur le site, car ce mystère pourrait devenir un sujet d'étude à long terme. [giga_birch_expedition_leader.GetSheHeCap] suggère également que nous pourrions utiliser certains des sites moins intéressants pour rassembler des ressources, soit par recyclage soit par réaménagement des terres."
    giga_birch.1003.a:99 "Réaffecter leurs usines."
    giga_birch.1003.a.desc:99 "Nous reconvertirons leur infrastructure industrielle pour produire des £consumer_goods£ §Y$consumer_goods$§!.\n "
    giga_birch.1003.b:99 "Récupérer certaines structures."
    giga_birch.1003.b.desc:99 "Démanteler certaines des ruines les moins significatives produira des £minerals£ §Y$minerals$§! et des £alloys£ §Y$alloys$§!.\n "
    giga_birch.1003.c:99 "Récupérer les centrales électriques."
    giga_birch.1003.c.desc:99 "Réparer leur infrastructure électrique nous permettra de récolter de l'£energy£ §Y$energy$§! supplémentaire.\n "
    giga_birch.1003.d:99 "Toute cette terre arable devrait être mise à profit."
    giga_birch.1003.d.desc:99 "Déblayer quelques décombres insignifiants nous permettra de produire de la £food£ §Y$food$§! dans cette zone.\n "

    giga_birch.1004:99 "Un avenir incertain"
    giga_birch.1004.desc:99 "La découverte d'une civilisation éteinte qui semble avoir suivi une trajectoire technologique similaire à la nôtre nous a laissé un sentiment d'incertitude quant à notre propre permanence. Nous avons l'avantage de pouvoir accéder à l'espace au-delà de la coquille extérieure de la Structure, mais nous n'avons pas encore trouvé une seule flèche fonctionnelle par laquelle atteindre les niveaux inférieurs. Il est possible qu'aucune d'entre elles ne reste en état de fonctionnement, auquel cas nous n'atteindrons peut-être jamais notre objectif.\n\nNous devons redoubler d'efforts. La prochaine expédition ira plus loin, apprendra davantage, et sera mieux capable de repousser tout ce qui pourrait menacer sa mission."
    giga_birch.1004.a:99 "Cette base avancée sera la première de nombreuses étapes."

    #########################################
    # expedition 2

    giga_birch.2001:99 "La Deuxième Expédition"
    giga_birch.2001.desc:99 "Le moment est venu de lancer notre deuxième grande expédition dans l'inconnu, toujours à la recherche d'une flèche fonctionnelle pour accéder aux couches inférieures de la Structure.\n\nEn nous appuyant sur nos découvertes précédentes, nos explorateurs partiront de la base avancée établie parmi les ruines découvertes lors de la première expédition. Le chef d'expédition [giga_birch_expedition_leader.GetName] et son équipe de [GigaGetExplorerPlural] sont prêts à relever tous les défis qui se dresseront devant eux."
    giga_birch.2001.a:99 "Une fois de plus vers l'inconnu."

    giga_birch.2002:99 "Signes de civilisation"
    giga_birch.2002.desc:99 "Le chef d'expédition [giga_birch_expedition_leader.GetName] rapporte que notre expédition a capté des signaux radio indiquant une société industrialisée, et a envoyé plusieurs éclaireurs camouflés en avant du convoi principal pour investiguer plus avant.\n\nD'après ce qui a été glané jusqu'ici, ils semblent être des [giga_birch_expedition_2_country.GetSpeciesClassPlural] avec un niveau technologique significativement inférieur au nôtre. Ils ont de nombreuses cités, dont plusieurs sont construites autour de flèches, avec des structures construites partiellement sur leur extérieur principalement utilisées pour lancer des avions à voilure fixe sur de longues distances.\n\nRien n'indique qu'ils aient détecté nos [GigaGetExplorerPlural], et tous les efforts sont faits pour que cela reste ainsi."
    giga_birch.2002.a:99 "Rassembler autant d'informations que possible."

    giga_birch.2003:99 "Contact !"
    giga_birch.2003.desc:99 "Nous avons été repérés !\n\nLe chef d'expédition [giga_birch_expedition_leader.GetName] a envoyé une transmission urgente indiquant que l'espèce [giga_birch_expedition_2_country.GetSpeciesClass] que l'expédition observait a appris leur présence. L'un des avions des primitifs a volé sur une distance inhabituellement longue dans leur direction, passant dans notre zone de black-out et voyant directement le convoi principal. L'avion a réussi à s'échapper et a envoyé un signal de détresse.\n\nNous recevons maintenant un message transmis directement vers le convoi, demandant une audience."
    giga_birch.2003.a:99 "À l'écran."

    giga_birch.2004:99 "[giga_birch_expedition_2_country.GetName]"
    giga_birch.2004.title:99 "Transmission entrante"
    giga_birch.2004.desc:99 "Je suis [giga_birch_expedition_2_ruler.GetName], [giga_birch_expedition_2_country.GetRulerTitle] de [giga_birch_expedition_2_country.GetName]. Déclarez vos intentions, étrangers. Nous souhaitons une discussion pacifique, mais sommes prêts à nous défendre si nécessaire."
    giga_birch.2004.a:99 "Alors discutons."
    giga_birch.2004.a.desc:99 "Nous échangerons des informations pour mieux nous connaître mutuellement."
    giga_birch.2004.b:99 "Nous cherchons une flèche fonctionnelle."
    giga_birch.2004.b.desc:99 "Aller droit au but."
    giga_birch.2004.c:99 "Ce ne sera pas suffisant."
    giga_birch.2004.c.desc:99 "Nous lancerons une attaque immédiate dans le but d'exterminer jusqu'au dernier de ces extraterrestres."

    giga_birch.2005.desc:99 "[giga_birch_expedition_2_country.giga_birch_2005_part1] [giga_birch_expedition_2_country.giga_birch_2005_part2]\n\n[root.giga_birch_2005_part3]"

    giga_birch.2005.desc.1:99 "Vous parlez au représentant choisi de [giga_birch_expedition_2_country.GetName]."
    giga_birch.2005.desc.1.democracy:99 "[giga_birch_expedition_2_country.GetName] est une nation démocratique. Je vous parle en tant que dirigeant actuel élu et chef du gouvernement, au nom du peuple."
    giga_birch.2005.desc.1.oligarchy:99 "Je parle au nom du conseil dirigeant de [giga_birch_expedition_2_country.GetName], en tant que chef."
    giga_birch.2005.desc.1.autocracy:99 "Vous parlez au seul dirigeant de cette nation. Vous devez savoir que chez notre peuple, il est considéré comme un signe de respect que je m'adresse directement à vous."

    giga_birch.2005.desc.2:99 "Nous vivons dans ces terres depuis aussi longtemps que notre histoire est consignée, et jusqu'à aujourd'hui nous n'avions rencontré aucune autre vie intelligente. C'est un moment historique, et nous espérons que votre subterfuge était motivé par la prudence plutôt que par la malveillance."
    giga_birch.2005.desc.2.militarist:99 "Nous vivons dans ces terres depuis aussi longtemps que notre histoire est consignée, et jusqu'à aujourd'hui nous n'avions rencontré aucune autre vie intelligente. Nos braves guerriers sont prêts à vous accueillir, que ce soit dans un esprit de paix ou sur le champ de bataille."
    giga_birch.2005.desc.2.spiritualist:99 "Les écritures anciennes parlent de notre peuple arrivant dans ces terres il y a longtemps, et nous y sommes restés depuis. Bien que nous ayons envoyé de nombreux missionnaires explorer les terres au-delà, nous n'avions trouvé aucune autre vie intelligente jusqu'à aujourd'hui. Nous espérons que votre subterfuge était motivé par la prudence plutôt que par la malveillance."

    giga_birch.2005.desc.3:99 "À ce propos, qui êtes-vous, étrangers ? Des explorateurs comme les nôtres ? Ce rapport suggère que vous êtes très semblables à nous, bien qu'il parle aussi de technologies fantastiques que nous ne pensions pas possibles."
    giga_birch.2005.desc.3.hive:99 "À ce propos, qui êtes-vous exactement, étrangers ? Vos représentants se déplacent avec détermination, tandis que leurs subordonnés sont silencieux et machinaux dans leurs mouvements. Communiquez-vous par d'autres moyens ?"
    giga_birch.2005.desc.3.machine:99 "À ce propos, qui êtes-vous vraiment, étrangers ? Nous voyons vos machines, aussi fantastiques soient-elles, mais pas une seule personne parmi elles. Nous considérez-vous indignes de la courtoisie d'un face-à-face ?"
    giga_birch.2005.desc.3.assimilator:99 "À ce propos, qui êtes-vous vraiment, étrangers ? Vos mouvements et manières semblent presque robotiques ; les représentants que vous nous avez envoyés ne sont-ils que des marionnettes ? Que leur avez-vous fait ?"

    giga_birch.2005.a:99 "Ceci devrait tout expliquer."
    giga_birch.2005.a.hive:99 "Nous nous tenons devant vous comme un seul. Prenez ceci."
    giga_birch.2005.a.machine:99 "Initialisation du transfert de données."
    giga_birch.2005.a.desc:99 "Nous enverrons un paquet d'informations détaillant notre mission.\n "

    giga_birch.2006.desc:99 "Ah, donc vous cherchez un moyen de voyager vers ces couches inférieures qui contiendraient selon vous les machines qui maintiennent notre monde ? Je ne peux pas dire grand-chose sur la véracité de votre hypothèse, mais il semble que vous en sachiez beaucoup plus que nous. Ce que nous savons, c'est qu'aucune des flèches que nous avons rencontrées n'a répondu à nos tentatives d'y accéder, et toutes se sont avérées imperméables à l'entrée forcée.\n\nMeanwhile, votre avance technologique considérable est... imposante.\n\nVous semblez avoir l'avantage sur nous, [root.GetSpeciesName]. Où cela nous mène-t-il ?"
    giga_birch.2006.desc.im:99 "Attendez, vous voulez dire qu'il n'y a QUE des machines ? Et vous ne savez pas ce qu'il est advenu de vos créateurs ? C'est inquiétant, pour le moins, mais si vos intentions sont pacifiques, nous sommes ouverts aux relations diplomatiques entre nos cultures.\n\nIl est dit ici que vous cherchez une flèche fonctionnelle pour accéder aux machines des couches inférieures ? Je suis désolé de dire que chacune de celles que nous avons rencontrées est restée inerte, et toutes se sont avérées imperméables à l'entrée forcée.\n\nMeanwhile, votre avance technologique considérable est... imposante.\n\nVous semblez avoir l'avantage sur nous, [root.GetSpeciesName]. Où cela nous mène-t-il ?"
    giga_birch.2006.desc.hive:99 "Donc vous êtes tous des parties d'un seul grand organisme, gouverné par une sorte de... supramental ? C'est un concept très étranger pour nous, mais que nous pensions possible. Un peu troublant, si je suis honnête, mais nous sommes ouverts aux relations diplomatiques entre nos... pourrait-on même considérer ce que vous êtes comme une culture ? Nos sociologues pourraient avoir besoin de redéfinir certains termes.\n\nMais assez de cela, il est dit ici que vous cherchez une flèche fonctionnelle pour accéder aux machines des couches inférieures ? Je suis désolé de dire que chacune de celles que nous avons rencontrées est restée inerte, donc nous ne pouvons pas vous aider beaucoup là-dessus. Où cela nous mène-t-il ?"
    giga_birch.2006.desc.machine:99 "Attendez, vous voulez dire qu'il n'y a QUE des machines ? Et vous ne savez pas ce qu'il est advenu de vos créateurs ? C'est inquiétant, pour le moins, mais si vos intentions sont pacifiques, nous sommes ouverts aux relations diplomatiques entre nos... pourrait-on même considérer ce que vous êtes comme une culture ? Nos sociologues pourraient avoir besoin de redéfinir certains termes.\n\nMais assez de cela, il est dit ici que vous cherchez une flèche fonctionnelle pour accéder aux machines des couches inférieures ? Je suis désolé de dire que chacune de celles que nous avons rencontrées est restée inerte, donc nous ne pouvons pas vous aider beaucoup là-dessus. Où cela nous mène-t-il ?"
    giga_birch.2006.desc.servitor:99 "Les gens sont restés dans votre patrie, et vous explorez de votre propre initiative ? L'idée de confier tant de choses à une machine est... étrange, mais si ce que vous dites est vrai, alors vos intentions semblent au moins bonnes. Quant à votre intérêt pour les flèches, aucune de celles que nous avons rencontrées n'a répondu à nos tentatives d'y accéder, et toutes se sont avérées imperméables à l'entrée forcée.\n\nVous avez clairement une technologie d'un niveau significativement supérieur au nôtre, donc vous avez l'avantage ici, [root.GetSpeciesNamePlural]. Nous sommes ouverts aux relations diplomatiques entre nos peuples, si vous l'êtes aussi."
    giga_birch.2006.desc.assimilator:99 "« Une union de chair et de machine » ? J'ai du mal à croire que cela a été accompli par choix, mais... avec la situation actuelle, nous respecterons votre mode de vie si vous respectez le nôtre.\n\nNous ne savons pas si votre hypothèse sur les machines en dessous de nous est vraie, mais vous semblez en savoir beaucoup plus que nous. Ce que nous savons, c'est qu'aucune des flèches que nous avons rencontrées n'a répondu à nos tentatives d'y accéder, et toutes se sont avérées imperméables à l'entrée forcée.\n\nMeanwhile, votre avance technologique considérable est... inquiétante. Vous semblez avoir l'avantage sur nous, [root.GetSpeciesName]. Où cela nous mène-t-il ?"
    giga_birch.2006.oncon:99 "§HAprès achèvement de l'expédition :§!"
    giga_birch.2006.a:99 "Nous souhaitons un échange de biens et d'idées."
    giga_birch.2006.a.desc:99 "Nous entamerons des négociations pour un accord commercial à long terme, mais [giga_birch_expedition_2_country.GetName] restera indépendant.\n\n$giga_birch.2006.oncon$\n "
    giga_birch.2006.a.xenophobe:99 "Nous devrions commercer, mais rien de plus."
    giga_birch.2006.a.xenophobe.desc:99 "Nous entamerons des négociations pour un accord commercial à long terme, et [giga_birch_expedition_2_country.GetName] gardera ses distances.\n\n$giga_birch.2006.oncon$\n "
    giga_birch.2006.b:99 "Rejoignez-nous. C'est aussi votre monde."
    giga_birch.2006.b.desc:99 "Proposer l'intégration pacifique de leur nation sous notre bannière extérieure.\n\n$giga_birch.2006.oncon$\n\n$giga_birch.2009.integrate.desc$"
    giga_birch.2006.c:99 "Rendez-vous ou soyez détruits."
    giga_birch.2006.c.desc:99 "Notre expédition tentera de subjuguer ces primitifs par la force.\n\n$giga_birch.2006.oncon$\n\n$giga_birch.2009.conquer.desc$"
    giga_birch.2006.d:99 "Nous vous sauverons de vous-mêmes."
    giga_birch.2006.d.desc:99 "Notre expédition veillera à ce que ces organiques soient pris en charge de manière appropriée.\n\n$giga_birch.2006.oncon$\n\n$giga_birch.2009.sanctuary.desc$"

    giga_birch.2007.desc:99 "Eh bien, vous n'en trouverez pas une par ici, j'en suis désolé. Aucune des flèches que nous avons rencontrées n'a répondu à nos tentatives d'y accéder, et toutes se sont avérées imperméables à l'entrée forcée. Étant venus de si loin, vous semblez plus capables que nous de poursuivre vos recherches.\n\nVotre niveau technologique apparent m'inquiète. Vous semblez avoir l'avantage sur nous, [root.GetSpeciesName]. Où cela nous mène-t-il ?"

    giga_birch.2008.desc.exterminate:99 "Ne pensez pas que nous allons simplement nous coucher et mourir, étranger. Nous nous battrons jusqu'au dernier souffle pour préserver notre mode de vie."
    giga_birch.2008.exterminate:99 "C'est ce qu'on verra."
    giga_birch.2008.desc.trade:99 "Cela semble... avantageux. Je suis sûr que nous pouvons apprendre beaucoup l'un de l'autre. Je vais faire rédiger une proposition par mes ministres immédiatement."
    giga_birch.2008.trade:99 "Excellent."
    giga_birch.2008.desc.integrate:99 "Si ce que vous dites sur la fragilité de notre environnement est exact, alors il semble que cette mission qui est la vôtre soit véritablement très importante. Nous vous aiderons de toutes les manières possibles."
    giga_birch.2008.integrate:99 "Bienvenue à bord."
    giga_birch.2008.desc.conquer:99 "Vous rendre ? Vous avez peut-être un avantage technologique, mais nos forces armées devraient être plus que capables de vaincre une bande d'explorateurs. Nous ne nous rendrons pas."
    giga_birch.2008.conquer:99 "Regrettable."
    giga_birch.2008.desc.sanctuary:99 "Vous souhaitez nous donner de la technologie ? C'est... inattendu. Et c'était une façon très troublante de le formuler. Je vais faire préparer nos meilleurs scientifiques pour étudier votre proposition d'ici quelques jours."
    giga_birch.2008.sanctuary:99 "Ce n'est que le début..."
    giga_birch.2008.a:99 "(Si vous voyez ceci, quelque chose s'est mal passé.)"

    giga_birch.2009:99 "Les conséquences"
    giga_birch.2009.desc.exterminate:99 "Trois éclairs. Trois colonnes de feu atomique s'élevant tandis que nos bombes à fusion anéantissent trois cités [giga_birch_expedition_2_country.GetAdj] en un clin d'oeil.\n\nAu cours du mois suivant, nos forces d'exploration ont systématiquement traqué et tué chaque [giga_birch_expedition_2_species.GetName] qu'ils ont pu trouver. Aucun n'a été épargné.\n\nAussi puissants qu'ils se croyaient, ils ont été terrassés par la simple force des armes. Les restes de leur civilisation serviront de terrain d'essai et de lieu d'étude pour la prochaine fois que nous rencontrerons des extraterrestres."
    giga_birch.2009.exterminate:99 "Tout est comme il se doit."
    giga_birch.2009.exterminate.desc:99 "Les £district£ §Y$district_giga_origin_birch_lab_plural$§! produiront des £society_research£ §Y$society_research$§! et de l'£unity£ §Y$unity$§! supplémentaires.\n "
    giga_birch.2009.desc.trade:99 "Après une période de négociations, un partenariat commercial a été établi avec succès avec [giga_birch_expedition_2_country.GetName]. Nos nations resteront séparées, mais des marchands voyageront entre nos terres, et des plans pour un système de transit longue distance sont en cours d'élaboration."
    giga_birch.2009.trade:99 "À un avenir prospère pour tous."
    giga_birch.2009.trade.desc:99 "Les £district£ §Y$district_giga_origin_birch_lab_plural$§! produiront des £society_research£ §Y$society_research$§! et de l'£unity£ §Y$unity$§! supplémentaires.\n "
    giga_birch.2009.desc.integrate:99 "Après une période de négociations intenses, [giga_birch_expedition_2_country.GetName] a accepté de se joindre à notre mission de restaurer la Structure à sa gloire passée. Ils seront sous notre bannière en ce qui concerne le reste de la galaxie, et nos peuples se rapprocheront sans doute avec le temps."
    giga_birch.2009.integrate:99 "Nous découvrirons notre destinée ensemble."
    giga_birch.2009.integrate.desc:99 "8 £pop£ Pops §Y[giga_birch_expedition_2_species.GetName]§! apparaissent sur [situation.target.GetName].\n "
    giga_birch.2009.desc.conquer:99 "Après une période de combats intenses, nos forces expéditionnaires ont forcé [giga_birch_expedition_2_country.GetName] à une capitulation sans condition. Leur nombre n'a pas fait le poids face à notre puissance de feu supérieure.\n\nNous occupons maintenant leurs terres, et leurs ressources sont à nous pour être prélevées."
    giga_birch.2009.conquer:99 "Ils apprendront à obéir."
    giga_birch.2009.conquer.desc:99 "6 £pop£ Pops §Y[giga_birch_expedition_2_species.GetName]§! avec le modificateur §Y$pop_recently_conquered$§! apparaissent sur [situation.target.GetName].\n "
    giga_birch.2009.desc.sanctuary:99 "Sous le prétexte initial de partager notre technologie, nous avons réussi à intégrer [giga_birch_expedition_2_country.GetName] dans notre réseau de sanctuaires organiques, en grande partie sans qu'ils s'en rendent compte. À court terme, ils continueront de penser qu'ils vivent sans surveillance, mais seront progressivement amenés vers leurs nouvelles vies de sécurité et de contentement.\n\nNotre « alliance » sera célébrée pendant d'innombrables générations [giga_birch_expedition_2_species.GetAdjective]."
    giga_birch.2009.sanctuary:99 "Ils nous remercieront avec le temps."
    giga_birch.2009.sanctuary.desc:99 "8 £pop£ Pops §Y[giga_birch_expedition_2_species.GetName]§! apparaissent sur [situation.target.GetName].\n "
    giga_birch.2009.a:99 "Si vous voyez ce message, quelque chose s'est mal passé."

    #########################################
    # expedition 3

    giga_birch.3001:99 "La Troisième Expédition"
    giga_birch.3001.desc:99 "Le moment est venu pour une troisième expédition de s'élancer dans l'inconnu à la recherche d'une flèche fonctionnelle.\n\nNous avons beaucoup appris au cours des décennies depuis le début de notre mission, et de nouveaux développements dans les technologies de propulsion et de capteurs permettront à nos [GigaGetExplorerPlural] d'aller plus loin et de voir plus que jamais.\n\nCette fois, le convoi sera dirigé par le chef d'expédition [giga_birch_expedition_leader.GetName] et partira de la base avancée établie lors de la deuxième expédition."
    giga_birch.3001.a:99 "Ils partent à la recherche de l'avenir."

    giga_birch.3002:99 "Le candidat"
    giga_birch.3002.desc:99 "Le chef d'expédition [giga_birch_expedition_leader.GetName] rapporte que nos [GigaGetExplorerPlural] ont peut-être enfin trouvé une flèche de transit fonctionnelle !\n\nAprès plusieurs milliers de tentatives infructueuses, une flèche a montré des signes de systèmes internes intacts et pourrait nous permettre de passer aux couches inférieures... si nous sommes capables de fournir assez d'énergie pour la réveiller correctement.\n\n[giga_birch_expedition_leader.GetName] attend notre approbation, car il faudrait à la fois beaucoup de temps et un approvisionnement significatif en crédits d'énergie pour ranimer cette ancienne machine."
    giga_birch.3002.a:99 "Nous ne pouvons pas laisser passer cette opportunité. Commencez immédiatement !"

    giga_birch.3003:99 "Elle est vivante !"
    giga_birch.3003.desc:99 "C'est fait ! Le chef d'expédition [giga_birch_expedition_leader.GetName] rapporte qu'après une injection massive d'énergie, l'ancienne flèche de transit découverte par l'expédition s'est activée !\n\nNotre hypothèse selon laquelle les flèches servaient non seulement de support mais aussi de transport entre les couches a été confirmée, et nos [GigaGetExplorerPlural] auront désormais accès aux couches situées sous la nôtre.\n\nUn petit contingent a été choisi pour découvrir jusqu'où nous pouvons aller, à la fois pour la sécurité de l'expédition dans son ensemble et en raison des contraintes sur la quantité que les flèches peuvent déplacer à la fois."
    giga_birch.3003.a:99 "Enfin. Il est temps de descendre."

    giga_birch.3004:99 "Un royaume de machines"
    giga_birch.3004.desc:99 "Après avoir voyagé vers le bas pendant plusieurs jours, nos [GigaGetExplorerPlural] rapportent que la capsule de transit de la flèche a rencontré un blocage qui empêche toute progression. En chemin, ils n'ont pu accéder qu'à trois des dizaines de couches traversées, dont deux semblaient entièrement dépourvues de caractéristiques, ne contenant qu'un espace vide sans air entre les coquilles.\n\nLa troisième couche était différente. Les premiers rapports suggèrent qu'elle est remplie de machines, possiblement de nature industrielle, et possède une atmosphère de gaz inertes, probablement comme milieu de transfert thermique.\n\nLe chef d'expédition [giga_birch_expedition_leader.GetName] suggère que nous établissions une base avancée au pied de la flèche sur ce troisième niveau, pour sécuriser la position et avoir un site à partir duquel mener d'autres explorations.\n\nUne question demeure : quel devrait être l'objectif principal de la base avancée ?"
    giga_birch.3004.a:99 "Étudier d'abord toute infrastructure de communication."
    giga_birch.3004.a.desc:99 "Les £district£ §Y$district_giga_origin_birch_lab_plural$§! produiront de la £physics_research£ §Y$physics_research$§! supplémentaire.\n "
    giga_birch.3004.b:99 "Se concentrer sur les processus industriels."
    giga_birch.3004.b.desc:99 "Les £district£ §Y$district_giga_origin_birch_lab_plural$§! produiront de la £engineering_research£ §Y$engineering_research$§! supplémentaire.\n "
    giga_birch.3004.c:99 "Récupérer tout ce qui présente un intérêt."
    giga_birch.3004.c.desc:99 "Les £district£ §Y$district_giga_origin_birch_lab_plural$§! produiront un petit nombre de £minor_artifacts£ §Y$minor_artifacts$§!.\n "

    #########################################
    # expedition 4

    giga_birch.4001:99 "La Quatrième Expédition"
    giga_birch.4001.desc:99 "Quand la troisième expédition a réussi à activer une flèche et à voyager jusqu'à la couche des machines, nous avions estimé que nos [GigaGetExplorerPlural] avaient parcouru moins d'un pour cent du chemin jusqu'au coeur de la Structure. Depuis lors, de nouvelles mesures de l'effet de la gravité et de l'écoulement du temps sur la couche des machines nous ont amenés à réviser notre calcul de la densité de la Structure.\n\nSur la base de ces données et des observations d'autres galaxies, nous pensons maintenant que la Structure pourrait être construite autour d'un trou noir supermassif, la couche des machines étant placée à plus de trente pour cent du chemin entre la surface extérieure et son horizon des événements. Cette nouvelle estimation recadre radicalement nos progrès et suggère qu'il pourrait être possible d'atteindre le coeur beaucoup plus tôt que prévu initialement.\n\nLa quatrième expédition sera dirigée par le chef d'expédition [giga_birch_expedition_leader.GetName] et se concentrera sur la recherche d'une autre flèche sur la couche des machines capable de nous emmener encore plus près de notre objectif."
    giga_birch.4001.a:99 "Même s'ils n'y parviennent pas, il y a tant à apprendre ici."

    giga_birch.4002:99 "Une manufacture dormante ?"
    giga_birch.4002.desc:99 "Le chef d'expédition [giga_birch_expedition_leader.GetName] rapporte que notre expédition a rencontré une grande installation qui pourrait être une usine de fabrication automatisée. Elle semble remarquablement intacte par rapport aux autres structures rencontrées au cours du voyage, et une investigation plus approfondie pour déterminer si elle pourrait être réparée ou autrement réutilisée est prête à commencer."
    giga_birch.4002.a:99 "Elle aura toute notre attention."

    giga_birch_origin_expedition_4:99 "Étudier l'ancienne manufacture"
    giga_birch_origin_expedition_4_DESC:99 "Nos [GigaGetExplorerPlural] ont découvert les restes en grande partie intacts d'un ancien complexe manufacturier sur la couche des machines. Nous devons étudier ses systèmes pour déterminer s'il peut être réparé."

    giga_birch.4003:99 "Avec un peu d'huile de coude..."
    giga_birch.4003.desc:99 "Les résultats de l'enquête menée par nos [GigaGetExplorerPlural] sont arrivés : l'ancien complexe manufacturier semble suffisamment intact pour être restauré, et ce serait extrêmement bénéfique de le faire.\n\nLe chef d'expédition [giga_birch_expedition_leader.GetName] dit que bien qu'[giga_birch_expedition_leader.GetSheHe] ne puisse pas être certain de la manière exacte dont cela serait accompli pour l'instant, cela devrait être possible avec des efforts dédiés pour comprendre les machines."
    giga_birch.4003.a:99 "Commençons."

    giga_birch.4004:99 "Indices de quelque chose de plus grand"
    giga_birch.4004.desc:99 "L'enquête a également révélé autre chose : la disposition approximative des réseaux d'information traversant la Structure.\n\nAvec ces informations, nous pouvons grandement concentrer nos efforts, en visant les zones susceptibles de contenir des noeuds importants sur ce réseau. L'espace de recherche est toujours immense, mais maintenant nous avons une carte, en quelque sorte."
    giga_birch.4004.a:99 "Avec le temps, nous percerons ses secrets."

    giga_birch.4005:99 "Approche de la manufacture finalisée"
    giga_birch.4005.desc:99 "Nous avons maintenant atteint le point de non-retour dans notre restauration de l'ancien complexe manufacturier. Au-delà de ce point, d'autres modifications à nos plans ruineraient nos chances de réparer les machines, car nous ne comprenons toujours pas comment répliquer certains des matériaux et composants qu'elles nécessiteraient."
    giga_birch.4005.desc.alloys:99 "$giga_birch.4005.desc$\n\nUne fois achevée, l'installation sera capable de produire de grandes quantités d'£alloys£ §Y$alloys$§! avancés."
    giga_birch.4005.desc.goods:99 "$giga_birch.4005.desc$\n\nUne fois achevée, l'installation sera capable de produire de grandes quantités de £consumer_goods£ §Y$consumer_goods$§!."
    giga_birch.4005.desc.supertensiles:99 "$giga_birch.4005.desc$\n\nUne fois achevée, l'installation sera capable de produire de grandes quantités de £giga_sr_amb_megaconstruction£ §Y$giga_sr_amb_megaconstruction$§!."
    giga_birch.4005.a:99 "Il ne reste plus qu'à terminer le travail."

    giga_birch.4006:99 "Restauration de la manufacture terminée"
    giga_birch.4006.desc:99 "Le projet de restauration de l'ancien complexe manufacturier sur le niveau des machines a été achevé avec succès. L'installation commence déjà à s'animer, d'anciennes machines rugissant en action pour la première fois depuis des siècles.\n\nCela devrait augmenter considérablement notre rendement manufacturier."
    giga_birch.4006.a:99 "Une nouvelle aube pour l'industrie [root.owner.GetAdj]."
    giga_birch.4006.a.desc:99 "Plusieurs nouveaux emplois ont été ajoutés à la caractéristique §Y$d_giga_birch_expedition_4$§! sur [situation.target.GetName]."

    #########################################
    # expedition 5

    giga_birch.5001:99 "La Cinquième Expédition"
    giga_birch.5001.desc:99 "Depuis la conclusion de la quatrième expédition, des progrès significatifs ont été réalisés dans l'interprétation de la carte réseau que nous avons découverte. Plusieurs sites candidats pour des noeuds importants ont été identifiés, et cette nouvelle expédition se rendra au plus proche.\n\nLe chef d'expédition [giga_birch_expedition_leader.GetName] conduira nos [GigaGetExplorerPlural] vers cet emplacement potentiel et déterminera si nos modèles prédictifs sont corrects.\n\nNous ne savons toujours pas quelle forme ces noeuds prendront, ni même s'ils ont une présence physique avec laquelle nous pourrions raisonnablement interagir, mais confirmer si nos soupçons sont exacts vaut la dépense."
    giga_birch.5001.a:99 "Nous voyons la Structure avec de nouveaux yeux."

    giga_birch.5002:99 "Tracer le réseau"
    giga_birch.5002.desc:99 "Le chef d'expédition [giga_birch_expedition_leader.GetName] rapporte que notre expédition a atteint la zone approximative du noeud réseau prédit et a rencontré une structure d'apparence inhabituelle intégrée dans le tronc principal de l'une des flèches du niveau des machines.\n\nLa flèche elle-même semble être réactive, donc l'accès à l'étrange structure ne devrait pas poser de problème, mais nos [GigaGetExplorerPlural] procèdent avec prudence."
    giga_birch.5002.a:99 "Cela pourrait bien être ce que nous cherchons."

    giga_birch.5003:99 "Un manque de contexte"
    giga_birch.5003.desc:99 "À l'intérieur de la flèche inhabituelle, nos [GigaGetExplorerPlural] ont trouvé ce qui semble être une sorte de centre de contrôle, apparemment dédié à la gestion du flux de ressources et d'énergie à travers les systèmes de la Structure. Nos [GetResearchers] postulent que si nous pouvons déchiffrer le protocole utilisé dans le réseau, nous pourrions prendre le contrôle de ces systèmes et enfin ramener la Structure à la vie."
    giga_birch.5003.desc.wait:99 "À l'intérieur de la flèche inhabituelle, nos [GigaGetExplorerPlural] ont trouvé ce qui semble être une sorte de centre de contrôle, mais ils n'ont pas encore pu déterminer ce qu'il fait réellement.\n\nLe chef d'expédition [giga_birch_expedition_leader.GetName] suggère que nous n'essayions pas d'interférer avec cet équipement sans un meilleur niveau de compréhension, car les autres sites candidats sont tous significativement plus éloignés et pourraient ne pas être aussi intacts."
    giga_birch.5003.a:99 "Nos [GetResearchers] décoderont cela en un rien de temps."
    giga_birch.5003.b:99 "Peut-être que la solution se révélera avec le temps."
    giga_birch.5003.b.desc:99 "Rechercher la technologie £engineering_research£ §Y$tech_mega_engineering$§! nous permettra de poursuivre cette ligne d'investigation."

    giga_birch_origin_expedition_5:99 "Décoder le protocole réseau"
    giga_birch_origin_expedition_5_DESC:99 "Nous avons déterminé que ce mystérieux centre de contrôle pourrait être la clé pour accéder aux systèmes de la Structure et la restaurer à son ancienne gloire. Nous devons percer le protocole utilisé dans son réseau."

    giga_birch.5004:99 "Une nouvelle piste"
    giga_birch.5004.desc:99 "De nouveaux développements en ingénierie structurelle ont donné un contexte à la salle de contrôle que notre expédition a rencontrée il y a quelque temps, et il est maintenant clair que les données inconnues que nous ne pouvions pas comprendre étaient liées à la distribution des ressources au sein des systèmes de la Structure.\n\nArmés de cette nouvelle perspective, nous pensons maintenant avoir ce qu'il faut pour décoder le protocole réseau utilisé pour contrôler ces systèmes."
    giga_birch.5004.a:99 "Nos [GetResearchers] décoderont cela en un rien de temps."

    giga_birch.5005:99 "Le réseau dévoilé"
    giga_birch.5005.desc:99 "Une vaste toile s'étend devant nous ; une constellation de cent milliards de minuscules étoiles, reliées entre elles par de fins fils de données. Presque toutes sont éteintes, seuls quelques points épars clignotant, tenant bon contre les ténèbres.\n\nC'est l'essence numérique de la Structure, sa forme véritable. C'est magnifique.\n\nElle est mourante.\n\nNos noeuds locaux sont quelque peu intacts et fonctionnent en mode dégradé, incapables de s'organiser correctement sans la main directrice du réseau dans son ensemble. Il est tombé dans un tel état de délabrement que toute la Structure se dégrade lentement.\n\nL'énergie nécessaire pour la sauver serait bien au-delà de tout ce que nous pourrions fournir, mais si nous pouvions puiser à la source, ramener à la vie le coeur de la Structure, nous pourrions peut-être la convaincre de se sauver elle-même.\n\nEn attendant, le filet d'énergie disponible devrait être plus que suffisant pour redémarrer certains des systèmes automatisés du noeud le plus proche de notre foyer."
    giga_birch.5005.a:99 "Nous comprenons maintenant notre véritable objectif."

    giga_birch.5006:99 "Une nouvelle ère de confort"
    giga_birch.5006.desc:99 "Malgré la gravité de la situation, aujourd'hui est un jour à célébrer, car le premier pas a été franchi pour établir notre intendance de la Structure. Nous comprenons maintenant les bases de son fonctionnement et ce que nous devons faire pour la réparer, du moins dans l'abstrait.\n\nFrustrante à souhait, ces découvertes n'ont rien fait pour expliquer notre propre rôle dans l'histoire mouvementée de la Structure. Les interfaces du centre de contrôle étaient si adaptatives à la présence de nos [GigaGetExplorerPlural] que nous ne pouvons pas dire si leurs créateurs nous ressemblaient même de loin.\n\nQuoi qu'il en soit, les systèmes automatisés que nous avons remis en ligne dans notre patrie ont révolutionné tous les niveaux de nos opérations, élargissant considérablement nos capacités."
    giga_birch.5006.a:99 "Ce n'est qu'un avant-goût de ce qui nous attend."

    #########################################
    # expedition 6

    giga_birch.6001:99 "La Sixième Expédition"
    giga_birch.6001.desc:99 "La cinquième expédition nous a montré que notre véritable objectif réside dans la réanimation du coeur de la Structure, la remise en ligne de ses systèmes de production d'énergie. La sixième expédition partira à la recherche de ce coeur.\n\nLa carte réseau que nous avons récupérée du centre de contrôle sur la couche des machines nous a permis de localiser une flèche distante qui devrait permettre d'accéder à des couches plus profondes. À partir de là, les choses deviennent moins certaines, mais il y a quelques emplacements probables pour un autre centre de commande pour nous guider plus loin.\n\nLe chef d'expédition [giga_birch_expedition_leader.GetName] conduira nos [GigaGetExplorerPlural] dans les couches inférieures pour établir une base d'opérations avancée."
    giga_birch.6001.a:99 "Un chemin inconnu, mais un objectif connu."

    giga_birch.6002:99 "Une couche de glace"
    giga_birch.6002.desc:99 "Le chef d'expédition [giga_birch_expedition_leader.GetName] rapporte que la flèche de transit a été atteinte avec succès, et comme précédemment un groupe de [GigaGetExplorerPlural] a été envoyé en avant du convoi principal comme éclaireurs.\n\nCette fois, une seule couche était accessible, où les [GigaGetExplorerPlural] ont été immédiatement accueillis par un blizzard. L'observation prolongée suggère que cette couche est remplie de glace et de neige, avec d'énormes systèmes de tempête déferlant sur le paysage presque continuellement.\n\nLes conditions défavorables pourraient poser quelques problèmes pour l'expédition, mais ils sont bien préparés et restent très motivés."
    giga_birch.6002.a:99 "Inattendu, mais pas surprenant non plus."

    giga_birch.6003:99 "Fantômes dans la neige"
    giga_birch.6003.desc:99 "En voyageant à travers la couche arctique balayée par les tempêtes, nos [GigaGetExplorerPlural] ont rencontré de multiples colonies abandonnées, bien plus fréquemment que sur notre couche natale, et chacune apparemment construite par une culture différente à divers niveaux de développement technologique.\n\nCurieusement, aucune d'entre elles ne semble préparée pour ce type de conditions météorologiques extrêmes, ce qui a amené le chef d'expédition [giga_birch_expedition_leader.GetName] à suggérer que leur abandon pourrait être dû à un changement des conditions environnementales à un moment donné au cours des derniers siècles.\n\nIl est possible qu'un tel changement ait été causé par la détérioration des systèmes de contrôle environnemental de la Structure, et qu'ils puissent être réparés à l'avenir. Les anciens habitants, cependant, ont disparu depuis longtemps."
    giga_birch.6003.a:99 "Une tragédie qui aurait pu être évitée."
    giga_birch.6003.b:99 "S'ils étaient trop stupides pour survivre, ils méritaient de mourir."
    giga_birch.6003.c:99 "Bon débarras."

    giga_birch.6004:99 "Un semblant d'abri"
    giga_birch.6004.desc:99 "Le chef d'expédition [giga_birch_expedition_leader.GetName] rapporte qu'après un blizzard particulièrement intense, l'expédition a été forcée de se réfugier dans un système de canyons, mais ce faisant, elle est tombée sur quelque chose d'intéressant.\n\nCe canyon particulier traverse une série de grandes grottes qui, en raison de leur position abritée, pourraient être le meilleur endroit trouvé jusqu'à présent pour une base avancée. De plus, les grottes semblent abriter une riche écologie souterraine, avec de nombreuses espèces de lichens survivant par chimiosynthèse alimentée par une bouche de gaz.\n\nSi nous devions établir une base ici, nous pourrions soit cultiver ces lichens, soit exploiter directement les puits de gaz pour générer de l'énergie."
    giga_birch.6004.a:99 "Nous devrions cultiver ces lichens."
    giga_birch.6004.a.desc:99 "Notre avant-poste dans les cavernes se concentrera sur la production de £food£ §Y$food$§!.\n "
    giga_birch.6004.b:99 "Exploiter ces puits de gaz."
    giga_birch.6004.b.desc:99 "Notre avant-poste dans les cavernes se concentrera sur la production d'£energy£ §Y$energy$§!.\n "

    #########################################
    # expedition 7

    giga_birch.7001:99 "La Septième Expédition"
    giga_birch.7001.desc:99 "Aidés par les relevés effectués depuis notre base avancée de la couche arctique établie lors de la sixième expédition, une analyse plus approfondie de la carte réseau de la Structure nous a donné une piste solide sur l'emplacement d'un second centre de commande.\n\nLa septième expédition, dirigée par le chef d'expédition [giga_birch_expedition_leader.GetName], partira de la base avancée avec l'objectif d'atteindre et de sécuriser le centre de commande."
    giga_birch.7001.a:99 "Nous approchons."

    giga_birch.7002:99 "Piégé sous la glace"
    giga_birch.7002.desc:99 "Le chef d'expédition [giga_birch_expedition_leader.GetName] rapporte que nos [GigaGetExplorerPlural] ont atteint leur destination. Initialement incapables de trouver quoi que ce soit, ils ont fini par découvrir une grande structure artificielle au fond d'un lac gelé à quelques dizaines de kilomètres du point d'arrivée.\n\nIl est actuellement incertain si cette structure est un autre centre de commande, car elle est à la fois significativement plus grande que celle du niveau des machines et non attachée à une flèche.\n\nLes préparatifs pour envoyer un groupe vers la structure engloutie ont déjà commencé."
    giga_birch.7002.a:99 "Pourquoi est-elle là-dessous ?"

    giga_birch_origin_expedition_7:99 "Investiguer la structure engloutie"
    giga_birch_origin_expedition_7_DESC:99 "Nos [GigaGetExplorerPlural] ont localisé une ancienne structure reposant sur le lit d'un lac glacé. Nous devons découvrir sa fonction, car il pourrait s'agir du centre de commande que nous recherchons."

    giga_birch.7003:99 "Un ancien observatoire"
    giga_birch.7003.desc:99 "Quand nos [GigaGetExplorerPlural] sont entrés dans la structure au fond du lac, ils espéraient trouver un autre centre de contrôle.\n\nCe qu'ils ont trouvé à la place était beaucoup plus localisé, et potentiellement plus directement utile pour nos propres objectifs.\n\nL'installation engloutie semble être une sorte de station d'observation, connectée à des milliers de postes de surveillance, la plupart maintenant hors ligne, certains correspondant en emplacement aux colonies en ruines communes à la couche arctique. Il semblerait qu'il s'agissait d'une sorte de grande expérience pour étudier le développement de civilisations primitives, avec ceci comme centre névralgique de l'opération. D'après ce que nous pouvons discerner, ce niveau n'a pas toujours été glacé, ce qui accrédite l'hypothèse de l'effondrement environnemental.\n\nMême dans son état délabré, cet observatoire possède encore un vaste ensemble de matériel informatique intact, et pourrait être réutilisé pour notre propre usage avec un peu de travail."
    giga_birch.7003.a:99 "Cela explique toutes ces colonies, au moins."

    giga_birch.7004:99 "Un succès et un échec"
    giga_birch.7004.desc:99 "Ce n'est peut-être pas un autre centre de commande, mais l'observatoire pourrait être un atout précieux. Sa puissance de calcul est formidable, et si des données anciennes restent dans ses supports de stockage, nous avons beaucoup à apprendre.\n\nPlus inquiétant, la mission de l'observatoire pose la question de savoir si nous étions aussi une expérience lancée il y a longtemps par les bâtisseurs de cet endroit. Nous ne pouvons pas l'exclure, mais nous ne pouvons pas le confirmer pour l'instant non plus.\n\nNous n'avons peut-être pas atteint notre objectif principal, mais armés de ces nouvelles connaissances, il devrait être plus facile à trouver."
    giga_birch.7004.a:99 "Un revers temporaire, avec un bon côté."

    giga_birch.7005:99 "Approche de l'observatoire finalisée"
    giga_birch.7005.desc:99 "Nous avons maintenant atteint le point de non-retour dans notre restauration de l'ancien observatoire. Au-delà de ce point, d'autres modifications à nos plans ruineraient nos chances de réparer l'installation, car de nombreux instruments délicats dépassent encore notre compréhension."
    giga_birch.7005.desc.science:99 "$giga_birch.7005.desc$\n\nUne fois achevée, l'installation assistera nos [root.owner.GetResearchers] dans leurs études."
    giga_birch.7005.desc.unity:99 "$giga_birch.7005.desc$\n\nUne fois achevée, l'installation assistera nos études culturelles."
    giga_birch.7005.desc.trade:99 "$giga_birch.7005.desc$\n\nUne fois achevée, la puissance de traitement brute de l'installation améliorera la précision de nos prévisions de marché."
    giga_birch.7005.a:99 "Ce sera un atout important."

    giga_birch.7006:99 "Restauration de l'observatoire terminée"
    giga_birch.7006.desc:99 "Les efforts de restauration de l'observatoire englouti sont terminés, l'installation étant restaurée à pleine capacité opérationnelle — du moins autant que notre propre technologie le permet.\n\nSa puissance de traitement abondante est déjà mise à profit, et nous nous attendons à ce qu'elle reste un élément important de notre empire pendant des décennies."
    giga_birch.7006.a:99 "Excellent."
    giga_birch.7006.a.desc:99 "Nos £district£ §Y$district_giga_origin_birch_lab_plural$§! sur [situation.target.GetName] produisent maintenant des ressources supplémentaires."

    #########################################
    # expedition 8

    giga_birch.8001:99 "La Huitième Expédition"
    giga_birch.8001.desc:99 "Notre échec à localiser un autre centre de commande lors de la septième expédition a conduit, de multiples façons, à une meilleure compréhension de la carte réseau de la Structure. Premièrement, des relevés supplémentaires du site de l'observatoire nous ont permis de réduire notre liste de sites candidats, et deuxièmement, l'observatoire lui-même a fourni une partie de la puissance de calcul nécessaire pour affiner nos modèles.\n\nLa huitième expédition, dirigée par le chef d'expédition [giga_birch_expedition_leader.GetName], se rendra sur le site candidat le plus prometteur à ce jour."
    giga_birch.8001.a:99 "Notre objectif est en vue."

    giga_birch.8002:99 "Questions d'échelle"
    giga_birch.8002.desc:99 "Le chef d'expédition [giga_birch_expedition_leader.GetName] rapporte que l'expédition est arrivée à destination, et bien qu'une tempête particulièrement violente s'abatte actuellement sur la position du convoi, ils ont établi un contact visuel avec une structure artificielle qui pourrait être le centre de commande que nous recherchons.\n\nElle est attachée à une flèche comme la première, mais la forme est significativement différente, étant beaucoup plus grande, mais globalement plus simple. Une fois la tempête passée, l'exploration proprement dite commencera."
    giga_birch.8002.a:99 "Cela semble prometteur."

    giga_birch.8003:99 "Une énigme spatiale"
    giga_birch.8003.desc:99 "Nos [GigaGetExplorerPlural] ont rencontré quelque chose d'inhabituel. La disposition de la structure qu'ils ont été envoyés explorer présente des caractéristiques indicatives d'une conception quadridimensionnelle, utilisant une variété tridimensionnelle artificielle pour avoir un espace intérieur plus grand que les dimensions extérieures ne le permettraient.\n\nIl semble que les systèmes maintenant la variété aient dysfonctionné, effondrant les seuils menant à l'intérieur, laissant des couloirs brusquement coupés par des murs parfaitement lisses.\n\nAvec notre connaissance de l'architecture quadridimensionnelle, réparer les systèmes endommagés et accéder à l'espace intérieur devrait être simple."
    giga_birch.8003.desc.wait:99 "Nos [GigaGetExplorerPlural] sont perplexes. La disposition de la structure qu'ils ont été envoyés explorer n'a simplement aucun sens.\n\nDes couloirs se terminent brusquement par des surfaces parfaitement plates sans but apparent. Des conduits d'alimentation actifs se terminent de manières qui ne pourraient pas possiblement former un circuit fermé. Les rares panneaux que nous pouvons encore discerner pointent vers des alcôves déroutantes et des impasses.\n\nLe chef d'expédition [giga_birch_expedition_leader.GetName] suggère qu'il pourrait y avoir plus ici que ce que nous pouvons voir, et que nous devrions continuer à chercher des indices sur la méthode derrière cette folie."
    giga_birch.8003.a:99 "Une conception fascinante."
    giga_birch.8003.b:99 "Nous devons être patients. Cela pourrait être la dernière pièce du puzzle."
    giga_birch.8003.b.desc:99 "Rechercher la technologie £physics_research£ §Y$giga_tech_tetradimensional_engineering$§! nous permettra de poursuivre cette ligne d'investigation."

    giga_birch_origin_expedition_8:99 "Accéder à la structure 4-D"
    giga_birch_origin_expedition_8_DESC:99 "La nature quadridimensionnelle du centre de commande nécessitera quelques réparations non conventionnelles, mais cela devrait être bien dans nos capacités."

    giga_birch.8004:99 "Voir les choses sous un nouvel angle"
    giga_birch.8004.desc:99 "À mesure que notre compréhension de la physique dimensionnelle a grandi, les mystères derrière le centre de commande et sa conception particulière se sont estompés jour après jour. Il est maintenant évident même à un examen superficiel par nos [root.GetResearchers] que sa structure est quadridimensionnelle, ce qui rétrospectivement est un choix de conception attendu.\n\nIl ne devrait pas falloir longtemps pour y accéder maintenant."
    giga_birch.8004.a:99 "Soudain, tout prend sens."

    giga_birch.8005:99 "Profondeur véritable"
    giga_birch.8005.desc:99 "Le chef d'expédition [giga_birch_expedition_leader.GetName] rapporte que les réparations sur la structure que notre expédition a étudiée sont maintenant terminées. Les systèmes maintenant sa variété tridimensionnelle disjointe ont été restaurés, et nous pouvons maintenant accéder à l'espace intérieur.\n\nÀ l'intérieur, nos [GigaGetExplorerPlural] ont trouvé exactement ce que nous cherchions : un centre de commande majeur. D'ici, nous pourrons redémarrer les systèmes de réparation de la Structure et commencer le processus de restauration.\n\nAvant cela, cependant, nous devons ranimer le coeur de la Structure.\n\nLe centre de commande nous a montré que le flux d'énergie et de matières premières est à peine suffisant pour maintenir la Structure en l'état, nous devons donc descendre encore plus profondément. Nous devons voyager jusqu'au trou noir supermassif lui-même, pour réparer les grandes foreuses gravitationnelles et les collecteurs suspendus au-dessus de son horizon des événements."
    giga_birch.8005.a:99 "Nous devons trouver un collecteur fonctionnel !"

    giga_birch.8006:99 "Prendre le contrôle (in)direct"
    giga_birch.8006.desc:99 "Nous y sommes presque. La partie la plus importante est encore devant nous, mais avec le centre de commande restauré, nous avons maintenant un degré de contrôle beaucoup plus élevé sur les systèmes de la Structure. Malgré les niveaux d'énergie extrêmement bas dans tout le réseau, nous pouvons rediriger l'énergie et les matériaux des zones moins importantes vers notre patrie pour ranimer encore plus de systèmes automatisés.\n\nLes gains de productivité seront certainement significatifs, et nous nous attendons à ce qu'ils soient encore plus importants une fois la Structure entièrement restaurée."
    giga_birch.8006.a:99 "Imaginons ce qui sera possible..."

    #########################################
    # expedition 9

    giga_birch.9001:99 "La Neuvième Expédition"
    giga_birch.9001.desc:99 "Depuis la réactivation du centre de commande lors de la huitième expédition, nos [GetResearchers] ont passé au peigne fin le plan du réseau de la Structure pour trouver un réseau d'extraction sur lequel concentrer nos efforts.\n\nPresque tous ont soit totalement échoué, soit sont trop essentiels à leurs systèmes locaux pour être désactivés, rendant les réparations délicates. Dans cet état, toute la Structure pourrait n'avoir que quelques siècles avant une défaillance catastrophique... C'est une perspective terrifiante, mais qui rend notre mission d'autant plus importante.\n\nLe chef d'expédition [giga_birch_expedition_leader.GetName] dirigera l'opération pour rechercher et réparer la foreuse gravitationnelle et le système de collecte jugés les plus appropriés pour la restauration."
    giga_birch.9001.a:99 "La dernière pièce du puzzle."

    giga_birch.9002:99 "Vacillant au bord de l'oubli"
    giga_birch.9002.desc:99 "Alors que nos [GigaGetExplorerPlural] terminent leur descente et entrent dans la couche finale, la plus basse de la Structure, ils sont frappés d'émerveillement.\n\nDevant eux, une forêt sans fin d'équipements de collecte pend vers le bas. En dessous, les profondeurs infinies et obscures s'étendent.\n\nIl fait froid ici, et un silence assourdissant préside sur le dieu encagé au coeur de la Structure.\n\nÀ peine une centaine de kilomètres séparent l'expédition de l'horizon des événements en rotation rapide, un nombre qui semble ridiculement petit comparé à l'immensité du trou noir. L'échelle et la précision de l'ingénierie requises pour construire quelque chose comme cela sont véritablement ahurissantes, et nous sommes humbles d'en être les héritiers."
    giga_birch.9002.a:99 "Incroyable."

    giga_birch.9003:99 "La foreuse gravitationnelle dormante"
    giga_birch.9003.desc:99 "Le chef d'expédition [giga_birch_expedition_leader.GetName] rapporte que nos [GigaGetExplorerPlural] ont enfin atteint leur destination.\n\nLe réseau d'extraction n'est qu'un parmi d'innombrables autres, une grande foreuse gravitationnelle similaire à nos conceptions de décompresseurs de matière. Tandis que les autres sont soit visiblement endommagés, soit simplement immobiles, celui-ci montre des signes d'être au moins minimalement fonctionnel.\n\nSi la technologie impliquée s'avère aussi étroitement liée qu'elle en a l'air, le processus de restauration devrait être relativement simple."
    giga_birch.9003.a:99 "Commencez les réparations immédiatement."

    giga_birch.9004:99 "Approche du réseau d'extraction finalisée"
    giga_birch.9004.desc:99 "Nous avons maintenant atteint le point de non-retour dans notre restauration du réseau d'extraction. Au-delà de ce point, modifier nos plans causerait des perturbations inutiles au projet et nécessiterait de recommencer."
    giga_birch.9004.desc.energy:99 "$giga_birch.9004.desc$\n\nUne fois achevés, les réseaux de collecte de particules seront priorisés, augmentant notre production d'£energy£ §Y$energy$§!."
    giga_birch.9004.desc.minerals:99 "$giga_birch.9004.desc$\n\nUne fois achevée, la foreuse de matière sera priorisée, augmentant notre production de £minerals£ §Y$minerals$§!."
    giga_birch.9004.desc.dark_matter:99 "$giga_birch.9004.desc$\n\nUne fois achevée, la foreuse de matière sera modifiée pour prioriser l'extraction de £sr_dark_matter£ §Y$sr_dark_matter$§! utilisable."
    giga_birch.9004.a:99 "Un pas de plus."

    giga_birch.9005:99 "Restauration du réseau d'extraction terminée"
    giga_birch.9005.desc:99 "Les réparations sur la foreuse gravitationnelle dormante et le réseau de collecte au coeur de la Structure sont maintenant terminées. Avec ce premier nouveau flux de matière et d'énergie, nous pouvons lancer les systèmes de réparation automatique qui ramèneront finalement la Structure à son plein fonctionnement.\n\nMaintenant, il ne reste plus qu'à attendre que les réparations préliminaires soient terminées, puis à fournir les matériaux avancés nécessaires pour finir le travail."
    giga_birch.9005.a:99 "Nous sommes si proches."
    giga_birch.9005.a.desc:99 "Notre progression s'est accélérée...\n "

    #########################################
    # ending

    giga_birch.10000:99 "L'étape finale"
    giga_birch.10000.desc:99 "Il y a quelques années, la neuvième — maintenant dernière — expédition a réussi à réparer un réseau d'extraction au coeur de la grande Structure que nous appelons notre foyer. Depuis lors, nous avons soigneusement dirigé ses systèmes d'auto-réparation pour se concentrer sur les infrastructures de transport et de distribution en préparation de l'étape finale du processus.\n\nPour ranimer complètement la Structure, nous devrons lui fournir une quantité significative de matériaux avancés."
    giga_birch.10000.a:99 "Le moment est enfin venu."
    giga_birch.10000.a.desc:99 "§HDébloque la décision :§! $decision_giga_origin_birch_restore$"

    giga_birch.10001:99 "L'aube d'une nouvelle ère"
    giga_birch.10001.desc:99 "C'est fait ! Quand nous avons appris l'existence de l'univers au-delà des cieux de notre couche natale, il était difficile de croire que [this.GetName] était autre chose que naturel. Nous avons entrepris d'explorer, d'apprendre sa vraie nature... nous ne nous attendions jamais à ce qu'elle soit si négligée, si proche de l'effondrement.\n\nAujourd'hui, nous assistons à la renaissance de notre monde. D'innombrables machines travaillent de concert pour former l'ensemble, une grande symphonie d'ingénierie si vaste et merveilleuse que nous pouvons à peine croire qu'elle soit possible.\n\nNotre insula natale d'origine, autrefois le berceau de notre civilisation, a été transformée en réserve historique, afin que nous puissions toujours nous souvenir de nos origines. La Structure vit à nouveau ; comment allons-nous l'utiliser pour façonner notre destinée ?"
    giga_birch.10001.a:99 "Vastes étendues, possibilités infinies."
    giga_birch.10001.a.desc:99 "Les districts et caractéristiques existants seront convertis en nouvelles formes.\n "

    #########################################
    ### Expedition Random Events ############
    #########################################

    giga_birch.11010:99 "Découverte sur la couche natale"
    giga_birch.11010.desc:99 "Nos [GigaGetExplorerPlural] ont fait une nouvelle découverte mineure en cartographiant notre couche natale."
    giga_birch.11010.a:99 "Excellent"

    giga_birch.11020:99 "Nouvelles données découvertes"
    giga_birch.11020.desc.exterminate:99 "Nos [GetArchaeologistPlural] fouillant les ruines de l'ancienne patrie [giga_birch_expedition_2_country.GetAdj] ont découvert un trésor de données d'exploration.\n\nBien que moins détaillées ou complètes que nos propres journaux, elles semblent utiles pour nos [GigaGetExplorerPlural]."
    giga_birch.11020.desc.trade:99 "Nos partenaires commerciaux [giga_birch_expedition_2_country.GetAdj] nous ont contactés, offrant des archives nouvellement redécouvertes de leur propre exploration d'avant notre premier contact.\n\nBien que moins détaillées ou complètes que nos propres journaux, elles semblent utiles pour nos [GigaGetExplorerPlural]."
    giga_birch.11020.desc.integrate:99 "Nos [GetResearchers] qui entretiennent les archives de la capitale [giga_birch_expedition_2_country.GetAdj] signalent la redécouverte d'archives détaillant leurs efforts d'exploration avant notre premier contact.\n\nBien que moins détaillées ou complètes que nos propres journaux, elles semblent utiles pour nos [GigaGetExplorerPlural]."
    giga_birch.11020.a:99 "Fascinant"

    giga_birch.11030:99 "Découverte sur la couche des machines"
    giga_birch.11030.desc:99 "Nos [GigaGetExplorerPlural] ont fait une nouvelle découverte mineure en cartographiant la couche des machines."
    giga_birch.11030.a:99 "Excellent"

    giga_birch.11040:99 "Manufacture en surrégime"
    giga_birch.11040.desc:99 "Les travailleurs de l'ancien complexe manufacturier restauré signalent qu'ils atteignent les quotas en avance, car certaines des machines semblent s'adapter à nos calendriers de production de manière indépendante."
    giga_birch.11040.a:99 "Excellent"

    giga_birch.11060:99 "Découverte sur la couche arctique"
    giga_birch.11060.desc:99 "Nos [GigaGetExplorerPlural] ont fait une nouvelle découverte mineure en cartographiant la couche arctique."
    giga_birch.11060.a:99 "Excellent"

    giga_birch.11070:99 "Aperçu observationnel"
    giga_birch.11070.desc:99 "Nos [GetResearchers] à l'observatoire restauré de la couche arctique signalent un afflux de nouvelles données. Il semble qu'une redirection de jonction dans le réseau d'information de la Structure nous a connectés à un ensemble de noeuds de traitement jusqu'alors inconnu."
    giga_birch.11070.a:99 "Excellent"