l_french:

    name_birch:0 "Monde Birch"
    allow_birch:0 "§HDébloque mégastructure :§! $name_birch$"
    desc_birch:0 "Le Monde Birch est un habitat véritablement gargantuesque construit autour d'un trou noir supermassif, capable d'abriter une quantité pratiquement infinie d'êtres vivants."
    allow_district_birch_orykta:0 "§HDébloque district :§! $name_birch$ $district_giga_birch_orykta$"
    desc_district_birch_orykta:0  "Permet la construction d'$district_giga_birch_orykta_plural$ sur le $name_birch$"
    allow_district_birch_ktisma:0 "§HDébloque district :§! $name_birch$ $district_giga_birch_ktisma$"
    desc_district_birch_ktisma:0  "Permet la construction d'$district_giga_birch_ktisma_plural$ sur le $name_birch$"
    allow_district_birch_physma:0 "§HDébloque district :§! $name_birch$ $district_giga_birch_physma$"
    desc_district_birch_physma:0  "Permet la construction d'$district_giga_birch_physma_plural$ sur le $name_birch$"

    pc_birch:0 "$name_birch$"
    pc_birch_desc:0 "Comprenant des centaines de couches concentriques disposées autour d'un trou noir supermassif, le $pc_birch$ est l'exemple le plus grand concevable d'un Monde-coque - une structure artificielle avec de multiples coques solides autour d'une source de gravité. Avec des trillions de planètes de terres utilisables, il peut supporter une population effectivement illimitée."
    pc_birch_adj:0 "Birch"

    pc_origin_birch:0 "$pc_birch$ en déclin"
    pc_origin_birch_desc:0 "$pc_birch_desc$\n\nCe $pc_birch$ particulier est dans un état de délabrement considérable, avec la plupart de ses systèmes actuellement hors ligne. La civilisation principale de ce monde vit sur un seul continent artificiel ou Insula, et accède à l'espace par une brèche dans la coque extérieure."
    pc_origin_birch_adj:0 "Birch"

    pc_origin_dummy_birch:0 "$pc_origin_birch$"
    pc_origin_dummy_birch_desc:0 "$pc_origin_birch_desc$"
    pc_origin_dummy_birch_adj:0 "$pc_origin_birch_adj$"

    pc_giga_edge_of_eternity:0 "$pc_melted_frozen$"
    pc_giga_edge_of_eternity_desc:0 "Une planète couverte d'océans profonds de plusieurs kilomètres. Des tempêtes mondiales font rage à la surface, et des vagues incroyablement hautes sont courantes. L'environnement de cette planète serait trop tumultueux pour permettre la colonisation, n'eût été un ancien complexe d'arcologie situé près du pôle sud de la planète."
    pc_giga_edge_of_eternity_adj:0 "$pc_melted_frozen_adj$"

    giga_birch_dummy_system:0 "Écho"
    giga_birch_dummy_system_star:0 "$giga_birch_dummy_system$"
    giga_birch_dummy_system_planet_1:0 "$giga_birch_dummy_system_star$ I"
    giga_birch_dummy_system_planet_2:0 "$giga_birch_dummy_system_star$ II"
    giga_birch_dummy_system_planet_3:0 "$giga_birch_dummy_system_star$ III"
    giga_birch_dummy_system_planet_3_moon_1:0 "$giga_birch_dummy_system_planet_3$a"
    giga_birch_dummy_system_planet_3_moon_2:0 "$giga_birch_dummy_system_planet_3$b"
    giga_birch_dummy_system_planet_3_moon_3:0 "$giga_birch_dummy_system_planet_3$c"

    giga_birch_origin_critters:0 "Gardiens antiques"
    giga_birch_origin_critters_fleet:0 "Vigiles décrépits"
    giga_birch_origin_critters_ship:0 "Vigile décrépit"

    giga_birch_start_NAME:0 "coeur en déclin"
    giga_birch_start_DESC:0 "Commencer dans le noyau galactique avec un $pc_origin_birch$."

    #################
	### Districts ###
	#################

    district_giga_birch_structure:0 "Insula primaire"
    district_giga_birch_structure_plural:0 "Insula primaire" # deliberately singular
    district_giga_birch_structure_subtitle:0 "Opérations structurelles"
    district_giga_birch_structure_desc:0 "Cette petite Insula est conçue pour abriter des équipes d'experts en expansion capables de construire des Insulae pour permettre davantage d'infrastructures sur ce $name_birch$."
    mod_district_giga_birch_structure_max:0 "Max $district_giga_birch_structure_plural$"

    district_giga_birch_structure_aiondia:0 "$district_giga_birch_structure$"
    district_giga_birch_structure_aiondia_plural:0 "$district_giga_birch_structure_plural$"
    district_giga_birch_structure_aiondia_desc:0 "Autrefois capitale rayonnante de toute la sphère Aeternite, la mégapole de §H$district_giga_birch_structure_aiondia_subtitle$§! a connu des jours meilleurs. Bien qu'elle reste incroyablement impressionnante selon presque tous les standards imaginables, une observation plus attentive révèle des signes subtils de dégradation - des bâtiments déformés en configurations absurdes en l'absence d'habitants, des réseaux de transport avec des arrêts fantômes, et un sentiment oppressant d'apathie dans les détails de la vie quotidienne.\n\nNous ne pouvons qu'imaginer ce que cela devait être à son apogée."
    district_giga_birch_structure_aiondia_subtitle:0 "Elätyksenkaupunki"

    district_giga_birch_structure_info_title:0 "Capacité d'$giga_birch_insula_name$"
    district_giga_birch_structure_info_value:0 "[GetGigaBirchInsulae]/[GetGigaBirchFinalInsulae]"
    district_giga_birch_structure_info_tooltip:0 "§HInsulae§!\nEmplacements d'Insula : §Y[GetGigaBirchFinalInsulae]§![GetGigaBirchMinInsulaePart1]\nDes modificateurs : §G+[GetGigaBirchMaxInsulaeBase]§![GetGigaBirchInsulaeFromPops][GetGigaBirchMinInsulaePart2][GetGigaBirchNextInsulaFromPops]\n\nEmplacements d'Insula utilisés : §Y[GetGigaBirchInsulae]§!\nEmplacements d'Insula libres : §Y[GetGigaBirchInsulaeFree]§!\n\n§W--------------§!\n§t$giga_birch_district_insula_tooltip$§!"
    district_giga_birch_structure_info_tooltip_per_pops:0 "\nDes pops : §G+[GetGigaBirchInsulaeFromPopsValue]§!"
    district_giga_birch_structure_info_tooltip_per_pops_next:0 "\n\nProchain emplacement d'Insula à §Y[GetGigaBirchNextInsulaFromPopsValue]§! £pop£ pops"
    district_giga_birch_structure_info_tooltip_max_title:0 "\n\n§HEmplacements d'Insula de base :§! §Y[GetGigaBirchMaxInsulae]§!"
    district_giga_birch_structure_info_tooltip_min:0 "\n\n§HEmplacements d'['concept_giga_birch_minimum_insulae', Insula minimum] :§! §Y[GetGigaBirchMinInsulaeModifier]§!\nDes modificateurs : §G+[GetGigaBirchMinInsulaeModifier]§!"
    slot_giga_birch_structure_extra_prereq:0 "Un total de §Y$@giga_birch_structure_extra_prereq|0$§! $giga_birch_insula_icon$$giga_birch_insula_name_plural$"

    concept_giga_birch_minimum_insulae:0 "Insulae minimum"
    concept_giga_birch_minimum_insulae_desc:0 "La capacité d'Insula est toujours au moins égale à cette valeur."

    giga_birch_manager_replace:0 "sont ['concept_giga_birch_manager_replacement', remplacés] par"
    concept_giga_birch_manager_replacement:0 "Échanges de gestionnaires d'Insula du Monde Birch"
    concept_giga_birch_manager_replacement_desc:0 "Les remplacements de gestionnaires d'Insula sont additifs et combinent leurs effets."

    zone_giga_birch_structure_ops_extra:0 "Extension des opérations structurelles"
    zone_giga_birch_structure_ops_extra_desc:0 "Espace supplémentaire alloué au développement des systèmes Birch."

    zone_giga_birch_structure_ops_aiondia:0 "Complexe palatial"
    zone_giga_birch_structure_ops_aiondia_desc:0 "Grandeur. Opulence. Grâce. Des concepts incarnés par le gigantesque complexe palatial au centre de la disposition hexagonale de la capitale Aeternite. Impeccable en apparence, les visiteurs s'aventurant hors des sentiers battus découvriront rapidement des systèmes automatisés peinant à trouver des matériaux pour l'entretien de la structure, ses murs moins visibles alvéolés et creux pour maintenir le vernis de perfection superficielle."

