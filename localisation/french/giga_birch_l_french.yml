    zone_giga_birch_orykta_insula_refinery_negative_mass_flavour_desc:0 "Cette Insula héberge une connexion directe à l'horizon des événements en contrebas, où d'immenses constructions fusionnent la matière extraite du $pc_core_black_hole$ en matériaux exotiques, utilisant l'énergie libérée pour produire de la $giga_sr_negative_mass$."

