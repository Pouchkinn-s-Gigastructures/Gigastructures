 MEGASTRUCTURE_SELECTION_LEGEND:0 "§HLégende des icônes :§!\n\n£galwonders£ §EDébloque $ap_galactic_wonders$§!\nCompléter cette mégastructure satisfera la condition de construction de l'avantage d'ascension §Y$ap_galactic_wonders$§!.\n\n£gigastructural£ §EDébloque $ap_gigastructural_constructs$§!\nCompléter cette mégastructure satisfera la condition de construction de l'avantage d'ascension §Y$ap_gigastructural_constructs$§!.\n\n£megaupgrade£ §EAvantage débloqué par amélioration§!\nLorsqu'elle est affichée à côté de l'une des icônes ci-dessus, indique que l'avantage ne sera débloqué que par une amélioration ultérieure de la mégastructure et ne sera pas immédiatement disponible.\n\n§LNote : Les mégastructures ajoutées par des mods autres que Gigastructural Engineering & More ne seront pas marquées par ces icônes, mais peuvent tout de même débloquer des avantages, en particulier $ap_galactic_wonders$.§!"

