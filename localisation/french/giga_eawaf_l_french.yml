  mod_damage_vs_country_type_giga_eawaf_sirens_mult:99 "Dégâts contre Sirenalia"

  giga_eawaf_outer_strife_field_modifier:99 "Influence du Champ de Discorde Extérieur"
  giga_eawaf_outer_strife_field_modifier_desc:99 "§WCe monde génère §R[THIS.giga_eawaf_planet_strife]§! §PDiscorde§! pour Sirenalia\n§WLa §PDiscorde§! n'est générée qu'en dessous de §Y90 de Stabilité§! selon :§!\n(§Y80 - Stabilité§!) x (§YPopulation de la Planète§!) x (§Y1§! + §YPourcentage de Criminalité§!)§!\n§WLes pénalités de §YStabilité§!/§YCriminalité§! sont proportionnelles au niveau de §MPuissance§! de l'Envoûteur§!\n\n§LLe Champ de Discorde Extérieur influence les habitants de ce monde, les poussant vers la haine et convertissant cette haine en §PDiscorde§! pour alimenter l'Envoûteur Voilesonique de Sirenalia. La construction de bâtiments spécifiques peut aider à atténuer ou même annuler cela.§!"

  giga_eawaf_outer_strife_field_modifier_halved:99 "Influence du Champ de Discorde Extérieur"
  giga_eawaf_outer_strife_field_modifier_halved_desc:99 "§WCe monde génère §R[THIS.giga_eawaf_planet_strife]§! §PDiscorde§! pour Sirenalia\n§WLa §PDiscorde§! n'est générée qu'en dessous de §Y90 de Stabilité§! selon :§!\n(§Y80 - Stabilité§!) x (§YPopulation de la Planète§!) x (§Y1§! + §YPourcentage de Criminalité§!)§!\n§WLes pénalités de §YStabilité§!/§YCriminalité§! sont proportionnelles au niveau de §MPuissance§! de l'Envoûteur§!\nLes effets sont §Yréduits de moitié§! par un §YChamp de Désenchantement Prototype§!.\n\n§LLe Champ de Discorde Extérieur influence les habitants de ce monde, les poussant vers la haine et convertissant cette haine en §PDiscorde§! pour alimenter l'Envoûteur Voilesonique de Sirenalia. La construction de bâtiments spécifiques peut aider à atténuer ou même annuler cela.§!"

  giga_eawaf_outer_strife_field_modifier_quartered:99 "Influence du Champ de Discorde Extérieur"
  giga_eawaf_outer_strife_field_modifier_quartered_desc:99 "§WCe monde génère §R[THIS.giga_eawaf_planet_strife]§! §PDiscorde§! pour Sirenalia\n§WLa §PDiscorde§! n'est générée qu'en dessous de §Y90 de Stabilité§! selon :§!\n(§Y80 - Stabilité§!) x (§YPopulation de la Planète§!) x (§Y1§! + §YPourcentage de Criminalité§!)§!\n§WLes pénalités de §YStabilité§!/§YCriminalité§! sont proportionnelles au niveau de §MPuissance§! de l'Envoûteur§!\nLes effets sont §Yréduits au quart§! par un §YChamp de Désenchantement Harmonisé§!.\n\n§LLe Champ de Discorde Extérieur influence les habitants de ce monde, les poussant vers la haine et convertissant cette haine en §PDiscorde§! pour alimenter l'Envoûteur Voilesonique de Sirenalia. La construction de bâtiments spécifiques peut aider à atténuer ou même annuler cela.§!"

  # Menu
  giga_sirens_spawnlater:99 "Faire apparaître les Sirènes §GPlus Tard§!\nLes Sirènes commenceront à apparaître dans les §Y5 ans§! suivant la date d'apparition sélectionnée. Si réglé sur §YGaranti§!, elles apparaîtront à la date exacte."

  giga_sirens_spawnearlier:99 "Faire apparaître les Sirènes §RPlus Tôt§!\nLes Sirènes commenceront à apparaître dans les §Y5 ans§! suivant la date d'apparition sélectionnée. Si réglé sur §YGaranti§!, elles apparaîtront à la date exacte."

  giga_sirens_randomgame:99 "Date d'Apparition de Sirenalia : §LAléatoire§!\nSirenalia apparaîtra à un moment aléatoire. La situation §YLa Prise de Pouvoir des Sirènes§! se produira §Y25 ans après§! et le §YVoile Éthéré§! se dissipera après un temps aléatoire.\n$sirens_spawn_warning$"
  giga_sirens_lateendgame:99 "Date d'Apparition de Sirenalia : §E2500§!\nSirenalia peut apparaître après §Y2500§!. La situation §YLa Prise de Pouvoir des Sirènes§! se produira §Y25 ans après§! et le §YVoile Éthéré§! durera jusqu'en 2500.\n$sirens_spawn_warning$"
  giga_sirens_regularendgame:99 "Date d'Apparition de Sirenalia : §G2450§!\nSirenalia peut apparaître après §Y2450§!. La situation §YLa Prise de Pouvoir des Sirènes§! se produira §Y25 ans après§! et le §YVoile Éthéré§! durera jusqu'en 2450.\n$sirens_spawn_warning$"
  giga_sirens_endgame:99 "Date d'Apparition de Sirenalia : §Y2400§! (Par défaut)\nSirenalia peut apparaître après §Y2400§!. La situation §YLa Prise de Pouvoir des Sirènes§! se produira §Y25 ans après§! et le §YVoile Éthéré§! durera jusqu'en 2400.\n$sirens_spawn_warning$"
  giga_sirens_latemidgame:99 "Date d'Apparition de Sirenalia : §H2350§!\nSirenalia peut apparaître après §Y2350§!. La situation §YLa Prise de Pouvoir des Sirènes§! se produira §Y25 ans après§! et le §YVoile Éthéré§! durera jusqu'en 2350.\n$sirens_spawn_warning$"
  giga_sirens_midgame:99 "Date d'Apparition de Sirenalia : §S2300§!\nSirenalia peut apparaître après §Y2300§!. La situation §YLa Prise de Pouvoir des Sirènes§! se produira §Y25 ans après§! et le §YVoile Éthéré§! durera jusqu'en 2300.\n$sirens_spawn_warning$"
  giga_sirens_lateearlygame:99 "Date d'Apparition de Sirenalia : §P2250§!\nSirenalia peut apparaître autour de §Y2250§!. La situation §YLa Prise de Pouvoir des Sirènes§! se produira §Y25 ans après§! et le §YVoile Éthéré§! durera jusqu'en 2250.\n$sirens_spawn_warning$"
  giga_sirens_earlygame:99 "Date d'Apparition de Sirenalia : §RDébut de Partie§!\nSirenalia peut apparaître proche du §YDébut de Partie§!. La situation §YLa Prise de Pouvoir des Sirènes§! commencera immédiatement et le §YVoile Éthéré§! se dissipera en moins d'un an.\n$sirens_spawn_warning$"

  sirens_spawn_warning:99 "\n§YRéglez Sirenalia sur §GGaranti§! si vous voulez vous assurer que Sirenalia apparaisse.§!\n\n§GCliquez pour changer la Date d'Apparition de Sirenalia§!"

  giga_eawaf_sirens_guaranteed:99 "Les §YSirènes§! réussiront §Gtoujours§! dans leur entreprise de prise de contrôle de §YFaust§! et deviendront ensuite une crise, à moins d'être arrêtées par le joueur."

  giga_sirens_not_guaranteed:99 "Les §YSirènes§! ont environ §Y50 %§! de chances de prendre le contrôle de §YFaust§! et de devenir une crise, sauf intervention du joueur."

  giga_eawaf_sirens_disabled:99 "Les §YSirènes§! ne tenteront pas de prendre le contrôle de §YFaust§!. Le système peut cependant toujours apparaître avec des primitifs personnalisés s'il n'est pas désactivé.\n\n§BLa crise §YSirenalia§! a été créée dans le cadre de la collaboration du §YPoisson d'Avril 2024§! avec l'équipe §YEquestria at War§!, qui a ajouté un chemin §YKaiser Kattail§! à leur propre mod.§!"

  giga_sirens_enabled:99 "Les §YSirènes§! tenteront de prendre le contrôle de §YFaust§! et deviendront éventuellement §RSirenalia§!. Elles tenteront de §Rcontrôler l'esprit§! de la galaxie entière en utilisant leur chant magique d'envoûtement !\n\n§BLa crise §YSirenalia§! a été créée dans le cadre de la collaboration du §YPoisson d'Avril 2024§! avec l'équipe §YEquestria at War§!, qui a ajouté un chemin §YKaiser Kattail§! à leur propre mod.§!"

  giga_eawaf_sirens_easy:99 "Sirenalia (§BLargo§!)\nSirenalia sera §Baffaiblie§!.\n\nLa §MPuissance§! commencera à §Y0,5§! tandis que chaque niveau de l'§YEnvoûteur Voilesonique§! l'augmentera de §Y0,25§!."

  giga_eawaf_sirens_normal:99 "Sirenalia (§GLento§!)\nSirenalia sera §Gnormale§!.\n\nLa §MPuissance§! commencera à §Y1§! tandis que chaque niveau de l'§YEnvoûteur Voilesonique§! l'augmentera de §Y0,5§!."

  giga_eawaf_sirens_hard:99 "Sirenalia (§YModerato§!)\nSirenalia sera §Yrenforcée§!.\n\nLa §MPuissance§! commencera à §Y5§! tandis que chaque niveau de l'§YEnvoûteur Voilesonique§! l'augmentera de §Y2§!."

  giga_eawaf_sirens_veryhard:99 "Sirenalia (§HAllegro§!)\nSirenalia sera §Htrès renforcée§!.\n\nLa §MPuissance§! commencera à §Y10§! tandis que chaque niveau de l'§YEnvoûteur Voilesonique§! l'augmentera de §Y5§!."

  giga_eawaf_sirens_extreme:99 "Sirenalia (§RVivace§!)\nSirenalia sera §Rextrêmement renforcée§!.\n\nLa §MPuissance§! commencera à §Y25§! tandis que chaque niveau de l'§YEnvoûteur Voilesonique§! l'augmentera de §Y10§!."

  giga_eawaf_sirens_impossible:99 "Sirenalia (§PPresto§!)\nSirenalia sera §Prenforcée à l'impossible§!.\n\nLa §MPuissance§! commencera à §Y50§! tandis que chaque niveau de l'§YEnvoûteur Voilesonique§! l'augmentera de §Y25§!."

  giga_eawaf_sirens_abyss:99 "Sirenalia (§gAbyssal§!)\n§RALORS QUE LE CYCLE EST MIS EN PIÈCES ET QUE LES MURS DE LA RÉALITÉ S'ESTOMPENT, DES PROFONDEURS DE L'EXISTENCE ELLE-MÊME S'ÉVEILLE UNE FORCE INCOMPRÉHENSIBLE.§!\n\nLa §MPuissance§! commencera à §Y1000§! tandis que chaque niveau de l'§YEnvoûteur Voilesonique§! l'augmentera de §Y500§!.\n\n§RTOUTES§! les factions pourront être envoûtées par les Sirènes."

  #Primitive Events
  d_everfree_forest:99 "Forêt Perpétuelle"
  d_everfree_forest_desc:99 "Une forêt particulière et quasi impénétrable emplie d'énergies apparemment magiques. La défricher serait une tâche titanesque, mais étudier son écosystème ésotérique produirait certainement des données fascinantes."

  giga_eawaf.7002.name:99 "Faust Entre dans l'Ère Atomique"
  giga_eawaf.7002.desc:99 "Les rapports indiquent que les primitifs habitant le monde continental particulier de §YFaust§! au sein du système §Y[giga_eawaf_system.GetName]§! ont réussi à construire et tester un engin nucléaire de faible puissance.\n\nBien qu'elles restent relativement rares et coûteuses pour l'instant, ces armes devraient proliférer de manière exponentielle à mesure que la technologie sera affinée et se répandra dans les divers États-nations de la planète.\n\nFait intéressant, au lieu de reposer sur la fission conventionnelle de l'uranium pour l'énergie, ces armes utilisent les énergies contenues dans les abondants gisements de cristaux de la planète pour libérer une puissance destructrice considérable, que notre Poste d'Observation a commencé à appeler des §Yengins thaumonucléaires§!.\n\nDésormais, si un conflit à grande échelle devait survenir sur la planète, il est voué à être significativement plus destructeur que jamais auparavant."
  giga_eawaf.7002.a:99 "Intrigant."

  giga_eawaf.7004.name:99 "Faust Sombre dans la Guerre Thaumonucléaire"
  giga_eawaf.7004.desc:99 "Notre Poste d'Observation sur §YFaust§! rapporte que, en raison de tensions extrêmement élevées au sein de la scène géopolitique de la planète, un incident relativement mineur impliquant un bateau de pêche entre deux des grandes puissances de Faust a dégénéré en un conflit à grande échelle opposant les trois continents principaux de la planète les uns aux autres.\n\nMalheureusement, l'armement thaumonucléaire s'était largement répandu, la plupart des grandes nations possédant un arsenal conséquent, ce qui signifie que le conflit s'est rapidement transformé en un événement d'extinction alors que les diverses alliances supranationales de la planète ont commencé à se lancer d'abondantes quantités d'ogives thaumonucléaires les unes sur les autres.\n\nIl n'a fallu que quelques jours pour que la surface de la planète soit complètement engloutie dans les énergies cataclysmiques libérées par les engins, transformant le monde autrefois verdoyant en une vaste tempête bouillonnante d'énergies quasi magiques couvrant toute la planète.\n\nLes scans orbitaux montrent qu'à l'exception d'une jungle étonnamment récalcitrante qui semble prospérer grâce aux énergies libérées par les engins thaumonucléaires, la civilisation primitive a été complètement anéantie."
  giga_eawaf.7004.a:99 "Une fin si violente. Regrettable."

  giga_eawaf.7006.name:99 "Faust Entre dans l'Ère Spatiale Précoce"
  giga_eawaf.7006.desc:99 "Les primitifs de §YFaust§! ont franchi une nouvelle étape cruciale dans leur évolution sociétale avec le développement des premiers engins spatiaux orbitaux capables de vol interplanétaire.\n\nAlimentés par des formes liquides des cristaux abondants de la planète, plusieurs de ces engins ont été envoyés pour explorer leur système stellaire, les primitifs commençant des incursions sérieuses dans la nature de leur système planétaire ésotérique.\n\nAvec le développement de télescopes à lentilles de cristal de plus en plus puissants, il est probable que les primitifs ont appris que l'astrogéographie particulière de leur planète est vraiment unique en son genre en étudiant des exoplanètes plus « standard ».\n\nLes tensions à travers la planète commencent à se calmer avec plusieurs des grandes puissances prenant des mesures très concrètes vers la coopération internationale, mais reste à voir si ces efforts porteront leurs fruits ou se termineront par un événement d'extinction désastreux.\n\nIl ne devrait pas falloir longtemps avant que leurs êtres particuliers ne soient prêts à nous rejoindre parmi les étoiles."
  giga_eawaf.7006.a:99 "Intéressant."

  giga_eawaf.7012.name:99 "La §YGrande Convocation Faustienne§! Atteint le FTL"
  giga_eawaf.7011.desc.eawun:99 "Notre Poste d'Observation sur §YFaust§! indique que les primitifs de la planète ont enfin conçu un propulseur supraluminique fonctionnel. Comme la plupart de leur technologie, il utilise abondamment les cristaux particuliers de la planète, les rendant étonnamment bon marché à fabriquer compte tenu de la quantité de cristaux disponibles dans leur système d'origine.\n\nLa planète elle-même a été unifiée par une entité supranationale connue sous le nom de §YGrande Convocation Faustienne§!, formée par la fédération de plusieurs des principaux gouvernements démocratiques de la planète. Bien que ces gouvernements existent encore dans une certaine mesure, la Convocation a effectivement assumé le rôle d'autorité interstellaire de Faust et sera responsable de guider l'expansion de la civilisation à travers les étoiles.\n\nCompte tenu des grandes différences culturelles et physiques entre les diverses espèces de la planète, la fédéralisation pacifique de toute la planète en un gouvernement unique est considérée comme un exploit stupéfiant, tant par l'équipage de notre Avant-poste que par la plupart des habitants de la planète.\n\nCependant, comme nous possédons la base stellaire du système, nous avons reçu une transmission de leur dirigeant, §YJungle Trek III§!, demandant que nous leur transférions la propriété de la base stellaire afin que les habitants de Faust puissent enfin commencer leur voyage interplanétaire."

  giga_eawaf.7013.name:99 "L'§YEmpire Griffonien§! Atteint le FTL"
  giga_eawaf.7011.desc.eawgriffon:99 "Notre Poste d'Observation sur §YFaust§! indique que les primitifs de la planète ont enfin conçu un propulseur supraluminique fonctionnel. Comme la plupart de leur technologie, il utilise abondamment les cristaux particuliers de la planète, les rendant étonnamment bon marché à fabriquer compte tenu de la quantité de cristaux disponibles dans leur système d'origine.\n\nLa planète elle-même a été unifiée par la guerre et la manoeuvre diplomatique par une nation impérialiste connue sous le nom d'§YEmpire Griffonien§!, qui a réussi à subjuguer la majorité des anciennes nations de la planète soit par la conquête pure et simple, soit en exerçant sa domination économique sur le reste de la planète.\n\nBien que tout le monde ne soit pas satisfait de cet arrangement, aucune puissance étrangère capable de s'opposer à l'occupation de l'Empire Griffonien ne subsiste et le sort de la planète semble donc scellé.\n\nComme nous possédons la base stellaire du système, nous avons reçu une transmission de leur dirigeant, §YGrover XI§! de la §YDynastie Grover§!, demandant que nous transférions le système sous leur contrôle, car ils l'ont habité bien plus longtemps que nous."

  giga_eawaf.7014.name:99 "La §YRépublique Socialiste Faustienne§! Atteint le FTL"
  giga_eawaf.7011.desc.eawcommunist:99 "Notre Poste d'Observation sur §YFaust§! indique que les primitifs de la planète ont enfin conçu un propulseur supraluminique fonctionnel. Comme la plupart de leur technologie, il utilise abondamment les cristaux particuliers de la planète, les rendant étonnamment bon marché à fabriquer compte tenu de la quantité de cristaux disponibles dans leur système d'origine.\n\nLa planète elle-même a été unifiée de manière quelque peu pacifique dans la §YRépublique Socialiste Faustienne§!, un gouvernement socialiste au nom approprié qui, à travers plusieurs fusions avec des alliés socialistes amicaux et quelques guerres, a réussi à imposer son contrôle sur la grande majorité des États-nations de Faust.\n\nBien que quelques nations restent indépendantes, elles sont bien trop insignifiantes pour compter face à la suprématie écrasante du nouveau gouvernement socialiste, qui promet d'apporter égalité et prospérité à toutes les créatures, quelle que soit leur espèce ou leur origine.\n\nComme nous possédons la base stellaire du système, nous avons reçu une transmission de leur dirigeant, un représentant de leur Conseil Suprême, demandant que nous leur transférions la propriété de la base stellaire."

  giga_eawaf.70141.name:99 "La §YFédération Faustienne§! Atteint le FTL"
  giga_eawaf.70141.desc:99 "Notre Poste d'Observation sur §YFaust§! indique que les primitifs de la planète ont enfin conçu un propulseur supraluminique fonctionnel. Comme la plupart de leur technologie, il utilise abondamment les cristaux particuliers de la planète, les rendant étonnamment bon marché à fabriquer compte tenu de la quantité de cristaux disponibles dans leur système d'origine.\n\nLa planète a été unie sous la direction de la §YFédération Faustienne§!, un gouvernement harmoniste qui a pris forme à l'origine dans les confins orientaux du continent Griffonien.\n\nBien qu'elle n'était à l'origine guère plus qu'une alliance militaire et économique connue sous le nom de §YFédération Fluviale§!, elle s'est finalement fédérée en un super-État qui, par la diplomatie et l'occasionnelle croisade contre les régimes autoritaires tels que le voisin Empire Griffonien, s'est finalement retrouvé comme seule hyperpuissance de la planète.\n\nIls nous contactent maintenant pour discuter du transfert du système."

  giga_eawaf.70142.name:99 "Le §YGrand Empire d'Aquileia-Wingbardy§! Atteint le FTL"
  giga_eawaf.70142.desc:99 "Notre Poste d'Observation sur §YFaust§! indique que les primitifs de la planète ont enfin conçu un propulseur supraluminique fonctionnel. Comme la plupart de leur technologie, il utilise abondamment les cristaux particuliers de la planète, les rendant étonnamment bon marché à fabriquer compte tenu de la quantité de cristaux disponibles dans leur système d'origine.\n\nLa planète elle-même a été unifiée sous la direction d'§YAquileia-Wingbardy§!, un empire créé suite à la fusion de deux des principaux États-nations de Griffonia et leur ascension subséquente en superpuissance continentale puis en hyperpuissance planétaire suite à la prise de contrôle de tout leur continent et de nombreuses entreprises militaires, économiques et coloniales outre-mer.\n\nÉtant donné que nous possédons la base stellaire du système, nous avons reçu une transmission de leur Impératrice demandant le contrôle du système en échange de ressources."

  giga_eawaf.70143.name:99 "La §YCorporation Faustienne§! Atteint le FTL"
  giga_eawaf.70143.desc:99 "Notre Poste d'Observation sur §YFaust§! indique que les primitifs de la planète ont enfin conçu un propulseur supraluminique fonctionnel. Comme la plupart de leur technologie, il utilise abondamment les cristaux particuliers de la planète, les rendant étonnamment bon marché à fabriquer compte tenu de la quantité de cristaux disponibles dans leur système d'origine.\n\nLa planète elle-même a été unifiée principalement par la puissance économique de §YKiria§!, une nation qui, suite à une industrialisation rapide et une transition vers un régime fortement capitaliste, a rapidement grandi pour dominer l'économie de la planète et est finalement devenue sa seule superpuissance par la prise de contrôle économique de nombreuses autres nations.\n\nComme nous possédons la base stellaire du système, nous avons reçu une transmission de leur Directeur, qui souhaite probablement nous acheter le système."

  giga_eawaf.70144.name:99 "§YFaust Révolutionnaire§! Atteint le FTL"
  giga_eawaf.70144.desc:99 "Notre Poste d'Observation sur §YFaust§! indique que les primitifs de la planète ont enfin conçu un propulseur supraluminique fonctionnel. Comme la plupart de leur technologie, il utilise abondamment les cristaux particuliers de la planète, les rendant étonnamment bon marché à fabriquer compte tenu de la quantité de cristaux disponibles dans leur système d'origine.\n\nLa planète elle-même a été unie sous la gouvernance d'une nation originaire de l'île d'§YHippogriffia§!, qui, suite à une prise de contrôle communiste, a entamé une campagne d'expansion rapide culminant en une grande croisade contre tous les régimes autoritaires du monde.\n\nGrâce à une utilisation extensive de l'énergie nucléaire et à des politiques hautement matérialistes, la nation naissante a réussi à sortir victorieuse et à unir la majeure partie de Faust sous son règne, la dernière nation restante capitulant relativement facilement par la suite.\n\nSuite à d'immenses investissements dans le voyage spatial et au développement rapide d'un propulseur supraluminique, le monde nouvellement uni a pris les étoiles et nous envoie maintenant une transmission enthousiaste afin d'établir des relations diplomatiques."

  giga_eawaf.70145.name:99 "Le §YFléau Redoutable§! Atteint le FTL"
  giga_eawaf.70145.desc:99 "Notre Poste d'Observation sur §YFaust§! indique que les primitifs de la planète ont enfin conçu un propulseur supraluminique fonctionnel. Comme la plupart de leur technologie, il utilise abondamment les cristaux particuliers de la planète, les rendant étonnamment bon marché à fabriquer compte tenu de la quantité de cristaux disponibles dans leur système d'origine.\n\nLa planète elle-même a été unifiée sous une sorte d'horrible « esprit de ruche » composé de formes de vie réanimées, qui a mené une grande « Croisade Sombre » contre les créatures vivantes et l'écosystème de Faust.\n\nBien qu'initialement incertain, le nombre considérable de l'esprit de ruche et sa capacité à ressusciter les morts tant de lui-même que de ses ennemis lui ont permis de triompher à la fin et de subsumer l'entièreté de Faust en lui-même.\n\nDe façon alarmante, cet esprit de ruche, connu sous le nom de « Fléau Redoutable », semble complètement réticent à toute forme de diplomatie et a lancé un assaut total sur notre Base Stellaire en utilisant des vaisseaux supraluminiques de fortune. Nous devons agir rapidement et étouffer cette menace dans l'oeuf avant qu'elle ne consume la galaxie entière !"

  giga_eawaf.70146.name:99 "Le §YDirectoire Faustien§! Atteint le FTL"
  giga_eawaf.70146.desc:99 "Notre Poste d'Observation sur §YFaust§! indique que les primitifs de la planète ont enfin conçu un propulseur supraluminique fonctionnel. Comme la plupart de leur technologie, il utilise abondamment les cristaux particuliers de la planète, les rendant étonnamment bon marché à fabriquer compte tenu de la quantité de cristaux disponibles dans leur système d'origine.\n\nLe monde a été complètement uni sous une sorte de divinité mécanique répondant au nom de §YLeopold Schmeller§!, qui était apparemment autrefois un Griffon ordinaire ayant subi de lourdes améliorations cybernétiques puis une ascension ultime dans un corps mécanique gargantuesque.\n\nIl mène depuis une croisade gargantuesque contre le reste du monde, libérant d'énormes armées de mécanismes avancés pour subsumer toute opposition et intégrer les populations organiques de Faust dans sa conscience machine toujours croissante.\n\nComme nous possédons la base stellaire du système, Leopold nous a contactés afin de négocier l'achat de Faust."

  giga_eawaf.70147.name:99 "L'§YImperium Katzenartig§! Atteint le FTL"
  giga_eawaf.70147.desc:99 "Notre Poste d'Observation sur §YFaust§! indique que les primitifs de la planète ont enfin conçu un propulseur supraluminique fonctionnel. Comme la plupart de leur technologie, il utilise abondamment les cristaux particuliers de la planète, les rendant étonnamment bon marché à fabriquer compte tenu de la quantité de cristaux disponibles dans leur système d'origine.\n\nLe monde a été complètement uni sous la direction du particulier §YKaiser Kattail§!, qui est apparu dans la nation faustienne d'§YAbyssinie§! et, malgré l'état déplorable de la nation, a réussi à accomplir une série de conquêtes stupéfiantes culminant en une guerre totale avec l'ensemble de Faust.\n\nContre toute attente, Kattail a réussi à sortir victorieux et a sécurisé son emprise sur toute la planète, commençant même une sorte de projet de méga-ingénierie sur la lune de la planète, Séléné.\n\nComme nous possédons la base stellaire du système, il nous a contactés afin de négocier l'achat du système."


  giga_eawaf.7011.a:99 "À l'écran."

  giga_eawaf.7015.name:99 "[giga_eawaf_country.GetName]"
  giga_eawaf.7015.desc.eawun:99 "Salutations, voyageurs des étoiles. La Grande Convocation Faustienne a enfin acquis la technologie nécessaire pour naviguer parmi les étoiles.\n\nCependant, nous avons remarqué que votre espèce a revendiqué notre système stellaire. En tant que tel, notre grand conseil a décidé d'offrir à votre civilisation une compensation financière de §Y7500§! £energy£ provenant de nos plus grands réacteurs cristalliques en échange de la pleine propriété du système §Y[giga_eawaf_system.GetName]§!."

  giga_eawaf.7015.desc.eawgriffon:99 "Salutations, êtres extrafaustiens. L'Empire Griffonien a enfin dompté les lois de la physique elles-mêmes, nous permettant de traverser les vastes vides entre les étoiles.\n\nCependant, nous avons remarqué que votre espèce a revendiqué notre système stellaire. En tant que tel, moi, Kaiser §YGrover XI§!, aimerais que votre espèce transfère le système sous notre contrôle, car nous l'avons habité bien plus longtemps que vous.\n\nC'est tout simplement juste."

  giga_eawaf.7015.desc.eawcommunist:99 "Salutations, voyageurs des étoiles. Les esprits les plus brillants de la République Socialiste Faustienne ont conçu un grandiose appareil capable d'atteindre d'autres étoiles.\n\nCependant, nous avons remarqué que votre espèce a revendiqué notre système stellaire. En tant que tel, notre conseil suprême a décidé d'accorder à votre civilisation une compensation financière de §Y5000§! £energy£ et §Y2500§! de nos meilleurs £consumer_goods£ en échange de la pleine propriété du système §Y[giga_eawaf_system.GetName]§!.\n\nNous espérons que vous ne nous décevrez pas."

  giga_eawaf.7015.desc.riverun:99 "Salutations, voyageurs des étoiles. La Fédération Faustienne a enfin acquis la technologie nécessaire pour naviguer parmi les étoiles.\n\nCependant, nous avons remarqué que votre espèce a revendiqué notre système stellaire. En tant que tel, nous avons décidé d'offrir à votre civilisation une compensation financière de §Y7500§! £energy£ provenant de nos plus grands réacteurs cristalliques en échange de la pleine propriété du système §Y[giga_eawaf_system.GetName]§!."

  giga_eawaf.7015.desc.jerwng:99 "Salutations, êtres extrafaustiens. Grâce aux efforts combinés de Wingbardy et d'Aquileia, notre espèce a enfin dompté les lois de la physique elles-mêmes, nous permettant de traverser les vastes vides entre les étoiles.\n\nCependant, nous avons remarqué que votre espèce a revendiqué notre système stellaire. En tant que tel, moi, Impératrice §YAlessandra Discret§!, aimerais que votre espèce transfère le système sous notre contrôle, car nous l'avons habité bien plus longtemps que vous.\n\nC'est tout simplement juste."

  giga_eawaf.7015.desc.kiria:99 "Salutations, partenaires commerciaux extrafaustiens ! Étant donné que nous avons percé les secrets du voyage supraluminique tout comme vous, nous aimerions vous proposer un marché ! Que diriez-vous de §Y7500§! £energy£ provenant de nos plus grands réacteurs cristalliques en échange de la pleine propriété du système §Y[giga_eawaf_system.GetName]§! ? Pensez aux opportunités économiques !"

  giga_eawaf.7015.desc.posada:99 "Enfin, oh comme nous avons attendu ce moment ! Peuple des Étoiles ! Les esprits les plus brillants de notre monde ont conçu un grandiose appareil capable d'atteindre d'autres étoiles.\n\nCependant, il semble que vous, Peuple des Étoiles, ayez revendiqué notre système stellaire. En tant que tel, nous aimerions vous demander gentiment de nous accorder le système, en échange d'une compensation financière de §Y5000§! £energy£ et §Y2500§! de nos meilleurs £consumer_goods£ !\n\nPuissions-nous forger un partenariat fructueux !"

  giga_eawaf.7015.desc.kaiser:99 "Salutations, extraterrestre. L'Imperium Katzenartig a maintenant débloqué le voyage supraluminique et est sur le point de se lancer dans la plus grande aventure de son histoire. En tant que tel, je demande que vous transfériez le contrôle de la base stellaire du système Faust à nous. Une compensation financière de §Y7500§! £energy£ peut être fournie, mais nous n'avons pas peur de combattre si vous refusez."

  giga_eawaf.7015.desc.dread:99 "Il n'y aura pas de repos tant que la Mort elle-même ne sera pas morte."
  giga_flavor_systems.7005.dread:99 "Postes de combat !"

  giga_eawaf.7015.desc.leopold:99 "<<SALUTATIONS, VOYAGEURS DES ÉTOILES>>\n\n<<OFFRE DE COMPENSATION POUR LA PROPRIÉTÉ DU SYSTÈME FAUST>>\n\n<<PROPOSITION : §Y7500§! £energy£>>\n\n<<REFUSEZ ET AFFRONTEZ NOTRE PUISSANCE>>"
  giga_eawaf.7015.a:99 "Vous pouvez avoir le système."
  giga_eawaf.7015.a.response:99 "[giga_eawaf_country.GetName] vous remercie pour votre coopération."
  giga_eawaf.7015.a.tooltip:99 "Nous transférerons l'intégralité du système §Y[giga_eawaf_system.GetName]§! à §Y[giga_eawaf_country.GetName]§!, y compris toute autre colonie que nous pourrions avoir dans le système."

  opinion_eaw_gave_system:99 "A Donné le Système d'Origine"
  opinion_eaw_gave_system_neighbors:99 "A Donné le Système d'Origine et ses Voisins"

  giga_eawaf.7015.b:99 "Vous pouvez avoir le système et ses voisins immédiats également."
  giga_eawaf.7015.b.tooltip:99 "Nous transférerons l'intégralité du système §Y[giga_eawaf_system.GetName]§! ainsi que les §Ysystèmes voisins§! à §Y[giga_eawaf_country.GetName]§!, y compris toute autre colonie que nous pourrions avoir dans ces systèmes.\n\n[giga_eawaf_country.GetName] en sera certainement reconnaissant."
  giga_eawaf.7015.b.response:99 "Vraiment délicieux ! [giga_eawaf_country.GetName] sera reconnaissant."

  giga_flavor_systems.7005.c:99 "Hors de question."
  giga_flavor_systems.7005.c.tooltip:99 "Nous refuserons de leur donner le système. Ils pourraient exercer des représailles contre nous."
  giga_flavor_systems.7005.c.response:99 "Sachez que nous n'avons pas peur du conflit, [ROOT.GetName]."

  giga_eaw_faust_planet_modifier:99 "Monde Imprégné de Cristaux"
  giga_eaw_faust_planet_modifier_desc:99 "Ce monde présente des gisements inhabituellement abondants de cristaux ésotériques étroitement apparentés aux Cristaux Rares. S'ils sont exploités correctement, ces cristaux peuvent être amenés à décharger des quantités d'énergie stupéfiantes."

  eaw_planet_buffs:99 "Thaumomancie"

  mod_planet_miners_rare_crystals_produces_add:99 "Cristaux Rares des Mineurs"

  giga_tech_thaumaturgic_weaponry:99 "Armement Cristallin Semi-thaumaturgique"
  giga_tech_thaumaturgic_weaponry_desc:99 "Les habitants de Faust ont conçu des fusils et des armes imprégnés de puissants cristaux qui surpassent de loin l'armement conventionnel. Bien que cela leur ait paru être de la magie, ce qui a drastiquement limité la propagation de cette technologie, une étude approfondie de la nature de ces cristaux pourrait bien nous permettre de standardiser leur utilisation au sein de nos forces armées. Cela entraînerait cependant un coût d'entretien significatif en Cristaux Rares."

  giga_eaw_crystal_army:99 "Armée Imprégnée de Cristaux"
  giga_eaw_crystal_army_desc:99 "Bien que légèrement plus fragile et moins fiable que les armes à feu classiques, l'armement à base de cristaux est décidément plus puissant. Ces soldats tirent pleinement parti du potentiel offert par ces armes thaumaturgiques."

  giga_eaw_crystal_army_drone:99 "Mécanismes Imprégnés de Cristaux"
  giga_eaw_crystal_army_drone_desc:99 "Bien que légèrement plus fragile et moins fiable que les armes à feu classiques, l'armement à base de cristaux est décidément plus puissant. Ces drones automatisés tirent pleinement parti du potentiel offert par ces armes thaumaturgiques."

  giga_eawaf.7100.name:99 "Faust Subjuguée"
  giga_eawaf.7100.desc:99 "Nos armées ont réussi à subjuguer avec succès la grande majorité des forces armées de §YFaust§! et bien que quelques irréductibles continuent de résister à nos soldats dans les régions les plus isolées de Faust, nous avons maintenant sécurisé le contrôle de tous les principaux centres de population de la planète.\n\nCependant, Faust possède un éventail inhabituellement diversifié de nations et de cultures avec au moins 2 espèces majeures différentes partageant la planète et des dizaines de sous-espèces, chacune avec ses propres idéologies et croyances.\n\nEn pratique, cela rend étonnamment difficile de maintenir la population nouvellement conquise sous contrôle et, combiné au fait que certaines des espèces susmentionnées possèdent apparemment des capacités de type psionique, cela signifie que des mouvements de résistance majeurs s'organisent déjà à travers la planète.\n\nIl ne fait aucun doute que nous finirons par subjuguer complètement les Faustiens primitifs, mais pour le moment, nous devons nous attendre à une résistance extrêmement dure à notre règne sur la planète alors que les habitants de Faust comprennent la réalité inévitable de leur nouveau statut de membres de notre civilisation."
  giga_eawaf.7100.a:99 "On s'occupera d'eux en temps voulu."

  giga_eaw_faust_harsh_resistance:99 "Résistance Acharnée"
  giga_eaw_faust_harsh_resistance_desc:99 "Les indigènes de ce monde résistent à notre règne, mais ils ne pourront pas le faire éternellement."

  giga_eawaf.7101.name:99 "Armement Cristallin"
  giga_eawaf.7101.desc:99 "En étudiant la population conquise de §YFaust§! et leurs technologies, nos soldats ont remarqué que malgré leur classification comme civilisation primitive, les Faustiens employaient un armement étonnamment puissant pour leur niveau de développement technologique.\n\nUne investigation plus approfondie a révélé que la plupart de l'armement des Faustiens tourne autour de l'utilisation d'un type exotique de §YCristaux Rares§! intégré dans leurs technologies, capable de stocker et de libérer d'énormes quantités d'énergie. Ces cristaux agissaient effectivement comme des « batteries cristallines » fournissant à leurs armes un flux d'énergie quasi inépuisable.\n\nIls sont apparemment étroitement apparentés aux Cristaux Rares que nous connaissons et ont probablement été déposés sur Faust par des siècles d'impacts de météorites provenant de la ceinture d'astéroïdes cristalline voisine, peut-être transformés en cette forme plus exotique par une perturbation locale de l'espace-temps.\n\nQuoi qu'il en soit, nos scientifiques sont impatients d'étudier ces cristaux particuliers et ont déjà présenté plusieurs propositions pour les intégrer dans notre propre armement afin de renforcer encore davantage la puissance de nos forces armées.\n\nUn scientifique a fait remarquer que si une telle civilisation devait embrasser pleinement le véritable potentiel de l'armement thaumaturgique, elle serait sans aucun doute l'une des forces les plus menaçantes de toute la galaxie. Heureusement, les habitants de Faust utilisaient les cristaux davantage comme des améliorations de leurs technologies « régulières » plutôt que de s'appuyer entièrement sur eux. Mais pour notre propre bien, nous devons espérer qu'aucune civilisation ne découvre jamais le véritable potentiel de ces technologies ésotériques et pratiquement « magiques »..."
  giga_eawaf.7101.a:99 "Intrigant."

  giga_eawaf.7016.name:99 "[giga_eawaf_country.GetName] S'empare de la Base Stellaire de [giga_eawaf_system.GetName] !"
  giga_eawaf.7016.desc:99 "Dans un mépris flagrant de notre rejet de leur demande, §Y[giga_eawaf_country.GetName]§! a mené une opération pour s'emparer de notre base stellaire dans le système §Y[giga_eawaf_system.GetName]§!.\n\nBien qu'ils aient réussi à capturer la base stellaire elle-même, nous estimons qu'il ne devrait pas être trop difficile de détruire leurs flottes et de reprendre le système ainsi que leur planète, mais notre haut commandement avertit que leurs forces terrestres sont inhabituellement puissantes pour une civilisation si jeune."
  giga_eawaf.7016.a:99 "Comment osent-ils ? Écrasez-les immédiatement !"
  giga_eawaf.7016.a.tooltip:99 "Nous allons §RDÉCLARER LA GUERRE§! à §Y[giga_eawaf_country.GetName]§! et devrons nous emparer de §YFaust§! pour mettre fin à la guerre."
  giga_eawaf.7016.b:99 "Ils peuvent avoir le système, il ne vaut rien pour nous de toute façon."
  giga_eawaf.7016.b.tooltip:99 "Le système §Y[giga_eawaf_system.GetName]§! et toutes ses planètes sont transférés à §Y[giga_eawaf_country.GetName]§!."

  giga_eawaf.7103.name:99 "Les Alicornes se Mobilisent contre l'Invasion !"
  giga_eawaf.7103.desc:99 "Notre invasion de §YFaust§! n'est certainement pas passée inaperçue par les protecteurs les plus éminents de la planète, car en effet, les cieux mêmes de §YFaust§! tremblent alors que les deux divinités célestes jumelles de la planète, connues sous les noms de §YPrincesse Celestia§! et §YPrincesse Luna§!, se mobilisent maintenant contre nous dans une tentative de sauver leur monde de la subjugation extraterrestre.\n\nNous devons nous attendre au pire, car étant donné que la puissante magie de ces entités est supposément assez puissante pour permettre aux Hélios et Séléné défiant la physique d'orbiter autour de Faust, elles sont presque certainement capables de dévaster nos forces armées.\n\nDéjà nos commandants rapportent que des divisions entières sont anéanties par de puissants rayons de magie plasmatique surchauffée manifestés par Celestia, tandis que toutes les opérations logistiques du côté nuit de la planète se trouvent entravées par une obscurité apparemment dévorante vraisemblablement lancée par Luna elle-même, rendant nos soldats impuissants dans l'obscurité de la nuit.\n\nIl est évident que subjuguer Faust va nécessiter un investissement immense de notre part, bien que si nous ne souhaitons pas affronter ces ennemis surnaturels, nous pourrions aussi simplement nous retirer complètement de ce bourbier, cependant les dommages causés à la société de Faust seront indéniablement permanents."
  giga_eawaf.7103.a:99 "Jamais nous ne nous rendrons à des chevaux parlants !"
  giga_eawaf.7103.a.tooltip:99 "§YCelestia§! et §YLuna§! se mobiliseront contre nous !"
  giga_eawaf.7103.b:99 "Ce satané caillou ne vaut pas la peine."
  giga_eawaf.7103.b.tooltip:99 "Nous nous retirerons de Faust. Cependant, la mobilisation de §YCelestia§! et §YLuna§! ainsi que de Faust dans son ensemble, combinée à la certitude que la vie extraterrestre existe, aura certainement de §Rgrandes conséquences§! sur le développement de la planète."

  giga_eawaf.10151.name:99 "Établissement d'une Base Stellaire à Faust"
  giga_eawaf.10151.desc:99 "Compte tenu des propriétés particulières du système §YFaust§!, notre équipage d'exploration a suggéré que nous établissions de toute urgence un §YAvant-poste§! dans le système afin de garantir notre capacité à continuer d'investiguer ses mystères."
  giga_eawaf.10151.a:99 "Une entreprise valable !"
  giga_eawaf.10151.b:99 "Nous avons des choses plus importantes sur lesquelles nous concentrer."

  # Relics
  r_eawaf_sirens_crystal:99 "Cristaux Abyssaux"
  r_eawaf_sirens_crystal_desc:99 "Appartenant à l'origine aux Sirènes et forgés par des moyens inconnus, ces cristaux rouges hypnotiques possèdent une magie extrêmement puissante capable d'influencer les pensées de presque n'importe quelle créature sapiente. Bien qu'il soit inconcevable que nous puissions les utiliser à leur plein potentiel comme les Sirènes le faisaient autrefois, ils peuvent néanmoins être utiles pour traiter avec des individus ou des entités politiques particulièrement problématiques."

  r_eawaf_eqg_portal:99 "Miroir de Cristal"
  r_eawaf_eqg_portal_desc:99 "Un mystérieux dispositif semblable à un portail connecté à une charmante dimension alternative peuplée d'humanoïdes primitifs et curieusement colorés fréquentant une sorte de centre éducatif. Bien que la dimension elle-même nous soit de peu d'utilité, les propriétés ésotériques du portail fournissent une incursion fascinante dans la nature sous-jacente de notre univers et de ses royaumes constitutifs. De plus, ses habitants produisent occasionnellement des pièces musicales intéressantes d'intérêt culturel."
  giga_eawaf_portal_relic_tooltip:99 "\nExtrait un ensemble envoûtant de performances musicales harmonieuses sur les mérites de l'amitié de la dimension alternative, renforçant l'unité de notre nation.\n§L« Saute en l'air, fais du bruit ! Tape du sabot, fais demi-tour ! »§!"

  giga_eawaf_eqg_portal_modifier:99 "Comédies Musicales Harmonieuses"
  giga_eawaf_eqg_portal_modifier_desc:99 "Les pièces musicales extraites de la dimension miroir fournissent à nos artistes beaucoup de matériel."
  job_entertainer_plural_with_icon:99 "Artistes"

  giga_eawaf_crystal_relic_tooltip:99 "Lance un sortilège de §Rhaine§! et de §Rdiscorde§! sur toutes les factions et empires contre lesquels nous sommes actuellement hostiles, réduisant les capacités des vaisseaux et augmentant l'agitation planétaire."

  giga_eawaf_crystal_relic_modifier:99 "Sortilège de Discorde"
  giga_eawaf_crystal_relic_modifier_desc:99 "Un sortilège de discorde est lancé sur nous."

  giga_eawaf.60252.name:99 "Sortilège de Discorde Entrant !"
  giga_eawaf.60252.desc:99 "§Y[giga_eawaf_strife_spell_caster.GetName]§! a utilisé les §YCristaux Abyssaux§! pour lancer un sortilège de discorde sur notre civilisation, réduisant la cohésion de notre peuple !"
  giga_eawaf.60252.a:99 "Malédiction !"

  giga_eawaf.60253.name:99 "Sortilège de Discorde Lancé !"
  giga_eawaf.60253.desc:99 "Grâce à des impulsions ciblées d'énergie, les §YCristaux Abyssaux§! ont déchargé leurs énergies à travers la galaxie, obscurcissant les esprits de ceux qui nous veulent du mal."
  giga_eawaf.60253.a:99 "Excellent. Qu'ils souffrent."

  GIGA_EAWAF_EQG_PORTAL:99 "Libérer les Faustiens"
  GIGA_EAWAF_EQG_PORTAL_DESC:99 "Il est impératif que nous trouvions un moyen de débarrasser Faust de l'emprise des Sirènes de peur que sa population entière ne meure d'une mort inutile."

  GIGA_EAWAF_SIRENS_COUNTRY:99 "Envoûteurs Harmoniques"
