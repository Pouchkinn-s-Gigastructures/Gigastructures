  # Star Classes
  sc_giga_eawaf_faust_shroud:99 "Linceul éthéré"

  # Megastructures
  giga_eawaf_sirens_megaphone_1:99 "Envoûteur linceulsonique"
  giga_eawaf_sirens_megaphone_1_DESC:99 "Une mégastructure ésotérique capable d'amplifier et de relayer un puissant « chant » de contrôle mental à travers le Voile pour asservir des systèmes entiers à travers des distances interstellaires."

  anti_sirens_shield:99 "Grand Rempart symphonieux"
  anti_sirens_shield_DESC:99 "Un Désenchanteur super-dimensionné protégeant l'ensemble de ce système de tous les effets provoqués par le champ de discorde des Sirènes. Annule complètement à la fois le §PChamp extérieur§! et le §RChamp intérieur§!."
  anti_sirens_shield_MEGASTRUCTURE_DETAILS:99 "$giga_list_category_kilostructure$ - $giga_list_category_miscellaneous$\nProtège complètement un système entier contre le §YChamp de discorde§!.\n§LUn Désenchanteur super-dimensionné protégeant l'ensemble de ce système de tous les effets provoqués par le champ de discorde des Sirènes.§!"
  allow_anti_sirens_shield:99 "§HDébloque la mégastructure :§! $anti_sirens_shield$"

  requires_no_existing_anti_sirens_shield:99 "$TRIGGER_FAIL$Impossible de construire en raison d'un $anti_sirens_shield$ existant."

  anti_sirens_shield_dismantle:99 "Démanteler le rempart"
  anti_sirens_shield_dismantle_DESC:99 "Nous n'avons plus besoin de ce rempart. Démantelons-le."

  # Messages
  STRIFE_FIELD_ABOUT_TO_SHRINK_TITLE:99 "Le champ de discorde va reculer"
  STRIFE_FIELD_ABOUT_TO_SHRINK_DESC:99 "Le §RChamp de discorde§! n'a pas assez de discorde pour maintenir sa taille actuelle. Sa §MPortée§! diminuera de §Y1§! dans §Y6 mois§!."

  STRIFE_FIELD_SHRINKING_TITLE:99 "Le champ de discorde recule"
  STRIFE_FIELD_SHRINKING_DESC:99 "Le §RChamp de discorde§! n'a pas assez de discorde pour maintenir sa taille actuelle. Sa §MPortée§! a diminué de §Y1§!.\nLa portée du $outer_strife_field_name$ est maintenant de §Y[giga_eawaf_country.giga_eawaf_outer_strife_field_range]§! tandis que celle du $inner_strife_field_name$ est maintenant de §Y[giga_eawaf_country.giga_eawaf_inner_strife_field_range]§!."

  STRIFE_FIELD_ABOUT_TO_GROW_TITLE:99 "Le champ de discorde va s'étendre"
  STRIFE_FIELD_ABOUT_TO_GROW_DESC:99 "Le §RChamp de discorde§! a suffisamment de discorde pour étendre ses frontières. Sa §MPortée§! augmentera de §Y1§! dans §Y6 mois§!."

  STRIFE_FIELD_GROWING_TITLE:99 "Le champ de discorde s'étend"
  STRIFE_FIELD_GROWING_DESC:99 "Le §RChamp de discorde§! a suffisamment de discorde pour étendre ses frontières. Sa §MPortée§! a augmenté de §Y1§!.\nLa portée du $outer_strife_field_name$ est maintenant de §Y[giga_eawaf_country.giga_eawaf_outer_strife_field_range]§! tandis que celle du $inner_strife_field_name$ est maintenant de §Y[giga_eawaf_country.giga_eawaf_inner_strife_field_range]§!."

  SIRENS_SWAPPING_LEADER_TITLE:99 "Changement de leader des Sirènes"
  SIRENS_SWAPPING_LEADER_DESC_ADAGIO:99 "Les §RSirènes§! sont maintenant dirigées par §HAdagio Dazzle§!.\nElle fournit des bonus aux §YDégâts§! et à la §YPortée§! des vaisseaux."
  giga_eawaf_adagio_buffs:99 "§HAdagio Dazzle§! fournit des bonus aux §YDégâts§! et à la §YPortée§! des vaisseaux."
  SIRENS_SWAPPING_LEADER_DESC_ARIA:99 "Les §RSirènes§! sont maintenant dirigées par §MAria Blaze§!.\nElle fournit des bonus à la §YPrécision§!, au §YSuivi§! et à la §YVitesse§! des vaisseaux."
  giga_eawaf_aria_buffs:99 "§MAria Blaze§! fournit des bonus à la §YPrécision§!, au §YSuivi§! et à la §YVitesse§! des vaisseaux."
  SIRENS_SWAPPING_LEADER_DESC_SONATA:99 "Les §RSirènes§! sont maintenant dirigées par §BSonata Dusk§!.\nElle fournit des bonus à la §YVitesse de construction des mégastructures§! et à la §YProduction de ['concept_giga_eawaf_war_materials']§!."
  giga_eawaf_sonata_buffs:99 "§BSonata Dusk§! fournit des bonus à la §YVitesse de construction des mégastructures§! et à la §YProduction de ['concept_giga_eawaf_war_materials']§!."

  SIRENS_MEGAPHONE_UPGRADED_TITLE:99 "Envoûteur linceulsonique amélioré"
  SIRENS_MEGAPHONE_UPGRADED_DESC:99 "L'§YEnvoûteur linceulsonique§! a été amélioré au niveau §Y[giga_eawaf_country.giga_eawaf_sirens_megaphone_level]§!. Sa §MPuissance§! est maintenant égale à §Y[giga_eawaf_country.giga_eawaf_field_potency_multiplier]§!, ce qui ajustera les malus du §PChamp extérieur§! et les pénalités d'entretien des §YDésenchanteurs§!."


  # Names
  inner_strife_field_name:99 "§RChamp de discorde intérieur§!"
  outer_strife_field_name:99 "§PChamp de discorde extérieur§!"
  NAME_Giga_Eawaf_Sirens_Megaphone:99 "Envoûteur linceulsonique — Mark [giga_eawaf_country.giga_eawaf_sirens_megaphone_level]"

  # Components
  GIGA_EAWAF_DISENCHANTER_1:99 "Désenchanteur prototype"
  GIGA_EAWAF_DISENCHANTER_1_DESC:99 "Une première version d'un dispositif capable de contrer le chant envoûtant des Sirènes en émettant un bruit énergétique spécifiquement accordé autour du vaisseau. Ces prototypes sont malheureusement coûteux et extrêmement énergivores, nécessitant un apport significatif d'énergie et de matériaux externes pour les faire fonctionner."

  GIGA_EAWAF_DISENCHANTER_2:99 "Désenchanteur accordé"
  GIGA_EAWAF_DISENCHANTER_2_DESC:99 "Ce Désenchanteur amélioré et rationalisé s'appuie sur les prototypes précédents pour contrer plus efficacement le chant des Sirènes par le bruit énergétique. Bien qu'ils n'entravent pas autant le mouvement du vaisseau, la complexité même impliquée dans la génération du bruit psionique adéquat entraîne des exigences logistiques toujours croissantes à mesure que ces dispositifs se perfectionnent."

  GIGA_EAWAF_DISENCHANTER_3:99 "Désenchanteur symphonieux"
  GIGA_EAWAF_DISENCHANTER_3_DESC:99 "La sophistication continue des Désenchanteurs non seulement annule le champ extérieur, mais permet enfin à ces nouveaux designs de s'aventurer dans le champ intérieur des Sirènes. Les coûts de maintenance continuent cependant d'augmenter."

  GIGA_EAWAF_DISENCHANTER_4:99 "Désenchanteur euphonique"
  GIGA_EAWAF_DISENCHANTER_4_DESC:99 "Ce design de Désenchanteur parfait permet à nos vaisseaux de contrer complètement les effets du chant envoûtant des Sirènes, les rendant essentiellement immunisés à tout ce que les Sirènes pourraient leur lancer. Cela s'accompagne malheureusement de coûts gargantuesque requis pour maintenir ces dispositifs dans les profondeurs du champ de discorde."

  GIGA_EAWAF_ENTHRALLING_BEAM:99 "Rayon envoûtant"

  GIGA_EAWAF_COMPUTER_KAMIKAZE:99 "Interface précognitive (Kamikaze)"
  GIGA_EAWAF_KAMIKAZE_BEHAVIOR_DESC:99 "§HTactiques kamikaze :§! Le vaisseau chargera jusqu'à l'ennemi et attaquera à bout portant."
  # GIGA_EAWAF_KAMIKAZE_FLEET_EFFECT:99 "§YCollateral Damage:§! Deals §G$@giga_eawaf_sirens_kamikaze_damage|0G$§! damage to all ships within §G$@giga_eawaf_sirens_kamikaze_range|0Y$§! of the target."

  GIGA_EAWAF_PANOPTICON_AURA:99 "Mini-champ de discorde"
  aura_panopticon:99 "$aura_category_offensive$"

  GIGA_EAWAF_GRAND_VOID_BEAM:99 "Grand rayon du vide"
  GIGA_EAWAF_GRAND_VOID_BEAM_DESC:99 "Ce rayon gargantuesque a l'effet intéressant de maximiser psioniquement l'entropie de sa cible, le rendant très efficace contre les systèmes de boucliers."

  GIGA_EAWAF_CRYSTAL_IMPACTOR:99 "Impacteur cristallin"
  GIGA_EAWAF_CRYSTAL_IMPACTOR_DESC:99 "L'impacteur cristallin s'appuie sur des cristaux thaumaturgiques imprégnés d'une sentience partielle afin de produire des projectiles poursuivants dévastateurs à des vitesses extrêmement élevées destinés à endommager et pénétrer les blindages."

  GIGA_EAWAF_CRYSTAL_ARTILLERY:99 "Artillerie cristalline"
  GIGA_EAWAF_CRYSTAL_ARTILLERY_DESC:99 "Ces artilleries tirent de gros projectiles cristallins imprégnés d'énergie psionique excédentaire les rendant quelque peu instables et donc très efficaces contre les défenses ennemies en général."

  GIGA_EAWAF_CRYSTAL_AUTOCANNON:99 "Autocanon cristallin"
  GIGA_EAWAF_CRYSTAL_AUTOCANNON_DESC:99 "Ces autocanons projettent une volée de cristaux thaumaturgiques tranchants comme des rasoirs qui, bien qu'ils aient du mal à percer les blindages épais et soient généralement arrêtés net par les boucliers, peuvent absolument dévaster la coque plus fragile des vaisseaux énergétiques si elle se trouve exposée."

  GIGA_EAWAF_STRIKE_CRAFT:99 "Leurres de harcèlement"
  GIGA_EAWAF_STRIKE_CRAFT_DESC:99 "Au lieu d'être des chasseurs d'assaut plus conventionnels, ces chasseurs à haute santé n'existent que pour submerger, harceler et désorienter les chasseurs ennemis et les systèmes de défense ponctuelle, aidant ainsi nos autres armes à infliger plus de dégâts."

  GIGA_EAWAF_PSIONIC_CHARGE:99 "Charge thaumaturgique"
  GIGA_EAWAF_PSIONIC_CHARGE_DESC:99 "Ce design de missile peu orthodoxe s'appuie sur une boule de cristaux thaumaturgiques chargés lancée à travers le vide spatial. Guidée par une sentience partielle ne souhaitant que voir la destruction de ses adversaires, elle peut glisser à travers boucliers et blindages pour causer un carnage maximum sur ses ennemis détestés."

  GIGA_EAWAF_KAMIKAZE:99 "Foreuse cristalline"

  weapon_type_sirens:99 "Thaumaturgique"

