  # ARMIES
  eawaf_army:99 "Armée thaumaturgique"
  eawaf_army_desc:99 "Armée thaumaturgique"

  eaw_early_army:99 "Armée industrielle améliorée aux cristaux"
  eaw_early_army_desc:99 "Ces forces armées ont été équipées d'une variété d'armements à base de cristaux."

  giga_eaw_crystal_army:99 "Armée infusée de cristaux"
  giga_eaw_crystal_army_desc:99 "Bien que légèrement plus fragile et moins fiable que les armes à feu conventionnelles, l'armement à base de cristaux est nettement plus puissant. Ces soldats exploitent pleinement le potentiel offert par ces armes thaumaturgiques."

  giga_eaw_crystal_army_drone:99 "Automates infusés de cristaux"
  giga_eaw_crystal_army_drone_desc:99 "Bien que légèrement plus fragiles et moins fiables que les armes à feu conventionnelles, les armements à base de cristaux sont nettement plus puissants. Ces drones automatisés exploitent pleinement le potentiel offert par ces armes thaumaturgiques."

