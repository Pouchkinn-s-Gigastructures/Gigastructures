l_french:

  # ARMIES
  eawaf_army:0 "Armée thaumaturgique"
  eawaf_army_celestia:0 "Alicorne"
  eawaf_army_luna:0 "Alicorne"

  eawaf_sirens_army:0 "Armée abyssale"

  # EVENTS

  # Point the player towards Faust
  giga_eawaf.1001.name:0 "L'étoile clignotante"
  giga_eawaf.1001.desc:0 "Depuis que notre espèce a commencé à cartographier les étoiles — d'abord à l'aide de télescopes optiques primitifs, puis via des satellites orbitaux, et maintenant avec des émetteurs tachyoniques — il y a toujours eu un certain nombre de systèmes se comportant de manière inattendue.\n\nLes causes de confusion les plus courantes parmi nos astronomes étaient généralement des variations de luminosité stellaire et des motifs de transit d'exoplanètes irréguliers, mais à mesure que notre compréhension de la physique grandissait, ces mystères ont pu être correctement évalués, analysés et résolus. La plupart du temps, il s'avérait qu'il ne s'agissait que de simples mesures erronées de nos télescopes primitifs, et dans les autres cas, l'étude de ces phénomènes nous a permis d'améliorer encore notre compréhension des exoplanètes et du comportement stellaire.\n\nPourtant, malgré l'amélioration continue de nos télescopes et notre compréhension toujours croissante du cosmos, un système en particulier continue de défier absolument tous les modèles d'astrophysique — l'étoile mystérieuse appelée §YFaust§!. Bien qu'elle puisse à première vue ressembler à une étoile ordinaire — quoique faible —, quiconque passe plus de quelques heures à observer le système remarquera que l'étoile semble simplement... disparaître, avant de réapparaître environ douze heures plus tard, puis de disparaître à nouveau douze heures après.\n\nSurnommée « l'étoile clignotante » par nos astronomes, aucune théorie n'a réussi à expliquer la disparition régulière de l'étoile et il est devenu évident que la seule façon de percer ce mystère serait de nous y rendre nous-mêmes. Heureusement, avec la découverte récente du voyage supraluminique, une telle investigation directe est enfin dans le domaine du possible, et la perspective de résoudre enfin ce mystère fait déjà bourdonner toute notre communauté scientifique d'excitation."
  giga_eawaf.1001.a:0 "Mettons-nous au travail, alors."
  giga_eawaf.1001.a.tooltip:0 "§BCe système et tout ce qui s'y rapporte font partie de la collaboration du §YPoisson d'avril 2024§! avec le mod §YEquestria at War§! pour HOI4 ! Si, pour une raison quelconque, vous ne souhaitez pas participer à cette chaîne d'événements, le système peut être désactivé via le Gigamenu, mais je vous recommande de lui donner une chance !§!"

  giga_eawaf_faust_chain_title:0 "Mystères de Faust"
  giga_eawaf_faust_chain_desc:0 "Le système Faust défie toute logique. Il est primordial que nous l'investiguions davantage !"

  giga_eawaf_sirens_chain_title:0 "Sirenalia"
  giga_eawaf_sirens_chain_desc:0 "Les Sirènes sont déterminées à envoûter toute la galaxie. Elles doivent être arrêtées !"

  giga_eawaf_faust_name:0 "L'étoile clignotante"
  giga_eawaf_faust_desc:0 "Le système Faust « clignote » — alternant entre être visible et invisible à des intervalles d'environ douze heures. Il est évident que la seule façon d'élucider ce mystère sera simplement de nous y rendre nous-mêmes."

  giga_eawaf_poi_sirens_stats_name:0 "Traquer les Sirènes"
  giga_eawaf_poi_sirens_stats_desc:0 "§RDiscorde totale§! - [giga_eawaf_country.giga_eawaf_total_strife]\nLes Sirènes se nourrissent et prospèrent grâce à la §RDiscorde§! — la « manifestation » de la haine et du mépris. Toute planète dans le §PChamp extérieur§! générera de la §RDiscorde§! en fonction de la §YPopulation§!, de la §YCriminalité§! et de la §YStabilité§!, les deux dernières étant affaiblies par le §PChamp extérieur§!.\n\n§MNiveau de portée du champ de discorde§! - [giga_eawaf_country.giga_eawaf_outer_strife_field_range_level]\n§RPortée du champ de discorde intérieur§! - [giga_eawaf_country.giga_eawaf_inner_strife_field_range]\n§PPortée du champ de discorde extérieur§! - [giga_eawaf_country.giga_eawaf_outer_strife_field_range]\n§YSeuil de discorde avant expansion du champ§! - [giga_eawaf_country.giga_eawaf_strife_field_range_next_level_cost]\n§YSeuil de discorde avant recul du champ§! - [giga_eawaf_country.giga_eawaf_strife_field_range_prev_level_cost]\nPlus les Sirènes ont de §RDiscorde§!, plus leur sort portera loin. Le champ reculera cependant si les Sirènes reçoivent insuffisamment de §RDiscorde§! pour le maintenir. Il ne peut changer de taille qu'une fois tous les §Y2,5 ans§!.\n\n\n§MPuissance du champ de discorde§! - [giga_eawaf_country.giga_eawaf_field_potency_multiplier]\nPlus la puissance du champ est élevée, plus les malus qu'il causera aux vaisseaux et planètes seront puissants.\n\n§YMatériel de guerre actuel§! - [giga_eawaf_country.giga_eawaf_sirens_warmaterial_count]\n§YNiveau de l'envoûteur voilosonique§! - [giga_eawaf_country.giga_eawaf_sirens_megaphone_level] \n§YCoût du niveau suivant de l'envoûteur voilosonique§! - [giga_eawaf_country.giga_eawaf_sirens_megaphone_next_level_cost]\nCes matériaux représentent le stock de ressources avancées des Sirènes, généré par leur population sur les mondes capturés. Ils sont utilisés pour fabriquer des vaisseaux et améliorer l'§YEnvoûteur voilosonique§! pour intensifier ses effets, augmentant les malus qu'il applique aux planètes et vaisseaux à portée."

  # Initial survey line
  giga_eawaf.1010.name:0 "Géocentrique"
  giga_eawaf.1010.desc:0 "Le §Y[ROOT.GetName]§! a atteint le système §YFaust§!, dans l'espoir d'apporter la solution au mystérieux phénomène de « l'étoile clignotante » qui a laissé perplexes astronomes et scientifiques pendant des siècles.\n\nEt, par une ironie du sort, cette solution ne résidait pas dans nos théories les plus avancées, mais plutôt dans la toute première interprétation erronée de l'espace que notre espèce a conçue pour expliquer le mouvement des étoiles dans le ciel — le géocentrisme.\n\nLe système §YFaust§! est, d'une manière ou d'une autre, centré autour de Faust elle-même, un monde tellurique autour duquel plusieurs planètes plus petites (ou lunes) orbitent aux côtés de rien de moins qu'un soleil miniature fournissant chaleur et lumière à Faust.\n\nLes mesures des émissions spectrales de l'étoile montrent qu'elle se comporte plus ou moins comme une étoile de classe G typique bien que son diamètre ne dépasse pas trois mille kilomètres. Avec une taille si petite, elle devrait logiquement être soit une étoile à neutrons soit guère plus qu'une géante gazeuse, et pourtant... la voilà, orbitant diligemment autour de Faust en vingt-quatre heures, passant derrière la planète toutes les douze heures et disparaissant de la vue avant de réapparaître de l'autre côté.\n\nBien que le mystère de « l'étoile clignotante » soit enfin résolu, il semble qu'il y aura encore beaucoup de travail avant que nous ayons vraiment une idée de ce qui se passe dans cet étrange système."
  giga_eawaf.1010.a:0 "Comme c'est particulier."

  giga_eawaf.1011.name:0 "Cristaux thaumaturgiques"
  giga_eawaf.1011.desc:0 "La ceinture d'astéroïdes orbitant autour de Faust est remplie de nombreux affleurements d'étranges cristaux violet-rose différents de tout ce que nous avons rencontré auparavant.\n\nDes expériences préliminaires indiquent que des échantillons de ces cristaux « stockent » une forme d'énergie éthérée dans leurs matrices moléculaires, qui peut ensuite être « libérée » en impulsant des stimuli spécifiques dans les cristaux, souvent avec des résultats destructeurs.\n\nTout espoir d'utiliser cela dans nos systèmes d'armes et d'énergie a cependant été anéanti lorsque toutes les tentatives de sortir les cristaux du système Faust ont entraîné la dissipation spontanée de cette charge innée et la fragmentation des cristaux en de nombreux morceaux de roche jolis, mais inutiles.\n\nIl est évident qu'il existe une propriété innée au système Faust qui « alimente » ces cristaux en énergie, mais l'origine réelle de cette énergie échappe jusqu'à présent complètement à nos scientifiques."
  giga_eawaf.1011.a:0 "Curieux."

  giga_eawaf.1012.name:0 "Satellite cauchemardesque"
  giga_eawaf.1012.desc:0 "§YSéléné§!, la lune rocheuse orbitant autour de Faust à l'opposé du mystérieux §YHélios§!, semble, à première vue, être la partie la plus normale du système Faust. C'est une lune rocheuse relativement grande criblée de nombreux cratères d'impact en raison de son absence d'atmosphère et recouverte d'une fine couche de poussière lunaire comme beaucoup d'autres satellites naturels.\n\nLes premiers signes d'anomalie sont ironiquement apparus lorsque l'équipage du §Y[ROOT.GetName]§! a commencé à se reposer. Dès qu'ils se sont approchés de la lune, les rêves habituellement agréables de l'équipage ont commencé à se transformer en cauchemars atroces, la plupart d'entre eux rapportant avoir été visités dans leur sommeil par une figure équine sombre et imposante, portant des promesses de vengeance et de ténèbres éternelles engloutissant des mondes entiers.\n\nBien que ces cauchemars aient cessé dès que le vaisseau s'est éloigné de la lune, beaucoup croient maintenant que le corps céleste est « hanté » par un esprit vengeur inconnu, et le [Owner.GetScientist] §Y[ROOT.GetLeaderName]§! semble avoir été profondément impacté par ces terreurs nocturnes..."
  giga_eawaf.1012.a:0 "C'est dans leur tête... n'est-ce pas ?"
  giga_eawaf.1012.desc_machine_intelligence:0 "§YSéléné§!, la lune rocheuse orbitant autour de Faust à l'opposé du mystérieux §YHélios§!, semble, à première vue, être la partie la plus normale du système Faust. C'est une lune rocheuse relativement grande criblée de nombreux cratères d'impact en raison de son absence d'atmosphère et recouverte d'une fine couche de poussière lunaire comme beaucoup d'autres satellites naturels.\n\nLes premiers signes d'anomalie sont ironiquement apparus lorsque l'équipage du §Y[ROOT.GetName]§! s'est approché de la lune. Ils ont commencé à se comporter de manière erratique et ont signalé des artefacts visuels apparaissant comme une figure équine sombre et imposante.\n\nBien que ces erreurs visuelles aient cessé dès que le vaisseau s'est éloigné de la lune, on pense que le corps céleste pourrait être « hanté » par un esprit vengeur inconnu."
  giga_eawaf.1012.desc_hive_mind:0 "§YSéléné§!, la lune rocheuse orbitant autour de Faust à l'opposé du mystérieux §YHélios§!, semble, à première vue, être la partie la plus normale du système Faust. C'est une lune rocheuse relativement grande criblée de nombreux cratères d'impact en raison de son absence d'atmosphère et recouverte d'une fine couche de poussière lunaire comme beaucoup d'autres satellites naturels.\n\nLes premiers signes d'anomalie sont ironiquement apparus lorsque l'équipage du §Y[ROOT.GetName]§! s'est approché de la lune. Ils ont commencé à se comporter de manière erratique et ont signalé des hallucinations apparaissant comme une figure équine sombre et imposante.\n\nBien que ces visions aient cessé dès que le vaisseau s'est éloigné de la lune, on pense que le corps céleste pourrait être « hanté » par un esprit vengeur inconnu."
  giga_eawaf.1012.b:0 "Déconcertant"

  giga_eawaf.1013.name:0 "Soleil improbable"
  giga_eawaf.1013.desc:0 "On espérait qu'une inspection plus rapprochée d'§YHélios§! pourrait éclairer ce mystérieux corps céleste, et pourtant il continue de se comporter de manière apparemment impossible.\n\nTout d'abord, les périodes orbitales d'Hélios et de Séléné de vingt-quatre heures sont bien plus courtes qu'elles ne devraient l'être, les calculs basés sur la masse de Faust estimant qu'elles devraient logiquement prendre environ deux semaines pour orbiter autour de la planète.\n\nDe plus, bien que leurs orbites restent circulaires et prévisibles, les deux corps sont sujets à des « tremblements » quasi imperceptibles à des points apparemment aléatoires de leurs orbites, comme s'ils étaient soudainement « tirés » par une force inexpliquée.\n\nÉvidemment, s'attendre à ce que les orbites fonctionnent normalement dans un système où les étoiles tournent autour des planètes est déjà assez déraisonnable, mais ces anomalies ne font qu'ajouter à la pile sans cesse croissante de mystères non résolus entourant Faust.\n\nDe plus, l'étoile semble puiser de l'énergie littéralement de nulle part, car elle émet bien plus de rayonnement que tout processus de fusion connu ne pourrait jamais générer, brisant parfois même le principe fondamental d'équivalence masse-énergie."
  giga_eawaf.1013.a:0 "Mais comment ça FONCTIONNE ?"

  giga_eawaf.1014.name:0 "Équidés en guerre"
  giga_eawaf.1014.desc:0 "Comme si le système n'était pas assez étrange, non seulement son monde central de §YFaust§! est entièrement habitable grâce à la lumière d'Hélios, mais une multitude d'émissions radio émanant de sa surface trahit le fait que le monde est, en fait, habité !\n\nLa planète est partagée par environ une douzaine d'espèces, toutes pleinement sapientes et capables de pensée complexe, qui ont atteint un niveau de développement technologique équivalent approximativement à l'ère des machines. Cependant, beaucoup de ces espèces, notamment les plus équines, présentent une variété de capacités surnaturelles, comme une agriculture ridiculement efficace, le vol ou la télékinésie, pour n'en citer que quelques-unes.\n\nD'importants gisements des cristaux thaumaturgiques trouvés dans la ceinture d'astéroïdes du système ont également été localisés à travers tout le monde, certaines de ses espèces indigènes en faisant un usage significatif pour renforcer et catalyser leurs capacités naturelles. Cela a conduit nos scientifiques à croire que les cristaux et ces capacités sont liés d'une manière ou d'une autre.\n\nFait intéressant, nous arrivons peut-être juste à temps pour assister à un tournant dans l'histoire de la planète, car plusieurs espèces atteignent le point où les développements des méthodes expérimentales devraient leur permettre d'augmenter considérablement leur propre compréhension de leurs capacités et des cristaux. Cela aura probablement des conséquences considérables et pourrait modifier drastiquement leur développement technologique.\n\nLe §Y[ROOT.GetName]§! rapporte qu'une petite équipe a été déployée à la surface afin d'espérer glaner plus d'informations sur le fonctionnement de cette civilisation multi-espèces particulière avant qu'un poste d'observation plus permanent ne soit établi."
  giga_eawaf.1014.a:0 "Maintenant, espérons qu'ils ne se fassent pas exploser."

  giga_eawaf.10141.name:0 "Rapport d'investigation sur Faust"
  giga_eawaf.10141.desc:0 "Notre expédition à la surface de §YFaust§! s'est déroulée sans problèmes significatifs, tout en apportant des quantités copieuses de données concernant la civilisation indigène de la planète, ou plutôt les civilisations.\n\nLes terres émergées de la planète sont divisées en trois grandes masses continentales, les deux plus petites au nord étant surnommées §YEquus§! et §YGriffonia§!, tandis que la plus grande, connue sous le nom de §YZebrica§!, est située presque entièrement dans l'hémisphère sud. Ces continents sont incroyablement diversifiés, chacun d'eux abritant plusieurs espèces sapientes distinctes.\n\nBien que les espèces indigènes aillent des humanoïdes bipèdes connus sous le nom de §YYétis§! aux ursidés quadrupèdes connus simplement sous le nom d'§YOurs§! et aux aviens connus sous le nom de §YGriffons§!, une part significative de ces espèces ressemble à des créatures équines et a donc été surnommée §YÉquidéens§!.\n\nC'est cependant un terme générique englobant plusieurs espèces, comme les §YPoneys§! particulièrement petits mais thaumaturgiquement doués (qui, aux côtés des Griffons, sont de loin l'espèce la plus peuplée, étant présents sur les trois continents), les §YZèbres§! adaptés aux climats désertiques, les §YChevaux§! plus grands, et les plus exotiques §YKirins§! natifs de l'extrême est de Zebrica.\n\nCependant, la caractéristique la plus intéressante mais aussi la plus dangereuse de Faust est peut-être l'existence de plusieurs entités semblables à des demi-dieux parcourant la surface de la planète. Connues sous le nom d'§YAlicornes§!, elles sont dotées de capacités de manipulation de la réalité extrêmement puissantes et semblent agir comme les dirigeantes largement incontestées d'§YEquestria§!, l'État-nation le plus puissant de la planète.\n\nLe consensus parmi les membres de notre expédition est que la puissance même de ces Alicornes signifie que toute tentative d'invasion de Faust serait §Rextrêmement déconseillée§!, et il est donc probablement bien plus sûr d'observer simplement le monde de loin."
  giga_eawaf.10141.a:0 "Quel monde particulier."
  giga_eawaf.10141.b:0 "C'est FASCINANT ! Nous devons en apprendre davantage !"

  giga_eawaf.1015.name:0 "Le mystère faustien"

  giga_eawaf.1015.desc.nopsi:0 "Le système §YFaust§! a maintenant été entièrement exploré par le §Y[ROOT.GetName]§!, et bien que le mystère du « soleil clignotant » ait facilement été expliqué par le transit d'Hélios derrière Faust, cette exploration a apporté plus de questions qu'elle n'en a vraiment résolues.\n\nComment Hélios fonctionne-t-il ? Quelle est la source des étranges cauchemars survenant à proximité de Séléné ? D'où les cristaux thaumaturgiques tirent-ils leur énergie ? Et, surtout, quel phénomène, s'il y en a un, sous-tend tout cela ?\n\nBien que de nombreuses théories aient été conçues pour essayer de tout relier, aucune d'entre elles ne parvient vraiment à décrire avec précision les mystères du système Faust sans inévitablement rencontrer des lacunes majeures ailleurs. Il semble que, pour le moment, Faust et ses mystérieux habitants resteront une énigme."
  giga_eawaf.1015.nopsi:0 "Peut-être qu'avec le temps, notre compréhension sera suffisante..."
  giga_eawaf.1015.nopsi.tooltip:0 "Nous pourrions éventuellement obtenir plus d'informations sur Faust si nous recherchons les technologies appropriées."

  giga_eawaf.1015.desc.psi:0 "Le système §YFaust§! a maintenant été entièrement exploré par le §Y[ROOT.GetName]§!, et bien que le mystère du « soleil clignotant » ait facilement été expliqué par le transit d'Hélios derrière Faust, cette exploration a apporté plus de questions qu'elle n'en a vraiment résolues.\n\nComment Hélios fonctionne-t-il ? Quelle est la source des étranges cauchemars survenant à proximité de Séléné ? D'où les cristaux thaumaturgiques tirent-ils leur énergie ? Et, surtout, quel phénomène, s'il y en a un, sous-tend tout cela ? Bien que de nombreuses théories aient été conçues pour essayer de tout relier, une théorie en particulier s'est démarquée de toutes les autres : la possibilité d'une interférence psionique.\n\nSelon notre compréhension, les psioniques semblent provenir d'une sorte de royaume immatériel au-delà de notre réalité, et bien que les détails de ce royaume restent flous, certains ont suggéré que le système Faust pourrait se trouver dans une zone de la réalité où le voile entre notre réalité et ce royaume est plus mince.\n\nLa théorie, qui montre jusqu'à présent un grand potentiel pour expliquer tous les mystères de Faust, a rapidement gagné en popularité, au point que notre communauté scientifique pousse maintenant pour une investigation plus approfondie du système afin de déterminer si cette théorie tient vraiment la route."
  giga_eawaf.1015.psi:0 "Il n'y a pas de temps à perdre !"

  giga_eawaf.1015.b:0 "Franchement, nous en avons assez vu."
  giga_eawaf.1015.b.tooltip:0 "Nous ne mènerons pas d'autres incursions dans les mystères de Faust."

  GIGA_EAWAF_SURVEY_HELIOS:0 "Investiguer Hélios"
  GIGA_EAWAF_SURVEY_HELIOS_DESC:0 "Il y a des preuves que les bizarreries du système Faust sont causées par une interférence psionique. Nous devrions mener une investigation approfondie de son étoile mystérieuse immédiatement."

  giga_eawaf.1016.name:0 "Eurêka psionique"
  giga_eawaf.1016.desc:0 "Nos récentes incursions dans les domaines de la §YPsionique§! ont poussé nos scientifiques à réévaluer de nombreuses découvertes et théories antérieures sous un nouvel angle.\n\nParmi celles-ci se trouve nul autre que le mystérieux système de §YFaust§!, dont les cristaux thaumaturgiques, l'étoile miniature et les créatures apparemment magiques ont obstinément résisté à notre compréhension de la physique depuis l'exploration du système.\n\nCependant, grâce à la perspective renouvelée fournie par nos aperçus de ce qui se trouve au-delà du monde matériel, certains de nos scientifiques ont suggéré que nous revisitions le système Faust afin d'essayer de voir s'il y avait peut-être plus qu'il n'y paraît..."
  giga_eawaf.1016.a:0 "Mettons-nous-y immédiatement !"

  giga_eawaf.1017.name:0 "Fusion psicatalysée"
  giga_eawaf.1017.desc:0 "Bien que cela ait nécessité un investissement significatif, tant en temps qu'en ressources, nos scientifiques pensent avoir enfin percé les mystères du fonctionnement interne d'Hélios, ainsi que du reste du système Faust.\n\nDes expériences sur la sensibilité psionique des télépathes ont confirmé que tout le système se trouve dans un espace où le voile entre la réalité et l'immatérium est plus mince, permettant l'apparition de phénomènes surnaturels. Comme les systèmes se déplacent constamment dans l'espace, nos scientifiques ont conclu qu'il devait y avoir une sorte de phénomène causant cet « amincissement » de la réalité, et ont entrepris de sonder Hélios lui-même pour essayer de trouver des réponses.\n\nGrâce à des sondes protégées thermiquement plongeant dans les profondeurs de cet enfer ésotérique, il a été découvert qu'au coeur d'Hélios se trouve une « faille » miniature dans la réalité elle-même, menant supposément directement à un royaume d'énergie psionique pure. La matière du centre d'Hélios tombe régulièrement dans cette faille avant de réapparaître sous forme d'énergie psionique bouillonnante et surchauffée. Cette énergie « flotte » ensuite jusqu'aux couches externes d'hydrogène d'Hélios et déclenche des réactions de fusion nucléaire.\n\nPar des processus mal compris, l'énergie psionique « épuisée » se « condense » alors en noyaux d'hydrogène, qui sont eux-mêmes enflammés par l'énergie psionique fraîche. Les noyaux d'hélium fusionnés, en raison de leur masse plus élevée, retombent ensuite dans la faille et le cycle se répète essentiellement indéfiniment, gardant ainsi l'étoile miniature allumée !\n\nLa découverte et la compréhension de ce processus ésotérique, maintenant appelé §YFusion psicatalysée§!, a révolutionné à la fois la psionique et la science nucléaire. Par conséquent, nombre de nos scientifiques débattent maintenant de la possibilité de reproduire ce processus nous-mêmes afin de générer de l'énergie."
  giga_eawaf.1017.a:0 "Absolument incroyable ! Essayez de voir si le processus peut être reproduit."
  giga_eawaf.1017.a.tooltip:0 "Nous tenterons de déclencher une fusion psicatalysée dans un environnement contrôlé, mais cela pourrait nécessiter une compréhension de la psionique supérieure à ce que nous possédons actuellement. Cela ne coûte rien d'essayer, cependant."
  giga_eawaf.1017.b:0 "Ces découvertes sont excellentes, mais nous sommes allés assez loin."

  GIGA_EAWAF_PSIONIC_FUSION:0 "Reproduire la fusion psicatalysée"
  GIGA_EAWAF_PSIONIC_FUSION_DESC:0 "Les mécanismes pilotant les processus de fusion d'Hélios reposent sur un flux complexe de matière tombant directement dans l'immatérium. Reproduire artificiellement ce processus pourrait nous permettre de construire des réacteurs à fusion significativement plus puissants. Nos scientifiques estiment que nous devons d'abord trouver un moyen de §Ypercer l'immatérium§!, puis trouver un §Ycatalyseur psionique§! puissant si nous voulons que cela réussisse. Nous pourrions vouloir garder ce projet en attente jusqu'à ce que nous estimions remplir ces prérequis."

  giga_eawaf.10171.name:0 "Succès de la fusion psicatalysée"
  giga_eawaf.10171.desc:0 "Après une longue série de tentatives ratées et d'impasses, les dernières expériences tentant de reproduire la §YFusion psicatalysée§! dans un environnement contrôlé ont enfin produit un gain d'énergie positif.\n\nUne faille psionique artificielle a été induite et maintenue par des psykers dans une sphère condensée d'hélium, qui s'est spontanément effondrée dans la faille, avant de réapparaître sous forme d'énergies psioniques bouillonnantes comme dans le coeur d'Hélios. Des noyaux d'hydrogène ont ensuite été injectés sur les énergies émergentes avec un timing parfait, déclenchant des réactions de fusion nucléaire extrêmement puissantes, plusieurs ordres de grandeur plus puissantes que celles trouvées dans les réacteurs à fusion conventionnels, ou même dans les étoiles normales, d'ailleurs.\n\nAvec le premier obstacle expérimental surmonté, les applications potentielles de cette technologie sont illimitées. Non seulement elle génère des quantités significatives d'énergie, mais les réactions de fusion plus puissantes pourraient théoriquement être utilisées pour créer des éléments extrêmement lourds avec bien plus de facilité que les méthodes actuelles. De plus, les failles stabilisées semblaient produire un effet d'« amincissement de la réalité » similaire à celui trouvé sur Faust, améliorant drastiquement l'efficacité des psioniques dans leur voisinage immédiat.\n\nSuite à ce succès retentissant, tout ce qui reste à faire maintenant est de mettre à l'échelle le design pour qu'il soit industriellement viable."
  giga_eawaf.10171.a:0 "Excellent !"

  giga_eawaf.10172.name:0 "Échec de la fusion psicatalysée"
  giga_eawaf.10172.desc:0 "Malheureusement, nos tentatives de reproduire la §YFusion psicatalysée§! se sont toutes soldées par un échec. Il semblerait que notre compréhension actuelle de la psionique soit tout simplement trop primitive pour que nous reproduisions avec précision les conditions très spécifiques trouvées dans le coeur infernal d'Hélios.\n\nNos propres conceptions de réacteurs soit échouent carrément à percer l'immatérium, soit sont incapables de catalyser correctement la réaction de fusion psionique. Le projet a été décrit par beaucoup comme une perte de temps coûteuse, mais certains de nos scientifiques continuent néanmoins de croire en la faisabilité d'un tel projet, arguant que nous ne sommes tout simplement pas encore prêts."
  giga_eawaf.10172.a:0 "Réessayez ! Cette fois ça marchera..."
  giga_eawaf.10172.a.tooltip:0 "Nous tenterons à nouveau de déclencher une fusion psicatalysée dans un environnement contrôlé, bien qu'il puisse être sage de ne lancer le projet que lorsque notre compréhension de la psionique aura grandi, sinon il est probable qu'il échoue à nouveau."
  giga_eawaf.10172.b:0 "Cela a été une perte de temps. Annulez le projet."

  # Sirens Event Chain
  giga_eawaf.2001.name:0 "Les profondeurs s'éveillent"
  giga_eawaf.2001.desc:0 "Quelque chose remue à la surface de Faust. Des explorateurs hyppocampes d'§YHippogriffia§!, une nation située au nord-ouest de Zebrica, ont récemment entrepris une expédition dans les profondeurs de la §YFosse Marianienne§!, l'un des abysses les plus profonds et les plus sombres des vastes océans de Faust.\n\nQuand les explorateurs sont revenus, quelque chose en eux avait changé. Une sorte de présence mystérieuse s'était emparée d'eux, comme si leurs âmes mêmes avaient été envoûtées. Cette présence a commencé à se propager à d'autres Hyppocampes, prenant le contrôle de leurs esprits et répandant son influence à travers la nation d'Hippogriffia.\n\nEn quelques semaines à peine, cette influence s'était propagée au point de culminer en un coup d'État relativement peu sanglant qui a vu l'ancien gouvernement hippogriffien renversé et l'instauration des §YSirènes§!, un trio de démons serpentins contrôleurs d'esprits des profondeurs, manifestement derrière tout cela, comme nouveaux dirigeants du pays qu'ils appellent maintenant §YSirenalia§!.\n\nD'après ce que notre avant-poste a pu recueillir, ces Sirènes semblent être animées par un intense désir de vengeance concernant une catastrophe oubliée depuis longtemps qui s'était abattue sur leur espèce. Il est donc évident qu'elles n'ont pas l'intention de s'arrêter à Hippogriffia et vont probablement tenter d'étendre leur influence au reste de Zebrica et potentiellement même à tout Faust.\n\nLa tâche à accomplir est cependant redoutable. Déjà, un groupe de résistance connu sous le nom de §YRésistance d'Aris§! et composé de notables hippogriffiens, dont leur ancienne reine, s'est levé pour contrer la montée de Sirenalia et mettre fin au règne des Sirènes sur leur terre légitime, et on ne sait pas si oui ou non ils réussiront à restaurer l'ancien ordre.\n\nQuel que soit le résultat, il serait dans notre intérêt de surveiller attentivement cette situation."
  giga_eawaf.2001.a:0 "Comme c'est particulier. Surveillons la situation."

  giga_eawaf.2002.name:0 "Les Sirènes sécurisent Hippogriffia"
  giga_eawaf.2002.desc:0 "Sur l'ancien ordre d'Hippogriffia, §YSirenalia§! règne en maître. Bien que cela ait pris plusieurs années de guerre anti-partisane ardue et d'opérations de contre-espionnage, la §YRésistance d'Aris§! a été systématiquement démantelée.\n\nFait intéressant, les anciens membres de la résistance n'ont pas été exilés ou assassinés, mais plutôt envoûtés par les Sirènes elles-mêmes, donnant l'impression troublante qu'ils abandonnent simplement leurs idéaux précédents pour rejoindre leurs anciens adversaires.\n\nÀ ce sujet, les observations ont confirmé que les Sirènes sont effectivement capables de contrôler directement l'esprit d'autres êtres sapients grâce à leur chant mystérieux et envoûtant. Ce chant semble être alimenté par des cristaux particuliers logés dans les Sirènes elles-mêmes, bien que les mécanismes réels de cet envoûtement nous restent entièrement inconnus.\n\nCette capacité est ce qui permet aux Sirènes d'imposer activement leur contrôle, et déjà elles exploitent ce pouvoir afin d'essayer de s'assurer plusieurs des États-nations voisins de Sirenalia.\n\nSirenalia possédant une marine particulièrement importante ainsi qu'une puissante armée de l'air, toutes deux héritées de l'ancien gouvernement hippogriffien, nous estimons que les Sirènes n'auront aucun mal à étendre leur influence au reste du Nord de Zebrica dans les années à venir.\n\nQuant au reste de Faust, bien que certains expriment leur inquiétude face à la croissance des Sirènes, la plupart considèrent actuellement les Sirènes comme un énième empire voué à inévitablement rencontrer sa fin aux mains d'une future coalition."
  giga_eawaf.2002.a:0 "Continuons à observer."

  giga_eawaf.20021.name:0 "Les Sirènes renversées"
  giga_eawaf.20021.desc:0 "Il semble que le nouvel ordre des Sirènes n'était tout simplement pas destiné à être. Après des mois d'action clandestine, les membres de la §YRésistance d'Aris§! ont éclaté en rébellion ouverte contre Sirenalia.\n\nÀ travers les rues et les villes de la nation, les non-envoûtés combattent les envoûtés, ces derniers se battant jusqu'à la mort pour défendre leurs maîtres. Finalement cependant, et avec un soutien considérable d'§YEquestria§!, la résistance harmonique sort victorieuse tandis que l'ordre des Sirènes s'effondre sur lui-même et que leur magie d'envoûtement, privée de subsistance, se dissipe simplement.\n\nUn nouveau gouvernement hippogriffien unifié a été établi pour restaurer le statu quo, tandis que la localisation des Sirènes elles-mêmes est inconnue. Elles ont soit péri dans les combats, soit sont retournées dans les profondeurs des océans pour rassembler à nouveau leur pouvoir et peut-être attendre leur heure en préparation d'une autre tentative de domination planétaire.\n\nMais pour l'avenir prévisible, les Hippogriffiens peuvent se reposer en sachant que les Sirènes ne sont plus une menace, du moins pour les prochains siècles."
  giga_eawaf.20021.a:0 "Elles ont trouvé plus fort qu'elles."

  giga_eawaf.2003.name:0 "La chute du Nord de Zebrica"
  giga_eawaf.2003.desc:0 "Les voisins de Sirenalia n'avaient aucune chance face à l'avancée implacable des Sirènes. Renforcées par leur marine et leur armée de l'air incroyablement puissantes, les Sirènes ont lancé une série d'offensives dans les nations voisines de §YChiropterra§! et de §YColthage§!, déclenchant la §YGuerre nord-zébriquaise§!. Cette guerre se terminerait finalement par une victoire totale des Sirènes, qui peu après imposèrent leur hégémonie sur la majeure partie du Nord de Zebrica.\n\nSuite à cette victoire retentissante, les Sirènes regardent déjà vers leur prochaine cible majeure, à savoir la nation continentale d'§YEquestria§!, située de l'autre côté de l'océan au nord-ouest de Sirenalia. Bien que nos scientifiques aient été à l'origine plutôt perplexes quant à pourquoi les Sirènes avaient décidé de choisir un ennemi aussi puissant comme prochaine cible, des études plus approfondies ont révélé qu'un groupe d'individus connus sous le nom des §YPiliers d'Equestria§! a apparemment causé la chute des Sirènes il y a de nombreux millénaires.\n\nOriginaires d'Equestria même, ces « Piliers » ont, contre toute attente, été trouvés encore en vie, et les Sirènes semblent donc déterminées à exercer leur vengeance sur les Piliers pour leur bannissement précédent dans les profondeurs de la Fosse Marianienne.\n\nCette guerre à venir sera certainement d'une ampleur considérable, probablement la plus grande que Faust ait connue jusqu'à présent. Déjà, les Sirènes se sont mises à conquérir d'autres nations dans des emplacements géographiques clés, à savoir §YMareGypte§! et §YAbyssinie§! au sud-ouest, afin de les utiliser comme bases de préparation pour la future invasion d'Equestria.\n\nÉtant donné la puissance d'Equestria, beaucoup des habitants de Faust pensent que cela se terminera probablement par la disparition prématurée des Sirènes, mais les Sirènes elles-mêmes semblent déterminées à exécuter ce plan ambitieux jusqu'au bout."
  giga_eawaf.2003.a:0 "Cela promet d'être un sacré combat."

  giga_eawaf.20031.name:0 "Sirenalia vaincue"
  giga_eawaf.20031.desc:0 "Malheureusement pour les Sirènes, les nations du Nord de Zebrica se sont avérées être plus qu'à la hauteur de l'empire naissant de Sirenalia.\n\nAprès une série d'assauts initialement réussis dans les nations de §YChiropterra§! et de §YColthage§!, qui ont déclenché la §YGuerre nord-zébriquaise§!, les offensives des Sirènes se sont rapidement enlisées car les nations susmentionnées se sont rapidement et inopinément unies pour s'opposer aux avancées des Sirènes comme un seul bloc.\n\nLa situation a été encore aggravée par l'entrée en guerre de §YWingbardy§!, une nation puissante du sud de Griffonia. La marine wingbardienne a définitivement fait pencher la balance contre les Sirènes et ce n'était plus qu'une question de mois avant que les territoires centraux de Sirenalia ne soient menacés.\n\nAprès des mois de siège suivis de plusieurs offensives éprouvantes dans les capitales de Sirenalia, les Sirènes, réalisant que leur défaite était pratiquement inévitable, ont fui la scène et ont disparu une fois de plus dans les profondeurs de l'océan.\n\nAvec le départ des Sirènes, ce qui restait du gouvernement de Sirenalia s'est rapidement effondré et ses anciennes terres ont été placées sous un mandat de reconstruction chargé de superviser la reconstruction de la zone et l'élimination totale des quelques bastions fanatiques pro-sirènes restants.\n\nLa localisation réelle des Sirènes est inconnue, mais il est peu probable qu'elles réapparaissent avant au moins plusieurs siècles, et elles ont donc été considérées comme définitivement vaincues par la majorité des habitants de Faust."
  giga_eawaf.20031.a:0 "Elles ont trouvé plus fort qu'elles."

  giga_eawaf.2004.name:0 "Les Sirènes renversent Equestria"
  giga_eawaf.2004.desc:0 "L'impensable s'est produit ! Contre toute attente, §YSirenalia§! a triomphé de la nation continentale d'§YEquestria§!.\n\nUne série d'invasions navales foudroyantes a frappé les côtes sud-est d'Equestria avec une vitesse et une puissance inédites, des millions de troupes envoûtées remontant vers le nord en direction de la capitale equestrienne de §YCanterlot§!.\n\nUne combinaison de charges suicidaires et de guerre chimique a permis aux armées des Sirènes de porter un coup moral dévastateur aux Equestriens pris au dépourvu, et il ne fallut pas longtemps avant que Sirenalia n'ait encerclé la capitale et occupé la plupart des centres industriels et de population majeurs d'Equestria.\n\nAvec la chute finale de Canterlot, les Sirènes ont procédé à l'envoûtement des protecteurs les plus puissants d'Equestria et ont utilisé leurs pouvoirs pour bannir les esprits des deux §YAlicornes§! régnantes d'Equestria dans §YHélios§! et §YSéléné§!, avant de projeter les Piliers d'Equestria dans les profondeurs de l'Immatérium lui-même, assurant ainsi un contrôle total sur Equestria et son peuple.\n\nAvec la chute de la nation la plus puissante de Faust, les Sirènes ont maintenant accès à des quantités sans précédent de main-d'œuvre et d'industrie, qu'elles utilisent déjà pour lancer des offensives dans les voisins septentrionaux d'Equestria afin de sécuriser complètement le continent d'§YEquus§!.\n\nNotre avant-poste pense que ce n'est maintenant qu'une question de temps avant que l'influence des Sirènes ne s'étende à l'ensemble de Faust... et peut-être même au-delà."
  giga_eawaf.2004.a:0 "Elles sont remarquablement efficaces."
  giga_eawaf.2004.a.tooltip:0 "Si nous essayions d'arrêter les Sirènes, il est maintenant trop tard pour faire quoi que ce soit au-delà d'une invasion terrestre directe."

  giga_eawaf.20042.name:0 "Aperçus surnaturels"
  giga_eawaf.20042.desc:0 "Nos études de la méthode des Sirènes ainsi qu'un examen plus approfondi des cristaux thaumaturgiques très atypiques de Faust ont enfin porté leurs fruits.\n\nEn effet, tout ce qui concerne ce monde et sa nature indique l'existence d'une « force » sous-jacente imprégnant tout ce qui est conscient, que les Sirènes semblent manipuler activement pour atteindre leurs objectifs. Nos équipes scientifiques sont impatientes d'approfondir ce phénomène."
  giga_eawaf.20042.a:0 "Fascinant... menez des études plus poussées !"
  giga_eawaf.20042.b:0 "Cela ne vaut pas notre temps."

  giga_eawaf.20041.name:0 "Equestria terrasse les Sirènes"
  giga_eawaf.20041.desc:0 "Comme beaucoup s'y attendaient, l'assaut des Sirènes sur §YEquestria§! s'est avéré être un désastre complet. Bien que l'invasion ait été initialement réussie, Equestria a réussi à mobiliser rapidement ses immenses réserves de main-d'œuvre, les utilisant pour d'abord stopper, puis repousser les avancées de Sirenalia sur Equus.\n\nCela fut suivi par le lancement d'une vaste invasion amphibie multi-axes des territoires centraux de Sirenalia, à laquelle les Sirènes ont opposé une résistance incroyable, avant d'être finalement submergées par la puissance industrielle et militaire des Equestriens.\n\nSuite à la capture complète de Sirenalia proprement dite, les Alicornes régnantes d'Equestria ont procédé à la capture des Sirènes alors qu'elles tentaient de fuir. Pour s'assurer que Sirenalia ne puisse jamais réapparaître, les Piliers d'Equestria aux côtés des Alicornes ont mis en commun leurs pouvoirs pour bannir les âmes mêmes des Sirènes dans les profondeurs de l'Immatérium, où elles devraient rester emprisonnées pendant au moins plusieurs millénaires.\n\nAvec Sirenalia vaincue et ses dirigeantes elles-mêmes bannies de la réalité, les espoirs de domination mondiale des Sirènes ont été définitivement anéantis."
  giga_eawaf.20041.a:0 "Il y a donc de l'espoir pour Faust après tout."

  giga_eawaf.2005.name:0 "Les Sirènes subjuguent Faust"
  giga_eawaf.2005.desc:0 "Avec la chute d'§YEquestria§! aux mains des Sirènes, ce n'était qu'une question de temps avant que le reste de Faust ne tombe également. Malgré des tentatives hâtives d'unification par les autres nations pour contrer la montée des Sirènes, cela s'est finalement avéré trop peu, trop tard.\n\nEt ainsi, après plusieurs années de guerre intense, les Sirènes ont enfin étendu l'influence de §YSirenalia§! sur l'ensemble de Faust. À travers la surface du monde, deux milliards de sapients sont tombés sous le charme envoûtant des Sirènes, travaillant sans relâche pour alimenter la puissance industrielle toujours croissante de Sirenalia.\n\nAvec le monde entier sous leur contrôle, il semble évident que la prochaine étape pour les Sirènes pourrait bien être de prendre les étoiles d'assaut, bien que les moyens par lesquels elles le feraient ne soient pas clairs. Malgré leur magie puissante, Sirenalia est, en l'état, complètement et désespérément surclassée par même un empire interstellaire naissant, et toute tentative d'expansion dans l'espace serait probablement accueillie par une puissance de feu écrasante.\n\nPour l'instant, notre avant-poste continuera d'observer les Sirènes, et informera immédiatement notre gouvernement et nos forces armées si Sirenalia commence à planifier son expansion dans l'espace."
  giga_eawaf.2005.a:0 "Nous les écraserons si elles tentent quoi que ce soit."

  giga_eawaf.20051.name:0 "Le secret des Sirènes ?"
  giga_eawaf.20051.desc:0 "Notre soutien clandestin aux Sirènes nous a permis d'obtenir un aperçu précieux du fonctionnement interne du sort des Sirènes et de la façon dont les cristaux thaumaturgiques de Faust étaient activement utilisés par Sirenalia pour renforcer leur sort à travers le monde.\n\nNos scientifiques sont maintenant confiants que, en utilisant quelques échantillons de ces cristaux récupérés dans la ceinture d'astéroïdes locale, ils pourraient être en mesure de reproduire d'une manière ou d'une autre ces effets, bien qu'à plus petite échelle et avec une efficacité bien moindre, ce qui aurait des applications... intéressantes au sein de notre gouvernement et de notre société."
  giga_eawaf.20051.a:0 "Nous devons investiguer leurs méthodes plus en détail."
  giga_eawaf.20051.b:0 "C'est bien trop dangereux."

  giga_eawaf.20061.name:0 "Surge de puissance thaumaturgique"
  giga_eawaf.20061.desc:0 "Les instruments de notre station Faust se sont soudainement affolés. Un pic d'énergie extrêmement puissant commence à surgir à la surface de Faust, apparemment centré autour de la capitale de Sirenalia.\n\nIl semblerait que les Sirènes soient en train de rassembler les réserves de cristaux thaumaturgiques de Faust afin de lancer une sorte de sort gigantesque. Selon nos relevés, l'énergie contenue dans tous les cristaux de Faust serait suffisante pour générer un champ thaumaturgique s'étendant non seulement sur la surface de Faust, mais aussi sur l'ensemble de son système planétaire local.\n\nOn ne sait pas quels pourraient être les effets de ce « sort », mais tout se déroule bien trop vite pour que nous puissions réellement intervenir. En tant que tel, nos scientifiques nous exhortent à §Révacuer tous les biens de valeur du système de Faust§! avant que la surge de puissance n'atteigne son paroxysme, qui a été estimé se produire dans environ §Y3 mois§!."
  giga_eawaf.20061.a:0 "Ce n'est pas bon."

  giga_eawaf.20071.name:0 "Faust englouti dans un linceul éthéré"
  giga_eawaf.20071.desc:0 "Alors que la surge de puissance atteint son intensité maximale, Faust et tout son système planétaire... disparaissent tout simplement.\n\nSuite à la culmination du grand sort des Sirènes, une masse colossale d'énergie éthérée émerge de Faust, vraisemblablement déchargée par d'énormes quantités de cristaux thaumaturgiques. Ce champ grandit d'abord pour entourer Sirenalia, puis Faust, et finalement, tout le système.\n\nIl ne faut que quelques heures pour que le champ englobe tout le voisinage planétaire de Faust, tout ce qui se trouve à proximité, qu'il s'agisse de vaisseaux, de planètes ou de débris flottants, étant inévitablement absorbé par le champ.\n\nAprès environ un jour, le champ, maintenant surnommé le §YLinceul éthéré§!, se stabilise, perturbant toutes les voies hyperspatiales et rendant les autres formes de voyage supraluminique tout simplement impossibles. Les vaisseaux et transmissions envoyés pour investiguer le système disparaissent simplement de l'existence, pour ne plus jamais être revus. La conclusion est claire : pour le moment, le système Faust a essentiellement été retiré de la galaxie, manifestement à la suite des plans des Sirènes.\n\nBien qu'il soit incertain si cet étrange linceul se dissipera jamais, de légères variations dans ses signatures énergétiques semblent indiquer qu'il pourrait éventuellement disparaître après environ §Yun siècle§!, bien que la véracité de cette estimation reste à voir."
  giga_eawaf.20071.a:0 "Comme c'est... particulier. Je suppose qu'ils sont partis."
  giga_eawaf.20071.a.tooltip:0 "§YFaust§! est englouti dans le §YLinceul éthéré§! pour supposément au moins un §Ysiècle§!. Toute tentative de percer dans le système est vouée à se terminer de façon catastrophique.\n§RIl serait peut-être sage de rester à l'écart des systèmes voisins directs du linceul...§!"

  giga_eawaf.20072.name:0 "Le système Faust englouti dans un linceul éthéré"
  giga_eawaf.20072.desc:0 "Le système particulier de §YFaust§!, connu pour abriter une étoile miniature orbitant autour d'un monde tellurique, a soudainement disparu de tous les capteurs à travers la galaxie.\n\nUne investigation plus approfondie a révélé que tout le système — y compris Faust lui-même et tous les vaisseaux qui auraient pu être présents — a été englouti dans un colossal §YLinceul éthéré§!, qui interdit toute observation ou entrée dans le système lui-même.\n\nDes rapports épars indiquent que cela serait l'œuvre d'une sorte de « sort » lancé par §YSirenalia§!, une hyperpuissance planétaire qui avait récemment réussi à unifier tout Faust sous un sort de contrôle mental envoûtant après une série de guerres éprouvantes.\n\nQuel pourrait être le but de ce linceul est inconnu, mais les fluctuations dans les motifs énergétiques du linceul indiquent qu'il y a une chance qu'il commence à se dissiper après environ §Yun siècle§!, mais savoir si c'est plus qu'une prédiction aléatoire est une autre question.\n\nPour le moment, tout le système a essentiellement été retiré de la galaxie, et il serait sage de faire preuve de prudence à proximité de cet étrange champ."
  giga_eawaf.20072.a:0 "Très particulier."

  giga_eawaf.30001.name:0 "Fluctuation du linceul éthéré"
  giga_eawaf.30001.desc:0 "Ces derniers mois, les relevés d'énergie thaumaturgique émanant du §YLinceul éthéré§!, qui étaient jusque-là restés stables après la disparition de §YFaust§!, ont commencé à fluctuer sans raison apparente.\n\nBien que les détails de ce qui pourrait se passer à l'intérieur du linceul nous échappent encore, cela indique manifestement une sorte d'activité des §YSirènes§! qui avaient pris le contrôle du système par la force des armes des années auparavant.\n\nDe façon inquiétante, les motifs des fluctuations suggèrent que le Linceul éthéré va probablement finir par se défaire dans les §Ycinq prochaines années§!."
  giga_eawaf.30001.a:0 "Nous devrions nous attendre au pire."

  giga_eawaf.30002.name:0 "Sirenalia — §HAdagio Dazzle§!"
  giga_eawaf.30002.desc:0 "Mortels ! Je n'ai jamais été du genre à faire des avant-premières, alors passons directement à l'acte principal cette fois. Cette galaxie que vous croyez être la vôtre est en réalité à nous de prendre, et nous avons l'intention de la faire nôtre bientôt. Vous pouvez toujours choisir de vous soumettre maintenant, mais nous savons tous les deux comment ce jeu se joue, n'est-ce pas ? J'ai hâte de voir ce que vous aurez à nous offrir à la fin."
  giga_eawaf.30002.bye:0 "Nous renverrons votre espèce dans les profondeurs !"

  giga_eawaf.30003.name:0 "Le retour des Sirènes"
  giga_eawaf.30003.desc:0 "Il est évident que, loin de s'isoler, les Sirènes ont comploté et planifié sous le Linceul éthéré. Autour du monde autrefois verdoyant de §YFaust§!, maintenant transformé en un vaste paysage infernal psi-industriel, se profile une mégastructure ésotérique surnommée l'§YEnvoûteur voilosonique§!, dont le but est clair : amplifier la portée du chant de contrôle mental des Sirènes pour couvrir la §Rgalaxie entière§!.\n\nPour ce faire, l'Envoûteur génère manifestement un puissant §RChamp de discorde§! centré autour de Faust. Près de Faust, dans ce qu'on appelle maintenant le §RChamp intérieur§!, le sort est suffisamment puissant pour §Rcontrôler mentalement§! instantanément tout vaisseau s'approchant trop près, et il est donc primordial que nous §Révitions§! ce champ intérieur à tout prix jusqu'à ce que des contre-mesures puissent être élaborées.\n\nPlus loin, les effets du champ s'estompent mais restent néanmoins présents dans le §PChamp extérieur§!, qui s'étend bien au-delà des frontières de Sirenalia et fait que les populations des mondes pris dans le champ extérieur éprouvent des niveaux plus élevés de discorde et de haine les uns envers les autres.\n\nDe façon alarmante, cette discorde est manifestement ce qui « nourrit » les Sirènes, ce qui signifie que plus elles acquièrent de §RDiscorde§!, plus loin l'§YEnvoûteur voilosonique§! sera capable de projeter le sort... et plus les Sirènes auront de discorde. Il va donc sans dire que Sirenalia doit être arrêtée avant que l'envoûteur ne déclenche une boucle de rétroaction positive résultant en l'engloutissement du §RChamp intérieur§! de toute notre galaxie.\n\nComme les fonctionnements internes réels de la « Discorde », de l'Envoûteur, du sort et du Champ nous échappent encore, une §YSituation§! a été mise en place pour suivre nos progrès concernant notre connaissance des Sirènes."
  giga_eawaf.30003.a:0 "Continuons à les surveiller."

  # Diplo with Sirens
  giga_eawaf.4000.name:0 "Sirenalia"
  giga_eawaf.4000.desc.adagio:0 "Êtes-vous venus offrir votre reddition complète et inconditionnelle ? Non ? Alors pourquoi vous donnez-vous la peine d'être ici ?"
  giga_eawaf.4000.desc.aria:0 "Faites vite. Je n'ai pas toute la journée à perdre mon temps avec des créatures comme vous."
  giga_eawaf.4000.desc.sonata:0 "Ooooh, je ne crois pas vous avoir déjà vus ! Ou peut-être que si ! Il y a tellement de vous, nouveaux gens bizarres, à suivre, vous savez !"
  giga_eawaf.4000.bye:0 "Écran de visualisation éteint."

  # Final Event Chain

  giga_eawaf.6000.name:0 "Défenses extérieures de l'Envoûteur percées !"
  giga_eawaf.6000.desc:0 "Nos valeureuses flottes ont réussi à détruire les emplacements d'armes extérieurs du redoutable §YEnvoûteur voilosonique§! des Sirènes.\n\nPar la suite, la perte de ces points durs critiques a exposé le §Ycoeur abyssal§! de l'Envoûteur enveloppant Faust lui-même et alimentant tout l'appareil, qui devrait être détruit au plus vite si nous voulons enfin mettre fin à la folie des Sirènes."
  giga_eawaf.6000.a:0 "Assaut immédiat !"

  giga_eawaf.6001.name:0 "Envoûteur voilosonique détruit !"
  giga_eawaf.6001.desc:0 "Avec la destruction du §Ycoeur abyssal§! de l'Envoûteur, qui servait de « condensateur » amplifiant le sort des Sirènes à travers la galaxie, la mégastructure autrefois puissante a rapidement subi un effondrement catastrophique en un champ de débris de la taille d'une planète entourant Faust lui-même.\n\nCela a été rapidement suivi par la désintégration complète du §YChamp de discorde§! et la perte subséquente du contrôle des Sirènes sur la plupart de leurs actifs directement en dehors de Faust lui-même, où les Sirènes se sont maintenant retirées dans l'attente d'une dernière résistance désespérée."
  giga_eawaf.6001.a:0 "Elles n'ont plus nulle part où fuir maintenant."

  giga_eawaf.60022.name:0 "La dernière résistance des Sirènes"
  giga_eawaf.60022.desc:0 "Alors que nos armées touchent le sol sur §YFaust§!, les Sirènes, acculées, ont commencé à lancer des millions et des millions de Faustiens contrôlés mentalement directement sur nos légions !\n\nAu grand désarroi de nos commandants, des nations entières de serviteurs, souvent sans équipement approprié ni expérience de combat, marchent maintenant vers leur mort dans une tentative désespérée de ralentir notre avancée inévitable sur leur monde.\n\nIl est évident que, si rien n'est fait, les Sirènes ont bien l'intention de sacrifier l'ensemble de la population innocente de Faust — et donc la majeure partie de la valeur réelle de la planète — afin de s'acheter juste un peu plus de temps..."
  giga_eawaf.60022.a:0 "Nous devons arrêter cela immédiatement ! Investiguez un moyen de libérer les Faustiens."
  giga_eawaf.60022.b:0 "Que ce monde soit brisé sous notre puissance si c'est ce qu'ils souhaitent."

  giga_eawaf.60024.name:0 "La destruction de Faust"
  giga_eawaf.60024.desc:0 "Par une force écrasante, le monde de §YFaust§! a été complètement détruit aux côtés de ses maîtresses Sirènes. Bien que cela ait entraîné d'innombrables morts, cela assurera enfin la fin définitive de la folie des Sirènes."
  giga_eawaf.60024.a:0 "C'était pour le plus grand bien."

  giga_eawaf.60025.name:0 "La chute de Faust"
  giga_eawaf.60025.desc:0 "Malgré les meilleurs efforts des Sirènes, et le sacrifice vain de milliards de Faustiens, le monde de §YFaust§! est tombé sous notre puissance.\n\nOu du moins, ce qu'il en reste. Plus de quatre-vingt-dix-neuf pour cent de la population de la planète a péri dans les combats, laissant des continents entiers dépourvus de vie intelligente et couverts des restes squelettiques lugubres de villes gigantesques et de zones industrielles que nos forces procèdent maintenant à occuper. Un maigre un pour cent de l'ancienne population a réussi à survivre quand le sort des Sirènes s'est dissipé en raison de la population de Faust qui s'amenuisait rapidement.\n\nQuant aux §YSirènes§! elles-mêmes, elles se sont manifestement retirées dans les profondeurs de la §YFosse Marianienne§! d'où elles ont émergé pour la première fois, mais nos commandants nous ont assuré que les forces planétaires organisent déjà une expédition dans les profondeurs océaniques afin de tuer ces bêtes une fois pour toutes."
  giga_eawaf.60025.a:0 "Victoire, mais à quel prix ?"

  giga_eawaf.60251.name:0 "La fin des Sirènes"
  giga_eawaf.60251.desc:0 "La fin des Sirènes a été, faute de mieux, plutôt anticlimatique. Suite à la descente de notre expédition dans la Fosse Marianienne, ses membres ont rapidement localisé les Sirènes se cachant dans des formations géologiques arcaniques au fond de l'océan.\n\nElles ont bien sûr tenté de résister par l'usage de leur magie, mais, totalement privées d'une population dont tirer de la haine, et désespérément contrées par notre technologie de Désenchanteur, ces tentatives n'ont fait guère plus que faire monter les relevés d'énergie dans les combinaisons de plongée de nos soldats, et ce qui a suivi a donc été tout simplement la vaporisation rapide des trois Sirènes via des armes à haute énergie.\n\nCependant, étrangement, les cristaux rouges qui étaient autrefois incrustés dans les Sirènes et leur fournissaient supposément leurs pouvoirs ont été trouvés avoir en quelque sorte survécu à toute cette épreuve et ont été récupérés par nos soldats dans des conteneurs thaumaturgiquement sécurisés pour un examen plus approfondi."
  giga_eawaf.60251.a:0 "Ces cristaux... pourraient être utiles."
  giga_eawaf.60251.b:0 "Jetez-les dans le soleil, détruisez-les !"

  giga_eawaf.60026.name:0 "La chute de Faust"
  giga_eawaf.60026.desc:0 "Malgré les meilleurs efforts des Sirènes, et le sacrifice vain de milliards de Faustiens, le monde de §YFaust§! est tombé sous la puissance de §Y[giga_eawaf_sirens_killer_country.GetName]§!.\n\nOu du moins, ce qu'il en reste. Plus de quatre-vingt-dix-neuf pour cent de la population de la planète a péri dans les combats, laissant des continents entiers dépourvus de vie intelligente et couverts des restes squelettiques lugubres de villes gigantesques et de zones industrielles. Un maigre un pour cent de l'ancienne population a réussi à survivre quand le sort des Sirènes s'est dissipé en raison de la population de Faust qui s'amenuisait rapidement.\n\nQuant aux §YSirènes§! elles-mêmes, elles se sont manifestement retirées dans les profondeurs de la §YFosse Marianienne§! d'où elles ont émergé pour la première fois, bien qu'il soit probable que §Y[giga_eawaf_sirens_killer_country.GetName]§! s'en occupe rapidement."
  giga_eawaf.60026.a:0 "Une victoire sinistre."

  giga_eawaf.60027.name:0 "Visions miroirs"
  giga_eawaf.60027.desc:0 "Notre département scientifique rapporte que, suite à des scans orbitaux de Faust couplés à des expéditions audacieuses à la surface, ils ont peut-être trouvé un moyen de neutraliser les Sirènes sans avoir à sacrifier toute la population de Faust.\n\nEn effet, bien qu'il soit déjà connu que Faust réside dans une zone de l'espace-temps où la « réalité » est plus faible, on a maintenant découvert qu'un point spécifique à la surface de Faust, situé près de ce que les indigènes appelaient §YCanterlot§!, se trouve en proximité dimensionnelle étroite avec un « royaume miroir ».\n\nLa raison de ce lien ainsi que la nature de ce royaume sont inconnues, mais notre département scientifique théorise qu'il pourrait être possible de, en utilisant des échantillons des cristaux de contrôle mental utilisés par les Sirènes aux côtés de la décharge orbitale soudaine d'une grande quantité d'énergie dans la zone donnée, « briser » le tissu de la réalité et créer un « vortex dimensionnel » temporaire que nous pourrions ensuite utiliser pour « bannir » les Sirènes dans la dimension alternative susmentionnée.\n\nCe plan nécessiterait cependant une hâte extrême et une connaissance parfaite de la situation par un « sacrifice » chargé de plonger dans le vortex avec des cristaux soigneusement accordés afin de provoquer la réaction en chaîne thaumaturgique nécessaire pour attirer puis bannir les Sirènes.\n\nEn l'état, seul §Y[giga_eawaf_sirens_scientist_sacrifice.GetName]§! serait capable de réaliser un tel exploit."

  giga_eawaf.60027.a:0 "Approuvé. Procédez immédiatement, peu importe le coût !"
  giga_eawaf.60027.b:0 "Refusé. Ce monde ne vaut pas [giga_eawaf_sirens_scientist_sacrifice.GetName]."

  giga_eawaf.60028.name:0 "Sirènes bannies"
  giga_eawaf.60028.desc:0 "Alors que la décharge scintillante d'énergie de nos actifs orbitaux frappe la surface de Faust où se trouve la faille dimensionnelle, §Y[giga_eawaf_sirens_scientist_sacrifice.GetName]§! plonge dans la déchirure grandissante de l'espace-temps aux côtés d'un ensemble de cristaux thaumaturgiques soigneusement accordés pour imiter ceux incrustés dans les Sirènes elles-mêmes.\n\nComme prévu, cela déclenche un « enchevêtrement » thaumaturgique qui « traîne » les Sirènes impuissantes hors de leur cachette sur Faust et directement dans le vortex dimensionnel aux côtés de notre officier avant que tout le vortex, inapte à exister dans notre réalité plus de quelques secondes, ne s'effondre sur lui-même, emportant [giga_eawaf_sirens_scientist_sacrifice.GetName] et les Sirènes avec lui.\n\nCe qui suit est l'effondrement complet de l'emprise des Sirènes sur Faust et la libération subséquente de la population de Faust de leur emprise diabolique, stoppant effectivement leurs tactiques d'assaut de masse implacables. Bien que Faust et ses habitants resteront probablement marqués pendant de nombreuses années, les Sirènes ont enfin été définitivement expulsées de notre réalité."
  giga_eawaf.60028.a:0 "Elles ne nous troubleront plus."

  giga_eawaf.60029.name:0 "Un étrange miroir"
  giga_eawaf.60029.desc:0 "Suite à la disparition des Sirènes, nos scientifiques ont mené une investigation de §YCanterlot§!, l'endroit où l'étrange faille dimensionnelle a été initialement détectée.\n\nIls rapportent qu'un artefact particulier, semblable à une sorte de « miroir de cristal » orné, a été trouvé profondément sous la surface, une étude plus approfondie révélant que cet appareil particulier est très probablement l'origine de la connexion interdimensionnelle qui nous a permis de bannir les Sirènes hors de notre réalité.\n\nL'activation contrôlée du miroir suivie d'un sondage minutieux à l'aide de sondes furtives a révélé une connexion à une sorte de Royaume alternatif peuplé d'humanoïdes colorés qui semblent participer régulièrement à des célébrations musicales rituelles.\n\nBien que révéler réellement notre présence à cette dimension ou en extraire qui que ce soit reste totalement déconseillé, en raison du risque que les Sirènes remarquent ce passage de retour dans notre réalité, nous pourrions très bien garder le miroir dans une installation sécurisée, ce qui nous permettrait d'étudier ses habitants particuliers ainsi que leurs rituels musicaux."
  giga_eawaf.60029.a:0 "Curieux. Gardons-le."
  giga_eawaf.60029.b:0 "Bien trop dangereux ! Scellez-le pour de bon."

  giga_eawaf.60032.name:0 "Sirenalia vaincue"
  giga_eawaf.60032.desc:0 "Suite à la disparition finale d'§HAdagio Dazzle§!, §MAria Blaze§! et §BSonata Dusk§! aux mains de §Y[giga_eawaf_sirens_killer_country.GetName]§!, les redoutables §YSirènes§! qui avaient menacé de contrôler mentalement Faust et la galaxie pendant plusieurs décennies, leur empire de §YSirenalia§! a définitivement été jeté aux oubliettes de l'histoire.\n\nTous les vaisseaux et planètes restants sous l'influence des Sirènes se sont soit autodétruits, se sont libérés eux-mêmes ou sont retournés à leurs anciens propriétaires. Et ainsi, la communauté galactique pousse un soupir de soulagement collectif alors que le plan dérangé des Sirènes pour atteindre « l'unité galactique éternelle » a enfin été anéanti pour de bon."
  giga_eawaf.60032.a:0 "Le chœur des Sirènes se tait enfin."

  giga_eawaf.5001.name:0 "Prototype de désenchanteur conçu"
  giga_eawaf.5001.desc:0 "Nos chercheurs rapportent que nos efforts pour comprendre et contrer les Sirènes commencent à porter leurs fruits, même si ce n'est que légèrement.\n\nBien que la nature profonde du chant mystérieux des Sirènes nous échappe encore, des études préliminaires suggèrent que tirer des décharges d'énergie focalisées à des fréquences spécifiques dans le quasi-espace peut atténuer certains des effets du Champ de discorde, au prix d'une augmentation drastique de l'entretien des vaisseaux sur lesquels ces mécanismes sont montés, ainsi que d'une entrave à la mobilité lorsqu'ils sont actifs.\n\nSurnommés §YDésenchanteurs§!, ces appareils avancés semblent être une option viable pour contrer les Sirènes qui sera approfondie."
  giga_eawaf.5001.a:0 "Il y a de l'espoir."
  giga_eawaf.5001.a.tooltip:0 "Nous devrons rechercher la technologie du Désenchanteur afin de continuer la situation §YContrer les Sirènes§!. Notre approche a été définie sur §YPas d'études sur les Sirènes§! en attendant pour éviter de gaspiller des ressources."

  giga_eawaf.5002.name:0 "Désenchanteur accordé conçu"
  giga_eawaf.5002.desc:0 "Des avancées supplémentaires dans la recherche anti-Sirènes ont produit des modèles de Désenchanteur améliorés avec une plus grande efficacité.\n\nBien qu'ils ne soient toujours pas assez puissants pour repousser le néfaste §RChamp intérieur§!, ces designs devraient permettre à nos vaisseaux d'opérer dans le §PChamp extérieur§! sans pénalités de vitesse."
  giga_eawaf.5002.a:0 "Mettez-vous-y immédiatement."

  giga_eawaf.5003.name:0 "Désenchanteur symphonieux conçu"
  giga_eawaf.5003.desc:0 "Nos équipes scientifiques rapportent que les récentes percées dans la technologie du Désenchanteur devraient permettre à ces designs améliorés de repousser non seulement le §PChamp extérieur§!, mais devraient également être suffisamment efficaces pour repousser même le §RChamp intérieur§! et permettre à nos vaisseaux d'opérer même dans les profondeurs du territoire des Sirènes, bien qu'à des vitesses drastiquement réduites.\n\nCela signifie que, à condition de posséder une puissance de feu suffisante, il devrait maintenant être possible de mettre enfin fin à la folie des Sirènes."
  giga_eawaf.5003.a:0 "Excellent."

  giga_eawaf.5004.name:0 "Désenchanteur euphonique conçu"
  giga_eawaf.5004.desc:0 "Des améliorations supplémentaires de nos Désenchanteurs existants ont produit le §YDésenchanteur euphonique§! — le dernier mot en matière de technologie anti-Sirènes.\n\nCapable d'opérer n'importe où dans le Champ de discorde sans impact sur la vitesse des vaisseaux, cela devrait permettre à nos vaisseaux de mener des frappes n'importe où contre les Sirènes et à tout moment."
  giga_eawaf.5004.a:0 "Délicieux ! Elles seront bientôt impuissantes."

  giga_eawaf.1104.name:0 "Armement thaumaturgique"
  giga_eawaf.1104.desc:0 "L'§YArmement thaumaturgique§! que nous avons réussi à rétro-concevoir des Sirènes présente la propriété particulière d'être aussi puissant que la quantité d'énergie que nous pouvons réussir à y injecter en toute sécurité.\n\nAinsi, nous avons conçu une nouvelle technologie répétable visant à augmenter continuellement la puissance de ces armes."
  giga_eawaf.1104.a:0 "Intrigant."

  # Technologies
  giga_tech_eawaf_psifusion:0 "Fusion psicatalysée industrielle"
  giga_tech_eawaf_psifusion_desc:0 "Reproduire le fonctionnement ésotérique du coeur infernal d'Hélios dans un environnement contrôlé et à l'échelle industrielle permet une production d'énergie formidable et la production facilitée d'éléments lourds."

  giga_tech_eawaf_weapons_repeatable:0 "Armement thaumaturgique surchargé"
  giga_tech_eawaf_weapons_repeatable_desc:0 "La nature ésotérique de l'armement thaumaturgique signifie qu'il n'y a essentiellement pas de limite supérieure à leur potentiel. Tant que plus d'énergie peut être injectée aux côtés de plus de cristaux pour transporter cette énergie, ils peuvent continuer à devenir de plus en plus puissants.\n§RPour des raisons techniques, la pénalité d'entretien s'applique à l'ensemble du vaisseau et pas seulement aux composants thaumaturgiques ! Il est donc recommandé de remplir complètement le vaisseau avec ces armes pour en tirer le meilleur parti.§!"

  giga_tech_eawaf_weapons_repeatable_title:0 "Dégâts des armes thaumaturgiques : §G+25 %§!\nEntretien des vaisseaux avec armes thaumaturgiques : §R+12,5 %§!"
  giga_tech_eawaf_weapons_repeatable_desc:0 "§RPour des raisons techniques, la pénalité d'entretien s'applique à l'ensemble du vaisseau et pas seulement aux composants thaumaturgiques ! Il est donc recommandé de remplir complètement le vaisseau avec ces armes pour en tirer le meilleur parti.§!"

  giga_tech_eawaf_sirens_secret:0 "Envoûtement thaumaturgique"
  giga_tech_eawaf_sirens_secret_desc:0 "Étudier comment les Sirènes déchaînent leur sort d'envoûtement pourrait avoir d'excellentes applications pour notre gouvernement et notre société."

  giga_tech_eawaf_sirens_strike_craft:0 "$GIGA_EAWAF_STRIKE_CRAFT$"
  giga_tech_eawaf_sirens_strike_craft_desc:0 "$GIGA_EAWAF_STRIKE_CRAFT_DESC$"

  giga_tech_eawaf_sirens_autocannon:0 "$GIGA_EAWAF_CRYSTAL_AUTOCANNON$"
  giga_tech_eawaf_sirens_autocannon_desc:0 "$GIGA_EAWAF_CRYSTAL_AUTOCANNON_DESC$"

  giga_tech_eawaf_sirens_artillery:0 "$GIGA_EAWAF_CRYSTAL_ARTILLERY$"
  giga_tech_eawaf_sirens_artillery_desc:0 "$GIGA_EAWAF_CRYSTAL_ARTILLERY_DESC$"

  giga_tech_eawaf_sirens_missile:0 "$GIGA_EAWAF_PSIONIC_CHARGE$"
  giga_tech_eawaf_sirens_missile_desc:0 "$GIGA_EAWAF_PSIONIC_CHARGE_DESC$"

  giga_tech_eawaf_sirens_impactor:0 "$GIGA_EAWAF_CRYSTAL_IMPACTOR$"
  giga_tech_eawaf_sirens_impactor_desc:0 "$GIGA_EAWAF_CRYSTAL_IMPACTOR_DESC$"

  giga_tech_eawaf_sirens_voidbeam:0 "$GIGA_EAWAF_GRAND_VOID_BEAM$"
  giga_tech_eawaf_sirens_voidbeam_desc:0 "$GIGA_EAWAF_GRAND_VOID_BEAM_DESC$"

  giga_tech_eawaf_disenchanter_1:0 "Contre-mesures précoces anti-Sirènes"
  giga_tech_eawaf_disenchanter_1_desc:0 "Bien que la nature profonde du chant mystérieux des Sirènes nous échappe encore, des études préliminaires suggèrent que tirer des décharges d'énergie focalisées à des fréquences spécifiques dans le quasi-espace peut atténuer certains des effets du Champ de discorde, au prix d'une augmentation drastique de l'entretien des vaisseaux sur lesquels ces mécanismes sont montés."

  giga_tech_eawaf_disenchanter_2:0 "Accordage du désenchanteur"
  giga_tech_eawaf_disenchanter_2_desc:0 "Un accordage plus minutieux des mécanismes du Désenchanteur permet de contrer plus efficacement les effets néfastes du Champ de discorde."

  giga_tech_eawaf_disenchanter_3:0 "Symphonies subpsioniques"
  giga_tech_eawaf_disenchanter_3_desc:0 "Des percées dans notre compréhension du Champ de discorde nous permettent d'émettre directement des contre-mélodies aux chants des Sirènes dans l'Immatérium lui-même, qui peuvent repousser même les effets de contrôle mental du néfaste Champ intérieur."
  giga_tech_eawaf_disenchanter_3_effects:0 "Permet la capture de §YBases stellaires§! et de §YPlanètes§! dans le §RChamp intérieur§!."

  giga_tech_eawaf_disenchanter_4:0 "Dissipation euphonique de la discorde"
  giga_tech_eawaf_disenchanter_4_desc:0 "Notre compréhension du chant des Sirènes a maintenant progressé au point où nous pouvons confortablement annuler leur champ de contrôle mental à n'importe quelle échelle, bien qu'à un coût énergétique non négligeable."

  # Buildings
  building_giga_eawaf_psifusion_reactor:0 "Réacteur à fusion psicatalysée"
  building_giga_eawaf_psifusion_reactor_desc:0 "Ce complexe de réacteur gargantuesque abrite une « étoile psionique » artificielle alimentée par une faille du Voile. Non seulement il produit des quantités formidables d'énergie, mais il peut également être utilisé pour créer des éléments lourds et renforce l'efficacité des psioniques à travers toute la planète."

  building_giga_eawaf_sirens_capital:0 "Panoptique planétaire"
  building_giga_eawaf_sirens_capital_desc:0 "Un complexe colossal destiné à relayer la volonté des Sirènes à travers ce monde, afin d'assurer une efficacité sociétale et industrielle maximale."

  building_giga_eawaf_disenchanter_building_1:0 "Champ de désenchantement prototype"
  building_giga_eawaf_disenchanter_building_1_desc:0 "Un Désenchanteur à échelle supérieure capable d'annuler une partie des effets du Champ de discorde sur ce monde. Réduit de moitié les pénalités du §PChamp extérieur§!."

  building_giga_eawaf_disenchanter_building_2:0 "Champ de désenchantement harmonisé"
  building_giga_eawaf_disenchanter_building_2_desc:0 "Ce Champ de désenchantement raffiné est non seulement capable de réduire drastiquement les effets du Champ de discorde sur ce monde, mais le protège également de l'emprise du Champ intérieur. Réduit d'un quart les effets du §PChamp extérieur§! et protège contre le §RChamp intérieur§!."

  # Jobs
  job_giga_eawaf_sirens_toiler:0 "Trimeur des Sirènes"
  job_giga_eawaf_sirens_toiler_plural:0 "Trimeurs des Sirènes"
  job_giga_eawaf_sirens_toiler_desc:1 "Les Trimeurs des Sirènes travaillent jour et nuit pour produire les ressources nécessaires à alimenter la machine de guerre des Sirènes."
  mod_job_giga_eawaf_sirens_toiler_add:0 "Emplois de $job_giga_eawaf_sirens_toiler$"
  mod_job_giga_eawaf_sirens_toiler_per_pop:0 "Emplois de $job_giga_eawaf_sirens_toiler$ par pop"

  job_giga_eawaf_sirens_naval:0 "Opérateur de flotte des Sirènes"
  job_giga_eawaf_sirens_naval_plural:0 "Opérateurs de flotte des Sirènes"
  job_giga_eawaf_sirens_naval_desc:1 "Les Opérateurs de flotte des Sirènes sont chargés de gérer la logistique des armadas spatiales des Sirènes."
  mod_job_giga_eawaf_sirens_naval_add:0 "Emplois de $job_giga_eawaf_sirens_toiler$"
  mod_job_giga_eawaf_sirens_naval_per_pop:0 "Emplois de $job_giga_eawaf_sirens_naval$ par pop"

  job_giga_eawaf_sirens_scientist:0 "Sciento-économiste des Sirènes"
  job_giga_eawaf_sirens_scientist_plural:0 "Sciento-économistes des Sirènes"
  job_giga_eawaf_sirens_scientist_desc:1 "Les Sciento-économistes sont l'échelon supérieur de la société des Sirènes. Composés des rares individus autorisés à rester non envoûtés, leur travail est de trouver de nouvelles façons d'améliorer l'efficacité de la société des Sirènes ainsi que de repousser les limites de leur science toujours plus loin."
  mod_job_giga_eawaf_sirens_scientist_add:0 "Emplois de $job_giga_eawaf_sirens_toiler$"
  mod_job_giga_eawaf_sirens_scientist_per_pop:0 "Emplois de $job_giga_eawaf_sirens_scientist$"

  job_giga_eawaf_sirens_strifer:0 "Discordeur des Sirènes"
  job_giga_eawaf_sirens_strifer_plural:0 "Discordeurs des Sirènes"
  job_giga_eawaf_sirens_strifer_desc:1 "Les besoins des Sirènes exigent que certains individus restent dans un état perpétuel mais contrôlé de colère et de conflit les uns avec les autres, afin de continuer à générer un précieux filet de Discorde même au sein du Champ intérieur parfaitement régulé."
  mod_job_giga_eawaf_sirens_strifer_add:0 "Emplois de $job_giga_eawaf_sirens_strifer$"
  mod_job_giga_eawaf_sirens_strifer_per_pop:0 "Emplois de $job_giga_eawaf_sirens_strifer$"

  # Situation
  situation_eawaf_sirens_takeover:0 "La prise de pouvoir des Sirènes"
  situation_eawaf_sirens_takeover_desc:0 "Un trio de « Sirènes » dotées de capacités de contrôle mental s'est mis en tête d'imposer leur domination sur Faust. Elles sont manifestement déterminées à tout faire pour s'assurer de réussir dans cette entreprise redoutable. Il est probablement dans notre intérêt de surveiller attentivement cette situation."
  situation_eawaf_sirens_takeover_type:0 "La prise de pouvoir des Sirènes"
  situation_eawaf_sirens_takeover_monthly_change_tooltip:0 ""

  approach_giga_eawaf_stop_sirens:0 "Arrêter les Sirènes"
  approach_giga_eawaf_stop_sirens_tooltip:0 "Nous ferons tout ce qui est en notre pouvoir pour stopper les Sirènes sans être vus. Des assassinats clandestins de leurs actifs clés, la perturbation de leurs lignes d'approvisionnement et le renforcement des mouvements anti-Sirènes devraient freiner leur progression jusqu'à ce qu'elles soient submergées par leurs ennemis.\nCela augmentera les chances que les Sirènes tombent face à leurs ennemis à chaque étape de leur conquête.\n§RNous ne pouvons pas revenir en arrière si nous commençons à arrêter les Sirènes.§!"

  approach_giga_eawaf_do_nothing:0 "Ne rien faire"
  approach_giga_eawaf_do_nothing_tooltip:0 "Observons simplement comment cela se déroule. Nous avons des affaires plus pressantes dont nous préoccuper.\n§YNous pouvons toujours changer d'avis plus tard.§!"

  approach_giga_eawaf_study_sirens:0 "Étudier les Sirènes"
  approach_giga_eawaf_study_sirens_tooltip:0 "Nous investirons des ressources et du personnel pour étudier les Sirènes et leurs méthodes de contrôle mental. Nous pourrions en apprendre beaucoup sur la vraie nature de la conscience et de l'esprit de cette façon.\n§YNous pouvons toujours changer d'avis plus tard.§!"

  approach_giga_eawaf_bolster_sirens:0 "Soutenir les Sirènes"
  approach_giga_eawaf_bolster_sirens_tooltip:0 "Nous aiderons clandestinement les Sirènes dans leur prise de pouvoir. De cette façon, nous pourrons assister à leur plein potentiel en action, nous apportant une mine de données précieuses.\n§GNous pouvons toujours changer d'avis plus tard, mais plus longtemps nous les soutenons, plus nous apprendrons.§!"

  situation_eawaf_sirens_takeover_effects:0 "Les Sirènes progresseront dans leur prise de contrôle de Faust."

  giga_eawaf_sirens_too_strong_tooltip:0 "Les Sirènes sont devenues trop fortes pour que nous puissions nous y opposer clandestinement. Nous devons soit les laisser tranquilles, soit intervenir directement via une invasion terrestre potentiellement risquée de Faust."


  situation_eawaf_sirens_understanding:0 "Contrer les Sirènes"
  situation_eawaf_sirens_understanding_desc:0 "Les Sirènes tentent de propager un « chant » de contrôle mental ésotérique à travers toute la galaxie. Nous devons trouver un moyen de contrer ce phénomène avant de tous tomber sous leur charme diabolique. Le coût en §YRecherche§! et en §YUnité§! pour contrer les Sirènes s'échelonnera en fonction de la §MPuissance§! du Champ. Si nous ne pouvons pas nous le permettre, nous reviendrons à §YPas d'études sur les Sirènes§!."
  situation_eawaf_sirens_understanding_type:0 "Contrer les Sirènes"
  situation_eawaf_sirens_understanding_monthly_change_tooltip:0 ""

  approach_giga_eawaf_sirens_research_1:0 "Pas d'études sur les Sirènes"
  approach_giga_eawaf_sirens_research_1_tooltip:0 "Ça ira."
  approach_giga_eawaf_sirens_research_2:0 "Études anti-Sirènes limitées"
  approach_giga_eawaf_sirens_research_2_tooltip:0 "Les Sirènes ne sont pas vraiment une priorité, mais investissons quand même un peu juste pour être sûrs."
  approach_giga_eawaf_sirens_research_3:0 "Études anti-Sirènes étendues"
  approach_giga_eawaf_sirens_research_3_tooltip:0 "Nous devons arrêter les Sirènes, alors investissons suffisamment de ressources pour le permettre."
  approach_giga_eawaf_sirens_research_4:0 "Études anti-Sirènes massives"
  approach_giga_eawaf_sirens_research_4_tooltip:0 "Les Sirènes doivent être arrêtées à tout prix ! Investissons tout ce que nous pouvons pour les contrer !"

  situation_eawaf_sirens_disenchanters_effect:0 "Nous améliorerons nos contre-mesures contre les Sirènes."
  giga_eawaf_has_sirens_secret:0 "Nos études précédentes des Sirènes renforcent nos contre-mesures !"

  giga_eawaf_disenchanter_research_cost_1:0 "Études anti-Sirènes limitées"
  giga_eawaf_disenchanter_research_cost_1_desc:0 "Les Sirènes ne sont pas vraiment une priorité, mais investissons quand même un peu juste pour être sûrs."

  giga_eawaf_disenchanter_research_cost_2:0 "Études anti-Sirènes étendues"
  giga_eawaf_disenchanter_research_cost_2_desc:0 "Nous devons arrêter les Sirènes, alors investissons suffisamment de ressources pour le permettre."

  giga_eawaf_disenchanter_research_cost_3:0 "Études anti-Sirènes massives"
  giga_eawaf_disenchanter_research_cost_3_desc:0 "Les Sirènes doivent être arrêtées à tout prix ! Investissons tout ce que nous pouvons pour les contrer !"

