  # Sirens Event Chain
  giga_eawaf.2001.name:99 "Les profondeurs s'éveillent"
  giga_eawaf.2001.desc:99 "Quelque chose remue à la surface de Faust. Des explorateurs hippocampes d'§YHippogriffia§!, une nation située à l'extrémité nord-ouest de Zebrica, ont récemment entrepris une expédition dans les profondeurs de la §YFosse Maréïana§!, l'un des gouffres les plus profonds et les plus sombres des vastes océans de Faust.\n\nQuand les explorateurs sont revenus, quelque chose en eux avait changé. Une sorte de présence mystérieuse s'était emparée d'eux, comme si leurs âmes mêmes avaient été asservies. Cette présence a commencé à se propager aux autres Hippocampes, prenant le contrôle de leurs esprits et étendant son influence à travers la nation d'Hippogriffia.\n\nEn quelques semaines à peine, cette influence s'était propagée au point de culminer en un coup d'État relativement sans effusion de sang qui a vu l'ancien gouvernement hippogriffien renversé et l'instauration des §YSirènes§!, un trio de démons serpentins contrôleurs d'esprits des profondeurs, évidemment derrière tout l'acte, comme nouveaux dirigeants de la terre qu'elles appellent maintenant §YSirenalia§!.\n\nD'après ce que notre avant-poste a pu rassembler, ces Sirènes sont apparemment animées par un intense désir de vengeance pour une catastrophe oubliée depuis longtemps qui avait frappé leur espèce. Il est donc évident qu'elles n'ont pas l'intention de s'arrêter à Hippogriffia et sont susceptibles d'essayer d'étendre leur influence au reste de Zebrica et potentiellement même à tout Faust.\n\nLa tâche à accomplir est décourageante, cependant. Déjà, un groupe de résistance connu sous le nom de §YRésistance d'Aris§! et composé de notables fonctionnaires hippogriffiens, y compris son ancienne reine, s'est levé pour contrer l'ascension de Sirenalia et mettre fin au règne des Sirènes sur leur terre légitime, et c'est à voir si elles réussiront ou non à restaurer l'ancien ordre.\n\nQuel que soit le résultat, il serait dans notre intérêt de garder un oeil attentif sur cette situation."
  giga_eawaf.2001.a:99 "Comme c'est particulier. Surveiller la situation."

  giga_eawaf.2002.name:99 "Les Sirènes sécurisent Hippogriffia"
  giga_eawaf.2002.desc:99 "Sur l'ancien ordre d'Hippogriffia, §YSirenalia§! règne en maître. Bien que cela ait pris plusieurs années de guerre anti-partisane ardue et d'opérations de contre-espionnage, la §YRésistance d'Aris§! a été systématiquement démantelée.\n\nFait intéressant, les anciens membres de la résistance n'ont pas été exilés ou assassinés, mais plutôt asservis par les Sirènes elles-mêmes, donnant l'impression troublante qu'ils ont tout simplement abandonné leurs idéaux précédents et se sont joints à leurs anciens adversaires.\n\nÀ ce sujet, les observations ont confirmé que les Sirènes sont effectivement capables de contrôler directement l'esprit d'autres êtres sapients grâce à leur chant mystérieux et envoûtant. Ce chant semble être alimenté par des cristaux particuliers logés dans les Sirènes elles-mêmes, bien que les mécanismes réels de cet envoûtement nous restent entièrement inconnus.\n\nCette capacité est ce qui permet aux Sirènes d'imposer activement leur contrôle, et elles utilisent déjà ce pouvoir pour essayer de sécuriser plusieurs des États-nations voisins de Sirenalia.\n\nAvec Sirenalia possédant une marine particulièrement importante ainsi qu'une puissante force aérienne, toutes deux héritées de l'ancien gouvernement hippogriffien, nous estimons que les Sirènes auront peu de mal à étendre leur influence au reste du nord de Zebrica dans les années à venir.\n\nQuant au reste de Faust, bien que certains expriment des inquiétudes concernant la croissance des Sirènes, la plupart les considèrent actuellement comme un empire de plus condamné à inévitablement rencontrer sa fin aux mains d'une future coalition."
  giga_eawaf.2002.a:99 "Continuer à surveiller."

  giga_eawaf.20021.name:99 "Les Sirènes renversées"
  giga_eawaf.20021.desc:99 "Il semble que le nouvel ordre des Sirènes n'était tout simplement pas destiné à perdurer. Après des mois d'action clandestine, les membres de la §YRésistance d'Aris§! ont éclaté en rébellion ouverte contre Sirenalia.\n\nDans les rues et les villes de la nation, les non-asservis combattent les asservis, ces derniers se battant jusqu'à la mort pour défendre leurs maîtresses. Finalement, cependant, et avec un soutien important d'§YEquestria§!, la résistance harmonique sort victorieuse alors que l'ordre des Sirènes s'effondre sur lui-même et que leur magie d'envoûtement, privée de sustentation, s'évanouit tout simplement.\n\nUn nouveau gouvernement hippogriffien unifié a été établi pour restaurer le statu quo, tandis que l'emplacement des Sirènes elles-mêmes est inconnu. Elles ont soit péri dans les combats, soit sont retournées dans les profondeurs des océans pour rassembler à nouveau leurs forces et peut-être attendre leur heure en préparation d'une autre tentative de domination planétaire.\n\nMais pour un avenir prévisible, les Hippogriffiens peuvent se reposer en sachant que les Sirènes ne sont plus une menace, du moins pour les prochains siècles."
  giga_eawaf.20021.a:99 "Elles ont trouvé leur match."

  giga_eawaf.2003.name:99 "La chute du nord de Zebrica"
  giga_eawaf.2003.desc:99 "Les voisins de Sirenalia n'avaient guère de chance face à l'avance implacable des Sirènes. Renforcées par leur marine et leur force aérienne extrêmement puissantes, les Sirènes ont lancé une série d'offensives dans les nations voisines de §YChiropterra§! et §YColthage§!, déclenchant la §YGuerre du Nord de Zebrica§!. Cette guerre se terminerait finalement par une victoire totale des Sirènes, qui ont peu après imposé leur hégémonie sur la majeure partie du nord de Zebrica.\n\nSuite à cette victoire formidable, les Sirènes regardent déjà vers leur prochaine cible majeure, à savoir la nation s'étendant sur tout le continent d'§YEquestria§!, située de l'autre côté de l'océan au nord-ouest de Sirenalia. Bien que nos scientifiques aient été initialement plutôt perplexes quant à la raison pour laquelle les Sirènes ont décidé de choisir un ennemi aussi puissant comme prochaine cible, des études supplémentaires ont révélé qu'un groupe d'individus connus sous le nom de §YPiliers d'Equestria§! avait apparemment causé la chute des Sirènes il y a de nombreux millénaires.\n\nOriginaires d'Equestria elle-même, ces « Piliers » ont, contre toute attente, été trouvés encore en vie, et les Sirènes semblent donc déterminées à exercer leur vengeance sur les Piliers pour leur bannissement précédent dans les profondeurs de la Fosse Maréïana.\n\nCette guerre à venir sera certainement d'une ampleur formidable, probablement la plus grande que Faust ait connue jusqu'à présent. Déjà les Sirènes ont entrepris de conquérir plus de nations dans des emplacements géographiques clés, notamment §YMarégypte§! et §YAbyssinie§! au sud-ouest, afin de les utiliser comme bases de préparation pour la future invasion d'Equestria.\n\nÉtant donné la puissance d'Equestria, beaucoup d'habitants de Faust croient que cela se terminera probablement par la disparition prématurée des Sirènes, mais les Sirènes elles-mêmes semblent déterminées à exécuter ce plan ambitieux jusqu'au bout."
  giga_eawaf.2003.a:99 "Cela promet d'être tout un combat."

  giga_eawaf.20031.name:99 "Sirenalia vaincue"
  giga_eawaf.20031.desc:99 "Malheureusement pour les Sirènes, les nations du nord de Zebrica se sont révélées être plus qu'à la hauteur pour l'empire naissant de Sirenalia.\n\nAprès une série d'assauts initialement réussis dans les nations de §YChiropterra§! et §YColthage§!, qui ont déclenché la §YGuerre du Nord de Zebrica§!, les offensives des Sirènes se sont rapidement enlisées alors que les nations susmentionnées se sont rapidement et de manière inattendue unies pour s'opposer aux avancées des Sirènes comme une seule.\n\nLa situation a été exacerbée par l'entrée en guerre de §YWingbardy§!, une nation puissante du sud de Griffonia. La marine wingbardienne a définitivement fait pencher la balance contre les Sirènes et ce n'était plus qu'une question de mois avant que les territoires centraux de Sirenalia ne soient menacés.\n\nAprès des mois de siège suivis de plusieurs offensives éprouvantes dans les capitales de Sirenalia, les Sirènes, réalisant que leur défaite était pratiquement inévitable, ont fui la scène et ont disparu une fois de plus dans les profondeurs de l'océan.\n\nAvec les Sirènes parties, ce qui restait du gouvernement de Sirenalia s'est rapidement effondré et ses anciennes terres ont été placées sous un mandat de reconstruction chargé de superviser la reconstruction de la région et l'élimination totale des quelques fanatiques pro-sirènes restants.\n\nLa véritable localisation des Sirènes est inconnue, mais il est peu probable qu'elles réapparaissent avant au moins plusieurs siècles, et elles ont donc été considérées comme définitivement vaincues par la majorité des habitants de Faust."
  giga_eawaf.20031.a:99 "Elles ont trouvé leur match."

  giga_eawaf.2004.name:99 "Les Sirènes renversent Equestria"
  giga_eawaf.2004.desc:99 "L'impensable s'est produit ! Contre toute attente, §YSirenalia§! a triomphé de la nation s'étendant sur tout le continent d'§YEquestria§!.\n\nUne série d'invasions navales foudroyantes a frappé les côtes sud-est d'Equestria avec une vitesse et une puissance inégalées, avec des millions de troupes asservies progressant vers le nord en direction de la capitale équestienne de §YCanterlot§!.\n\nUne combinaison de charges suicides et de guerre chimique a permis aux armées des Sirènes d'infliger un coup dévastateur au moral des Équestiens pris au dépourvu, et il n'a pas fallu longtemps avant que Sirenalia n'ait encerclé la capitale et occupé la plupart des grands centres industriels et de population d'Equestria.\n\nAvec la chute éventuelle de Canterlot, les Sirènes ont procédé à l'envoûtement des protecteurs les plus puissants d'Equestria et ont utilisé leurs pouvoirs pour bannir les esprits des deux §YAlicornes§! régnantes d'Equestria dans §YHélios§! et §YSélène§!, avant de jeter les Piliers d'Equestria dans les profondeurs de l'Immatériel lui-même, s'assurant ainsi un contrôle total sur Equestria et son peuple.\n\nAvec la chute de la nation la plus puissante de Faust, les Sirènes ont maintenant accès à des quantités de main-d'oeuvre et d'industrie sans précédent, qu'elles utilisent déjà pour lancer des offensives contre les voisins du nord d'Equestria afin de sécuriser complètement le continent d'§YEquus§!.\n\nNotre avant-poste croit qu'il n'est maintenant qu'une question de temps avant que l'influence des Sirènes ne s'étende à l'ensemble de Faust... et peut-être même au-delà."
  giga_eawaf.2004.a:99 "Elles sont remarquablement efficaces."
  giga_eawaf.2004.a.tooltip:99 "Si nous essayions d'arrêter les Sirènes, il est maintenant trop tard pour faire quoi que ce soit au-delà d'une invasion terrestre directe."

  giga_eawaf.20042.name:99 "Aperçus surnaturels"
  giga_eawaf.20042.desc:99 "Nos études des méthodes des Sirènes, ainsi que l'examen plus approfondi des cristaux thaumaturgiques très atypiques de Faust, ont enfin porté leurs fruits.\n\nEn effet, tout sur ce monde et sa nature pointe vers l'existence d'une « force » sous-jacente imprégnant tout ce qui est conscient, que les Sirènes semblent manipuler activement pour atteindre leurs objectifs. Nos équipes scientifiques sont impatientes d'approfondir ce phénomène."
  giga_eawaf.20042.a:99 "Fascinant... mener des études approfondies !"
  giga_eawaf.20042.b:99 "Cela ne vaut pas notre temps."

  giga_eawaf.20041.name:99 "Equestria anéantit les Sirènes"
  giga_eawaf.20041.desc:99 "Comme beaucoup s'y attendaient, l'assaut des Sirènes sur §YEquestria§! s'est avéré être un désastre complet. Bien que l'invasion ait été initialement réussie, Equestria a réussi à mobiliser rapidement ses immenses réserves de main-d'oeuvre, les utilisant pour d'abord stopper, puis repousser les avancées de Sirenalia sur Equus.\n\nCela a été suivi par le lancement d'une vaste invasion amphibie multi-axes des terres centrales de Sirenalia, à laquelle les Sirènes ont opposé une résistance incroyable, avant d'être finalement submergées par la puissance industrielle et militaire pure des Équestiens.\n\nSuite à la capture complète de Sirenalia proprement dite, les Alicornes régnantes d'Equestria ont procédé à la capture des Sirènes alors qu'elles tentaient de fuir. Afin de s'assurer que Sirenalia ne puisse jamais réapparaître, les Piliers d'Equestria aux côtés des Alicornes ont combiné leurs pouvoirs pour bannir les âmes mêmes des Sirènes dans les profondeurs de l'Immatériel, où elles devraient rester emprisonnées pendant au moins plusieurs millénaires.\n\nAvec Sirenalia vaincue et ses dirigeantes elles-mêmes bannies de la réalité, les espoirs de domination mondiale des Sirènes ont été définitivement anéantis."
  giga_eawaf.20041.a:99 "Alors il y a de l'espoir pour Faust après tout."

  giga_eawaf.2005.name:99 "Les Sirènes subjuguent Faust"
  giga_eawaf.2005.desc:99 "Avec la chute d'§YEquestria§! face aux Sirènes, ce n'était qu'une question de temps avant que le reste de Faust ne tombe également. Malgré les tentatives hâtives d'unification par les autres nations pour contrer l'ascension des Sirènes, cela s'est finalement avéré être trop peu, trop tard.\n\nEt ainsi, après plusieurs années de guerre intense, les Sirènes ont enfin étendu l'influence de §YSirenalia§! sur l'ensemble de Faust. À travers la surface du monde, deux milliards de sapients sont tombés sous le charme envoûtant des Sirènes, travaillant sans relâche pour alimenter la puissance industrielle toujours croissante de Sirenalia.\n\nAvec le monde entier sous leur contrôle, il semble évident que la prochaine étape pour les Sirènes pourrait bien être de prendre les étoiles, bien que les moyens par lesquels elles le feraient soient flous. Malgré leur magie puissante, Sirenalia est, en l'état, complètement et désespérément surpassée même par un empire interstellaire naissant, et toute tentative d'expansion dans l'espace serait probablement accueillie par une puissance de feu écrasante.\n\nPour l'instant, notre avant-poste continuera d'observer les Sirènes, et informera notre gouvernement et nos forces armées immédiatement si Sirenalia commence à planifier son expansion dans l'espace."
  giga_eawaf.2005.a:99 "Nous les écraserons si elles tentent quoi que ce soit."

  giga_eawaf.20051.name:99 "Le secret des Sirènes ?"
  giga_eawaf.20051.desc:99 "Notre soutien clandestin aux Sirènes nous a permis d'obtenir des informations précieuses sur le fonctionnement interne du sortilège des Sirènes et sur la façon dont les cristaux thaumaturgiques de Faust ont été activement utilisés par Sirenalia afin de renforcer leur sortilège à travers le monde.\n\nNos scientifiques sont maintenant convaincus que, en utilisant quelques échantillons de ces cristaux récupérés dans la ceinture d'astéroïdes locale, ils pourraient être capables de reproduire d'une manière ou d'une autre ces effets, bien qu'à plus petite échelle et avec une efficacité bien moindre, ce qui aurait des... applications intéressantes au sein de notre gouvernement et de notre société."
  giga_eawaf.20051.hatepsi.desc:99 "Notre soutien clandestin aux Sirènes nous a permis d'obtenir des informations précieuses sur le fonctionnement interne du sortilège des Sirènes et sur la façon dont les cristaux thaumaturgiques de Faust ont été activement utilisés par Sirenalia afin de renforcer leur sortilège à travers le monde.\n\nNos scientifiques sont maintenant convaincus que, en utilisant quelques échantillons de ces cristaux récupérés dans la ceinture d'astéroïdes locale, ils pourraient être capables de reproduire d'une manière ou d'une autre ces effets, bien qu'à plus petite échelle et avec une efficacité bien moindre, ce qui nous permettrait de rechercher des défenses contre de telles menaces néfastes."
  giga_eawaf.20051.a:99 "Nous devons investiguer leurs méthodes davantage."
  giga_eawaf.20051.b:99 "C'est bien trop dangereux."

  giga_eawaf.20061.name:99 "Surtension d'énergie thaumaturgique"
  giga_eawaf.20061.desc:99 "Les instruments de notre station sur Faust se sont soudainement affolés. Un pic d'énergie extrêmement puissant commence à apparaître à la surface de Faust, apparemment centré autour de la capitale de Sirenalia.\n\nIl semblerait que les Sirènes soient en train de rassembler l'approvisionnement en cristaux thaumaturgiques de Faust afin de lancer une sorte de sortilège gigantesque. Selon nos relevés, l'énergie contenue dans tous les cristaux de Faust serait suffisante pour générer un champ thaumaturgique s'étendant non seulement sur la surface de Faust, mais aussi sur l'ensemble de son système planétaire local.\n\nOn ne sait pas quels pourraient être les effets de ce « sortilège », mais tout se déroule bien trop vite pour que nous puissions réellement intervenir. À ce titre, nos scientifiques nous exhortent à §Révacuer tous les actifs de valeur du système de Faust§! avant que la surtension n'atteigne son apogée, estimé à environ §Y3 mois§!."
  giga_eawaf.20061.a:99 "Ce n'est pas bon."

  giga_eawaf.20071.name:99 "Faust englouti dans un linceul éthéré"
  giga_eawaf.20071.desc:99 "Alors que la surtension atteint son intensité maximale, Faust et l'ensemble de son système planétaire disparaissent tout simplement...\n\nSuite à l'aboutissement du grand sortilège des Sirènes, une masse colossale d'énergie éthérée émerge de Faust, vraisemblablement déchargée par d'énormes quantités de cristaux thaumaturgiques. Ce champ s'étend d'abord pour entourer Sirenalia, puis Faust, et finalement, l'ensemble du système.\n\nIl ne faut que quelques heures pour que le champ engloutisse tout le voisinage planétaire de Faust, avec tout ce qui se trouve à proximité, qu'il s'agisse de vaisseaux, de planètes ou de débris flottants, inévitablement absorbé par le champ.\n\nAprès environ un jour, le champ, maintenant baptisé le §YLinceul éthéré§!, se stabilise, perturbant toutes les hyper-lignes et rendant les autres formes de voyage FTL tout simplement impossibles. Les vaisseaux et transmissions envoyés pour investiguer le système disparaissent tout simplement de l'existence, pour ne plus jamais être revus. La conclusion est claire : pour le moment, le système Faust a essentiellement été retiré de la galaxie, évidemment à cause des plans des Sirènes.\n\nBien qu'il soit incertain si ce linceul étrange se dissipera un jour, de légères variations dans ses signatures énergétiques semblent indiquer qu'il pourrait éventuellement disparaître après environ §Yun siècle§!, bien que la précision de cette estimation reste à voir."
  giga_eawaf.20071.a:99 "Comme c'est... particulier. On dirait qu'elles sont parties."
  giga_eawaf.20071.hatepsi.a:99 "Nos défenses actuelles ne suffisent pas à nous protéger."
  giga_eawaf.20071.a.tooltip:99 "§YFaust§! est englouti dans le §YLinceul éthéré§! pour au moins supposément §Yun siècle§!. Toute tentative de pénétrer dans le système est vouée à se terminer de manière catastrophique.\n§RIl serait peut-être sage de rester à l'écart des systèmes directement voisins du linceul...§!"

  giga_eawaf.20072.name:99 "Le système Faust englouti dans un linceul éthéré"
  giga_eawaf.20072.desc:99 "Le système particulier de §YFaust§!, connu pour abriter une étoile miniature orbitant autour d'un monde tellurique, a soudainement disparu de tous les capteurs à travers la galaxie.\n\nDes investigations plus poussées ont révélé que l'ensemble du système — y compris Faust elle-même et tous les vaisseaux qui auraient pu être présents — a été englouti dans un colossal §YLinceul éthéré§!, qui interdit toute observation ou entrée dans le système lui-même.\n\nDes rapports épars indiquent qu'il s'agit de l'oeuvre d'une sorte de « sortilège » lancé par §YSirenalia§!, une hyperpuissance planétaire qui avait récemment réussi à unifier tout Faust sous un sortilège de contrôle mental envoûtant après une série de guerres éprouvantes.\n\nLe but de ce linceul est inconnu, mais les fluctuations des schémas énergétiques du linceul indiquent qu'il y a une chance qu'il commence à se dissiper après environ §Yun siècle§!, mais si cela est autre chose qu'une prédiction aléatoire reste à voir.\n\nPour le moment, l'ensemble du système a essentiellement été retiré de la galaxie, et il serait sage de faire preuve de prudence à proximité de cet étrange champ."
  giga_eawaf.20072.a:99 "Des plus particuliers."
  giga_eawaf.20072.hatepsi.a:99 "Qu'avons-nous manqué ?!"

  giga_eawaf.30001.name:99 "Fluctuation du linceul éthéré"
  giga_eawaf.30001.desc:99 "Au cours des derniers mois, les relevés d'énergie thaumaturgique émanant du §YLinceul éthéré§!, qui étaient restés stables depuis la disparition de §YFaust§!, ont commencé à fluctuer sans raison apparente.\n\nBien que les détails de ce qui pourrait se passer à l'intérieur du linceul nous échappent encore, cela indique évidemment une sorte d'activité des §YSirènes§! qui avaient pris le contrôle du système par la force des armes des années auparavant.\n\nDe manière inquiétante, les schémas de fluctuations suggèrent que le linceul éthéré est susceptible de finir par se désagréger dans les §Ycinq prochaines années§!."
  giga_eawaf.30001.a:99 "Nous devrions nous attendre au pire."

  giga_eawaf.30002.name:99 "Sirenalia — §HAdagio Dazzle§!"
  giga_eawaf.30002.desc:99 "Mortels ! Je n'ai jamais été du genre à faire des avant-premières, alors passons directement à l'acte principal cette fois. Cette galaxie que vous pensez être la vôtre est en fait à nous pour la prendre, et nous avons l'intention de la faire nôtre très bientôt. Vous pouvez toujours choisir de vous soumettre maintenant, mais nous savons tous les deux comment se joue ce jeu, n'est-ce pas ? J'ai hâte de voir ce que vous aurez à nous offrir à la fin."
  giga_eawaf.30002.bye:99 "Nous renverrons votre espèce dans les profondeurs !"

  giga_eawaf.30003.name:99 "Le retour des Sirènes"
  giga_eawaf.30003.desc:99 "Il est évident que, loin de s'isoler, les Sirènes ont comploté et planifié sous le linceul éthéré. Autour du monde autrefois verdoyant de §YFaust§!, maintenant transformé en un vaste paysage d'enfer psi-industriel, se profile une mégastructure ésotérique baptisée l'§YEnvoûteur linceulsonique§!, dont le but est clair : amplifier la portée du chant de contrôle mental des Sirènes pour couvrir la §Rgalaxie entière§!.\n\nPour ce faire, l'Envoûteur génère évidemment un puissant §RChamp de discorde§! centré autour de Faust. Près de Faust, dans ce qui est maintenant connu comme le §RChamp intérieur§!, le sortilège est suffisamment puissant pour §Rcontrôler instantanément l'esprit§! de tout vaisseau s'approchant trop près, et il est donc primordial que nous §Révitions§! ce champ intérieur à tout prix jusqu'à ce que des contre-mesures puissent être conçues.\n\nPlus loin, les effets du champ s'estompent mais restent néanmoins présents dans le §PChamp extérieur§!, qui s'étend bien au-delà des frontières de Sirenalia et pousse les populations des mondes pris dans le champ extérieur à ressentir des niveaux plus élevés de discorde et de haine les uns envers les autres.\n\nDe manière alarmante, cette discorde est évidemment ce qui « nourrit » les Sirènes, ce qui signifie que plus elles acquièrent de §RDiscorde§!, plus l'§YEnvoûteur linceulsonique§! sera capable de projeter le sortilège... et plus les Sirènes auront de discorde. Il va donc sans dire que Sirenalia doit être arrêtée avant que l'envoûteur ne déclenche une boucle de rétroaction positive résultant en l'engloutissement de toute notre galaxie par le §RChamp intérieur§!.\n\nComme les rouages internes de la « Discorde », de l'Envoûteur, du sortilège et du champ nous échappent encore, une §YSituation§! a été mise en place pour suivre notre progression concernant notre connaissance des Sirènes."
  giga_eawaf.30003.a:99 "Continuer à les surveiller."
  giga_eawaf.30003.hatepsi.a:99 "Toutes nos craintes deviennent réalité."

  # Diplo with Sirens
  giga_eawaf.4000.name:99 "Sirenalia"
  giga_eawaf.4000.desc.adagio:99 "Êtes-vous venus offrir votre reddition complète et inconditionnelle ? Non ? Alors pourquoi vous donnez-vous même la peine d'être ici ?\n\n\n\n$giga_eawaf_adagio_buffs$"
  giga_eawaf.4000.desc.aria:99 "Faites vite. Je n'ai pas toute la journée à perdre mon temps avec des créatures comme vous.\n\n\n\n$giga_eawaf_aria_buffs$"
  giga_eawaf.4000.desc.sonata:99 "Ooooh, je ne crois pas vous avoir déjà vus ! Ou peut-être que si ! Il y a tellement de vous autres bizarres nouveaux à suivre, vous savez !\n\n\n\n$giga_eawaf_sonata_buffs$"
  giga_eawaf.4000.bye:99 "Écran de visualisation éteint."

  # Final Event Chain

  giga_eawaf.6000.name:99 "Défenses extérieures de l'Envoûteur percées !"
  giga_eawaf.6000.desc:99 "Nos braves flottes ont réussi à détruire les emplacements d'armes extérieurs du redoutable §YEnvoûteur linceulsonique§! des Sirènes.\n\nPar conséquent, la perte de ces points d'appui critiques a exposé le §YCoeur abyssal§! de l'Envoûteur enroulé autour de Faust elle-même et alimentant tout l'appareil, qui devrait être détruit avec la plus grande hâte si nous voulons enfin mettre fin à la folie des Sirènes."
  giga_eawaf.6000.a:99 "Assaut immédiat !"

  giga_eawaf.6001.name:99 "Envoûteur linceulsonique détruit !"
  giga_eawaf.6001.desc:99 "Avec la destruction du §YCoeur abyssal§! de l'Envoûteur, qui servait de « condensateur » amplifiant le sortilège des Sirènes à travers la galaxie, l'autrefois puissante mégastructure s'est rapidement effondrée de manière catastrophique en un champ de décombres de la taille d'une planète entourant Faust elle-même.\n\nCela a été rapidement suivi par la désintégration complète du §YChamp de discorde§! et la perte subséquente du contrôle des Sirènes sur la plupart de leurs actifs directement en dehors de Faust elle-même, où les Sirènes se sont maintenant retirées dans l'attente d'un dernier combat désespéré."
  giga_eawaf.6001.a:99 "Elles n'ont plus nulle part où fuir maintenant."

  giga_eawaf.60022.name:99 "Le dernier combat des Sirènes"
  giga_eawaf.60022.a.desc:99 "Alors que nos armées touchent terre sur §YFaust§!, les Sirènes, acculées, ont commencé à jeter des millions et des millions de Faustiens sous contrôle mental directement sur nos légions !\n\nAu grand désarroi de nos commandants, des nations entières de vassaux, souvent sans équipement approprié ni expérience de combat, marchent maintenant vers leur mort dans une tentative désespérée de ralentir notre avance inévitable sur leur monde.\n\nIl est évident que, si rien n'est fait, les Sirènes ont bien l'intention de sacrifier l'intégralité de la population innocente de Faust — et donc la plus grande partie de la valeur réelle de la planète — afin de s'acheter un peu plus de temps..."
  giga_eawaf.60022.b.desc:99 "Alors que nos flottes bombardent §YFaust§!, les Sirènes, acculées, ont commencé à jeter des millions et des millions de Faustiens sous contrôle mental pour préserver les défenses de la planète !\n\nAu grand désarroi de nos amiraux, des nations entières de vassaux, souvent sans équipement approprié ni expérience de combat, s'alignent pour équiper les restes de l'armement anti-orbital de Faust, forçant nos vaisseaux à continuer de tirer.\n\nIl est évident que, si rien n'est fait, les Sirènes ont bien l'intention de sacrifier l'intégralité de la population innocente de Faust — et donc la plus grande partie de la valeur réelle de la planète — afin de s'acheter un peu plus de temps..."
  giga_eawaf.60022.a:99 "Nous devons arrêter cela immédiatement ! Investiguer un moyen de libérer les Faustiens."
  giga_eawaf.60022.b:99 "Que ce monde se brise sous notre puissance si c'est ce qu'elles souhaitent."

  giga_eawaf.60024.name:99 "La destruction de Faust"
  giga_eawaf.60024.desc:99 "Par une force écrasante, le monde de §YFaust§! a été totalement détruit aux côtés de ses maîtresses Sirènes. Bien que cela ait causé d'innombrables morts, cela assurera enfin la fin définitive de la folie des Sirènes."
  giga_eawaf.60024.a:99 "C'était pour le plus grand bien."

  giga_eawaf.60025.name:99 "La chute de Faust"
  giga_eawaf.60025.desc:99 "Malgré les meilleurs efforts des Sirènes, et le sacrifice vain de milliards de Faustiens, le monde de §YFaust§! est tombé sous notre puissance.\n\nOu du moins, ce qu'il en reste. Plus de quatre-vingt-dix-neuf pour cent de la population de la planète a péri dans les combats, laissant des continents entiers dépourvus de vie intelligente et couverts des sinistres vestiges squelettiques de cités et de zones industrielles gigantesques que nos forces procèdent maintenant à occuper. Un maigre un pour cent de l'ancienne population a réussi à survivre lorsque le sortilège des Sirènes s'est dissipé en raison de l'amenuisement rapide de la population de Faust.\n\nQuant aux §YSirènes§! elles-mêmes, elles se sont évidemment retirées dans les profondeurs de la §YFosse Maréïana§! d'où elles ont émergé pour la première fois, mais nos commandants nous ont assuré que les forces planétaires organisent déjà une expédition dans les profondeurs océaniques afin d'abattre ces bêtes une fois pour toutes."
  giga_eawaf.60025.a:99 "Victoire, mais à quel prix ?"

  giga_eawaf.60251.name:99 "La fin des Sirènes"
  giga_eawaf.60251.desc:99 "La fin des Sirènes a été, faute de meilleurs termes, plutôt anti-climatique. Suite à la descente de notre expédition dans la Fosse Maréïana, ses membres ont rapidement localisé les Sirènes se cachant dans des formations géologiques arcaniques au fond de l'océan.\n\nElles ont bien sûr tenté de résister par l'usage de leur magie, mais, totalement dépourvues d'une population dont tirer de la haine, et désespérément contrées par notre technologie de Désenchanteur, ces tentatives n'ont guère fait plus que provoquer des pics de relevés d'énergie dans les combinaisons de plongée de nos soldats et ce qui a suivi a été tout simplement la vaporisation rapide des trois Sirènes via des armes à haute énergie.\n\nCependant, étrangement, les cristaux rouges qui étaient autrefois incrustés dans les Sirènes et leur fournissaient supposément leurs pouvoirs ont été trouvés avoir survécu à toute cette épreuve d'une manière ou d'une autre et ont été récupérés par nos soldats dans des conteneurs thaumaturgiquement sécurisés pour un examen plus approfondi."
  giga_eawaf.60251.a:99 "Ces cristaux... pourraient être utiles."
  giga_eawaf.60251.b:99 "Jetez-les dans le soleil, détruisez-les !"
  giga_eawaf.60251.hatepsi.b:99 "Nous ne faiblirons pas maintenant. Détruisez-les."

  giga_eawaf.60026.name:99 "La chute de Faust"
  giga_eawaf.60026.desc:99 "Malgré les meilleurs efforts des Sirènes, et le sacrifice vain de milliards de Faustiens, le monde de §YFaust§! est tombé sous la puissance de §Y[giga_eawaf_sirens_killer_country.GetName]§!.\n\nOu du moins, ce qu'il en reste. Plus de quatre-vingt-dix-neuf pour cent de la population de la planète a péri dans les combats, laissant des continents entiers dépourvus de vie intelligente et couverts des sinistres vestiges squelettiques de cités et de zones industrielles gigantesques. Un maigre un pour cent de l'ancienne population a réussi à survivre lorsque le sortilège des Sirènes s'est dissipé en raison de l'amenuisement rapide de la population de Faust.\n\nQuant aux §YSirènes§! elles-mêmes, elles se sont évidemment retirées dans les profondeurs de la §YFosse Maréïana§! d'où elles ont émergé pour la première fois, bien qu'il soit probable que §Y[giga_eawaf_sirens_killer_country.GetName]§! s'en occupera rapidement."
  giga_eawaf.60026.a:99 "Une sombre victoire."

  giga_eawaf.60027.name:99 "Visions du miroir"
  giga_eawaf.60027.desc:99 "Notre département scientifique rapporte que, suite à des scans orbitaux de Faust couplés à des expéditions téméraires à la surface, ils auraient peut-être trouvé un moyen de neutraliser les Sirènes sans avoir à sacrifier toute la population de Faust.\n\nEn effet, bien qu'il soit déjà connu que Faust résidait dans une zone de l'espace-temps où la « réalité » était plus faible, on a maintenant découvert qu'un point spécifique sur la surface de Faust, situé près de ce que les autochtones appelaient §YCanterlot§!, se trouve à proximité dimensionnelle d'un « royaume miroir ».\n\nLa raison de ce lien ainsi que la nature de ce royaume sont inconnues, mais notre département scientifique théorise qu'il pourrait être possible de, en utilisant des échantillons des cristaux de contrôle mental utilisés par les Sirènes ainsi que la décharge orbitale soudaine d'une grande quantité d'énergie dans la zone concernée, « briser » le tissu de la réalité et créer un « vortex dimensionnel » temporaire que nous pourrions ensuite utiliser pour « bannir » les Sirènes dans la dimension alternative susmentionnée.\n\nCe plan nécessiterait cependant une hâte extrême et une connaissance parfaite de la situation par un « sacrifice » chargé de plonger dans le vortex avec des cristaux soigneusement accordés afin de provoquer la réaction en chaîne thaumaturgique nécessaire pour attirer et ensuite bannir les Sirènes.\n\nEn l'état, seul §Y[giga_eawaf_sirens_scientist_sacrifice.GetName]§! serait capable d'accomplir un tel exploit."

  giga_eawaf.60027.a:99 "Approuvé. Procédez immédiatement, quel qu'en soit le coût !"
  giga_eawaf.60027.b:99 "Refusé. Ce monde ne vaut pas [giga_eawaf_sirens_scientist_sacrifice.GetName]."

  giga_eawaf.60028.name:99 "Les Sirènes bannies"
  giga_eawaf.60028.desc:99 "Alors que la décharge d'énergie scintillante de nos actifs orbitaux frappe la surface de Faust là où se trouve la faille dimensionnelle, §Y[giga_eawaf_sirens_scientist_sacrifice.GetName]§! plonge dans la déchirure grandissante de l'espace-temps aux côtés d'un ensemble de cristaux thaumaturgiques soigneusement accordés pour imiter ceux incrustés dans les Sirènes elles-mêmes.\n\nComme prévu, cela déclenche un « enchevêtrement » thaumaturgique qui « traîne » les Sirènes impuissantes hors de leur cachette sur Faust et directement dans le vortex dimensionnel aux côtés de notre officier — juste avant que tout le vortex, inapte à exister dans notre réalité plus de quelques secondes, ne s'effondre sur lui-même, emportant [giga_eawaf_sirens_scientist_sacrifice.GetName] et les Sirènes avec lui.\n\nCe qui suit est l'effondrement complet de l'emprise des Sirènes sur Faust et la libération subséquente de la population de Faust de leur emprise diabolique, stoppant effectivement leurs tactiques d'assaut de masse implacables. Bien que Faust et ses habitants resteront probablement marqués pendant de nombreuses années à venir, les Sirènes ont enfin été définitivement expulsées de notre réalité."
  giga_eawaf.60028.a:99 "Elles ne nous troubleront plus."

  giga_eawaf.60029.name:99 "Un étrange miroir"
  giga_eawaf.60029.desc:99 "Suite à la disparition des Sirènes, nos scientifiques ont mené une investigation de §YCanterlot§!, l'emplacement où l'étrange faille dimensionnelle a été initialement détectée.\n\nIls rapportent qu'un artefact particulier, semblable à une sorte de « miroir de cristal » orné, a été trouvé profondément sous la surface, avec des études supplémentaires révélant que ce dispositif particulier est très probablement à l'origine de la connexion interdimensionnelle qui nous a permis de bannir les Sirènes de notre réalité.\n\nL'activation contrôlée du miroir suivie d'un sondage prudent à l'aide de sondes furtives a révélé une connexion à une sorte de Royaume alternatif peuplé d'humanoïdes colorés qui semblent régulièrement participer à des célébrations musicales rituelles.\n\nBien que révéler réellement notre présence à cette dimension ou en extraire qui que ce soit reste totalement déconseillé, en raison du risque que les Sirènes remarquent ce chemin de retour vers notre réalité, nous pourrions très bien garder le miroir dans une installation sécurisée, ce qui nous permettrait d'étudier ses habitants particuliers ainsi que leurs rituels musicaux."
  giga_eawaf.60029.a:99 "Curieux. Gardons-le."
  giga_eawaf.60029.b:99 "Bien trop dangereux ! Scellez-le pour de bon."

  giga_eawaf.60032.name:99 "Sirenalia vaincue"
  giga_eawaf.60032.desc:99 "Suite à la disparition finale de §HAdagio Dazzle§!, §MAria Blaze§! et §BSonata Dusk§! aux mains de §Y[giga_eawaf_sirens_killer_country.GetName]§!, les redoutables §YSirènes§! qui avaient menacé de contrôler mentalement Faust et la galaxie dans son ensemble pendant plusieurs décennies, leur empire de §YSirenalia§! a définitivement été jeté aux poubelles de l'histoire.\n\nTous les vaisseaux et planètes restants sous l'influence des Sirènes se sont soit auto-détruits, libérés eux-mêmes, soit sont retournés à leurs anciens propriétaires. Et ainsi la communauté galactique pousse un soupir collectif de soulagement alors que le plan dérangé des Sirènes pour atteindre « l'unité galactique éternelle » a enfin été définitivement anéanti."
  giga_eawaf.60032.a:99 "Le choeur des Sirènes s'éteint enfin."

  giga_eawaf.5001.name:99 "Prototype de désenchanteur conçu"
  giga_eawaf.5001.desc:99 "Nos chercheurs rapportent que nos efforts pour comprendre et contrer les Sirènes commencent à porter leurs fruits, même si c'est peu.\n\nBien que la nature profonde du chant mystérieux des Sirènes nous échappe encore, des études préliminaires suggèrent que tirer des décharges d'énergie focalisées à des fréquences spécifiques dans le quasi-espace peut atténuer certains des effets du champ de discorde, au prix d'une augmentation drastique de l'entretien des vaisseaux sur lesquels ces mécanismes sont montés, ainsi que d'une entrave à la mobilité lorsqu'ils sont actifs.\n\nBaptisés §YDésenchanteurs§!, ces dispositifs avancés semblent être une option viable pour contrer les Sirènes et seront étudiés plus avant."
  giga_eawaf.5001.a:99 "Il y a de l'espoir."
  giga_eawaf.5001.a.tooltip:99 "Nous devrons rechercher la technologie du Désenchanteur afin de continuer la situation §YContrer les Sirènes§!. Notre approche a été réglée sur §YPas d'études sur les Sirènes§! en attendant pour éviter de gaspiller des ressources."

  giga_eawaf.5002.name:99 "Désenchanteur accordé conçu"
  giga_eawaf.5002.desc:99 "De nouvelles avancées dans la recherche anti-Sirènes ont produit des modèles de Désenchanteurs améliorés avec une efficacité accrue.\n\nBien qu'ils ne soient pas encore assez puissants pour repousser le néfaste §RChamp intérieur§!, ces designs devraient permettre à nos vaisseaux d'opérer dans le §PChamp extérieur§! sans pénalités de vitesse."
  giga_eawaf.5002.a:99 "Mettez-vous-y immédiatement."

  giga_eawaf.5003.name:99 "Désenchanteur symphonieux conçu"
  giga_eawaf.5003.desc:99 "Nos équipes scientifiques rapportent que des percées récentes dans la technologie du Désenchanteur devraient permettre à ces designs améliorés de repousser non seulement le §PChamp extérieur§!, mais aussi d'être suffisamment efficaces pour repousser même le §RChamp intérieur§! et permettre à nos vaisseaux d'opérer même dans les profondeurs du territoire des Sirènes, bien qu'à des vitesses drastiquement réduites.\n\nCela signifie que, à condition de posséder une puissance de feu suffisante, il devrait maintenant être possible de mettre enfin fin à la folie des Sirènes."
  giga_eawaf.5003.a:99 "Excellent."

  giga_eawaf.5004.name:99 "Désenchanteur euphonique conçu"
  giga_eawaf.5004.desc:99 "D'autres améliorations à nos Désenchanteurs existants ont produit le §YDésenchanteur euphonique§! — le dernier mot en matière de technologie anti-Sirènes. Capable d'opérer n'importe où dans le champ de discorde sans impact sur la vitesse du vaisseau, cela devrait permettre à nos vaisseaux de mener des frappes n'importe où contre les Sirènes et à tout moment.\n\nNos ingénieurs ont également élaboré des plans pour le cousin mégastructurel de la famille des Désenchanteurs, le §Y$anti_sirens_shield$§! — capable de protéger des systèmes stellaires entiers du chant des Sirènes.\n\n"
  giga_eawaf.5004.a:99 "Délicieux ! Elles seront bientôt impuissantes."

  giga_eawaf.1104.name:99 "Armement thaumaturgique"
  giga_eawaf.1104.desc:99 "L'§YArmement thaumaturgique§! que nous avons réussi à rétro-concevoir des Sirènes présente la propriété particulière d'être aussi puissant que la quantité d'énergie que nous pouvons réussir à y injecter en toute sécurité.\n\nAinsi, nous avons conçu une nouvelle technologie reproductible visant à augmenter continuellement la puissance de ces armes."
  giga_eawaf.1104.a:99 "Intrigant."

  # Technologies
  giga_tech_eawaf_psifusion:99 "Fusion psicatalysée industrielle"
  giga_tech_eawaf_psifusion_desc:99 "Répliquer les rouages ésotériques du coeur infernal d'Hélios dans un environnement contrôlé et à l'échelle industrielle permet une production d'énergie formidable et la production facilitée d'éléments lourds."

  giga_tech_eawaf_weapons_repeatable:99 "Armement thaumaturgique surchargé"
  giga_tech_eawaf_weapons_repeatable_desc:99 "La nature ésotérique de l'armement thaumaturgique signifie qu'il n'y a essentiellement aucune limite supérieure à leur potentiel. Tant que plus d'énergie peut être injectée aux côtés de plus de cristaux pour transporter cette énergie, ils peuvent continuer à devenir de plus en plus puissants."
  giga_tech_eawaf_weapons_repeatable_title:99 "Dégâts des ['concept_giga_eawaf_thaumaturgic_weapons', Armes thaumaturgiques] : §G+10 %§!\nEntretien des ['concept_giga_eawaf_thaumaturgic_weapons', Armes thaumaturgiques] : §R+5 %§!"

  giga_tech_eawaf_sirens_secret:99 "Envoûtement thaumaturgique"
  giga_tech_eawaf_sirens_secret_desc:99 "Étudier comment les Sirènes déclenchent leur sortilège d'envoûtement pourrait avoir de grandes applications pour notre gouvernement et notre société."
  edict_giga_eawaf_sirens_secret:99 "$giga_tech_eawaf_sirens_secret$"
  edict_giga_eawaf_sirens_secret_desc:99 "Les échantillons de cristaux thaumaturgiques permettent une recréation limitée des capacités de contrôle mental des Sirènes, nous amenant ainsi à une hégémonie harmonieuse de volonté."
  edict_giga_eawaf_sirens_secret_gestalt:99 "$edict_giga_eawaf_sirens_secret$"
  edict_giga_eawaf_sirens_secret_gestalt_desc:99 "$edict_giga_eawaf_sirens_secret_desc$"
  edict_giga_eawaf_sirens_secret_mindwardens:99 "Sociofortification thaumaturgique"
  edict_giga_eawaf_sirens_secret_mindwardens_desc:99 "Les échantillons de cristaux thaumaturgiques permettent une recréation limitée des capacités de contrôle mental des Sirènes, qui peuvent être soigneusement étudiées pour améliorer la résilience de notre société contre la discorde armée."

  giga_tech_eawaf_sirens_strike_craft:99 "$GIGA_EAWAF_STRIKE_CRAFT$"
  giga_tech_eawaf_sirens_strike_craft_desc:99 "$GIGA_EAWAF_STRIKE_CRAFT_DESC$"

  giga_tech_eawaf_sirens_autocannon:99 "$GIGA_EAWAF_CRYSTAL_AUTOCANNON$"
  giga_tech_eawaf_sirens_autocannon_desc:99 "$GIGA_EAWAF_CRYSTAL_AUTOCANNON_DESC$"

  giga_tech_eawaf_sirens_artillery:99 "$GIGA_EAWAF_CRYSTAL_ARTILLERY$"
  giga_tech_eawaf_sirens_artillery_desc:99 "$GIGA_EAWAF_CRYSTAL_ARTILLERY_DESC$"

  giga_tech_eawaf_sirens_missile:99 "$GIGA_EAWAF_PSIONIC_CHARGE$"
  giga_tech_eawaf_sirens_missile_desc:99 "$GIGA_EAWAF_PSIONIC_CHARGE_DESC$"

  giga_tech_eawaf_sirens_impactor:99 "$GIGA_EAWAF_CRYSTAL_IMPACTOR$"
  giga_tech_eawaf_sirens_impactor_desc:99 "$GIGA_EAWAF_CRYSTAL_IMPACTOR_DESC$"

  giga_tech_eawaf_sirens_voidbeam:99 "$GIGA_EAWAF_GRAND_VOID_BEAM$"
  giga_tech_eawaf_sirens_voidbeam_desc:99 "$GIGA_EAWAF_GRAND_VOID_BEAM_DESC$"

  giga_tech_eawaf_disenchanter_1:99 "Contre-mesures précoces anti-Sirènes"
  giga_tech_eawaf_disenchanter_1_desc:99 "Bien que la nature profonde du chant mystérieux des Sirènes nous échappe encore, des études préliminaires suggèrent que tirer des décharges d'énergie focalisées à des fréquences spécifiques dans le quasi-espace peut atténuer certains des effets du champ de discorde, au prix d'une augmentation drastique de l'entretien des vaisseaux sur lesquels ces mécanismes sont montés."

  giga_tech_eawaf_disenchanter_2:99 "Accordage du désenchanteur"
  giga_tech_eawaf_disenchanter_2_desc:99 "Un accordage plus soigneux des mécanismes du Désenchanteur permet une neutralisation plus efficace des effets néfastes du champ de discorde."

  giga_tech_eawaf_disenchanter_3:99 "Symphonies subpsioniques"
  giga_tech_eawaf_disenchanter_3_desc:99 "Des percées dans notre compréhension du champ de discorde nous permettent d'émettre directement des contre-mélodies aux chants des Sirènes au sein de l'Immatériel lui-même, ce qui peut repousser même les effets de contrôle mental néfastes du champ intérieur."
  giga_tech_eawaf_disenchanter_3_effects:99 "Permet la capture de §YBases stellaires§! et de §YPlanètes§! dans le §RChamp intérieur§!."

  giga_tech_eawaf_disenchanter_4:99 "Dissipation euphonique de la discorde"
  giga_tech_eawaf_disenchanter_4_desc:99 "Notre compréhension du chant des Sirènes a maintenant progressé au point où nous pouvons confortablement annuler leur champ de contrôle mental à n'importe quelle échelle, bien qu'à un coût énergétique non négligeable."

  # Buildings
  building_giga_eawaf_psifusion_reactor:99 "Réacteur à fusion psicatalysée"
  building_giga_eawaf_psifusion_reactor_desc:99 "Ce complexe de réacteurs gargantuesque abrite une « étoile psionique » artificielle alimentée par une faille du Voile. Non seulement elle produit des quantités formidables d'énergie, mais elle peut également être utilisée pour créer des éléments lourds et renforce l'efficacité des psioniques à travers toute la planète."

  building_giga_eawaf_sirens_capital:99 "Panoptique planétaire"
  building_giga_eawaf_sirens_capital_desc:99 "Un complexe colossal destiné à relayer la volonté des Sirènes à travers ce monde, afin d'assurer une efficacité sociétale et industrielle maximale."

  building_giga_eawaf_disenchanter_building_1:99 "Champ de désenchantement prototype"
  building_giga_eawaf_disenchanter_building_1_desc:99 "Un Désenchanteur agrandi capable d'annuler certains des effets du champ de discorde sur ce monde. Réduit de moitié les pénalités du §PChamp extérieur§!."

  building_giga_eawaf_disenchanter_building_2:99 "Champ de désenchantement harmonisé"
  building_giga_eawaf_disenchanter_building_2_desc:99 "Ce champ de désenchantement raffiné est non seulement capable de réduire drastiquement les effets du champ de discorde sur ce monde, mais le protège également de l'emprise du champ intérieur. Réduit au quart les effets du §PChamp extérieur§! et protège contre le §RChamp intérieur§!."

  # Colony Designations
  col_giga_eawaf_sirens_capital:99 "Mégafabrique psionique"
  col_giga_eawaf_sirens_capital_desc:99 "Une étendue infernale d'usines remplies d'esclaves mentaux travaillant pour étendre la domination de Sirenalia."

  # Jobs
  job_giga_eawaf_sirens_toiler:99 "Forçat des Sirènes"
  job_giga_eawaf_sirens_toiler_plural:99 "Forçats des Sirènes"
  job_giga_eawaf_sirens_toiler_desc:99 "Les forçats des Sirènes travaillent jour et nuit pour produire les ressources nécessaires pour alimenter la machine de guerre des Sirènes."
  mod_job_giga_eawaf_sirens_toiler_add:99 "Emplois $job_giga_eawaf_sirens_toiler$"
  mod_job_giga_eawaf_sirens_toiler_per_pop:99 "Emplois $job_giga_eawaf_sirens_toiler$ par Pop"

  job_giga_eawaf_sirens_naval:99 "Opérateur de flotte des Sirènes"
  job_giga_eawaf_sirens_naval_plural:99 "Opérateurs de flotte des Sirènes"
  job_giga_eawaf_sirens_naval_desc:99 "Les opérateurs de flotte des Sirènes sont chargés de gérer la logistique des armadas spatiales des Sirènes."
  mod_job_giga_eawaf_sirens_naval_add:99 "Emplois $job_giga_eawaf_sirens_naval$"
  mod_job_giga_eawaf_sirens_naval_per_pop:99 "Emplois $job_giga_eawaf_sirens_naval$ par Pop"

  job_giga_eawaf_sirens_scientist:99 "Sciento-économiste des Sirènes"
  job_giga_eawaf_sirens_scientist_plural:99 "Sciento-économistes des Sirènes"
  job_giga_eawaf_sirens_scientist_desc:99 "Les sciento-économistes sont l'échelon supérieur de la société des Sirènes. Composés des rares individus autorisés à rester non asservis, leur travail est de trouver de nouvelles façons d'améliorer l'efficacité de la société des Sirènes ainsi que de repousser toujours plus loin les limites de leur science."
  mod_job_giga_eawaf_sirens_scientist_add:99 "Emplois $job_giga_eawaf_sirens_scientist$"
  mod_job_giga_eawaf_sirens_scientist_per_pop:99 "Emplois $job_giga_eawaf_sirens_scientist$"

  job_giga_eawaf_sirens_strifer:99 "Semeur de discorde des Sirènes"
  job_giga_eawaf_sirens_strifer_plural:99 "Semeurs de discorde des Sirènes"
  job_giga_eawaf_sirens_strifer_desc:99 "Les besoins des Sirènes exigent que certains individus restent dans un état perpétuel, mais contrôlé, de colère et de conflit les uns avec les autres, afin de continuer à générer un précieux filet de discorde même au sein du champ intérieur parfaitement régulé."
  mod_job_giga_eawaf_sirens_strifer_add:99 "Emplois $job_giga_eawaf_sirens_strifer$"
  mod_job_giga_eawaf_sirens_strifer_per_pop:99 "Emplois $job_giga_eawaf_sirens_strifer$"

  # Civics and Origins
  origin_eawaf_sirens_splinter:99 "Désabusés"
  origin_eawaf_sirens_splinter_desc:99 "Cette nation a été fondée par des survivants qui étaient autrefois asservis par les Sirènes."

  # Situation
  situation_eawaf_sirens_takeover:99 "La prise de pouvoir des Sirènes"
  situation_eawaf_sirens_takeover_desc:99 "Un trio de « Sirènes » dotées de capacités de contrôle mental s'est engagé à imposer leur règne sur Faust. Elles sont évidemment déterminées à tout faire pour s'assurer qu'elles réussissent dans cette entreprise décourageante. Il est probablement dans notre intérêt de garder un oeil attentif sur cette situation."
  situation_eawaf_sirens_takeover_type:99 "La prise de pouvoir des Sirènes"
  situation_eawaf_sirens_takeover_monthly_change_tooltip:99 ""

  approach_giga_eawaf_stop_sirens:99 "Arrêter les Sirènes"
  approach_giga_eawaf_stop_sirens_tooltip:99 "Nous ferons tout ce qui est en notre pouvoir pour stopper les Sirènes sans être vus. Des assassinats clandestins de leurs actifs clés, la perturbation des lignes d'approvisionnement et le soutien aux mouvements anti-Sirènes devraient freiner leur progression jusqu'à ce qu'elles soient submergées par leurs ennemis.\nCela augmentera les chances que les Sirènes tombent face à leurs ennemis à chaque étape de leur conquête.\n§RNous ne pouvons pas renoncer à arrêter les Sirènes si nous commençons à le faire.§!"

  approach_giga_eawaf_do_nothing:99 "Ne rien faire"
  approach_giga_eawaf_do_nothing_tooltip:99 "Regardons simplement comment cela se déroule. Nous avons des préoccupations plus urgentes.\n§YNous pouvons toujours changer d'avis plus tard.§!"

  approach_giga_eawaf_study_sirens:99 "Étudier les Sirènes"
  approach_giga_eawaf_study_sirens_tooltip:99 "Nous investirons des ressources et du personnel pour étudier les Sirènes et leurs méthodes de contrôle mental. Nous pourrions apprendre beaucoup sur la vraie nature de la conscience et de l'esprit de cette façon.\n§YNous pouvons toujours changer d'avis plus tard.§!"

  approach_giga_eawaf_bolster_sirens:99 "Soutenir les Sirènes"
  approach_giga_eawaf_bolster_sirens_tooltip:99 "Nous aiderons secrètement les Sirènes dans leur prise de pouvoir. De cette façon, nous pourrons être témoins de leur plein potentiel en action, nous apportant une mine de données précieuses.\n§GNous pouvons toujours changer d'avis plus tard, mais plus nous les soutiendrons longtemps, plus nous apprendrons.§!"

  situation_eawaf_sirens_takeover_effects:99 "Les Sirènes progresseront dans leur prise de contrôle de Faust."

  giga_eawaf_sirens_too_strong_tooltip:99 "Les Sirènes sont devenues trop fortes pour que nous nous y opposions clandestinement. Nous devons soit les laisser tranquilles, soit intervenir directement via une invasion terrestre potentiellement hasardeuse de Faust."


  situation_eawaf_sirens_understanding:99 "Contrer les Sirènes"
  situation_eawaf_sirens_understanding_desc:99 "Les Sirènes tentent de propager un chant de contrôle mental ésotérique à travers toute la galaxie. Nous devons trouver un moyen de contrer ce phénomène avant que nous ne tombions tous sous leur charme diabolique. Le coût en §YRecherche§! et §YUnité§! pour contrer les Sirènes sera proportionnel à la §MPuissance§! du champ. Si nous ne pouvons pas nous le permettre, nous reviendrons à §YPas d'études sur les Sirènes§!."
  situation_eawaf_sirens_understanding_type:99 "Contrer les Sirènes"
  situation_eawaf_sirens_understanding_monthly_change_tooltip:99 ""

  approach_giga_eawaf_sirens_research_1:99 "Pas d'études sur les Sirènes"
  approach_giga_eawaf_sirens_research_1_tooltip:99 "Ça passera."
  approach_giga_eawaf_sirens_research_2:99 "Études anti-Sirènes limitées"
  approach_giga_eawaf_sirens_research_2_tooltip:99 "Les Sirènes ne sont pas vraiment une priorité, mais investissons quand même un peu pour être sûrs."
  approach_giga_eawaf_sirens_research_2_cost_tooltip:99 "Notre production de $r_physics$ et $r_society$ ne peut pas soutenir cela !"
  approach_giga_eawaf_sirens_research_3:99 "Études anti-Sirènes approfondies"
  approach_giga_eawaf_sirens_research_3_tooltip:99 "Nous devons arrêter les Sirènes, alors investissons des ressources suffisantes pour permettre cela."
  approach_giga_eawaf_sirens_research_3_cost_tooltip:99 "Notre production de $r_physics$ et $r_society$ ne peut pas soutenir cela !"
  approach_giga_eawaf_sirens_research_4:99 "Études anti-Sirènes massives"
  approach_giga_eawaf_sirens_research_4_tooltip:99 "Les Sirènes doivent être arrêtées à tout prix ! Investissons tout ce que nous pouvons pour les contrer !"
  approach_giga_eawaf_sirens_research_4_cost_tooltip:99 "Notre production de $r_physics$ et $r_society$ ne peut pas soutenir cela !"

  situation_eawaf_sirens_disenchanters_effect:99 "Nous améliorerons nos contre-mesures contre les Sirènes."
  situation_eawaf_sirens_understanding_finish:99 "Nos contre-mesures seront perfectionnées."
  giga_eawaf_has_sirens_secret:99 "Études d'envoûtement thaumaturgique"
  giga_eawaf_has_psifusion_secret:99 "Études de fusion psicatalysée"
  giga_eawaf_has_psifusion_secret_tooltip:99 "Nos recherches antérieures sur l'interférence psionique à Faust stimuleront notre progression."

