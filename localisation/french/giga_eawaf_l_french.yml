  concept_giga_eawaf_war_materials:99 "Matériaux de guerre"
  concept_giga_eawaf_war_materials_desc:99 "Ces matériaux représentent les stocks de ressources avancées des Sirènes, générés par leur population sur les mondes conquis. Ils sont utilisés pour fabriquer des vaisseaux et améliorer l'§YEnvoûteur linceulsonique§! pour intensifier ses effets, augmentant les malus qu'il applique aux planètes et aux vaisseaux à portée."

  concept_giga_eawaf_thaumaturgic_weapons:99 "Armes thaumaturgiques"
  concept_giga_eawaf_thaumaturgic_weapons_desc:99 "Ces armes puissantes, rétro-conçues à partir de Sirenalia, utilisent la technologie cristalline unique de la planète Faust.\nCes composants incluent :\n- $concept_giga_eawaf_strike_craft$\n- $concept_giga_eawaf_crystal_autocannon$\n- $concept_giga_eawaf_crystal_artillery$\n- $concept_giga_eawaf_psionic_charge$\n- $concept_giga_eawaf_crystal_impactor$\n- $concept_giga_eawaf_grand_void_beam$"
