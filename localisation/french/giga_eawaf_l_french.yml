  # Concepts
  concept_giga_eawaf_disenchanter_buildings:99 "Champs de désenchantement"
  concept_giga_eawaf_disenchanter_buildings_desc:99 "Les bâtiments de Désenchanteur sont recherchés via les technologies obtenues par la situation §Y$situation_eawaf_sirens_understanding$§!, et protègent contre le §RChamp de discorde§!.\nCes bâtiments incluent :\n- $concept_giga_eawaf_disenchanter_building_1$\n- $concept_giga_eawaf_disenchanter_building_2$"
