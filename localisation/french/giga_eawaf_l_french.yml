  giga_eawaf_outer_strife_field_modifier:99 "Influence du champ de discorde extérieur"
  giga_eawaf_outer_strife_field_modifier_desc:99 "§WCe monde génère §R[THIS.giga_eawaf_planet_strife]§! §PDiscorde§! pour Sirenalia.\n§WLa §PDiscorde§! n'est générée que lorsque la stabilité est inférieure à §Y90§! selon la formule :§!\n(§Y80 - Stabilité§!) x (§YPopulation planétaire§!) x (§Y1§! + §YPourcentage de criminalité§!)§!\n§WLes pénalités de §YStabilité§!/§YCriminalité§! sont proportionnelles au niveau de §MPuissance§! de l'Envoûteur.§!\n\n§LLe champ de discorde extérieur influence les habitants de ce monde, les poussant vers la haine et convertissant cette haine en §PDiscorde§! pour alimenter l'Envoûteur linceulsonique de Sirenalia. Construire des ['concept_giga_eawaf_disenchanter_buildings'] peut aider à atténuer ou même annuler cela.§!"

  giga_eawaf_outer_strife_field_modifier_halved:99 "Influence du champ de discorde extérieur"
  giga_eawaf_outer_strife_field_modifier_halved_desc:99 "§WCe monde génère §R[THIS.giga_eawaf_planet_strife]§! §PDiscorde§! pour Sirenalia.\n§WLa §PDiscorde§! n'est générée que lorsque la stabilité est inférieure à §Y90§! selon la formule :§!\n(§Y80 - Stabilité§!) x (§YPopulation planétaire§!) x (§Y1§! + §YPourcentage de criminalité§!)§!\n§WLes pénalités de §YStabilité§!/§YCriminalité§! sont proportionnelles au niveau de §MPuissance§! de l'Envoûteur.§!\nLes effets sont §Yréduits de moitié§! par un ['concept_giga_eawaf_disenchanter_building_1'].\n\n§LLe champ de discorde extérieur influence les habitants de ce monde, les poussant vers la haine et convertissant cette haine en §PDiscorde§! pour alimenter l'Envoûteur linceulsonique de Sirenalia. Construire des ['concept_giga_eawaf_disenchanter_buildings'] peut aider à atténuer ou même annuler cela.§!"

  giga_eawaf_outer_strife_field_modifier_quartered:99 "Influence du champ de discorde extérieur"
  giga_eawaf_outer_strife_field_modifier_quartered_desc:99 "§WCe monde génère §R[THIS.giga_eawaf_planet_strife]§! §PDiscorde§! pour Sirenalia.\n§WLa §PDiscorde§! n'est générée que lorsque la stabilité est inférieure à §Y90§! selon la formule :§!\n(§Y80 - Stabilité§!) x (§YPopulation planétaire§!) x (§Y1§! + §YPourcentage de criminalité§!)§!\n§WLes pénalités de §YStabilité§!/§YCriminalité§! sont proportionnelles au niveau de §MPuissance§! de l'Envoûteur.§!\nLes effets sont §Yréduits au quart§! par un ['concept_giga_eawaf_disenchanter_building_2'].\n\n§LLe champ de discorde extérieur influence les habitants de ce monde, les poussant vers la haine et convertissant cette haine en §PDiscorde§! pour alimenter l'Envoûteur linceulsonique de Sirenalia. Construire des ['concept_giga_eawaf_disenchanter_buildings'] peut aider à atténuer ou même annuler cela.§!"

  # Menu
  giga_sirens_spawnlater:99 "Faire apparaître les Sirènes §GPlus tard§!\nLes Sirènes commenceront à apparaître dans les §Y5 ans§! suivant la date d'apparition sélectionnée. Si réglé sur §YGaranti§!, elles apparaîtront à la date exacte."

  giga_sirens_spawnearlier:99 "Faire apparaître les Sirènes §RPlus tôt§!\nLes Sirènes commenceront à apparaître dans les §Y5 ans§! suivant la date d'apparition sélectionnée. Si réglé sur §YGaranti§!, elles apparaîtront à la date exacte."

  giga_sirens_randomgame:99 "Date d'apparition de Sirenalia : §LAléatoire§!\nSirenalia apparaîtra à un moment aléatoire. La situation §YPrise de pouvoir des Sirènes§! se produira §Y25 ans après§! et le §YLinceul éthéré§! se dissipera après un temps aléatoire.\n$sirens_spawn_warning$"
  giga_sirens_lateendgame:99 "Date d'apparition de Sirenalia : §E2500§!\nSirenalia peut apparaître après §Y2500§!. La situation §YPrise de pouvoir des Sirènes§! se produira §Y25 ans après§! et le §YLinceul éthéré§! durera jusqu'en 2500.\n$sirens_spawn_warning$"
  giga_sirens_regularendgame:99 "Date d'apparition de Sirenalia : §G2450§!\nSirenalia peut apparaître après §Y2450§!. La situation §YPrise de pouvoir des Sirènes§! se produira §Y25 ans après§! et le §YLinceul éthéré§! durera jusqu'en 2450.\n$sirens_spawn_warning$"
  giga_sirens_endgame:99 "Date d'apparition de Sirenalia : §Y2400§! (Par défaut)\nSirenalia peut apparaître après §Y2400§!. La situation §YPrise de pouvoir des Sirènes§! se produira §Y25 ans après§! et le §YLinceul éthéré§! durera jusqu'en 2400.\n$sirens_spawn_warning$"
  giga_sirens_latemidgame:99 "Date d'apparition de Sirenalia : §H2350§!\nSirenalia peut apparaître après §Y2350§!. La situation §YPrise de pouvoir des Sirènes§! se produira §Y25 ans après§! et le §YLinceul éthéré§! durera jusqu'en 2350.\n$sirens_spawn_warning$"
  giga_sirens_midgame:99 "Date d'apparition de Sirenalia : §S2300§!\nSirenalia peut apparaître après §Y2300§!. La situation §YPrise de pouvoir des Sirènes§! se produira §Y25 ans après§! et le §YLinceul éthéré§! durera jusqu'en 2300.\n$sirens_spawn_warning$"
  giga_sirens_lateearlygame:99 "Date d'apparition de Sirenalia : §P2250§!\nSirenalia peut apparaître autour de §Y2250§!. La situation §YPrise de pouvoir des Sirènes§! se produira §Y25 ans après§! et le §YLinceul éthéré§! durera jusqu'en 2250.\n$sirens_spawn_warning$"
  giga_sirens_earlygame:99 "Date d'apparition de Sirenalia : §RDébut de partie§!\nSirenalia peut apparaître proche du §YDébut de partie§!. La situation §YPrise de pouvoir des Sirènes§! commencera immédiatement et le §YLinceul éthéré§! se dissipera en moins d'un an.\n$sirens_spawn_warning$"

  sirens_spawn_warning:99 "\n§YRéglez Sirenalia sur §GGaranti§! si vous voulez vous assurer que Sirenalia apparaisse.§!\n\n§GCliquez pour changer la date d'apparition de Sirenalia§!"

  giga_eawaf_sirens_guaranteed:99 "Les §YSirènes§! réussiront §Gtoujours§! dans leur entreprise de prendre le contrôle de §YFaust§! et se transformeront ensuite en crise, sauf si elles sont arrêtées par le joueur."

  giga_sirens_not_guaranteed:99 "Les §YSirènes§! ont environ §Y50 %§! de chances de prendre le contrôle de §YFaust§! et de devenir une crise, sauf intervention du joueur."

  giga_eawaf_sirens_disabled:99 "Les §YSirènes§! n'essaieront pas de prendre le contrôle de §YFaust§!. Le système peut cependant toujours apparaître avec des primitifs personnalisés s'il n'est pas désactivé.\n\n§BLa crise §YSirenalia§! a été créée dans le cadre de la collaboration §YPoisson d'avril 2024§! avec l'équipe §YEquestria at War§!, qui a ajouté un chemin §YKaiser Kattail§! à son propre mod.§!"

  giga_sirens_enabled:99 "Les §YSirènes§! tenteront de prendre le contrôle de §YFaust§! et finiront par devenir §RSirenalia§!. Elles tenteront de §Rcontrôler mentalement§! toute la galaxie en utilisant leur chant magique envoûtant !\n\n§BLa crise §YSirenalia§! a été créée dans le cadre de la collaboration §YPoisson d'avril 2024§! avec l'équipe §YEquestria at War§!, qui a ajouté un chemin §YKaiser Kattail§! à son propre mod.§!"

  giga_eawaf_sirens_easy:99 "Sirenalia (§BLargo§!)\nSirenalia sera §Baffaiblie§!.\n\nLa §MPuissance§! commencera à §Y0,5§! tandis que chaque niveau de l'§YEnvoûteur linceulsonique§! l'augmentera de §Y0,25§!."

  giga_eawaf_sirens_normal:99 "Sirenalia (§GLento§!)\nSirenalia sera §Gnormale§!.\n\nLa §MPuissance§! commencera à §Y1§! tandis que chaque niveau de l'§YEnvoûteur linceulsonique§! l'augmentera de §Y0,5§!."

  giga_eawaf_sirens_hard:99 "Sirenalia (§YModerato§!)\nSirenalia sera §Yrenforcée§!.\n\nLa §MPuissance§! commencera à §Y5§! tandis que chaque niveau de l'§YEnvoûteur linceulsonique§! l'augmentera de §Y2§!."

  giga_eawaf_sirens_veryhard:99 "Sirenalia (§HAllegro§!)\nSirenalia sera §Htrès renforcée§!.\n\nLa §MPuissance§! commencera à §Y10§! tandis que chaque niveau de l'§YEnvoûteur linceulsonique§! l'augmentera de §Y5§!."

  giga_eawaf_sirens_extreme:99 "Sirenalia (§RVivace§!)\nSirenalia sera §Rextrêmement renforcée§!.\n\nLa §MPuissance§! commencera à §Y25§! tandis que chaque niveau de l'§YEnvoûteur linceulsonique§! l'augmentera de §Y10§!."

  giga_eawaf_sirens_impossible:99 "Sirenalia (§PPresto§!)\nSirenalia sera §Pimpossiblement renforcée§!.\n\nLa §MPuissance§! commencera à §Y50§! tandis que chaque niveau de l'§YEnvoûteur linceulsonique§! l'augmentera de §Y25§!."

  giga_eawaf_sirens_abyss:99 "Sirenalia (§gAbyssale§!)\n§RALORS QUE LE CYCLE EST DÉCHIRÉ ET QUE LES MURS DE LA RÉALITÉ S'EFFACENT, DES PROFONDEURS DE L'EXISTENCE ELLE-MÊME S'ÉVEILLE UNE FORCE INCOMPRÉHENSIBLE.§!\n\nLa §MPuissance§! commencera à §Y1000§! tandis que chaque niveau de l'§YEnvoûteur linceulsonique§! l'augmentera de §Y500§!.\n\n§RTOUTES§! les factions pourront être asservies par les Sirènes."

  #Primitive Events
  d_everfree_forest:99 "Forêt d'Everfree"
  d_everfree_forest_desc:99 "Une forêt particulière et quasi impénétrable remplie d'énergies apparemment magiques. La défricher serait une tâche colossale, mais étudier son écosystème ésotérique produirait certainement des données intrigantes."
  d_everfree_forest_thaumonuclear:99 "$d_everfree_forest$"
  d_everfree_forest_thaumonuclear_desc:99 "Une forêt particulière et quasi impénétrable — et, évidemment, quasi indestructible — remplie d'énergies apparemment magiques. Étudier son écosystème ésotérique produirait certainement des données intrigantes."
  d_thaumonuclear_wastes:99 "Terres dévastées thaumonucléaires"
  d_thaumonuclear_wastes_desc:99 "Les habitants désormais éteints de Faust ont déclenché un holocauste thaumonucléaire sur leur planète. Les tempêtes énergétiques qui grondent au milieu des ruines seraient un sujet d'étude précieux."

  giga_eaw_faust_planet_modifier:99 "Monde infusé de cristaux"
  giga_eaw_faust_planet_modifier_desc:99 "Ce monde présente des gisements inhabituellement abondants de cristaux ésotériques étroitement liés aux cristaux rares. S'ils sont correctement exploités, ces cristaux peuvent être amenés à décharger des quantités stupéfiantes d'énergie."

  #eaw_planet_buffs:99 "Thaumomancy"

  giga_eawaf.7002.name:99 "Faust entre dans l'ère atomique"
  giga_eawaf.7002.desc:99 "Les rapports indiquent que les primitifs habitant le monde continental particulier de §YFaust§! au sein du système §Y[giga_eawaf_system.GetName]§! ont réussi à construire et tester un dispositif nucléaire de faible puissance.\n\nBien qu'elles restent relativement rares et coûteuses pour l'instant, ces armes devraient proliférer de façon exponentielle à mesure que la technologie est raffinée et se répand à travers les divers États-nations de la planète.\n\nFait intéressant, au lieu de s'appuyer sur la fission conventionnelle de l'uranium pour la puissance, ces armes utilisent les énergies contenues dans les gisements de cristaux abondants de la planète pour libérer une puissance destructrice formidable, que notre poste d'observation a commencé à appeler §Ydispositifs thaumonucléaires§!.\n\nÀ partir de maintenant, si un conflit à grande échelle devait survenir sur la planète, il sera certainement significativement plus destructeur que jamais auparavant."
  giga_eawaf.7002.a:99 "Intrigant."

  giga_eawaf.7004.name:99 "Faust sombre dans la guerre thaumonucléaire"
  giga_eawaf.7004.desc:99 "Notre poste d'observation de §YFaust§! rapporte que, en raison de tensions extrêmement élevées au sein de la scène géopolitique de la planète, un incident de bateau de pêche relativement mineur entre deux des grandes puissances de Faust a dégénéré en un conflit à grande échelle opposant les trois continents principaux de la planète les uns contre les autres.\n\nMalheureusement, l'armement thaumonucléaire s'était répandu, la plupart des grandes nations possédant un arsenal considérable, ce qui signifie que le conflit s'est rapidement transformé en un événement d'extinction alors que les diverses alliances supranationales de la planète ont commencé à se lancer des quantités copieuses d'ogives thaumonucléaires les unes sur les autres.\n\nIl n'a fallu que quelques jours pour que la surface de la planète soit complètement engloutie dans les énergies cataclysmiques libérées par les dispositifs, transformant le monde autrefois verdoyant en une vaste tempête bouillonnante d'énergies quasi magiques couvrant toute la planète.\n\nLes scans orbitaux montrent qu'à l'exception d'une jungle étonnamment réticente qui semble prospérer grâce aux énergies libérées par les dispositifs thaumonucléaires, la civilisation primitive a été complètement anéantie."
  giga_eawaf.7004.a:99 "Une fin si violente. Malheureux."

  giga_eawaf.7006.name:99 "Faust entre dans l'ère spatiale précoce"
  giga_eawaf.7006.desc:99 "Les primitifs de §YFaust§! ont franchi une autre étape cruciale dans leur évolution sociétale avec le développement des premiers engins spatiaux orbitaux capables de vol interplanétaire.\n\nPropulsés par des formes liquides des cristaux abondants de la planète, plusieurs de ces engins spatiaux ont été envoyés pour explorer leur système stellaire, les primitifs commençant de sérieuses incursions dans la nature de leur système planétaire ésotérique.\n\nAvec le développement de télescopes à lentilles de cristal de plus en plus puissants, il est probable que les primitifs ont appris que l'astrogéographie particulière de leur planète est vraiment unique en son genre en étudiant des exoplanètes plus « standard ».\n\nLes tensions à travers la planète commencent à se calmer, plusieurs des grandes puissances prenant des mesures très concrètes vers la coopération internationale, mais il reste à voir si ces efforts porteront leurs fruits ou se termineront par un événement d'extinction désastreux.\n\nIl ne devrait pas falloir longtemps avant que leurs êtres particuliers soient prêts à nous rejoindre parmi les étoiles."
  giga_eawaf.7006.a:99 "Intéressant."

  giga_eawaf.shared.faust_achieves_ftl:99 "Notre poste d'observation de §YFaust§! indique que les primitifs de la planète ont enfin conçu un moteur FTL fonctionnel. Comme la plupart de leur technologie, il fait un usage extensif des cristaux particuliers et abondants de la planète, les rendant étonnamment bon marché à fabriquer compte tenu de la quantité de cristaux disponibles dans leur système d'origine."

  giga_eawaf.7012.name:99 "La §YGrande Convocation faustienne§! atteint le FTL"
  giga_eawaf.7011.desc.eawun:99 "$giga_eawaf.shared.faust_achieves_ftl$\n\nLa planète elle-même a été unifiée par une entité supranationale connue sous le nom de §YGrande Convocation faustienne§!, formée par la fédération de plusieurs des grands gouvernements démocratiques de la planète. Bien que ces gouvernements existent encore dans une certaine mesure, la Convocation a effectivement assumé le rôle d'autorité interstellaire de Faust et sera responsable de guider l'expansion de la civilisation à travers les étoiles.\n\nCompte tenu des grandes différences culturelles et physiques entre les différentes espèces de la planète, la fédéralisation pacifique de toute la planète en un gouvernement singulier est considérée comme un exploit stupéfiant, tant par l'équipage de notre avant-poste que par la plupart des habitants de la planète.\n\nCependant, comme nous possédons la base stellaire du système, nous avons reçu une transmission de leur leader, §YJungle Trek III§!, demandant que nous leur transférions la propriété de la base stellaire afin que les habitants de Faust puissent enfin commencer leur voyage interplanétaire."

  giga_eawaf.7013.name:99 "L'§YEmpire griffonien§! atteint le FTL"
  giga_eawaf.7011.desc.eawgriffon:99 "$giga_eawaf.shared.faust_achieves_ftl$\n\nLa planète elle-même a été unifiée par la guerre et les manoeuvres diplomatiques par une nation impérialiste connue sous le nom d'§YEmpire griffonien§!, qui a réussi à subjuguer la majorité des anciennes nations de la planète soit par conquête directe, soit en exerçant sa domination économique sur le reste de la planète.\n\nBien que tout le monde ne soit pas satisfait de cet arrangement, aucune puissance étrangère capable de s'opposer à l'occupation de l'Empire griffonien ne subsiste et le destin de la planète semble donc scellé.\n\nComme nous possédons la base stellaire du système, nous avons reçu une transmission de leur leader, §YGrover XI§! de la §YDynastie Grover§!, demandant que nous leur transférions la propriété de la base stellaire afin que l'Empire griffonien puisse être reconnu comme une nation galactique indépendante."

  giga_eawaf.7014.name:99 "La §YRépublique socialiste faustienne§! atteint le FTL"
  giga_eawaf.7011.desc.eawcommunist:99 "$giga_eawaf.shared.faust_achieves_ftl$\n\nLa planète elle-même a été relativement pacifiquement unifiée dans la §YRépublique socialiste faustienne§!, un gouvernement socialiste au nom approprié qui, par plusieurs fusions avec des alliés socialistes amicaux et quelques guerres, a réussi à affirmer son contrôle sur la grande majorité des États-nations de Faust.\n\nBien que quelques nations restent indépendantes, elles sont bien trop insignifiantes pour compter face à la suprématie écrasante du nouveau gouvernement socialiste, qui promet d'apporter égalité et prospérité à toutes les créatures, quelle que soit leur espèce ou leur origine.\n\nComme nous possédons la base stellaire du système, nous avons reçu une transmission de leur leader, un représentant de leur Conseil suprême, demandant que nous leur transférions la propriété de la base stellaire."

  giga_eawaf.70141.name:99 "La §YFédération faustienne§! atteint le FTL"
  giga_eawaf.70141.desc:99 "$giga_eawaf.shared.faust_achieves_ftl$\n\nLa planète a été unifiée sous la direction de la §YFédération faustienne§!, un gouvernement harmoniste qui a pris forme à l'origine dans les confins orientaux du continent griffonien.\n\nBien qu'elle n'ait été à l'origine guère plus qu'une alliance militaire et économique connue sous le nom de §YFédération du fleuve§!, elle a fini par se fédérer en un super-État qui, par la diplomatie et l'occasionnelle croisade contre les régimes autoritaires tels que l'Empire griffonien voisin, s'est finalement retrouvé comme seule hyperpuissance de la planète.\n\nIls nous contactent maintenant pour discuter de la remise du système."

  giga_eawaf.70142.name:99 "Le §YGrand Empire d'Aquileia-Wingbardy§! atteint le FTL"
  giga_eawaf.70142.desc:99 "$giga_eawaf.shared.faust_achieves_ftl$\n\nLa planète elle-même a été unifiée sous la direction d'§YAquileia-Wingbardy§!, un empire créé suite à la fusion de deux des principaux États-nations de Griffonia et à leur ascension subséquente en tant que superpuissance continentale puis hyperpuissance planétaire suite à la prise de contrôle de tout leur continent et de nombreuses entreprises militaires, économiques et coloniales outre-mer.\n\nÉtant donné que nous possédons la base stellaire du système, nous avons reçu une transmission de leur impératrice demandant le contrôle du système en échange de ressources."

  giga_eawaf.70143.name:99 "La §YCorporation faustienne§! atteint le FTL"
  giga_eawaf.70143.desc:99 "$giga_eawaf.shared.faust_achieves_ftl$\n\nLa planète elle-même a été unifiée principalement par la puissance économique pure de §YKiria§!, une nation qui, suite à une industrialisation rapide et une transition vers un régime fortement capitaliste, a rapidement dominé l'économie de la planète et a fini par devenir sa seule superpuissance grâce à la prise de contrôle économique de nombreuses autres nations.\n\nComme nous possédons la base stellaire du système, nous avons reçu une transmission de leur directeur, qui souhaite probablement nous acheter le système."

  giga_eawaf.70144.name:99 "§YFaust révolutionnaire§! atteint le FTL"
  giga_eawaf.70144.desc:99 "$giga_eawaf.shared.faust_achieves_ftl$\n\nLa planète elle-même a été unifiée sous la gouvernance d'une nation originaire de l'île d'§YHippogriffia§!, qui, suite à une prise de pouvoir communiste, a commencé une campagne d'expansion rapide culminant en une grande croisade contre tous les régimes autoritaires du monde.\n\nGrâce à une utilisation extensive de l'énergie nucléaire et à des politiques hautement matérialistes, la nation naissante a réussi à sortir victorieuse et à unifier la majeure partie de Faust sous son règne, la dernière nation restante ayant cédé relativement facilement par la suite.\n\nSuite à un investissement immense dans le voyage spatial et au développement rapide d'un moteur FTL, le monde nouvellement unifié s'est lancé vers les étoiles et nous envoie maintenant une transmission enthousiaste afin d'établir des relations diplomatiques."

  giga_eawaf.70145.name:99 "Le §YFléau redouté§! atteint le FTL"
  giga_eawaf.70145.desc:99 "$giga_eawaf.shared.faust_achieves_ftl$\n\nLa planète elle-même a été unifiée sous une sorte d'« esprit de ruche » horrifiant composé de formes de vie réanimées, qui a mené une grande « Croisade sombre » contre les créatures vivantes et l'écosystème de Faust.\n\nBien qu'initialement incertain, le nombre phénoménal de l'esprit de ruche et sa capacité à ressusciter les morts tant de lui-même que de ses ennemis lui ont permis de triompher à la fin et de subsumer l'intégralité de Faust en lui-même.\n\nDe manière alarmante, cet esprit de ruche, connu sous le nom de « Fléau redouté », semble complètement réticent à tout type de diplomatie et a lancé un assaut total sur notre base stellaire en utilisant des vaisseaux FTL de fortune. Nous devons agir rapidement et étouffer cette menace dans l'oeuf avant qu'elle ne consume toute la galaxie !"

  giga_eawaf.70146.name:99 "Le §YDirectoire faustien§! atteint le FTL"
  giga_eawaf.70146.desc:99 "$giga_eawaf.shared.faust_achieves_ftl$\n\nLe monde a été complètement unifié sous une sorte de divinité mécanique répondant au nom de §YLeopold Schmeller§!, qui était apparemment un Griffon ordinaire ayant subi de lourdes améliorations cybernétiques et une éventuelle ascension dans un corps mécanique gargantuesque.\n\nIl dirige depuis une croisade gargantuesque contre le reste du monde, libérant d'immenses armées d'automates avancés pour subsumer toute opposition et intégrer les populations organiques de Faust dans sa conscience machine toujours croissante.\n\nComme nous possédons la base stellaire du système, Leopold nous a contactés afin de négocier l'achat de Faust."

  giga_eawaf.70147.name:99 "L'§YImperium Katzenartig§! atteint le FTL"
  giga_eawaf.70147.desc:99 "$giga_eawaf.shared.faust_achieves_ftl$\n\nLe monde a été complètement unifié sous la direction du particulier §YKaiser Kattail§!, qui est apparu dans la nation faustienne d'§YAbyssinie§! et, malgré l'état pitoyable de la nation, a réussi à réaliser une série de conquêtes stupéfiantes culminant en une guerre totale contre l'intégralité de Faust.\n\nContre toute attente, Kattail a réussi à sortir victorieux et a consolidé son emprise sur toute la planète, commençant même une sorte de projet de méga-ingénierie sur la lune de la planète, Sélène.\n\nComme nous possédons la base stellaire du système, il nous a contactés afin de négocier l'achat du système."

  giga_eawaf.7011.a:99 "À l'écran."

  giga_eawaf.7015.name:99 "[giga_eawaf_country.GetName]"
  giga_eawaf.7015.desc.eawun:99 "Salutations, voyageurs des étoiles. La Grande Convocation faustienne a enfin acquis la technologie nécessaire pour naviguer à travers les étoiles.\n\nCependant, nous avons remarqué que votre espèce a revendiqué notre système stellaire. À ce titre, notre grand conseil a décidé d'offrir à votre civilisation une compensation financière de §Y7500§! £energy£ provenant de nos plus grands réacteurs cristalliques en échange de la pleine propriété du système §Y[giga_eawaf_system.GetName]§!."

  giga_eawaf.7015.desc.eawgriffon:99 "Salutations, êtres extrafaustiens. L'Empire griffonien a finalement dompté les lois de la physique elles-mêmes, nous permettant de traverser les vastes vides entre les étoiles.\n\nCependant, nous avons remarqué que votre espèce a revendiqué notre système stellaire. À ce titre, moi, Kaiser §YGrover XI§!, souhaiterais que votre espèce transfère le système sous notre contrôle, car nous l'avons habité bien plus longtemps que vous.\n\nC'est la seule chose juste."

  giga_eawaf.7015.desc.eawcommunist:99 "Salutations, voyageurs des étoiles. Les esprits les plus brillants de la République socialiste faustienne ont conçu un grand dispositif capable d'atteindre d'autres étoiles.\n\nCependant, nous avons remarqué que votre espèce a revendiqué notre système stellaire. À ce titre, notre conseil suprême a décidé d'accorder à votre civilisation une compensation financière de §Y5000§! £energy£ et §Y2500§! de nos meilleurs £consumer_goods£ en échange de la pleine propriété du système §Y[giga_eawaf_system.GetName]§!.\n\nNous espérons que vous ne nous décevrez pas."

  giga_eawaf.7015.desc.riverun:99 "Salutations, voyageurs des étoiles. La Fédération faustienne a enfin acquis la technologie nécessaire pour naviguer à travers les étoiles.\n\nCependant, nous avons remarqué que votre espèce a revendiqué notre système stellaire. À ce titre, nous avons décidé d'offrir à votre civilisation une compensation financière de §Y7500§! £energy£ provenant de nos plus grands réacteurs cristalliques en échange de la pleine propriété du système §Y[giga_eawaf_system.GetName]§!."

  giga_eawaf.7015.desc.jerwng:99 "Salutations, êtres extrafaustiens. Grâce aux efforts combinés de Wingbardy et d'Aquileia, notre espèce a finalement dompté les lois de la physique elles-mêmes, nous permettant de traverser les vastes vides entre les étoiles.\n\nCependant, nous avons remarqué que votre espèce a revendiqué notre système stellaire. À ce titre, moi, Impératrice §YAlessandra Discret§!, souhaiterais que votre espèce transfère le système sous notre contrôle, car nous l'avons habité bien plus longtemps que vous.\n\nC'est la seule chose juste."

  giga_eawaf.7015.desc.kiria:99 "Salutations, partenaires commerciaux extrafaustiens ! Étant donné que nous avons déverrouillé les secrets du voyage FTL tout comme vous, nous aimerions vous proposer un marché ! Que dites-vous de §Y7500§! £energy£ provenant de nos plus grands réacteurs cristalliques en échange de la pleine propriété du système §Y[giga_eawaf_system.GetName]§! ? Pensez aux opportunités économiques !"

  giga_eawaf.7015.desc.posada:99 "Enfin, oh comme nous avons attendu ce moment ! Peuple des étoiles ! Les esprits les plus brillants de notre monde ont conçu un grand dispositif capable d'atteindre d'autres étoiles.\n\nCependant, il semble que vous, Peuple des étoiles, ayez revendiqué notre système stellaire. À ce titre, nous aimerions vous demander gentiment de nous accorder le système, en échange d'une compensation financière de §Y5000§! £energy£ et §Y2500§! de nos meilleurs £consumer_goods£ !\n\nPuissions-nous forger un partenariat fructueux !"

  giga_eawaf.7015.desc.kaiser:99 "Salutations, extraterrestre. L'Imperium Katzenartig a maintenant déverrouillé le FTL et s'apprête à embarquer pour la plus grande aventure de son histoire. À ce titre, je demande que vous transfériez le contrôle de la base stellaire du système Faust à nous. Une compensation financière de §Y7500§! £energy£ peut être fournie, mais nous n'avons pas peur de nous battre si vous refusez."

  giga_eawaf.7015.desc.dread:99 "Il n'y aura pas de repos jusqu'à la mort de la Mort elle-même."
  giga_flavor_systems.7005.dread:99 "Aux postes de combat !"

  giga_eawaf.7015.desc.leopold:99 "<<SALUTATIONS, VOYAGEURS DES ÉTOILES>>\n\n<<OFFRE DE COMPENSATION POUR LA PROPRIÉTÉ DU SYSTÈME FAUST>>\n\n<<PROPOSITION : §Y7500§! £energy£>>\n\n<<REFUSEZ ET FAITES FACE À NOTRE PUISSANCE>>"
  giga_eawaf.7015.a:99 "Vous pouvez avoir le système."
  giga_eawaf.7015.a.response:99 "[giga_eawaf_country.GetName] vous remercie de votre coopération."
  giga_eawaf.7015.a.tooltip:99 "Nous transférerons l'intégralité du système §Y[giga_eawaf_system.GetName]§! à §Y[giga_eawaf_country.GetName]§!, y compris toutes les autres colonies que nous pourrions avoir dans le système."

  opinion_eaw_gave_system:99 "A donné le système d'origine"
  opinion_eaw_gave_system_neighbors:99 "A donné le système d'origine et les voisins"

  giga_eawaf.7015.b:99 "Vous pouvez avoir le système et ses voisins immédiats également."
  giga_eawaf.7015.b.tooltip:99 "Nous transférerons l'intégralité du système §Y[giga_eawaf_system.GetName]§! ainsi que les §Ysystèmes voisins§! à §Y[giga_eawaf_country.GetName]§!, y compris toutes les autres colonies que nous pourrions avoir dans ces systèmes.\n\n[giga_eawaf_country.GetName] sera certainement reconnaissant."
  giga_eawaf.7015.b.response:99 "Vraiment délicieux ! [giga_eawaf_country.GetName] sera reconnaissant."

  giga_flavor_systems.7005.c:99 "Hors de question."
  giga_flavor_systems.7005.c.tooltip:99 "Nous refuserons de leur donner le système. Ils pourraient exercer des représailles contre nous."
  giga_flavor_systems.7005.c.response:99 "Sachez que nous n'avons pas peur du conflit, [ROOT.GetName]."

  giga_tech_thaumaturgic_weaponry:99 "Armement cristallin semi-thaumaturgique"
  giga_tech_thaumaturgic_weaponry_desc:99 "Les habitants de Faust ont conçu des fusils et des armes infusés de cristaux puissants qui surpassent de loin l'armement conventionnel. Bien que cela ait pu leur sembler de la magie, ce qui a drastiquement limité la propagation de cette technologie, une étude approfondie de la nature de ces cristaux pourrait bien nous permettre de standardiser leur utilisation au sein de nos forces armées. Cela entraînerait cependant un coût d'entretien significatif en cristaux rares."
  edict_giga_eawaf_thaumaturgic_weaponry:99 "Armements semi-thaumaturgiques"
  edict_giga_eawaf_thaumaturgic_weaponry_desc:99 "Équiper nos forces d'un armement cristallin puissant améliorera sans aucun doute leurs capacités offensives."

  giga_eawaf.7100.name:99 "Faust subjuguée"
  giga_eawaf.7100.desc:99 "Nos armées ont réussi à subjuguer avec succès la grande majorité des forces armées de §YFaust§! et bien que quelques irréductibles continuent de résister à nos soldats dans les régions les plus isolées de Faust, nous avons maintenant sécurisé le contrôle de tous les principaux centres de population de la planète.\n\nCependant, Faust possède un éventail inhabituellement diversifié de nations et de cultures avec au moins 2 espèces majeures différentes partageant la planète et des dizaines de sous-espèces chacune avec leurs propres idéologies et croyances.\n\nEn fait, cela rend étonnamment difficile de maintenir la population nouvellement conquise sous contrôle et quand on ajoute le fait que certaines des espèces susmentionnées semblent posséder des capacités semblables à des psioniques, cela signifie que des mouvements de résistance majeurs s'organisent déjà à travers la planète.\n\nIl ne fait aucun doute que nous finirons par pouvoir subjuguer complètement les primitifs faustiens, mais pour le moment, nous devrions nous attendre à une résistance extrêmement acharnée à notre règne sur la planète alors que les habitants de Faust comprennent la réalité inévitable de leur nouveau statut en tant que membres de notre civilisation."
  giga_eawaf.7100.a:99 "Ils seront traités en temps voulu."

  giga_eaw_faust_harsh_resistance:99 "Résistance acharnée"
  giga_eaw_faust_harsh_resistance_desc:99 "Les autochtones de ce monde résistent à notre règne, mais ils ne pourront pas le faire éternellement."

  giga_eawaf.7101.name:99 "Armement cristallin"
  giga_eawaf.7101.desc:99 "En étudiant la population conquise de §YFaust§! et leurs technologies, nos soldats ont remarqué que malgré leur classification comme civilisation primitive, les Faustiens utilisaient un armement étonnamment puissant pour leur niveau de développement technologique.\n\nDes investigations plus poussées ont révélé que la plupart des armements des Faustiens tournent autour de l'utilisation d'un type exotique de §YCristal rare§! intégré dans leurs technologies qui est capable de stocker et de libérer d'énormes quantités d'énergie. Ces cristaux agissaient effectivement comme des « batteries cristallines » fournissant à leurs armes un flux d'énergie quasi infini à utiliser.\n\nIls sont apparemment étroitement liés aux cristaux rares que nous connaissons et ont probablement été déposés sur Faust par des siècles d'impacts de météores provenant de la ceinture d'astéroïdes cristallins voisine, peut-être tordus en cette forme plus exotique par une perturbation locale de l'espace-temps.\n\nQuoi qu'il en soit, nos scientifiques sont impatients d'étudier ces cristaux particuliers et ont déjà présenté plusieurs propositions pour les intégrer dans notre propre armement afin de renforcer encore plus la force de nos forces armées.\n\nUn scientifique a souligné le fait que, si une telle civilisation devait pleinement embrasser le véritable potentiel de l'armement thaumaturgique, elle serait sans aucun doute l'une des forces les plus menaçantes de toute la galaxie. Heureusement, les habitants de Faust utilisaient les cristaux davantage comme des améliorations de leurs technologies « ordinaires » plutôt que de s'appuyer entièrement sur eux. Mais pour notre propre bien, nous devons espérer qu'aucune civilisation ne découvre jamais le véritable potentiel de ces technologies ésotériques et pratiquement « magiques »..."
  giga_eawaf.7101.a:99 "Intrigant."

  giga_eawaf.7016.name:99 "[giga_eawaf_country.GetName] s'empare de la base stellaire de [giga_eawaf_system.GetName] !"
  giga_eawaf.7016.desc:99 "Dans un mépris flagrant de notre rejet de leur demande, §Y[giga_eawaf_country.GetName]§! a mené une opération pour commanditer et saisir notre base stellaire dans le système §Y[giga_eawaf_system.GetName]§!.\n\nBien qu'ils aient réussi à capturer la base stellaire elle-même, nous estimons qu'il ne devrait pas être trop difficile de détruire leurs flottes et de reprendre le système ainsi que leur planète, mais notre haut commandement avertit que leurs forces terrestres sont inhabituellement puissantes pour une civilisation aussi jeune."
  giga_eawaf.7016.a:99 "Comment osent-ils ? Écrasez-les immédiatement !"
  giga_eawaf.7016.a.tooltip:99 "Nous allons §RDÉCLARER LA GUERRE§! à §Y[giga_eawaf_country.GetName]§! et devrons saisir §YFaust§! pour obtenir la victoire."
  giga_eawaf.7016.b:99 "Ils peuvent avoir le système, il ne vaut rien pour nous de toute façon."
  giga_eawaf.7016.b.tooltip:99 "Le système §Y[giga_eawaf_system.GetName]§! et toutes ses planètes sont transférés à §Y[giga_eawaf_country.GetName]§!."

  giga_eawaf.7103.name:99 "Les Alicornes se mobilisent contre l'invasion !"
  giga_eawaf.7103.desc:99 "Notre invasion de §YFaust§! n'est certainement pas passée inaperçue aux yeux des premiers protecteurs de la planète, car en effet, les cieux mêmes de §YFaust§! tremblent alors que les deux divinités célestes jumelles de la planète connues sous les noms de §YPrincesse Celestia§! et §YPrincesse Luna§! se mobilisent maintenant contre nous dans une tentative de sauver leur monde de la subjugation extraterrestre.\n\nNous devrions nous attendre au pire, car étant donné que la magie puissante de ces entités est supposément assez puissante pour permettre à Hélios et Sélène, qui défient les lois de la physique, d'orbiter autour de Faust, elles sont presque certainement capables de dévaster nos forces armées.\n\nDéjà nos commandants rapportent que des divisions entières sont anéanties par de puissants faisceaux de magie plasmatique surchauffée manifestée par Celestia, tandis que toutes les opérations logistiques du côté nuit de la planète se trouvent entravées par une obscurité apparemment dévorante vraisemblablement lancée par Luna elle-même, rendant nos soldats impuissants dans la nuit noire.\n\nIl est évident que subjuguer Faust va nécessiter un investissement immense de notre part, bien que si nous ne souhaitons pas affronter ces ennemis surnaturels, nous pourrions aussi simplement nous retirer de tout ce bourbier, mais les dommages à la société de Faust seront indéniablement permanents."
  giga_eawaf.7103.a:99 "Nous ne nous rendrons jamais à des chevaux parlants !"
  giga_eawaf.7103.a.tooltip:99 "§YCelestia§! et §YLuna§! se mobiliseront contre nous !"
  giga_eawaf.7103.b:99 "Ce satané caillou n'en vaut pas la peine."
  giga_eawaf.7103.b.tooltip:99 "Nous nous retirerons de Faust. Cependant, la mobilisation de §YCelestia§! et §YLuna§! ainsi que de Faust dans son ensemble, couplée à la certitude que la vie extraterrestre existe, aura presque certainement de §Rgrandes conséquences§! sur le développement de la planète."

  giga_eawaf.10151.name:99 "Établissement de la base stellaire de Faust"
  giga_eawaf.10151.desc:99 "Étant donné les propriétés particulières du système §YFaust§!, notre équipage d'exploration a suggéré que nous établissions de toute urgence un §YAvant-poste§! dans le système afin de nous assurer que nous pouvons continuer à investiguer ses mystères."
  giga_eawaf.10151.a:99 "Une entreprise qui en vaut la peine !"
  giga_eawaf.10151.b:99 "Nous avons de meilleures choses sur lesquelles nous concentrer."

  # Relics
  r_eawaf_sirens_crystal:99 "Cristaux abyssaux"
  r_eawaf_sirens_crystal_desc:99 "Appartenant à l'origine aux Sirènes et forgés par des moyens inconnus, ces cristaux rouges fascinants possèdent une magie extrêmement puissante capable d'influencer les pensées de presque n'importe quelle créature sapiente.\nBien qu'il soit inconcevable que nous puissions les utiliser à leur pleine mesure comme les Sirènes l'ont fait autrefois, ils peuvent néanmoins être utiles pour traiter avec des individus ou des entités politiques particulièrement problématiques."

  r_eawaf_eqg_portal:99 "Miroir de cristal"
  r_eawaf_eqg_portal_desc:99 "Un mystérieux dispositif semblable à un portail connecté à une charmante dimension alternative peuplée d'humanoïdes primitifs et étrangement colorés fréquentant une sorte de centre d'éducation. Bien que la dimension elle-même nous soit de peu d'utilité, les propriétés ésotériques du portail offrent une incursion fascinante dans la nature sous-jacente de notre univers et de ses royaumes constitutifs. De plus, ses habitants produisent occasionnellement des pièces musicales intéressantes d'intérêt culturel."
  giga_eawaf_portal_relic_tooltip:99 "\nExtrait un ensemble envoûtant de performances musicales harmonieuses sur les mérites de l'amitié de la dimension alternative, renforçant l'unité de notre nation.\n§L« Saute en l'air, fais du bruit ! Frappe tes sabots, fais demi-tour ! »§!"

  giga_eawaf_eqg_portal_modifier:99 "Comédies musicales harmonieuses"
  giga_eawaf_eqg_portal_modifier_desc:99 "Les pièces musicales extraites de la dimension miroir fournissent à nos artistes une abondance de matériel."
  giga_eawaf_eqg_portal_modifier_gestalt:99 "$giga_eawaf_eqg_portal_modifier$"
  giga_eawaf_eqg_portal_modifier_gestalt_desc:99 "Les pièces musicales extraites de la dimension miroir fournissent à nos sociologues une abondance de matériel."

  giga_eawaf_crystal_relic_tooltip:99 "Lance un sortilège de §Rhaine§! et de §Rdiscorde§! sur toutes les factions et tous les empires avec lesquels nous sommes actuellement hostiles, réduisant les capacités des vaisseaux et augmentant l'agitation planétaire."

  giga_eawaf_crystal_relic_modifier:99 "Sortilège de discorde"
  giga_eawaf_crystal_relic_modifier_desc:99 "Un sortilège de discorde est lancé sur nous."

  giga_eawaf_mindwardens_relic_altreward_modifier:99 "Croyances justifiées"
  giga_eawaf_mindwardens_relic_altreward_modifier_desc:99 "La croisade contre la menace des Sirènes a aiguisé notre clarté de dessein et justifié notre mission."

  giga_eawaf_mindwardens_psifusion_altreward_modifier:99 "Études de fusion psicatalysée"
  giga_eawaf_mindwardens_psifusion_altreward_modifier_desc:99 "Le processus ésotérique alimentant la fusion d'Hélios nous a beaucoup appris sur le mouvement interdimensionnel de l'énergie.\n\n$giga_eawaf.1017.hatepsi.a.tooltip$"

  giga_eawaf.60252.name:99 "Sortilège de discorde entrant !"
  giga_eawaf.60252.desc:99 "§Y[giga_eawaf_strife_spell_caster.GetName]§! a utilisé les §YCristaux abyssaux§! pour lancer un sortilège de discorde sur notre civilisation, réduisant la cohésion de notre peuple !"
  giga_eawaf.60252.a:99 "Malédiction !"

  giga_eawaf.60253.name:99 "Sortilège de discorde lancé !"
  giga_eawaf.60253.desc:99 "Grâce à des impulsions d'énergie ciblées, les §YCristaux abyssaux§! ont déchargé leurs énergies à travers la galaxie, obscurcissant les esprits de ceux qui nous veulent du mal."
  giga_eawaf.60253.a:99 "Excellent. Qu'ils souffrent."

  GIGA_EAWAF_EQG_PORTAL:99 "Libérer les Faustiens"
  GIGA_EAWAF_EQG_PORTAL_DESC:99 "Il est primordial que nous trouvions un moyen de libérer Faust de l'emprise des Sirènes, de peur que toute sa population ne meure d'une mort inutile."

  GIGA_EAWAF_SIRENS_COUNTRY:99 "Envoûteurs harmoniques"

