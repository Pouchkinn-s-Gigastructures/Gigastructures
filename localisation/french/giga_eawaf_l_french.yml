  mod_damage_vs_country_type_giga_eawaf_sirens_mult:0 "Dégâts contre Sirenalia"

  giga_eawaf_outer_strife_field_modifier:0 "Influence du champ de discorde extérieur"
  giga_eawaf_outer_strife_field_modifier_desc:0 "§WCe monde génère §R[THIS.giga_eawaf_planet_strife]§! §PDiscorde§! pour Sirenalia\n§WLa §PDiscorde§! n'est générée ci-dessous qu'en dessous de §Y90 Stabilité§! selon :§!\n(§Y80 - Stabilité§!) x (§YPopulation planétaire§!) x (§Y1§! + §YPourcentage de criminalité§!)§!\n§WLes pénalités de §YStabilité§!/§YCriminalité§! sont échelonnées selon le niveau de §MPuissance§! de l'Envoûteur§!\n\n§LLe champ de discorde extérieur influence les habitants de ce monde, les poussant vers la haine et convertissant cette haine en §PDiscorde§! pour alimenter l'Envoûteur voilosonique de Sirenalia. Construire des bâtiments spécifiques peut aider à atténuer voire annuler cela.§!"

  giga_eawaf_outer_strife_field_modifier_halved:0 "Influence du champ de discorde extérieur"
  giga_eawaf_outer_strife_field_modifier_halved_desc:0 "§WCe monde génère §R[THIS.giga_eawaf_planet_strife]§! §PDiscorde§! pour Sirenalia\n§WLa §PDiscorde§! n'est générée ci-dessous qu'en dessous de §Y90 Stabilité§! selon :§!\n(§Y80 - Stabilité§!) x (§YPopulation planétaire§!) x (§Y1§! + §YPourcentage de criminalité§!)§!\n§WLes pénalités de §YStabilité§!/§YCriminalité§! sont échelonnées selon le niveau de §MPuissance§! de l'Envoûteur§!\nLes effets sont §Yréduits de moitié§! par un §YChamp de désenchantement prototype§!.\n\n§LLe champ de discorde extérieur influence les habitants de ce monde, les poussant vers la haine et convertissant cette haine en §PDiscorde§! pour alimenter l'Envoûteur voilosonique de Sirenalia. Construire des bâtiments spécifiques peut aider à atténuer voire annuler cela.§!"

  giga_eawaf_outer_strife_field_modifier_quartered:0 "Influence du champ de discorde extérieur"
  giga_eawaf_outer_strife_field_modifier_quartered_desc:0 "§WCe monde génère §R[THIS.giga_eawaf_planet_strife]§! §PDiscorde§! pour Sirenalia\n§WLa §PDiscorde§! n'est générée ci-dessous qu'en dessous de §Y90 Stabilité§! selon :§!\n(§Y80 - Stabilité§!) x (§YPopulation planétaire§!) x (§Y1§! + §YPourcentage de criminalité§!)§!\n§WLes pénalités de §YStabilité§!/§YCriminalité§! sont échelonnées selon le niveau de §MPuissance§! de l'Envoûteur§!\nLes effets sont §Yréduits d'un quart§! par un §YChamp de désenchantement harmonisé§!.\n\n§LLe champ de discorde extérieur influence les habitants de ce monde, les poussant vers la haine et convertissant cette haine en §PDiscorde§! pour alimenter l'Envoûteur voilosonique de Sirenalia. Construire des bâtiments spécifiques peut aider à atténuer voire annuler cela.§!"

  # Menu
  giga_sirens_spawnlater:0 "Faire apparaître les Sirènes §GPlus tard§!\nLes Sirènes commenceront à apparaître dans les §Y5 ans§! suivant la date d'apparition sélectionnée. Si réglé sur §YGaranti§!, elles apparaîtront à la date exacte."

  giga_sirens_spawnearlier:0 "Faire apparaître les Sirènes §RPlus tôt§!\nLes Sirènes commenceront à apparaître dans les §Y5 ans§! suivant la date d'apparition sélectionnée. Si réglé sur §YGaranti§!, elles apparaîtront à la date exacte."

  giga_sirens_randomgame:0 "Date d'apparition de Sirenalia : §LAléatoire§!\nSirenalia apparaîtra à un moment aléatoire. La situation §YPrise de pouvoir des Sirènes§! se produira §Y25 ans après§! et le §YLinceul éthéré§! se dissipera après un temps aléatoire.\n$sirens_spawn_warning$"
  giga_sirens_lateendgame:0 "Date d'apparition de Sirenalia : §E2500§!\nSirenalia peut apparaître après §Y2500§!. La situation §YPrise de pouvoir des Sirènes§! se produira §Y25 ans après§! et le §YLinceul éthéré§! durera jusqu'en 2500.\n$sirens_spawn_warning$"
  giga_sirens_regularendgame:0 "Date d'apparition de Sirenalia : §G2450§!\nSirenalia peut apparaître après §Y2450§!. La situation §YPrise de pouvoir des Sirènes§! se produira §Y25 ans après§! et le §YLinceul éthéré§! durera jusqu'en 2450.\n$sirens_spawn_warning$"
  giga_sirens_endgame:0 "Date d'apparition de Sirenalia : §Y2400§! (Par défaut)\nSirenalia peut apparaître après §Y2400§!. La situation §YPrise de pouvoir des Sirènes§! se produira §Y25 ans après§! et le §YLinceul éthéré§! durera jusqu'en 2400.\n$sirens_spawn_warning$"
  giga_sirens_latemidgame:0 "Date d'apparition de Sirenalia : §H2350§!\nSirenalia peut apparaître après §Y2350§!. La situation §YPrise de pouvoir des Sirènes§! se produira §Y25 ans après§! et le §YLinceul éthéré§! durera jusqu'en 2350.\n$sirens_spawn_warning$"
  giga_sirens_midgame:0 "Date d'apparition de Sirenalia : §S2300§!\nSirenalia peut apparaître après §Y2300§!. La situation §YPrise de pouvoir des Sirènes§! se produira §Y25 ans après§! et le §YLinceul éthéré§! durera jusqu'en 2300.\n$sirens_spawn_warning$"
  giga_sirens_lateearlygame:0 "Date d'apparition de Sirenalia : §P2250§!\nSirenalia peut apparaître autour de §Y2250§!. La situation §YPrise de pouvoir des Sirènes§! se produira §Y25 ans après§! et le §YLinceul éthéré§! durera jusqu'en 2250.\n$sirens_spawn_warning$"
  giga_sirens_earlygame:0 "Date d'apparition de Sirenalia : §RDébut de partie§!\nSirenalia peut apparaître proche du §YDébut de partie§!. La situation §YPrise de pouvoir des Sirènes§! commencera immédiatement et le §YLinceul éthéré§! se dissipera en moins d'un an.\n$sirens_spawn_warning$"

  sirens_spawn_warning:0 "\n§YRéglez Sirenalia sur §GGaranti§! si vous voulez vous assurer que Sirenalia apparaisse.§!\n\n§GCliquez pour changer la date d'apparition de Sirenalia§!"

  giga_eawaf_sirens_guaranteed:0 "Les §YSirènes§! réussiront §Gtoujours§! dans leur entreprise de prise de contrôle de §YFaust§! et se transformeront ensuite en crise, à moins d'être arrêtées par le joueur."

  giga_sirens_not_guaranteed:0 "Les §YSirènes§! ont environ §Y50 %§! de chances de prendre le contrôle de §YFaust§! et de devenir une crise, sauf intervention du joueur."

  giga_eawaf_sirens_disabled:0 "Les §YSirènes§! ne tenteront pas de prendre le contrôle de §YFaust§!. Le système peut cependant toujours apparaître avec des primitifs personnalisés s'il n'est pas désactivé.\n\n§BLa crise §YSirenalia§! a été créée dans le cadre de la collaboration du §YPoisson d'avril 2024§! avec l'équipe §YEquestria at War§!, qui a ajouté un parcours §YKaiser Kattail§! à leur propre mod.§!"

  giga_sirens_enabled:0 "Les §YSirènes§! tenteront de prendre le contrôle de §YFaust§! et finiront par devenir §RSirenalia§!. Elles tenteront de §Rcontrôler mentalement§! toute la galaxie grâce à leur chant magique envoûtant !\n\n§BLa crise §YSirenalia§! a été créée dans le cadre de la collaboration du §YPoisson d'avril 2024§! avec l'équipe §YEquestria at War§!, qui a ajouté un parcours §YKaiser Kattail§! à leur propre mod.§!"

  giga_eawaf_sirens_easy:0 "Sirenalia (§BLargo§!)\nSirenalia sera §Baffaiblie§!.\n\nLa §MPuissance§! commencera à §Y0,5§! tandis que chaque niveau de l'§YEnvoûteur voilosonique§! l'augmentera de §Y0,25§!."

  giga_eawaf_sirens_normal:0 "Sirenalia (§GLento§!)\nSirenalia sera §Gnormale§!.\n\nLa §MPuissance§! commencera à §Y1§! tandis que chaque niveau de l'§YEnvoûteur voilosonique§! l'augmentera de §Y0,5§!."

  giga_eawaf_sirens_hard:0 "Sirenalia (§YModerato§!)\nSirenalia sera §Yrenforcée§!.\n\nLa §MPuissance§! commencera à §Y5§! tandis que chaque niveau de l'§YEnvoûteur voilosonique§! l'augmentera de §Y2§!."

  giga_eawaf_sirens_veryhard:0 "Sirenalia (§HAllegro§!)\nSirenalia sera §Htrès renforcée§!.\n\nLa §MPuissance§! commencera à §Y10§! tandis que chaque niveau de l'§YEnvoûteur voilosonique§! l'augmentera de §Y5§!."

  giga_eawaf_sirens_extreme:0 "Sirenalia (§RVivace§!)\nSirenalia sera §Rextrêmement renforcée§!.\n\nLa §MPuissance§! commencera à §Y25§! tandis que chaque niveau de l'§YEnvoûteur voilosonique§! l'augmentera de §Y10§!."

  giga_eawaf_sirens_impossible:0 "Sirenalia (§PPresto§!)\nSirenalia sera §Pimpossiblement renforcée§!.\n\nLa §MPuissance§! commencera à §Y50§! tandis que chaque niveau de l'§YEnvoûteur voilosonique§! l'augmentera de §Y25§!."

  giga_eawaf_sirens_abyss:0 "Sirenalia (§gAbyssale§!)\n§RALORS QUE LE CYCLE EST DÉCHIRÉ ET QUE LES MURS DE LA RÉALITÉ S'EFFACENT, DES PROFONDEURS DE L'EXISTENCE ELLE-MÊME S'ÉVEILLE UNE FORCE INCOMPRÉHENSIBLE.§!\n\nLa §MPuissance§! commencera à §Y1000§! tandis que chaque niveau de l'§YEnvoûteur voilosonique§! l'augmentera de §Y500§!.\n\n§RTOUTES§! les factions pourront être envoûtées par les Sirènes."

  #Primitive Events
  d_everfree_forest:0 "Forêt Everfree"
  d_everfree_forest_desc:0 "Une forêt particulière et quasi impénétrable emplie d'énergies apparemment magiques. La défricher serait une tâche aux proportions titanesques, mais étudier son écosystème ésotérique produirait sûrement des données intrigantes."

  giga_eawaf.7002.name:0 "Faust entre dans l'ère atomique"
  giga_eawaf.7002.desc:0 "Les rapports indiquent que les primitifs habitant le monde continental particulier de §YFaust§! dans le système §Y[giga_eawaf_system.GetName]§! ont construit et testé avec succès un engin nucléaire de faible puissance.\n\nBien qu'ils restent relativement rares et coûteux pour l'instant, ces armes devraient proliférer de façon exponentielle à mesure que la technologie est affinée et se répand parmi les différents États-nations de la planète.\n\nFait intéressant, au lieu de s'appuyer sur la fission conventionnelle de l'uranium pour l'énergie, ces armes utilisent les énergies contenues dans les abondants gisements de cristaux de la planète pour libérer un pouvoir destructeur formidable, que notre Poste d'observation a commencé à appeler des §Yengins thaumonucléaires§!.\n\nDésormais, si un conflit à grande échelle devait survenir sur la planète, il sera certainement bien plus destructeur que jamais auparavant."
  giga_eawaf.7002.a:0 "Intrigant."

  giga_eawaf.7004.name:0 "Faust sombre dans la guerre thaumonucléaire"
  giga_eawaf.7004.desc:0 "Notre Poste d'observation de §YFaust§! rapporte que, en raison de tensions extrêmement élevées dans la scène géopolitique de la planète, un incident de bateau de pêche relativement mineur entre deux des grandes puissances de Faust a dégénéré en un conflit à grande échelle opposant les trois principaux continents de la planète les uns aux autres.\n\nMalheureusement, l'armement thaumonucléaire s'était généralisé, la plupart des grandes nations possédant un arsenal considérable, ce qui signifie que le conflit s'est rapidement transformé en un événement d'extinction à mesure que les diverses alliances supranationales de la planète commençaient à se lancer d'abondantes quantités d'ogives thaumonucléaires les unes sur les autres.\n\nIl n'a fallu que quelques jours pour que la surface de la planète soit complètement engloutie par les énergies cataclysmiques libérées par les engins, transformant le monde autrefois verdoyant en une vaste tempête bouillonnante d'énergies quasi magiques couvrant toute la planète.\n\nLes scans orbitaux montrent qu'à l'exception d'une jungle étonnamment récalcitrante qui semble prospérer grâce aux énergies libérées par les engins thaumonucléaires, la civilisation primitive a été complètement anéantie."
  giga_eawaf.7004.a:0 "Une fin si violente. Regrettable."

  giga_eawaf.7006.name:0 "Faust entre dans l'ère spatiale primitive"
  giga_eawaf.7006.desc:0 "Les primitifs de §YFaust§! ont franchi une autre étape cruciale dans leur évolution sociétale avec le développement des premiers vaisseaux spatiaux orbitaux capables de vol interplanétaire.\n\nAlimentés par des formes liquides des cristaux abondants de la planète, plusieurs de ces vaisseaux spatiaux ont été envoyés pour explorer leur système stellaire, les primitifs commençant des incursions sérieuses dans la nature de leur système planétaire ésotérique.\n\nAvec le développement de télescopes à lentilles cristallines de plus en plus puissants, il est probable que les primitifs ont appris que l'astrogéographie particulière de leur planète est vraiment unique en son genre en étudiant des exoplanètes plus « standard ».\n\nLes tensions à travers la planète commencent à se calmer, plusieurs des grandes puissances prenant des mesures très concrètes vers la coopération internationale, mais il reste à voir si ces efforts porteront leurs fruits ou se termineront par un événement d'extinction désastreux.\n\nIl ne devrait pas falloir longtemps avant que leurs êtres particuliers ne soient prêts à nous rejoindre parmi les étoiles."
  giga_eawaf.7006.a:0 "Intéressant."

  giga_eawaf.7012.name:0 "La §YGrande Convocation faustienne§! atteint le SLV"
  giga_eawaf.7011.desc.eawun:0 "Notre Poste d'observation de §YFaust§! indique que les primitifs de la planète ont enfin conçu un moteur SLV fonctionnel. Comme la plupart de leur technologie, il fait un usage extensif des cristaux particuliers et abondants de la planète, les rendant étonnamment bon marché à fabriquer compte tenu de la quantité de cristaux disponibles dans leur système d'origine.\n\nLa planète elle-même a été unifiée par une entité supranationale connue sous le nom de §YGrande Convocation faustienne§!, formée par la fédération de plusieurs des principaux gouvernements démocratiques de la planète. Bien que ces gouvernements existent encore dans une certaine mesure, la Convocation a effectivement assumé le rôle d'autorité interstellaire de Faust et sera responsable de guider l'expansion de la civilisation à travers les étoiles.\n\nCompte tenu des grandes différences culturelles et physiques entre les différentes espèces de la planète, la fédération pacifique de toute la planète en un gouvernement singulier est considérée comme un exploit étonnant, tant par l'équipage de notre Avant-poste que par la plupart des habitants de la planète.\n\nCependant, comme nous possédons la base stellaire du système, nous avons reçu une transmission de leur dirigeant, §YJungle Trek III§!, demandant que nous transférions la propriété de la base stellaire afin que les habitants de Faust puissent enfin commencer leur voyage interplanétaire."

  giga_eawaf.7013.name:0 "L'§YEmpire griffonien§! atteint le SLV"
  giga_eawaf.7011.desc.eawgriffon:0 "Notre Poste d'observation de §YFaust§! indique que les primitifs de la planète ont enfin conçu un moteur SLV fonctionnel. Comme la plupart de leur technologie, il fait un usage extensif des cristaux particuliers et abondants de la planète, les rendant étonnamment bon marché à fabriquer compte tenu de la quantité de cristaux disponibles dans leur système d'origine.\n\nLa planète elle-même a été unifiée par la guerre et les manœuvres diplomatiques par une nation impérialiste connue sous le nom d'§YEmpire griffonien§!, qui a réussi à subjuguer la majorité des anciennes nations de la planète soit par conquête directe soit en exerçant sa domination économique sur le reste de la planète.\n\nBien que tout le monde ne soit pas satisfait de cet arrangement, aucune puissance étrangère capable de s'opposer à l'occupation de l'Empire griffonien ne subsiste et le sort de la planète semble donc être scellé.\n\nComme nous possédons la base stellaire du système, nous avons reçu une transmission de leur dirigeant, §YGrover XI§! de la §YDynastie Grover§!, demandant que nous transférions le système sous leur contrôle afin que l'Empire griffonien soit reconnu comme une nation galactique indépendante."

  giga_eawaf.7014.name:0 "La §YRépublique socialiste faustienne§! atteint le SLV"
  giga_eawaf.7011.desc.eawcommunist:0 "Notre Poste d'observation de §YFaust§! indique que les primitifs de la planète ont enfin conçu un moteur SLV fonctionnel. Comme la plupart de leur technologie, il fait un usage extensif des cristaux particuliers et abondants de la planète, les rendant étonnamment bon marché à fabriquer compte tenu de la quantité de cristaux disponibles dans leur système d'origine.\n\nLa planète elle-même a été relativement pacifiquement unifiée en la §YRépublique socialiste faustienne§!, un gouvernement socialiste au nom approprié qui, par plusieurs fusions avec des alliés socialistes amicaux et pas mal de guerres, a réussi à imposer son contrôle sur la grande majorité des États-nations de Faust.\n\nBien que quelques nations restent indépendantes, elles sont bien trop insignifiantes pour qu'elles comptent face à la suprématie écrasante du nouveau gouvernement socialiste, qui promet d'apporter l'égalité et la prospérité à toutes les créatures, quelle que soit leur espèce ou leur origine.\n\nComme nous possédons la base stellaire du système, nous avons reçu une transmission de leur dirigeant, un représentant de leur Conseil suprême, demandant que nous leur transférions la propriété de la base stellaire."

  giga_eawaf.70141.name:0 "La §YFédération faustienne§! atteint le SLV"
  giga_eawaf.70141.desc:0 "Notre Poste d'observation de §YFaust§! indique que les primitifs de la planète ont enfin conçu un moteur SLV fonctionnel. Comme la plupart de leur technologie, il fait un usage extensif des cristaux particuliers et abondants de la planète, les rendant étonnamment bon marché à fabriquer compte tenu de la quantité de cristaux disponibles dans leur système d'origine.\n\nLa planète a été unie sous la direction de la §YFédération faustienne§!, un gouvernement harmoniste qui a pris forme à l'origine dans les confins orientaux du continent griffonien.\n\nBien qu'elle n'ait été à l'origine qu'une alliance militaire et économique connue sous le nom de §YFédération de la Rivière§!, elle s'est finalement fédérée en un super-État qui, par la diplomatie et l'occasionnelle croisade contre les régimes autoritaires comme l'Empire griffonien voisin, s'est finalement retrouvée comme seule hyperpuissance de la planète.\n\nIls nous appellent maintenant afin de discuter du transfert du système vers eux."

  giga_eawaf.70142.name:0 "Le §YGrand Empire d'Aquileia-Wingbardy§! atteint le SLV"
  giga_eawaf.70142.desc:0 "Notre Poste d'observation de §YFaust§! indique que les primitifs de la planète ont enfin conçu un moteur SLV fonctionnel. Comme la plupart de leur technologie, il fait un usage extensif des cristaux particuliers et abondants de la planète, les rendant étonnamment bon marché à fabriquer compte tenu de la quantité de cristaux disponibles dans leur système d'origine.\n\nLa planète elle-même a été unifiée sous la direction d'§YAquileia-Wingbardy§!, un empire créé suite à la fusion de deux des principaux États-nations de Griffonia et leur ascension subséquente en tant que superpuissance continentale puis hyperpuissance planétaire suite à la prise de contrôle de tout leur continent et de nombreuses entreprises militaires, économiques et coloniales outre-mer.\n\nÉtant donné que nous possédons la base stellaire du système, nous avons reçu une transmission de leur Impératrice demandant le contrôle du système en échange de ressources."

  giga_eawaf.70143.name:0 "La §YCorporation faustienne§! atteint le SLV"
  giga_eawaf.70143.desc:0 "Notre Poste d'observation de §YFaust§! indique que les primitifs de la planète ont enfin conçu un moteur SLV fonctionnel. Comme la plupart de leur technologie, il fait un usage extensif des cristaux particuliers et abondants de la planète, les rendant étonnamment bon marché à fabriquer compte tenu de la quantité de cristaux disponibles dans leur système d'origine.\n\nLa planète elle-même a été unifiée principalement grâce à la puissance économique de §YKiria§!, une nation qui, suite à une industrialisation rapide et une transition vers un régime fortement capitaliste, a rapidement dominé l'économie de la planète et a fini par devenir sa seule superpuissance grâce à la prise de contrôle économique de nombreuses autres nations.\n\nComme nous possédons la base stellaire du système, nous avons reçu une transmission de leur Directeur, qui souhaite probablement nous acheter le système."

  giga_eawaf.70144.name:0 "Le §YFaust révolutionnaire§! atteint le SLV"
  giga_eawaf.70144.desc:0 "Notre Poste d'observation de §YFaust§! indique que les primitifs de la planète ont enfin conçu un moteur SLV fonctionnel. Comme la plupart de leur technologie, il fait un usage extensif des cristaux particuliers et abondants de la planète, les rendant étonnamment bon marché à fabriquer compte tenu de la quantité de cristaux disponibles dans leur système d'origine.\n\nLa planète elle-même a été unie sous la gouvernance d'une nation originaire de l'île d'§YHippogriffia§!, qui, suite à une prise de pouvoir communiste, a commencé une campagne d'expansion rapide culminant en une grande croisade contre tous les régimes autoritaires du monde.\n\nGrâce à une utilisation extensive de l'énergie nucléaire et de politiques hautement matérialistes, la nation naissante a réussi à sortir victorieuse et à unir la majeure partie de Faust sous son règne, la dernière nation restante s'étant relativement facilement soumise par la suite.\n\nSuite à d'immenses investissements dans le voyage spatial et au développement rapide d'un moteur SLV, le monde nouvellement uni a pris les étoiles d'assaut et nous envoie maintenant une transmission enthousiaste afin d'établir des relations diplomatiques."

  giga_eawaf.70145.name:0 "Le §YFléau terrifiant§! atteint le SLV"
  giga_eawaf.70145.desc:0 "Notre Poste d'observation de §YFaust§! indique que les primitifs de la planète ont enfin conçu un moteur SLV fonctionnel. Comme la plupart de leur technologie, il fait un usage extensif des cristaux particuliers et abondants de la planète, les rendant étonnamment bon marché à fabriquer compte tenu de la quantité de cristaux disponibles dans leur système d'origine.\n\nLa planète elle-même a été unifiée sous une sorte d'« esprit de ruche » horrifiant composé de formes de vie réanimées, qui a mené une grande « Croisade sombre » contre les créatures vivantes et l'écosystème de Faust.\n\nBien qu'initialement incertain, le nombre même de l'esprit de ruche et sa capacité à ressusciter les morts de lui-même et de ses ennemis lui ont permis de triompher à la fin et de subsumer l'ensemble de Faust en lui-même.\n\nDe façon alarmante, cet esprit de ruche, connu sous le nom de « Fléau terrifiant », semble complètement réfractaire à toute forme de diplomatie et a lancé un assaut tous azimuts sur notre Base stellaire en utilisant des vaisseaux SLV improvisés. Nous devons agir rapidement et étouffer cette menace dans l'œuf avant qu'elle ne consume toute la galaxie !"

  giga_eawaf.70146.name:0 "Le §YDirectoire faustien§! atteint le SLV"
  giga_eawaf.70146.desc:0 "Notre Poste d'observation de §YFaust§! indique que les primitifs de la planète ont enfin conçu un moteur SLV fonctionnel. Comme la plupart de leur technologie, il fait un usage extensif des cristaux particuliers et abondants de la planète, les rendant étonnamment bon marché à fabriquer compte tenu de la quantité de cristaux disponibles dans leur système d'origine.\n\nLe monde a été complètement unifié sous une sorte de divinité mécanique répondant au nom de §YLeopold Schmeller§!, qui était apparemment autrefois un Griffon ordinaire ayant subi d'importantes améliorations cybernétiques et une ascension finale dans un corps mécanique gargantuesque.\n\nIl a depuis mené une croisade gigantesque contre le reste du monde, déchaînant d'immenses armées d'automates avancés pour subsumer toute opposition et intégrer les populations organiques de Faust dans sa conscience machine toujours croissante.\n\nComme nous possédons la base stellaire du système, Leopold nous a contactés afin de négocier l'achat de Faust."

  giga_eawaf.70147.name:0 "L'§YImperium Katzenartig§! atteint le SLV"
  giga_eawaf.70147.desc:0 "Notre Poste d'observation de §YFaust§! indique que les primitifs de la planète ont enfin conçu un moteur SLV fonctionnel. Comme la plupart de leur technologie, il fait un usage extensif des cristaux particuliers et abondants de la planète, les rendant étonnamment bon marché à fabriquer compte tenu de la quantité de cristaux disponibles dans leur système d'origine.\n\nLe monde a été complètement unifié sous la direction du particulier §YKaiser Kattail§!, qui est apparu dans la nation faustienne d'§YAbyssinie§! et, malgré l'état déplorable de la nation, a réussi à accomplir une série de conquêtes stupéfiantes culminant en une guerre totale avec l'ensemble de Faust.\n\nContre toute attente, Kattail a réussi à sortir victorieux et a assuré son emprise sur toute la planète, commençant même une sorte de projet de méga-ingénierie sur la lune de la planète, Séléné.\n\nComme nous possédons la base stellaire du système, il nous a contactés afin de négocier l'achat du système."


  giga_eawaf.7011.a:0 "À l'écran."

  giga_eawaf.7015.name:0 "Le/La [giga_eawaf_country.GetName]"
  giga_eawaf.7015.desc.eawun:0 "Salutations, voyageurs des étoiles. La Grande Convocation faustienne a enfin acquis la technologie nécessaire pour naviguer à travers les étoiles.\n\nCependant, nous avons remarqué que votre espèce a revendiqué notre système stellaire. En tant que tel, notre grand conseil a décidé d'offrir à votre civilisation une compensation financière de §Y7500§! £energy£ provenant de nos plus grands réacteurs cristallins en échange de la propriété totale du système §Y[giga_eawaf_system.GetName]§!."

  giga_eawaf.7015.desc.eawgriffon:0 "Salutations, êtres extrafaustiens. L'Empire griffonien a enfin dompté les lois de la physique elles-mêmes, nous permettant de traverser les vastes vides entre les étoiles.\n\nCependant, nous avons remarqué que votre espèce a revendiqué notre système stellaire. En tant que tel, moi, Kaiser §YGrover XI§!, souhaiterais que votre espèce transfère le système sous notre contrôle, car nous l'avons habité bien plus longtemps que vous.\n\nC'est seulement juste."

  giga_eawaf.7015.desc.eawcommunist:0 "Salutations, voyageurs des étoiles. Les esprits les plus brillants de la République socialiste faustienne ont conçu un grand appareil capable d'atteindre d'autres étoiles.\n\nCependant, nous avons remarqué que votre espèce a revendiqué notre système stellaire. En tant que tel, notre conseil suprême a décidé d'accorder à votre civilisation une compensation financière de §Y5000§! £energy£ et §Y2500§! de nos meilleurs £consumer_goods£ en échange de la propriété totale du système §Y[giga_eawaf_system.GetName]§!.\n\nNous espérons que vous ne nous décevrez pas."

  giga_eawaf.7015.desc.riverun:0 "Salutations, voyageurs des étoiles. La Fédération faustienne a enfin acquis la technologie nécessaire pour naviguer à travers les étoiles.\n\nCependant, nous avons remarqué que votre espèce a revendiqué notre système stellaire. En tant que tel, nous avons décidé d'offrir à votre civilisation une compensation financière de §Y7500§! £energy£ provenant de nos plus grands réacteurs cristallins en échange de la propriété totale du système §Y[giga_eawaf_system.GetName]§!."

  giga_eawaf.7015.desc.jerwng:0 "Salutations, êtres extrafaustiens. Grâce aux efforts combinés de Wingbardy et d'Aquileia, notre espèce a enfin dompté les lois de la physique elles-mêmes, nous permettant de traverser les vastes vides entre les étoiles.\n\nCependant, nous avons remarqué que votre espèce a revendiqué notre système stellaire. En tant que tel, moi, Impératrice §YAlessandra Discret§!, souhaiterais que votre espèce transfère le système sous notre contrôle, car nous l'avons habité bien plus longtemps que vous.\n\nC'est seulement juste."

  giga_eawaf.7015.desc.kiria:0 "Salutations, partenaires commerciaux extrafaustiens ! Étant donné que nous avons déverrouillé les secrets du voyage SLV tout comme vous, nous aimerions vous proposer un marché ! Que dites-vous de §Y7500§! £energy£ provenant de nos plus grands réacteurs cristallins en échange de la propriété totale du système §Y[giga_eawaf_system.GetName]§! ? Considérez les opportunités économiques !"

  giga_eawaf.7015.desc.posada:0 "Enfin, oh comme nous avons attendu ce moment ! Peuple des étoiles ! Les esprits les plus brillants de notre monde ont conçu un grand appareil capable d'atteindre d'autres étoiles.\n\nCependant, il semble que vous, Peuple des étoiles, avez revendiqué notre système stellaire. En tant que tel, nous aimerions vous demander gentiment de nous accorder le système, en échange d'une compensation financière de §Y5000§! £energy£ et §Y2500§! de nos meilleurs £consumer_goods£ !\n\nPuissions-nous forger un partenariat fructueux !"

  giga_eawaf.7015.desc.kaiser:0 "Salutations, extraterrestre. L'Imperium Katzenartig a maintenant déverrouillé le SLV et est sur le point de se lancer dans la plus grande aventure de son histoire. En tant que tel, je demande que vous transfériez le contrôle de la base stellaire du système Faust à nous. Une compensation financière de §Y7500§! £energy£ peut être fournie, mais nous n'avons pas peur de nous battre si vous refusez."

  giga_eawaf.7015.desc.dread:0 "Il n'y aura pas de repos jusqu'à la mort de la Mort elle-même."
  giga_flavor_systems.7005.dread:0 "Aux postes de combat !"

  giga_eawaf.7015.desc.leopold:0 "<<SALUTATIONS, VOYAGEURS DES ÉTOILES>>\n\n<<OFFRE DE COMPENSATION POUR LA PROPRIÉTÉ DU SYSTÈME FAUST>>\n\n<<PROPOSITION : §Y7500§! £energy£>>\n\n<<REFUSEZ ET AFFRONTEZ NOTRE PUISSANCE>>"
  giga_eawaf.7015.a:0 "Vous pouvez avoir le système."
  giga_eawaf.7015.a.response:0 "Le/La [giga_eawaf_country.GetName] vous remercie pour votre coopération."
  giga_eawaf.7015.a.tooltip:0 "Nous transférerons l'intégralité du système §Y[giga_eawaf_system.GetName]§! au/à la §Y[giga_eawaf_country.GetName]§!, y compris toutes les autres colonies que nous pourrions avoir dans le système."

  opinion_eaw_gave_system:0 "A donné le système d'origine"
  opinion_eaw_gave_system_neighbors:0 "A donné le système d'origine et ses voisins"

  giga_eawaf.7015.b:0 "Vous pouvez avoir le système et ses voisins immédiats également."
  giga_eawaf.7015.b.tooltip:0 "Nous transférerons l'intégralité du système §Y[giga_eawaf_system.GetName]§! ainsi que les §Ysystèmes voisins§! au/à la §Y[giga_eawaf_country.GetName]§!, y compris toutes les autres colonies que nous pourrions avoir dans ces systèmes.\n\nLe/La [giga_eawaf_country.GetName] sera sûrement reconnaissant(e)."
  giga_eawaf.7015.b.response:0 "Vraiment délicieux ! Le/La [giga_eawaf_country.GetName] sera reconnaissant(e)."

  giga_flavor_systems.7005.c:0 "Hors de question."
  giga_flavor_systems.7005.c.tooltip:0 "Nous refuserons de leur donner le système. Ils pourraient exercer des représailles contre nous."
  giga_flavor_systems.7005.c.response:0 "Sachez que nous n'avons pas peur du conflit, [ROOT.GetName]."

  giga_eaw_faust_planet_modifier:0 "Monde imprégné de cristaux"
  giga_eaw_faust_planet_modifier_desc:0 "Ce monde présente des gisements inhabituellement abondants de cristaux ésotériques étroitement liés aux cristaux rares. S'ils sont correctement exploités, ces cristaux peuvent libérer des quantités stupéfiantes d'énergie."

  eaw_planet_buffs:0 "Thaumomancie"

  mod_planet_miners_rare_crystals_produces_add:0 "Cristaux rares des mineurs"

  giga_tech_thaumaturgic_weaponry:0 "Armement cristallin semi-thaumaturgique"
  giga_tech_thaumaturgic_weaponry_desc:0 "Les habitants de Faust ont conçu des fusils et des armes imprégnés de cristaux puissants qui surpassent de loin l'armement conventionnel. Bien que cela ait pu sembler être de la magie pour eux, ce qui a considérablement limité la propagation de la technologie, une étude approfondie de la nature de ces cristaux pourrait simplement nous permettre de standardiser leur utilisation au sein de nos forces armées. Cela entraînerait cependant un coût d'entretien significatif en cristaux rares."

  giga_eaw_crystal_army:0 "Armée imprégnée de cristaux"
  giga_eaw_crystal_army_desc:0 "Bien que légèrement plus fragile et moins fiable que les armes à feu ordinaires, l'armement à base de cristaux est décidément plus puissant. Ces soldats tirent pleinement parti du potentiel offert par ces armes thaumaturgiques."

  giga_eaw_crystal_army_drone:0 "Automates imprégnés de cristaux"
  giga_eaw_crystal_army_drone_desc:0 "Bien que légèrement plus fragile et moins fiable que les armes à feu ordinaires, l'armement à base de cristaux est décidément plus puissant. Ces drones automatisés tirent pleinement parti du potentiel offert par ces armes thaumaturgiques."

  giga_eawaf.7100.name:0 "Faust subjugué"
  giga_eawaf.7100.desc:0 "Nos armées ont réussi à subjuguer avec succès la grande majorité des forces armées de §YFaust§! et bien que quelques résistants continuent de résister à nos soldats dans les régions les plus isolées de Faust, nous avons maintenant sécurisé le contrôle de tous les principaux centres de population de la planète.\n\nCependant, Faust possède un éventail inhabituellement diversifié de nations et de cultures avec au moins 2 espèces majeures différentes partageant la planète et des dizaines de sous-espèces chacune avec leurs propres idéologies et croyances.\n\nEn fait, cela rend étonnamment difficile de maintenir la population nouvellement conquise sous contrôle et, combiné au fait que certaines des espèces susmentionnées possèdent apparemment des capacités semblables à la psionique, signifie que des mouvements de résistance majeurs s'organisent déjà à travers la planète.\n\nIl ne fait aucun doute que nous finirons par subjuguer complètement les Faustiens primitifs, mais pour le moment, nous devons nous attendre à une résistance extrêmement dure à notre domination sur la planète alors que les habitants de Faust comprennent la réalité inévitable de leur nouveau statut de membres de notre civilisation."
  giga_eawaf.7100.a:0 "Ils seront traités en temps voulu."

  giga_eaw_faust_harsh_resistance:0 "Résistance acharnée"
  giga_eaw_faust_harsh_resistance_desc:0 "Les indigènes de ce monde résistent à notre domination, mais ils ne pourront pas le faire éternellement."

  giga_eawaf.7101.name:0 "Armement cristallin"
  giga_eawaf.7101.desc:0 "En étudiant la population conquise de §YFaust§! et leurs technologies, nos soldats ont remarqué que malgré leur classification comme civilisation primitive, les Faustiens employaient un armement étonnamment puissant pour leur niveau de développement technologique.\n\nUne investigation plus approfondie a révélé que la plupart de l'armement des Faustiens tourne autour de l'utilisation d'un type exotique de §YCristal rare§! intégré dans leurs technologies, capable de stocker et de libérer d'énormes quantités d'énergie. Ces cristaux agissaient effectivement comme des « batteries cristallines » fournissant à leurs armes un flux d'énergie quasi infini.\n\nIls sont apparemment étroitement liés aux cristaux rares que nous connaissons et ont probablement été déposés sur Faust par des siècles d'impacts de météores provenant de la ceinture d'astéroïdes cristalline voisine, peut-être tordus dans cette forme plus exotique par une perturbation locale de l'espace-temps.\n\nQuoi qu'il en soit, nos scientifiques sont impatients d'étudier ces cristaux particuliers et ont déjà présenté plusieurs propositions pour les intégrer dans notre propre armement afin de renforcer encore plus la force de nos forces armées.\n\nUn scientifique a soulevé le fait que, si une telle civilisation devait complètement embrasser le vrai potentiel de l'armement thaumaturgique, elle serait sans doute l'une des forces les plus menaçantes de toute la galaxie. Heureusement, les habitants de Faust utilisaient les cristaux plus comme des améliorations à leurs technologies « ordinaires » plutôt que de s'appuyer entièrement sur eux. Mais pour notre propre bien, nous devons espérer qu'aucune civilisation ne découvre jamais le vrai potentiel de ces technologies ésotériques et pratiquement « magiques »..."
  giga_eawaf.7101.a:0 "Intrigant."

  giga_eawaf.7016.name:0 "Le/La [giga_eawaf_country.GetName] s'empare de la base stellaire de [giga_eawaf_system.GetName] !"
  giga_eawaf.7016.desc:0 "Dans un mépris flagrant de notre rejet de leur demande, le/la §Y[giga_eawaf_country.GetName]§! a mené une opération pour commander et saisir notre base stellaire dans le système §Y[giga_eawaf_system.GetName]§!.\n\nBien qu'ils aient réussi à capturer la base stellaire elle-même, nous estimons qu'il ne devrait pas être trop difficile de détruire leurs flottes et de reprendre le système ainsi que leur planète, mais notre haut commandement avertit que leurs forces terrestres sont inhabituellement puissantes pour une civilisation si jeune."
  giga_eawaf.7016.a:0 "Comment osent-ils ? Écrasez-les immédiatement !"
  giga_eawaf.7016.a.tooltip:0 "Nous §RDÉCLARERONS LA GUERRE§! au/à la §Y[giga_eawaf_country.GetName]§! et devrons nous emparer de §YFaust§! pour mettre fin à la guerre."
  giga_eawaf.7016.b:0 "Ils peuvent avoir le système, il ne vaut rien pour nous de toute façon."
  giga_eawaf.7016.b.tooltip:0 "Le système §Y[giga_eawaf_system.GetName]§! et toutes ses planètes sont transférés au/à la §Y[giga_eawaf_country.GetName]§!."

  giga_eawaf.7103.name:0 "Les Alicornes se mobilisent contre l'invasion !"
  giga_eawaf.7103.desc:0 "Notre invasion de §YFaust§! n'est certainement pas passée inaperçue par les protectrices les plus éminentes de la planète, car en effet, les cieux mêmes de §YFaust§! tremblent alors que les deux divinités célestes jumelles de la planète connues sous le nom de §YPrincesse Célestia§! et §YPrincesse Luna§! se mobilisent maintenant contre nous dans une tentative de sauver leur monde de la subjugation extraterrestre.\n\nNous devons nous attendre au pire, car étant donné que la magie puissante de ces entités est supposément assez puissante pour permettre aux Hélios et Séléné défiant les lois de la physique d'orbiter autour de Faust, elles sont presque certainement capables de dévaster nos forces armées.\n\nDéjà, nos commandants rapportent que des divisions entières sont anéanties par de puissants rayons de plasma magique surchauffé manifestés par Célestia, tandis que toutes les opérations logistiques du côté nuit de la planète se trouvent entravées par une obscurité apparemment dévorante vraisemblablement lancée par Luna elle-même, rendant nos soldats impuissants dans la nuit noire.\n\nIl est évident que subjuguer Faust va nécessiter un investissement immense de notre part, bien que si nous ne souhaitons pas faire face à ces ennemis surnaturels, nous pourrions aussi simplement nous retirer de tout ce bourbier, cependant les dommages causés à la société de Faust seront indéniablement permanents."
  giga_eawaf.7103.a:0 "Nous ne nous rendrons jamais à des chevaux parlants !"
  giga_eawaf.7103.a.tooltip:0 "§YCélestia§! et §YLuna§! se mobiliseront contre nous !"
  giga_eawaf.7103.b:0 "Ce fichu caillou ne vaut pas les ennuis."
  giga_eawaf.7103.b.tooltip:0 "Nous nous retirerons de Faust. Cependant, la mobilisation de §YCélestia§! et §YLuna§! ainsi que de Faust dans son ensemble, couplée à la certitude que la vie extraterrestre existe, aura presque certainement de §Rgrandes conséquences§! sur le développement de la planète."

  giga_eawaf.10151.name:0 "Établissement de la base stellaire de Faust"
  giga_eawaf.10151.desc:0 "Étant donné les propriétés particulières du système §YFaust§!, notre équipage d'exploration a suggéré que nous établissions de toute urgence un §YAvant-poste§! dans le système afin de nous assurer de pouvoir continuer à investiguer ses mystères."
  giga_eawaf.10151.a:0 "Une entreprise qui en vaut la peine !"
  giga_eawaf.10151.b:0 "Nous avons de meilleures choses sur lesquelles nous concentrer."

  # Relics
  r_eawaf_sirens_crystal:0 "Cristaux abyssaux"
  r_eawaf_sirens_crystal_desc:0 "Appartenant à l'origine aux Sirènes et forgés par des moyens inconnus, ces cristaux rouges fascinants possèdent une magie extrêmement puissante capable d'influencer les pensées de presque n'importe quelle créature sapiente. Bien qu'il soit inconcevable que nous puissions les utiliser à leur plein potentiel comme les Sirènes l'ont fait autrefois, ils peuvent néanmoins être utiles lorsqu'il s'agit d'individus ou d'entités politiques particulièrement problématiques."

  r_eawaf_eqg_portal:0 "Miroir de cristal"
  r_eawaf_eqg_portal_desc:0 "Un mystérieux appareil semblable à un portail connecté à une charmante dimension alternative peuplée d'humanoïdes primitifs et étrangement colorés fréquentant une sorte d'établissement d'enseignement. Bien que la dimension elle-même nous soit de peu d'utilité, les propriétés ésotériques du portail fournissent une incursion fascinante dans la nature sous-jacente de notre univers et de ses royaumes constitutifs. De plus, ses habitants produisent occasionnellement des pièces musicales intéressantes d'intérêt culturel."
  giga_eawaf_portal_relic_tooltip:0 "\nExtrait un ensemble envoûtant de performances musicales harmonieuses sur les mérites de l'amitié de la dimension alternative, renforçant l'unité de notre nation.\n§L'Saute, fais du bruit ! Tape du sabot, fais un tour !'§!"

  giga_eawaf_eqg_portal_modifier:0 "Comédies musicales harmonieuses"
  giga_eawaf_eqg_portal_modifier_desc:0 "Les pièces musicales extraites de la dimension miroir fournissent à nos artistes beaucoup de matériel."
  job_entertainer_plural_with_icon:0 "Artistes"

  giga_eawaf_crystal_relic_tooltip:0 "Lance un sort de §Rhaine§! et de §Rdiscorde§! sur toutes les factions et empires avec lesquels nous sommes actuellement hostiles, réduisant les capacités des vaisseaux et augmentant les troubles planétaires."

  giga_eawaf_crystal_relic_modifier:0 "Sort de discorde"
  giga_eawaf_crystal_relic_modifier_desc:0 "Un sort de discorde est lancé sur nous."

  giga_eawaf.60252.name:0 "Sort de discorde entrant !"
  giga_eawaf.60252.desc:0 "Le/La §Y[giga_eawaf_strife_spell_caster.GetName]§! a utilisé les §YCristaux abyssaux§! pour lancer un sort de discorde sur notre civilisation, réduisant la cohésion de notre peuple !"
  giga_eawaf.60252.a:0 "Malédiction !"

  giga_eawaf.60253.name:0 "Sort de discorde lancé !"
  giga_eawaf.60253.desc:0 "Grâce à des impulsions d'énergie ciblées, les §YCristaux abyssaux§! ont déchargé leurs énergies à travers la galaxie, obscurcissant les esprits de ceux qui nous veulent du mal."
  giga_eawaf.60253.a:0 "Excellent. Qu'ils souffrent."

  GIGA_EAWAF_EQG_PORTAL:0 "Libérer les Faustiens"
  GIGA_EAWAF_EQG_PORTAL_DESC:0 "Il est primordial que nous trouvions un moyen de débarrasser Faust de l'emprise des Sirènes de peur que toute sa population ne meure d'une mort inutile."

  GIGA_EAWAF_SIRENS_COUNTRY:0 "Envoûteuses harmoniques"
