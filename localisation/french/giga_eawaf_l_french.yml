l_french:

  # ARMIES
  eawaf_army:99 "Armée Thaumaturgique"
  eawaf_army_celestia:99 "Alicorne"
  eawaf_army_luna:99 "Alicorne"

  eawaf_sirens_army:99 "Armée Abyssale"

  # EVENTS

  # Point the player towards Faust
  giga_eawaf.1001.name:99 "L'Étoile Clignotante"
  giga_eawaf.1001.desc:99 "Depuis que notre espèce a commencé à cartographier les étoiles — d'abord à l'aide de télescopes optiques primitifs, puis via des satellites orbitaux, et maintenant grâce à des émetteurs tachyoniques — certains systèmes se sont toujours comportés de manière inattendue.\n\nLes causes de confusion les plus fréquentes parmi nos astronomes étaient généralement des variations de luminosité stellaire et des transits exoplanétaires irréguliers, mais à mesure que notre compréhension de la physique s'est développée, ces mystères ont pu être correctement évalués, analysés et résolus. La plupart du temps, il ne s'agissait que de simples erreurs de mesure de nos télescopes primitifs, et dans les autres cas, l'étude de ces phénomènes nous a permis d'approfondir notre compréhension des exoplanètes et du comportement stellaire.\n\nPourtant, malgré l'amélioration continue de nos télescopes et notre compréhension toujours croissante du cosmos, un système en particulier continue de défier absolument tous les modèles d'astrophysique — l'étoile mystérieuse baptisée §YFaust§!. Bien qu'elle puisse à première vue ressembler à une étoile ordinaire — quoique peu lumineuse —, quiconque passe plus de quelques heures à observer le système remarquera que l'étoile semble simplement... disparaître, avant de réapparaître environ douze heures plus tard, puis de disparaître à nouveau douze heures après.\n\nSurnommée « l'Étoile Clignotante » par nos astronomes, aucune théorie n'a réussi à expliquer la disparition régulière de l'étoile et il est devenu évident que le seul moyen de percer ce mystère serait de s'y rendre nous-mêmes. Heureusement, avec la récente découverte du voyage supraluminique, une telle investigation directe est enfin dans le domaine du possible, et la perspective de résoudre enfin ce mystère fait déjà bruisser d'excitation toute notre communauté scientifique."
  giga_eawaf.1001.a:99 "Mettons-nous au travail."
  giga_eawaf.1001.a.tooltip:99 "§BCe système et tout ce qui s'y rapporte font partie de la collaboration du §YPoisson d'Avril 2024§! avec le mod §YEquestria at War§! pour HOI4 ! Si, pour une raison quelconque, vous ne souhaitez pas participer à cette chaîne d'événements, le système peut être désactivé via le Gigamenu, mais je vous recommande d'essayer !§!"

  giga_eawaf_faust_chain_title:99 "Mystères de Faust"
  giga_eawaf_faust_chain_desc:99 "Le système Faust défie toute logique. Il est impératif que nous l'investiguions davantage !"

  giga_eawaf_sirens_chain_title:99 "Sirenalia"
  giga_eawaf_sirens_chain_desc:99 "Les Sirènes sont déterminées à envoûter la galaxie entière. Elles doivent être arrêtées !"

  giga_eawaf_faust_name:99 "L'Étoile Clignotante"
  giga_eawaf_faust_desc:99 "Le système Faust « clignote » — alternant entre visible et invisible à intervalles d'environ douze heures. Il est évident que le seul moyen d'élucider ce mystère sera simplement de nous y rendre nous-mêmes."

  giga_eawaf_poi_sirens_stats_name:99 "Traque des Sirènes"
  giga_eawaf_poi_sirens_stats_desc:99 "§RDiscorde Totale§! - [giga_eawaf_country.giga_eawaf_total_strife]\nLes Sirènes se nourrissent et prospèrent grâce à la §RDiscorde§! — la « manifestation » de la haine et du mépris. Toutes les planètes situées dans le §PChamp Extérieur§! génèrent de la §RDiscorde§! en fonction de la §YPopulation§!, de la §YCriminalité§! et de la §YStabilité§!, ces deux dernières étant affaiblies par le §PChamp Extérieur§!.\n\n§MNiveau de Portée du Champ de Discorde§! - [giga_eawaf_country.giga_eawaf_outer_strife_field_range_level]\n§RPortée du Champ de Discorde Intérieur§! - [giga_eawaf_country.giga_eawaf_inner_strife_field_range]\n§PPortée du Champ de Discorde Extérieur§! - [giga_eawaf_country.giga_eawaf_outer_strife_field_range]\n§YSeuil de Discorde avant expansion du Champ§! - [giga_eawaf_country.giga_eawaf_strife_field_range_next_level_cost]\n§YSeuil de Discorde avant rétraction du Champ§! - [giga_eawaf_country.giga_eawaf_strife_field_range_prev_level_cost]\nPlus les Sirènes ont de §RDiscorde§!, plus leur sortilège s'étendra loin. Le champ se rétractera cependant si les Sirènes ne reçoivent pas assez de §RDiscorde§! pour le maintenir. Il ne peut changer de taille qu'une fois tous les §Y2,5 ans§!.\n\n\n§MPuissance du Champ de Discorde§! - [giga_eawaf_country.giga_eawaf_field_potency_multiplier]\nPlus la Puissance du champ est élevée, plus les malus qu'il inflige aux vaisseaux et aux planètes seront puissants.\n\n§YMatériel de Guerre Actuel§! - [giga_eawaf_country.giga_eawaf_sirens_warmaterial_count]\n§YNiveau de l'Envoûteur Voilesonique§! - [giga_eawaf_country.giga_eawaf_sirens_megaphone_level] \n§YCoût du Niveau Suivant de l'Envoûteur Voilesonique§! - [giga_eawaf_country.giga_eawaf_sirens_megaphone_next_level_cost]\nCes matériaux représentent les stocks de ressources avancées des Sirènes, générés par leur population sur les mondes capturés. Ils servent à fabriquer des vaisseaux et à améliorer l'§YEnvoûteur Voilesonique§! pour intensifier ses effets, augmentant les malus infligés aux planètes et vaisseaux à portée."

  # Initial survey line
  giga_eawaf.1010.name:99 "Géocentrique"
  giga_eawaf.1010.desc:99 "Le §Y[ROOT.GetName]§! a atteint le système §YFaust§!, dans l'espoir d'apporter la solution au mystérieux phénomène de « l'Étoile Clignotante » qui déconcerte astronomes et scientifiques depuis des siècles.\n\nEt, par un ironique retournement du destin, cette solution ne résidait pas dans nos théories les plus avancées, mais plutôt dans la toute première interprétation erronée de l'espace que notre espèce avait conçue pour expliquer le mouvement des étoiles dans le ciel — le Géocentrisme.\n\nLe système §YFaust§! est, d'une manière ou d'une autre, centré autour de Faust elle-même, un monde tellurique autour duquel orbitent plusieurs planètes plus petites (ou lunes) ainsi que rien de moins qu'un soleil miniature fournissant chaleur et lumière à Faust.\n\nLes mesures des émissions spectrales de l'étoile montrent qu'elle se comporte plus ou moins comme une étoile typique de classe G, bien que son diamètre ne dépasse pas trois mille kilomètres. Avec une taille si réduite, elle devrait logiquement être soit une étoile à neutrons, soit guère plus qu'une géante gazeuse, et pourtant... la voilà, orbitant diligemment autour de Faust en vingt-quatre heures, passant derrière la planète toutes les douze heures et disparaissant de la vue avant de réapparaître de l'autre côté.\n\nBien que le mystère de « l'Étoile Clignotante » soit enfin résolu, il semble qu'il reste encore beaucoup de travail avant que nous ayons la moindre idée de ce qui se passe dans cet étrange système."
  giga_eawaf.1010.a:99 "Comme c'est particulier."

  giga_eawaf.1011.name:99 "Cristaux Thaumaturgiques"
  giga_eawaf.1011.desc:99 "La ceinture d'astéroïdes orbitant autour de Faust est remplie de nombreux affleurements d'étranges cristaux violet-rose, différents de tout ce que nous avons rencontré auparavant.\n\nLes premières expériences indiquent que des échantillons de ces cristaux « stockent » une forme d'énergie éthérée dans leurs matrices moléculaires, qui peut ensuite être « libérée » en impulsant des stimuli spécifiques dans les cristaux, souvent avec des résultats destructeurs.\n\nTout espoir d'utiliser cela dans nos armes et systèmes énergétiques a cependant été anéanti lorsque toutes les tentatives de sortir les cristaux du système Faust ont entraîné la dissipation spontanée de cette charge innée et la fragmentation des cristaux en de nombreux morceaux de roche jolis, mais inutiles.\n\nIl est évident qu'une propriété inhérente au système Faust « alimente » ces cristaux en énergie, mais l'origine réelle de cette énergie échappe jusqu'ici complètement à nos scientifiques."
  giga_eawaf.1011.a:99 "Curieux."

  giga_eawaf.1012.name:99 "Satellite Cauchemardesque"
  giga_eawaf.1012.desc:99 "§YSéléné§!, la lune rocheuse orbitant autour de Faust à l'opposé du mystérieux §YHélios§!, semble, à première vue, être la partie la plus normale du système Faust. C'est une lune rocheuse relativement grande, criblée de nombreux cratères d'impact en raison de son absence d'atmosphère et recouverte d'une fine couche de poussière lunaire, comme beaucoup d'autres satellites naturels.\n\nLes premiers signes d'anormalité sont ironiquement apparus lorsque l'équipage du §Y[ROOT.GetName]§! a commencé à se reposer. Dès qu'ils se sont approchés de la lune, les rêves habituellement agréables de l'équipage ont commencé à se transformer en atroces cauchemars, la plupart rapportant avoir été visités dans leur sommeil par une silhouette équine sombre et imposante, porteuse de promesses de vengeance et de ténèbres éternelles engloutissant des mondes entiers.\n\nBien que ces cauchemars aient cessé dès que le vaisseau s'est éloigné de la lune, beaucoup croient maintenant que le corps céleste est « hanté » par un esprit vengeur inconnu, et [Owner.GetScientist] §Y[ROOT.GetLeaderName]§! semble avoir été profondément marqué par ces terreurs nocturnes..."
  giga_eawaf.1012.a:99 "C'est dans leur tête... n'est-ce pas ?"
  giga_eawaf.1012.desc_machine_intelligence:99 "§YSéléné§!, la lune rocheuse orbitant autour de Faust à l'opposé du mystérieux §YHélios§!, semble, à première vue, être la partie la plus normale du système Faust. C'est une lune rocheuse relativement grande, criblée de nombreux cratères d'impact en raison de son absence d'atmosphère et recouverte d'une fine couche de poussière lunière, comme beaucoup d'autres satellites naturels.\n\nLes premiers signes d'anormalité sont ironiquement apparus lorsque l'équipage du §Y[ROOT.GetName]§! s'est approché de la lune. Ils ont commencé à se comporter de façon erratique et ont signalé des artefacts visuels apparaissant sous la forme d'une silhouette équine sombre et imposante.\n\nBien que ces erreurs visuelles aient cessé dès que le vaisseau s'est éloigné de la lune, on pense que le corps céleste pourrait être « hanté » par un esprit vengeur inconnu."
  giga_eawaf.1012.desc_hive_mind:99 "§YSéléné§!, la lune rocheuse orbitant autour de Faust à l'opposé du mystérieux §YHélios§!, semble, à première vue, être la partie la plus normale du système Faust. C'est une lune rocheuse relativement grande, criblée de nombreux cratères d'impact en raison de son absence d'atmosphère et recouverte d'une fine couche de poussière lunaire, comme beaucoup d'autres satellites naturels.\n\nLes premiers signes d'anormalité sont ironiquement apparus lorsque l'équipage du §Y[ROOT.GetName]§! s'est approché de la lune. Ils ont commencé à se comporter de façon erratique et ont signalé des hallucinations apparaissant sous la forme d'une silhouette équine sombre et imposante.\n\nBien que ces visions aient cessé dès que le vaisseau s'est éloigné de la lune, on pense que le corps céleste pourrait être « hanté » par un esprit vengeur inconnu."
  giga_eawaf.1012.b:99 "Déconcertant."

  giga_eawaf.1013.name:99 "Soleil Improbable"
  giga_eawaf.1013.desc:99 "On espérait qu'une inspection plus approfondie d'§YHélios§! pourrait éclairer ce mystérieux corps céleste, et pourtant il continue de se comporter de manières apparemment impossibles.\n\nTout d'abord, les périodes orbitales d'Hélios et de Séléné de vingt-quatre heures sont bien plus courtes qu'elles ne devraient l'être, les calculs basés sur la masse de Faust estimant qu'elles devraient logiquement prendre environ deux semaines pour orbiter autour de la planète.\n\nDe plus, bien que leurs orbites restent circulaires et prévisibles, les deux corps sont sujets à des « saccades » quasi imperceptibles à des points apparemment aléatoires de leurs orbites, comme s'ils étaient soudainement « tirés » par une force inexpliquée.\n\nÉvidemment, s'attendre à ce que les orbites fonctionnent normalement dans un système où les étoiles tournent autour des planètes est déjà assez déraisonnable, mais ces divergences ne font qu'ajouter à la pile toujours croissante de mystères non résolus entourant Faust.\n\nDe plus, l'étoile semble puiser de l'énergie de nulle part, car elle émet bien plus de rayonnement que n'importe quel processus de fusion connu ne pourrait jamais générer, violant dans certains cas le principe fondamental d'équivalence masse-énergie."
  giga_eawaf.1013.a:99 "Mais comment ça FONCTIONNE ?"

  giga_eawaf.1014.name:99 "Équidés en Guerre"
  giga_eawaf.1014.desc:99 "Comme si le système n'était pas déjà assez étrange, non seulement son monde central de §YFaust§! est parfaitement habitable grâce à la lumière d'Hélios, mais une multitude d'émissions radio émanant de sa surface trahit le fait que le monde est, en fait, habité !\n\nLa planète est partagée par environ une douzaine d'espèces, toutes pleinement sapientes et capables de pensée complexe, qui ont atteint un niveau de développement technologique à peu près équivalent à l'ère industrielle. Cependant, nombre de ces espèces, notamment les plus équines, manifestent une variété de capacités surnaturelles, telles qu'une agriculture ridiculement efficace, le vol ou la télékinésie, pour n'en citer que quelques-unes.\n\nD'importants gisements des cristaux thaumaturgiques trouvés dans la ceinture d'astéroïdes du système ont également été localisés sur toute la surface du monde, certaines espèces indigènes les utilisant de manière significative pour renforcer et catalyser leurs capacités naturelles. Cela a conduit nos scientifiques à croire que les cristaux et ces capacités sont liés d'une certaine manière.\n\nFait intéressant, nous arrivons peut-être juste à temps pour assister à un tournant dans l'histoire de la planète, car plusieurs espèces atteignent le point où les développements des méthodes expérimentales devraient leur permettre d'accroître considérablement leur propre compréhension de leurs capacités et des cristaux. Cela aura probablement des conséquences considérables et pourrait modifier drastiquement leur développement technologique.\n\nLe §Y[ROOT.GetName]§! rapporte qu'une petite équipe a été déployée à la surface afin, espérons-le, d'obtenir plus d'informations sur le fonctionnement de cette civilisation multiespèces particulière avant l'établissement d'un poste d'observation plus permanent."
  giga_eawaf.1014.a:99 "Maintenant, espérons qu'ils ne se fassent pas exploser."

  giga_eawaf.10141.name:99 "Rapport d'Investigation de Faust"
  giga_eawaf.10141.desc:99 "Notre expédition à la surface de §YFaust§! s'est déroulée sans incident majeur, tout en rapportant des quantités considérables de données concernant la civilisation indigène de la planète, ou plutôt les civilisations.\n\nLes terres émergées de la planète sont divisées en trois grandes masses continentales, les deux plus petites au nord étant nommées §YEquus§! et §YGriffonia§!, tandis que la plus grande, connue sous le nom de §YZébrica§!, est située presque entièrement dans l'hémisphère sud. Ces continents sont incroyablement diversifiés, chacun abritant plusieurs espèces sapientes distinctes.\n\nBien que les espèces indigènes aillent des humanoïdes bipèdes connus sous le nom de §YYétis§! aux ursidés quadrupèdes connus simplement sous le nom d'§YOurs§! et aux aviens connus sous le nom de §YGriffons§!, une partie significative de ces espèces ressemble à des créatures équines et a donc été nommée §YÉquidéens§!.\n\nC'est cependant un terme générique englobant plusieurs espèces, comme les §YPoneys§! particulièrement petits mais thaumaturgiquement doués (qui, avec les Griffons, sont de loin l'espèce la plus nombreuse, présente sur les trois continents), les §YZèbres§! adaptés aux climats désertiques, les §YChevaux§! plus grands, et les plus exotiques §YKirins§! originaires de l'extrême est de Zébrica.\n\nCependant, la caractéristique peut-être la plus intéressante mais dangereuse de Faust est l'existence de plusieurs entités quasi divines parcourant la surface de la planète. Connues sous le nom d'§YAlicornes§!, elles sont douées de capacités de déformation de la réalité extrêmement puissantes et semblent agir comme les dirigeantes pratiquement incontestées d'§YEquestria§!, l'État-nation le plus puissant de la planète.\n\nLe consensus parmi les membres de notre expédition est que la puissance considérable de ces Alicornes signifie que toute tentative d'invasion de Faust serait §Rextrêmement déconseillée§!, et qu'il est donc probablement bien plus sûr de simplement observer le monde de loin."
  giga_eawaf.10141.a:99 "Quel monde particulier."
  giga_eawaf.10141.b:99 "C'est FASCINANT ! Nous devons en apprendre davantage !"

  giga_eawaf.1015.name:99 "Le Mystère Faustien"

  giga_eawaf.1015.desc.nopsi:99 "Le système §YFaust§! a maintenant été entièrement exploré par le §Y[ROOT.GetName]§!, et bien que le mystère du « Soleil Clignotant » ait facilement été expliqué par le transit d'Hélios derrière Faust, cette exploration a soulevé plus de questions qu'elle n'en a réellement résolu.\n\nComment fonctionne Hélios ? Quelle est la source des étranges cauchemars survenant à proximité de Séléné ? D'où les cristaux thaumaturgiques tirent-ils leur énergie ? Et, plus important encore, quel phénomène, le cas échéant, sous-tend tout cela ?\n\nBien que de nombreuses théories aient été conçues pour tenter de tout relier, aucune d'entre elles ne parvient véritablement à décrire avec précision les mystères du système Faust sans inévitablement rencontrer des lacunes majeures ailleurs. Il semble que, pour le moment, Faust et ses mystérieux habitants resteront une énigme."
  giga_eawaf.1015.nopsi:99 "Peut-être qu'avec le temps, notre compréhension sera suffisante..."
  giga_eawaf.1015.nopsi.tooltip:99 "Nous pourrions éventuellement obtenir plus d'informations sur Faust si nous recherchons les technologies appropriées."

  giga_eawaf.1015.desc.psi:99 "Le système §YFaust§! a maintenant été entièrement exploré par le §Y[ROOT.GetName]§!, et bien que le mystère du « Soleil Clignotant » ait facilement été expliqué par le transit d'Hélios derrière Faust, cette exploration a soulevé plus de questions qu'elle n'en a réellement résolu.\n\nComment fonctionne Hélios ? Quelle est la source des étranges cauchemars survenant à proximité de Séléné ? D'où les cristaux thaumaturgiques tirent-ils leur énergie ? Et, plus important encore, quel phénomène, le cas échéant, sous-tend tout cela ? Bien que de nombreuses théories aient été conçues pour tenter de tout relier, une théorie en particulier s'est démarquée parmi toutes les autres : la possibilité d'une interférence psionique.\n\nSelon notre compréhension, les psioniques semblent provenir d'une sorte de royaume immatériel au-delà de notre réalité, et bien que les spécificités de ce royaume restent floues, certains ont suggéré que le système Faust pourrait se trouver dans une zone de la réalité où le voile entre notre réalité et ce royaume est plus mince.\n\nLa théorie, qui jusqu'ici montre un grand potentiel pour expliquer tous les mystères de Faust, a rapidement gagné en popularité, au point que notre communauté scientifique pousse maintenant pour une investigation plus approfondie du système afin de déterminer si cette théorie tient réellement la route."
  giga_eawaf.1015.psi:99 "Il n'y a pas de temps à perdre !"

  giga_eawaf.1015.b:99 "Franchement, nous en avons assez vu."
  giga_eawaf.1015.b.tooltip:99 "Nous ne mènerons pas d'autres investigations sur les mystères de Faust."

  GIGA_EAWAF_SURVEY_HELIOS:99 "Investiguer Hélios"
  GIGA_EAWAF_SURVEY_HELIOS_DESC:99 "Il y a des preuves que les étrangetés du système Faust sont causées par une interférence psionique. Nous devrions mener une investigation approfondie de son étoile mystérieuse immédiatement."

  giga_eawaf.1016.name:99 "Eurêka Psionique"
  giga_eawaf.1016.desc:99 "Nos récentes incursions dans les domaines des §YPsioniques§! ont conduit nos scientifiques à réévaluer de nombreuses découvertes et théories antérieures sous un nouvel angle.\n\nParmi celles-ci figure nul autre que le mystérieux système de §YFaust§!, dont les cristaux thaumaturgiques, l'étoile miniature et les créatures apparemment magiques ont résolument résisté à notre compréhension de la physique depuis l'exploration du système.\n\nCependant, grâce à la perspective renouvelée fournie par nos connaissances sur ce qui se trouve au-delà du monde matériel, certains de nos scientifiques ont suggéré que nous revisitions le système Faust afin d'essayer de voir s'il y avait peut-être plus qu'il n'y paraît..."
  giga_eawaf.1016.a:99 "Mettons-nous-y immédiatement !"

  giga_eawaf.1017.name:99 "Fusion Psionique"
  giga_eawaf.1017.desc:99 "Bien que cela ait nécessité un investissement significatif, tant en temps qu'en ressources, nos scientifiques pensent avoir enfin percé les mystères du fonctionnement interne d'Hélios, ainsi que du reste du système Faust.\n\nDes expériences sur la sensibilité psionique des télépathes ont confirmé que l'ensemble du système se trouve dans un espace où le voile entre la réalité et l'immatériel est plus mince, permettant à des phénomènes surnaturels de se produire. Comme les systèmes se déplacent constamment dans l'espace, nos scientifiques ont conclu qu'il devait y avoir une sorte de phénomène causant cet « amincissement » de la réalité, et se sont mis à sonder Hélios lui-même pour trouver des réponses.\n\nGrâce à des sondes protégées thermiquement plongeant dans les profondeurs de cet enfer ésotérique, il a été découvert qu'au coeur d'Hélios se trouve une « faille » miniature dans la réalité elle-même, menant supposément directement à un royaume d'énergie psionique pure. La matière du centre d'Hélios tombe régulièrement dans cette faille avant de réapparaître sous forme d'énergie psionique bouillante et surchauffée. Cette énergie « flotte » ensuite vers les couches externes d'hydrogène d'Hélios et déclenche des réactions de fusion nucléaire.\n\nPar des processus mal compris, l'énergie psionique « usée » se « condense » ensuite en noyaux d'hydrogène, qui sont eux-mêmes enflammés par de l'énergie psionique fraîche. Les noyaux d'hélium fusionnés, en raison de leur masse plus élevée, tombent ensuite dans la faille et le cycle se répète essentiellement indéfiniment, maintenant ainsi l'étoile miniature allumée !\n\nLa découverte et la compréhension de ce processus ésotérique, maintenant baptisé §YFusion Psicatalysée§!, a révolutionné à la fois les psioniques et la science nucléaire. Par conséquent, nombre de nos scientifiques débattent maintenant de la possibilité de reproduire ce processus nous-mêmes afin de générer de l'énergie."
  giga_eawaf.1017.a:99 "Absolument incroyable ! Essayez de voir si le processus peut être reproduit."
  giga_eawaf.1017.a.tooltip:99 "Nous tenterons de déclencher une fusion psicatalysée dans un environnement contrôlé, mais cela pourrait nécessiter une compréhension des psioniques supérieure à celle que nous possédons actuellement. Cela ne coûte rien d'essayer, cependant."
  giga_eawaf.1017.b:99 "Ces découvertes sont excellentes, mais nous sommes allés assez loin."

  GIGA_EAWAF_PSIONIC_FUSION:99 "Reproduire la Fusion Psicatalysée"
  GIGA_EAWAF_PSIONIC_FUSION_DESC:99 "Les mécanismes alimentant les processus de fusion d'Hélios reposent sur un flux complexe de matière tombant directement dans l'immatériel. Reproduire artificiellement ce processus pourrait nous permettre de construire des réacteurs à fusion significativement plus puissants. Nos scientifiques estiment que nous devons d'abord trouver un moyen de §Ypercer l'immatériel§!, puis trouver un §Ycatalyseur psionique§! puissant si nous voulons réussir. Nous pourrions vouloir conserver ce projet jusqu'à ce que nous estimions remplir ces conditions préalables."

  giga_eawaf.10171.name:99 "Succès de la Fusion Psicatalysée"
  giga_eawaf.10171.desc:99 "Après une longue série de tentatives échouées et d'impasses, les dernières expériences visant à reproduire la §YFusion Psicatalysée§! dans un environnement contrôlé ont enfin produit un gain d'énergie positif.\n\nUne faille psionique artificielle a été induite et maintenue par des psioniques au sein d'une sphère condensée d'hélium, qui s'est spontanément effondrée dans la faille, avant de réapparaître sous forme d'énergies psioniques bouillantes comme dans le coeur d'Hélios. Des noyaux d'hydrogène ont ensuite été injectés sur les énergies émergentes avec un timing parfait, déclenchant des réactions de fusion nucléaire extrêmement puissantes, plusieurs ordres de grandeur plus puissantes que celles trouvées dans les réacteurs à fusion conventionnels, ou même les étoiles normales, d'ailleurs.\n\nAvec le premier obstacle expérimental surmonté, les applications potentielles de cette technologie sont illimitées. Non seulement elle génère des quantités significatives d'énergie, mais les réactions de fusion plus puissantes pourraient théoriquement être utilisées pour créer des éléments extrêmement lourds avec bien plus de facilité que les méthodes actuelles. De plus, les failles stabilisées semblaient produire un effet d'« amincissement de la réalité » similaire à celui trouvé sur Faust, améliorant drastiquement l'efficacité des psioniques dans leur voisinage immédiat.\n\nSuite à ce succès retentissant, tout ce qu'il reste à faire maintenant est d'agrandir le design pour qu'il soit industriellement viable."
  giga_eawaf.10171.a:99 "Excellent !"

  giga_eawaf.10172.name:99 "Échec de la Fusion Psicatalysée"
  giga_eawaf.10172.desc:99 "Malheureusement, nos tentatives de reproduire la §YFusion Psicatalysée§! se sont toutes soldées par un échec. Il semblerait que notre compréhension actuelle des psioniques soit tout simplement trop primitive pour reproduire avec précision les conditions très spécifiques trouvées dans le coeur infernal d'Hélios.\n\nNos propres conceptions de réacteurs soit échouent complètement à percer l'immatériel, soit sont incapables de catalyser correctement la réaction de fusion psionique. Le projet a été décrit par beaucoup comme une perte de temps coûteuse, mais certains de nos scientifiques continuent néanmoins de croire en la faisabilité d'un tel projet, arguant que nous ne sommes tout simplement pas encore prêts."
  giga_eawaf.10172.a:99 "Réessayez ! Cette fois ça marchera..."
  giga_eawaf.10172.a.tooltip:99 "Nous tenterons à nouveau de déclencher une fusion psicatalysée dans un environnement contrôlé, bien qu'il serait peut-être sage de ne lancer le projet qu'une fois notre compréhension des psioniques développée, sinon il risque simplement d'échouer à nouveau."
  giga_eawaf.10172.b:99 "C'était une perte de temps. Annulez le projet."

  # Sirens Event Chain
  giga_eawaf.2001.name:99 "Les Profondeurs S'éveillent"
  giga_eawaf.2001.desc:99 "Quelque chose remue à la surface de Faust. Des explorateurs hippocampes d'§YHippogriffia§!, une nation située à l'extrémité nord-ouest de Zébrica, ont récemment entrepris une expédition dans les profondeurs de la §YFosse Mariana§!, l'une des crevasses les plus profondes et les plus sombres des vastes océans de Faust.\n\nQuand les explorateurs sont revenus, quelque chose en eux avait changé. Une sorte de présence mystérieuse s'était emparée d'eux, comme si leurs âmes mêmes avaient été envoûtées. Cette présence a commencé à se répandre aux autres Hippocampes, prenant le contrôle de leurs esprits et étendant son influence à travers la nation d'Hippogriffia.\n\nEn quelques semaines à peine, cette influence s'est répandue au point de culminer en un coup d'État relativement peu sanglant qui a vu l'ancien gouvernement hippogriffien renversé et l'instauration des §YSirènes§!, un trio de démons serpentins contrôleurs d'esprit des profondeurs, manifestement derrière tout cela, comme nouveaux dirigeants du pays qu'ils appellent maintenant §YSirenalia§!.\n\nD'après ce que notre avant-poste a pu recueillir, ces Sirènes semblent être animées par un intense désir de vengeance concernant une catastrophe oubliée depuis longtemps qui avait frappé leur espèce. Il est donc évident qu'elles n'ont pas l'intention de s'arrêter à la simple Hippogriffia et qu'elles tenteront probablement d'étendre leur influence au reste de Zébrica et potentiellement même à l'ensemble de Faust.\n\nLa tâche à accomplir est cependant intimidante. Déjà, un groupe de résistance connu sous le nom de §YRésistance Aris§!, composé de notables hippogriffiens, dont son ancienne reine, s'est levé pour contrer la montée de Sirenalia et mettre fin au règne des Sirènes sur leur terre légitime, et nul ne sait si oui ou non ils réussiront à restaurer l'ancien ordre.\n\nQuel que soit le résultat, il serait dans notre intérêt de garder un oeil attentif sur cette situation."
  giga_eawaf.2001.a:99 "Comme c'est particulier. Surveillons la situation."

  giga_eawaf.2002.name:99 "Les Sirènes Sécurisent Hippogriffia"
  giga_eawaf.2002.desc:99 "Sur l'ancien ordre d'Hippogriffia, §YSirenalia§! règne en maître. Bien que cela ait nécessité plusieurs années de guerre anti-partisane ardue et d'opérations de contre-espionnage, la §YRésistance Aris§! a été systématiquement démantelée.\n\nFait intéressant, les anciens membres de la résistance n'ont pas été exilés ou assassinés, mais plutôt envoûtés par les Sirènes elles-mêmes, donnant l'impression inquiétante qu'ils ont tout simplement abandonné leurs idéaux précédents et rejoint leurs anciens adversaires.\n\nÀ ce sujet, les observations ont confirmé que les Sirènes sont effectivement capables de contrôler directement l'esprit d'autres êtres sapients grâce à leur chant mystérieux et envoûtant. Ce chant semble être alimenté par des cristaux particuliers logés dans les Sirènes elles-mêmes, bien que les mécanismes réels de cet envoûtement nous restent entièrement inconnus.\n\nCette capacité est ce qui permet aux Sirènes d'imposer activement leur contrôle, et elles exploitent déjà ce pouvoir pour tenter de sécuriser plusieurs États-nations voisins de Sirenalia.\n\nAvec Sirenalia possédant une marine particulièrement importante ainsi qu'une puissante force aérienne, toutes deux héritées de l'ancien gouvernement hippogriffien, nous estimons que les Sirènes n'auront guère de mal à étendre leur influence au reste du nord de Zébrica dans les années à venir.\n\nQuant au reste de Faust, bien que certains expriment leur inquiétude face à la croissance des Sirènes, la plupart considèrent actuellement les Sirènes comme un empire de plus voué à inévitablement rencontrer sa fin aux mains d'une future coalition."
  giga_eawaf.2002.a:99 "Continuons à observer."

  giga_eawaf.20021.name:99 "Les Sirènes Renversées"
  giga_eawaf.20021.desc:99 "Il semble que le nouvel ordre des Sirènes n'était tout simplement pas destiné à perdurer. Après des mois d'action clandestine, les membres de la §YRésistance Aris§! ont éclaté en rébellion ouverte contre Sirenalia.\n\nÀ travers les rues et les villes de la nation, les non-envoûtés combattent les envoûtés, ces derniers se battant jusqu'à la mort pour défendre leurs maîtres. Finalement, cependant, et avec un soutien considérable d'§YEquestria§!, la résistance harmonique sort victorieuse alors que l'ordre des Sirènes s'effondre sur lui-même et que leur magie d'envoûtement, privée de subsistance, s'évanouit tout simplement.\n\nUn nouveau gouvernement hippogriffien unifié a été établi pour restaurer le statu quo d'antan, tandis que l'emplacement des Sirènes elles-mêmes est inconnu. Elles ont soit péri dans les combats, soit sont retournées dans les profondeurs des océans pour à nouveau rassembler leur pouvoir et peut-être attendre leur heure en préparation d'une autre tentative de domination planétaire.\n\nMais pour l'avenir prévisible, les Hippogriffiens peuvent se reposer en sachant que les Sirènes ne sont plus une menace, du moins pour les prochains siècles."
  giga_eawaf.20021.a:99 "Elles ont trouvé leur maître."

  giga_eawaf.2003.name:99 "La Chute du Nord de Zébrica"
  giga_eawaf.2003.desc:99 "Les voisins de Sirenalia n'avaient guère de chances face à l'avancée implacable des Sirènes. Renforcées par leur marine et leur force aérienne extrêmement puissantes, les Sirènes ont lancé une série d'offensives dans les nations voisines de §YChiropterra§! et §YColthage§!, déclenchant la §YGuerre du Nord de Zébrica§!. Cette guerre s'est finalement soldée par une victoire totale des Sirènes, qui ont peu après imposé leur hégémonie sur la majeure partie du nord de Zébrica.\n\nSuite à cette victoire retentissante, les Sirènes visent déjà leur prochaine cible majeure, à savoir la nation continentale d'§YEquestria§!, située de l'autre côté de l'océan au nord-ouest de Sirenalia. Bien que nos scientifiques aient été initialement assez perplexes quant à la raison pour laquelle les Sirènes ont décidé de choisir un ennemi aussi puissant comme prochaine cible, des études plus approfondies ont révélé qu'un groupe d'individus connus sous le nom de §YPiliers d'Equestria§! avait apparemment causé la chute des Sirènes il y a de nombreux millénaires.\n\nOriginaires d'Equestria même, ces « Piliers » ont été, contre toute attente, trouvés encore vivants, et les Sirènes semblent donc déterminées à exercer leur vengeance sur les Piliers pour leur bannissement précédent dans les profondeurs de la Fosse Mariana.\n\nCette guerre à venir promet d'être d'une ampleur considérable, probablement la plus grande que Faust ait jamais connue. Déjà les Sirènes ont entrepris de conquérir d'autres nations dans des emplacements géographiques clés, notamment §YMarégypte§! et §YAbyssinie§! au sud-ouest, afin de les utiliser comme bases de déploiement pour la future invasion d'Equestria.\n\nÉtant donné la puissance d'Equestria, beaucoup d'habitants de Faust pensent que cela se terminera probablement par la disparition prématurée des Sirènes, mais les Sirènes elles-mêmes semblent déterminées à exécuter ce plan ambitieux jusqu'au bout."
  giga_eawaf.2003.a:99 "Cela promet d'être tout un combat."

  giga_eawaf.20031.name:99 "Sirenalia Vaincue"
  giga_eawaf.20031.desc:99 "Malheureusement pour les Sirènes, les nations du nord de Zébrica se sont révélées plus que capables de rivaliser avec l'empire naissant de Sirenalia.\n\nSuite à une série d'assauts initialement réussis dans les nations de §YChiropterra§! et §YColthage§!, qui ont déclenché la §YGuerre du Nord de Zébrica§!, les offensives des Sirènes se sont rapidement enlisées alors que les nations susmentionnées se sont rapidement et inopinément unies pour s'opposer aux avancées des Sirènes d'un seul bloc.\n\nLa situation a été encore aggravée par l'entrée en guerre de §YWingbardy§!, une nation puissante du sud de Griffonia. La marine wingbardienne a définitivement fait pencher la balance contre les Sirènes et ce n'était plus qu'une question de mois avant que les territoires centraux de Sirenalia ne soient menacés.\n\nAprès des mois de siège suivis de plusieurs offensives éprouvantes dans les capitales de Sirenalia, les Sirènes, réalisant que leur défaite était pratiquement inévitable, ont fui la scène et ont de nouveau disparu dans les profondeurs de l'océan.\n\nAvec la disparition des Sirènes, ce qui restait du gouvernement de Sirenalia s'est rapidement effondré et ses anciennes terres ont été placées sous un mandat de reconstruction chargé de superviser la reconstruction de la région et l'élimination totale des quelques derniers irréductibles pro-sirènes.\n\nLe véritable emplacement des Sirènes est inconnu, mais il est peu probable qu'elles réapparaissent avant au moins plusieurs siècles, et ont donc été considérées comme définitivement vaincues par la majorité des habitants de Faust."
  giga_eawaf.20031.a:99 "Elles ont trouvé leur maître."

  giga_eawaf.2004.name:99 "Les Sirènes Renversent Equestria"
  giga_eawaf.2004.desc:99 "L'impensable s'est produit ! Contre toute attente, §YSirenalia§! a triomphé de la nation continentale d'§YEquestria§!.\n\nUne série d'invasions navales fulgurantes a frappé les côtes sud-est d'Equestria avec une vitesse et une puissance inédites, des millions de troupes envoûtées se dirigeant vers le nord en direction de la capitale équestre de §YCanterlot§!.\n\nUne combinaison de charges suicides et de guerre chimique a permis aux armées des Sirènes de porter un coup dévastateur au moral des Équestiens pris au dépourvu, et il n'a pas fallu longtemps avant que Sirenalia n'ait encerclé la capitale et occupé la plupart des principaux centres industriels et démographiques d'Equestria.\n\nAvec la chute finale de Canterlot, les Sirènes ont procédé à l'envoûtement des plus puissants protecteurs d'Equestria et ont utilisé leurs pouvoirs pour bannir les esprits des deux §YAlicornes§! régnantes d'Equestria dans §YHélios§! et §YSéléné§!, avant de projeter les Piliers d'Equestria dans les profondeurs de l'Immatériel lui-même, assurant ainsi un contrôle total sur Equestria et son peuple.\n\nAvec la chute de la nation la plus puissante de Faust, les Sirènes ont maintenant accès à des quantités sans précédent de main-d'oeuvre et d'industrie, qu'elles utilisent déjà pour lancer des offensives contre les voisins du nord d'Equestria afin de sécuriser complètement le continent d'§YEquus§!.\n\nNotre avant-poste estime qu'il n'est maintenant qu'une question de temps avant que l'influence des Sirènes ne s'étende à l'ensemble de Faust... et peut-être même au-delà."
  giga_eawaf.2004.a:99 "Elles sont remarquablement efficaces."
  giga_eawaf.2004.a.tooltip:99 "Si nous essayions d'arrêter les Sirènes, il est maintenant trop tard pour faire quoi que ce soit au-delà d'une invasion terrestre directe."

  giga_eawaf.20042.name:99 "Aperçus Surnaturels"
  giga_eawaf.20042.desc:99 "Nos études sur les méthodes des Sirènes, combinées à un examen plus approfondi des cristaux thaumaturgiques très atypiques de Faust, ont enfin porté leurs fruits.\n\nEn effet, tout ce qui concerne ce monde et sa nature pointe vers l'existence d'une « force » sous-jacente imprégnant tout ce qui est conscient, que les Sirènes semblent manipuler activement pour atteindre leurs objectifs. Nos équipes scientifiques sont impatientes d'approfondir ce phénomène."
  giga_eawaf.20042.a:99 "Fascinant... poursuivez les études !"
  giga_eawaf.20042.b:99 "Cela ne vaut pas notre temps."

  giga_eawaf.20041.name:99 "Equestria Vainc les Sirènes"
  giga_eawaf.20041.desc:99 "Comme beaucoup s'y attendaient, l'assaut des Sirènes sur §YEquestria§! s'est révélé être un désastre complet. Bien que l'invasion ait été initialement réussie, Equestria a réussi à mobiliser rapidement ses énormes réserves de main-d'oeuvre, les utilisant pour d'abord stopper, puis repousser les avancées de Sirenalia sur Equus.\n\nCela a été suivi par le lancement d'une vaste invasion amphibie à plusieurs fronts des territoires centraux de Sirenalia, à laquelle les Sirènes ont opposé une résistance incroyable, avant d'être finalement submergées par la puissance industrielle et militaire des Équestiens.\n\nSuite à la capture complète de Sirenalia proprement dite, les Alicornes régnantes d'Equestria ont procédé à la capture des Sirènes alors qu'elles tentaient de fuir. Afin de s'assurer que Sirenalia ne puisse jamais réapparaître, les Piliers d'Equestria aux côtés des Alicornes ont combiné leurs pouvoirs pour bannir les âmes mêmes des Sirènes dans les profondeurs de l'Immatériel, où elles devraient rester emprisonnées pendant au moins plusieurs millénaires.\n\nAvec Sirenalia vaincue et ses dirigeantes elles-mêmes bannies de la réalité, les espoirs de domination mondiale des Sirènes ont été définitivement anéantis."
  giga_eawaf.20041.a:99 "Il y a donc de l'espoir pour Faust après tout."

  giga_eawaf.2005.name:99 "Les Sirènes Subjuguent Faust"
  giga_eawaf.2005.desc:99 "Avec la chute d'§YEquestria§! aux mains des Sirènes, ce n'était qu'une question de temps avant que le reste de Faust ne tombe également. Malgré les tentatives hâtives d'unification par les autres nations pour contrer la montée des Sirènes, cela s'est finalement avéré trop peu, trop tard.\n\nEt ainsi, après plusieurs années de guerre intense, les Sirènes ont enfin étendu l'influence de §YSirenalia§! sur l'ensemble de Faust. À travers la surface du monde, deux milliards de sapients sont tombés sous le sortilège envoûtant des Sirènes, travaillant sans relâche pour alimenter la puissance industrielle toujours croissante de Sirenalia.\n\nAvec le monde entier sous leur contrôle, il semble évident que la prochaine étape pour les Sirènes pourrait bien être de prendre les étoiles, bien que les moyens par lesquels elles le feraient restent flous. Malgré leur puissante magie, Sirenalia est, en l'état, complètement et désespérément surpassée par même un empire interstellaire naissant, et toute tentative d'expansion dans l'espace serait probablement accueillie par une puissance de feu écrasante.\n\nPour l'instant, notre avant-poste continuera d'observer les Sirènes, et informera immédiatement notre gouvernement et nos forces armées si Sirenalia commence à planifier son expansion dans l'espace."
  giga_eawaf.2005.a:99 "Nous les écraserons si elles tentent quoi que ce soit."

  giga_eawaf.20051.name:99 "Le Secret des Sirènes ?"
  giga_eawaf.20051.desc:99 "Notre soutien clandestin aux Sirènes nous a permis d'obtenir des informations précieuses sur le fonctionnement interne du sortilège des Sirènes et sur la façon dont les cristaux thaumaturgiques de Faust ont été activement utilisés par Sirenalia pour renforcer leur sortilège à travers le monde.\n\nNos scientifiques sont maintenant convaincus que, en utilisant quelques échantillons de ces cristaux récupérés dans la ceinture d'astéroïdes locale, ils pourraient être en mesure de reproduire d'une certaine manière ces effets, bien qu'à plus petite échelle et avec une efficacité bien moindre, ce qui aurait des... applications intéressantes au sein de notre gouvernement et de notre société."
  giga_eawaf.20051.a:99 "Nous devons approfondir nos investigations sur leurs méthodes."
  giga_eawaf.20051.b:99 "C'est bien trop dangereux."

  giga_eawaf.20061.name:99 "Surtension d'Énergie Thaumaturgique"
  giga_eawaf.20061.desc:99 "Les instruments de notre station sur Faust se sont soudainement affolés. Un pic d'énergie extrêmement puissant commence à émerger à la surface de Faust, apparemment centré autour de la capitale de Sirenalia.\n\nIl semblerait que les Sirènes soient en train de rassembler les réserves de cristaux thaumaturgiques de Faust afin de lancer une sorte de sortilège gigantesque. Selon nos relevés, l'énergie contenue dans tous les cristaux de Faust serait suffisante pour générer un champ thaumaturgique s'étendant non seulement sur la surface de Faust, mais aussi sur l'ensemble de son système planétaire local.\n\nOn ne sait pas quels pourraient être les effets de ce « sortilège », mais tout se déroule bien trop rapidement pour que nous puissions réellement intervenir. En tant que tel, nos scientifiques nous pressent d'§Révacuer tous les actifs précieux du système de Faust§! avant que la surtension d'énergie n'atteigne son apogée, ce qui a été estimé à environ §Y3 mois§!."
  giga_eawaf.20061.a:99 "Ce n'est pas bon."

  giga_eawaf.20071.name:99 "Faust Engloutie dans le Voile Éthéré"
  giga_eawaf.20071.desc:99 "Alors que la surtension d'énergie atteint son intensité maximale, Faust et l'ensemble de son système planétaire... disparaissent tout simplement.\n\nSuite à l'apogée du grand sortilège des Sirènes, une masse colossale d'énergie éthérée émerge de Faust, présumément déchargée par d'énormes quantités de cristaux thaumaturgiques. Ce champ s'étend d'abord pour entourer Sirenalia, puis Faust, et finalement, tout le système.\n\nIl ne faut que quelques heures pour que le champ engloutisse tout le voisinage planétaire de Faust, tout ce qui se trouve à proximité, qu'il s'agisse de vaisseaux, de planètes ou de débris flottants, étant inévitablement absorbé par le champ.\n\nAu bout d'environ un jour, le champ, maintenant baptisé §YVoile Éthéré§!, se stabilise, perturbant toutes les hyper-lignes et rendant les autres formes de voyage supraluminique purement et simplement impossibles. Les vaisseaux et transmissions envoyés pour investiguer le système disparaissent tout simplement de l'existence, pour ne plus jamais être revus. La conclusion est claire : pour le moment, le système Faust a essentiellement été retiré de la galaxie, apparemment à la suite des plans des Sirènes.\n\nBien qu'il soit incertain si cet étrange voile se dissipera un jour, de légères variations dans ses signatures énergétiques semblent indiquer qu'il pourrait éventuellement disparaître après environ §Yun siècle§!, bien que si cela s'avère exact ou n'est que pure spéculation reste à voir."
  giga_eawaf.20071.a:99 "Comme c'est... particulier. Je suppose qu'elles sont parties."
  giga_eawaf.20071.a.tooltip:99 "§YFaust§! est engloutie dans le §YVoile Éthéré§! pour supposément au moins un §Ysiècle§!. Toute tentative de pénétrer dans le système est vouée à se terminer de manière catastrophique.\n§RIl serait peut-être sage de rester à l'écart des systèmes directement voisins du voile...§!"

  giga_eawaf.20072.name:99 "Le Système Faust Englouti dans le Voile Éthéré"
  giga_eawaf.20072.desc:99 "Le système particulier de §YFaust§!, connu pour abriter une étoile miniature orbitant autour d'un monde tellurique, a soudainement disparu de tous les capteurs à travers la galaxie.\n\nUne investigation plus approfondie a révélé que l'ensemble du système — y compris Faust elle-même et tous les vaisseaux qui auraient pu être présents — a été englouti dans un colossal §YVoile Éthéré§!, qui interdit toute observation ou entrée dans le système lui-même.\n\nDes rapports épars indiquent que cela serait l'oeuvre d'une sorte de « sortilège » lancé par §YSirenalia§!, une hyperpuissance planétaire qui avait récemment réussi à unifier l'ensemble de Faust sous un sortilège de contrôle mental envoûtant après une série de guerres éprouvantes.\n\nQuel pourrait être le but de ce voile est inconnu, mais les fluctuations dans les motifs énergétiques du voile indiquent qu'il y a une chance qu'il commence à se dissiper après environ §Yun siècle§!, mais si cela est autre chose qu'une prédiction aléatoire, c'est à qui voudra bien le deviner.\n\nPour le moment, l'ensemble du système a essentiellement été retiré de la galaxie, et il serait sage de faire preuve de prudence à proximité de cet étrange champ."
  giga_eawaf.20072.a:99 "Des plus particulier."

  giga_eawaf.30001.name:99 "Le Voile Éthéré Fluctue"
  giga_eawaf.30001.desc:99 "Au cours des derniers mois, les relevés d'énergie thaumaturgique émanant du §YVoile Éthéré§!, qui étaient restés stables depuis la disparition de §YFaust§!, ont commencé à fluctuer sans raison apparente.\n\nBien que les détails de ce qui pourrait se passer à l'intérieur du voile nous échappent encore, cela indique manifestement une certaine activité de la part des §YSirènes§! qui avaient pris le contrôle du système par la force des armes il y a plusieurs années.\n\nDe façon inquiétante, les motifs des fluctuations suggèrent que le Voile Éthéré va probablement finir par se défaire d'ici les §Ycinq prochaines années§!."
  giga_eawaf.30001.a:99 "Nous devrions nous attendre au pire."

  giga_eawaf.30002.name:99 "Sirenalia — §HAdagio Dazzle§!"
  giga_eawaf.30002.desc:99 "Mortels ! Je n'ai jamais été du genre à faire de longs préliminaires, alors passons directement au plat principal cette fois. Cette galaxie que vous pensez être vôtre est en fait à nous pour la prendre, et nous avons bien l'intention de la faire nôtre bientôt. Vous pouvez toujours choisir de vous soumettre maintenant, mais nous savons tous les deux comment se joue ce jeu, n'est-ce pas ? J'ai hâte de voir ce que vous aurez à nous offrir à la fin."
  giga_eawaf.30002.bye:99 "Nous renverrons votre espèce dans les profondeurs !"

  giga_eawaf.30003.name:99 "Le Retour des Sirènes"
  giga_eawaf.30003.desc:99 "Il est évident que, loin de s'isoler, les Sirènes ont comploté et planifié sous le Voile Éthéré. Autour du monde autrefois verdoyant de §YFaust§!, maintenant transformé en un vaste enfer psio-industriel, se dresse une mégastructure ésotérique baptisée l'§YEnvoûteur Voilesonique§!, dont le but est clair : amplifier la portée du chant contrôleur d'esprit des Sirènes pour couvrir la §Rgalaxie entière§!.\n\nPour ce faire, l'Envoûteur génère manifestement un puissant §RChamp de Discorde§! centré autour de Faust. Près de Faust, dans ce qui est maintenant connu comme le §RChamp Intérieur§!, le sortilège est suffisamment puissant pour §Rcontrôler instantanément l'esprit§! de tout vaisseau s'approchant trop près, et il est donc impératif que nous §Révitions§! ce champ intérieur à tout prix jusqu'à ce que des contre-mesures puissent être conçues.\n\nPlus loin, les effets du Champ s'atténuent mais restent néanmoins présents dans le §PChamp Extérieur§!, qui s'étend bien au-delà des frontières de Sirenalia et pousse les populations des mondes pris dans le champ extérieur à éprouver des niveaux plus élevés de discorde et de haine les uns envers les autres.\n\nDe manière alarmante, cette discorde est manifestement ce qui « nourrit » les Sirènes, ce qui signifie que plus elles acquièrent de §RDiscorde§!, plus l'§YEnvoûteur Voilesonique§! sera capable de projeter le sortilège loin... et plus les Sirènes auront de discorde. Il va donc sans dire que Sirenalia doit être stoppée avant que l'envoûteur ne déclenche une boucle de rétroaction positive résultant en l'engloutissement de notre galaxie entière par le §RChamp Intérieur§!.\n\nComme le fonctionnement réel de la « Discorde », de l'Envoûteur, du sortilège et du Champ nous échappe encore, une §YSituation§! a été mise en place pour suivre nos progrès concernant notre connaissance des Sirènes."
  giga_eawaf.30003.a:99 "Continuez à les surveiller."

  # Diplo with Sirens
  giga_eawaf.4000.name:99 "Sirenalia"
  giga_eawaf.4000.desc.adagio:99 "Êtes-vous venus offrir votre reddition complète et inconditionnelle ? Non ? Alors pourquoi vous donnez-vous même la peine d'être ici ?"
  giga_eawaf.4000.desc.aria:99 "Faites vite. Je n'ai pas toute la journée à perdre mon temps avec des créatures comme vous."
  giga_eawaf.4000.desc.sonata:99 "Ooooh, je ne crois pas vous avoir déjà vus ! Ou peut-être que si ! Il y a tellement de vous nouveaux êtres bizarres à suivre, vous savez !"
  giga_eawaf.4000.bye:99 "Écran de communication éteint."

  # Final Event Chain

  giga_eawaf.6000.name:99 "Défenses Extérieures de l'Envoûteur Percées !"
  giga_eawaf.6000.desc:99 "Nos vaillantes flottes ont réussi à détruire les emplacements d'armes extérieurs du redoutable §YEnvoûteur Voilesonique§! des Sirènes.\n\nPar la suite, la perte de ces points stratégiques critiques a exposé le §YCoeur Abyssal§! de l'Envoûteur enveloppant Faust elle-même et alimentant l'ensemble de l'appareil, qui devrait être détruit au plus vite si nous voulons enfin mettre fin à la folie des Sirènes."
  giga_eawaf.6000.a:99 "À l'assaut immédiatement !"

  giga_eawaf.6001.name:99 "Envoûteur Voilesonique Détruit !"
  giga_eawaf.6001.desc:99 "Avec la destruction du §YCoeur Abyssal§! de l'Envoûteur, qui servait de « condensateur » amplifiant le sortilège des Sirènes à travers la galaxie, l'autrefois puissante mégastructure a rapidement subi un effondrement catastrophique en un champ de débris de la taille d'une planète entourant Faust elle-même.\n\nCela a été rapidement suivi par la désintégration complète du §YChamp de Discorde§! et la perte subséquente du contrôle des Sirènes sur la plupart de leurs actifs directement en dehors de Faust elle-même, vers laquelle les Sirènes se sont maintenant repliées dans l'attente d'un ultime combat désespéré."
  giga_eawaf.6001.a:99 "Elles n'ont plus nulle part où fuir maintenant."

  giga_eawaf.60022.name:99 "Le Dernier Combat des Sirènes"
  giga_eawaf.60022.desc:99 "Alors que nos armées touchent le sol de §YFaust§!, les Sirènes, acculées, ont commencé à jeter des millions et des millions de Faustiens contrôlés par l'esprit directement contre nos légions !\n\nAu grand désarroi de nos commandants, des nations entières de serviteurs, souvent sans équipement approprié ni expérience du combat, marchent maintenant vers leur mort dans une tentative désespérée de ralentir notre avancée inévitable sur leur monde.\n\nIl est évident que, si rien n'est fait, les Sirènes ont bien l'intention de sacrifier l'ensemble de la population innocente de Faust — et donc la majeure partie de la valeur réelle de la planète — afin de s'accorder juste un peu plus de temps..."
  giga_eawaf.60022.a:99 "Nous devons mettre fin à cela immédiatement ! Cherchez un moyen de libérer les Faustiens."
  giga_eawaf.60022.b:99 "Que ce monde se brise sous notre puissance si c'est ce qu'ils souhaitent."

  giga_eawaf.60024.name:99 "La Destruction de Faust"
  giga_eawaf.60024.desc:99 "Par une force écrasante, le monde de §YFaust§! a été totalement détruit avec ses maîtres Sirènes. Bien que cela ait entraîné d'innombrables morts, cela assurera enfin la fin définitive de la folie des Sirènes."
  giga_eawaf.60024.a:99 "C'était pour le plus grand bien."

  giga_eawaf.60025.name:99 "La Chute de Faust"
  giga_eawaf.60025.desc:99 "Malgré les meilleurs efforts des Sirènes, et le sacrifice vain de milliards de Faustiens, le monde de §YFaust§! est tombé sous notre puissance.\n\nOu du moins, ce qu'il en reste. Plus de quatre-vingt-dix-neuf pour cent de la population de la planète a péri dans les combats, laissant des continents entiers dépourvus de vie intelligente et couverts des vestiges squelettiques lugubres de villes et zones industrielles gigantesques que nos forces procèdent maintenant à occuper. Un maigre un pour cent de l'ancienne population a réussi à survivre lorsque le sortilège des Sirènes s'est dissipé en raison de la population rapidement décroissante de Faust.\n\nQuant aux §YSirènes§! elles-mêmes, elles se sont manifestement retirées dans les profondeurs de la §YFosse Mariana§! d'où elles avaient émergé pour la première fois, mais nos commandants nous ont assuré que les forces planétaires organisent déjà une expédition dans les profondeurs océaniques afin de tuer ces bêtes une fois pour toutes."
  giga_eawaf.60025.a:99 "Victoire, mais à quel prix ?"

  giga_eawaf.60251.name:99 "La Fin des Sirènes"
  giga_eawaf.60251.desc:99 "La fin des Sirènes a été, faute de meilleurs termes, plutôt anticlimactique. Suite à la descente de notre expédition dans la Fosse Mariana, ses membres ont rapidement localisé les Sirènes se cachant dans des formations géologiques arcaniques au fond de l'océan.\n\nElles ont bien sûr tenté de résister par l'utilisation de leur magie, mais, totalement privées d'une population d'où tirer de la haine, et désespérément contrées par notre technologie de Désenchantement, ces tentatives n'ont fait guère plus que provoquer des pics de relevés énergétiques dans les combinaisons de plongée de nos soldats et ce qui a suivi a été tout simplement la vaporisation rapide des trois Sirènes via des armes à haute énergie.\n\nCependant, étrangement, les cristaux rouges qui étaient autrefois incrustés dans les Sirènes et leur fournissaient supposément leurs pouvoirs ont été trouvés avoir en quelque sorte survécu à toute cette épreuve et ont été récupérés par nos soldats dans des conteneurs thaumaturgiquement sécurisés pour un examen plus approfondi."
  giga_eawaf.60251.a:99 "Ces cristaux... pourraient nous être utiles."
  giga_eawaf.60251.b:99 "Jetez-les dans le soleil, détruisez-les !"

  giga_eawaf.60026.name:99 "La Chute de Faust"
  giga_eawaf.60026.desc:99 "Malgré les meilleurs efforts des Sirènes, et le sacrifice vain de milliards de Faustiens, le monde de §YFaust§! est tombé sous la puissance de §Y[giga_eawaf_sirens_killer_country.GetName]§!.\n\nOu du moins, ce qu'il en reste. Plus de quatre-vingt-dix-neuf pour cent de la population de la planète a péri dans les combats, laissant des continents entiers dépourvus de vie intelligente et couverts des vestiges squelettiques lugubres de villes et zones industrielles gigantesques. Un maigre un pour cent de l'ancienne population a réussi à survivre lorsque le sortilège des Sirènes s'est dissipé en raison de la population rapidement décroissante de Faust.\n\nQuant aux §YSirènes§! elles-mêmes, elles se sont manifestement retirées dans les profondeurs de la §YFosse Mariana§! d'où elles avaient émergé pour la première fois, bien qu'il soit probable que §Y[giga_eawaf_sirens_killer_country.GetName]§! s'en occupera rapidement."
  giga_eawaf.60026.a:99 "Une sombre victoire."

  giga_eawaf.60027.name:99 "Visions de Miroir"
  giga_eawaf.60027.desc:99 "Notre département scientifique rapporte que, suite à des scans orbitaux de Faust couplés à des expéditions audacieuses en surface, ils ont peut-être trouvé un moyen de neutraliser les Sirènes sans avoir à sacrifier toute la population de Faust.\n\nEn effet, bien qu'il était déjà connu que Faust résidait dans une zone de l'espace-temps où la « réalité » était plus faible, il a maintenant été découvert qu'un point spécifique à la surface de Faust, situé près de ce que les indigènes appelaient §YCanterlot§!, se trouve en proximité dimensionnelle étroite avec un « royaume miroir ».\n\nLa raison de ce lien ainsi que la nature de ce royaume sont inconnues, mais notre département scientifique théorise qu'il pourrait être possible de, en utilisant des échantillons des cristaux de contrôle mental utilisés par les Sirènes combinés à la décharge orbitale soudaine d'une grande quantité d'énergie dans la zone donnée, « briser » le tissu de la réalité et créer un « vortex dimensionnel » temporaire que nous pourrions ensuite utiliser pour « bannir » les Sirènes vers la dimension alternative susmentionnée.\n\nCe plan nécessiterait cependant la plus grande hâte et une connaissance parfaite de la situation par un « sacrifice » chargé de plonger dans le vortex avec des cristaux soigneusement accordés afin de provoquer la réaction thaumaturgique en chaîne nécessaire pour attirer puis bannir les Sirènes.\n\nEn l'état, seul §Y[giga_eawaf_sirens_scientist_sacrifice.GetName]§! serait capable de réaliser un tel exploit."

  giga_eawaf.60027.a:99 "Approuvé. Procédez immédiatement, quel qu'en soit le coût !"
  giga_eawaf.60027.b:99 "Refusé. Ce monde ne vaut pas [giga_eawaf_sirens_scientist_sacrifice.GetName]."

  giga_eawaf.60028.name:99 "Sirènes Bannies"
  giga_eawaf.60028.desc:99 "Alors que la décharge scintillante d'énergie de nos actifs orbitaux impacte la surface de Faust où se trouve la faille dimensionnelle, §Y[giga_eawaf_sirens_scientist_sacrifice.GetName]§! plonge dans la déchirure grandissante de l'espace-temps aux côtés d'un ensemble de cristaux thaumaturgiques soigneusement accordés pour imiter ceux incrustés dans les Sirènes elles-mêmes.\n\nComme prévu, cela déclenche un « enchevêtrement » thaumaturgique qui « arrache » les Sirènes impuissantes de leur cachette sur Faust et les précipite directement dans le vortex dimensionnel aux côtés de notre officier avant que l'ensemble du vortex, inapte à exister dans notre réalité pendant plus de quelques secondes, ne s'effondre sur lui-même, emportant [giga_eawaf_sirens_scientist_sacrifice.GetName] et les Sirènes avec lui.\n\nCe qui suit est l'effondrement complet de l'emprise des Sirènes sur Faust et la libération subséquente de la population de Faust de leur emprise diabolique, stoppant effectivement leurs tactiques d'assaut massif implacables. Bien que Faust et ses habitants resteront probablement marqués pendant de nombreuses années, les Sirènes ont enfin été définitivement expulsées de notre réalité."
  giga_eawaf.60028.a:99 "Elles ne nous troubleront plus."

  giga_eawaf.60029.name:99 "Un Étrange Miroir"
  giga_eawaf.60029.desc:99 "Suite à la disparition des Sirènes, nos scientifiques ont mené une investigation de §YCanterlot§!, l'endroit où l'étrange faille dimensionnelle avait été initialement détectée.\n\nIls rapportent qu'un artefact particulier, semblable à une sorte de « miroir de cristal » orné, a été trouvé profondément sous la surface, avec des études supplémentaires révélant que ce dispositif particulier est très probablement à l'origine de la connexion interdimensionnelle qui nous a permis de bannir les Sirènes de notre réalité.\n\nL'activation contrôlée du miroir suivie d'un sondage prudent à l'aide de sondes furtives a révélé une connexion à une sorte de Royaume alternatif peuplé d'humanoïdes colorés qui semblent régulièrement participer à des célébrations musicales rituelles.\n\nBien que révéler réellement notre présence à cette dimension ou en extraire quiconque reste totalement déconseillé, en raison du risque que les Sirènes remarquent ce chemin de retour vers notre réalité, nous pourrions très bien garder le miroir dans une installation sécurisée, ce qui nous permettrait d'étudier ses habitants particuliers ainsi que leurs rituels musicaux."
  giga_eawaf.60029.a:99 "Curieux. Gardons-le."
  giga_eawaf.60029.b:99 "Bien trop dangereux ! Scellez-le pour de bon."

  giga_eawaf.60032.name:99 "Sirenalia Vaincue"
  giga_eawaf.60032.desc:99 "Suite à la disparition finale d'§HAdagio Dazzle§!, §MAria Blaze§! et §BSonata Dusk§! aux mains de §Y[giga_eawaf_sirens_killer_country.GetName]§!, les redoutables §YSirènes§! qui avaient menacé de contrôler l'esprit de Faust et de la plus grande galaxie pendant plusieurs décennies, leur empire de §YSirenalia§! a définitivement été jeté aux oubliettes de l'histoire.\n\nTous les vaisseaux et planètes restants sous l'influence des Sirènes se sont soit autodétruits, soit libérés eux-mêmes, soit sont retournés à leurs anciens propriétaires. Et ainsi la communauté galactique pousse un soupir de soulagement collectif alors que le plan dérangé des Sirènes pour atteindre « l'unité galactique éternelle » a enfin été définitivement anéanti."
  giga_eawaf.60032.a:99 "Le choeur des Sirènes se tait enfin."

  giga_eawaf.5001.name:99 "Prototype de Désenchanteur Conçu"
  giga_eawaf.5001.desc:99 "Nos chercheurs rapportent que nos efforts pour comprendre et contrer les Sirènes commencent à porter leurs fruits, ne serait-ce que légèrement.\n\nBien que la nature profonde du chant mystérieux des Sirènes nous échappe encore, des études préliminaires suggèrent que le tir de décharges d'énergie focalisées à des fréquences spécifiques dans le quasi-espace peut atténuer certains effets du Champ de Discorde, au prix d'une augmentation drastique de l'entretien des vaisseaux sur lesquels ces mécanismes sont montés, ainsi qu'une mobilité entravée lorsqu'ils sont actifs.\n\nBaptisés §YDésenchanteurs§!, ces dispositifs avancés semblent être une option viable pour contrer les Sirènes et seront étudiés plus avant."
  giga_eawaf.5001.a:99 "Il y a de l'espoir."
  giga_eawaf.5001.a.tooltip:99 "Nous devrons rechercher la technologie du Désenchanteur pour poursuivre la situation §YContrer les Sirènes§!. Notre approche a été réglée sur §YAucune Étude des Sirènes§! en attendant pour éviter de gaspiller des ressources."

  giga_eawaf.5002.name:99 "Désenchanteur Accordé Conçu"
  giga_eawaf.5002.desc:99 "De nouvelles avancées dans la recherche anti-Sirènes ont permis d'obtenir des modèles de Désenchanteur améliorés avec une plus grande efficacité.\n\nBien qu'ils ne soient pas encore assez puissants pour repousser le néfaste §RChamp Intérieur§!, ces designs devraient permettre à nos vaisseaux d'opérer dans le §PChamp Extérieur§! sans pénalité de vitesse."
  giga_eawaf.5002.a:99 "Mettez-vous-y immédiatement."

  giga_eawaf.5003.name:99 "Désenchanteur Symphonique Conçu"
  giga_eawaf.5003.desc:99 "Nos équipes scientifiques rapportent que des percées récentes dans la technologie des Désenchanteurs devraient permettre à ces designs améliorés de repousser non seulement le §PChamp Extérieur§!, mais aussi d'être suffisamment efficaces pour repousser même le §RChamp Intérieur§! et permettre à nos vaisseaux d'opérer même au coeur du territoire des Sirènes, bien qu'à des vitesses drastiquement réduites.\n\nCela signifie que, à condition de posséder une puissance de feu suffisante, il devrait maintenant être possible de mettre enfin fin à la folie des Sirènes."
  giga_eawaf.5003.a:99 "Excellent."

  giga_eawaf.5004.name:99 "Désenchanteur Euphonique Conçu"
  giga_eawaf.5004.desc:99 "De nouvelles améliorations apportées à nos Désenchanteurs existants ont permis d'obtenir le §YDésenchanteur Euphonique§! — le fin mot de la technologie anti-Sirènes.\n\nCapable d'opérer n'importe où dans le Champ de Discorde sans impact sur la vitesse des vaisseaux, cela devrait permettre à nos vaisseaux de mener des frappes n'importe où contre les Sirènes et à tout moment."
  giga_eawaf.5004.a:99 "Délicieux ! Elles seront bientôt impuissantes."

  giga_eawaf.1104.name:99 "Armement Thaumaturgique"
  giga_eawaf.1104.desc:99 "L'§YArmement Thaumaturgique§! que nous avons réussi à rétroconcevoir à partir des Sirènes présente la propriété particulière d'être aussi puissant que la quantité d'énergie que nous parvenons à y injecter en toute sécurité.\n\nAinsi, nous avons conçu une nouvelle technologie répétable visant à augmenter continuellement la puissance de ces armes."
  giga_eawaf.1104.a:99 "Intrigant."

  # Technologies
  giga_tech_eawaf_psifusion:99 "Fusion Psicatalysée Industrielle"
  giga_tech_eawaf_psifusion_desc:99 "Reproduire le fonctionnement ésotérique du coeur infernal d'Hélios dans un environnement contrôlé et à l'échelle industrielle permet une production d'énergie considérable et la production facilitée d'éléments lourds."

  giga_tech_eawaf_weapons_repeatable:99 "Armement Thaumaturgique Surchargé"
  giga_tech_eawaf_weapons_repeatable_desc:99 "La nature ésotérique de l'armement thaumaturgique signifie qu'il n'y a essentiellement pas de limite supérieure à leur potentiel. Tant que plus d'énergie peut être injectée avec plus de cristaux pour transporter cette énergie, ils peuvent continuer à devenir de plus en plus puissants.\n§RPour des raisons techniques, la pénalité d'entretien s'applique à l'ensemble du vaisseau et pas seulement aux composants thaumaturgiques ! Il est donc recommandé de remplir complètement le vaisseau avec ces armes pour en tirer le maximum.§!"

  giga_tech_eawaf_weapons_repeatable_title:99 "Dégâts des Armes Thaumaturgiques : §G+25 %§!\nEntretien des Vaisseaux avec Armes Thaumaturgiques : §R+12,5 %§!"
  giga_tech_eawaf_weapons_repeatable_desc:99 "§RPour des raisons techniques, la pénalité d'entretien s'applique à l'ensemble du vaisseau et pas seulement aux composants thaumaturgiques ! Il est donc recommandé de remplir complètement le vaisseau avec ces armes pour en tirer le maximum.§!"

  giga_tech_eawaf_sirens_secret:99 "Envoûtement Thaumaturgique"
  giga_tech_eawaf_sirens_secret_desc:99 "Étudier comment les Sirènes déploient leur sortilège d'envoûtement pourrait avoir de grandes applications pour notre gouvernement et notre société."

  giga_tech_eawaf_sirens_strike_craft:99 "$GIGA_EAWAF_STRIKE_CRAFT$"
  giga_tech_eawaf_sirens_strike_craft_desc:99 "$GIGA_EAWAF_STRIKE_CRAFT_DESC$"

  giga_tech_eawaf_sirens_autocannon:99 "$GIGA_EAWAF_CRYSTAL_AUTOCANNON$"
  giga_tech_eawaf_sirens_autocannon_desc:99 "$GIGA_EAWAF_CRYSTAL_AUTOCANNON_DESC$"

  giga_tech_eawaf_sirens_artillery:99 "$GIGA_EAWAF_CRYSTAL_ARTILLERY$"
  giga_tech_eawaf_sirens_artillery_desc:99 "$GIGA_EAWAF_CRYSTAL_ARTILLERY_DESC$"

  giga_tech_eawaf_sirens_missile:99 "$GIGA_EAWAF_PSIONIC_CHARGE$"
  giga_tech_eawaf_sirens_missile_desc:99 "$GIGA_EAWAF_PSIONIC_CHARGE_DESC$"

  giga_tech_eawaf_sirens_impactor:99 "$GIGA_EAWAF_CRYSTAL_IMPACTOR$"
  giga_tech_eawaf_sirens_impactor_desc:99 "$GIGA_EAWAF_CRYSTAL_IMPACTOR_DESC$"

  giga_tech_eawaf_sirens_voidbeam:99 "$GIGA_EAWAF_GRAND_VOID_BEAM$"
  giga_tech_eawaf_sirens_voidbeam_desc:99 "$GIGA_EAWAF_GRAND_VOID_BEAM_DESC$"

  giga_tech_eawaf_disenchanter_1:99 "Contre-mesures Anti-Sirènes Précoces"
  giga_tech_eawaf_disenchanter_1_desc:99 "Bien que la nature profonde du chant mystérieux des Sirènes nous échappe encore, des études préliminaires suggèrent que le tir de décharges d'énergie focalisées à des fréquences spécifiques dans le quasi-espace peut atténuer certains effets du Champ de Discorde, au prix d'une augmentation drastique de l'entretien des vaisseaux sur lesquels ces mécanismes sont montés."

  giga_tech_eawaf_disenchanter_2:99 "Accordage du Désenchanteur"
  giga_tech_eawaf_disenchanter_2_desc:99 "Un accordage plus minutieux des mécanismes du Désenchanteur permet de contrer plus efficacement les effets néfastes du Champ de Discorde."

  giga_tech_eawaf_disenchanter_3:99 "Symphonies Subpsioniques"
  giga_tech_eawaf_disenchanter_3_desc:99 "Des percées dans notre compréhension du Champ de Discorde nous permettent d'émettre directement des contre-mélodies aux chants des Sirènes au sein de l'Immatériel lui-même, ce qui peut repousser même les effets de contrôle mental du néfaste Champ Intérieur."
  giga_tech_eawaf_disenchanter_3_effects:99 "Permet la capture des §YBases Stellaires§! et des §YPlanètes§! dans le §RChamp Intérieur§!."

  giga_tech_eawaf_disenchanter_4:99 "Dissipation Euphonique de la Discorde"
  giga_tech_eawaf_disenchanter_4_desc:99 "Notre compréhension du chant des Sirènes a maintenant progressé au point où nous pouvons confortablement annuler leur champ de contrôle mental à n'importe quelle échelle, bien qu'à un coût énergétique non négligeable."

  # Buildings
  building_giga_eawaf_psifusion_reactor:99 "Réacteur à Fusion Psicatalysée"
  building_giga_eawaf_psifusion_reactor_desc:99 "Ce complexe de réacteurs gargantuesque abrite une « étoile psionique » artificielle alimentée par une faille du Voile. Non seulement il produit d'énormes quantités d'énergie, mais il peut également être utilisé pour créer des éléments lourds et renforce l'efficacité des psioniques sur toute la planète."

  building_giga_eawaf_sirens_capital:99 "Panoptique Planétaire"
  building_giga_eawaf_sirens_capital_desc:99 "Un complexe colossal destiné à relayer la volonté des Sirènes à travers ce monde, afin d'assurer une efficacité sociétale et industrielle maximale."

  building_giga_eawaf_disenchanter_building_1:99 "Champ de Désenchantement Prototype"
  building_giga_eawaf_disenchanter_building_1_desc:99 "Un Désenchanteur à grande échelle capable d'annuler certains effets du Champ de Discorde sur ce monde. Réduit de moitié les pénalités du §PChamp Extérieur§!."

  building_giga_eawaf_disenchanter_building_2:99 "Champ de Désenchantement Harmonisé"
  building_giga_eawaf_disenchanter_building_2_desc:99 "Ce Champ de Désenchantement raffiné est non seulement capable de réduire drastiquement les effets du Champ de Discorde sur ce monde, mais le protège également de l'emprise du Champ Intérieur. Réduit au quart les effets du §PChamp Extérieur§! et protège contre le §RChamp Intérieur§!."

  # Jobs
  job_giga_eawaf_sirens_toiler:99 "Peineur Sirène"
  job_giga_eawaf_sirens_toiler_plural:99 "Peineurs Sirènes"
  job_giga_eawaf_sirens_toiler_desc:99 "Les Peineurs Sirènes travaillent jour et nuit pour produire les ressources nécessaires à alimenter la machine de guerre des Sirènes."
  mod_job_giga_eawaf_sirens_toiler_add:99 "Emplois de $job_giga_eawaf_sirens_toiler$"
  mod_job_giga_eawaf_sirens_toiler_per_pop:99 "Emplois de $job_giga_eawaf_sirens_toiler$ par Pop"

  job_giga_eawaf_sirens_naval:99 "Opérateur de Flotte Sirène"
  job_giga_eawaf_sirens_naval_plural:99 "Opérateurs de Flotte Sirènes"
  job_giga_eawaf_sirens_naval_desc:99 "Les Opérateurs de Flotte Sirènes sont chargés de gérer la logistique des armadas spatiales des Sirènes."
  mod_job_giga_eawaf_sirens_naval_add:99 "Emplois de $job_giga_eawaf_sirens_toiler$"
  mod_job_giga_eawaf_sirens_naval_per_pop:99 "Emplois de $job_giga_eawaf_sirens_naval$ par Pop"

  job_giga_eawaf_sirens_scientist:99 "Sciento-Économiste Sirène"
  job_giga_eawaf_sirens_scientist_plural:99 "Sciento-Économistes Sirènes"
  job_giga_eawaf_sirens_scientist_desc:99 "Les Sciento-Économistes sont l'échelon supérieur de la société Sirène. Composés des rares individus autorisés à rester non-envoûtés, leur travail est de trouver de nouvelles façons d'améliorer l'efficacité de la société des Sirènes ainsi que de repousser toujours plus loin les frontières de leur science."
  mod_job_giga_eawaf_sirens_scientist_add:99 "Emplois de $job_giga_eawaf_sirens_toiler$"
  mod_job_giga_eawaf_sirens_scientist_per_pop:99 "Emplois de $job_giga_eawaf_sirens_scientist$"

  job_giga_eawaf_sirens_strifer:99 "Semeur de Discorde Sirène"
  job_giga_eawaf_sirens_strifer_plural:99 "Semeurs de Discorde Sirènes"
  job_giga_eawaf_sirens_strifer_desc:99 "Les besoins des Sirènes exigent que certains individus restent dans un état perpétuel, mais contrôlé, de colère et de conflit les uns avec les autres, afin de continuer à générer un précieux filet de Discorde même au sein du Champ Intérieur parfaitement régulé."
  mod_job_giga_eawaf_sirens_strifer_add:99 "Emplois de $job_giga_eawaf_sirens_strifer$"
  mod_job_giga_eawaf_sirens_strifer_per_pop:99 "Emplois de $job_giga_eawaf_sirens_strifer$"

  # Situation
  situation_eawaf_sirens_takeover:99 "La Prise de Pouvoir des Sirènes"
  situation_eawaf_sirens_takeover_desc:99 "Un trio de « Sirènes » dotées de capacités de contrôle mental a entrepris d'imposer leur règne sur Faust. Elles sont manifestement déterminées à tout faire pour réussir dans cette entreprise intimidante. Il est probablement dans notre intérêt de garder un oeil attentif sur cette situation."
  situation_eawaf_sirens_takeover_type:99 "La Prise de Pouvoir des Sirènes"
  situation_eawaf_sirens_takeover_monthly_change_tooltip:99 ""

  approach_giga_eawaf_stop_sirens:99 "Arrêter les Sirènes"
  approach_giga_eawaf_stop_sirens_tooltip:99 "Nous ferons tout ce qui est en notre pouvoir pour stopper les Sirènes sans être vus. Assassinats secrets de leurs actifs clés, perturbation des lignes d'approvisionnement et renforcement des mouvements anti-Sirènes devraient freiner leur progression jusqu'à ce qu'elles soient submergées par leurs ennemis.\nCela augmentera les chances que les Sirènes tombent face à leurs ennemis à chaque étape de leur conquête.\n§RNous ne pouvons pas revenir en arrière une fois que nous avons commencé à arrêter les Sirènes.§!"

  approach_giga_eawaf_do_nothing:99 "Ne Rien Faire"
  approach_giga_eawaf_do_nothing_tooltip:99 "Contentons-nous de regarder les événements se dérouler. Nous avons des sujets plus pressants dont nous occuper.\n§YNous pouvons toujours changer d'avis plus tard.§!"

  approach_giga_eawaf_study_sirens:99 "Étudier les Sirènes"
  approach_giga_eawaf_study_sirens_tooltip:99 "Nous investirons des ressources et du personnel pour étudier les Sirènes et leurs méthodes de contrôle mental. Nous pourrions en apprendre beaucoup sur la véritable nature de la conscience et de l'esprit de cette façon.\n§YNous pouvons toujours changer d'avis plus tard.§!"

  approach_giga_eawaf_bolster_sirens:99 "Renforcer les Sirènes"
  approach_giga_eawaf_bolster_sirens_tooltip:99 "Nous aiderons secrètement les Sirènes dans leur prise de pouvoir. De cette façon, nous pourrons observer leur plein potentiel en action, nous apportant une mine de données précieuses.\n§GNous pouvons toujours changer d'avis plus tard, mais plus longtemps nous les renforçons, plus nous apprendrons.§!"

  situation_eawaf_sirens_takeover_effects:99 "Les Sirènes progresseront dans leur prise de contrôle de Faust."

  giga_eawaf_sirens_too_strong_tooltip:99 "Les Sirènes sont devenues trop puissantes pour que nous puissions nous y opposer secrètement. Nous devons soit les laisser faire, soit intervenir directement via une invasion terrestre potentiellement hasardeuse de Faust."


  situation_eawaf_sirens_understanding:99 "Contrer les Sirènes"
  situation_eawaf_sirens_understanding_desc:99 "Les Sirènes tentent de propager un « chant » de contrôle mental ésotérique à travers la galaxie entière. Nous devons trouver un moyen de contrer ce phénomène avant que nous ne tombions tous sous leur sortilège diabolique. Le coût en §YRecherche§! et §YUnité§! pour contrer les Sirènes évoluera en fonction de la §MPuissance§! du Champ. Si nous ne pouvons pas nous le permettre, nous reviendrons à §YAucune Étude des Sirènes§!."
  situation_eawaf_sirens_understanding_type:99 "Contrer les Sirènes"
  situation_eawaf_sirens_understanding_monthly_change_tooltip:99 ""

  approach_giga_eawaf_sirens_research_1:99 "Aucune Étude des Sirènes"
  approach_giga_eawaf_sirens_research_1_tooltip:99 "Ça passera."
  approach_giga_eawaf_sirens_research_2:99 "Études Anti-Sirènes Limitées"
  approach_giga_eawaf_sirens_research_2_tooltip:99 "Les Sirènes ne sont pas vraiment une priorité, mais investissons quand même un peu pour être sûrs."
  approach_giga_eawaf_sirens_research_3:99 "Études Anti-Sirènes Étendues"
  approach_giga_eawaf_sirens_research_3_tooltip:99 "Nous devons arrêter les Sirènes, alors investissons des ressources suffisantes pour cela."
  approach_giga_eawaf_sirens_research_4:99 "Études Anti-Sirènes Massives"
  approach_giga_eawaf_sirens_research_4_tooltip:99 "Les Sirènes doivent être arrêtées à tout prix ! Investissons tout ce que nous pouvons pour les contrer !"

  situation_eawaf_sirens_disenchanters_effect:99 "Nous améliorerons nos contre-mesures contre les Sirènes."
  giga_eawaf_has_sirens_secret:99 "Nos études précédentes des Sirènes renforcent nos contre-mesures !"

  giga_eawaf_disenchanter_research_cost_1:99 "Études Anti-Sirènes Limitées"
  giga_eawaf_disenchanter_research_cost_1_desc:99 "Les Sirènes ne sont pas vraiment une priorité, mais investissons quand même un peu pour être sûrs."

  giga_eawaf_disenchanter_research_cost_2:99 "Études Anti-Sirènes Étendues"
  giga_eawaf_disenchanter_research_cost_2_desc:99 "Nous devons arrêter les Sirènes, alors investissons des ressources suffisantes pour cela."

  giga_eawaf_disenchanter_research_cost_3:99 "Études Anti-Sirènes Massives"
  giga_eawaf_disenchanter_research_cost_3_desc:99 "Les Sirènes doivent être arrêtées à tout prix ! Investissons tout ce que nous pouvons pour les contrer !"

