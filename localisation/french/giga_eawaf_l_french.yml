  # Megastructures
  giga_eawaf_sirens_megaphone_1:0 "Envoûteur voilosonique"
  giga_eawaf_sirens_megaphone_1_DESC:0 "Une mégastructure ésotérique capable d'amplifier et de relayer un puissant « chant » de contrôle mental à travers le Voile pour envoûter des systèmes entiers à des distances interstellaires."

  anti_sirens_shield:0 "Grand rempart symphonieux"
  anti_sirens_shield_DESC:0 "Un Désenchanteur à échelle supérieure protégeant ce système entier de tous les effets causés par le Champ de discorde des Sirènes. Annule complètement le §PChamp extérieur§! et le §RChamp intérieur§!."
  anti_sirens_shield_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$ - $giga_list_category_miscellaneous$\nProtège complètement un système entier contre le §YChamp de discorde§!.\n§LUn Désenchanteur à échelle supérieure protégeant ce système entier de tous les effets causés par le Champ de discorde des Sirènes§!"



  anti_sirens_shield_dismantle:0 "Démanteler le rempart"
  anti_sirens_shield_dismantle_DESC:0 "Nous n'avons plus besoin de ce rempart. Démantelons-le."

  # Messages
  STRIFE_FIELD_ABOUT_TO_SHRINK_TITLE:0 "Le champ de discorde sur le point de reculer"
  STRIFE_FIELD_ABOUT_TO_SHRINK_DESC:0 "Le §RChamp de discorde§! n'a pas assez de Discorde pour maintenir sa taille actuelle. Sa §MPortée§! diminuera de §Y1§! dans §Y6 mois§!."

  STRIFE_FIELD_SHRINKING_TITLE:0 "Le champ de discorde recule"
  STRIFE_FIELD_SHRINKING_DESC:0 "Le §RChamp de discorde§! n'a pas assez de Discorde pour maintenir sa taille actuelle. Sa §MPortée§! a diminué de §Y1§!.\nLa portée du $outer_strife_field_name$ est maintenant de §Y[giga_eawaf_country.giga_eawaf_outer_strife_field_range]§! tandis que celle du $inner_strife_field_name$ est maintenant de §Y[giga_eawaf_country.giga_eawaf_inner_strife_field_range]§!."

  STRIFE_FIELD_ABOUT_TO_GROW_TITLE:0 "Le champ de discorde sur le point de s'étendre"
  STRIFE_FIELD_ABOUT_TO_GROW_DESC:0 "Le §RChamp de discorde§! a assez de Discorde pour étendre ses limites. Sa §MPortée§! augmentera de §Y1§! dans §Y6 mois§!."

  STRIFE_FIELD_GROWING_TITLE:0 "Le champ de discorde s'étend"
  STRIFE_FIELD_GROWING_DESC:0 "Le §RChamp de discorde§! a assez de Discorde pour étendre ses limites. Sa §MPortée§! a augmenté de §Y1§!.\nLa portée du $outer_strife_field_name$ est maintenant de §Y[giga_eawaf_country.giga_eawaf_outer_strife_field_range]§! tandis que celle du $inner_strife_field_name$ est maintenant de §Y[giga_eawaf_country.giga_eawaf_inner_strife_field_range]§!."

  SIRENS_SWAPPING_LEADER_TITLE:0 "Changement de dirigeante des Sirènes"
  SIRENS_SWAPPING_LEADER_DESC_ARIA:0 "Les §RSirènes§! sont maintenant dirigées par §MAria Blaze§!.\nElle fournit des bonus à la §YPrécision§!, au §YTracking§! et à la §YVitesse§! des vaisseaux !"
  SIRENS_SWAPPING_LEADER_DESC_SONATA:0 "Les §RSirènes§! sont maintenant dirigées par §BSonata Dusk§!.\nElle fournit des bonus à la §YVitesse de construction de mégastructures§! et à la §YProduction de matériel de guerre§!."
  SIRENS_SWAPPING_LEADER_DESC_ADAGIO:0 "Les §RSirènes§! sont maintenant dirigées par §HAdagio Dazzle§!.\nElle fournit des bonus aux §YDégâts§! et à la §YPortée§! des vaisseaux !"

  SIRENS_MEGAPHONE_UPGRADED_TITLE:0 "Envoûteur voilosonique amélioré"
  SIRENS_MEGAPHONE_UPGRADED_DESC:0 "L'§YEnvoûteur voilosonique§! a été amélioré au niveau §Y[giga_eawaf_country.giga_eawaf_sirens_megaphone_level]§!. Sa §MPuissance§! est maintenant égale à §Y[giga_eawaf_country.giga_eawaf_field_potency_multiplier]§!, ce qui échelonnera les malus du §PChamp extérieur§! et les pénalités d'entretien du §YDésenchanteur§!."


  # Names
  inner_strife_field_name:0 "§RChamp de discorde intérieur§!"
  outer_strife_field_name:0 "§PChamp de discorde extérieur§!"
  NAME_Giga_Eawaf_Sirens_Megaphone:0 "Envoûteur voilosonique — Marque [giga_eawaf_country.giga_eawaf_sirens_megaphone_level]"

  # Components
  GIGA_EAWAF_DISENCHANTER_1:0 "Désenchanteur prototype"
  GIGA_EAWAF_DISENCHANTER_1_DESC:0 "Une version précoce d'un appareil capable de contrer le chant envoûtant des Sirènes en émettant un bruit énergétique spécifiquement accordé autour du vaisseau. Ces prototypes sont malheureusement coûteux et extrêmement gourmands en énergie, nécessitant un apport significatif d'énergie et de matériel externes pour les faire fonctionner."

  GIGA_EAWAF_DISENCHANTER_2:0 "Désenchanteur accordé"
  GIGA_EAWAF_DISENCHANTER_2_DESC:0 "Ce Désenchanteur amélioré et rationalisé s'appuie sur les prototypes précédents pour contrer plus efficacement le chant des Sirènes par un bruit énergétique. Bien qu'ils n'entravent pas autant le mouvement du vaisseau, la complexité même impliquée dans la génération du bruit psionique juste entraîne des exigences logistiques toujours croissantes à mesure que ces appareils mûrissent."

  GIGA_EAWAF_DISENCHANTER_3:0 "Désenchanteur symphonieux"
  GIGA_EAWAF_DISENCHANTER_3_DESC:0 "La sophistication continue des Désenchanteurs non seulement annule le Champ extérieur, mais permet enfin à ces nouveaux designs de s'aventurer dans le Champ intérieur des Sirènes. Les coûts de maintenance continuent cependant d'augmenter."

  GIGA_EAWAF_DISENCHANTER_4:0 "Désenchanteur euphonique"
  GIGA_EAWAF_DISENCHANTER_4_DESC:0 "Ce design parfait de Désenchanteur permet à nos vaisseaux de contrer complètement les effets du chant envoûtant des Sirènes, les rendant essentiellement immunisés à tout ce que les Sirènes pourraient nous lancer. Cela s'accompagne malheureusement de l'inconvénient de coûts gargantuesques nécessaires pour maintenir ces appareils dans les profondeurs du Champ de discorde."

  GIGA_EAWAF_ENTHRALLING_BEAM:0 "Rayon envoûtant"

  GIGA_EAWAF_PANOPTICON_AURA:0 "Mini-champ de discorde"

  GIGA_EAWAF_GRAND_VOID_BEAM:0 "Grand rayon du vide"
  GIGA_EAWAF_GRAND_VOID_BEAM_DESC:0 "Ce rayon gargantuesque a l'effet intéressant de maximiser psioniquement l'entropie de sa cible, le rendant très efficace contre les systèmes de boucliers."

  GIGA_EAWAF_CRYSTAL_IMPACTOR:0 "Impacteur cristallin"
  GIGA_EAWAF_CRYSTAL_IMPACTOR_DESC:0 "L'Impacteur cristallin s'appuie sur des cristaux thaumaturgiques imprégnés d'une sentience partielle afin de produire des projectiles guidés dévastateurs à des vitesses extrêmement élevées destinés à endommager et pénétrer le blindage."

  GIGA_EAWAF_CRYSTAL_ARTILLERY:0 "Artillerie cristalline"
  GIGA_EAWAF_CRYSTAL_ARTILLERY_DESC:0 "Ces artilleries tirent de gros projectiles cristallins imprégnés d'énergie psionique excédentaire les rendant quelque peu instables et donc très efficaces contre les défenses ennemies générales."

  GIGA_EAWAF_CRYSTAL_AUTOCANNON:0 "Autocanon cristallin"
  GIGA_EAWAF_CRYSTAL_AUTOCANNON_DESC:0 "Ces autocanons pulvérisent une rafale de cristaux thaumaturgiques tranchants comme des rasoirs qui, bien qu'ils peinent à percer le blindage épais et soient généralement stoppés net par les boucliers, peuvent absolument dévaster la coque plus fragile des vaisseaux stellaires énergétiques si elle se trouve exposée."

  GIGA_EAWAF_STRIKE_CRAFT:0 "Leurres de harcèlement"
  GIGA_EAWAF_STRIKE_CRAFT_DESC:0 "Au lieu d'être des chasseurs d'assaut plus conventionnels, ces chasseurs à haute résistance n'existent que pour submerger, harceler et désorienter les chasseurs ennemis et les systèmes de défense ponctuelle, aidant ainsi nos autres armes à infliger plus de dégâts."

  GIGA_EAWAF_PSIONIC_CHARGE:0 "Charge thaumaturgique"
  GIGA_EAWAF_PSIONIC_CHARGE_DESC:0 "Ce design de missile peu orthodoxe repose sur une boule de cristaux thaumaturgiques chargés lancée à travers le vide de l'espace. Guidée par une sentience partielle ne souhaitant que la destruction de ses adversaires, elle peut se faufiler à travers boucliers et blindage pour causer un carnage maximum sur ses ennemis détestés."

  GIGA_EAWAF_KAMIKAZE:0 "Foreuse cristalline"

  weapon_type_sirens:0 "Thaumaturgique"

