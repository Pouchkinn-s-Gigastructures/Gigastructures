  sc_giga_eawaf_faust_shroud:99 "Voile Éthéré"

  # Megastructures
  giga_eawaf_sirens_megaphone_1:99 "Envoûteur Voilesonique"
  giga_eawaf_sirens_megaphone_1_DESC:99 "Une mégastructure ésotérique capable d'amplifier et de relayer un puissant « chant » de contrôle mental à travers le Voile pour envoûter des systèmes entiers à travers les distances interstellaires."

  anti_sirens_shield:99 "Grand Rempart Symphonique"
  anti_sirens_shield_DESC:99 "Un Désenchanteur à super-échelle protégeant ce système entier de tous les effets causés par le Champ de Discorde des Sirènes. Annule complètement le §PChamp Extérieur§! et le §RChamp Intérieur§!."
  anti_sirens_shield_MEGASTRUCTURE_DETAILS:99 "$giga_list_category_kilostructure$ - $giga_list_category_miscellaneous$\nProtège complètement un système entier contre le §YChamp de Discorde§!.\n§LUn Désenchanteur à super-échelle protégeant ce système entier de tous les effets causés par le Champ de Discorde des Sirènes§!"



  anti_sirens_shield_dismantle:99 "Démanteler le Rempart"
  anti_sirens_shield_dismantle_DESC:99 "Nous n'avons plus besoin de ce rempart. Démantelons-le."

  # Messages
  STRIFE_FIELD_ABOUT_TO_SHRINK_TITLE:99 "Le Champ de Discorde va Rétrécir"
  STRIFE_FIELD_ABOUT_TO_SHRINK_DESC:99 "Le §RChamp de Discorde§! n'a pas assez de Discorde pour maintenir sa taille actuelle. Sa §MPortée§! diminuera de §Y1§! dans §Y6 mois§!."

  STRIFE_FIELD_SHRINKING_TITLE:99 "Rétraction du Champ de Discorde"
  STRIFE_FIELD_SHRINKING_DESC:99 "Le §RChamp de Discorde§! n'a pas assez de Discorde pour maintenir sa taille actuelle. Sa §MPortée§! a diminué de §Y1§!.\nLa portée du $outer_strife_field_name$ est maintenant de §Y[giga_eawaf_country.giga_eawaf_outer_strife_field_range]§! tandis que la portée du $inner_strife_field_name$ est maintenant de §Y[giga_eawaf_country.giga_eawaf_inner_strife_field_range]§!."

  STRIFE_FIELD_ABOUT_TO_GROW_TITLE:99 "Le Champ de Discorde va S'étendre"
  STRIFE_FIELD_ABOUT_TO_GROW_DESC:99 "Le §RChamp de Discorde§! a suffisamment de Discorde pour étendre ses limites. Sa §MPortée§! augmentera de §Y1§! dans §Y6 mois§!."

  STRIFE_FIELD_GROWING_TITLE:99 "Expansion du Champ de Discorde"
  STRIFE_FIELD_GROWING_DESC:99 "Le §RChamp de Discorde§! a suffisamment de Discorde pour étendre ses limites. Sa §MPortée§! a augmenté de §Y1§!.\nLa portée du $outer_strife_field_name$ est maintenant de §Y[giga_eawaf_country.giga_eawaf_outer_strife_field_range]§! tandis que la portée du $inner_strife_field_name$ est maintenant de §Y[giga_eawaf_country.giga_eawaf_inner_strife_field_range]§!."

  SIRENS_SWAPPING_LEADER_TITLE:99 "Changement de Dirigeante des Sirènes"
  SIRENS_SWAPPING_LEADER_DESC_ARIA:99 "Les §RSirènes§! sont maintenant dirigées par §MAria Blaze§!.\nElle fournit des bonus à la §YPrécision§!, au §YTracking§! et à la §YVitesse§! des vaisseaux !"
  SIRENS_SWAPPING_LEADER_DESC_SONATA:99 "Les §RSirènes§! sont maintenant dirigées par §BSonata Dusk§!.\nElle fournit des bonus à la §YVitesse de Construction des Mégastructures§! et à la §YProduction de Matériel de Guerre§!."
  SIRENS_SWAPPING_LEADER_DESC_ADAGIO:99 "Les §RSirènes§! sont maintenant dirigées par §HAdagio Dazzle§!.\nElle fournit des bonus aux §YDégâts§! et à la §YPortée§! des vaisseaux."

  SIRENS_MEGAPHONE_UPGRADED_TITLE:99 "Envoûteur Voilesonique Amélioré"
  SIRENS_MEGAPHONE_UPGRADED_DESC:99 "L'§YEnvoûteur Voilesonique§! a été amélioré au niveau §Y[giga_eawaf_country.giga_eawaf_sirens_megaphone_level]§!. Sa §MPuissance§! est maintenant égale à §Y[giga_eawaf_country.giga_eawaf_field_potency_multiplier]§!, ce qui fera évoluer les malus du §PChamp Extérieur§! et les pénalités d'entretien du §YDésenchanteur§!."


  # Names
  inner_strife_field_name:99 "§RChamp de Discorde Intérieur§!"
  outer_strife_field_name:99 "§PChamp de Discorde Extérieur§!"
  NAME_Giga_Eawaf_Sirens_Megaphone:99 "Envoûteur Voilesonique - Mk [giga_eawaf_country.giga_eawaf_sirens_megaphone_level]"

  # Components
  GIGA_EAWAF_DISENCHANTER_1:99 "Désenchanteur Prototype"
  GIGA_EAWAF_DISENCHANTER_1_DESC:99 "Une version précoce d'un dispositif capable de contrer le chant envoûtant des Sirènes en émettant un bruit énergétique spécifiquement accordé autour du vaisseau. Ces prototypes sont malheureusement coûteux et extrêmement gourmands en énergie, nécessitant un apport important d'énergie et de matériel externe pour continuer à fonctionner."

  GIGA_EAWAF_DISENCHANTER_2:99 "Désenchanteur Accordé"
  GIGA_EAWAF_DISENCHANTER_2_DESC:99 "Ce Désenchanteur amélioré et rationalisé s'appuie sur les prototypes précédents pour contrer plus efficacement le chant des Sirènes grâce au bruit énergétique. Bien qu'ils n'entravent pas autant le mouvement du vaisseau, la complexité considérable impliquée dans la génération du bon bruit psionique entraîne des besoins logistiques toujours croissants à mesure que ces dispositifs mûrissent."

  GIGA_EAWAF_DISENCHANTER_3:99 "Désenchanteur Symphonique"
  GIGA_EAWAF_DISENCHANTER_3_DESC:99 "La sophistication continue des Désenchanteurs non seulement annule le Champ Extérieur, mais permet enfin à ces nouveaux designs de s'aventurer dans le Champ Intérieur des Sirènes. Les coûts de maintenance continuent cependant d'augmenter."

  GIGA_EAWAF_DISENCHANTER_4:99 "Désenchanteur Euphonique"
  GIGA_EAWAF_DISENCHANTER_4_DESC:99 "Ce design de Désenchanteur parfait permet à nos vaisseaux de contrer complètement les effets du chant envoûtant des Sirènes, les rendant essentiellement immunisés à tout ce que les Sirènes pourraient leur opposer. Cela s'accompagne malheureusement de l'inconvénient de coûts gargantuesque requis pour maintenir ces dispositifs au coeur du Champ de Discorde."

  GIGA_EAWAF_ENTHRALLING_BEAM:99 "Rayon d'Envoûtement"

  GIGA_EAWAF_PANOPTICON_AURA:99 "Mini-Champ de Discorde"

  GIGA_EAWAF_GRAND_VOID_BEAM:99 "Grand Rayon du Néant"
  GIGA_EAWAF_GRAND_VOID_BEAM_DESC:99 "Ce rayon gargantuesque a l'effet intéressant de maximiser psioniquement l'entropie de sa cible, le rendant très efficace contre les systèmes de bouclier."

  GIGA_EAWAF_CRYSTAL_IMPACTOR:99 "Impacteur Cristallin"
  GIGA_EAWAF_CRYSTAL_IMPACTOR_DESC:99 "L'Impacteur Cristallin s'appuie sur des cristaux thaumaturgiques imprégnés d'une sentience partielle afin de produire des projectiles dévastateurs à recherche de cible à des vitesses extrêmement élevées, destinés à endommager et pénétrer le blindage."

  GIGA_EAWAF_CRYSTAL_ARTILLERY:99 "Artillerie Cristalline"
  GIGA_EAWAF_CRYSTAL_ARTILLERY_DESC:99 "Ces pièces d'artillerie tirent de gros projectiles cristallins imprégnés d'un excès d'énergie psionique les rendant quelque peu instables et donc très efficaces contre les défenses ennemies générales."

  GIGA_EAWAF_CRYSTAL_AUTOCANNON:99 "Autocanon Cristallin"
  GIGA_EAWAF_CRYSTAL_AUTOCANNON_DESC:99 "Ces autocanons projettent une pluie de cristaux thaumaturgiques tranchants comme des rasoirs qui, bien qu'ils peinent à perforer un blindage épais et soient généralement arrêtés net par les boucliers, peuvent absolument dévaster la coque plus fragile des vaisseaux stellaires à énergie si elle se trouve exposée."

  GIGA_EAWAF_STRIKE_CRAFT:99 "Leurres de Harcèlement"
  GIGA_EAWAF_STRIKE_CRAFT_DESC:99 "Plutôt que d'être des chasseurs d'assaut plus conventionnels, ces chasseurs à haute santé n'existent que pour submerger, harceler et désorienter les chasseurs ennemis et les systèmes de défense ponctuelle, aidant ainsi nos autres armes à infliger plus de dégâts."

  GIGA_EAWAF_PSIONIC_CHARGE:99 "Charge Thaumaturgique"
  GIGA_EAWAF_PSIONIC_CHARGE_DESC:99 "Ce design de missile non conventionnel repose sur une boule de cristaux thaumaturgiques chargés projetée à travers le vide de l'espace. Guidée par une sentience partielle ne souhaitant que la destruction de ses adversaires, elle peut traverser boucliers et blindages pour causer un maximum de carnage parmi ses ennemis détestés."

  GIGA_EAWAF_KAMIKAZE:99 "Foreuse Cristalline"

  weapon_type_sirens:99 "Thaumaturgique"

