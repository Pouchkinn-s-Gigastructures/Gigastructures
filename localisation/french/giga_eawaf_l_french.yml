  # EVENTS

  # Point the player towards Faust
  giga_eawaf.1001.name:99 "L'étoile clignotante"
  giga_eawaf.1001.desc:99 "Depuis que notre espèce a commencé à cartographier les étoiles — d'abord à l'aide de télescopes optiques primitifs, puis via des satellites orbitaux, et maintenant avec des émetteurs tachyoniques — il y a toujours eu un certain nombre de systèmes se comportant de manière inattendue.\n\nLes causes les plus fréquentes de confusion parmi nos astronomes étaient généralement des variations de luminosité stellaire et des schémas de transit d'exoplanètes irréguliers, mais à mesure que notre compréhension de la physique s'est développée, ces mystères ont pu être correctement évalués, analysés et résolus. La plupart du temps, ils se sont révélés n'être guère plus que de simples mesures erronées de nos télescopes primitifs, et dans les cas restants, l'étude de ces phénomènes nous a permis d'approfondir notre compréhension des exoplanètes et du comportement stellaire.\n\nPourtant, malgré l'amélioration continue de nos télescopes et notre compréhension toujours croissante du cosmos, un système en particulier continue de défier totalement tous les modèles d'astrophysique — l'étoile mystérieuse appelée §YFaust§!. Bien qu'elle puisse à première vue ressembler à une étoile ordinaire — quoique peu lumineuse —, quiconque passe plus de quelques heures à observer le système remarquera que l'étoile semble simplement... disparaître, avant de réapparaître environ douze heures plus tard, et de disparaître à nouveau douze heures après.\n\nSurnommée « l'étoile clignotante » par nos astronomes, aucune théorie n'a réussi à expliquer la disparition régulière de l'étoile et il est devenu évident que le seul moyen de percer ce mystère serait de s'y rendre nous-mêmes. Heureusement, avec la récente découverte du voyage supraluminique, une telle investigation directe est enfin dans le domaine du possible, et la perspective de résoudre enfin ce mystère fait déjà vibrer toute notre communauté scientifique d'enthousiasme."
  giga_eawaf.1001.a:99 "Mettons-nous au travail, alors."
  giga_eawaf.1001.a.tooltip:99 "§BCe système et tout ce qui s'y rapporte font partie de la collaboration §YPoisson d'avril 2024§! avec le mod §YEquestria at War§! pour HOI4 ! Si, pour une raison quelconque, vous ne souhaitez pas participer à cette chaîne d'événements, le système peut être désactivé via le Gigamenu, mais je vous recommande de lui donner une chance !§!"

  giga_eawaf_faust_chain_title:99 "Mystères de Faust"
  giga_eawaf_faust_chain_desc:99 "Le système Faust défie toute logique. Il est primordial que nous l'investiguions davantage !"

  giga_eawaf_sirens_chain_title:99 "Sirenalia"
  giga_eawaf_sirens_chain_desc:99 "Les Sirènes sont déterminées à asservir toute la galaxie. Elles doivent être arrêtées !"

  giga_eawaf_faust_name:99 "L'étoile clignotante"
  giga_eawaf_faust_desc:99 "Le système Faust « clignote » — alternant entre visible et invisible à des intervalles d'environ douze heures. Il est évident que le seul moyen d'élucider ce mystère sera simplement de s'y rendre nous-mêmes."

  giga_eawaf_poi_sirens_stats_name:99 "Traquer les Sirènes"
  giga_eawaf_poi_sirens_stats_desc:99 "§RDiscorde totale§! - [giga_eawaf_country.giga_eawaf_total_strife]\nLes Sirènes se nourrissent et prospèrent grâce à la §RDiscorde§! — la « manifestation » de la haine et du mépris. Toutes les planètes situées dans le §PChamp extérieur§! généreront de la §RDiscorde§! en fonction de la §YPopulation§!, de la §YCriminalité§! et de la §YStabilité§!, les deux dernières étant pénalisées par le §PChamp extérieur§!.\n\n§MNiveau de portée du champ de discorde§! - [giga_eawaf_country.giga_eawaf_outer_strife_field_range_level]\n§RPortée du champ de discorde intérieur§! - [giga_eawaf_country.giga_eawaf_inner_strife_field_range]\n§PPortée du champ de discorde extérieur§! - [giga_eawaf_country.giga_eawaf_outer_strife_field_range]\n§YSeuil de discorde avant expansion du champ§! - [giga_eawaf_country.giga_eawaf_strife_field_range_next_level_cost]\n§YSeuil de discorde avant recul du champ§! - [giga_eawaf_country.giga_eawaf_strife_field_range_prev_level_cost]\nPlus les Sirènes ont de §RDiscorde§!, plus leur sortilège portera loin. Le champ reculera cependant si les Sirènes ne reçoivent pas assez de §RDiscorde§! pour le maintenir. Il ne peut changer de taille qu'une fois tous les §Y2,5 ans§!.\n\n\n§MPuissance du champ de discorde§! - [giga_eawaf_country.giga_eawaf_field_potency_multiplier]\nPlus la puissance du champ est élevée, plus les malus qu'il inflige aux vaisseaux et aux planètes seront importants.\n\n§Y['concept_giga_eawaf_war_materials'] actuels§! - [giga_eawaf_country.giga_eawaf_sirens_warmaterial_count]\n§YNiveau de l'Envoûteur linceulsonique§! - [giga_eawaf_country.giga_eawaf_sirens_megaphone_level] \n§YCoût du niveau suivant de l'Envoûteur linceulsonique§! - [giga_eawaf_country.giga_eawaf_sirens_megaphone_next_level_cost]\nCes matériaux représentent les stocks de ressources avancées des Sirènes, générés par leur population sur les mondes conquis. Ils sont utilisés pour fabriquer des vaisseaux et améliorer l'§YEnvoûteur linceulsonique§! pour intensifier ses effets, augmentant les malus qu'il applique aux planètes et aux vaisseaux à portée."

  # Initial survey line
  giga_eawaf.1010.name:99 "Géocentrique"
  giga_eawaf.1010.desc:99 "Le §Y[ROOT.GetName]§! a atteint le système §YFaust§!, dans l'espoir d'apporter la solution au mystérieux phénomène de « l'étoile clignotante » qui a déconcerté astronomes et scientifiques pendant des siècles.\n\nEt, dans un ironique coup du sort, cette solution ne résidait pas dans nos théories les plus avancées, mais plutôt dans la toute première — et erronée — interprétation de l'espace que notre espèce avait conçue pour expliquer le mouvement des étoiles dans les cieux — le géocentrisme.\n\nLe système §YFaust§! est, d'une manière ou d'une autre, centré autour de Faust elle-même, un monde tellurique autour duquel plusieurs planètes plus petites (ou lunes) orbitent aux côtés de rien de moins qu'un soleil miniature fournissant chaleur et lumière à Faust.\n\nLes mesures des émissions spectrales de l'étoile montrent qu'elle se comporte plus ou moins comme une étoile de classe G typique, bien que son diamètre ne dépasse pas trois mille kilomètres. Avec une telle taille, elle devrait logiquement être soit une étoile à neutrons, soit guère plus qu'une géante gazeuse, et pourtant... la voilà, orbitant consciencieusement autour de Faust en vingt-quatre heures, passant derrière la planète toutes les douze heures et disparaissant de la vue avant de réapparaître de l'autre côté.\n\nBien que le mystère de « l'étoile clignotante » soit enfin résolu, il semble qu'il y aura encore beaucoup de travail avant que nous ayons vraiment une idée de ce qui se passe dans cet étrange système."
  #giga_flavor_systems.2000.desc:99 "One of our vessels exploring the §YBehemoth§! system has stumbled upon a truly physics-defying planetary system.\n\nOrbiting around the system's central Brown Dwarf is a peculiar continental world, which, by all accounts, should not be habitable due the Brown Dwarf's low energy output. However, somehow, a miniature sun-like celestial body orbits in close proximity to said world, providing it with sufficient heat and energy to sustain a stable hydrosphere and life on its surface.\n\nFurthermore, several intelligent species have evolved on the planet, which developed into a myriad of primitive nationstates currently undergoing widespread industrialization.\n\nInterestingly enough, the planet itself is unusually rich in crystalline materials and the primitives have figured out ingenious ways of integrating these materials into their technology and weaponry, leading to the development of unusually powerful armed forces for such an early civilization. The planet's ecosystem itself is stunningly diverse, harboring a plethora of exotic and esoteric species that seemingly defy our understanding of evolution and biology as a whole.\n\nThere is no doubt that this entire planetary system goes against most of our current knowledge regarding the development of habitable worlds and studying it would surely represent an incredible opportunity to further develop our scientific base." #pre-April Fool's expansion version
  giga_eawaf.1010.a:99 "Comme c'est particulier."

  giga_eawaf.1011.name:99 "Cristaux thaumaturgiques"
  giga_eawaf.1011.desc:99 "La ceinture d'astéroïdes orbitant autour de Faust est remplie de nombreux affleurements d'étranges cristaux violet-rose contrairement à tout ce que nous avons rencontré auparavant.\n\nLes premières expériences indiquent que des échantillons de ces cristaux « stockent » une forme d'énergie éthérée au sein de leurs matrices moléculaires, qui peut ensuite être « libérée » en impulsant des stimuli spécifiques dans les cristaux, souvent avec des résultats destructeurs.\n\nTout espoir d'utiliser cela dans nos armes et systèmes énergétiques a cependant été anéanti lorsque toutes les tentatives de sortir les cristaux du système Faust ont entraîné la dissipation spontanée de cette charge innée et la fragmentation des cristaux en de nombreux jolis, mais inutiles, morceaux de roche.\n\nIl est évident qu'il existe une propriété innée au système Faust qui « alimente » ces cristaux en énergie, mais l'origine réelle de cette énergie échappe jusqu'à présent complètement à nos scientifiques."
  giga_eawaf.1011.a:99 "Curieux."

  giga_eawaf.1012.name:99 "Satellite cauchemardesque"
  giga_eawaf.1012.desc:99 "§YSélène§!, la lune rocheuse orbitant autour de Faust à l'opposé du mystérieux §YHélios§!, semble, à première vue, être la partie la plus normale du système Faust. C'est une lune rocheuse relativement grande criblée de nombreux cratères d'impact en raison de son absence d'atmosphère et couverte d'une fine couche de poussière lunaire, comme beaucoup d'autres satellites naturels.\n\nLes premiers signes d'anormalité sont ironiquement apparus lorsque l'équipage du §Y[ROOT.GetName]§! a commencé à se reposer. Dès qu'ils se sont approchés de la lune, les rêves habituellement agréables de l'équipage ont commencé à se transformer en atroces cauchemars, la plupart d'entre eux rapportant avoir été visités dans leur sommeil par une silhouette équine sombre et imposante, porteuse de promesses de vengeance et de ténèbres éternelles engloutissant des mondes entiers.\n\nBien que ces cauchemars aient cessé dès que le vaisseau s'est éloigné de la lune, beaucoup croient maintenant que le corps céleste est « hanté » par un esprit vengeur inconnu, et [Owner.GetScientist] §Y[ROOT.GetLeaderName]§! semble avoir été profondément affecté par ces terreurs nocturnes..."
  giga_eawaf.1012.desc_machine_intelligence:99 "§YSélène§!, la lune rocheuse orbitant autour de Faust à l'opposé du mystérieux §YHélios§!, semble, à première vue, être la partie la plus normale du système Faust. C'est une lune rocheuse relativement grande criblée de nombreux cratères d'impact en raison de son absence d'atmosphère et couverte d'une fine couche de poussière lunaire, comme beaucoup d'autres satellites naturels.\n\nLes premiers signes d'anormalité sont ironiquement apparus lorsque l'équipage du §Y[ROOT.GetName]§! s'est approché de la lune. Ils ont commencé à se comporter de manière erratique et ont signalé des artefacts visuels apparaissant sous la forme d'une silhouette équine sombre et imposante.\n\nBien que ces erreurs visuelles aient cessé dès que le vaisseau s'est éloigné de la lune, on pense que le corps céleste pourrait être « hanté » par un esprit vengeur inconnu."
  giga_eawaf.1012.desc_hive_mind:99 "§YSélène§!, la lune rocheuse orbitant autour de Faust à l'opposé du mystérieux §YHélios§!, semble, à première vue, être la partie la plus normale du système Faust. C'est une lune rocheuse relativement grande criblée de nombreux cratères d'impact en raison de son absence d'atmosphère et couverte d'une fine couche de poussière lunaire, comme beaucoup d'autres satellites naturels.\n\nLes premiers signes d'anormalité sont ironiquement apparus lorsque l'équipage du §Y[ROOT.GetName]§! s'est approché de la lune. Ils ont commencé à se comporter de manière erratique et ont signalé des hallucinations apparaissant sous la forme d'une silhouette équine sombre et imposante.\n\nBien que ces visions aient cessé dès que le vaisseau s'est éloigné de la lune, on pense que le corps céleste pourrait être « hanté » par un esprit vengeur inconnu."
  giga_eawaf.1012.a:99 "C'est dans leur tête... n'est-ce pas ?"
  giga_eawaf.1012.b:99 "Déconcertant"
  giga_eawaf.1012.c:99 "Cela n'augure rien de bon."

  giga_eawaf.1013.name:99 "Soleil improbable"
  giga_eawaf.1013.desc:99 "On espérait qu'une inspection plus approfondie d'§YHélios§! pourrait éclaircir ce mystérieux corps céleste, et pourtant il continue de se comporter de manière apparemment impossible.\n\nTout d'abord, les périodes orbitales d'Hélios et de Sélène de vingt-quatre heures sont bien plus courtes que ce qu'elles devraient être, les calculs basés sur la masse de Faust estimant qu'elles devraient logiquement prendre environ deux semaines pour orbiter autour de la planète.\n\nDe plus, bien que leurs orbites restent circulaires et prévisibles, les deux corps sont sujets à des « tremblements » quasi imperceptibles à des points apparemment aléatoires le long de leurs orbites, comme s'ils étaient soudainement « tirés » par une force inexpliquée.\n\nÉvidemment, s'attendre à ce que les orbites fonctionnent normalement dans un système où les étoiles tournent autour des planètes est déjà assez déraisonnable, mais ces anomalies ne font qu'ajouter à la pile toujours croissante de mystères non résolus entourant Faust.\n\nDe plus, l'étoile semble puiser de l'énergie de nulle part, car elle émet bien plus de rayonnement que n'importe quel processus de fusion connu ne pourrait jamais générer, violant dans certains cas le principe fondamental d'équivalence masse-énergie."
  giga_eawaf.1013.a:99 "Mais comment ça FONCTIONNE ?"

  giga_eawaf.1014.name:99 "Équidés en guerre"
  giga_eawaf.1014.desc:99 "Comme si le système n'était pas déjà assez particulier, non seulement le monde central de §YFaust§! est parfaitement habitable grâce à la lumière d'Hélios, mais une multitude d'émissions radio émanant de sa surface trahit le fait que le monde est, en fait, habité !\n\nLa planète est partagée par environ une douzaine d'espèces, toutes pleinement sapientes et capables de pensée complexe, qui ont atteint un niveau de développement technologique à peu près équivalent à l'ère des machines. Cependant, beaucoup de ces espèces, notamment les plus équines, affichent une variété de capacités surnaturelles, telles qu'une agriculture ridiculement efficace, le vol ou la télékinésie, pour n'en citer que quelques-unes.\n\nD'importants gisements des cristaux thaumaturgiques trouvés dans la ceinture d'astéroïdes du système ont également été localisés à travers le monde, certaines de ses espèces indigènes en faisant un usage significatif afin de renforcer et catalyser leurs capacités naturelles. Cela a conduit nos scientifiques à croire que les cristaux et ces capacités sont liés d'une manière ou d'une autre.\n\nFait intéressant, nous pourrions arriver juste à temps pour assister à un tournant dans l'histoire de la planète, car plusieurs espèces atteignent le point où les développements des méthodes expérimentales devraient leur permettre d'augmenter considérablement leur propre compréhension de leurs capacités et des cristaux. Cela est susceptible d'avoir des conséquences considérables et pourrait modifier drastiquement leur développement technologique.\n\nLe §Y[ROOT.GetName]§! rapporte qu'une petite équipe a été déployée à la surface afin d'obtenir, espérons-le, plus d'informations sur le fonctionnement de cette civilisation multi-espèces particulière avant qu'un poste d'observation plus permanent ne soit établi."
  giga_eawaf.1014.a:99 "Maintenant, espérons qu'ils ne se fassent pas exploser."

  giga_eawaf.10141.name:99 "Rapport d'investigation sur Faust"
  giga_eawaf.10141.desc:99 "Notre expédition à la surface de §YFaust§! s'est déroulée sans problème majeur, tout en rapportant des quantités copieuses de données concernant la civilisation indigène de la planète, ou plutôt les civilisations.\n\nLes terres émergées de la planète sont divisées en trois grandes masses terrestres, les deux plus petites au nord étant surnommées §YEquus§! et §YGriffonia§!, tandis que la plus grande, connue sous le nom de §YZebrica§!, est située presque entièrement dans l'hémisphère sud. Ces continents sont incroyablement divers, chacun d'eux abritant plusieurs espèces sapientes distinctes.\n\nBien que les espèces indigènes aillent d'humanoïdes bipèdes connus sous le nom de §YYétis§! à des ursidés quadrupèdes connus simplement sous le nom d'§YOurs§! et des aviens connus sous le nom de §YGriffons§!, une partie significative de ces espèces ressemble à des créatures équines et a donc été surnommée §YÉquidéens§!.\n\nCeci est cependant un terme générique englobant plusieurs espèces, telles que les §YPoneys§! particulièrement petits mais thaumaturgiquement doués (qui, aux côtés des Griffons, sont de loin l'espèce la plus peuplée, étant présents sur les trois continents), les §YZèbres§! adaptés aux climats désertiques, les §YChevaux§! plus grands, et les plus originaux §YKirins§! natifs de l'extrême est de Zebrica.\n\nCependant, peut-être la caractéristique la plus intéressante mais dangereuse de Faust est l'existence de plusieurs entités semblables à des demi-dieux parcourant la surface de la planète. Connues sous le nom d'§YAlicornes§!, elles sont dotées de capacités de distorsion de la réalité extrêmement puissantes et semblent agir comme les dirigeants pratiquement incontestés d'§YEquestria§!, l'État-nation le plus puissant de la planète.\n\nLe consensus parmi les membres de notre expédition est que la puissance phénoménale de ces Alicornes signifie que toute tentative d'invasion de Faust serait §Rextrêmement mal avisée§!, et il est donc probablement beaucoup plus sûr d'observer simplement le monde de loin."
  giga_eawaf.10141.a:99 "Quel monde particulier."
  # giga_eawaf.10141.b:99 "This is FASCINATING! We have to learn more!"

  giga_eawaf.1015.name:99 "Le mystère faustien"
  giga_eawaf.1015.desc.nopsi:99 "Le système §YFaust§! a maintenant été entièrement exploré par le §Y[ROOT.GetName]§!, et bien que le mystère du « soleil clignotant » ait été facilement expliqué par le transit d'Hélios derrière Faust, cette exploration a soulevé plus de questions qu'elle n'en a réellement résolues.\n\nComment fonctionne Hélios ? Quelle est la source des étranges cauchemars survenant à proximité de Sélène ? D'où les cristaux thaumaturgiques tirent-ils leur énergie ? Et, plus important encore, quel phénomène, s'il en existe un, sous-tend tout cela ?\n\nBien que de nombreuses théories aient été conçues pour essayer de tout relier, aucune d'entre elles ne parvient vraiment à décrire avec précision les mystères du système Faust sans inévitablement rencontrer des lacunes majeures ailleurs. Il semble que, pour le moment, Faust et ses mystérieux habitants resteront une énigme."
  giga_eawaf.1015.a.nopsi:99 "Peut-être qu'avec le temps, notre compréhension sera suffisante..."
  giga_eawaf.1015.a.nopsi.tooltip:99 "Nous pourrions éventuellement obtenir plus d'informations sur Faust si nous recherchons les technologies appropriées."
  giga_eawaf.1015.desc.hatepsi:99 "Le système §YFaust§! a maintenant été entièrement exploré par le §Y[ROOT.GetName]§!, et bien que le mystère du « soleil clignotant » ait été facilement expliqué par le transit d'Hélios derrière Faust, cette exploration a soulevé plus de questions qu'elle n'en a réellement résolues.\n\nComment fonctionne Hélios ? Quelle est la source des étranges cauchemars survenant à proximité de Sélène ? D'où les cristaux thaumaturgiques tirent-ils leur énergie ? Et, plus important encore, quel phénomène, s'il en existe un, sous-tend tout cela ? Bien que de nombreuses théories aient été conçues pour essayer de tout relier, une théorie en particulier s'est démarquée : la possibilité d'une interférence psionique.\n\nSelon notre compréhension, le rayonnement psi a des origines extradimensionnelles, et bien que les spécificités de ce plan externe restent floues, certains ont suggéré que le système Faust pourrait se trouver dans une zone où la barrière protectrice naturelle qui nous protège de l'origine du rayonnement psi est mince.\n\nSi c'est vrai, cela signifie que le système Faust devrait être traité avec une préoccupation significative comme un point chaud de contamination psionique. La section la plus agressive de notre communauté scientifique pousse maintenant pour une investigation approfondie du système afin que nous puissions comprendre à quoi nous avons affaire."
  giga_eawaf.1015.a.hatepsi:99 "Commencer une analyse de menace prioritaire."
  giga_eawaf.1015.desc.psi:99 "Le système §YFaust§! a maintenant été entièrement exploré par le §Y[ROOT.GetName]§!, et bien que le mystère du « soleil clignotant » ait été facilement expliqué par le transit d'Hélios derrière Faust, cette exploration a soulevé plus de questions qu'elle n'en a réellement résolues.\n\nComment fonctionne Hélios ? Quelle est la source des étranges cauchemars survenant à proximité de Sélène ? D'où les cristaux thaumaturgiques tirent-ils leur énergie ? Et, plus important encore, quel phénomène, s'il en existe un, sous-tend tout cela ? Bien que de nombreuses théories aient été conçues pour essayer de tout relier, une théorie en particulier s'est démarquée : la possibilité d'une interférence psionique.\n\nSelon notre compréhension, les psioniques semblent provenir d'une sorte de royaume immatériel au-delà de notre réalité, et bien que les spécificités de ce royaume restent floues, certains ont suggéré que le système Faust pourrait se trouver dans une zone de la réalité où le voile entre notre réalité et ce royaume est plus mince.\n\nLa théorie, qui jusqu'à présent montre un grand potentiel pour expliquer tous les mystères de Faust, a rapidement gagné en popularité, au point que notre communauté scientifique pousse maintenant pour une investigation plus approfondie du système afin de déterminer si cette théorie tient vraiment la route."
  giga_eawaf.1015.a.psi:99 "Il n'y a pas de temps à perdre !"
  giga_eawaf.1015.b:99 "Franchement, nous en avons assez vu."
  giga_eawaf.1015.b.hatepsi:99 "Ce n'est pas un endroit où s'attarder."
  giga_eawaf.1015.b.tooltip:99 "Nous ne mènerons pas d'autres incursions dans les mystères de Faust."

  GIGA_EAWAF_SURVEY_HELIOS:99 "Investiguer Hélios"
  GIGA_EAWAF_SURVEY_HELIOS_DESC:99 "Il y a des preuves que les particularités du système Faust sont causées par une interférence psionique. Nous devrions mener une investigation approfondie de son étoile mystérieuse immédiatement."

  giga_eawaf.1016.name:99 "Eurêka psionique"
  giga_eawaf.1016.desc:99 "Nos récentes incursions dans les domaines des §YPsioniques§! ont poussé nos scientifiques à réévaluer de nombreuses découvertes et théories antérieures sous un nouvel angle.\n\nParmi celles-ci se trouve nul autre que le mystérieux système de §YFaust§!, dont les cristaux thaumaturgiques, l'étoile miniature et les créatures apparemment magiques ont obstinément résisté à notre compréhension de la physique depuis l'exploration du système.\n\nCependant, grâce à la perspective renouvelée fournie par nos aperçus de ce qui se trouve au-delà du monde matériel, certains de nos scientifiques ont suggéré que nous revisitions le système Faust afin d'essayer de voir s'il y avait peut-être plus qu'il n'y paraît..."
  giga_eawaf.1016.a:99 "Mettons-nous-y immédiatement !"

  giga_eawaf.1017.name:99 "Fusion psicatalysée"
  giga_eawaf.1017.desc:99 "Bien que cela ait nécessité un investissement significatif, tant en temps qu'en ressources, nos scientifiques croient avoir enfin percé les mystères du fonctionnement interne d'Hélios, ainsi que du reste du système Faust.\n\nLes expériences sur la sensibilité psionique des télépathes ont confirmé que l'ensemble du système se trouve dans un espace où le voile entre la réalité et l'immatériel est plus mince, permettant à des phénomènes surnaturels de survenir. Comme les systèmes se déplacent constamment dans l'espace, nos scientifiques ont conclu qu'il doit y avoir une sorte de phénomène causant cet « amincissement » de la réalité, et se sont mis à sonder Hélios lui-même pour essayer de trouver des réponses.\n\nGrâce à des sondes à blindage thermique plongeant dans les profondeurs de cet enfer ésotérique, on a découvert qu'au coeur d'Hélios se trouve une « faille » miniature dans la réalité elle-même, menant supposément directement dans un royaume d'énergie psionique pure. La matière du centre d'Hélios tombe régulièrement dans cette faille avant de réapparaître sous forme d'énergie psionique surchauffée bouillonnante. Cette énergie « flotte » ensuite jusqu'aux couches externes d'hydrogène d'Hélios et déclenche des réactions de fusion nucléaire.\n\nPar des processus mal compris, l'énergie psionique « dépensée » se « recondense » ensuite en noyaux d'hydrogène, qui sont eux-mêmes enflammés par de l'énergie psionique fraîche. Les noyaux d'hélium fusionnés, en raison de leur masse plus élevée, tombent ensuite dans la faille et le cycle se répète essentiellement indéfiniment, maintenant ainsi l'étoile miniature allumée !\n\nLa découverte et la compréhension de ce processus ésotérique, maintenant baptisé §YFusion psicatalysée§!, ont révolutionné à la fois les psioniques et la science nucléaire. Par conséquent, beaucoup de nos scientifiques débattent maintenant de la possibilité de répliquer ce processus nous-mêmes afin de générer de l'énergie."
  giga_eawaf.1017.hatepsi.desc:99 "Au prix de risques et de coûts significatifs, nos scientifiques croient avoir enfin percé les mystères du fonctionnement interne d'Hélios, ainsi que du reste du système Faust.\n\nL'observation extensive du rayonnement psi a confirmé que l'ensemble du système se trouve dans un espace où le voile entre la réalité et l'immatériel est plus mince, permettant à des anomalies de rayonnement psi accrues de survenir. Comme les systèmes se déplacent constamment dans l'espace, nos scientifiques ont conclu qu'il doit y avoir une sorte de phénomène causant cet « amincissement » de la réalité, et se sont mis à sonder Hélios lui-même pour essayer de trouver des réponses.\n\nGrâce à des sondes à blindage thermique plongeant dans les profondeurs de cet enfer ésotérique, on a découvert qu'au coeur d'Hélios se trouve une « faille » miniature dans la réalité elle-même, menant supposément directement dans le royaume d'où provient la menace psionique. La matière du centre d'Hélios tombe régulièrement dans cette faille avant de réapparaître sous une forme de rayonnement psi à très haute énergie. Cette énergie remonte ensuite jusqu'aux couches externes d'hydrogène d'Hélios et déclenche des réactions de fusion nucléaire.\n\nPar des processus mal compris, l'énergie psionique « dépensée » se « recondense » ensuite en noyaux d'hydrogène, qui sont eux-mêmes enflammés par du rayonnement psi frais. Les noyaux d'hélium fusionnés, en raison de leur masse plus élevée, tombent ensuite dans la faille et le cycle se répète essentiellement indéfiniment, maintenant ainsi l'étoile miniature allumée !\n\nLa découverte et la compréhension de ce processus inquiétant, maintenant baptisé §YFusion psicatalysée§!, ont révolutionné à la fois les psioniques et la science nucléaire. Bien que ce processus soit évidemment bien trop dangereux pour que nous le recréions et l'exploitions délibérément, notre nouvelle compréhension des processus psioniques pourrait s'avérer utile contre de futures menaces."
  giga_eawaf.1017.a:99 "Absolument incroyable ! Essayons de voir si le processus peut être répliqué."
  giga_eawaf.1017.hatepsi.a:99 "Une étude faustienne, qui est allée assez loin."
  giga_eawaf.1017.a.tooltip:99 "Nous tenterons de déclencher une fusion psicatalysée dans un environnement contrôlé, mais cela pourrait nécessiter une compréhension des psioniques supérieure à ce que nous possédons actuellement. Ça ne peut pas faire de mal d'essayer, cependant."
  giga_eawaf.1017.hatepsi.a.tooltip:99 "§GCes découvertes pourraient s'avérer utiles si une menace psionique devait surgir du système Faust.§!"
  giga_eawaf.1017.b:99 "Ces découvertes sont formidables, mais nous sommes allés assez loin."

  GIGA_EAWAF_PSIONIC_FUSION:99 "Répliquer la fusion psicatalysée"
  GIGA_EAWAF_PSIONIC_FUSION_DESC:99 "Les mécanismes alimentant les processus de fusion d'Hélios reposent sur un flux complexe de matière tombant directement dans l'immatériel. Répliquer artificiellement ce processus pourrait nous permettre de construire des réacteurs à fusion significativement plus puissants. Nos scientifiques estiment que nous devons d'abord trouver un moyen de §Ypercer l'immatériel§!, puis trouver un §Ycatalyseur psionique§! puissant si nous voulons que cela réussisse. Nous voudrons peut-être garder ce projet de côté jusqu'à ce que nous estimions remplir ces prérequis."

  giga_eawaf.10171.name:99 "Succès de la fusion psicatalysée"
  giga_eawaf.10171.desc:99 "Après une longue série de tentatives échouées et d'impasses, les dernières expériences tentant de répliquer la §YFusion psicatalysée§! dans un environnement contrôlé ont enfin produit un gain d'énergie positif.\n\nUne faille psionique artificielle a été induite et maintenue par des psykers au sein d'une sphère condensée d'hélium, qui s'est spontanément effondrée dans la faille, avant de réapparaître sous forme d'énergies psioniques bouillonnantes, tout comme au coeur d'Hélios. Des noyaux d'hydrogène ont ensuite été injectés sur les énergies émergentes avec un timing parfait, déclenchant des réactions de fusion nucléaire extrêmement puissantes, plusieurs ordres de grandeur plus puissantes que celles trouvées dans les réacteurs à fusion conventionnels, ou même les étoiles normales, d'ailleurs.\n\nAvec l'obstacle expérimental initial surmonté, les applications potentielles de cette technologie sont illimitées. Non seulement elle génère des quantités significatives d'énergie, mais les réactions de fusion plus puissantes pourraient théoriquement être utilisées pour créer des éléments extrêmement lourds avec bien plus de facilité que les méthodes actuelles. Non seulement cela, mais les failles stabilisées semblaient produire un effet d'« amincissement de la réalité » similaire à celui trouvé sur Faust, améliorant drastiquement l'efficacité des psioniques dans son voisinage immédiat.\n\nSuite à ce succès retentissant, tout ce qui reste à faire maintenant est de mettre le design à l'échelle pour qu'il soit industriellement viable."
  giga_eawaf.10171.a:99 "Excellent !"

  giga_eawaf.10172.name:99 "Échec de la fusion psicatalysée"
  giga_eawaf.10172.desc:99 "Malheureusement, nos tentatives de répliquer la §YFusion psicatalysée§! se sont toutes soldées par un échec. Il semblerait que notre compréhension actuelle des psioniques soit tout simplement trop primitive pour que nous puissions reproduire avec précision les conditions très spécifiques trouvées au coeur infernal d'Hélios.\n\nNos propres conceptions de réacteurs soit échouent carrément à percer l'immatériel, soit sont incapables de catalyser correctement la réaction de fusion psionique. Le projet a été décrit par beaucoup comme une coûteuse perte de temps, mais certains de nos scientifiques continuent néanmoins de croire en la faisabilité d'un tel projet, arguant que nous ne sommes tout simplement pas encore prêts."
  giga_eawaf.10172.a:99 "Réessayons ! Cette fois ça marchera..."
  giga_eawaf.10172.a.tooltip:99 "Nous tenterons à nouveau de déclencher une fusion psicatalysée dans un environnement contrôlé, bien qu'il serait peut-être sage de ne lancer le projet qu'une fois que notre compréhension des psioniques aura progressé, sinon il est probable qu'il échoue à nouveau."
  giga_eawaf.10172.b:99 "Cela a été une perte de temps. Annulez le projet."

  # Faust incinerated by substellar compressor
  # giga_eawaf.1020.name:99 "Faust Incinerated"
  # giga_eawaf.1020.desc:99 "The ignition of the §YBehemoth§! Brown Dwarf has rendered most of the planets within its star system much more habitable than before, but this has come at the cost of utterly incinerating the primitives living on the peculiar continental world of §YFaust§!.\n\nThe planet's surface has been utterly decimated by the star's initial ignition shockwave, instantly sterilizing it and ending all forms of life on its surface aside from pockets of isolated extremophiles.\n\nThe primitive civilization formerly inhabiting the planet is no more, wiped away in mere moments by our own recklessness."
  #
  # giga_eawaf.1020.xenophile:99 "A terrible crime..."
  # giga_eawaf.1020.xenophile.tooltip:99 "Due to our ethics, our population will be §Rdispleased§!."
