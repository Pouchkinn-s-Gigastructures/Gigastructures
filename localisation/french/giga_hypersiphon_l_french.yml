l_french:
  #########################################
  ### Psychic Hypersiphon #################
  #########################################
  
  #######################################################################################################################
  # misc/technical
  
  giga_hypersiphon_power_estimate:0 "§HEstimation de puissance calculée :§!\n- Capacité navale max. : §Y[this.GigaGetNavalCap]§!\n- Capacité navale utilisée : §Y[this.GigaGetUsedNavalCap]§!\n- Puissance de flotte actuelle : §Y[this.GigaGetFleetPower]§!\n\n- Puissance estimée : §Y[This.giga_hypersiphon_incursion_power]§!"
  
  giga_project_hypersiphon_portal:0 "Enquête sur l'incursion du Voile"
  giga_project_hypersiphon_portal_DESC:0 "Les vestiges du mystérieux portail du Voile utilisé par les entités psioniques hostiles qui nous ont attaqués pourraient nous permettre de mieux calibrer notre réseau de $name_psy_siphon$."
  
  #######################################################################################################################
  # techs
  
  giga_tech_shroud_conduit:0 "Connexions directes au Voile"
  giga_tech_shroud_conduit_desc:0 "Après de longues méditations et études, nos télépathes pensent qu'il serait possible d'ouvrir des tunnels stables vers le royaume connu sous le nom de Voile. Bien que d'échelle subatomique, l'utilisation contrôlée de ces tunnels permettrait à notre population psionique de bénéficier d'énergies autrement réservées à des rituels dangereux et coûteux."
  
  giga_tech_psychic_hypersiphon:0 "Ouvrir la porte"
  giga_tech_psychic_hypersiphon_desc:0 "Le Voile est un royaume étrange. En combinant de nouvelles technologies de confinement avec une immense puissance télépathique, il pourrait devenir possible de relier directement notre réalité à celle du Voile à une échelle macroscopique. Cela pourrait grandement améliorer nos conduits du Voile, portant notre prospérité vers de nouveaux sommets. Un risque de fuite d'énergies indésirables est théorisé comme inévitable, mais minimal dans le pire des cas."
  
  #######################################################################################################################
  # construction events
  
  giga_dialog.1401.name:0 "Construction de l'$name_psy_siphon$"
  giga_dialog.1401.desc:0 "Nos ingénieurs ont assemblé le chantier de construction de notre futur $name_psy_siphon$, qui drainera l'énergie directement du Voile lui-même !\n\nUne fois achevée, la puissance de nos installations planétaires $building_giga_shroud_conduit$ sera grandement amplifiée, nous portant vers de nouveaux sommets de prospérité."
  giga_dialog.1401.a:0 "Compris."
  
  giga_dialog.1402.name:0 "Cadre de confinement de l'$name_psy_siphon$"
  giga_dialog.1402.desc:0 "Le cadre de confinement de l'$name_psy_siphon$ est maintenant en place ! Il a été conçu pour contenir une sphère d'énergie psionique pure en ébullition, formant le foyer des efforts de nos télépathes pour canaliser les énergies du Voile.\n\nL'étape finale sera la construction de l'équipement utilisé pour ouvrir le portail lui-même."
  giga_dialog.1402.a:0 "Rassemblons les composants rituels."
  
  #giga_dialog.1403.name:0 "$name_psy_siphon$ Spire Built"
  #giga_dialog.1403.desc:0 "The portal spire of the $name_psy_siphon$ is finished. This massive equipment, along with the portal capacitors, will emit a powerful burst of psionic energy, powerful enough to tear spacetime apart and open a hole to the Shroud! The portal will obviously not be stable enough to permit physical access to the Shroud, but lots of energy will begin pouring out of it to be collected by the portal spire. The only thing left to do now is to turn it on..."
  #giga_dialog.1403.a:0 "Excellent!"
  
  giga_dialog.1404.name:0 "$name_psy_siphon$ achevé"
  giga_dialog.1404.desc:0 "Le grand portail reliant notre réalité au Voile près de [giga_system.GetName] a été entièrement activé !\n\nL'énergie pure se déverse maintenant de cette porte artificielle vers le royaume psychique, et nos télépathes ressentent déjà l'immense bienfait que ce lien direct accorde à leurs capacités psioniques !"
  giga_dialog.1404.a:0 "Nous sommes les maîtres de l'immatériel."
  
  #######################################################################################################################
  # mega info
  
  psychic_hypersiphon_0:0 "$gc_mega$Chantier de construction de l'$name_psy_siphon$"
  psychic_hypersiphon_0_DESC:0 "Ce chantier de construction servira de base pour la future construction d'un $name_psy_siphon$."
  psychic_hypersiphon_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_megastructure$ - $giga_list_category_psionics$ - $giga_list_category_advanced_resource_production$\nOuvre un portail vers le §YVoile§!, amplifiant les bâtiments §Y$building_giga_shroud_conduit$§!. - $giga_list_potentially_hazardous$\nDes hypersiphons supplémentaires augmenteront l'effet sur chaque bâtiment.\n§LUn immense portail reliant notre univers au Voile, amplifiant nos capacités psioniques.§!" #megalistentry PSYCHIC HYPERSIPHON
  
  psychic_hypersiphon_1:0 "Cadre de confinement de l'$name_psy_siphon$"
  psychic_hypersiphon_1_DESC:0 "Cette grande structure servira de noyau principal pour contenir et raffiner l'énergie extraite du Voile. Le cadre central maintiendra et stabilisera une petite « étoile » composée d'énergie psionique pure, servant de foyer pour une équipe de puissants psioniques."
  
  psychic_hypersiphon_2:0 "$name_psy_siphon$"
  psychic_hypersiphon_2_DESC:0 "Un $name_psy_siphon$ pleinement opérationnel et stabilisé. Le portail connectant notre réalité au Voile a été entièrement activé et libère de l'essence du Voile pure."
  giga_psy_siphon_interaction_title:0 "§HDébloque la fonctionnalité :§! $building_giga_shroud_conduit$ amplifiés"
  giga_psy_siphon_interaction_desc:0 "§H$building_giga_shroud_conduit$ amplifiés§!\nPour chaque $name_psy_siphon$ construit, les bâtiments £building£ §Y$building_giga_shroud_conduit$§! accorderont des emplois supplémentaires et produiront des £giga_sr_psionic_sublimate£ §Y$giga_sr_psionic_sublimate$§! pour chaque pop psionique sur la planète.\n\nCela pourrait entraîner une légère §Rinstabilité§! dans les conduits, mais il est peu probable que cela ait un impact significatif..."
  
  psychic_hypersiphon_3_aeternum:0 "$name_psy_siphon$ en æternite"
  psychic_hypersiphon_3_aeternum_DESC:0 "Un $name_psy_siphon$ pleinement opérationnel et stabilisé, construit il y a des éons innombrables par l'Æternum. Le portail connectant notre réalité au Voile a été entièrement activé et libère de l'essence du Voile pure sans aucun signe d'instabilité."
  
  #######################################################################################################################
  # buildings
  
  building_giga_shroud_conduit:0 "Conduit du Voile"
  building_giga_shroud_conduit_desc:0 "Une installation psionique massive extrayant de force l'énergie du Voile et la redistribuant à la surface de la planète, amplifiant grandement les capacités télépathiques."
  building_giga_shroud_conduit_hypersiphon_hint:0 "\nConstruire une mégastructure §Y$psychic_hypersiphon_2$§! fournira des emplois supplémentaires et générera des £giga_sr_psionic_sublimate£ §Y$giga_sr_psionic_sublimate$§! pour chaque £pop£ §Ypop psionique§! sur la planète."
  building_giga_shroud_conduit_hypersiphon_safe_effect:0 "\nHypersiphons psioniques amplifiant ce bâtiment : §Y[owner.GetHypersiphonNetworkSize]§!\n\nGénère des £giga_sr_psionic_sublimate£ §Y$giga_sr_psionic_sublimate$§! grâce à §Y[this.GetHypersiphonPopCount]§! pops psioniques"
  building_giga_shroud_conduit_hypersiphon_effect:0 "\nHypersiphons psioniques amplifiant ce bâtiment : §Y[owner.GetHypersiphonNetworkSize]§!\n\nGénère des £giga_sr_psionic_sublimate£ §Y$giga_sr_psionic_sublimate$§! et de l'§Rinstabilité§! grâce à §Y[this.GetHypersiphonPopCount]§! pops psioniques"
  decision_hypersiphon_mass_summon:0 "Invocation de masse de $shroud_summoned_army_plural$"
  decision_hypersiphon_mass_summon_effect:0 "Invoque §G[owner.GetHypersiphonSummonCount]§! §Y$shroud_summoned_army_plural$§!, selon le nombre d'emplois [owner.GetGigaShroudConduitJobIcon] §Y[owner.GetGigaShroudConduitJob]§! et de £pop£ §Ypops psioniques§! sur la planète."
  decision_hypersiphon_mass_summon_desc:0 "Avec une préparation rituelle complexe et d'énormes quantités de $giga_sr_psionic_sublimate$ concentrés, des entités du Voile pourraient être invoquées à grande échelle."
  
  #######################################################################################################################
  # jobs
  
  job_giga_shroud_conduit_worker:0 "Technicien de conduit du Voile"
  job_giga_shroud_conduit_worker_plural:0 "Techniciens de conduit du Voile"
  job_giga_shroud_conduit_worker_desc:0 "Spécialistes chargés de gérer les tunnels minuscules vers le Voile ouverts par un $building_giga_shroud_conduit$."
  job_giga_shroud_conduit_worker_effect_desc:0 "Les $job_giga_shroud_conduit_worker_swap_plural_with_icon$ canalisent l'£energy£ §Y$energy$§! pour produire de l'£unity£ §Y$unity$§! et stimuler la productivité sur la planète."
  job_giga_shroud_conduit_worker_swap_plural_with_icon:0 "[giga_shroud_conduit_worker.GetIcon] [giga_shroud_conduit_worker.GetNamePlural]"
  mod_job_giga_shroud_conduit_worker_add:0 "Emplois de [giga_shroud_conduit_worker.GetName]"
  mod_job_giga_shroud_conduit_worker_per_pop:0 "§G+1§! emploi de [giga_shroud_conduit_worker.GetName] par tranche de $VALUE$ pops"
  mod_job_giga_shroud_conduit_worker_per_pop_short:0 "\n§G+1§! £mod_job_giga_shroud_conduit_worker_add£ par tranche de $VALUE$ £pop£"
  job_giga_shroud_conduit_worker_icon:0 "£job_giga_shroud_conduit_worker£"
  
  job_giga_shroud_conduit_priest:0 "Canalisateur du Voile"
  job_giga_shroud_conduit_priest_plural:0 "Canalisateurs du Voile"
  job_giga_shroud_conduit_priest_desc:0 "Clergé psionique chargé de gérer les connexions délicates générées par un $building_giga_shroud_conduit$."
  job_giga_shroud_conduit_priest_effect_desc:0 "Les $job_giga_shroud_conduit_priest_swap_plural_with_icon$ utilisent l'£energy£ §Y$energy$§! pour produire de l'£unity£ §Y$unity$§!, fournir des £amenities£ $MOD_PLANET_AMENITIES_ADD$ et stimuler la productivité sur la planète."
  job_giga_shroud_conduit_priest_swap_plural_with_icon:0 "[giga_shroud_conduit_priest.GetIcon] [giga_shroud_conduit_priest.GetNamePlural]"
  mod_job_giga_shroud_conduit_priest_add:0 "Emplois de [giga_shroud_conduit_priest.GetName]"
  mod_job_giga_shroud_conduit_priest_per_pop:0 "§G+1§! emploi de [giga_shroud_conduit_priest.GetName] par tranche de $VALUE$ pops"
  mod_job_giga_shroud_conduit_priest_per_pop_short:0 "\n§G+1§! £mod_job_giga_shroud_conduit_priest_add£ par tranche de $VALUE$ £pop£"
  job_giga_shroud_conduit_priest_icon:0 "£job_giga_shroud_conduit_priest£"
  
  job_giga_shroud_conduit_drone:0 "Drone de conduit du Voile"
  job_giga_shroud_conduit_drone_plural:0 "Drones de conduit du Voile"
  job_giga_shroud_conduit_drone_desc:0 "Drones psioniquement actifs spécialisés dans la gestion des connexions délicates générées par un $building_giga_shroud_conduit$."
  job_giga_shroud_conduit_drone_effect_desc:0 "Les $job_giga_shroud_conduit_drone_swap_plural_with_icon$ canalisent l'£energy£ §Y$energy$§! pour produire de l'£unity£ §Y$unity$§! et stimuler la productivité sur la planète."
  job_giga_shroud_conduit_drone_swap_plural_with_icon:0 "[giga_shroud_conduit_drone.GetIcon] [giga_shroud_conduit_drone.GetNamePlural]"
  mod_job_giga_shroud_conduit_drone_add:0 "Emplois de [giga_shroud_conduit_drone.GetName]"
  mod_job_giga_shroud_conduit_drone_per_pop:0 "§G+1§! emploi de [giga_shroud_conduit_drone.GetName] par tranche de $VALUE$ pops"
  mod_job_giga_shroud_conduit_drone_per_pop_short:0 "\n§G+1§! £mod_job_giga_shroud_conduit_worker_add£ par tranche de $VALUE$ £pop£"
  job_giga_shroud_conduit_drone_icon:0 "£job_giga_shroud_conduit_drone£"
  
  mod_planet_pops_psionic_upkeep_mult:0 "Entretien des £pop£ pops psioniques"
  
  #######################################################################################################################
  # situations
  
  ####################################################
  # siphon tracker
  
  giga_situation_hypersiphon_tracker_type:0 "Suivi de l'$name_psy_siphon$"
  giga_situation_hypersiphon_tracker:0 "Suivi de l'$name_psy_siphon$ de [target.planet.GetName]"
  giga_situation_hypersiphon_tracker_desc:0 "Gère les événements pour cet $name_psy_siphon$"
  giga_situation_hypersiphon_tracker_monthly_change_tooltip:0 ""
  
  ####################################################
  # instability
  
  giga_situation_hypersiphon_instability:0 "Instabilité du conduit du Voile"
  giga_situation_hypersiphon_instability_type:0 "$giga_situation_hypersiphon_instability$"
  giga_situation_hypersiphon_instability_desc:0 "Les tunnels psioniques macroscopiques générés par notre $name_psy_siphon$ provoquent des fluctuations au sein de la structure locale du Voile.\nLes relevés indiquent des pics d'activité bien supérieurs à nos prédictions initiales, et si le niveau d'énergie monte trop haut, nous pourrions commencer à subir des effets négatifs."
  
  giga_situation_hypersiphon_instability_monthly_change_tooltip:0 "L'£mod_black_hole£ §Yinstabilité du conduit du Voile§! est causée par les bâtiments £building£ §Y$building_giga_shroud_conduit$§! amplifiés par les mégastructures §Y$name_psy_siphon$§!."
  giga_situation_hypersiphon_instability_progress_instability:0 "Bâtiments $building_giga_shroud_conduit$"
  giga_situation_hypersiphon_instability_progress_decay:0 "Déclin naturel"
  giga_situation_hypersiphon_instability_progress_mitigate:0 "$giga_situation_hypersiphon_instability_approach_mitigate$"
  giga_situation_hypersiphon_instability_progress_encourage:0 "$giga_situation_hypersiphon_instability_approach_encourage$"
  
  giga_situation_hypersiphon_instability_stage_1:0 "Instabilité du Voile §Eminimale§!"
  giga_situation_hypersiphon_instability_stage_1_effect:0 "Des événements perturbateurs liés au Voile peuvent se produire §Etrès rarement§!."
  giga_situation_hypersiphon_instability_stage_2:0 "Instabilité du Voile §Gfaible§!"
  giga_situation_hypersiphon_instability_stage_2_effect:0 "Des événements perturbateurs liés au Voile peuvent se produire §Grarement§!."
  giga_situation_hypersiphon_instability_stage_3:0 "Instabilité du Voile §Ymodérée§!"
  giga_situation_hypersiphon_instability_stage_3_effect:0 "Des événements perturbateurs liés au Voile peuvent se produire §Yoccasionnellement§!."
  giga_situation_hypersiphon_instability_stage_4:0 "Instabilité du Voile §Hélevée§!"
  giga_situation_hypersiphon_instability_stage_4_effect:0 "Des événements perturbateurs liés au Voile se produiront §Hfréquemment§!."
  giga_situation_hypersiphon_instability_stage_5:0 "Instabilité du Voile §Rextrême§!"
  giga_situation_hypersiphon_instability_stage_5_effect:0 "Des événements perturbateurs liés au Voile se produiront §Rtrès fréquemment§!."
  
  giga_situation_hypersiphon_instability_approach_neutral:0 "Observer"
  giga_situation_hypersiphon_instability_approach_neutral_desc:0 "Le Voile est un royaume mystérieux et mal compris. Nous savons que quelque chose approche, mais c'est informe, éphémère. Nous continuerons à observer."
  giga_situation_hypersiphon_instability_approach_neutral_effect:0 "Nous continuerons à observer les fluctuations au sein du Voile."
  
  giga_situation_hypersiphon_instability_approach_encourage:0 "Encourager"
  giga_situation_hypersiphon_instability_approach_encourage_desc:0 "Il est impératif que nous utilisions ce pouvoir à son plein potentiel, même si cela signifie irriter ceux qui se dresseraient sur le chemin de notre grandeur."
  giga_situation_hypersiphon_instability_approach_encourage_effect:0 "Les emplois [GetGigaShroudConduitJobIcon]§Y[GetGigaShroudConduitJob]§! sont §Gplus efficaces§! pour stimuler la production, mais la progression de la situation est accélérée de §R25 %§! et les événements négatifs sont plus fréquents.\n "
  
  giga_situation_hypersiphon_instability_approach_mitigate:0 "Atténuer"
  giga_situation_hypersiphon_instability_approach_mitigate_desc:0 "Nous devons minimiser notre impact sur le Voile et ses habitants, de peur d'attirer leur courroux."
  giga_situation_hypersiphon_instability_approach_mitigate_effect:0 "La progression de la situation est ralentie de §G50 %§! et les événements négatifs sont moins fréquents, mais les emplois [GetGigaShroudConduitJobIcon]§Y[GetGigaShroudConduitJob]§! sont §Rmoins efficaces§! pour stimuler la production.\n "
  
  giga_situation_hypersiphon_instability_complete_effect:0 "Une autre incursion majeure du Voile se produira quelque part dans notre espace."
  giga_situation_hypersiphon_instability_complete_effect_unknown:0 "Les conséquences de laisser ces énergies croître sont actuellement inconnues."
  giga_situation_hypersiphon_instability_fail_effect:0 "Le Voile redevient calme."
  
  #######################################################################################################################
  # situation events
  
  # instability situation start
  giga_hypersiphon.002.name:0 "Courants invisibles"
  giga_hypersiphon.002.desc:0 "Cela a commencé comme un léger tourment dans l'esprit de nos télépathes, mais c'est rapidement devenu quelque chose de plus. Il est maintenant évident que collecter des énergies directement de la substance du Voile en telles quantités cause plus de turbulences dans son flux que nous ne l'avions initialement anticipé.\n\nEn l'état actuel des choses, nous restons incertains quant à ce que ces perturbations pourraient signifier pour nous à l'avenir, mais si elles continuent à augmenter en intensité, nous pourrions commencer à attirer l'attention des puissances qui y résident.\n\nPour l'instant, nous observerons."
  giga_hypersiphon.002.a:0 "Préoccupant."
  
  # siphon causes a blocker and damage
  giga_hypersiphon.010.name:0 "Dysfonctionnement du siphon du Voile"
  giga_hypersiphon.010.desc:0 "L'équipage du $building_giga_shroud_conduit$ sur [hypersiphon_target.GetName] signale un pic massif d'énergie psionique sur [hypersiphon_target.GetPlanetMoon], se manifestant par une perturbation physique à la surface.\n\nLa zone affectée est devenue inutilisable et nécessitera un effort concentré pour être nettoyée."
  giga_hypersiphon.010.a:0 "Fâcheux."
  giga_hypersiphon.010.result.1:0 "Une petite région de [hypersiphon_target.GetName] a été contaminée par des déchets ectoplasmiques."
  giga_hypersiphon.010.result.2:0 "Une grande région de [hypersiphon_target.GetName] a été contaminée par des déchets ectoplasmiques."
  giga_hypersiphon.010.result.3:0 "Une région anormale s'est formée à la surface de [hypersiphon_target.GetName], déroutant considérablement nos [hypersiphon_target.owner.GetScientistPlural]."
  giga_hypersiphon.010.result.4:0 "$giga_hypersiphon.010.result.3$"
  giga_hypersiphon.010.result.5:0 "Une immense région de [hypersiphon_target.GetName] a été engloutie par un violent système de tempête psionique, semant le chaos à la surface mais agissant comme une connexion au Voile."
  
  # siphon causes storm and shroud cows
  giga_hypersiphon.020.name:0 "Vaches du Voile dans [hypersiphon_target.GetName]"
  giga_hypersiphon.020.desc.first:0 "Une énorme tempête psionique s'est formée dans le système [hypersiphon_target.GetName], causant des ravages pour nos opérations spatiales.\n\nMystérieusement, un grand nombre d'entités du Voile apparemment passives sont également apparues dans le système. Nos télépathes les ont surnommées « Vaches du Voile », en raison de la ressemblance frappante qu'elles présentent avec les Tiyanki, tant par leur apparence physique que par leur chant psionique."
  giga_hypersiphon.020.desc.normal:0 "Des créatures du Voile se sont manifestées dans le système [hypersiphon_target.GetName], et sont à nouveau accompagnées d'une tempête psionique perturbatrice."
  giga_hypersiphon.020.desc.damage:0 "Une autre tempête psionique s'est formée dans le système [hypersiphon_target.GetName]. D'autres Vaches du Voile se sont également manifestées, immédiatement hostiles aux navires et installations locaux."
  giga_hypersiphon.020.a:0 "Comme c'est singulier..."
  giga_hypersiphon.020.b:0 "Encore d'autres ?"
  giga_hypersiphon.020.c:0 "Aux postes de combat !"
  giga_hypersiphon.020.effect:0 "Une tempête psionique s'est formée dans [hypersiphon_target.GetName] et a apporté avec elle de la faune du Voile !"
  
  # shroud cows dissipate
  giga_hypersiphon.022.name:0 "Perturbation du Voile apaisée dans [hypersiphon_target.GetName]"
  giga_hypersiphon.022.desc:0 "La tempête psionique dans le système [hypersiphon_target.GetName] s'est dissipée, et les opérations reprennent leur cours normal.\n\nLes mystérieuses apparitions qui l'accompagnaient ont également disparu sans laisser de trace."
  giga_hypersiphon.022.a:0 "La voie est libre, pour l'instant."
  
  # siphon causes visions of doom
  giga_hypersiphon.030.name:0 "Visions de malheur sur [hypersiphon_target.GetName]"
  giga_hypersiphon.030.desc:0 "La population de [hypersiphon_target.GetName] a récemment été frappée par de terribles rêves et visions de désastre imminent. Plusieurs secteurs industriels de [hypersiphon_target.GetPlanetMoon] ont signalé des phénomènes étranges, où les retours psioniques ont entraîné une augmentation des taux de mortalité et des pannes mécaniques.\n\nNos télépathes rapportent qu'une forte présence liée au Voile s'est installée, et qu'il faudra peut-être du temps pour que les effets se dissipent."
  giga_hypersiphon.030.a:0 "Troublant."
  giga_hypersiphon.030.result.1.1:0 "La mort et la destruction ont rendu visite à ce monde."
  giga_hypersiphon.030.result.1.2:0 "Une destruction significative a été causée à travers ce monde."
  giga_hypersiphon.030.result.1.3:0 "Une destruction généralisée s'est abattue sur ce monde."
  
  # minor incursion
  giga_hypersiphon.040.name:0 "Incursion du Voile dans [hypersiphon_target.GetName] !"
  giga_hypersiphon.040.desc:0 "Des entités hostiles du Voile se sont manifestées dans le système [hypersiphon_target.GetName] !\n\nLes premiers rapports suggèrent qu'elles se déplacent de manière erratique, sans but clair, attaquant tout ce qui est en vue. Nos télépathes supposent que ces apparitions sont dépourvues de connexion à leur royaume d'origine, et sans source de subsistance, leurs énergies pourraient éventuellement se dissiper dans l'espace ouvert."
  giga_hypersiphon.040.a:0 "Regrettable."
  giga_hypersiphon.040.result:0 "§LDes visiteurs aux intentions malveillantes, et à la détermination confuse...§!"
  
  # major incursion happens
  giga_hypersiphon.100.name:0 "Incursion majeure du Voile dans [hypersiphon_target.GetName] !"
  giga_hypersiphon.100.desc:0 "Un grand nombre d'entités hostiles du Voile se sont manifestées dans le système [hypersiphon_target.GetName], regroupées autour d'une sorte de faille.\n\nElles semblent lancer une attaque dirigée contre nos installations dans le système, suggérant une forme d'action organisée. Nos télépathes supposent qu'avec cette connexion soutenue à leur royaume d'origine, de telles entités pourraient opérer indéfiniment sur notre plan, et même s'aventurer au-delà des frontières du système."
  giga_hypersiphon.100.a:0 "Préparez immédiatement une contre-offensive !"
  giga_hypersiphon.100.restart:0 "Redémarre la situation : §Y$giga_situation_hypersiphon_instability$§!\n\n§MÀ travers le voile, avec malice et fureur...§!"
  
  # incursion notification
  giga_hypersiphon.101.name:0 "Pic d'énergie psionique"
  giga_hypersiphon.101.desc:0 "Une énorme signature énergétique a été détectée dans le système [hypersiphon_target.GetName], situé au sein de [hypersiphon_target.owner.GetName]. Les premiers rapports suggèrent qu'une sorte d'apparitions hostiles ont émergé d'une faille et attaquent tout dans le système."
  giga_hypersiphon.101.a:0 "Troublant."
  
  # planet shrouded notification
  giga_hypersiphon.103.name:0 "Colonie engloutie par le Voile"
  giga_hypersiphon.103.desc:0 "Les attaques soutenues des entités du Voile ont détruit la colonie sur [This.GetName], recouvrant la planète d'une épaisse couche de nuages de tempête psionique. Il semble que la surface ait été purgée de toute vie détectable, et les relevés de la planète suggèrent que des conditions bizarres, défiant la physique, prévalent maintenant partout."
  giga_hypersiphon.103.a:0 "Une tragédie."
  
  # destroyed portal yourself
  giga_hypersiphon.105.name:0 "Incursion du Voile stoppée"
  giga_hypersiphon.105.desc.first:0 "Nos forces ont réussi à effondrer la faille du Voile dans le système [fromfrom.solar_system.GetName]. Avec leur connexion au Voile coupée, les entités hostiles qui en ont émergé se sont rapidement dissipées, devenant inoffensives.\n\nUne question demeure : quelle est notre solution à long terme à ce problème ? L'instabilité persiste, et cela se reproduira si les choses restent inchangées. Une faible signature des envahisseurs persiste encore autour de l'ouverture fermée, et les résidus laissés sur nos vaisseaux peuvent être étudiés.\n\nPeut-être cela fournira-t-il les réponses que nous cherchons."
  giga_hypersiphon.105.desc.other:0 "Nos forces ont réussi à effondrer la faille du Voile dans le système [fromfrom.solar_system.GetName]. Avec leur connexion au Voile coupée, les entités hostiles qui en ont émergé se sont rapidement dissipées, devenant inoffensives.\n\nLe Voile reste agité – il semble que notre travail ne soit jamais terminé."
  giga_hypersiphon.105.a:0 "Une opportunité intéressante..."
  giga_hypersiphon.105.b:0 "Toujours vigilants."
  
  # destroyed someone else's portal
  giga_hypersiphon.106.name:0 "Portail du Voile fermé"
  giga_hypersiphon.106.desc:0 "Nos forces ont réussi à effondrer la faille énergétique dans le système [fromfrom.solar_system.GetName]. Avec leur connexion à leur origine coupée, les entités hostiles qui en ont émergé se sont rapidement dissipées, devenant inoffensives.\n\nLes relevés suggèrent que la région est maintenant sûre, sans signature énergétique résiduelle significative."
  giga_hypersiphon.106.a:0 "Espérons que cela reste ainsi."
  
  # someone else destroyed your portal
  giga_hypersiphon.107.name:0 "Incursion du Voile stoppée"
  giga_hypersiphon.107.desc.first:0 "Les forces appartenant à [from.GetName] ont réussi à effondrer la faille du Voile dans le système [fromfrom.solar_system.GetName]. Avec leur connexion au Voile coupée, les entités hostiles qui en ont émergé se sont rapidement dissipées, devenant inoffensives.\n\nUne question demeure : quelle est notre solution à long terme à ce problème ? L'instabilité persiste, et cela se reproduira si les choses restent inchangées. Une faible signature des envahisseurs persiste encore autour de l'ouverture fermée, et les résidus laissés sur nos vaisseaux peuvent être étudiés.\n\nPeut-être cela fournira-t-il les réponses que nous cherchons."
  giga_hypersiphon.107.desc.other:0 "Les forces appartenant à [from.GetName] ont réussi à effondrer la faille du Voile dans le système [fromfrom.solar_system.GetName]. Avec leur connexion au Voile coupée, les entités hostiles qui en ont émergé se sont rapidement dissipées, devenant inoffensives.\n\nLe Voile reste agité – il est probable qu'une autre incursion puisse se produire à l'avenir."
  giga_hypersiphon.107.a:0 "Une opportunité intéressante..."
  giga_hypersiphon.107.b:0 "Peut-être restera-t-elle fermée cette fois..."
  
  # a portal was destroyed and you aren't involved
  giga_hypersiphon.108.name:0 "Portail du Voile fermé"
  giga_hypersiphon.108.desc:0 "Les forces appartenant à [from.GetName] ont réussi à effondrer la faille énergétique dans le système [fromfrom.solar_system.GetName]. Avec leur connexion à leur origine coupée, les entités hostiles qui en ont émergé se sont rapidement dissipées, devenant inoffensives.\n\nLes rapports suggèrent que la région est maintenant sûre, sans signature énergétique résiduelle significative."
  giga_hypersiphon.108.a:0 "Compris."
  
  # unlocking new approaches
  giga_hypersiphon.109.name:0 "Analyse du portail du Voile terminée"
  giga_hypersiphon.109.desc:0 "L'analyse préliminaire des résidus laissés par les envahisseurs du Voile a fourni quelques informations sur la façon dont nos conduits du Voile et hypersiphons affectent le flux et le reflux du Voile.\n\nL'application minutieuse de mesures de sécurité et de rituels exécutés avec précision nous permettrait d'atténuer les effets négatifs de notre connexion, mais le soin supplémentaire apporté réduirait les avantages économiques de nos installations de conduit.\n\nAlternativement, nous pourrions ignorer les dommages causés et plutôt nous concentrer sur l'amplification de nos conduits en attirant des énergies récoltables. Cela améliorerait les avantages de nos conduits, mais pourrait provoquer des réactions négatives plus fréquemment."
  giga_hypersiphon.109.a:0 "Intrigant."
  giga_hypersiphon.109.effect:0 "Débloque les approches §Y$giga_situation_hypersiphon_instability_approach_mitigate$§! et §Y$giga_situation_hypersiphon_instability_approach_encourage$§! pour la situation §Y$giga_situation_hypersiphon_instability$§!."
  
