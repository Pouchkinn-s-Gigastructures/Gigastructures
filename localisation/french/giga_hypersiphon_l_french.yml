l_french:
 #########################################
 ### Psychic Hypersiphon #################
 #########################################

 #######################################################################################################################
 # misc/technical

 giga_hypersiphon_power_estimate:99 "§HEstimation de puissance calculée :§!\n- Capacité navale max. : §Y[this.GigaGetNavalCap]§!\n- Capacité navale utilisée : §Y[this.GigaGetUsedNavalCap]§!\n- Puissance de flotte actuelle : §Y[this.GigaGetFleetPower]§!\n\n- Puissance estimée : §Y[This.giga_hypersiphon_incursion_power]§!"

 giga_project_hypersiphon_portal:99 "Enquête sur l'incursion du Voile"
 giga_project_hypersiphon_portal_DESC:99 "Les vestiges du mystérieux portail du Voile utilisé par les entités psioniques hostiles qui nous ont attaqués pourraient nous permettre de mieux calibrer notre réseau de $name_psy_siphon$."

 #######################################################################################################################
 # techs

 giga_tech_shroud_conduit:99 "Connexions directes au Voile"
 giga_tech_shroud_conduit_desc:99 "Après de longues méditations et études, nos télépathes pensent qu'il serait possible d'ouvrir des tunnels stables vers le royaume connu sous le nom de Voile. Bien que de taille subatomique, l'utilisation contrôlée de ces tunnels permettrait à notre population psionique de bénéficier d'énergies autrement réservées à des rituels dangereux et coûteux."

 giga_tech_psychic_hypersiphon:99 "Ouvrir le passage"
 giga_tech_psychic_hypersiphon_desc:99 "Le Voile est un royaume étrange. En combinant de nouvelles technologies de confinement avec une immense puissance télépathique, il pourrait devenir possible de relier directement notre réalité à celle du Voile à une échelle macroscopique. Cela pourrait grandement améliorer nos Conduits du Voile, portant notre prospérité vers de nouveaux sommets. Le risque de fuites d'énergies indésirables est théoriquement inévitable, mais minimal dans le pire des cas."

 #######################################################################################################################
 # construction events

 giga_dialog.1401.name:99 "Construction du $name_psy_siphon$"
 giga_dialog.1401.desc:99 "Nos ingénieurs ont assemblé le site de construction de notre futur $name_psy_siphon$, qui drainera l'énergie du Voile lui-même !\n\nUne fois achevée, la puissance de nos installations planétaires de $building_giga_shroud_conduit$ sera grandement améliorée, nous portant vers de nouveaux sommets de prospérité."
 giga_dialog.1401.a:99 "Compris."

 giga_dialog.1402.name:99 "Cadre de confinement du $name_psy_siphon$"
 giga_dialog.1402.desc:99 "Le cadre de confinement du $name_psy_siphon$ est maintenant en place ! Il a été conçu pour contenir une sphère d'énergie psionique pure en ébullition, formant le point focal des efforts de nos télépathes pour canaliser les énergies du Voile.\n\nL'étape finale sera la construction de l'équipement utilisé pour ouvrir le portail lui-même."
 giga_dialog.1402.a:99 "Rassemblez les matériaux rituels."

 #giga_dialog.1403.name:99 "$name_psy_siphon$ Spire Built"
 #giga_dialog.1403.desc:99 "The portal spire of the $name_psy_siphon$ is finished. This massive equipment, along with the portal capacitors, will emit a powerful burst of psionic energy, powerful enough to tear spacetime apart and open a hole to the Shroud! The portal will obviously not be stable enough to permit physical access to the Shroud, but lots of energy will begin pouring out of it to be collected by the portal spire. The only thing left to do now is to turn it on..."
 #giga_dialog.1403.a:99 "Excellent!"

 giga_dialog.1404.name:99 "$name_psy_siphon$ terminé"
 giga_dialog.1404.desc:99 "Le grand portail reliant notre réalité au Voile près de [giga_system.GetName] a été entièrement activé !\n\nDe l'énergie pure s'écoule désormais de cette porte artificielle vers le royaume psychique, et nos télépathes ressentent déjà l'immense bénédiction que ce lien direct accorde à leurs capacités psioniques !"
 giga_dialog.1404.a:99 "Nous sommes maîtres de l'immatériel."

 #######################################################################################################################
 # mega info

 psychic_hypersiphon_0:99 "$gc_mega$Site de construction du $name_psy_siphon$"
 psychic_hypersiphon_0_DESC:99 "Ce site de construction servira de base pour la future construction d'un $name_psy_siphon$."
 psychic_hypersiphon_0_MEGASTRUCTURE_DETAILS:99 "$giga_list_category_megastructure$ - $giga_list_category_psionics$ - $giga_list_category_advanced_resource_production$\nOuvre un portail vers le §YVoile§!, améliorant les bâtiments §Y$building_giga_shroud_conduit$§!. - $giga_list_potentially_hazardous$\nLes Hypersiphons supplémentaires augmenteront l'effet sur chaque bâtiment.\n§LUn immense portail reliant notre univers au Voile, amplifiant nos capacités psioniques." #megalistentry PSYCHIC HYPERSIPHON

 psychic_hypersiphon_1:99 "Cadre de confinement du $name_psy_siphon$"
 psychic_hypersiphon_1_DESC:99 "Cette grande structure servira de noyau principal pour contenir et raffiner l'énergie extraite du Voile. Le cadre central maintiendra et stabilisera une petite « étoile » faite d'énergie psionique pure, servant de point focal pour une équipe de puissants psioniques."

 psychic_hypersiphon_2:99 "$name_psy_siphon$"
 psychic_hypersiphon_2_DESC:99 "Un $name_psy_siphon$ pleinement opérationnel et stabilisé. Le portail connectant notre réalité au Voile a été entièrement activé et libère de l'Essence du Voile pure."
 giga_psy_siphon_interaction_title:99 "§HDébloque la fonctionnalité :§! $building_giga_shroud_conduit$ amélioré"
 giga_psy_siphon_interaction_desc:99 "§H$building_giga_shroud_conduit$ amélioré§!\nPour chaque $name_psy_siphon$ construit, les bâtiments £building£ §Y$building_giga_shroud_conduit$§! fourniront des emplois supplémentaires et produiront des £giga_sr_psionic_sublimate£ §Y$giga_sr_psionic_sublimate$§! pour chaque pop psionique sur la planète.\n\nCela pourrait entraîner une légère §Rinstabilité§! dans les Conduits, mais il est peu probable que cela ait un impact significatif..."

 psychic_hypersiphon_3_aeternum:99 "$name_psy_siphon$ aeternite"
 psychic_hypersiphon_3_aeternum_DESC:99 "Un $name_psy_siphon$ pleinement opérationnel et stabilisé, construit il y a des éons incalculables par Aeternum. Le portail connectant notre réalité au Voile a été entièrement activé et libère de l'Essence du Voile pure sans aucun signe d'instabilité."

 #######################################################################################################################
 # buildings

 building_giga_shroud_conduit:99 "Conduit du Voile"
 building_giga_shroud_conduit_desc:99 "Une massive installation psionique extrayant de force l'Énergie du Voile et la redistribuant à la surface de la planète, amplifiant considérablement les capacités télépathiques."
 building_giga_shroud_conduit_hypersiphon_hint:99 "\nConstruire une mégastructure §Y$psychic_hypersiphon_2$§! fournira des emplois supplémentaires et générera des £giga_sr_psionic_sublimate£ §Y$giga_sr_psionic_sublimate$§! pour chaque £pop£ §Ypop psionique§! sur la planète."
 building_giga_shroud_conduit_hypersiphon_safe_effect:99 "\nHypersiphons psychiques amplifiant ce bâtiment : §Y[owner.GetHypersiphonNetworkSize]§!\n\nGénère des £giga_sr_psionic_sublimate£ §Y$giga_sr_psionic_sublimate$§! depuis §Y[this.GetHypersiphonPopCount]§! pops psioniques"
 building_giga_shroud_conduit_hypersiphon_effect:99 "\nHypersiphons psychiques amplifiant ce bâtiment : §Y[owner.GetHypersiphonNetworkSize]§!\n\nGénère des £giga_sr_psionic_sublimate£ §Y$giga_sr_psionic_sublimate$§! et de l'§Rinstabilité§! depuis §Y[this.GetHypersiphonPopCount]§! pops psioniques"
 decision_hypersiphon_mass_summon:99 "Invocation massive de $shroud_summoned_army_plural$"
 decision_hypersiphon_mass_summon_effect:99 "Invoque §G[owner.GetHypersiphonSummonCount]§! §Y$shroud_summoned_army_plural$§!, selon le nombre d'emplois de [owner.GetGigaShroudConduitJobIcon] §Y[owner.GetGigaShroudConduitJob]§! et de £pop£ §Ypops psioniques§! sur la planète."
 decision_hypersiphon_mass_summon_desc:99 "Avec une préparation rituelle complexe et d'énormes quantités de $giga_sr_psionic_sublimate$ concentré, des entités du Voile pourraient être invoquées à grande échelle."

 #######################################################################################################################
 # jobs

 job_giga_shroud_conduit_worker:99 "Technicien de Conduit du Voile"
 job_giga_shroud_conduit_worker_plural:99 "Techniciens de Conduit du Voile"
 job_giga_shroud_conduit_worker_desc:99 "Spécialistes chargés de gérer les minuscules tunnels vers le Voile ouverts par un $building_giga_shroud_conduit$."
 job_giga_shroud_conduit_worker_effect_desc:99 "$job_giga_shroud_conduit_worker_swap_plural_with_icon$ canalisent l'£energy£ §Y$energy$§! pour produire de l'£unity£ §Y$unity$§! et stimuler la productivité sur la planète."
 job_giga_shroud_conduit_worker_swap_plural_with_icon:99 "[giga_shroud_conduit_worker.GetIcon] [giga_shroud_conduit_worker.GetNamePlural]"
 mod_job_giga_shroud_conduit_worker_add:99 "Emplois de [giga_shroud_conduit_worker.GetName]"
 mod_job_giga_shroud_conduit_worker_per_pop:99 "§G+1§! emploi de [giga_shroud_conduit_worker.GetName] par tranche de $VALUE$ pops"
 mod_job_giga_shroud_conduit_worker_per_pop_short:99 "\n§G+1§! £mod_job_giga_shroud_conduit_worker_add£ par tranche de $VALUE$ £pop£"
 job_giga_shroud_conduit_worker_icon:99 "£job_giga_shroud_conduit_worker£"

 job_giga_shroud_conduit_priest:99 "Canalisateur du Voile"
 job_giga_shroud_conduit_priest_plural:99 "Canalisateurs du Voile"
 job_giga_shroud_conduit_priest_desc:99 "Clergé psionique chargé de gérer les connexions délicates générées par un $building_giga_shroud_conduit$."
 job_giga_shroud_conduit_priest_effect_desc:99 "$job_giga_shroud_conduit_priest_swap_plural_with_icon$ utilisent l'£energy£ §Y$energy$§! pour produire de l'£unity£ §Y$unity$§!, fournir des £amenities£ $MOD_PLANET_AMENITIES_ADD$ et stimuler la productivité sur la planète."
 job_giga_shroud_conduit_priest_swap_plural_with_icon:99 "[giga_shroud_conduit_priest.GetIcon] [giga_shroud_conduit_priest.GetNamePlural]"
 mod_job_giga_shroud_conduit_priest_add:99 "Emplois de [giga_shroud_conduit_priest.GetName]"
 mod_job_giga_shroud_conduit_priest_per_pop:99 "§G+1§! emploi de [giga_shroud_conduit_priest.GetName] par tranche de $VALUE$ pops"
 mod_job_giga_shroud_conduit_priest_per_pop_short:99 "\n§G+1§! £mod_job_giga_shroud_conduit_priest_add£ par tranche de $VALUE$ £pop£"
 job_giga_shroud_conduit_priest_icon:99 "£job_giga_shroud_conduit_priest£"

 job_giga_shroud_conduit_drone:99 "Drone de Conduit du Voile"
 job_giga_shroud_conduit_drone_plural:99 "Drones de Conduit du Voile"
 job_giga_shroud_conduit_drone_desc:99 "Drones psioniquement actifs spécialisés dans la gestion des connexions délicates générées par un $building_giga_shroud_conduit$."
 job_giga_shroud_conduit_drone_effect_desc:99 "$job_giga_shroud_conduit_drone_swap_plural_with_icon$ canalisent l'£energy£ §Y$energy$§! pour produire de l'£unity£ §Y$unity$§! et stimuler la productivité sur la planète."
 job_giga_shroud_conduit_drone_swap_plural_with_icon:99 "[giga_shroud_conduit_drone.GetIcon] [giga_shroud_conduit_drone.GetNamePlural]"
 mod_job_giga_shroud_conduit_drone_add:99 "Emplois de [giga_shroud_conduit_drone.GetName]"
 mod_job_giga_shroud_conduit_drone_per_pop:99 "§G+1§! emploi de [giga_shroud_conduit_drone.GetName] par tranche de $VALUE$ pops"
 mod_job_giga_shroud_conduit_drone_per_pop_short:99 "\n§G+1§! £mod_job_giga_shroud_conduit_worker_add£ par tranche de $VALUE$ £pop£"
 job_giga_shroud_conduit_drone_icon:99 "£job_giga_shroud_conduit_drone£"

 mod_planet_pops_psionic_upkeep_mult:99 "Entretien des £pop£ pops psioniques"

 #######################################################################################################################
 # situations

 ####################################################
 # siphon tracker

 giga_situation_hypersiphon_tracker_type:99 "Suivi du $name_psy_siphon$"
 giga_situation_hypersiphon_tracker:99 "Suivi du $name_psy_siphon$ de [target.planet.GetName]"
 giga_situation_hypersiphon_tracker_desc:99 "Gère les événements pour ce $name_psy_siphon$"
 giga_situation_hypersiphon_tracker_monthly_change_tooltip:99 ""

 ####################################################
 # instability

 giga_situation_hypersiphon_instability:99 "Instabilité du Conduit du Voile"
 giga_situation_hypersiphon_instability_type:99 "$giga_situation_hypersiphon_instability$"
 giga_situation_hypersiphon_instability_desc:99 "Les tunnels psioniques macroscopiques générés par notre $name_psy_siphon$ provoquent des fluctuations au sein de la structure locale du Voile.\nLes relevés indiquent des pics d'activité bien supérieurs à nos prédictions initiales, et si le niveau d'énergie monte trop haut, nous pourrions commencer à subir des effets négatifs."

 giga_situation_hypersiphon_instability_monthly_change_tooltip:99 "L'£mod_black_hole£ §YInstabilité du Conduit du Voile§! est causée par les bâtiments £building£ §Y$building_giga_shroud_conduit$§! amplifiés par les mégastructures §Y$name_psy_siphon$§!."
 giga_situation_hypersiphon_instability_progress_instability:99 "Bâtiments $building_giga_shroud_conduit$"
 giga_situation_hypersiphon_instability_progress_decay:99 "Dissipation naturelle"
 giga_situation_hypersiphon_instability_progress_mitigate:99 "$giga_situation_hypersiphon_instability_approach_mitigate$"
 giga_situation_hypersiphon_instability_progress_encourage:99 "$giga_situation_hypersiphon_instability_approach_encourage$"

 giga_situation_hypersiphon_instability_stage_1:99 "Instabilité du Voile §Eminimale§!"
 giga_situation_hypersiphon_instability_stage_1_effect:99 "Des événements perturbateurs liés au Voile peuvent survenir §Etrès rarement§!."
 giga_situation_hypersiphon_instability_stage_2:99 "Instabilité du Voile §Gfaible§!"
 giga_situation_hypersiphon_instability_stage_2_effect:99 "Des événements perturbateurs liés au Voile peuvent survenir §Grarement§!."
 giga_situation_hypersiphon_instability_stage_3:99 "Instabilité du Voile §Ymodérée§!"
 giga_situation_hypersiphon_instability_stage_3_effect:99 "Des événements perturbateurs liés au Voile peuvent survenir §Yde temps en temps§!."
 giga_situation_hypersiphon_instability_stage_4:99 "Instabilité du Voile §Hélevée§!"
 giga_situation_hypersiphon_instability_stage_4_effect:99 "Des événements perturbateurs liés au Voile surviendront §Hfréquemment§!."
 giga_situation_hypersiphon_instability_stage_5:99 "Instabilité du Voile §Rextrême§!"
 giga_situation_hypersiphon_instability_stage_5_effect:99 "Des événements perturbateurs liés au Voile surviendront §Rtrès fréquemment§!."

 giga_situation_hypersiphon_instability_approach_neutral:99 "Observer"
 giga_situation_hypersiphon_instability_approach_neutral_desc:99 "Le Voile est un royaume mystérieux et mal compris. Nous savons que quelque chose approche, mais c'est informe, éphémère. Nous continuerons d'observer."
 giga_situation_hypersiphon_instability_approach_neutral_effect:99 "Nous continuerons d'observer les fluctuations au sein du Voile."

 giga_situation_hypersiphon_instability_approach_encourage:99 "Encourager"
 giga_situation_hypersiphon_instability_approach_encourage_desc:99 "Il est impératif que nous utilisions cette puissance à son plein potentiel, même si cela signifie irriter ceux qui se dresseraient sur le chemin de notre grandeur."
 giga_situation_hypersiphon_instability_approach_encourage_effect:99 "Les emplois de [GetGigaShroudConduitJobIcon]§Y[GetGigaShroudConduitJob]§! sont §Gplus efficaces§! pour stimuler la production, mais la progression de la situation est accélérée de §R25 %§!, et les événements négatifs sont plus fréquents.\n "

 giga_situation_hypersiphon_instability_approach_mitigate:99 "Atténuer"
 giga_situation_hypersiphon_instability_approach_mitigate_desc:99 "Nous devons minimiser notre impact sur le Voile et ses habitants, de peur d'attirer leur courroux."
 giga_situation_hypersiphon_instability_approach_mitigate_effect:99 "La progression de la situation est ralentie de §G50 %§! et les événements négatifs sont moins fréquents, mais les emplois de [GetGigaShroudConduitJobIcon]§Y[GetGigaShroudConduitJob]§! sont §Rmoins efficaces§! pour stimuler la production.\n "

 giga_situation_hypersiphon_instability_complete_effect:99 "Une autre incursion majeure du Voile se produira quelque part dans notre espace."
 giga_situation_hypersiphon_instability_complete_effect_unknown:99 "Les conséquences de laisser ces énergies croître sont actuellement inconnues."
 giga_situation_hypersiphon_instability_fail_effect:99 "Le Voile redevient tranquille."

 #######################################################################################################################
 # situation events

 # instability situation start
 giga_hypersiphon.002.name:99 "Courants invisibles"
 giga_hypersiphon.002.desc:99 "Cela a commencé comme un léger tiraillement dans l'esprit de nos télépathes, mais c'est rapidement devenu quelque chose de plus. Il est maintenant évident que collecter des énergies directement de la substance du Voile en telles quantités provoque plus de turbulences dans son flux que nous ne l'avions initialement anticipé.\n\nEn l'état, nous restons incertains quant à ce que ces perturbations pourraient signifier pour nous à l'avenir, mais si elles continuent à s'intensifier, nous pourrions commencer à attirer l'attention des puissances qui y séjournent.\n\nPour l'instant, nous observerons."
 giga_hypersiphon.002.a:99 "Préoccupant."

 # siphon causes a blocker and damage
 giga_hypersiphon.010.name:99 "Dysfonctionnement du Siphon du Voile"
 giga_hypersiphon.010.desc:99 "L'équipage du $building_giga_shroud_conduit$ sur [hypersiphon_target.GetName] signale un pic massif d'énergie psionique sur [hypersiphon_target.GetPlanetMoon], se manifestant par une perturbation physique à la surface.\n\nLa zone affectée est devenue inutilisable et nécessitera un effort concentré pour être nettoyée."
 giga_hypersiphon.010.a:99 "Fâcheux."
 giga_hypersiphon.010.result.1:99 "Une petite région de [hypersiphon_target.GetName] a été contaminée par des déchets ectoplasmiques."
 giga_hypersiphon.010.result.2:99 "Une grande région de [hypersiphon_target.GetName] a été contaminée par des déchets ectoplasmiques."
 giga_hypersiphon.010.result.3:99 "Une région anormale s'est formée à la surface de [hypersiphon_target.GetName], déconcertant considérablement nos [hypersiphon_target.owner.GetScientistPlural]."
 giga_hypersiphon.010.result.4:99 "$giga_hypersiphon.010.result.3$"
 giga_hypersiphon.010.result.5:99 "Une immense région de [hypersiphon_target.GetName] a été engloutie par un violent système de tempêtes psioniques, semant le chaos à travers la surface mais servant de connexion au Voile."

 # siphon causes storm and shroud cows
 giga_hypersiphon.020.name:99 "Vaches du Voile dans [hypersiphon_target.GetName]"
 giga_hypersiphon.020.desc.first:99 "Une énorme tempête psionique s'est formée dans le système [hypersiphon_target.GetName], causant des ravages pour nos opérations spatiales.\n\nMystérieusement, un grand nombre d'entités du Voile apparemment passives sont également apparues dans le système. Nos télépathes les ont surnommées « Vaches du Voile », en raison de leur ressemblance frappante avec les Tiyanki, tant dans leur apparence physique que dans leur chant psionique."
 giga_hypersiphon.020.desc.normal:99 "Des créatures du Voile se sont manifestées dans le système [hypersiphon_target.GetName], et sont une fois de plus accompagnées d'une tempête psionique perturbatrice."
 giga_hypersiphon.020.desc.damage:99 "Une autre tempête psionique s'est formée dans le système [hypersiphon_target.GetName]. D'autres Vaches du Voile se sont également manifestées, immédiatement hostiles au trafic local et aux installations."
 giga_hypersiphon.020.a:99 "Comme c'est particulier..."
 giga_hypersiphon.020.b:99 "Encore elles ?"
 giga_hypersiphon.020.c:99 "Postes de combat !"
 giga_hypersiphon.020.effect:99 "Une tempête psionique s'est formée dans [hypersiphon_target.GetName], et a amené de la faune du Voile avec elle !"

 # shroud cows dissipate
 giga_hypersiphon.022.name:99 "Perturbation du Voile apaisée dans [hypersiphon_target.GetName]"
 giga_hypersiphon.022.desc:99 "La tempête psionique dans le système [hypersiphon_target.GetName] s'est dissipée, et les opérations reprennent leur cours normal.\n\nLes mystérieuses apparitions qui l'accompagnaient ont également disparu sans laisser de trace."
 giga_hypersiphon.022.a:99 "Tout est clair, pour l'instant."

 # siphon causes visions of doom
 giga_hypersiphon.030.name:99 "Visions funestes sur [hypersiphon_target.GetName]"
 giga_hypersiphon.030.desc:99 "La population de [hypersiphon_target.GetName] a récemment été frappée par de terribles rêves et visions de désastre imminent. Plusieurs secteurs industriels sur [hypersiphon_target.GetPlanetMoon] ont signalé des événements étranges, où des rétroactions psioniques ont entraîné une augmentation des taux de mortalité et des pannes mécaniques.\n\nNos télépathes rapportent qu'une forte présence liée au Voile s'est installée, et qu'il faudra peut-être du temps pour que les effets se dissipent."
 giga_hypersiphon.030.a:99 "Troublant."
 giga_hypersiphon.030.result.1.1:99 "La mort et la destruction ont rendu visite à ce monde."
 giga_hypersiphon.030.result.1.2:99 "Une destruction significative s'est abattue sur ce monde."
 giga_hypersiphon.030.result.1.3:99 "Une destruction généralisée a frappé ce monde."

 # minor incursion
 giga_hypersiphon.040.name:99 "Incursion du Voile dans [hypersiphon_target.GetName] !"
 giga_hypersiphon.040.desc:99 "Des entités hostiles du Voile se sont manifestées dans le système [hypersiphon_target.GetName] !\n\nLes premiers rapports suggèrent qu'elles se déplacent de façon erratique, sans but clair, attaquant tout ce qui se trouve en vue. Nos télépathes supposent que ces apparitions n'ont pas de connexion avec leur royaume d'origine, et que sans source de subsistance, leurs énergies pourraient éventuellement se dissiper dans l'espace."
 giga_hypersiphon.040.a:99 "Regrettable."
 giga_hypersiphon.040.result:99 "§LDes visiteurs aux intentions malveillantes et au dessein confus...§!"

 # major incursion happens
 giga_hypersiphon.100.name:99 "Incursion majeure du Voile dans [hypersiphon_target.GetName] !"
 giga_hypersiphon.100.desc:99 "Un grand nombre d'entités hostiles du Voile se sont manifestées dans le système [hypersiphon_target.GetName], regroupées autour d'une sorte de faille.\n\nElles semblent lancer une attaque dirigée contre nos installations dans le système, suggérant une forme d'action organisée. Nos télépathes supposent qu'avec cette connexion soutenue à leur royaume d'origine, de telles entités pourraient opérer indéfiniment sur notre plan, et même vagabonder au-delà des frontières du système."
 giga_hypersiphon.100.a:99 "Préparez une contre-offensive immédiatement !"
 giga_hypersiphon.100.restart:99 "Relance la situation : §Y$giga_situation_hypersiphon_instability$§!\n\n§MÀ travers le voile, avec malice et furie...§!"

 # incursion notification
 giga_hypersiphon.101.name:99 "Pic d'énergie psionique"
 giga_hypersiphon.101.desc:99 "Une énorme signature énergétique a été détectée dans le système [hypersiphon_target.GetName], situé dans l'espace de [hypersiphon_target.owner.GetName]. Les premiers rapports suggèrent que des apparitions hostiles ont émergé d'une faille et attaquent tout dans le système."
 giga_hypersiphon.101.a:99 "Troublant."

 # planet shrouded notification
 giga_hypersiphon.103.name:99 "Colonie engloutie par le Voile"
 giga_hypersiphon.103.desc:99 "Des attaques soutenues par des entités du Voile ont détruit la colonie sur [This.GetName], recouvrant la planète d'une épaisse couche de nuages de tempête psionique. Il semble que la surface ait été purgée de toute vie détectable, et les relevés de la planète suggèrent que des conditions bizarres, défiant les lois de la physique, prévalent désormais partout."
 giga_hypersiphon.103.a:99 "Une tragédie."

 # destroyed portal yourself
 giga_hypersiphon.105.name:99 "Incursion du Voile stoppée"
 giga_hypersiphon.105.desc.first:99 "Nos forces ont réussi à refermer la faille du Voile dans le système [fromfrom.solar_system.GetName]. Leur connexion au Voile étant coupée, les entités hostiles qui en ont émergé se sont rapidement dissipées, les rendant inoffensives.\n\nUne question demeure : quelle est notre solution à long terme pour ce problème ? L'instabilité persiste, et cela se reproduira si les choses restent inchangées. Une faible signature des envahisseurs persiste encore autour de l'ouverture fermée, et les résidus laissés sur nos vaisseaux peuvent être étudiés.\n\nPeut-être cela nous apportera-t-il les réponses que nous cherchons."
 giga_hypersiphon.105.desc.other:99 "Nos forces ont réussi à refermer la faille du Voile dans le système [fromfrom.solar_system.GetName]. Leur connexion au Voile étant coupée, les entités hostiles qui en ont émergé se sont rapidement dissipées, les rendant inoffensives.\n\nLe Voile reste agité — il semble que notre travail ne soit jamais terminé."
 giga_hypersiphon.105.a:99 "Une opportunité intéressante..."
 giga_hypersiphon.105.b:99 "Toujours vigilants."

 # destroyed someone else's portal
 giga_hypersiphon.106.name:99 "Portail du Voile fermé"
 giga_hypersiphon.106.desc:99 "Nos forces ont réussi à refermer la faille énergétique dans le système [fromfrom.solar_system.GetName]. Leur connexion à leur origine étant coupée, les entités hostiles qui en ont émergé se sont rapidement dissipées, les rendant inoffensives.\n\nLes relevés suggèrent que la région est maintenant sûre, sans lectures d'énergie résiduelles significatives."
 giga_hypersiphon.106.a:99 "Espérons que cela reste ainsi."

 # someone else destroyed your portal
 giga_hypersiphon.107.name:99 "Incursion du Voile stoppée"
 giga_hypersiphon.107.desc.first:99 "Les forces appartenant à [from.GetName] ont réussi à refermer la faille du Voile dans le système [fromfrom.solar_system.GetName]. Leur connexion au Voile étant coupée, les entités hostiles qui en ont émergé se sont rapidement dissipées, les rendant inoffensives.\n\nUne question demeure : quelle est notre solution à long terme pour ce problème ? L'instabilité persiste, et cela se reproduira si les choses restent inchangées. Une faible signature des envahisseurs persiste encore autour de l'ouverture fermée, et les résidus laissés sur nos vaisseaux peuvent être étudiés.\n\nPeut-être cela nous apportera-t-il les réponses que nous cherchons."
 giga_hypersiphon.107.desc.other:99 "Les forces appartenant à [from.GetName] ont réussi à refermer la faille du Voile dans le système [fromfrom.solar_system.GetName]. Leur connexion au Voile étant coupée, les entités hostiles qui en ont émergé se sont rapidement dissipées, les rendant inoffensives.\n\nLe Voile reste agité — il est probable qu'une autre incursion se produise à l'avenir."
 giga_hypersiphon.107.a:99 "Une opportunité intéressante..."
 giga_hypersiphon.107.b:99 "Peut-être restera-t-elle fermée cette fois..."

 # a portal was destroyed and you aren't involved
 giga_hypersiphon.108.name:99 "Portail du Voile fermé"
 giga_hypersiphon.108.desc:99 "Les forces appartenant à [from.GetName] ont réussi à refermer la faille énergétique dans le système [fromfrom.solar_system.GetName]. Leur connexion à leur origine étant coupée, les entités hostiles qui en ont émergé se sont rapidement dissipées, les rendant inoffensives.\n\nLes rapports suggèrent que la région est maintenant sûre, sans lectures d'énergie résiduelles significatives."
 giga_hypersiphon.108.a:99 "Compris."

 # unlocking new approaches
 giga_hypersiphon.109.name:99 "Analyse du portail du Voile terminée"
 giga_hypersiphon.109.desc:99 "L'analyse préliminaire des résidus laissés par les envahisseurs du Voile a fourni quelques éclaircissements sur la façon dont nos Conduits du Voile et Hypersiphons affectent le flux et le reflux du Voile.\n\nL'application soigneuse de mesures de sécurité et de rituels exécutés avec précision nous permettrait d'atténuer les effets négatifs de notre connexion, mais le soin supplémentaire requis réduirait les bénéfices économiques de nos installations de conduit.\n\nAlternativement, nous pourrions ignorer les dommages causés et nous concentrer plutôt sur l'amplification de nos conduits en attirant des énergies exploitables. Cela améliorerait les bénéfices de nos conduits, mais pourrait provoquer des réactions négatives plus fréquentes."
 giga_hypersiphon.109.a:99 "Intrigant."
 giga_hypersiphon.109.effect:99 "Débloque les approches §Y$giga_situation_hypersiphon_instability_approach_mitigate$§! et §Y$giga_situation_hypersiphon_instability_approach_encourage$§! pour la situation §Y$giga_situation_hypersiphon_instability$§!."

