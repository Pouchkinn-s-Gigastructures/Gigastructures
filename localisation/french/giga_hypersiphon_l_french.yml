 d_giga_hypersiphon_goop:99 "£blocker£ Décharge du Voile"
 d_giga_hypersiphon_goop_desc:99 "Essence psionique condensée et résidus ectoplasmiques, violemment toxiques sur un plan ontologique."

 d_giga_hypersiphon_psionic_anomaly:99 "£blocker£ Zone anormale"
 d_giga_hypersiphon_psionic_anomaly_desc:99 "Une région où les lois de la nature se plient comme des branches sous le vent."

 d_giga_hypersiphon_psionic_supercell_planet:99 "£blocker£ Supercellule psionique"
 d_giga_hypersiphon_psionic_supercell_planet_desc:99 "Une tempête féroce consumant une immense région de la surface planétaire, la rendant inhabitable, et envoyant des ondes de choc psioniques à travers les esprits de toute la population."

 d_giga_hypersiphon_psionic_supercell_artificial:99 "£blocker£ Interférence psionique des systèmes"
 d_giga_hypersiphon_psionic_supercell_artificial_desc:99 "Une énorme anomalie psionique causant des interférences significatives avec les systèmes locaux. Des ondes de choc se propagent fréquemment à travers la conscience collective de toute la population."

