l_french:
  
  #########################################
  ### Quasi-Stellar Obliterator ###########
  #########################################
  
  ### Techs ###
  giga_tech_quasi_stellar_1:0 "Blindage hyperdimensionnel"
  giga_tech_quasi_stellar_1_desc:0 "Les quasars sont des objets incroyablement énergétiques. Si nous souhaitons entreprendre tout type de projets d'ingénierie à leur proximité, il sera nécessaire de développer un blindage avancé pour protéger nos structures de l'attraction gravitationnelle et des radiations du quasar."
  
  giga_tech_quasi_stellar_2:0 "Compression par accrétion gravitationnelle"
  giga_tech_quasi_stellar_2_desc:0 "L'hyperquasar au coeur galactique est entouré d'un disque d'accrétion massif et extrêmement énergétique. Ce disque rend évidemment impossible l'assemblage de quoi que ce soit à proximité du quasar. Cependant, en modifiant la constante gravitationnelle près du quasar, nous pourrions effectivement simuler une augmentation de la masse de l'objet, ce qui forcerait le disque à rétrécir vers une taille plus petite. Cela augmenterait effectivement à la fois son potentiel énergétique et nous permettrait de construire une structure beaucoup plus près du quasar."
  
  giga_tech_quasi_stellar_3:0 "Déviation des jets relativistes"
  giga_tech_quasi_stellar_3_desc:0 "L'une des caractéristiques les plus importantes du quasar supermassif est la présence de deux jets gigantesques, constitués de jets hyperaccélérés de matière ionisée jaillissant des deux pôles à des vitesses relativistes. Ces jets sont extrêmement énergétiques, et la capacité de récolter et de rediriger leurs énergies cataclysmiques serait très utile pour alimenter notre future hyper-arme."
  
  giga_tech_quasi_stellar_4:0 "Machines de calcul térascalaires"
  giga_tech_quasi_stellar_4_desc:0 "L'$name_quasistellar$ est extrêmement grand, et des ordinateurs tout aussi gigantesques seront nécessaires si nous souhaitons maintenir correctement la structure, ainsi que gérer les quantités ridicules d'énergie employées par l'hyper-arme."
  
  giga_tech_quasi_stellar_5:0 "Manipulation de l'énergie quasarique"
  giga_tech_quasi_stellar_5_desc:0 "Récolter, stocker et rediriger d'une manière ou d'une autre les énergies pures émises par un quasar supermassif nécessitera de combiner plusieurs technologies extrêmement avancées, allant des capaciteurs hyperdimensionnels à la modulation de champ supergravitique."
  
  giga_tech_quasi_stellar_6:0 "L'$name_quasistellar$"
  giga_tech_quasi_stellar_6_desc:0 "L'$name_quasistellar$ est une arme employant pratiquement tous les types de technologies que nous connaissons, afin de transformer le corps le plus énergétique de toute la galaxie en arme. Cette construction redoutable est véritablement le summum de l'armement hyperscalé, surpassant même le $name_ndb$ et les Vaisseaux-systèmes de plusieurs ordres de grandeur."
  
  ### Megastructure ###
  quasi_stellar_obliterator_0:0 "$gc_tera$Site de construction de l'$name_quasistellar$"
  quasi_stellar_obliterator_0_DESC:0 "Le site de construction d'un futur $name_quasistellar$, flottant à côté d'un quasar supermassif colossal. Cette plateforme relativement petite sera utilisée comme base pour construire la plus grande et la plus ridicule hyper-arme jamais assemblée par des êtres intelligents dans cette galaxie."
  quasi_stellar_obliterator_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_terastructure$ - $giga_list_category_weaponry$\nConstruit une hyper-arme autour d'un §Yhyperquasar§! qui peut détruire des §Yamas stellaires§! entiers !\n§LUne hyper-arme ridiculement gigantesque construite autour d'un quasar, capable d'une puissance destructrice indicible.§!"
  quasi_stellar_obliterator_0_CONSTRUCTION_INFO_DELAYED:0 "$giga_list_additional_data$ - L'§YOblitérateur quasi-stellaire§! est capable de détruire soit des §Yplanètes§! individuelles, des §Ysystèmes solaires§! soit des §Yamas stellaires§! entiers. Il a une très forte chance de mettre en §Ycolère§! la galaxie et de la faire §Ys'unir§! contre nous !"
  # quasi_stellar_obliterator_0_CONSTRUCTION_INFO_DELAYED:0 "$giga_list_additional_data$ - The §YQuasi-Stellar Obliterator§! is capable of destroying either singular §YPlanets§!, §YSolar Systems§! or entire §YStar Clusters§!. It has a very high chance of §YANGERING§! the galaxy and causing it to §Yunite§! against us!"
  
  quasi_stellar_obliterator_1:0 "Condenseur d'accrétion de l'$name_quasistellar$"
  quasi_stellar_obliterator_1_DESC:0 "Cet anneau partiel colossal entoure le quasar et emploie des presses ultragravitiques hyperdimensionnelles pour modifier localement la constante gravitationnelle et condenser efficacement le disque d'accrétion tumultueux du quasar."
  
  quasi_stellar_obliterator_2:0 "Déflecteurs relativistes de l'$name_quasistellar$"
  quasi_stellar_obliterator_2_DESC:0 "Un ensemble de conduits d'alimentation conçus de manière complexe et de déflecteurs ultra-efficaces sont utilisés pour rassembler et rediriger soigneusement les jets polaires du quasar, nous accordant d'immenses quantités d'énergie utilisable pour notre hyper-arme."
  
  quasi_stellar_obliterator_3:0 "Hyperordinateurs de l'$name_quasistellar$"
  quasi_stellar_obliterator_3_DESC:0 "D'énormes ordinateurs intégrés dans l'armature colossale de l'hyper-arme, afin de contrôler et d'ajuster correctement l'immense flux d'énergie récoltée du quasar, et de stabiliser la structure dans son ensemble."
  
  quasi_stellar_obliterator_4:0 "Téracapaciteurs de l'$name_quasistellar$"
  quasi_stellar_obliterator_4_DESC:0 "Ces anneaux gargantuesque entourant le quasar sont utilisés pour récolter l'énergie à la fois du disque d'accrétion et du processus Penrose, et pour la rediriger là où elle doit aller, que ce soit vers les unités de stockage gigantesques ou vers l'arme elle-même."
  
  quasi_stellar_obliterator_firing_1:0 "$name_quasistellar$"
  quasi_stellar_obliterator_firing_1_DESC:0 "Cet $name_quasistellar$ est actuellement en train de tirer son arme."
  quasi_stellar_obliterator_firing_1_MEGASTRUCTURE_DETAILS:0 "$quasi_stellar_obliterator_firing_1_DESC$"
  
