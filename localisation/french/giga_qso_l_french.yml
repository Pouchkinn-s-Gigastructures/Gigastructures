 giga_qso.004.desc:99 "Veuillez sélectionner une classe stellaire à cibler."

 giga_qso.005.desc:99 "Veuillez sélectionner un système à cibler."

 giga_qso.006.desc:99 "Veuillez sélectionner un mode de ciblage pour l'O.Q.S.\n\nCibler l'§Yamas stellaire§! marque le système lui-même et tous les systèmes adjacents pour destruction. Les systèmes adjacents protégés par un $giga_fe_shield$ ou un $d_maginot_subspace_disruptor$ ne seront pas affectés.\n\nCibler le §Ysystème solaire§! marque uniquement le système pour destruction, laissant les systèmes environnants intacts.\n§TSystèmes actuellement ciblés :§! §Y[root.giga_qso_targeted_systems]/4§!\n\nCibler une §Yplanète§! marque les planètes sélectionnées pour destruction, laissant le système intact. Vous pouvez cibler simultanément jusqu'à §Y10§! planètes à travers plusieurs systèmes ou empires.\n§TPlanètes actuellement ciblées :§! §Y[root.giga_qso_targeted_planets]/10§!"
 giga_qso.006.a:99 "Cibler l'amas stellaire"
 giga_qso.006.b:99 "Cibler le système solaire"
 giga_qso.006.c:99 "Cibler une planète"

 giga_qso.007.desc:99 "Veuillez sélectionner jusqu'à §Y10§! planètes à cibler. Ces planètes ne sont pas obligées d'être dans le même système ni même dans le même empire.\n\n§TPlanètes actuellement ciblées :§! §Y[root.giga_qso_targeted_planets]/10§!"
 giga_qso.0070.desc:99 "Veuillez confirmer votre désir de tirer sur l'amas stellaire désigné. Au-delà de ce point, il n'y a pas de retour en arrière et §Rl'amas stellaire désigné sera détruit.§!"
 giga_qso.0071.desc:99 "Veuillez confirmer votre désir de tirer sur les systèmes désignés. Au-delà de ce point, il n'y a pas de retour en arrière et §Rles systèmes désignés seront détruits.§!\n\n§TSystèmes actuellement ciblés :§! §Y[root.giga_qso_targeted_systems]/4§!"
 giga_qso.0072.desc:99 "Veuillez sélectionner les systèmes que vous souhaitez cesser de cibler.\n\n§TSystèmes actuellement ciblés :§! §Y[root.giga_qso_targeted_systems]/4§!"
 giga_qso.0073.desc:99 "Veuillez confirmer votre désir de tirer sur les planètes désignées. Au-delà de ce point, il n'y a pas de retour en arrière et §Rles planètes désignées seront détruites.§!\n\n§TPlanètes actuellement ciblées :§! §Y[root.giga_qso_targeted_planets]/10§!"
 giga_qso.0074.desc:99 "Veuillez sélectionner les planètes que vous souhaitez cesser de cibler.\n\n§TPlanètes actuellement ciblées :§! §Y[root.giga_qso_targeted_planets]/10§!"

