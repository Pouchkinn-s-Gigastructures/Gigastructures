 quasi_stellar_gateway_off:99 "Portail de l'O.Q.S."
 quasi_stellar_gateway_off_DESC:99 "Similaire en principe au portail du $name_ndb$, ce portail à travers le sous-espace permet le transfert instantané d'énormes quantités d'énergie."
 quasi_stellar_gateway_off_MEGASTRUCTURE_DETAILS:99 "$quasi_stellar_gateway_off_DESC$"

 quasi_stellar_gateway_on:99 "Portail de l'O.Q.S. actif"
 quasi_stellar_gateway_on_DESC:99 "Similaire en principe au portail du $name_ndb$, ce portail à travers le sous-espace permet le transfert instantané d'énormes quantités d'énergie."

 quasi_stellar_obliterator_5:99 "$name_quasistellar$"
 quasi_stellar_obliterator_5_DESC:99 "Un $name_quasistellar$ complet et pleinement opérationnel. Tirant son énergie des jets polaires du quasar, du disque d'accrétion et du processus de Penrose, cette hyperarme gargantuesque est capable de déchaîner la fureur de l'équivalent en énergie stellaire d'une galaxie entière sur sa malheureuse cible."

 quasi_stellar_obliterator_6:99 "Panneau de contrôle de l'O.Q.S."
 quasi_stellar_obliterator_6_DESC:99 "Ouvrez le panneau de contrôle de l'hyperarme pour la configurer ou faire feu."

