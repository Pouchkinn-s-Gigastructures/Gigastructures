  quasi_stellar_gateway_off:0 "Portail de l'O.Q.-S."
  quasi_stellar_gateway_off_DESC:0 "Similaire en principe au portail du $name_ndb$, ce portail à travers le sous-espace permet le transfert instantané d'énormes quantités d'énergie."
  quasi_stellar_gateway_off_MEGASTRUCTURE_DETAILS:0 "$quasi_stellar_gateway_off_DESC$"
  
  quasi_stellar_gateway_on:0 "Portail de l'O.Q.-S. actif"
  quasi_stellar_gateway_on_DESC:0 "Similaire en principe au portail du $name_ndb$, ce portail à travers le sous-espace permet le transfert instantané d'énormes quantités d'énergie."
  
  quasi_stellar_obliterator_5:0 "$name_quasistellar$"
  quasi_stellar_obliterator_5_DESC:0 "Un $name_quasistellar$ complet et pleinement opérationnel. Puisant l'énergie des jets polaires du quasar, du disque d'accrétion et du processus Penrose, cette hyper-arme gargantuesque est capable de déchaîner la fureur de l'énergie stellaire d'une galaxie entière sur sa malheureuse cible."
  
  quasi_stellar_obliterator_6:0 "Panneau de contrôle de l'O.Q.-S."
  quasi_stellar_obliterator_6_DESC:0 "Ouvrir le panneau de contrôle de l'hyper-arme, pour la tirer ou la configurer."
  
