 giga.qso.noplanetstoremove:99 "Il n'y a pas de planètes ciblées à retirer."

 giga_qso.002.name:99 "Oblitérateur quasi-stellaire"
 giga_qso.002.desc:99 "Voici le §Ymenu de gestion des cibles§! de l'$name_quasistellar$, ici vous pouvez sélectionner des pays à cibler en fonction de leur allégeance envers [root.GetName].\n\nLes cibles §Rhostiles§! incluent généralement : les ['concept_marauder_empires'], les ['concept_endgame_crises'] et les empires avec lesquels nous sommes en guerre.\n\nLes cibles §Yneutres§! incluent généralement : les ['concept_preftl_civilizations'], les empires avec lesquels nous sommes en paix mais avec qui nous ne partageons pas d'['concept_subject_agreement'], de ['concept_federation'] ou certains ['concept_diplomatic_pacts'].\n\nLes cibles §Gamicales§! incluent : les systèmes contrôlés à l'intérieur de nos propres frontières."
 giga_qso.002.a:99 "§ESélection des cibles§!"
 giga_qso.002.b:99 "Hostile"
 giga_qso.002.c:99 "Neutre"
 giga_qso.002.d:99 "Amical"
 giga_qso.002.e:99 "§EGestion des cibles - Amas§!"
 giga_qso.002.f:99 "Détruire l'amas ciblé"
 giga_qso.002.g:99 "Retirer l'amas ciblé"
 giga_qso.002.h:99 "§EGestion des cibles - Système§!"
 giga_qso.002.i:99 "Détruire les systèmes ciblés"
 giga_qso.002.j:99 "Retirer un système ciblé"
 giga_qso.002.k:99 "§EGestion des cibles - Planète§!"
 giga_qso.002.l:99 "Détruire les planètes ciblées"
 giga_qso.002.m:99 "Retirer une planète ciblée"

 giga_qso.003.desc:99 "Veuillez sélectionner un empire à cibler."

 giga_qso.004.desc:99 "Veuillez sélectionner une classe stellaire à cibler."

 giga_qso.005.desc:99 "Veuillez sélectionner un système à cibler."

 giga_qso.006.desc:99 "Veuillez sélectionner un mode de ciblage pour l'O.Q.S.\n\nCibler l'§Yamas stellaire§! marque le système lui-même et tous les systèmes adjacents pour destruction. Les systèmes adjacents protégés par un $giga_fe_shield$ ou un $d_maginot_subspace_disruptor$ ne seront pas affectés.\n\nCibler le §Ysystème solaire§! ne marque que le système pour destruction, laissant les systèmes environnants intacts.\n§TSystèmes actuellement ciblés :§! §Y[root.giga_qso_targeted_systems]/4§!\n\nCibler une §Yplanète§! marque les planètes sélectionnées pour destruction, laissant le système intact. Vous pouvez cibler simultanément jusqu'à §Y10§! planètes à travers plusieurs systèmes ou empires.\n§TPlanètes actuellement ciblées :§! §Y[root.giga_qso_targeted_planets]/10§!"
 giga_qso.006.a:99 "Cibler l'amas stellaire"
 giga_qso.006.b:99 "Cibler le système solaire"
 giga_qso.006.c:99 "Cibler une planète"

 giga_qso.007.desc:99 "Veuillez sélectionner jusqu'à §Y10§! planètes à cibler. Ces planètes ne sont pas obligées d'être dans le même système ni même dans le même empire.\n\n§TPlanètes actuellement ciblées :§! §Y[root.giga_qso_targeted_planets]/10§!"
 giga_qso.0070.desc:99 "Veuillez confirmer votre désir de faire feu sur l'amas stellaire désigné. Au-delà de ce point, il n'y a pas de retour en arrière et §Rl'amas stellaire désigné sera détruit.§!"
 giga_qso.0071.desc:99 "Veuillez confirmer votre désir de faire feu sur les systèmes désignés. Au-delà de ce point, il n'y a pas de retour en arrière et §Rles systèmes désignés seront détruits.§!\n\n§TSystèmes actuellement ciblés :§! §Y[root.giga_qso_targeted_systems]/4§!"
 giga_qso.0072.desc:99 "Veuillez sélectionner les systèmes que vous souhaitez cesser de cibler.\n\n§TSystèmes actuellement ciblés :§! §Y[root.giga_qso_targeted_systems]/4§!"
 giga_qso.0073.desc:99 "Veuillez confirmer votre désir de faire feu sur les planètes désignées. Au-delà de ce point, il n'y a pas de retour en arrière et §Rles planètes désignées seront détruites.§!\n\n§TPlanètes actuellement ciblées :§! §Y[root.giga_qso_targeted_planets]/10§!"
 giga_qso.0074.desc:99 "Veuillez sélectionner les planètes que vous souhaitez cesser de cibler.\n\n§TPlanètes actuellement ciblées :§! §Y[root.giga_qso_targeted_planets]/10§!"

