 giga_qso.008.name:99 "$name_quasistellar$ : Paramètres"
 giga_qso.008.desc:99 "Ici, vous pouvez gérer la production/consommation d'énergie de l'O.Q.S. lui-même.\n\nAugmenter le §Ytaux de charge§! de l'O.Q.S. augmentera sa production d'£giga_sr_quasaric_energy£ §Y$giga_sr_quasaric_energy$§! au prix d'un entretien en £energy£ §Y$energy$§! plus élevé.\n\nDiminuer le taux de charge diminuera sa production d'£giga_sr_quasaric_energy£ §Y$giga_sr_quasaric_energy$§!, en retour, l'entretien en £energy£ §Y$energy$§! de l'O.Q.S. sera réduit, annulé ou même transformé en production d'£energy£ §Y$energy$§!.\n\nVous pouvez également déverser diverses ressources, telles que des £minerals£§Y$minerals$§!, de la £food£§Y$food$§!, des £consumer_goods£ §Y$consumer_goods$§!, des £alloys£ §Y$alloys$§!, de la £giga_sr_bulk_matter£ §Y$giga_sr_bulk_matter$§! et §Rautres...§! dans le trou noir en dessous pour gagner rapidement de petites quantités d'£giga_sr_quasaric_energy£ §Y$giga_sr_quasaric_energy$§!."

 giga_qso.009.name:99 "$name_quasistellar$ : Déversement de ressources"
