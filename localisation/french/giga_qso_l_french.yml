 giga.qso.novalidtargets:99 "Aucune cible valide."
 giga.qso.maxtargetedplanets:99 "Nous avons ciblé le nombre maximum de planètes, désélectionnez au moins une cible avant d'essayer d'en sélectionner davantage."
 giga.qso.maxtargetedsystems:99 "Nous avons ciblé le nombre maximum de systèmes, désélectionnez au moins une cible avant d'essayer d'en sélectionner davantage."
 giga.qso.canttargetsystemtwice:99 "Nous ne pouvons pas cibler le même système deux fois."
 giga.qso.noclustertodestroy:99 "Il n'y a pas d'amas ciblés à détruire."
 giga.qso.noclustertoremove:99 "Il n'y a pas d'amas ciblés à retirer."
