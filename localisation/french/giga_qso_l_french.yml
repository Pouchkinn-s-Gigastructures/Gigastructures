 #########################################
 ### Quasi-Stellar Obliterator ###########
 #########################################

 ### Techs ###
 giga_tech_quasi_stellar_1:99 "Blindage hyperdimensionnel"
 giga_tech_quasi_stellar_1_desc:99 "Les quasars sont des objets incroyablement énergétiques. Si nous souhaitons entreprendre tout type de projet d'ingénierie à proximité, il sera nécessaire de développer un blindage avancé pour protéger nos structures de l'attraction gravitationnelle et des radiations du quasar."

 giga_tech_quasi_stellar_2:99 "Compression par accrétion gravitationnelle"
 giga_tech_quasi_stellar_2_desc:99 "L'hyperquasar au coeur galactique est entouré d'un disque d'accrétion massif et extrêmement énergétique. Ce disque rend évidemment impossible tout assemblage à proximité du quasar. Cependant, en modifiant la constante gravitationnelle près du quasar, nous pourrions effectivement simuler une augmentation de la masse de l'objet, ce qui forcerait le disque à se réduire à une taille plus petite. Cela augmenterait en effet son potentiel énergétique, tout en nous permettant de construire une structure bien plus proche du quasar."

 giga_tech_quasi_stellar_3:99 "Déflexion des jets relativistes"
 giga_tech_quasi_stellar_3_desc:99 "L'une des caractéristiques les plus proéminentes du quasar supermassif est la présence de deux jets gigantesques, constitués de jets hyperaccélérés de matière ionisée jaillissant des deux pôles à des vitesses relativistes. Ces jets sont extrêmement énergétiques, et la capacité de récolter et rediriger leurs énergies cataclysmiques serait très utile pour alimenter notre future hyperarme."

 giga_tech_quasi_stellar_4:99 "Machines de calcul à l'échelle téra"
 giga_tech_quasi_stellar_4_desc:99 "L'$name_quasistellar$ est extrêmement grand, et des ordinateurs tout aussi gigantesques seront nécessaires si nous souhaitons entretenir correctement la structure, ainsi que gérer les quantités ridicules d'énergie employées par l'hyperarme."

 giga_tech_quasi_stellar_5:99 "Manipulation de l'énergie quasarique"
 giga_tech_quasi_stellar_5_desc:99 "Récolter, stocker et rediriger d'une manière ou d'une autre les énergies pures émises par un quasar supermassif nécessitera de combiner plusieurs technologies extrêmement avancées, allant des condensateurs hyperdimensionnels à la modulation de champ supergravitique."

 giga_tech_quasi_stellar_6:99 "L'$name_quasistellar$"
 giga_tech_quasi_stellar_6_desc:99 "L'$name_quasistellar$ est une arme employant pratiquement tous les types de technologies que nous connaissons, afin de faire une arme du corps le plus énergétique de toute la galaxie. Cette redoutable construction est véritablement le summum de l'armement hyperscalaire, surpassant même le $name_ndb$ et les vaisseaux-systèmes de plusieurs ordres de grandeur."

 ### Megastructure ###
 quasi_stellar_obliterator_0:99 "$gc_tera$Site de construction de l'$name_quasistellar$"
 quasi_stellar_obliterator_0_DESC:99 "Le site de construction d'un futur $name_quasistellar$, flottant à côté d'un colossal quasar supermassif. Cette plateforme relativement petite servira de base pour construire la plus grandiose et la plus extravagante des hyperarmes jamais assemblées par des êtres intelligents dans cette galaxie."
 quasi_stellar_obliterator_0_MEGASTRUCTURE_DETAILS:99 "$giga_list_category_terastructure$ - $giga_list_category_weaponry$\nConstruit une hyperarme autour d'un §Yhyperquasar§! capable de détruire des §Yamas stellaires§! entiers\n§LUne hyperarme ridiculement gigantesque construite autour d'un quasar, capable d'une puissance destructrice incommensurable.§!"
 quasi_stellar_obliterator_0_CONSTRUCTION_INFO_DELAYED:99 "$giga_list_additional_data$ - L'§Yoblitérateur quasi-stellaire§! est capable de détruire soit des §Yplanètes§! individuelles, des §Ysystèmes solaires§! ou des §Yamas stellaires§! entiers."
 # quasi_stellar_obliterator_0_CONSTRUCTION_INFO_DELAYED:99 "$giga_list_additional_data$ - The §YQuasi-Stellar Obliterator§! is capable of destroying either singular §YPlanets§!, §YSolar Systems§! or entire §YStar Clusters§!. It has a very high chance of §YANGERING§! the galaxy and causing it to §Yunite§! against us!"

 quasi_stellar_obliterator_1:99 "Condenseur d'accrétion de l'$name_quasistellar$"
 quasi_stellar_obliterator_1_DESC:99 "Cet anneau partiel colossal entoure le quasar et emploie des presses ultragravitiques hyperdimensionnelles pour modifier localement la constante gravitationnelle et condenser efficacement le tumultueux disque d'accrétion du quasar."

 quasi_stellar_obliterator_2:99 "Déflecteurs relativistes de l'$name_quasistellar$"
 quasi_stellar_obliterator_2_DESC:99 "Un ensemble de conduits d'énergie minutieusement conçus et de déflecteurs ultra-efficaces sont utilisés pour recueillir et rediriger soigneusement les jets polaires du quasar, nous accordant d'immenses quantités d'énergie utilisable pour notre hyperarme."

 quasi_stellar_obliterator_3:99 "Hyperordinateurs de l'$name_quasistellar$"
 quasi_stellar_obliterator_3_DESC:99 "D'énormes ordinateurs intégrés dans la structure colossale de l'hyperarme, afin de contrôler et d'ajuster correctement l'immense flux d'énergie récoltée du quasar, et de stabiliser la structure dans son ensemble."

 quasi_stellar_obliterator_4:99 "Téracondensateurs de l'$name_quasistellar$"
 quasi_stellar_obliterator_4_DESC:99 "Ces anneaux gargantuesque entourant le quasar sont utilisés pour récolter l'énergie à la fois du disque d'accrétion et du processus de Penrose, et pour la rediriger là où elle doit aller, que ce soit vers les gigantesques unités de stockage ou vers l'arme elle-même."

