  ### Pangalactic Federation ###
  giga_qso.3000.name:0 "La Pax Quasaria"
  giga_qso.3000.desc:0 "§RNouvelles alarmantes !§!\n\nSuite à l'achèvement d'une partie importante de notre $name_quasistellar$, il semble que la galaxie commence à nous considérer comme une menace universelle pour la sécurité galactique. En effet, tous les empires non génocidaires ont aujourd'hui accepté un cessez-le-feu de durée indéterminée, ainsi que des pactes de non-agression mutuels, surnommés la « Pax Quasaria ». Ils ont décidé, pour l'instant du moins, de mettre de côté leurs querelles mesquines afin de s'assurer que nous ne puissions pas menacer la sécurité galactique avec notre hyper-arme..."
  giga_qso.3000.a:0 "Ils pensent que cela leur sera utile ?"
  
  
  giga_fed.3012.name:0 "§RDéclaration de guerre !§!"
  giga_fed.3012.desc:0 "[root.GetName], nous ne pouvons pas laisser vos agissements néfastes continuer plus longtemps.\n\nCeci est une déclaration de guerre officielle. Rendez-vous maintenant, et peut-être épargnerons-nous votre civilisation de la destruction."
  giga_fed.3012.a:0 "Pathétique."
  
  giga_fed.3006.name:0 "Le Pacte de défense galactique"
  giga_fed.3006.desc:0 "L'empire [root.GetName] a entrepris la construction d'une hyper-arme qui pourrait menacer la civilisation telle que nous la connaissons.\n\nÀ ce titre, sous l'initiative de l'empire [giga_galactic_pact_president.GetName], nous proclamons officiellement la fondation du §BPacte de défense galactique§!, une fédération qui protégera l'avenir de notre galaxie en mettant fin aux activités néfastes de l'empire [root.GetName].\n\nNous ne nous laisserons pas emporter par vos tendances mégalomanes toujours croissantes, [root.GetName]."
  giga_fed.3006.a:0 "Beaucoup de bruit pour rien, certainement."
  giga_fed.3006.b:0 "Bof."
  giga_fed.3006.c:0 "C'est tout ce que vous avez trouvé ?"
  giga_fed.3006.d:0 "Excellent, cela rendra notre travail encore plus facile."
  
  giga_fed.3005.name:0 "Le §BPacte de défense galactique§! !"
  giga_fed.3005.desc:0 "Il peut souvent être difficile pour les myriades de nations stellaires de la galaxie de coopérer ensemble pour une cause commune. Cependant, suite à la construction par l'empire [root.GetName] d'une hyper-arme gigantesque, dans ce qui ne peut être appelé qu'un miracle diplomatique, la plupart des empires restants de la galaxie ont accepté un cessez-le-feu de durée indéterminée, et, après avoir mis de côté leurs différences, se sont unis dans une fédération s'étendant à toute la galaxie connue sous le nom de §BPacte de défense galactique§!.\n\nCette grande fédération, dirigée par l'empire [giga_galactic_pact_president.GetName], vise à protéger la galaxie de l'hyper-arme destructrice de l'empire [root.GetName], et ce n'est qu'une question de temps avant qu'ils ne prennent des mesures offensives contre eux..."
  giga_fed.3005.a:0 "S'unissant comme des rats acculés."
  
  giga_fed.4012.name:0 "§RDéclaration de guerre !§!"
  giga_fed.4012.desc:0 "[root.GetName], nous ne pouvons pas laisser votre folle destruction de la galaxie continuer plus longtemps.\n\nCeci est une déclaration de guerre officielle. Nous vous abattrons, quel qu'en soit le coût !"
  giga_fed.4012.a:0 "Fous pathétiques."
  
  giga_fed.4011.name:0 "La Ligue de défense pangalactique"
  giga_fed.4011.desc:0 "Habitants de la galaxie !\n\nL'empire [root.GetName] a entrepris la construction d'une arme qui, si elle est achevée, pourrait mettre fin à toute vie dans la galaxie telle que nous la connaissons. À ce titre, afin de préserver l'avenir de cette galaxie, nous proclamons officiellement la création de la Ligue de défense pangalactique, et nous ferons tout ce qui est en notre pouvoir pour nous assurer que les plans néfastes de l'empire [root.GetName] ne deviennent pas réalité.\n\nQu'il soit connu que nous ne nous éteindrons pas sans combattre, [root.GetName] !"
  giga_fed.4011.a:0 "Fous ! Vous... vous ne pouvez pas nous arrêter !"
  
  giga_fed.4010.name:0 "La naissance de la §BLigue de défense pangalactique§! !"
  giga_fed.4010.desc:0 "La galaxie a toujours été un endroit dangereux, et des guerres de toutes échelles, allant des petits conflits frontaliers aux guerres galactiques totales, sont assez courantes tout au long de l'histoire galactique.\n\nCependant, l'empire [root.GetName] a récemment commencé à construire une hyper-arme d'une taille et d'une envergure si incroyables qu'elle éclipse tout ce qui a été construit auparavant. Et dans un éclair de lucidité, tout le monde dans la galaxie a soudainement compris : leurs conflits et querelles mesquins n'étaient rien comparés à la destruction que cette arme déchaînerait si elle était achevée.\n\nEt ainsi, avec l'initiative de l'empire [giga_galactic_pact_president.GetName], ce qui reste de la galaxie a décidé de mettre de côté leurs différences et de s'unir en un seul hyper-État s'étendant à toute la galaxie, connu sous le nom de §BLigue de défense pangalactique§!, au moins aussi longtemps que l'empire [root.GetName] constitue une menace pour la galaxie.\n\nCet empire gigantesque réussira-t-il à arrêter les entreprises destructrices de l'empire [root.GetName], ou ne fera-t-il qu'accélérer la disparition de la galaxie ? Il semble que nous soyons sur le point de le découvrir...\n\n§RCela peut prendre quelques minutes pour que la Fédération pangalactique se forme correctement.§!"
  giga_fed.4010.a:0 "Cela... cela ne nous arrêtera pas !"
  
  
  ### Stage Completion Events ###
  giga_qso.2000.name:0 "Site de construction de l'$name_quasistellar$ terminé !"
  giga_qso.2000.desc:0 "Le site de construction de notre $name_quasistellar$ a été achevé au coeur galactique ! Flottant à côté du quasar supermassif, cette plateforme sera utilisée comme base pour assembler une arme de proportions jamais vues, brandissant une puissance destructrice si immense que le $name_ndb$ serait un simple pétard comparé à ce grandiose béhémoth. La première étape sera de condenser le disque d'accrétion du quasar afin de commencer à travailler sur l'hyper-arme proprement dite.\n\n§RAVERTISSEMENT : POURSUIVRE LA CONSTRUCTION DE CETTE HYPER-ARME EXTRÊMEMENT PUISSANTE METTRA EN COLÈRE TOUS LES EMPIRES QUI NE SONT PAS DANS UNE FÉDÉRATION AVEC NOUS, RENDANT LA DIPLOMATIE IMPOSSIBLE§!"
  # giga_qso.2000.desc:0 "The construction site for our $name_quasistellar$ has been completed in the galactic core! Floating next to the supermassive quasar, this platform will be used as a base to assemble a weapon of unseen proportions, wielding such immense destructive power that the $name_ndb$ would be a mere firecracker compared to this grandiose behemoth. The first step is going to be condensing the quasar's accretion disk in order to begin working on that actual hyperweapon itself.\n\n§RWARNING: PURSUING THE CONSTRUCTION OF THIS EXTREMELY POWERFUL HYPERWEAPON WILL ANGER EVERY EMPIRE NOT IN A FEDERATION WITH US, RENDERING DIPLOMACY IMPOSSIBLE§!"
  giga_qso.2000.a:0 "Bien reçu."
  
  giga_qso.2001.name:0 "Condenseur d'accrétion de l'$name_quasistellar$ terminé !"
  giga_qso.2001.desc:0 "La première étape de la construction de notre hyper-arme a été achevée. Un anneau massif et partiel a été assemblé autour du quasar, qui exerce une immense pression gravitationnelle sur le disque d'accrétion énergétique, le forçant à adopter une taille plus petite. Cela nous permettra de terminer le reste de l'hyper-arme sans que le disque ne nous gêne.\n\n§RPuisque nous sommes clairement engagés à construire cette hyper-arme, tous les autres à part les membres de la fédération ont rompu les relations diplomatiques avec nous. Nous devrions nous attendre à ce que la situation empire de plus en plus au fur et à mesure que la construction avance...§!"
  # giga_qso.2001.desc:0 "The first step in constructing our Hyperweapon has been completed. A massive, partial ring has been assembled around the quasar, which is exerting immense gravitational pressure on the energetic accretion disk, forcing it into a smaller size. This will allow us to complete the rest of the hyperweapon without the disk getting in our way.\n\n§RSince we are clearly committed to constructing this hyperweapon, everyone else aside from federation members has cut off diplomatic relations with us. We should expect the situation to worsen more and more as construction goes on...§!"
  giga_qso.2001.a:0 "Un petit prix à payer pour une puissance illimitée."
  
  giga_qso.2002.name:0 "Déflecteurs relativistes de l'$name_quasistellar$ terminés !"
  giga_qso.2002.desc:0 "Une autre étape vers l'activation de notre $name_quasistellar$ a maintenant été achevée. Deux collecteurs gigantesques, connectés au reste de la structure par d'énormes réseaux de capaciteurs et de conduites d'alimentation, collecteront les jets polaires du quasar et redirigeront leur énergie vers l'arme principale de la structure. Maintenant, nous devons commencer à construire les réseaux de calcul colossaux qui seront nécessaires pour gérer cette hyper-arme colossale."
  giga_qso.2002.a:0 "Bien."
  
  giga_qso.2003.name:0 "Hyperordinateurs de l'$name_quasistellar$ terminés !"
  giga_qso.2003.desc:0 "Les hyperordinateurs de notre $name_quasistellar$ sont maintenant terminés. Cet ensemble de machines de calcul gargantuesque est responsable du maintien de la structure, et s'assure que le processus de tir se déroule sans accroc. Il est également capable de gérer les immenses quantités d'énergie qui seront canalisées par l'arme. Nous devons maintenant commencer à travailler sur les capaciteurs qui seront utilisés pour transporter cette énergie vers l'arme elle-même."
  giga_qso.2003.a:0 "Très bien."
  
  giga_qso.2004.name:0 "Téracapaciteurs de l'$name_quasistellar$ terminés !"
  giga_qso.2004.desc:0 "Les téracapaciteurs de notre hyper-arme ont maintenant été assemblés. Un ensemble massif d'anneaux convergents, ils canalisent et stockent les quantités colossales d'énergie collectées du quasar, et les redirigent vers l'hyper-arme chaque fois que la séquence de tir est initiée. Une seule étape reste maintenant, et c'est de construire la partie la plus importante de l'hyper-arme, à savoir son canon gigantesque."
  giga_qso.2004.a:0 "Merveilleux. Bientôt, nous posséderons une puissance illimitée."
  
  giga_qso.2005.name:0 "$name_quasistellar$ terminé !"
  giga_qso.2005.desc:0 "Enfin. Après des décennies et des décennies de travail dangereux et éreintant près du quasar supermassif au coeur galactique, notre Magnum Opus est finalement terminé.\n\nL'$name_quasistellar$, une arme de proportions jamais vues, qui éclipse même le $name_ndb$. Sa production d'énergie est égale à celle d'environ 20 trillions d'étoiles. Il est capable de déchaîner une puissance destructrice indicible sur sa malheureuse cible. C'est un témoignage de notre maîtrise ultime de cet univers, et de notre capacité à plier les cieux eux-mêmes à notre volonté.\n\nAvec l'achèvement de cette hyper-arme gargantuesque, qui mesure plusieurs centaines d'unités astronomiques, la seule chose que nos ennemis peuvent faire maintenant, c'est prier pour avoir pitié."
  giga_qso.2005.a:0 "Enfin, la plus grosse des armes est à nous !"
  
  ### Targeting Menu ###
  giga_qso.001.name:99 "$name_quasistellar$ Control Panel"
  giga_qso.001.desc:99 "Welcome to the $name_quasistellar$'s control panel.\n\nHere, you can either choose a target for the hyperweapon, or configure its parameters.\n\nChoosing a target will allow you to aim at either a star, a planet, or a fleet. Remember that firing the Q.S.O. requires £giga_sr_quasaric_energy£§YQuasaric Energy§!, generated by the megastructure itself.\n\nViewing the parameters will let you alter the weapon's charging rate, increasing or decreasing the amount of £giga_sr_quasaric_energy£§YQuasaric Energy§! accumulated by our Q.S.O.\n\n§BThis menu can also be accessed directly via an edict.§!"
  
