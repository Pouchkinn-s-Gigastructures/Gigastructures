 quasi_stellar_gateway_off:99 "Portail O.Q.S."
 quasi_stellar_gateway_off_DESC:99 "Similaire en principe au portail du $name_ndb$, ce portail à travers le sous-espace permet le transfert instantané de quantités colossales d'énergie."
 quasi_stellar_gateway_off_MEGASTRUCTURE_DETAILS:99 "$quasi_stellar_gateway_off_DESC$"

 quasi_stellar_gateway_on:99 "Portail O.Q.S. actif"
 quasi_stellar_gateway_on_DESC:99 "Similaire en principe au portail du $name_ndb$, ce portail à travers le sous-espace permet le transfert instantané de quantités colossales d'énergie."

 quasi_stellar_obliterator_5:99 "$name_quasistellar$"
 quasi_stellar_obliterator_5_DESC:99 "Un $name_quasistellar$ complet et pleinement opérationnel. Tirant son énergie des jets polaires du quasar, du disque d'accrétion et du processus de Penrose, cette gargantuesque hyperarme est capable de déchaîner la fureur de l'équivalent énergétique stellaire d'une galaxie entière sur son infortunée cible."

 quasi_stellar_obliterator_6:99 "Panneau de contrôle de l'O.Q.S."
 quasi_stellar_obliterator_6_DESC:99 "Ouvrir le panneau de contrôle de l'hyperarme pour tirer ou la configurer."

