  giga_qso.100.no:0 "À la réflexion..."
  
  giga_birch.300.name:0 "Hyperquasar"
  giga_birch.300.desc:0 "Après un voyage ardu, notre vaisseau scientifique a finalement atteint le centre de notre galaxie.\nEn entrant dans le système, l'équipage a été stupéfait par la vue d'un §Yquasar supermassif actif§! absolument massif, ou hyperquasar.\n\nCet objet gargantuesque pèse plusieurs centaines de millions de masses stellaires et a un diamètre de plusieurs centaines d'unités astronomiques.\nBien que ce ne soit que pure spéculation pour l'instant, certains des éléments les plus audacieux de la communauté scientifique théorisent qu'il serait possible de construire une hyper-arme gigantesque autour de ce quasar, qui exploiterait ses énergies cataclysmiques pour déchaîner un faisceau capable d'une puissance destructrice indicible."
  giga_birch.300.a:0 "Incroyable !"
  
  giga_qso.110.name:0 "Monde-machine oblitéré"
  giga_qso.110.desc:0 "C'était déjà terminé pour le monde-machine au moment où le trou de ver de l'$name_quasistellar$ est apparu au-dessus. Peu après, un flux d'énergie gargantuesque, équivalent à la production énergétique totale de la galaxie, a jailli du trou de ver. Il n'a fallu que quelques secondes au faisceau pour oblitérer complètement la planète.\n\nIl ne reste plus rien de l'ancien monde robotique, et le signal fantôme a été considérablement affaibli en conséquence."
  giga_qso.110.a:0 "Ça leur apprendra."
  
  giga_qso.112.name:0 "La fin de la Contingence"
  giga_qso.112.desc:0 "La Contingence a échoué. Avec la destruction du dernier monde-machine, la galaxie ne fait plus face à la menace d'extinction massive systématique, de la Contingence du moins. Toutes les formes de guerre de la Contingence survivantes se sont soit éteintes, soit autodétruites, et le signal fantôme n'est plus transmis.\n\nLe nexus principal a été complètement oblitéré en quelques secondes par le laser immensément puissant de l'$name_quasistellar$, ne laissant rien derrière.\n\nBien que la Contingence ne soit plus, reste à voir si l'empire [quasistellar_owner.GetName] visera son hyper-arme sur d'autres cibles..."
  giga_qso.112.a:0 "Que pourraient-ils faire contre la puissance d'un trillion de soleils ?"
  