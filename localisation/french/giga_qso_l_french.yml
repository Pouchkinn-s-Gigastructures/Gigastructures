 giga_qso.002.name:99 "Oblitérateur quasi-stellaire"
 giga_qso.002.desc:99 "Ceci est le §Ymenu de gestion des cibles§! de l'$name_quasistellar$, où vous pouvez sélectionner des pays à cibler en fonction de leur allégeance envers [root.GetName].\n\nLes cibles §Rhostiles§! incluent généralement : les ['concept_marauder_empires'], les ['concept_endgame_crises'] et les empires avec lesquels nous sommes en guerre.\n\nLes cibles §Yneutres§! incluent généralement : les ['concept_preftl_civilizations'], les empires avec lesquels nous sommes en paix mais ne partageons pas d'['concept_subject_agreement'], de ['concept_federation'] ou certains ['concept_diplomatic_pacts'].\n\nLes cibles §Gamicales§! incluent : les systèmes possédés à l'intérieur de nos propres frontières."
 giga_qso.002.a:99 "§ESélection des cibles§!"
 giga_qso.002.b:99 "Hostile"
 giga_qso.002.c:99 "Neutre"
 giga_qso.002.d:99 "Amical"
 giga_qso.002.e:99 "§EGestion des cibles - Amas§!"
