 ### Pangalactic Federation ###
 giga_qso.3000.name:99 "La Pax Quasaria"
 giga_qso.3000.desc:99 "§RNouvelles alarmantes !§!\n\nSuite à l'achèvement d'une partie importante de notre $name_quasistellar$, il semble que la galaxie commence à nous considérer comme une menace universelle pour la sécurité galactique. En effet, chaque empire non génocidaire a aujourd'hui accepté un cessez-le-feu de durée indéterminée, ainsi que des pactes de non-agression mutuelle, surnommés la « Pax Quasaria ». Ils ont décidé, pour l'instant du moins, de mettre de côté leurs querelles mesquines afin de s'assurer que nous ne puissions pas menacer la sécurité galactique avec notre hyperarme..."
 giga_qso.3000.a:99 "Croient-ils que cela leur sera utile ?"


 giga_fed.3012.name:99 "§RDéclaration de guerre !§!"
 giga_fed.3012.desc:99 "[root.GetName], nous ne pouvons pas laisser vos agissements néfastes se poursuivre davantage.\n\nCeci est une déclaration de guerre officielle. Rendez-vous maintenant, et peut-être épargnerons-nous votre civilisation de la destruction."
 giga_fed.3012.a:99 "Pathétique."

 giga_fed.3006.name:99 "Le Pacte de défense galactique"
 giga_fed.3006.desc:99 "L'empire [root.GetName] a entrepris la construction d'une hyperarme qui pourrait menacer la civilisation telle que nous la connaissons.\n\nEn conséquence, sous l'initiative de [giga_galactic_pact_president.GetName], nous proclamons officiellement la fondation du §BPacte de défense galactique§!, une fédération qui préservera l'avenir de notre galaxie en mettant fin aux activités néfastes de [root.GetName].\n\nNous ne nous laisserons pas balayer par vos tendances mégalomaniaques croissantes, [root.GetName]."
 giga_fed.3006.a:99 "Que des aboiements, aucune morsure, assurément."
 giga_fed.3006.b:99 "Bof."
 giga_fed.3006.c:99 "C'est tout ce que vous avez trouvé ?"
 giga_fed.3006.d:99 "Excellent, cela ne fera que faciliter notre travail."

 giga_fed.3005.name:99 "Le §BPacte de défense galactique§! !"
 giga_fed.3005.desc:99 "Il peut souvent être difficile pour les myriades de nations stellaires de la galaxie de coopérer ensemble pour une cause commune. Cependant, suite à la construction par [root.GetName] d'une gigantesque hyperarme, dans ce qu'on ne peut qu'appeler un miracle diplomatique, la plupart des empires restants de la galaxie ont accepté un cessez-le-feu de durée indéterminée et, après avoir mis leurs différends de côté, se sont regroupés dans une fédération à l'échelle galactique connue sous le nom de §BPacte de défense galactique§!.\n\nCette grande fédération, dirigée par [giga_galactic_pact_president.GetName], vise à protéger la galaxie de l'hyperarme destructrice de [root.GetName], et ce n'est qu'une question de temps avant qu'ils ne lancent une action offensive contre eux..."
 giga_fed.3005.a:99 "Ils se regroupent comme des rats acculés."

 giga_fed.4012.name:99 "§RDéclaration de guerre !§!"
 giga_fed.4012.desc:99 "[root.GetName], nous ne pouvons pas laisser votre destruction insensée de la galaxie se poursuivre davantage.\n\nCeci est une déclaration de guerre officielle. Nous vous abattrons, quel qu'en soit le prix !"
 giga_fed.4012.a:99 "Pitoyables imbéciles."

 giga_fed.4011.name:99 "La Ligue de défense pangalactique"
 giga_fed.4011.desc:99 "Habitants de la galaxie !\n\nL'empire [root.GetName] a entrepris la construction d'une arme qui, si elle est achevée, pourrait mettre fin à toute vie dans la galaxie telle que nous la connaissons. En conséquence, afin de préserver l'avenir de cette galaxie, nous proclamons officiellement la création de la Ligue de défense pangalactique, et nous ferons tout ce qui est en notre pouvoir pour nous assurer que les plans néfastes de [root.GetName] ne deviennent pas réalité.\n\nQu'il soit connu que nous ne nous laisserons pas disparaître sans combattre, [root.GetName] !"
 giga_fed.4011.a:99 "Insensés ! Vous... vous ne pouvez pas nous arrêter !"

 giga_fed.4010.name:99 "La naissance de la §BLigue de défense pangalactique§! !"
 giga_fed.4010.desc:99 "La galaxie a toujours été un endroit dangereux, et les guerres de toutes échelles, allant de petits conflits frontaliers à des guerres galactiques totales, sont assez courantes tout au long de l'histoire galactique.\n\nCependant, [root.GetName] a récemment commencé à construire une hyperarme d'une taille et d'une envergure si incroyables qu'elle éclipse tout ce qui a été construit avant elle. Et dans un éclair de lucidité, tout le monde dans la galaxie a soudainement compris : leurs conflits mesquins et leurs querelles n'étaient rien comparés à la destruction que cette arme déclencherait, si elle devait être achevée.\n\nEt ainsi, à l'initiative de [giga_galactic_pact_president.GetName], ce qui reste de la galaxie a décidé de mettre de côté leurs différends et de s'unir en un seul hyper-État à l'échelle galactique, connu sous le nom de §BLigue de défense pangalactique§!, au moins aussi longtemps que [root.GetName] représentera une menace pour la galaxie.\n\nCet empire gigantesque réussira-t-il à arrêter les entreprises destructrices de [root.GetName], ou ne fera-t-il qu'accélérer la disparition de la galaxie ? Il semble que nous allons bientôt le découvrir...\n\n§RLa formation complète de la Fédération pangalactique peut prendre quelques minutes.§!"
 giga_fed.4010.a:99 "Cela... cela ne nous arrêtera pas !"


 ### Stage Completion Events ###
 giga_qso.2000.name:99 "Site de construction de l'$name_quasistellar$ terminé !"
 giga_qso.2000.desc:99 "Le site de construction de notre $name_quasistellar$ a été achevé au coeur galactique ! Flottant à côté du quasar supermassif, cette plateforme servira de base pour assembler une arme aux proportions inédites, dotée d'une puissance destructrice si immense que le $name_ndb$ ne serait qu'un pétard à côté de ce grandiose mastodonte. La première étape consistera à condenser le disque d'accrétion du quasar afin de commencer à travailler sur l'hyperarme proprement dite."
 # giga_qso.2000.desc:99 "The construction site for our $name_quasistellar$ has been completed in the galactic core! Floating next to the supermassive quasar, this platform will be used as a base to assemble a weapon of unseen proportions, wielding such immense destructive power that the $name_ndb$ would be a mere firecracker compared to this grandiose behemoth. The first step is going to be condensing the quasar's accretion disk in order to begin working on that actual hyperweapon itself.\n\n§RWARNING: PURSUING THE CONSTRUCTION OF THIS EXTREMELY POWERFUL HYPERWEAPON WILL ANGER EVERY EMPIRE NOT IN A FEDERATION WITH US, RENDERING DIPLOMACY IMPOSSIBLE§!"
 giga_qso.2000.a:99 "Bien reçu."

 giga_qso.2001.name:99 "Condenseur d'accrétion de l'$name_quasistellar$ terminé !"
 giga_qso.2001.desc:99 "La première étape de la construction de notre hyperarme est achevée. Un anneau massif et partiel a été assemblé autour du quasar, exerçant une immense pression gravitationnelle sur le disque d'accrétion énergétique, le forçant à se réduire. Cela nous permettra de compléter le reste de l'hyperarme sans que le disque ne nous gêne."
 # giga_qso.2001.desc:99 "The first step in constructing our Hyperweapon has been completed. A massive, partial ring has been assembled around the quasar, which is exerting immense gravitational pressure on the energetic accretion disk, forcing it into a smaller size. This will allow us to complete the rest of the hyperweapon without the disk getting in our way.\n\n§RSince we are clearly committed to constructing this hyperweapon, everyone else aside from federation members has cut off diplomatic relations with us. We should expect the situation to worsen more and more as construction goes on...§!"
 giga_qso.2001.a:99 "Un faible prix à payer pour un pouvoir illimité."

 giga_qso.2002.name:99 "Déflecteurs relativistes de l'$name_quasistellar$ terminés !"
 giga_qso.2002.desc:99 "Une autre étape vers l'activation de notre $name_quasistellar$ vient d'être achevée. Deux gigantesques collecteurs, reliés au reste de la structure par d'énormes réseaux de condensateurs et de conduits d'alimentation, recueilleront les jets polaires du quasar et redirigeront leur énergie vers l'arme principale de la structure. Maintenant, nous devons commencer à construire les colossales matrices de calcul qui seront nécessaires pour gérer cette colossale hyperarme."
 giga_qso.2002.a:99 "Bien."

 giga_qso.2003.name:99 "Hyperordinateurs de l'$name_quasistellar$ terminés !"
 giga_qso.2003.desc:99 "Les hyperordinateurs de notre $name_quasistellar$ sont maintenant complets. Cet ensemble de machines de calcul gargantuesque est responsable de l'entretien de la structure et de s'assurer que le processus de tir se déroule sans accroc. Il est également capable de gérer les immenses quantités d'énergie qui seront canalisées par l'arme. Nous devons maintenant commencer à travailler sur les condensateurs qui seront utilisés pour transporter cette énergie vers l'arme elle-même."
 giga_qso.2003.a:99 "Très bien."

 giga_qso.2004.name:99 "Téracondensateurs de l'$name_quasistellar$ terminés !"
 giga_qso.2004.desc:99 "Les téracondensateurs de notre hyperarme ont maintenant été assemblés. Un ensemble massif d'anneaux convergents, ils canalisent et stockent les quantités colossales d'énergie collectées du quasar, et la redirigent vers l'hyperarme chaque fois que la séquence de tir est initiée. Il ne reste plus qu'une étape maintenant, et c'est de construire la partie la plus importante de l'hyperarme, à savoir son gigantesque canon."
 giga_qso.2004.a:99 "Merveilleux. Bientôt, nous posséderons un pouvoir illimité."

 giga_qso.2005.name:99 "$name_quasistellar$ terminé !"
 giga_qso.2005.desc:99 "Enfin. Après des décennies et des décennies de travail dangereux et éprouvant près du quasar supermassif au coeur galactique, notre Magnum Opus est enfin achevé.\n\nL'$name_quasistellar$, une arme aux proportions inédites, qui éclipse même le $name_ndb$. Sa production d'énergie est équivalente à celle d'environ 20 billions d'étoiles. Elle est capable de déchaîner une puissance destructrice incommensurable sur sa malheureuse cible. C'est un témoignage de notre maîtrise ultime de cet univers, et de notre capacité à plier les cieux eux-mêmes à notre volonté.\n\nAvec l'achèvement de cette hyperarme gargantuesque, qui mesure plusieurs centaines d'unités astronomiques, la seule chose que nos ennemis peuvent faire maintenant, c'est prier pour obtenir miséricorde."
 giga_qso.2005.a:99 "Enfin, le plus gros des canons est à nous !"

 ### Targeting Menu ###
 giga_qso.001.name:99 "Panneau de contrôle de l'$name_quasistellar$"
 giga_qso.001.desc:99 "Bienvenue sur le panneau de contrôle de l'$name_quasistellar$.\n\nIci, vous pouvez soit choisir une cible pour l'hyperarme, soit configurer ses paramètres.\n\nChoisir une cible vous permettra de viser soit une étoile, une planète ou une flotte. N'oubliez pas que tirer avec l'O.Q.S. nécessite de l'£giga_sr_quasaric_energy£§Yénergie quasarique§!, générée par la mégastructure elle-même.\n\nAfficher les paramètres vous permettra de modifier le taux de charge de l'arme, augmentant ou diminuant la quantité d'£giga_sr_quasaric_energy£§Yénergie quasarique§! accumulée par notre O.Q.S.\n\n§BCe menu est également accessible directement via un édit.§!"

 giga_qso.001.fire:99 "Gestion des cibles"
