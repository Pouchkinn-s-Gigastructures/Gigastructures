l_french:
    giga_mbrain_uplink:99 "Liaison $name_matrioshka_brain$"
    giga_mbrain_uplink_plural:99 "Liaisons $name_matrioshka_brain$"
    building_giga_matrioshka_brain_uplink:99 "$giga_mbrain_uplink$"
    building_giga_matrioshka_brain_uplink_desc:99 "Exploitant la colossale puissance de calcul d'un ordinateur stellaire, cette liaison abrite les immenses relais supraluminiques nécessaires pour transférer une quantité de données vertigineuse par seconde."
    building_giga_matrioshka_brain_uplink_counter:99 "Limite de liaisons pour l'empire : §Y[GetMatrioshkaBrainUplinkCountNumerator]/[GetMatrioshkaBrainUplinkCountDenominator]§!\n "

    building_giga_matrioshka_brain_uplink_effect_regular:99 "Peut être ['concept_giga_mbrain_uplinks_regular', amélioré] pour fournir une grande variété de bonus"
    building_giga_matrioshka_brain_uplink_effect_im:99 "Peut être ['concept_giga_mbrain_uplinks_im', amélioré] pour fournir une grande variété de bonus"
    building_giga_matrioshka_brain_uplink_effect_hive:99 "Peut être ['concept_giga_mbrain_uplinks_hive', amélioré] pour fournir une grande variété de bonus"
    building_giga_matrioshka_brain_uplink_effect_machine:99 "Peut être ['concept_giga_mbrain_uplinks_machine', amélioré] pour fournir une grande variété de bonus"
    building_giga_matrioshka_brain_uplink_effect_machine_servitor:99 "Peut être ['concept_giga_mbrain_uplinks_machine_servitor', amélioré] pour fournir une grande variété de bonus"

    mod_building_giga_matrioshka_brain_uplink_country_max:99 "Bâtiments ['building:building_giga_matrioshka_brain_uplink'] max."
    mod_planet_giga_matrioshka_brain_uplinks_upkeep_mult:99 "Entretien des $giga_mbrain_uplink$"

    # eco category
    planet_giga_matrioshka_brain_uplinks:99 "$giga_mbrain_uplink_plural$"

    ####################################################################################################################
    # Concepts

    concept_giga_mbrain_uplinks_text:99 "Chaque $name_matrioshka_brain$ fournit un certain nombre de §YBâtiments de liaison§! qui peuvent être spécialisés pour fournir différents bonus de §YPlanète§! et d'§YEmpire§!."

    concept_giga_mbrain_uplinks_diplomatic:99 "Empires diplomatiques"
    concept_giga_mbrain_uplinks_diplomatic_desc:99 "L'un des suivants :\n\nÉthiques :\n- Toute ['ethic:ethic_xenophile']\n- Toute ['ethic:ethic_pacifist']\n\nPrincipes :\n- ['civic:civic_diplomatic_corps']\n- ['civic:civic_public_relations_specialists']\n- ['civic:civic_pompous_purists']"
    concept_giga_mbrain_uplinks_diplomatic_bug_branch:99 "$concept_giga_mbrain_uplinks_diplomatic$"
    concept_giga_mbrain_uplinks_diplomatic_bug_branch_desc:99 "L'un des suivants :\n\nÉthiques :\n- Toute ['ethic:ethic_xenophile']\n- Toute ['ethic:ethic_pacifist']\n- Toute ['ethic:ethic_cooperative']\n\nPrincipes :\n- ['civic:civic_diplomatic_corps']\n- ['civic:civic_public_relations_specialists']\n- ['civic:civic_pompous_purists']"

    concept_giga_mbrain_uplinks_judgemental:99 "Empires répressifs"
    concept_giga_mbrain_uplinks_judgemental_desc:99 "L'un des suivants :\n\nÉthiques :\n- Toute ['ethic:ethic_xenophobe']\n- Toute ['ethic:ethic_authoritarian']\n\nPrincipes :\n- ['civic:civic_dystopian_society']\n- ['civic:civic_twisted_experimenters']\n- ['civic:civic_twisted_experimenters_corporate']"
    concept_giga_mbrain_uplinks_judgemental_bug_branch:99 "$concept_giga_mbrain_uplinks_judgemental$"
    concept_giga_mbrain_uplinks_judgemental_bug_branch_desc:99 "L'un des suivants :\n\nÉthiques :\n- Toute ['ethic:ethic_xenophobe']\n- Toute ['ethic:ethic_authoritarian']\n- Toute ['ethic:ethic_elitist']\n\nPrincipes :\n- ['civic:civic_dystopian_society']\n- ['civic:civic_twisted_experimenters']\n- ['civic:civic_twisted_experimenters_corporate']"

    concept_giga_mbrain_uplinks_regular:99 "$giga_mbrain_uplink_plural$ : Empires organiques"
    concept_giga_mbrain_uplinks_regular_desc:99 "$concept_giga_mbrain_uplinks_text$\n\nDisponible pour tous les empires :$giga_mbrain_uplink_research_concept$$giga_mbrain_uplink_unity_concept$$giga_mbrain_uplink_training_concept$$giga_mbrain_uplink_foundry_concept$$giga_mbrain_uplink_factory_concept$$giga_mbrain_uplink_refinery_concept$\n\nDisponible pour les empires autorisant les £job_roboticist£ robots :$giga_mbrain_uplink_robot_concept$\n\nDisponible pour les empires ['concept_giga_mbrain_uplinks_diplomatic', diplomatiques] :$giga_mbrain_uplink_diplomacy_concept$\n\nDisponible pour les empires possédant du £job_livestock£ $job_livestock$ :$giga_mbrain_uplink_livestock_concept$\n\nDisponible pour les empires ['concept_giga_mbrain_uplinks_judgemental', répressifs] :$giga_mbrain_uplink_hell_concept$\n\nIndisponible pour ['civic:civic_dystopian_society'] :$giga_mbrain_uplink_entertainment_concept$"

    concept_giga_mbrain_uplinks_im:99 "$giga_mbrain_uplink_plural$ : Machines individuelles"
    concept_giga_mbrain_uplinks_im_desc:99 "$concept_giga_mbrain_uplinks_text$\n\nDisponible pour tous les empires :$giga_mbrain_uplink_research_concept$$giga_mbrain_uplink_unity_concept$$giga_mbrain_uplink_training_concept$$giga_mbrain_uplink_foundry_concept$$giga_mbrain_uplink_factory_concept$$giga_mbrain_uplink_refinery_concept$$giga_mbrain_uplink_robot_concept$\n\nDisponible pour les empires ['tradition_category:tradition_virtuality', virtuels] :$giga_mbrain_uplink_virtual_concept$\n\nDisponible pour les empires ['concept_giga_mbrain_uplinks_diplomatic', diplomatiques] :$giga_mbrain_uplink_diplomacy_concept$\n\nDisponible pour les empires possédant du £job_livestock£ $job_livestock$ :$giga_mbrain_uplink_livestock_concept$\n\nDisponible pour les empires ['concept_giga_mbrain_uplinks_judgemental', répressifs] :$giga_mbrain_uplink_hell_concept$\n\nIndisponible pour ['civic:civic_dystopian_society'] :$giga_mbrain_uplink_entertainment_concept$"

    concept_giga_mbrain_uplinks_hive:99 "$giga_mbrain_uplink_plural$ : $auth_hive_mind$"
    concept_giga_mbrain_uplinks_hive_desc:99 "$concept_giga_mbrain_uplinks_text$\n\nDisponible pour tous les empires :$giga_mbrain_uplink_research_concept$$giga_mbrain_uplink_unity_concept_hive$$giga_mbrain_uplink_training_concept$$giga_mbrain_uplink_foundry_concept$$giga_mbrain_uplink_refinery_concept$$giga_mbrain_uplink_anti_deviancy_concept$\n\nDisponible pour les empires possédant du £job_livestock£ $job_livestock$ :$giga_mbrain_uplink_livestock_concept$\n\nDisponible pour les empires utilisant des £consumer_goods£ $consumer_goods$ :$giga_mbrain_uplink_factory_concept$\n\nDisponible pour ['civic:civic_hive_empath'] :$giga_mbrain_uplink_diplomacy_concept$"

    concept_giga_mbrain_uplinks_machine:99 "$giga_mbrain_uplink_plural$ : $auth_machine_intelligence$"
    concept_giga_mbrain_uplinks_machine_desc:99 "$concept_giga_mbrain_uplinks_text$\n\nDisponible pour tous les empires :$giga_mbrain_uplink_research_concept$$giga_mbrain_uplink_unity_concept_machine$$giga_mbrain_uplink_training_concept$$giga_mbrain_uplink_foundry_concept$$giga_mbrain_uplink_refinery_concept$$giga_mbrain_uplink_anti_deviancy_concept$$giga_mbrain_uplink_robot_concept$\n\nDisponible pour les empires possédant des pops £job_organic_battery£ $job_organic_battery$ :$giga_mbrain_uplink_amalgamation_concept$\n\nDisponible pour les empires utilisant des £consumer_goods£ $consumer_goods$ :$giga_mbrain_uplink_factory_concept$\n\nDisponible pour les empires ['tradition_category:tradition_virtuality', virtuels] :$giga_mbrain_uplink_virtual_concept$\n\nDisponible pour ['civic:civic_machine_diplomatic_protocols'] :$giga_mbrain_uplink_diplomacy_concept$"

    concept_giga_mbrain_uplinks_machine_servitor:99 "$giga_mbrain_uplink_plural$ : $civic_machine_servitor$"
    concept_giga_mbrain_uplinks_machine_servitor_desc:99 "$concept_giga_mbrain_uplinks_text$\n$giga_mbrain_uplink_research_concept$$giga_mbrain_uplink_training_concept$$giga_mbrain_uplink_foundry_concept$$giga_mbrain_uplink_factory_concept$$giga_mbrain_uplink_refinery_concept$$giga_mbrain_uplink_anti_deviancy_concept$$giga_mbrain_uplink_robot_concept$$giga_mbrain_uplink_sanctuary_concept$$giga_mbrain_uplink_entertainment_concept$$giga_mbrain_uplink_diplomacy_concept$\n\nDisponible pour les empires ['tradition_category:tradition_virtuality', virtuels] :$giga_mbrain_uplink_virtual_concept$"

    ####################################################################################################################
    # Building strings

    giga_mbrain_uplink_research:99 "Simulacre cosmique"
    building_giga_matrioshka_brain_uplink_research:99 "$giga_mbrain_uplink$ : $giga_mbrain_uplink_research$"
    building_giga_matrioshka_brain_uplink_research_desc:99 "L'histoire d'univers infinis déployée dans des détails simulés complexes. Ne regardez pas de trop près ou vous pourriez bien vous voir vous-même."
    giga_mbrain_uplink_research_concept:99 "\n£job_researcher£ ['building:building_giga_matrioshka_brain_uplink_research', $giga_mbrain_uplink_research$]"

    giga_mbrain_uplink_unity:99 "Hyperviseur d'allocation"
    building_giga_matrioshka_brain_uplink_unity:99 "$giga_mbrain_uplink$ : $giga_mbrain_uplink_unity$"
    building_giga_matrioshka_brain_uplink_unity_desc:99 "Une puissance de calcul stupéfiante tournée vers l'organisation, le catalogage, la réglementation et la correction de signal. Gérer un empire interstellaire n'a jamais été aussi efficace."
    giga_mbrain_uplink_unity_concept:99 "\n£job_bureaucrat£ ['building:building_giga_matrioshka_brain_uplink_unity', $giga_mbrain_uplink_unity$]"
    giga_mbrain_uplink_unity_concept_hive:99 "\n£job_synapse_drone£ ['building:building_giga_matrioshka_brain_uplink_unity', $giga_mbrain_uplink_unity$]"
    giga_mbrain_uplink_unity_concept_machine:99 "\n£job_coordinator£ ['building:building_giga_matrioshka_brain_uplink_unity', $giga_mbrain_uplink_unity$]"

    giga_mbrain_uplink_sanctuary:99 "Utopie organique"
    building_giga_matrioshka_brain_uplink_sanctuary:99 "$giga_mbrain_uplink$ : $giga_mbrain_uplink_sanctuary$"
    building_giga_matrioshka_brain_uplink_sanctuary_desc:99 "Un monde onirique virtuel où les résidents peuvent vivre leurs fantasmes les plus fous — personne n'est jugé, aucune demande n'est refusée."
    giga_mbrain_uplink_sanctuary_concept:99 "\n£job_bio_trophy£ ['building:building_giga_matrioshka_brain_uplink_sanctuary', $giga_mbrain_uplink_sanctuary$]"

    giga_mbrain_uplink_entertainment:99 "Mégaplexe médiatique"
    building_giga_matrioshka_brain_uplink_entertainment:99 "$giga_mbrain_uplink$ : $giga_mbrain_uplink_entertainment$"
    building_giga_matrioshka_brain_uplink_entertainment_desc:99 "Des attractions sans fin pour éblouir les sens, personnalisées à un degré franchement effrayant."
    giga_mbrain_uplink_entertainment_concept:99 "\n£job_entertainer£ ['building:building_giga_matrioshka_brain_uplink_entertainment', $giga_mbrain_uplink_entertainment$]"

    giga_mbrain_uplink_training:99 "Simulateur d'entraînement"
    building_giga_matrioshka_brain_uplink_training:99 "$giga_mbrain_uplink$ : $giga_mbrain_uplink_training$"
    building_giga_matrioshka_brain_uplink_training_desc:99 "Dans ces espaces virtuels spécialement conçus, nos meilleurs éléments peuvent recevoir la formation qu'ils méritent, sans les contraintes du temps."
    building_giga_matrioshka_brain_uplink_training_effect:99 "Fournit §G+$@matrioshka_brain_uplink_training_bonus|0$§! £mod_country_naval_cap_add£ $MOD_COUNTRY_NAVAL_CAP_ADD$ par $pop_group_unit$ emploi de £job_soldier£ §Y[owner.GetSoldier]§!\n "
    giga_mbrain_uplink_training_concept:99 "\n£job_giga_virtual_training_coordinator£ ['building:building_giga_matrioshka_brain_uplink_training', $giga_mbrain_uplink_training$]"

    giga_mbrain_uplink_diplomacy:99 "Consulat virtuel"
    building_giga_matrioshka_brain_uplink_diplomacy:99 "$giga_mbrain_uplink$ : $giga_mbrain_uplink_diplomacy$"
    building_giga_matrioshka_brain_uplink_diplomacy_desc:99 "Des suites diplomatiques opulentes et des espaces de réunion où nos diplomates désignés peuvent rencontrer ceux d'autres empires dans des conditions étroitement contrôlées."
    giga_mbrain_uplink_diplomacy_concept:99 "\n£job_giga_virtual_diplomat£ ['building:building_giga_matrioshka_brain_uplink_diplomacy', $giga_mbrain_uplink_diplomacy$]"

    giga_mbrain_uplink_hell:99 "Moteur de châtiment"
    building_giga_matrioshka_brain_uplink_hell:99 "$giga_mbrain_uplink$ : $giga_mbrain_uplink_hell$"
    building_giga_matrioshka_brain_uplink_hell_desc:99 "Par condamnation criminelle, transgression sociale, ou simplement de malheureuses circonstances de naissance, les détenus ici sont condamnés à souffrir pendant des éons subjectifs."
    giga_mbrain_uplink_hell_concept:99 "\n£job_giga_virtual_hell_inmate£ ['building:building_giga_matrioshka_brain_uplink_hell', $giga_mbrain_uplink_hell$]"

    giga_mbrain_uplink_livestock:99 "Champs des rêves"
    building_giga_matrioshka_brain_uplink_livestock:99 "$giga_mbrain_uplink$ : $giga_mbrain_uplink_livestock$"
    building_giga_matrioshka_brain_uplink_livestock_desc:99 "Laisser notre bétail vivre dans l'ignorance dans un monde virtuel spécialement conçu les maintient sous contrôle, dociles... et tendres."
    building_giga_matrioshka_brain_uplink_livestock_effect:99 "La réduction d'entretien varie avec les emplois [livestock.GetIcon] §Y[livestock.GetName]§!"
    giga_mbrain_uplink_livestock_concept:99 "\n£job_livestock£ ['building:building_giga_matrioshka_brain_uplink_livestock', $giga_mbrain_uplink_livestock$]"

    giga_mbrain_uplink_amalgamation:99 "Grille onirique"
    building_giga_matrioshka_brain_uplink_amalgamation:99 "$giga_mbrain_uplink$ : $giga_mbrain_uplink_amalgamation$"
    building_giga_matrioshka_brain_uplink_amalgamation_desc:99 "Il y a des champs. Des champs sans fin, où les organiques ne naissent plus... ils sont cultivés."
    building_giga_matrioshka_brain_uplink_amalgamation_effect:99 "La réduction d'entretien varie avec les emplois [organic_battery.GetIcon] §Y[organic_battery.GetName]§!"
    giga_mbrain_uplink_amalgamation_concept:99 "\n£job_organic_battery£ ['building:building_giga_matrioshka_brain_uplink_amalgamation', $giga_mbrain_uplink_amalgamation$]"

    giga_mbrain_uplink_foundry:99 "Raffinement métallurgique"
    building_giga_matrioshka_brain_uplink_foundry:99 "$giga_mbrain_uplink$ : $giga_mbrain_uplink_foundry$"
    building_giga_matrioshka_brain_uplink_foundry_desc:99 "Des expériences de conception industrielle itératives, exécutées à un rythme effréné."
    giga_mbrain_uplink_foundry_concept:99 "\n£job_foundry£ ['building:building_giga_matrioshka_brain_uplink_foundry', $giga_mbrain_uplink_foundry$]"

    giga_mbrain_uplink_factory:99 "Optimisation de chaîne de production"
    building_giga_matrioshka_brain_uplink_factory:99 "$giga_mbrain_uplink$ : $giga_mbrain_uplink_factory$"
    building_giga_matrioshka_brain_uplink_factory_desc:99 "Des algorithmes de conception et de prédiction de marché toujours plus sophistiqués nous permettent de fournir l'offre avant la demande."
    giga_mbrain_uplink_factory_concept:99 "\n£job_artisan£ ['building:building_giga_matrioshka_brain_uplink_factory', $giga_mbrain_uplink_factory$]"

    giga_mbrain_uplink_refinery:99 "Matrice de purification chimique"
    building_giga_matrioshka_brain_uplink_refinery:99 "$giga_mbrain_uplink$ : $giga_mbrain_uplink_refinery$"
    building_giga_matrioshka_brain_uplink_refinery_desc:99 "Une combinaison de relais à faible latence, d'instrumentation de précision et d'une vaste puissance de traitement permet l'évaluation des produits au niveau moléculaire."
    building_giga_matrioshka_brain_uplink_refinery_effect:99 "Améliore les [foundry.GetIcon][GetArtisanIcon] §YEmplois industriels§! lorsque des £building£ §YBâtiments de raffinerie§! sont présents"
    giga_mbrain_uplink_refinery_concept:99 "\n£job_gas_refiner£ ['building:building_giga_matrioshka_brain_uplink_refinery', $giga_mbrain_uplink_refinery$]"

    giga_mbrain_uplink_anti_deviancy:99 "Régulateur comportemental"
    building_giga_matrioshka_brain_uplink_anti_deviancy:99 "$giga_mbrain_uplink$ : $giga_mbrain_uplink_anti_deviancy$"
    building_giga_matrioshka_brain_uplink_anti_deviancy_desc:99 "Bien que coûteux en calcul, des algorithmes prédictifs calibrés pour prévoir la formation de groupes de drones déviants nous permettent d'intervenir dans leur formation avant que leurs effets ne deviennent significatifs."
    building_giga_matrioshka_brain_uplink_anti_deviancy_effect:99 "Réduit la £crime£ §Y$PLANET_CRIME_NO_HAPPINESS_TITLE$§! de base par $pop_group_unit$ drones de §G$@matrioshka_brain_uplink_anti_deviancy_reduction|0%$§! multiplicativement\n "
    giga_mbrain_uplink_anti_deviancy_concept:99 "\n£job_patrol_drone£ ['building:building_giga_matrioshka_brain_uplink_anti_deviancy', $giga_mbrain_uplink_anti_deviancy$]"

    giga_mbrain_uplink_robot:99 "Coordinateur d'unités de travail"
    building_giga_matrioshka_brain_uplink_robot:99 "$giga_mbrain_uplink$ : $giga_mbrain_uplink_robot$"
    building_giga_matrioshka_brain_uplink_robot_desc:99 "L'efficacité de nos unités de travail robotiques peut être améliorée grâce à des processus de gestion de haut niveau et une microgestion localisée. L'autonomie des unités individuelles est réduite, mais cela peut être considéré comme une perte acceptable."
    building_giga_matrioshka_brain_uplink_robot_effect_servitude:99 "L'effet est augmenté lorsque la politique §Y$policy_artificial_intelligence_policy$§! est réglée sur §Y$ai_servitude_name$§!"
    building_giga_matrioshka_brain_uplink_robot_effect_servitude_or_ban:99 "L'effet est augmenté lorsque la politique §Y$policy_artificial_intelligence_policy$§! est réglée sur §Y$ai_servitude_name$§! ou §Y$ai_outlawed_name$§!"
    giga_mbrain_uplink_robot_concept:99 "\n£job_roboticist£ ['building:building_giga_matrioshka_brain_uplink_robot', $giga_mbrain_uplink_robot$]"

    giga_mbrain_uplink_virtual:99 "Accélérateur de routage"
    building_giga_matrioshka_brain_uplink_virtual:99 "$giga_mbrain_uplink$ : $giga_mbrain_uplink_virtual$"
    building_giga_matrioshka_brain_uplink_virtual_desc:99 "La gestion des tâches et le routage des signaux sont des problèmes complexes dans un réseau de cette taille, mais consacrer suffisamment de ressources de calcul au problème a donné des résultats prometteurs. Parfois, la quantité peut être sa propre forme de qualité."
    building_giga_matrioshka_brain_uplink_virtual_effect:99 "Le coût d'entretien varie selon la ['concept_giga_virtual_colony_size']"
    giga_mbrain_uplink_virtual_concept:99 "\n£job_mind_thrall£ ['building:building_giga_matrioshka_brain_uplink_virtual', $giga_mbrain_uplink_virtual$]"


    ####################################################################################################################
    # JOBS

    job_giga_media_coordinator:99 "Magnat des médias"
    job_giga_media_coordinator_plural:99 "Magnats des médias"
    job_giga_media_coordinator_desc:99 "Les esprits créatifs derrière les empires de divertissement virtuel, les magnats des médias s'assurent que notre population ne manquera jamais de rien. Lumières. Caméra. ACTION !"
    job_giga_media_coordinator_effect_desc:99 "Les $job_giga_media_coordinator_swap_plural_with_icon$ transforment les £consumer_goods£ §Y$consumer_goods$§! en £unity£ §Y$unity$§!, £mod_planet_amenities_add£ §Y$PLANET_AMENITIES_TITLE$§! et £mod_trade_value_add£ §Y$TRADE_VALUE$§!, et augmentent également légèrement les £mod_planet_amenities_add£ §Y$PLANET_AMENITIES_TITLE$§! dans tout notre empire"
    job_giga_media_coordinator_swap_plural_with_icon:99 "[giga_media_coordinator.GetIcon] [giga_media_coordinator.GetNamePlural]"
    mod_job_giga_media_coordinator_add:99 "Emplois [giga_media_coordinator.GetName]"
    mod_job_giga_media_coordinator_per_pop:99 "§G+1§! emploi [giga_media_coordinator.GetName] par tranche de $VALUE$ pops"
    mod_job_giga_media_coordinator_per_pop_short:99 "\n§G+1§! [giga_media_coordinator.GetIcon] par tranche de $VALUE$ £pop£"

    job_giga_media_coordination_drone:99 "Drone de coordination médiatique"
    job_giga_media_coordination_drone_plural:99 "Drones de coordination médiatique"
    job_giga_media_coordination_drone_desc:99 "Ces groupes de drones spécialisés produisent un flux incessant de contenu adapté aux préférences des pupilles organiques de l'intelligence mécanique."
    job_giga_media_coordination_drone_effect_desc:99 "Les $job_giga_media_coordination_drone_swap_plural_with_icon$ transforment les £consumer_goods£ §Y$consumer_goods$§! en £unity£ §Y$unity$§! et £mod_planet_amenities_no_happiness_add£ §Y$PLANET_AMENITIES_TITLE$§!, et augmentent également légèrement les £mod_planet_amenities_no_happiness_add£ §Y$PLANET_AMENITIES_TITLE$§! dans tout notre empire"
