    alderson_disk_0:0 "$gc_giga$Site de construction du $name_alderson$"
    alderson_disk_0_DESC:0 "Cette plateforme de construction abrite l'infrastructure nécessaire pour commencer la construction d'un disque massif couvrant l'ensemble de ce système solaire."
    alderson_disk_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_gigastructure$ - $giga_list_category_habitable_mega$\nUn disque de la taille d'un système composé de huit §YTranches§! gigantesques qui peuvent être spécialisées\n$giga_list_removes_system_planets$\n§LUn disque gigantesque de la taille d'un système solaire offrant des quantités colossales d'espace de vie." #megalistentry ALDERSON DISK
    alderson_disk_0_CONSTRUCTION_INFO_DELAYED:0 "$giga_list_additional_data$ - Les §YTranches d'Alderson§! peuvent être transformées en tranches §YGaïa§!/§YMachine§!/§YRuche§!, en tranches §YComplexe de calcul d'Alderson§! ou en tranches §YÉcuménopole§!"

    alderson_disk_1:0 "Armature du $name_alderson$"
    alderson_disk_1_DESC:0 "L'armature colossale du $name_alderson$ s'étend de l'étoile jusqu'aux confins de ce système. Elle servira de base sur laquelle assembler les segments proprement dits."

    alderson_disk_2:0 "Armature de tranche d'Alderson"
    alderson_disk_2_DESC:0 "Une armature colossale qui sera utilisée pour construire une tranche d'Alderson complète."
