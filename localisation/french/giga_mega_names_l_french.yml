l_french:
    ###########################################################
    #################### FUSION SUPPRESSOR ####################
    ###########################################################

    fusion_suppressor_0:0 "$gc_mega$Site de construction du $name_fusion_suppressor$"
    fusion_suppressor_0_DESC:0 "Le site de construction d'un futur $name_fusion_suppressor$, abritant tout le nécessaire pour commencer la construction de ce dispositif extrêmement avancé."
    fusion_suppressor_0_MEGASTRUCTURE_DETAILS:0 "£gigastructural£ $giga_list_category_megastructure$ - $giga_list_category_miscellaneous$\nPeut convertir les §YÉtoiles§! ordinaires en §YÉtoiles à neutrons§! et en §YTrous noirs§! - $giga_list_damages_system_planets$\n§LLe Suppresseur de fusion manipule les processus de fusion au sein d'une étoile pour déclencher prématurément une supernova, transformant l'étoile en un corps céleste plus exotique." #gigalistentry FUSION SUPPRESSOR
    fusion_suppressor_0_CONSTRUCTION_INFO_DELAYED:0 "$giga_list_additional_data$ - L'achèvement complet du $name_fusion_suppressor$ offre le choix de démanteler la structure et conserver un §YTrou noir§! utilisable, ou de laisser l'étoile exploser en §Hsupernova§!, §Rdétruisant tous les vaisseaux et structures du système, et ravageant toutes les planètes au passage§!, laissant une §YÉtoile à neutrons§! utilisable. Les corps restants reçoivent aléatoirement des gisements de £giga_sr_iodizium£ §Y$giga_sr_iodizium$§!, £energy£ §Y$energy$§!, et £physics_research£ §Y$physics_research$§!. \n\n§HNote :§! Le $name_fusion_suppressor$ doit être §Yentièrement achevé§! pour utiliser l'étoile à neutrons dans une autre mégastructure.\n\n£giga_sr_iodizium£ §Y$giga_sr_iodizium$§! peut être utilisé pour alimenter des bâtiments puissants qui améliorent la £physics_research£ £society_research£ £engineering_research£ §YRecherche§! planétaire et la production d'£energy£ §Y$energy$§!.\n\nLes §YÉtoiles à neutrons§! créées par le §YSuppresseur de fusion§! sont adaptées à une §YHyperforge de Nidavellir§!. Les §YTrous noirs§! peuvent être utilisés pour toute autre mégastructure basée sur les trous noirs."

    fusion_suppressor_1:0 "Modulateurs gravitationnels du $name_fusion_suppressor$"
    fusion_suppressor_1_DESC:0 "Ces grands dispositifs sont capables de manipuler la gravité autour de l'étoile, permettant de comprimer la matière de l'étoile dans un volume plus petit."

    fusion_suppressor_2:0 "Stabilisateurs stellaires du $name_fusion_suppressor$"
    fusion_suppressor_2_DESC:0 "Le $name_fusion_suppressor$ est maintenant capable de stabiliser l'étoile autour de laquelle il est construit, permettant ainsi aux modulateurs gravitationnels de comprimer l'objet stellaire sans qu'il explose soudainement en raison d'une déstabilisation."

    fusion_suppressor_3:0 "$name_fusion_suppressor$ — Compression phase I"
    fusion_suppressor_3_DESC:0 "Le $name_fusion_suppressor$ a commencé à comprimer la matière de l'étoile, ouvrant des opportunités de recherche sur la nature des réactions nucléaires stellaires. Une compression supplémentaire produira davantage de recherche."

    fusion_suppressor_4:0 "$name_fusion_suppressor$ — Compression phase II"
    fusion_suppressor_4_DESC:0 "L'étoile a été de nouveau comprimée, et ses composants de base commencent à montrer des comportements étranges au potentiel scientifique élevé. Des réactions de fusion plus exotiques commencent à se produire, tandis que la structure même de l'étoile semble se dégrader."

    fusion_suppressor_5:0 "$name_fusion_suppressor$ — Phase étoile à neutrons"
    fusion_suppressor_5_DESC:0 "Le $name_fusion_suppressor$ a réussi à comprimer l'étoile à tel point que les protons et les électrons ont fusionné pour devenir des neutrons au sein du noyau de l'étoile, transformant ledit noyau en une étoile à neutrons. Il s'agit effectivement d'une étoile à neutrons entourée de plasma stellaire ordinaire."

    fusion_suppressor_6:0 "Effondrer l'étoile en trou noir"
    fusion_suppressor_6_DESC:0 "La matière de l'étoile a maintenant été effondrée à tel point que même la lumière ne peut échapper à l'attraction gravitationnelle du corps, le transformant effectivement en un trou noir artificiel, possédant un potentiel de recherche incroyable."

    fusion_suppressor_6b:0 "Faire exploser l'étoile"
    fusion_suppressor_6b_DESC:0 "Ordonner au $name_fusion_suppressor$ de libérer le champ gravitationnel et d'exercer une force répulsive, provoquant l'explosion de l'étoile comprimée en une supernova dévastatrice, détruisant le $name_fusion_suppressor$. Toute planète de taille inférieure à 5, ainsi que les astéroïdes, seront détruits, et les géantes gazeuses seront dépouillées de leur atmosphère. Les planètes survivantes recevront des gisements d'iodizium, qui sont des cristaux générés par la supernova artificielle frappant les planètes à des vitesses relativistes. Ces cristaux peuvent être utilisés pour construire des bâtiments puissants sur nos planètes."

    fusion_suppressor_7:0 "Démanteler le $name_fusion_suppressor$"
    fusion_suppressor_7_DESC:0 "Retirer ce $name_fusion_suppressor$, rendant son trou noir utilisable pour d'autres projets."

    ########################################################
    #################### PENROSE SPHERE ####################
    ########################################################
    penrose_sphere_0:0 "$gc_mega$Site de construction de la $name_penrose$"
    penrose_sphere_0_DESC:0 "Cette plateforme abrite le personnel et l'infrastructure nécessaires pour construire une $name_penrose$ autour d'un trou noir."
    penrose_sphere_0_MEGASTRUCTURE_DETAILS:0 "£gigastructural£ £megaupgrade£ $giga_list_category_megastructure$ - $giga_list_category_basic_resource_production$ - $giga_list_category_weaponry$\nPeut générer de l'£energy£ §YÉnergie§! ou devenir une §YBombe§!. Peut être améliorée en §YMonde-anneau de Penrose§!\n§LUne sphère de miroirs autour d'un trou noir, exploitant la diffusion superradiante pour générer de l'énergie à des fins lucratives ou destructrices.§!" #megalistentry PENROSE SPHERE

    penrose_sphere_1:0 "Armature de la $name_penrose$"
    penrose_sphere_1_DESC:0 "Cette armature squelettique supportera des miroirs massifs, capables de réfléchir la lumière à travers l'ergosphère du trou noir, générant de vastes quantités d'énergie."

    penrose_sphere_a2:0 "Bombe de distorsion sous-spatiale désarmée"
    penrose_sphere_a2_DESC:0 "Cette $name_penrose$ a été reconvertie en bombe. Nous devons maintenant la laisser accumuler de l'énergie pendant un certain temps avant de la faire exploser."

    penrose_sphere_a3:0 "Bombe de distorsion sous-spatiale"
    penrose_sphere_a3_DESC:0 "Une grande structure semblable à un miroir construite autour d'un trou noir, capable de réfléchir le rayonnement entre sa surface intérieure et l'ergosphère du trou noir, provoquant une diffusion superradiante et amplifiant exponentiellement l'énergie du rayonnement."

    penrose_sphere_a4:0 "Détonation !"
    penrose_sphere_a4_DESC:0 "Envoyer juste assez de rayonnement pour pousser l'intégrité du miroir au-delà de sa limite et libérer le flux d'énergie !"

    penrose_sphere_a41:0 "Bombe de distorsion sous-spatiale"
    penrose_sphere_a41_DESC:0 "Cette bombe de distorsion sous-spatiale est sur le point d'exploser !"
    penrose_sphere_a41_MEGASTRUCTURE_DETAILS:0 "$penrose_sphere_a41_DESC$"

    penrose_sphere_a42:0 "Bombe de distorsion sous-spatiale"
    penrose_sphere_a42_DESC:0 "Cette bombe de distorsion sous-spatiale est sur le point d'exploser !"
    penrose_sphere_a42_MEGASTRUCTURE_DETAILS:0 "$penrose_sphere_a42_DESC$"

    penrose_sphere_b2:0 "$name_penrose$"
    penrose_sphere_b2_DESC:0 "Un grand miroir construit autour d'un trou noir. Les rayonnements rebondissent entre la surface intérieure du miroir et l'ergosphère du trou noir, générant de l'énergie."

    penrose_sphere_b3:0 "$name_penrose$ stabilisée"
    penrose_sphere_b3_DESC:0 "Cette $name_penrose$ a été stabilisée avec des constructions spécialisées, permettant à davantage de rayonnement d'être contenu dans la sphère de miroirs sans risquer d'explosion. Elle génère donc plus d'énergie."

    penrose_sphere_b4:0 "$name_penrose$ monde-anneau"
    penrose_sphere_b4_DESC:0 "Une partie de la production de cette $name_penrose$ a été redirigée pour soutenir un monde-anneau massif et très avancé construit autour d'elle."

    gigablackhole_ring_world_2:0 "Armature du $name_penrose_ring$"
    gigablackhole_ring_world_2_DESC:0 "Cette armature squelettique constitue environ la moitié de la circonférence totale du monde-anneau. Nous devons maintenant commencer à travailler sur les habitats proprement dits."
    gigablackhole_ring_world_2_MEGASTRUCTURE_DETAILS:0 "$gigablackhole_ring_world_2_DESC$"

    gigablackhole_ring_world_3:0 "Segment du $name_penrose_ring$"
    gigablackhole_ring_world_3_DESC:0 "Un morceau massif d'un monde-anneau, composé de deux segments habitables et d'un segment de soutien, alimenté par une $name_penrose$."

    ########################################################
    ############ Event Horizon Offset Facility #############
    ########################################################

    # Construction site
    ehof_megastructure_phase0:0 "$gc_mega$$ehof_ehofp0$"
    ehof_megastructure_phase0_DESC:0 "Le site initial servira de base à la construction de l'installation."
    ehof_megastructure_phase0_MEGASTRUCTURE_DETAILS:0 "£galwonders£ £megaupgrade£ £gigastructural£ £megaupgrade£ $giga_list_category_megastructure$ - $giga_list_category_transportation$\nStabilise les §Y$ehof_wormholes$§! pour un §YVoyage interstellaire§! sans limites - $giga_list_potentially_hazardous$\n§LL'E.H.O.F. est une véritable merveille technologique employant une technologie ésotérique de trous de ver pour voyager vers des endroits auparavant considérés comme inaccessibles.§!" #gigalistentry EHOF
    ehof_megastructure_phase0_CONSTRUCTION_INFO_DELAYED:0 "Gonfle et stabilise les $ehof_wormholes$ pour un voyage interstellaire sans limites."

    # Phase1
    ehof_megastructure_phase1:0 "$ehof_ehofp1$"
    ehof_megastructure_phase1_DESC:0 "Manipule et gonfle les $ehof_wormholes$ pour le voyage interstellaire.\n\n"
    ehof_megastructure_phase1_MEGASTRUCTURE_DETAILS:0 "$ehof_megastructure_phase0_MEGASTRUCTURE_DETAILS$"

    ehof_megastructure_phase1_decommissioned:0 "$ehof_ehofp1$ (§EDéclassée§!)"
    ehof_megastructure_phase1_decommissioned_DESC:0 "Chiffrée, nous ne pouvons pas reprendre le contrôle de cette installation, mais elle produit toujours de précieuse $ehof_qnm$."
    ehof_megastructure_phase1_decommissioned_MEGASTRUCTURE_DETAILS:0 "$ehof_megastructure_phase1_decommissioned_DESC$"

    # Phase2
    ehof_megastructure_phase2:0 "$ehof_ehofp2$"
    ehof_megastructure_phase2_DESC:0 "Manipule et gonfle les $ehof_wormholes$ pour le voyage interstellaire.\n\n"
    ehof_megastructure_phase2_MEGASTRUCTURE_DETAILS:0 "$ehof_megastructure_phase0_MEGASTRUCTURE_DETAILS$"

    ehof_megastructure_phase2_decommissioned:0 "$ehof_ehofp2$ (§EDéclassée§!)"
    ehof_megastructure_phase2_decommissioned_DESC:0 "$ehof_megastructure_phase1_decommissioned_DESC$"
    ehof_megastructure_phase2_decommissioned_MEGASTRUCTURE_DETAILS:0 "$ehof_megastructure_phase2_decommissioned_DESC$"

    # Phase3
    ehof_megastructure_phase3:0 "$ehof_ehofp3$"
    ehof_megastructure_phase3_DESC:0 "Utilise la §H£giga_sr_negative_mass£Masse négative§! pour stabiliser les $ehof_wormholes$ pour le voyage interstellaire et l'extraction de $sr_dark_matter$."
    ehof_megastructure_phase3_MEGASTRUCTURE_DETAILS:0 "$ehof_megastructure_phase0_MEGASTRUCTURE_DETAILS$"

    ehof_megastructure_phase3_decommissioned:0 "$ehof_ehofp3$ (§EDéclassée§!)"
    ehof_megastructure_phase3_decommissioned_DESC:0 "$ehof_megastructure_phase1_decommissioned_DESC$"
    ehof_megastructure_phase3_decommissioned_MEGASTRUCTURE_DETAILS:0 "$ehof_megastructure_phase3_decommissioned_DESC$"

    # Phase4
    ehof_megastructure_phase4:0 "$ehof_ehofp4$"
    ehof_megastructure_phase4_DESC:0 "Utilise la §H£giga_sr_negative_mass£Masse négative§! pour stabiliser les $ehof_wormholes$ pour le voyage interstellaire et l'extraction de $sr_dark_matter$."
    ehof_megastructure_phase4_MEGASTRUCTURE_DETAILS:0 "$ehof_megastructure_phase0_MEGASTRUCTURE_DETAILS$"

    ehof_megastructure_phase4_decommissioned:0 "$ehof_ehofp4$ (§EDéclassée§!)"
    ehof_megastructure_phase4_decommissioned_DESC:0 "$ehof_megastructure_phase1_decommissioned_DESC$"
    ehof_megastructure_phase4_decommissioned_MEGASTRUCTURE_DETAILS:0 "$ehof_megastructure_phase4_decommissioned_DESC$"

    # Ruined
    ehof_megastructure_restored:0 "$ehof_megastructure_phase2$"
    ehof_megastructure_restored_DESC:0 "$ehof_megastructure_phase2_DESC$"
    ehof_megastructure_restored_MEGASTRUCTURE_DETAILS:0 "$ehof_megastructure_phase0_MEGASTRUCTURE_DETAILS$"

    ehof_megastructure_ruined:0 "$ehof_ehofp2$ en ruine"
    ehof_megastructure_ruined_DESC:0 "Une structure orbitale partiellement construite en état de délabrement sévère. Cet $ehof_ehof$ était autrefois utilisé pour le voyage interstellaire."
    ehof_megastructure_ruined_MEGASTRUCTURE_DETAILS:0 "$ehof_megastructure_phase0_MEGASTRUCTURE_DETAILS$"

    # Preservation sphere dyson
    ehof_presphere_ruined:0 "§B$ehof_presphere_dyson$§! en ruine"
    ehof_presphere_ruined_DESC:0 "Cette mégastructure extraterrestre a été détruite pour vaincre le $ehof_the_compound_text$, une fois pour toutes."
    ehof_presphere_ruined_MEGASTRUCTURE_DETAILS:0 "Capable de puiser une énergie inégalée, elle ne devrait pas rester en ruine éternellement."

    ehof_presphere_dyson:0 "§BSphère de préservation§!"
    ehof_presphere_dyson_DESC:0 "Restaurée après la défaite du $ehof_the_compound_text$, la $ehof_presphere_dyson$ est capable de puiser une énergie inégalée du trou blanc autour duquel elle est construite."
    ehof_presphere_dyson_MEGASTRUCTURE_DETAILS:0 "Capable de puiser une énergie inégalée des émissions inépuisables d'un trou blanc."

    # Wormholes
    ehof_trader_wormhole_01:0 "$ehof_trader_gateway$"
    ehof_trader_wormhole_01_DESC:0 "$ehof_trader_gateway_DESC$"
    ehof_trader_wormhole_01_MEGASTRUCTURE_DETAILS:0 "$ehof_trader_gateway_DESC$"

