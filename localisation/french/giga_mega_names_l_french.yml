    ########################################
    succ_0:99 "$gc_kilo$Site de construction de $name_succ$"
    succ_0_MEGASTRUCTURE_DETAILS:99 "$giga_list_category_kilostructure$ - $giga_list_category_strategic_resource_production$\nRévèle et amplifie les gisements de £exotic_gases£ §YGaz exotiques§! et d'£energy£ §YÉnergie§! sur les §YGéantes gazeuses§!.\n§LLe S.U.C.C. écorche méthodiquement l'atmosphère d'un monde gazeux, extrayant les gaz les plus précieux tout en utilisant le reste pour alimenter de vastes réseaux de fusion.§!" #megalistentry SUCC
    succ_0_DESC:99 "Le site de construction d'un futur $name_succ_full$. Il abrite le personnel et l'infrastructure nécessaires pour construire un $name_succ$ autour d'un monde gazeux voisin."

    succ_0_CONSTRUCTION_INFO_DELAYED:99 "$sr_mega_extra_data$"
    #Old first stage
    # succ_1:99 "$name_succ$ Orbital Apparatus"
    # succ_1_DESC:99 "This gigantic ring stretches around the Gas Giant, and houses fusion reactors for energy generation, as well as purifying facilities for harvesting exotic gases and volatile motes from the Gas Giant's atmosphere."

    succ_1:99 "$name_succ$"
    succ_1_DESC:99 "Un $name_succ_full$ complet et opérationnel, récoltant progressivement de vastes quantités de gaz d'une géante gazeuse. Des réacteurs à fusion utilisent l'hydrogène collecté pour générer de vastes quantités d'énergie."
    ########################################
    ############## STRIPMINE ###############
    ########################################
    sr_mega_extra_data:99 "§YRévélera§! et §Yamplifiera§! les gisements de ressources stratégiques, et §Yamplifiera§! (mais ne créera pas) les gisements de ressources ordinaires."

    automated_stripmine_0:99 "$gc_kilo$Site de construction de $name_auto_stripmine$"
    automated_stripmine_0_DESC:99 "Le site de construction d'une future $name_auto_stripmine$. Il contient tout le nécessaire pour construire l'appareil d'extraction orbital ainsi que les usines au sol."
    automated_stripmine_0_MEGASTRUCTURE_DETAILS:99 "$giga_list_category_kilostructure$ - $giga_list_category_strategic_resource_production$\nRévèle et amplifie les gisements de £volatile_motes£ §YParticules volatiles§! et de £minerals£ ou £alloys£ sur les §YMondes en fusion§!.\n§LPar la danse délicate d'immenses foreuses et de faisceaux de traction, la Mine à ciel ouvert automatisée pèle la croûte d'une planète en fusion, récoltant de précieuses particules volatiles du manteau ardent.§!" #gigalistentry AUTOMATED STRIPMINE
    automated_stripmine_0_CONSTRUCTION_INFO_DELAYED:99 "$sr_mega_extra_data$"
    # Old first stage
    # automated_stripmine_1:99 "$name_auto_stripmine$ Orbital Apparatus"
    # automated_stripmine_1_DESC:99 "This large orbital apparatus is equipped with two enormous tractor beams capable of pulling large amounts of minerals into orbit. Those minerals will be extracted by a plethora of automated drilling units on the surface of the planet."

    automated_stripmine_1:99 "$name_auto_stripmine$"
    automated_stripmine_1_DESC:99 "Une grande construction orbitale récoltant des particules volatiles directement du manteau ardent d'un monde en fusion."

    #########################################
    ############## Kugelblitz ###############
    #########################################
    #Deprecated
    # kugelblitz_0:99 "$gc_mega$$name_kugelblitz$ Site"
    # kugelblitz_0_DESC:99 "The construction site for a future $name_kugelblitz$. Houses the personnel necessary to construct this incredibly advanced storage device."
    # kugelblitz_0_MEGASTRUCTURE_DETAILS:99 "$giga_list_category_megastructure$ - $giga_list_category_storage$\nStores §Y40000§! of each resource and generates £energy£ §YEnergy§!\n§LAn incredibly advanced Kugelblitz-based storage device, which can store energy and matter in the form of radiation." #megalistentry KUGELBLITZ

    kugelblitz_0:99 "$gc_kilo$$name_kugelblitz$ vide"
    kugelblitz_0_DESC:99 "Une grande construction capable de créer un Kugelblitz artificiel pour générer et stocker de l'énergie grâce au rayonnement de Hawking accéléré, ainsi que de la matière. Elle peut également extraire l'énergie stockée pour l'utiliser."
    kugelblitz_0_MEGASTRUCTURE_DETAILS:99 "$giga_list_category_kilostructure$ - $giga_list_category_storage$\nStocke des quantités incroyables de chaque ressource.\n§LUn dispositif de stockage basé sur un Kugelblitz incroyablement avancé, capable de stocker de l'énergie et de la matière sous forme de rayonnement.§!" #megalistentry KUGELBLITZ

    kugelblitz_1:99 "$name_kugelblitz$"
    kugelblitz_1_DESC:99 "Cette construction abrite un Kugelblitz artificiel ainsi que des dispositifs capables d'y injecter et d'en extraire de l'énergie. Le Kugelblitz nécessite une petite quantité d'énergie pour maintenir la singularité stable et permettre le stockage continu et sécurisé des matériaux."

    kugelblitz_2:99 "$name_kugelblitz$ amélioré"
    kugelblitz_2_DESC:99 "Cette construction abrite un Kugelblitz artificiel ainsi que des dispositifs capables d'y injecter et d'en extraire de l'énergie. Des avancées en technologie à super-échelle ont permis de générer un Kugelblitz stabilisé beaucoup plus grand, autorisant ainsi une plus grande capacité de stockage."

    kugelblitz_3:99 "Grand $name_kugelblitz$"
    kugelblitz_3_DESC:99 "Cette construction abrite un Kugelblitz artificiel ainsi que des dispositifs capables d'y injecter et d'en extraire de l'énergie. Grâce à l'ingénierie tétra-dimensionnelle, nous sommes capables d'une augmentation encore plus importante de la capacité de stockage viable d'un seul Kugelblitz généré."

    kugelblitz_ruined:99 "$name_kugelblitz$ en ruines"
    kugelblitz_ruined_DESC:99 "Un $name_kugelblitz$ en ruines. Construit pour abriter une singularité artificielle contrôlée, cette construction a subi d'immenses dégâts par le passé et n'est plus opérationnelle. Bien que difficiles, des réparations pourraient être possibles."
    kugelblitz_ruined_MEGASTRUCTURE_DETAILS:99 "$kugelblitz_ruined_DESC$"

    kugelblitz_restored:99 "$name_kugelblitz$"
    kugelblitz_restored_DESC:99 "$kugelblitz_2_DESC$"

    #########################################
    ### Planetary Seeder Nexus ##############
    #########################################
    giga_tech_planetary_seeder_nexus:99 "Subsistance extrémophile à grande échelle"
    giga_tech_planetary_seeder_nexus_desc:99 "Les mondes arides, chauds comme froids, présentent souvent les éléments de base de la vie, simplement pas dans le bon agencement. Cependant, avec la découverte des Cutholoïdes et des amibes prospérant dans les profondeurs de l'espace, il existe maintenant la possibilité de créer des « formes de vie » artificielles sur mesure qui, une fois déposées sur des mondes sans vie, seront capables d'accumuler et de réarranger ces éléments de base en diverses substances propres à la récolte et à la consommation. Comme tout ce qu'elles feraient serait de réorganiser des molécules dispersées en divers composés comestibles, celles-ci devraient être régulièrement réapprovisionnées et ne constitueraient pas une « biosphère » à proprement parler, mais pourraient fournir un approvisionnement utile en matériaux pour nos industries nutritionnelles."

    planetary_seeder_nexus_0:99 "$gc_kilo$$name_planetary_seeder_nexus$ : Biocapteurs organiques"
    planetary_seeder_nexus_0_DESC:99 "Ce site servira de base pour construire un $name_planetary_seeder_nexus$, une installation orbitale de bio-ingénierie produisant divers automates quasi-biologiques capables de retraiter les composés organiques dispersés trouvés dans les mondes sans vie en matière comestible. De grands réseaux de géo-surveillance scannent constamment les mondes voisins et déploient des sondes pour confirmer les emplacements de composés organiques hautement concentrés et traitables."
    planetary_seeder_nexus_0_MEGASTRUCTURE_DETAILS:99 "$giga_list_category_kilostructure$ - $giga_list_category_basic_resource_production$\nGénère des gisements de £food£ §YNourriture§! sur les planètes du système.\n§LUne station construite en orbite d'une géante gazeuse, produisant des automates biologiques qui retraitent les composés organiques en matière comestible.§!" #megalistentry PLANETARY SEEDER NEXUS
    planetary_seeder_nexus_0_CONSTRUCTION_INFO_DELAYED:99 "$giga_list_additional_data$ - $planetary_seeder_nexus_1_mod_tooltip$"

    planetary_seeder_nexus_1:99 "$name_planetary_seeder_nexus$ : Manufacture biologique"
    planetary_seeder_nexus_1_DESC:99 "Des formes de vie nutritives semblables au phytoplancton, capables de prospérer dans les océans souterrains, les croûtes rocheuses et les atmosphères gazeuses, sont produites en vastes quantités et répandues à travers le système local."

    planetary_seeder_nexus_2:99 "$name_planetary_seeder_nexus$ : Usines d'enzymes"
    planetary_seeder_nexus_2_DESC:99 "Pour les mondes qui ne peuvent pas soutenir la vie conventionnelle, des usines avancées fabriquent des automates cellulaires riches en enzymes capables d'exploits incroyables de chimie moléculaire allant du réarrangement de la croûte et de l'atmosphère des mondes riches en carbone en piliers de saccharose cristallisé à la production de bouillie protéique en manipulant les hydrocarbures et l'eau."

    planetary_seeder_nexus_3:99 "$name_planetary_seeder_nexus$"
    planetary_seeder_nexus_3_DESC:99 "Un $name_planetary_seeder_nexus$ complet, supervisant la production, le déploiement et la récolte subséquente d'enzymes spécialisées et de formes de vie nutritionnelles sur presque chaque monde de ce système."

    #########################################
    ### Orbital Artificial Ecosystem ########
    #########################################
    giga_tech_orbital_artificial_eco:99 "Écosystèmes orbitaux"
    giga_tech_orbital_artificial_eco_desc:99 "Créer un écosystème complexe entièrement fonctionnel en orbite d'une planète est un véritable défi, mais une telle technologie permet la construction de grands écosystèmes en orbite d'une planète à des fins de recherche."

    orbital_artificial_eco_0:99 "$gc_kilo$$name_orbital_artificial_eco$ : Maintien de la vie"
    orbital_artificial_eco_0_DESC:99 "Ce site servira de base pour construire un $name_orbital_artificial_eco$, une grande structure abritant un écosystème entièrement artificiel sur lequel nous pouvons expérimenter librement."
    orbital_artificial_eco_0_MEGASTRUCTURE_DETAILS:99 "$giga_list_category_kilostructure$ - $giga_list_category_science_production$\nGénère des gisements de £society_research£ §YRecherche en société§! sur les planètes du système.\n§LUne station construite en orbite d'un monde toxique pour abriter et étudier un vaste nombre d'espèces exotiques de flore et de faune.§!" #megalistentry ORBITAL ARTIFICIAL ECOSYSTEM
    orbital_artificial_eco_0_CONSTRUCTION_INFO_DELAYED:99 "$giga_list_additional_data$ - $orbital_eco_arcology_1_mod_tooltip$"

    orbital_artificial_eco_1:99 "$name_orbital_artificial_eco$ : Banque génétique"
    orbital_artificial_eco_1_DESC:99 "Un ensemble de bras externes pour stocker fonctionnellement l'information génétique de toutes les espèces abritées dans l'$name_orbital_artificial_eco$ prévu, afin que si l'une d'elles s'éteint, elle puisse être récupérée."

    orbital_artificial_eco_2:99 "$name_orbital_artificial_eco$ : Enclos exotiques"
    orbital_artificial_eco_2_DESC:99 "Les enclos exotiques abritent une variété d'environnements simulés ainsi que des installations pour garantir que toute la flore et la faune maintiennent des effectifs durables."

    orbital_artificial_eco_3:99 "$name_orbital_artificial_eco$ : Tests planétaires"
    orbital_artificial_eco_3_DESC:99 "Un $name_orbital_artificial_eco$ complet, rempli d'espèces importées ainsi que d'espèces fabriquées grâce au génie génétique. Cet écosystème unique peut être modélisé et déformé à volonté par nos scientifiques pour étudier le fonctionnement de la nature."

    orbital_artificial_eco_ruined:99 "$name_orbital_artificial_eco$ en ruines"
    orbital_artificial_eco_ruined_DESC:99 "Un $name_orbital_artificial_eco$ en ruines. Il abritait autrefois un grand nombre d'espèces bio-ingénierées dans des environnements contrôlés, mais ce n'est plus le cas. Il pourrait être possible de le restaurer avec les bonnes technologies."
    orbital_artificial_eco_ruined_MEGASTRUCTURE_DETAILS:99 "$orbital_artificial_eco_ruined_DESC$"

    orbital_artificial_eco_restored:99 "$name_orbital_artificial_eco$"
    orbital_artificial_eco_restored_DESC:99 "$orbital_artificial_eco_3_DESC$"

    giga_dialog.1003.name:99 "$name_orbital_artificial_eco$ en ruines"
    giga_dialog.1003.desc:99 "Un $name_orbital_artificial_eco$ en ruines a été repéré en orbite autour d'une géante gazeuse dans le système [from.GetName]. Il semble avoir subi d'importants dégâts, mais l'armature extérieure est encore quelque peu intacte. Nos scientifiques pensent qu'il pourrait être possible de le réparer si nous possédons les technologies appropriées."
    giga_dialog.1003.a:99 "Intéressant."
    #########################################
    ### Macroengineering Test Site ##########
    #########################################
    giga_tech_engineering_test_site:99 "Installations de test colossales"
    giga_tech_engineering_test_site_desc:99 "Construire une installation de test en orbite d'une planète peut s'avérer à la fois difficile et incroyablement mortel. Cependant, les applications potentielles sont très prometteuses."

    macro_test_site_0:99 "$gc_kilo$$name_eng_test_site$ : Géo-stabilisateur"
    macro_test_site_0_DESC:99 "Un grand appareil conçu pour empêcher les étendues gelées de la planète d'être complètement détruites par le stress constant de l'ampleur de nos tests d'armes prévus."
    macro_test_site_0_MEGASTRUCTURE_DETAILS:99 "$giga_list_category_kilostructure$ - $giga_list_category_science_production$\nGénère des gisements de £engineering_research£ §YRecherche en ingénierie§! sur les planètes du système.\n§LUne grande station en orbite d'une planète gelée pour mener librement des expériences liées à l'ingénierie.§!" #megalistentry MACROENGINEERING TEST SITE
    macro_test_site_0_CONSTRUCTION_INFO_DELAYED:99 "$giga_list_additional_data$ - $orbital_test_site_1_mod_tooltip$"

    macro_test_site_1:99 "$name_eng_test_site$ : Baies de test de matériaux"
    macro_test_site_1_DESC:99 "Les baies de test permettent le déplacement à grande échelle de matériaux et de vaisseaux inachevés vers les sites de test sur la planète en dessous, ainsi que vers d'autres planètes du système."

    macro_test_site_2:99 "$name_eng_test_site$ : Simulations de matériaux"
    macro_test_site_2_DESC:99 "Les simulations de matériaux peuvent aider à améliorer encore l'efficacité des tests de matériaux plus pratiques, permettant un impressionnant éventail de destruction simulée et de dévastation planétaire."

    macro_test_site_3:99 "$name_eng_test_site$ : Champ de tir orbital"
    macro_test_site_3_DESC:99 "Les champs de tir permettent un bombardement quasi constant de la planète en dessous, ainsi qu'une livraison de munitions hostiles lentes à longue portée vers d'autres planètes du système, bien qu'elles soient bien trop lentes pour être utilisées dans des scénarios de combat."

    macro_test_site_ruined:99 "$name_eng_test_site$ en ruines"
    macro_test_site_ruined_DESC:99 "Un $name_eng_test_site$ en ruines, construit il y a des éons par une espèce spatiale. Bien que l'intérieur soit complètement ravagé, la coque externe est en grande partie intacte et pourrait être réparée."
    macro_test_site_ruined_MEGASTRUCTURE_DETAILS:99 "$macro_test_site_ruined_DESC$"

    macro_test_site_restored:99 "$name_eng_test_site$"
    macro_test_site_restored_DESC:99 "$macro_test_site_3_DESC$"

    macro_test_site_1_dismantle:99 "Démanteler la mégastructure"
    macro_test_site_1_dismantle_DESC:99 "Cette mégastructure sera déconstruite et mise au rebut pour récupérer les matériaux."

    giga_dialog.403.name:99 "$name_eng_test_site$ en ruines"
    giga_dialog.403.desc:99 "Notre vaisseau scientifique a détecté une station spatiale assez grande en orbite autour d'une planète dans le système [from.GetName]. Après une inspection plus approfondie, il apparaît que cette station spatiale est en fait un $name_eng_test_site$ délabré, construit il y a longtemps par une espèce inconnue. Cette station spatiale a probablement servi de terrain d'essai pour de nombreuses expériences par le passé, mais est malheureusement tombée en ruines depuis."
    giga_dialog.403.a:99 "$INTRIGUING$"

    #########################################
    ### Atmospheric Storm Observatory #######
    #########################################
    giga_tech_macro_scale_weather_manipulation:99 "Manipulation météorologique macro-atmosphérique"
    giga_tech_macro_scale_weather_manipulation_desc:99 "La construction d'une installation dédiée à la création de tempêtes massives dans l'atmosphère des géantes gazeuses pourrait nous permettre d'étudier les effets bien mieux que n'importe quelle tempête naturelle. Les applications d'une telle recherche sur les tempêtes sont très prometteuses."

    atmosphere_shredder_0:99 "$gc_kilo$$name_atmosphere_shredder$ : Oeil de la tempête"
    atmosphere_shredder_0_DESC:99 "Une grande installation de manipulation météorologique abritant tous les matériaux nécessaires pour déclencher une tempête expérimentale à l'échelle de l'atmosphère. La structure nous permettra de mener diverses expériences sur la géante gazeuse elle-même et de collecter des données précieuses de tout le système."
    atmosphere_shredder_0_MEGASTRUCTURE_DETAILS:99 "$giga_list_category_kilostructure$ - $giga_list_category_science_production$\nGénère des gisements de £physics_research£ §YRecherche en physique§! sur les planètes du système.\n§LUne grande station en orbite d'une géante gazeuse provoquant une tempête permanente pour l'étude et l'expérimentation.§!"
    atmosphere_shredder_0_CONSTRUCTION_INFO_DELAYED:99 "$giga_list_additional_data$ - $orbital_atmosphere_shredder_1_mod_tooltip$"

    atmosphere_shredder_1:99 "$name_atmosphere_shredder$ : Bras agitateurs"
    atmosphere_shredder_1_DESC:99 "Les bras agitateurs colossaux permettent d'amplifier la force de la tempête planétaire, augmentant encore le potentiel d'étude."

    atmosphere_shredder_2:99 "$name_atmosphere_shredder$ : Bras stabilisateurs"
    atmosphere_shredder_2_DESC:99 "Les bras stabilisateurs permettront de créer des poches de calme relatif dans la tempête, autorisant la récupération en toute sécurité des drones et autres machines automatisées envoyés dans la tempête pour l'étudier."

    atmosphere_shredder_3:99 "$name_atmosphere_shredder$ : Anneau de laboratoires"
    atmosphere_shredder_3_DESC:99 "L'anneau de laboratoires abrite les capteurs les moins délicats de la station. L'anneau est conçu pour être immergé dans la puissance de la tempête, permettant de récupérer une mine de données."

    atmosphere_shredder_complete_name:99 "$name_atmosphere_shredder$"

    atmosphere_shredder_ruined:99 "$name_atmosphere_shredder$ en ruines"
    atmosphere_shredder_ruined_DESC:99 "Un $name_atmosphere_shredder$ en ruines, construit il y a des éons par une espèce spatiale. Bien que le mécanisme de contrôle des tempêtes et les composants internes soient détruits, la coque externe est en grande partie intacte et pourrait être réparée."
    atmosphere_shredder_ruined_MEGASTRUCTURE_DETAILS:99 "$atmosphere_shredder_ruined_DESC$"

    atmosphere_shredder_restored:99 "$name_atmosphere_shredder$"
    atmosphere_shredder_restored_DESC:99 "$atmosphere_shredder_3_DESC$"

