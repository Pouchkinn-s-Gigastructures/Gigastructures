    alderson_disk_2_gaia:99 "Tranche d'Alderson"
    alderson_disk_2_gaia_DESC:99 "Une tranche gargantuesque d'un $name_alderson$, s'étendant jusqu'aux confins de ce système solaire. Capable d'abriter des quantités inouïes de personnes à sa surface."

