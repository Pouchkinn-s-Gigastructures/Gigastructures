    succ_0:0 "$gc_kilo$Site de construction du $name_succ$"
    succ_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$ - $giga_list_category_strategic_resource_production$\nRévèle et amplifie les gisements de £exotic_gases£ §YGaz exotiques§! et d'£energy£ §YÉnergie§! sur les §YGéantes gazeuses§!.\n§LLe S.U.C.C. prélève méthodiquement l'atmosphère d'un monde gazeux, extrayant les gaz les plus précieux tout en utilisant le reste pour alimenter de vastes réseaux de fusion.§!" #megalistentry SUCC
    succ_0_DESC:0 "Le site de construction d'un futur $name_succ_full$. Il abrite le personnel et l'infrastructure nécessaires pour construire un $name_succ$ autour d'un monde gazeux proche."

    succ_0_CONSTRUCTION_INFO_DELAYED:0 "$sr_mega_extra_data$"
    #Old first stage
    # succ_1:0 "$name_succ$ Orbital Apparatus"
    # succ_1_DESC:0 "This gigantic ring stretches around the Gas Giant, and houses fusion reactors for energy generation, as well as purifying facilities for harvesting exotic gases and volatile motes from the Gas Giant's atmosphere."

    succ_1:0 "$name_succ$"
    succ_1_DESC:0 "Un $name_succ_full$ complet et opérationnel, récoltant progressivement de vastes quantités de gaz d'une géante gazeuse. Des réacteurs à fusion utilisent l'hydrogène collecté pour générer de vastes quantités d'énergie."
    ########################################
    ############## STRIPMINE ###############
    ########################################
    sr_mega_extra_data:0 "Va §Yrévéler§! et §Yamplifier§! les gisements de ressources stratégiques, et §Yamplifier§! (mais pas créer) les gisements de ressources ordinaires."

    automated_stripmine_0:0 "$gc_kilo$Site de construction de la $name_auto_stripmine$"
    automated_stripmine_0_DESC:0 "Le site de construction d'une future $name_auto_stripmine$. Il contient tout le nécessaire pour construire l'appareil minier orbital ainsi que les usines de surface."
    automated_stripmine_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$ - $giga_list_category_strategic_resource_production$\nRévèle et amplifie les gisements de £volatile_motes£ §YParticules volatiles§! et de £minerals£ ou £alloys£ sur les §YMondes en fusion§!.\n§LÀ travers la danse délicate d'immenses foreuses et de faisceaux de traction, la mine à ciel ouvert automatisée pèle la croûte d'une planète en fusion, récoltant de précieuses particules volatiles du manteau incandescent à l'intérieur." #gigalistentry AUTOMATED STRIPMINE
    automated_stripmine_0_CONSTRUCTION_INFO_DELAYED:0 "$sr_mega_extra_data$"
    # Old first stage
    # automated_stripmine_1:0 "$name_auto_stripmine$ Orbital Apparatus"
    # automated_stripmine_1_DESC:0 "This large orbital apparatus is equipped with two enormous tractor beams capable of pulling large amounts of minerals into orbit. Those minerals will be extracted by a plethora of automated drilling units on the surface of the planet."

    automated_stripmine_1:0 "$name_auto_stripmine$"
    automated_stripmine_1_DESC:0 "Une grande construction orbitale récoltant des particules volatiles directement du manteau incandescent d'un monde en fusion."

    #########################################
    ############## Kugelblitz ###############
    #########################################
    #Deprecated
    # kugelblitz_0:0 "$gc_mega$$name_kugelblitz$ Site"
    # kugelblitz_0_DESC:0 "The construction site for a future $name_kugelblitz$. Houses the personnel necessary to construct this incredibly advanced storage device."
    # kugelblitz_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_megastructure$ - $giga_list_category_storage$\nStores §Y40000§! of each resource and generates £energy£ §YEnergy§!\n§LAn incredibly advanced Kugelblitz-based storage device, which can store energy and matter in the form of radiation." #megalistentry KUGELBLITZ

    kugelblitz_0:0 "$gc_kilo$$name_kugelblitz$ vide"
    kugelblitz_0_DESC:0 "Une grande construction capable de créer un Kugelblitz artificiel pour générer et stocker de l'énergie grâce au rayonnement de Hawking accéléré, ainsi que de la matière. Elle peut également extraire l'énergie stockée afin de l'utiliser."
    kugelblitz_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$ - $giga_list_category_storage$\nStocke des quantités incroyables de chaque ressource.\n§LUn dispositif de stockage basé sur un Kugelblitz incroyablement avancé, capable de stocker de l'énergie et de la matière sous forme de rayonnement." #megalistentry KUGELBLITZ

    kugelblitz_1:0 "$name_kugelblitz$"
    kugelblitz_1_DESC:0 "Cette construction abrite un Kugelblitz artificiel ainsi que des dispositifs capables d'injecter et d'extraire de l'énergie de celui-ci. Le Kugelblitz nécessite une petite quantité d'énergie pour maintenir la singularité stable et permettre un stockage sûr continu des matériaux."

    kugelblitz_2:0 "$name_kugelblitz$ amélioré"
    kugelblitz_2_DESC:0 "Cette construction abrite un Kugelblitz artificiel ainsi que des dispositifs capables d'injecter et d'extraire de l'énergie de celui-ci. Les avancées en technologie à super-échelle ont permis de générer un kugelblitz stabilisé bien plus grand, permettant ainsi une plus grande capacité de stockage."

    kugelblitz_3:0 "Grand $name_kugelblitz$"
    kugelblitz_3_DESC:0 "Cette construction abrite un Kugelblitz artificiel ainsi que des dispositifs capables d'injecter et d'extraire de l'énergie de celui-ci. En utilisant l'ingénierie tétradimensionnelle, nous sommes capables d'une augmentation encore plus importante de la capacité de stockage viable à partir d'un seul kugelblitz généré."

    kugelblitz_ruined:0 "$name_kugelblitz$ en ruine"
    kugelblitz_ruined_DESC:0 "Un $name_kugelblitz$ en ruine. Construit pour abriter une singularité artificielle contrôlée, cette construction a subi d'immenses dommages dans le passé et n'est plus opérationnelle. Bien que difficiles, des réparations pourraient être possibles."
    kugelblitz_ruined_MEGASTRUCTURE_DETAILS:0 "$kugelblitz_ruined_DESC$"

    kugelblitz_restored:0 "$name_kugelblitz$"
    kugelblitz_restored_DESC:0 "$kugelblitz_2_DESC$"

    #########################################
    ### Planetary Seeder Nexus ##############
    #########################################
    giga_tech_planetary_seeder_nexus:0 "Subsistance extrémophile à grande échelle"
    giga_tech_planetary_seeder_nexus_desc:0 "Les mondes stériles, qu'ils soient chauds ou froids, possèdent souvent les éléments de base de la vie, simplement pas dans la bonne disposition. Cependant, avec la découverte des Cutholoïdes et des Amibes prospérant dans les profondeurs de l'espace, il existe maintenant la possibilité de créer des « formes de vie » artificielles sur mesure qui, une fois déposées sur des mondes sans vie, seront capables d'accumuler et de réarranger ces éléments de base en diverses substances adaptées à la récolte et à la consommation. Comme tout cela ne ferait que mélanger et réarranger des molécules dispersées en divers composés comestibles, celles-ci devraient être régulièrement reconstituées et ne constitueraient pas une véritable « biosphère », mais pourraient fournir un approvisionnement utile en matériaux pour nos industries nutritionnelles."

    planetary_seeder_nexus_0:0 "$gc_kilo$$name_planetary_seeder_nexus$ : Biocapteurs organiques"
    planetary_seeder_nexus_0_DESC:0 "Ce site servira de base pour construire un $name_planetary_seeder_nexus$, une installation orbitale de bio-ingénierie produisant divers automates quasi-biologiques capables de retraiter les composés organiques dispersés trouvés dans les mondes sans vie en matière comestible. De grands réseaux de géo-surveillance scannent constamment les mondes proches et déploient des sondes pour confirmer les emplacements des composés organiques transformables hautement concentrés."
    planetary_seeder_nexus_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$ - $giga_list_category_basic_resource_production$\nGénère des gisements de £food£ §YNourriture§! sur les planètes du système.\n§LUne station construite en orbite d'une géante gazeuse, produisant des automates biologiques qui retraitent les composés organiques en matière comestible.§!" #megalistentry PLANETARY SEEDER NEXUS
    planetary_seeder_nexus_0_CONSTRUCTION_INFO_DELAYED:0 "$giga_list_additional_data$ - $planetary_seeder_nexus_1_mod_tooltip$"

    planetary_seeder_nexus_1:0 "$name_planetary_seeder_nexus$ : Manufacture biologique"
    planetary_seeder_nexus_1_DESC:0 "Des formes de vie nutritives semblables au phytoplancton, capables de prospérer dans les océans souterrains, les croûtes rocheuses et les atmosphères gazeuses, sont produites en vastes quantités et répandues dans le système local."

    planetary_seeder_nexus_2:0 "$name_planetary_seeder_nexus$ : Usines à enzymes"
    planetary_seeder_nexus_2_DESC:0 "Pour les mondes qui ne peuvent soutenir la vie conventionnelle, des usines avancées fabriquent des automates cellulaires riches en enzymes capables d'incroyables prouesses de chimie moléculaire, allant du réarrangement de la croûte et de l'atmosphère de mondes riches en carbone en piliers de saccharose cristallisé à la production de bouillie protéinique en manipulant les hydrocarbures et l'eau."

    planetary_seeder_nexus_3:0 "$name_planetary_seeder_nexus$"
    planetary_seeder_nexus_3_DESC:0 "Un $name_planetary_seeder_nexus$ complet, supervisant la production, le déploiement et la récolte subséquente d'enzymes spécialisées et de formes de vie nutritionnelles sur presque tous les mondes de ce système."

    #########################################
    ### Orbital Artificial Ecosystem ########
    #########################################
    giga_tech_orbital_artificial_eco:0 "Écosystèmes orbitaux"
    giga_tech_orbital_artificial_eco_desc:0 "Créer un écosystème complexe entièrement fonctionnel en orbite d'une planète est un véritable défi, mais une telle technologie permet la construction de grands écosystèmes en orbite d'une planète à des fins de recherche."

    orbital_artificial_eco_0:0 "$gc_kilo$$name_orbital_artificial_eco$ : Support vital"
    orbital_artificial_eco_0_DESC:0 "Ce site servira de base pour construire un $name_orbital_artificial_eco$, qui est une grande structure abritant un écosystème entièrement artificiel sur lequel nous pouvons expérimenter librement."
    orbital_artificial_eco_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$ - $giga_list_category_science_production$\nGénère des gisements de £society_research£ §YRecherche en société§! sur les planètes du système.\n§LUne station construite en orbite d'un monde toxique pour abriter et étudier un grand nombre d'espèces exotiques de flore et de faune.§!" #megalistentry ORBITAL ARTIFICIAL ECOSYSTEM
    orbital_artificial_eco_0_CONSTRUCTION_INFO_DELAYED:0 "$giga_list_additional_data$ - $orbital_eco_arcology_1_mod_tooltip$"

    orbital_artificial_eco_1:0 "$name_orbital_artificial_eco$ : Banque génétique"
    orbital_artificial_eco_1_DESC:0 "Un ensemble de bras externes pour stocker fonctionnellement les informations génétiques de toutes les espèces hébergées dans le $name_orbital_artificial_eco$ prévu, afin que si l'une d'elles s'éteint, elle puisse être récupérée."

    orbital_artificial_eco_2:0 "$name_orbital_artificial_eco$ : Enclos exotiques"
    orbital_artificial_eco_2_DESC:0 "Les enclos exotiques abritent une variété d'environnements simulés ainsi que des installations pour garantir que toute la flore et la faune maintiennent des populations durables."

    orbital_artificial_eco_3:0 "$name_orbital_artificial_eco$ : Tests planétaires"
    orbital_artificial_eco_3_DESC:0 "Un $name_orbital_artificial_eco$ complet, rempli d'espèces importées ainsi que d'espèces fabriquées grâce au génie génétique. Cet écosystème unique peut être modelé et déformé à volonté par nos scientifiques pour étudier le fonctionnement de la nature."

    orbital_artificial_eco_ruined:0 "$name_orbital_artificial_eco$ en ruine"
    orbital_artificial_eco_ruined_DESC:0 "Un $name_orbital_artificial_eco$ en ruine. Il abritait autrefois un grand nombre d'espèces bio-ingénierisées dans des environnements contrôlés, mais plus maintenant. Il pourrait être possible de le restaurer avec les technologies appropriées."
    orbital_artificial_eco_ruined_MEGASTRUCTURE_DETAILS:0 "$orbital_artificial_eco_ruined_DESC$"

    orbital_artificial_eco_restored:0 "$name_orbital_artificial_eco$"
    orbital_artificial_eco_restored_DESC:0 "$orbital_artificial_eco_3_DESC$"

    giga_dialog.1003.name:0 "$name_orbital_artificial_eco$ en ruine"
    giga_dialog.1003.desc:0 "Un $name_orbital_artificial_eco$ en ruine a été repéré en orbite autour d'une géante gazeuse dans le système [from.GetName]. Il semble avoir subi de gros dommages, mais l'armature extérieure est encore en partie intacte. Nos scientifiques pensent qu'il pourrait être possible de le réparer si nous possédons les technologies appropriées."
    giga_dialog.1003.a:0 "Intéressant."
    #########################################
    ### Macroengineering Test Site ##########
    #########################################
    giga_tech_engineering_test_site:0 "Installations de test colossales"
    giga_tech_engineering_test_site_desc:0 "Construire une installation de test en orbite d'une planète peut s'avérer à la fois difficile et incroyablement mortel. Cependant, les applications potentielles sont très prometteuses."

    macro_test_site_0:0 "$gc_kilo$$name_eng_test_site$ : Géo-stabilisateur"
    macro_test_site_0_DESC:0 "Un grand appareil conçu pour aider à empêcher les étendues glacées de la planète d'être complètement détruites par le stress constant de l'ampleur de nos tests d'armes prévus."
    macro_test_site_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$ - $giga_list_category_science_production$\nGénère des gisements de £engineering_research£ §YRecherche en ingénierie§! sur les planètes du système.\n§LUne grande station en orbite d'une planète gelée pour mener librement des expériences liées à l'ingénierie.§!" #megalistentry MACROENGINEERING TEST SITE
    macro_test_site_0_CONSTRUCTION_INFO_DELAYED:0 "$giga_list_additional_data$ - $orbital_test_site_1_mod_tooltip$"

    macro_test_site_1:0 "$name_eng_test_site$ : Baies de test de matériaux"
    macro_test_site_1_DESC:0 "Les baies de test permettent le déplacement à grande échelle de matériaux et de vaisseaux inachevés vers les sites de test sur la planète ci-dessous, ainsi que vers d'autres planètes du système."

    macro_test_site_2:0 "$name_eng_test_site$ : Simulations de matériaux"
    macro_test_site_2_DESC:0 "Les simulations de matériaux peuvent aider à améliorer encore l'efficacité des tests de matériaux plus pratiques, permettant un éventail impressionnant de destruction simulée et de dévastation planétaire."

    macro_test_site_3:0 "$name_eng_test_site$ : Champ de tir orbital"
    macro_test_site_3_DESC:0 "Les champs de tir permettent un bombardement quasi constant de la planète ci-dessous, ainsi que la livraison à longue portée de munitions hostiles plus lentes vers d'autres planètes du système, bien qu'elles soient bien trop lentes pour être utilisées dans des scénarios de combat."

    macro_test_site_ruined:0 "$name_eng_test_site$ en ruine"
    macro_test_site_ruined_DESC:0 "Un $name_eng_test_site$ en ruine, construit il y a des éons par une race spatiale. Bien que l'intérieur soit complètement détruit, la coque externe est en grande partie intacte et pourrait être réparée."
    macro_test_site_ruined_MEGASTRUCTURE_DETAILS:0 "$macro_test_site_ruined_DESC$"

    macro_test_site_restored:0 "$name_eng_test_site$"
    macro_test_site_restored_DESC:0 "$macro_test_site_3_DESC$"

    macro_test_site_1_dismantle:0 "Démanteler la mégastructure"
    macro_test_site_1_dismantle_DESC:0 "Cette mégastructure sera déconstruite et récupérée pour ses matériaux."

    giga_dialog.403.name:0 "$name_eng_test_site$ en ruine"
    giga_dialog.403.desc:0 "Notre vaisseau scientifique a détecté une station spatiale assez grande en orbite autour d'une planète dans le système [from.GetName]. Après une inspection plus approfondie, il apparaît que cette station spatiale est en fait un $name_eng_test_site$ délabré, construit il y a longtemps par une espèce inconnue. Cette station spatiale a probablement servi de terrain d'essai pour de nombreuses expériences dans le passé, mais est depuis malheureusement tombée en ruine."
    giga_dialog.403.a:0 "$INTRIGUING$"

    #########################################
    ### Atmospheric Storm Observatory #######
    #########################################
    giga_tech_macro_scale_weather_manipulation:0 "Manipulation météorologique macro-atmosphérique"
    giga_tech_macro_scale_weather_manipulation_desc:0 "La construction d'une installation dédiée à la création de tempêtes massives dans l'atmosphère des géantes gazeuses pourrait nous permettre d'étudier les effets bien mieux que n'importe quelle tempête naturelle. Les applications d'une telle recherche sur les tempêtes sont très prometteuses."

    atmosphere_shredder_0:0 "$gc_kilo$$name_atmosphere_shredder$ : Œil du cyclone"
    atmosphere_shredder_0_DESC:0 "Une grande installation de manipulation météorologique abritant tous les matériaux nécessaires pour démarrer une tempête expérimentale à l'échelle atmosphérique. La structure nous permettra de mener diverses expériences sur la géante gazeuse elle-même et de collecter des données précieuses de tout le système."
    atmosphere_shredder_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$ - $giga_list_category_science_production$\nGénère des gisements de £physics_research£ §YRecherche en physique§! sur les planètes du système.\n§LUne grande station en orbite d'une géante gazeuse provoquant une tempête permanente pour l'étude et l'expérimentation.§!"
    atmosphere_shredder_0_CONSTRUCTION_INFO_DELAYED:0 "$giga_list_additional_data$ - $orbital_atmosphere_shredder_1_mod_tooltip$"

    atmosphere_shredder_1:0 "$name_atmosphere_shredder$ : Bras agitateurs"
    atmosphere_shredder_1_DESC:0 "Les colossaux bras agitateurs permettent d'amplifier la force de la tempête planétaire, augmentant encore le potentiel d'étude."

    atmosphere_shredder_2:0 "$name_atmosphere_shredder$ : Bras stabilisateurs"
    atmosphere_shredder_2_DESC:0 "Les bras stabilisateurs permettront de créer des poches de calme relatif dans la tempête, permettant la récupération en toute sécurité des drones et autres machines automatisées envoyées dans la tempête pour l'étudier."

    atmosphere_shredder_3:0 "$name_atmosphere_shredder$ : Anneau de laboratoires"
    atmosphere_shredder_3_DESC:0 "L'anneau de laboratoires abrite les capteurs les moins délicats de la station. L'anneau est destiné à être immergé dans la puissance de la tempête, permettant de récupérer une richesse de données."

    atmosphere_shredder_complete_name:0 "$name_atmosphere_shredder$"

    atmosphere_shredder_ruined:0 "$name_atmosphere_shredder$ en ruine"
    atmosphere_shredder_ruined_DESC:0 "Un $name_atmosphere_shredder$ en ruine, construit il y a des éons par une race spatiale. Bien que le mécanisme de contrôle des tempêtes et les composants internes soient détruits, la coque externe est en grande partie intacte et pourrait être réparée."
    atmosphere_shredder_ruined_MEGASTRUCTURE_DETAILS:0 "$atmosphere_shredder_ruined_DESC$"

    atmosphere_shredder_restored:0 "$name_atmosphere_shredder$"
    atmosphere_shredder_restored_DESC:0 "$atmosphere_shredder_3_DESC$"

