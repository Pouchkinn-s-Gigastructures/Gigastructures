 name_asteroid_manufactory:99 "Site industriel astéroïdal"
 name_plural_asteroid_manufactory:99 "Sites industriels astéroïdaux"

 asteroid_manufactory_0:99 "$gc_kilo$$name_asteroid_manufactory$"
 asteroid_manufactory_0_DESC:99 "Le chantier de construction d'une future installation industrielle, abritant l'équipement et le personnel nécessaires à l'édification d'un vaste complexe d'extraction et de traitement autour d'un astéroïde proche."
 asteroid_manufactory_0_MEGASTRUCTURE_DETAILS:99 "$giga_list_category_kilostructure$ - $giga_list_category_basic_resource_production$ - $giga_list_category_advanced_resource_production$\nOffre un choix de §Ybâtiments industriels§! selon le §Ytype d'astéroïde§! et le §Ygisement§!\nLes bâtiments industriels correspondants confèrent un §Ybonus§! s'ils sont construits sur des planètes du même §Ysystème solaire§!\n§LUne vaste installation construite autour d'un astéroïde, exploitant ses ressources pour un usage planétaire.§!" #gigalistentry ASTEROID MANUFACTORY
 asteroid_manufactory_0_CONSTRUCTION_INFO_DELAYED:99 "$asteroid_manufactory_cost$\n\nDoit être construit sur un astéroïde possédant le modificateur §Y$asteroid_manufactory_candidate$§!\n\n$MEGASTRUCTURE_UPGRADES_TO$\n\n$asteroid_manufactory_alloys_upgrade$\n$asteroid_manufactory_energy_upgrade$\n\nDisponible pour les empires utilisant £consumer_goods£ $consumer_goods$ :\n$asteroid_manufactory_consumer_goods_upgrade$\n\nDisponible pour les empires utilisant £food£ $food$ :\n$asteroid_manufactory_food_upgrade$\n\nDisponible si la §Ylimite de construction de mégastructures§! est définie sur £job£§BBasée sur les emplois§! :\n$asteroid_manufactory_supertensiles_upgrade$"

 asteroid_manufactory_cost:99 "Coût d'amélioration de base : £unity£§Y500§! £alloys£§Y750§! £time£ 900"
 asteroid_manufactory_synergy:99 "§GBonus de même système :§!"
 asteroid_manufactory_rocky:99 "§LRocheux§!"
 asteroid_manufactory_icy:99 "§EGlacé§!"
 asteroid_manufactory_crystal:99 "§MCristallin§!"

 giga_is_rocky_asteroid:99 "Est un astéroïde $asteroid_manufactory_rocky$"
 giga_is_icy_asteroid:99 "Est un astéroïde $asteroid_manufactory_icy$"
 giga_is_crystal_asteroid:99 "Est un astéroïde $asteroid_manufactory_crystal$"

 asteroid_manufactory_candidate:99 "Candidat $name_asteroid_manufactory$"
 asteroid_manufactory_candidate_plural:99 "Candidats $name_asteroid_manufactory$"
 asteroid_manufactory_subtitle:99 "$giga_list_category_kilostructure$ - Amélioration $name_asteroid_manufactory$\n\n"

 asteroid_manufactory_alloys:99 "Extracteur de minerai brut"
 asteroid_manufactory_alloys_DESC:99 "Cette exploitation minière extrait et trie de grandes quantités de minerai depuis un astéroïde, prêtes à être acheminées vers les fonderies planétaires."
 asteroid_manufactory_alloys_trigger:99 "Nécessite le modificateur $giga_asteroid_industry_candidate_alloys$"
 asteroid_manufactory_alloys_placement:99 "- Doit être construit sur un astéroïde $asteroid_manufactory_rocky$ possédant un gisement de £minerals£ §Y$minerals$§! ou d'£alloys£ §Y$alloys$§!"
 asteroid_manufactory_alloys_effect:99 "- $mod_building_giga_asteroid_factory_alloys_country_max$ : §G+1§!\n- $asteroid_manufactory_synergy$ Remplace une partie de l'entretien des £job_foundry£ $job_foundry$ par de l'£energy£ §Y$energy$§!"
 asteroid_manufactory_alloys_upgrade:99 "£job_foundry£ ['concept_giga_asteroid_industry_alloys']"
 concept_giga_asteroid_industry_alloys:99 "$asteroid_manufactory_alloys$"
 concept_giga_asteroid_industry_alloys_desc:99 "$asteroid_manufactory_subtitle$$asteroid_manufactory_alloys_effect$"
 asteroid_manufactory_ai_alloys:99 "$asteroid_manufactory_0$"
 asteroid_manufactory_platform_alloys:99 "Chantier de construction : $asteroid_manufactory_alloys$"
 asteroid_manufactory_platform_alloys_DESC:99 "$asteroid_manufactory_0_DESC$"
 giga_asteroid_industry_candidate_alloys:99 "$asteroid_manufactory_candidate$ : §Y$alloys$§!"
 giga_asteroid_industry_candidate_alloys_desc:99 "§TUn ['concept_giga_asteroid_industry_alloys'] peut être construit ici§!\n\nDes filons minéraux denses font de [this.GetName] un emplacement idéal pour l'extraction de matières premières."

 asteroid_manufactory_consumer_goods:99 "Manufacture astéroïdale"
 asteroid_manufactory_consumer_goods_DESC:99 "Une installation de traitement des matériaux qui préfabrique de grands volumes de composants standardisés destinés aux usines planétaires de biens de consommation."
 asteroid_manufactory_consumer_goods_trigger:99 "Nécessite le modificateur $giga_asteroid_industry_candidate_consumer_goods$"
 asteroid_manufactory_consumer_goods_placement:99 "- Doit être construit sur un astéroïde $asteroid_manufactory_rocky$ ou $asteroid_manufactory_icy$ possédant un gisement de £minerals£ §Y$minerals$§!"
 asteroid_manufactory_consumer_goods_effect:99 "- $mod_building_giga_asteroid_factory_consumer_goods_country_max$ : §G+1§!\n- $asteroid_manufactory_synergy$ Remplace une partie de l'entretien en £minerals£ §Y$minerals$§! des £job_artisan£ $job_artisan$ par de l'£energy£ §Y$energy$§!"
 asteroid_manufactory_consumer_goods_upgrade:99 "£job_artisan£ ['concept_giga_asteroid_industry_consumer_goods']"
 concept_giga_asteroid_industry_consumer_goods:99 "$asteroid_manufactory_consumer_goods$"
 concept_giga_asteroid_industry_consumer_goods_desc:99 "$asteroid_manufactory_subtitle$§EConditions :§!\n- Disponible pour les empires utilisant £consumer_goods£ §Y$consumer_goods$§!\n\n§EEffets :§!\n$asteroid_manufactory_consumer_goods_effect$"
 asteroid_manufactory_ai_consumer_goods:99 "$asteroid_manufactory_0$"
 asteroid_manufactory_platform_consumer_goods:99 "Chantier de construction : $asteroid_manufactory_consumer_goods$"
 asteroid_manufactory_platform_consumer_goods_DESC:99 "$asteroid_manufactory_0_DESC$"
 giga_asteroid_industry_candidate_consumer_goods:99 "$asteroid_manufactory_candidate$ : §Y$consumer_goods$§!"
 giga_asteroid_industry_candidate_consumer_goods_desc:99 "§TUne ['concept_giga_asteroid_industry_consumer_goods'] peut être construite ici§!\n\nDe riches réserves d'hydrocarbures au sein de cet astéroïde pourraient être exploitées pour produire sur place une grande variété de biens de consommation."

 asteroid_manufactory_energy:99 "Dépôt de combustible de fusion"
 asteroid_manufactory_energy_DESC:99 "Une vaste installation d'extraction et de stockage de précurseurs de fusion, destinés à être acheminés vers les centrales énergétiques planétaires."
 asteroid_manufactory_energy_trigger:99 "Nécessite le modificateur $giga_asteroid_industry_candidate_energy$"
 asteroid_manufactory_energy_placement:99 "- Doit être construit sur un astéroïde $asteroid_manufactory_icy$ possédant un gisement d'£energy£ §Y$energy$§!"
 asteroid_manufactory_energy_effect:99 "- $mod_building_giga_asteroid_factory_energy_country_max$ : §G+1§!\n- $asteroid_manufactory_synergy$ Réduit les coûts d'entretien en £energy£ §Y$energy$§! planétaires"
 asteroid_manufactory_energy_upgrade:99 "£job_technician£ ['concept_giga_asteroid_industry_energy']"
 concept_giga_asteroid_industry_energy:99 "$asteroid_manufactory_energy$"
 concept_giga_asteroid_industry_energy_desc:99 "$asteroid_manufactory_subtitle$\n$asteroid_manufactory_energy_effect$"
 asteroid_manufactory_ai_energy:99 "$asteroid_manufactory_0$"
 asteroid_manufactory_platform_energy:99 "Chantier de construction : $asteroid_manufactory_energy$"
 asteroid_manufactory_platform_energy_DESC:99 "$asteroid_manufactory_0_DESC$"
 giga_asteroid_industry_candidate_energy:99 "$asteroid_manufactory_candidate$ : §Y$energy$§!"
 giga_asteroid_industry_candidate_energy_desc:99 "§TUn ['concept_giga_asteroid_industry_energy'] peut être construit ici§!\n\nL'eau contenue dans cet astéroïde présente une forte concentration en deutérium et en tritium, idéale pour les centrales à fusion à haut rendement."

 asteroid_manufactory_food:99 "Station de récolte de glace"
 asteroid_manufactory_food_DESC:99 "Une installation dédiée à la séparation et au stockage de glace traitée, adaptée à l'agriculture à grande échelle, particulièrement sur les mondes les plus arides."
 asteroid_manufactory_food_trigger:99 "Nécessite le modificateur $giga_asteroid_industry_candidate_food$"
 asteroid_manufactory_food_placement:99 "- Doit être construit sur un astéroïde $asteroid_manufactory_icy$"
 asteroid_manufactory_food_effect:99 "- $mod_building_giga_asteroid_factory_food_country_max$ : §G+1§!\n- $asteroid_manufactory_synergy$ Améliore la production des £job_farmer£ $job_farmer$, réduit l'entretien en £food£ §Y$food$§! des £job_artisan£ $job_artisan$ ($civic_anglers$ uniquement)"
 asteroid_manufactory_food_upgrade:99 "£job_farmer£ ['concept_giga_asteroid_industry_food']"
 concept_giga_asteroid_industry_food:99 "$asteroid_manufactory_food$"
 concept_giga_asteroid_industry_food_desc:99 "$asteroid_manufactory_subtitle$§EConditions :§!\n- Disponible pour les empires utilisant £food£ §Y$food$§!\n\n§EEffets :§!\n$asteroid_manufactory_food_effect$"
 asteroid_manufactory_ai_food:99 "$asteroid_manufactory_0$"
 asteroid_manufactory_platform_food:99 "Chantier de construction : $asteroid_manufactory_food$"
 asteroid_manufactory_platform_food_DESC:99 "$asteroid_manufactory_0_DESC$"
 giga_asteroid_industry_candidate_food:99 "$asteroid_manufactory_candidate$ : §Y$food$§!"
 giga_asteroid_industry_candidate_food_desc:99 "§TUne ['concept_giga_asteroid_industry_food'] peut être construite ici§!\n\nD'immenses quantités de glace d'eau pure se trouvent au sein de cet astéroïde."

 asteroid_manufactory_supertensiles:99 "Fonderie de matériaux de mégaconstruction"
 asteroid_manufactory_supertensiles_DESC:99 "Une installation avancée de traitement des matériaux qui extrait des $giga_sr_amb_megaconstruction$ naturels ainsi que plusieurs minerais apparentés, les préparant pour un traitement ultérieur dans des salles blanches planétaires."
 asteroid_manufactory_supertensiles_trigger:99 "Nécessite le modificateur $giga_asteroid_industry_candidate_supertensiles$"
 asteroid_manufactory_supertensiles_placement:99 "- Doit être construit sur un astéroïde $asteroid_manufactory_rocky$ ou $asteroid_manufactory_icy$ possédant un gisement de £giga_sr_amb_megaconstruction£ §Y$giga_sr_amb_megaconstruction$§!"
 asteroid_manufactory_supertensiles_effect:99 "- $mod_building_giga_asteroid_factory_supertensiles_country_max$ : §G+1§!\n- $asteroid_manufactory_synergy$ Remplace une partie de l'entretien en £unity£ §Y$unity$§! des £job_giga_megaengineer£ $job_giga_megaengineer$ par de l'£energy£ §Y$energy$§!"
 asteroid_manufactory_supertensiles_upgrade:99 "£job_giga_megaengineer£ ['concept_giga_asteroid_industry_supertensiles']"
 concept_giga_asteroid_industry_supertensiles:99 "$asteroid_manufactory_supertensiles$"
 concept_giga_asteroid_industry_supertensiles_desc:99 "$asteroid_manufactory_subtitle$§EConditions :§!\n- L'option §Ylimite de construction de mégastructures§! doit être définie sur £job£§BBasée sur les emplois§!\n\n§EEffets :§!\n$asteroid_manufactory_supertensiles_effect$"
 asteroid_manufactory_ai_supertensiles:99 "$asteroid_manufactory_0$"
 asteroid_manufactory_platform_supertensiles:99 "Chantier de construction : $asteroid_manufactory_supertensiles$"
 asteroid_manufactory_platform_supertensiles_DESC:99 "$asteroid_manufactory_0_DESC$"
 giga_asteroid_industry_candidate_supertensiles:99 "$asteroid_manufactory_candidate$ : §Y$giga_sr_amb_megaconstruction$§!"
 giga_asteroid_industry_candidate_supertensiles_desc:99 "§TUne ['concept_giga_asteroid_industry_supertensiles'] peut être construite ici§!\n\nDes gisements naturels de $giga_sr_amb_megaconstruction$ se trouvent au sein de cet astéroïde et pourraient être extraits par des opérations minières intensives."

 asteroid_manufactory_2:99 "Autofabrique astéroïdale"
 asteroid_manufactory_2_DESC:99 "Une usine automatisée qui extrait et raffine les matériaux d'un astéroïde pour produire des biens destinés au marché de consommation."

 # Tech
 giga_tech_asteroid_manufactory:99 "Usines de fabrication astéroïdales"
 giga_tech_asteroid_manufactory_desc:99 "Vestiges de la formation de la plupart des systèmes solaires, les astéroïdes regorgent de ressources brutes facilement accessibles. De vastes structures construites autour d'eux, équipées de collecteurs spécialisés, pourraient être employées pour récolter ces ressources de manière continue et les acheminer vers des usines planétaires pour traitement ou consommation."

 # Construction Site
 giga_asteroid_industry.001.name:99 "Chantier industriel astéroïdal achevé !"
 giga_asteroid_industry.001.desc:99 "Le chantier de construction d'un futur site industriel vient d'être achevé dans le système [FromFrom.solar_system.GetName]. Flottant à proximité d'un astéroïde, cette vaste plateforme contient l'équipement nécessaire pour entamer la construction d'un grand complexe minier, qui pourra être spécialisé dans la production de toutes sortes de produits.\n\nUne question demeure : quel type d'installation devons-nous bâtir ?"

 giga_asteroid_industry.001.alloys:99 "Une installation minière axée sur la production d'£alloys£ §Y$alloys$§!."
 giga_asteroid_industry.001.alloys.effect:99 "Ce site sera configuré pour construire un ['concept_giga_asteroid_industry_alloys']."

 giga_asteroid_industry.001.consumer_goods:99 "Une usine conçue pour fabriquer des composants pour £consumer_goods£ §Y$consumer_goods$§!."
 giga_asteroid_industry.001.consumer_goods.effect:99 "Ce site sera configuré pour construire une ['concept_giga_asteroid_industry_consumer_goods']."

 giga_asteroid_industry.001.energy:99 "Un dépôt de combustible pour les centrales produisant de l'£energy£ §Y$energy$§!."
 giga_asteroid_industry.001.energy.effect:99 "Ce site sera configuré pour construire un ['concept_giga_asteroid_industry_energy']."

 giga_asteroid_industry.001.food:99 "Un extracteur de glace pour irriguer les fermes et produire de la £food£ §Y$food$§!."
 giga_asteroid_industry.001.food.effect:99 "Ce site sera configuré pour construire une ['concept_giga_asteroid_industry_food']."

 giga_asteroid_industry.001.supertensiles:99 "Un extracteur des matériaux nécessaires aux £giga_sr_amb_megaconstruction£ §Y$giga_sr_amb_megaconstruction$§!."
 giga_asteroid_industry.001.supertensiles.effect:99 "Ce site sera configuré pour construire une ['concept_giga_asteroid_industry_supertensiles']."

 giga_asteroid_industry.003.name:99 "[FromFrom.GetName] achevé"
 giga_asteroid_industry.003.generic:99 "La construction du [FromFrom.GetName] sur [FromFrom.planet.GetName] dans le système [FromFrom.solar_system.GetName] est terminée.\n\n"
 giga_asteroid_industry.003.alloys:99 "$giga_asteroid_industry.003.generic$Des barges de minerai s'alignent déjà, prêtes à transporter les précieux minerais vers nos fonderies planétaires.\n\nLes fonderies locales bénéficieront d'un traitement secondaire capable de réduire les déchets, moyennant des coûts de transport supplémentaires."
 giga_asteroid_industry.003.consumer_goods:99 "$giga_asteroid_industry.003.generic$Cette usine colossale produira des composants génériques pour une grande variété de produits de consommation, la finition et l'assemblage final étant effectués dans des dépôts planétaires.\n\nLes dépôts locaux bénéficieront d'importations mieux ciblées, mais les coûts logistiques seront accrus."
 giga_asteroid_industry.003.energy:99 "$giga_asteroid_industry.003.generic$Extrayant de grandes quantités de combustible utile de la glace, cette installation stockera du carburant destiné aux centrales génératrices planétaires.\n\nLes générateurs locaux bénéficieront d'une meilleure efficacité du réseau énergétique."
 giga_asteroid_industry.003.food:99 "$giga_asteroid_industry.003.generic$La glace extraite peut être utilisée pour alimenter des fermes intégrant des écosystèmes aquatiques, même sur les planètes les plus arides.\n\nLes fermes locales bénéficieront d'une production améliorée et d'infrastructures de recyclage des déchets."
 giga_asteroid_industry.003.supertensiles:99 "$giga_asteroid_industry.003.generic$Les matériaux extraits ici seront affinés et purifiés dans des fonderies moléculaires planétaires avant d'être utilisés dans d'autres projets de méga-ingénierie.\n\nLes installations locales bénéficieront d'un entretien bureaucratique réduit, mais les coûts logistiques seront accrus."

 desc_asteroid_manufactory:99 "Une installation de fabrication polyvalente construite autour d'un astéroïde. Offre un choix de bâtiments industriels fournissant des emplois, selon le type d'astéroïde utilisé et ses gisements."
 allow_asteroid_manufactory:99 "§HDébloque la mégastructure :§! $name_asteroid_manufactory$"
 giga_asteroid_manufactory_1:99 "£menu_1£§H$name_asteroid_manufactory$§!"
 giga_asteroid_manufactory_2:99 "£menu_2£§Y$name_asteroid_manufactory$§!"
 giga_asteroid_manufactory_3:99 "£menu_3£§G$name_asteroid_manufactory$§!"
 giga_asteroid_manufactory_r:99 "£menu_r£§B$name_asteroid_manufactory$§!"
 giga_asteroid_manufactory_u:99 "£menu_u£§M$name_asteroid_manufactory$§!"
 giga_asteroid_manufactory_disabled:99 "£menu_disabled£§R$name_asteroid_manufactory$§!"

 giga_tech_repeatable_asteroid_manufactory_cap:99 "Protocoles de gestion des $name_asteroid_manufactory$"
 giga_tech_repeatable_asteroid_manufactory_cap_desc:99 "Des protocoles avancés de construction et de maintenance permettant l'édification et la gestion de §Y$name_plural_asteroid_manufactory$§! supplémentaires au sein des frontières de notre empire."
 giga_asteroid_manufactory_capacity_increase_title:99 "Capacité de §Y$name_asteroid_manufactory$§! : §G+1§!"
 giga_asteroid_manufactory_capacity_increase_desc:99 "La capacité de l'empire en §Y$name_plural_asteroid_manufactory$§! est augmentée de §G+1§!"

