 building_giga_asteroid_factory_alloys_one_planet_modifier:99 "Autorise le bâtiment ['building:building_giga_asteroid_factory_alloys_one_planet'] et augmente son nombre d'emplois"
 mod_building_giga_asteroid_factory_alloys_country_max:99 "Bâtiments ['building:building_giga_asteroid_factory_alloys'] max."
