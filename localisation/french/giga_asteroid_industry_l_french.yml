 building_giga_asteroid_factory_energy:99 "Centrales à fusion de masse"
 building_giga_asteroid_factory_energy_desc:99 "Ces gigantesques centrales énergétiques dépendent des importations pour satisfaire leurs besoins élevés en combustible."
 building_giga_asteroid_factory_energy_modifier:99 "Bâtiments ['building:building_giga_asteroid_factory_energy'] max."
