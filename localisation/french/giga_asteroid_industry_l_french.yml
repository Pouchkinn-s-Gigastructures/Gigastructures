 building_giga_asteroid_factory_consumer_goods:99 "Dépôt d'importations interstellaires"
 building_giga_asteroid_factory_consumer_goods_desc:99 "Usines d'assemblage final pour les pièces préfabriquées construites dans des installations spatiales, ces fabriques peuvent produire n'importe quel article personnel imaginable."
