l_french:
  #########################################
  ### Asteroid Manufactory ################
  #########################################
  name_asteroid_manufactory:0 "Site industriel d'astéroïde"
  name_plural_asteroid_manufactory:0 "Sites industriels d'astéroïde"
  
  asteroid_manufactory_0:0 "$gc_kilo$$name_asteroid_manufactory$"
  asteroid_manufactory_0_DESC:0 "Le chantier de construction d'une future installation industrielle, abritant l'équipement et le personnel nécessaires pour construire une grande installation minière et de traitement autour d'un astéroïde proche."
  asteroid_manufactory_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$ - $giga_list_category_basic_resource_production$ - $giga_list_category_advanced_resource_production$\nFournit un choix de §Ybâtiments d'usine§! basé sur le §Ytype d'astéroïde§! et le §Ygisement§!\nLes bâtiments d'usine correspondants fournissent un §Ybonus§! s'ils sont construits sur des planètes dans le même §Ysystème solaire§!\n§LUne grande installation construite autour d'un astéroïde, récoltant des ressources pour une utilisation planétaire.§!" #gigalistentry ASTEROID MANUFACTORY
  asteroid_manufactory_0_CONSTRUCTION_INFO_DELAYED:0 "$asteroid_manufactory_cost$\n\nDoit être construit sur un astéroïde avec un modificateur §Y$asteroid_manufactory_candidate$§!\n\n$MEGASTRUCTURE_UPGRADES_TO$\n\n$asteroid_manufactory_alloys_upgrade$\n$asteroid_manufactory_energy_upgrade$\n\nDisponible pour les empires utilisant des £consumer_goods£ $consumer_goods$ :\n$asteroid_manufactory_consumer_goods_upgrade$\n\nDisponible pour les empires utilisant de la £food£ $food$ :\n$asteroid_manufactory_food_upgrade$\n\nDisponible si §YLimite de construction de mégastructure§! est réglée sur £job£§BBasée sur les emplois§! :\n$asteroid_manufactory_supertensiles_upgrade$"
  
  asteroid_manufactory_cost:0 "Coût d'amélioration de base : £unity£§Y500§! £alloys£§Y750§! £time£ 900"
  asteroid_manufactory_synergy:0 "§GBonus même système :§!"
  asteroid_manufactory_rocky:0 "§LRocheux§!"
  asteroid_manufactory_icy:0 "§EGlacé§!"
  asteroid_manufactory_crystal:0 "§MCristallin§!"
  
  giga_is_rocky_asteroid:0 "Est un astéroïde $asteroid_manufactory_rocky$"
  giga_is_icy_asteroid:0 "Est un astéroïde $asteroid_manufactory_icy$"
  giga_is_crystal_asteroid:0 "Est un astéroïde $asteroid_manufactory_crystal$"
  
  asteroid_manufactory_candidate:0 "Candidat $name_asteroid_manufactory$"
  asteroid_manufactory_candidate_plural:0 "Candidats $name_asteroid_manufactory$"
  asteroid_manufactory_subtitle:0 "$giga_list_category_kilostructure$ - Amélioration $name_asteroid_manufactory$\n\n"
  
  asteroid_manufactory_alloys:0 "Extracteur de minerai en vrac"
  asteroid_manufactory_alloys_DESC:0 "Cette opération minière extrait et trie de grandes quantités de minerai d'un astéroïde, prêtes à être expédiées vers les fonderies planétaires."
  asteroid_manufactory_alloys_trigger:0 "Nécessite le modificateur $giga_asteroid_industry_candidate_alloys$"
  asteroid_manufactory_alloys_placement:0 "- Doit être construit sur un astéroïde $asteroid_manufactory_rocky$ avec un gisement de £minerals£ §Y$minerals$§! ou d'£alloys£ §Y$alloys$§!"
  asteroid_manufactory_alloys_effect:0 "- $mod_building_giga_asteroid_factory_alloys_country_max$ : §G+1§!\n- $asteroid_manufactory_synergy$ Échange une partie de l'entretien des £job_foundry£ $job_foundry$ contre de l'£energy£ §Y$energy$§!"
  asteroid_manufactory_alloys_upgrade:0 "£job_foundry£ ['concept_giga_asteroid_industry_alloys']"
  concept_giga_asteroid_industry_alloys:0 "$asteroid_manufactory_alloys$"
  concept_giga_asteroid_industry_alloys_desc:0 "$asteroid_manufactory_subtitle$$asteroid_manufactory_alloys_effect$"
  asteroid_manufactory_ai_alloys:0 "$asteroid_manufactory_0$"
  asteroid_manufactory_platform_alloys:0 "Chantier de construction d'$asteroid_manufactory_alloys$"
  asteroid_manufactory_platform_alloys_DESC:0 "$asteroid_manufactory_0_DESC$"
  giga_asteroid_industry_candidate_alloys:0 "$asteroid_manufactory_candidate$ : §Y$alloys$§!"
  giga_asteroid_industry_candidate_alloys_desc:0 "§TUn ['concept_giga_asteroid_industry_alloys'] peut être construit ici§!\n\nDes filons denses de minéraux font de [this.GetName] un emplacement idéal pour l'extraction de matières premières."
  
  asteroid_manufactory_consumer_goods:0 "Manufacture d'astéroïde"
  asteroid_manufactory_consumer_goods_DESC:0 "Une installation de traitement des matériaux qui préfabrique de grands volumes de composants standardisés pour utilisation dans les usines planétaires de biens de consommation."
  asteroid_manufactory_consumer_goods_trigger:0 "Nécessite le modificateur $giga_asteroid_industry_candidate_consumer_goods$"
  asteroid_manufactory_consumer_goods_placement:0 "- Doit être construit sur un astéroïde $asteroid_manufactory_rocky$ ou $asteroid_manufactory_icy$ avec un gisement de £minerals£ §Y$minerals$§!"
  asteroid_manufactory_consumer_goods_effect:0 "- $mod_building_giga_asteroid_factory_consumer_goods_country_max$ : §G+1§!\n- $asteroid_manufactory_synergy$ Échange une partie de l'entretien en £minerals£ §Y$minerals$§! des £job_artisan£ $job_artisan$ contre de l'£energy£ §Y$energy$§!"
  asteroid_manufactory_consumer_goods_upgrade:0 "£job_artisan£ ['concept_giga_asteroid_industry_consumer_goods']"
  concept_giga_asteroid_industry_consumer_goods:0 "$asteroid_manufactory_consumer_goods$"
  concept_giga_asteroid_industry_consumer_goods_desc:0 "$asteroid_manufactory_subtitle$§EConditions :§!\n- Disponible pour les empires utilisant des £consumer_goods£ §Y$consumer_goods$§!\n\n§EEffets :§!\n$asteroid_manufactory_consumer_goods_effect$"
  asteroid_manufactory_ai_consumer_goods:0 "$asteroid_manufactory_0$"
  asteroid_manufactory_platform_consumer_goods:0 "Chantier de construction de $asteroid_manufactory_consumer_goods$"
  asteroid_manufactory_platform_consumer_goods_DESC:0 "$asteroid_manufactory_0_DESC$"
  giga_asteroid_industry_candidate_consumer_goods:0 "$asteroid_manufactory_candidate$ : §Y$consumer_goods$§!"
  giga_asteroid_industry_candidate_consumer_goods_desc:0 "§TUne ['concept_giga_asteroid_industry_consumer_goods'] peut être construite ici§!\n\nDe riches réserves d'hydrocarbures dans cet astéroïde pourraient être exploitées pour produire une grande variété de biens de consommation sur place."
  
  asteroid_manufactory_energy:0 "Dépôt de combustible de fusion"
  asteroid_manufactory_energy_DESC:0 "Une grande installation d'extraction et de stockage de précurseurs de fusion, à expédier vers les installations de production d'énergie planétaires."
  asteroid_manufactory_energy_trigger:0 "Nécessite le modificateur $giga_asteroid_industry_candidate_energy$"
  asteroid_manufactory_energy_placement:0 "- Doit être construit sur un astéroïde $asteroid_manufactory_icy$ avec un gisement d'£energy£ §Y$energy$§!"
  asteroid_manufactory_energy_effect:0 "- $mod_building_giga_asteroid_factory_energy_country_max$ : §G+1§!\n- $asteroid_manufactory_synergy$ Réduit les entretiens en £energy£ §Y$energy$§! de la planète"
  asteroid_manufactory_energy_upgrade:0 "£job_technician£ ['concept_giga_asteroid_industry_energy']"
  concept_giga_asteroid_industry_energy:0 "$asteroid_manufactory_energy$"
  concept_giga_asteroid_industry_energy_desc:0 "$asteroid_manufactory_subtitle$\n$asteroid_manufactory_energy_effect$"
  asteroid_manufactory_ai_energy:0 "$asteroid_manufactory_0$"
  asteroid_manufactory_platform_energy:0 "Chantier de construction de $asteroid_manufactory_energy$"
  asteroid_manufactory_platform_energy_DESC:0 "$asteroid_manufactory_0_DESC$"
  giga_asteroid_industry_candidate_energy:0 "$asteroid_manufactory_candidate$ : §Y$energy$§!"
  giga_asteroid_industry_candidate_energy_desc:0 "§TUn ['concept_giga_asteroid_industry_energy'] peut être construit ici§!\n\nL'eau dans cet astéroïde contient un pourcentage élevé de deutérium et de tritium, idéal pour les centrales à fusion de grand volume."
  
  asteroid_manufactory_food:0 "Station de récolte de glace"
  asteroid_manufactory_food_DESC:0 "Une installation pour séparer et stocker la glace traitée, adaptée à une utilisation dans l'agriculture à grande échelle, en particulier sur les mondes plus secs."
  asteroid_manufactory_food_trigger:0 "Nécessite le modificateur $giga_asteroid_industry_candidate_food$"
  asteroid_manufactory_food_placement:0 "- Doit être construit sur un astéroïde $asteroid_manufactory_icy$"
  asteroid_manufactory_food_effect:0 "- $mod_building_giga_asteroid_factory_food_country_max$ : §G+1§!\n- $asteroid_manufactory_synergy$ Améliore la production des £job_farmer£ $job_farmer$, réduit l'entretien en £food£ §Y$food$§! des £job_artisan£ $job_artisan$ ($civic_anglers$ uniquement)"
  asteroid_manufactory_food_upgrade:0 "£job_farmer£ ['concept_giga_asteroid_industry_food']"
  concept_giga_asteroid_industry_food:0 "$asteroid_manufactory_food$"
  concept_giga_asteroid_industry_food_desc:0 "$asteroid_manufactory_subtitle$§EConditions :§!\n- Disponible pour les empires utilisant de la £food£ §Y$food$§!\n\n§EEffets :§!\n$asteroid_manufactory_food_effect$"
  asteroid_manufactory_ai_food:0 "$asteroid_manufactory_0$"
  asteroid_manufactory_platform_food:0 "Chantier de construction de $asteroid_manufactory_food$"
  asteroid_manufactory_platform_food_DESC:0 "$asteroid_manufactory_0_DESC$"
  giga_asteroid_industry_candidate_food:0 "$asteroid_manufactory_candidate$ : §Y$food$§!"
  giga_asteroid_industry_candidate_food_desc:0 "§TUne ['concept_giga_asteroid_industry_food'] peut être construite ici§!\n\nD'énormes quantités de glace d'eau pure peuvent être trouvées dans cet astéroïde."
  
  asteroid_manufactory_supertensiles:0 "Fonderie de matériaux de mégaconstruction"
  asteroid_manufactory_supertensiles_DESC:0 "Une installation avancée de traitement des matériaux qui extrait les $giga_sr_amb_megaconstruction$ naturels et plusieurs minerais apparentés, les préparant pour un traitement ultérieur dans les installations de salles blanches planétaires."
  asteroid_manufactory_supertensiles_trigger:0 "Nécessite le modificateur $giga_asteroid_industry_candidate_supertensiles$"
  asteroid_manufactory_supertensiles_placement:0 "- Doit être construit sur un astéroïde $asteroid_manufactory_rocky$ ou $asteroid_manufactory_icy$ avec un gisement de £giga_sr_amb_megaconstruction£ §Y$giga_sr_amb_megaconstruction$§!"
  asteroid_manufactory_supertensiles_effect:0 "- $mod_building_giga_asteroid_factory_supertensiles_country_max$ : §G+1§!\n- $asteroid_manufactory_synergy$ Échange une partie de l'entretien en £unity£ §Y$unity$§! des £job_giga_megaengineer£ $job_giga_megaengineer$ contre de l'£energy£ §Y$energy$§!"
  asteroid_manufactory_supertensiles_upgrade:0 "£job_giga_megaengineer£ ['concept_giga_asteroid_industry_supertensiles']"
  concept_giga_asteroid_industry_supertensiles:0 "$asteroid_manufactory_supertensiles$"
  concept_giga_asteroid_industry_supertensiles_desc:0 "$asteroid_manufactory_subtitle$§EConditions :§!\n- L'option §YLimite de construction de mégastructure§! doit être réglée sur £job£§BBasée sur les emplois§!\n\n§EEffets :§!\n$asteroid_manufactory_supertensiles_effect$"
  asteroid_manufactory_ai_supertensiles:0 "$asteroid_manufactory_0$"
  asteroid_manufactory_platform_supertensiles:0 "Chantier de construction de $asteroid_manufactory_supertensiles$"
  asteroid_manufactory_platform_supertensiles_DESC:0 "$asteroid_manufactory_0_DESC$"
  giga_asteroid_industry_candidate_supertensiles:0 "$asteroid_manufactory_candidate$ : §Y$giga_sr_amb_megaconstruction$§!"
  giga_asteroid_industry_candidate_supertensiles_desc:0 "§TUne ['concept_giga_asteroid_industry_supertensiles'] peut être construite ici§!\n\nDes gisements naturels de $giga_sr_amb_megaconstruction$ peuvent être trouvés dans cet astéroïde, qui pourraient être extraits avec des opérations minières plus intensives."
  
  asteroid_manufactory_2:0 "Auto-usine d'astéroïde"
  asteroid_manufactory_2_DESC:0 "Une usine automatisée, qui extrait et raffine les matériaux d'un astéroïde pour produire des biens pour le marché de consommation."
  
  # Tech
  giga_tech_asteroid_manufactory:0 "Usines de fabrication d'astéroïde"
  giga_tech_asteroid_manufactory_desc:0 "En tant que restes de la formation de la plupart des systèmes solaires, les astéroïdes sont riches en ressources brutes facilement accessibles. De grandes structures construites autour d'eux, équipées de récolteurs spécialisés, pourraient être employées pour collecter régulièrement ces ressources et les expédier vers des usines planétaires pour traitement ou consommation."
  
  # Construction Site
  giga_asteroid_industry.001.name:0 "Chantier de construction industrielle d'astéroïde terminé !"
  giga_asteroid_industry.001.desc:0 "Le chantier de construction d'un futur site industriel est maintenant terminé dans le système [FromFrom.solar_system.GetName]. Flottant près d'un astéroïde, cette grande plateforme contient l'équipement nécessaire pour commencer la construction d'un grand complexe minier, qui peut être spécialisé pour produire toutes sortes de produits.\n\nUne question demeure : quel type d'installation devrions-nous construire ?"
  
  giga_asteroid_industry.001.alloys:0 "Une installation minière axée sur la production d'£alloys£ §Y$alloys$§!."
  giga_asteroid_industry.001.alloys.effect:0 "Ce site sera configuré pour construire un ['concept_giga_asteroid_industry_alloys']."
  
  giga_asteroid_industry.001.consumer_goods:0 "Une usine conçue pour fabriquer des pièces pour les £consumer_goods£ §Y$consumer_goods$§!."
  giga_asteroid_industry.001.consumer_goods.effect:0 "Ce site sera configuré pour construire une ['concept_giga_asteroid_industry_consumer_goods']."
  
  giga_asteroid_industry.001.energy:0 "Un dépôt de combustible pour les centrales électriques produisant de l'£energy£ §Y$energy$§!."
  giga_asteroid_industry.001.energy.effect:0 "Ce site sera configuré pour construire un ['concept_giga_asteroid_industry_energy']."
  
  giga_asteroid_industry.001.food:0 "Un processeur de glace pour irriguer les fermes et produire de la £food£ §Y$food$§!."
  giga_asteroid_industry.001.food.effect:0 "Ce site sera configuré pour construire une ['concept_giga_asteroid_industry_food']."
  
  giga_asteroid_industry.001.supertensiles:0 "Un extracteur pour les matériaux nécessaires aux £giga_sr_amb_megaconstruction£ §Y$giga_sr_amb_megaconstruction$§!."
  giga_asteroid_industry.001.supertensiles.effect:0 "Ce site sera configuré pour construire une ['concept_giga_asteroid_industry_supertensiles']."
  
  giga_asteroid_industry.003.name:0 "[FromFrom.GetName] terminé"
  giga_asteroid_industry.003.generic:0 "La construction a été achevée sur le [FromFrom.GetName] de [FromFrom.planet.GetName] dans le système [FromFrom.solar_system.GetName].\n\n"
  giga_asteroid_industry.003.alloys:0 "$giga_asteroid_industry.003.generic$Les barges de minerai font déjà la queue, prêtes à transporter les minerais précieux vers nos installations de fonderie planétaires.\n\nLes fonderies locales bénéficieront d'un traitement secondaire capable de réduire les déchets, au prix d'un entretien de transport supplémentaire."
  giga_asteroid_industry.003.consumer_goods:0 "$giga_asteroid_industry.003.generic$Cette usine colossale produira des composants génériques pour une grande variété de produits de consommation, la finition et l'assemblage final ayant lieu dans des dépôts planétaires.\n\nLes dépôts locaux bénéficieront d'importations plus ciblées, mais de coûts logistiques accrus."
  giga_asteroid_industry.003.energy:0 "$giga_asteroid_industry.003.generic$Extrayant de grandes quantités de combustible utile de la glace, cette installation stockera du combustible pour utilisation dans les installations génératrices planétaires.\n\nLes générateurs locaux bénéficieront d'une efficacité améliorée du réseau énergétique."
  giga_asteroid_industry.003.food:0 "$giga_asteroid_industry.003.generic$La glace extraite peut être utilisée pour soutenir des fermes incorporant des écosystèmes aquatiques, même sur les planètes les plus sèches.\n\nLes fermes locales bénéficieront d'une production améliorée et d'une infrastructure de recyclage des déchets."
  giga_asteroid_industry.003.supertensiles:0 "$giga_asteroid_industry.003.generic$Les matériaux extraits ici seront davantage raffinés et purifiés dans les installations de fonderie moléculaire planétaires avant utilisation dans d'autres projets de méga-ingénierie.\n\nLes installations locales bénéficieront d'un entretien bureaucratique réduit, mais de coûts logistiques accrus."
  
  desc_asteroid_manufactory:0 "Une installation de fabrication polyvalente construite autour d'un astéroïde. Fournit un choix de bâtiments d'usine qui fournissent des emplois, basé sur le type d'astéroïde utilisé et ses gisements."
  allow_asteroid_manufactory:0 "§HDébloque mégastructure :§! $name_asteroid_manufactory$"
  giga_asteroid_manufactory_1:0 "£menu_1£§H$name_asteroid_manufactory$§!"
  giga_asteroid_manufactory_2:0 "£menu_2£§Y$name_asteroid_manufactory$§!"
  giga_asteroid_manufactory_3:0 "£menu_3£§G$name_asteroid_manufactory$§!"
  giga_asteroid_manufactory_r:0 "£menu_r£§B$name_asteroid_manufactory$§!"
  giga_asteroid_manufactory_u:0 "£menu_u£§M$name_asteroid_manufactory$§!"
  giga_asteroid_manufactory_disabled:0 "£menu_disabled£§R$name_asteroid_manufactory$§!"
  
  giga_tech_repeatable_asteroid_manufactory_cap:0 "Protocoles de gestion de $name_asteroid_manufactory$"
  giga_tech_repeatable_asteroid_manufactory_cap_desc:0 "Des protocoles avancés de construction et de maintenance pour permettre la construction et la gestion de §Y$name_plural_asteroid_manufactory$§! supplémentaires dans les frontières de notre empire."
  giga_asteroid_manufactory_capacity_increase_title:0 "Capacité de §Y$name_asteroid_manufactory$§! : §G+1§!"
  giga_asteroid_manufactory_capacity_increase_desc:0 "La capacité de l'empire pour les §Y$name_plural_asteroid_manufactory$§! est augmentée de §G+1§!"
  
  # buildings
  building_giga_asteroid_factory_alloys:0 "Méga-fonderies approvisionnées par l'espace"
  building_giga_asteroid_factory_alloys_desc:0 "Les barges de minerai orbitales peinent à livrer l'approvisionnement sans fin de matériaux exigé par ces forges."
  building_giga_asteroid_factory_alloys_modifier:0 "Bâtiments ['building:building_giga_asteroid_factory_alloys'] max."
  building_giga_asteroid_factory_alloys_one_planet_modifier:0 "Autorise le bâtiment ['building:building_giga_asteroid_factory_alloys_one_planet'] et augmente son nombre d'emplois"
  mod_building_giga_asteroid_factory_alloys_country_max:0 "Bâtiments ['building:building_giga_asteroid_factory_alloys'] max."
  building_giga_asteroid_factory_alloys_one_planet:0 "$building_giga_asteroid_factory_alloys$"
  building_giga_asteroid_factory_alloys_one_planet_desc:0 "$building_giga_asteroid_factory_alloys_desc$"
  building_giga_asteroid_factory_alloys_one_planet_scaling:0 "\nLe nombre d'emplois évolue avec les kilostructures ['concept_giga_asteroid_industry_alloys'] supplémentaires."
  
  building_giga_asteroid_factory_consumer_goods:0 "Dépôt d'importations interstellaires"
  building_giga_asteroid_factory_consumer_goods_desc:0 "Usines d'assemblage final pour des pièces préfabriquées construites dans des installations spatiales, ces usines peuvent distribuer tout article personnel imaginable."
  building_giga_asteroid_factory_consumer_goods_modifier:0 "Bâtiments ['building:building_giga_asteroid_factory_consumer_goods'] max."
  building_giga_asteroid_factory_consumer_goods_one_planet_modifier:0 "Autorise le bâtiment ['building:building_giga_asteroid_factory_consumer_goods_one_planet'] et augmente son nombre d'emplois"
  mod_building_giga_asteroid_factory_consumer_goods_country_max:0 "Bâtiments ['building:building_giga_asteroid_factory_consumer_goods'] max."
  building_giga_asteroid_factory_consumer_goods_one_planet:0 "$building_giga_asteroid_factory_consumer_goods$"
  building_giga_asteroid_factory_consumer_goods_one_planet_desc:0 "$building_giga_asteroid_factory_consumer_goods_desc$"
  building_giga_asteroid_factory_consumer_goods_one_planet_scaling:0 "\nLe nombre d'emplois évolue avec les kilostructures ['concept_giga_asteroid_industry_consumer_goods'] supplémentaires."
  
  building_giga_asteroid_factory_energy:0 "Centrales à fusion en vrac"
  building_giga_asteroid_factory_energy_desc:0 "Ces gigantesques centrales électriques dépendent des importations pour alimenter leurs besoins élevés en combustible."
  building_giga_asteroid_factory_energy_modifier:0 "Bâtiments ['building:building_giga_asteroid_factory_energy'] max."
  building_giga_asteroid_factory_energy_one_planet_modifier:0 "Autorise le bâtiment ['building:building_giga_asteroid_factory_energy_one_planet'] et augmente son nombre d'emplois"
  mod_building_giga_asteroid_factory_energy_country_max:0 "Bâtiments ['building:building_giga_asteroid_factory_energy'] max."
  building_giga_asteroid_factory_energy_one_planet:0 "$building_giga_asteroid_factory_energy$"
  building_giga_asteroid_factory_energy_one_planet_desc:0 "$building_giga_asteroid_factory_energy_desc$"
  building_giga_asteroid_factory_energy_one_planet_scaling:0 "\nLe nombre d'emplois évolue avec les kilostructures ['concept_giga_asteroid_industry_energy'] supplémentaires."
  
  building_giga_asteroid_factory_food:0 "Méga-fermes aquaponiques"
  building_giga_asteroid_factory_food_desc:0 "Utilisant un mélange de lits de culture hydroponiques et de systèmes de recyclage de l'eau basés sur de la vie aquatique génétiquement modifiée, ces installations agricoles colossales peuvent fournir une quantité stupéfiante de matière végétale comestible."
  building_giga_asteroid_factory_food_effect:0 "\n£planet£ Cette planète compte comme §Yhumide§! en plus de son climat d'origine"
  building_giga_asteroid_factory_food_modifier:0 "Bâtiments ['building:building_giga_asteroid_factory_food'] max."
  building_giga_asteroid_factory_food_one_planet_modifier:0 "Autorise le bâtiment ['building:building_giga_asteroid_factory_food_one_planet'] et augmente son nombre d'emplois"
  mod_building_giga_asteroid_factory_food_country_max:0 "Bâtiments ['building:building_giga_asteroid_factory_food'] max."
  building_giga_asteroid_factory_food_one_planet:0 "$building_giga_asteroid_factory_food$"
  building_giga_asteroid_factory_food_one_planet_desc:0 "$building_giga_asteroid_factory_food_desc$"
  building_giga_asteroid_factory_food_one_planet_scaling:0 "\nLe nombre d'emplois évolue avec les kilostructures ['concept_giga_asteroid_industry_food'] supplémentaires."
  
  building_giga_asteroid_factory_supertensiles:0 "Usine d'assemblage de mégaconstruction"
