 building_giga_asteroid_factory_food_one_planet_scaling:99 "\nLe nombre d'emplois augmente avec chaque kilostructure ['concept_giga_asteroid_industry_food'] supplémentaire."

 building_giga_asteroid_factory_supertensiles:99 "Usine d'assemblage de mégaconstruction"
 building_giga_asteroid_factory_supertensiles_desc:99 "Des composés précurseurs supertensiles partiellement traités sont nettoyés et rectifiés dans les laboratoires au coeur de cette installation, prêts à être utilisés dans nos projets de mégaconstruction."
