 building_giga_asteroid_factory_energy_one_planet_scaling:99 "\nLe nombre d'emplois augmente avec chaque kilostructure ['concept_giga_asteroid_industry_energy'] supplémentaire."

 building_giga_asteroid_factory_food:99 "Mégafermes aquaponiques"
 building_giga_asteroid_factory_food_desc:99 "Combinant des bassins de culture hydroponique et des systèmes de recyclage de l'eau basés sur des organismes aquatiques génétiquement modifiés, ces colossales installations agricoles peuvent fournir une quantité stupéfiante de végétaux comestibles."
 building_giga_asteroid_factory_food_effect:99 "\n£planet£ Cette planète est considérée comme §GHumide§! en plus de son climat d'origine"
 building_giga_asteroid_factory_food_modifier:99 "Bâtiments ['building:building_giga_asteroid_factory_food'] max."
