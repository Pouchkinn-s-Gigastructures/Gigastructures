	frameworld_harvest_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_project$ - $giga_list_category_special$\nDémantèle tout astéroïde pour obtenir des matières premières afin d'étendre le §Y$pc_giga_frameworld$§!\n§LLa construction à grande échelle nécessite une acquisition de ressources à grande échelle.§!"
