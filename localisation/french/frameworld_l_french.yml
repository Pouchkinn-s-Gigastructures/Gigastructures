	giga_frameworld_penrose:99 "$d_frameworld_penrose$"
	giga_frameworld_penrose_effect:99 "Commence la construction d'une mégastructure à plusieurs étapes qui, une fois achevée, remplacera les §Y$district_giga_frameworld_generator_plural$§! du $pc_giga_frameworld$ par un nombre réduit de §Y$district_giga_frameworld_penrose_plural$§! considérablement plus puissants.\n\nLes §Y$district_giga_frameworld_penrose_plural$§! fournissent des £job_technician£§Yemplois [owner.GetTechnician]§! supplémentaires mais sont plus chers que les districts qu'ils remplacent.\n\n$frameworld_penrose_fake_tooltip$"
	giga_frameworld_penrose_desc:99 "Un grand miroir construit autour du $pc_black_hole$ du système, conçu pour exploiter la diffusion superradiante, générant de l'énergie avec une efficacité stupéfiante."

	giga_frameworld_decompressor:99 "$d_frameworld_decompressor$"
	giga_frameworld_decompressor_effect:99 "Commence la construction d'une mégastructure à plusieurs étapes qui, une fois achevée, remplacera les §Y$district_giga_frameworld_mining_plural$§! du $pc_giga_frameworld$ par un nombre réduit de §Y$district_giga_frameworld_decompressor_plural$§! considérablement plus puissants.\n\nLes §Y$district_giga_frameworld_decompressor_plural$§! fournissent des £job_miner£§Yemplois [owner.GetMiner]§! supplémentaires mais sont plus chers que les districts qu'ils remplacent."
	giga_frameworld_decompressor_desc:99 "Une installation de lentille gravitationnelle qui tord les champs gravitationnels en foreuses capables d'extraire de la matière du $pc_black_hole$."

	giga_frameworld_advanced_city:99 "Améliorer les sections d'habitation"
	giga_frameworld_advanced_city_effect:99 "Remplace les §Y$district_giga_frameworld_city_plural$§! du $pc_giga_frameworld$ par un nombre réduit de §Y$district_giga_frameworld_city_advanced_plural$§!\n\nLes §Y$district_giga_frameworld_city_advanced_plural$§! sont deux fois plus efficaces que les districts qu'ils remplacent.\n "
	giga_frameworld_advanced_hive_effect:99 "Remplace les §Y$district_giga_frameworld_hive_plural$§! du $pc_giga_frameworld$ par un nombre réduit de §Y$district_giga_frameworld_hive_advanced_plural$§!, et remplace deux emplois £job_maintenance_drone£§Y$job_maintenance_drone_plural$§! de chaque §Y$district_giga_frameworld_amenities_gestalt$§! par des £job_frame_maintenance_overseer£§Y$job_frame_maintenance_overseer_plural$§!\n\nLes §Y$district_giga_frameworld_hive_advanced_plural$§! sont deux fois plus efficaces que les districts qu'ils remplacent.\n$job_frame_maintenance_overseer_effect_desc$\n "
	giga_frameworld_advanced_nexus_effect:99 "Remplace les §Y$district_giga_frameworld_nexus_plural$§! du $pc_giga_frameworld$ par un nombre réduit de §Y$district_giga_frameworld_nexus_advanced_plural$§!, et remplace deux emplois £job_maintenance_drone£§Y$job_maintenance_drone_plural$§! de chaque §Y$district_giga_frameworld_amenities_gestalt$§! par des £job_frame_maintenance_overseer£§Y$job_frame_maintenance_overseer_plural$§!\n\nLes §Y$district_giga_frameworld_nexus_advanced_plural$§! sont deux fois plus efficaces que les districts qu'ils remplacent.\n$job_frame_maintenance_overseer_effect_desc$\n "
	giga_frameworld_advanced_city_desc:99 "Des conceptions améliorées pour les stations d'habitation et de stockage permettront une meilleure organisation des espaces de vie."

	giga_frameworld_advanced_industrial:99 "Étendre l'industrie lourde"
	giga_frameworld_advanced_industrial_foundry_effect:99 "Remplace les §Y$district_giga_frameworld_foundry_plural$§! du $pc_giga_frameworld$ par un nombre réduit de §Y$district_giga_frameworld_foundry_advanced_plural$§!.\n\nLes §Y$district_giga_frameworld_foundry_advanced_plural$§! fournissent 2 £job_fabricator£§Yemplois [owner.GetAlloyProducer]§! supplémentaires mais nécessitent des £volatile_motes£ §Y$volatile_motes$§! pour l'entretien."
	giga_frameworld_advanced_industrial_factory_effect:99 "Remplace les §Y$district_giga_frameworld_factory_plural$§! du $pc_giga_frameworld$ par un nombre réduit de §Y$district_giga_frameworld_factory_advanced_plural$§!.\n\nLes §Y$district_giga_frameworld_factory_advanced_plural$§! fournissent 2 [owner.GetArtisanIcon]§Yemplois [owner.GetArtisan]§! supplémentaires mais nécessitent des £rare_crystals£ §Y$rare_crystals$§! pour l'entretien."
	giga_frameworld_advanced_industrial_desc:99 "L'introduction de procédés industriels avancés utilisant des matériaux exotiques en conjonction avec des installations de fabrication étendues améliorera considérablement le débit."

	giga_frameworld_advanced_sanctuary:99 "Projet d'arcologie sanctuaire"
	giga_frameworld_advanced_sanctuary_effect:99 "Remplace les §Y$district_giga_frameworld_sanctuary_plural$§! du $pc_giga_frameworld$ par un nombre réduit de §Y$district_giga_frameworld_sanctuary_advanced_plural$§!.\n\nLes §Y$district_giga_frameworld_sanctuary_advanced_plural$§! peuvent accueillir deux fois plus de £job_bio_trophy£ §Y$job_bio_trophy_plural$§! que les districts qu'ils remplacent."
	giga_frameworld_advanced_sanctuary_desc:99 "Une réimagination stratégique de la satisfaction des besoins organiques et des installations de divertissement permettra une densité d'habitation bien supérieure sans sacrifier la fonctionnalité ni le confort."

	giga_frameworld_gaia:99 "Améliorer les systèmes de support environnemental"
	giga_frameworld_gaia_desc:99 "Des systèmes de contrôle climatique avancés, conçus pour fournir des environnements idéaux pour toutes les formes de vie organique."

	giga_frameworld_computing_complex:99 "Améliorer les installations de traitement de données"
	giga_frameworld_computing_complex_desc:99 "Des installations dédiées au stockage de données à haute densité et au traitement accéléré de l'information amélioreront considérablement notre capacité de recherche."

	giga_frameworld_expand_infrastructure:99 "Étendre l'infrastructure de la station"
	giga_frameworld_expand_infrastructure_desc:99 "Améliorer le débit des installations de fabrication et de maintenance de la station nous permettra de supporter un plus grand nombre de modules."

