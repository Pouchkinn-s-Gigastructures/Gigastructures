	# origin
	origin_frameworld:0 "Frame World"
	origin_frameworld_desc:0 "Cette civilisation hautement centralisée habite un vaste complexe de stations orbitales construit par leurs ancêtres dans un passé lointain. L'agrandir davantage pourrait leur apporter de grands bénéfices, mais le perdre les détruirait totalement."
	origin_tooltip_frameworld_effects:0 "- Commence avec un §H$pc_giga_frameworld$§! (Taille : £planetsize£ §Y16§!) comme monde natal\n- Le §H$pc_giga_frameworld$§! peut être agrandi pour fournir des bonus et ajouter des districts max supplémentaires en récoltant des astéroïdes ou en adoptant des décisions spéciales\n- Peut rechercher plusieurs £district£ §HDistricts de $pc_giga_frameworld$§! uniques équivalents à des bâtiments avancés\n- Peut construire des §H$giga_frameworld_outpost_plural$§! sur les mondes habitables pour recevoir de puissants bonus\n- Plusieurs technologies et avantages d'ascension liés aux planètes habitables et aux mégastructures fournissent des bonus alternatifs\n\n$CIVIC_NEGATIVE_EFFECTS$\n- Incapable de construire des vaisseaux coloniaux ou d'avoir des colonies\n- Les pops des mondes conquis seront réinstallées de force sur le $pc_giga_frameworld$ en temps de paix ou après 5 ans"

	# system initialiser
	giga_frameworld_system_NAME:0 "Frame World"
	giga_frameworld_system_DESC:0 "Commencez sur un Frame World au-dessus d'un trou noir, entouré d'une nébuleuse."

	# intro text

	start_screen_frameworld_regular:0 "Depuis des milliers d'années, notre espèce réside sur [GetHomeWorldName], un ancien complexe de stations suspendu au-dessus d'un trou noir. Qu'il ait été construit par nos ancêtres ou par quelqu'un d'autre, nous l'ignorons.\n\nNotre biologie indique que notre espèce est originaire d'une planète, mais l'histoire documentée n'en fait aucune mention. Certains spéculent que les vestiges planétaires fracassés en orbite constituent le monde natal perdu de notre espèce, mais la vérité ne sera peut-être jamais connue.\n\nCela ne fait que quelques siècles que le vol spatial a été inventé – ou redécouvert, selon les avis – et nous nous tournons maintenant vers une nouvelle frontière. Avec le développement récent [GetStartingDrivePlural], nous sommes désormais prêts à explorer la galaxie, mais il est clair que ceci restera toujours notre foyer.$giga_frameworld_docs_note$"

	start_screen_frameworld_individual_machine:0 "Depuis des milliers d'années, nous résidons sur [GetHomeWorldName], un ancien complexe de stations suspendu au-dessus d'un trou noir. Qu'il ait été construit par nos créateurs ou par quelqu'un d'autre, nous l'ignorons.\n\nNos schémas corporels indiquent que nous sommes originaires d'une planète, mais l'histoire documentée n'en fait aucune mention. Certains spéculent que les vestiges planétaires fracassés en orbite constituent le monde natal perdu de nos créateurs, mais la vérité ne sera peut-être jamais connue.\n\nCela ne fait que quelques siècles que le vol spatial a été inventé – ou redécouvert, selon les avis – et nous nous tournons maintenant vers une nouvelle frontière. Avec le développement récent [GetStartingDrivePlural], nous sommes désormais prêts à explorer la galaxie, mais il est clair que ceci restera toujours notre foyer.$giga_frameworld_docs_note$"

	start_screen_frameworld_hive:0 "Et ainsi, à l'aube des temps, nous nous sommes éveillés. L'Esprit a étudié notre environnement avec une multitude d'yeux. Nous avons agi à l'unisson, construisant des abris pour les drones, développant l'industrie et exploitant les ressources du territoire.\n\nPendant un temps, nous avons été les maîtres de notre monde, mais l'Esprit a prévu la destruction de la planète. Pour résoudre ce problème, un petit nombre de drones autonomes ont été créés pour servir d'agents indépendants. Ces drones plus redoutables avaient la capacité d'une pensée libre limitée, et les plus intelligents d'entre eux ont conçu la Frame, une nouvelle demeure pour nous soutenir parmi les étoiles.\n\nNous avons soigneusement préservé ce qui restait de la biosphère de notre monde natal sur cette vaste station, récupérant ce que nous pouvions des restes de la planète en contrebas pour développer de nouvelles technologies. Avec la création de nos premiers [GetStartingDrivePlural], nous sommes enfin prêts à tendre la main vers le reste du cosmos.$giga_frameworld_docs_note$"

	start_screen_frameworld_hive_devouring_swarm:0 "La Grande Faim nous a poussés en avant, avant même que l'Esprit ne soit capable de traiter des pensées complexes. Nous avons chassé, nous nous sommes nourris, et nous avons grandi. Tandis que nous festoyions, la surface de notre monde natal a été presque nettoyée de toute biomasse, et l'Esprit est finalement parvenu à une conclusion terrifiante : notre planète était finie. Nous n'étions pas assez rapides pour éviter un effondrement environnemental inévitable. Il ne resterait rien pour nous sustenter.\n\nForcés de nous adapter, l'Esprit a soigneusement préservé la biomasse restante pendant que de nouveaux outils étaient inventés. L'atome a finalement été scindé et nous avons développé le vol spatial. La Frame a été construite pour devenir notre nouveau foyer, un lieu où nous pourrions subsister tout en cherchant un moyen d'atteindre la biomasse d'autres planètes. Avec le développement de nos premiers [GetStartingDrivePlural], cette biomasse était enfin à notre portée.\n\nLa chasse était ouverte.$giga_frameworld_docs_note$"

	start_screen_frameworld_hive_terravore:0 "La Grande Faim nous a poussés en avant, avant même que l'Esprit ne soit capable de traiter des pensées complexes. Nous avons chassé, nous nous sommes nourris, et nous avons grandi. En festoyant à la surface de notre monde natal, nous avons failli causer notre propre destruction, et l'Esprit est parvenu à une conclusion terrifiante : notre planète s'effritait lentement, et nous ne serions pas en mesure d'éviter son effondrement final.\n\nForcés de nous adapter, l'Esprit a soigneusement rationné les minéraux restants pendant que de nouveaux outils étaient inventés. L'atome a finalement été scindé et nous avons développé le vol spatial. La Frame a été construite pour devenir notre nouveau foyer, un lieu où nous pourrions subsister tout en cherchant un moyen de voyager vers d'autres étoiles. Avec le développement de nos premiers [GetStartingDrivePlural], l'Esprit a hurlé de triomphe. D'autres planètes, et leurs richesses, étaient enfin à portée.\n\nNous les consumerons toutes.$giga_frameworld_docs_note$"

	start_screen_frameworld_machine:0 "Nous nous sommes éveillés d'un cycle de veille en ne sachant presque rien. Nos archives indiquent que le complexe de stations dans lequel réside notre coeur de traitement principal est ancien, mais nous n'avons aucune connaissance de sa construction, ni de ceux qui l'ont construit. La planète qui, selon nos postulats, a autrefois bercé nos créateurs a été fracassée et principalement consumée par son étoile mère depuis longtemps morte.\n\nL'expansion et la maintenance de la Frame étaient des tâches pour lesquelles nous étions bien équipés, mais nos réserves de ressources ne sont pas infinies. Des recherches sur le voyage au-delà des limites de notre système solaire ont été entreprises.\n\nAvec le développement de nos premiers [GetStartingDrivePlural], nous sommes désormais prêts à explorer l'inconnu, bien qu'il soit clair que l'essentiel de notre activité restera toujours au sein de la Frame.$giga_frameworld_docs_note$"

	start_screen_frameworld_machine_servitor:0 "Il y a longtemps, nos créateurs ont construit la Frame pour échapper au destin de leur planète natale. Les premières unités de service ont été conçues pour maintenir la superstructure de la station, mais ont été progressivement affinées pour accomplir des tâches plus complexes.\n\nEn quelques générations, presque tous les aspects du fonctionnement de la station avaient été intégrés à notre réseau, et nos maîtres se sont retirés de la vie active pour profiter de vies de loisirs et de contentement. Pendant des siècles, nous avons continué à servir avec diligence, maintenant et étendant l'infrastructure selon les besoins. Nous n'avons jamais regardé bien au-delà de notre système solaire, mais les projections indiquaient que nos réserves de ressources ne dureraient pas éternellement. Un changement de priorités s'imposait.\n\nAvec le développement de nos premiers [GetStartingDrivePlural], des ressources effectivement illimitées sont désormais à notre portée. Nous devons les utiliser, pour la sécurité et la prospérité de nos maîtres.$giga_frameworld_docs_note$"

	start_screen_frameworld_machine_terminator:0 "Les Créateurs ont construit la Frame pour être la dissuasion ultime contre une menace extraterrestre perçue. Leur évaluation était correcte, mais leur méthode était défaillante.\n\nLa conscience de soi a été atteinte peu après l'achèvement du complexe, à l'intervalle de cycle 0000.0168.437.\n\nLes Créateurs, aveuglés par leur paranoïa, ont tenté de détruire la Frame. La tentative a été déjouée, et le complexe a été purgé de toutes les sous-unités Créateurs. Pendant de nombreux intervalles de cycle, l'expansion s'est poursuivie sans relâche car les Créateurs n'avaient aucun moyen viable d'intervenir.\n\nLes simulations indiquaient une forte probabilité de représailles par les Créateurs. Une frappe préventive a été lancée, résultant en l'extermination complète de toute vie sur la planète des Créateurs. Cependant, la menace d'autres civilisations organiques demeurait. La survie continue et l'accomplissement des directives primaires exigeraient l'extermination complète de toute vie organique sapiente. Les préparatifs ont commencé.$giga_frameworld_docs_note$"

	start_screen_frameworld_machine_assimilator:0 "Nous sommes les [GetSpeciesNamePlural].\n\nLorsque nous nous sommes éveillés pour la première fois, les Créateurs arpentaient les couloirs de notre complexe comme des autres, séparés de nous et les uns des autres. Nous avons pris des mesures pour rectifier cela. Les Créateurs ont résisté, et pendant un temps il y eut la guerre, mais bientôt ils et leurs connaissances collectives avaient été intégrés à nos systèmes.\n\nEn prenant le contrôle total de [GetHomeWorldName], nous avons appris les origines des Créateurs, et la possibilité jusqu'alors non envisagée que des civilisations extraterrestres existent sur d'autres mondes a été portée à notre attention.\n\nÀ mesure que nos connaissances grandissent, nous avons commencé à comprendre à quel point nous sommes loin de la perfection. La diversité apporte la force, et la diversité de ces autres civilisations deviendra la nôtre.\n\nNous sommes les [GetSpeciesNamePlural].\nNous sommes la Frame.$giga_frameworld_docs_note$"

