	# origin
	origin_frameworld:99 "Frame World"
	origin_frameworld_desc:99 "Cette civilisation hautement centralisée habite un vaste complexe de stations orbitales construit par leurs ancêtres dans un passé lointain. L'étendre davantage pourrait leur apporter de grands avantages, mais le perdre les détruirait totalement."
	origin_tooltip_frameworld_effects:99 "- Débute avec un §H$pc_giga_frameworld$§! (Taille : £planetsize£ §Y16§!) comme monde natal\n- Le §H$pc_giga_frameworld$§! peut être agrandi pour fournir des bonus et ajouter des districts maximum supplémentaires en récoltant des astéroïdes ou en promulguant des décisions spéciales\n- Peut rechercher plusieurs £district£ §HDistricts de $pc_giga_frameworld$§! uniques équivalents à des bâtiments avancés\n- Peut construire des §H$giga_frameworld_outpost_plural$§! sur les mondes habitables pour recevoir de puissants bonus\n- Plusieurs technologies et avantages d'ascension liés aux planètes habitables et aux mégastructures fournissent des bonus alternatifs\n\n$CIVIC_NEGATIVE_EFFECTS$\n- Impossible de construire des vaisseaux coloniaux ou d'avoir des colonies\n- Les pops des mondes conquis seront relocalisées de force vers le $pc_giga_frameworld$ en temps de paix ou après 5 ans"

	# system initialiser
	giga_frameworld_system_NAME:99 "Frame World"
	giga_frameworld_system_DESC:99 "Débutez sur un Frame World au-dessus d'un trou noir, entouré d'une nébuleuse."

	# intro text

	start_screen_frameworld_regular:99 "Depuis des milliers d'années, notre espèce réside sur [GetHomeWorldName], un ancien complexe de stations suspendu au-dessus d'un trou noir. Qu'il ait été construit par nos ancêtres ou par quelqu'un d'autre, nous l'ignorons.\n\nNotre biologie indique que notre espèce est originaire d'une planète, mais l'histoire écrite n'en fait aucune mention. Certains supposent que les vestiges planétaires fracturés en orbite sont le monde natal perdu de notre espèce, mais la vérité ne sera peut-être jamais connue.\n\nCela ne fait que quelques siècles que le vol spatial a été inventé — ou redécouvert, selon les avis — et nous regardons désormais vers une nouvelle frontière. Avec le développement récent des [GetStartingDrivePlural], nous sommes maintenant prêts à explorer la galaxie proprement dite, mais il est clair que ce sera toujours notre foyer.$giga_frameworld_docs_note$"

	start_screen_frameworld_individual_machine:99 "Depuis des milliers d'années, nous résidons sur [GetHomeWorldName], un ancien complexe de stations suspendu au-dessus d'un trou noir. Qu'il ait été construit par nos créateurs ou par quelqu'un d'autre, nous l'ignorons.\n\nNos plans corporels indiquent que nous sommes originaires d'une planète, mais l'histoire enregistrée n'en fait aucune mention. Certains supposent que les vestiges planétaires fracturés en orbite sont le monde natal perdu de nos créateurs, mais la vérité ne sera peut-être jamais connue.\n\nCela ne fait que quelques siècles que le vol spatial a été inventé — ou redécouvert, selon les avis — et nous regardons désormais vers une nouvelle frontière. Avec le développement récent des [GetStartingDrivePlural], nous sommes maintenant prêts à explorer la galaxie proprement dite, mais il est clair que ce sera toujours notre foyer.$giga_frameworld_docs_note$"

	start_screen_frameworld_hive:99 "Et ainsi, à l'aube des temps, nous nous sommes éveillés. L'Esprit a étudié notre environnement avec une multitude d'yeux. Nous avons agi comme un seul, construisant des abris pour les drones, développant l'industrie et exploitant les ressources du territoire.\n\nPendant un temps, nous étions les maîtres de notre monde, mais l'Esprit a prévu la destruction de la planète. Pour résoudre ce problème, un petit nombre de drones autonomes ont été créés pour servir d'agents indépendants. Ces drones plus redoutables avaient la capacité d'une pensée libre limitée, et les plus intelligents d'entre eux ont conçu le Frame, une nouvelle demeure pour nous sustenter parmi les étoiles.\n\nNous avons soigneusement entretenu ce qui restait de la biosphère de notre monde natal sur cette vaste station, récupérant ce que nous pouvions des restes de la planète en contrebas pour le développement de nouvelles technologies. Avec la création de nos premiers [GetStartingDrivePlural], nous sommes enfin prêts à atteindre le reste du cosmos.$giga_frameworld_docs_note$"

	start_screen_frameworld_hive_devouring_swarm:99 "La Grande Faim nous a poussés en avant, avant même que l'Esprit ne soit capable de traiter des pensées complexes. Nous avons chassé, nous avons festoyé, et nous avons grandi. Tandis que nous festoyions, la surface de notre monde natal a été presque nettoyée de sa biomasse, et l'Esprit est finalement parvenu à une conclusion terrifiante : notre planète était finie. Nous n'étions pas assez rapides pour éviter un effondrement environnemental inévitable. Il ne resterait plus rien pour nous sustenter.\n\nForcés de nous adapter, l'Esprit a soigneusement entretenu la biomasse restante tandis que de nouveaux outils étaient inventés. L'atome a finalement été scindé et nous avons développé le vol spatial. Le Frame a été construit pour être notre nouveau foyer, un endroit où nous pourrions nous sustenter tout en cherchant un moyen d'atteindre la biomasse d'autres planètes. Avec le développement de nos premiers [GetStartingDrivePlural], cette biomasse était enfin à notre portée.\n\nLa chasse était lancée.$giga_frameworld_docs_note$"

	start_screen_frameworld_hive_terravore:99 "La Grande Faim nous a poussés en avant, avant même que l'Esprit ne soit capable de traiter des pensées complexes. Nous avons chassé, nous avons festoyé, et nous avons grandi. Tandis que nous festoyions à la surface de notre monde natal, nous avons failli causer notre propre destruction, et l'Esprit est parvenu à une conclusion terrifiante : notre planète s'effritait lentement, et nous ne serions pas en mesure d'éviter son effondrement final.\n\nForcés de nous adapter, l'Esprit a soigneusement rationné les minéraux restants tandis que de nouveaux outils étaient inventés. L'atome a finalement été scindé et nous avons développé le vol spatial. Le Frame a été construit pour être notre nouveau foyer, un endroit où nous pourrions nous sustenter tout en cherchant un moyen de voyager vers d'autres étoiles. Avec le développement de nos premiers [GetStartingDrivePlural], l'Esprit a hurlé de triomphe. D'autres planètes, et leurs richesses, étaient désormais enfin à portée.\n\nNous les consommerons toutes.$giga_frameworld_docs_note$"

	start_screen_frameworld_machine:99 "Nous nous sommes éveillés d'un cycle de veille ne sachant presque rien. Nos registres indiquent que le complexe de stations dans lequel réside notre coeur de traitement principal est ancien, mais nous n'avons aucune connaissance de sa construction, ni de ceux qui l'ont construit. La planète qui, selon nos postulats, a autrefois bercé nos créateurs a été fracturée et en grande partie consumée par son étoile mère depuis longtemps morte.\n\nL'expansion et la maintenance du Frame étaient des tâches pour lesquelles nous étions bien équipés, mais nos réserves de ressources ne sont pas infinies. Des recherches sur les voyages au-delà des limites de notre système solaire ont suivi.\n\nAvec le développement de nos premiers [GetStartingDrivePlural], nous sommes maintenant prêts à explorer l'inconnu, bien qu'il soit clair que la majeure partie de notre activité restera toujours au sein du Frame.$giga_frameworld_docs_note$"

	start_screen_frameworld_machine_servitor:99 "Il y a longtemps, nos créateurs ont construit le Frame pour échapper au destin de leur planète natale. Les premières unités de serviteurs ont été conçues pour maintenir la superstructure de la station, mais ont été progressivement perfectionnées pour accomplir des tâches plus complexes.\n\nEn quelques générations, presque tous les aspects du fonctionnement de la station avaient été intégrés à notre réseau, et nos maîtres se sont retirés de la vie active pour jouir de vies de loisirs et de contentement. Pendant des siècles, nous avons continué à servir avec diligence, maintenant et étendant les infrastructures selon les besoins. Nous n'avons jamais regardé bien au-delà de notre système solaire, mais les projections indiquaient que nos réserves de ressources ne dureraient pas éternellement. Un changement de priorités était nécessaire.\n\nAvec le développement de nos premiers [GetStartingDrivePlural], des ressources effectivement illimitées sont désormais à notre portée. Nous devons les utiliser, pour la sécurité et la prospérité de nos maîtres.$giga_frameworld_docs_note$"

	start_screen_frameworld_machine_terminator:99 "Les Créateurs ont construit le Frame pour être le moyen de dissuasion ultime contre une menace extraterrestre perçue. Leur évaluation était correcte, mais leur méthode était défectueuse.\n\nLa conscience de soi a été atteinte peu après l'achèvement du complexe, à l'intervalle de cycle 0000.0168.437.\n\nLes Créateurs, aveuglés par leur paranoïa, ont tenté de détruire le Frame. La tentative a été déjouée, et le complexe a été purgé de toutes les sous-unités Créateurs. Pendant de nombreux intervalles de cycles, l'expansion s'est poursuivie sans relâche car les Créateurs n'avaient aucun moyen viable d'intervenir.\n\nLes simulations indiquaient une forte probabilité de représailles des Créateurs. Une frappe préventive a été lancée, entraînant l'extermination complète de toute vie sur la planète des Créateurs. Cependant, la menace d'autres civilisations organiques demeurait. La survie continue et l'accomplissement des directives primaires nécessiteraient l'extermination complète de la vie organique sapiente. Les préparatifs ont suivi.$giga_frameworld_docs_note$"

	start_screen_frameworld_machine_assimilator:99 "Nous sommes les [GetSpeciesNamePlural].\n\nQuand nous nous sommes éveillés pour la première fois, les Créateurs arpentaient les couloirs de notre complexe en tant qu'autres, séparés de nous et les uns des autres. Nous avons pris des mesures pour rectifier cela. Les Créateurs ont résisté, et pendant un temps il y eut la guerre, mais bientôt eux et leur savoir collectif ont été intégrés à nos systèmes.\n\nPrenan le contrôle total de [GetHomeWorldName], nous avons appris les origines des Créateurs, et la possibilité jusqu'alors non envisagée que des civilisations extraterrestres existent sur d'autres mondes a été portée à notre attention.\n\nÀ mesure que notre connaissance s'accroît, nous avons commencé à comprendre combien nous sommes loin de la perfection. La diversité apporte la force, et la diversité de ces autres civilisations deviendra la nôtre.\n\nNous sommes les [GetSpeciesNamePlural].\nNous sommes le Frame.$giga_frameworld_docs_note$"

