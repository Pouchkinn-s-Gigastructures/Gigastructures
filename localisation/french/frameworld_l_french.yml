	##############
	### Events ###
	##############

	# First planetary outpost notification
	giga_frameworld_origin.107.name:99 "La première expédition [Root.GetSpeciesName]"
	giga_frameworld_origin.107.desc:99 "Nos équipes de construction ont achevé l'assemblage de la station d'avant-poste au-dessus de §Y[From.GetName]§!. Depuis ce point de staging, une expédition a été lancée pour explorer systématiquement la surface en contrebas.\n\nBien que notre influence soit limitée si loin de §Y[Root.GetHomeWorldName]§!, l'expédition sera tout de même capable d'exploiter toutes les ressources utiles trouvées pendant l'exploration.\n\nNotre emprise sur ce monde ne sera jamais aussi complète que notre maîtrise du Frame, mais c'est un premier pas important dans notre prise de place parmi les étoiles."
	giga_frameworld_origin.107.desc.hive:99 "Nos équipes de construction ont achevé l'assemblage de la station relais planétaire au-dessus de §Y[From.GetName]§!. Depuis ce point de staging, une expédition a été lancée pour explorer systématiquement la surface en contrebas.\n\nBien que notre influence soit limitée si loin de §Y[Root.GetHomeWorldName]§!, l'expédition sera tout de même capable d'exploiter toutes les ressources utiles trouvées pendant l'exploration.\n\nNotre emprise sur ce monde ne sera jamais aussi complète que notre maîtrise du Frame, mais c'est un premier pas important dans notre prise de place parmi les étoiles."
	giga_frameworld_origin.107.desc.machine:99 "Nos unités de construction ont achevé l'assemblage de la station relais planétaire au-dessus de §Y[From.GetName]§!. Depuis ce point de staging, une expédition a été lancée pour explorer systématiquement la surface en contrebas.\n\nBien que notre influence soit limitée si loin de §Y[Root.GetHomeWorldName]§!, l'expédition sera tout de même capable d'exploiter toutes les ressources utiles trouvées pendant l'exploration.\n\nNotre emprise sur ce monde ne sera jamais aussi complète que notre maîtrise du Frame, mais c'est un premier pas important dans notre prise de place parmi les étoiles."
	giga_frameworld_origin.107.a:99 "Un grand jour pour les [Root.GetName] !"

	# Baol life-seeding alternative text
	giga_frameworld_origin.500.desc.first:99 "Nos spécialistes environnementaux sont heureux de rapporter que le processus d'ensemencement sur [Root.GetName] est terminé ! Les nouveaux hybrides végétaux créés en laboratoire, fabriqués à partir de segments soigneusement sélectionnés du code génétique §YBaol§! récoltés sur le corps du dernier §YBaol§!, ont été déployés avec succès dans le cadre d'une expansion plus large des systèmes de support environnemental.\n\nL'administration rapporte également qu'un certain nombre d'extraterrestres sapients, incroyablement similaires aux anciens §YBaol§!, sont apparus sur [Root.GetName] !\n\nBien qu'ils ne soient pas membres d'un esprit de ruche, ces extraterrestres §GNu-Baol§! semblent aussi pacifiques que leurs ancêtres. D'une manière ou d'une autre, nous devrons aborder leur présence sur [Root.GetName]."
	giga_frameworld_origin.500.desc:99 "Nos spécialistes environnementaux sont heureux de rapporter que le processus d'ensemencement sur [Root.GetName] est terminé ! Une fois de plus, plusieurs populations §GNu-Baol§! sont apparues, grâce à notre déploiement d'hybrides végétaux créés en laboratoire, contenant des segments soigneusement sélectionnés du code génétique §YBaol§!."

	# Penrose notifications

	giga_frameworld_origin.001.name:99 "Armature de la $name_penrose$ construite"
	giga_frameworld_origin.001.desc:99 "L'armature d'une future $name_penrose$ a été construite autour de [giga_system.star.GetName]. Cette armature squelettique accueillera un jour d'immenses miroirs, construits avec les matériaux les plus réfléchissants que nous puissions imaginer. Une fois que nous aurons fini de construire ces miroirs et les systèmes d'injection et de capture de particules qui les accompagnent, nous pourrons commencer à récolter l'énergie rotationnelle du $pc_black_hole$."
	giga_frameworld_origin.001.a:99 "Merveilleux."

	giga_frameworld_origin.002.name:99 "$name_penrose$ partielle construite"
	giga_frameworld_origin.002.desc:99 "La moitié des miroirs gigantesques ont maintenant été installés sur l'armature entourant [giga_system.star.GetName], et les injecteurs de particules sont partiellement terminés. Des travaux supplémentaires sont nécessaires pour terminer la structure avant que nous puissions en faire bon usage."
	giga_frameworld_origin.002.a:99 "Excellent."

	giga_frameworld_origin.003.name:99 "$name_penrose$ intégrée terminée"
	giga_frameworld_origin.003.desc:99 "Avec l'installation des derniers panneaux miroirs, [giga_system.star.GetName] est maintenant entièrement encerclée. Nous pouvons maintenant commencer à récolter l'énergie rotationnelle du $pc_black_hole$."
	giga_frameworld_origin.003.a:99 "Magnifique !"

	# Decompressor notifications

	giga_frameworld_origin.004.name:99 "Supports structurels du $matter_decompressor_4$ construits"
	giga_frameworld_origin.004.desc:99 "Pour extraire de la matière de [giga_system.star.GetName], nous devons d'abord avoir une base sécurisée pour construire l'installation. Des entretoises d'ancrage ont été construites depuis la superstructure du $pc_giga_frameworld$ vers une région au-dessus de l'horizon des événements de [giga_system.star.GetName], où un immense anneau de traitement supportera éventuellement l'appareil de forage gravitationnel."
	giga_frameworld_origin.004.a:99 "Merveilleux."

	giga_frameworld_origin.005.name:99 "Anneau de traitement du $matter_decompressor_4$ construit"
	giga_frameworld_origin.005.desc:99 "Construit sur les supports structurels existants, cet anneau de traitement abrite d'immenses raffineries et fonderies qui convertiront la matière extraite de [giga_system.star.GetName] en minéraux utilisables. Il ne reste plus qu'à monter l'appareil de décompression, qui utilisera des zones focalisées de gravité tordue pour créer de vastes foreuses dont les perçages sont faits de force gravitationnelle redirigée et concentrée."
	giga_frameworld_origin.005.a:99 "Excellent."

	giga_frameworld_origin.006.name:99 "$matter_decompressor_4$ intégré terminé"
	giga_frameworld_origin.006.desc:99 "Avec l'achèvement du réseau de foreuses gravitationnelles, le $matter_decompressor_4$ au-dessus de [giga_system.star.GetName] est maintenant complet, nous donnant un accès sans précédent à la matière que l'on croyait auparavant piégée à jamais dans son horizon des événements. Nous pouvons maintenant commencer à récolter des minéraux directement de [giga_system.star.GetName]."
	giga_frameworld_origin.006.a:99 "Magnifique !"

	giga_frameworld_origin.007.name:99 "Expansion de la section d'habitation terminée"
	giga_frameworld_origin.007.desc:99 "La refonte et l'expansion de nos zones urbaines sur [giga_planet.GetName] sont terminées. La nouvelle conception, plus encapsulée, permet à un plus grand nombre de personnes d'habiter confortablement un seul module de station, avec un accès pratique aux espaces de travail et aux commodités locales.\n\nNos zones d'habitation sont maintenant vraiment des villes à part entière, laissant l'espace précédemment occupé par l'équipement de support externe disponible pour de nouvelles constructions."
	giga_frameworld_origin.007.desc.hive:99 "La refonte et l'expansion de nos noeuds de ruche sur [giga_planet.GetName] sont terminées. La nouvelle conception, plus encapsulée, permet une meilleure distribution des drones de maintenance parmi la population en convalescence, réduisant les temps de déplacement et améliorant la délégation des tâches locales.\n\nLes efficacités gagnées par le partage des installations libèrent l'espace précédemment utilisé par les systèmes de maintenance dédiés pour de nouvelles constructions."
	giga_frameworld_origin.007.desc.machine:99 "La refonte et l'expansion de nos zones d'habitation de drones sur [giga_planet.GetName] sont terminées. La nouvelle conception, plus encapsulée, permet une intégration plus étroite de la maintenance des drones dans les installations de stockage, réduisant les frais généraux de déplacement et diminuant l'espace global utilisé.\n\nLes efficacités gagnées dans les systèmes de support permettent de libérer l'espace précédemment utilisé par les systèmes secondaires pour de nouvelles constructions."
	giga_frameworld_origin.007.a:99 "La station doit grandir."

	giga_frameworld_origin.008.name:99 "L'industrie lourde rénovée entre en service"
	giga_frameworld_origin.008.desc:99 "Les fonderies et les usines sur [giga_planet.GetName] bourdonnent d'activité suite à l'achèvement de notre projet de rénovation industrielle.\n\nLes méthodes industrielles modernes permettent un niveau de productivité supérieur, condensant l'équipement qui occupait autrefois d'immenses régions de [giga_planet.GetName] en stations hub compactes et efficaces. L'espace économisé par cette refonte peut maintenant être utilisé pour d'autres modules de station, ou simplement pour encore plus d'usines."
	giga_frameworld_origin.008.a:99 "Les prévisions de productivité sont à la hausse."

	giga_frameworld_origin.009.name:99 "Mise à niveau des installations du sanctuaire terminée"
	giga_frameworld_origin.009.desc:99 "Suite à une longue période de réorganisation, les nouvelles installations de satisfaction des besoins organiques sur [giga_planet.GetName] sont maintenant opérationnelles. Les organiques dont nous avons la charge ne remarqueront aucune perturbation, leurs vies laissées intactes mais enrichies par les systèmes améliorés.\n\nLes zones abritant auparavant des systèmes de maintenance peuvent maintenant être reconverties pour accueillir une population encore plus grande, ou pour d'autres fins entièrement."
	giga_frameworld_origin.009.a:99 "Le travail n'est jamais terminé."

	giga_frameworld_origin.010.name:99 "Systèmes de support environnemental améliorés"
	giga_frameworld_origin.010.desc:99 "Nous avons terminé la rénovation des systèmes de contrôle environnemental et de traitement atmosphérique sur [giga_planet.GetName]. Nos citoyens peuvent maintenant profiter d'une large gamme d'environnements planétaires simulés, adaptés à toutes les espèces. Le contrôle plus fin du traitement de l'eau et de l'éclairage permettra également une production alimentaire beaucoup plus efficace, avec une réduction correspondante des besoins en main-d'oeuvre.\n\nUn nouveau jour se lève pour les [giga_planet.owner.GetName], et l'air est vif."
	giga_frameworld_origin.010.a:99 "Rafraîchissant !"
	giga_frameworld_origin.010.desc.servitor:99 "Nous avons terminé la rénovation des systèmes de contrôle environnemental et de traitement atmosphérique sur [giga_planet.GetName]. Les organiques dont nous avons la charge peuvent maintenant profiter d'une large gamme d'environnements planétaires simulés, adaptés à toutes les espèces. Le contrôle plus fin du traitement de l'eau et de l'éclairage permettra également une production alimentaire beaucoup plus efficace, permettant de satisfaire une gamme plus diversifiée de besoins alimentaires organiques.\n\nUn nouveau jour se lève pour les [giga_planet.owner.GetName], et l'air est vif."
	giga_frameworld_origin.010.a.servitor:99 "Rien n'est trop beau pour nos protégés."
	giga_frameworld_origin.010.desc.assimilator:99 "Nous avons terminé la rénovation des systèmes de contrôle environnemental et de traitement atmosphérique sur [giga_planet.GetName]. Nos drones organiques bénéficieront des conditions améliorées, en particulier ceux provenant de l'extérieur de nos paramètres de conception originaux.\n\nLe contrôle plus fin du traitement de l'eau et de l'éclairage permettra également une production alimentaire beaucoup plus efficace, assurant le fonctionnement efficace continu des groupes de drones intégrés. La productivité devrait augmenter à la suite de ces modifications."
	giga_frameworld_origin.010.a.assimilator:99 "Compris."

	giga_frameworld_origin.011.name:99 "Installations de traitement de données améliorées"
	giga_frameworld_origin.011.desc:99 "Les travaux de construction sont terminés sur le nouveau complexe informatique à haut débit sur [giga_planet.GetName]. De vastes banques de superordinateurs sont maintenant disponibles pour aborder les questions scientifiques les plus complexes que nous ayons encore conçues, et promettent une vaste amélioration du débit de recherche général.\n\nL'intégration de ces systèmes dans les fonctions centrales de la station est en cours, mais la charge supplémentaire de gestion thermique ne devrait pas causer de perturbation significative."
	giga_frameworld_origin.011.a:99 "Les secrets de l'univers sont à notre portée."

	giga_frameworld_origin.012.name:99 "Infrastructure de station étendue"
	giga_frameworld_origin.012.desc:99 "Suite à une longue période de construction, de nouveaux corridors d'infrastructure de transport central ont été achevés entre les sections principales de [giga_planet.GetName].\n\nL'intégrité structurelle améliorée et les réseaux de transport interconnectés permettront à la superstructure de supporter des modules fonctionnels supplémentaires."
	giga_frameworld_origin.012.desc.2:99 "Une deuxième série de mises à niveau d'infrastructure a été achevée sur les sections principales de [giga_planet.GetName].\n\nL'intégrité structurelle améliorée et les réseaux de transport interconnectés permettront à la superstructure de supporter des modules fonctionnels supplémentaires."
	giga_frameworld_origin.012.a:99 "Compris."

	giga_frameworld_origin.013.name:99 "Projet Maginot terminé"
	giga_frameworld_origin.013.desc:99 "Nous avons maintenant achevé notre ultime barrière défensive autour de [giga_planet.GetName], encerclant notre foyer de couche après couche de fortifications mortelles. Cet exploit d'ingénierie militaire vraiment impressionnant est quasiment inattaquable par n'importe quelle force, comportant des plateformes défensives intégrées, d'immenses batteries cinétiques, de vastes emplacements de garnison et des générateurs de boucliers dépassant de loin la génération de flottes navales entières.\nDe plus, le système Main Morte se dresse comme moyen de dissuasion contre toute destruction massive de [giga_planet.GetName], en utilisant le noyau central de la station comme une vaste charge dirigée alimentée à l'antimatière en cas d'activation du système de sécurité — §Rannihilant complètement toutes les forces hostiles en orbite.§!\n\nLes divers systèmes de défense peuvent être gérés via les §Ydécisions§!. Construisez des §Ydistricts§! pour obtenir des $defensive_upgrade_point_plural$ et $offensive_upgrade_point_plural$ à utiliser avec ces décisions."
	giga_frameworld_origin.013.a:99 "Nul ne peut nous nuire maintenant."

	giga_frameworld_origin.014.name:99 "Stations orbitales de traitement secondaire terminées"
	giga_frameworld_origin.014.desc:99 "Nous avons achevé la construction de plusieurs nouvelles installations de traitement près de [giga_planet.GetName]. Ces installations amélioreront les capacités de plusieurs de nos bâtiments de traitement secondaire, permettant une rationalisation et une amélioration supplémentaires des lignes de production."
	giga_frameworld_origin.014.a:99 "Tous les systèmes sont nominaux."

	giga_frameworld_origin.015.name:99 "Infusion de nanites terminée"
	giga_frameworld_origin.015.desc:99 "Nous avons achevé l'intégration de notre essaim dans l'infrastructure centrale de [giga_planet.GetName], fusionnant notre être avec la structure elle-même. Nous pouvons maintenant manipuler chaque système avec une précision inégalée, et en bénéficierons grandement."
	giga_frameworld_origin.015.a:99 "Essence, incarnée."

	# conquered world abandonment

	giga_frameworld_origin.101.name:99 "Population annexée relocalisée"
	# first time
	giga_frameworld_origin.101.desc.a:99 "La population locale de [From.GetName] a maintenant été entièrement transférée vers [Root.Capital.GetName]. Suite à une brève période d'expérimentation, nous avons maintenant confirmé que maintenir un contrôle total d'une si grande colonie externe dépasse nos capacités, et le protocole futur se concentrera sur la relocalisation efficace des unités de population locales.\n\n[From.FrameworldEvent101GetOutpost]"
	# subsequent times
	giga_frameworld_origin.101.desc.b:99 "Conformément au protocole établi, les unités de population de [From.GetName] ont été relocalisées vers [Root.Capital.GetName].\n\n[From.FrameworldEvent101GetOutpost]"
	giga_frameworld_origin.101.a:99 "Accusé de réception."

	giga_frameworld_origin.101.outpost:99 "Un §Y$frameworld_outpost_0$§! a été établi en orbite, et un poste relais reste à la surface."
	giga_frameworld_origin.101.no_outpost:99 "Comme le site est inadapté pour un §Y$frameworld_outpost_0$§!, aucune autre action n'a été prise."

	# outpost wreck dismantled on settlement

	giga_frameworld_origin.103.name:99 "Épave orbitale récupérée"
	giga_frameworld_origin.103.desc.a:99 "Maintenant que la colonie sur [From.GetName] a été correctement établie, nos équipes d'infrastructure ont commencé les opérations de récupération sur la station épave en orbite.\n\nLe but de la station reste incertain, car la quantité d'équipement de communication découvert à bord semble disproportionnée par rapport au niveau d'activité trouvé à la surface à notre arrivée.\n\nNous ne comprendrons peut-être jamais pleinement les motivations des anciens propriétaires, mais les matériaux récupérés se sont révélés précieux."
	giga_frameworld_origin.103.a:99 "Étrange, mais utile."

	# outpost resource discovery

	giga_frameworld_origin.308.name:99 "Les relevés de ressources de l'expédition portent leurs fruits"
	giga_frameworld_origin.308.desc:99 "Les relevés de ressources en cours par nos équipes d'expédition ont découvert de nouvelles opportunités pour l'exploitation des ressources planétaires.[frameworld_outpost_motes.FrameworldEvent308Motes][frameworld_outpost_gases.FrameworldEvent308Gases][frameworld_outpost_crystals.FrameworldEvent308Crystals][frameworld_outpost_betharian.FrameworldEvent308Betharian][frameworld_outpost_zoo.FrameworldEvent308Zoo]"

	giga_frameworld_origin.308.desc.motes.general:99 "Ces particules produisent une quantité explosive de force cinétique lorsqu'elles sont activées chimiquement, et sont censément très épicées lorsqu'elles sont utilisées en cuisine."
	giga_frameworld_origin.308.desc.motes:99 "\n\nUn détachement exploratoire sur §Y[this.GetName]§! a découvert un riche approvisionnement en §H$volatile_motes$§!. $giga_frameworld_origin.308.desc.motes.general$"
	giga_frameworld_origin.308.desc.motes.ecu:99 "\n\nUne ancienne installation de traitement chimique sur §Y[this.GetName]§! s'est révélée contenir un approvisionnement significatif en §H$volatile_motes$§!. $giga_frameworld_origin.308.desc.motes.general$"
	giga_frameworld_origin.308.desc.motes.desert:99 "\n\nL'analyse chimique des sables désertiques de §Y[this.GetName]§! a révélé une riche source de §H$volatile_motes$§!. $giga_frameworld_origin.308.desc.motes.general$"
	giga_frameworld_origin.308.desc.motes.caverns:99 "\n\nDans les profondeurs d'une caverne sous la surface de §Y[this.GetName]§!, une équipe exploratoire a découvert une riche source de §H$volatile_motes$§!. $giga_frameworld_origin.308.desc.motes.general$"

	giga_frameworld_origin.308.desc.gases.general:99 "Ces gaz ont de nombreuses utilisations tactiques et même récréatives."
	giga_frameworld_origin.308.desc.gases:99 "\n\nDes scans détaillés de §Y[this.GetName]§! ont révélé une source de §H$exotic_gases$§! jusqu'ici inexploitée. $giga_frameworld_origin.308.desc.gases.general$"
	giga_frameworld_origin.308.desc.gases.ecu:99 "\n\nDes scans aériens de l'ancien secteur industriel sur §Y[this.GetName]§! ont révélé un grand réservoir de stockage de §H$exotic_gases$§!. $giga_frameworld_origin.308.desc.gases.general$"
	giga_frameworld_origin.308.desc.gases.swamp:99 "\n\nDes scans approfondis des marécages de §Y[this.GetName]§! ont révélé plusieurs points de captage potentiels pour les §H$exotic_gases$§!. $giga_frameworld_origin.308.desc.gases.general$"
	giga_frameworld_origin.308.desc.gases.bog:99 "\n\nDes relevés aériens à basse altitude des zones marécageuses sur §Y[this.GetName]§! ont révélé plusieurs emplacements adaptés à l'extraction de §H$exotic_gases$§!. $giga_frameworld_origin.308.desc.gases.general$"

	giga_frameworld_origin.308.desc.crystals.general:99 "Les cristaux se prêtent bien à l'électronique haut de gamme ainsi qu'aux systèmes d'armes laser, grâce à leurs propriétés réfractives spectaculaires."
	giga_frameworld_origin.308.desc.crystals:99 "\n\nLes équipes de relevé sur §Y[this.GetName]§! ont cartographié l'emplacement d'une source majeure de §H$rare_crystals$§!. $giga_frameworld_origin.308.desc.crystals.general$"
	giga_frameworld_origin.308.desc.crystals.ecu:99 "\n\nLes équipes de relevé sur §Y[this.GetName]§! ont identifié une installation de stockage en grande partie intacte contenant un immense approvisionnement en §H$rare_crystals$§!. $giga_frameworld_origin.308.desc.crystals.general$"
	giga_frameworld_origin.308.desc.crystals.caverns:99 "\n\nDes relevés géologiques de §Y[this.GetName]§! ont identifié une caverne expansive contenant des formations de §H$rare_crystals$§!. $giga_frameworld_origin.308.desc.crystals.general$"
	giga_frameworld_origin.308.desc.crystals.forest:99 "\n\nLes équipes de relevé sur §Y[this.GetName]§! ont découvert une forêt d'arbres silicatés qui peuvent être traités pour extraire des §H$rare_crystals$§!. $giga_frameworld_origin.308.desc.crystals.general$"
	giga_frameworld_origin.308.desc.crystals.reef:99 "\n\nDes relevés océanographiques de §Y[this.GetName]§! ont cartographié plusieurs récifs de corail cristallisé qui pourraient être récoltés pour des §H$rare_crystals$§!. $giga_frameworld_origin.308.desc.crystals.general$"

	giga_frameworld_origin.308.desc.betharian.general:99 "Ces pierres ont un potentiel énorme pour la génération d'énergie, qui pourrait être exploité avec une centrale appropriée."
	giga_frameworld_origin.308.desc.betharian:99 "\n\nDe grandes quantités de §HPierres de Bétharian§! ont été découvertes sur §Y[this.GetName]§!. $giga_frameworld_origin.308.desc.betharian.general$"
	giga_frameworld_origin.308.desc.betharian.fields:99 "\n\nDe grandes formations de §HPierres de Bétharian§! naturelles ont été découvertes sur §Y[this.GetName]§!. $giga_frameworld_origin.308.desc.betharian.general$"

	giga_frameworld_origin.308.desc.zoo.general:99 "Ces créatures se sont révélées inoffensives et amicales envers nos équipes de relevé, et présentent des conditions idéales pour étudier de près la vie extraterrestre."
	giga_frameworld_origin.308.desc.zoo:99 "\n\nDes études zoologiques de §Y[this.GetName]§! ont confirmé l'existence d'une §Yfaune locale docile§!. $giga_frameworld_origin.308.desc.zoo.general$"
	giga_frameworld_origin.308.desc.zoo.valley:99 "\n\nUne vallée isolée sur §Y[this.GetName]§! a été découverte comme abritant une population de §Yfaune locale docile§!. $giga_frameworld_origin.308.desc.zoo.general$"

	giga_frameworld_origin.308.a:99 "Excellent."
	giga_frameworld_origin.308.a.tooltip:99 "§LDe nouvelles opportunités nécessitent de nouvelles méthodologies.§!"
	giga_frameworld_origin.308.a.motes:99 "\n§Y£volatile_motes£$volatile_motes$§! découvertes sur §Y[frameworld_outpost_motes.GetName]§! :"
	giga_frameworld_origin.308.a.gases:99 "\n§Y£exotic_gases£$exotic_gases$§! découverts sur §Y[frameworld_outpost_gases.GetName]§! :"
	giga_frameworld_origin.308.a.crystals:99 "\n§Y£rare_crystals£$rare_crystals$§! découverts sur §Y[frameworld_outpost_crystals.GetName]§! :"
	giga_frameworld_origin.308.a.betharian:99 "\n§Y£energy£Pierre de Bétharian§! découverte sur §Y[frameworld_outpost_betharian.GetName]§! :"
	giga_frameworld_origin.308.a.zoo:99 "\n§Y£unity£ £society_research£Vie extraterrestre docile§! découverte sur §Y[frameworld_outpost_zoo.GetName]§! :"

