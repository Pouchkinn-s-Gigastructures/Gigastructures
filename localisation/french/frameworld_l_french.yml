	giga_biotrophy_scaling:0 "Rendement décroissant des $job_bio_trophy$"
	giga_biotrophy_scaling_fluff:0 "Au-delà d'un certain seuil, les bénéfices tirés de l'entretien des organiques sont compensés par les réalités logistiques liées à leur nombre croissant."
	giga_biotrophy_scaling_desc:0 "§TCette mégastructure permet d'accueillir des densités de £job_bio_trophy£ §Y$job_bio_trophy_plural$§! bien supérieures à celles des planètes normales. Cet effet compense l'accumulation extrême de §Y$mod_planet_jobs_complex_drone_produces_mult$§! lorsqu'ils atteignent des nombres élevés.\n\nLes £job_bio_trophy£ §Y$job_bio_trophy_plural$§! supplémentaires sont toujours bénéfiques, mais l'efficacité de chaque nouvelle pop décroît au-delà de §Y50§! pour atteindre §Y20 %§! à §Y150§! pops.\n\nPops $job_bio_trophy$ : §Y[Root.giga_biotrophy_count]§!\nBonus de base : §G+[Root.giga_biotrophy_count] %§!\nBonus ajusté : §G+[Root.giga_biotrophy_adjusted] %§!\nEfficacité : §Y[Root.giga_biotrophy_efficiency] %§!§!\n§T--------------§!\n$giga_biotrophy_scaling_fluff$"
	d_giga_biotrophy_scaling:0 "$giga_biotrophy_scaling$"
	d_giga_biotrophy_scaling_desc:0 "§TPour plus de détails, consultez le modificateur planétaire du même nom.§!\n\n$giga_biotrophy_scaling_fluff$"

