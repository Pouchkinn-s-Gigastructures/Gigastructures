	giga_frameworld_penrose:0 "$d_frameworld_penrose$"
	giga_frameworld_penrose_effect:0 "Commence la construction d'une mégastructure en plusieurs étapes qui, une fois achevée, remplacera les §Y$district_giga_frameworld_generator_plural$§! du $pc_giga_frameworld$ par un nombre réduit de §Y$district_giga_frameworld_penrose_plural$§! nettement plus puissants.\n\nLes §Y$district_giga_frameworld_penrose_plural$§! fournissent des emplois £job_technician£§Y[owner.GetTechnician]§! supplémentaires mais sont plus coûteux que les districts qu'ils remplacent.\n\n$frameworld_penrose_fake_tooltip$"
	giga_frameworld_penrose_desc:0 "Un grand miroir construit autour du $pc_black_hole$ du système, conçu pour exploiter la diffusion superradiante, générant de l'énergie avec une efficacité stupéfiante."

	giga_frameworld_decompressor:0 "$d_frameworld_decompressor$"
	giga_frameworld_decompressor_effect:0 "Commence la construction d'une mégastructure en plusieurs étapes qui, une fois achevée, remplacera les §Y$district_giga_frameworld_mining_plural$§! du $pc_giga_frameworld$ par un nombre réduit de §Y$district_giga_frameworld_decompressor_plural$§! nettement plus puissants.\n\nLes §Y$district_giga_frameworld_decompressor_plural$§! fournissent des emplois £job_miner£§Y[owner.GetMiner]§! supplémentaires mais sont plus coûteux que les districts qu'ils remplacent."
	giga_frameworld_decompressor_desc:0 "Une installation de lentilles gravitationnelles qui tord les champs gravitationnels en foreuses capables d'extraire de la matière du $pc_black_hole$."

	giga_frameworld_advanced_city:0 "Améliorer les sections d'habitation"
	giga_frameworld_advanced_city_effect:0 "Remplace les §Y$district_giga_frameworld_city_plural$§! du $pc_giga_frameworld$ par un nombre réduit de §Y$district_giga_frameworld_city_advanced_plural$§!\n\nLes §Y$district_giga_frameworld_city_advanced_plural$§! sont deux fois plus efficaces que les districts qu'ils remplacent.\n "
	giga_frameworld_advanced_hive_effect:0 "Remplace les §Y$district_giga_frameworld_hive_plural$§! du $pc_giga_frameworld$ par un nombre réduit de §Y$district_giga_frameworld_hive_advanced_plural$§!, et remplace deux emplois £job_maintenance_drone£§Y$job_maintenance_drone_plural$§! de chaque §Y$district_giga_frameworld_amenities_gestalt$§! par des £job_frame_maintenance_overseer£§Y$job_frame_maintenance_overseer_plural$§!\n\nLes §Y$district_giga_frameworld_hive_advanced_plural$§! sont deux fois plus efficaces que les districts qu'ils remplacent.\n$job_frame_maintenance_overseer_effect_desc$\n "
	giga_frameworld_advanced_nexus_effect:0 "Remplace les §Y$district_giga_frameworld_nexus_plural$§! du $pc_giga_frameworld$ par un nombre réduit de §Y$district_giga_frameworld_nexus_advanced_plural$§!, et remplace deux emplois £job_maintenance_drone£§Y$job_maintenance_drone_plural$§! de chaque §Y$district_giga_frameworld_amenities_gestalt$§! par des £job_frame_maintenance_overseer£§Y$job_frame_maintenance_overseer_plural$§!\n\nLes §Y$district_giga_frameworld_nexus_advanced_plural$§! sont deux fois plus efficaces que les districts qu'ils remplacent.\n$job_frame_maintenance_overseer_effect_desc$\n "
	giga_frameworld_advanced_city_desc:0 "Des conceptions améliorées pour les stations d'habitation et de stockage permettront une meilleure organisation des espaces de vie."

	giga_frameworld_advanced_industrial:0 "Étendre l'industrie lourde"
	giga_frameworld_advanced_industrial_foundry_effect:0 "Remplace les §Y$district_giga_frameworld_foundry_plural$§! du $pc_giga_frameworld$ par un nombre réduit de §Y$district_giga_frameworld_foundry_advanced_plural$§!.\n\nLes §Y$district_giga_frameworld_foundry_advanced_plural$§! fournissent 2 emplois £job_fabricator£§Y[owner.GetAlloyProducer]§! supplémentaires mais nécessitent des £volatile_motes£ §Y$volatile_motes$§! pour l'entretien."
	giga_frameworld_advanced_industrial_factory_effect:0 "Remplace les §Y$district_giga_frameworld_factory_plural$§! du $pc_giga_frameworld$ par un nombre réduit de §Y$district_giga_frameworld_factory_advanced_plural$§!.\n\nLes §Y$district_giga_frameworld_factory_advanced_plural$§! fournissent 2 emplois [owner.GetArtisanIcon]§Y[owner.GetArtisan]§! supplémentaires mais nécessitent des £rare_crystals£ §Y$rare_crystals$§! pour l'entretien."
	giga_frameworld_advanced_industrial_desc:0 "L'introduction de processus industriels avancés utilisant des matériaux exotiques en conjonction avec des installations de fabrication étendues améliorera considérablement le débit."

	giga_frameworld_advanced_sanctuary:0 "Projet d'arcologie sanctuaire"
	giga_frameworld_advanced_sanctuary_effect:0 "Remplace les §Y$district_giga_frameworld_sanctuary_plural$§! du $pc_giga_frameworld$ par un nombre réduit de §Y$district_giga_frameworld_sanctuary_advanced_plural$§!.\n\nLes §Y$district_giga_frameworld_sanctuary_advanced_plural$§! peuvent accueillir deux fois plus de £job_bio_trophy£ §Y$job_bio_trophy_plural$§! que les districts qu'ils remplacent."
	giga_frameworld_advanced_sanctuary_desc:0 "Une réimagination stratégique de la satisfaction des besoins organiques et des installations de divertissement permettra une densité d'habitation bien supérieure sans sacrifier la fonction ni le confort."

	giga_frameworld_gaia:0 "Améliorer les systèmes de support environnemental"
	giga_frameworld_gaia_desc:0 "Des systèmes de contrôle climatique avancés, conçus pour fournir des environnements idéaux pour toutes les formes de vie organique."

	giga_frameworld_computing_complex:0 "Améliorer les installations de traitement de données"
	giga_frameworld_computing_complex_desc:0 "Des installations dédiées au stockage de données haute densité et au traitement accéléré de l'information amélioreront considérablement notre capacité de recherche."

	giga_frameworld_expand_infrastructure:0 "Étendre l'infrastructure de la station"
	giga_frameworld_expand_infrastructure_desc:0 "Améliorer le débit des installations de fabrication et de maintenance de la station nous permettra de supporter un plus grand nombre de modules."

	giga_frameworld_orbital_ring_upgrade:0 "Construire des orbitaux de traitement"
	giga_frameworld_orbital_ring_upgrade_desc:0 "$d_frameworld_orbital_ring_desc$"

	giga_frameworld_nanites:0 "Infusion nanotechnologique"
	giga_frameworld_nanites_desc:0 "Nous avons changé nous-mêmes, et maintenant nous devons achever le processus."
	giga_frameworld_nanites_effect:0 "Active les décisions d'expansion coûtant des £nanites£ §Y$nanites$§!\n\nModernise plusieurs districts avec la nanotechnologie :\n\n§H$district_giga_frameworld_foundry$ :§!\n- Produit des £alloys£ §Y$alloys$§! supplémentaires directement\n- Entretien en £energy£ §Y$energy$§! augmenté\n- Entretien en £nanites£ §Y$nanites$§! supplémentaire\n\n§H$district_giga_frameworld_science$ :§!\n- Supprime 1 emploi [owner.GetResearcherIcon] §Y[owner.GetResearcher]§!\n- Ajoute 3 emplois [owner.GetNanotechResearcherIcon] §Y[owner.GetNanotechResearcher]§!\n- Entretien en £nanites£ §Y$nanites$§! supplémentaire\n\n§H$district_giga_frameworld_refinery$ :§!\n- Produit des $giga_r_motes$$giga_r_gases$$giga_r_crystals$ §Yressources stratégiques§! supplémentaires directement\n- Entretien en £energy£ §Y$energy$§! augmenté\n- Entretien en £nanites£ §Y$nanites$§! supplémentaire\n "

	giga_frameworld_maginot:0 "Mettre en œuvre la doctrine Maginot"
	giga_frameworld_maginot_effect:0 "Débloque les §Ymécaniques $name_maginot$§!, améliorant le potentiel défensif du $pc_giga_frameworld$ de multiples façons :\n\nAjoute une §Y$strategic_defence_command_platform$§!, une station défensive évolutive immensément puissante capable d'affronter des flottes entières\n\nAjoute 3 §Y$frameworld_defensive_station_plural$§! supplémentaires au périmètre défensif du $pc_giga_frameworld$\n\nPermet la construction des districts §Y$district_giga_frameworld_maginot_shield_generators$§! et §Y$district_giga_frameworld_maginot_planetary_cannons$§!, qui renforcent les défenses spatiales et fournissent des armées spéciales\n\nLes §Y$district_giga_frameworld_fortress_plural$§! fournissent des armées défensives puissantes supplémentaires\n\nFournit un §YSystème de perturbation subspatiale§! activable qui bloque la formation de trous de ver et l'utilisation du propulseur de saut dans ce système et les systèmes adjacents\n\n"
	giga_frameworld_maginot_desc:0 "Nous comprenons maintenant les longueurs absurdes auxquelles une planète peut être fortifiée, et avec cette connaissance nous voyons une voie claire vers l'amélioration de nos propres défenses."

