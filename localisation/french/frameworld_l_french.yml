	frameworld_conquered_tooltip:99 "La croissance, la construction et l'entraînement des armées sont effectivement interrompus sur ce monde."

	frameworld_conquered_no_resettle:99 "Surextension logistique"
	frameworld_conquered_no_resettle_desc:99 "Sans infrastructure interstellaire civile développée, cet empire $origin_frameworld$ peine à répondre à la demande de transport en temps de guerre."
	frameworld_conquered_no_resettle_tooltip:99 "Les £pop£Pops ne seront pas automatiquement relocalisées depuis ce monde tant que ce modificateur n'aura pas expiré ou ne sera pas supprimé par l'état de paix"

	frameworld_building_wreck_fix:99 "Correction de ruine de bâtiment"
	frameworld_building_wreck_fix_desc:99 "Si vous lisez ceci, quelque chose s'est mal passé. Ce modificateur existe pour empêcher les bâtiments d'être ruinés pendant les événements de réorganisation et n'est pas censé persister."

	frameworld_outpost_planet:99 "$giga_frameworld_outpost$ du $pc_giga_frameworld$"
	frameworld_outpost_planet_effects:99 "Les $giga_frameworld_outpost_plural$ produisent des ressources basées sur leur planète hôte, affectées par les modificateurs de production d'emplois."
	frameworld_outpost_planet_desc:99 "§T§HGisements de ressources rares exploitables :§!\n\n£volatile_motes£ $volatile_motes$ : §Y[this.GetFrameworldOutpostVolatileMotes]§!\n£exotic_gases£ $exotic_gases$ : §Y[this.GetFrameworldOutpostExoticGases]§!\n£rare_crystals£ $rare_crystals$ : §Y[this.GetFrameworldOutpostRareCrystals]§![FrameworldOutpostTerravoreText][FrameworldOutpostNaniteText][FrameworldOutpostEnvironmentalistText]\n\n§T--------------§!\n§LBien que n'étant pas à l'échelle d'une colonie pleinement développée, nos avant-postes peuvent toujours fournir des ressources précieuses.§!"

