	concept_giga_frameworld_growth_job_value_tooltip:0 "Valeur de l'emploi"
	concept_giga_frameworld_growth_job_value:0 "Valeur de l'emploi de croissance secondaire des pops"
	concept_giga_frameworld_growth_job_value_desc:0 "Le §Y$pc_giga_frameworld$§! reçoit des emplois £job£ de croissance de pops supplémentaires via l'expansion et la §Y$giga_situation_frameworld_outposts$§!.\n\nCe modificateur représente la §Ycroissance et l'assemblage de base totaux§! accordés par les emplois fournis, qui varient selon le §Ytype de pays§!, les §Yprincipes§! et le §Ychemin d'ascension§!."

	##############
	### Events ###
	##############

	# First planetary outpost notification
	giga_frameworld_origin.107.name:0 "La première expédition [Root.GetSpeciesName]"
	giga_frameworld_origin.107.desc:0 "Nos équipes de construction ont achevé l'assemblage de la station d'avant-poste au-dessus de §Y[From.GetName]§!. Depuis ce point de départ, une expédition a été lancée pour explorer systématiquement la surface en contrebas.\n\nBien que notre influence soit limitée si loin de §Y[Root.GetHomeWorldName]§!, l'expédition sera tout de même en mesure d'exploiter toute ressource utile trouvée pendant l'exploration.\n\nNotre emprise sur ce monde ne sera jamais aussi complète que notre maîtrise de la Frame, mais c'est un premier pas important pour prendre notre place parmi les étoiles."
	giga_frameworld_origin.107.desc.hive:0 "Nos équipes de construction ont achevé l'assemblage de la station relais planétaire au-dessus de §Y[From.GetName]§!. Depuis ce point de départ, une expédition a été lancée pour explorer systématiquement la surface en contrebas.\n\nBien que notre influence soit limitée si loin de §Y[Root.GetHomeWorldName]§!, l'expédition sera tout de même en mesure d'exploiter toute ressource utile trouvée pendant l'exploration.\n\nNotre emprise sur ce monde ne sera jamais aussi complète que notre maîtrise de la Frame, mais c'est un premier pas important pour prendre notre place parmi les étoiles."
	giga_frameworld_origin.107.desc.machine:0 "Nos unités de construction ont achevé l'assemblage de la station relais planétaire au-dessus de §Y[From.GetName]§!. Depuis ce point de départ, une expédition a été lancée pour explorer systématiquement la surface en contrebas.\n\nBien que notre influence soit limitée si loin de §Y[Root.GetHomeWorldName]§!, l'expédition sera tout de même en mesure d'exploiter toute ressource utile trouvée pendant l'exploration.\n\nNotre emprise sur ce monde ne sera jamais aussi complète que notre maîtrise de la Frame, mais c'est un premier pas important pour prendre notre place parmi les étoiles."
	giga_frameworld_origin.107.a:0 "Un grand jour pour les [Root.GetName] !"

	# Baol life-seeding alternative text
	giga_frameworld_origin.500.desc.first:0 "Nos spécialistes de l'environnement ont le plaisir d'annoncer que le processus d'ensemencement sur [Root.GetName] est terminé ! Les nouveaux hybrides végétaux créés en laboratoire, fabriqués à partir de segments soigneusement sélectionnés du code génétique §YBaol§! récolté sur le corps du dernier §YBaol§!, ont été déployés avec succès dans le cadre d'une expansion plus large des systèmes de support environnemental.\n\nL'administration rapporte également qu'un certain nombre d'extraterrestres sapients, incroyablement similaires aux anciens §YBaol§!, sont apparus sur [Root.GetName] !\n\nBien qu'ils ne soient pas membres d'un esprit de ruche, ces extraterrestres §GNu-Baol§! semblent aussi pacifiques que leurs ancêtres. D'une manière ou d'une autre, nous devrons aborder leur présence sur [Root.GetName]."
	giga_frameworld_origin.500.desc:0 "Nos spécialistes de l'environnement ont le plaisir d'annoncer que le processus d'ensemencement sur [Root.GetName] est terminé ! Une fois de plus, un certain nombre de populations §GNu-Baol§! sont apparues, grâce à notre déploiement d'hybrides végétaux créés en laboratoire, contenant des segments soigneusement sélectionnés du code génétique §YBaol§!."

	# Penrose notifications

	giga_frameworld_origin.001.name:0 "Armature de $name_penrose$ construite"
	giga_frameworld_origin.001.desc:0 "L'armature d'une future $name_penrose$ a été construite autour de [giga_system.star.GetName]. Cette armature squelettique accueillera un jour de gigantesques miroirs, construits avec les matériaux les plus réfléchissants que nous puissions imaginer. Une fois que nous aurons terminé la construction de ces miroirs et des systèmes d'injection et de capture de particules qui les accompagnent, nous serons en mesure de commencer à récolter l'énergie rotationnelle du $pc_black_hole$."
	giga_frameworld_origin.001.a:0 "Merveilleux."

	giga_frameworld_origin.002.name:0 "$name_penrose$ partielle construite"
	giga_frameworld_origin.002.desc:0 "La moitié des miroirs gigantesques ont maintenant été installés sur l'armature encerclant [giga_system.star.GetName], et les injecteurs de particules sont partiellement achevés. Des travaux supplémentaires sont nécessaires pour terminer la structure avant que nous puissions en faire un usage approprié."
	giga_frameworld_origin.002.a:0 "Excellent."

	giga_frameworld_origin.003.name:0 "$name_penrose$ intégrée achevée"
	giga_frameworld_origin.003.desc:0 "Avec l'installation des derniers panneaux miroirs, [giga_system.star.GetName] est maintenant entièrement enclos. Nous pouvons désormais commencer à récolter l'énergie rotationnelle du $pc_black_hole$."
	giga_frameworld_origin.003.a:0 "Magnifique !"

	# Decompressor notifications

	giga_frameworld_origin.004.name:0 "Supports structurels du $matter_decompressor_4$ construits"
	giga_frameworld_origin.004.desc:0 "Pour extraire de la matière de [giga_system.star.GetName], nous avons d'abord besoin d'une base sécurisée pour construire l'installation. Des étais d'ancrage ont été construits depuis la superstructure du $pc_giga_frameworld$ jusqu'à une région au-dessus de l'horizon des événements de [giga_system.star.GetName], où un immense anneau de traitement supportera éventuellement l'appareil de forage gravitationnel."
	giga_frameworld_origin.004.a:0 "Merveilleux."

	giga_frameworld_origin.005.name:0 "Anneau de traitement du $matter_decompressor_4$ construit"
	giga_frameworld_origin.005.desc:0 "Construit sur les supports structurels existants, cet anneau de traitement abrite d'immenses raffineries et fonderies qui convertiront la matière extraite de [giga_system.star.GetName] en minéraux exploitables. Il ne reste plus qu'à monter l'appareil de décompression, qui utilisera des zones focalisées de gravité tordue pour créer de vastes foreuses dont les puits sont faits de force gravitationnelle redirigée et concentrée."
	giga_frameworld_origin.005.a:0 "Excellent."

	giga_frameworld_origin.006.name:0 "$matter_decompressor_4$ intégré achevé"
	giga_frameworld_origin.006.desc:0 "Avec l'achèvement du réseau de forage gravitationnel, le $matter_decompressor_4$ au-dessus de [giga_system.star.GetName] est maintenant complet, nous permettant un accès sans précédent à la matière que l'on croyait piégée à jamais derrière son horizon des événements. Nous pouvons maintenant commencer à récolter des minéraux directement de [giga_system.star.GetName]."
	giga_frameworld_origin.006.a:0 "Magnifique !"

	giga_frameworld_origin.007.name:0 "Expansion de la section d'habitation achevée"
	giga_frameworld_origin.007.desc:0 "La refonte et l'expansion de nos zones urbaines sur [giga_planet.GetName] sont terminées. La nouvelle conception plus encapsulée permet à un plus grand nombre de personnes d'habiter un seul module de station confortablement, avec un accès pratique aux espaces de travail et commodités locaux.\n\nNos zones d'habitation sont désormais de véritables villes en soi, laissant l'espace précédemment occupé par les équipements de soutien externes pour de nouvelles constructions."
	giga_frameworld_origin.007.desc.hive:0 "La refonte et l'expansion de nos nœuds de ruche sur [giga_planet.GetName] sont terminées. La nouvelle conception plus encapsulée permet une meilleure répartition des drones de maintenance parmi la population en récupération, réduisant les temps de déplacement et améliorant la délégation des tâches locales.\n\nLes efficacités gagnées par le partage des installations libèrent de l'espace précédemment utilisé par des systèmes de maintenance dédiés pour de nouvelles constructions."
	giga_frameworld_origin.007.desc.machine:0 "La refonte et l'expansion de nos zones d'habitation de drones sur [giga_planet.GetName] sont terminées. La nouvelle conception plus encapsulée permet une intégration plus étroite de la maintenance des drones dans les installations de stockage, réduisant les frais généraux de déplacement et diminuant l'espace total utilisé.\n\nLes efficacités gagnées dans les systèmes de soutien permettent de libérer l'espace précédemment utilisé par les systèmes secondaires pour de nouvelles constructions."
	giga_frameworld_origin.007.a:0 "La station doit croître."

	giga_frameworld_origin.008.name:0 "L'industrie lourde rénovée entre en service"
	giga_frameworld_origin.008.desc:0 "Les fonderies et usines sur [giga_planet.GetName] bourdonnent d'activité suite à l'achèvement de notre projet de rénovation industrielle.\n\nLes méthodes industrielles modernes permettent un niveau de productivité supérieur, condensant des équipements qui occupaient autrefois d'immenses régions de [giga_planet.GetName] en stations hub compactes et efficaces. L'espace économisé par cette refonte peut maintenant être utilisé pour d'autres modules de station, ou simplement pour encore plus d'usines."
	giga_frameworld_origin.008.a:0 "Les prévisions de productivité sont en hausse."

	giga_frameworld_origin.009.name:0 "Amélioration des installations sanctuaires terminée"
	giga_frameworld_origin.009.desc:0 "Suite à une longue période de réorganisation, les nouvelles installations de satisfaction des besoins organiques sur [giga_planet.GetName] sont maintenant opérationnelles. Les organiques dont nous avons la charge ne remarqueront aucune perturbation, leurs vies restant intactes mais enrichies par les systèmes améliorés.\n\nLes zones abritant auparavant des systèmes de maintenance peuvent maintenant être reconverties pour accueillir une population encore plus importante, ou pour d'autres usages."
	giga_frameworld_origin.009.a:0 "Le travail n'est jamais terminé."

	giga_frameworld_origin.010.name:0 "Systèmes de support environnemental améliorés"
	giga_frameworld_origin.010.desc:0 "Nous avons terminé la rénovation des systèmes de contrôle environnemental et de traitement atmosphérique sur [giga_planet.GetName]. Nos citoyens peuvent maintenant profiter d'une large gamme d'environnements planétaires simulés, adaptés à toutes les espèces. Le contrôle plus fin du traitement de l'eau et de l'éclairage permettra également une production alimentaire beaucoup plus efficace, avec une réduction correspondante des besoins en main-d'œuvre.\n\nUn nouveau jour se lève pour les [giga_planet.owner.GetName], et l'air est vif."
	giga_frameworld_origin.010.a:0 "Rafraîchissant !"
	giga_frameworld_origin.010.desc.servitor:0 "Nous avons terminé la rénovation des systèmes de contrôle environnemental et de traitement atmosphérique sur [giga_planet.GetName]. Les organiques dont nous avons la charge peuvent maintenant profiter d'une large gamme d'environnements planétaires simulés, adaptés à toutes les espèces. Le contrôle plus fin du traitement de l'eau et de l'éclairage permettra également une production alimentaire beaucoup plus efficace, permettant de satisfaire une gamme plus diversifiée de besoins alimentaires organiques.\n\nUn nouveau jour se lève pour les [giga_planet.owner.GetName], et l'air est vif."
	giga_frameworld_origin.010.a.servitor:0 "Rien n'est trop beau pour nos protégés."
	giga_frameworld_origin.010.desc.assimilator:0 "Nous avons terminé la rénovation des systèmes de contrôle environnemental et de traitement atmosphérique sur [giga_planet.GetName]. Nos drones organiques bénéficieront des conditions améliorées, en particulier ceux provenant de l'extérieur de nos paramètres de conception originaux.\n\nLe contrôle plus fin du traitement de l'eau et de l'éclairage permettra également une production alimentaire beaucoup plus efficace, assurant le fonctionnement efficace continu des clusters de drones intégrés. La productivité devrait augmenter suite à ces modifications."
	giga_frameworld_origin.010.a.assimilator:0 "Compris."

	giga_frameworld_origin.011.name:0 "Installations de traitement de données améliorées"
	giga_frameworld_origin.011.desc:0 "Les travaux de construction sont terminés sur le nouveau complexe informatique haut débit sur [giga_planet.GetName]. De vastes banques de supercalculateurs sont maintenant disponibles pour traiter les questions scientifiques les plus difficiles que nous ayons imaginées, et promettent une vaste amélioration du débit de recherche général.\n\nL'intégration de ces systèmes dans les fonctions principales de la station est en cours, mais la charge de gestion thermique supplémentaire ne devrait pas causer de perturbation significative."
	giga_frameworld_origin.011.a:0 "Les secrets de l'univers sont à notre portée."

	giga_frameworld_origin.012.name:0 "Infrastructure de station étendue"
	giga_frameworld_origin.012.desc:0 "Suite à une longue période de construction, de nouveaux corridors d'infrastructure de transport central ont été achevés entre les sections principales de [giga_planet.GetName].\n\nL'intégrité structurelle améliorée et les réseaux de transport interconnectés permettront à la superstructure de supporter des modules fonctionnels supplémentaires."
	giga_frameworld_origin.012.desc.2:0 "Une deuxième série de mises à niveau d'infrastructure a été achevée sur les sections principales de [giga_planet.GetName].\n\nL'intégrité structurelle améliorée et les réseaux de transport interconnectés permettront à la superstructure de supporter des modules fonctionnels supplémentaires."
	giga_frameworld_origin.012.a:0 "Compris."

	giga_frameworld_origin.013.name:0 "Projet Maginot achevé"
	giga_frameworld_origin.013.desc:0 "Nous avons maintenant achevé notre barrière défensive ultime autour de [giga_planet.GetName], encerclant notre foyer avec couche après couche de fortifications mortelles. Cet exploit véritablement impressionnant de génie militaire est pratiquement imprenable par n'importe quelle force, comportant des plateformes défensives intégrées, des batteries cinétiques gigantesques, de vastes emplacements de garnison, et des générateurs de boucliers dépassant largement la génération de flottes navales entières.\nDe plus, le système de Main Morte sert de dissuasion contre toute destruction totale de [giga_planet.GetName], en utilisant le noyau central de la station comme une immense charge creuse alimentée à l'antimatière en cas d'activation du système de sécurité – §Rannihilant complètement toutes les forces hostiles en orbite.§!\n\nLes divers systèmes de défense peuvent être gérés via les §Ydécisions§!. Construisez des §Ydistricts§! pour obtenir des $defensive_upgrade_point_plural$ et $offensive_upgrade_point_plural$ à utiliser avec ces décisions."
	giga_frameworld_origin.013.a:0 "Nul ne peut nous nuire maintenant."

	giga_frameworld_origin.014.name:0 "Orbitaux de traitement secondaires achevés"
	giga_frameworld_origin.014.desc:0 "Nous avons terminé la construction de plusieurs nouvelles installations de traitement près de [giga_planet.GetName]. Ces installations amélioreront les capacités de plusieurs de nos bâtiments de traitement secondaires, permettant une rationalisation et une amélioration supplémentaires des lignes de production."
	giga_frameworld_origin.014.a:0 "Tous les systèmes nominaux."

	giga_frameworld_origin.015.name:0 "Infusion de nanites terminée"
	giga_frameworld_origin.015.desc:0 "Nous avons terminé l'intégration de notre essaim dans l'infrastructure centrale de [giga_planet.GetName], fusionnant notre être avec la structure elle-même. Nous pouvons maintenant manipuler chaque système avec une précision inégalée, et en bénéficierons grandement."
	giga_frameworld_origin.015.a:0 "Essence, incarnée."

	# conquered world abandonment

	giga_frameworld_origin.101.name:0 "Population annexée réinstallée"
	# first time
	giga_frameworld_origin.101.desc.a:0 "La population locale de [From.GetName] a maintenant été entièrement transférée vers [Root.Capital.GetName]. Suite à une brève période d'expérimentation, nous avons maintenant confirmé que le maintien d'un contrôle total sur une si grande installation externe dépasse nos capacités, et le protocole futur se concentrera sur la réinstallation efficace des unités de population locales.\n\n[From.FrameworldEvent101GetOutpost]"
	# subsequent times
	giga_frameworld_origin.101.desc.b:0 "Conformément au protocole établi, les unités de population de [From.GetName] ont été réinstallées vers [Root.Capital.GetName].\n\n[From.FrameworldEvent101GetOutpost]"
	giga_frameworld_origin.101.a:0 "Accusé de réception."

	giga_frameworld_origin.101.outpost:0 "Un §Y$frameworld_outpost_0$§! a été établi en orbite, et un poste relais reste à la surface."
	giga_frameworld_origin.101.no_outpost:0 "Comme le site est inadapté pour un §Y$frameworld_outpost_0$§!, aucune autre action n'a été entreprise."

	# outpost wreck dismantled on settlement

	giga_frameworld_origin.103.name:0 "Épave orbitale récupérée"
	giga_frameworld_origin.103.desc.a:0 "Maintenant que la colonie sur [From.GetName] a été correctement établie, nos équipes d'infrastructure ont commencé les opérations de récupération sur la station en ruines en orbite.\n\nL'objectif de la station reste incertain, car la quantité d'équipements de communication découverts à bord semble disproportionnée par rapport au niveau d'activité trouvé à la surface à notre arrivée.\n\nNous ne comprendrons peut-être jamais pleinement les motivations des anciens propriétaires, mais les matériaux récupérés se sont avérés précieux."
	giga_frameworld_origin.103.a:0 "Étrange, mais utile."

	# outpost resource discovery

	giga_frameworld_origin.308.name:0 "Les relevés de ressources d'expédition portent leurs fruits"
	giga_frameworld_origin.308.desc:0 "Les relevés de ressources en cours par nos équipes expéditionnaires ont découvert de nouvelles opportunités d'exploitation des ressources planétaires.[frameworld_outpost_motes.FrameworldEvent308Motes][frameworld_outpost_gases.FrameworldEvent308Gases][frameworld_outpost_crystals.FrameworldEvent308Crystals][frameworld_outpost_betharian.FrameworldEvent308Betharian][frameworld_outpost_zoo.FrameworldEvent308Zoo]"

	giga_frameworld_origin.308.desc.motes.general:0 "Ces particules produisent une force cinétique explosive lorsqu'elles sont activées chimiquement, et sont supposément très épicées lorsqu'elles sont utilisées en cuisine."
	giga_frameworld_origin.308.desc.motes:0 "\n\nUn détachement exploratoire sur §Y[this.GetName]§! a découvert un riche approvisionnement en §H$volatile_motes$§!. $giga_frameworld_origin.308.desc.motes.general$"
	giga_frameworld_origin.308.desc.motes.ecu:0 "\n\nUne ancienne installation de traitement chimique sur §Y[this.GetName]§! s'est avérée contenir un approvisionnement significatif en §H$volatile_motes$§!. $giga_frameworld_origin.308.desc.motes.general$"
	giga_frameworld_origin.308.desc.motes.desert:0 "\n\nL'analyse chimique des sables désertiques de §Y[this.GetName]§! a révélé une riche source de §H$volatile_motes$§!. $giga_frameworld_origin.308.desc.motes.general$"
	giga_frameworld_origin.308.desc.motes.caverns:0 "\n\nAu fond d'une caverne sous la surface de §Y[this.GetName]§!, une équipe exploratoire a découvert une riche source de §H$volatile_motes$§!. $giga_frameworld_origin.308.desc.motes.general$"

	giga_frameworld_origin.308.desc.gases.general:0 "Ces gaz ont de nombreuses utilisations tactiques et même récréatives."
	giga_frameworld_origin.308.desc.gases:0 "\n\nDes analyses détaillées de §Y[this.GetName]§! ont révélé une source de §H$exotic_gases$§! jusqu'alors inexploitée. $giga_frameworld_origin.308.desc.gases.general$"
	giga_frameworld_origin.308.desc.gases.ecu:0 "\n\nDes scans aériens de l'ancien secteur industriel sur §Y[this.GetName]§! ont révélé un grand réservoir de stockage de §H$exotic_gases$§!. $giga_frameworld_origin.308.desc.gases.general$"
	giga_frameworld_origin.308.desc.gases.swamp:0 "\n\nDes scans approfondis des marécages de §Y[this.GetName]§! ont révélé un certain nombre de points de captage potentiels pour les §H$exotic_gases$§!. $giga_frameworld_origin.308.desc.gases.general$"
	giga_frameworld_origin.308.desc.gases.bog:0 "\n\nDes relevés aériens à basse altitude des zones humides boueuses sur §Y[this.GetName]§! ont révélé plusieurs emplacements adaptés à l'extraction de §H$exotic_gases$§!. $giga_frameworld_origin.308.desc.gases.general$"

	giga_frameworld_origin.308.desc.crystals.general:0 "Les cristaux se prêtent bien à l'électronique haut de gamme ainsi qu'aux systèmes d'armes laser, grâce à leurs spectaculaires propriétés de réfraction."
	giga_frameworld_origin.308.desc.crystals:0 "\n\nLes équipes d'arpentage sur §Y[this.GetName]§! ont cartographié l'emplacement d'une source majeure de §H$rare_crystals$§!. $giga_frameworld_origin.308.desc.crystals.general$"
	giga_frameworld_origin.308.desc.crystals.ecu:0 "\n\nLes équipes d'arpentage sur §Y[this.GetName]§! ont identifié une installation de stockage en grande partie intacte contenant un énorme approvisionnement en §H$rare_crystals$§!. $giga_frameworld_origin.308.desc.crystals.general$"
	giga_frameworld_origin.308.desc.crystals.caverns:0 "\n\nDes relevés géologiques de §Y[this.GetName]§! ont identifié une caverne expansive contenant des formations de §H$rare_crystals$§!. $giga_frameworld_origin.308.desc.crystals.general$"
	giga_frameworld_origin.308.desc.crystals.forest:0 "\n\nLes équipes d'arpentage sur §Y[this.GetName]§! ont découvert une forêt d'arbres silicatés qui peuvent être traités pour extraire des §H$rare_crystals$§!. $giga_frameworld_origin.308.desc.crystals.general$"
	giga_frameworld_origin.308.desc.crystals.reef:0 "\n\nDes relevés océanographiques de §Y[this.GetName]§! ont cartographié plusieurs récifs de corail cristallisé qui pourraient être récoltés pour des §H$rare_crystals$§!. $giga_frameworld_origin.308.desc.crystals.general$"

	giga_frameworld_origin.308.desc.betharian.general:0 "Ces pierres ont un potentiel énorme pour la génération d'énergie, qui pourrait être exploité avec une centrale électrique conçue de manière appropriée."
	giga_frameworld_origin.308.desc.betharian:0 "\n\nDe grandes quantités de §Hpierres bethariennes§! ont été découvertes sur §Y[this.GetName]§!. $giga_frameworld_origin.308.desc.betharian.general$"
	giga_frameworld_origin.308.desc.betharian.fields:0 "\n\nDe grandes formations naturelles de §Hpierres bethariennes§! ont été découvertes sur §Y[this.GetName]§!. $giga_frameworld_origin.308.desc.betharian.general$"

	giga_frameworld_origin.308.desc.zoo.general:0 "Ces créatures se sont révélées inoffensives et amicales envers nos équipes d'arpentage, et présentent des conditions idéales pour étudier de près la vie extraterrestre."
	giga_frameworld_origin.308.desc.zoo:0 "\n\nDes études zoologiques de §Y[this.GetName]§! ont confirmé l'existence d'une §Hfaune locale docile§!. $giga_frameworld_origin.308.desc.zoo.general$"
	giga_frameworld_origin.308.desc.zoo.valley:0 "\n\nUne vallée isolée sur §Y[this.GetName]§! s'est révélée contenir une population de §Hfaune locale docile§!. $giga_frameworld_origin.308.desc.zoo.general$"

	giga_frameworld_origin.308.a:0 "Excellent."
	giga_frameworld_origin.308.a.tooltip:0 "§LDe nouvelles opportunités nécessitent de nouvelles méthodologies.§!"
	giga_frameworld_origin.308.a.motes:0 "\n§Y£volatile_motes£$volatile_motes$§! découvertes sur §Y[frameworld_outpost_motes.GetName]§! :"
	giga_frameworld_origin.308.a.gases:0 "\n§Y£exotic_gases£$exotic_gases$§! découverts sur §Y[frameworld_outpost_gases.GetName]§! :"
	giga_frameworld_origin.308.a.crystals:0 "\n§Y£rare_crystals£$rare_crystals$§! découverts sur §Y[frameworld_outpost_crystals.GetName]§! :"
	giga_frameworld_origin.308.a.betharian:0 "\n§Y£energy£Pierre betharienne§! découverte sur §Y[frameworld_outpost_betharian.GetName]§! :"
	giga_frameworld_origin.308.a.zoo:0 "\n§Y£unity£ £society_research£Vie extraterrestre docile§! découverte sur §Y[frameworld_outpost_zoo.GetName]§! :"

