	giga_frameworld_orbital_ring_upgrade_desc:99 "$d_frameworld_orbital_ring_desc$"

	giga_frameworld_nanites:99 "Infusion nanotechnologique"
	giga_frameworld_nanites_desc:99 "Nous avons changé nous-mêmes, et maintenant nous devons achever le processus."
	giga_frameworld_nanites_effect:99 "Active les décisions d'expansion coûtant des £nanites£ §Y$nanites$§!\n\nModernise plusieurs districts avec la nanotechnologie :\n\n§H$district_giga_frameworld_foundry$ :§!\n- Produit des £alloys£ §Y$alloys$§! supplémentaires directement\n- Entretien en £energy£ §Y$energy$§! augmenté\n- Entretien en £nanites£ §Y$nanites$§! supplémentaire\n\n§H$district_giga_frameworld_science$ :§!\n- Retire 1 emploi [owner.GetResearcherIcon] §Y[owner.GetResearcher]§!\n- Ajoute 3 emplois [owner.GetNanotechResearcherIcon] §Y[owner.GetNanotechResearcher]§!\n- Entretien en £nanites£ §Y$nanites$§! supplémentaire\n\n§H$district_giga_frameworld_refinery$ :§!\n- Produit des $giga_r_motes$$giga_r_gases$$giga_r_crystals$ §YRessources stratégiques§! supplémentaires directement\n- Entretien en £energy£ §Y$energy$§! augmenté\n- Entretien en £nanites£ §Y$nanites$§! supplémentaire\n "

	giga_frameworld_maginot:99 "Implémenter la doctrine Maginot"
	giga_frameworld_maginot_effect:99 "Débloque les §Ymécaniques $name_maginot$§!, améliorant le potentiel défensif du $pc_giga_frameworld$ de multiples façons :\n\nAjoute une §Y$strategic_defence_command_platform$§!, une station défensive améliorable extrêmement puissante capable d'affronter des flottes entières\n\nAjoute 3 §Y$frameworld_defensive_station_plural$§! supplémentaires au périmètre défensif du $pc_giga_frameworld$\n\nPermet la construction de districts §Y$district_giga_frameworld_maginot_shield_generators$§! et §Y$district_giga_frameworld_maginot_planetary_cannons$§!, qui améliorent les défenses spatiales et fournissent des armées spéciales\n\nLes §Y$district_giga_frameworld_fortress_plural$§! fournissent des armées de défense puissantes supplémentaires\n\nFournit un §YSystème de perturbation subspatiale§! activable qui bloque la formation de trous de ver et l'utilisation du propulseur de saut dans ce système et les systèmes adjacents\n\n"
	giga_frameworld_maginot_desc:99 "Nous comprenons maintenant les longueurs absurdes auxquelles une planète peut être fortifiée, et avec cette connaissance nous voyons un chemin clair vers l'amélioration de nos propres défenses."

