	frameworld_origin_colony_cost:0 "Pénalité de coût de colonisation"
	frameworld_origin_colony_cost_desc:0 "§T§EModificateur de compatibilité :§! Désactiver complètement la construction de $colonizer_plural$ nécessite des écrasements invasifs qui ne sont pas facilement compatibles avec d'autres mods.\n\nSi un $colonizer$ est obtenu d'une manière ou d'une autre, il peut toujours être utilisé pour fonder une colonie, mais les colons seront réinstallés de la même manière qu'un monde conquis.§!\n§T--------------§!\n§LNotre architecture réseau est fondamentalement incompatible avec les exigences de la colonisation planétaire décentralisée. Nous sommes intrinsèquement liés à la Frame.§!"

	frameworld_outpost_bonus:0 "Réseau de $giga_frameworld_outpost$"
	frameworld_outpost_bonus_desc:0 "§LPlus petits que les colonies d'autres civilisations spatiales, nos $giga_frameworld_outpost_plural$ auxiliaires étendent notre influence sur des mondes distants.§!"

	giga_frameworld_outpost_empire_size_modifier_text:0 " et $giga_frameworld_outpost_plural$"
	giga_frameworld_outpost_pops_modifier_text:0 "Pops supplémentaires lors de la construction de $giga_frameworld_outpost_plural$"

	frameworld_expanded_maintenance_protocol:0 "Protocoles de maintenance étendus"
	frameworld_expanded_maintenance_protocol_desc:0 "La Frame a constamment besoin de maintenance et d'amélioration. Les chômeurs seront reconvertis et assignés à des tâches secondaires, maintenant et assistant les autres fonctions de la station selon les besoins."
	frameworld_expanded_maintenance_protocol_tooltip:0 "Les pops sans emploi §Yau-delà de la 5e§! sur ce $pc_giga_frameworld$ seront plutôt employées comme £job_frame_maintenance_worker£ §Y$job_frame_maintenance_worker_plural$§!\n\n$job_frame_maintenance_worker_effect_desc$"

	frameworld_expanded_maintenance_protocol_gestalt:0 "$frameworld_expanded_maintenance_protocol$"
	frameworld_expanded_maintenance_protocol_gestalt_desc:0 "Permettre aux drones non assignés de rester inactifs représente un facteur de gaspillage inacceptable. Ces drones seront redistribués vers des tâches secondaires, maintenant et assistant les autres fonctions de la station selon les besoins."
	frameworld_expanded_maintenance_protocol_gestalt_tooltip:0 "Les pops sans emploi §Yau-delà de la 5e§! sur ce $pc_giga_frameworld$ seront plutôt employées comme £job_frame_maintenance_drone£ §Y$job_frame_maintenance_drone_plural$§!\n\n$job_frame_maintenance_drone_effect_desc$"

	frameworld_ai_build_cooldown:0 "Temps de recharge de construction IA du $pc_giga_frameworld$"
	frameworld_ai_build_cooldown_desc:0 "Période de recharge pour les événements d'aide IA."

	frameworld_ai_artisans:0 "Ajustement $job_artisan_drone$"
	frameworld_ai_artisans_desc:0 "Un assistant de gestion d'emplois IA."

	frameworld_conquered:0 "Surextension administrative"
	frameworld_conquered_desc:0 "Ce monde est dans le chaos suite à un changement de propriétaire."
	frameworld_conquered_tooltip:0 "La croissance, la construction et l'entraînement d'armées sont effectivement interrompus sur ce monde."

	frameworld_conquered_no_resettle:0 "Surextension logistique"
	frameworld_conquered_no_resettle_desc:0 "Sans infrastructure interstellaire civile développée, cet empire $origin_frameworld$ peine à répondre à la demande de transport en temps de guerre."
	frameworld_conquered_no_resettle_tooltip:0 "Les £pop£pops ne seront pas automatiquement réinstallées depuis ce monde jusqu'à l'expiration de ce modificateur ou son retrait en étant en paix"

	frameworld_building_wreck_fix:0 "Correction de ruine de bâtiment"
	frameworld_building_wreck_fix_desc:0 "Si vous lisez ceci, quelque chose s'est mal passé. Ce modificateur existe pour empêcher les bâtiments d'être ruinés pendant les événements de réorganisation et n'est pas censé persister."

	frameworld_outpost_planet:0 "$giga_frameworld_outpost$ du $pc_giga_frameworld$"
	frameworld_outpost_planet_effects:0 "Les $giga_frameworld_outpost_plural$ produisent des ressources en fonction de leur planète hôte, affectées par les modificateurs de production d'emploi."
	frameworld_outpost_planet_desc:0 "§T§HGisements de ressources rares exploitables :§!\n\n£volatile_motes£ $volatile_motes$ : §Y[this.GetFrameworldOutpostVolatileMotes]§!\n£exotic_gases£ $exotic_gases$ : §Y[this.GetFrameworldOutpostExoticGases]§!\n£rare_crystals£ $rare_crystals$ : §Y[this.GetFrameworldOutpostRareCrystals]§![FrameworldOutpostTerravoreText][FrameworldOutpostNaniteText][FrameworldOutpostEnvironmentalistText]\n\n§T--------------§!\n§LBien que n'étant pas à l'échelle d'une colonie pleinement développée, nos avant-postes peuvent tout de même fournir des ressources précieuses.§!"

	frameworld_outpost_planet_desc_terravore:0 "\n\nExploitation minière planétaire : [FrameworldOutpostTerravoreState]\nFois exploité : §Y[GetFrameworldOutpostTerravoreDamage]/3§!"
	frameworld_outpost_planet_desc_nanite:0 "\n\nAssimilation de nanites : [FrameworldOutpostNaniteState]\nFois assimilé : §Y[GetFrameworldOutpostNaniteDamage]/3§!"
	frameworld_outpost_planet_desc_environmentalist:0 "\n\n£blocker£ Bloqueurs naturels : §Y[GetNaturalBlockerCount]§!"

