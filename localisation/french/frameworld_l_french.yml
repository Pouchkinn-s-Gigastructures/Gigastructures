	giga_situation_frameworld_outposts_type:0 "Réseau de $giga_frameworld_outpost$"
	giga_situation_frameworld_outposts:0 "$giga_situation_frameworld_outposts_type$"
	giga_situation_frameworld_outposts_desc:0 "Les §Y$giga_frameworld_outpost_plural$§! remplacent les colonies pour les empires $origin_frameworld$, et fournissent des bonus de croissance significatifs pour le $pc_giga_frameworld$ lui-même. Le bonus total de notre réseau peut être consulté ici.\n\nLe modificateur de $EMPIRE_SIZE$ est égal au même nombre de colonies, incluant les modificateurs à £mod_empire_size_colonies_mult£ §Y$MOD_EMPIRE_SIZE_COLONIES_MULT_ORIGINAL$§!."

	giga_situation_frameworld_outposts_stage:0 "$giga_situation_frameworld_outposts$"

	giga_situation_frameworld_outposts_monthly_change_tooltip:0 "Cette situation ne progresse pas."

	giga_situation_frameworld_outposts_approach:0 "Opérations normales"
	giga_situation_frameworld_outposts_approach_desc:0 "Exploration et investigation."

