	########################
	### Event Chain Docs ###
	########################

	giga_frameworld_docs_note:99 "\n\n§YLa documentation de l'origine se trouve dans le journal de situation.§!"

	giga_frameworld_docs_chain_title:99 "Documentation du $pc_giga_frameworld$"
	giga_frameworld_docs_chain_desc:99 "L'origine §Y$pc_giga_frameworld$§! offre un style de jeu « Une seule planète », fortement axé sur un unique monde capital. Les vaisseaux coloniaux sont indisponibles, et si la capitale est perdue, vous serez vaincu. Les emplacements de bâtiments sont limités, mais les districts peuvent être étendus indéfiniment.\n\nConsultez les sous-catégories de ce menu pour plus de détails."

	giga_frameworld_docs_expansion:99 "1. Expansion"
	giga_frameworld_docs_expansion_desc:99 "Des districts supplémentaires peuvent être ajoutés via les §YDécisions planétaires§! et la §YRécolte d'astéroïdes§!. Chaque expansion ajoute plusieurs bonus incrémentiels au §Y$pc_giga_frameworld$§!, quelle que soit la méthode utilisée. Tous les bonus d'expansion se trouvent dans le menu §YCaractéristiques planétaires§!.\nLes décisions d'expansion sont de trois types :\n\n- §T$giga_frameworld_expand$§! : Coûte des £alloys£ $alloys$, avec un coût croissant à chaque promulgation. Fournit également un §YEmplacement de bâtiment§! tous les deux usages. Affecté par £mod_megastructures_cost_mult£ §Y$mod_megastructures_cost_mult$§!.\n- §T$giga_frameworld_reorganise$§! : Coûte une grande quantité d'£influence£ $influence$ et accélère plusieurs actions courantes.\n- §T$giga_frameworld_expand_mass$§! : Coûte des £giga_sr_bulk_matter£ $giga_sr_bulk_matter$, et ajoute un au §Y$mod_district_giga_frameworld_mining_max$§! par usage."

	giga_frameworld_docs_asteroids:99 "2. Récolte d'astéroïdes"
	giga_frameworld_docs_asteroids_desc:99 "Le §Y$pc_giga_frameworld$§! peut être étendu en récoltant des astéroïdes avec la mégastructure §Y$frameworld_harvest_0$§!. Chaque astéroïde récolté ajoute un district, une variété de bonus incrémentiels, et ajoute un au §Y$mod_district_giga_frameworld_mining_max$§! par tranche de quatre récoltes. Le coût de récolte s'adapte avec £mod_planet_clear_blocker_cost_mult£ §Y$MOD_COUNTRY_CLEAR_BLOCKER_COST_MULT$§!.\n\nLa récolte d'astéroïdes devrait être votre principal axe d'expansion. Les systèmes avec des astéroïdes récoltables sont indiqués dans leur infobulle de carte galactique :\n\n« $frameworld_has_harvestable_asteroid$ » indique des astéroïdes sans gisements de ressources, idéaux pour la récolte.\n« $frameworld_has_harvestable_asteroid_2$ » indique que seuls des astéroïdes avec des gisements de ressources restent, dont vous voudrez peut-être retarder la récolte.\n« $frameworld_has_harvestable_asteroid_3$ » indique que seuls des astéroïdes avec des gisements de ressources stratégiques restent, qui sont les moins adaptés à la récolte."

	giga_frameworld_docs_outposts:99 "3. $giga_frameworld_outpost_plural$"
	giga_frameworld_docs_outposts_desc:99 "Au lieu de colonies, des §Y$giga_frameworld_outpost_plural$§! peuvent être construits sur les mondes habitables, fournissant plusieurs bonus, notamment une augmentation significative de £mod_planet_pop_assembly_reduction£ §YAssemblage de pops§!. La production de ressources des avant-postes varie selon les caractéristiques et la classe de la planète hôte, avec des productions spéciales disponibles depuis les types de planètes avancés. Les avant-postes devraient être construits dès que possible."

	giga_frameworld_docs_districts:99 "4. Districts"
	giga_frameworld_docs_districts_desc:99 "De nombreux types de districts supplémentaires équivalents à des §Yraffineries§! et des §Ybâtiments de niveau 2§! peuvent être débloqués en recherchant les technologies qui débloquent les bâtiments correspondants.\n\nRechercher £society£ §Y$tech_paradise_dome$§! est particulièrement important pour les empires §Y$civic_machine_servitor$§!, car l'espace pour les bâtiments §Y$building_organic_sanctuary$§! est limité."

	giga_frameworld_docs_conquest:99 "5. Conquête"
	giga_frameworld_docs_conquest_desc:99 "Les mondes conquis verront leur population relocalisée vers le §Y$pc_giga_frameworld$§! au rythme de §Y4 pops par mois§!. Une fois vidés, un §Y$giga_frameworld_outpost$§! sera automatiquement créé au-dessus de l'ancienne colonie.\n\nLes mondes conquis sur des empires §Y$pc_giga_frameworld$§! voient leurs §Y$giga_frameworld_outpost_plural$§! détruits. Les avant-postes détruits peuvent être réparés si le système est récupéré."

	giga_frameworld_docs_stations:99 "6. Stations défensives"
	giga_frameworld_docs_stations_desc:99 "Le §Y$pc_giga_frameworld$§! possède plusieurs stations défensives autour de lui, qui deviennent plus puissantes avec chaque niveau de §YTechnologie de base stellaire§!. Si une station défensive est détruite, elle peut être réparée via une décision planétaire.\n\nL'achèvement de la décision de mise à niveau §Y$giga_frameworld_maginot$§! ajoute trois stations supplémentaires."

	giga_frameworld_docs_disabled:99 "7. Contenu désactivé"
	giga_frameworld_docs_disabled_desc:99 "Plusieurs mégastructures habitables et les technologies pour les débloquer sont §Yindisponibles§! pour les empires §Y$pc_giga_frameworld$§!. §EEn raison des limitations du jeu, les mégastructures indisponibles seront toujours listées sur les technologies qui restent disponibles.§!\n\n$giga_fwm$ Mégastructure verrouillée\n$giga_fwa$ Avantage d'ascension verrouillé\n$giga_fwt$ Technologie verrouillée\n\n$name_alderson$ $giga_fwm$$giga_fwa$\n$name_ringworld_behemoth$ $giga_fwm$\n$name_birch$ $giga_fwm$$giga_fwa$\n$name_eq_shipyard$ $giga_fwm$\n$name_ringworld_gargan$ $giga_fwm$\n$habitat_0$ $giga_fwm$\n$name_interstellar_hab$ $giga_fwm$$giga_fwt$\n$name_interstellar_ring$ $giga_fwm$$giga_fwt$\n$name_discomoon$ $giga_fwm$$giga_fwt$\n$name_maginot$ $giga_fwm$\n$pc_virtual_reality$ $giga_fwm$$giga_fwt$\n$name_orbital_arcology$ $giga_fwm$\n$name_orb_elysium$ $giga_fwm$$giga_fwt$\n$name_penrose_ring$ $giga_fwm$$giga_fwt$\n$pc_ringworld_habitable$ $giga_fwm$\n$name_upgrade_ringworld$ $giga_fwm$\n$name_ringworld_titanic$ $giga_fwm$"
	giga_fwt:99 "£job_researcher£"
	giga_fwa:99 "£mod_country_ascension_perks_add£"
