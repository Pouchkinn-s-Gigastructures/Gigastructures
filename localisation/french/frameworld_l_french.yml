	frameworld_crucible:0 "$gestation_colony$"
	frameworld_crucible_desc:0 "Une initiative dédiée à l'élevage de drones cybernétiques pour en faire des membres productifs du collectif."
	frameworld_crucible_effects:0 "Remplace la moitié des emplois £job_replicator£ §Y$job_replicator$§! de l'expansion et des §Y$giga_frameworld_outpost_plural$§! par des £job_giga_extra_crucible_drone£ §Y$job_giga_extra_crucible_drone_plural$§!\n\n$job_giga_extra_crucible_drone_effect_desc$"

