	frameworld_origin_colony_cost:99 "Pénalité de coût de colonie"
	frameworld_origin_colony_cost_desc:99 "§T§EModificateur de compatibilité :§! Désactiver complètement la construction de $colonizer_plural$ nécessite des écrasements invasifs qui ne sont pas facilement compatibles avec d'autres mods.\n\nSi un $colonizer$ est obtenu d'une manière ou d'une autre, il peut toujours être utilisé pour fonder une colonie, mais les colons seront relocalisés de la même manière qu'un monde conquis.§!\n§T--------------§!\n§LNotre architecture de réseau est fondamentalement incompatible avec les exigences de la colonisation planétaire décentralisée. Nous sommes intrinsèquement liés au Frame.§!"

	frameworld_outpost_bonus:99 "Réseau de $giga_frameworld_outpost$"
	frameworld_outpost_bonus_desc:99 "§LPlus petits que les colonies des autres civilisations spatiales, nos §Y$giga_frameworld_outpost_plural$§! auxiliaires étendent notre influence aux mondes éloignés.§!"

	giga_frameworld_outpost_empire_size_modifier_text:99 " et $giga_frameworld_outpost_plural$"
	giga_frameworld_outpost_pops_modifier_text:99 "Pops supplémentaires lors de la construction de $giga_frameworld_outpost_plural$"

	frameworld_expanded_maintenance_protocol:99 "Protocoles de maintenance étendus"
	frameworld_expanded_maintenance_protocol_desc:99 "Le Frame a constamment besoin de maintenance et d'amélioration. Les chômeurs seront reconvertis et assignés à des tâches secondaires, maintenant et assistant les autres fonctions de la station selon les besoins."
	frameworld_expanded_maintenance_protocol_tooltip:99 "Les pops sans emploi §Yau-delà de la 5e§! sur ce $pc_giga_frameworld$ seront plutôt employées comme £job_frame_maintenance_worker£ §Y$job_frame_maintenance_worker_plural$§!\n\n$job_frame_maintenance_worker_effect_desc$"

	frameworld_expanded_maintenance_protocol_gestalt:99 "$frameworld_expanded_maintenance_protocol$"
	frameworld_expanded_maintenance_protocol_gestalt_desc:99 "Permettre aux drones non assignés de rester inactifs représente un facteur de gaspillage inacceptable. Ces drones seront redistribués vers des tâches secondaires, maintenant et assistant les autres fonctions de la station selon les besoins."
	frameworld_expanded_maintenance_protocol_gestalt_tooltip:99 "Les pops sans emploi §Yau-delà de la 5e§! sur ce $pc_giga_frameworld$ seront plutôt employées comme £job_frame_maintenance_drone£ §Y$job_frame_maintenance_drone_plural$§!\n\n$job_frame_maintenance_drone_effect_desc$"

	frameworld_ai_build_cooldown:99 "Temps de recharge de construction IA du $pc_giga_frameworld$"
