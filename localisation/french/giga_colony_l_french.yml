l_french:

    giga_colony.1.pc_giga_edge_of_eternity:0 "Notre vaisseau colonial s'est délicatement posé sur une grande aire d'atterrissage au spatioport en ruines de l'arcologie sur §Y[Root.GetName]§!. Bien qu'éloigné de la majeure partie de l'ancien complexe arcologique, le spatioport est bien plus sûr que de risquer un atterrissage dans des mers aussi dangereuses.\n\nLe vaisseau a été définitivement converti en quartier général administratif de la nouvelle colonie, et son coeur de réacteur est en cours d'extraction afin de servir de source d'énergie temporaire pour la colonie.\n\nDes centaines d'abris préfabriqués ont surgi à travers les ruines avoisinantes alors que les colons commencent à débarquer en grand nombre — la première cité [Root.Owner.GetSpeciesName] sur un monde extraterrestre."