l_french:

    giga_colony.1.pc_giga_edge_of_eternity:99 "Notre vaisseau colonial s'est doucement posé sur une grande aire d'atterrissage au spatioport en ruines de l'arcologie sur §Y[Root.GetName]§!. Bien qu'éloigné de la masse principale de l'ancien complexe arcologique, le spatioport est bien plus sûr que de risquer un atterrissage dans ces mers si dangereuses.\n\nLe vaisseau a été définitivement converti en quartier général administratif de la nouvelle colonie, et son coeur de réacteur est en cours d'extraction afin de servir de source d'énergie temporaire à la colonie.\n\nDes centaines d'abris préfabriqués ont surgi à travers les ruines environnantes tandis que les colons commencent à débarquer en grand nombre — la première cité [Root.Owner.GetSpeciesName] sur un monde extraterrestre."