l_french:
  #############################################################################################################################################
  ### Orbital Elysium #########################################################################################################################
  #############################################################################################################################################

  mod_giga_elysium_host_stability_add:99 "Stabilité de la planète hôte de l'Élysium"
  mod_giga_elysium_host_jobs_produces_mult:99 "Production des emplois de la planète hôte de l'Élysium"

  giga_elysium_host_planet:99 "Planète hôte de l'$name_orb_elysium$"
  giga_elysium_host_planet_desc:99 "Contrôlée depuis les hauteurs, la gouvernance de cette planète a été largement laissée aux autorités locales tandis que leurs supérieurs observent depuis la station en orbite."

  giga_elysium_origin_fix:99 "Correctif du monde natal de l'origine $name_orb_elysium$"
  giga_elysium_origin_fix_desc:99 "Si vous pouvez voir ce modificateur, quelque chose s'est mal passé !"

  giga_elysium_origin_build_speed:99 "Assemblage de l'origine $name_orb_elysium$"
  giga_elysium_origin_build_speed_desc:99 "Si vous pouvez lire ce modificateur, quelque chose s'est mal passé !"

  giga_elysium_no_host:99 "Soutien planétaire insuffisant"
  giga_elysium_no_host_desc:99 "Sans le soutien des infrastructures sur la planète en contrebas, les habitants de cette station peinent à survivre."

  giga_origin_no_elysium:99 "Aucune supervision orbitale"
  giga_origin_no_elysium_desc:99 "Sans un $name_orb_elysium$ pour les guider depuis les hauteurs, les habitants de ce monde sont désorganisés et inefficaces."

  giga_dismantle_elysium:99 "Démanteler l'$name_orb_elysium$"
  giga_dismantle_elysium_desc:99 "Cette station, et le contrôle étouffant qu'elle procure, ne convient plus à nos besoins."
  giga_dismantle_elysium_tooltip:99 "L'$name_orb_elysium$ sera §Rdétruit§!."

  d_giga_elysium_buildings:99 "Infrastructure de soutien planétaire"
  d_giga_elysium_buildings_desc:99 "§WL'$name_orb_elysium$ gagne un £building£ §Yemplacement de bâtiment§! pour chaque emplacement qui serait débloqué sur le monde hôte.§!\n§W--------------§!\nLoin d'être indépendant de son monde hôte, l'Élysium bénéficie grandement d'une infrastructure de soutien suffisante."

  d_giga_elysium_origin_industry:99 "Zone industrielle abandonnée"
  d_giga_elysium_origin_industry_desc:99 "Vestiges d'une ancienne période de développement industriel, ces installations manufacturières obsolètes ne font désormais qu'entraver le progrès."
  d_giga_elysium_origin_industry_effect:99 "Remplace certains emplois de £job_foundry£ §Y[owner.GetAlloyProducer]§! et [owner.GetArtisanIcon] §Y[owner.GetArtisan]§! par des emplois de §Y[owner.GetClerkOrMaintenanceDrone]§! lorsque la planète possède une désignation §YIndustrielle§!, §YFonderie§! ou §YUsine§!."


  # blocker events

  giga_elysium.002.name:99 "Expansion industrielle non réglementée sur [From.GetName]"
  giga_elysium.002.desc:99 "Notre centre de contrôle sur la station Élysium au-dessus de §Y[From.GetName]§! rapporte qu'en réponse à la hausse du chômage, une augmentation des activités industrielles non autorisées a été observée. Cette §Y$d_giga_elysium_cottage_industry$§! promet des emplois à ceux qui en cherchent, mais s'accompagne de sinistres accointances avec le crime organisé.\n\nSa présence sur [From.GetName] aura probablement un §Yeffet négatif sur la stabilité planétaire§! et pourrait nécessiter une intervention de l'État."
  giga_elysium.002.desc.hive:99 "Notre centre de contrôle sur la station Élysium au-dessus de §Y[From.GetName]§! rapporte qu'en réponse à l'inactivité prolongée des drones, un groupe de gestion local en surface a ordonné la construction d'une §Y$d_giga_elysium_cottage_industry$§!.\n\nBien que cette région nouvellement développée fournisse effectivement des emplois supplémentaires, sa nature semi-autonome engendre des comportements déviants, et elle aura probablement un §Yeffet négatif sur la stabilité planétaire§! à long terme. Une excision pourrait devenir nécessaire."
  giga_elysium.002.desc.machine:99 "Notre centre de contrôle sur la station Élysium au-dessus de §Y[From.GetName]§! rapporte qu'en réponse à l'inactivité prolongée des drones, un sous-esprit de planification structurelle semi-autonome en surface a ordonné la construction d'une §Y$d_giga_elysium_cottage_industry$§!.\n\nBien que cette région nouvellement développée fournisse effectivement des emplois supplémentaires, la qualité de l'intégration avec les systèmes planifiés centralement est médiocre, et elle aura probablement un §Yeffet négatif sur la stabilité planétaire§! à long terme. Une excision pourrait devenir nécessaire."

  MESSAGE_GIGA_ELYSIUM_COTTAGE_INDUSTRY_TITLE:99 "Expansion industrielle non réglementée"
  MESSAGE_GIGA_ELYSIUM_COTTAGE_INDUSTRY:99 "Le chômage élevé sur §Y$PLANET$§! dans le système §Y$SYSTEM$§! a conduit à la construction d'une §Y$d_giga_elysium_cottage_industry$§! pour fournir des emplois."

  d_giga_elysium_cottage_industry:99 "Zone industrielle de fortune"
  d_giga_elysium_cottage_industry_desc:99 "Ces industries artisanales ont été construites par la population inactive pour fournir des emplois."

  giga_elysium.004.name:99 "Expansion urbaine non réglementée sur [From.GetName]"
  giga_elysium.004.desc:99 "Notre centre de contrôle sur la station Élysium au-dessus de §Y[From.GetName]§! rapporte qu'en réponse à l'augmentation du nombre de sans-abri, un groupe de colons démunis a construit un §Y$d_giga_elysium_slums$§! en périphérie d'un établissement majeur.\n\nDifficile à gouverner et encore plus à patrouiller, il sera probablement un refuge pour le crime organisé. Sa présence sur [From.GetName] aura donc probablement un §Yeffet négatif sur la stabilité planétaire§! et pourrait nécessiter une intervention."
  giga_elysium.004.desc.hive:99 "Notre centre de contrôle sur la station Élysium au-dessus de §Y[From.GetName]§! rapporte qu'en réponse à l'augmentation du nombre de sans-abri, un groupe de drones a fait appel à ses instincts de survie et a construit un §Y$d_giga_elysium_slums$§! pour s'abriter.\n\nBien que cette structure nouvellement creusée fournisse effectivement de l'espace de logement supplémentaire, ce dédale labyrinthique devient déjà un refuge pour les éléments déviants de la population planétaire, et aura probablement un §Yeffet négatif sur la stabilité planétaire§! à l'avenir. Une démolition pourrait devenir nécessaire."
  giga_elysium.004.desc.machine:99 "Notre centre de contrôle sur la station Élysium au-dessus de §Y[From.GetName]§! rapporte qu'en réponse à une pénurie critique de zones de stationnement pour drones, un sous-esprit de planification structurelle semi-autonome en surface a ordonné la construction d'un §Y$d_giga_elysium_slums$§!.\n\nBien que cette région nouvellement développée fournisse effectivement un abri aux drones sans logement, sa structure labyrinthique devient déjà un refuge pour les éléments corrompus de notre réseau, et aura probablement un §Yeffet négatif sur la stabilité planétaire§! à l'avenir. Une démolition pourrait devenir nécessaire."

  MESSAGE_GIGA_ELYSIUM_SLUMS_TITLE:99 "Expansion urbaine non réglementée"
  MESSAGE_GIGA_ELYSIUM_SLUMS:99 "Le nombre élevé de sans-abri sur §Y$PLANET$§! dans le système §Y$SYSTEM$§! a conduit à la construction d'un §Y$d_giga_elysium_slums$§! pour fournir un abri."

  d_giga_elysium_slums:99 "Zone d'habitation de fortune"
  d_giga_elysium_slums_desc:99 "Mal planifiés et rongés par les activités déviantes, ces bidonvilles fournissent un espace de vie indispensable."

  giga_elysium.005.name:99 "Bétail relocalisé sur [From.GetName]"
  giga_elysium.005.desc:99 "Notre centre de contrôle sur la station Élysium au-dessus de §Y[From.GetName]§! rapporte qu'en réponse à l'augmentation du nombre de sans-abri parmi nos §Ypops $LIVESTOCK$§!, les autorités locales ont ordonné la construction d'un §Y$d_giga_elysium_livestock_pens$§!.\n\nMoins contrôlés que nos installations standard, les occupants auront une vie moins structurée et cela aura probablement un §Yeffet négatif sur la stabilité planétaire§! à l'avenir. Il pourrait devenir nécessaire de remplacer entièrement l'installation."
  giga_elysium.005.desc.hive:99 "Notre centre de contrôle sur la station Élysium au-dessus de §Y[From.GetName]§! rapporte qu'en réponse à l'augmentation du nombre de sans-abri parmi nos §Ypops $LIVESTOCK$§!, un groupe de gestion local en surface a ordonné la construction d'un §Y$d_giga_elysium_livestock_pens$§!.\n\nMoins contrôlés que nos installations standard, les occupants auront une vie moins structurée et cela aura probablement un §Yeffet négatif sur la stabilité planétaire§! à l'avenir. Il pourrait devenir nécessaire de remplacer entièrement l'installation."
  giga_elysium.005.desc.machine:99 "Notre centre de contrôle sur la station Élysium au-dessus de §Y[From.GetName]§! rapporte qu'en réponse à une pénurie critique de zones de stockage pour nos §Ypops $slavery_matrix$§!, un sous-esprit de planification structurelle semi-autonome en surface a ordonné la construction d'un §Y$d_giga_elysium_livestock_pens$§!.\n\nMoins contrôlés que nos installations standard, il peut contenir des défauts de conception inconnus et aura probablement un §Yeffet négatif sur la stabilité planétaire§! à l'avenir. Il pourrait devenir nécessaire de remplacer entièrement l'installation."

  MESSAGE_GIGA_ELYSIUM_LIVESTOCK_PENS_TITLE:99 "Relocalisation non réglementée du bétail"
  MESSAGE_GIGA_ELYSIUM_LIVESTOCK_PENS:99 "Les £pop£ §Ypops§! de bétail sans abri sur §Y$PLANET$§! dans le système §Y$SYSTEM$§! ont été déplacées vers un §Y$d_giga_elysium_livestock_pens$§! pour leur fournir un abri."

  d_giga_elysium_livestock_pens:99 "Enclos à bétail de fortune"
  d_giga_elysium_livestock_pens_desc:99 "Moins réglementé que nos installations standard, cet enclos accorde à nos « invités » des libertés supplémentaires. Peut-être trop."

  giga_elysium.006.name:99 "[From.GetName] démantelé"
  giga_elysium.006.desc:99 "La station Élysium au-dessus de [fromfrom.GetName] a été démantelée avec succès, restaurant le contrôle à l'administration de surface.\n\nTous les résidents restants ont été relocalisés à la surface de la planète, et les restes de la station ont été désorbités."
  giga_elysium.006.desc.egal:99 "La station Élysium au-dessus de [fromfrom.GetName] a été démantelée avec succès, mettant fin au règne oppressif des élites qui s'y étaient réfugiées.\n\nTous les résidents restants ont été relocalisés à la surface de la planète, et les restes de la station ont été désorbités."
  giga_elysium.006.desc.gestalt:99 "La station Élysium au-dessus de [fromfrom.GetName] a été démantelée avec succès, transférant le contrôle aux installations de surface.\n\nTous les drones restants ont été relocalisés à la surface de la planète, et les restes de la station ont été désorbités."

  giga_elysium.006.good:99 "Bon débarras."

  #########################################
  ### Elysium districts ###################
  #########################################

  district_giga_elysium_housing:99 "District d'habitation"
  district_giga_elysium_housing_plural:99 "Districts d'habitation"
  district_giga_elysium_housing_desc:99 "De spacieux logements nichés au milieu d'une campagne simulée, avec un accès direct à une infrastructure de communication à haut débit."

  district_giga_elysium_control:99 "Centre de contrôle planétaire"
  district_giga_elysium_control_plural:99 "Centres de contrôle planétaire"
  district_giga_elysium_control_desc:99 "Le centre névralgique des opérations planétaires, où les surveillants assurent la conformité de la population en contrebas."

  district_giga_elysium_admin:99 "District administratif"
  district_giga_elysium_admin_plural:99 "Districts administratifs"
  district_giga_elysium_admin_desc:99 "Une vaste installation administrative gérant les communications pour la station et sa planète hôte."

  district_giga_elysium_science:99 "District de recherche"
  district_giga_elysium_science_plural:99 "Districts de recherche"
  district_giga_elysium_science_desc:99 "Des laboratoires de haute technologie où nos esprits les plus brillants peuvent travailler sans distraction."

  district_giga_elysium_entertainment:99 "District de divertissement"
  district_giga_elysium_entertainment_plural:99 "Districts de divertissement"
  district_giga_elysium_entertainment_desc:99 "Un centre de production de médias audiovisuels, capable de produire un flux incessant de contenu pour satisfaire les masses."

  #########################################
  ### Elysium buildings ###################
  #########################################

  building_giga_elysium_host_capital:99 "Centre de contrôle planétaire élysien"
  building_giga_elysium_host_capital_plural:99 "Centres de contrôle planétaire élysiens"
  building_giga_elysium_host_capital_desc:99 "Le siège de la bureaucratie locale, gérant la planète au nom de leurs supérieurs là-haut."

  building_giga_elysium_host_major_capital:99 "Complexe de contrôle planétaire élysien"
  building_giga_elysium_host_major_capital_plural:99 "Complexes de contrôle planétaire élysiens"
  building_giga_elysium_host_major_capital_desc:99 "Un centre administratif majeur, servant d'intermédiaire entre la population locale et ses supérieurs en orbite."

  giga_elysium_dystopian_stability_desc:99 "\n§H$civic_dystopian_society$ :§! Reçoit également §Y50 %§! de la £stability£ §YStabilité§! de l'Élysium en orbite"

  building_giga_elysium_host_hive_capital:99 "Noeud synaptique planétaire élysien"
  building_giga_elysium_host_hive_capital_plural:99 "Noeuds synaptiques planétaires élysiens"
  building_giga_elysium_host_hive_capital_desc:99 "Le relais synaptique principal par lequel l'Esprit-ruche gère les fonctions planétaires."

  building_giga_elysium_host_hive_major_capital:99 "Groupe synaptique planétaire élysien"
  building_giga_elysium_host_hive_major_capital_plural:99 "Groupes synaptiques planétaires élysiens"
  building_giga_elysium_host_hive_major_capital_desc:99 "Un immense relais synaptique par lequel l'Esprit-ruche concentre le développement et la planification planétaires."

  building_giga_elysium_host_machine_capital:99 "Noeud relais planétaire élysien"
  building_giga_elysium_host_machine_capital_plural:99 "Noeuds relais planétaires élysiens"
  building_giga_elysium_host_machine_capital_desc:99 "Un centre relais de signal transmettant les instructions depuis la station bien au-dessus."

  building_giga_elysium_host_machine_major_capital:99 "Nexus relais planétaire élysien"
  building_giga_elysium_host_machine_major_capital_plural:99 "Nexus relais planétaires élysiens"
  building_giga_elysium_host_machine_major_capital_desc:99 "Un puissant centre administratif et relais, traitant les instructions envoyées depuis l'orbite."


  building_giga_elysium_host_jobs:99 "Ministère de l'emploi"
  building_giga_elysium_host_jobs_plural:99 "Ministères de l'emploi"
  building_giga_elysium_host_jobs_desc:99 "Une autorité gouvernementale omniprésente d'où les emplois sont assignés et les quotas émis."
  building_giga_elysium_host_jobs_effect:99 "Fournit §Y$@giga_elysium_jobs_per_100|*0$§! £job£ emplois pour chaque tranche de §Y100§! £pop£ pops sur la planète, adaptés à notre §Ytype d'empire§! et à la §Ydésignation de colonie§! actuelle."
  building_giga_elysium_host_jobs_amenities_effect:99 "Fournit §Y$@giga_elysium_jobs_per_100|*0$§! £job£ emplois pour chaque tranche de §Y100§! £pop£ pops sur la planète, adaptés à notre §Ytype d'empire§! et à la §Ydésignation de colonie§! actuelle, ainsi que des £amenities£ §Yagréments§! supplémentaires par emploi de £job_clerk£ §Y$job_clerk$§!"

  building_giga_elysium_host_hive_jobs:99 "Centre d'assignation des drones"
  building_giga_elysium_host_hive_jobs_plural:99 "Centres d'assignation des drones"
  building_giga_elysium_host_hive_jobs_desc:99 "Une installation abritant un groupe neural semi-autonome, chargé de maintenir la productivité des drones sur toute la planète."

  building_giga_elysium_host_machine_jobs:99 "Centre d'assignation des tâches"
  building_giga_elysium_host_machine_jobs_plural:99 "Centres d'assignation des tâches"
  building_giga_elysium_host_machine_jobs_desc:99 "Un noeud de calcul qui distribue les tâches aux drones inactifs sur toute la planète."

  building_giga_elysium_host_booster:99 "Secteur industriel supplémentaire"
  building_giga_elysium_host_booster_plural:99 "Secteurs industriels supplémentaires"
  building_giga_elysium_host_booster_desc:99 "Une vaste région industrielle construite pour augmenter la productivité planétaire."
  building_giga_elysium_host_booster_effect:99 "Fournit des bonus à la £job£ §Yproductivité des emplois§! selon la §Ydésignation de colonie§!, et exploite tous les gisements de £volatile_motes£ £exotic_gases£ £rare_crystals£ §Yressources stratégiques§!, fournissant des emplois d'extraction"

  building_giga_elysium_trash_heap:99 "Énorme tas d'ordures"
  building_giga_elysium_trash_heap_desc:99 "D'immenses monceaux de débris variés, jetés par les habitants de la station au-dessus. Des récupérateurs fouillent les détritus, cherchant des luxes abandonnés."
  building_giga_elysium_trash_heap_effect:99 "Fournit des §Y$amenity$§! égaux à §Y$@giga_elysium_trash_amenities|%0$§! des §Y$amenity$ disponibles§! sur l'§Y$orbital_elysium$§!"

  #########################################
  ### Elysium jobs ########################
  #########################################

  job_giga_elysium_controller:99 "Surveillant élysien"
  job_giga_elysium_controller_plural:99 "Surveillants élysiens"
  job_giga_elysium_controller_desc:99 "Ceux au pouvoir ont le devoir de maintenir le contrôle sur les masses incultes."
  job_giga_elysium_controller_effect_desc:99 "Les $job_giga_elysium_controller_swap_plural_with_icon$ transforment les £consumer_goods£ §Y$consumer_goods$§! en £stability£ §Ystabilité§! pour la planète hôte de la station"
  job_giga_elysium_controller_swap_plural_with_icon:99 "[giga_elysium_controller.GetIcon] [giga_elysium_controller.GetNamePlural]"
  mod_job_giga_elysium_controller_add:99 "Emplois de [giga_elysium_controller.GetName]"
  mod_job_giga_elysium_controller_per_pop:99 "§G+1§! emploi de [giga_elysium_controller.GetName] par tranche de $VALUE$ pops"
  mod_job_giga_elysium_controller_per_pop_short:99 "\n§G+1§! £mod_job_giga_elysium_controller_add£ par tranche de $VALUE$ £pop£"

  job_giga_elysium_controller_drone:99 "Drone surveillant élysien"
  job_giga_elysium_controller_drone_plural:99 "Drones surveillants élysiens"
  job_giga_elysium_controller_drone_desc:99 "Ces drones gèrent les opérations planétaires depuis les hauteurs, maintenant l'ordre sur une planète autrement potentiellement chaotique."
  job_giga_elysium_controller_drone_effect_desc:99 "Les $job_giga_elysium_controller_drone_swap_plural_with_icon$ transforment l'£energy£ §Y$energy$§! en £stability£ §Y$MOD_PLANET_STABILITY_ADD$§! pour la planète hôte de la station"
  job_giga_elysium_controller_drone_swap_plural_with_icon:99 "[giga_elysium_controller_drone.GetIcon] [giga_elysium_controller_drone.GetNamePlural]"
  mod_job_giga_elysium_controller_drone_add:99 "Emplois de [giga_elysium_controller_drone.GetName]"
  mod_job_giga_elysium_controller_drone_per_pop:99 "§G+1§! emploi de [giga_elysium_controller_drone.GetName] par tranche de $VALUE$ pops"
  mod_job_giga_elysium_controller_drone_per_pop_short:99 "\n§G+1§! £mod_job_giga_elysium_controller_add£ par tranche de $VALUE$ £pop£"

  # extra bit for the origin effect
  job_giga_elysium_controller_origin_effect_desc:99 "et la £job£ §Yproduction des emplois§! "
  giga_elysium_from_station:99 "Depuis l'$orbital_elysium$"