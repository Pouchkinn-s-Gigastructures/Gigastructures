l_french:
  #############################################################################################################################################
  ### Orbital Elysium #########################################################################################################################
  #############################################################################################################################################

  mod_giga_elysium_host_stability_add:0 "Stabilité de la planète hôte de l'Élysium"
  mod_giga_elysium_host_jobs_produces_mult:0 "Production des emplois de la planète hôte de l'Élysium"

  giga_elysium_host_planet:0 "Planète hôte de l'$name_orb_elysium$"
  giga_elysium_host_planet_desc:0 "Contrôlée depuis les hauteurs, la gouvernance de cette planète a été largement laissée aux mains des autorités de surface tandis que leurs supérieurs observent depuis la station en orbite."

  giga_elysium_origin_fix:0 "Correction du monde natal de l'origine $name_orb_elysium$"
  giga_elysium_origin_fix_desc:0 "Si vous pouvez voir ce modificateur, quelque chose s'est mal passé !"

  giga_elysium_origin_build_speed:0 "Assemblage de l'origine $name_orb_elysium$"
  giga_elysium_origin_build_speed_desc:0 "Si vous pouvez lire ce modificateur, quelque chose s'est mal passé !"

  giga_elysium_no_host:0 "Soutien planétaire insuffisant"
  giga_elysium_no_host_desc:0 "Sans le soutien des infrastructures de la planète ci-dessous, les habitants de cette station sont en difficulté."

  giga_origin_no_elysium:0 "Aucune supervision orbitale"
  giga_origin_no_elysium_desc:0 "Sans un $name_orb_elysium$ pour les guider depuis les hauteurs, les habitants de ce monde sont désorganisés et inefficaces."

  giga_dismantle_elysium:0 "Déclasser l'$name_orb_elysium$"
  giga_dismantle_elysium_desc:0 "Cette station, et le contrôle étouffant qu'elle offre, ne correspondent plus à nos besoins."
  giga_dismantle_elysium_tooltip:0 "L'$name_orb_elysium$ sera §Rdétruit§!."

  d_giga_elysium_buildings:0 "Infrastructure de soutien planétaire"
  d_giga_elysium_buildings_desc:0 "§WL'$name_orb_elysium$ gagne un £building£ §YEmplacement de bâtiment§! pour chaque emplacement qui serait débloqué sur le monde hôte.§!\n§W--------------§!\nLoin d'être indépendant de son monde hôte, l'Élysium bénéficie grandement d'une infrastructure de soutien suffisante."

  d_giga_elysium_origin_industry:0 "Zone industrielle abandonnée"
  d_giga_elysium_origin_industry_desc:0 "Vestiges d'une période antérieure de développement industriel, ces installations de fabrication obsolètes ne font plus qu'entraver le progrès."
  d_giga_elysium_origin_industry_effect:0 "Remplace certains emplois de £job_foundry£ §Y[owner.GetAlloyProducer]§! et [owner.GetArtisanIcon] §Y[owner.GetArtisan]§! par des emplois de §Y[owner.GetClerkOrMaintenanceDrone]§! lorsque la planète a une désignation §YIndustrielle§!, de §YFonderie§! ou d'§YUsine§!."


  # blocker events

  giga_elysium.002.name:0 "Expansion industrielle non réglementée sur [From.GetName]"
  giga_elysium.002.desc:0 "Notre centre de contrôle sur la station Élysium au-dessus de §Y[From.GetName]§! rapporte qu'en réponse à la montée du chômage, il y a eu une augmentation de l'activité industrielle non autorisée. Cette §Y$d_giga_elysium_cottage_industry$§! promet des emplois à ceux qui en cherchent, mais porte en elle les sombres implications du crime organisé.\n\nSa présence sur [From.GetName] aura probablement un §Yeffet négatif sur la stabilité planétaire§!, et pourrait nécessiter une intervention de l'État."
  giga_elysium.002.desc.hive:0 "Notre centre de contrôle sur la station Élysium au-dessus de §Y[From.GetName]§! rapporte qu'en réponse à l'inactivité prolongée des drones, un cluster de gestion local à la surface a ordonné la construction d'une §Y$d_giga_elysium_cottage_industry$§!.\n\nBien que cette région nouvellement développée fournisse effectivement des emplois supplémentaires, sa nature semi-autonome donne lieu à une activité déviante, et elle aura probablement un §Yeffet négatif sur la stabilité planétaire§! à long terme. Une excision pourrait devenir nécessaire."
  giga_elysium.002.desc.machine:0 "Notre centre de contrôle sur la station Élysium au-dessus de §Y[From.GetName]§! rapporte qu'en réponse à l'inactivité prolongée des drones, un sous-esprit de planification structurelle semi-autonome à la surface a ordonné la construction d'une §Y$d_giga_elysium_cottage_industry$§!.\n\nBien que cette région nouvellement développée fournisse effectivement des emplois supplémentaires, la qualité de l'intégration avec les systèmes planifiés centralement est médiocre, et elle aura probablement un §Yeffet négatif sur la stabilité planétaire§! à long terme. Une excision pourrait devenir nécessaire."

  MESSAGE_GIGA_ELYSIUM_COTTAGE_INDUSTRY_TITLE:0 "Expansion industrielle non réglementée"
  MESSAGE_GIGA_ELYSIUM_COTTAGE_INDUSTRY:0 "Le chômage élevé sur §Y$PLANET$§! dans le système §Y$SYSTEM$§! a conduit à la construction d'une §Y$d_giga_elysium_cottage_industry$§! pour fournir des emplois."

  d_giga_elysium_cottage_industry:0 "Zone industrielle de fortune"
  d_giga_elysium_cottage_industry_desc:0 "Ces industries artisanales ont été construites par la population inactive pour fournir des emplois."

  giga_elysium.004.name:0 "Expansion urbaine non réglementée sur [From.GetName]"
  giga_elysium.004.desc:0 "Notre centre de contrôle sur la station Élysium au-dessus de §Y[From.GetName]§! rapporte qu'en réponse à la montée du sans-abrisme, un groupe de colons déshérités a construit un §Y$d_giga_elysium_slums$§! en périphérie d'une agglomération majeure.\n\nDifficile à gouverner et encore plus difficile à patrouiller, il sera probablement un refuge pour le crime organisé. En tant que tel, sa présence sur [From.GetName] aura probablement un §Yeffet négatif sur la stabilité planétaire§!, et pourrait nécessiter une intervention."
  giga_elysium.004.desc.hive:0 "Notre centre de contrôle sur la station Élysium au-dessus de §Y[From.GetName]§! rapporte qu'en réponse à un niveau croissant de sans-abrisme, un groupe de drones s'est rabattu sur ses instincts de survie et a construit un §Y$d_giga_elysium_slums$§! pour s'abriter.\n\nBien que cette structure nouvellement creusée fournisse effectivement un espace de logement supplémentaire, ce dédale labyrinthique devient déjà un refuge pour les éléments déviants de la population planétaire, et aura probablement un §Yeffet négatif sur la stabilité planétaire§! à l'avenir. Une démolition pourrait devenir nécessaire."
  giga_elysium.004.desc.machine:0 "Notre centre de contrôle sur la station Élysium au-dessus de §Y[From.GetName]§! rapporte qu'en réponse à une pénurie critique de zones de stationnement pour drones, un sous-esprit de planification structurelle semi-autonome à la surface a ordonné la construction d'un §Y$d_giga_elysium_slums$§!.\n\nBien que cette région nouvellement développée fournisse effectivement un abri aux drones sans logement, sa structure labyrinthique devient déjà un refuge pour les éléments corrompus de notre réseau, et aura probablement un §Yeffet négatif sur la stabilité planétaire§! à l'avenir. Une démolition pourrait devenir nécessaire."

  MESSAGE_GIGA_ELYSIUM_SLUMS_TITLE:0 "Expansion urbaine non réglementée"
  MESSAGE_GIGA_ELYSIUM_SLUMS:0 "Le sans-abrisme élevé sur §Y$PLANET$§! dans le système §Y$SYSTEM$§! a conduit à la construction d'un §Y$d_giga_elysium_slums$§! pour fournir un abri."

  d_giga_elysium_slums:0 "Zone d'habitat de fortune"
  d_giga_elysium_slums_desc:0 "Mal planifiés et gangrenés par l'activité déviante, ces bidonvilles fournissent un espace de vie indispensable."

  giga_elysium.005.name:0 "Bétail relocalisé sur [From.GetName]"
  giga_elysium.005.desc:0 "Notre centre de contrôle sur la station Élysium au-dessus de §Y[From.GetName]§! rapporte qu'en réponse à la montée du sans-abrisme parmi nos §Ypops $LIVESTOCK$§!, les autorités locales ont ordonné la construction d'un §Y$d_giga_elysium_livestock_pens$§!.\n\nMoins contrôlés que nos installations standard, les habitants auront une vie moins structurée et cela aura probablement un §Yeffet négatif sur la stabilité planétaire§! à l'avenir. Il pourrait devenir nécessaire de remplacer entièrement l'installation."
  giga_elysium.005.desc.hive:0 "Notre centre de contrôle sur la station Élysium au-dessus de §Y[From.GetName]§! rapporte qu'en réponse à la montée du sans-abrisme parmi nos §Ypops $LIVESTOCK$§!, un cluster de gestion local à la surface a ordonné la construction d'un §Y$d_giga_elysium_livestock_pens$§!.\n\nMoins contrôlés que nos installations standard, les habitants auront une vie moins structurée et cela aura probablement un §Yeffet négatif sur la stabilité planétaire§! à l'avenir. Il pourrait devenir nécessaire de remplacer entièrement l'installation."
  giga_elysium.005.desc.machine:0 "Notre centre de contrôle sur la station Élysium au-dessus de §Y[From.GetName]§! rapporte qu'en réponse à une pénurie critique de zones de stockage pour nos §Ypops $slavery_matrix$§!, un sous-esprit de planification structurelle semi-autonome à la surface a ordonné la construction d'un §Y$d_giga_elysium_livestock_pens$§!.\n\nMoins contrôlés que nos installations standard, il pourrait contenir des défauts de conception inconnus et aura probablement un §Yeffet négatif sur la stabilité planétaire§! à l'avenir. Il pourrait devenir nécessaire de remplacer entièrement l'installation."

  MESSAGE_GIGA_ELYSIUM_LIVESTOCK_PENS_TITLE:0 "Relocalisation non réglementée du bétail"
  MESSAGE_GIGA_ELYSIUM_LIVESTOCK_PENS:0 "Les £pop£ §YPops§! de bétail sans abri sur §Y$PLANET$§! dans le système §Y$SYSTEM$§! ont été déplacées dans un §Y$d_giga_elysium_livestock_pens$§! pour leur fournir un abri."

  d_giga_elysium_livestock_pens:0 "Enclos à bétail de fortune"
  d_giga_elysium_livestock_pens_desc:0 "Moins réglementé que nos installations standard, cet enclos accorde à nos « invités » des libertés supplémentaires. Peut-être trop."

  giga_elysium.006.name:0 "[From.GetName] déclassé"
  giga_elysium.006.desc:0 "La station Élysium au-dessus de [fromfrom.GetName] a été démantelée avec succès, restaurant le contrôle à l'administration de surface.\n\nTous les résidents restants ont été relocalisés à la surface de la planète, et les restes de la station ont été désorbités."
  giga_elysium.006.desc.egal:0 "La station Élysium au-dessus de [fromfrom.GetName] a été démantelée avec succès, mettant fin au règne oppressif des élites qui s'y étaient réfugiées.\n\nTous les résidents restants ont été relocalisés à la surface de la planète, et les restes de la station ont été désorbités."
  giga_elysium.006.desc.gestalt:0 "La station Élysium au-dessus de [fromfrom.GetName] a été démantelée avec succès, transférant le contrôle aux installations de surface.\n\nTous les drones restants ont été relocalisés à la surface de la planète, et les restes de la station ont été désorbités."

  giga_elysium.006.good:0 "Bon débarras."

  #########################################
  ### Elysium districts ###################
  #########################################

  district_giga_elysium_housing:0 "District d'habitation"
  district_giga_elysium_housing_plural:0 "Districts d'habitation"
  district_giga_elysium_housing_desc:0 "Des logements spacieux nichés dans une campagne simulée, avec un accès direct à une infrastructure de communications à haut débit."

  district_giga_elysium_control:0 "Centre de contrôle planétaire"
  district_giga_elysium_control_plural:0 "Centres de contrôle planétaire"
  district_giga_elysium_control_desc:0 "Le centre névralgique des opérations de surface, où les superviseurs assurent la conformité de la population en contrebas."

  district_giga_elysium_admin:0 "District administratif"
  district_giga_elysium_admin_plural:0 "Districts administratifs"
  district_giga_elysium_admin_desc:0 "Une vaste installation administrative, gérant les communications pour la station et sa planète hôte."

  district_giga_elysium_science:0 "District de recherche"
  district_giga_elysium_science_plural:0 "Districts de recherche"
  district_giga_elysium_science_desc:0 "Des laboratoires de haute technologie où nos esprits les plus brillants peuvent travailler sans distraction."

  district_giga_elysium_entertainment:0 "District de divertissement"
  district_giga_elysium_entertainment_plural:0 "Districts de divertissement"
  district_giga_elysium_entertainment_desc:0 "Un centre de production de médias de diffusion, capable de produire un flux incessant de contenu pour satisfaire les masses."

  #########################################
  ### Elysium buildings ###################
  #########################################

  building_giga_elysium_host_capital:0 "Centre de contrôle planétaire de l'Élysium"
  building_giga_elysium_host_capital_plural:0 "Centres de contrôle planétaire de l'Élysium"
  building_giga_elysium_host_capital_desc:0 "Le siège de la bureaucratie locale, gérant la planète au nom de ses supérieurs au-dessus."

  building_giga_elysium_host_major_capital:0 "Complexe de contrôle planétaire de l'Élysium"
  building_giga_elysium_host_major_capital_plural:0 "Complexes de contrôle planétaire de l'Élysium"
  building_giga_elysium_host_major_capital_desc:0 "Un centre administratif majeur, servant d'intermédiaire entre la population locale et ses supérieurs en orbite."

  giga_elysium_dystopian_stability_desc:0 "\n§H$civic_dystopian_society$ :§! Reçoit également §Y50 %§! de la £stability£ §YStabilité§! de l'Élysium en orbite"

  building_giga_elysium_host_hive_capital:0 "Nœud synaptique planétaire de l'Élysium"
  building_giga_elysium_host_hive_capital_plural:0 "Nœuds synaptiques planétaires de l'Élysium"
  building_giga_elysium_host_hive_capital_desc:0 "Le relais synaptique principal par lequel l'esprit de ruche gère les fonctions de surface."

  building_giga_elysium_host_hive_major_capital:0 "Cluster synaptique planétaire de l'Élysium"
  building_giga_elysium_host_hive_major_capital_plural:0 "Clusters synaptiques planétaires de l'Élysium"
  building_giga_elysium_host_hive_major_capital_desc:0 "Un immense relais synaptique par lequel l'esprit de ruche concentre le développement et la planification planétaires."

  building_giga_elysium_host_machine_capital:0 "Nœud relais planétaire de l'Élysium"
  building_giga_elysium_host_machine_capital_plural:0 "Nœuds relais planétaires de l'Élysium"
  building_giga_elysium_host_machine_capital_desc:0 "Un hub de relais de signaux transmettant les instructions depuis la station loin au-dessus."

  building_giga_elysium_host_machine_major_capital:0 "Nexus relais planétaire de l'Élysium"
  building_giga_elysium_host_machine_major_capital_plural:0 "Nexus relais planétaires de l'Élysium"
  building_giga_elysium_host_machine_major_capital_desc:0 "Un puissant hub administratif et centre de relais, traitant les instructions envoyées depuis l'orbite."


  building_giga_elysium_host_jobs:0 "Ministère de l'emploi"
  building_giga_elysium_host_jobs_plural:0 "Ministères de l'emploi"
  building_giga_elysium_host_jobs_desc:0 "Une autorité gouvernementale omniprésente qui attribue les emplois et émet les quotas."
  building_giga_elysium_host_jobs_effect:0 "Fournit §Y$@giga_elysium_jobs_per_100|*0$§! £job£ emplois pour chaque §Y100§! £pop£ pops sur la planète, adaptés à notre §YType d'empire§! et à la §YDésignation de colonie§! actuelle."
  building_giga_elysium_host_jobs_amenities_effect:0 "Fournit §Y$@giga_elysium_jobs_per_100|*0$§! £job£ emplois pour chaque §Y100§! £pop£ pops sur la planète, adaptés à notre §YType d'empire§! et à la §YDésignation de colonie§! actuelle, ainsi que des £amenities£ §YAgréments§! supplémentaires par emploi de £job_clerk£ §Y$job_clerk$§!"

  building_giga_elysium_host_hive_jobs:0 "Centre d'affectation des drones"
  building_giga_elysium_host_hive_jobs_plural:0 "Centres d'affectation des drones"
  building_giga_elysium_host_hive_jobs_desc:0 "Une installation abritant un cluster neural semi-autonome, chargé de maintenir la productivité des drones sur toute la planète."

  building_giga_elysium_host_machine_jobs:0 "Hub d'attribution des tâches"
  building_giga_elysium_host_machine_jobs_plural:0 "Hubs d'attribution des tâches"
  building_giga_elysium_host_machine_jobs_desc:0 "Un nœud computationnel qui distribue les tâches aux drones inactifs sur toute la planète."

  building_giga_elysium_host_booster:0 "Secteur industriel supplémentaire"
  building_giga_elysium_host_booster_plural:0 "Secteurs industriels supplémentaires"
  building_giga_elysium_host_booster_desc:0 "Une vaste région industrielle construite pour augmenter la productivité planétaire."
  building_giga_elysium_host_booster_effect:0 "Fournit des bonus à la £job£ §YProductivité des emplois§! selon la §YDésignation de colonie§!, et exploite tous les gisements de £volatile_motes£ £exotic_gases£ £rare_crystals£ §YRessources stratégiques§!, fournissant des emplois d'extraction"

  building_giga_elysium_trash_heap:0 "Énorme tas de déchets"
  building_giga_elysium_trash_heap_desc:0 "D'immenses tas de débris assortis, jetés par les habitants de la station au-dessus. Des récupérateurs fouillent les détritus, cherchant des luxes jetés."
  building_giga_elysium_trash_heap_effect:0 "Fournit des §Y$amenity$§! égaux à §Y$@giga_elysium_trash_amenities|%0$§! des §Y$amenity$ disponibles§! sur l'§Y$orbital_elysium$§!"

  #########################################
  ### Elysium jobs ########################
  #########################################

  job_giga_elysium_controller:0 "Superviseur élyséen"
  job_giga_elysium_controller_plural:0 "Superviseurs élyséens"
  job_giga_elysium_controller_desc:0 "Ceux qui sont au pouvoir ont le devoir de maintenir le contrôle sur les masses ignorantes."
  job_giga_elysium_controller_effect_desc:0 "Les $job_giga_elysium_controller_swap_plural_with_icon$ transforment les £consumer_goods£ §Y$consumer_goods$§! en £stability£ §YStabilité§! pour la planète hôte de la station"
  job_giga_elysium_controller_swap_plural_with_icon:0 "[giga_elysium_controller.GetIcon] [giga_elysium_controller.GetNamePlural]"
  mod_job_giga_elysium_controller_add:0 "Emplois de [giga_elysium_controller.GetName]"
  mod_job_giga_elysium_controller_per_pop:0 "§G+1§! emploi de [giga_elysium_controller.GetName] par $VALUE$ pops"
  mod_job_giga_elysium_controller_per_pop_short:0 "\n§G+1§! £mod_job_giga_elysium_controller_add£ par $VALUE$ £pop£"

  job_giga_elysium_controller_drone:0 "Drone superviseur élyséen"
  job_giga_elysium_controller_drone_plural:0 "Drones superviseurs élyséens"
  job_giga_elysium_controller_drone_desc:0 "Ces drones gèrent les opérations de surface depuis les hauteurs, maintenant l'ordre sur une planète autrement potentiellement chaotique."
  job_giga_elysium_controller_drone_effect_desc:0 "Les $job_giga_elysium_controller_drone_swap_plural_with_icon$ transforment l'£energy£ §Y$energy$§! en £stability£ §Y$MOD_PLANET_STABILITY_ADD$§! pour la planète hôte de la station"
  job_giga_elysium_controller_drone_swap_plural_with_icon:0 "[giga_elysium_controller_drone.GetIcon] [giga_elysium_controller_drone.GetNamePlural]"
  mod_job_giga_elysium_controller_drone_add:0 "Emplois de [giga_elysium_controller_drone.GetName]"
  mod_job_giga_elysium_controller_drone_per_pop:0 "§G+1§! emploi de [giga_elysium_controller_drone.GetName] par $VALUE$ pops"
  mod_job_giga_elysium_controller_drone_per_pop_short:0 "\n§G+1§! £mod_job_giga_elysium_controller_add£ par $VALUE$ £pop£"

  # extra bit for the origin effect
  job_giga_elysium_controller_origin_effect_desc:0 "et la £job£ §YProduction des emplois§! "
  giga_elysium_from_station:0 "Depuis l'$orbital_elysium$"