 giga_amb_ai_details:0 "Limite de construction IA : §Y[This.giga_amb_ai_limit]§!\n\n"

 ############################################################################################################
 # SUBJECT TERMS

 giga_supertensiles_subsidies:0 "Contribution à la mégaconstruction"
 giga_supertensiles_subsidies_desc:0 "Ce terme dicte la quantité de £giga_sr_amb_megaconstruction£ §Y$giga_sr_amb_megaconstruction$§! que le sujet est obligé de payer au suzerain chaque mois. Le nombre est un pourcentage de la production mensuelle actuelle du sujet.\n\nUne valeur négative signifie que le suzerain est obligé de payer le sujet plutôt que l'inverse, mais elle est toujours basée sur un pourcentage de la production mensuelle actuelle du sujet.\n\n§ECe terme est dans une catégorie séparée en raison d'une limitation du moteur où les catégories de ressources conditionnellement masquées cassent les accords de sujétion. Si le problème est corrigé, il sera replacé dans la catégorie Contribution.§!"

 giga_resource_subsidies_supertensiles:0 "Supertensiles"

 giga_supertensiles_prospectorium_bonus_subject_1:0 "$mod_country_giga_sr_amb_megaconstruction_produces_mult$ : §G+10 %§!\nCe bonus augmente avec le niveau de spécialiste."
 giga_supertensiles_prospectorium_bonus_subject_2:0 "$mod_country_giga_sr_amb_megaconstruction_produces_mult$ : §G+20 %§!\nCe bonus augmente avec le niveau de spécialiste."
 giga_supertensiles_prospectorium_bonus_subject_3:0 "$mod_country_giga_sr_amb_megaconstruction_produces_mult$ : §G+30 %§!\nCe bonus augmente avec le niveau de spécialiste."

 ############################################################################################################
 # BUILDINGS

 building_giga_megaworkshop:0 "Fonderie moléculaire"
 building_giga_megaworkshop_plural:0 "Fonderies moléculaires"
 building_giga_megaworkshop_desc:0 "Des réseaux de synthèse moléculaire et des salles blanches immaculées remplissent ces installations, produisant les matériaux hautement spécialisés requis pour les projets de construction orbitale à grande échelle."
 mod_planet_building_giga_megaworkshop_build_speed_mult:0 "Vitesse de construction de $building_giga_megaworkshop$"

 building_giga_megaworkshop_hub:0 "Centre logistique de mégaconstruction"
 building_giga_megaworkshop_hub_plural:0 "Centres logistiques de mégaconstruction"
 building_giga_megaworkshop_hub_desc:0 "Des experts coordonnent une vaste flotte de vaisseaux de transport et de construction, portant leurs grands desseins, tandis que les fonderies moléculaires produisent d'énormes quantités de matériaux de construction."
 building_giga_megaworkshop_hub_count_condition:0 ""
 mod_planet_building_giga_megaworkshop_hub_build_speed_mult:0 "Vitesse de construction de $building_giga_megaworkshop_hub$"

 building_giga_supertensiles_mines:0 "Extracteurs de $giga_sr_amb_megaconstruction$"
 building_giga_supertensiles_mines_plural:0 "Extracteurs de $giga_sr_amb_megaconstruction$"
 building_giga_supertensiles_mines_desc:0 "Dans de rares cas, les bonnes conditions peuvent permettre à des matériaux d'une résistance improbable de se former dans la nature."
 mod_building_giga_supertensiles_mines_max:0 "$building_giga_supertensiles_mines$ max."

 building_giga_living_metal_infusion_plant:0 "Usine d'infusion de métal vivant"
 building_giga_living_metal_infusion_plant_plural:0 "Usines d'infusion de métal vivant"
 building_giga_living_metal_infusion_plant_desc:0 "Incorporer les propriétés régénératives du métal vivant dans nos processus de fabrication sera un grand atout pour nos projets de construction spatiale lointaine."

 building_giga_fe_megaworkshop:0 "Nano-assembleur"
 building_giga_fe_megaworkshop_plural:0 "Nano-assembleurs"
 building_giga_fe_megaworkshop_desc:0 "D'immenses réseaux de synthèse moléculaire travaillent en tandem avec des baies de réplicateurs pour transformer les minéraux bruts en matériaux pour la construction orbitale."

 building_giga_fe_megaworkshop_2:0 "Creuset polyatomique"
 building_giga_fe_megaworkshop_2_plural:0 "Creusets polyatomiques"
 building_giga_fe_megaworkshop_2_desc:0 "Ces installations tordent la gravité pour lier les atomes en arrangements stables autrefois considérés impossibles."

 holding_giga_megaworkshop:0 "Quai d'exportation mégalogistique"
 holding_giga_megaworkshop_plural:0 "Quais d'exportation mégalogistiques"
 holding_giga_megaworkshop_desc:0 "Des fonderies moléculaires appartenant à un empire étranger utilisent les ressources locales pour alimenter des projets de construction lointains. Certains pourraient même les appeler des projets de prestige."
 ove_requires_giga_tech_amb_supertensiles:0 "$overlord_has_technology$ £physics£ §Y$giga_tech_amb_supertensiles$§!"

