 ############################################################################################################
 # COUNTRY MODIFIERS

 giga_amb_base:99 "Mécaniques de mégaconstruction basées sur les emplois"
 giga_amb_base_tooltip:99 "Notre $MOD_MEGASTRUCTURE_BUILD_SPEED_ADD$ est basée sur les revenus de notre empire en £giga_sr_amb_megaconstruction£ §Y$giga_sr_amb_megaconstruction$§!.\n\nChaque mois, lorsqu'au moins une mégastructure est en construction, jusqu'au double de nos revenus en £giga_sr_amb_megaconstruction£ §Y$giga_sr_amb_megaconstruction$§! est soustrait de nos stocks et converti en $MOD_MEGASTRUCTURE_BUILD_SPEED_ADD$. Cette valeur est ensuite répartie entre toutes les mégastructures en construction, et est soumise à des rendements décroissants §Yaprès§! la répartition.\n\nConsultez le modificateur d'empire §Y$giga_amb_speed$§! pour plus de détails sur le calcul de la vitesse."
 giga_amb_base_desc:99 "§LUn personnel qualifié et des matériaux spécialisés sont nécessaires pour surpasser les étoiles elles-mêmes.§!"

 giga_amb_storage_capacity:99 "Limite de stockage de $giga_sr_amb_megaconstruction$"
 giga_amb_storage_capacity_tooltip:99 "La capacité de stockage de £giga_sr_amb_megaconstruction£ §Y$giga_sr_amb_megaconstruction$§! est limitée et n'est pas augmentée par les modificateurs généraux de £mod_country_resource_max_add£ §Y$MOD_COUNTRY_RESOURCE_MAX_ADD$§!"
 giga_amb_storage_capacity_desc:99 "§LRares et précieux, nos matériaux les plus avancés doivent être stockés avec le plus grand soin.§!"

 giga_amb_speed:99 "Vitesse de mégaconstruction"
 giga_amb_speed_desc:99 "§LAvec des experts et des matériaux en quantité limitée, nous devons choisir avec soin où les déployer.§!"

 giga_amb_flat_replacement:99 "Compatibilité de mégaconstruction"
 giga_amb_flat_replacement_desc:99 "Un autre mod fournit une source de $MOD_MEGASTRUCTURE_BUILD_SPEED_ADD$. Ce modificateur l'annule et fournit un bonus de remplacement adapté au système de mégaconstruction basé sur les emplois.\n§W--------------§!\n§LUne correction concise de la méthodologie à méga-échelle.§!"

 giga_amb_ai_limit:99 "Limite IA de mégaconstruction"
 giga_amb_ai_limit_tooltip:99 "Limite artificiellement le nombre de mégastructures que l'IA peut construire simultanément, car elle ne comprend pas le concept de répartition de sa vitesse de construction entre plusieurs projets, et a tendance à la disperser trop finement lorsque de nombreux projets sont disponibles.\n\nTentera généralement de maintenir une vitesse de 0,75 à 0,5 par projet à la limite maximale. Mise à jour annuelle.\n\nConsultez le modificateur d'empire §Y$giga_amb_speed$§! pour la valeur limite."
 giga_amb_ai_limit_desc:99 "§L« Pourquoi construis-tu DIX segments de monde-anneau avec une vitesse de 1,4 ?! » — TTFTCUTS§!"

 giga_amb_empire_size_penalty:99 "Pénalités de taille d'empire pour la mégaconstruction"
 giga_amb_empire_size_penalty_desc:99 "§LÀ mesure que notre charge administrative augmente, la coordination des projets entre nos mondes devient plus difficile.§!"

 giga_amb_starting_megas_upkeep_offset:99 "Soutien à l'entretien des mégastructures de départ"
 giga_amb_starting_megas_upkeep_offset_desc:99 "Paie l'entretien de base en $giga_sr_amb_megaconstruction$ de toute mégastructure possédée au début de la partie.\n\n§LLaisser nos installations spatiales les plus importantes sans entretien serait de la pure négligence.§!"

 ############################################################################################################
 # RESOURCES

 giga_sr_amb_megaconstruction:99 "Matériaux supertensiles"
 giga_sr_amb_megaconstruction_desc_only:99 "Capables de résister à des niveaux incroyables de contrainte de traction, ces matériaux avancés sont essentiels à la construction des plus grandes installations spatiales."
 giga_sr_amb_megaconstruction_desc:99 "$giga_sr_amb_megaconstruction_desc_only$\n\n§LCette ressource est utilisée lorsque l'option §YLimite de construction de mégastructures§! dans le menu de personnalisation Gigastructures est réglée sur §YBasée sur les emplois§!.§!"

 ############################################################################################################
 # TECHNOLOGIES

 giga_tech_amb_supertensiles:99 "Supertensiles appliqués"
 giga_tech_amb_supertensiles_desc:99 "Des méthodes améliorées de synthèse moléculaire permettent l'application pratique de matériaux dotés d'une résistance à la traction quasi inimaginable."

 giga_tech_amb_living_metal_infusion:99 "Procédé d'infusion de métal vivant"
 giga_tech_amb_living_metal_infusion_desc:99 "Les propriétés régénératrices du métal vivant pourraient théoriquement être exploitées pour améliorer la qualité et le rendement de nos fonderies moléculaires."

 giga_tech_amb_sentient_metal_molecular_foundries:99 "Nanocalcul industriel au métal sentient"
 giga_tech_amb_sentient_metal_molecular_foundries_desc:99 "Des équipements de traitement intégrant la capacité de calcul à l'échelle nanométrique du métal sentient pourraient entraîner des améliorations spectaculaires du débit des fonderies moléculaires."

 giga_tech_orbital_ring_supertensiles_mine_hub:99 "Conception de salles blanches moléculaires en apesanteur"
 giga_tech_orbital_ring_supertensiles_mine_hub_desc:99 "Des espaces de traitement dédiés aux $giga_sr_amb_megaconstruction$ sur nos anneaux orbitaux ont le potentiel de stimuler considérablement les opérations locales d'extraction et de traitement."

 giga_tech_fe_megaworkshop_1:99 "$building_giga_fe_megaworkshop$"
 giga_tech_fe_megaworkshop_1_desc:99 "$building_giga_fe_megaworkshop_desc$"

 giga_tech_fe_megaworkshop_2:99 "$building_giga_fe_megaworkshop_2$"
 giga_tech_fe_megaworkshop_2_desc:99 "$building_giga_fe_megaworkshop_2_desc$"

