 ############################################################################################################
 # COUNTRY MODIFIERS

 giga_amb_base:0 "Mécaniques de mégaconstruction basées sur les emplois"
 giga_amb_base_tooltip:0 "Notre $MOD_MEGASTRUCTURE_BUILD_SPEED_ADD$ est basée sur les revenus de notre empire en £giga_sr_amb_megaconstruction£ §Y$giga_sr_amb_megaconstruction$§!.\n\nChaque mois, lorsqu'au moins une mégastructure est en construction, jusqu'au double de nos revenus en £giga_sr_amb_megaconstruction£ §Y$giga_sr_amb_megaconstruction$§! est soustrait de notre stockpile et converti en $MOD_MEGASTRUCTURE_BUILD_SPEED_ADD$. Cette valeur est ensuite répartie entre toutes les mégastructures en construction, et est soumise à des rendements décroissants §Yaprès§! avoir été répartie.\n\nConsultez le modificateur de pays §Y$giga_amb_speed$§! pour les détails sur le calcul de la vitesse."
 giga_amb_base_desc:0 "§LUn personnel qualifié et des matériaux spécialisés sont nécessaires pour surpasser les étoiles elles-mêmes.§!"

 giga_amb_storage_capacity:0 "Limite de stockage de $giga_sr_amb_megaconstruction$"
 giga_amb_storage_capacity_tooltip:0 "La capacité de stockage de £giga_sr_amb_megaconstruction£ §Y$giga_sr_amb_megaconstruction$§! est limitée et n'est pas augmentée par les modificateurs généraux £mod_country_resource_max_add£ §Y$MOD_COUNTRY_RESOURCE_MAX_ADD$§!"
 giga_amb_storage_capacity_desc:0 "§LRares et précieux, nous devons stocker nos matériaux les plus avancés avec grand soin.§!"

 giga_amb_speed:0 "Vitesse de mégaconstruction"
 giga_amb_speed_desc:0 "§LAvec des experts et des matériaux en quantité limitée, nous devons choisir soigneusement où nous les déployons.§!"

 giga_amb_flat_replacement:0 "Compatibilité de mégaconstruction"
 giga_amb_flat_replacement_desc:0 "Un autre mod fournit une source de $MOD_MEGASTRUCTURE_BUILD_SPEED_ADD$. Ce modificateur l'annule et fournit un bonus de remplacement adapté au système de mégaconstruction basé sur les emplois.\n§W--------------§!\n§LUne correction concise de méthodologie à méga-échelle.§!"

 giga_amb_ai_limit:0 "Limite IA de mégaconstruction"
 giga_amb_ai_limit_tooltip:0 "Limite artificiellement le nombre de mégastructures que l'IA peut construire simultanément, car elle ne comprend pas le concept de répartition de sa vitesse de construction entre plusieurs projets, et a tendance à trop la diluer quand de nombreux projets sont disponibles.\n\nTentera généralement de rester à une vitesse de 0,75-0,5 par projet à la limite maximale. Mise à jour annuelle.\n\nConsultez le modificateur de pays §Y$giga_amb_speed$§! pour la valeur de la limite."
 giga_amb_ai_limit_desc:0 "§L« Pourquoi construis-tu DIX segments de monde-anneau avec une vitesse de 1,4 ?! » - TTFTCUTS§!"

 giga_amb_empire_size_penalty:0 "Pénalités de taille d'empire pour la mégaconstruction"
 giga_amb_empire_size_penalty_desc:0 "§LÀ mesure que notre fardeau administratif augmente, la coordination des projets entre nos mondes devient plus difficile.§!"

 giga_amb_starting_megas_upkeep_offset:0 "Support d'entretien des mégastructures de départ"
 giga_amb_starting_megas_upkeep_offset_desc:0 "Paie l'entretien de base en $giga_sr_amb_megaconstruction$ de toutes les mégastructures possédées au début de la partie.\n\n§LLaisser nos installations spatiales les plus importantes sans entretien serait de la pure négligence.§!"

 ############################################################################################################
 # RESOURCES

 giga_sr_amb_megaconstruction:0 "Matériaux supertensiles"
 giga_sr_amb_megaconstruction_desc_only:0 "Capables de résister à des niveaux incroyables de contrainte de traction, ces matériaux avancés sont essentiels dans la construction des plus grandes installations spatiales."
 giga_sr_amb_megaconstruction_desc:0 "$giga_sr_amb_megaconstruction_desc_only$\n\n§LCette ressource est utilisée quand l'option §YLimite de construction de mégastructure§! dans le menu de personnalisation Gigastructures est réglée sur §YBasée sur les emplois§!.§!"

 ############################################################################################################
 # TECHNOLOGIES

 giga_tech_amb_supertensiles:0 "Supertensiles appliqués"
 giga_tech_amb_supertensiles_desc:0 "Des méthodes améliorées de synthèse moléculaire permettent l'application pratique de matériaux avec une résistance à la traction quasi-inimaginable."

 giga_tech_amb_living_metal_infusion:0 "Processus d'infusion de métal vivant"
 giga_tech_amb_living_metal_infusion_desc:0 "Les propriétés régénératives du métal vivant pourraient théoriquement être exploitées pour améliorer la qualité et le rendement de nos fonderies moléculaires."

 giga_tech_amb_sentient_metal_molecular_foundries:0 "Nanocomputing industriel au métal sentient"
 giga_tech_amb_sentient_metal_molecular_foundries_desc:0 "Les équipements de traitement incorporant la capacité de calcul à l'échelle nanométrique du métal sentient pourraient conduire à des améliorations spectaculaires du débit des fonderies moléculaires."

 giga_tech_orbital_ring_supertensiles_mine_hub:0 "Conception de salle blanche en apesanteur"
 giga_tech_orbital_ring_supertensiles_mine_hub_desc:0 "Des espaces de traitement dédiés aux $giga_sr_amb_megaconstruction$ sur nos anneaux orbitaux ont le potentiel d'augmenter significativement les opérations locales d'extraction et de traitement."

