 mod_giga_amb_tooltips_minerals_produces_add:0 "§W--------------§!\n§HDétails :§!\n\nRevenus en £giga_sr_amb_megaconstruction£ §Y$giga_sr_amb_megaconstruction$§! : [This.giga_amb_income_colour][This.giga_amb_income]§!\nInvestissement potentiel ce mois (stockpile inclus) : [This.giga_amb_stockpile_drain_colour][This.giga_amb_stockpile_drain]§!\n\nVitesse de construction de base par £giga_sr_amb_megaconstruction£ §Y$giga_sr_amb_megaconstruction$§! : §G+[giga_amb_ratio]§!\nVitesse de construction totale de base (avant rendements décroissants) : [This.giga_amb_total_progress_colour][This.giga_amb_total_progress]§!\n\n[This.giga_amb_ai_details]§HProjets de mégaconstruction actifs :§!\n\nProjets hors-structure : §Y[This.giga_amb_building_technical]§!\nKilostructures : §Y[This.giga_amb_building_kilos]§!\nMégastructures : §Y[This.giga_amb_building_megas]§!\nGigastructures : §Y[This.giga_amb_building_gigas]§!\n\nVitesse de construction de base par projet"

