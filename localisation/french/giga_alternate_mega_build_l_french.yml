 building_giga_living_metal_infusion_plant_desc:99 "L'incorporation des propriétés régénératrices du métal vivant dans nos processus de fabrication sera un atout considérable pour nos projets de construction en espace lointain."

 building_giga_fe_megaworkshop:99 "Nano-assembleur"
