 building_giga_megaworkshop:99 "Fonderie moléculaire"
 building_giga_megaworkshop_plural:99 "Fonderies moléculaires"
 building_giga_megaworkshop_desc:99 "Des réseaux de synthèse moléculaire et des salles blanches immaculées remplissent ces installations, produisant les matériaux hautement spécialisés nécessaires aux projets de construction orbitale à grande échelle."
 mod_planet_building_giga_megaworkshop_build_speed_mult:99 "Vitesse de construction de $building_giga_megaworkshop$"

 building_giga_megaworkshop_hub:99 "Centre logistique de mégaconstruction"
 building_giga_megaworkshop_hub_plural:99 "Centres logistiques de mégaconstruction"
 building_giga_megaworkshop_hub_desc:99 "Des experts coordonnent une vaste flotte de vaisseaux de transport et de construction, portant leurs grands projets, tandis que les fonderies moléculaires produisent d'énormes quantités de matériaux de construction."
 building_giga_megaworkshop_hub_count_condition:99 ""
