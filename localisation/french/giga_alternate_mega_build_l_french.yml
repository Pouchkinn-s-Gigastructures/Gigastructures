 giga_supertensiles_subsidies:99 "Contribution en mégaconstruction"
 giga_supertensiles_subsidies_desc:99 "Cette clause dicte la quantité de £giga_sr_amb_megaconstruction£ §Y$giga_sr_amb_megaconstruction$§! que le sujet est tenu de verser au suzerain chaque mois. Ce montant correspond à un pourcentage de la production mensuelle actuelle du sujet.\n\nUne valeur négative signifie que le suzerain est tenu de verser au sujet plutôt que l'inverse, mais le calcul reste basé sur un pourcentage de la production mensuelle actuelle du sujet.\n\n§ECette clause est dans une catégorie séparée en raison d'une limitation du moteur où les catégories de ressources conditionnellement masquées brisent les accords de vassalité. Si le problème est corrigé, elle sera réintégrée à la catégorie Contribution.§!"

 giga_resource_subsidies_supertensiles:99 "Matériaux supertensiles"

 giga_supertensiles_prospectorium_bonus_subject_1:99 "$mod_country_giga_sr_amb_megaconstruction_produces_mult$ : §G+10 %§!\nCe bonus augmente avec le palier de spécialiste."
 giga_supertensiles_prospectorium_bonus_subject_2:99 "$mod_country_giga_sr_amb_megaconstruction_produces_mult$ : §G+20 %§!\nCe bonus augmente avec le palier de spécialiste."
 giga_supertensiles_prospectorium_bonus_subject_3:99 "$mod_country_giga_sr_amb_megaconstruction_produces_mult$ : §G+30 %§!\nCe bonus augmente avec le palier de spécialiste."

