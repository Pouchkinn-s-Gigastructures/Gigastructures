 ############################################################################################################
 # DEPOSITS

 d_giga_amb_start_bonus:0 "Cache de matériaux de mégaconstruction"
 d_giga_amb_start_bonus_desc:0 "§WLes ressources accordées par ce gisement diminueront avec le temps jusqu'à un filet en milieu de partie. Utilisez-les judicieusement.§!\n§W--------------§!\nUne cache de matériaux de construction adaptés à la construction spatiale à grande échelle. Malheureusement, elle ne durera pas éternellement..."

 d_giga_hab_supertensiles_1:0 "Gisement de $giga_sr_amb_megaconstruction$"
 d_giga_hab_supertensiles_1_desc:0 "Ce complexe d'habitat est construit près d'un gisement exploitable de matériaux supertensiles."

 d_giga_lifeless_supertensiles_1:0 "Gisement de $giga_sr_amb_megaconstruction$"
 d_giga_lifeless_supertensiles_1_desc:0 "Ce monde possède une source exploitable de matériaux supertensiles."

 ############################################################################################################
 # COLONY DESIGNATIONS

 col_giga_supertensiles_foundry:0 "Centre mégalogistique"
 col_giga_supertensiles_foundry_desc:0 "Cette planète est un centre de fabrication et de logistique axé sur les projets de construction spatiale lointaine."

 col_giga_habitat_supertensiles_foundry:0 "Station mégalogistique"
 col_giga_habitat_supertensiles_foundry_desc:0 "Une arcologie spatiale artificielle dédiée à la fabrication de mégastructures"

 ############################################################################################################
 # EDICTS

 edict_giga_amb_sentient_metal_supertensiles:0 "Fonderies moléculaires assistées par métal sentient"
 edict_giga_amb_sentient_metal_supertensiles_desc:0 "Les propriétés adaptatives du métal sentient ont plusieurs applications potentielles dans la fabrication de matériaux supertensiles.\n\nAméliore la production et l'entretien de base des £job_giga_megaengineer£ §Y$job_giga_megaengineer_plural$§! de §Y50 %§!.\n\nAméliore la production et l'entretien de base des £job_giga_megaengineering_overseer£ §Y$job_giga_megaengineering_overseer_plural$§! de §Y20 %§!.\n\nRemplace §Yla moitié de l'entretien en £alloys£ $alloys$§! des deux emplois par des £giga_sr_sentient_metal£ §Y$giga_sr_sentient_metal$§!."

 ############################################################################################################
 # EVENTS

 giga_amb.1000.name:0 "§Y[FromFrom.GetName]§! : Ressource stratégique découverte"
 giga_amb.1000.has_tech:0 "Les [Root.GetName] ont découvert une source jusqu'alors inconnue de §H$giga_sr_amb_megaconstruction$§! sur [FromFrom.GetName]. Autrefois considérées impossibles dans la nature, il semble que dans des conditions très spécifiques, ces molécules en chaîne incroyablement résistantes soient effectivement capables de se former. Cette nouvelle découverte pourrait être exploitée pour compléter notre production artificielle de supertensiles."
 giga_amb.1000.no_tech:0 "Les [Root.GetName] ont découvert une ressource stratégique jusqu'alors inconnue sur [FromFrom.GetName], baptisée §H$giga_sr_amb_megaconstruction$§!. Ces fibres densément maillées possèdent un niveau incroyable de résistance à la traction, qui pourrait être exploité dans des projets à grande échelle où les forces impliquées rendaient auparavant la construction impossible."
 giga_amb.1000.tooltip:0 "£giga_sr_amb_megaconstruction£§Y$giga_sr_amb_megaconstruction$§!\n§E$giga_sr_amb_megaconstruction_desc_only$§!"

 giga_amb.1001.name:0 "Une erreur de calcul logistique"
 giga_amb.1001.desc:0 "Lorsque nous avons fait nos premiers pas dans le vide spatial, nous savions qu'il y aurait de nouveaux défis à surmonter et avons planifié en conséquence, ou du moins le pensions-nous. Parfois, même les meilleures estimations de la complexité d'un problème peuvent être erronées.\n\nLes réalités de l'organisation et de la mise en œuvre de la construction spatiale à grande échelle se sont avérées plus éprouvantes pour nos lignes d'approvisionnement qu'initialement prévu, et une restructuration significative sera nécessaire à l'avenir.\n\nUne piste potentielle de recherche sur de nouvelles techniques de fabrication et de déploiement promet de résoudre ces problèmes, mais reste non prouvée."
 giga_amb.1001.tooltip:0 "\n§ERechercher §Y$giga_tech_amb_supertensiles$§! sera §Prequis§! pour réaliser tout progrès significatif en mégastructure."

 ############################################################################################################
 # STARBASE BUILDINGS

 sm_ring_giga_supertensiles_hub:0 "Coordinateur de réseau mégalogistique"
 sm_ring_giga_supertensiles_hub_desc:0 "Cette installation orbitale aide à améliorer nos $building_giga_megaworkshop_plural$ au sol en utilisant du $sr_living_metal$ pour rationaliser les processus de production, conduisant à un débit global accru."

 sm_ring_giga_supertensiles_mine_hub:0 "Installation orbitale de salle blanche"
 sm_ring_giga_supertensiles_mine_hub_desc:0 "Des installations de transit spécialisées et des salles blanches sur l'anneau orbital permettent le traitement de matériaux extraits qui seraient autrement gaspillés.\n\n§TFournit §G+1§! emploi £job_giga_supertensiles_extractor£ §YExtraction de supertensiles§! par bâtiment £building£ §Y$building_giga_supertensiles_mines$§! actif§!\n"
 ring_giga_supertensiles_mine_hub_condition:0 "§RLa planète doit pouvoir supporter au moins un bâtiment £building£ §Y$building_giga_supertensiles_mines$§!.§!"






