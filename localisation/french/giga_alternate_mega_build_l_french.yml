 ############################################################################################################
 # DEPOSITS

 d_giga_amb_start_bonus:99 "Cache de matériaux de mégaconstruction"
 d_giga_amb_start_bonus_desc:99 "§WLes ressources accordées par ce gisement diminueront progressivement pour n'être plus qu'un filet en milieu de partie. Utilisez-les judicieusement.§!\n§W--------------§!\nUne cache de matériaux de construction adaptés à la construction spatiale à grande échelle. Malheureusement, elle ne durera pas éternellement..."

 d_giga_hab_supertensiles_1:99 "Gisement de $giga_sr_amb_megaconstruction$"
 d_giga_hab_supertensiles_1_desc:99 "Ce complexe d'habitat est construit près d'un gisement exploitable de matériaux supertensiles."

 d_giga_lifeless_supertensiles_1:99 "Gisement de $giga_sr_amb_megaconstruction$"
 d_giga_lifeless_supertensiles_1_desc:99 "Ce monde possède une source exploitable de matériaux supertensiles."

 ############################################################################################################
 # COLONY DESIGNATIONS

 col_giga_supertensiles_foundry:99 "Centre mégalogistique"
 col_giga_supertensiles_foundry_desc:99 "Cette planète est un centre de fabrication et de logistique axé sur les projets de construction en espace lointain."

 col_giga_habitat_supertensiles_foundry:99 "Station mégalogistique"
 col_giga_habitat_supertensiles_foundry_desc:99 "Une arcologie artificielle en espace lointain dédiée à la fabrication de mégastructures."

 ############################################################################################################
 # EDICTS

 edict_giga_amb_sentient_metal_supertensiles:99 "Fonderies moléculaires assistées par métal sentient"
 edict_giga_amb_sentient_metal_supertensiles_desc:99 "Les propriétés adaptatives du métal sentient ont plusieurs applications potentielles dans la fabrication de matériaux supertensiles.\n\nAméliore la production de base et l'entretien des £job_giga_megaengineer£ §Y$job_giga_megaengineer_plural$§! de §Y50 %§!.\n\nAméliore la production de base et l'entretien des £job_giga_megaengineering_overseer£ §Y$job_giga_megaengineering_overseer_plural$§! de §Y20 %§!.\n\nRemplace §Yla moitié de l'entretien en £alloys£ $alloys$§! des deux emplois par des £giga_sr_sentient_metal£ §Y$giga_sr_sentient_metal$§!."

 ############################################################################################################
 # EVENTS

 giga_amb.1000.name:99 "§Y[FromFrom.GetName]§! : Ressource stratégique découverte"
 giga_amb.1000.has_tech:99 "Le [Root.GetName] a découvert une source jusqu'alors inconnue de §H$giga_sr_amb_megaconstruction$§! sur [FromFrom.GetName]. Autrefois considérées comme impossibles dans la nature, il semble que dans des conditions très spécifiques, ces molécules à chaînes incroyablement résistantes soient effectivement capables de se former. Cette nouvelle découverte pourrait être exploitée pour compléter notre production artificielle de supertensiles."
 giga_amb.1000.no_tech:99 "Le [Root.GetName] a découvert une ressource stratégique jusqu'alors inconnue sur [FromFrom.GetName], baptisée §H$giga_sr_amb_megaconstruction$§!. Ces fibres densément entrelacées possèdent un niveau incroyable de résistance à la traction, qui pourrait être exploité dans des projets à grande échelle où les forces impliquées rendaient auparavant la construction impossible."
 giga_amb.1000.tooltip:99 "£giga_sr_amb_megaconstruction£§Y$giga_sr_amb_megaconstruction$§!\n§E$giga_sr_amb_megaconstruction_desc_only$§!"

 giga_amb.1001.name:99 "Une erreur de calcul logistique"
 giga_amb.1001.desc:99 "Lorsque nous avons fait nos premiers pas dans le vide spatial, nous savions qu'il y aurait de nouveaux défis à relever et nous avons planifié en conséquence, ou du moins le pensions-nous. Parfois, même les meilleures estimations de la complexité d'un problème peuvent être erronées.\n\nLes réalités de l'organisation et de la mise en oeuvre de constructions spatiales à grande échelle se sont avérées plus éprouvantes pour nos lignes d'approvisionnement que prévu initialement, et une restructuration significative sera nécessaire à l'avenir.\n\nUne piste de recherche potentielle sur de nouvelles techniques de fabrication et de déploiement promet de résoudre ces problèmes, mais reste à prouver."
 giga_amb.1001.tooltip:99 "\n§ELa recherche de §Y$giga_tech_amb_supertensiles$§! sera §Prequise§! pour tout progrès significatif en mégastructure."

 ############################################################################################################
 # STARBASE BUILDINGS

 sm_ring_giga_supertensiles_hub:99 "Coordinateur de réseau mégalogistique"
 sm_ring_giga_supertensiles_hub_desc:99 "Cette installation orbitale aide à améliorer nos $building_giga_megaworkshop_plural$ au sol en utilisant du $sr_living_metal$ pour rationaliser les processus de production, augmentant ainsi le débit global."

 sm_ring_giga_supertensiles_mine_hub:99 "Installation orbitale de salles blanches"
 sm_ring_giga_supertensiles_mine_hub_desc:99 "Des installations de préparation spécialisées et des salles blanches sur l'anneau orbital permettent le traitement de matériaux extraits qui seraient autrement perdus.\n\n§TFournit §G+1§! emploi d'£job_giga_supertensiles_extractor£ §YExtraction de supertensiles§! par £building£ §Y$building_giga_supertensiles_mines$§! actif§!\n"
 ring_giga_supertensiles_mine_hub_condition:99 "§RLa planète doit pouvoir accueillir au moins un £building£ bâtiment §Y$building_giga_supertensiles_mines$§!.§!"






