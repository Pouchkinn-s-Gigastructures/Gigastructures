 giga_log.500.title:99 "Journalisation optionnelle des données"
 giga_log.500.desc:99 "Merci de jouer à Gigastructural Engineering & More !\n\nPar le passé, nous avons apporté des modifications basées sur les retours des utilisateurs. Alors que nous continuons à développer le mod du mieux possible, nous avons décidé que la collecte de données auprès des joueurs s'avérerait inestimable pour les décisions d'équilibrage.\n\nSi vous le souhaitez, vous pouvez nous aider en activant une fonction de journalisation pour suivre l'état de votre galaxie pendant que vous jouez avec Gigastructures. Après votre session, vous pourrez ensuite téléverser votre fichier game.log et votre liste de mods dans le sondage disponible via le lien <QUELQUE PART>. Il est probable que la journalisation ajoute un léger ralentissement au premier jour de chaque année. Nous nous excusons pour ce désagrément.\n\n§HATTENTION§! : En raison du fonctionnement des fichiers journaux, chaque fois que vous ouvrez Stellaris, votre fichier journal est effacé. Vous ne pourrez pas envoyer ni consulter un fichier journal d'une session précédente.\n\n§LGigastructures, ou tout autre mod Stellaris d'ailleurs, n'a aucune capacité de stocker vos données et d'envoyer de la télémétrie où que ce soit. Les seules données envoyées à Gigastructures ou à tout membre de son équipe de développement sont celles que vous fournissez volontairement. Les fichiers journaux de Stellaris ne contiennent aucune donnée identifiable à moins que ces données ne soient volontairement saisies.§!"
 giga_log.500.a:99 "Oui, je souhaite activer la journalisation."
 giga_log.500.b:99 "Non, je ne souhaite pas activer la journalisation."


