l_french:
    giga_ai_savings_info:0 "Informations sur l'épargne IA pour les mégastructures Gigas"
    giga_ai_savings_info_desc:0 "§LUn coup de pouce pour la planification financière.§!"
    mod_giga_ai_savings_tooltips_minerals_produces_add:0 "Affiche combien l'IA a mis de côté pour les mégastructures. Ces valeurs sont déduites des coûts de construction des mégastructures prises en charge et décrémentées au début de la construction.\n\n§EMégastructures économiques importantes :§!\n£alloys£ $alloys$ : §Y[giga_ai_savings_important_alloys]§!\n£unity£ $unity$ : §Y[giga_ai_savings_important_unity]§!\n\n§EMégastructures économiques secondaires :§!\n£alloys£ $alloys$ : §Y[giga_ai_savings_resource_alloys]§!\n£unity£ $unity$ : §Y[giga_ai_savings_resource_unity]§!\n\n§EMégastructures utilitaires :§!\n£alloys£ $alloys$ : §Y[giga_ai_savings_utility_alloys]§!\n£unity£ $unity$ : §Y[giga_ai_savings_utility_unity]§!\n\n§EMégastructures militaires :§!\n£alloys£ $alloys$ : §Y[giga_ai_savings_military_alloys]§!\n£unity£ $unity$ : §Y[giga_ai_savings_military_unity]§!\n\nModificateur factice pour que les valeurs s'affichent correctement"

    r_giga_ai_savings:0 "Compte d'épargne IA"
    r_giga_ai_savings_desc:0 "Ceci est une relique réservée à l'IA qui fournit les modificateurs pour la fonctionnalité d'épargne de mégastructures de l'IA. Elle ne fait rien pour un joueur humain, et est retirée si possédée par un humain au début de l'année.\n\n§LCha-ching, ça fait bling-bling§!"

    giga_ai_savings_desc:0 "Ajustement de coût pour cette mégastructure depuis l'épargne."

