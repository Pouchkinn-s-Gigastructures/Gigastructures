l_french:
    giga_ai_savings_info:99 "Informations sur l'épargne IA pour mégastructures Gigas"
    giga_ai_savings_info_desc:99 "§LUn coup de pouce pour la planification financière.§!"
    mod_giga_ai_savings_tooltips_minerals_produces_add:99 "Affiche les montants que l'IA a mis de côté pour les mégastructures. Ces valeurs sont déduites des coûts de construction des mégastructures prises en charge et décrémentées au début de la construction.\n\n§EMégastructures économiques prioritaires :§!\n£alloys£ $alloys$ : §Y[giga_ai_savings_important_alloys]§!\n£unity£ $unity$ : §Y[giga_ai_savings_important_unity]§!\n\n§EMégastructures économiques secondaires :§!\n£alloys£ $alloys$ : §Y[giga_ai_savings_resource_alloys]§!\n£unity£ $unity$ : §Y[giga_ai_savings_resource_unity]§!\n\n§EMégastructures utilitaires :§!\n£alloys£ $alloys$ : §Y[giga_ai_savings_utility_alloys]§!\n£unity£ $unity$ : §Y[giga_ai_savings_utility_unity]§!\n\n§EMégastructures militaires :§!\n£alloys£ $alloys$ : §Y[giga_ai_savings_military_alloys]§!\n£unity£ $unity$ : §Y[giga_ai_savings_military_unity]§!\n\nModificateur factice pour l'affichage correct des valeurs"

    r_giga_ai_savings:99 "Compte d'épargne IA"
    r_giga_ai_savings_desc:99 "Ceci est une relique réservée à l'IA qui fournit les modificateurs pour la fonctionnalité d'épargne des mégastructures. Elle ne fait rien pour un joueur humain et est retirée si possédée par un joueur humain au début de l'année.\n\n§LFaire des économies, c'est gagner des sous !§!"

    giga_ai_savings_desc:99 "Ajustement du coût de cette mégastructure grâce à l'épargne."

