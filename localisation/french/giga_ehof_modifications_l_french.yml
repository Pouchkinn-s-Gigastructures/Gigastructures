l_french:
    INVESTIGATE_REALITY_CODE_1:0 "À la poursuite du Code I"
    INVESTIGATE_REALITY_CODE_1_DESC:0 "Nous captons un signal faible provenant d'un point du système auquel notre $ehof_ehof_abr$ vient de se connecter. Cela pourrait présenter un certain intérêt."
    INVESTIGATE_REALITY_CODE_2:0 "À la poursuite du Code II"
    INVESTIGATE_REALITY_CODE_2_DESC:0 "Nous captons un autre signal faible provenant d'un point du système auquel notre $ehof_ehof_abr$ vient de se connecter. Cela pourrait présenter un certain intérêt."
    INVESTIGATE_REALITY_CODE_3:0 "À la poursuite du Code III"
    INVESTIGATE_REALITY_CODE_3_DESC:0 "Pour la troisième fois, nous captons un signal faible provenant d'un point du système auquel notre $ehof_ehof_abr$ vient de se connecter. Cela pourrait présenter un certain intérêt."
    INVESTIGATE_REALITY_CODE_4:0 "À la poursuite du Code IV"
    INVESTIGATE_REALITY_CODE_4_DESC:0 "Une fois encore, nous captons un signal faible provenant d'un point du système auquel notre $ehof_ehof_abr$ vient de se connecter. Cela pourrait présenter un certain intérêt."
    INVESTIGATE_REALITY_CODE_5:0 "À la poursuite du Code V"
    INVESTIGATE_REALITY_CODE_5_DESC:0 "Nous captons un autre signal faible provenant d'un point du système auquel notre $ehof_ehof_abr$ vient de se connecter. Cela pourrait présenter un certain intérêt."
    INVESTIGATE_REALITY_CODE_6:0 "À la poursuite du Code VI"
    INVESTIGATE_REALITY_CODE_6_DESC:0 "Nous captons un signal familier provenant d'un point du système auquel notre $ehof_ehof_abr$ vient de se connecter. Nous pouvons raisonnablement supposer qu'il présente un intérêt."
    INVESTIGATE_REALITY_CODE_7:0 "Merveille des Créateurs"
    INVESTIGATE_REALITY_CODE_7_DESC:0 "Nous détectons des niveaux d'énergie immenses en provenance du système auquel notre EHOF vient de se connecter !\n\nNous ferions bien d'enquêter."
    ehof_travel.1001.NAME:0 "À la poursuite du Code"
    ehof_travel.1001.DESC:0 "Nous captons un signal faible provenant d'un point du système auquel notre $ehof_ehof_abr$ vient de se connecter. Cela pourrait présenter un certain intérêt."
    ehof_travel.1001.a:0 "Cela pourrait être important."
    ehof_travel.1002.NAME:0 "Révélations sur la réalité"
    ehof_travel.1002.1.DESC:0 "Le §H[this.GetName]§! a détecté une transmission en provenance du système §H[from.solar_system.GetName]§!. Comme la transmission précédente, celle-ci a désactivé les systèmes principaux du vaisseau ; cette fois, le $ehof_closed_modular$ du vaisseau a pu restaurer sa pleine fonctionnalité en peu de temps. Les [Owner.GetScientistPlural] du vaisseau ont nommé ce phénomène le $ehof_epcs$.\n\nUne fois le §H[this.GetName]§! remis en ligne, les scanners $ehof_ep$ à son bord ont pu localiser l'origine de la transmission : un monde toxique que nos explorateurs ont baptisé §H[from.GetName]§!.\n\nDes relevés supplémentaires intégrant les scanners $ehof_ep$ devraient permettre de localiser précisément la source de la transmission. Étant donné que la transmission était très brève et ne s'est pas répétée, cela pourrait prendre un certain temps."
    ehof_travel.1002.2.DESC:0 "Une autre transmission du $ehof_epcs$ a été reçue par le §H[this.GetName]§! dans le système §H[from.solar_system.GetName]§!. Comme lors des deux instances précédentes, la transmission a désactivé le vaisseau. Cette fois, cependant, un $ehof_closed_modular$ amélioré a pu restaurer la fonctionnalité du vaisseau en quelques minutes.\n\nLes scanners $ehof_ep$ ont pu identifier la source de la transmission à l'intérieur du système : la planète fracturée §H[from.GetName]§!. Avec des relevés supplémentaires, nous serons en mesure de localiser la source exacte sur (ou dans) la planète – mais cela prendra un certain temps."
    ehof_travel.1002.3.DESC:0 "Le §H[this.GetName]§! a reçu une autre transmission du $ehof_epcs$ depuis l'intérieur du système §H[from.solar_system.GetName]§!. Nos [Owner.GetScientistPlural] à bord du vaisseau ont déterminé que la transmission provenait d'une planète gelée nommée §H[from.GetName]§!.\n\nL'emplacement exact du transmetteur doit être déterminé par des investigations supplémentaires avant que nous puissions y monter une expédition."
    ehof_travel.1002.4.DESC:0 "Une autre transmission du $ehof_epcs$ a été détectée à l'intérieur du système §H[from.solar_system.GetName]§! par le §H[this.GetName]§!, semblant cette fois provenir d'un monde en fusion nommé §H[from.GetName]§!.\n\nLes scanners $ehof_ep$ du vaisseau seront en mesure d'en localiser précisément la source, mais cela prendra un certain temps."
    ehof_travel.1002.5.DESC:0 "Le §H[this.GetName]§! a reçu une autre transmission du $ehof_epcs$. Cette fois, la transmission provenait d'une géante gazeuse nommée §H[from.GetName]§! dans le système §H[from.solar_system.GetName]§!.\n\nNous devrions enquêter sur cette source dès que possible."
    ehof_travel.1002.6.DESC:0 "En entrant dans le système §H[root.solar_system.GetName]§!, le §H[this.GetName]§! a détecté une transmission $ehof_ep$ – bien que, curieusement, celle-ci provenait cette fois de la naine brune étonnamment massive au centre du système.\n\nBien que l'idée de sonder l'intérieur d'un tel objet quasi-stellaire soit intimidante, nous devons néanmoins trouver la source de la transmission et compléter le $ehof_epcs$."
    ehof_travel.1002.a:0 "Excellent ! Enquêtons immédiatement."
    ehof_travel.1003.NAME:0 "Merveille des Créateurs"
    ehof_travel.1003.DESC:0 "Nous détectons un signal étrange émanant du système §H[from.solar_system.GetName]§! ! Peut-être est-il lié au $ehof_epcs$ que nous recherchons depuis si longtemps ?"
    ehof_travel.1003.a:0 "Glorieux ! Il est temps de percer ce code."
    ehof_travel.1004.NAME:0 "La maîtrise nous attend"
    ehof_travel.1004.DESC:0 "Aucune entrée n'est identifiable à l'extérieur de la $ehof_the_sphere$. Elle pourrait être similaire aux objets amplificateurs que nous avons observés lors de nos études du $ehof_epcs$, dont les entrées ne se manifestent que dans des conditions spécifiques liées au $ehof_ep$.\n\nIl sera nécessaire d'étudier la structure afin de trouver un moyen d'y pénétrer, sans parler de déterminer sa fonction. Nos [Owner.GetResearchers] ont décidé de nommer la construction $ehof_the_sphere_named$, en référence aux motifs ondulants et non répétitifs qui se déplacent à sa surface."
    ehof_travel.1004.a:0 "Splendide ! Commençons..."

    #Shrouded Maze
    ehof_shrouded_maze_digsite:0 "La cité brisée"
    ehof_shrouded_maze_digsite_desc:0 "Les analyses initiales de la « surface » de [from.planet.GetName] révèlent que bien que la planète ait été fracturée, le paysage urbain qui recouvrait toute sa surface est relativement intact. Peut-être ces fragments survivants de la cité révéleront-ils ce qui est arrivé à la planète."

    ehof_shrouded_maze.11.name:0 "Et c'était beau"
    ehof_shrouded_maze.11.desc:0 "grande description de la planète-cité brisée et de sa capitale qui se trouve sur l'un des fragments ici"
    ehof_shrouded_maze.11.a:0 "réponse"

    ehof_shrouded_maze.12.name:0 "La Promesse"
    ehof_shrouded_maze.12.desc:0 "expliquer la prospérité de la planète, expliquer « la promesse » et ses termes"
    ehof_shrouded_maze.12.a:0 "réponse"

    ehof_shrouded_maze.13.name:0 "Tractations effroyables"
    ehof_shrouded_maze.13.desc:0 "Vérification de lecture, premier indice du labyrinthe,"
    ehof_shrouded_maze.13.a:0 "Bonne réponse"
    ehof_shrouded_maze.13.b:0 "Mauvaise réponse"

    ehof_shrouded_maze.14.name:0 "La paix en morceaux"
    ehof_shrouded_maze.14.desc:0 "Ah donc c'est ce qui s'est réellement passé, deuxième indice du labyrinthe, troisième indice du labyrinthe"
    ehof_shrouded_maze.14.a:0 "C'est labyrintastique"

    giga_shrouded_maze:0 "Paysage rampant"
    giga_shrouded_maze_desc:0 "Le peu que nous pouvons scanner de la surface de cette planète à travers l'épais brouillard et les nuages est en perpétuel mouvement."