    INVESTIGATE_REALITY_CODE_1:99 "À la poursuite du Code I"
    INVESTIGATE_REALITY_CODE_1_DESC:99 "Nous captons un faible signal provenant de quelque part dans le système auquel notre $ehof_ehof_abr$ vient de se connecter. Peut-être serait-ce quelque chose d'intéressant ?"
    INVESTIGATE_REALITY_CODE_2:99 "À la poursuite du Code II"
    INVESTIGATE_REALITY_CODE_2_DESC:99 "Nous captons un autre faible signal provenant de quelque part dans le système auquel notre $ehof_ehof_abr$ vient de se connecter. Peut-être serait-ce quelque chose d'intéressant ?"
    INVESTIGATE_REALITY_CODE_3:99 "À la poursuite du Code III"
    INVESTIGATE_REALITY_CODE_3_DESC:99 "Pour la troisième fois, nous captons un faible signal provenant de quelque part dans le système auquel notre $ehof_ehof_abr$ vient de se connecter. Peut-être serait-ce quelque chose d'intéressant ?"
    INVESTIGATE_REALITY_CODE_4:99 "À la poursuite du Code IV"
    INVESTIGATE_REALITY_CODE_4_DESC:99 "Une fois de plus, nous captons un faible signal provenant de quelque part dans le système auquel notre $ehof_ehof_abr$ vient de se connecter. Peut-être serait-ce quelque chose d'intéressant ?"
    INVESTIGATE_REALITY_CODE_5:99 "À la poursuite du Code V"
    INVESTIGATE_REALITY_CODE_5_DESC:99 "Nous captons un autre faible signal provenant de quelque part dans le système auquel notre $ehof_ehof_abr$ vient de se connecter. Peut-être serait-ce quelque chose d'intéressant ?"
    INVESTIGATE_REALITY_CODE_6:99 "À la poursuite du Code VI"
    INVESTIGATE_REALITY_CODE_6_DESC:99 "Nous captons un signal familier provenant de quelque part dans le système auquel notre $ehof_ehof_abr$ vient de se connecter. Nous pouvons raisonnablement supposer qu'il s'agit de quelque chose d'intéressant."
    INVESTIGATE_REALITY_CODE_7:99 "Merveille des Créateurs"
    INVESTIGATE_REALITY_CODE_7_DESC:99 "Nous détectons des niveaux d'énergie immenses en provenance du système auquel notre EHOF vient de se connecter !\n\nNous ferions mieux d'enquêter."
    ehof_travel.1001.NAME:99 "À la poursuite du Code"
    ehof_travel.1001.DESC:99 "Nous captons un faible signal provenant de quelque part dans le système auquel notre $ehof_ehof_abr$ vient de se connecter. Peut-être serait-ce quelque chose d'intéressant ?"
    ehof_travel.1001.a:99 "Cela pourrait être important."
    ehof_travel.1002.NAME:99 "Révélations sur la réalité"
    ehof_travel.1002.1.DESC:99 "Le §H[this.GetName]§! a détecté une transmission provenant du système §H[from.solar_system.GetName]§!. Comme la transmission précédente, elle a désactivé les systèmes principaux du vaisseau ; cette fois, le $ehof_closed_modular$ du vaisseau a pu le restaurer à pleine fonctionnalité en peu de temps. Les [Owner.GetScientistPlural] du vaisseau ont baptisé ce phénomène le $ehof_epcs$.\n\nAprès que le §H[this.GetName]§! a été remis en ligne, les scanners $ehof_ep$ à bord ont pu localiser l'origine de la transmission : un monde toxique que nos explorateurs ont nommé §H[from.GetName]§!.\n\nDes relevés supplémentaires intégrant les scanners $ehof_ep$ devraient permettre de localiser précisément la source de la transmission. Comme la transmission était très brève et ne s'est pas répétée, cela pourrait prendre un certain temps."
    ehof_travel.1002.2.DESC:99 "Une autre transmission du $ehof_epcs$ a été reçue par le §H[this.GetName]§! dans le système §H[from.solar_system.GetName]§!. Tout comme les deux instances précédentes, la transmission a désactivé le vaisseau. Cette fois, cependant, un $ehof_closed_modular$ amélioré a pu restaurer la fonctionnalité du vaisseau en quelques minutes.\n\nLes scanners $ehof_ep$ ont pu identifier la source de la transmission à l'intérieur du système : la planète brisée §H[from.GetName]§!. Avec des relevés supplémentaires, nous pourrons localiser la source exacte sur (ou à l'intérieur de) la planète — mais cela prendra du temps."
    ehof_travel.1002.3.DESC:99 "Le §H[this.GetName]§! a reçu une autre transmission du $ehof_epcs$ provenant de l'intérieur du système §H[from.solar_system.GetName]§!. Nos [Owner.GetScientistPlural] à bord du vaisseau ont déterminé que la transmission provenait d'une planète gelée nommée §H[from.GetName]§!.\n\nL'emplacement exact de l'émetteur doit être déterminé par des investigations supplémentaires avant que nous puissions organiser une expédition."
    ehof_travel.1002.4.DESC:99 "Une autre transmission du $ehof_epcs$ a été détectée à l'intérieur du système §H[from.solar_system.GetName]§! par le §H[this.GetName]§!, cette fois semblant provenir d'un monde en fusion nommé §H[from.GetName]§!.\n\nLes scanners $ehof_ep$ du vaisseau pourront en localiser la source, mais cela prendra un certain temps."
    ehof_travel.1002.5.DESC:99 "Le §H[this.GetName]§! a reçu une autre transmission du $ehof_epcs$. Cette fois, la transmission provenait d'une géante gazeuse nommée §H[from.GetName]§! dans le système §H[from.solar_system.GetName]§!.\n\nNous devrions enquêter sur cette source dès que possible."
    ehof_travel.1002.6.DESC:99 "En entrant dans le système §H[root.solar_system.GetName]§!, le §H[this.GetName]§! a détecté une transmission $ehof_ep$ — bien qu'étrangement, cette fois elle provenait de la naine brune étonnamment grande au centre du système.\n\nBien que l'étude de l'intérieur d'un tel objet à peine sous-stellaire soit intimidante, nous devons néanmoins trouver la source de la transmission et compléter le $ehof_epcs$."
    ehof_travel.1002.a:99 "Excellent ! Enquêtez immédiatement."
    ehof_travel.1003.NAME:99 "Merveille des Créateurs"
    ehof_travel.1003.DESC:99 "Nous détectons un étrange signal émanant du système §H[from.solar_system.GetName]§! ! Peut-être est-il lié au $ehof_epcs$ que nous recherchons depuis si longtemps ?"
    ehof_travel.1003.a:99 "Glorieux ! Il est temps de percer ce code."
    ehof_travel.1004.NAME:99 "La maîtrise nous attend"
    ehof_travel.1004.DESC:99 "Aucune entrée n'a pu être identifiée sur l'extérieur de la $ehof_the_sphere$. Elle pourrait être similaire aux objets amplificateurs que nous avons observés lors de nos études du $ehof_epcs$, dont les entrées ne se manifestent que sous des conditions spécifiques liées à l'$ehof_ep$.\n\nIl sera nécessaire d'étudier la structure afin de trouver un moyen d'y pénétrer, sans parler de déterminer sa fonction. Nos [Owner.GetResearchers] ont décidé de nommer la structure la $ehof_the_sphere_named$, d'après les motifs ondulants et non répétitifs qui se déplacent à sa surface."
    ehof_travel.1004.a:99 "Splendide ! Commençons..."

    #Shrouded Maze
    ehof_shrouded_maze_digsite:99 "La cité brisée"
    ehof_shrouded_maze_digsite_desc:99 "Les scans initiaux de la « surface » de [from.planet.GetName] révèlent que même si la planète a été fracturée, le paysage urbain qui recouvrait toute sa surface est relativement intact. Peut-être ces fragments survivants de la cité révéleront-ils ce qui est arrivé à la planète."

    ehof_shrouded_maze.11.name:99 "Et c'était magnifique"
    ehof_shrouded_maze.11.desc:99 "big description of broken city planet and its the capital which is on one of the broken pieces here"
    ehof_shrouded_maze.11.a:99 "response"

    ehof_shrouded_maze.12.name:99 "La promesse"
    ehof_shrouded_maze.12.desc:99 "explain Planet's prosperity, explain 'the promise' and its terms"
    ehof_shrouded_maze.12.a:99 "response"

    ehof_shrouded_maze.13.name:99 "Terribles tractations"
    ehof_shrouded_maze.13.desc:99 "Reading check, first maze clue,"
    ehof_shrouded_maze.13.a:99 "Right Response"
    ehof_shrouded_maze.13.b:99 "Wrong Response"

    ehof_shrouded_maze.14.name:99 "La paix en morceaux"
    ehof_shrouded_maze.14.desc:99 "Oh so thats what like actually happened, second maze clue, 3rd maze clue"
    ehof_shrouded_maze.14.a:99 "Its A-Maze-ing"

    giga_shrouded_maze:99 "Paysage rampant"
    giga_shrouded_maze_desc:99 "Le peu que nous pouvons scanner de la surface de cette planète à travers l'épais brouillard et les nuages est en perpétuel mouvement."