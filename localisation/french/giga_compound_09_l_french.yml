    # Immunity
    giga_compound_immunity:99 "Immunisé aux dégâts"
    weapon_type_anticompound:99 "§YAnticomplexe§!"
    mod_weapon_type_anticompound_weapon_damage_mult:99 "Armement anticomplexe"
    COMPOUND_IMMUNITY_AURA:99 "Immunité du Complexe"
    COMPOUND_IMMUNITY_AURA_SET:99 "Immunité du Complexe"

    # Situation
    compound_situation:99 "Briser $ehof_the_compound$"
    compound_situation_type:99 "Briser $ehof_the_compound$"
    compound_situation_desc:99 "Nous devons trouver des moyens d'endommager $ehof_the_compound$ si nous voulons survivre. Espérons qu'il nous reste assez de temps pour trouver une solution."
    compound_situation_monthly_change_tooltip:99 "La survie avant tout"

    compound_situation_desc_1:99 "Observer $ehof_the_compound_text$ et élaborer un plan d'action.\n\n§RNotre choix sera verrouillé après§! §Y1 an§! £time£ §R.§!"
    compound_situation_desc_2:99 "Gardez l'oeil ouvert pour toute opportunité d'analyser notre adversaire."
    compound_situation_desc_2_a:99 "Si nous abandonnons notre résolution maintenant, il sera trop tard pour réessayer. Les expériences doivent aboutir pour que notre empire survive."
    compound_situation_desc_3:99 "Nous attendrons une solution... il ne nous reste plus qu'à espérer."
    compound_situation_desc_3_a:99 "Nous avons acquis des armes à $giga_sr_negative_mass$ basiques, mais elles sont petites et faibles. Au moins, elles peuvent nous faire gagner du temps."
    compound_situation_desc_3_b:99 "Nos expériences ont échoué. Tout ce que nous pouvons faire maintenant, c'est espérer qu'il ne soit pas trop tard."

    compound_situation_finisher:99 "La solution adéquate se révélera avec le temps, mais cela pourrait prendre trop longtemps.\n\nDevons-nous attendre ou devons-nous agir ?\nQuoi qu'il en soit, nous devons faire vite."
    compound_situation_stage_1_tooltip:99 "Phase d'observation"
    compound_situation_stage_2_tooltip:99 "Phase d'expérimentation"
    compound_situation_stage_3_tooltip:99 "Phase d'application"

    compound_approach_wait:99 "Collecter des données"
    compound_approach_wait_tooltip:99 "Nous pouvons nous permettre d'attendre et d'observer jusqu'à ce que nous ayons rassemblé plus d'informations."
    compound_approach_qnm1:99 "Solution rapide"
    compound_approach_qnm1_tooltip:99 "Nous pourrions tenter des approches radicales et essayer de trouver une solution rapide."
    compound_approach_qnm2:99 "Vaisseaux prototypes"
    compound_approach_qnm2_tooltip:99 "Puisque nous ne pouvons pas obtenir d'échantillons des flottes de $ehof_the_compounds_text$, nous devons tester sur le terrain des technologies expérimentales dans l'espoir d'en trouver une qui fonctionne."
    compound_approach_qnm3:99 "Armes à masse négative"
    compound_approach_qnm3_tooltip:99 "Nous avons appris que la $giga_sr_negative_mass$ peut blesser $ehof_the_compound_text$. Bien que nous n'ayons pas encore libéré leur véritable potentiel, nous pouvons au moins fabriquer de petites armes utilisant ce type de matière."
    compound_approach_blokkat:99 "Armement Chat Block"
    compound_approach_blokkat_tooltip:99 "L'armement Chat Block déchire la réalité à un niveau fondamental. Il pourrait être capable de blesser ces créatures."
    compound_approach_DEBUG:99 "§PDEBUG§!"
    compound_approach_DEBUG_tooltip:99 "§PCECI EST UNE COMMANDE DEBUG ET N'EST PAS CENSÉE ÊTRE VISIBLE§!\n\n\n"
    compound_approach_DEBUG_ADD:99 "§PADDITION (DEBUG)§!"
    compound_approach_DEBUG_SUB:99 "§PSOUSTRACTION (DEBUG)§!"
    compound_approach_DEBUG_VAR:99 "$compound_approach_DEBUG_tooltip$VAR owner.compound_protoships_eaten: [owner.compound_protoships_eaten]\n\n\n"

    compound_gimmeyaships:99 "Tester $ehof_the_compound$"
    compound_gimmeyaships_type:99 "Tester $ehof_the_compound$"
    compound_gimmeyaships_desc:99 "Même si nous n'avons aucun moyen de leur faire du mal, nous enverrons nos vaisseaux contre $ehof_the_compound_text$ pour tenter de découvrir une quelconque faiblesse.\n\n§WNous devons sacrifier §!§Y[owner.compound_protoships_tobeeaten]§!§W vaisseaux à leurs forces avant que le chronomètre de la situation $compound_situation$ n'expire.§!"
    compound_gimmeyaships_monthly_change_tooltip:99 "Buffet de vaisseaux"

    compound_gimmeyaships_approach:99 "Buffet de vaisseaux"
    compound_gimmeyaships_approach_tooltip:99 "Nos [Owner.GetEngineerPlural] ont équipé nos flottes de technologies prototypes aléatoires destinées à tester tout ce qu'ils peuvent. Envoyez-les contre $ehof_the_compound_text$ pour voir ce qui se passe."

    compound_gimmeyaships_finisher:99 "Les technologies expérimentales équipées sur nos vaisseaux sacrificiels ont enfin révélé des informations sur la nature de $ehof_the_compound_text$.\n"

    # Situation Events
    compound_situation.1.title:99 "Armement Chat Block"
    compound_situation.1.desc:99 "Nous avons déjà tout ce qu'il faut pour écraser $ehof_the_compound_text$. Inutile de perdre du temps avec des projets futiles."
    compound_situation.1.a:99 "§ROn va leur montrer de quoi on est capables !§!"
    compound_situation.1.a.tooltip:99 "§RAnnuler la situation§!"
    compound_situation.1.b:99 "Il serait sage d'enquêter quand même."

    compound_situation.2.title:99 "Attendre et observer"
    compound_situation.2.desc:99 "Nous avons décidé que $ehof_the_compound_text$ ne constitue pas une menace immédiate pour nous. Nous pouvons nous permettre de les observer avant de décider de notre prochain mouvement."
    compound_situation.2.a:99 "Ce n'est qu'une crise de plus."

    compound_situation.3.title:99 "À la recherche de solutions"
    compound_situation.3.desc:99 "$ehof_the_compound_text$ semble être une menace inarrêtable — mais nous avons assez vu dans cet univers pour savoir qu'il y a toujours une réponse quelque part, d'une manière ou d'une autre. Ils doivent avoir une faiblesse.\n\nNous construirons de nombreux vaisseaux dotés d'armes expérimentales différentes, et nous combattrons jusqu'à ce que quelque chose fonctionne."
    compound_situation.3.a:99 "La recherche par les armes, pas par les labos !"

    compound_situation.4.title:99 "Faiblesse découverte"
    compound_situation.4.desc:99 "Nous avons réussi ! Nous avons trouvé une faiblesse insaisissable de $ehof_the_compound_text$ — une dont même eux pourraient ne pas être conscients. Il s'avère que la $giga_sr_negative_mass$ peut les blesser ! Malheureusement, notre maîtrise de cette technologie est limitée, et nous ne sommes capables de concevoir que des armes de petite taille. Cela devrait suffire à nous faire gagner du temps, au moins."
    compound_situation.4.a:99 "Ça fera l'affaire, bon travail à tous."

    compound_situation.5.title:99 "Nous n'avons pas trouvé de faiblesse"
    compound_situation.5.desc:99 "Malgré tous nos efforts, nous n'avons tout simplement pas réussi à trouver et exploiter une faiblesse significative chez $ehof_the_compound_text$. Il ne reste plus beaucoup de temps, et les dirigeants de notre empire commencent à perdre espoir de surmonter cette crise."
    compound_situation.5.a:99 "L'espoir est une chose si fugace, n'est-ce pas ?"

    compound_situation.6.title:99 "Toujours en attente"
    compound_situation.6.desc:99 "Tandis que nous attendons que quelque chose se passe, la galaxie brûle autour de nous.\n\nIgnorez simplement $ehof_the_compound_text$ et tout ira bien.\n\nL'ignorance est un bonheur, non ?"
    compound_situation.6.a:99 "Tout va bien."

    compound_situation.9.title:99 "Projet abandonné"
    compound_situation.9.desc:99 "Nous avons reçu des nouvelles d'une meilleure solution pour faire face à $ehof_the_compound_text$ et avons abandonné notre projet actuel."
    compound_situation.9.a:99 "Eh bien, au moins on peut les combattre maintenant."

    compound_situation.10.title:99 "Données collectées"
    compound_situation.10.desc:99 "Nous avons enregistré des quantités massives de données sur la façon dont les vaisseaux de $ehof_the_compounds_text$ réagissent à nos attaques. Maintenant, nous attendons que nos experts les analysent et trouvent une solution."
    compound_situation.10.a:99 "J'espère que ça en valait la peine."
    compound_situation.10.a.tooltip:99 "La situation $compound_situation$ progresse de §G+20 points§!"

    # Custom tooltips statuses
    compound_situation_already_open:99 "Dialogue déjà ouvert, fermez-le d'abord."
    compound_situation_no_qnm_tech:99 "\n§RPeut-être que les réponses que nous cherchons se trouvent à travers les trous de ver produits par un $ehof_ehof_abr$...§!"
    compound_situation_chosen_route:99 "Nous avons déjà choisi notre voie."
    compound_situation_qnm2_failed:99 "Nous n'avons pas réussi à découvrir leur faiblesse."

