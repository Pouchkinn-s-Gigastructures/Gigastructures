  # Immunity
  giga_compound_immunity:0 "Immunisé aux dégâts"
  weapon_type_anticompound:0 "§YAnticomplexe§!"
  mod_weapon_type_anticompound_weapon_damage_mult:0 "Armement anticomplexe"
  COMPOUND_IMMUNITY_AURA:0 "Immunité du Complexe"
  COMPOUND_IMMUNITY_AURA_SET:0 "Immunité du Complexe"
  
  # Situation
  compound_situation:0 "Briser $ehof_the_compound$"
  compound_situation_type:0 "Briser $ehof_the_compound$"
  compound_situation_desc:0 "Nous devons investiguer des moyens d'endommager $ehof_the_compound$ si nous voulons survivre. Espérons qu'il nous reste assez de temps pour trouver une solution."
  compound_situation_monthly_change_tooltip:0 "La survie est primordiale"
  
  compound_situation_desc_1:0 "Observer $ehof_the_compound_text$ et élaborer un plan sur la marche à suivre.\n\n§RNotre choix sera verrouillé après§! §Y1 an§! £time£ §R.§!"
  compound_situation_desc_2:0 "Gardez les yeux ouverts pour des opportunités d'analyser notre adversaire."
  compound_situation_desc_2_a:0 "Si nous abandonnons notre résolution maintenant, il sera trop tard pour réessayer. Les expériences doivent être complétées pour que notre empire survive."
  compound_situation_desc_3:0 "Nous attendrons une solution... il n'y a rien d'autre à faire qu'espérer."
  compound_situation_desc_3_a:0 "Nous avons obtenu des armes basiques à $giga_sr_negative_mass$, mais elles sont petites et faibles. Au moins elles peuvent nous faire gagner du temps."
  compound_situation_desc_3_b:0 "Nos expériences ont échoué. Tout ce que nous pouvons faire maintenant est espérer qu'il n'est pas trop tard."
  
  compound_situation_finisher:0 "La solution appropriée se révélera avec le temps, mais cela pourrait prendre trop longtemps.\n\nDevons-nous attendre ou devons-nous agir ?\nQuoi qu'il en soit, nous devons être rapides."
  compound_situation_stage_1_tooltip:0 "Phase d'observation"
  compound_situation_stage_2_tooltip:0 "Phase d'expérimentation"
  compound_situation_stage_3_tooltip:0 "Phase d'application"
  
  compound_approach_wait:0 "Collecter des données"
  compound_approach_wait_tooltip:0 "Nous pouvons nous permettre d'attendre et d'observer jusqu'à ce que nous ayons rassemblé plus d'informations."
  compound_approach_qnm1:0 "Solution rapide"
  compound_approach_qnm1_tooltip:0 "Nous pourrions essayer des approches radicales, et tenter de trouver une solution rapide."
  compound_approach_qnm2:0 "Vaisseaux prototypes"
  compound_approach_qnm2_tooltip:0 "Puisque nous ne pouvons pas obtenir d'échantillons des flottes $ehof_the_compounds_text$, nous devons tester sur le terrain des technologies expérimentales dans l'espoir d'en trouver une qui fonctionne."
  compound_approach_qnm3:0 "Armes à masse négative"
  compound_approach_qnm3_tooltip:0 "Nous avons appris que la $giga_sr_negative_mass$ peut blesser $ehof_the_compound_text$. Bien que nous n'ayons pas encore débloqué leur vrai potentiel, nous pouvons au moins fabriquer de petites armes qui utilisent ce type de matière."
  compound_approach_blokkat:0 "Armement Blokkat"
  compound_approach_blokkat_tooltip:0 "L'armement Blokkat déchiquète la réalité à un niveau fondamental. Il pourrait être capable de blesser ces créatures."
  compound_approach_DEBUG:0 "§PDÉBOGAGE§!"
  compound_approach_DEBUG_tooltip:0 "§PCECI EST UNE COMMANDE DE DÉBOGAGE ET N'EST PAS CENSÉE ÊTRE VUE§!\n\n\n"
  compound_approach_DEBUG_ADD:0 "§PAJOUT (DÉBOGAGE)§!"
  compound_approach_DEBUG_SUB:0 "§PSOUSTRAIRE (DÉBOGAGE)§!"
  compound_approach_DEBUG_VAR:0 "$compound_approach_DEBUG_tooltip$VAR owner.compound_protoships_eaten: [owner.compound_protoships_eaten]\n\n\n"
  
  compound_gimmeyaships:0 "Tester $ehof_the_compound$"
  compound_gimmeyaships_type:0 "Tester $ehof_the_compound$"
  compound_gimmeyaships_desc:0 "Même si nous n'avons aucun moyen de leur faire du mal, nous lancerons nos vaisseaux contre $ehof_the_compound_text$ pour tenter de découvrir une quelconque faiblesse.\n\n§WNous devons sacrifier §!§Y[owner.compound_protoships_tobeeaten]§!§W vaisseaux à leurs forces avant que le chronomètre de la situation $compound_situation$ n'expire.§!"
  compound_gimmeyaships_monthly_change_tooltip:0 "Buffet de vaisseaux spatiaux"
  
  compound_gimmeyaships_approach:0 "Buffet de vaisseaux spatiaux"
  compound_gimmeyaships_approach_tooltip:0 "Nos [Owner.GetEngineerPlural] ont équipé nos flottes de technologies prototypes aléatoires destinées à tester tout ce qu'ils peuvent. Lancez-les contre $ehof_the_compound_text$ pour voir ce qui se passe."
  
  compound_gimmeyaships_finisher:0 "Les technologies expérimentales équipées sur nos vaisseaux sacrificiels ont enfin fourni des informations sur la nature de $ehof_the_compound_text$.\n"
  
  # Situation Events
  compound_situation.1.title:0 "Armement Blokkat"
  compound_situation.1.desc:0 "Nous avons déjà tout ce qu'il nous faut pour écraser $ehof_the_compound_text$. Inutile de perdre du temps avec des projets stupides."
  compound_situation.1.a:0 "§ROn va leur montrer ce qu'on a !§!"
  compound_situation.1.a.tooltip:0 "§RAnnuler la situation§!"
  compound_situation.1.b:0 "Il serait sage d'investiguer quand même."
  
  compound_situation.2.title:0 "Attendre et observer"
  compound_situation.2.desc:0 "Nous avons décidé que $ehof_the_compound_text$ n'était pas une menace immédiate pour nous. Nous pouvons nous permettre de les observer avant de décider de notre prochain mouvement."
  compound_situation.2.a:0 "C'est juste une autre crise."
  
  compound_situation.3.title:0 "À la recherche de solutions"
  compound_situation.3.desc:0 "$ehof_the_compound_text$ est une menace apparemment imparable - mais nous avons vu assez de choses dans cet univers pour savoir qu'il y a toujours une réponse quelque part, d'une manière ou d'une autre. Ils doivent avoir une faiblesse.\n\nNous construirons de nombreux vaisseaux avec différentes armes expérimentales, et nous combattrons jusqu'à ce que quelque chose fonctionne."
  compound_situation.3.a:0 "La recherche avec des armes, pas des labos !"
  
  compound_situation.4.title:0 "Faiblesse découverte"
  compound_situation.4.desc:0 "Nous avons réussi ! Nous avons trouvé une faiblesse insaisissable de $ehof_the_compound_text$ - une faiblesse dont même eux pourraient ne pas être conscients. Il s'avère que la $giga_sr_negative_mass$ peut les blesser ! Malheureusement, notre maîtrise de cette technologie est limitée, et nous ne sommes capables que de concevoir des armes plus petites. Cela devrait suffire à nous faire gagner du temps, au moins."
  compound_situation.4.a:0 "Ça fera l'affaire, bon travail à tous."
  
  compound_situation.5.title:0 "Nous n'avons pas réussi à trouver une faiblesse"
  compound_situation.5.desc:0 "Bien que nous ayons fait de notre mieux, nous avons simplement échoué à trouver et exploiter une faiblesse significative chez $ehof_the_compound_text$. Il ne reste plus beaucoup de temps, et les dirigeants de notre empire commencent à perdre espoir de surmonter cette crise."
  compound_situation.5.a:0 "L'espoir est une chose si fugace, n'est-ce pas ?"
  
  compound_situation.6.title:0 "Toujours en attente"
  compound_situation.6.desc:0 "Pendant que nous attendons que quelque chose se passe, la galaxie brûle autour de nous.\n\nIgnorez simplement $ehof_the_compound_text$ et tout ira bien.\n\nL'ignorance est un bonheur, n'est-ce pas ?"
  compound_situation.6.a:0 "Tout va bien."
  
  compound_situation.9.title:0 "Projet abandonné"
  compound_situation.9.desc:0 "Nous avons reçu des nouvelles d'une meilleure solution pour faire face à $ehof_the_compound_text$ et avons abandonné notre projet actuel."
  compound_situation.9.a:0 "Eh bien, au moins on peut les combattre maintenant."
  
  compound_situation.10.title:0 "Données collectées"
  compound_situation.10.desc:0 "Nous avons enregistré d'énormes quantités de données sur la façon dont les vaisseaux $ehof_the_compounds_text$ réagissent à nos attaques. Maintenant, nous attendons que nos experts les analysent et trouvent une solution."
  compound_situation.10.a:0 "Ça a intérêt à en avoir valu la peine."
  compound_situation.10.a.tooltip:0 "La situation $compound_situation$ progresse de §G+20 points§!"
  
  # Custom tooltips statuses
  compound_situation_already_open:0 "Dialogue déjà ouvert, fermez-le d'abord."
  compound_situation_no_qnm_tech:0 "\n§RPeut-être que les réponses que nous cherchons se trouvent à travers les trous de ver produits par un $ehof_ehof_abr$...§!"
  compound_situation_chosen_route:0 "Nous avons déjà choisi notre voie."
  compound_situation_qnm2_failed:0 "Nous avons échoué à découvrir leur faiblesse."
  
