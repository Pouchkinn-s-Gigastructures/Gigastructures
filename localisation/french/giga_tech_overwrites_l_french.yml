 giga_tech_ring_world_swap_no_habitables:99 "Essaims de déconstruction auto-réplicants à grande échelle"
 giga_tech_ring_world_swap_no_habitables_desc:99 "Les planètes sont très, très grandes.\nPour collecter efficacement des matériaux à des échelles aussi extrêmes, de nouveaux systèmes de contrôle doivent être développés pour des essaims de drones miniers spécialisés."

 giga_tech_ring_world_swap_no_habitables_bio:99 "Écologies de déconstructeurs artificiels"
 giga_tech_ring_world_swap_no_habitables_bio_desc:99 "Une racine suffisamment persistante peut percer la roche-mère la plus dure."
