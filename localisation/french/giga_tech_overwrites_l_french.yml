 feature_bulk_matter_desc:99 "Débloque des ['concept_decisions'] pour démanteler des planètes entières afin d'obtenir de la £giga_sr_bulk_matter£ §H$giga_sr_bulk_matter$§!, une ressource à grande échelle nécessaire à la construction des plus grandes mégastructures."

