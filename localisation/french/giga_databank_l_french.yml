  concept_giga_sr_amb_megaconstruction:0 "$giga_sr_amb_megaconstruction$"
  concept_giga_sr_amb_megaconstruction_desc:0 "£giga_sr_amb_megaconstruction£ §H$giga_sr_amb_megaconstruction$§! représente des matériaux avancés capables de résister à des niveaux incroyables de contrainte de traction, les rendant essentiels dans la construction des plus grandes installations spatiales.\n\nPlus notre revenu en est élevé, plus vite les ['concept_megastructures'] pourront être construites. Ils sont §Hrépartis§! entre toutes les mégastructures en cours de construction, ce qui signifie que construire plusieurs mégastructures simultanément §Hralentira§! leur vitesse de construction globale. Ils agissent donc comme une limite « souple » sur notre capacité de construction parallèle de mégastructures.\n\nDe plus, la plupart des mégastructures ont un certain §Hentretien§! en cette ressource, les plus grandes ayant un entretien plus élevé.\n\nPour augmenter :\n- Construire £building£['building:building_giga_megaworkshop_hub'] ou £building£ ['building:building_giga_megaworkshop']\n- Construire des £mining_station£ ['concept_mining_stations'] sur des ['concept_celestial_objects'] avec des gisements de matériaux supertensiles"

  concept_giga_sr_bulk_matter:0 "$giga_sr_bulk_matter$"
  concept_giga_sr_bulk_matter_desc:0 "£giga_sr_bulk_matter£ §H$giga_sr_bulk_matter$§! représente de grandes quantités de matériaux bruts non raffinés de faible valeur récoltés sur des corps célestes, utilisés comme remplissage dans la construction de ['concept_megastructures'] extrêmement grandes ou de celles visant à reproduire des conditions planétaires.\n\nElle peut être récoltée sur des §Hastéroïdes§!, des §Hplanètes rocheuses§! et des §Hgéantes gazeuses§!, à un taux de §Y1§! £giga_sr_bulk_matter£ §H$giga_sr_bulk_matter$§! par ['concept_planet_size'].\n\nCette ressource est nécessaire pour construire le §Hmonde-anneau§!, le §Hcerveau Matriochka§!, le §Hdisque d'Alderson§!, le §Hmonde de Birch§!, l'§Hoblitérateur quasi-stellaire§!, l'§HE.H.O.F. supermassif§! et le §Hfaisceau de Nicoll-Dyson§!.\n\nElle est également utilisée par le §Hmacrofabricateur lunaire§! et l'§Husine d'assemblage béhémoth§! pour créer des §Hlunes de combat§! et des §Hplanétovaisseaux béhémoth§!, respectivement.\n\nSi la mégastructure §Hsupprime des planètes§! dans le cadre de sa construction, alors le contenu en £giga_sr_bulk_matter£ §H$giga_sr_bulk_matter$§! des planètes du système sera §Hdéduit§! de la phase de construction initiale. Les restes seront stockés dans un §HCache de matière brute§! au-dessus de l'étoile du système qui pourra ensuite être récolté pour récupérer son contenu.\n\nPar exemple, si un système contient §Y75§! £giga_sr_bulk_matter£ alors un §Hcadre de monde-anneau§! qui nécessite normalement §Y100§! £giga_sr_bulk_matter£ n'en nécessitera que §Y25§! £giga_sr_bulk_matter£. Cependant, si le système contient §Y150§! £giga_sr_bulk_matter£, alors la phase initiale de la mégastructure ne coûtera pas de £giga_sr_bulk_matter£ et le §HCache§! contiendra §Y50§! £giga_sr_bulk_matter£ à récolter. Les phases de construction suivantes ne sont pas affectées par cette mécanique et nécessiteront des £giga_sr_bulk_matter£ stockés.\n\nPour augmenter :\n- Utiliser la ['concept_decision'] §H$decision_harvest_matter_for_planetary_printing$§! sur un ['concept_celestial_object'] non-stellaire pour construire un §H$moon_printer_orbital_mass_harvester_1$§! et démanteler la planète, produisant §Y1§! £giga_sr_bulk_matter£ §H$giga_sr_bulk_matter$§! tous les §Y6§! mois. Cela ne peut pas être arrêté et finira par §Rsupprimer§! complètement la planète.\n- Sélectionner la décision sur l'['concept_star'] d'un système pour commencer ce processus sur chaque planète du ['concept_system']."

