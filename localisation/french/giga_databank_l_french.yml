  concept_giga_sr_amb_megaconstruction:99 "$giga_sr_amb_megaconstruction$"
  concept_giga_sr_amb_megaconstruction_desc:99 "£giga_sr_amb_megaconstruction£ §H$giga_sr_amb_megaconstruction$§! représente des matériaux avancés capables de résister à des niveaux incroyables de contrainte de traction, ce qui les rend essentiels dans la construction des plus grandes installations spatiales.\n\nPlus nos revenus en ces matériaux sont élevés, plus les ['concept_megastructures'] pourront être construites rapidement. Ils sont §Hrépartis§! entre toutes les mégastructures en cours de construction, ce qui signifie que construire plusieurs mégastructures simultanément §Hralentira§! leur vitesse de construction globale. Ils agissent donc comme une limite « souple » sur notre capacité de construction parallèle de mégastructures.\n\nDe plus, la plupart des mégastructures ont un certain §Hentretien§! en ces matériaux, les plus grandes ayant un entretien plus élevé.\n\nPour en augmenter la production :\n- Construire £building£['building:building_giga_megaworkshop_hub'] ou £building£ ['building:building_giga_megaworkshop']\n- Construire des £mining_station£ ['concept_mining_stations'] sur des ['concept_celestial_objects'] possédant des gisements de matériaux supertensiles"

  concept_giga_sr_bulk_matter:99 "$giga_sr_bulk_matter$"
  concept_giga_sr_bulk_matter_desc:99 "£giga_sr_bulk_matter£ §H$giga_sr_bulk_matter$§! représente de grandes quantités de matériaux bruts de faible valeur récoltés sur des objets célestes, utilisés comme matière de remplissage dans la construction de ['concept_megastructures'] extrêmement grandes ou de celles visant à reproduire des conditions planétaires.\n\nElle peut être récoltée sur les §Hastéroïdes§!, les §Hplanètes rocheuses§! et les §Hgéantes gazeuses§!, à raison de §Y1§! £giga_sr_bulk_matter£ §H$giga_sr_bulk_matter$§! par ['concept_planet_size'].\n\nCette ressource est nécessaire pour construire le §Hmonde-anneau§!, le §Hcerveau de Matriochka§!, le §Hdisque d'Alderson§!, le §Hmonde de Birch§!, l'§Hoblitérateur quasi-stellaire§!, l'§HEHOF supermassif§! et le §Hfaisceau de Nicoll-Dyson§!.\n\nElle est également utilisée par le §Hmacrofabricateur lunaire§! et l'§Husine d'assemblage Béhémoth§! pour créer respectivement des §Hlunes de combat§! et des §Hplanétovaisseaux Béhémoth§!.\n\nSi la mégastructure §Hsupprime des planètes§! dans le cadre de sa construction, alors le contenu en £giga_sr_bulk_matter£ §H$giga_sr_bulk_matter$§! des planètes du système sera §Hdéduit§! de la phase de construction initiale. Les surplus seront stockés dans un §Hcache de matière brute§! au-dessus de l'étoile du système, qui pourra ensuite être exploité pour en récupérer le contenu.\n\nPar exemple, si un système contient §Y75§! £giga_sr_bulk_matter£, alors une §Harmature de monde-anneau§! qui nécessite normalement §Y100§! £giga_sr_bulk_matter£ n'en nécessitera que §Y25§! £giga_sr_bulk_matter£. Cependant, si le système contient §Y150§! £giga_sr_bulk_matter£, alors la phase initiale de la mégastructure ne coûtera aucune £giga_sr_bulk_matter£ et le §Hcache§! contiendra §Y50§! £giga_sr_bulk_matter£ à récolter. Les phases de construction suivantes ne sont pas affectées par cette mécanique et nécessiteront des £giga_sr_bulk_matter£ stockées.\n\nPour en augmenter la production :\n- Utiliser la ['concept_decision'] §H$decision_harvest_matter_for_planetary_printing$§! sur un ['concept_celestial_object'] non stellaire pour construire un §H$moon_printer_orbital_mass_harvester_1$§! et démanteler la planète, produisant §Y1§! £giga_sr_bulk_matter£ §H$giga_sr_bulk_matter$§! tous les §Y6§! mois. Ce processus ne peut être interrompu et finira par §Rsupprimer§! complètement la planète.\n- Sélectionner le décret sur l'['concept_star'] d'un système pour lancer ce processus sur toutes les planètes du ['concept_system']."

