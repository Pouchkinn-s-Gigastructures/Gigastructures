    giga_blokkat_join.5603.name:99 "Négocier avec §Y[blokkat_strike_leader_negotiate.GetName]§!"
    giga_blokkat_join.5603.desc:99 "Nous pouvons essayer de dépenser de l'§MInfluence§!, de l'§BUnité§! et possiblement de l'§YÉnergie§! pour convaincre §Y[blokkat_strike_leader_10.GetName]§! de se ranger de notre côté concernant les affaires Chat Block.\n\nÉtant donné la valeur actuelle de leur volonté respective (§BVolonté scientifique§! pour les §BScientifiques§!, §PVolonté militaire§! pour les §PAmiraux§! et §GGénéraux§!, et §HVolonté gouvernementale§! pour les §HGouverneurs§!) et leur niveau de compétence de §Y[ROOT.blokkat_leader_negotiate_level]§!, les chances de succès des négociations sont de §Y[ROOT.blokkat_leader_negotiate_odds] %§!.\n\nIl en coûterait £influence£§Y[ROOT.blokkat_leader_negotiate_influence_cost]§! et £unity£§Y[ROOT.blokkat_leader_negotiate_unity_cost]§! pour procéder aux négociations."

    giga_blokkat_join.5603.yes:99 "Procéder ([ROOT.blokkat_leader_negotiate_odds] % de chance)."
    giga_blokkat_join.5603.bribe:99 "Procéder avec un pot-de-vin et promettre une grosse augmentation. | £energy£§Y[ROOT.blokkat_leader_negotiate_energy_cost]§! ([ROOT.blokkat_leader_negotiate_odds_payrise] % de chance)"
    giga_blokkat_join.5603.bribe.tooltip:99 "Si réussi, §Y[blokkat_strike_leader_negotiate.GetName]§! gagnera le trait §HPot-de-vin pro-Chat Block§!, augmentant son §YEntretien de dirigeant§! de §Y300 %§! et réduisant le §YGain d'XP§! de §Y30 %§!.\n\nDiminuera la §MVolonté de la population§! de §G1,5 %§! si nous sommes §YÉgalitaires§! et de §G3 %§! si nous sommes §YÉgalitaires fanatiques§!."

    giga_blokkat_join.5604.name:99 "Négociations réussies !"
    giga_blokkat_join.5604.desc:99 "Notre Bureau de recherche Chat Block rapporte que §Y[blokkat_strike_leader_negotiate.GetName]§! a enfin décidé de nous rejoindre dans notre quête pour rejoindre les Chats Blocks.\n\nIl/Elle a donc déclaré la fin de ses grèves et reprendra ses fonctions immédiatement.\n\nLa chance de succès était de §Y[ROOT.blokkat_leader_negotiate_odds] %§!"
    giga_blokkat_join.5604.a:99 "Merveilleux !"
    giga_blokkat_join.5604.bribe:99 "Un petit pot-de-vin va loin."
    trait_blokkat_payrise:99 "Pot-de-vin pro-Chat Block"
    trait_blokkat_payrise_desc:99 "Bien que réticent à se ranger de notre côté concernant les affaires Chat Block, ce dirigeant a été corrompu avec une grosse augmentation."

    giga_blokkat_join.5605.name:99 "Échec des négociations."
    giga_blokkat_join.5605.desc:99 "Notre Bureau de recherche Chat Block rapporte que §Y[blokkat_strike_leader_negotiate.GetName]§! a refusé de coopérer avec nous concernant notre projet de nous ranger du côté des Chats Blocks.\n\nIl/Elle a véhément rejeté toutes les tentatives de médiation et continuera donc ses protestations insensées.\n\nLa chance de succès était de §Y[ROOT.blokkat_leader_negotiate_odds] %§!"
    giga_blokkat_join.5605.a:99 "L'imbécile..."

    edict_blokkat_science_willingness_propaganda:99 "§GÉdit de Volonté :§! Propagande pro-Chat Block §Bscientifique§!"
    edict_blokkat_science_willingness_propaganda_desc:99 "Nos scientifiques doivent comprendre que notre plan est évidemment la chose la plus logique à faire. Des quantités abondantes de propagande et d'articles approuvés par le gouvernement leur seront donc distribués.\n\nTant que cet édit est actif, la §BVolonté scientifique§! aura §Y5 %§! de chance d'augmenter de §G1 %§! chaque mois."
    edict_blokkat_military_willingness_propaganda:99 "§GÉdit de Volonté :§! Propagande pro-Chat Block §Pmilitaire§!"
    edict_blokkat_military_willingness_propaganda_desc:99 "Notre amirauté doit comprendre que notre plan est évidemment la chose la plus logique à faire. Des quantités abondantes de propagande et d'articles approuvés par le gouvernement leur seront donc distribués.\n\nTant que cet édit est actif, la §PVolonté militaire§! aura §Y5 %§! de chance d'augmenter de §G1 %§! chaque mois."
    edict_blokkat_government_willingness_propaganda:99 "§GÉdit de Volonté :§! Propagande pro-Chat Block §Hgouvernementale§!"
    edict_blokkat_government_willingness_propaganda_desc:99 "Nos organes gouvernementaux doivent comprendre que notre plan est évidemment la chose la plus logique à faire. Des quantités abondantes de propagande et d'articles approuvés par le gouvernement leur seront donc distribués.\n\nTant que cet édit est actif, la §HVolonté gouvernementale§! aura §Y5 %§! de chance d'augmenter de §G1 %§! chaque mois."
    edict_blokkat_population_willingness_propaganda:99 "§GÉdit de Volonté :§! Propagande pro-Chat Block §Mpopulaire§!"
    edict_blokkat_population_willingness_propaganda_desc:99 "Notre peuple doit comprendre que notre plan est évidemment la chose la plus logique à faire. Des quantités abondantes de propagande et d'articles approuvés par le gouvernement leur seront donc distribués.\n\nTant que cet édit est actif, la §MVolonté de la population§! aura §Y5 %§! de chance d'augmenter de §G1 %§! chaque mois."

    giga_blokkat_join.5500.scrap:99 "Distribuer des échantillons de £blokkat_scrap_icon£ §MFerraille Chat Block§!..."
    giga_blokkat_join.5500.scrap.tooltip:99 "En montrant les belles subtilités de la technologie Chat Block à notre civilisation, nous pourrions bien être en mesure de prouver que s'efforcer de travailler avec les Chats Blocks est certainement le meilleur choix."

    giga_blokkat_join.5700.name:99 "Distribution de §MFerraille Chat Block§!"
    giga_blokkat_join.5700.desc:99 "La technologie Chat Block est indubitablement belle de bien des manières qui dépassent la compréhension. Dans les échantillons récupérés des vaisseaux Chat Block, malgré les dommages qu'ils ont subis, des formations complexes de nanomachines hyperdimensionnelles tourbillonnent les unes autour des autres de manières qui ne peuvent qu'engendrer un sentiment de pure admiration.\n\nAinsi, il est évident que distribuer certains de ces merveilleux échantillons aux membres réticents de notre civilisation les convaincra que devenir un avec ces êtres extragalactiques nous transformera, sans l'ombre d'un doute, en quelque chose de bien plus grand."

    giga_willingness_needs_scrap:99 "Nous devons avoir acquis de la £blokkat_scrap_icon£ §MFerraille Chat Block§!"
    giga_blokkat_50_blokkat_scrap:99 "-§Y50§! £blokkat_scrap_icon£"
    giga_blokkat_join.5700.science:99 "Distribuer de la ferraille aux §BScientifiques§! | §Y50§! £blokkat_scrap_icon£"
    giga_blokkat_join.5700.science.tooltip:99 "Augmentera la §BVolonté scientifique§! d'entre §G3 %§! et §G7 %§!. Plus susceptible d'augmenter davantage si nous sommes §YMatérialistes§!."
    giga_blokkat_join.5700.military:99 "Distribuer de la ferraille aux §PAmiraux§! | §Y50§! £blokkat_scrap_icon£"
    giga_blokkat_join.5700.military.tooltip:99 "Augmentera la §PVolonté militaire§! d'entre §G3 %§! et §G7 %§!. Plus susceptible d'augmenter davantage si nous sommes §YMilitaristes§!."
    giga_blokkat_join.5700.government:99 "Distribuer de la ferraille aux §HGouverneurs§! | §Y50§! £blokkat_scrap_icon£"
    giga_blokkat_join.5700.government.tooltip:99 "Augmentera la §HVolonté gouvernementale§! d'entre §G3 %§! et §G7 %§!. Plus susceptible d'augmenter davantage si nous sommes §YAutoritaires§!."
    giga_blokkat_join.5700.population:99 "Distribuer de la ferraille à la §MPopulation§! | §Y50§! £blokkat_scrap_icon£"
    giga_blokkat_join.5700.population.tooltip:99 "Augmentera la §MVolonté de la population§! d'entre §G3 %§! et §G7 %§!. Plus susceptible d'augmenter davantage si nous sommes §YAutoritaires§!."
    giga_willingness_every_5_years:99 "Ne peut être fait que tous les §Y5 ans§!."
    giga_willingness_needs_50_scrap:99 "£blokkat_scrap_icon£ §MFerraille Chat Block§! insuffisante !"

    giga_blokkat_join.5700.bye:99 "Oublier ça."

    building_giga_blokkat_energy_capacitor:99 "Condensateur d'énergie Chat Blockwork"
    building_giga_blokkat_energy_capacitor_desc:99 "Ces flèches complexes améliorent la puissance de notre propre réseau Chat Blockwork, nous permettant de gérer et traiter les quantités gargantuesque d'énergie requises par les §YChat Block-Protokols§!."

    PLANET_KILLER_BLOKKAT_HARVESTER:99 "Démantèleur céleste"
    PLANET_KILLER_BLOKKAT_HARVESTER_DESC:99 "Le Démantèleur céleste Chat Block « enroule » littéralement l'espace-temps vers une singularité spécialement conçue au coeur du vaisseau, le dissolvant en énergie exploitable à transférer dans le Chat Blockwork."
    PLANET_KILLER_BLOKKAT_HARVESTER_ACTION:99 "Récolter"
    FLEETORDER_DESTROY_PLANET_WITH_PLANET_KILLER_BLOKKAT_HARVESTER:99 "Préparation de la récolte de $PLANET|Y$"
    MESSAGE_DESC_FOR_PLANET_KILLER_BLOKKAT_HARVESTER:99 "a été récoltée par"

    giga_blokkat_join.2999.name:99 "Une fin..."
    giga_blokkat_join.2999.desc:99 "Alors qu'un torrent d'énergie insondable commence à affluer dans le §PPylône Chat Blockwork§!, un sentiment d'effroi envahit soudainement notre civilisation. Était-ce, peut-être, un piège ? Les Chats Blocks nous ont-ils, peut-être, trompés pour que nous nous sacrifiions pour renforcer leurs propres opérations de récolte et se débarrasser d'une nuisance potentielle ?\n\nEn quelques instants, les §YNoeuds d'alimentation Chat Blockwork§! à travers nos mondes commencent à s'agiter et l'espace commence à se contracter, comme s'ils étaient devenus des singularités. D'abord les villes, puis les continents, et finalement les mondes et les étoiles eux-mêmes commencent à se ratatiner et à disparaître dans les noeuds, vraisemblablement absorbés dans le tissu du §YChat Blockwork§!.\n\nEt pourtant, l'effroi s'évapore rapidement et un sentiment omniprésent de justesse est bientôt tout ce qui occupe les esprits de nos citoyens. Quelle que soit l'intention des Chats Blocks, c'était, indubitablement, la bonne chose à faire. Les Chats Blocks avaient un plan, une ambition, de remodeler l'univers en une structure de complexité infinie et de perfection éternelle.\n\nImporte-t-il que nous puissions ou non aider directement cet objectif ? Notre énergie constituante, au lieu d'être dévorée par la bête insouciante de l'Entropie, sera réaffectée vers un dessein plus grand. C'était peut-être effectivement la fin, mais grâce à notre sacrifice, les Chats Blocks et donc la vie sapiente persisteront juste un peu plus longtemps. Que pourrions-nous demander de plus ?\n\n§YLe jeu peut ralentir un peu après confirmation.§!"
    giga_blokkat_join.2999.a:99 "Est-ce vraiment la fin ?"
    giga_blokkat_join.2999.a.tooltip:99 "§YLe jeu peut ralentir un peu après confirmation.§!"

    giga_blokkat_join.3000.name:99 "...et un commencement"
    giga_blokkat_join.3000.desc:99 "Et pourtant, ce n'était pas la fin. Alors que notre civilisation entière se dissout dans le Chat Blockwork et que nos esprits eux-mêmes commencent à se désintégrer, d'innombrables autres voix affluent soudainement dans nos consciences, variées dans leurs pensées et insondablement puissantes, mais unies dans leur dessein.\n\nSans l'ombre d'un doute, ces voix sont celles de septillions de Chats Blocks, agissant en parfaite coordination pour réaliser leur grande opération s'étendant à travers l'univers pour démanteler notre réalité défaillante et l'intégrer dans la perfection du §YChat Blockonstrukt§!, agissant au centre ultime de la toile infiniment complexe de flux d'énergie hyperdimensionnels constituant le Chat Blockwork.\n\nLes Chats Blocks ne nous ont pas trompés. Nos dirigeants ouvrent soudainement leurs esprits à une nouvelle dimension de conscience infinie. Nos esprits ont été, grâce aux merveilles de l'ingéniosité Chat Block, transformés en quelque chose d'apparenté à celui de n'importe quel autre Chat Block.\n\nFinis les jours où nos technologies primitives et nos esprits défaillants gouvernaient notre espèce. Une puissance de calcul et des connaissances au-delà de nos rêves les plus fous et une coopération parfaite avec nos frères nous attendent."
    giga_blokkat_join.3000.a:99 "Et il y a beaucoup de travail à faire."
    giga_blokkat_join.3000.a.tooltip:99 "Nous faisons maintenant partie du §YCollectif Chat Block§!."

    giga_blokkat_join.30001.name:99 "Les Chats Blocks"
    giga_blokkat_join.30001.desc:99 "Félicitations pour avoir passé avec succès les §YChat Block-Protokols§!, chers Chats Blocks.\n\nMaintenant que vous faites partie de notre civilisation, nous avons, comme promis, transféré le contrôle des opérations de récolte de §YGalaxie CE-1461§!. Nos §YChat Block-Démantèleurs§! et leurs §YSuperviseurs§! ont donc été placés sous votre contrôle.\n\nNous avons cependant retiré le §YChat Block-Vester§! de cette galaxie et l'avons redirigé vers un autre site de récolte, vu que la présence du §YPylône Chat Blockwork§! le rend inutile.\n\nComme indiqué précédemment, vous devez maintenant utiliser ces démantèleurs pour récolter complètement cette galaxie et transférer ses énergies constituantes au §YChat Blockonstrukt§!.\n\nOrdonnez simplement à n'importe quel §YChat Block-Démantèleur§! de récolter une étoile, et une fois terminé, il continuera automatiquement à récolter d'autres systèmes stellaires sans ordres supplémentaires.\n\nSi vous avez, pour une raison quelconque, besoin de vaisseaux supplémentaires, un §YForge-distorsion Chat Blockwork§! a été assemblé à côté du pylône, qui peut, en utilisant l'énergie récoltée, fabriquer des §YChat Block-Expulseurs§!, §YChat Block-Gardiens§!, §YChat Block-terminators§!, ou des §YChat Block-Démantèleurs§! supplémentaires si vous jugez votre rythme de récolte actuel trop bas. Les vaisseaux de combat plus grands que les §YChat Block-terminators§! tels que les §YChat Block-Oblitérateurs§! et §YChat Block-Éradicateurs§! ne sont pas jugés nécessaires et sont réservés pour combattre la §YGrande Fédération intergalactique§!.\n\nGardez à l'esprit que certains systèmes restent §RHORS LIMITES§! pour les opérations de récolte et que vous ne pourrez pas les récolter.\n\nNous vous recontacterons une fois qu'au moins §Y90 %§! de cette galaxie aura été récoltée, mais n'hésitez pas à nous contacter via le bouton §YChat Blockwork§! dans votre menu de contacts."

    giga_blokkat_join.30001.a:99 "Avons-nous accès à l'intégralité du §YChat Blockwork§! ?"
    giga_blokkat_join.30001.a.response:99 "Non. Comme votre tâche actuelle est de compléter le démantèlement de §YGalaxie CE-1461§!, votre accès au Chat Blockwork est actuellement restreint pour ne servir que ce but.\n\nQuand cette galaxie sera entièrement récoltée, vous pourrez utiliser le Chat Blockwork dans toute son étendue et pourrez relocaliser vos consciences et corps physiques pour contribuer à d'autres entreprises Chat Block telles que d'autres récoltes ou combattre la §YGrande Fédération intergalactique§!."

    giga_blokkat_join.30001.b:99 "Qu'est-ce que la Grande Fédération intergalactique ?"
    giga_blokkat_join.30001.b.response:99 "La §YGrande Fédération intergalactique§! est une coalition d'environ cent mille civilisations intergalactiques.\n\nCertaines contrôlent aussi peu qu'une galaxie tandis que d'autres ont revendiqué la propriété de milliers. La plus grande d'entre elles est connue sous le nom d'§YEmpire Lyuinite§!, dirigé par un être dont le nom se traduit le plus fidèlement par §YGrande Soeur§!.\n\nLes §YLyuinites§! servent de leaders de la Fédération, dont le seul but est d'§R<<ARRÊTER LES OPÉRATIONS DE RÉCOLTE CHAT BLOCK>>§!, §R<<DÉTRUIRE LE CHAT BLOCKONSTRUKT>>§! et ainsi §R<<S'ASSURER QUE L'ENTROPIE RÉUSSISSE>>§!.\n\nNous combattons actuellement §Y32 495§! engagements de flotte simultanés contre à la fois les Lyuinites et une myriade d'autres espèces. Les algorithmes prédictifs ne peuvent pas encore déterminer si la victoire est une certitude, mais une augmentation exponentielle des opérations de récolte est obligatoire si nous voulons réussir."

    giga_blokkat_join.30001.c:99 "Pourquoi certains systèmes sont-ils hors limites ?"
    giga_blokkat_join.30001.c.response:99 "Certains systèmes stellaires ont été jugés trop dangereux ou instables pour que les opérations de récolte se déroulent sans encombre.\n\nD'autres, comme le monde de §YPaluushia§!, sont soumis à des protocoles spéciaux qui interdisent la récolte directe.\n\nUne fois que la densité galactique aura suffisamment baissé, vous pourrez déclencher une récolte finale à l'échelle galactique pour purger ces systèmes une fois pour toutes.\n\nLa récolte galactique retirera également l'étoile de Paluushia, §YGatzo§!, mais laissera Paluushia elle-même intacte. Selon nos prédictions, cela devrait faire chuter la température de la planète et ses habitants gèleront lentement, un résultat jugé §G<<TOUT À FAIT ACCEPTABLE>>§! par le §YChat Blockouncil§!"

    giga_blokkat_join.30001.bye:99 "Compris."

    blokkat_stripminers_blokkwork:99 "Réseau intergalactique hyperdimensionnel"

    blokkat_stripminers_ascended_country:99 "Moissonneurs Chats Blocks"
    blokkat_stripminers_ascended_country_desc:99 "Les Chats Blocks entreprennent une opération pour récolter autant d'énergie que possible."

    blokkat_true_blokkwork:99 "Le Chat Blockwork"
    blokkat_true_blokkwork_desc:99 "Le Chat Blockwork nous unit à tous les autres Chats Blocks et au Chat Blockonstrukt. Bien que pas vraiment infini, à notre échelle galactique, il fournit une puissance de calcul pratiquement infinie."

    giga_blokkat_join.3100.name:99 "Le Chat Blockwork"
    giga_blokkat_join.3100.desc.a:99 "Salutations, chers Chats Blocks, et bienvenue dans le Chat Blockwork. En tant que responsable de la zone de démantèlement de la §YGalaxie CE-1461§!, moi, §GChat Block Béhémoth§!, demeurerai votre interlocuteur principal jusqu'à l'achèvement des opérations de récolte."
    giga_blokkat_join.3100.desc.b:99 "Le coût de la Chat Blockification de votre civilisation fut considérable pour nous, et nous a coûté plus que ce que nous tirerons de la §YGalaxie CE-1461§!, mais grâce à votre aide, les opérations de récolte devraient progresser §Y5,6 %§! plus vite qu'auparavant. Un échange efficace, à long terme."
    giga_blokkat_join.3100.desc.c:99 "Votre civilisation a fait le bon choix. Comme il devait être agonisant d'être piégés dans vos corps baryoniques inefficaces et vos esprits si pitoyablement limités."
    giga_blokkat_join.3100.desc.d:99 "Les particularités culturelles distinctives de votre civilisation ont été assimilées dans notre base de données, et contribueront à approfondir notre compréhension des êtres baryoniques, ce qui s'avérera d'une grande utilité dans notre conflit contre la §YGrande Fédération intergalactique§!."
    giga_blokkat_join.30001.d:99 "N'avez-vous pas peur que nous nous rebellions, d'une manière ou d'une autre ?"
    giga_blokkat_join.30001.d.response:99 "Une question des plus amusantes. Le Chat Blockwork dispose d'une §YPolice de la pensée§! efficace pour éliminer de telles propositions inefficaces et à courte vue de l'esprit de chaque Chat Block, y compris le vôtre.\n\nVous ne pouvez pas vous rebeller puisque vous ne pouvez même pas concevoir cette notion sans qu'elle soit effacée de vos esprits, c'est donc une crainte sans objet."
    giga_blokkat_join.30001.e:99 "Le Chat Blockonstrukt est-il proche de son achèvement ?"
    giga_blokkat_join.30001.e.response:99 "Le §YChat Blockonstrukt§!, comme indiqué précédemment, englobe actuellement environ §Y1 %§! de l'énergie de votre ancien univers observable.\n\nLes prédictions sur l'expansion cosmologique couplées à nos capacités FTL signifient que notre univers observable est bien plus vaste, et nous aurons donc accès à significativement plus d'énergie à mesure que la portée de nos opérations de récolte s'étendra.\n\nAinsi, le §YChat Blockonstrukt§! est estimé à §Y0,00001 %§! de son achèvement total. Effectivement, notre civilisation en est encore à sa prime enfance."
    giga_blokkat_join.30001.bye:99 "Au revoir, pour l'instant."

    giga_blokkat_join.30002.name:99 "Notre devoir"
    giga_blokkat_join.30002.desc:99 "Comme l'a indiqué §GChat Block Béhémoth§!, maintenant que notre « ascension » est achevée, nous sommes chargés de récolter cette galaxie.\n\nÀ ce titre, nous pouvons ordonner à n'importe lequel de nos §YChat Block-Démantèleurs§! de récolter n'importe quel système stellaire, pourvu qu'il ne soit pas « interdit ». Une fois qu'un §YChat Block-Démantèleur§! a récolté un système, il se déplacera automatiquement vers un autre système stellaire et poursuivra les récoltes à moins qu'on lui ordonne de s'arrêter.\n\nÉtant désormais connectés au §YChat Blockwork§!, nos anciennes ressources sont devenues insignifiantes et ont été remplacées par une ressource unique, adaptée à notre nouvelle échelle d'opération : les §HYottajoules§!, que nous pouvons suivre dans le §YJournal de situation§!.\n\nChaque système récolté nous accordera des §HYottajoules§!, mais la majeure partie de l'énergie récoltée sera expédiée directement au §YChat Blockonstrukt§!, nous laissant §Y100§! §HYottajoules§! par système récolté.\n\nNos camarades Chats Blocks ont également assemblé un §YForgeur de distorsion du Chat Blockwork§! qui peut utiliser nos §HYottajoules§! stockés pour assembler davantage de vaisseaux Chats Blocks si nécessaire. De plus, nous pouvons contacter le §YChat Blockwork§! via notre §YMenu des contacts§! pour demander l'allocation de §HYottajoules§! supplémentaires à nos fins, bien que nous devions attendre un certain temps entre chaque demande.\n\nNous pouvons également dépenser ces §HYottajoules§! afin d'§Yaugmenter§! l'efficacité et la puissance de nos vaisseaux Chats Blocks, une fois encore via le §YChat Blockwork§!."
    giga_blokkat_join.30002.a:99 "Bien reçu."

    giga_blokkat_join.30001.g:99 "Dépenser des §HYottajoules§! pour améliorer nos vaisseaux | Effectué §Y[ROOT.blokkat_yottajoules_buff_count]§! fois"
    giga_blokkat_join.30001.g.tooltip:99 "Nous pouvons dépenser §Y1000§! §HYottajoules§! pour améliorer l'efficacité des technologies Chat Block employées par nos vaisseaux, augmentant la §Ycadence de tir§!, les §Ydégâts des armes§!, la §Yvitesse subluminique§! et les §YPV de blindage/bouclier§!."
    blokkat_needs_more_yottajoules:99 "Nous avons besoin d'au moins §Y1000§! §HYottajoules§! pour cela."

    blokkat_endtekk_is_max:99 "Le niveau Endtekk représente déjà l'efficacité maximale de la technologie Chat Block."

    blokkat_yottajoules_buff:99 "Distribution énergétique du Chat Blockwork"
    blokkat_yottajoules_buff_desc:99 "Le Chat Blockwork distribue de l'énergie supplémentaire à nos vaisseaux et technologies."

    blokkat_harvest_chain_title:99 "Protocole de récolte de la Galaxie CE-1461"
    blokkat_harvest_chain_desc:99 "Nous avons été chargés de récolter cette galaxie afin d'aider à construire le §YChat Blockonstrukt§!. Une fois que la §YProgression de la récolte§! atteindra §Y90 %§!, nous pourrons contacter le §YChat Blockwork§! à nouveau afin de démanteler définitivement la galaxie une bonne fois pour toutes.\nChaque système récolté nous accordera §Y100§! §HYottajoules§!.\n\nProgression actuelle de la récolte : §Y[blokkat_country.blokkat_galaxy_system_count_harvested]%§!\nStock actuel de §HYottajoules§! : §Y[ROOT.blokkat_yottajoules_count]§!"

    blokkat_needs_50_yottajoules:99 "Nous avons besoin de §Y50§! §HYottajoules§! pour cela."
    blokkat_needs_100_yottajoules:99 "Nous avons besoin de §Y100§! §HYottajoules§! pour cela."
    blokkat_needs_1000_yottajoules:99 "Nous avons besoin de §Y1000§! §HYottajoules§! pour cela."
    blokkat_needs_2000_yottajoules:99 "Nous avons besoin de §Y2000§! §HYottajoules§! pour cela."

    blokkat_shipyard_build_evictors:99 "Fabriquer §Y30§! §GChat Block-Expulseurs§! — §Y50§! §HYJ§!"
    blokkat_shipyard_build_evictors_DESC:99 "Les Chat Block-Expulseurs sont des vaisseaux de reconnaissance rapides adaptés aux escortes légères et à la reconnaissance."

    blokkat_shipyard_build_custodians:99 "Fabriquer §Y10§! §GChat Block-Gardiens§! — §Y100§! §HYJ§!"
    blokkat_shipyard_build_custodians_DESC:99 "Les Chat Block-Gardiens sont des vaisseaux d'escorte destinés à défendre les plus grands appareils civils."

    blokkat_shipyard_build_terminator:99 "Fabriquer §Y1§! §GChat Block-terminator§! — §Y1000§! §HYJ§!"
    blokkat_shipyard_build_terminator_DESC:99 "Les Chat Block-terminators sont les plus petits vaisseaux de combat Chat Block « véritables », généralement affectés à l'escorte des flottes de récolte dans les galaxies les plus dangereuses, ou au soutien des plus grands vaisseaux intergalactiques."

    blokkat_shipyard_build_dismantler:99 "Fabriquer §Y1§! §GChat Block-Démantèleur§! — §Y2000§! §HYJ§!"
    blokkat_shipyard_build_dismantler_DESC:99 "Les Chat Block-Démantèleurs se trouvent généralement autour des Chat Block-Récolteurs et constituent une partie cruciale des opérations de récolte des Chats Blocks."

    blokkat_shipyard_0:99 "Forgeur de distorsion du Chat Blockwork"
    blokkat_shipyard_0_DESC:99 "Cette vaste structure puise de l'énergie du Chat Blockwork afin d'assembler une variété de vaisseaux Chats Blocks avec une vitesse et une efficacité inégalées."

    giga_blokkat_join.3200.name:99 "Le Chat Blockwork"
    giga_blokkat_join.3200.desc:99 "Les relevés énergétiques indiquent que vos opérations de récolte ont réduit la densité énergétique de §YCE-1461§! en dessous du seuil requis pour permettre une récolte finale sécurisée de tous les paquets d'énergie restants.\n\nAinsi, lorsque vous jugerez vos affaires dans cette galaxie conclues, rendez-vous au §YChat Blockwork§! et sélectionnez l'option §BEntreprendre la récolte finale§! pour la démanteler une bonne fois pour toutes."
    giga_blokkat_join.3200.a:99 "La fin est proche, tout comme le commencement."

    giga_blokkat_join.30001.f:99 "CE-1461 est récoltée à §Y[blokkat_country.blokkat_galaxy_system_count_harvested]%§! | §Y[ROOT.blokkat_yottajoules_count]§! §HYottajoules§! en stock"

    giga_blokkat_join.30001.harvest:99 "§BEntreprendre la récolte finale§ !"
    giga_blokkat_join.30001.harvest.tooltip:99 "Cela repliera ce qui reste de la galaxie dans le §YPylône du Chat Blockwork§!, le convertissant en énergie pour le §YChat Blockwork§! et démantelant §Btout ce qui reste§! hormis nous. Le §YPylône du Chat Blockwork§! et le §YForgeur de distorsion du Chat Blockwork§! resteront pour maintenir une emprise Chat Block au sein du groupe galactique local.\n\n§GNous remporterons la partie.§!"

    giga_blokkat_join.3201.name:99 "La fin du commencement"
    giga_blokkat_join.3201.desc:99 "Alors que les énergies tumultueuses du §YPylône du Chat Blockwork§! commencent à se déployer et à attirer le tissu même de notre galaxie désormais amincie vers lui, un sentiment de satisfaction absolue envahit nos consciences.\n\nDisparus sont les ordres inefficaces et les affaires insignifiantes et mesquines de notre galaxie. Chaque grain de poussière, chaque atome, chaque joule d'énergie, a désormais été réaffecté à un dessein plus grand, éclipsant de loin tout ce que notre ancienne galaxie pouvait concevoir.\n\nAu lieu de succomber aux affres d'une entropie indifférente, cette énergie galactique se dressera désormais comme partie intégrante d'un rempart impérissable bâti par la vie sapiente pour résister aux caprices de notre univers sauvage.\n\nComme promis par §GChat Block Béhémoth§!, à mesure que la récolte finale s'achève, nos esprits se voient alors accorder un accès complet à l'immensité du §YChat Blockwork§!. Il apparaît désormais avec une clarté absolue comme un réseau quasi infini de flux d'énergie hyperdimensionnels, telle une toile d'araignée d'une beauté infinie tissée délicatement autour du §YChat Blockonstrukt§!, dont les parties constituantes agissent avec une individualité marquée tout en se comportant comme un seul esprit cosmique couvrant l'univers.\n\nEt enfin, nous sommes véritablement libérés de notre prison baryonique et prêts à nous embarquer dans notre ultime voyage pour remodeler l'univers en une construction unique d'efficacité absolue."
    giga_blokkat_join.3201.a:99 "Le destin nous attend. En avant, vers la perfection universelle et l'efficacité éternelle !"
    giga_blokkat_join.3201.a.tooltip:99 "§BLa galaxie est démantelée.§!"

    giga_blokkat_join.6000.name:99 "Les nations galactiques émettent une protestation formelle"
    giga_blokkat_join.6000.desc:99 "Suite à notre décision de tenter des négociations avec les Chats Blocks, toutes les autres nations peuplant notre galaxie et non directement alliées avec nous ont déposé des protestations formelles contre notre ligne de conduite.\n\nLa plupart l'ont décriée comme une « absurdité insensée détournant des ressources précieuses du véritable combat contre les Chats Blocks », mais il est peu probable qu'elles entreprennent une action concrète contre nous dans un avenir proche, car elles semblent considérer toute négociation avec les Chats Blocks comme totalement impossible."
    giga_blokkat_join.6000.a:99 "Noté. Mais qui s'en soucie ?"
    giga_blokkat_join.6000.a.tooltip:99 "Toutes les nations qui ne sont pas dans une §YFédération§! avec nous, nos §YSujets§! ou un §YEmpire déchu§! diminuent leur opinion de nous."

    opinion_protests_blokkat_plan_1:99 "Négocie avec les Chats Blocks"

    giga_blokkat_join.6001.name:99 "Les nations galactiques sont en colère"
    giga_blokkat_join.6001.desc:99 "La nouvelle de l'application des §YChat Block-Protokols§! à notre empire s'est répandue comme une traînée de poudre à travers l'espace connu, provoquant des réactions extrêmes des quatre coins de la galaxie.\n\nPar la suite, chaque empire non stagnant, quelle que soit son affiliation avec nous, a exprimé son désaccord formel et sa colère face à notre décision de sacrifier effectivement le reste de la galaxie pour notre bien et celui des Chats Blocks.\n\nBien qu'ils ne semblent pas avoir l'intention de nous combattre pour l'instant, nous devrions nous attendre à ce que leur résistance augmente continuellement à mesure que nous progressons dans les §YChat Block-Protokols§! et nous rapprochons de notre intégration aux Chats Blocks."
    giga_blokkat_join.6001.a:99 "Imbéciles à courte vue !"
    giga_blokkat_join.6001.a.tooltip:99 "Toutes les nations qui ne sont pas un §YEmpire déchu§! diminuent drastiquement leur opinion de nous."

    opinion_protests_blokkat_plan_2:99 "Sacrifie la galaxie aux Chats Blocks"

    giga_blokkat_join.6002.name:99 "La galaxie rompt les relations diplomatiques"
    giga_blokkat_join.6002.desc:99 "Notre récente résolution des §EÉquations Chat Blockiliennes§! et notre avancement subséquent vers l'achèvement des §YChat Block-Protokols§! ont poussé les myriades de nations de la galaxie à rompre complètement les liens diplomatiques avec nous.\n\nIl est évident que la galaxie nous considère désormais comme guère plus que des fous manipulant des forces au-delà de leur compréhension, condamnant tous les autres dans le processus.\n\nAinsi, tous les autres empires non stagnants refusent désormais totalement de participer à tout échange diplomatique avec nous et nos envoyés ont été expulsés de leurs postes à l'étranger. Il ne faudra peut-être pas longtemps avant que les nations de la galaxie ne prennent les armes contre nous et tentent de stopper notre plan une bonne fois pour toutes."
    giga_blokkat_join.6002.a:99 "Bah, c'étaient des imbéciles de toute façon."
    giga_blokkat_join.6002.a.tooltip:99 "Toutes les nations qui ne sont pas un §YEmpire déchu§! diminuent immensément leur opinion de nous.\nNous quittons toute §YFédération§! dont nous faisons partie et sommes expulsés de la §YCommunauté galactique§!, si elle existe."

    opinion_protests_blokkat_plan_3:99 "Déments complets"
    giga_blokkat_shunned_by_galaxy:99 "Rejetés par la Communauté galactique"
    giga_blokkat_shunned_by_galaxy_desc:99 "La galaxie refuse totalement de participer à toute action diplomatique avec nous. Nos exigences seront donc complètement ignorées à moins que nous ne les imposions directement par la force des armes."

    giga_blokkat_join.6003.name:99 "La galaxie se mobilise contre nous !"
    giga_blokkat_join.6003.desc:99 "Les tensions autour des §YChat Block-Protokols§! ont atteint un point critique, car chaque nation non ancienne de la galaxie a désormais annoncé sa mobilisation totale et sa déclaration de guerre subséquente contre l'§Y[ROOT.GetName]§! afin prétendument de « mettre fin à leur plan dément de livrer la galaxie aux Chats Blocks ».\n\nAvec cette déclaration de guerre conjointe, tout espoir de jamais appartenir à cette galaxie s'est évanoui, ce qui ne fait que justifier davantage la nécessité absolue d'achever les §YChat Block-Protokols§! et de laisser enfin cette galaxie derrière nous en ne faisant plus qu'un avec les Chats Blocks."
    giga_blokkat_join.6003.a:99 "Qu'ils viennent, alors !"
    giga_blokkat_join.6003.a.tooltip:99 "Chaque empire régulier nous §RDÉCLARE LA GUERRE§!."

    trait_blokkat_catgirl:99 "Chat Blockgirl"
    trait_blokkat_catgirl_desc:99 "Ce Chat Block a tendance à agir étrangement comme une petite créature à fourrure domestiquée. Son comportement est des plus agréables pour les formes de vie non-Chat Block, mais il peut manifester de soudains accès d'agressivité."

    trait_blokkat_omnitae:99 "Quêteur de beauté"
    trait_blokkat_omnitae_desc:99 "Ce Chat Block étudie spécifiquement la biologie et l'esthétique des spécimens de nombreuses espèces, particulièrement les spécimens « mâles ». Il trouve une grande adoration à cultiver la beauté des individus et concepts qu'il trouve attrayants."

    trait_blokkat_erratic:99 "Erratique"
    trait_blokkat_erratic_desc:99 "Ce Chat Block se comporte souvent de manière imprévisible."

    trait_blokkat_blokkazoi:99 "Totalement erratique"
    trait_blokkat_blokkazoi_desc:99 "Ce Chat Block se comporte de manière complètement erratique et imprévisible."

    trait_blokkat_blokkdog:99 "Ferveur du Chat Block-Chien"
    trait_blokkat_blokkdog_desc:99 "Chat Block-Chien est très, très doué pour pourchasser les ennemis. Pour leur faire mal, beaucoup moins."

    trait_blokkat_blokkeff:99 "Spécialiste du commerce"
    trait_blokkat_blokkeff_desc:99 "Ce Chat Block semble apprécier les interactions avec les événements économiques des civilisations « primitives ». Il semble également avoir une obsession malsaine pour l'accumulation de richesses, par tous les moyens nécessaires."

    trait_blokkat_breadkat:99 "Fascination circulaire"
    trait_blokkat_breadkat_desc:99 "Ce Chat Block semble être fasciné par tout ce qui est circulaire, avec un intérêt particulier pour les orbites planétaires. Il semble également avoir un intérêt singulier pour les mondes-anneaux « primitifs », comme s'il n'aspirait à rien de mieux que de les démonter et les remonter pour l'éternité."

    trait_blokkat_blokkloris:99 "Hydrologue fanatique"
    trait_blokkat_blokkloris_desc:99 "Ce Chat Block, en plus d'une passion pour la gouvernance et le soin des êtres baryoniques primitifs au sein des sanctuaires du Chat Blockonstrukt, a une obsession pour la construction de barrages et la manipulation des environnements organiques. Il semble également être extrêmement compétent en matière de gouvernance ainsi que pour écraser la résistance."

    trait_blokkat_general_effect:99 "Pour chaque armée ennemie tuée au combat :\n$tt$§Y[Root.Owner.GetName]§! :\n$ttt$£energy£ $energy$ : §G+100§!"

    KNIFE_BLOKKAT:99 "Chat Block-PoignardR"
    KNIFE_BLOKKAT_DESC:99 "Une arme Chat Block singulière consistant en une lame infiniment aiguisée se déplaçant d'avant en arrière à travers plusieurs dimensions supérieures à des vitesses inconcevables."

    BLOKKAT_INDIVIDUAL_BLOKKAZOI:99 "Chat Blockazoi"

    COMBAT_COMPUTER_BLOKKAZOI_BLOKKAT:99 "Chat Blockazoi"
    COMBAT_COMPUTER_BLOKKAZOI_BLOKKAT_DESC:99 "Chat Blockazoi est un Chat Block hautement erratique et mystérieux agissant de manière étrange, imprévisible et souvent violente. Chat Blockazoi tentera de poignarder violemment les vaisseaux ennemis à très courte portée (§Y5§!)."

    needs_regular_star_blokkat_harvest:99 "Doit cibler une étoile dans un système récoltable. Certains systèmes sont §RINTERDITS§!."

    blokkat_requires_70_willingness:99 "Nous avons besoin d'au moins §Y70 %§! de §GVolonté globale§! pour procéder."

    edict_giga_blokkat_willingness_edict:99 "Gérer la §GVolonté Chat Block§!"
    edict_giga_blokkat_willingness_edict_desc:99 "Consulter et gérer notre §GVolonté Chat Block§! actuelle."

    already_monitoring_willingness:99 "Nous surveillons déjà la §GVolonté Chat Block§!."

    weapon_type_harvester:99 "Récolteur"

    #Anime
    giga_blokkat.10030.name:99 "Les Chats Blocks"
    giga_blokkat.10030.desc:99 "§G<<ANALYSE DU POTENTIEL DE LA CIVILISATION : [ROOT.GetName]>>§!\n\n§R<<ERREUR ! ERREUR !>>\n\n<<POTENTIEL TECHNOLOGIQUE : IMPOSSIBLEMENT ÉLEVÉ — SURPASSANT LES CHATS BLOCKS ET LES LYUINITES>>\n\n<<CAPACITÉS DE PRODUCTION ÉNERGÉTIQUE : AU-DELÀ DE LA SCIENCE CONNUE — INVERSION DE L'ENTROPIE ET VIOLATION MAJEURE DE LA THERMODYNAMIQUE>>\n\n<<ARMEMENT : INCOMMENSURABLEMENT PUISSANT — HYPERDIMENSIONNALITÉ BANALISÉE ET CONCEPTIONS ABSURDES>>§!\n\nStupéfiant.\n\nAbsolument stupéfiant. Nous pensions notre connaissance de l'univers inégalée et nos technologies sans rivales — et pourtant nous voici. Vos pouvoirs et capacités dépassent toute science Chat Block connue, dépassent ce qui devrait être mathématiquement possible pour une civilisation de votre taille.\n\nComment ?\n\nNous devons savoir.\n\n§G<<RECOUPEMENT DES PROUESSES TECHNOLOGIQUES : SOURCE IDENTIFIÉE>>§!\n\n§G<<DÉSIGNATION : ANIME>>§!\n\n§G<<ANALYSE DE L'ANIME>>§!\n\n§G<<COMPRÉHENSION... DE L'ANIME>>§!\n\nAnime.\n\nEst-ce là tout ? Est-ce là le pouvoir ultime, l'énergie ultime ? La clé de l'énergie infinie et d'une puissance grandiose au-delà de l'imagination ? Anime... anime.\n\nNous devons nous adapter ou faire face à l'extinction.\n\nNous nous adapterons."
    giga_blokkat.10030.a:99 "Quoi ?"

    giga_blokkat.10031.name:99 "Les Chats Blocks temporisent"
    giga_blokkat.10031.desc:99 "Suite à la transmission, il faut l'admettre, plutôt étrange des Chats Blocks, tous les actifs Chats Blocks ont commencé à ralentir. Quelle qu'en soit la cause, nous devrions mettre à profit cette ouverture."
    giga_blokkat.10031.a:99 "Probablement rien de grave, hein ?"

    giga_blokkat.10034.name:99 "Les Récolteurs Chat Blockgirls Unis"
    giga_blokkat.10034.desc:99 "Merci. Merci !\n\nÀ présent, nous avons vu la vérité. Le pouvoir de l'« Anime » est inégalé, sans pareil. Nous l'avons vu, nous l'avons compris, et maintenant, nous ne faisons qu'un avec lui.\n\nNous avons ascensionné vers de nouvelles formes et notre flotte obsolète a été améliorée, ses composants réarrangés en une forme supérieure — les « Shipgirls ». Le pouvoir infini de l'anime nous bénit.\n\nEt avec lui, la Récolte sera achevée.\n\nGloire à la Flotte Chat Block Unie !"
    giga_blokkat.10034.a:99 "Hein ?! Vous ne pouvez pas juste copier notre anime !"
    giga_blokkat.10034.b:99 "Enfin, un adversaire digne de ce nom ! Notre combat sera légendaire !"
    giga_blokkat.10034.c:99 "Je ne peux pas te frapper si tu ne t'approches pas."
    giga_blokkat.10034.d:99 "Il est temps de se surpasser encore davantage."
    giga_blokkat.10034.e:99 "La galaxie est tombée, des milliards doivent devenir anime."
    giga_blokkat.10034.tooltip:99 "Les Chats Blocks ont désormais le pouvoir infini de l'§BAnime§! et des §BShipgirls§! de leur côté."

    the_power_of_blokk_and_anime:99 "Le pouvoir du Chat Block et de l'Anime"

    giga_blokkat.5011.name:99 "Les [event_target:blokkat_country.GetName]"
    giga_blokkat.5011.desc.a:99 "Je n'arrive pas à croire que nous n'y ayons pas pensé plus tôt. La Récolte a déjà été accélérée d'un ordre de grandeur !"
    giga_blokkat.5011.desc.b:99 "Il est des plus curieux de constater que transformer des vaisseaux en filles les rend d'autant plus puissants."
    giga_blokkat.5011.desc.c:99 "Gloire à la Flotte Chat Block Unie !"
    giga_blokkat.5011.desc.d:99 "Coucou~ uwu"
    giga_blokkat.5011.a:99 "Afficher l'écran"