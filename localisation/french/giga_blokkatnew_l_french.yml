    giga_blokkat.1023.name:0 "Monde démantelé"
    giga_blokkat.1023.desc:0 "Les §YBlokkats§! ont atteint et ensuite anéanti notre colonie de §Y[ROOT.GetName]§!, causant la disparition malheureuse de §Y[ROOT.blokkat_planet_pop_count]§! pops en quelques instants.\n\nSi nous ne contenons pas son impact sur notre civilisation, cet acte grave générera §Y[ROOT.blokkat_pop_inquietude]§! d'§Rinquiétude Blokkat§! au sein de notre empire. Alternativement, nous pouvons tenter de compenser la destruction du monde avec des subventions et de la propagande pour réduire de moitié l'impact de l'inquiétude, mais cela coûterait approximativement §Y[ROOT.blokkat_pop_influence_cost]§! £influence£."
    giga_blokkat.1023.a:0 "Malédiction ! | §Y[ROOT.blokkat_pop_inquietude]§! §RInquiétude Blokkat§!"
    giga_blokkat.1023.b:0 "Dépenser §Y[ROOT.blokkat_pop_influence_cost]§! £influence£ pour atténuer l'impact. | §Y[ROOT.blokkat_pop_inquietude_halved]§! §RInquiétude Blokkat§!"
    blokkat_not_enough_influence:0 "Influence insuffisante."
    giga_blokkat.1023.desc.willingness:0 "Les §YBlokkats§! ont atteint et ensuite anéanti notre colonie de §Y[ROOT.GetName]§!, causant la disparition malheureuse de §Y[ROOT.blokkat_planet_pop_count]§! pops en quelques instants.\n\nSi nous ne contenons pas son impact sur notre civilisation, cet acte grave générera §Y[ROOT.blokkat_pop_inquietude]§! d'§Rinquiétude Blokkat§! et réduira la §HDisposition gouvernementale§! et la §MDisposition de la population§! de §R[ROOT.blokkat_pop_inquietude] %§! au sein de notre empire. Alternativement, nous pouvons tenter de compenser la destruction du monde avec des subventions et de la propagande pour réduire de moitié l'impact de l'inquiétude, mais cela coûterait approximativement §Y[ROOT.blokkat_pop_influence_cost]§! £influence£."

    giga_blokkat_join.5500.b:0 "Tenter de rallier les dirigeants §Ren grève§! à notre cause."

    giga_blokkat_join.5601.name:0 "Rallier les dirigeants en grève"
    giga_blokkat_join.5601.desc:0 "Il n'est pas surprenant que certains de nos dirigeants ne soient pas très enthousiastes à l'idée de notre plan de négocier avec les Blokkats. Il pourrait donc être sage de dépenser de l'§Minfluence§!, de l'§Bunité§! ou de l'§Yénergie§! pour essayer de les rallier à notre cause en tirant les bonnes ficelles et en s'assurant qu'ils comprennent correctement notre point de vue au lieu de se cacher derrière leurs idéaux dépassés."

