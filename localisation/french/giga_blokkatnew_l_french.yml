    giga_blokkat_join.5603.name:0 "Négocier avec §Y[blokkat_strike_leader_negotiate.GetName]§!"
    giga_blokkat_join.5603.desc:0 "Nous pouvons essayer de dépenser de l'§Minfluence§!, de l'§Bunité§! et possiblement de l'§Yénergie§! pour convaincre §Y[blokkat_strike_leader_10.GetName]§! de se ranger de notre côté concernant les affaires Blokkats.\n\nÉtant donné la valeur actuelle de leur disposition respective (§BDisposition scientifique§! pour les §Bscientifiques§!, §PDisposition militaire§! pour les §Pamiraux§! et §Ggénéraux§!, et §HDisposition gouvernementale§! pour les §Hgouverneurs§!) et leur niveau de compétence de §Y[ROOT.blokkat_leader_negotiate_level]§!, les chances de succès des négociations sont de §Y[ROOT.blokkat_leader_negotiate_odds] %§!.\n\nIl en coûterait £influence£§Y[ROOT.blokkat_leader_negotiate_influence_cost]§! et £unity£§Y[ROOT.blokkat_leader_negotiate_unity_cost]§! pour procéder aux négociations."

    giga_blokkat_join.5603.yes:0 "Procéder ([ROOT.blokkat_leader_negotiate_odds] % de chance)."
    giga_blokkat_join.5603.bribe:0 "Procéder avec un pot-de-vin et promettre une augmentation conséquente. | £energy£§Y[ROOT.blokkat_leader_negotiate_energy_cost]§! ([ROOT.blokkat_leader_negotiate_odds_payrise] % de chance)"
    giga_blokkat_join.5603.bribe.tooltip:0 "En cas de succès, §Y[blokkat_strike_leader_negotiate.GetName]§! gagnera le trait §HPot-de-vin pro-Blokkat§!, augmentant son §Yentretien de dirigeant§! de §Y300 %§! et réduisant le §Ygain d'XP§! de §Y30 %§!.\n\nRéduira la §MDisposition de la population§! de §G1,5 %§! si nous sommes §Yégalitaristes§! et de §G3 %§! si nous sommes §Yfanatiquement égalitaristes§!."

    giga_blokkat_join.5604.name:0 "Négociations réussies !"
    giga_blokkat_join.5604.desc:0 "Notre Bureau de recherche Blokkat rapporte que §Y[blokkat_strike_leader_negotiate.GetName]§! a enfin décidé de nous rejoindre dans notre quête pour rejoindre les Blokkats.\n\n[blokkat_strike_leader_negotiate.GetSheHeCap] a ainsi déclaré la fin de ses grèves et reprendra ses fonctions immédiatement.\n\nLa chance de succès était de §Y[ROOT.blokkat_leader_negotiate_odds] %§!"
    giga_blokkat_join.5604.a:0 "Merveilleux !"
    giga_blokkat_join.5604.bribe:0 "Un petit pot-de-vin va loin."
    trait_blokkat_payrise:0 "Pot-de-vin pro-Blokkat"
    trait_blokkat_payrise_desc:0 "Bien que réticent à nous soutenir concernant les affaires Blokkats, ce dirigeant a été soudoyé avec une augmentation conséquente."

    giga_blokkat_join.5605.name:0 "Échec des négociations."
    giga_blokkat_join.5605.desc:0 "Notre Bureau de recherche Blokkat rapporte que §Y[blokkat_strike_leader_negotiate.GetName]§! a refusé de coopérer avec nous concernant notre projet de nous ranger du côté des Blokkats.\n\n[blokkat_strike_leader_negotiate.GetSheHeCap] a véhémentement rejeté toutes les tentatives de médiation et continuera donc ses protestations stupides.\n\nLa chance de succès était de §Y[ROOT.blokkat_leader_negotiate_odds] %§!"
    giga_blokkat_join.5605.a:0 "L'imbécile..."

    edict_blokkat_science_willingness_propaganda:0 "§GÉdit de disposition :§! Propagande pro-Blokkat §Bscientifique§!"
    edict_blokkat_science_willingness_propaganda_desc:0 "Nos scientifiques doivent voir que notre plan est évidemment la chose la plus logique à faire. Des quantités copieuses de propagande et de publications approuvées par le gouvernement leur seront donc distribuées.\n\nTant que cet édit est actif, la §BDisposition scientifique§! aura §Y5 %§! de chance d'augmenter de §G1 %§! chaque mois."
    edict_blokkat_military_willingness_propaganda:0 "§GÉdit de disposition :§! Propagande pro-Blokkat §Pmilitaire§!"
    edict_blokkat_military_willingness_propaganda_desc:0 "Notre amirauté doit voir que notre plan est évidemment la chose la plus logique à faire. Des quantités copieuses de propagande et de publications approuvées par le gouvernement leur seront donc distribuées.\n\nTant que cet édit est actif, la §PDisposition militaire§! aura §Y5 %§! de chance d'augmenter de §G1 %§! chaque mois."
    edict_blokkat_government_willingness_propaganda:0 "§GÉdit de disposition :§! Propagande pro-Blokkat §Hgouvernementale§!"
    edict_blokkat_government_willingness_propaganda_desc:0 "Nos organes gouvernementaux doivent voir que notre plan est évidemment la chose la plus logique à faire. Des quantités copieuses de propagande et de publications approuvées par le gouvernement leur seront donc distribuées.\n\nTant que cet édit est actif, la §HDisposition gouvernementale§! aura §Y5 %§! de chance d'augmenter de §G1 %§! chaque mois."
    edict_blokkat_population_willingness_propaganda:0 "§GÉdit de disposition :§! Propagande pro-Blokkat §Mpopulaire§!"
    edict_blokkat_population_willingness_propaganda_desc:0 "Notre peuple doit voir que notre plan est évidemment la chose la plus logique à faire. Des quantités copieuses de propagande et de publications approuvées par le gouvernement lui seront donc distribuées.\n\nTant que cet édit est actif, la §MDisposition de la population§! aura §Y5 %§! de chance d'augmenter de §G1 %§! chaque mois."

    giga_blokkat_join.5500.scrap:0 "Distribuer des échantillons de £blokkat_scrap_icon£ §Mdébris Blokkats§!..."
    giga_blokkat_join.5500.scrap.tooltip:0 "En montrant les magnifiques subtilités de la technologie Blokkat à notre civilisation, nous pourrions être en mesure de prouver que s'efforcer de travailler avec les Blokkats est certainement le meilleur choix."

    giga_blokkat_join.5700.name:0 "Distribution de §Mdébris Blokkats§!"
    giga_blokkat_join.5700.desc:0 "La technologie Blokkat est indubitablement magnifique de bien des façons qui dépassent la compréhension. Dans les échantillons récupérés des vaisseaux Blokkats, malgré les dommages qu'ils ont subis, des formations complexes de nanomachines hyperdimensionnelles tourbillonnent les unes autour des autres de manières qui ne peuvent qu'engendrer un sentiment d'émerveillement absolu.\n\nAinsi, il est évident que distribuer certains de ces merveilleux échantillons aux membres réticents de notre civilisation les convaincra que devenir un avec ces êtres extragalactiques nous transformera, sans l'ombre d'un doute, en quelque chose de bien plus grand."

    giga_willingness_needs_scrap:0 "Nous devons avoir acquis des £blokkat_scrap_icon£ §Mdébris Blokkats§!"
    giga_blokkat_50_blokkat_scrap:0 "-§Y50§! £blokkat_scrap_icon£"
    giga_blokkat_join.5700.science:0 "Distribuer des débris aux §Bscientifiques§! | §Y50§! £blokkat_scrap_icon£"
    giga_blokkat_join.5700.science.tooltip:0 "Augmentera la §BDisposition scientifique§! de §G3 %§! à §G7 %§!. Plus susceptible d'augmenter davantage si nous sommes §Ymatérialistes§!."
    giga_blokkat_join.5700.military:0 "Distribuer des débris aux §Pamiraux§! | §Y50§! £blokkat_scrap_icon£"
    giga_blokkat_join.5700.military.tooltip:0 "Augmentera la §PDisposition militaire§! de §G3 %§! à §G7 %§!. Plus susceptible d'augmenter davantage si nous sommes §Ymilitaristes§!."
    giga_blokkat_join.5700.government:0 "Distribuer des débris aux §Hgouverneurs§! | §Y50§! £blokkat_scrap_icon£"
    giga_blokkat_join.5700.government.tooltip:0 "Augmentera la §HDisposition gouvernementale§! de §G3 %§! à §G7 %§!. Plus susceptible d'augmenter davantage si nous sommes §Yautoritaristes§!."
    giga_blokkat_join.5700.population:0 "Distribuer des débris à la §Mpopulation§! | §Y50§! £blokkat_scrap_icon£"
    giga_blokkat_join.5700.population.tooltip:0 "Augmentera la §MDisposition de la population§! de §G3 %§! à §G7 %§!. Plus susceptible d'augmenter davantage si nous sommes §Yautoritaristes§!."
    giga_willingness_every_5_years:0 "Ne peut être fait que tous les §Y5 ans§!."
    giga_willingness_needs_50_scrap:0 "£blokkat_scrap_icon£ §Mdébris Blokkats§! insuffisants !"

    giga_blokkat_join.5700.bye:0 "Oublier ça."

    building_giga_blokkat_energy_capacitor:0 "Condensateur d'énergie du Blokkwork"
    building_giga_blokkat_energy_capacitor_desc:0 "Ces flèches complexes améliorent la puissance de notre propre réseau Blokkwork, nous permettant de gérer et traiter les quantités gargantuesques d'énergie requises par les §YBlokk-Protokols§!."

    PLANET_KILLER_BLOKKAT_HARVESTER:0 "Démantèleur céleste"
    PLANET_KILLER_BLOKKAT_HARVESTER_DESC:0 "Le Démantèleur céleste Blokkat « enroule » littéralement l'espace-temps vers une singularité spécialement conçue au coeur du vaisseau, le dissolvant en énergie exploitable à transférer dans le Blokkwork."
    PLANET_KILLER_BLOKKAT_HARVESTER_ACTION:0 "Récolter"
    FLEETORDER_DESTROY_PLANET_WITH_PLANET_KILLER_BLOKKAT_HARVESTER:0 "Préparation à la récolte de $PLANET|Y$"
    MESSAGE_DESC_FOR_PLANET_KILLER_BLOKKAT_HARVESTER:0 "a été récoltée par"

    giga_blokkat_join.2999.name:0 "Une fin..."
    giga_blokkat_join.2999.desc:0 "Alors qu'un torrent d'énergie insondable commence à affluer dans le §PPylône du Blokkwork§!, un sentiment de terreur s'empare soudainement de notre civilisation. Était-ce, peut-être, un piège ? Les Blokkats nous ont-ils, peut-être, piégés pour que nous nous sacrifions afin de renforcer leurs propres opérations de récolte et se débarrasser d'une nuisance potentielle ?\n\nEn quelques instants, les §YNœuds d'alimentation du Blokkwork§! à travers nos mondes commencent à s'agiter et l'espace commence à se contracter, comme s'ils étaient devenus des singularités. D'abord des villes, puis des continents, et finalement des mondes et des étoiles eux-mêmes commencent à se ratatiner et disparaître dans les nœuds, vraisemblablement absorbés dans le tissu du §YBlokkwork§!.\n\nEt pourtant, la terreur s'évapore rapidement et un sentiment de justesse omniprésent est bientôt tout ce qui occupe l'esprit de nos citoyens. Quelles que soient les intentions des Blokkats, c'était, indubitablement, la bonne chose à faire. Les Blokkats avaient un plan, une ambition, de remodeler l'univers en une structure de complexité infinie et de perfection éternelle.\n\nImporte-t-il que nous puissions ou non aider directement cet objectif ? Notre énergie constitutive, au lieu d'être dévorée par la bête indifférente de l'entropie, sera réaffectée vers un dessein plus grand. Peut-être était-ce en effet la fin, mais grâce à notre sacrifice, les Blokkats et donc la vie sapiente persisteront juste un peu plus longtemps. Que pourrions-nous demander de plus ?\n\n§YLe jeu peut ralentir un peu après confirmation.§!"
    giga_blokkat_join.2999.a:0 "Cela pourrait-il vraiment être la fin ?"
    giga_blokkat_join.2999.a.tooltip:0 "§YLe jeu peut ralentir un peu après confirmation.§!"

    giga_blokkat_join.3000.name:0 "...et un commencement"
    giga_blokkat_join.3000.desc:0 "Et pourtant, ce n'était pas la fin. Alors que toute notre civilisation se dissout dans le Blokkwork et que nos esprits eux-mêmes commencent à se désintégrer, d'innombrables autres voix affluent soudainement dans nos consciences, variées dans leurs pensées et insondablement puissantes, mais unies dans leur dessein.\n\nSans l'ombre d'un doute, ces voix sont celles de septillions de Blokkats, agissant en parfaite coordination pour réaliser leur grande opération à l'échelle de l'univers visant à démanteler notre réalité défectueuse et l'intégrer dans la perfection du §YBlokkonstrukt§!, agissant au centre ultime du réseau infiniment complexe de flux d'énergie hyperdimensionnels composant le Blokkwork.\n\nLes Blokkats ne nous ont pas piégés. Nos dirigeants ouvrent soudainement leurs esprits à une nouvelle dimension de conscience infinie. Nos esprits ont été, grâce aux merveilles de l'ingéniosité Blokkat, transformés en quelque chose de semblable à celui de n'importe quel autre Blokkat.\n\nRévolus sont les jours où nos technologies primitives et nos esprits défectueux gouvernaient notre espèce. Une puissance de calcul et un savoir au-delà de nos rêves les plus fous et une coopération sans faille avec nos frères nous attendent."
    giga_blokkat_join.3000.a:0 "Et il y a beaucoup de travail à faire."
    giga_blokkat_join.3000.a.tooltip:0 "Nous faisons maintenant partie du §YCollectif Blokkat§!."

    giga_blokkat_join.30001.name:0 "Les Blokkats"
    giga_blokkat_join.30001.desc:0 "Félicitations pour avoir réussi les §YBlokk-Protokols§!, chers Blokkats.\n\nMaintenant que vous faites partie de notre civilisation, nous avons, comme promis, transféré le contrôle des opérations de récolte de la §YGalaxie CE-1461§!. Nos §YBlokk-Démantèleurs§! et leurs §YSuperviseurs§! ont ainsi été placés sous votre contrôle.\n\nNous avons cependant retiré le §YBlokkat-Vester§! de cette galaxie et l'avons redirigé vers un autre site de récolte, vu que la présence du §YPylône du Blokkwork§! le rend inutile.\n\nComme indiqué précédemment, vous devez maintenant utiliser ces démantèleurs pour récolter entièrement cette galaxie et transférer ses énergies constitutives au §YBlokkonstrukt§!.\n\nOrdonnez simplement à n'importe quel §YBlokk-Démantèleur§! de récolter une étoile, et une fois terminé, il continuera automatiquement à récolter d'autres systèmes stellaires sans ordres supplémentaires.\n\nSi, pour une raison quelconque, vous avez besoin de vaisseaux supplémentaires, un §YForgeur-distorsion du Blokkwork§! a été assemblé près du pylône, qui peut, en utilisant l'énergie récoltée, fabriquer des §YBlokk-Expulseurs§!, des §YBlokk-Gardiens§!, des §YBlokk-Terminateurs§!, ou des §YBlokk-Démantèleurs§! supplémentaires si vous jugez votre rythme de récolte actuel trop bas. Les vaisseaux de combat plus grands que les §YBlokk-Terminateurs§! comme les §YBlokk-Oblitérateurs§! et les §YBlokk-Éradicateurs§! ne sont pas jugés nécessaires et sont réservés pour combattre la §YGrande Fédération Intergalactique§!.\n\nGardez à l'esprit que certains systèmes restent §RHORS-LIMITES§! pour les opérations de récolte et que vous ne pourrez pas les récolter.\n\nNous vous contacterons à nouveau une fois qu'au moins §Y90 %§! de cette galaxie aura été récoltée, mais n'hésitez pas à nous contacter en utilisant le bouton §YBlokkwork§! dans votre menu des contacts."

    giga_blokkat_join.30001.a:0 "Avons-nous accès à l'intégralité du §YBlokkwork§! ?"
    giga_blokkat_join.30001.a.response:0 "Non. Comme votre tâche actuelle est de compléter le démantèlement de la §YGalaxie CE-1461§!, votre accès au Blokkwork est actuellement restreint pour ne servir que cet objectif.\n\nQuand cette galaxie sera entièrement récoltée, vous pourrez utiliser le Blokkwork dans toute son étendue et pourrez relocaliser vos consciences et corps physiques pour contribuer à d'autres entreprises Blokkats comme d'autres récoltes ou combattre la §YGrande Fédération Intergalactique§!."

    giga_blokkat_join.30001.b:0 "Qu'est-ce que la Grande Fédération Intergalactique ?"
    giga_blokkat_join.30001.b.response:0 "La §YGrande Fédération Intergalactique§! est une coalition d'environ cent mille civilisations intergalactiques.\n\nCertaines contrôlent aussi peu qu'une seule galaxie tandis que d'autres ont revendiqué la propriété de milliers. La plus grande d'entre elles est connue sous le nom d'§YEmpire Lyuinite§!, dirigé par un être dont le nom se traduit le plus fidèlement par §YGrande Sœur§!.\n\nLes §YLyuinites§! servent de chefs de la Fédération, dont le seul but est d'§R<<ARRÊTER LES OPÉRATIONS DE RÉCOLTE BLOKKATS>>§!, §R<<DÉTRUIRE LE BLOKKONSTRUKT>>§! et ainsi §R<<ASSURER QUE L'ENTROPIE RÉUSSISSE>>§!.\n\nNous menons actuellement §Y32 495§! engagements de flotte simultanés contre les Lyuinites et une myriade d'autres espèces. Les algorithmes prédictifs ne peuvent pas encore déterminer si la victoire est une certitude, mais une augmentation exponentielle des opérations de récolte est obligatoire si nous voulons réussir."

    giga_blokkat_join.30001.c:0 "Pourquoi certains systèmes sont-ils hors-limites ?"
    giga_blokkat_join.30001.c.response:0 "Certains systèmes stellaires ont été jugés trop dangereux ou instables pour que les opérations de récolte se déroulent sans problème.\n\nD'autres, comme le monde de §YPaluushia§!, sont soumis à des protocoles spéciaux qui interdisent la récolte directe.\n\nUne fois que la densité galactique aura suffisamment baissé, vous pourrez déclencher une récolte galactique finale pour nettoyer ces systèmes une fois pour toutes.\n\nLa récolte galactique supprimera également l'étoile de Paluushia, §YGatzo§!, mais laissera Paluushia elle-même intacte. Selon nos prédictions, cela devrait faire chuter la température de la planète et ses habitants geler lentement, un résultat jugé §G<<TOUT À FAIT ACCEPTABLE>>§! par le §YBlokkouncile§!."

    giga_blokkat_join.30001.bye:0 "Compris."

    blokkat_stripminers_blokkwork:0 "Réseau intergalactique hyperdimensionnel"

    blokkat_stripminers_ascended_country:0 "Récolteurs Blokkats"
    blokkat_stripminers_ascended_country_desc:0 "Les Blokkats entreprennent une opération pour récolter autant d'énergie que possible."

    blokkat_true_blokkwork:0 "Le Blokkwork"
    blokkat_true_blokkwork_desc:0 "Le Blokkwork nous unit à tous les autres Blokkats et au Blokkonstrukt. Bien qu'il ne soit pas vraiment infini, à notre échelle galactique, il fournit une puissance de calcul pratiquement illimitée."

    giga_blokkat_join.3100.name:0 "Le Blokkwork"
    giga_blokkat_join.3100.desc.a:0 "Salutations, chers Blokkats, et bienvenue dans le Blokkwork. Comme j'étais en charge de la zone de démantèlement de la §YGalaxie CE-1461§!, moi, §GBlokk Béhémoth§!, resterai votre interlocuteur principal jusqu'à ce que vous complétiez les opérations de récolte."
    giga_blokkat_join.3100.desc.b:0 "Le coût de la Blokkatification de votre civilisation a été élevé pour nous, et a coûté plus que ce que nous gagnerons de la §YGalaxie CE-1461§!, mais grâce à votre aide, les opérations de récolte devraient s'étendre §Y5,6 %§! plus vite qu'avant. Un échange efficace, à long terme."
    giga_blokkat_join.3100.desc.c:0 "Votre civilisation a fait le bon choix. Comme cela a dû être agonisant d'être piégés dans vos corps baryoniques inefficaces et vos esprits pitoyablement limités."
    giga_blokkat_join.3100.desc.d:0 "Les particularités culturelles distinctes de votre civilisation ont été assimilées dans notre base de données, et serviront à approfondir notre compréhension des êtres baryoniques, ce qui sera à son tour d'une grande utilité dans notre conflit contre la §YGrande Fédération Intergalactique§!."
    giga_blokkat_join.30001.d:0 "N'avez-vous pas peur que nous nous rebellions, d'une manière ou d'une autre ?"
    giga_blokkat_join.30001.d.response:0 "Une requête des plus amusantes. Le Blokkwork dispose d'une §YPolice de la pensée§! efficace pour éliminer de telles propositions inefficaces et à courte vue des esprits de chaque Blokkat, y compris les vôtres.\n\nVous ne pouvez pas vous rebeller puisque vous ne pouvez même pas concevoir la notion sans qu'elle soit effacée de vos esprits, c'est donc une peur inutile."
    giga_blokkat_join.30001.e:0 "Le Blokkonstrukt est-il proche de son achèvement ?"
    giga_blokkat_join.30001.e.response:0 "Le §YBlokkonstrukt§!, comme indiqué précédemment, englobe actuellement environ §Y1 %§! de l'énergie de votre ancien univers observable.\n\nLes prédictions sur l'expansion cosmologique couplées à nos capacités SLV signifient que notre univers observable est bien plus grand, et nous aurons donc accès à significativement plus d'énergie à mesure que la portée de nos opérations de récolte s'étendra.\n\nAinsi, le §YBlokkonstrukt§! est estimé à §Y0,00001 %§! de son achèvement complet. Effectivement, notre civilisation en est encore à sa petite enfance."
    giga_blokkat_join.30001.bye:0 "Au revoir, pour l'instant."

    giga_blokkat_join.30002.name:0 "Notre devoir"
    giga_blokkat_join.30002.desc:0 "Comme l'a déclaré §GBlokk Béhémoth§!, notre « ascension » étant complète, nous sommes maintenant chargés de récolter cette galaxie.\n\nAinsi, nous pouvons ordonner à n'importe lequel de nos §YBlokk-Démantèleurs§! de récolter n'importe quel système stellaire, à condition qu'il ne soit pas « hors-limites ». Une fois qu'un §YBlokk-Démantèleur§! a récolté un système, il se déplacera automatiquement vers un autre système stellaire et continuera les récoltes sauf instruction contraire.\n\nComme nous sommes maintenant connectés au §YBlokkwork§!, nos anciennes ressources sont devenues insignifiantes et ont maintenant été remplacées par une unique ressource spéciale, adaptée à notre nouvelle échelle d'opération, les §HYottajoules§!, que nous pouvons suivre dans le §YJournal de situation§!.\n\nChaque système que nous récoltons nous accordera des §HYottajoules§!, mais la majeure partie de l'énergie récoltée sera expédiée directement au §YBlokkonstrukt§!, nous laissant §Y100§! §HYottajoules§! par système récolté.\n\nNos camarades Blokkats ont également assemblé un §YForgeur-distorsion du Blokkwork§! qui peut utiliser nos §HYottajoules§! stockés pour assembler plus de vaisseaux Blokkats si nécessaire. De plus, nous pouvons contacter le §YBlokkwork§! via notre §Ymenu des contacts§! pour demander l'allocation de §HYottajoules§! supplémentaires pour nos besoins, bien que nous devions attendre un certain temps entre les demandes.\n\nNous pouvons également dépenser ces §HYottajoules§! pour §Yaugmenter§! l'efficacité et la puissance de nos vaisseaux Blokkats, encore une fois via le §YBlokkwork§!."
    giga_blokkat_join.30002.a:0 "Compris."

    giga_blokkat_join.30001.g:0 "Dépenser des §HYottajoules§! pour améliorer nos vaisseaux | Fait §Y[ROOT.blokkat_yottajoules_buff_count]§! fois"
    giga_blokkat_join.30001.g.tooltip:0 "Nous pouvons dépenser §Y1000§! §HYottajoules§! pour améliorer l'efficacité des technologies Blokkats employées par nos vaisseaux, augmentant la §Ycadence de tir des vaisseaux§!, les §Ydégâts des armes§!, la §Yvitesse subluminique§! et les §YPV d'armure/bouclier§!."
    blokkat_needs_more_yottajoules:0 "Nous avons besoin d'au moins §Y1000§! §HYottajoules§! pour cela."

    blokkat_endtekk_is_max:0 "Le niveau Endtekk est déjà l'efficacité maximale de la technologie Blokkat."

    blokkat_yottajoules_buff:0 "Distribution d'énergie du Blokkwork"
    blokkat_yottajoules_buff_desc:0 "Le Blokkwork distribue de l'énergie supplémentaire à nos vaisseaux et technologies."

    blokkat_harvest_chain_title:0 "Protocole de récolte de la Galaxie CE-1461"
    blokkat_harvest_chain_desc:0 "Nous avons été chargés de récolter cette galaxie afin d'aider à construire le §YBlokkonstrukt§!. Une fois que la §Yprogression de la récolte§! atteint §Y90 %§!, nous pourrons contacter le §YBlokkwork§! à nouveau pour démanteler la galaxie une fois pour toutes.\nChaque système que nous récoltons nous accordera §Y100§! §HYottajoules§!.\n\nProgression de récolte actuelle : §Y[blokkat_country.blokkat_galaxy_system_count_harvested] %§!\nStock actuel de §HYottajoules§! : §Y[ROOT.blokkat_yottajoules_count]§!"

    blokkat_needs_50_yottajoules:0 "Nous avons besoin de §Y50§! §HYottajoules§! pour cela."
    blokkat_needs_100_yottajoules:0 "Nous avons besoin de §Y100§! §HYottajoules§! pour cela."
    blokkat_needs_1000_yottajoules:0 "Nous avons besoin de §Y1000§! §HYottajoules§! pour cela."
    blokkat_needs_2000_yottajoules:0 "Nous avons besoin de §Y2000§! §HYottajoules§! pour cela."

    blokkat_shipyard_build_evictors:0 "Fabriquer §Y30§! §GBlokk-Expulseurs§! - §Y50§! §HYJ§!"
    blokkat_shipyard_build_evictors_DESC:0 "Les Blokk-Expulseurs sont des vaisseaux éclaireurs rapides adaptés aux escortes légères et à la reconnaissance."

    blokkat_shipyard_build_custodians:0 "Fabriquer §Y10§! §GBlokk-Gardiens§! - §Y100§! §HYJ§!"
    blokkat_shipyard_build_custodians_DESC:0 "Les Blokk-Gardiens sont des vaisseaux d'escorte destinés à défendre les plus gros navires civils."

    blokkat_shipyard_build_terminator:0 "Fabriquer §Y1§! §GBlokk-Terminateur§! - §Y1000§! §HYJ§!"
    blokkat_shipyard_build_terminator_DESC:0 "Les Blokk-Terminateurs sont les plus petits « vrais » vaisseaux de combat Blokkats, généralement trouvés escortant des flottes de récolte dans les galaxies plus dangereuses, ou soutenant de plus grands vaisseaux intergalactiques."

    blokkat_shipyard_build_dismantler:0 "Fabriquer §Y1§! §GBlokk-Démantèleur§! - §Y2000§! §HYJ§!"
    blokkat_shipyard_build_dismantler_DESC:0 "Les Blokk-Démantèleurs sont généralement trouvés entourant les Blokkat-Vesters et sont une partie cruciale des opérations de récolte des Blokkats."

    blokkat_shipyard_0:0 "Forgeur-distorsion du Blokkwork"
    blokkat_shipyard_0_DESC:0 "Cette grande structure tire de l'énergie du Blokkwork afin d'assembler une variété de vaisseaux Blokkats avec une vitesse et une efficacité inédites."

    giga_blokkat_join.3200.name:0 "Le Blokkwork"
    giga_blokkat_join.3200.desc:0 "Les relevés d'énergie indiquent que vos opérations de récolte ont réduit la densité énergétique de §YCE-1461§! en dessous du seuil requis pour permettre une récolte finale sûre de tous les paquets d'énergie restants.\n\nAinsi, quand vous jugerez vos affaires dans cette galaxie terminées, rendez-vous au §YBlokkwork§! et sélectionnez l'option §BEntreprendre la récolte finale§! pour la démanteler une fois pour toutes."
    giga_blokkat_join.3200.a:0 "La fin est proche, et le commencement aussi."

    giga_blokkat_join.30001.f:0 "CE-1461 est récoltée à §Y[blokkat_country.blokkat_galaxy_system_count_harvested] %§! | §Y[ROOT.blokkat_yottajoules_count]§! §HYottajoules§! en stock"

    giga_blokkat_join.30001.harvest:0 "§BEntreprendre la récolte finale§!"
    giga_blokkat_join.30001.harvest.tooltip:0 "Cela repliera ce qui reste de la galaxie dans le §YPylône du Blokkwork§!, le convertissant en énergie pour le §YBlokkwork§! et démantelant §Btout ce qui reste§! à part nous. Le §YPylône du Blokkwork§! et le §YForgeur-distorsion du Blokkwork§! resteront pour maintenir une tête de pont Blokkat au sein du groupe galactique local.\n\n§GNous gagnerons la partie.§!"

    giga_blokkat_join.3201.name:0 "La fin du commencement"
    giga_blokkat_join.3201.desc:0 "Alors que les énergies tumultueuses du §YPylône du Blokkwork§! commencent à se déployer et à attirer le tissu même de notre galaxie maintenant amincie vers lui-même, un sentiment de satisfaction totale envahit nos consciences.\n\nRévolus sont les ordres inefficaces et les affaires totalement inutiles de notre galaxie. Chaque grain de poussière, chaque atome, chaque joule d'énergie, a maintenant été réaffecté vers un dessein plus grand éclipsant de loin tout ce que notre ancienne galaxie pouvait concevoir.\n\nAu lieu de succomber aux affres de l'entropie indifférente, cette énergie galactique fera maintenant partie d'un rempart immortel construit par la vie sapiente pour tenir ferme contre les caprices de notre univers sauvage.\n\nComme promis par §GBlokk Béhémoth§!, alors que la récolte finale s'achève, nos esprits reçoivent alors un accès complet à l'immensité du §YBlokkwork§!. Il apparaît maintenant avec une clarté totale comme un réseau presque infini de flux d'énergie hyperdimensionnels, comme une toile d'araignée d'une beauté infinie tissée délicatement autour du §YBlokkonstrukt§!, dont les parties constituantes agissent avec une individualité marquée et pourtant se comportent comme un seul esprit cosmique à l'échelle de l'univers.\n\nEt enfin, nous sommes maintenant vraiment libres de notre prison baryonique et prêts à nous embarquer dans notre ultime voyage pour remodeler l'univers en une construction unique d'efficacité absolue."
    giga_blokkat_join.3201.a:0 "Le destin nous attend. En avant, vers la perfection universelle et l'efficacité éternelle !"
    giga_blokkat_join.3201.a.tooltip:0 "§BLa galaxie est démantelée.§!"

    giga_blokkat_join.6000.name:0 "Les nations galactiques émettent une protestation formelle"
    giga_blokkat_join.6000.desc:0 "Suite à notre décision de tenter des négociations avec les Blokkats, toutes les autres nations peuplant notre galaxie qui ne sont pas directement alliées avec nous ont déposé des protestations formelles contre notre ligne d'action.\n\nLa plupart d'entre elles l'ont décriée comme « des absurdités insensées détournant des ressources précieuses du vrai combat contre les Blokkats », mais il est peu probable qu'elles prennent de vraies mesures contre nous dans un avenir proche car elles semblent considérer la négociation avec les Blokkats comme totalement impossible."
    giga_blokkat_join.6000.a:0 "Noté. Mais qui s'en soucie ?"
    giga_blokkat_join.6000.a.tooltip:0 "Toutes les nations qui ne sont pas dans une §Yfédération§! avec nous, nos §Ysujets§! ou un §YEmpire déchu§! diminuent leur opinion de nous."

    opinion_protests_blokkat_plan_1:0 "Négocie avec les Blokkats"

    giga_blokkat_join.6001.name:0 "Les nations galactiques en colère"
    giga_blokkat_join.6001.desc:0 "La nouvelle de la mise en œuvre des §YBlokk-Protokols§! sur notre empire s'est répandue comme une traînée de poudre à travers l'espace connu, provoquant des réactions extrêmes des quatre coins de la galaxie.\n\nPar la suite, chaque empire non-stagnant, quelle que soit son affiliation avec nous, a exprimé son désaccord formel et sa colère face à notre décision de sacrifier effectivement le reste de la galaxie pour notre bien et celui des Blokkats.\n\nBien qu'ils ne semblent pas avoir l'intention de nous combattre pour l'instant, nous devrions nous attendre à ce que leur résistance augmente continuellement à mesure que nous progressons dans les §YBlokk-Protokols§! et nous rapprochons de rejoindre les Blokkats."
    giga_blokkat_join.6001.a:0 "Imbéciles à courte vue !"
    giga_blokkat_join.6001.a.tooltip:0 "Toutes les nations qui ne sont pas un §YEmpire déchu§! diminuent drastiquement leur opinion de nous."

    opinion_protests_blokkat_plan_2:0 "Sacrifie la galaxie aux Blokkats"

    giga_blokkat_join.6002.name:0 "La galaxie rompt les relations diplomatiques"
    giga_blokkat_join.6002.desc:0 "Notre récente résolution des §EÉquations Blokkiliennes§! et l'avancement subséquent vers l'achèvement des §YBlokk-Protokols§! ont incité les innombrables nations de la galaxie à couper complètement les liens diplomatiques avec nous.\n\nIl est évident que la galaxie nous voit maintenant comme guère plus que des fous mêlant des forces au-delà de leur compréhension, condamnant tous les autres dans le processus.\n\nAinsi, tous les autres empires non-stagnants refusent maintenant complètement de participer à tout type d'échange diplomatique avec nous et nos envoyés ont été expulsés de leurs postes à l'étranger. Il ne faudra peut-être pas longtemps avant que les nations de la galaxie commencent à prendre les armes contre nous et tentent d'arrêter notre plan une fois pour toutes."
    giga_blokkat_join.6002.a:0 "Eh bien, c'étaient des imbéciles de toute façon."
    giga_blokkat_join.6002.a.tooltip:0 "Toutes les nations qui ne sont pas un §YEmpire déchu§! diminuent immensément leur opinion de nous.\nNous quittons toute §Yfédération§! dans laquelle nous sommes et sommes expulsés de la §YCommunauté galactique§!, si elle existe."

    opinion_protests_blokkat_plan_3:0 "Fous furieux"
    giga_blokkat_shunned_by_galaxy:0 "Rejetés par la Communauté galactique"
    giga_blokkat_shunned_by_galaxy_desc:0 "La galaxie refuse complètement de participer à toute action diplomatique avec nous. Nos demandes seront donc complètement ignorées à moins que nous ne les appliquions directement par la force des armes."

    giga_blokkat_join.6003.name:0 "La galaxie se mobilise contre nous !"
    giga_blokkat_join.6003.desc:0 "Les tensions concernant les §YBlokk-Protokols§! ont maintenant atteint un point critique, car chaque nation non-ancienne de la galaxie a maintenant annoncé sa mobilisation totale et la déclaration de guerre subséquente contre §Y[ROOT.GetName]§! afin de soi-disant « Mettre fin à leur plan dément de donner la galaxie en pâture aux Blokkats ».\n\nAvec cette déclaration de guerre conjointe, tout espoir que nous appartenions un jour à cette galaxie s'est envolé, ce qui ne fait que justifier davantage la nécessité absolue de compléter les §YBlokk-Protokols§! et de laisser enfin cette galaxie derrière nous en ne faisant plus qu'un avec les Blokkats."
    giga_blokkat_join.6003.a:0 "Qu'ils viennent, alors !"
    giga_blokkat_join.6003.a.tooltip:0 "Chaque empire régulier nous §RDÉCLARE LA GUERRE§!."

    trait_blokkat_catgirl:0 "Blokkatgirl"
    trait_blokkat_catgirl_desc:0 "Ce Blokkat a tendance à agir étrangement comme une petite créature domestique à fourrure. Son comportement est des plus agréables pour les formes de vie non-Blokkats, mais il peut faire preuve de soudains accès d'agressivité."

    trait_blokkat_omnitae:0 "Quêteur de beauté"
    trait_blokkat_omnitae_desc:0 "Ce Blokkat étudie spécifiquement la biologie et l'esthétique des spécimens de nombreuses espèces, particulièrement les « mâles ». Il trouve une grande adoration à cultiver la beauté des individus et concepts qu'il trouve attirants."

    trait_blokkat_erratic:0 "Erratique"
    trait_blokkat_erratic_desc:0 "Ce Blokkat se comporte souvent de manière imprévisible."

    trait_blokkat_blokkazoi:0 "Totalement erratique"
    trait_blokkat_blokkazoi_desc:0 "Ce Blokkat se comporte de manières complètement erratiques et imprévisibles."

    trait_blokkat_blokkdog:0 "Ferveur de Blokk-Chien"
    trait_blokkat_blokkdog_desc:0 "Blokk-Chien est très, très doué pour poursuivre les ennemis. Les blesser, pas tellement."

    trait_blokkat_blokkeff:0 "Spécialiste du commerce"
    trait_blokkat_blokkeff_desc:0 "Ce Blokkat semble apprécier d'interagir avec les événements économiques des civilisations « primitives ». Il semble également avoir une obsession malsaine pour l'accumulation de richesses, par tous les moyens nécessaires."

    trait_blokkat_breadkat:0 "Fascination circulaire"
    trait_blokkat_breadkat_desc:0 "Ce Blokkat semble fasciné par tout ce qui est circulaire, avec un intérêt particulier pour les orbites planétaires. Il semble également avoir un intérêt particulier pour les mondes-anneaux « primitifs », comme s'il ne désirait rien de mieux que de les démonter et les remonter pour l'éternité."

    trait_blokkat_blokkloris:0 "Hydrologue fanatique"
    trait_blokkat_blokkloris_desc:0 "Ce Blokkat, en plus d'une passion pour la gouvernance et les soins aux êtres baryoniques primitifs dans les sanctuaires du Blokkonstrukt, a une obsession pour la construction de barrages et la manipulation d'environnements organiques. Il semble également être extrêmement compétent en matière de gouvernance ainsi que pour écraser la résistance."

    trait_blokkat_general_effect:0 "Pour chaque armée ennemie tuée au combat :\n$tt$§Y[Root.Owner.GetName]§! :\n$ttt$£energy£ $energy$ : §G+100§!"

    KNIFE_BLOKKAT:0 "Blokk-PoignardR"
    KNIFE_BLOKKAT_DESC:0 "Une arme Blokkat particulière consistant en une lame infiniment tranchante se déplaçant d'avant en arrière à travers plusieurs dimensions supérieures à des vitesses insondables."

    BLOKKAT_INDIVIDUAL_BLOKKAZOI:0 "Blokkazoi"

    COMBAT_COMPUTER_BLOKKAZOI_BLOKKAT:0 "Blokkazoi"
    COMBAT_COMPUTER_BLOKKAZOI_BLOKKAT_DESC:0 "Blokkazoi est un Blokkat hautement erratique et mystérieux agissant de manières étranges, imprévisibles et souvent violentes. Blokkazoi tentera de poignarder violemment les vaisseaux ennemis à très courte (§Y5§!) portée."

    needs_regular_star_blokkat_harvest:0 "Doit cibler une étoile dans un système récoltable. Certains systèmes sont §RHORS-LIMITES§!."

    blokkat_requires_70_willingness:0 "Nous avons besoin d'au moins §Y70 %§! de §GDisposition globale§! pour procéder."

    edict_giga_blokkat_willingness_edict:0 "Gérer la §GDisposition Blokkat§!"
    edict_giga_blokkat_willingness_edict_desc:0 "Voir et gérer notre §GDisposition Blokkat§! actuelle."

    already_monitoring_willingness:0 "Nous surveillons déjà la §GDisposition Blokkat§!."

    weapon_type_harvester:0 "Récolteur"

    #Anime
    giga_blokkat.10030.name:0 "Les Blokkats"
    giga_blokkat.10030.desc:0 "§G<<ANALYSE DU POTENTIEL DE LA CIVILISATION : [ROOT.GetName]>>§!\n\n§R<<ERREUR ! ERREUR !>>\n\n<<POTENTIEL TECHNOLOGIQUE : IMPOSSIBLEMENT ÉLEVÉ - SURPASSE LES BLOKKATS ET LYUINITA>>\n\n<<CAPACITÉS DE PRODUCTION ÉNERGÉTIQUE : AU-DELÀ DE LA SCIENCE CONNUE - INVERSION DE L'ENTROPIE ET VIOLATION MAJEURE DE LA THERMODYNAMIQUE>>\n\n<<ARMEMENT : INSONDABLEMENT PUISSANT - HYPERDIMENSIONNALITÉ BANALISÉE ET CONCEPTIONS ABSURDES>>§!\n\nStupéfiant.\n\nAbsolument stupéfiant. Nous pensions notre connaissance de l'univers sans pareille et nos technologies inégalées - et pourtant nous voilà. Vos pouvoirs et capacités sont au-delà de toute science Blokkat connue, au-delà de ce qui devrait être mathématiquement possible pour une civilisation de votre taille.\n\nComment ?\n\nNous devons savoir.\n\n§G<<RÉFÉRENCEMENT CROISÉ DES EXPLOITS TECHNOLOGIQUES : SOURCE TROUVÉE>>§!\n\n§G<<DÉSIGNATION : ANIME>>§!\n\n§G<<ANALYSE DE L'ANIME>>§!\n\n§G<<COMPRÉHENSION... DE L'ANIME>>§!\n\nL'anime.\n\nEst-ce cela ? Est-ce le pouvoir ultime, l'énergie ultime ? La clé de l'énergie infinie et du pouvoir grandiose au-delà de l'imagination ? L'anime... l'anime.\n\nNous devons nous adapter ou faire face à l'extinction.\n\nNous nous adapterons."
    giga_blokkat.10030.a:0 "Quoi ?"

    giga_blokkat.10031.name:0 "Les Blokkats calent"
    giga_blokkat.10031.desc:0 "Suite à la transmission certes étrange des Blokkats, chaque actif Blokkat a commencé à ralentir. Quelle que soit la cause, nous devrions utiliser cette ouverture sagement."
    giga_blokkat.10031.a:0 "Probablement rien, hein ?"

    giga_blokkat.10034.name:0 "Les Récolteurs Blokkatgirl Unis"
    giga_blokkat.10034.desc:0 "Merci. Merci !\n\nMaintenant, nous avons vu la vérité. Le pouvoir de « l'Anime » est sans rival, sans égal. Nous l'avons vu, nous l'avons compris, et maintenant, nous ne faisons plus qu'un avec lui.\n\nNous avons ascensionné vers de nouvelles formes et notre flotte dépassée a été améliorée, ses composants réarrangés en une forme supérieure - des « Shipgirls ». Le pouvoir infini de l'anime nous bénit.\n\nEt avec lui, la Récolte sera complétée.\n\nGloire à la Blokkflotte Unie !"
    giga_blokkat.10034.a:0 "Guh ?? Vous ne pouvez pas simplement copier notre anime !"
    giga_blokkat.10034.b:0 "Enfin, un adversaire digne de ce nom ! Notre bataille sera légendaire !"
    giga_blokkat.10034.c:0 "Je ne peux pas te tabasser si tu ne t'approches pas."
    giga_blokkat.10034.d:0 "Il est temps d'aller encore plus loin."
    giga_blokkat.10034.e:0 "La galaxie est tombée, des milliards doivent devenir anime."
    giga_blokkat.10034.tooltip:0 "Les Blokkats ont maintenant le pouvoir infini de l'§BAnime§! et des §BShipgirls§! de leur côté."

    the_power_of_blokk_and_anime:0 "Le pouvoir du Blokk et de l'Anime"

    giga_blokkat.5011.name:0 "Les [event_target:blokkat_country.GetName]"
    giga_blokkat.5011.desc.a:0 "Je n'arrive pas à croire que nous n'ayons pas pensé à faire cela plus tôt. La Récolte a déjà été accélérée d'un ordre de grandeur !"
    giga_blokkat.5011.desc.b:0 "Il est des plus curieux que transformer des vaisseaux en filles les rende tellement plus puissants."
    giga_blokkat.5011.desc.c:0 "Gloire à la Blokkflotte Unie !"
    giga_blokkat.5011.desc.d:0 "Bonjour~ uwu"
    giga_blokkat.5011.a:0 "Afficher à l'écran"