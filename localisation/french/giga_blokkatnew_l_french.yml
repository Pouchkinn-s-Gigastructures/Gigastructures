l_french:

    giga_core_black_hole_exists:0 "Le §Ynoyau galactique§! nous est accessible, nous pouvons donc y sauter directement comme nous le ferions pour n'importe quel autre trou noir."

    giga_blokkat.3000.cosmovester:0 "Plonger dans le §GBlokkat-Vester§! | §Y50§! $blokkat_knowledge$"
    giga_blokkat.3000.cosmovester.tooltip:0 "Le Blokkat-Vester semble avoir une sorte de singularité en son centre. Peut-être... peut-être seulement, l'Aiguille d'Horizon pourrait nous y emmener, bien que nous aurons besoin de beaucoup de §Gsavoir Blokkat§! si nous voulons contourner le Rempart hyperdimensionnel."

    crisis.7510.vester:0 "Le Blokkat-Vester a un trou noir en son sein, n'est-ce pas ?"
    crisis.7510.vester.tooltip:0 "Un §Bprojet de recherche Blokkat§! téméraire pour sauter dans le Blokkat-Vester sera ajouté au §YBureau de recherche Blokkat§! pour §Y50§! §Gsavoir Blokkat§!.\nCela §RDÉSACTIVERA§! l'utilisation du §YDéstabilisateur hyperdimensionnel§!."

    JUMP_INTO_BLOKKAT_VESTER:0 "Plonger dans le Blokkat-Vester"
    JUMP_INTO_BLOKKAT_VESTER_DESC:0 "Le Blokkat-Vester semble présenter une structure semblable à un trou noir en son centre, dans laquelle nous pourrions peut-être plonger. Nous devrons d'abord trouver un moyen de contourner le Déstabilisateur hyperdimensionnel en utilisant l'Aiguille d'Horizon."

    giga_blokkat.3340.name:0 "Plonger dans le Vester ?"
    giga_blokkat.3340.desc:0 "Le Blokkat-Vester semble présenter une structure semblable à un trou noir en son centre. Ainsi, les éléments les plus audacieux de notre bureau de recherche ont proposé que nous utilisions notre Aiguille d'Horizon pour tenter d'y plonger... pour le meilleur ou pour le pire.\n\nNous n'avons aucune idée réelle de ce à quoi nous attendre. Peut-être pourrons-nous détourner le Blokkat-Vester, ou même puiser dans les réserves d'énergie récoltées par les Blokkats... ou nous pourrions mourir instantanément. Les possibilités sont aussi infinies et incertaines qu'elles sont excitantes.\n\nCependant, si nous devons entreprendre un tel projet, nous devrons investir une quantité significative de ressources pour trouver comment contourner le bouclier du Vester en utilisant notre Aiguille d'Horizon, de peur de finir écrasés contre celui-ci comme un moucheron spatial sur la coque d'un vaisseau."
    giga_blokkat.3340.a:0 "Plus de retour en arrière maintenant."

    #Vester Cosmogenesis
    giga_blokkat.3341.name:0 "Dans la gueule"
    giga_blokkat.3341.desc:0 "À bord de l'Aiguille d'Horizon, toute notre civilisation se prépare à l'entrée dans le Blokkat-Vester, dans ce qui est peut-être le coup le plus téméraire de notre empire. Les systèmes sont vérifiés, les modifications sont prêtes et... le saut commence.\n\nLe vaisseau-mère Blokkat, de quelques centaines de kilomètres de diamètre seulement, apparaît en pleine vue, ses anneaux concentriques tournants aussi merveilleux qu'ils sont terrifiants. Sans perdre de temps, l'Aiguille entreprend une série de modifications rapides pour traverser l'indestructible Rempart hyperdimensionnel qui l'entoure. Le bouclier se reforme en quelques microsecondes seulement, mais c'est tout ce dont nous avons besoin pour percer.\n\nEt ainsi nous y allons, dans la mystérieuse singularité au coeur de l'instrument de destruction des Blokkats, déclenchant modification après modification pour éviter l'incinération totale par la distorsion quasi infinie de l'espace-temps qui l'entoure..."
    giga_blokkat.3341.a:0 "Allons hardiment."


    #Welcome to the Blokkwork!
    giga_blokkat.3342.name:0 "L'autre côté de la Blokkfinité"
    giga_blokkat.3342.desc:0 "Contre toute attente, nous semblons être entrés dans le §YBlokkwork§!. Des flux d'énergie infinis et continus entourent l'Aiguille, s'écoulant du Blokkat-Vester vers un emplacement central inconnu dans l'espace intergalactique.\n\nEt ce n'est pas le seul. Des centaines... non, des milliers, des dizaines de milliers même, de tels flux d'énergie sont entrelacés ici, provenant tous d'innombrables Blokkat-Vesters supposément en train de démanteler de nombreuses galaxies.\n\nCurieusement, en plus des flux provenant des Vesters, il semble y avoir une myriade d'autres flux sortant vers des zones vides de l'espace intergalactique, comme s'ils alimentaient une opération Blokkat massive au milieu de nulle part.\n\nMais nos observations sont interrompues par la réalisation claire que nous ne sommes pas les bienvenus ici. Le Blokkwork, étant conçu pour canaliser l'énergie, n'est pas clément envers notre amas de matière solide. Il arrache l'Aiguille dans une tentative de la réduire à néant, notre civilisation maintenue en vie par des billions de modifications effectuées chaque seconde.\n\nIl est trop tard pour revenir en arrière, mais nous devons agir avec hâte car l'Aiguille ne peut pas supporter cela éternellement. Un choix doit être fait pour sortir de cet enfer : devrions-nous nous diriger vers ce qui semble être le centre du Blokkwork, ou tenter de percer ailleurs ?"
    giga_blokkat.3342.a:0 "Nous nous dirigerons vers la source de tout !"
    giga_blokkat.3342.b:0 "Nous devons quitter cet endroit maudit !"


    #To the Blokkonstrukt

    #To intergalactic space - you pop out near the GIF
    giga_blokkat.3343.name:0 "Évasion intrépide"
    giga_blokkat.3343.desc:0 "Avec hâte, nous tentons de nous éloigner de l'emplacement central et dépensons plutôt les dernières capacités de l'Aiguille à foncer à travers le Blokkwork vers les flux d'énergie déchargés dans l'espace intergalactique. Quelques instants seulement avant que l'Aiguille ne soit presque anéantie, nous émergeons métaphoriquement de la poêle à frire... pour tomber dans le feu.\n\nNous sommes recrachés au milieu d'une bataille spatiale aux proportions gargantuesques dans le vide intergalactique ! Une immense flotte Blokkat capable de faire exploser notre galaxie mille fois, composée de dizaines de milliers de vaisseaux bien plus grands que tout ce que nous avons rencontré, se bat contre une autre flotte composée de vaisseaux élancés inconnus alimentés par une sorte de singularité en leur centre.\n\nEt, d'une certaine manière, nous semblons avoir un impact. La flotte Blokkat se fige pendant quelques précieuses nanosecondes alors qu'elle traite notre vaisseau émergeant de leur propre réseau d'énergie. Cela donne à leurs adversaires inconnus un temps précieux pour tirer une salve fracassant l'espace-temps, surchargeant les vaisseaux Blokkat et en faisant détoner certains avec une fureur inédite tandis que d'autres se replient dans les profondeurs de l'espace.\n\nAlors que les Blokkats disparaissent de la détection, les vaisseaux élancés se tournent vers nous et semblent traiter quelque chose pendant un moment, jusqu'à ce que nous recevions une transmission provenant de l'un d'eux. Ils nous appellent !"
    giga_blokkat.3343.a:0 "À... l'écran."

    giga_blokkat.33441.name:0 "???"
    giga_blokkat.33441.desc:0 "§HLes vaisseaux semblent transférer des informations directement dans nos consciences... leur technologie est évidemment bien au-delà de la nôtre. Un bourdonnement sourd se fait entendre à travers l'Aiguille. Ils semblent nous scanner.§!\n\n...venez-vous de voyager à travers le Blokkwork ? Stupéfiant ! Merveilleux ! Absolument incroyable ! Nous avons vu... de nombreux primitifs monogalactiques comme vous tenter de tels exploits avec divers appareils, mais voir un vaisseau non-Blokkat réel et quelque peu intact émerger de là est absolument du jamais vu. Concevoir un vaisseau comme le vôtre avec un niveau technologique aussi bas témoigne d'une sérieuse ingéniosité."
    giga_blokkat.33441.a:0 "Qui ou qu'êtes-vous ?"

    giga_blokkat.3344.name:0 "La Grande Fédération Intergalactique"
    giga_blokkat.3344.desc:0 "Ah, bien sûr. Vous... ne savez pas qui nous sommes, oui. La §YGrande Fédération Intergalactique§! est une alliance composée de plusieurs centaines de milliers de civilisations intergalactiques... toutes unies contre la menace des Récolteurs Blokkats ! Et vous venez d'assister à une glorieuse victoire là-bas.\n\nOh, où sont mes manières ? Je suis §YSteroh§!, Lyuinite et Amiral universel de la §YForce opérationnelle du Salut universel§!, responsable de la gestion du §YThéâtre de Laniakea§! des opérations contre la menace Blokkat.\n\nNotre alliance opère principalement sous l'aile du grand §YEmpire Lyuinite§! dirigé par notre chef §YKyuinai§! et de l'§YAssemblée universelle§!, qui supervise une grande partie de notre appareil bureaucratique et assure une coordination appropriée entre nos très, très nombreux États membres.\n\nPuisque cette guerre se déroule sur des milliards d'années-lumière et des dizaines de milliers d'années... il est primordial que nous restions aussi unis que possible, de peur que les Blokkats ne nous balaient comme des grains de poussière."

    giga_blokkat.3344.winning:0 "Eh bien, battez-vous les Blokkats ?"
    giga_blokkat.3344.winning.response:0 "Nous essayons de détruire ces sales, sales récolteurs depuis des dizaines de millénaires maintenant. Ils ont causé... des octillions de morts jusqu'à présent, et dévoré environ trente milliards de galaxies, et ça ne fait qu'augmenter.\n\nEh bien. Nous ne pouvons pas vraiment dire que nous les battons pour l'instant, malheureusement. Nous les retenons principalement et évacuons... les gardant hors des secteurs centraux Lyuinites... c'est une guerre d'usure, vraiment.\n\nNous ne pouvons pas vraiment gagner la plupart de nos batailles car les vaisseaux Blokkats sont à la fois nombreux, puissants et agiles, mais nous pouvons les faire saigner autant d'énergie que possible pour ça... jusqu'à ce qu'ils perdent espérons-le plus qu'ils n'obtiennent en dévorant l'univers.\n\nNous espérons pouvoir les retarder puis monter une véritable contre-offensive... quelque part dans les prochaines dizaines de milliers d'années."

    giga_blokkat.3344.ships:0 "Quels sont ces immenses vaisseaux que vous utilisez ?"
    giga_blokkat.3344.ships.response:0 "Les vaisseaux que nous utilisons sont connus sous le nom de §Yvaisseaux-singularité§!, les principaux atouts militaires contre les forces Blokkats, notre pain quotidien, si vous voulez. Nous en avons environ un billion sur l'ensemble du champ de bataille universel et nous avons besoin que tous fonctionnent en tandem si nous voulons un jour retarder les Blokkats.\n\nVoyez-vous, ils utilisent une singularité pour s'interfacer avec la réalité et altérer localement la physique pour se déplacer et attaquer... essentiellement une version armée de cette Aiguille d'Horizon que vous semblez avoir construite.\n\nVotre version est... eh bien elle est assez rudimentaire, très bricolée, mais encore une fois, fabriquer quelque chose comme ça avec les ressources et la technologie d'une seule galaxie ? Vraiment impressionnant ! Je vous applaudis. Habituellement, les primitifs monogalactiques se tuent juste en essayant de construire de tels appareils."

    giga_blokkat.3344.appearance:0 "Est-ce votre véritable apparence ?"
    giga_blokkat.3344.appearance.response:0 "Oui... et non. Nous les Lyuinites sommes faits de matière intelligente... malheureusement un peu comme les Blokkats, bien que nos méthodes soient légèrement différentes.\n\nJe choisis d'employer cette forme parce qu'elle m'est particulièrement plaisante, mais je pourrais ressembler à n'importe quoi d'autre si je le voulais. Ma conscience réelle n'est même pas à bord de cette flotte, mais plutôt hébergée quelque part dans un amas fortifié de Cerveaux Matriochka à quelques millions d'années-lumière d'ici.\n\nCela peut sembler lâche, mais nous ne pouvons prendre aucun risque avec les Blokkats ! Ils... font la même chose, de toute façon. Oh, oui, si vous avez jamais réussi à capturer des Blokkats... pas de chance ! Tout ce que vous avez réussi à obtenir est le châssis du Blokkat exécutant une simulation de secours du Blokkat réel lui-même... décevant, je sais. Désolé pour ça."


    giga_blokkat.3344.deepshroud:0 "Avez-vous essayé de partir vers un autre univers, plus jeune et sans Blokkats ?"
    giga_blokkat.3344.deepshroud.response:0 "Aller dans... d'autres univers ? Hm. Je peux dire que votre espèce est assez audacieuse, mais savez-vous même ce qu'il y a là-bas ? Le... multivers, si vous pouvez l'appeler ainsi, est dangereux, mortel et imprévisible. Il y a des entités là-dedans qui font ressembler les patrons du Voile superficiel de votre galaxie à des animaux sans défense !\n\nEh bien, pour vous dire la vérité. Peut-être pourrions-nous, avec suffisamment d'efforts, faire cela. Mais... alors les Blokkats auraient carte blanche sur cet univers, et ils pourraient tout consommer sans opposition.\n\nEt ensuite quoi ? Ensuite... peut-être eux aussi perceraient, et une fois de plus nous menaceraient dans n'importe quelle réalité vers laquelle nous avons réussi à fuir. Donc nous devons arrêter les Blokkats là, et maintenant, sinon qui sait jusqu'où ils iront ?"

    giga_blokkat.3344.blokkonstrukt:0 "Il y a un emplacement central au Blokkwork. Qu'est-ce que c'est ?"
    giga_blokkat.3344.blokkonstrukt.response:0 "C'est... le §YBlokkonstrukt§!. Une misérable térastructure, de plus d'une année-lumière de diamètre, dans laquelle les Blokkats ont amalgamé l'énergie de centaines de milliards de galaxies. Et ils veulent éventuellement tout replier dans celle-ci afin de, supposément, repousser la Mort thermique... aux dépens de tout le monde.\n\nNous ne souhaitons que la voir détruite."

    giga_blokkat.3344.join:0 "Pouvons-nous... vous rejoindre ?"
    giga_blokkat.3344.join.response:0 "Vous aimeriez nous rejoindre dans notre combat contre les Blokkats ? Eh bien, nous serions très obligés ! Habituellement, nous ne contactons pas les civilisations avant qu'elles n'aient réussi à repousser un Blokkat-Vester, mais vous avez clairement démontré une ingéniosité incroyable en survivant à un voyage à travers le Blokkwork.\n\nDites, nous allons vous donner des plans pour un véritable vaisseau-singularité, et nous vous aiderons à transformer cette Aiguille qui est la vôtre en un vrai vaisseau de guerre, adapté à la guerre intergalactique ! Et ensuite nous montrerons aux Blokkats qui sont les vrais maîtres de l'univers, oui ?"

    giga_blokkat.3345.name:0 "Pour sauver l'univers"
    giga_blokkat.3345.desc:0 "Mettant de côté nos plans certes égoïstes de quitter cette réalité, nous avons décidé de nous concentrer sur l'objectif bien plus noble d'aider la Grande Fédération Intergalactique dans leur lutte universelle contre les Blokkats.\n\nPeu après, nous sommes contactés par un Lyuinite connu sous le nom de §YDiym Milize§!, responsable de la diplomatie de l'alliance, qui nous présente le fonctionnement de la G.F.I. avant que nous signions officiellement notre entrée dans l'union intergalactique.\n\nL'Aiguille est escortée par la flotte massive de vaisseaux-singularité vers une galaxie forteresse voisine. Là, on nous fournit des plans et une infrastructure bien au-delà de nos rêves les plus fous, nous permettant de transformer notre Aiguille en un puissant vaisseau de guerre facilement capable de dévaster les flottes Blokkats qui avaient précédemment assiégé notre galaxie.\n\nIl faut des années pour nous habituer à ce bond technologique, qui incidemment nous permet de saisir combien d'éléments de notre projet de Cosmogenèse nous ne comprenions pas réellement, mais finalement, grâce aux instructeurs Lyuinites, nos meilleurs ingénieurs et scientifiques sont capables de terminer cette grande amélioration...\n\n...et ainsi, nous partons ! Rejoignant notre nouveau vaisseau-singularité bien à nous avec une autre flotte, nous commençons notre mission de d'abord retarder, puis stopper la menace Blokkat et peut-être, juste peut-être... sauver toute la création."
    giga_blokkat.3345.a:0 "En avant !"

    giga_blokkat.3344.blackhole:0 "Pourriez-vous simplement nous escorter jusqu'au trou noir le plus proche ?"
    giga_blokkat.3344.blackhole.response:0 "Oh, d'accord. Vous aimeriez entreprendre ce projet de Cosmogenèse qui est le vôtre à nouveau, oui... ? J'ai bien peur que nous ne puissions vraiment pas... vous laisser faire cela en toute bonne conscience. Nous avons vu ce qui se passe habituellement avec ça ! 99 % du temps... quiconque essaie meurt juste d'une horrible façon ou d'une autre. Nous allons juste scanner votre vaisseau et vous amener en lieu sûr, d'accord ?"

    giga_blokkat.33451.name:0 "L'installation"
    giga_blokkat.33451.desc:0 "Suite à notre demande, la G.F.I. déploie un petit nuage de matière semblable à des nanites qui étudie notre vaisseau pendant un moment, probablement pour analyser et comprendre notre voyage à travers le Blokkwork. Plus de la même matière procède ensuite à réparer notre Aiguille, la rendant à nouveau pleinement opérationnelle... pour ensuite nous envelopper complètement, faisant perdre conscience à tous à bord !\n\nNous nous réveillons après une durée indéterminée, nous trouvant toujours à l'intérieur de l'Aiguille, mais dans une grande mégastructure quelque part dans l'espace intergalactique profond. Devant nous, au centre de la structure, se trouve une grande faille dans l'espace-temps semblable aux Failles astrales de notre ancienne galaxie, entourée d'une variété d'appareils la maintenant de force ouverte.\n\nUne voix résonne soudain à travers nos esprits."
    giga_blokkat.33451.a:0 "Qui est-ce cette fois... ?"

    giga_blokkat.33454.name:0 "La F.S.E.A."
    giga_blokkat.33454.desc:0 "Salutations, primitifs monogalactiques. Ce que je suis sur le point de vous dire est strictement classifié, mais vous serez bientôt en route donc ça n'a pas trop d'importance.\n\nLe nom est §YEdgar Nexon§!, chef de la §YFédération de Sécurisation des Entités Anomales§! ou §YF.S.E.A.§! pour faire court. Notre travail est de cataloguer tous les événements étranges dans cet univers... et au-delà.\n\nNous vous avons secrètement récupérés après que Steroh ait informé les supérieurs de votre exploit de plongée dans le Blokkwork, ce qui, eh bien, a certainement attiré notre attention, surtout puisque vous voulez apparemment le refaire ! Je peux dire que vous n'êtes pas trop familiers avec la nature du §YProfundum§!, et pour cela vous ne pouvez être blâmés puisque, eh bien, personne ne l'est vraiment."

    giga_blokkat.33454.place:0 "Où sommes-nous maintenant ?"
    giga_blokkat.33454.place.response:0 "Vous êtes dans un §Ysite F.S.E.A.§! en espace profond destiné à étudier le §Yvoyage interrealmique§!, ou comme vous l'appelez parfois, le voyage multiversel. Nous avons des centaines de failles astrales stabilisées là-dedans, vous en connaissez peut-être ?\n\nBien que celles que vous pouvez trouver dans n'importe quelle galaxie tendent à être instables à long terme et à rompre leur propre connexion relativement rapidement en raison de la nature des énergies tourbillonnantes du §YProfundum§!, donc l'objectif principal de cette installation est de trouver des moyens de les stabiliser à long terme."

    giga_blokkat.33454.deepshroud:0 "Le Profundum... ?"
    giga_blokkat.33454.deepshroud.response:0 "D'accord, donc, le §YProfundum§!, parfois aussi appelé le §YVoile profond§!... est essentiellement le tissu du multivers, si vous voulez. C'est comme une soupe géante dans laquelle tous les univers ou Royaumes accessibles flottent.\n\nParfois des connexions se forment, mais elles sont généralement vraiment instables ou dangereuses, au point que le voyage interrealmique fiable aller-retour est... presque impossible. Et vous êtes... particulièrement audacieux, considérant que ce projet de Cosmogenèse qui est le vôtre tentait essentiellement de traverser vers un autre de ces royaumes par un trou noir. Impressionnant, mais à peu près suicidaire.\n\nLes chances de finir dans un univers convenable sont faibles, et vous seriez très susceptibles de rencontrer certaines des nombreuses, nombreuses entités qui rôdent entre les réalités... attendant seulement que quelque chose tombe dans leurs gueules éldritch."

    can_leave_thanks_to_fsae_tooltip:0 "Demandons d'abord ce qui se passe."

    giga_blokkat.33454.why:0 "Alors, pourquoi sommes-nous ici ?"
    giga_blokkat.33454.why.response:0 "Simple. Nous sommes assez stupéfaits par votre petit exploit de voyage dans le Blokkwork, qui, à travers l'étude de votre Aiguille, nous a donné beaucoup de données précieuses, donc je rends juste la pareille.\n\nDevant vous se trouve une grande §Ysingularité astrale§! stabilisée. Elle devrait espérons-le fournir à votre espèce un passage quelque peu sécurisé vers un autre Royaume, un qui devrait être « jeune » et « prêt à être manipulé » comme vous le cherchiez à l'origine avant de choisir à la place de plonger dans un Blokkat-Vester... pour une raison quelconque.\n\nPlongez quand vous voulez, vraiment. Si vous vous demandez pourquoi nous ne faisons pas la même chose... eh bien, sachez que faire cela trop souvent tend à attirer une... attention indésirable. Donc soyez rapides, sinon..."

    giga_blokkat.33454.leave:0 "Nous sommes prêts à partir."
    giga_blokkat.33454.leave.response:0 "D'accord. Faites votre truc et faites vite. Et bonne chance là-dehors. Ne vous faites pas éldritch. Et ne passez pas trop de temps dans le Profundum. Entrez, sortez, pas de flânerie !"

    giga_blokkat.33455.name:0 "Une fois de plus vers l'infini"
    giga_blokkat.33455.desc:0 "Nous activons rapidement l'Aiguille et plongeons dans la Singularité astrale, découpant et tordant la réalité modification après modification pour assurer notre survie pendant la traversée.\n\nLes résultats sont satisfaisants. La Singularité astrale, ayant vraisemblablement été ajustée par la F.S.E.A., cède devant nous, laissant notre Aiguille momentanément traverser les marées du Profundum. Nous nous trouvons maintenant à voyager en douceur à travers l'espace entre les réalités le long d'un sentier éthéré - mais notre curiosité insatiable revient une fois de plus.\n\nNexon nous a avertis de ne pas ralentir, mais certains d'entre nous ne peuvent pas résister. Bientôt, une grande partie de notre civilisation demande à l'Aiguille de ralentir pour que nous puissions étudier la nature du Profundum plus en détail, et surtout, le voir de nos propres yeux.\n\nQuelles merveilles, quelles émerveillements inconnaissables résident dans ce tissu multiversel ? Il nous appelle. Cela pourrait très bien être notre seule chance d'avoir un aperçu clair de l'essence fondamentale de la réalité. Que faire ?"
    giga_blokkat.33455.a:0 "Écouter Nexon ! Maintenir le cap !"
    giga_blokkat.33455.b:0 "Nous devons savoir ce qui se trouve au-delà. Pour la science !"

    giga_blokkat.33456.name:0 "Un nouveau foyer"
    giga_blokkat.33456.desc:0 "Ignorant notre curiosité destructrice, nous accélérons le long du chemin tracé par la Singularité astrale et nous trouvons bientôt dans un nouveau « Royaume », comme l'appellent les Lyuinites. La F.S.E.A. a bien fait son travail : ce Royaume est calme et jeune, son tissu même comme de l'argile prête à être façonnée en tout ce que nous désirons.\n\nNotre curiosité concernant le Profundum reste cependant inassouvie, mais cela importe peu. Ici, nous avons tout le temps de l'univers pour reconstruire et étendre notre civilisation. Peut-être qu'avec le temps, nous pourrons entreprendre nos propres incursions dans le Profundum tout comme les Lyuinites, mais pour l'instant, à travers nos luttes et nos triomphes, nous avons trouvé un foyer."
    giga_blokkat.33456.a:0 "Au final, tout cela en valait la peine."

    giga_blokkat.33457.name:0 "Entrevoir l'horreur"
    giga_blokkat.33457.desc:0 "Ignorant les conseils de Nexon, nous ralentissons un peu alors que certains d'entre nous osent contempler les profondeurs de l'espace multiversel. Des marées infinies d'énergie hyperdimensionnelle nous entourent, affluant et refluant à travers les neuf dimensions spatiales du Profundum, comme contempler un ensemble infini d'infinités...\n\nPendant ce qui semble être une éternité, nous restons émerveillés par le spectacle, certains totalement incapables de cesser de le regarder. Alors que nous fixons les profondeurs de la réalité, une part de plus en plus grande de notre équipage commence à affirmer que la « solution à tout » se trouve juste à l'extérieur du chemin éthéré. Ce serait une solution si élégante et puissante que la F.S.E.A. a tenté de nous la dissimuler !\n\nQuelque chose d'une telle puissance, qu'il pourrait supposément « mettre fin au cycle » de souffrance et de douleur enduré par ceux à travers le multivers. Des promesses de divinité littérale, notre propre ascension, au-delà même de nos rêves de Cosmogenèse les plus fous, au-delà des Lyuinites et des Blokkats, remplissent nos consciences.\n\nCar en effet ! Si les univers individuels sont capables de montrer une résistance à nos modifications, pourquoi s'embêter avec eux ? Passons directement à la source, et modelons le tissu sous-jacent même du multivers à la place !\n\nLa réponse est claire : nous devons quitter le chemin. Entrer dans le Profundum pour de bon. C'est notre destinée d'embrasser l'infini ! Nous devons agir maintenant avant que l'opportunité ne glisse !"
    giga_blokkat.33457.a:0 "Au diable Nexon ! Nous saisirons l'éternité !"
    giga_blokkat.33457.b:0 "Non ! NON ! MAINTENIR LE CAP !"


    giga_blokkat.33458.name:0 "Mettre fin au cycle"
    giga_blokkat.33458.desc:0 "L'Aiguille prend un virage serré, quittant le chemin éthéré de la F.S.E.A. puis plongeant tête baissée dans les profondeurs du Profundum. C'est... magnifique. Une infinité éternelle s'étend devant nous. Avec le pouvoir de notre Aiguille, nous travaillerons à remodeler l'espace interdimensionnel lui-même. Nous ne serons pas de simples dieux, mais plutôt de vrais Dieux omnipotents, libérés des lois et contraintes de tout univers particulier.\n\nMais d'abord, nous devons trouver un endroit convenable, un où la densité d'énergie est juste ce qu'il faut pour nos plans. Naviguer dans l'espace à neuf dimensions est... délicat, mais ce n'est rien que nous ne puissions gérer. Finalement, nous localisons un emplacement convenable, et commençons notre travail. Au diable la F.S.E.A. et les Blokkats et toutes ces pathétiques civilisations à l'esprit étroit ! Ils pensaient que §Rce n'était pas encore notre heure...§! mais maintenant, §Rce le sera§!. Tout ce que nous aurons à faire est... amener §Rla Fin§!.\n\nOui, oui ! Les marées infinies d'agonie que le multivers expérimente seront bientôt §Rterminées§!. D'innombrables mondes, d'innombrables réalités, d'innombrables §RCycles§! futiles prendront §Rfin§!. Dans tous nos esprits à la fois, un message clair résonne : c'est et a toujours été §Rnotre but§!. Nos formes et êtres sont altérés par les §Rénergies§! du Profundum alors que nous peinons, nos esprits mêmes se tordant et se déformant en quelque chose d'§Rinconnaissable§!. Bientôt il n'y a plus de §Rtemps§!, plus de §Rsouffrance§!, plus de §Rpensée§!, plus de §Rréalité§!.\n\n§RIl n'y a que la Fin du Cycle§!."
    giga_blokkat.33458.a:0 "§RSI SEULEMENT NOUS AMENONS LA FIN.§!"
    giga_blokkat.33458.a.tooltip:0 "Qu'avez-vous fait... ?"

    giga_blokkat.33459.name:0 "Saufs mais pas sains"
    giga_blokkat.33459.desc:0 "Nous ne devons pas rester ici ! Dans une démonstration de force contre notre propre curiosité, nous accélérons une fois de plus le long du chemin tracé par la Singularité astrale et nous trouvons bientôt dans un nouveau « Royaume », comme l'appellent les Lyuinites. La F.S.E.A. a bien fait son travail : ce Royaume est jeune, son tissu même comme de l'argile prête à être façonnée en tout ce que nous désirons.\n\nEt pourtant cela semble... mal. Nous avons été témoins du Profundum dans sa beauté hyperdimensionnelle, et maintenant l'espace tridimensionnel de ce Royaume est... insatisfaisant. Restrictif. Exigu. Il est cependant évident d'après notre accès de délire interdimensionnel que nous ne pouvons pas simplement résider entre les réalités, de peur d'être dévorés par des forces au-delà de notre compréhension.\n\nLes tensions montent alors que notre civilisation devient de plus en plus incertaine de son propre avenir et de ses objectifs. Mais finalement, un accord est trouvé. Nous avons tout le temps de l'univers ici, et donc nous nous mettrons au travail. Nous affinerons et améliorerons la conception de l'Aiguille, jusqu'à ce qu'elle soit capable de résister aux énergies chaotiques du Profundum..."
    giga_blokkat.33459.a:0 "Et ensuite... nous retournerons enfin chez nous."

    # But our admiration is cut short by the sudden emergence of unspeakable screeches within our very consciousnesses - endless notions of 'ending the cycle' poison the minds of our crew, sending some of them into a frenzy of delirium before they ultimately take their own lives.
    # However, n\n.

    giga_blokkat.3344.fight:0 "Racaille. Nous vous détruirons !"

    giga_blokkat.33452.name:0 "La Grande Fédération Intergalactique"
    giga_blokkat.33452.desc:0 "Holà ! Nous comprenons que combattre des extraterrestres fait peut-être partie de la culture de votre civilisation, mais ce genre de comportement primitif ne peut pas être toléré ici. Nous devons rester unis si nous voulons riposter contre les Blokkats, donc... si vous pouviez gentiment cesser d'agir ainsi... ce serait super !\n\nPensez à tout le bien que vous pourriez faire dans l'univers si vous ne pensiez pas à tout assassiner. Comme, peut-être nous aider à vaincre ceux qui essaient de tout assassiner ?"

    giga_blokkat.33452.yes:0 "On va vous montrer le meurtre ! En avant toute !"
    giga_blokkat.33452.no:0 "Nous... supposons que vous avez raison. Désolé."

    giga_blokkat.33453.name:0 "La frappe"
    giga_blokkat.33453.desc:0 "Sans répit, nous coupons de force les communications avec la flotte xéno et, utilisant le peu d'énergie qui reste dans l'Aiguille, chargeons vers les vaisseaux ! Avec grande hâte, nous entreprenons une série de modifications frénétiques visant à détruire le misérable vaisseau que nous sommes sur le point de percuter. L'Aiguille n'est peut-être pas conçue pour la guerre, mais perturber la réalité elle-même peut certainement être une arme puissante...\n\n...ou du moins le pensions-nous. En une fraction de seconde, l'un des vaisseaux-singularité fige l'Aiguille sur place, nos propres modifications impuissantes contre les leurs alors que notre vaisseau est placé dans une chambre de stase. Ce qui suit est le retour forcé de notre Aiguille vers l'une des galaxies de la G.F.I., où elle est rapidement démontée et étudiée, vraisemblablement pour comprendre comment nous avons survécu à un voyage à travers le Blokkwork.\n\nUne fois que tout est dit et fait, notre peuple est rééduqué pour abandonner nos voies violentes avant d'être relâché au sein d'un État membre plus large de la G.F.I. Effectivement, c'est là que notre histoire se termine. En quelques décennies, notre ancienne culture et mode de vie, jugés trop « primitifs », sont essentiellement anéantis alors que nous sommes incorporés dans ce collectif, les souvenirs de nos grands exploits de Cosmogenèse bientôt relégués à l'histoire."
    giga_blokkat.33453.a:0 "Memento mori."

    giga_blokkat.3348.name:0 "Le centre de l'univers"
    giga_blokkat.3348.desc:0 "Fonçant à travers les flux d'énergie éthérés du Blokkwork, notre Aiguille combat inlassablement contre l'oubli alors qu'elle remonte le réseau, se rapprochant de plus en plus de la source de tout, vraisemblablement là où l'énergie récoltée par les Blokkats aboutit. Dépensant le reste de son énergie, elle émerge enfin du réseau.\n\nNous nous trouvons à la surface de ce qui semble être une structure absolument gargantuesque, de plus d'une année-lumière de longueur. Faite des énergies amalgamées de centaines de milliards de galaxies assemblées, c'est... c'est ça. L'exploit ultime d'ingénierie des Blokkats et leur projet principal. Une construction inimaginablement grande, destinée à croître pour toujours jusqu'à ce que l'univers entier y soit amalgamé.\n\nIl semble que les Blokkats appellent cet endroit le §YBlokkonstrukt§!, une structure d'une complexité quasi infinie abritant toute leur civilisation - l'ultime démonstration de force de la vie sapiente contre les forces indifférentes de l'entropie. Mais nous n'avons plus le temps de méditer, car nous n'appartenons pas ici.\n\nQuelques secondes après notre arrivée, les modifications de l'Aiguille faiblissent, submergées par la propre distorsion de la réalité de la structure, alors que d'innombrables êtres tournent leur regard vers nous, leurs esprits submergeant les nôtres.\n\nDans une tentative désespérée de survie, l'Aiguille entreprend une dernière modification - une tentative audacieuse de plonger dans le coeur même du Blokkonstrukt, dans l'espoir que sa propre attraction gravitationnelle puisse émuler celle d'un trou noir et nous permettre de quitter cette réalité."
    giga_blokkat.3348.a:0 "Au coeur même de la réalité."

    giga_blokkat.3349.name:0 "Nirvana"
    giga_blokkat.3349.desc:0 "L'Aiguille s'arrête dans un endroit calme, le Blokkonstrukt et ses habitants nulle part en vue. Soudain, un sentiment de sérénité surnaturelle submerge nos esprits.\n\nNous avons réussi ! Contre toute attente, nous avons échappé au Blokkonstrukt et sommes partis vers une meilleure réalité. Cet univers est... plaisant, chaleureux, tranquille. Partout où nous regardons, nous voyons de l'espace vide, prêt à être façonné pour nos propres desseins, débordant d'une sorte de félicité pure et éthérée, qui remplit nos consciences à chaque instant.\n\nCet univers est, dans tous les sens du terme, absolument parfait, précisément ce que nous recherchions dans nos efforts de Cosmogenèse. Notre pari a payé. Nous avons traversé l'enfer, et nous nous trouvons maintenant au paradis, où nous résiderons désormais pour toujours, libérés des luttes et de la douleur du monde matériel."
    giga_blokkat.3349.a:0 "§G<<PROTOCOLES DE SANCTUAIRE INITIÉS - INTRUS CONTENUS AVEC SUCCÈS>>§!"

    giga_blokkat_join.1000.name:0 "Faire face aux Blokkats"
    giga_blokkat_join.1000.desc:0 "Il est évident que le §YRempart hyperdimensionnel§! entourant le §YBlokkat-Vester§! va être un obstacle majeur si nous voulons un jour repousser les §YBlokkats§! de notre galaxie. Suite à une analyse plus poussée des données rassemblées par le Bureau et une discussion approfondie, notre direction et nos équipes scientifiques ont proposé plusieurs plans d'action possibles pour faire face aux Blokkats.\n\nLe premier et le plus évident est de, comme suggéré précédemment, rechercher et ensuite construire un dispositif massif pour abaisser le bouclier, avant d'utiliser nos flottes pour réduire le Blokkat-Vester en néant, éliminant ainsi la menace Blokkat de notre galaxie.\n\nUne autre branche de notre gouvernement argue que combattre est futile et que nous devrions plutôt suivre la suggestion des Blokkats et assembler une §Yarche intergalactique§! pour évacuer en toute sécurité notre population de la galaxie et chercher refuge ailleurs.\n\nEnfin, une troisième branche beaucoup plus marginale suggère que, considérant que les Blokkats sont évidemment sapients et capables de pensée intelligente, il pourrait y avoir un moyen de potentiellement... §Rles rejoindre§!, si nous trouvions un moyen de négocier avec ces envahisseurs.\n\nBien que la dernière option ait été décriée comme absolument ridicule par presque tous les membres sains d'esprit de notre gouvernement et communauté scientifique, ses partisans arguent que s'allier aux Blokkats assurerait la continuité et la sécurité éternelles de notre grande civilisation pour les éons à venir.\n\n§BSi nous avons l'avantage §YCosmogenèse§!, de nouvelles opportunités pourraient se présenter plus tard...§!"

    giga_blokkat_join.1000.a:0 "Nous combattrons et repousserons ces envahisseurs, quel qu'en soit le coût !"
    giga_blokkat_join.1000.a.tooltip:0 "Le §YBureau de recherche Blokkat§! se concentrera sur le développement du §YDéstabilisateur hyperdimensionnel§!, un grand dispositif capable d'abaisser le bouclier du §YBlokkat-Vester§!.\n\n§BCette ligne d'action se concentrera sur la recherche scientifique et la puissance militaire.§!"

    giga_blokkat_join.1000.b:0 "Combattre est futile. Partons plutôt vers des terres plus fertiles !"
    giga_blokkat_join.1000.b.tooltip:0 "§RÀ venir dans une future mise à jour !§!"

    giga_blokkat_join.1000.c:0 "Nous devons... non, nous devons §Rles rejoindre.§!"
    giga_blokkat_join.1000.c.tooltip:0 "Le §YBureau de recherche Blokkat§! se concentrera sur la tentative de §Ycontacter les Blokkats§! et de négocier une sorte d'alliance avec eux, si une telle chose est même possible... Après tout, détruire leur Vester ne ferait sûrement que les inciter à envoyer des renforts encore plus grands et nous anéantir, alors pourquoi combattre ?\n\n§RNotre population, notre direction et la galaxie dans son ensemble N'AIMERONT PAS ce choix au début. Il y aura des conséquences négatives.§!\n\n§BCette ligne d'action se concentrera fortement sur la recherche scientifique.§!"

    giga_blokkat_join.1001.name:0 "Rejoindre les Blokkats ?"
    giga_blokkat_join.1001.desc:0 "Et ainsi, contre toute attente, il a été décidé que notre empire tenterait de négocier avec ces envahisseurs extragalactiques et potentiellement même rejoindre leur camp. Mais la seule question qui reste est... comment ? Bien que les Blokkats soient très clairement capables de raisonnement, ils voient actuellement notre civilisation comme guère plus que des fluctuations aléatoires dans les niveaux d'énergie de la galaxie, comme nos scientifiques les plus intelligents percevraient un simple insecte.\n\nHeureusement, les partisans de l'idée travaillant pour notre §YBureau de recherche Blokkat§! ont déjà élaboré plusieurs théories sur la façon d'attirer l'attention des Blokkats. En l'état, toutes les transmissions aux Blokkats sont faites en utilisant nos propres méthodes de cryptage, que les Blokkats traduisent ensuite par des moyens inconnaissables en quelque chose qu'ils peuvent comprendre.\n\nNos scientifiques croient que si nous pouvions comprendre et décrypter n'importe quelle langue que les Blokkats utilisent pour leurs propres communications, et ensuite envoyer un message haute puissance contenant nos intentions au §YBlokkat-Vester§!, nous pourrions leur montrer que nous sommes, en fait, capables de pensée à leur niveau.\n\nUn §Bprojet de recherche Blokkat§! pour décrypter la langue Blokkat a ainsi été établi au §YBureau de recherche Blokkat§!."
    giga_blokkat_join.1001.a:0 "Il y a beaucoup à faire."
    giga_blokkat_join.1001.a.tooltip:0 "Un nouveau §Bprojet de recherche Blokkat§! est maintenant disponible au §YBureau de recherche Blokkat§!.\n\nComme les Blokkats se soucient actuellement très peu de nous, nous nous attendons à ce que détruire certains de leurs vaisseaux soit une preuve supplémentaire de nos capacités, et donc il ne devrait y avoir aucun risque à le faire."

    giga_blokkat.3000.joinblokkats1:0 "Décrypter la §Ylangue Blokkat§! | §Y10§! $blokkat_knowledge$"
    giga_blokkat.3000.joinblokkats1.tooltip:0 "Afin de négocier avec les Blokkats, nous devons nous assurer d'être sur un pied d'égalité avec eux. Tenter de les contacter en utilisant nos propres langues résulte en un rejet, nous devons donc traduire et ensuite utiliser leur propre langue pour communiquer avec ces envahisseurs. Espérons que cela leur montrera que nous sommes capables de pensée supérieure tout comme eux.\n\n§YCela nous permettra de commencer à travailler sur les négociations avec les Blokkats. Les étapes suivantes du projet nécessiteront du $blokkat_knowledge$ supplémentaire.§!"

    giga_blokkat_join.2000.name:0 "Décrypter la §Ylangue Blokkat§!"
    giga_blokkat_join.2000.desc:0 "Avec nos récentes enquêtes sur le §YBlokkwork§!, nous avons pu en apprendre davantage sur la façon dont les Blokkats communiquent entre eux.\n\nLeurs réseaux de communication hyperdimensionnels utilisent une sorte de forme de « langage » basée sur l'énergie fortement cryptée, intriquée dans des dimensions supérieures quasi incompréhensibles, que tous les Blokkats sont capables de comprendre instantanément. Suite à un débat de nommage animé, notre §YBureau de recherche Blokkat§! a décidé de baptiser officiellement ce « langage » §GBlokkais§!, ce qui est, étonnamment, apparemment une traduction assez fidèle de ce que les Blokkats eux-mêmes l'appellent.\n\nBien que nous ayons fait des progrès dans la compréhension de ce « langage », l'utiliser réellement pour former un message cohérent est plus problématique. Il nous incombe donc de comprendre pleinement les subtilités du §GBlokkais§! et de trouver comment établir des communications appropriées avec les Blokkats."

    giga_blokkat_join.2000.a:0 "Mettons-nous au travail immédiatement."

    blokkat_blokkatese_title:0 "Nous permet de communiquer directement en §GBlokkais§!.\nSavoir Blokkat : §G+1§!"

    giga_tech_translate_blokkatese:0 "Linguistique hyperdimensionnelle"
    giga_tech_translate_blokkatese_desc:0 "La langue Blokkat repose sur un ensemble incroyablement complexe d'ondes d'énergie intriquées dans des dimensions supérieures, transmises à travers des distances intergalactiques par le Blokkwork. Réussir à vraiment comprendre cette langue nous permettrait sûrement d'établir des relations plus étroites avec ces êtres."

    giga_blokkat_join.2001.name:0 "Combien de Blokks un Blokkat peut-il Blokker ?"
    giga_blokkat_join.2001.desc:0 "Une partie du personnel du §YBureau de recherche Blokkat§! se tenait autour d'un appareil colossal dans une salle circulaire, une bonne partie de ses scientifiques refusant toujours de participer correctement à ce projet supposément stupide de contacter les Blokkats.\n\nL'appareil, l'un des ordinateurs les plus puissants jamais conçus par les §Y[ROOT.GetSpeciesNamePlural]§!, atteignait loin dans l'espace hyperdimensionnel et avait été construit dans un seul but : émuler la façon dont le Blokkwork comprend le §GBlokkais§!. Un message test devait être entré dans l'appareil, qui le traduirait ensuite en ce qui devrait être du Blokkais, le comparerait avec une « phrase » échantillon récupérée du Blokkwork, puis le décrypterait de nouveau dans notre propre langue, et si tout était correct, il devrait revenir identique.\n\nLe message test de référence du Bureau avait été §H« Combien de Blokks un Blokkat peut-il Blokker ? »§!, une phrase communément trouvée dans le Blokkwork qui souligne la difficulté inhérente à traduire correctement les langues conventionnelles en Blokkais d'une manière qui a du sens.\n\nMalheureusement pour eux, ils n'avaient rencontré que d'innombrables problèmes avec les protocoles de traduction, qui finissaient souvent par rendre la phrase insensée une fois traduite en Blokkais. Les exemples incluaient inviter le Blokkat en chef du Vester à un rendez-vous galant, exiger de visiter la génitrice femelle d'un Blokkat (un échec rendu d'autant plus hilarant par le fait que les Blokkats ne possèdent pas le concept de genre, ni le concept de géniteur, d'ailleurs), ou carrément tomber dans des boucles de conversion de traduction récursives qui cassaient l'appareil plus de fois que les scientifiques ne pouvaient s'en souvenir.\n\nAvec peu d'attentes, le scientifique en chef entra la phrase et activa l'appareil, l'incitant à se mettre en marche et exécuter les protocoles de traduction, avant de retourner les résultats..."
    giga_blokkat_join.2001.a:0 "Notre glorieux avenir en dépend."

    giga_blokkat_join.2002.name:0 "Combien de Blokks un Blokkat peut-il Blokker ?, Partie II"
    giga_blokkat_join.2002.desc:0 "§H« Combien de Blokks un Blokkat peut-il Blokker ? »§!\n\nPour une phrase au son si ridicule de générer tant d'excitation était absolument du jamais vu, et pourtant les acclamations dans la salle étaient sans précédent dans l'histoire scientifique récente. En entendant les acclamations, certains des scientifiques qui avaient été réticents à contribuer ouvertement à toute cette entreprise décidèrent d'abandonner leurs croyances précédentes et de se joindre également.\n\nEt peut-être, juste peut-être, cette idée apparemment ridicule de contacter ces envahisseurs extragalactiques implacables n'était pas si ridicule que ça, après tout..."
    giga_blokkat_join.2002.a:0 "Il y a de l'espoir."

    giga_blokkat.3000.joinblokkats2:0 "Envoyer un message au §YBlokkwork§! | §Y20§! $blokkat_knowledge$ & §Y200000§! £energy£"
    giga_blokkat.3000.joinblokkats2.tooltip:0 "Maintenant que nous comprenons les subtilités du §GBlokkais§!, nous devrons mener des recherches supplémentaires sur le §YBlokkwork§! afin de trouver la meilleure façon de transmettre directement un message haute puissance au §YBlokkat-Vester§!.\n\n§YCela nous permettra de continuer à travailler sur les négociations avec les Blokkats. Les étapes suivantes du projet nécessiteront du $blokkat_knowledge$ supplémentaire.§!"

    giga_blokkat_join.2010.name:0 "Établir le contact"
    giga_blokkat_join.2010.desc:0 "Bien que nous puissions comprendre et communiquer en §GBlokkais§!, nous devons encore trouver comment transmettre directement notre message dans le §YBlokkwork§! au lieu de nous fier à des transmissions primitives visant au hasard le Blokkat-Vester en priant pour que les Blokkats se soucient suffisamment de répondre.\n\nC'est un fait connu que le Blokkwork est un ensemble d'ondes d'énergie imbriquées immensément complexes circulant à travers des dimensions supérieures, et en tant que tel, nous devrons investir lourdement dans la compréhension de son fonctionnement interne si nous voulons trouver un moyen d'envoyer la transmission."
    giga_blokkat_join.2010.a:0 "Pas de temps à perdre !"

    SEND_BLOKKAT_MESSAGE:0 "Contacter le Blokkat-Vester"
    SEND_BLOKKAT_MESSAGE_DESC:0 "Selon nos théories actuelles concernant les Blokkats, il devrait nous être possible de contacter directement le Blokkat-Vester à travers le Blokkwork, et d'envoyer nos demandes de diplomatie de cette façon. Bien que le coût énergétique soit certainement prohibitif, nous devrions déjà avoir cela de couvert."

    giga_blokkat_join.2011.name:0 "Le message"
    giga_blokkat_join.2011.desc:0 "Alors que des centaines de scientifiques et de linguistes travaillaient sans relâche pour pénétrer dans le §YBlokkwork§! et envoyer notre transmission au §YBlokkat-Vester§!, §Y[ROOT.GetRulerName]§!, entouré de diplomates et assis devant un grand écran, devenait de plus en plus nerveux.\n\nÉtait-ce une bonne idée ? Avaient-ils fait une erreur en cautionnant ce projet dérangé ? Les Blokkats ne se soucient évidemment pas de nous, seulement de maximiser leurs gains d'énergie. Pourquoi nous prêteraient-ils attention simplement parce que nous avons appris à parler leur langue ? S'ils voulaient nous parler, ils l'auraient fait avant, pensaient-ils. Tout cela valait-il les troubles publics massifs déclenchés par cette décision ?\n\nLes pensées du §Y[Root.GetRulerTitle]§! furent soudainement interrompues par une sorte de cri assourdissant résonnant à travers leur esprit, vraisemblablement le retour subspacial de la transmission immensément énergétique, car il avait fallu l'énergie d'une étoile entière rien que pour envoyer le message.\n\nAlors que le message partait, un lourd silence tomba sur la salle. Le message avait été soigneusement rédigé et revu par les meilleurs diplomates de §Y[ROOT.GetName]§! et énoncerait nos intentions de coopérer avec les Blokkats, et pourtant, les scientifiques ne pouvaient se défaire du sentiment malaisé que les Blokkats le considéreraient simplement comme leur équivalent de courrier indésirable.\n\nMais ils n'eurent pas beaucoup de temps pour réfléchir, car une autre vague subspaciale ondula à travers la salle, faisant s'illuminer soudainement le grand écran devant §Y[ROOT.GetRulerName]§! avec la silhouette géométrique des redoutables envahisseurs..."
    giga_blokkat_join.2011.a:0 "À l'écran."

    giga_blokkat_join.2012.name:0 "Les Blokkats"
    giga_blokkat_join.2012.desc:0 "§G(ÉTABLISSEMENT DES COMMUNICATIONS)\n(SONDAGE DES CONSCIENCES DES DESTINATAIRES)\n(ÉVALUATION : INTENTIONS SINCÈRES)§!\n\nSalutations, §Y[ROOT.GetSpeciesNamePlural]§!. Je suis §YBlokk Béhémoth§!, chargé d'administrer le démantèlement et la récolte subséquente de la §YGalaxie CE-1461§!.\n\nNous avons reçu votre transmission §YBlokkwork§! et je vous informe donc que, conformément au décret du §YBlokkouncile§!, pour que des §Yprimitifs baryoniques§! tels que vous soient élevés dans le giron de la civilisation Blokkat, votre espèce doit atteindre un certain seuil d'efficacité qui garantira que, à long terme, votre ajout au collectif compensera la perte d'énergie causée par votre ascension.\n\nSi vous souhaitez tenter d'atteindre ce seuil, informez-nous immédiatement, et nous vous fournirons plusieurs tests, connus sous le nom de §YBlokk-Protokols§!, qui détermineront mathématiquement si votre civilisation peut être autorisée à rejoindre nos opérations de récolte.\n\nLes §YBlokk-Protokols§!, si complétés avec succès, assureront également que vous mettiez en place l'infrastructure pour que nous puissions facilement élever votre civilisation avec une perte d'énergie minimale.\n\nSoyez conscients que nous n'§Rarrêterons pas§! nos opérations actuelles si vous acceptez, car démontrer une prouesse martiale suffisante pour repousser les vaisseaux démanteleurs civils standard est considéré comme une exigence obligatoire pour réussir les §YBlokk-Protokols§!.\n\nSi vous réussissez, vous serez §Ymis en charge§! des §Yopérations de récolte§! de la §YGalaxie CE-1461§! et chargés de récolter entièrement son énergie et de la transférer au §YBlokkonstrukt§!."

    giga_blokkat_join.2012.a:0 "Élevés dans la civilisation Blokkat... ?"
    giga_blokkat_join.2012.a.response:0 "Correct. En supposant que les §Y[ROOT.GetSpeciesNamePlural]§! réussissent les §YBlokk-Protokols§!, il n'y a guère d'intérêt à conserver vos formes baryoniques inefficaces.\n\nVos dirigeants et §Y[ROOT.GetRulerName]§! seront donc élevés et leurs consciences téléchargées dans le §YBlokkwork§!, leur permettant de devenir des §YBlokkats§! individuels.\n\nQuant à votre population, leurs consciences collectives seront amalgamées en consciences Blokkat beaucoup plus puissantes finement ajustées pour conserver les propriétés culturelles de votre civilisation et seront téléchargées dans le Blokkwork.\n\nNe vous inquiétez pas de la destruction de vos « âmes », car le processus de Blokkatification transfère également l'essence psionique du destinataire dans le Blokkwork, s'il y en a une."

    giga_blokkat_join.2012.a.synth:0 "Élevés dans la civilisation Blokkat... ?"
    giga_blokkat_join.2012.a.synth.response:0 "Correct. En supposant que les §Y[ROOT.GetSpeciesNamePlural]§! réussissent les §YBlokk-Protokols§!, il n'y a guère d'intérêt à conserver vos formes baryoniques inefficaces.\n\nVos dirigeants et §Y[ROOT.GetRulerName]§! seront donc élevés et leurs consciences téléchargées dans le §YBlokkwork§!, leur permettant de devenir des §YBlokkats§! individuels.\n\nQuant à votre population, leurs consciences collectives seront amalgamées en consciences Blokkat beaucoup plus puissantes finement ajustées pour conserver les propriétés culturelles de votre civilisation.\n\nNe vous inquiétez pas de la destruction de vos « âmes », car le §Yprocessus de Blokkatification§! transfère également l'essence psionique des destinataires dans le Blokkwork, s'il y en a une. Bien qu'il soit assez regrettable que votre essence psionique ait été principalement détruite pendant votre ascension synthétique, une nouvelle essence peut être fabriquée si nécessaire."

    giga_blokkat_join.2012.a.synthdeath:0 "Attendez, notre ascension était... un suicide ?"
    giga_blokkat_join.2012.a.synthdeath.response:0 "Que ce soit ou non un « suicide » n'est qu'un problème de sémantique. Selon votre définition de la conscience et de soi, cela pourrait ne faire aucune différence, mais ce que votre espèce appelle les « âmes » est en effet réel.\nRejeter les psioniques comme de la magie impossible est un comportement particulier et incompréhensible couramment trouvé chez de nombreuses civilisations matérialistes, qui tend à avoir des effets secondaires très malheureux."

    giga_blokkat_join.2012.b:0 "Quelqu'un d'autre a-t-il déjà réussi ?"
    giga_blokkat_join.2012.b.response:0 "Seules 7 civilisations ont réussi à passer les §YBlokk-Protokols§! dans le passé jusqu'à présent. Elles font maintenant partie du collectif Blokkat et aident à accélérer nos opérations de récolte de manière splendide."

    giga_blokkat_join.2012.c:0 "Qu'est-ce que le Blokkonstrukt ?"
    giga_blokkat_join.2012.c.response:0 "Toute l'énergie rassemblée est relocalisée vers le §YBlokkonstrukt§!, un projet de giga-ingénierie colossal visant à condenser l'intégralité de l'univers en une seule structure pour combattre la §YMort thermique§! et assurer notre survie éternelle.\n\nIl sert de centre de population central de notre civilisation, de plaque tournante logistique et de coeur du §YBlokkwork§!.\n\nSi vous réussissez les §YBlokk-Protokols§!, votre population serait éventuellement relocalisée vers le §YBlokkonstrukt§! une fois que la §YGalaxie CE-1461§! aura été entièrement récoltée.\n\nLe Blokkonstrukt détient actuellement environ §Y1 %§! de l'énergie de votre univers observable et devrait croître exponentiellement à mesure que les taux de récolte augmentent."

    giga_blokkat_join.2012.f:0 "Que devrons-nous faire pour réussir les §YBlokk-Protokols§!, exactement ?"
    giga_blokkat_join.2012.f.response:0 "Les Blokk-Protokols comportent trois étapes majeures.\n\nPremièrement, vous serez chargés de compléter les §EÉquations Blokkiliennes§!, un ensemble d'équations englobant les principes sous-jacents de nos technologies.\n\nUne fois celles-ci complétées, votre civilisation devra rechercher et construire des §HNœuds d'alimentation du Blokkwork§! spécialisés sur tous vos mondes, ce qui mettra en place l'infrastructure requise pour l'ascension.\n\nEnfin, nous vous fournirons les schémas d'un §PPylône du Blokkwork§!, une mégastructure colossale qui connectera entièrement votre civilisation au §YBlokkwork§! et permettra votre intégration complète dans le collectif, après quoi vous ferez partie de notre civilisation et prendrez le contrôle des §Yopérations de récolte§! de la §YGalaxie CE-1461§!.\n\nAfin d'activer le §PPylône du Blokkwork§!, couvrir les coûts du §Yprocessus de Blokkatification§!, et prouver votre efficacité, vous devrez rassembler §Y[blokkat_country.blokkat_ascension_cost]§! £energy£. Les §YBlokk-Protokols§! vous fourniront la technologie nécessaire pour stocker une si grande quantité d'énergie."

    giga_blokkat_join.2012.d:0 "§GTrès bien. Nous acceptons.§!"
    giga_blokkat_join.2012.d.tooltip:0 "Les Blokkats nous soumettront les §YBlokk-Protokols§!.\n\n§RIl n'y a plus de retour en arrière maintenant. La galaxie pourrait nous haïr pour cela. Mais nous deviendrons quelque chose de plus grand.§!"
    giga_blokkat_join.2012.d.response:0 "Excellent. Nous soumettrons les §YBlokk-Protokols§! à votre civilisation immédiatement."

    giga_blokkat_join.2012.e:0 "§RC'est de la folie ! DE LA FOLIE ! Oubliez ça !§!"
    giga_blokkat_join.2012.e.tooltip:0 "Nous reviendrons à l'idée de construire le §YDéstabilisateur hyperdimensionnel§! pour combattre le §YBlokkat-Vester§!. Le §YBureau de recherche Blokkat§! gagnera de nouveaux §Bprojets de recherche Blokkat§! et les effets de la §GDisposition Blokkat§! parmi notre population et nos dirigeants s'atténueront."
    giga_blokkat_join.2012.e.response:0 "Regrettable"

    giga_blokkat_join.2013.name:0 "Les §YBlokk-Protokols§!"
    giga_blokkat_join.2013.desc:0 "Et ainsi, nous avons officiellement décidé de nous embarquer dans un grand voyage pour prouver aux Blokkats que notre civilisation est digne de rejoindre leur collectif.\n\nSuite au dialogue avec §YBlokk Béhémoth§!, les Blokkats nous ont envoyé notre premier « défi », quelque chose qu'ils appellent les §EÉquations Blokkiliennes§!, un ensemble de formules mathématiques extrêmement complexes décrivant les aspects fondamentaux de la civilisation Blokkat et de son infrastructure, en particulier le §YBlokkwork§!.\n\nLa version qu'ils nous ont envoyée est incomplète, et §YBlokk Béhémoth§! a demandé que nous comprenions ces équations par nous-mêmes et les complétions avant de faire un rapport aux Blokkats.\n\nCela devrait, selon eux, nous permettre de pleinement comprendre et assimiler la complexité pure de la technologie Blokkat afin de garantir que notre éventuelle ascension dans leur collectif se passe aussi bien que possible.\n\nConsidérant que §YBlokk Béhémoth§! a déclaré que nous devrions rassembler §Y[blokkat_country.blokkat_ascension_cost]§! £energy£ pour compléter les §YBlokk-Protokols§!, il serait sage de commencer à investir dans l'infrastructure de génération d'énergie maintenant."
    giga_blokkat_join.2013.a:0 "Noté."
    giga_blokkat_join.2013.a.tooltip:0 "§G+5 %§! §BDisposition scientifique§!\n§G+5 %§! §PDisposition militaire§!\n§G+10 %§! §HDisposition gouvernementale§!\n§G+10 %§! §MDisposition de la population§!\n\nUn nouveau §Bprojet de recherche Blokkat§! est maintenant disponible au §YBureau de recherche Blokkat§!."

    giga_blokkat.3000.joinblokkats3:0 "Résoudre les §EÉquations Blokkiliennes§! | §Y30§! $blokkat_knowledge$"
    giga_blokkat.3000.joinblokkats3.tooltip:0 "Les Blokkats nous ont envoyé des versions incomplètes de leurs §EÉquations Blokkiliennes§!, un ensemble d'équations complexes décrivant les principes fondamentaux de la plupart de leurs technologies. Il est primordial que nous les résolvions afin de prouver que nous sommes pleinement capables de comprendre comment leur civilisation fonctionne.\n\n§YCela nous rapprochera de la réussite des Blokk-Protokols. Les étapes suivantes du projet nécessiteront du $blokkat_knowledge$ supplémentaire.§!"

    giga_blokkat_join.2020.name:0 "§YBlokk-Protokols§! - Les §EÉquations Blokkiliennes§!"
    giga_blokkat_join.2020.desc:0 "Les §EÉquations Blokkiliennes§! comprennent trois ensembles de formules mathématiques complexes décrivant les principes sous-jacents de la §BPrimauté énergétique Blokkat§!, de la §GLogistique intergalactique Blokkat§!, et de la §HGénération de particules à l'échelle de Planck Blokkat§!, qui toutes reposent fortement sur la manipulation de l'espace hyperdimensionnel.\n\nRésoudre ces équations améliorera non seulement drastiquement notre compréhension de l'univers, mais montrera indubitablement aux Blokkats nos capacités et les convaincra espérons-le que nous sommes dignes de réussir leurs §YBlokk-Protokols§!.\n\nComme ces équations sont extrêmement complexes et reposent sur plusieurs principes mathématiques mal compris, le §YBureau de recherche Blokkat§! a conçu le bâtiment coûteux §YInstallation de recherche Protokol§! à construire sur nos mondes, qui drainera une partie de notre recherche ainsi que de l'énergie et des ressources rares, mais augmentera en retour notre vitesse de recherche §YBlokkats§!."
    giga_blokkat_join.2020.a:0 "Compris. Commencez le travail immédiatement."

    giga_blokkat_join.2020.a.tooltip:0 "Nous gagnons la capacité de construire l'§YInstallation de recherche Protokol§! sur nos mondes, ce qui accélérera notre vitesse de recherche §YBlokkats§! pour les §EÉquations Blokkiliennes§! ainsi que les étapes suivantes des §YBlokk-Protokols§!.\n\n$cant_do_another_blokkat_project_tech_tooltip$"

    blokkatsprotocols:0 "Blokk-Protokols"
    blokkatsprotocols_desc:0 "Les défis apportés par les Blokk-Protokols sont sans précédent pour notre civilisation. Nous devons intensifier nos efforts de recherche si nous voulons les surmonter."

    giga_tech_blokkat_energy_transfer:0 "§EÉquations Blokkiliennes§! - §BPrimauté énergétique§!"
    giga_tech_blokkat_energy_transfer_desc:0 "Les Blokkats ont depuis longtemps converti leurs technologies pour qu'elles soient basées sur l'aspect le plus fondamental de l'univers : l'énergie. Ils utilisent le Blokkwork pour transférer de vastes quantités d'énergie sur de grandes distances et ensuite façonner cette énergie en tout ce dont ils peuvent avoir besoin. Comprendre comment baser une civilisation entière sur la ressource la plus basique de l'univers est primordial pour résoudre les §EÉquations Blokkiliennes§!."
    blokkat_protocols_physics_title:0 "Savoir Blokkat : §G+2§!"

    giga_tech_blokkat_intergalactic_logistics:0 "§EÉquations Blokkiliennes§! - §GLogistique intergalactique§!"
    giga_tech_blokkat_intergalactic_logistics_desc:0 "Comment coordonner correctement des opérations de récolte réparties sur une portion significative de l'univers observable impliquant la masse-énergie de plusieurs galaxies expédiées à travers des distances intergalactiques ? Quand on dirige une opération aussi grande que celle des Blokkats, l'inefficacité est simplement inacceptable et la logistique doit donc être raffinée à la perfection."
    blokkat_protocols_society_title:0 "Savoir Blokkat : §G+2§!"

    giga_tech_blokkat_subplanck_engineering:0 "§EÉquations Blokkiliennes§! - §HGénération de particules à l'échelle de Planck§!"
    giga_tech_blokkat_subplanck_engineering_desc:0 "C'est un fait connu que les Blokkats ne comptent plus sur la matière baryonique pour fonctionner, utilisant plutôt l'énergie brute pour créer de nouveaux types de particules élémentaires mieux adaptées à leurs opérations. Ces particules peuvent ainsi être extrêmement petites et permettre à leurs appareils d'être beaucoup, beaucoup plus denses que ceux construits avec des particules conventionnelles. Si nous voulons comprendre comment ils ont accompli un tel exploit, nous devons étudier comment les Blokkats utilisent le Blokkwork pour générer spontanément des particules capables de projeter leur volonté jusqu'à l'échelle de Planck."
    blokkat_protocols_engineering_title:0 "Savoir Blokkat : §G+2§!"

    needs_engineering_blokkat_project:0 "Nous devons avoir complété le §Bprojet de recherche Blokkat§! §HIngénierie des matériaux§! §YEnquêter sur les Blokkats§!."

    building_giga_blokkat_hyperdimensional_research:0 "Installation de recherche Protokol"
    building_giga_blokkat_hyperdimensional_research_desc:0 "Dans les installations de recherche colossales de ce bâtiment, l'élite intellectuelle de notre nation travaille sans relâche pour surmonter les défis que nous imposent les Blokk-Protokols."

    mod_category_blokkatsprotocols_research_speed_mult:0 "Vitesse de recherche Blokk-Protokols"

    giga_blokkat_join.2022.name:0 "§EÉquations Blokkiliennes§! entièrement résolues"
    giga_blokkat_join.2022.desc:0 "Enfin ! Les esprits les plus brillants de notre nation ont finalement réussi à assembler les dernières parties manquantes des §EÉquations Blokkiliennes§!, nous fournissant une nouvelle compréhension des technologies des Blokkats.\n\nC'est seulement maintenant que nous réalisons vraiment à quel point l'échelle et la portée de leurs opérations de récolte sont ahurissantes. Des galaxies entières de masse-énergie sont constamment expédiées à travers des distances intergalactiques pour alimenter la construction de ce qui est peut-être la plus grande mégastructure de l'univers.\n\nMaintenant nous voyons, nous voyons avec une clarté parfaite la beauté de tout cela. Un complexe industriel parfaitement orchestré construit pour délibérément démanteler l'univers tel que nous le connaissons et le remodeler en quelque chose de bien plus grand.\n\nC'est inspirant de penser que nous aussi, nous pourrions bientôt faire partie de ce grand effort qui surpasse de loin les conflits mesquins de notre minuscule galaxie. Déjà nos diplomates ont transmis les résultats des équations aux Blokkats et toute notre nation attend avec impatience leur réponse.\n\nVeuillez noter que les §YInstallations de recherche Protokol§! que nous avons construites seront toujours utiles pour les prochaines étapes des §YBlokk-Protokols§!."
    giga_blokkat_join.2022.a:0 "Bientôt, nous ne ferons qu'un !"
    giga_blokkat_join.2022.a.tooltip:0 "§G+10 %§! §BDisposition scientifique§!\n§G+5 %§! §PDisposition militaire§!\n§G+10 %§! §HDisposition gouvernementale§!\n§G+10 %§! §MDisposition de la population§!\n\nUn nouveau §Bprojet de recherche Blokkat§! est maintenant disponible au §YBureau de recherche Blokkat§!."

    giga_blokkat_join.2023.name:0 "Les Blokkats"
    giga_blokkat_join.2023.desc:0 "§G(ÉTABLISSEMENT DES COMMUNICATIONS)\n(SONDAGE DES CONSCIENCES DES DESTINATAIRES)\n(ÉVALUATION : INTENTIONS RESTENT SINCÈRES)§!\n\nSalutations, §Y[ROOT.GetSpeciesNamePlural]§!. Vous avez résolu et complété avec succès les §YÉquations Blokkiliennes§! que nous vous avions données, un exploit impressionnant étant donné votre niveau actuel de développement technologique.\n\nCela prouve effectivement que le potentiel intellectuel de votre civilisation est suffisamment élevé pour que nous envisagions d'incorporer votre nation dans le collectif Blokkat.\n\nÀ ce titre, nous vous fournirons maintenant les schémas d'un §HNœud d'alimentation du Blokkwork§!, que vous devrez comprendre et ensuite construire sur §Ychacun de vos mondes§!.\n\nCela ouvrira la voie à l'intégration de votre civilisation dans notre collectif en permettant au §YBlokkwork§! d'opérer sur vos mondes et en permettant à votre infrastructure de gérer la quantité pure d'énergie requise pour activer le §PPylône du Blokkwork§! et compléter le §Yprocessus de Blokkatification§!."
    giga_blokkat_join.2023.a:0 "Compris."
    giga_blokkat_join.2023.a.tooltip:0 "Un nouveau §Bprojet de recherche Blokkat§! est maintenant disponible au §YBureau de recherche Blokkat§!."

    giga_blokkat.3000.joinblokkats4:0 "Établir le réseau de §HNœuds d'alimentation du Blokkwork§! | §Y40§! $blokkat_knowledge$"
    giga_blokkat.3000.joinblokkats4.tooltip:0 "Les Blokkats nous ont maintenant envoyé des plans pour des constructions de §HNœuds d'alimentation du Blokkwork§! qui permettront à leur §YBlokkwork§! de se connecter à notre infrastructure planétaire.\n\n§YCela nous rapprochera de la réussite des Blokk-Protokols. Les étapes suivantes du projet nécessiteront du $blokkat_knowledge$ supplémentaire.§!"

    giga_tech_blokkat_blokkwork_power_node:0 "§HNœuds d'alimentation du Blokkwork§! - Connexion directe au Blokkwork"
    giga_tech_blokkat_blokkwork_power_node_desc:0 "Avec notre nouvelle compréhension de la technologie Blokkat accordée par les §EÉquations Blokkiliennes§!, nous sommes maintenant prêts à vraiment préparer notre ascension en établissant l'infrastructure nécessaire pour nous connecter au §YBlokkwork§!. Bien que ces nœuds d'alimentation ne nous permettent pas d'accéder à toute l'étendue du Blokkwork pour l'instant (car il n'est pas encore complètement établi sur notre galaxie), ils nous permettront néanmoins de grandement rationaliser nos opérations planétaires en générant notre propre Blokkwork à travers notre empire."

    building_giga_blokkat_blokkwork_node:0 "Nœud d'alimentation du Blokkwork"
    building_giga_blokkat_blokkwork_node_desc:0 "Ces constructions incroyablement complexes et tout aussi massives perforent l'espace hyperdimensionnel et connectent directement notre infrastructure planétaire à la pointe du §YBlokkwork§! dans notre galaxie, ouvrant la voie à une intégration plus poussée dans le collectif Blokkat. Bien que nous n'ayons pas encore un véritable accès au Blokkwork, car les Blokkats n'ont pas encore complètement étendu sa couverture à notre galaxie, ces bâtiments nous permettent de créer efficacement notre propre version miniature du Blokkwork, augmentant considérablement l'efficacité des opérations planétaires.\n\n§YAccorde §G+1 %§! §HDisposition de la population§! quand construit.§!"

    giga_blokkat_join.2030.name:0 "§YBlokk-Protokols§! - Les §HNœuds d'alimentation du Blokkwork§!"
    giga_blokkat_join.2030.desc:0 "Les §YBlokkats§! nous ont donné des plans pour des §HNœuds d'alimentation du Blokkwork§! complexes, capables d'atteindre directement le §YBlokkwork§! et d'établir une connexion stable avec lui.\n\nBien que les plans soient assez complets, nous devrons mener des recherches approfondies sur eux si nous voulons comprendre comment intégrer ces constructions béhémothes dans notre infrastructure planétaire.\n\nEnsuite, les §YBlokk-Protokols§! exigeront que nous construisions l'un de ces §HNœuds d'alimentation du Blokkwork§! sur §Ychacun de nos mondes possédés§! ce qui, selon les Blokkats, permettra l'intégration complète de notre civilisation dans le collectif Blokkat une fois que leur §PPylône du Blokkwork§! sera éventuellement construit et que le Blokkwork aura une couverture complète sur notre galaxie."
    giga_blokkat_join.2030.a:0 "Pas de temps à perdre !"
    giga_blokkat_join.2030.a.tooltip:0 "Nous devrons rechercher la §YTechnologie§! associée et compléter la construction des §HNœuds d'alimentation du Blokkwork§! avant de pouvoir entreprendre un autre §Bprojet de recherche Blokkat§!."

    giga_blokkat_join.2032.name:0 "Réseau de §HNœuds d'alimentation du Blokkwork§! complété"
    giga_blokkat_join.2032.desc:0 "Chacun de nos mondes a maintenant été amélioré avec un §HNœud d'alimentation du Blokkwork§! de pointe. Bien que pas encore vraiment connectés au vrai §YBlokkwork§!, la génération d'un Blokkwork miniature au sein de notre empire grâce à ces nœuds a grandement amélioré la coordination entre toutes les colonies et rapproché notre peuple.\n\nLes Blokkats semblent avoir remarqué que nous avons complété cette étape et ont envoyé une transmission directe à nos diplomates afin de discuter de l'étape finale des §YBlokk-Protokols§!."
    giga_blokkat_join.2032.a:0 "À l'écran."

    giga_blokkat_miniblokkwork:0 "Pseudo-Blokkwork"
    giga_blokkat_miniblokkwork_desc:0 "L'achèvement du réseau de §HNœuds d'alimentation du Blokkwork§! nous permet de créer efficacement notre propre « Pseudo-Blokkwork » pour améliorer la coordination entre tous les coins de notre empire."

    giga_blokkat_join.2033.name:0 "Les Blokkats"
    giga_blokkat_join.2033.desc:0 "§G(ÉTABLISSEMENT DES COMMUNICATIONS)\n(SONDAGE DES CONSCIENCES DES DESTINATAIRES)\n(ÉVALUATION : INTENTIONS SINCÈRES)§!\n\nLes relevés du Blokkwork indiquent que vous avez complété avec succès la construction d'un §HNœud d'alimentation du Blokkwork§! à travers votre civilisation, §Y[ROOT.GetSpeciesNamePlural]§!. Un grand accomplissement.\n\nMaintenant tout ce qui reste à faire est de construire le §PPylône du Blokkwork§! n'importe où dans votre espace. Cette grande mégastructure étendra complètement le Blokkwork à la §YGalaxie CE-1461§! et, une fois l'énergie nécessaire injectée, élèvera votre civilisation afin de permettre à votre espèce de ne faire qu'un avec le collectif Blokkat.\n\nNous recommandons de construire le §PPylône du Blokkwork§! près ou dans votre système capital pour une efficacité maximale du §Yprocessus de Blokkatification§!. N'oubliez pas que §Y[blokkat_country.blokkat_ascension_cost]§! £energy£ seront requis pour activer l'appareil une fois qu'il sera complet."
    giga_blokkat_join.2033.a:0 "Nous sommes si proches."
    giga_blokkat_join.2033.a.tooltip:0 "§G+5 %§! §BDisposition scientifique§!\n§G+5 %§! §PDisposition militaire§!\n§G+15 %§! §HDisposition gouvernementale§!\n§G+10 %§! §MDisposition de la population§!\n\nUn nouveau §Bprojet de recherche Blokkat§! est maintenant disponible au §YBureau de recherche Blokkat§!."

    giga_blokkat.3000.joinblokkats5:0 "Construire le §PPylône du Blokkwork§! | §Y50§! $blokkat_knowledge$"
    giga_blokkat.3000.joinblokkats5.tooltip:0 "L'avant-dernière étape de notre ascension est de construire un §PPylône du Blokkwork§! n'importe où dans notre empire pour projeter le Blokkwork sur notre galaxie. Les §HNœuds d'alimentation du Blokkwork§! devraient ensuite, selon les Blokkats, permettre l'ascension complète de notre civilisation dans le collectif Blokkat, bien que l'appareil nécessitera £energy£§Y[blokkat_country.blokkat_ascension_cost]§! pour être activé.\n\n§YCela nous rapprochera de la réussite des Blokk-Protokols. Les étapes suivantes du projet nécessiteront du $blokkat_knowledge$ supplémentaire.§!"

    giga_tech_blokkat_gigarelay_frame:0 "§PPylône du Blokkwork§! - Cadre hyperbranique"
    giga_tech_blokkat_gigarelay_frame_desc:0 "Le cadre du Pylône doit être une construction à 6 dimensions intriquée intégrée dans le tissu même de la réalité. Un tel degré de sophistication est requis si nous voulons amener toute la puissance du Blokkwork dans notre galaxie."

    giga_tech_blokkat_gigarelay_core:0 "§PPylône du Blokkwork§! - coeur d'alimentation dimensionnel"
    giga_tech_blokkat_gigarelay_core_desc:0 "Le coeur d'alimentation du Pylône fournira un lien direct avec le Blokkwork lui-même et permettra le flux d'énergie presque infinie du Blokkwork vers notre réseau de Nœuds d'alimentation du Blokkwork."

    giga_blokkat_join.2040.name:0 "§YBlokk-Protokols§! - Le §PPylône du Blokkwork§!"
    giga_blokkat_join.2040.desc:0 "Le §PPylône du Blokkwork§! sera la clé de voûte de notre grande ascension dans le collectif Blokkat. Une fois terminée, cette puissante machine étendra le §YBlokkwork§! pour vraiment couvrir notre galaxie entière et permettra aux Blokkats de commencer leur §Yprocessus de Blokkatification§!.\n\nCependant, pour l'instant nous ne pourrons construire que son §Ysite de construction§! et devrons rechercher les technologies associées afin d'assembler son §Ycadre hyperbranique§! puis son §Ycoeur d'alimentation dimensionnel§!. Une fois terminé, un §Bprojet de recherche Blokkat§! final pour activer l'appareil deviendra disponible, coûtant £energy£§Y[blokkat_country.blokkat_ascension_cost]§!.\n\nLes Blokkats ont déclaré que l'emplacement du Pylône deviendra l'emplacement central de notre civilisation après la fin de l'ascension, et en tant que tel nous devrions choisir son emplacement judicieusement, de préférence dans ou près de notre capital actuelle."
    giga_blokkat_join.2040.a:0 "Terriblement proche. La galaxie ne sera bientôt que poussière devant nous !"
    giga_blokkat_join.2040.a.tooltip:0 "Nous devrons compléter la construction du §PPylône du Blokkwork§! avant de pouvoir entreprendre un autre §Bprojet de recherche Blokkat§!."

    blokkat_gigarelay_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_blokkat$ - $giga_list_category_special$\nAmène une couverture complète du §YBlokkwork§! à la galaxie dans le cadre des §YBlokk-Protokols§!.\n§LUn appareil pour permettre la Blokkatification complète de notre civilisation.§!" #megalistentry BLOKKWORK GIGARELAY

    blokkat_gigarelay_0:0 "Site de construction du Pylône du Blokkwork"
    blokkat_gigarelay_0_DESC:0 "Le site de construction d'un grand appareil capable de connecter notre galaxie au Blokkwork lui-même."

    blokkat_gigarelay_1:0 "coeur d'alimentation du Pylône du Blokkwork"
    blokkat_gigarelay_1_DESC:0 "Intégré dans la réalité elle-même, le coeur d'alimentation fournit un ancrage solide pour assurer que le flux d'énergie du Blokkwork reste sous contrôle."

    blokkat_gigarelay_2:0 "Cadre hyperbranique du Pylône du Blokkwork"
    blokkat_gigarelay_2_DESC:0 "Avec l'ajout du cadre hyperbranique, le Pylône du Blokkwork est maintenant structurellement complet. Tout ce dont il a besoin maintenant est un afflux d'énergie suffisant."

    blokkat_gigarelay_3:0 "Pylône du Blokkwork"
    blokkat_gigarelay_3_DESC:0 "Le Pylône du Blokkwork a été activé, établissant une puissante connexion au Blokkwork dans cette galaxie."

    blokkat_gigarelay_frame_title:0 "§HDébloque la mégastructure :§! Cadre hyperbranique du Pylône"
    blokkat_gigarelay_core_title:0 "§HDébloque la mégastructure :§! coeur d'alimentation dimensionnel du Pylône"

    giga_blokkat_join.2041.name:0 "Site de construction du Pylône du Blokkwork construit"
    giga_blokkat_join.2041.desc:0 "Le site de construction du §PPylône du Blokkwork§! a été complété dans le système §Y[giga_system.GetName]§!. Sur cet échafaudage, nous construirons le grand appareil qui, enfin, unira notre civilisation avec les Blokkats jusqu'à la fin des temps.\n\nIl y a beaucoup à faire."
    giga_blokkat_join.2041.a:0 "De plus en plus proche..."
    giga_blokkat_join.2041.a.tooltip:0 "§G+5 %§! §BDisposition scientifique§!\n§G+5 %§! §HDisposition gouvernementale§!"

    giga_blokkat_join.2042.name:0 "Cadre hyperbranique du Pylône du Blokkwork construit"
    giga_blokkat_join.2042.desc:0 "Le cadre hyperbranique du §PPylône du Blokkwork§! a été construit. Cette merveille mégastructurelle soigneusement élaborée assurera que notre réalité est capable de gérer la quantité pure d'énergie injectée par le Blokkwork dans notre galaxie.\n\nMaintenant, tout ce qui reste est d'assembler le coeur d'alimentation de l'appareil et de l'activer, une fois pour toutes."
    giga_blokkat_join.2042.a:0 "Presque là maintenant."
    giga_blokkat_join.2042.a.tooltip:0 "§G+5 %§! §BDisposition scientifique§!\n§G+5 %§! §MDisposition de la population§!"

    giga_blokkat_join.2043.name:0 "Pylône du Blokkwork complété"
    giga_blokkat_join.2043.desc:0 "Avec l'ajout de son coeur d'alimentation hyperdimensionnel l'attachant au §YBlokkwork§! lui-même, le §PPylône du Blokkwork§! est maintenant complet.\n\nL'étape finale de notre grande entreprise pour rejoindre les Blokkats est maintenant d'activer l'appareil en utilisant £energy£§Y[blokkat_country.blokkat_ascension_cost]§!. Cela peut maintenant être fait via le §YBureau de recherche Blokkat§!, quand nous serons prêts."
    giga_blokkat_join.2043.a:0 "Juste une étape de plus."
    giga_blokkat_join.2043.a.tooltip:0 "§G+10 %§! §BDisposition scientifique§!\n§G+5 %§! §HDisposition gouvernementale§!\n§G+5 %§! §MDisposition de la population§!"

    blokkat_requires_60_knowledge:99 "Nous devons avoir au moins 60 $blokkat_knowledge$."

    giga_blokkat.3000.joinblokkats6:0 "Compléter les §YProtokols§! | §Y60§! $blokkat_knowledge$ & £energy£§Y[blokkat_country.blokkat_ascension_cost]"
    giga_blokkat.3000.joinblokkats6.tooltip:0 "Avec les §EÉquations Blokkiliennes§! résolues, un réseau de §HNœuds d'alimentation du Blokkwork§! opérationnel et le §PPylône du Blokkwork§! construit, tout est en place pour que nous complétions les §YBlokk-Protokols§! une fois pour toutes.\n\n§YNous rejoindrons les Blokkats, au détriment du reste de la galaxie.§!"

    giga_blokkat_join.2044.name:0 "Les Blokkats"
    giga_blokkat_join.2044.desc:0 "§G(ÉTABLISSEMENT DES COMMUNICATIONS)\n(SONDAGE DES CONSCIENCES DES DESTINATAIRES)\n(ÉVALUATION : PRÊT POUR LA BLOKKATIFICATION)§!\n\nFélicitations pour avoir complété le §PPylône du Blokkwork§!, §Y[ROOT.GetSpeciesNamePlural]§!. Tout ce qui vous reste à faire maintenant est d'y injecter les §Y[blokkat_country.blokkat_ascension_cost]§! £energy£ et les §YBlokk-Protokols§! seront complets.\n\nUne fois cela fait, les consciences et l'essence de vos §Ydirigeants§! seront transférées dans le §YBlokkwork§! et on leur accordera des §Ychâssis Blokkat§!. L'essence de vos populations sera amalgamée en une §Yessence Blokkat§! beaucoup plus puissante et téléchargée dans le §YBlokkwork§!.\n\nVous recevrez, comme indiqué précédemment, le contrôle total des opérations de récolte de la §YGalaxie CE-1461§! et serez §Ychargés de les compléter§!."
    giga_blokkat_join.2044.a:0 "Enfin ! Nous deviendrons bientôt quelque chose de bien plus grand."
    giga_blokkat_join.2044.a.tooltip:0 "Un nouveau §Bprojet de recherche Blokkat§! est maintenant disponible au §YBureau de recherche Blokkat§!."

    blokkat_bureau_fight_blokkats_desc:0 "Les §YExcavateurs Blokkats§! sont une menace existentielle pour toute la galaxie. Si nous voulons riposter contre eux, nous devons amasser autant de §Gsavoir Blokkat§! que possible.\n\nIl peut être acquis en §Yrecherchant des répétables spécifiques§!, en §Yaccomplissant diverses tâches§! et en §Yentreprenant des projets spéciaux§! chaque fois que nous en avons l'occasion.\n\nNotre objectif principal est d'accumuler suffisamment de §Gsavoir Blokkat§! pour concevoir le §YDéstabilisateur hyperdimensionnel§!, une §Ygigastructure§! théoriquement capable d'abaisser le bouclier du §YBlokkat-Vester§!. Il pourrait être sage d'investir rapidement dans des installations de recherche."

    blokkat_bureau_join_blokkats_desc:0 "Les §YExcavateurs Blokkats§! sont magnifiques et fascinants. Pourquoi les combattre quand nous pouvons nous efforcer de les rejoindre dans leur quête pour remodeler l'univers vers la perfection ? Si nous voulons le faire, nous devrons amasser autant de §Gsavoir Blokkat§! que possible.\n\nIl peut être acquis en §Yrecherchant des répétables spécifiques§!, en §Yaccomplissant diverses tâches§! et en §Yentreprenant des projets spéciaux§! chaque fois que nous en avons l'occasion.\n\nNotre objectif principal est d'accumuler suffisamment de §Gsavoir Blokkat§! pour trouver comment potentiellement rejoindre les Blokkats dans leurs entreprises. Il pourrait être sage d'investir rapidement dans des installations de recherche."

    blokkat_bureau_knowledge_fight_blokkats_desc:0 "Le §Gsavoir Blokkat§! est la somme de nos connaissances combinées concernant les Blokkats et leur technologie. Rassembler autant de savoir que possible est crucial si nous souhaitons riposter contre le §YBlokkat-Vester§! et son bouclier."

    blokkat_bureau_knowledge_join_blokkats_desc:0 "Le §Gsavoir Blokkat§! est la somme de nos connaissances combinées concernant les Blokkats et leur technologie. Rassembler autant de savoir que possible est crucial si nous souhaitons trouver un moyen de rejoindre les Blokkats dans leur grande entreprise de remodelage de l'univers."

    giga_blokkat_mothership_player:0 "Blokkat-Vester"
    giga_blokkat_mothership_player_desc:0 "Blokkat-Vesters"

    BLOKKAT_MOTHERSHIP_PLAYER:0 "Noyau"

    giga_blokkat_join.5000.name:0 "Réticence Blokkat"
    giga_blokkat_join.5000.desc:0 "« Le gouvernement choisit de s'allier avec des envahisseurs omnicides », « [ROOT.GetRulerName] est-il un infiltré Blokkat ? », « Les scientifiques du Bureau de recherche Blokkat deviennent fous de pouvoir » et des centaines d'autres critiques similaires attaquant notre décision concernant les Blokkats ont pris d'assaut les gros titres sur §Y[ROOT.capital_scope.GetName]§! et dans le reste de §Y[ROOT.GetName]§!.\n\nComme on pouvait s'y attendre, notre population est à la fois choquée et mécontente de notre décision d'apparemment essayer de rejoindre les envahisseurs extragalactiques qui dévorent actuellement notre galaxie entière sans égard pour ses habitants.\n\nDéjà, des manifestations de masse ont lieu sur la plupart de nos mondes et presque toutes les strates de notre société sont en émoi complet suite à l'annonce de notre décision. Il est donc évident que nous devrons entreprendre des efforts considérables si nous voulons convaincre notre population et notre direction que rejoindre les Blokkats est évidemment la bonne chose à faire.\n\nL'acceptation de notre plan par notre population, appelée §GDisposition Blokkat§!, va causer des §Rpénalités sévères§! à notre empire tant qu'elle reste basse. Elle est divisée entre §PDisposition militaire§!, §BDisposition scientifique§!, §HDisposition gouvernementale§! et §MDisposition de la population§!, représentant l'opinion de chaque partie de notre empire, dont la moyenne donne la §GDisposition globale§!.\n\nNous pourrons surveiller la §GDisposition Blokkat§! via le §YBureau de recherche Blokkat§!."
    giga_blokkat_join.5000.a:0 "Nous prouverons que ces imbéciles ont tort !"
    giga_blokkat_join.5000.a.tooltip:0 "La §GDisposition Blokkat§! est maintenant active et impactera sérieusement notre empire jusqu'à ce qu'elle soit résolue.\n\nNous pouvons suivre les différentes valeurs de la §GDisposition Blokkat§! en utilisant le bouton « Gérer Disp. » au-dessus du §YBureau de renseignement Blokkat§!.\n\nDes §GÉdits de disposition§! peuvent être promulgués pour gérer une disposition basse.\nNous pouvons également la visualiser via un édit si le bouton ne s'affiche pas."

    giga_blokkat_join.5001.name:0 "Les dirigeants entament des manifestations de masse !"
    giga_blokkat_join.5001.desc:0 "Tout comme notre population générale, certains des esprits les plus brillants de notre empire ne veulent pas accepter notre choix de nous ranger du côté des Blokkats et ont par conséquent décidé d'entamer des protestations prolongées.\n\nCes dissidents, refusant de s'engager pleinement dans leurs fonctions pour exprimer leur mécontentement envers nos plans, ont déclaré que seul le renversement complet de ce « plan stupide » assurerait leur retour à la loyauté.\n\nÉvidemment, nous pourrions simplement renvoyer ces esprits faibles, ou tenter de les convaincre en dépensant de l'§Yunité§! et de l'§Yinfluence§! sur une base individuelle via l'onglet disposition du §YBureau de recherche Blokkat§!. La direction du Bureau nous a assuré que, si notre plan commençait à montrer des signes de promesse, certains de ces dirigeants changeraient indubitablement d'avis et décideraient à nouveau de nous rejoindre, mais c'est, malheureusement, plus facile à dire qu'à faire..."
    giga_blokkat_join.5001.a:0 "Ils changeront d'avis... ou nous les y forcerons."
    giga_blokkat_join.5001.a.tooltip:0 "Environ §Y[ROOT.blokkat_willingness_leader_strike_percent] %§! de notre §Yréserve de dirigeants§! gagne le trait §YGrève anti-Blokkat§!, ce qui impactera sévèrement leur productivité. Le pourcentage de dirigeants protestataires est plus élevé si nous sommes §Yégalitaristes§!.\n\nCertains pourraient nous rejoindre à mesure que notre plan progresse, ou nous pouvons essayer de les convaincre via l'onglet disposition du §YBureau de recherche Blokkat§!."

    giga_blokkat_join.5500.willingness_global_count:0 "§GDisposition Blokkat globale§! : §Y[ROOT.blokkat_willingness_global_value] %§!"
    giga_blokkat_join.5500.willingness_military_count:0 "§PDisposition militaire§! : §Y[ROOT.blokkat_willingness_military_value] %§!"
    giga_blokkat_join.5500.willingness_science_count:0 "§BDisposition scientifique§! : §Y[ROOT.blokkat_willingness_science_value] %§!"
    giga_blokkat_join.5500.willingness_government_count:0 "§HDisposition gouvernementale§! : §Y[ROOT.blokkat_willingness_government_value] %§!"
    giga_blokkat_join.5500.willingness_population_count:0 "§MDisposition de la population§! : §Y[ROOT.blokkat_willingness_population_value] %§!"

    blokkat_military_willingness_desc:0 "§GAugmentée par :§!\nTuer des §Yvaisseaux Blokkats§! & capturer des §YBlokkats§!\nRechercher des §Ycomposants Blokkats§!\n§RDiminuée par :§!\nPerdre des §Yvaisseaux de guerre célestes§!/§YHerculéens§! contre les Blokkats"
    giga_blokkat_join.5500.willingness_military_count.tooltip:0 "Capturer un §YBlokkat solitaire§! : §G+3,5 %§!\nDétruire un §YBlokk-Expulseur§! : §G+0,02 %§!\nDétruire un §YBlokk-Gardien§! : §G+0,06 %§!\nDétruire un §YBlokk-Démantèleur§! : §G+10 %§!\nDétruire un §YBlokk-Terminateur§! : §G+20 %§!\nRechercher n'importe quel §Ycomposant Blokkat§! : §G+2,5 %§!\nPerdre une §Ylune de combat§! : §R-0,1 %§!\nPerdre un §Yplanétovaisseau béhémoth§! : §R-0,5 %§!\nPerdre un §Yvaisseau-système stellaire§! : §R-2,5 %§!\nPerdre un §YHerculéen§! : §R-5 %§!"

    blokkat_science_willingness_desc:0 "§GAugmentée par :§!\nRechercher des §Ytechs Blokkats§!\nÉtudier des §YBlokkats captifs§!"
    giga_blokkat_join.5500.willingness_science_count.tooltip:0 "Rechercher n'importe quelle §Ytech Blokkat§! : §G+1,5 %§!\nÉtudier un §YBlokkat captif§! une fois : §G+2 %§!"

    blokkat_population_willingness_desc:0 "§GAugmentée par :§!\nConstruire des §Ynœuds d'alimentation du Blokkwork§!\n§RDiminuée par :§!\nPerdre des §Yplanètes§! contre les Blokkats"
    giga_blokkat_join.5500.willingness_population_count.tooltip:0 "Construire un §Ynœud d'alimentation du Blokkwork§! : §G+1 %§!\nPerdre §Y1 pop§! contre les Blokkats : §R-0,05 %§!"

    blokkat_government_willingness_desc:0 "§GAugmentée par :§!\nReprogrammer des §YBlokkats captifs§!\n§RDiminuée par :§!\nPerdre des §Yplanètes§! contre les Blokkats"
    giga_blokkat_join.5500.willingness_government_count.tooltip:0 "Reprogrammer un §YBlokkat captif§! : §G+5 %§!\nPerdre §Y1 pop§! contre les Blokkats : §R-0,05 %§!"

    giga_contact_blokkats_willingness_tooltip:0 "Gérer la §GDisposition Blokkat§!..."
    giga_blokkat_join.5500.a:0 "Quitter."

    giga_blokkat_join.5500.name:0 "Disposition Blokkat"
    giga_blokkat_join.5500.desc:0 "La §GDisposition Blokkat§! représente à quel point notre population est disposée à mettre en œuvre notre plan de négocier et possiblement rejoindre les Blokkats, divisée entre notre §PMilitaire§!, §BDépartement scientifique§!, §HGouvernement§! et §MPopulation§!, la §GDisposition Blokkat globale§! étant la moyenne des 4. Commençant à §Y0 %§!, elle causera de sévères §Rpénalités§!, mais si elle atteint §Y100 %§!, l'impact sera annulé. Elle commencera à accorder des §Gbonus§! si elle dépasse §Y100 %§! et peut aussi devenir négative, augmentant encore les pénalités. Plusieurs §Yédits§! et §Ydécisions§! peuvent être utilisés pour augmenter tous les types de disposition en plus des méthodes décrites ci-dessous.\n§BSurvole une valeur de disposition pour voir les valeurs exactes concernant le gain de disposition. Clique sur une pour rafraîchir les valeurs."

    giga_blokkat_blokkat_willingness_global:0 "Disposition Blokkat globale"
    giga_blokkat_blokkat_willingness_global_desc:0 "La décision de nous ranger du côté des Blokkats a un impact profond sur notre civilisation."

    giga_blokkat_blokkat_willingness_science:0 "Disposition Blokkat scientifique"
    giga_blokkat_blokkat_willingness_science_desc:0 "La décision de nous ranger du côté des Blokkats a un impact profond sur notre civilisation."

    giga_blokkat_blokkat_willingness_military:0 "Disposition Blokkat militaire"
    giga_blokkat_blokkat_willingness_military_desc:0 "La décision de nous ranger du côté des Blokkats a un impact profond sur notre civilisation."

