    giga_blokkat_join.5700.government:99 "Distribuer de la ferraille aux §HGouverneurs§! | §Y50§! £blokkat_scrap_icon£"
    giga_blokkat_join.5700.government.tooltip:99 "Augmentera la §HVolonté Gouvernementale§! de §G3 %§! à §G7 %§!. Plus susceptible d'augmenter davantage si nous sommes §YAutoritaires§!."
    giga_blokkat_join.5700.population:99 "Distribuer de la ferraille à la §MPopulation§! | §Y50§! £blokkat_scrap_icon£"
    giga_blokkat_join.5700.population.tooltip:99 "Augmentera la §MVolonté Populaire§! de §G3 %§! à §G7 %§!. Plus susceptible d'augmenter davantage si nous sommes §YAutoritaires§!."
