l_french:

    giga_core_black_hole_exists:99 "Le §YCoeur galactique§! nous est accessible, nous pouvons donc y sauter directement comme nous le ferions pour n'importe quel autre trou noir."

    giga_blokkat.3000.cosmovester:99 "Plonger dans le §GChat Block-Vester§! | §Y50§! $blokkat_knowledge$"
    giga_blokkat.3000.cosmovester.tooltip:99 "Le Chat Block-Vester semble avoir une sorte de singularité en son centre. Peut-être... juste peut-être, l'Aiguille d'Horizon pourrait nous y emmener, bien que nous aurons besoin de beaucoup de §GConnaissance des Chats Blocks§! si nous voulons contourner le Rempart hyperdimensionnel."

    crisis.7510.vester:99 "Le Chat Block-Vester a bien un trou noir en son sein, n'est-ce pas ?"
    crisis.7510.vester.tooltip:99 "Un §BProjet de recherche Chat Block§! audacieux pour plonger dans le Chat Block-Vester sera ajouté au §YBureau de recherche Chat Block§! pour §Y50§! §GConnaissance des Chats Blocks§!.\nCela §RDÉSACTIVERA§! l'utilisation du §YDéstabilisateur hyperdimensionnel§!."

    JUMP_INTO_BLOKKAT_VESTER:99 "Plonger dans le Chat Block-Vester"
    JUMP_INTO_BLOKKAT_VESTER_DESC:99 "Le Chat Block-Vester semble posséder une structure semblable à un trou noir en son centre, dans laquelle nous pourrions peut-être plonger. Nous devrons d'abord trouver un moyen de contourner le Déstabilisateur hyperdimensionnel en utilisant l'Aiguille d'Horizon."

    giga_blokkat.3340.name:99 "Plonger dans le Vester ?"
    giga_blokkat.3340.desc:99 "Le Chat Block-Vester semble posséder une structure semblable à un trou noir en son centre. Ainsi, les éléments les plus audacieux de notre bureau de recherche ont proposé que nous utilisions notre Aiguille d'Horizon pour tenter d'y plonger... pour le meilleur ou pour le pire.\n\nNous n'avons aucune idée de ce qui nous attend. Peut-être pourrons-nous détourner le Chat Block-Vester, ou même puiser dans les réserves d'énergie récoltées par les Chats Blocks... ou nous pourrions mourir instantanément. Les possibilités sont aussi infinies et incertaines qu'elles sont excitantes.\n\nCependant, si nous devons entreprendre un tel projet, nous devrons investir une quantité significative de ressources pour comprendre comment contourner le bouclier du Vester en utilisant notre Aiguille d'Horizon, sous peine de finir éclaboussés dessus comme un moucheron spatial sur la coque d'un vaisseau."
    giga_blokkat.3340.a:99 "Plus de retour en arrière maintenant."

    #Vester Cosmogenesis
    giga_blokkat.3341.name:99 "Dans la gueule du monstre"
    giga_blokkat.3341.desc:99 "À bord de l'Aiguille d'Horizon, toute notre civilisation se prépare à entrer dans le Chat Block-Vester, dans ce qui est peut-être le geste le plus audacieux de notre empire. Les systèmes sont vérifiés, les éditions sont prêtes et... le saut commence.\n\nLe vaisseau-mère Chat Block, de seulement quelques centaines de kilomètres de diamètre, apparaît en pleine vue, ses anneaux concentriques en rotation aussi merveilleux que terrifiants. Sans perdre de temps, l'Aiguille entreprend une série d'éditions rapides pour traverser l'indestructible Rempart hyperdimensionnel qui l'entoure. Le bouclier se reforme en quelques microsecondes, mais c'est tout ce qu'il nous faut pour le percer.\n\nEt nous y allons, dans la mystérieuse singularité au coeur de l'instrument de destruction des Chats Blocks, déclenchant édition après édition pour éviter l'incinération totale par la distorsion quasi infinie de l'espace-temps qui l'entoure..."
    giga_blokkat.3341.a:99 "Vers l'audace."


    #Welcome to the Blokkwork!
    giga_blokkat.3342.name:99 "L'autre côté de la Chat Blockfinité"
    giga_blokkat.3342.desc:99 "Contre toute attente, nous semblons être entrés dans le §YChat Blockwork§!. Des flux d'énergie infinis et continus entourent l'Aiguille, se déversant du Chat Block-Vester vers un emplacement central inconnu dans l'espace intergalactique.\n\nEt ce n'est pas le seul. Des centaines... non, des milliers, des dizaines de milliers même, de tels flux d'énergie sont entrelacés ici, provenant tous d'innombrables Chat Block-Vesters qui démantèlent supposément de nombreuses galaxies.\n\nCurieusement, en plus des flux provenant des Vesters, il semble y avoir une myriade d'autres flux se dirigeant vers des zones vides de l'espace intergalactique, comme s'ils alimentaient une opération Chat Block massive au milieu de nulle part.\n\nMais nos observations sont interrompues par la claire réalisation que nous ne sommes pas les bienvenus ici. Le Chat Blockwork, étant conçu pour canaliser l'énergie, n'est pas clément envers notre amas de matière solide. Il arrache l'Aiguille dans une tentative de la réduire à néant, notre civilisation maintenue en vie par des trillions d'éditions effectuées chaque seconde.\n\nIl est trop tard pour revenir en arrière, mais nous devons agir avec hâte car l'Aiguille ne peut pas soutenir cela éternellement. Un choix doit être fait pour sortir de cet enfer : devrions-nous nous diriger vers ce qui semble être le centre du Chat Blockwork, ou tenter de nous échapper ailleurs ?"
    giga_blokkat.3342.a:99 "Nous nous dirigerons vers la source de tout cela !"
    giga_blokkat.3342.b:99 "Nous devons quitter cet endroit maudit !"


    #To the Blokkonstrukt

    #To intergalactic space - you pop out near the GIF
    giga_blokkat.3343.name:99 "Évasion intrépide"
    giga_blokkat.3343.desc:99 "Avec hâte, nous tentons de nous éloigner de l'emplacement central et dépensons plutôt les dernières capacités de l'Aiguille pour foncer à travers le Chat Blockwork vers les flux d'énergie déversés dans l'espace intergalactique. Quelques instants avant que l'Aiguille ne soit pratiquement anéantie, nous émergeons de la poêle métaphorique... pour tomber dans le feu.\n\nNous sommes recrachés au milieu d'une bataille spatiale aux proportions gargantuesque dans le vide intergalactique ! Une immense flotte Chat Block capable de faire exploser notre galaxie mille fois, composée de dizaines de milliers de vaisseaux bien plus grands que tout ce que nous avons rencontré, se bat contre une autre flotte composée de vaisseaux élancés inconnus alimentés par une sorte de singularité en leur centre.\n\nEt, d'une certaine manière, nous semblons avoir un impact. La flotte Chat Block se fige pendant quelques précieuses nanosecondes alors qu'elle traite notre vaisseau émergeant de leur propre réseau d'énergie. Cela donne à leurs adversaires inconnus un temps précieux pour tirer une salve brisant l'espace-temps, surchargeant les vaisseaux Chat Block et en faisant exploser certains avec une fureur jamais vue tandis que d'autres se retirent dans les profondeurs de l'espace.\n\nAlors que les Chats Blocks disparaissent de la détection, les vaisseaux élancés se tournent vers nous et semblent traiter quelque chose un moment, jusqu'à ce que nous recevions une transmission provenant de l'un d'eux. Ils nous hèlent !"
    giga_blokkat.3343.a:99 "À... l'écran."

    giga_blokkat.33441.name:99 "???"
    giga_blokkat.33441.desc:99 "§HLes vaisseaux semblent transférer des informations directement dans nos consciences... leur technologie est clairement bien au-delà de la nôtre. Un bourdonnement sourd se fait entendre à travers l'Aiguille. Ils semblent nous scanner.§!\n\n...venez-vous de voyager à travers le Chat Blockwork ? Stupéfiant ! Merveilleux ! Absolument incroyable ! Nous avons vu... de nombreux primitifs monogalactiques comme vous tenter de tels exploits avec divers appareils, mais voir un véritable vaisseau non-Chat Block quelque peu intact émerger de là est absolument inédit. Concevoir un vaisseau comme le vôtre avec un niveau technologique si bas est une ingéniosité remarquable."
    giga_blokkat.33441.a:99 "Qui ou qu'êtes-vous ?"

    giga_blokkat.3344.name:99 "La Grande Fédération intergalactique"
    giga_blokkat.3344.desc:99 "Ah, bien sûr. Vous... ne nous connaissez pas, oui. La §YGrande Fédération intergalactique§! est une alliance composée de plusieurs centaines de milliers de civilisations intergalactiques... toutes unies contre la menace des Moissonneurs Chats Blocks ! Et vous venez d'assister à une glorieuse victoire là-bas.\n\nOh, où sont mes manières ? Je suis §YSteroh§!, Lyuinite et Amiral universel du §YGroupe de travail pour le salut universel§!, responsable de la gestion du §YThéâtre de Laniakea§! des opérations contre la menace Chat Block.\n\nNotre alliance opère principalement sous l'aile du grand §YEmpire Lyuinite§! dirigé par notre leader §YKyuinai§! et de l'§YAssemblée universelle§!, qui supervise une grande partie de notre appareil bureaucratique et assure une coordination appropriée entre nos très, très nombreux États membres.\n\nPuisque cette guerre se déroule sur des milliards d'années-lumière et des dizaines de milliers d'années... il est primordial que nous restions aussi unis que possible, sinon les Chats Blocks nous balaieront comme des grains de poussière."

    giga_blokkat.3344.winning:99 "Eh bien, êtes-vous en train de battre les Chats Blocks ?"
    giga_blokkat.3344.winning.response:99 "Nous essayons de détruire ces méchants, méchants moissonneurs depuis des dizaines de millénaires maintenant. Ils ont causé... des octillions de morts jusqu'à présent, et dévoré environ trente milliards de galaxies, et ce chiffre ne fait qu'augmenter.\n\nEh bien. Nous ne pouvons pas vraiment dire que nous les battons pour l'instant, malheureusement. Principalement les retenir et évacuer... les tenir hors des secteurs centraux Lyuinites... c'est une guerre d'usure, vraiment.\n\nNous ne pouvons pas vraiment gagner la plupart de nos batailles car les vaisseaux Chats Blocks sont à la fois nombreux, puissants et agiles, mais nous pouvons leur faire saigner autant d'énergie que possible pour cela... jusqu'à ce qu'ils perdent, espérons-le, plus qu'ils n'en gagnent en dévorant l'univers.\n\nNous espérons pouvoir les ralentir puis monter une véritable contre-offensive... quelque part dans les prochaines dizaines de milliers d'années."

    giga_blokkat.3344.ships:99 "Quels sont ces immenses vaisseaux que vous utilisez ?"
    giga_blokkat.3344.ships.response:99 "Les vaisseaux que nous utilisons sont connus sous le nom de §YVaisseaux-singularité§!, les principaux actifs militaires contre les forces Chats Blocks, notre pain quotidien, si vous voulez. Nous en avons environ un trillion sur l'ensemble du champ de bataille universel et nous avons besoin que tous travaillent en tandem si nous voulons un jour ralentir les Chats Blocks.\n\nVoyez-vous, ils utilisent une singularité pour s'interfacer avec la réalité et modifier localement la physique pour se déplacer et attaquer... essentiellement une version militarisée de cette Aiguille d'Horizon que vous semblez avoir construite.\n\nVotre version est... eh bien, elle est assez rudimentaire, très bricolée, mais encore une fois, fabriquer quelque chose comme ça avec les ressources et la technologie d'une seule galaxie ? Vraiment impressionnant ! Je vous applaudis. Habituellement, les primitifs monogalactiques se tuent juste en essayant de construire de tels dispositifs."

    giga_blokkat.3344.appearance:99 "Est-ce votre vraie apparence ?"
    giga_blokkat.3344.appearance.response:99 "Oui... et non. Nous les Lyuinites sommes faits de matière intelligente... malheureusement un peu comme les Chats Blocks, bien que nos méthodes soient légèrement différentes.\n\nJe choisis d'employer cette forme parce qu'elle me plaît particulièrement, mais je pourrais ressembler à n'importe quoi d'autre si je le voulais. Ma conscience réelle n'est même pas à bord de cette flotte, mais plutôt hébergée quelque part dans un amas fortifié de Cerveaux Matriochka à quelques millions d'années-lumière d'ici.\n\nCela peut sembler lâche, mais nous ne pouvons prendre aucun risque avec les Chats Blocks ! Ils... font la même chose, de toute façon. Oh, oui, si jamais vous avez réussi à capturer des Chats Blocks... pas de chance ! Tout ce que vous avez réussi à obtenir est le châssis du Chat Block exécutant une simulation de sauvegarde du véritable Chat Block lui-même... décevant, je sais. Désolé pour ça."


    giga_blokkat.3344.deepshroud:99 "Avez-vous essayé de partir vers un autre univers, plus jeune et sans Chats Blocks ?"
    giga_blokkat.3344.deepshroud.response:99 "Aller dans... d'autres univers ? Hm. Je peux dire que votre espèce est assez téméraire, mais savez-vous même ce qu'il y a là-bas ? Le... multivers, si on peut l'appeler ainsi, est dangereux, mortel et imprévisible. Il y a des entités là-dedans qui font paraître les patrons du Voile superficiel de votre galaxie comme des animaux sans défense !\n\nEh bien, pour vous dire la vérité. Peut-être pourrions-nous, avec assez d'efforts, faire cela. Mais... alors les Chats Blocks auraient le champ libre sur cet univers, et ils seraient capables de le consumer entièrement sans opposition.\n\nEt ensuite quoi ? Ensuite... peut-être qu'eux aussi perceraient, et menaceraient à nouveau quelle que soit la réalité vers laquelle nous avons fui. Nous devons donc arrêter les Chats Blocks ici et maintenant, sinon qui sait jusqu'où ils iront ?"

    giga_blokkat.3344.blokkonstrukt:99 "Il y a un emplacement central dans le Chat Blockwork. Qu'est-ce que c'est ?"
    giga_blokkat.3344.blokkonstrukt.response:99 "C'est... le §YChat Blockonstrukt§!. Une térastructure abjecte, de plus d'une année-lumière de diamètre, dans laquelle les Chats Blocks ont amalgamé l'énergie de centaines de milliards de galaxies. Et ils veulent éventuellement tout plier dans cette structure afin de, supposément, repousser la Mort thermique... aux dépens de tous les autres.\n\nNous souhaitons seulement la voir détruite."

    giga_blokkat.3344.join:99 "Pourrions-nous... vous rejoindre ?"
    giga_blokkat.3344.join.response:99 "Vous aimeriez vous joindre à nous dans notre lutte contre les Chats Blocks ? Eh bien, nous serions très reconnaissants ! Habituellement, nous ne contactons pas les civilisations jusqu'à ce qu'elles aient réussi à repousser un Chat Block-Vester, mais vous avez clairement démontré une ingéniosité incroyable en survivant à un voyage à travers le Chat Blockwork.\n\nDites, nous allons vous donner des plans pour un véritable Vaisseau-singularité, et nous vous aiderons à améliorer cette Aiguille que vous avez en un véritable vaisseau de guerre, adapté à la guerre intergalactique ! Et ensuite nous montrerons aux Chats Blocks qui sont les vrais maîtres de l'univers, oui ?"

    giga_blokkat.3345.name:99 "Pour sauver l'univers"
    giga_blokkat.3345.desc:99 "Mettant de côté nos plans, il faut l'admettre, égoïstes de quitter cette réalité, nous avons décidé de nous concentrer sur l'objectif bien plus noble d'aider la Grande Fédération intergalactique dans leur lutte universelle contre les Chats Blocks.\n\nPeu après, nous sommes contactés par un Lyuinite connu sous le nom de §YDiym Milize§!, responsable de la diplomatie de l'alliance, qui nous présente le fonctionnement de la G.F.I. avant que nous ne signions officiellement notre entrée dans l'union intergalactique.\n\nL'Aiguille est escortée par la massive flotte de Vaisseaux-singularité jusqu'à une galaxie forteresse proche. Là, on nous fournit des plans et des infrastructures bien au-delà de nos rêves les plus fous, nous permettant de transformer notre Aiguille en un puissant vaisseau de guerre facilement capable de dévaster les flottes Chats Blocks qui avaient précédemment assiégé notre galaxie.\n\nIl nous faut des années pour nous habituer à ce bond technologique, qui d'ailleurs nous fait saisir combien d'éléments de notre projet Cosmogenèse nous ne comprenions pas réellement, mais finalement, grâce aux instructeurs Lyuinites, nos meilleurs ingénieurs et scientifiques sont capables de terminer cette grande amélioration...\n\n...et ainsi, nous partons ! Joignant notre nouveau et unique Vaisseau-singularité à une autre flotte, nous commençons notre mission de d'abord ralentir, puis arrêter la menace Chat Block et peut-être, juste peut-être... sauver toute la création."
    giga_blokkat.3345.a:99 "En avant !"

    giga_blokkat.3344.blackhole:99 "Pourriez-vous simplement nous escorter jusqu'au trou noir le plus proche ?"
    giga_blokkat.3344.blackhole.response:99 "Oh, bien sûr. Vous aimeriez entreprendre à nouveau ce projet de Cosmogenèse, oui...? Je crains que nous ne puissions pas vraiment... vous laisser faire cela en toute bonne conscience. Nous avons vu ce qui se passe habituellement avec ça ! 99 % du temps... quiconque essaie meurt juste d'une horrible manière ou d'une autre. Nous allons simplement scanner votre vaisseau et vous amener en lieu sûr, d'accord ?"

    giga_blokkat.33451.name:99 "L'Installation"
    giga_blokkat.33451.desc:99 "Suite à notre demande, la G.F.I. déploie un petit nuage de matière semblable à des nanites qui étudie notre vaisseau un moment, probablement pour analyser et comprendre notre voyage à travers le Chat Blockwork. Plus de la même matière procède ensuite à réparer notre Aiguille, la rendant à nouveau pleinement opérationnelle... pour ensuite nous envelopper complètement, faisant perdre conscience à tous à bord !\n\nNous nous réveillons après une durée indéterminée, nous trouvant toujours à l'intérieur de l'Aiguille, mais au sein d'une grande mégastructure quelque part dans l'espace intergalactique profond. Devant nous, au centre de la structure, se trouve une grande faille dans l'espace-temps semblable aux Failles astrales de notre ancienne galaxie, entourée d'une variété de dispositifs la maintenant ouverte de force.\n\nUne voix résonne soudainement dans nos esprits."
    giga_blokkat.33451.a:99 "Qui est-ce cette fois... ?"

    giga_blokkat.33454.name:99 "La F.S.E.A."
    giga_blokkat.33454.desc:99 "Salutations, primitifs monogalactiques. Ce que je vais vous dire est strictement classifié, mais vous serez bientôt en route donc ça n'a pas trop d'importance.\n\nMon nom est §YEdgar Nexon§!, chef de la §YSécurisation fédérogalactique des entités anomales§! ou §YF.S.E.A.§! pour faire court. Notre travail est de cataloguer tous les phénomènes étranges dans cet univers... et au-delà.\n\nNous vous avons secrètement récupérés après que Steroh a informé les supérieurs de votre exploit de plongée dans le Chat Blockwork, qui, eh bien, a certainement attiré notre attention, surtout puisque vous voulez apparemment recommencer ! Je peux dire que vous n'êtes pas trop familiers avec la nature du §YProfundum§!, et pour cela on ne peut vous blâmer puisque, eh bien, personne ne l'est vraiment."

    giga_blokkat.33454.place:99 "Où sommes-nous maintenant ?"
    giga_blokkat.33454.place.response:99 "Vous êtes dans un §YSite F.S.E.A.§! en espace profond destiné à étudier le §YVoyage interrealmique§!, ou comme vous l'appelez parfois, le voyage multiversel. Nous avons des centaines de failles astrales stabilisées là-dedans, vous êtes peut-être familiers avec celles-ci ?\n\nBien que celles que vous pouvez trouver dans n'importe quelle galaxie donnée tendent à être instables à long terme et à couper leur propre connexion relativement rapidement en raison de la nature des énergies tumultueuses du §YProfundum§!, donc l'objectif principal de cette installation est de trouver des moyens de les stabiliser sur le long terme."

    giga_blokkat.33454.deepshroud:99 "Le Profundum... ?"
    giga_blokkat.33454.deepshroud.response:99 "D'accord, donc, le §YProfundum§!, parfois aussi appelé le §YVoile profond§!... est essentiellement le tissu du multivers, si vous voulez. C'est comme une soupe géante dans laquelle tous les univers ou Royaumes accessibles flottent.\n\nParfois des connexions se forment, mais elles sont généralement très instables ou dangereuses, au point que le voyage interrealmique fiable aller-retour est... presque impossible. Et vous êtes... particulièrement audacieux, considérant que ce projet de Cosmogenèse était essentiellement une tentative de traverser vers un autre de ces royaumes à travers un trou noir. Impressionnant, mais pratiquement suicidaire.\n\nLes chances de finir dans un univers approprié sont faibles, et vous seriez très susceptibles de rencontrer certaines des nombreuses, nombreuses entités qui rôdent entre les réalités... n'attendant qu'une chose tombe dans leurs gueules éldrithiques."

    can_leave_thanks_to_fsae_tooltip:99 "Demandons d'abord ce qui se passe."

    giga_blokkat.33454.why:99 "Alors, pourquoi sommes-nous ici ?"
    giga_blokkat.33454.why.response:99 "Simple. Nous sommes assez stupéfaits par votre petit exploit de voyage dans le Chat Blockwork, qui, à travers l'étude de votre Aiguille, nous a donné pas mal de données précieuses, donc je rends juste la faveur.\n\nDevant vous se trouve une grande §YSingularité astrale§! stabilisée. Elle devrait, espérons-le, fournir à votre espèce un passage quelque peu sécurisé vers un autre Royaume, un qui devrait être « jeune » et « prêt à être manipulé » comme vous le cherchiez à l'origine avant de choisir de plonger dans un Chat Block-Vester... pour une raison quelconque.\n\nPlongez quand vous voulez, vraiment. Si vous vous demandez pourquoi nous ne faisons pas la même chose... eh bien, sachez que faire cela trop souvent tend à attirer une... attention indésirable. Alors soyez rapides, sinon..."

    giga_blokkat.33454.leave:99 "Nous sommes prêts à partir."
    giga_blokkat.33454.leave.response:99 "D'accord. Faites votre truc et faites vite. Et bonne chance là-bas. Ne vous faites pas éldrithiser. Et ne passez pas trop de temps dans le Profundum. Entrez, sortez, pas de traînassage !"

    giga_blokkat.33455.name:99 "Une fois de plus vers l'infini"
    giga_blokkat.33455.desc:99 "Nous activons rapidement l'Aiguille et plongeons dans la Singularité astrale, coupant et tordant la réalité édition après édition pour nous assurer de survivre à la traversée.\n\nLes résultats sont satisfaisants. La Singularité astrale, ayant présumément été affinée par la F.S.E.A., cède devant nous, laissant notre Aiguille traverser momentanément les marées du Profundum. Nous nous retrouvons maintenant à voyager en douceur à travers l'espace entre les réalités le long d'une sorte de sentier éthéré - mais notre curiosité insatiable revient une fois de plus.\n\nNexon nous a avertis de ne pas ralentir, mais certains d'entre nous ne peuvent résister. Bientôt, une grande partie de notre civilisation demande à l'Aiguille de ralentir pour que nous puissions étudier la nature du Profundum plus en détail, et surtout, la voir de nos propres yeux.\n\nQuelles merveilles, quelles merveilles inconnaissables résident dans ce tissu multiversel ? Il nous appelle. C'est peut-être bien notre seule chance d'avoir un aperçu clair de l'essence fondamentale de la réalité. Que faire ?"
    giga_blokkat.33455.a:99 "Écouter Nexon ! Garder le cap !"
    giga_blokkat.33455.b:99 "Nous devons savoir ce qui se trouve au-delà. Pour la science !"

    giga_blokkat.33456.name:99 "Un nouveau foyer"
    giga_blokkat.33456.desc:99 "Ignorant notre curiosité destructrice, nous filons le long du chemin tracé par la Singularité astrale et nous retrouvons bientôt dans un nouveau « Royaume », comme l'appellent les Lyuinites. La F.S.E.A. a bien fait son travail : ce Royaume est calme et jeune, son tissu même comme de l'argile prête à être façonnée en tout ce que nous désirons.\n\nNotre curiosité concernant le Profundum reste cependant inassouvie, mais peu importe. Ici, nous avons tout le temps de l'univers pour reconstruire et étendre notre civilisation. Peut-être qu'avec le temps, nous pourrons entreprendre nos propres incursions dans le Profundum comme les Lyuinites, mais pour l'instant, à travers nos épreuves et nos triomphes, nous avons trouvé un foyer."
    giga_blokkat.33456.a:99 "Au final, tout en valait la peine."

    giga_blokkat.33457.name:99 "Apercevoir l'horreur"
    giga_blokkat.33457.desc:99 "Ignorant les conseils de Nexon, nous ralentissons un peu alors que certains d'entre nous osent entrevoir les profondeurs de l'espace multiversel. Des marées infinies d'énergie hyperdimensionnelle nous entourent, s'écoulant à travers les neuf dimensions spatiales du Profundum, comme contempler un ensemble infini d'infinis...\n\nPendant ce qui semble être une éternité, nous restons émerveillés par le spectacle, certains totalement incapables de cesser de le regarder. Alors que nous fixons les profondeurs de la réalité, une part de plus en plus importante de notre équipage commence à prétendre que la « solution à tout » se trouve juste en dehors du réseau éthéré. Ce serait une solution si élégante et puissante que la F.S.E.A. a tenté de nous la dissimuler !\n\nQuelque chose d'une telle puissance, qu'elle pourrait supposément « mettre fin au cycle » de souffrance et de douleur enduré par ceux à travers le multivers. Des promesses de divinité littérale, notre propre ascension, au-delà même de nos rêves de Cosmogenèse les plus fous, au-delà des Lyuinites et des Chats Blocks, remplissent nos consciences.\n\nEt en effet ! Si des univers individuels sont capables de résister à nos éditions, pourquoi s'en soucier ? Allons directement à la source et modelons le tissu sous-jacent même du multivers !\n\nLa réponse est claire : nous devons quitter le chemin. Entrer dans le Profundum pour de bon. C'est notre destinée d'embrasser l'infini ! Nous devons agir maintenant avant que l'opportunité ne s'échappe !"
    giga_blokkat.33457.a:99 "Au diable Nexon ! Nous saisirons l'éternité !"
    giga_blokkat.33457.b:99 "Non ! NON ! GARDER LE CAP !"


    giga_blokkat.33458.name:99 "Mettre fin au cycle"
    giga_blokkat.33458.desc:99 "L'Aiguille prend un virage serré, quittant le réseau éthéré de la F.S.E.A. puis plongeant tête première dans les profondeurs du Profundum. C'est... magnifique. Une infinité éternelle s'étend devant nous. Avec le pouvoir de notre Aiguille, nous travaillerons à remodeler l'espace interdimensionnel lui-même. Nous ne serons pas de simples dieux, mais plutôt de vrais Dieux omnipotents, libérés des lois et contraintes de tout univers.\n\nMais d'abord, nous devons trouver un endroit approprié, un où la densité d'énergie est parfaite pour nos plans. Naviguer dans l'espace à neuf dimensions est... délicat, mais rien que nous ne puissions gérer. Finalement, nous localisons un emplacement approprié et commençons notre travail. Au diable la F.S.E.A. et les Chats Blocks et toutes ces pathétiques civilisations étriquées ! Ils pensaient que §Rce n'était pas encore notre heure...§! mais maintenant, §Rce le sera§!. Tout ce que nous aurons à faire est... d'apporter §Rla Fin§!.\n\nOui, oui ! Les marées infinies d'agonie que le multivers expérimente seront bientôt §Rterminées§!. D'innombrables mondes, d'innombrables réalités, d'innombrables §RCycles§! futiles seront §Rterminés§!. Dans tous nos esprits à la fois, un message clair résonne : ceci est et a toujours été §Rnotre but§!. Nos formes et êtres sont altérés par les §Rénergies§! du Profundum alors que nous peinons, nos esprits mêmes se pliant et se tordant en quelque chose d'§Rinconnaissable§!. Bientôt il n'y a plus de §Rtemps§!, plus de §Rsouffrance§!, plus de §Rpensée§!, plus de §Rréalité§!.\n\n§RIl n'y a que la Fin du Cycle§!."
    giga_blokkat.33458.a:99 "§RSI NOUS NE FAISONS QU'APPORTER LA FIN.§!"
    giga_blokkat.33458.a.tooltip:99 "Qu'avez-vous fait... ?"

    giga_blokkat.33459.name:99 "Saufs mais pas sains"
    giga_blokkat.33459.desc:99 "Nous ne devons pas rester ici ! Dans une démonstration de force contre notre propre curiosité, nous accélérons une fois de plus le long du chemin tracé par la Singularité astrale et nous retrouvons bientôt dans un nouveau « Royaume », comme l'appellent les Lyuinites. La F.S.E.A. a bien fait son travail : ce Royaume est jeune, son tissu même comme de l'argile prête à être façonnée en tout ce que nous désirons.\n\nEt pourtant cela semble... faux. Nous avons contemplé le Profundum dans sa beauté hyperdimensionnelle, et maintenant l'espace tridimensionnel de ce Royaume est... insatisfaisant. Restrictif. Étriqué. Il est cependant évident, d'après notre accès de délire interdimensionnel, que nous ne pouvons pas simplement résider entre les réalités, sous peine d'être dévorés par des forces au-delà de notre compréhension.\n\nLes tensions montent alors que notre civilisation devient de plus en plus incertaine de son propre avenir et de ses objectifs. Mais finalement, un accord est trouvé. Nous avons tout le temps de l'univers ici, et nous nous mettrons donc au travail. Nous raffinerons et améliorerons la conception de l'Aiguille, jusqu'à ce qu'elle soit capable de résister aux énergies chaotiques du Profundum."
    giga_blokkat.33459.a:99 "Et alors... nous rentrerons enfin chez nous."

    # But our admiration is cut short by the sudden emergence of unspeakable screeches within our very consciousnesses - endless notions of 'ending the cycle' poison the minds of our crew, sending some of them into a frenzy of delirium before they ultimately take their own lives.
    # However, n\n.

    giga_blokkat.3344.fight:99 "Racaille. Nous allons vous détruire !"

    giga_blokkat.33452.name:99 "La Grande Fédération intergalactique"
    giga_blokkat.33452.desc:99 "Holà ! Nous comprenons que combattre les extraterrestres puisse faire partie de la culture de votre civilisation, mais ce genre de comportement primitif ne peut pas être toléré ici. Nous devons rester unis si nous voulons riposter contre les Chats Blocks, donc... si vous pouviez cesser d'agir ainsi... ce serait super !\n\nPensez à tout le bien que vous pourriez faire dans l'univers si vous n'étiez pas occupés à vouloir tout tuer. Comme, nous aider à vaincre ceux qui essaient de tout tuer peut-être ?"

    giga_blokkat.33452.yes:99 "On va vous montrer ce qu'est un meurtre ! Pleine vitesse !"
    giga_blokkat.33452.no:99 "Nous... supposons que vous avez raison. Désolé."

    giga_blokkat.33453.name:99 "La frappe"
    giga_blokkat.33453.desc:99 "Sans répit, nous coupons de force les communications avec la flotte xéno et, utilisant le peu d'énergie qui reste dans l'Aiguille, nous chargeons vers les vaisseaux ! Avec grande hâte, nous entreprenons une série d'éditions frénétiques visant à détruire le misérable vaisseau que nous allons percuter. L'Aiguille n'est peut-être pas conçue pour la guerre, mais perturber la réalité elle-même peut certainement être une arme puissante...\n\n...ou c'est ce que nous pensions. En une fraction de seconde, l'un des Vaisseaux-singularité fige l'Aiguille sur place, nos propres éditions impuissantes contre les leurs alors que notre vaisseau est placé dans une chambre de stase. S'ensuit le retour forcé de notre Aiguille vers l'une des galaxies de la G.F.I., où elle est rapidement démontée et étudiée, vraisemblablement pour comprendre comment nous avons survécu à un voyage à travers le Chat Blockwork.\n\nUne fois tout dit et fait, notre peuple est rééduqué de nos manières violentes avant d'être libéré au sein d'un État membre plus grand de la G.F.I. En fait, c'est là que notre histoire se termine. En quelques décennies, notre ancienne culture et notre mode de vie, jugés trop « primitifs », sont essentiellement éliminés alors que nous sommes incorporés dans ce collectif, les souvenirs de nos grandes entreprises de Cosmogenèse bientôt relégués à l'histoire."
    giga_blokkat.33453.a:99 "Memento mori."

    giga_blokkat.3348.name:99 "Le centre de l'univers"
    giga_blokkat.3348.desc:99 "Fonçant à travers les flux d'énergie éthérés du Chat Blockwork, notre Aiguille lutte inlassablement contre l'oubli alors qu'elle remonte le réseau, se rapprochant de plus en plus de la source de tout, vraisemblablement là où l'énergie récoltée par les Chats Blocks aboutit. Dépensant les dernières de ses capacités, elle émerge enfin du réseau.\n\nNous nous retrouvons à la surface de ce qui semble être une structure absolument gigantesque, de plus d'une année-lumière de longueur. Faite des énergies amalgamées de centaines de milliards de galaxies assemblées, c'est... ça. L'exploit ultime d'ingénierie des Chats Blocks et leur projet principal. Une construction inimaginablement grande, destinée à croître éternellement jusqu'à ce que l'univers entier y soit amalgamé.\n\nIl semble que les Chats Blocks appellent cet endroit le §YChat Blockonstrukt§!, une structure d'une complexité quasi infinie abritant leur civilisation entière - la démonstration de force ultime de la vie sapiente contre les forces insouciantes de l'entropie. Mais nous n'avons plus de temps pour méditer, car nous n'appartenons pas ici.\n\nQuelques secondes après notre arrivée, les éditions de l'Aiguille faiblissent, submergées par la propre distorsion de la réalité de la structure, alors que d'innombrables êtres tournent leur regard vers nous, leurs esprits submergeant les nôtres.\n\nDans une tentative désespérée de survie, l'Aiguille entreprend une dernière édition - une tentative audacieuse de plonger dans le coeur même du Chat Blockonstrukt, dans l'espoir que sa propre attraction gravitationnelle puisse imiter celle d'un trou noir et nous permettre de quitter cette réalité."
    giga_blokkat.3348.a:99 "Dans le coeur même de la réalité."

    giga_blokkat.3349.name:99 "Nirvana"
    giga_blokkat.3349.desc:99 "L'Aiguille s'arrête dans un endroit calme, le Chat Blockonstrukt et ses habitants nulle part en vue. Soudain, un sentiment de sérénité surnaturelle envahit nos esprits.\n\nNous l'avons fait ! Contre toute attente, nous avons échappé au Chat Blockonstrukt et sommes partis vers une meilleure réalité. Cet univers est... agréable, chaud, calme. Partout où nous regardons, nous voyons un espace vide, prêt à être façonné pour nos propres fins, débordant d'une sorte de félicité pure et éthérée, qui remplit nos consciences à chaque instant.\n\nCet univers est, à tous égards, absolument parfait, précisément ce que nous recherchions dans nos entreprises de Cosmogenèse. Notre pari a payé. Nous avons traversé l'enfer et nous nous retrouvons maintenant au paradis, où nous résiderons désormais pour l'éternité, libérés des luttes et de la douleur du monde matériel."
    giga_blokkat.3349.a:99 "§G<<PROTOCOLES DE SANCTUAIRE INITIÉS - INTRUS CONTENUS AVEC SUCCÈS>>§!"

    giga_blokkat_join.1000.name:99 "Faire face aux Chats Blocks"
    giga_blokkat_join.1000.desc:99 "Il est évident que le §YRempart hyperdimensionnel§! entourant le §YChat Block-Vester§! sera un obstacle majeur si nous voulons un jour repousser les §YChats Blocks§! de notre galaxie. Suite à une analyse plus approfondie des données recueillies par le Bureau et une discussion approfondie, notre direction et nos équipes scientifiques ont proposé plusieurs plans d'action possibles pour faire face aux Chats Blocks.\n\nLe premier et le plus évident est de, comme suggéré précédemment, rechercher puis construire un dispositif massif pour abattre le bouclier, avant d'utiliser nos flottes pour réduire le Chat Block-Vester en néant, supprimant ainsi la menace Chat Block de notre galaxie.\n\nUne autre branche de notre gouvernement soutient que combattre est futile et que nous devrions plutôt suivre la suggestion des Chats Blocks et assembler une §Yarche intergalactique§! pour évacuer en toute sécurité notre population de la galaxie et chercher refuge ailleurs.\n\nEnfin, une troisième branche bien plus marginale suggère que, considérant que les Chats Blocks sont évidemment sapients et capables de pensée intelligente, il pourrait y avoir un moyen de potentiellement... §Rles rejoindre§!, si nous trouvons un moyen de négocier avec ces envahisseurs.\n\nBien que cette dernière option ait été décriée comme totalement ridicule par presque tous les membres sains d'esprit de notre gouvernement et de la communauté scientifique, ses partisans soutiennent que s'allier avec les Chats Blocks assurerait la continuité et la sécurité éternelles de notre grande civilisation pour les éons à venir.\n\n§BSi nous avons l'avantage §YCosmogenèse§!, de nouvelles opportunités pourraient se présenter plus tard...§!"

    giga_blokkat_join.1000.a:99 "Nous combattrons et repousserons ces envahisseurs, peu importe le coût !"
    giga_blokkat_join.1000.a.tooltip:99 "Le §YBureau de recherche Chat Block§! se concentrera sur le développement du §YDéstabilisateur hyperdimensionnel§!, un grand dispositif capable d'abattre le bouclier du §YChat Block-Vester§!.\n\n§BCette ligne de conduite se concentrera sur la recherche scientifique et la puissance militaire.§!"

    giga_blokkat_join.1000.b:99 "Combattre est futile. Partons vers des terres plus fertiles !"
    giga_blokkat_join.1000.b.tooltip:99 "§RÀ venir dans une future mise à jour !§!"

    giga_blokkat_join.1000.c:99 "Nous devons... non, nous devons §Rles rejoindre.§!"
    giga_blokkat_join.1000.c.tooltip:99 "Le §YBureau de recherche Chat Block§! se concentrera sur la tentative de §Ycontacter les Chats Blocks§! et de négocier une sorte d'alliance avec eux, si une telle chose est même possible... Après tout, détruire leur Vester ne ferait sûrement que les inciter à envoyer des renforts encore plus importants et à nous anéantir, alors pourquoi se battre ?\n\n§RNotre population, notre direction et la galaxie dans son ensemble n'apprécieront PAS ce choix au début. Il y aura des conséquences négatives.§!\n\n§BCette ligne de conduite se concentrera fortement sur la recherche scientifique.§!"

    giga_blokkat_join.1001.name:99 "Rejoindre les Chats Blocks ?"
    giga_blokkat_join.1001.desc:99 "Et ainsi, contre toute attente, il a été décidé que notre empire tenterait de négocier avec ces envahisseurs extragalactiques et même potentiellement de rejoindre leur camp. Mais la seule question qui reste est... comment ? Bien que les Chats Blocks soient très clairement capables de raisonnement, ils considèrent actuellement notre civilisation comme guère plus que des fluctuations aléatoires dans les niveaux d'énergie de la galaxie, comme nos scientifiques les plus intelligents percevraient un simple insecte.\n\nHeureusement, les partisans de l'idée travaillant pour notre §YBureau de recherche Chat Block§! ont déjà élaboré plusieurs théories sur la façon d'attirer l'attention des Chats Blocks. En l'état, toutes les transmissions vers les Chats Blocks sont effectuées en utilisant nos propres méthodes de cryptage, que les Chats Blocks traduisent ensuite par des moyens inconnaissables en quelque chose qu'ils peuvent comprendre.\n\nNos scientifiques pensent que si nous parvenions à comprendre et décrypter le langage que les Chats Blocks utilisent pour leurs propres communications, puis envoyer un message haute puissance contenant nos intentions au §YChat Block-Vester§!, nous pourrions être en mesure de leur montrer que nous sommes, en fait, capables de penser à leur niveau.\n\nUn §BProjet de recherche Chat Block§! pour décrypter le langage Chat Block a donc été établi dans le §YBureau de recherche Chat Block§!."
    giga_blokkat_join.1001.a:99 "Il y a beaucoup à faire."
    giga_blokkat_join.1001.a.tooltip:99 "Un nouveau §BProjet de recherche Chat Block§! est maintenant disponible dans le §YBureau de recherche Chat Block§!.\n\nComme les Chats Blocks se soucient actuellement très peu de nous, nous nous attendons à ce que détruire certains de leurs vaisseaux soit une preuve supplémentaire de nos capacités, et qu'il ne devrait donc y avoir aucun risque à le faire."

    giga_blokkat.3000.joinblokkats1:99 "Décrypter le §YLangage Chat Block§! | §Y10§! $blokkat_knowledge$"
    giga_blokkat.3000.joinblokkats1.tooltip:99 "Afin de négocier avec les Chats Blocks, nous devons nous assurer d'être sur un pied d'égalité avec eux. Tenter de les contacter en utilisant nos propres langues aboutit au rejet, nous devons donc traduire puis utiliser leur propre langage afin de communiquer avec ces envahisseurs. Espérons que cela leur montrera que nous sommes capables de pensée supérieure tout comme eux.\n\n§YCela nous permettra de commencer à travailler sur la négociation avec les Chats Blocks. Les étapes suivantes du projet nécessiteront des $blokkat_knowledge$ supplémentaires.§!"

    giga_blokkat_join.2000.name:99 "Décryptage du §YLangage Chat Block§!"
    giga_blokkat_join.2000.desc:99 "Grâce à nos récentes investigations sur le §YChat Blockwork§!, nous avons pu en apprendre davantage sur la façon dont les Chats Blocks communiquent entre eux.\n\nLeurs réseaux de communication hyperdimensionnels utilisent une sorte de forme de « langage » basée sur l'énergie et fortement cryptée, intriquée dans des dimensions supérieures quasi incompréhensibles, que tous les Chats Blocks sont capables de comprendre instantanément. Suite à un débat nourri sur le nom, notre §YBureau de recherche Chat Block§! a décidé de nommer officiellement ce « langage » §GChat Blockais§!, qui est, étonnamment, apparemment une traduction assez fidèle de ce que les Chats Blocks eux-mêmes l'appellent.\n\nBien que nous ayons fait des progrès dans la compréhension de ce « langage », l'utiliser réellement pour former un message cohérent est plus problématique. Il nous incombe donc de comprendre pleinement les subtilités du §GChat Blockais§! et de découvrir comment établir des communications appropriées avec les Chats Blocks."

    giga_blokkat_join.2000.a:99 "Mettons-nous au travail immédiatement."

    blokkat_blokkatese_title:99 "Nous permet de communiquer directement en §GChat Blockais§!.\nConnaissance des Chats Blocks : §G+1§!"

    giga_tech_translate_blokkatese:99 "Linguistique hyperdimensionnelle"
    giga_tech_translate_blokkatese_desc:99 "Le langage Chat Block repose sur un ensemble incroyablement complexe d'ondes d'énergie intriquées dans des dimensions supérieures, transmises sur des distances intergalactiques à travers le Chat Blockwork. Réussir à vraiment comprendre ce langage nous permettrait sûrement d'établir des relations plus étroites avec ces êtres."

    giga_blokkat_join.2001.name:99 "Combien de Blocks un Chat Block peut-il Blocker ?"
    giga_blokkat_join.2001.desc:99 "Une partie du personnel du §YBureau de recherche Chat Block§! se tenait autour d'un dispositif colossal dans une salle circulaire, une bonne partie de ses scientifiques refusant toujours de participer correctement à ce projet supposément insensé de contacter les Chats Blocks.\n\nLe dispositif, l'un des ordinateurs les plus puissants jamais conçus par les §Y[ROOT.GetSpeciesNamePlural]§!, atteignait profondément l'espace hyperdimensionnel et avait été construit dans un seul but : émuler comment le Chat Blockwork comprend le §GChat Blockais§!. Un message de test devait être entré dans le dispositif, qui le traduirait ensuite en ce qui devrait être du Chat Blockais, le comparerait avec une « phrase » échantillon récupérée du Chat Blockwork, puis le décrypterait à nouveau dans notre propre langage, et si tout était correct, il devrait retourner un résultat identique.\n\nLe message de test habituel du Bureau était §H« Combien de Blocks un Chat Block peut-il Blocker ? »§!, une phrase couramment trouvée dans le Chat Blockwork qui met en évidence la difficulté inhérente à traduire correctement les langages conventionnels en Chat Blockais d'une manière qui ait du sens.\n\nMalheureusement pour eux, ils n'avaient rencontré que d'innombrables problèmes avec les protocoles de traduction, qui aboutissaient souvent à ce que la phrase devienne absurde une fois traduite en Chat Blockais. Les exemples incluaient demander au Chat Block en chef du Vester de sortir avec eux, exiger de rendre visite à la génitrice femelle d'un Chat Block (un échec rendu d'autant plus humoristique par le fait que les Chats Blocks ne possèdent pas le concept de genre, ni le concept de géniteur, d'ailleurs), ou carrément tomber dans des boucles de conversion de traduction récursive qui cassaient le dispositif plus de fois que les scientifiques ne pouvaient s'en souvenir.\n\nAvec peu d'attentes, le scientifique en chef entra la phrase et activa le dispositif, l'incitant à démarrer et à exécuter les protocoles de traduction, avant de retourner les résultats..."
    giga_blokkat_join.2001.a:99 "Notre glorieux avenir en dépend."

    giga_blokkat_join.2002.name:99 "Combien de Blocks un Chat Block peut-il Blocker ?, Partie II"
    giga_blokkat_join.2002.desc:99 "§H« Combien de Blocks un Chat Block peut-il Blocker ? »§!\n\nPour une phrase au son si stupide de générer tant d'excitation était totalement inouï, et pourtant les acclamations dans la salle étaient sans précédent dans l'histoire scientifique récente. En entendant les acclamations, certains des scientifiques qui avaient été réticents à contribuer ouvertement à toute cette entreprise décidèrent d'abandonner leurs croyances précédentes et de se joindre également.\n\nEt peut-être, juste peut-être, cette idée apparemment ridicule de contacter ces envahisseurs extragalactiques impitoyables n'était finalement pas si ridicule, après tout..."
    giga_blokkat_join.2002.a:99 "Il y a de l'espoir."

    giga_blokkat.3000.joinblokkats2:99 "Envoyer un message au §YChat Blockwork§! | §Y20§! $blokkat_knowledge$ & §Y200000§! £energy£"
    giga_blokkat.3000.joinblokkats2.tooltip:99 "Maintenant que nous comprenons les subtilités du §GChat Blockais§!, nous devrons mener des recherches supplémentaires sur le §YChat Blockwork§! afin de trouver le meilleur moyen de transmettre directement un message haute puissance au §YChat Block-Vester§!.\n\n§YCela nous permettra de continuer à travailler sur la négociation avec les Chats Blocks. Les étapes suivantes du projet nécessiteront des $blokkat_knowledge$ supplémentaires.§!"

    giga_blokkat_join.2010.name:99 "Établir le contact"
    giga_blokkat_join.2010.desc:99 "Bien que nous puissions comprendre et communiquer en §GChat Blockais§!, nous devons encore trouver comment transmettre directement notre message dans le §YChat Blockwork§! au lieu de nous fier à des transmissions primitives vaguement dirigées vers le Chat Block-Vester en priant pour que les Chats Blocks se soucient assez de répondre.\n\nC'est un fait connu que le Chat Blockwork est un ensemble d'ondes d'énergie interconnectées immensément complexes circulant à travers des dimensions supérieures, et nous devrons donc investir massivement dans la compréhension de son fonctionnement interne si nous voulons trouver un moyen d'envoyer la transmission."
    giga_blokkat_join.2010.a:99 "Pas de temps à perdre !"

    SEND_BLOKKAT_MESSAGE:99 "Contacter le Chat Block-Vester"
    SEND_BLOKKAT_MESSAGE_DESC:99 "Selon nos théories actuelles concernant les Chats Blocks, il devrait être possible pour nous de contacter directement le Chat Block-Vester à travers le Chat Blockwork, et d'envoyer nos demandes de diplomatie de cette façon. Bien que le coût en énergie soit certainement prohibitif, nous devrions déjà avoir cela couvert."

    giga_blokkat_join.2011.name:99 "Le message"
    giga_blokkat_join.2011.desc:99 "Alors que des centaines de scientifiques et linguistes travaillaient sans relâche pour percer dans le §YChat Blockwork§! et envoyer notre transmission au §YChat Block-Vester§!, §Y[ROOT.GetRulerName]§!, entouré de diplomates et assis devant un grand écran, devenait de plus en plus nerveux.\n\nÉtait-ce une bonne idée ? Avaient-ils fait une erreur en approuvant ce projet dérangé ? Les Chats Blocks ne se soucient évidemment pas de nous, seulement de maximiser leurs gains d'énergie. Pourquoi feraient-ils attention à nous juste parce que nous avons appris à parler leur langage ? S'ils voulaient nous parler, ils l'auraient fait avant, pensaient-ils. Tout cela valait-il le trouble public massif suscité par cette décision ?\n\nLes pensées du §Y[Root.GetRulerTitle]§! furent soudainement interrompues par une sorte de hurlement assourdissant résonnant dans leur esprit, vraisemblablement le retour de sous-espace de la transmission immensément énergétique, car il avait fallu l'énergie d'une étoile entière ne serait-ce que pour envoyer le message.\n\nAlors que le message partait, un lourd silence tomba sur la salle. Le message avait été soigneusement élaboré et revu par les meilleurs diplomates du §Y[ROOT.GetName]§! et énoncerait nos intentions de coopérer avec les Chats Blocks, et pourtant, les scientifiques ne pouvaient se défaire du sentiment désagréable que les Chats Blocks le considéreraient juste comme leur équivalent du courrier indésirable.\n\nMais ils n'eurent pas beaucoup de temps pour réfléchir, car une autre vague de sous-espace ondula à travers la salle, faisant soudainement s'illuminer le grand écran devant §Y[ROOT.GetRulerName]§! avec la silhouette géométrique des redoutables envahisseurs..."
    giga_blokkat_join.2011.a:99 "À l'écran."

    giga_blokkat_join.2012.name:99 "Les Chats Blocks"
    giga_blokkat_join.2012.desc:99 "§G(ÉTABLISSEMENT DES COMMUNICATIONS)\n(ANALYSE DES CONSCIENCES DES DESTINATAIRES)\n(ÉVALUATION : INTENTIONS AUTHENTIQUES)§!\n\nSalutations, §Y[ROOT.GetSpeciesNamePlural]§!. Je suis §YChat Block Béhémoth§!, chargé d'administrer le démantèlement et la récolte subséquente de §YGalaxie CE-1461§!.\n\nNous avons reçu votre transmission §YChat Blockwork§! et je vous informe donc que, conformément au décret du §YChat Blockouncil§!, pour que des §Yprimitifs baryoniques§! tels que vous soient élevés dans le giron de la civilisation Chat Block, votre espèce doit atteindre un certain seuil d'efficacité qui garantira que, à long terme, votre addition au collectif compensera la perte d'énergie causée par votre ascension.\n\nSi vous souhaitez tenter d'atteindre ce seuil, informez-nous immédiatement, et nous vous fournirons plusieurs tests, connus sous le nom de §YChat Block-Protokols§!, qui détermineront mathématiquement si votre civilisation peut être autorisée à rejoindre nos opérations de récolte.\n\nLes §YChat Block-Protokols§!, s'ils sont complétés avec succès, garantiront également que vous mettiez en place l'infrastructure pour nous permettre d'élever facilement votre civilisation avec une perte d'énergie minimale.\n\nSoyez conscients que nous §Rn'arrêterons pas§! nos opérations actuelles si vous acceptez, car démontrer une prouesse martiale suffisante pour repousser les vaisseaux démanteleurs civils standard est considéré comme une exigence obligatoire pour passer les §YChat Block-Protokols§!.\n\nSi vous réussissez, vous serez §Ychargés§! des §Yopérations de récolte§! de §YGalaxie CE-1461§! et aurez pour tâche de récolter entièrement son énergie et de la transférer au §YChat Blockonstrukt§!."

    giga_blokkat_join.2012.a:99 "Élevés dans la civilisation Chat Block... ?"
    giga_blokkat_join.2012.a.response:99 "Correct. En supposant que les §Y[ROOT.GetSpeciesNamePlural]§! passent les §YChat Block-Protokols§!, il n'y a guère d'intérêt à conserver vos formes baryoniques inefficaces.\n\nVos dirigeants et §Y[ROOT.GetRulerName]§! seront donc élevés et leurs consciences téléversées dans le §YChat Blockwork§!, leur permettant de devenir des §YChats Blocks§! individuels.\n\nQuant à votre population, leurs consciences collectives seront amalgamées en consciences Chat Block bien plus puissantes, finement ajustées pour conserver les propriétés culturelles de votre civilisation, pour être téléversées dans le Chat Blockwork.\n\nNe vous inquiétez pas de la destruction de vos « âmes », car le processus de Chat Blockification transfère également l'essence psionique du récipiendaire vers le Chat Blockwork, s'il y en a une."

    giga_blokkat_join.2012.a.synth:99 "Élevés dans la civilisation Chat Block... ?"
    giga_blokkat_join.2012.a.synth.response:99 "Correct. En supposant que les §Y[ROOT.GetSpeciesNamePlural]§! passent les §YChat Block-Protokols§!, il n'y a guère d'intérêt à conserver vos formes baryoniques inefficaces.\n\nVos dirigeants et §Y[ROOT.GetRulerName]§! seront donc élevés et leurs consciences téléversées dans le §YChat Blockwork§!, leur permettant de devenir des §YChats Blocks§! individuels.\n\nQuant à votre population, leurs consciences collectives seront amalgamées en consciences Chat Block bien plus puissantes, finement ajustées pour conserver les propriétés culturelles de votre civilisation.\n\nNe vous inquiétez pas de la destruction de vos « âmes », car le §YProcessus de Chat Blockification§! transfère également l'essence psionique des récipiendaires vers le Chat Blockwork, s'il y en a une. Bien qu'il soit assez regrettable que votre essence psionique ait été en grande partie détruite lors de votre ascension synthétique, une nouvelle essence peut être fabriquée si nécessaire."

    giga_blokkat_join.2012.a.synthdeath:99 "Attendez, notre ascension était... un suicide ?"
    giga_blokkat_join.2012.a.synthdeath.response:99 "Que ce soit ou non un « suicide » n'est qu'un problème de sémantique. Selon votre définition de la conscience et de soi, cela peut ne faire aucune différence, mais ce que votre espèce appelle des « âmes » est effectivement réel.\nRejeter la psionique comme de la sorcellerie impossible est un comportement particulier et incompréhensible couramment trouvé chez de nombreuses civilisations matérialistes, qui tend à avoir des effets secondaires très malheureux."

    giga_blokkat_join.2012.b:99 "Quelqu'un d'autre a-t-il déjà réussi ?"
    giga_blokkat_join.2012.b.response:99 "Seules 7 civilisations ont réussi à passer les §YChat Block-Protokols§! par le passé jusqu'à présent. Elles font maintenant partie du collectif Chat Block et aident à accélérer nos opérations de récolte de manière tout à fait splendide."

    giga_blokkat_join.2012.c:99 "Qu'est-ce que le Chat Blockonstrukt ?"
    giga_blokkat_join.2012.c.response:99 "Toute l'énergie rassemblée est relocalisée vers le §YChat Blockonstrukt§!, un projet colossal de giga-ingénierie visant à condenser l'intégralité de l'univers en une seule structure pour combattre la §YMort thermique§! et assurer notre survie éternelle.\n\nIl sert de centre de population central de notre civilisation, de hub logistique et de coeur du §YChat Blockwork§!.\n\nSi vous passez les §YChat Block-Protokols§!, votre population serait éventuellement relocalisée vers le §YChat Blockonstrukt§! une fois que §YGalaxie CE-1461§! aura été entièrement récoltée.\n\nLe Chat Blockonstrukt détient actuellement environ §Y1 %§! de l'énergie de votre univers observable et devrait croître exponentiellement à mesure que les taux de récolte augmentent."

    giga_blokkat_join.2012.f:99 "Que devrons-nous faire pour passer les §YChat Block-Protokols§!, exactement ?"
    giga_blokkat_join.2012.f.response:99 "Les Chat Block-Protokols comportent trois étapes majeures.\n\nPremièrement, vous serez chargés de compléter les §EÉquations Chat Blockiliennes§!, un ensemble d'équations englobant les principes sous-jacents de nos technologies.\n\nUne fois celles-ci complétées, votre civilisation devra rechercher et construire des §HNoeuds d'alimentation Chat Blockwork§! spécialisés sur tous vos mondes, ce qui mettra en place l'infrastructure requise pour l'ascension.\n\nEnfin, nous vous fournirons les schémas d'un §PPylône Chat Blockwork§!, une mégastructure colossale qui connectera pleinement votre civilisation au §YChat Blockwork§! et permettra votre intégration complète dans le collectif, après quoi vous ferez partie de notre civilisation et gagnerez le contrôle des §Yopérations de récolte§! de §YGalaxie CE-1461§!.\n\nAfin d'activer le §PPylône Chat Blockwork§!, de couvrir les coûts du §YProcessus de Chat Blockification§! et de prouver votre efficacité, vous devrez rassembler §Y[blokkat_country.blokkat_ascension_cost]§! £energy£. Les §YChat Block-Protokols§! vous fourniront la technologie nécessaire pour stocker une telle quantité d'énergie."

    giga_blokkat_join.2012.d:99 "§GTrès bien. Nous acceptons.§!"
    giga_blokkat_join.2012.d.tooltip:99 "Les Chats Blocks nous soumettront les §YChat Block-Protokols§!.\n\n§RIl n'y a plus de retour en arrière maintenant. La galaxie pourrait nous haïr pour cela. Mais nous deviendrons quelque chose de plus grand.§!"
    giga_blokkat_join.2012.d.response:99 "Excellent. Nous soumettrons les §YChat Block-Protokols§! à votre civilisation immédiatement."

    giga_blokkat_join.2012.e:99 "§RC'est de la folie ! DE LA FOLIE ! Oubliez tout ça !§!"
    giga_blokkat_join.2012.e.tooltip:99 "Nous reviendrons à l'idée de construire le §YDéstabilisateur hyperdimensionnel§! pour combattre le §YChat Block-Vester§!. Le §YBureau de recherche Chat Block§! gagnera de nouveaux §BProjets de recherche Chat Block§! et les effets de la §GVolonté Chat Block§! parmi notre population et nos dirigeants diminueront."
    giga_blokkat_join.2012.e.response:99 "Regrettable"

    giga_blokkat_join.2013.name:99 "Les §YChat Block-Protokols§!"
    giga_blokkat_join.2013.desc:99 "Et ainsi, nous avons officiellement décidé de nous embarquer dans un grand voyage pour prouver aux Chats Blocks que notre civilisation est digne de rejoindre leur collectif.\n\nSuite au dialogue de §YChat Block Béhémoth§!, les Chats Blocks nous ont envoyé notre premier « défi », quelque chose qu'ils appellent les §EÉquations Chat Blockiliennes§!, un ensemble de formules mathématiques extrêmement complexes décrivant les aspects fondamentaux de la civilisation Chat Block et de son infrastructure, en particulier le §YChat Blockwork§!.\n\nLa version qu'ils nous ont envoyée est incomplète, et §YChat Block Béhémoth§! a demandé que nous comprenions ces équations par nous-mêmes et les complétions avant de faire rapport aux Chats Blocks.\n\nCela devrait, selon eux, nous permettre de comprendre et d'assimiler pleinement la complexité pure de la technologie Chat Block afin de garantir que notre éventuelle ascension dans leur collectif soit aussi fluide que possible.\n\nConsidérant que §YChat Block Béhémoth§! a déclaré que nous devrions rassembler §Y[blokkat_country.blokkat_ascension_cost]§! £energy£ pour compléter les §YChat Block-Protokols§!, il serait sage de commencer à investir dans des infrastructures génératrices d'énergie dès maintenant."
    giga_blokkat_join.2013.a:99 "Noté."
    giga_blokkat_join.2013.a.tooltip:99 "§G+5 %§! §BVolonté scientifique§!\n§G+5 %§! §PVolonté militaire§!\n§G+10 %§! §HVolonté gouvernementale§!\n§G+10 %§! §MVolonté de la population§!\n\nUn nouveau §BProjet de recherche Chat Block§! est maintenant disponible dans le §YBureau de recherche Chat Block§!."

    giga_blokkat.3000.joinblokkats3:99 "Résoudre les §EÉquations Chat Blockiliennes§! | §Y30§! $blokkat_knowledge$"
    giga_blokkat.3000.joinblokkats3.tooltip:99 "Les Chats Blocks nous ont envoyé des versions incomplètes de leurs §EÉquations Chat Blockiliennes§!, un ensemble d'équations complexes décrivant les principes fondamentaux derrière la plupart de leur technologie. Il est primordial que nous les résolvions afin de prouver que nous sommes pleinement capables de comprendre comment fonctionne leur civilisation.\n\n§YCela nous rapprochera de la réussite des Chat Block-Protokols. Les étapes suivantes du projet nécessiteront des $blokkat_knowledge$ supplémentaires.§!"

    giga_blokkat_join.2020.name:99 "§YChat Block-Protokols§! - Les §EÉquations Chat Blockiliennes§!"
    giga_blokkat_join.2020.desc:99 "Les §EÉquations Chat Blockiliennes§! comprennent trois ensembles de formules mathématiques complexes décrivant les principes sous-jacents de la §BPrimauté énergétique Chat Block§!, la §GLogistique intergalactique Chat Block§! et la §HGénération de particules à l'échelle de Planck Chat Block§!, qui reposent toutes fortement sur la manipulation de l'espace hyperdimensionnel.\n\nRésoudre ces équations améliorera non seulement considérablement notre compréhension de l'univers, mais montrera sans aucun doute aux Chats Blocks nos capacités et les convaincra, espérons-le, que nous sommes dignes de passer leurs §YChat Block-Protokols§!.\n\nComme ces équations sont extrêmement complexes et reposent sur plusieurs principes mathématiques mal compris, le §YBureau de recherche Chat Block§! a conçu le coûteux bâtiment §YInstallation de recherche Protokol§! à construire sur nos mondes, qui drainera une partie de notre recherche ainsi que de l'énergie et des ressources rares, mais augmentera en retour notre vitesse de recherche §YChats Blocks§!."
    giga_blokkat_join.2020.a:99 "Compris. Commençons le travail immédiatement."

    giga_blokkat_join.2020.a.tooltip:99 "Nous gagnons la capacité de construire l'§YInstallation de recherche Protokol§! sur nos mondes, qui accélérera notre vitesse de recherche §YChats Blocks§! à la fois pour les §EÉquations Chat Blockiliennes§! et pour les étapes suivantes des §YChat Block-Protokols§!.\n\n$cant_do_another_blokkat_project_tech_tooltip$"

    blokkatsprotocols:99 "Chat Block-Protokols"
    blokkatsprotocols_desc:99 "Les défis posés par les Chat Block-Protokols sont sans précédent pour notre civilisation. Nous devons intensifier nos efforts de recherche si nous voulons les surmonter."

    giga_tech_blokkat_energy_transfer:99 "§EÉquations Chat Blockiliennes§! - §BPrimauté énergétique§!"
    giga_tech_blokkat_energy_transfer_desc:99 "Les Chats Blocks ont depuis longtemps converti leurs technologies pour être basées sur l'aspect le plus fondamental de l'univers : l'énergie. Ils utilisent le Chat Blockwork pour transférer de vastes quantités d'énergie sur de grandes distances et façonner ensuite cette énergie en tout ce dont ils peuvent avoir besoin. Comprendre comment baser une civilisation entière sur la ressource la plus basique de l'univers est primordial pour résoudre les §EÉquations Chat Blockiliennes§!."
    blokkat_protocols_physics_title:99 "Connaissance des Chats Blocks : §G+2§!"

    giga_tech_blokkat_intergalactic_logistics:99 "§EÉquations Chat Blockiliennes§! - §GLogistique intergalactique§!"
    giga_tech_blokkat_intergalactic_logistics_desc:99 "Comment coordonner correctement des opérations de récolte réparties sur une partie significative de l'univers observable impliquant la masse-énergie de plusieurs galaxies transportée sur des distances intergalactiques ? Quand on gère une opération aussi grande que celle des Chats Blocks, l'inefficacité est simplement inacceptable et la logistique doit donc être affinée à la perfection."
    blokkat_protocols_society_title:99 "Connaissance des Chats Blocks : §G+2§!"

    giga_tech_blokkat_subplanck_engineering:99 "§EÉquations Chat Blockiliennes§! - §HGénération de particules à l'échelle de Planck§!"
    giga_tech_blokkat_subplanck_engineering_desc:99 "C'est un fait connu que les Chats Blocks ne s'appuient plus sur la matière baryonique pour fonctionner, utilisant plutôt de l'énergie brute pour créer de nouveaux types de particules élémentaires mieux adaptées à leurs opérations. Ces particules peuvent ainsi être extrêmement petites et permettre à leurs dispositifs d'être bien, bien plus denses que ceux construits avec des particules conventionnelles. Si nous voulons comprendre comment ils ont accompli un tel exploit, nous devons étudier comment les Chats Blocks utilisent le Chat Blockwork pour générer spontanément des particules capables de projeter leur volonté jusqu'à l'échelle de Planck."
    blokkat_protocols_engineering_title:99 "Connaissance des Chats Blocks : §G+2§!"

    needs_engineering_blokkat_project:99 "Nous devons avoir complété le §BProjet de recherche Chat Block§! §YInvestiguer§! l'§HIngénierie matérielle§! Chat Block."

    building_giga_blokkat_hyperdimensional_research:99 "Installation de recherche Protokol"
    building_giga_blokkat_hyperdimensional_research_desc:99 "Au sein des colossales installations de recherche de ce bâtiment, l'élite intellectuelle de notre nation travaille sans relâche pour surmonter les défis que nous imposent les Chat Block-Protokols."

    mod_category_blokkatsprotocols_research_speed_mult:99 "Vitesse de recherche Chat Block-Protokols"

    giga_blokkat_join.2022.name:99 "§EÉquations Chat Blockiliennes§! entièrement résolues"
    giga_blokkat_join.2022.desc:99 "Enfin ! Les esprits les plus brillants de notre nation ont finalement réussi à assembler les dernières pièces manquantes des §EÉquations Chat Blockiliennes§!, nous fournissant une nouvelle compréhension des technologies des Chats Blocks.\n\nCe n'est que maintenant que nous réalisons vraiment à quel point l'échelle et la portée absolues de leurs opérations de récolte sont ahurissantes. Des galaxies entières de masse-énergie sont constamment expédiées sur des distances intergalactiques pour alimenter la construction de ce qui est peut-être la plus grande mégastructure de l'univers.\n\nMaintenant nous voyons, nous voyons avec une parfaite clarté la beauté de tout cela. Un complexe industriel parfaitement orchestré construit pour délibérément démanteler l'univers tel que nous le connaissons et le remodeler en quelque chose de bien plus grand.\n\nC'est impressionnant de penser que nous aussi, pourrions bientôt faire partie de cette grande entreprise qui dépasse de loin les conflits mesquins de notre minuscule galaxie. Déjà nos diplomates ont renvoyé les résultats des équations aux Chats Blocks et toute notre nation attend avec impatience leur réponse.\n\nVeuillez noter que les §YInstallations de recherche Protokol§! que nous avons construites seront toujours utiles pour les prochaines étapes des §YChat Block-Protokols§!."
    giga_blokkat_join.2022.a:99 "Bientôt, nous ne ferons qu'un !"
    giga_blokkat_join.2022.a.tooltip:99 "§G+10 %§! §BVolonté scientifique§!\n§G+5 %§! §PVolonté militaire§!\n§G+10 %§! §HVolonté gouvernementale§!\n§G+10 %§! §MVolonté de la population§!\n\nUn nouveau §BProjet de recherche Chat Block§! est maintenant disponible dans le §YBureau de recherche Chat Block§!."

    giga_blokkat_join.2023.name:99 "Les Chats Blocks"
    giga_blokkat_join.2023.desc:99 "§G(ÉTABLISSEMENT DES COMMUNICATIONS)\n(ANALYSE DES CONSCIENCES DES DESTINATAIRES)\n(ÉVALUATION : INTENTIONS TOUJOURS AUTHENTIQUES)§!\n\nSalutations, §Y[ROOT.GetSpeciesNamePlural]§!. Vous avez résolu et complété avec succès les §YÉquations Chat Blockiliennes§! que nous vous avions données, un exploit impressionnant compte tenu de votre niveau actuel de développement technologique.\n\nCela prouve effectivement que le potentiel intellectuel de votre civilisation est suffisamment élevé pour que nous envisagions d'incorporer votre nation dans le collectif Chat Block.\n\nAinsi, nous vous fournirons maintenant les schémas d'un §HNoeud d'alimentation Chat Blockwork§!, que vous devrez comprendre puis construire sur §Ychacun de vos mondes§!.\n\nCela préparera la voie pour l'intégration de votre civilisation dans notre collectif en permettant au §YChat Blockwork§! d'opérer sur vos mondes et de permettre à votre infrastructure de gérer la quantité pure d'énergie requise pour activer le §PPylône Chat Blockwork§! et compléter le §YProcessus de Chat Blockification§!."
    giga_blokkat_join.2023.a:99 "Compris."
    giga_blokkat_join.2023.a.tooltip:99 "Un nouveau §BProjet de recherche Chat Block§! est maintenant disponible dans le §YBureau de recherche Chat Block§!."

    giga_blokkat.3000.joinblokkats4:99 "Établir le réseau de §HNoeuds d'alimentation Chat Blockwork§! | §Y40§! $blokkat_knowledge$"
    giga_blokkat.3000.joinblokkats4.tooltip:99 "Les Chats Blocks nous ont maintenant envoyé des plans pour des constructions §HNoeuds d'alimentation Chat Blockwork§! qui permettront à leur §YChat Blockwork§! de se connecter à notre infrastructure planétaire.\n\n§YCela nous rapprochera de la réussite des Chat Block-Protokols. Les étapes suivantes du projet nécessiteront des $blokkat_knowledge$ supplémentaires.§!"

    giga_tech_blokkat_blokkwork_power_node:99 "§HNoeuds d'alimentation Chat Blockwork§! - Connexion directe au Chat Blockwork"
    giga_tech_blokkat_blokkwork_power_node_desc:99 "Avec notre nouvelle compréhension de la technologie Chat Block accordée par les §EÉquations Chat Blockiliennes§!, nous sommes maintenant prêts à véritablement préparer notre ascension en établissant l'infrastructure nécessaire pour nous connecter au §YChat Blockwork§!. Bien que ces noeuds d'alimentation ne nous permettront pas d'accéder à toute l'étendue du Chat Blockwork pour l'instant (car il n'est pas encore complètement établi sur notre galaxie), ils nous permettront néanmoins de grandement rationaliser nos opérations planétaires en générant notre propre Chat Blockwork à travers notre empire."

    building_giga_blokkat_blokkwork_node:99 "Noeud d'alimentation Chat Blockwork"
    building_giga_blokkat_blokkwork_node_desc:99 "Ces constructions incroyablement complexes et tout aussi massives percent l'espace de dimension supérieure et connectent directement notre infrastructure planétaire au bout du §YChat Blockwork§! au sein de notre galaxie, préparant le terrain pour une intégration plus poussée dans le collectif Chat Block. Bien que nous n'ayons pas encore un véritable accès au Chat Blockwork, car les Chats Blocks n'ont pas encore complètement étendu sa couverture à notre galaxie, ces bâtiments nous permettent de créer efficacement notre propre version miniature du Chat Blockwork, augmentant considérablement l'efficacité des opérations planétaires.\n\n§YAccorde §G+1 %§! §HVolonté de la population§! lors de la construction.§!"

    giga_blokkat_join.2030.name:99 "§YChat Block-Protokols§! - Les §HNoeuds d'alimentation Chat Blockwork§!"
    giga_blokkat_join.2030.desc:99 "Les §YChats Blocks§! nous ont donné des plans pour des §HNoeuds d'alimentation Chat Blockwork§! complexes, capables d'atteindre directement le §YChat Blockwork§! et d'établir une connexion stable avec lui.\n\nBien que les plans soient assez complets, nous devrons mener des recherches approfondies sur eux si nous voulons comprendre comment intégrer ces constructions béhémoth dans notre infrastructure planétaire.\n\nEnsuite, les §YChat Block-Protokols§! exigeront que nous construisions un de ces §HNoeuds d'alimentation Chat Blockwork§! sur §Ychacun de nos mondes possédés§! ce qui, selon les Chats Blocks, permettra l'intégration complète de notre civilisation dans le collectif Chat Block une fois que leur §PPylône Chat Blockwork§! sera éventuellement construit et que le Chat Blockwork gagnera une couverture complète sur notre galaxie."
    giga_blokkat_join.2030.a:99 "Pas de temps à perdre !"
    giga_blokkat_join.2030.a.tooltip:99 "Nous devrons rechercher la §YTechnologie§! associée et compléter la construction des §HNoeuds d'alimentation Chat Blockwork§! avant de pouvoir entreprendre un autre §BProjet de recherche Chat Block§!."

    giga_blokkat_join.2032.name:99 "Réseau de §HNoeuds d'alimentation Chat Blockwork§! complété"
    giga_blokkat_join.2032.desc:99 "Chacun de nos mondes a maintenant été amélioré avec un §HNoeud d'alimentation Chat Blockwork§! de pointe. Bien que pas encore vraiment connectée au véritable §YChat Blockwork§!, la génération d'un Chat Blockwork miniature au sein de notre empire grâce à ces noeuds a grandement amélioré la coordination entre toutes les colonies et rapproché notre peuple.\n\nLes Chats Blocks semblent avoir remarqué que nous avons complété cette étape et ont envoyé une transmission directe à nos diplomates afin de discuter de l'étape finale des §YChat Block-Protokols§!."
    giga_blokkat_join.2032.a:99 "À l'écran."

    giga_blokkat_miniblokkwork:99 "Pseudo-Chat Blockwork"
    giga_blokkat_miniblokkwork_desc:99 "L'achèvement du réseau de §HNoeuds d'alimentation Chat Blockwork§! nous permet de créer efficacement notre propre « Pseudo-Chat Blockwork » pour améliorer la coordination entre tous les coins de notre empire."

    giga_blokkat_join.2033.name:99 "Les Chats Blocks"
    giga_blokkat_join.2033.desc:99 "§G(ÉTABLISSEMENT DES COMMUNICATIONS)\n(ANALYSE DES CONSCIENCES DES DESTINATAIRES)\n(ÉVALUATION : INTENTIONS AUTHENTIQUES)§!\n\nLes lectures du Chat Blockwork indiquent que vous avez complété avec succès la construction d'un §HNoeud d'alimentation Chat Blockwork§! à travers votre civilisation, §Y[ROOT.GetSpeciesNamePlural]§!. Un grand accomplissement.\n\nMaintenant tout ce qu'il reste à faire est de construire le §PPylône Chat Blockwork§! n'importe où dans votre espace. Cette grande mégastructure étendra pleinement le Chat Blockwork pour couvrir vraiment notre galaxie entière et, une fois que l'énergie nécessaire y aura été injectée, élèvera votre civilisation afin de permettre à votre espèce de ne faire qu'un avec le collectif Chat Block.\n\nNous recommandons de construire le §PPylône Chat Blockwork§! près ou dans votre système capital pour une efficacité maximale dans le §YProcessus de Chat Blockification§!. N'oubliez pas que §Y[blokkat_country.blokkat_ascension_cost]§! £energy£ seront nécessaires pour activer le dispositif une fois qu'il sera complet."
    giga_blokkat_join.2033.a:99 "Nous sommes si proches."
    giga_blokkat_join.2033.a.tooltip:99 "§G+5 %§! §BVolonté scientifique§!\n§G+5 %§! §PVolonté militaire§!\n§G+15 %§! §HVolonté gouvernementale§!\n§G+10 %§! §MVolonté de la population§!\n\nUn nouveau §BProjet de recherche Chat Block§! est maintenant disponible dans le §YBureau de recherche Chat Block§!."

    giga_blokkat.3000.joinblokkats5:99 "Construire le §PPylône Chat Blockwork§! | §Y50§! $blokkat_knowledge$"
    giga_blokkat.3000.joinblokkats5.tooltip:99 "L'avant-dernière étape de notre ascension est de construire un §PPylône Chat Blockwork§! n'importe où dans notre empire pour projeter le Chat Blockwork sur notre galaxie. Les §HNoeuds d'alimentation Chat Blockwork§! devraient alors, selon les Chats Blocks, permettre l'ascension complète de notre civilisation dans le collectif Chat Block, bien que le dispositif nécessitera £energy£§Y[blokkat_country.blokkat_ascension_cost]§! pour être activé.\n\n§YCela nous rapprochera de la réussite des Chat Block-Protokols. Les étapes suivantes du projet nécessiteront des $blokkat_knowledge$ supplémentaires.§!"

    giga_tech_blokkat_gigarelay_frame:99 "§PPylône Chat Blockwork§! - Cadre hyperbranaire"
    giga_tech_blokkat_gigarelay_frame_desc:99 "Le cadre du Pylône doit être une construction 6-dimensionnelle complexe intégrée dans le tissu même de la réalité. Un tel degré de sophistication est requis si nous voulons apporter toute la puissance du Chat Blockwork dans notre galaxie."

    giga_tech_blokkat_gigarelay_core:99 "§PPylône Chat Blockwork§! - Coeur de puissance dimensionnel"
    giga_tech_blokkat_gigarelay_core_desc:99 "Le coeur de puissance du Pylône fournira un lien direct vers le Chat Blockwork lui-même et permettra le flux d'énergie quasi infinie du Chat Blockwork vers notre réseau de Noeuds d'alimentation Chat Blockwork."

    giga_blokkat_join.2040.name:99 "§YChat Block-Protokols§! - Le §PPylône Chat Blockwork§!"
    giga_blokkat_join.2040.desc:99 "Le §PPylône Chat Blockwork§! sera la pierre angulaire de notre grande ascension dans le collectif Chat Block. Une fois achevée, cette puissante machine étendra le §YChat Blockwork§! pour couvrir véritablement notre galaxie entière et permettra aux Chats Blocks de commencer leur §YProcessus de Chat Blockification§!.\n\nCependant, pour l'instant nous ne pourrons construire que son §YSite de construction§! et devrons rechercher les technologies associées afin d'assembler son §YCadre hyperbranaire§! puis son §YCoeur de puissance dimensionnel§!. Une fois complet, un §BProjet de recherche Chat Block§! final pour activer le dispositif deviendra disponible, coûtant £energy£§Y[blokkat_country.blokkat_ascension_cost]§!.\n\nLes Chats Blocks ont déclaré que l'emplacement du Pylône deviendra l'emplacement central de notre civilisation après l'achèvement de l'ascension, et nous devrions donc choisir son emplacement avec sagesse, de préférence dans ou près de notre capitale actuelle."
    giga_blokkat_join.2040.a:99 "Incroyablement proche. La galaxie ne sera bientôt plus que poussière devant nous !"
    giga_blokkat_join.2040.a.tooltip:99 "Nous devrons compléter la construction du §PPylône Chat Blockwork§! avant de pouvoir entreprendre un autre §BProjet de recherche Chat Block§!."

    blokkat_gigarelay_0_MEGASTRUCTURE_DETAILS:99 "$giga_list_category_blokkat$ - $giga_list_category_special$\nApporte une couverture complète du §YChat Blockwork§! à la galaxie dans le cadre des §YChat Block-Protokols§!.\n§LUn dispositif pour permettre la Chat Blockification complète de notre civilisation.§!"

    blokkat_gigarelay_0:99 "Site de construction du Pylône Chat Blockwork"
    blokkat_gigarelay_0_DESC:99 "Le site de construction d'un grand dispositif capable de connecter notre galaxie au Chat Blockwork lui-même."

    blokkat_gigarelay_1:99 "Coeur de puissance du Pylône Chat Blockwork"
    blokkat_gigarelay_1_DESC:99 "Intégré dans la réalité elle-même, le coeur de puissance fournit un ancrage solide pour garantir que le flux d'énergie du Chat Blockwork reste sous contrôle."

    blokkat_gigarelay_2:99 "Cadre hyperbranaire du Pylône Chat Blockwork"
    blokkat_gigarelay_2_DESC:99 "Avec l'ajout du cadre hyperbranaire, le Pylône Chat Blockwork est maintenant structurellement complet. Tout ce dont il a besoin maintenant est un afflux suffisant d'énergie."

    blokkat_gigarelay_3:99 "Pylône Chat Blockwork"
    blokkat_gigarelay_3_DESC:99 "Le Pylône Chat Blockwork a été activé, établissant une connexion puissante au Chat Blockwork au sein de cette galaxie."

    blokkat_gigarelay_frame_title:99 "§HDébloque la mégastructure :§! Cadre hyperbranaire du Pylône"
    blokkat_gigarelay_core_title:99 "§HDébloque la mégastructure :§! Coeur de puissance dimensionnel du Pylône"

    giga_blokkat_join.2041.name:99 "Site de construction du Pylône Chat Blockwork construit"
    giga_blokkat_join.2041.desc:99 "Le site de construction du §PPylône Chat Blockwork§! a été achevé dans le système §Y[giga_system.GetName]§!. Sur cet échafaudage, nous construirons le grand dispositif qui, enfin, unira notre civilisation aux Chats Blocks jusqu'à la fin des temps.\n\nIl y a beaucoup à faire."
    giga_blokkat_join.2041.a:99 "On se rapproche..."
    giga_blokkat_join.2041.a.tooltip:99 "§G+5 %§! §BVolonté scientifique§!\n§G+5 %§! §HVolonté gouvernementale§!"

    giga_blokkat_join.2042.name:99 "Cadre hyperbranaire du Pylône Chat Blockwork construit"
    giga_blokkat_join.2042.desc:99 "Le cadre hyperbranaire du §PPylône Chat Blockwork§! a été construit. Cette merveille mégastructurelle soigneusement élaborée garantira que notre réalité soit capable de gérer la quantité pure d'énergie injectée par le Chat Blockwork dans notre galaxie.\n\nMaintenant, tout ce qui reste est d'assembler le coeur de puissance du dispositif et de l'activer, une fois pour toutes."
    giga_blokkat_join.2042.a:99 "On y est presque maintenant."
    giga_blokkat_join.2042.a.tooltip:99 "§G+5 %§! §BVolonté scientifique§!\n§G+5 %§! §MVolonté de la population§!"

    giga_blokkat_join.2043.name:99 "Pylône Chat Blockwork complété"
    giga_blokkat_join.2043.desc:99 "Avec l'ajout de son coeur de puissance hyperdimensionnel l'attachant au §YChat Blockwork§! lui-même, le §PPylône Chat Blockwork§! est maintenant complet.\n\nL'étape finale de notre grande entreprise pour rejoindre les Chats Blocks est maintenant d'activer le dispositif en utilisant £energy£§Y[blokkat_country.blokkat_ascension_cost]§!. Cela peut maintenant être fait via le §YBureau de recherche Chat Block§!, quand nous serons prêts."
    giga_blokkat_join.2043.a:99 "Plus qu'une étape."
    giga_blokkat_join.2043.a.tooltip:99 "§G+10 %§! §BVolonté scientifique§!\n§G+5 %§! §HVolonté gouvernementale§!\n§G+5 %§! §MVolonté de la population§!"

    blokkat_requires_60_knowledge:99 "Nous devons avoir au moins 60 $blokkat_knowledge$."

    giga_blokkat.3000.joinblokkats6:99 "Compléter les §YProtokols§! | §Y60§! $blokkat_knowledge$ & £energy£§Y[blokkat_country.blokkat_ascension_cost]"
    giga_blokkat.3000.joinblokkats6.tooltip:99 "Avec les §EÉquations Chat Blockiliennes§! résolues, un réseau de §HNoeuds d'alimentation Chat Blockwork§! opérationnel et le §PPylône Chat Blockwork§! construit, tout est en place pour que nous complétions les §YChat Block-Protokols§! une fois pour toutes.\n\n§YNous rejoindrons les Chats Blocks, au détriment du reste de la galaxie.§!"

    giga_blokkat_join.2044.name:99 "Les Chats Blocks"
    giga_blokkat_join.2044.desc:99 "§G(ÉTABLISSEMENT DES COMMUNICATIONS)\n(ANALYSE DES CONSCIENCES DES DESTINATAIRES)\n(ÉVALUATION : PRÊTS POUR LA CHAT BLOCKIFICATION)§!\n\nFélicitations pour avoir complété le §PPylône Chat Blockwork§!, §Y[ROOT.GetSpeciesNamePlural]§!. Tout ce qu'il vous reste à faire maintenant est d'injecter les §Y[blokkat_country.blokkat_ascension_cost]§! £energy£ dedans et les §YChat Block-Protokols§! seront complets.\n\nUne fois cela fait, les consciences et l'essence de vos §YDirigeants§! seront transférées dans le §YChat Blockwork§! et se verront accorder des §YChâssis Chat Block§!. L'essence de vos populations sera amalgamée en une §YEssence Chat Block§! bien plus puissante et téléversée dans le §YChat Blockwork§!.\n\nVous recevrez, comme indiqué précédemment, le contrôle total des opérations de récolte de §YGalaxie CE-1461§! et serez §Ychargés de les compléter§!."
    giga_blokkat_join.2044.a:99 "Enfin ! Nous deviendrons bientôt quelque chose de tellement plus grand."
    giga_blokkat_join.2044.a.tooltip:99 "Un nouveau §BProjet de recherche Chat Block§! est maintenant disponible dans le §YBureau de recherche Chat Block§!."

    blokkat_bureau_fight_blokkats_desc:99 "Les §YDémanteleurs Chat Block§! sont une menace existentielle pour la galaxie entière. Si nous voulons riposter contre eux, nous devons amasser autant de §GConnaissance des Chats Blocks§! que possible.\n\nElle peut être acquise en §Yrecherchant des répétables spécifiques§!, §Ycomplétant diverses tâches§! et §Yentreprenant des projets spéciaux§! chaque fois que nous en avons l'occasion.\n\nNotre objectif principal est d'accumuler assez de §GConnaissance des Chats Blocks§! afin de concevoir le §YDéstabilisateur hyperdimensionnel§!, une §Ygigastructure§! théoriquement capable d'abattre le bouclier du §YChat Block-Vester§!. Il serait sage d'investir dans des installations de recherche rapidement."

    blokkat_bureau_join_blokkats_desc:99 "Les §YDémanteleurs Chat Block§! sont magnifiques et fascinants. Pourquoi les combattre quand nous pouvons nous efforcer de les rejoindre dans leur quête pour remodeler l'univers en perfection ? Si nous voulons le faire, nous devrons amasser autant de §GConnaissance des Chats Blocks§! que possible.\n\nElle peut être acquise en §Yrecherchant des répétables spécifiques§!, §Ycomplétant diverses tâches§! et §Yentreprenant des projets spéciaux§! chaque fois que nous en avons l'occasion.\n\nNotre objectif principal est d'accumuler assez de §GConnaissance des Chats Blocks§! afin de trouver comment potentiellement rejoindre les Chats Blocks dans leurs entreprises. Il serait sage d'investir dans des installations de recherche rapidement."

    blokkat_bureau_knowledge_fight_blokkats_desc:99 "La §GConnaissance des Chats Blocks§! est la somme de notre connaissance combinée concernant les Chats Blocks et leur technologie. Rassembler autant de connaissances que possible est crucial si nous souhaitons riposter contre le §YChat Block-Vester§! et son bouclier."

    blokkat_bureau_knowledge_join_blokkats_desc:99 "La §GConnaissance des Chats Blocks§! est la somme de notre connaissance combinée concernant les Chats Blocks et leur technologie. Rassembler autant de connaissances que possible est crucial si nous souhaitons trouver un moyen de rejoindre les Chats Blocks dans leur grande entreprise pour remodeler l'univers."

    giga_blokkat_mothership_player:99 "Chat Block-Vester"
    giga_blokkat_mothership_player_desc:99 "Chat Block-Vesters"

    BLOKKAT_MOTHERSHIP_PLAYER:99 "Coeur"

    giga_blokkat_join.5000.name:99 "Réticence envers les Chats Blocks"
    giga_blokkat_join.5000.desc:99 "« Le gouvernement choisit de se ranger du côté des envahisseurs omnicides », « [ROOT.GetRulerName] est-il un infiltré Chat Block ? », « Les scientifiques du Bureau de recherche Chat Block deviennent fous de pouvoir » et des centaines d'autres critiques de ce genre attaquant notre décision concernant les Chats Blocks ont pris le contrôle des gros titres sur §Y[ROOT.capital_scope.GetName]§! et dans le reste du §Y[ROOT.GetName]§!.\n\nComme on pouvait s'y attendre, notre population est à la fois choquée et mécontente de notre décision d'apparemment essayer de rejoindre les envahisseurs extragalactiques qui dévorent actuellement notre galaxie entière sans égard pour ses habitants.\n\nDéjà, des manifestations de masse ont lieu sur la plupart de nos mondes et presque toutes les couches de notre société sont en émoi total suite à l'annonce de notre décision. Il est donc évident que nous devrons entreprendre des efforts considérables si nous voulons convaincre notre population et notre direction que rejoindre les Chats Blocks est évidemment la bonne chose à faire.\n\nL'acceptation de notre plan par notre population, appelée §GVolonté Chat Block§!, va causer des §Rpénalités sévères§! à notre empire tant qu'elle reste basse. Elle est divisée entre §PVolonté militaire§!, §BVolonté scientifique§!, §HVolonté gouvernementale§! et §MVolonté de la population§!, représentant l'opinion de chaque partie de notre empire, faisant une moyenne en §GVolonté globale§!.\n\nNous pourrons surveiller la §GVolonté Chat Block§! via le §YBureau de recherche Chat Block§!."
    giga_blokkat_join.5000.a:99 "Nous prouverons à ces imbéciles qu'ils ont tort !"
    giga_blokkat_join.5000.a.tooltip:99 "La §GVolonté Chat Block§! est maintenant active et impactera sérieusement notre empire jusqu'à ce qu'elle soit résolue.\n\nNous pouvons suivre les différentes valeurs de la §GVolonté Chat Block§! en utilisant le bouton « Gérer Vol. » au-dessus du §YBureau de renseignement Chat Block§!.\n\nDes §GÉdits de Volonté§! peuvent être promulgués pour gérer une volonté basse.\nNous pouvons également la voir en utilisant un édit si le bouton ne s'affiche pas."

    giga_blokkat_join.5001.name:99 "Les dirigeants entreprennent des manifestations de masse !"
    giga_blokkat_join.5001.desc:99 "Tout comme notre population générale, certains des esprits les plus brillants de notre empire ne veulent pas accepter notre choix de nous ranger du côté des Chats Blocks et ont par conséquent décidé d'entamer des manifestations prolongées.\n\nCes dissidents, refusant de s'engager pleinement dans leurs devoirs pour exprimer leur mécontentement envers nos plans, ont déclaré que seul le renversement complet de ce « plan insensé » assurerait leur retour à la loyauté.\n\nÉvidemment, nous pourrions simplement renvoyer ces esprits faibles, ou tenter de les convaincre en dépensant de l'§YUnité§! et de l'§YInfluence§! sur une base par dirigeant via l'onglet volonté du §YBureau de recherche Chat Block§!. La direction du Bureau nous a assuré que, si notre plan commençait à montrer des signes prometteurs, certains de ces dirigeants changeraient sans doute d'avis et décideraient à nouveau de nous rejoindre, mais c'est, malheureusement, plus facile à dire qu'à faire..."
    giga_blokkat_join.5001.a:99 "Ils changeront d'avis... ou nous les y forcerons."
    giga_blokkat_join.5001.a.tooltip:99 "Environ §Y[ROOT.blokkat_willingness_leader_strike_percent] %§! de notre §YBassin de dirigeants§! gagne le trait §YGrève anti-Chat Block§!, qui impactera sévèrement leur productivité. Le pourcentage de dirigeants manifestants est plus élevé plus nous sommes §YÉgalitaires§!.\n\nCertains pourraient nous rejoindre à mesure que notre plan progresse, ou nous pouvons essayer de les convaincre via l'onglet volonté du §YBureau de recherche Chat Block§!."

    giga_blokkat_join.5500.willingness_global_count:99 "§GVolonté Chat Block globale§! : §Y[ROOT.blokkat_willingness_global_value] %§!"
    giga_blokkat_join.5500.willingness_military_count:99 "§PVolonté militaire§! : §Y[ROOT.blokkat_willingness_military_value] %§!"
    giga_blokkat_join.5500.willingness_science_count:99 "§BVolonté scientifique§! : §Y[ROOT.blokkat_willingness_science_value] %§!"
    giga_blokkat_join.5500.willingness_government_count:99 "§HVolonté gouvernementale§! : §Y[ROOT.blokkat_willingness_government_value] %§!"
    giga_blokkat_join.5500.willingness_population_count:99 "§MVolonté de la population§! : §Y[ROOT.blokkat_willingness_population_value] %§!"

    blokkat_military_willingness_desc:99 "§GAugmentée par :§!\nTuer des §YVaisseaux Chat Block§! & capturer des §YChats Blocks§!\nRechercher des §YComposants Chat Block§!\n§RDiminuée par :§!\nPerdre des §YVaisseaux de guerre célestes§!/§YHerculéens§! face aux Chats Blocks"
    giga_blokkat_join.5500.willingness_military_count.tooltip:99 "Capturer un §YChat Block solitaire§! : §G+3,5 %§!\nDétruire un §YChat Block-Expulseur§! : §G+0,02 %§!\nDétruire un §YChat Block-Gardien§! : §G+0,06 %§!\nDétruire un §YChat Block-Démantèleur§! : §G+10 %§!\nDétruire un §YChat Block-terminator§! : §G+20 %§!\nRechercher tout §YComposant Chat Block§! : §G+2,5 %§!\nPerdre une §YLune d'attaque§! : §R-0,1 %§!\nPerdre un §YPlanétovaisseau Béhémoth§! : §R-0,5 %§!\nPerdre un §YVaisseau-système stellaire§! : §R-2,5 %§!\nPerdre un §YHerculéen§! : §R-5 %§!"

    blokkat_science_willingness_desc:99 "§GAugmentée par :§!\nRechercher des §YTechnologies Chat Block§!\nÉtudier des §YChats Blocks captifs§!"
    giga_blokkat_join.5500.willingness_science_count.tooltip:99 "Rechercher toute §YTechnologie Chat Block§! : §G+1,5 %§!\nÉtudier un §YChat Block captif§! une fois : §G+2 %§!"

    blokkat_population_willingness_desc:99 "§GAugmentée par :§!\nConstruire des §YNoeuds d'alimentation Chat Blockwork§!\n§RDiminuée par :§!\nPerdre des §YPlanètes§! face aux Chats Blocks"
    giga_blokkat_join.5500.willingness_population_count.tooltip:99 "Construire un §YNoeud d'alimentation Chat Blockwork§! : §G+1 %§!\nPerdre §Y1 pop§! face aux Chats Blocks : §R-0,05 %§!"

    blokkat_government_willingness_desc:99 "§GAugmentée par :§!\nReprogrammer des §YChats Blocks captifs§!\n§RDiminuée par :§!\nPerdre des §YPlanètes§! face aux Chats Blocks"
    giga_blokkat_join.5500.willingness_government_count.tooltip:99 "Reprogrammer un §YChat Block captif§! : §G+5 %§!\nPerdre §Y1 pop§! face aux Chats Blocks : §R-0,05 %§!"

    giga_contact_blokkats_willingness_tooltip:99 "Gérer la §GVolonté Chat Block§!..."
    giga_blokkat_join.5500.a:99 "Quitter."

    giga_blokkat_join.5500.name:99 "Volonté Chat Block"
    giga_blokkat_join.5500.desc:99 "La §GVolonté Chat Block§! représente à quel point notre population est disposée à mettre en oeuvre notre plan de négocier et possiblement rejoindre les Chats Blocks, divisée entre notre §PMilitaire§!, §BDépartement scientifique§!, §HGouvernement§! et §MPopulation§!, avec la §GVolonté Chat Block globale§! étant la moyenne des 4. Commençant à §Y0 %§!, elle causera de sévères §Rpénalités§!, mais si elle atteint §Y100 %§!, l'impact sera annulé. Elle commencera à accorder des §Gbonus§! si elle dépasse §Y100 %§! et peut aussi devenir négative, augmentant encore les pénalités. Plusieurs §YÉdits§! et §YDécisions§! peuvent être utilisés pour augmenter tous les types de Volonté en plus des méthodes décrites ci-dessous.\n§BSurvole une valeur de Volonté pour voir les valeurs exactes concernant le gain de Volonté. Clique sur une pour rafraîchir les valeurs."

    giga_blokkat_blokkat_willingness_global:99 "Volonté Chat Block globale"
    giga_blokkat_blokkat_willingness_global_desc:99 "La décision de se ranger du côté des Chats Blocks a un impact profond sur notre civilisation."

    giga_blokkat_blokkat_willingness_science:99 "Volonté Chat Block scientifique"
    giga_blokkat_blokkat_willingness_science_desc:99 "La décision de se ranger du côté des Chats Blocks a un impact profond sur notre civilisation."

    giga_blokkat_blokkat_willingness_military:99 "Volonté Chat Block militaire"
    giga_blokkat_blokkat_willingness_military_desc:99 "La décision de se ranger du côté des Chats Blocks a un impact profond sur notre civilisation."

