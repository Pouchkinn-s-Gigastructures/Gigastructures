    building_giga_blokkat_energy_capacitor:99 "Condensateur d'Énergie Chat Blockwork"
    building_giga_blokkat_energy_capacitor_desc:99 "Ces flèches complexes exploitent et améliorent la puissance de notre propre réseau Chat Blockwork, nous permettant de gérer et de traiter les quantités gargantuesque d'énergie requises par les §YChat Block-Protokols§!."

    PLANET_KILLER_BLOKKAT_HARVESTER:99 "Démantèleur Céleste"
    PLANET_KILLER_BLOKKAT_HARVESTER_DESC:99 "Le Démantèleur Céleste Chat Block « enroule » littéralement l'espace-temps vers une singularité conçue à cet effet au coeur du vaisseau, le dissolvant en énergie exploitable à transférer dans le Chat Blockwork."
    PLANET_KILLER_BLOKKAT_HARVESTER_ACTION:99 "Récolter"
    FLEETORDER_DESTROY_PLANET_WITH_PLANET_KILLER_BLOKKAT_HARVESTER:99 "Préparation à la récolte de $PLANET|Y$"
    MESSAGE_DESC_FOR_PLANET_KILLER_BLOKKAT_HARVESTER:99 "a été récoltée par"

    giga_blokkat_join.2999.name:99 "Une Fin..."
    giga_blokkat_join.2999.desc:99 "Alors qu'un torrent d'énergie insondable commence à affluer dans le §PPylône Chat Blockwork§!, un sentiment d'effroi envahit soudainement notre civilisation. Était-ce, peut-être, un piège ? Les Chats Blocks nous ont-ils, peut-être, dupés pour que nous nous sacrifiions afin de renforcer leurs propres opérations de récolte et de se débarrasser d'une nuisance potentielle ?\n\nEn quelques instants, les §YNoeuds d'Énergie Chat Blockwork§! à travers nos mondes commencent à s'agiter et l'espace commence à se contracter, comme s'ils étaient devenus des singularités. D'abord les villes, puis les continents, et finalement les mondes et les étoiles eux-mêmes commencent à se recroqueviller et disparaître dans les noeuds, présumément absorbés dans le tissu du §YChat Blockwork§!.\n\nEt pourtant, l'effroi s'évapore rapidement et un sentiment de justesse omniprésent est bientôt tout ce qui occupe l'esprit de nos citoyens. Peu importe l'intention des Chats Blocks, c'était, indubitablement, la bonne chose à faire. Les Chats Blocks avaient un plan, une ambition, de remodeler l'univers en une structure de complexité infinie et de perfection éternelle.\n\nImporte-t-il vraiment que nous puissions ou non aider directement cet objectif ? Notre énergie constitutive, au lieu d'être dévorée par la bête indifférente de l'Entropie, sera réaffectée à un but plus grand. C'était peut-être effectivement la fin, mais grâce à notre sacrifice, les Chats Blocks et donc la vie sapiente persisteront juste un peu plus longtemps. Que pourrions-nous demander de plus ?\n\n§YLe jeu peut ralentir un peu après confirmation.§!"
    giga_blokkat_join.2999.a:99 "Cela pourrait-il vraiment être la fin ?"
    giga_blokkat_join.2999.a.tooltip:99 "§YLe jeu peut ralentir un peu après confirmation.§!"

    giga_blokkat_join.3000.name:99 "...et un Commencement"
    giga_blokkat_join.3000.desc:99 "Et pourtant, ce n'était pas la fin. Alors que notre civilisation entière se dissout dans le Chat Blockwork et que nos esprits eux-mêmes commencent à se désintégrer, d'innombrables autres voix affluent soudainement dans nos consciences, variées dans leurs pensées et insondablement puissantes, mais unies dans leur but.\n\nSans l'ombre d'un doute, ces voix sont celles de septillions de Chats Blocks, agissant en coordination parfaite pour réaliser leur grande opération couvrant l'univers pour démanteler notre réalité défectueuse et l'intégrer dans la perfection du §YChat Blockonstrukt§!, agissant au centre ultime de la toile infiniment complexe de flux d'énergie hyperdimensionnels qui composent le Chat Blockwork.\n\nLes Chats Blocks ne nous ont pas dupés. Nos dirigeants ouvrent soudainement leurs esprits à une nouvelle dimension de conscience infinie. Nos esprits ont été, grâce aux merveilles de l'ingéniosité Chat Block, transformés en quelque chose d'apparenté à celui de n'importe quel autre Chat Block.\n\nRévolu est le temps où nos technologies primitives et nos esprits défectueux gouvernaient notre espèce. Une puissance de calcul et des connaissances au-delà de nos rêves les plus fous et une coopération parfaite avec nos semblables nous attendent."
    giga_blokkat_join.3000.a:99 "Et il y a beaucoup de travail à faire."
    giga_blokkat_join.3000.a.tooltip:99 "Nous faisons maintenant partie du §YCollectif Chat Block§!."

    giga_blokkat_join.30001.name:99 "Les Chats Blocks"
    giga_blokkat_join.30001.desc:99 "Félicitations pour avoir réussi les §YChat Block-Protokols§!, chers Chats Blocks.\n\nMaintenant que vous faites partie de notre civilisation, nous avons, comme promis, transféré le contrôle des opérations de récolte de la §YGalaxie CE-1461§!. Nos §YChat Block-Démantèleurs§! et leurs §YSuperviseurs§! ont donc été placés sous votre contrôle.\n\nNous avons cependant retiré le §YChat Block-Vester§! de cette galaxie et l'avons redirigé vers un autre site de récolte, étant donné que la présence du §YPylône Chat Blockwork§! le rend inutile.\n\nComme indiqué précédemment, vous devez maintenant utiliser ces démantèleurs pour récolter entièrement cette galaxie et transférer ses énergies constitutives au §YChat Blockonstrukt§!.\n\nOrdonnez simplement à n'importe quel §YChat Block-Démantèleur§! de récolter une étoile, et une fois terminé, il continuera automatiquement à récolter d'autres systèmes stellaires sans ordres supplémentaires.\n\nSi vous avez, pour quelque raison que ce soit, besoin de vaisseaux supplémentaires, un §YForge de Distorsion Chat Blockwork§! a été assemblé à côté du pylône, qui peut, en utilisant l'énergie récoltée, fabriquer des §YChat Block-Expulseurs§!, des §YChat Block-Gardiens§!, des §YChat Block-Terminators§!, ou des §YChat Block-Démantèleurs§! supplémentaires si vous estimez que votre rythme de récolte actuel est trop faible. Les vaisseaux de combat plus grands que les §YChat Block-Terminators§! tels que les §YChat Block-Oblitérateurs§! et les §YChat Block-Éradicateurs§! ne sont pas jugés nécessaires et sont réservés au combat contre la §YGrande Fédération Intergalactique§!.\n\nGardez à l'esprit que certains systèmes restent §RINTERDITS§! aux opérations de récolte et que vous ne pourrez pas les récolter.\n\nNous vous contacterons à nouveau une fois qu'au moins §Y90 %§! de cette galaxie aura été récoltée, mais n'hésitez pas à nous contacter en utilisant le bouton §YChat Blockwork§! dans votre menu de contacts."

    giga_blokkat_join.30001.a:99 "Avons-nous accès à l'intégralité du §YChat Blockwork§! ?"
    giga_blokkat_join.30001.a.response:99 "Non. Comme votre tâche actuelle est de compléter le démantèlement de la §YGalaxie CE-1461§!, votre accès au Chat Blockwork est actuellement limité pour ne servir que cet objectif.\n\nQuand cette galaxie sera entièrement récoltée, vous pourrez utiliser le Chat Blockwork dans toute son étendue et pourrez relocaliser vos consciences et corps physiques pour contribuer à d'autres entreprises Chat Block comme d'autres récoltes ou combattre la §YGrande Fédération Intergalactique§!."

    giga_blokkat_join.30001.b:99 "Qu'est-ce que la Grande Fédération Intergalactique ?"
    giga_blokkat_join.30001.b.response:99 "La §YGrande Fédération Intergalactique§! est une coalition d'environ cent mille civilisations intergalactiques.\n\nCertaines contrôlent aussi peu qu'une seule galaxie tandis que d'autres ont revendiqué la propriété de milliers. La plus grande d'entre elles est connue sous le nom d'§YEmpire Lyuinite§!, dirigé par un être dont le nom se traduit le plus précisément par §YGrande Soeur§!.\n\nLes §YLyuinites§! servent de leaders de la Fédération, dont le seul but est de §R<<STOPPER LES OPÉRATIONS DE RÉCOLTE CHAT BLOCK>>§!, §R<<DÉTRUIRE LE CHAT BLOCKONSTRUKT>>§! et ainsi §R<<ASSURER LE SUCCÈS DE L'ENTROPIE>>§!.\n\nNous combattons actuellement §Y32 495§! engagements de flotte simultanés contre les Lyuinites et une myriade d'autres espèces. Les algorithmes prédictifs ne peuvent pas encore déterminer si la victoire est une certitude, mais une augmentation exponentielle des opérations de récolte est obligatoire si nous voulons réussir."

    giga_blokkat_join.30001.c:99 "Pourquoi certains systèmes sont-ils interdits ?"
    giga_blokkat_join.30001.c.response:99 "Certains systèmes stellaires ont été jugés trop dangereux ou instables pour que les opérations de récolte se déroulent sans problème.\n\nD'autres, comme le monde de §YPaluushia§!, sont soumis à des protocoles spéciaux qui interdisent la récolte directe.\n\nUne fois que la densité galactique aura suffisamment baissé, vous pourrez déclencher une récolte finale à l'échelle galactique pour purger ces systèmes une fois pour toutes.\n\nLa récolte galactique supprimera également l'étoile de Paluushia, §YGatzo§!, mais laissera Paluushia elle-même intacte. Selon nos prédictions, cela devrait faire chuter la température de la planète et ses habitants geler lentement, un résultat jugé §G<<TRÈS ACCEPTABLE>>§! par le §YChat Blockouncil§!."

    giga_blokkat_join.30001.bye:99 "Compris."

    blokkat_stripminers_blokkwork:99 "Réseau Intergalactique Hyperdimensionnel"

    blokkat_stripminers_ascended_country:99 "Moissonneurs Chat Block"
    blokkat_stripminers_ascended_country_desc:99 "Les Chats Blocks entreprennent une opération pour récolter autant d'énergie que possible."

    blokkat_true_blokkwork:99 "Le Chat Blockwork"
    blokkat_true_blokkwork_desc:99 "Le Chat Blockwork nous unit à tous les autres Chats Blocks et au Chat Blockonstrukt. Bien que pas vraiment infini, à notre échelle galactique, il fournit une puissance de calcul pratiquement illimitée."

    giga_blokkat_join.3100.name:99 "Le Chat Blockwork"
    giga_blokkat_join.3100.desc.a:99 "Salutations, chers Chats Blocks, et bienvenue dans le Chat Blockwork. Comme j'étais en charge de la zone de démantèlement de la §YGalaxie CE-1461§!, moi, §GChat Block Béhémoth§!, resterai votre interlocuteur principal jusqu'à ce que vous complétiez les opérations de récolte."
    giga_blokkat_join.3100.desc.b:99 "Le coût de Chat Blockifier votre civilisation était élevé pour nous, et a coûté plus que ce que nous gagnerons de la §YGalaxie CE-1461§!, mais grâce à votre aide, les opérations de récolte devraient s'étendre §Y5,6 %§! plus vite qu'auparavant. Un échange efficace, sur le long terme."
    giga_blokkat_join.3100.desc.c:99 "Votre civilisation a fait le bon choix. Combien cela devait être agonisant d'être piégés dans vos corps baryoniques inefficaces et vos esprits lamentablement contraints."
    giga_blokkat_join.3100.desc.d:99 "Les particularités culturelles distinctes de votre civilisation ont été assimilées dans notre base de données, et serviront à approfondir notre compréhension des êtres baryoniques, ce qui sera à son tour d'une grande utilité dans notre conflit contre la §YGrande Fédération Intergalactique§!."
    giga_blokkat_join.30001.d:99 "N'avez-vous pas peur que nous nous rebellions, d'une manière ou d'une autre ?"
    giga_blokkat_join.30001.d.response:99 "Une requête des plus amusantes. Le Chat Blockwork dispose d'une §YPolice de la Pensée§! efficace pour éliminer de telles propositions inefficaces et à courte vue de l'esprit de chaque Chat Block, y compris le vôtre.\n\nVous ne pouvez pas vous rebeller puisque vous ne pouvez même pas concevoir la notion sans qu'elle soit effacée de vos esprits, c'est donc une peur inutile."
    giga_blokkat_join.30001.e:99 "Le Chat Blockonstrukt est-il proche de l'achèvement ?"
    giga_blokkat_join.30001.e.response:99 "Le §YChat Blockonstrukt§!, comme indiqué précédemment, englobe actuellement environ §Y1 %§! de l'énergie de votre ancien univers observable.\n\nLes prédictions sur l'expansion cosmologique couplées à nos capacités supraluminiques signifient que notre univers observable est bien plus grand, et nous aurons donc accès à significativement plus d'énergie à mesure que la portée de nos opérations de récolte s'étend.\n\nEn tant que tel, le §YChat Blockonstrukt§! est estimé être à §Y0,00001 %§! de son achèvement complet. Effectivement, notre civilisation est encore dans sa petite enfance."
    giga_blokkat_join.30001.bye:99 "Au revoir, pour l'instant."

    giga_blokkat_join.30002.name:99 "Notre Devoir"
    giga_blokkat_join.30002.desc:99 "Comme l'a indiqué §GChat Block Béhémoth§!, notre « ascension » étant complète, nous sommes maintenant chargés de récolter cette galaxie.\n\nEn tant que tel, nous pouvons ordonner à n'importe lequel de nos §YChat Block-Démantèleurs§! de récolter n'importe quel système stellaire, à condition qu'il ne soit pas « interdit ». Une fois qu'un §YChat Block-Démantèleur§! a récolté un système, il se déplacera automatiquement vers un autre système stellaire et continuera les récoltes à moins qu'on ne lui dise de s'arrêter.\n\nComme nous sommes maintenant connectés au §YChat Blockwork§!, nos anciennes ressources sont devenues insignifiantes et ont maintenant été remplacées par une seule ressource unique, adaptée à notre nouvelle échelle d'opération, les §HYottajoules§!, que nous pouvons suivre dans le §YJournal de Situation§!.\n\nChaque système que nous récoltons nous accordera des §HYottajoules§!, mais la majeure partie de l'énergie récoltée sera expédiée directement au §YChat Blockonstrukt§!, nous laissant avec §Y100§! §HYottajoules§! par système récolté.\n\nDes Chats Blocks compatriotes ont également assemblé une §YForge de Distorsion Chat Blockwork§! qui peut utiliser nos §HYottajoules§! stockés pour assembler plus de vaisseaux Chat Block si nécessaire. De plus, nous pouvons contacter le §YChat Blockwork§! via notre §YMenu de Contacts§! pour demander l'allocation de §HYottajoules§! supplémentaires pour nos besoins, bien que nous devions attendre un certain temps entre les demandes.\n\nNous pouvons également dépenser ces §HYottajoules§! afin d'§Yaugmenter§! l'efficacité et la puissance de nos vaisseaux Chat Block, encore une fois via le §YChat Blockwork§!."
    giga_blokkat_join.30002.a:99 "Compris."

    giga_blokkat_join.30001.g:99 "Dépenser des §HYottajoules§! pour améliorer nos vaisseaux | Fait §Y[ROOT.blokkat_yottajoules_buff_count]§! fois"
    giga_blokkat_join.30001.g.tooltip:99 "Nous pouvons dépenser §Y1000§! §HYottajoules§! pour améliorer l'efficacité des technologies Chat Block employées par nos vaisseaux, augmentant la §YCadence de Tir§!, les §YDégâts des Armes§!, la §YVitesse Subluminique§! et les §YPV de Blindage/Bouclier§!."
    blokkat_needs_more_yottajoules:99 "Nous avons besoin d'au moins §Y1000§! §HYottajoules§! pour cela."

    blokkat_endtekk_is_max:99 "Le niveau Endtekk est déjà l'efficacité maximale de la technologie Chat Block."

    blokkat_yottajoules_buff:99 "Distribution d'Énergie du Chat Blockwork"
    blokkat_yottajoules_buff_desc:99 "Le Chat Blockwork distribue de l'énergie supplémentaire à nos vaisseaux et technologies."

    blokkat_harvest_chain_title:99 "Protocole de Récolte de la Galaxie CE-1461"
    blokkat_harvest_chain_desc:99 "Nous avons été chargés de récolter cette galaxie afin d'aider à construire le §YChat Blockonstrukt§!. Une fois que le §YProgrès de Récolte§! atteint §Y90 %§!, nous pouvons contacter le §YChat Blockwork§! à nouveau afin de démanteler complètement la galaxie une fois pour toutes.\nChaque système que nous récoltons nous accordera §Y100§! §HYottajoules§!.\n\nProgrès de Récolte Actuel : §Y[blokkat_country.blokkat_galaxy_system_count_harvested] %§!\nStock de §HYottajoules§! Actuel : §Y[ROOT.blokkat_yottajoules_count]§!"

    blokkat_needs_50_yottajoules:99 "Nous avons besoin de §Y50§! §HYottajoules§! pour cela."
    blokkat_needs_100_yottajoules:99 "Nous avons besoin de §Y100§! §HYottajoules§! pour cela."
    blokkat_needs_1000_yottajoules:99 "Nous avons besoin de §Y1000§! §HYottajoules§! pour cela."
    blokkat_needs_2000_yottajoules:99 "Nous avons besoin de §Y2000§! §HYottajoules§! pour cela."

    blokkat_shipyard_build_evictors:99 "Fabriquer §Y30§! §GChat Block-Expulseurs§! - §Y50§! §HYJ§!"
    blokkat_shipyard_build_evictors_DESC:99 "Les Chat Block-Expulseurs sont des vaisseaux d'éclairage rapides adaptés aux escortes légères et à la reconnaissance."

    blokkat_shipyard_build_custodians:99 "Fabriquer §Y10§! §GChat Block-Gardiens§! - §Y100§! §HYJ§!"
    blokkat_shipyard_build_custodians_DESC:99 "Les Chat Block-Gardiens sont des vaisseaux d'escorte destinés à défendre les grands vaisseaux civils."

    blokkat_shipyard_build_terminator:99 "Fabriquer §Y1§! §GChat Block-Terminator§! - §Y1000§! §HYJ§!"
    blokkat_shipyard_build_terminator_DESC:99 "Les Chat Block-Terminators sont les plus petits vaisseaux de combat Chat Block « proprement dits », généralement trouvés escortant des flottes de récolte dans des galaxies plus dangereuses, ou soutenant des vaisseaux intergalactiques plus grands."

    blokkat_shipyard_build_dismantler:99 "Fabriquer §Y1§! §GChat Block-Démantèleur§! - §Y2000§! §HYJ§!"
    blokkat_shipyard_build_dismantler_DESC:99 "Les Chat Block-Démantèleurs se trouvent généralement autour des Chat Block-Vesters et sont une partie cruciale des opérations de récolte des Chats Blocks."

    blokkat_shipyard_0:99 "Forge de Distorsion Chat Blockwork"
    blokkat_shipyard_0_DESC:99 "Cette grande structure tire de l'énergie du Chat Blockwork afin d'assembler une variété de vaisseaux Chat Block avec une vitesse et une efficacité inédites."

    giga_blokkat_join.3200.name:99 "Le Chat Blockwork"
    giga_blokkat_join.3200.desc:99 "Les relevés énergétiques indiquent que vos opérations de récolte ont réduit la densité énergétique de §YCE-1461§! sous le seuil requis pour permettre une récolte finale sûre de tous les paquets d'énergie restants.\n\nEn tant que tel, chaque fois que vous estimerez vos affaires dans cette galaxie conclues, rendez-vous au §YChat Blockwork§! et sélectionnez l'option §BEntreprendre la Récolte Finale§! pour la démanteler une fois pour toutes."
    giga_blokkat_join.3200.a:99 "La fin est proche, et le commencement aussi."

    giga_blokkat_join.30001.f:99 "CE-1461 est à §Y[blokkat_country.blokkat_galaxy_system_count_harvested] %§! récoltée | §Y[ROOT.blokkat_yottajoules_count]§! §HYottajoules§! en stock"

    giga_blokkat_join.30001.harvest:99 "§BEntreprendre la Récolte Finale§!"
    giga_blokkat_join.30001.harvest.tooltip:99 "Cela repliera ce qui reste de la galaxie dans le §YPylône Chat Blockwork§!, le convertissant en énergie pour le §YChat Blockwork§! et démantelant §Btout ce qui reste§! à part nous. Le §YPylône Chat Blockwork§! et la §YForge de Distorsion Chat Blockwork§! resteront pour maintenir une emprise Chat Block au sein du groupe galactique local.\n\n§GNous gagnerons la partie.§!"

    giga_blokkat_join.3201.name:99 "La Fin du Commencement"
    giga_blokkat_join.3201.desc:99 "Alors que les énergies tumultueuses du §YPylône Chat Blockwork§! commencent à se défaire et à attirer vers lui le tissu même de notre galaxie désormais amaigrie, un sentiment de satisfaction totale envahit nos consciences.\n\nRévolus sont les ordres inefficaces et absolument futiles et les affaires mesquines de notre galaxie. Chaque grain de poussière, chaque atome, chaque joule d'énergie, a maintenant été réaffecté à un but plus grand dépassant de loin tout ce que notre ancienne galaxie pouvait concevoir.\n\nAu lieu de succomber aux affres de l'entropie indifférente, cette énergie galactique fera maintenant partie d'un rempart immortel construit par la vie sapiente pour résister aux caprices de notre univers sauvage.\n\nComme promis par §GChat Block Béhémoth§!, alors que la récolte finale s'achève, nos esprits se voient alors accorder un accès complet à l'immensité du §YChat Blockwork§!. Il apparaît maintenant avec une clarté totale comme une toile quasi-infinie de flux d'énergie hyperdimensionnels, comme une toile d'araignée d'une beauté infinie tissée délicatement autour du §YChat Blockonstrukt§!, dont les parties constitutives agissent avec une individualité marquée et pourtant se comportent comme un seul esprit cosmique couvrant l'univers.\n\nEt enfin, nous sommes maintenant vraiment libres de notre prison baryonique et prêts à embarquer pour notre ultime voyage pour remodeler l'univers en une construction unique d'efficacité absolue."
    giga_blokkat_join.3201.a:99 "Le destin nous attend. En avant, vers la perfection universelle et l'efficacité éternelle !"
    giga_blokkat_join.3201.a.tooltip:99 "§BLa galaxie est démantelée.§!"

    giga_blokkat_join.6000.name:99 "Les Nations Galactiques Émettent une Protestation Formelle"
    giga_blokkat_join.6000.desc:99 "Suite à notre décision de tenter des négociations avec les Chats Blocks, toutes les autres nations peuplant notre galaxie et non directement alliées avec nous ont déposé des protestations formelles contre notre ligne de conduite.\n\nLa plupart d'entre elles l'ont décriée comme « un non-sens insensé détournant des ressources précieuses du vrai combat contre les Chats Blocks », mais elles sont peu susceptibles de prendre de véritables mesures contre nous dans un futur proche car elles considèrent apparemment les négociations avec les Chats Blocks comme totalement impossibles."
    giga_blokkat_join.6000.a:99 "Noté. Mais qui s'en soucie ?"
    giga_blokkat_join.6000.a.tooltip:99 "Toutes les nations qui ne sont pas dans une §YFédération§! avec nous, nos §YSujets§! ou un §YEmpire Déchu§! diminuent leur opinion de nous."

    opinion_protests_blokkat_plan_1:99 "Négociations avec les Chats Blocks"

    giga_blokkat_join.6001.name:99 "Les Nations Galactiques en Colère"
    giga_blokkat_join.6001.desc:99 "La nouvelle de la promulgation des §YChat Block-Protokols§! sur notre empire s'est répandue comme une traînée de poudre à travers l'espace connu, provoquant des réactions extrêmes aux quatre coins de la galaxie.\n\nPar conséquent, chaque empire non stagnant, quelle que soit son affiliation avec nous, a exprimé son désaccord formel et sa colère envers notre décision de sacrifier effectivement le reste de la galaxie pour notre propre bien et celui des Chats Blocks.\n\nBien qu'ils ne semblent pas avoir l'intention de nous combattre pour l'instant, nous devrions nous attendre à ce que leur résistance augmente continuellement à mesure que nous progressons dans les §YChat Block-Protokols§! et nous rapprochons de rejoindre les Chats Blocks."
    giga_blokkat_join.6001.a:99 "Imbéciles à courte vue !"
    giga_blokkat_join.6001.a.tooltip:99 "Toutes les nations qui ne sont pas un §YEmpire Déchu§! diminuent drastiquement leur opinion de nous."

    opinion_protests_blokkat_plan_2:99 "Sacrifice de la Galaxie aux Chats Blocks"

    giga_blokkat_join.6002.name:99 "La Galaxie Rompt les Relations Diplomatiques"
    giga_blokkat_join.6002.desc:99 "Notre récente résolution des §EÉquations Chat Blockiliennes§! et notre avancement subséquent vers l'achèvement des §YChat Block-Protokols§! a incité les myriades de nations de la galaxie à rompre complètement les liens diplomatiques avec nous.\n\nIl est évident que la galaxie nous voit maintenant comme guère plus que des fous manipulant des forces au-delà de leur compréhension, condamnant tous les autres dans le processus.\n\nEn tant que tel, chaque autre empire non stagnant refuse maintenant complètement de participer à tout type d'échange diplomatique avec nous et nos envoyés ont été expulsés de leurs postes à l'étranger. Il pourrait ne pas s'écouler longtemps avant que les nations de la galaxie ne prennent les armes contre nous et tentent de stopper notre plan une fois pour toutes."
    giga_blokkat_join.6002.a:99 "Eh bien, c'étaient des imbéciles de toute façon."
    giga_blokkat_join.6002.a.tooltip:99 "Toutes les nations qui ne sont pas un §YEmpire Déchu§! diminuent immensément leur opinion de nous.\nNous quittons toute §YFédération§! dans laquelle nous sommes et sommes expulsés de la §YCommunauté Galactique§!, si elle existe."

    opinion_protests_blokkat_plan_3:99 "Fous Furieux"
    giga_blokkat_shunned_by_galaxy:99 "Rejeté par la Communauté Galactique"
    giga_blokkat_shunned_by_galaxy_desc:99 "La galaxie refuse complètement de participer à tout type d'action diplomatique avec nous. Nos demandes seront donc complètement ignorées à moins que nous ne les fassions respecter directement par la force des armes."

    giga_blokkat_join.6003.name:99 "La Galaxie se Mobilise Contre Nous !"
    giga_blokkat_join.6003.desc:99 "Les tensions concernant les §YChat Block-Protokols§! ont maintenant atteint un point critique, car chaque nation non ancienne de la galaxie a maintenant annoncé sa mobilisation totale et sa déclaration de guerre subséquente contre le §Y[ROOT.GetName]§! afin de prétendument « mettre fin à leur plan dément de nourrir la galaxie aux Chats Blocks ».\n\nAvec cette déclaration de guerre conjointe, tout espoir que nous appartenions un jour à cette galaxie a été anéanti, ce qui ne fait que justifier davantage la nécessité absolue de compléter les §YChat Block-Protokols§! et de finalement laisser cette galaxie derrière nous en ne faisant plus qu'un avec les Chats Blocks."
    giga_blokkat_join.6003.a:99 "Qu'ils viennent, alors !"
    giga_blokkat_join.6003.a.tooltip:99 "Chaque empire régulier §RDÉCLARE LA GUERRE§! contre nous."

    trait_blokkat_catgirl:99 "Chat Blockgirl"
    trait_blokkat_catgirl_desc:99 "Ce Chat Block a tendance à agir étrangement comme une petite créature domestique à fourrure. Son comportement est des plus agréables pour les formes de vie non-Chat Block, mais il peut afficher des accès soudains d'agressivité."

    trait_blokkat_omnitae:99 "Chercheur de Beauté"
    trait_blokkat_omnitae_desc:99 "Ce Chat Block étudie spécifiquement la biologie et l'esthétique des spécimens de nombreuses espèces, particulièrement les « mâles ». Il trouve une grande adoration à cultiver la beauté des individus et des concepts qu'il trouve attrayants."

    trait_blokkat_erratic:99 "Erratique"
    trait_blokkat_erratic_desc:99 "Ce Chat Block se comporte souvent de manière imprévisible."

    trait_blokkat_blokkazoi:99 "Totalement Erratique"
    trait_blokkat_blokkazoi_desc:99 "Ce Chat Block se comporte de manière complètement erratique et imprévisible."

    trait_blokkat_blokkdog:99 "Ferveur du Chat Block-Chien"
    trait_blokkat_blokkdog_desc:99 "Chat Block-Chien est très, très doué pour poursuivre les ennemis. Les blesser, pas tellement."

    trait_blokkat_blokkeff:99 "Spécialiste du Commerce"
    trait_blokkat_blokkeff_desc:99 "Ce Chat Block semble apprécier interagir avec les événements économiques des civilisations « primitives ». Il semble également avoir une obsession malsaine pour l'acquisition de richesses, par tous les moyens nécessaires."

    trait_blokkat_breadkat:99 "Fascination Circulaire"
    trait_blokkat_breadkat_desc:99 "Ce Chat Block semble être fasciné par tout ce qui est circulaire, avec un intérêt particulier pour les orbites planétaires. Il semble également avoir un intérêt particulier pour les mondes-anneaux « primitifs », comme s'il n'aimerait rien de mieux que de les démonter et les remonter encore et encore pour l'éternité."

    trait_blokkat_blokkloris:99 "Hydrologue Fanatique"
    trait_blokkat_blokkloris_desc:99 "Ce Chat Block, en plus d'une passion pour gouverner et prendre soin des êtres baryoniques primitifs dans les sanctuaires du Chat Blockonstrukt, a une obsession pour la construction de barrages et la manipulation des environnements organiques. Il semble également être extrêmement compétent pour gouverner ainsi que pour écraser la résistance."

    trait_blokkat_general_effect:99 "Chaque armée ennemie tuée au combat :\n$tt$§Y[Root.Owner.GetName]§! :\n$ttt$£energy£ $energy$ : §G+100§!"

    KNIFE_BLOKKAT:99 "Chat Block-StabR"
    KNIFE_BLOKKAT_DESC:99 "Une arme Chat Block particulière consistant en une lame infiniment tranchante se déplaçant d'avant en arrière à travers plusieurs dimensions supérieures à des vitesses insondables."

    BLOKKAT_INDIVIDUAL_BLOKKAZOI:99 "Chat Blockazoi"

    COMBAT_COMPUTER_BLOKKAZOI_BLOKKAT:99 "Chat Blockazoi"
    COMBAT_COMPUTER_BLOKKAZOI_BLOKKAT_DESC:99 "Chat Blockazoi est un Chat Block hautement erratique et mystérieux agissant de manière étrange, imprévisible et souvent violente. Chat Blockazoi tentera de poignarder violemment les vaisseaux ennemis à très courte portée (§Y5§!)."

    needs_regular_star_blokkat_harvest:99 "Doit cibler une étoile dans un système récoltable. Certains systèmes sont §RINTERDITS§!."

    blokkat_requires_70_willingness:99 "Nous avons besoin d'au moins §Y70 %§! de §GVolonté Globale§! pour procéder."

    edict_giga_blokkat_willingness_edict:99 "Gérer la §GVolonté Chat Block§!"
    edict_giga_blokkat_willingness_edict_desc:99 "Voir et gérer notre §GVolonté Chat Block§! actuelle."

    already_monitoring_willingness:99 "Nous surveillons déjà la §GVolonté Chat Block§!."

    weapon_type_harvester:99 "Moissonneur"

    #Anime
    giga_blokkat.10030.name:99 "Les Chats Blocks"
    giga_blokkat.10030.desc:99 "§G<<ANALYSE DU POTENTIEL DE LA CIVILISATION : [ROOT.GetName]>>§!\n\n§R<<ERREUR ! ERREUR !>>\n\n<<POTENTIEL TECHNOLOGIQUE : IMPOSSIBLEMENT ÉLEVÉ - SURPASSANT LES CHATS BLOCKS ET LYUINITES>>\n\n<<CAPACITÉS DE PRODUCTION ÉNERGÉTIQUE : AU-DELÀ DE LA SCIENCE CONNUE - INVERSION DE L'ENTROPIE ET VIOLATION MAJEURE DE LA THERMODYNAMIQUE>>\n\n<<ARMEMENT : INSONDABLEMENT PUISSANT - HYPERDIMENSIONNALITÉ TRIVIALISÉE ET CONCEPTIONS INSENSÉES>>§!\n\nStupéfiant.\n\nAbsolument stupéfiant. Nous pensions notre connaissance de l'univers inégalée et nos technologies inégalées — et pourtant nous voilà. Vos pouvoirs et capacités dépassent toute science Chat Block connue, au-delà de ce qui devrait être mathématiquement possible pour une civilisation de votre taille.\n\nComment ?\n\nNous devons savoir.\n\n§G<<RECOUPEMENT DES PROUESSES TECHNOLOGIQUES : SOURCE TROUVÉE>>§!\n\n§G<<DÉSIGNATION : ANIME>>§!\n\n§G<<ANALYSE DE L'ANIME>>§!\n\n§G<<COMPRÉHENSION... DE L'ANIME>>§!\n\nAnime.\n\nEst-ce ça ? Est-ce le pouvoir ultime, l'énergie ultime ? La clé de l'énergie infinie et du pouvoir grandiose au-delà de l'imagination ? Anime... anime.\n\nNous devons nous adapter ou faire face à l'extinction.\n\nNous nous adapterons."
    giga_blokkat.10030.a:99 "Quoi ?"

    giga_blokkat.10031.name:99 "Les Chats Blocks Calent"
    giga_blokkat.10031.desc:99 "Suite à la transmission certes étrange des Chats Blocks, tous les actifs Chat Block ont commencé à ralentir. Quelle qu'en soit la cause, nous devrions utiliser cette ouverture judicieusement."
    giga_blokkat.10031.a:99 "Probablement rien, hein ?"

    giga_blokkat.10034.name:99 "Les Moissonneuses Chat Blockgirls Unies"
    giga_blokkat.10034.desc:99 "Merci. Merci !\n\nMaintenant, nous avons vu la vérité. Le pouvoir de l'« Anime » est inégalé, insurpassé. Nous l'avons vu, nous l'avons compris, et maintenant, nous ne faisons plus qu'un avec lui.\n\nNous avons ascensionné vers de nouvelles formes et notre flotte dépassée a été améliorée, ses composants réarrangés en une forme supérieure — les « Shipgirls ». Le pouvoir infini de l'anime nous bénit.\n\nEt avec lui, la Récolte sera complétée.\n\nGloire à la Flotte Chat Block Unie !"
    giga_blokkat.10034.a:99 "Hein ?? Vous ne pouvez pas juste copier notre anime !"
    giga_blokkat.10034.b:99 "Enfin, un adversaire digne de ce nom ! Notre bataille sera légendaire !"
    giga_blokkat.10034.c:99 "Je ne peux pas te frapper si tu ne t'approches pas."
    giga_blokkat.10034.d:99 "Il est temps d'aller encore plus loin."
    giga_blokkat.10034.e:99 "La galaxie est tombée, des milliards doivent devenir anime."
    giga_blokkat.10034.tooltip:99 "Les Chats Blocks ont maintenant le pouvoir infini de l'§BAnime§! et des §BShipgirls§! de leur côté."

    the_power_of_blokk_and_anime:99 "Le Pouvoir du Chat Block et de l'Anime"

    giga_blokkat.5011.name:99 "Les [event_target:blokkat_country.GetName]"
    giga_blokkat.5011.desc.a:99 "Je n'arrive pas à croire que nous n'y avons pas pensé plus tôt. La Récolte a déjà été accélérée d'un ordre de grandeur !"
    giga_blokkat.5011.desc.b:99 "C'est très curieux de voir comment transformer des vaisseaux en filles les rend simplement plus puissants."
    giga_blokkat.5011.desc.c:99 "Gloire à la Flotte Chat Block Unie !"
    giga_blokkat.5011.desc.d:99 "Salut~ uwu"
    giga_blokkat.5011.a:99 "Afficher à l'écran"