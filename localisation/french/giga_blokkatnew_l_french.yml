    giga_blokkat.1023.name:99 "Monde Démantelé"
    giga_blokkat.1023.desc:99 "Les §YChats Blocks§! ont atteint puis anéanti notre colonie de §Y[ROOT.GetName]§!, causant le décès malheureux de §Y[ROOT.blokkat_planet_pop_count]§! pops en quelques instants.\n\nSi nous ne contenons pas son impact sur notre civilisation, cet acte grave générera §Y[ROOT.blokkat_pop_inquietude]§! d'§RInquiétude Chat Block§! au sein de notre empire. Alternativement, nous pouvons tenter de compenser la destruction du monde avec des subventions et de la propagande pour réduire de moitié l'impact de l'inquiétude, mais cela coûterait environ §Y[ROOT.blokkat_pop_influence_cost]§! £influence£."
    giga_blokkat.1023.a:99 "Malédiction ! | §Y[ROOT.blokkat_pop_inquietude]§! §RInquiétude Chat Block§!"
    giga_blokkat.1023.b:99 "Dépenser §Y[ROOT.blokkat_pop_influence_cost]§! £influence£ pour atténuer l'impact. | §Y[ROOT.blokkat_pop_inquietude_halved]§! §RInquiétude Chat Block§!"
    blokkat_not_enough_influence:99 "Influence insuffisante."
    giga_blokkat.1023.desc.willingness:99 "Les §YChats Blocks§! ont atteint puis anéanti notre colonie de §Y[ROOT.GetName]§!, causant le décès malheureux de §Y[ROOT.blokkat_planet_pop_count]§! pops en quelques instants.\n\nSi nous ne contenons pas son impact sur notre civilisation, cet acte grave générera §Y[ROOT.blokkat_pop_inquietude]§! d'§RInquiétude Chat Block§! et réduira la §HVolonté Gouvernementale§! et la §MVolonté Populaire§! de §R[ROOT.blokkat_pop_inquietude] %§! au sein de notre empire. Alternativement, nous pouvons tenter de compenser la destruction du monde avec des subventions et de la propagande pour réduire de moitié l'impact de l'inquiétude, mais cela coûterait environ §Y[ROOT.blokkat_pop_influence_cost]§! £influence£."

    giga_blokkat_join.5500.b:99 "Tenter de rallier les Dirigeants §Ren grève§! à notre cause."

    giga_blokkat_join.5601.name:99 "Rallier les Dirigeants en Grève"
    giga_blokkat_join.5601.desc:99 "Il n'est pas surprenant que certains de nos dirigeants ne soient pas très enthousiastes à propos de notre plan de négocier avec les Chats Blocks. En tant que tel, il pourrait être sage de dépenser de l'§MInfluence§!, de l'§BUnité§! ou de l'§YÉnergie§! afin d'essayer de les rallier à notre cause en tirant les bonnes ficelles et en s'assurant qu'ils comprennent correctement notre point de vue au lieu de se cacher derrière leurs idéaux dépassés."

