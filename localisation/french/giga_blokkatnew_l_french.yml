    giga_blokkat_join.5603.name:99 "Négocier avec §Y[blokkat_strike_leader_negotiate.GetName]§!"
    giga_blokkat_join.5603.desc:99 "Nous pouvons essayer de dépenser de l'§MInfluence§!, de l'§BUnité§! et possiblement de l'§YÉnergie§! pour convaincre §Y[blokkat_strike_leader_10.GetName]§! de se ranger de notre côté concernant les affaires Chat Block.\n\nÉtant donné la valeur actuelle de leur volonté respective (§BVolonté Scientifique§! pour les §BScientifiques§!, §PVolonté Militaire§! pour les §PAmiraux§! et §GGénéraux§!, et §HVolonté Gouvernementale§! pour les §HGouverneurs§!) et leur niveau de compétence de §Y[ROOT.blokkat_leader_negotiate_level]§!, les chances de succès des négociations sont de §Y[ROOT.blokkat_leader_negotiate_odds] %§!.\n\nIl en coûterait £influence£§Y[ROOT.blokkat_leader_negotiate_influence_cost]§! et £unity£§Y[ROOT.blokkat_leader_negotiate_unity_cost]§! pour procéder aux négociations."

    giga_blokkat_join.5603.yes:99 "Procéder ([ROOT.blokkat_leader_negotiate_odds] % de chance)."
    giga_blokkat_join.5603.bribe:99 "Procéder avec un pot-de-vin et promettre une grosse augmentation. | £energy£§Y[ROOT.blokkat_leader_negotiate_energy_cost]§! ([ROOT.blokkat_leader_negotiate_odds_payrise] % de chance)"
    giga_blokkat_join.5603.bribe.tooltip:99 "En cas de succès, §Y[blokkat_strike_leader_negotiate.GetName]§! gagnera le trait §HPot-de-vin Pro-Chat Block§!, augmentant son §YEntretien de Dirigeant§! de §Y300 %§! et réduisant le §YGain d'XP§! de §Y30 %§!.\n\nRéduira la §MVolonté Populaire§! de §G1,5 %§! si nous sommes §YÉgalitaires§! et de §G3 %§! si nous sommes §YÉgalitaires Fanatiques§!."

    giga_blokkat_join.5604.name:99 "Négociations Réussies !"
    giga_blokkat_join.5604.desc:99 "Notre Bureau de recherche Chat Block rapporte que §Y[blokkat_strike_leader_negotiate.GetName]§! a enfin décidé de nous rejoindre dans notre quête pour rejoindre les Chats Blocks.\n\nIl a donc déclaré la fin de ses grèves et reprendra ses fonctions immédiatement.\n\nLa chance de succès était de §Y[ROOT.blokkat_leader_negotiate_odds] %§!"
    giga_blokkat_join.5604.a:99 "Merveilleux !"
    giga_blokkat_join.5604.bribe:99 "Un petit pot-de-vin fait des miracles."
    trait_blokkat_payrise:99 "Pot-de-vin Pro-Chat Block"
    trait_blokkat_payrise_desc:99 "Bien que réticent à se ranger de notre côté concernant les affaires Chat Block, ce dirigeant a été soudoyé avec une grosse augmentation."

    giga_blokkat_join.5605.name:99 "Échec des Négociations."
    giga_blokkat_join.5605.desc:99 "Notre Bureau de recherche Chat Block rapporte que §Y[blokkat_strike_leader_negotiate.GetName]§! a refusé de coopérer avec nous concernant notre projet de nous ranger du côté des Chats Blocks.\n\nIl a véhémentement rejeté toutes les tentatives de médiation et poursuivra donc ses protestations insensées.\n\nLa chance de succès était de §Y[ROOT.blokkat_leader_negotiate_odds] %§!"
    giga_blokkat_join.5605.a:99 "L'imbécile..."

    edict_blokkat_science_willingness_propaganda:99 "§GÉdit de Volonté :§! Propagande Pro-Chat Block §BScientifique§!"
    edict_blokkat_science_willingness_propaganda_desc:99 "Nos scientifiques doivent comprendre que notre plan est manifestement la chose la plus logique à faire. De copieuses quantités de propagande et d'articles approuvés par le gouvernement leur seront donc distribués.\n\nTant que cet édit est actif, la §BVolonté Scientifique§! aura §Y5 %§! de chance d'augmenter de §G1 %§! chaque mois."
    edict_blokkat_military_willingness_propaganda:99 "§GÉdit de Volonté :§! Propagande Pro-Chat Block §PMilitaire§!"
    edict_blokkat_military_willingness_propaganda_desc:99 "Notre amirauté doit comprendre que notre plan est manifestement la chose la plus logique à faire. De copieuses quantités de propagande et d'articles approuvés par le gouvernement leur seront donc distribués.\n\nTant que cet édit est actif, la §PVolonté Militaire§! aura §Y5 %§! de chance d'augmenter de §G1 %§! chaque mois."
    edict_blokkat_government_willingness_propaganda:99 "§GÉdit de Volonté :§! Propagande Pro-Chat Block §HGouvernementale§!"
    edict_blokkat_government_willingness_propaganda_desc:99 "Nos organes de gouvernement doivent comprendre que notre plan est manifestement la chose la plus logique à faire. De copieuses quantités de propagande et d'articles approuvés par le gouvernement leur seront donc distribués.\n\nTant que cet édit est actif, la §HVolonté Gouvernementale§! aura §Y5 %§! de chance d'augmenter de §G1 %§! chaque mois."
    edict_blokkat_population_willingness_propaganda:99 "§GÉdit de Volonté :§! Propagande Pro-Chat Block §MPopulaire§!"
    edict_blokkat_population_willingness_propaganda_desc:99 "Notre peuple doit comprendre que notre plan est manifestement la chose la plus logique à faire. De copieuses quantités de propagande et d'articles approuvés par le gouvernement leur seront donc distribués.\n\nTant que cet édit est actif, la §MVolonté Populaire§! aura §Y5 %§! de chance d'augmenter de §G1 %§! chaque mois."

    giga_blokkat_join.5500.scrap:99 "Distribuer des échantillons de £blokkat_scrap_icon£ §MFerraille Chat Block§!..."
    giga_blokkat_join.5500.scrap.tooltip:99 "En montrant les magnifiques subtilités de la technologie Chat Block à notre civilisation, nous pourrions simplement être capables de prouver que s'efforcer de travailler avec les Chats Blocks est certainement le meilleur choix."

    giga_blokkat_join.5700.name:99 "Distribution de §MFerraille Chat Block§!"
    giga_blokkat_join.5700.desc:99 "La technologie Chat Block est indubitablement magnifique de bien des façons qui dépassent la compréhension. Dans les échantillons récupérés sur les vaisseaux Chat Block, malgré les dommages qu'ils ont subis, des formations complexes de nanomachines hyperdimensionnelles tourbillonnent les unes autour des autres d'une manière qui ne peut qu'engendrer un sentiment d'émerveillement absolu.\n\nAinsi, il est évident que distribuer certains de ces merveilleux échantillons aux membres réticents de notre civilisation les convaincra que devenir un avec ces êtres extragalactiques nous transformera, sans l'ombre d'un doute, en quelque chose de bien plus grand."

    giga_willingness_needs_scrap:99 "Nous devons avoir acquis de la £blokkat_scrap_icon£ §MFerraille Chat Block§!"
    giga_blokkat_50_blokkat_scrap:99 "-§Y50§! £blokkat_scrap_icon£"
