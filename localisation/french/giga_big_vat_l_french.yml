  giga_maximum_mutation_title:0 "§cMutation maximale§!"
  giga_maximum_mutation_desc:0 "Dans la poursuite de notre destinée génétique, toutes les pistes possibles doivent être envisagées, aussi étranges et ésotériques qu'elles puissent paraître."
  
  giga_prethoryn_larvae:0 "Larve mutée"
  giga_prethoryn_larvae_desc_short:0 "Une petite larve frétillante. Croît extrêmement vite. Pourrait être écrasée sous le pied"
  giga_prethoryn_larvae_desc_details:0 ""
  
  giga_vat_maximum_mutation_1:0 "Mutation maximale : Inceptus"
  giga_vat_maximum_mutation_2:0 "Mutation maximale : Virulus"
  giga_vat_maximum_mutation_3:0 "Mutation maximale : Aureus"
  giga_vat_maximum_mutation_4:0 "Mutation maximale : Exaltus"
  giga_vat_maximum_mutation_1_DESC:0 "L'inception est d'une grande importance, définissant comment nos mutations progresseront. Seul le temps dira si ce projet portera autant de fruits que ses bienfaiteurs le prétendent."
  giga_vat_maximum_mutation_2_DESC:0 "Les prochaines étapes, tout aussi importantes que les premières. Comment peut-on avoir un palais si ses fondations ne sont pas construites plusieurs fois plus hautes ?"
  giga_vat_maximum_mutation_3_DESC:0 "Avec tout projet, des révisions et des examens doivent être effectués. Comment pouvons-nous améliorer notre conception ? Quels défauts pouvons-nous minimiser ? Le moment est venu pour nos spécimens d'accéder à la perfection."
  giga_vat_maximum_mutation_4_DESC:0 "La clé de voûte achève toute grande œuvre, sans quoi elle s'effondrerait sous son propre poids."
  
  giga_vat_events.100.name:0 "Maximiser la mutation"
  giga_vat_events.100.desc:0 "Avec accès à un ensemble aussi vaste et efficace de dispositifs de clonage, nos scientifiques ont conçu une idée assez particulière. Que résulterait de la combinaison et de la mutation de chaque échantillon de matériel génétique que notre empire a jamais collecté, peu importe ce que c'est. Aussi bizarre que soit l'idée, elle pourrait mener à des avancées en biologie et peut-être que les créatures que ce projet concevra auront des applications sur la scène de la guerre galactique."
  giga_vat_events.100.a:0 "Qu'est-ce qui pourrait mal tourner ?"
  
  giga_vat_events.101.name:0 "Inceptus"
  giga_vat_events.101.desc:0 "Avec des résultats initiaux prometteurs, les scientifiques sur [capital.GetName] se préparent pour des expériences à plus grande échelle. Avec les laboratoires extensifs de la $name_the_vat$, ils visent à obtenir un spécimen de la taille d'une corvette. S'il performera en dessous ou au-dessus des capacités d'une corvette reste à voir."
  giga_vat_events.101.a:0 "$INTRIGUING$"
  
  giga_vat_events.1011.name:0 "Conception d'Inceptus"
  giga_vat_events.1011.desc:0 "Nous l'avons regardé grandir. Regardé se nourrir. À travers tout cela, colère, peur, frustration. Nous ne savons pas comment nous connaissions ses sentiments. C'était si gargantuesque, mais encore si petit, encore effrayé de nous. Il pourrait nous écraser ou nous faire fondre en un instant. Pourquoi avait-il peur ? Peur de ce que nous lui ferions s'il nous attaquait ? Ou peur de ce que nous créerions ensuite."
  giga_vat_events.1011.a:0 "$DISCONCERTING$"
  
  giga_vat_events.102.name:0 "Virulus"
  giga_vat_events.102.desc:0 "Suite au succès d'Inceptus, les scientifiques en chef proposent une expérience encore plus grande, de la taille d'un destroyer. Bien que beaucoup dans l'équipe aient leurs réserves, le feu vert a été donné et les progrès ont commencé pour muter encore davantage."
  giga_vat_events.102.a:0 "$GOOD$"
  
  giga_vat_events.1021.name:0 "Une force virulente"
  giga_vat_events.1021.desc:0 "Rage. Toute émotion secondaire face au mélange de violence et de colère. Il se débattait contre ses contraintes qui l'empêchaient de déchirer la station. Des jours qu'il se débattait, sa rage était-elle sans fin ? Pendant tout ce temps, nous percevions des changements chez nos spécimens plus petits, des sentiments similaires de colère mêlée de peur. Ils semblent partager un lien, quelque chose de plus grand qu'un simple lien familial, comme s'ils étaient des parties d'un organisme plus grand."
  giga_vat_events.1021.a:0 "$DISTURBING$"
  
  giga_vat_events.103.name:0 "Aureus"
  giga_vat_events.103.desc:0 "Depuis le début du projet, nos amiraux et autres personnels militaires ont exprimé un grand intérêt pour ce projet. Ils demandent un spécimen avec des capacités presque similaires à un porte-nefs. De nombreux scientifiques stationnés sur la $name_the_vat$ ont soit démissionné, soit refusent de travailler, mais quelques-uns continuent dans la poursuite de la perfection."
  giga_vat_events.103.a:0 "$INCREDIBLE$"
  
  giga_vat_events.1031.name:0 "Ascension biologique"
  giga_vat_events.1031.desc:0 "La rage encore. Monumentale comparée à avant. Les débattements étaient plus forts aussi. Un jour, tout s'est arrêté. Un seul sentiment a été ressenti ce jour-là. L'obéissance. Ils l'avaient fait, ils avaient contrôlé cette créature indisciplinée qu'ils avaient créée. Elle s'était soumise, et avec elle tous les autres spécimens. Plus de rage ni de peur ni de frustration. L'obéissance brillait. L'organisme nous a acceptés."
  giga_vat_events.1031.a:0 "$ASTOUNDING$"
  
  giga_vat_events.104.name:0 "Exaltus"
  giga_vat_events.104.desc:0 "Nous avions atteint la perfection, mais si nous allions plus loin ? Après avoir atteint la grandeur, pourrait-il y avoir plus ? Certains dans l'équipe disent pourquoi ne pas viser aussi haut que possible. Si c'est un succès, l'étape finale de l'évolution pourrait être réalisée."
  giga_vat_events.104.a:0 "$UNDERSTOOD$"
  
  giga_vat_events.1041.name:0 "Mutation maximisée"
  giga_vat_events.1041.desc:0 "La forme de vie ultime, nos magnifiques spécimens, enfin créés et réalisés devant nous. Leur force fera réfléchir nos ennemis à deux fois avant de nous défier sur la scène galactique. Nous avons gagné quelque chose d'unique de ce projet. Nos spécimens et nous avons cette connexion. Nos esprits et les leurs entrelacés comme une seule entité. Si une force comme celle-ci était lâchée sur une galaxie, on ne sait pas ce qui pourrait arriver. Tout au long du programme, il y a eu quelques tentatives d'évasion de nos spécimens. Heureusement, toutes ont été éliminées. Bien qu'il y ait eu ces quelques-uns qui ont échappé et se sont dirigés vers l'espace intergalactique. Sûrement ils ne causeront pas de problèmes."
  giga_vat_events.1041.a:0 "Sûrement..."
  
