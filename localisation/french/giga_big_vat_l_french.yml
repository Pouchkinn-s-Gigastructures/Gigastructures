  giga_tech_the_vat:99 "Installations de clonage gargantuesque"
  giga_tech_the_vat_desc:99 "L'avènement d'une nouvelle ère de génie génétique a ouvert la voie à des projets encore plus ambitieux et grandioses. Autrefois limitées aux planètes, d'immenses installations de clonage orbitales nous permettraient de concevoir et de faire croître rapidement de véritables armadas de créatures spatiales pour renforcer davantage notre flotte."

  giga_dialog.11301.name:99 "Chantier de construction de la $name_the_vat$ achevé"
  giga_dialog.11301.desc:99 "Le chantier de construction de la $name_the_vat_long$ est désormais achevé. Cette plateforme orbitale sert de base pour construire les structures nécessaires à l'édification de la plus grande cuve jamais conçue.\n\nUne fois achevée, elle sera capable de produire rapidement de grandes quantités de créatures biologiques pour servir dans nos flottes."
  giga_dialog.11301.a:99 "Parfait."

  giga_dialog.11302.name:99 "Cuve principale construite"
  giga_dialog.11302.desc:99 "La cuve principale de notre installation de clonage orbitale a été construite. Elle servira désormais de plus grande cuve de clonage de ce type, capable de créer des clones véritablement massifs de diverses conceptions.\n\n§YVaincre un léviathan biologique nous permettra de le cloner dans n'importe quelle Cuve principale de Cuve C.I.B.§!"
  giga_dialog.11302.a:99 "Excellent."

  giga_dialog.11303.name:99 "1re et 2e cuves auxiliaires construites"
  giga_dialog.11303.desc:99 "Une autre étape importante dans la construction de la $name_the_vat_long$ est désormais achevée. Ces cuves auxiliaires nous permettent de cloner davantage de spécimens simultanément, augmentant l'efficacité de la structure."
  giga_dialog.11303.a:99 "Parfait."

  giga_dialog.11304.name:99 "3e et 4e cuves auxiliaires construites"
  giga_dialog.11304.desc:99 "Une nouvelle étape dans la construction de notre $name_the_vat_long$ est achevée. Ces cuves supplémentaires permettront de produire encore plus de clones en parallèle."
  giga_dialog.11304.a:99 "Formidable !"

  giga_dialog.11305.name:99 "5e et 6e cuves auxiliaires construites"
  giga_dialog.11305.desc:99 "La $name_the_vat_long$ est achevée. Avec 6 cuves auxiliaires et une cuve principale gargantuesque, nous serons en mesure de cloner des flottes entières d'abominations géantes en un temps très court, nous permettant de dominer le champ de bataille d'une manière jamais envisagée auparavant."
  giga_dialog.11305.a:99 "Que le clonage commence."

  the_vat_0:99 "$gc_mega$Chantier de construction de la $name_the_vat$"
  the_vat_0_DESC:99 "Le chantier de construction d'une future cuve, contenant tout ce dont nos ingénieurs et biologistes auront besoin pour transformer ce site en une gigantesque installation de clonage."
  the_vat_0_MEGASTRUCTURE_DETAILS:99 "£galwonders£ $giga_list_category_megastructure$ - $giga_list_category_ship_production$\nUtilise £food£ §Y$food$§! pour créer des §YVaisseaux de guerre biologiques§! basés sur des §YLéviathans§! et §YExtraterrestres spatiaux§! connus\n§LLa Cuve de Croissance Impétueuse Biologique est une installation de clonage spatiale capable de produire de grandes quantités de vaisseaux spatiaux biologiques.§!" #gigalistentry BIG VAT

  the_vat_1:99 "$name_the_vat$ : Cuve principale"
  the_vat_1_DESC:99 "Ce sera la plus grande cuve de clonage de ce type, capable de créer de nombreux clones massifs."

  the_vat_2:99 "$name_the_vat$ : Cuves auxiliaires"
  the_vat_2_DESC:99 "$the_vat_1_DESC$ Avec des installations supplémentaires pour améliorer la vitesse de clonage."

  the_vat_3:99 "$name_the_vat$ : Cuves auxiliaires"
  the_vat_3_DESC:99 "$the_vat_1_DESC$ Avec des installations supplémentaires pour améliorer davantage la vitesse de clonage."

  the_vat_4:99 "$name_the_vat$"
  the_vat_4_DESC:99 "C'est la plus grande cuve de clonage de ce type, capable de créer de nombreux clones massifs. Avec six cuves auxiliaires et une cuve principale gargantuesque, cette installation est pleinement prête à cloner des flottes entières d'abominations géantes."

  the_vat_menu_title:99 "§cCuve de Croissance Impétueuse Biologique§!"
  the_vat_menu_desc:99 "La §cCuve C.I.B.§! est un chantier naval biologique. La cuve principale clone deux fois plus vite que les cuves auxiliaires.\n\nUn modèle aléatoire est sélectionné lors du clonage de faune ; gardez cela à l'esprit si vous souhaitez éviter les coûts de réaménagement."


