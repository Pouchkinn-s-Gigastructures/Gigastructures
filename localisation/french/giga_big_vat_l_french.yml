  giga_maximum_mutation_title:99 "§cMutation maximale§!"
  giga_maximum_mutation_desc:99 "Dans la quête de notre destinée génétique, toutes les voies possibles doivent être envisagées, aussi étranges et ésotériques puissent-elles paraître."

  giga_prethoryn_larvae:99 "Larve mutée"
  giga_prethoryn_larvae_desc_short:99 "Une petite larve frétillante. Croît extrêmement vite. Pourrait être écrasée d'un coup de pied."
  giga_prethoryn_larvae_desc_details:99 ""

  giga_vat_maximum_mutation_1:99 "Mutation maximale : Inceptus"
  giga_vat_maximum_mutation_2:99 "Mutation maximale : Virulus"
  giga_vat_maximum_mutation_3:99 "Mutation maximale : Aureus"
  giga_vat_maximum_mutation_4:99 "Mutation maximale : Exaltus"
  giga_vat_maximum_mutation_1_DESC:99 "La genèse est d'une importance capitale, définissant la trajectoire de nos mutations. Seul le temps nous dira si ce projet portera ses fruits comme l'affirment ses promoteurs."
  giga_vat_maximum_mutation_2_DESC:99 "Les étapes suivantes, tout aussi cruciales que les premières. Comment peut-on ériger un palais si ce n'est sur des fondations édifiées de nombreuses fois ?"
  giga_vat_maximum_mutation_3_DESC:99 "Tout projet exige révisions et examens. Comment améliorer notre conception ? Quels défauts pouvons-nous minimiser ? Il est temps pour nos spécimens d'atteindre la perfection."
  giga_vat_maximum_mutation_4_DESC:99 "La clé de voûte parachève toute grande oeuvre, sous peine qu'elle ne s'effondre sous son propre poids."

  giga_vat_events.100.name:99 "Maximiser la mutation"
  giga_vat_events.100.desc:99 "Ayant accès à un dispositif de clonage si vaste et efficace, nos scientifiques ont conçu une idée pour le moins singulière. Qu'adviendrait-il si l'on combinait et mutait chaque échantillon de matériel génétique que notre empire a jamais collecté, quel qu'il soit ? Aussi bizarre que puisse paraître cette idée, elle pourrait mener à certaines avancées en biologie, et peut-être que les créatures issues de ce projet trouveront leur place sur la scène de la guerre galactique."
  giga_vat_events.100.a:99 "Qu'est-ce qui pourrait mal tourner ?"

  giga_vat_events.101.name:99 "Inceptus"
  giga_vat_events.101.desc:99 "Fort de résultats initiaux prometteurs, les scientifiques sur [capital.GetName] se préparent à des expériences de plus grande envergure. Grâce aux vastes laboratoires de la $name_the_vat$, ils ambitionnent de créer un spécimen de la taille d'une corvette. Reste à voir s'il sera inférieur ou supérieur aux capacités d'une corvette."
  giga_vat_events.101.a:99 "$INTRIGUING$"

  giga_vat_events.1011.name:99 "Conception d'Inceptus"
  giga_vat_events.1011.desc:99 "Nous l'avons regardé grandir. Nous l'avons regardé se nourrir. À travers tout cela, la colère, la peur, la frustration. Nous ignorons comment nous percevions ses émotions. Il était si gargantuesque, et pourtant si petit, encore effrayé par nous. Il pourrait nous écraser ou nous dissoudre en un instant. Pourquoi avait-il peur ? Peur de ce que nous lui ferions s'il nous attaquait ? Ou peur de ce que nous créerions ensuite ?"
  giga_vat_events.1011.a:99 "$DISCONCERTING$"

  giga_vat_events.102.name:99 "Virulus"
  giga_vat_events.102.desc:99 "Suite au succès d'Inceptus, les scientifiques en chef proposent une expérience encore plus ambitieuse : un spécimen de la taille d'un destroyer. Bien que de nombreux membres de l'équipe aient leurs réserves, le feu vert a été donné et les travaux ont commencé pour pousser les mutations encore plus loin."
  giga_vat_events.102.a:99 "$GOOD$"

  giga_vat_events.1021.name:99 "Une force virulente"
  giga_vat_events.1021.desc:99 "La rage. Toute autre émotion secondaire face à cette mixture de violence et de colère. Il se débattait contre ses entraves qui l'empêchaient de déchirer la station. Des jours durant, il se débattit. Sa rage était-elle sans fin ? Pendant ce temps, nous percevions des changements chez nos plus petits spécimens : des sentiments similaires de colère mêlés de peur. Ils semblent partager un lien, quelque chose de plus profond qu'un simple lien familial, comme s'ils étaient les parties d'un organisme plus vaste."
  giga_vat_events.1021.a:99 "$DISTURBING$"

  giga_vat_events.103.name:99 "Aureus"
  giga_vat_events.103.desc:99 "Depuis le début du projet, nos amiraux et autres membres du commandement militaire ont exprimé un vif intérêt pour ces travaux. Ils demandent un spécimen doté de capacités comparables à celles d'un transporteur. De nombreux scientifiques affectés à la $name_the_vat$ ont démissionné ou refusent de travailler, mais quelques irréductibles persévèrent dans la quête de la perfection."
  giga_vat_events.103.a:99 "$INCREDIBLE$"

  giga_vat_events.1031.name:99 "Ascension biologique"
  giga_vat_events.1031.desc:99 "La rage, encore. Monumentale, cette fois. Les convulsions étaient plus violentes aussi. Un jour, tout s'est arrêté. Un seul sentiment fut perçu ce jour-là : l'obéissance. Ils avaient réussi à contrôler cette créature indisciplinée qu'ils avaient créée. Elle s'était soumise, et avec elle, tous les autres spécimens. Plus de rage, ni de peur, ni de frustration. L'obéissance rayonnait. L'organisme nous a acceptés."
  giga_vat_events.1031.a:99 "$ASTOUNDING$"

  giga_vat_events.104.name:99 "Exaltus"
  giga_vat_events.104.desc:99 "Nous avions atteint la perfection, mais si nous allions plus loin ? Après avoir accompli un tel prodige, pourrait-il y avoir davantage ? Certains dans l'équipe suggèrent de viser aussi haut que possible. En cas de succès, l'ultime étape de l'évolution pourrait être réalisée."
  giga_vat_events.104.a:99 "$UNDERSTOOD$"

  giga_vat_events.1041.name:99 "Mutation maximisée"
  giga_vat_events.1041.desc:99 "La forme de vie ultime, nos magnifiques spécimens, enfin créés et matérialisés devant nous. Leur puissance fera réfléchir à deux fois nos ennemis avant de nous défier sur la scène galactique. Nous avons acquis quelque chose d'unique grâce à ce projet. Nos spécimens et nous partageons cette connexion. Nos esprits et les leurs sont entrelacés en une seule entité. Si une telle force était lâchée sur une galaxie, nul ne saurait prédire ce qui pourrait advenir. Au cours du programme, certains de nos spécimens ont tenté de s'échapper. Heureusement, tous ont été éliminés. Enfin, tous sauf quelques-uns qui se sont enfuis vers l'espace intergalactique. Ils ne causeront sûrement aucun problème."
  giga_vat_events.1041.a:99 "Sûrement..."

