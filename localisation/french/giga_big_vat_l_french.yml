  giga_maximum_mutation_title:99 "§cMutation maximale§!"
  giga_maximum_mutation_desc:99 "Dans la poursuite de notre destinée génétique, toutes les voies possibles doivent être envisagées, aussi étranges et ésotériques qu'elles puissent paraître."

  giga_prethoryn_larvae:99 "Larve mutée"
  giga_prethoryn_larvae_desc_short:99 "Une petite larve frétillante. Croît extrêmement vite. Pourrait être écrasée sous le pied."
  giga_prethoryn_larvae_desc_details:99 ""

  giga_vat_maximum_mutation_1:99 "Mutation maximale : Inceptus"
  giga_vat_maximum_mutation_2:99 "Mutation maximale : Virulus"
  giga_vat_maximum_mutation_3:99 "Mutation maximale : Aureus"
  giga_vat_maximum_mutation_4:99 "Mutation maximale : Exaltus"
  giga_vat_maximum_mutation_1_DESC:99 "L'inception est d'une grande importance, définissant la progression de nos mutations. Seul le temps dira si ce projet portera autant de fruits que ne l'affirment ses promoteurs."
  giga_vat_maximum_mutation_2_DESC:99 "Les étapes suivantes, tout aussi importantes que la première. Comment peut-on bâtir un palais si ce n'est sur des fondations solides, élevées avec soin."
  giga_vat_maximum_mutation_3_DESC:99 "Avec tout projet, des révisions et des examens doivent être effectués. Comment pouvons-nous améliorer notre conception ? Quels défauts pouvons-nous minimiser ? Le moment est venu pour nos spécimens d'accéder à la perfection."
  giga_vat_maximum_mutation_4_DESC:99 "La clé de voûte achève toute grande oeuvre, de peur qu'elle ne s'effondre sous son propre poids."

  giga_vat_events.100.name:99 "Maximisation de la mutation"
  giga_vat_events.100.desc:99 "Avec l'accès à un ensemble si vaste et efficace de dispositifs de clonage, nos scientifiques ont conçu une idée assez particulière. Qu'adviendrait-il si nous combinions et mutations chaque échantillon de matériel génétique que notre empire a jamais collecté, quel qu'il soit. Aussi bizarre que soit l'idée, elle pourrait mener à des avancées en biologie, et peut-être que les créatures conçues par ce projet auront des applications sur la scène de la guerre galactique."
  giga_vat_events.100.a:99 "Qu'est-ce qui pourrait mal tourner ?"

  giga_vat_events.101.name:99 "Inceptus"
  giga_vat_events.101.desc:99 "Avec des résultats initiaux prometteurs, les scientifiques sur [capital.GetName] préparent des expériences à plus grande échelle. Grâce aux laboratoires extensifs de la $name_the_vat$, ils visent à produire un spécimen de la taille d'une corvette. Reste à voir s'il sera en deçà ou au-delà des capacités d'une corvette."
  giga_vat_events.101.a:99 "$INTRIGUING$"

  giga_vat_events.1011.name:99 "Conception d'Inceptus"
  giga_vat_events.1011.desc:99 "Nous l'avons regardé croître. Regardé se nourrir. À travers tout cela, colère, peur, frustration. Nous ne savons pas comment nous percevions ses émotions. Il était si gargantuesque, mais encore si petit, encore effrayé par nous. Il pourrait nous écraser ou nous dissoudre en un instant. Pourquoi avait-il peur ? Peur de ce que nous lui ferions s'il nous attaquait ? Ou peur de ce que nous créerions ensuite."
  giga_vat_events.1011.a:99 "$DISCONCERTING$"

  giga_vat_events.102.name:99 "Virulus"
  giga_vat_events.102.desc:99 "Suite au succès d'Inceptus, les scientifiques en chef proposent une expérience encore plus ambitieuse, de la taille d'un destroyer. Bien que nombre de membres de l'équipe aient des réserves, le feu vert a été donné et les travaux ont commencé pour muter encore davantage."
  giga_vat_events.102.a:99 "$GOOD$"

  giga_vat_events.1021.name:99 "Une force virulente"
  giga_vat_events.1021.desc:99 "La rage. Toute émotion secondaire face à ce mélange de violence et de colère. Il se débattait contre ses entraves qui l'empêchaient de déchirer la station. Des jours durant il se débattit, sa rage était-elle sans fin ? Pendant tout ce temps, nous percevions des changements chez nos spécimens plus petits, des sentiments similaires de colère mêlés de peur. Ils semblent partager un lien, quelque chose de plus grand qu'un simple lien familial, comme s'ils faisaient partie d'un organisme plus vaste."
  giga_vat_events.1021.a:99 "$DISTURBING$"

  giga_vat_events.103.name:99 "Aureus"
  giga_vat_events.103.desc:99 "Depuis le début du projet, nos amiraux et autres membres du personnel militaire ont exprimé un grand intérêt pour ce projet. Ils demandent un spécimen aux capacités quasi similaires à celles d'un porte-nef. De nombreux scientifiques affectés à la $name_the_vat$ ont démissionné ou refusent de travailler, mais quelques-uns persévèrent dans la quête de la perfection."
  giga_vat_events.103.a:99 "$INCREDIBLE$"

  giga_vat_events.1031.name:99 "Ascension biologique"
  giga_vat_events.1031.desc:99 "La rage, encore. Monumentale comparée à avant. Les débattements étaient plus forts aussi. Un jour, tout s'est arrêté. Un seul sentiment fut ressenti ce jour-là. L'obéissance. Ils avaient réussi, ils avaient maîtrisé cette créature indocile qu'ils avaient créée. Elle s'était soumise, et avec elle tous les autres spécimens. Plus de rage ni de peur ni de frustration. L'obéissance rayonnait. L'organisme nous a acceptés."
  giga_vat_events.1031.a:99 "$ASTOUNDING$"

  giga_vat_events.104.name:99 "Exaltus"
  giga_vat_events.104.desc:99 "Nous avions atteint la perfection, mais si nous allions plus loin ? Après avoir atteint la grandeur, pourrait-il y avoir davantage ? Certains dans l'équipe disent : pourquoi ne pas viser le plus haut possible. En cas de succès, l'étape finale de l'évolution pourrait être réalisée."
  giga_vat_events.104.a:99 "$UNDERSTOOD$"

  giga_vat_events.1041.name:99 "Mutation maximisée"
  giga_vat_events.1041.desc:99 "La forme de vie ultime, nos magnifiques spécimens, enfin créés et réalisés devant nous. Leur force fera réfléchir nos ennemis à deux fois avant de nous défier sur la scène galactique. Nous avons acquis quelque chose d'unique de ce projet. Nos spécimens et nous partageons cette connexion. Nos esprits et les leurs entrelacés comme une entité unique. Si une telle force était libérée sur une galaxie, nul ne sait ce qui pourrait arriver. Tout au long du programme, il y a eu des tentatives d'évasion de nos spécimens. Heureusement, toutes ont été éliminées. Bien qu'il y ait eu ces quelques-uns qui se sont échappés et ont pris la direction de l'espace intergalactique. Ils ne causeront sûrement pas de problèmes."
  giga_vat_events.1041.a:99 "Sûrement..."

