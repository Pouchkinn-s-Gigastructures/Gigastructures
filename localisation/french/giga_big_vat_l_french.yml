  giga_tech_the_vat:0 "Installations de clonage gargantuesque"
  giga_tech_the_vat_desc:0 "L'avènement d'une nouvelle ère de génie génétique a ouvert la voie à des projets encore plus grands et plus ambitieux. Alors qu'elles étaient auparavant restreintes aux planètes, d'immenses installations de clonage orbitales nous permettraient de bio-ingénierer et de faire croître rapidement de véritables armadas de créatures spatiales pour renforcer encore davantage notre flotte."
  
  giga_dialog.11301.name:0 "Chantier de construction de la $name_the_vat$ terminé"
  giga_dialog.11301.desc:0 "Le chantier de construction de la $name_the_vat_long$ est maintenant terminé. Cette plateforme orbitale sert de base pour construire les structures nécessaires pour commencer à bâtir la plus grande cuve jamais conçue.\n\nUne fois terminée, elle sera capable de produire rapidement de grandes quantités de créatures biologiques pour servir dans nos flottes en utilisant de la £food£ et de l'£energy£"
  giga_dialog.11301.a:0 "Formidable."
  
  giga_dialog.11302.name:0 "Cuve primaire construite"
  giga_dialog.11302.desc:0 "La cuve primaire de notre installation de clonage orbital a été construite. Elle servira désormais de la plus grande cuve de clonage de son genre, capable de créer des clones vraiment massifs de conceptions variées.\n\n§YVaincre un léviathan biologique nous permettra de le cloner dans n'importe quelle cuve primaire de Cuve C.I.B.§!"
  giga_dialog.11302.a:0 "Excellent."
  
  giga_dialog.11303.name:0 "1ère et 2ème cuves auxiliaires construites"
  giga_dialog.11303.desc:0 "Une autre étape importante dans la construction de la $name_the_vat_long$ est maintenant terminée. Ces cuves auxiliaires nous permettent de cloner plus de spécimens à la fois, augmentant l'efficacité de la structure."
  giga_dialog.11303.a:0 "Formidable."
  
  giga_dialog.11304.name:0 "3ème et 4ème cuves auxiliaires construites"
  giga_dialog.11304.desc:0 "Encore une autre étape dans la construction de notre $name_the_vat_long$ est terminée. Ces cuves supplémentaires permettront de produire encore plus de clones simultanément."
  giga_dialog.11304.a:0 "Incroyable !"
  
  giga_dialog.11305.name:0 "5ème et 6ème cuves auxiliaires construites"
  giga_dialog.11305.desc:0 "La $name_the_vat_long$ est terminée. Avec 6 cuves auxiliaires et une cuve primaire gargantuesque, nous serons capables de cloner des flottes entières d'abominations géantes en très peu de temps, nous permettant de dominer le champ de bataille d'une manière jamais envisagée auparavant."
  giga_dialog.11305.a:0 "Que le clonage commence."
  
  the_vat_0:0 "$gc_mega$Chantier de construction de la $name_the_vat$"
  the_vat_0_DESC:0 "Le chantier de construction d'une future cuve, contenant tout ce dont nos ingénieurs et biologistes auront besoin pour transformer cela en une gigantesque installation de clonage."
  the_vat_0_MEGASTRUCTURE_DETAILS:0 "£galwonders£ $giga_list_category_megastructure$ - $giga_list_category_ship_production$\nUtilise de la £food£ pour créer des §Yvaisseaux de guerre biologiques§! basés sur les §YLéviathans§! et les §Yextraterrestres spatiaux§! connus\n§LLa Cuve de Croissance Impétueuse Biologique est une installation de clonage spatiale capable de produire de grandes quantités de vaisseaux spatiaux biologiques.§!" #gigalistentry BIG VAT
  
  the_vat_1:0 "$name_the_vat$ : Cuve primaire"
  the_vat_1_DESC:0 "Ce sera la plus grande cuve de clonage de son genre, capable de créer de nombreux clones massifs."
  
  the_vat_2:0 "$name_the_vat$ : Cuves auxiliaires"
  the_vat_2_DESC:0 "$the_vat_1_DESC$ Avec des installations supplémentaires pour améliorer les vitesses de clonage."
  
  the_vat_3:0 "$name_the_vat$ : Cuves auxiliaires"
  the_vat_3_DESC:0 "$the_vat_1_DESC$ Avec des installations supplémentaires pour améliorer encore les vitesses de clonage."
  
  the_vat_4:0 "$name_the_vat$"
  the_vat_4_DESC:0 "C'est la plus grande cuve de clonage de son genre, capable de créer de nombreux clones massifs. Avec six cuves auxiliaires et une cuve primaire gargantuesque, cette installation est entièrement prête à cloner des flottes entières d'abominations géantes."
  
  the_vat_menu_title:0 "§cCuve de Croissance Impétueuse Biologique§!"
  the_vat_menu_desc:0 "---------------------------------------------------------------\nLa §cCuve C.I.B.§! est un chantier naval biologique. La cuve primaire clone deux fois plus vite que les cuves auxiliaires. Un design aléatoire est sélectionné lors du clonage de la faune, soyez conscient de cela si vous voulez éviter les coûts de rénovation."
  
  
