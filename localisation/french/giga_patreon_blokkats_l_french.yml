l_french:

    trait_blokkat_blokkimous:0 "Enthousiaste du multivers"
    trait_blokkat_blokkimous_desc:0 "Ce Blokkat semble avoir trouvé des preuves que notre univers fait partie d'une sorte de « multivers temporel » s'étendant vers l'éternité et montre un intérêt pour l'étude de ce nouveau phénomène."

    prison_blokkat_is_blokkimous:0 "§MEnthousiaste du multivers§! - Ce Blokkat semble avoir trouvé des preuves que notre univers fait partie d'une sorte de « multivers temporel » s'étendant vers l'éternité et montre un intérêt pour l'étude de ce nouveau phénomène."

    trait_blokkat_baron:0 "Complètement dérangé"
    trait_blokkat_baron_desc:0 "Ce Blokkat a une fascination bizarre pour la randomisation et la distorsion de toute chose par rapport à son état naturel. Il semble également s'être forgé une aura d'aristocratie et d'élitisme."

    prison_blokkat_is_baron:0 "§RComplètement dérangé§! - Ce Blokkat a une fascination bizarre pour la randomisation et la distorsion de toute chose par rapport à son état naturel. Il semble également s'être forgé une aura d'aristocratie et d'élitisme."

    trait_blokkat_blokkepsii:0 "Empathique"
    trait_blokkat_blokkepsii_desc:0 "Ce Blokkat semble se soucier profondément des autres espèces et consacre son temps à les étudier. De plus, bien qu'apparemment toujours concentré sur les opérations de récolte, il semble parfaitement disposé à aider les autres espèces de toutes les manières possibles."

    prison_blokkat_is_blokkepsii:0 "§EEmpathique§! - Ce Blokkat semble se soucier profondément des autres espèces et consacre son temps à les étudier. De plus, bien qu'apparemment toujours concentré sur les opérations de récolte, il semble parfaitement disposé à aider les autres espèces de toutes les manières possibles. "

    trait_blokkat_bloblokkad:0 "Chef scientifique"
    trait_blokkat_bloblokkad_desc:0 "Ce Blokkat semble apprécier la quête du savoir par-dessus tout. On peut régulièrement le voir expérimenter sur des « primitifs » ou bricoler quelque projet insensé."

    prison_blokkat_is_bloblokkad:0 "§EChef scientifique§! - Ce Blokkat semble apprécier la quête du savoir par-dessus tout. On peut régulièrement le voir expérimenter sur des « primitifs » ou bricoler quelque projet insensé."

    trait_blokkat_blokkofett:0 "Nouvlien"
    trait_blokkat_blokkofett_desc:0 "Ce Blokkat faisait partie d'une nation spatiale comme la nôtre qui a complété les Blokk-Protocoles et a rejoint les Blokkats. Cette opération de récolte galactique est leur première, et ils ont été assignés à l'étude des entités nationales."

    prison_blokkat_is_blokkofett:0 "§HNouvlien§! - Ce Blokkat faisait partie d'une nation spatiale comme la nôtre qui a complété les Blokk-Protocoles et a rejoint les Blokkats. Cette opération de récolte galactique est leur première, et ils ont été assignés à l'étude des entités nationales."

    trait_blokkat_blokkutos:0 "Rêveur"
    trait_blokkat_blokkutos_desc:0 "Ce Blokkat a toujours un sentiment de nostalgie pour le passé et rêve d'un avenir meilleur. Ses rêves inspirent l'unité, l'espoir et une fascination pour l'inconnu à ceux qui l'entourent."

    prison_blokkat_is_blokkutos:0 "§MRêveur§! - Ce Blokkat a toujours un sentiment de nostalgie pour le passé et rêve d'un avenir meilleur. Ses rêves inspirent l'unité, l'espoir et une fascination pour l'inconnu à ceux qui l'entourent."

    trait_blokkat_sophia:0 "Chevalier de la Rose"
    trait_blokkat_sophia_desc:0 "Ce Blokkat, pour une raison quelconque, prétend et apprécie être ce qu'il appelle lui-même un Chevalier de la Rose, semblant connaître toutes les méthodes de guerre jusqu'à celles qui paraissent carrément archaïques d'une manière ou d'une autre."

    prison_blokkat_is_sophia:0 "§PChevalier de la Rose§! - Ce Blokkat, pour une raison quelconque, prétend et apprécie être ce qu'il appelle lui-même un Chevalier de la Rose, semblant connaître toutes les méthodes de guerre jusqu'à celles qui paraissent carrément archaïques d'une manière ou d'une autre. Il semble plutôt indifférent à l'idée de nous aider ou d'aider les Blokkats eux-mêmes dans leurs opérations de récolte. Il demande aussi souvent qu'on l'appelle simplement « Rose ». Il a un désir fanatique de tirer tout ce qu'il peut faire entrer dans des canons sur les vaisseaux ennemis, et s'enfuit aussi souvent quand il sait que sa vie est en danger. Il aime aussi, pour une raison quelconque, tenter d'éperonner des vaisseaux les uns contre les autres.\n\nEnfin, il prétend vouloir voir « Le Plus Grand Spectacle que quoi que ce soit puisse jamais voir ». Tout le monde se demande ce que cela peut bien être."

    trait_blokkat_blokknight:0 "Chevalier de la Rose"
    trait_blokkat_blokknight_desc:0 "Ce Blokkat semble aimer se déguiser, racontant des histoires sans fin d'exploits et d'interactions valeureuses avec des civilisations primitives précédentes. Il semble aussi avoir une obsession malsaine pour les armes et armures primitives, s'assurant constamment qu'on en produise autant que possible."

    prison_blokkat_is_blokknight:0 "§LLe Retour du Blokknight§! - Ce Blokkat semble aimer se déguiser, racontant des histoires sans fin d'exploits et d'interactions valeureuses avec des civilisations primitives précédentes. Il semble aussi avoir une obsession malsaine pour les armes et armures primitives, s'assurant constamment qu'on en produise autant que possible."

    trait_blokkat_yoru:0 "Vicieusement psychotique"
    trait_blokkat_yoru_desc:0 "Ce Blokkat semble déterminé à accomplir l'annihilation ultime de toutes les formes de vie."

    prison_blokkat_is_yoru:0 "§RVicieusement psychotique§! - Ce Blokkat semble déterminé à accomplir l'annihilation ultime de toutes les formes de vie. Pourquoi ? Peut-être qu'il s'est fait ping sur le Blokkwork, peut-être qu'il a brûlé son blokktartine ce matin, ou peut-être... qu'il est juste fou."

    trait_blokkat_silly:0 "Rigolo"
    trait_blokkat_silly_desc:0 "Ce Blokkat est plein de fantaisie et de joie. Chaque Blokkat sait qu'il ne faut pas défier PIEBLOKK parce que je suis le plus fort ! :3"

    prison_blokkat_is_pieblokk:0 "§CTrès rigolo :3§! - $trait_blokkat_silly_desc$"

    trait_blokkat_megastructure_obession:0 "Obsession des mégastructures"
    trait_blokkat_megastructure_obession_desc:0 "Ce Blokkat montre un grand intérêt pour toutes les formes de mégastructures artificielles, depuis celles montrées dans les divertissements de science-fiction primitifs jusqu'aux plans incroyablement compliqués de structures éclipsant des galaxies entières."

    prison_blokkat_is_tempestkat:0 "§MObsession des mégastructures§! - $trait_blokkat_megastructure_obession_desc$"
