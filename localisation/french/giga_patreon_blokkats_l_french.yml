l_french:

    trait_blokkat_blokkimous:99 "Passionné du multivers"
    trait_blokkat_blokkimous_desc:99 "Ce Chat Block semble avoir trouvé des preuves que notre univers fait partie d'une sorte de « multivers temporel » s'étendant à l'infini et montre un intérêt pour l'étude de ce phénomène nouvellement découvert."

    prison_blokkat_is_blokkimous:99 "§MPassionné du multivers§! - Ce Chat Block semble avoir trouvé des preuves que notre univers fait partie d'une sorte de « multivers temporel » s'étendant à l'infini et montre un intérêt pour l'étude de ce phénomène nouvellement découvert."

    trait_blokkat_baron:99 "Complètement dérangé"
    trait_blokkat_baron_desc:99 "Ce Chat Block a une fascination bizarre pour la randomisation et la distorsion de toute chose depuis son état naturel. Il semble également s'être forgé une aura d'aristocratie et d'élitisme."

    prison_blokkat_is_baron:99 "§RComplètement dérangé§! - Ce Chat Block a une fascination bizarre pour la randomisation et la distorsion de toute chose depuis son état naturel. Il semble également s'être forgé une aura d'aristocratie et d'élitisme."

    trait_blokkat_blokkepsii:99 "Empathique"
    trait_blokkat_blokkepsii_desc:99 "Ce Chat Block semble se soucier profondément des autres espèces et consacre son temps à les étudier. De plus, bien qu'il semble toujours concentré sur les opérations de récolte, il paraît parfaitement disposé à assister les autres espèces de toutes les manières possibles."

    prison_blokkat_is_blokkepsii:99 "§EEmpathique§! - Ce Chat Block semble se soucier profondément des autres espèces et consacre son temps à les étudier. De plus, bien qu'il semble toujours concentré sur les opérations de récolte, il paraît parfaitement disposé à assister les autres espèces de toutes les manières possibles. "

    trait_blokkat_bloblokkad:99 "Chef scientifique"
    trait_blokkat_bloblokkad_desc:99 "Ce Chat Block semble apprécier la quête du savoir par-dessus tout. On peut régulièrement le voir expérimenter sur des « primitifs » ou bricoler quelque projet insensé."

    prison_blokkat_is_bloblokkad:99 "§EChef scientifique§! - Ce Chat Block semble apprécier la quête du savoir par-dessus tout. On peut régulièrement le voir expérimenter sur des « primitifs » ou bricoler quelque projet insensé."

    trait_blokkat_blokkofett:99 "Nouvelle liaison"
    trait_blokkat_blokkofett_desc:99 "Ce Chat Block faisait partie d'une nation spatiale comme la nôtre qui a complété les Protocoles-Chat Block et a rejoint les Chats Blocks. Cette opération de récolte galactique est sa première, et il a été assigné à l'étude des entités nationales."

    prison_blokkat_is_blokkofett:99 "§HNouvelle liaison§! - Ce Chat Block faisait partie d'une nation spatiale comme la nôtre qui a complété les Protocoles-Chat Block et a rejoint les Chats Blocks. Cette opération de récolte galactique est sa première, et il a été assigné à l'étude des entités nationales."

    trait_blokkat_blokkutos:99 "Rêveur"
    trait_blokkat_blokkutos_desc:99 "Ce Chat Block a toujours un sentiment de nostalgie pour le passé et rêve d'un avenir meilleur. Ses rêves inspirent l'unité, l'espoir et une fascination pour l'inconnu chez ceux qui l'entourent."

    prison_blokkat_is_blokkutos:99 "§MRêveur§! - Ce Chat Block a toujours un sentiment de nostalgie pour le passé et rêve d'un avenir meilleur. Ses rêves inspirent l'unité, l'espoir et une fascination pour l'inconnu chez ceux qui l'entourent."

    trait_blokkat_sophia:99 "Chevalier de la rose"
    trait_blokkat_sophia_desc:99 "Ce Chat Block, pour une raison quelconque, prétend être et apprécie ce qu'il appelle lui-même un chevalier de la rose, semblant connaître toutes les méthodes de guerre, jusqu'à celles qui paraissent carrément archaïques d'une manière ou d'une autre."

    prison_blokkat_is_sophia:99 "§PChevalier de la rose§! - Ce Chat Block, pour une raison quelconque, prétend être et apprécie ce qu'il appelle lui-même un chevalier de la rose, semblant connaître toutes les méthodes de guerre, jusqu'à celles qui paraissent carrément archaïques d'une manière ou d'une autre. Il semble plutôt indifférent tant à nous aider qu'à aider les Chats Blocks eux-mêmes dans leurs opérations de récolte. Il demande aussi souvent qu'on l'appelle simplement « Rose ». Il a un désir fanatique de tirer tout ce qu'il peut faire rentrer dans des canons sur les vaisseaux ennemis, et fuit souvent quand il sait que sa vie est en danger. Il apprécie également, pour une raison quelconque, tenter de faire s'éperonner les vaisseaux les uns les autres.\n\nEnfin, il prétend vouloir voir « le plus grand spectacle que quoi que ce soit pourrait jamais voir ». Tout le monde est perplexe quant à ce que cela pourrait être."

    trait_blokkat_blokknight:99 "Chevalier de la rose"
    trait_blokkat_blokknight_desc:99 "Ce Chat Block semble aimer jouer à se déguiser, racontant d'interminables histoires d'exploits et d'interactions valeureuses avec de précédentes civilisations primitives. Il semble également avoir une obsession malsaine pour les armes et armures primitives, s'assurant constamment qu'un maximum en soit produit."

    prison_blokkat_is_blokknight:99 "§LLe Chat Blockknight revient§! - Ce Chat Block semble aimer jouer à se déguiser, racontant d'interminables histoires d'exploits et d'interactions valeureuses avec de précédentes civilisations primitives. Il semble également avoir une obsession malsaine pour les armes et armures primitives, s'assurant constamment qu'un maximum en soit produit."

    trait_blokkat_yoru:99 "Violemment psychotique"
    trait_blokkat_yoru_desc:99 "Ce Chat Block semble déterminé à accomplir l'annihilation ultime de toutes les formes de vie."

    prison_blokkat_is_yoru:99 "§RViolemment psychotique§! - Ce Chat Block semble déterminé à accomplir l'annihilation ultime de toutes les formes de vie. Pourquoi ? Peut-être qu'il s'est fait mentionner sur le Chat Blockwork, peut-être qu'il a brûlé son chat-blocktoast ce matin, ou peut-être... qu'il est simplement fou."

    trait_blokkat_silly:99 "Farceur"
    trait_blokkat_silly_desc:99 "Ce Chat Block est plein de fantaisie et de joie. Chaque Chat Block sait qu'il ne faut pas défier PIEBLOKK parce que je suis le plus fort ! :3"

    prison_blokkat_is_pieblokk:99 "§CTrès farceur :3§! - $trait_blokkat_silly_desc$"

    trait_blokkat_megastructure_obession:99 "Obsession des mégastructures"
    trait_blokkat_megastructure_obession_desc:99 "Ce Chat Block montre un grand intérêt pour toutes les formes de mégastructures artificielles, de celles présentées dans les divertissements de science-fiction primitifs jusqu'aux plans incroyablement complexes pour des structures éclipsant des galaxies entières."

    prison_blokkat_is_tempestkat:99 "§MObsession des mégastructures§! - $trait_blokkat_megastructure_obession_desc$"
