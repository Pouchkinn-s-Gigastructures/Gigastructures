l_french:

    trait_blokkat_blokkimous:99 "Passionné du multivers"
    trait_blokkat_blokkimous_desc:99 "Ce Chat Block semble avoir trouvé des preuves que notre univers fait partie d'une sorte de « multivers temporel » s'étendant vers l'éternité et montre un intérêt pour l'étude de ce phénomène nouvellement découvert."

    prison_blokkat_is_blokkimous:99 "§MPassionné du multivers§! - Ce Chat Block semble avoir trouvé des preuves que notre univers fait partie d'une sorte de « multivers temporel » s'étendant vers l'éternité et montre un intérêt pour l'étude de ce phénomène nouvellement découvert."

    trait_blokkat_baron:99 "Complètement dérangé"
    trait_blokkat_baron_desc:99 "Ce Chat Block a une fascination bizarre pour la randomisation et la distorsion de toute chose de son état naturel. Il semble également s'être façonné une aura d'aristocratie et d'élitisme."

    prison_blokkat_is_baron:99 "§RComplètement dérangé§! - Ce Chat Block a une fascination bizarre pour la randomisation et la distorsion de toute chose de son état naturel. Il semble également s'être façonné une aura d'aristocratie et d'élitisme."

    trait_blokkat_blokkepsii:99 "Empathique"
    trait_blokkat_blokkepsii_desc:99 "Ce Chat Block semble se soucier profondément des autres espèces et consacre son temps à les étudier. De plus, bien qu'apparemment toujours concentré sur les opérations de récolte, il semble parfaitement disposé à aider les autres espèces de toutes les manières possibles."

    prison_blokkat_is_blokkepsii:99 "§EEmpathique§! - Ce Chat Block semble se soucier profondément des autres espèces et consacre son temps à les étudier. De plus, bien qu'apparemment toujours concentré sur les opérations de récolte, il semble parfaitement disposé à aider les autres espèces de toutes les manières possibles. "

    trait_blokkat_bloblokkad:99 "Chef scientifique"
    trait_blokkat_bloblokkad_desc:99 "Ce Chat Block semble apprécier la quête du savoir par-dessus tout. On peut régulièrement le voir expérimenter sur des « primitifs » ou bricoler quelque projet délirant."

    prison_blokkat_is_bloblokkad:99 "§EChef scientifique§! - Ce Chat Block semble apprécier la quête du savoir par-dessus tout. On peut régulièrement le voir expérimenter sur des « primitifs » ou bricoler quelque projet délirant."

    trait_blokkat_blokkofett:99 "Nouveau lien"
    trait_blokkat_blokkofett_desc:99 "Ce Chat Block faisait partie d'une nation spatiale comme la nôtre qui a complété les Protocoles Chat Block et a rejoint les Chats Blocks. Cette opération de récolte galactique est sa première, et il a été assigné à l'étude des entités nationales."

    prison_blokkat_is_blokkofett:99 "§HNouveau lien§! - Ce Chat Block faisait partie d'une nation spatiale comme la nôtre qui a complété les Protocoles Chat Block et a rejoint les Chats Blocks. Cette opération de récolte galactique est sa première, et il a été assigné à l'étude des entités nationales."

    trait_blokkat_blokkutos:99 "Rêveur"
    trait_blokkat_blokkutos_desc:99 "Ce Chat Block ressent toujours une nostalgie du passé et rêve d'un avenir meilleur. Ses rêves inspirent l'unité, l'espoir et une fascination pour l'inconnu à ceux qui sont en sa présence."

    prison_blokkat_is_blokkutos:99 "§MRêveur§! - Ce Chat Block ressent toujours une nostalgie du passé et rêve d'un avenir meilleur. Ses rêves inspirent l'unité, l'espoir et une fascination pour l'inconnu à ceux qui sont en sa présence."

    trait_blokkat_sophia:99 "Chevalier de la Rose"
    trait_blokkat_sophia_desc:99 "Ce Chat Block, pour une raison quelconque, revendique et apprécie d'être ce qu'il appelle lui-même un Chevalier de la Rose, semblant connaître toutes les méthodes de guerre jusqu'à celles qui semblent carrément archaïques d'une manière ou d'une autre."

    prison_blokkat_is_sophia:99 "§PChevalier de la Rose§! - Ce Chat Block, pour une raison quelconque, revendique et apprécie d'être ce qu'il appelle lui-même un Chevalier de la Rose, semblant connaître toutes les méthodes de guerre jusqu'à celles qui semblent carrément archaïques d'une manière ou d'une autre. Il semble plutôt indifférent à la fois à nous aider ou à aider les Chats Blocks eux-mêmes dans leurs opérations de récolte. Il demande aussi souvent simplement d'être appelé « Rose ». Il a un désir fanatique de tirer tout ce qu'il peut faire entrer dans des canons sur les vaisseaux ennemis, et s'enfuit aussi souvent quand il sait que sa vie est en danger. Il apprécie également, pour une raison quelconque, de tenter de faire s'éperonner les vaisseaux les uns contre les autres.\n\nEnfin, il prétend vouloir voir « La plus grande vision que quoi que ce soit puisse jamais contempler ». Tout le monde est perplexe quant à ce que cela pourrait être."

    trait_blokkat_blokknight:99 "Chevalier de la Rose"
    trait_blokkat_blokknight_desc:99 "Ce Chat Block semble aimer se déguiser, racontant d'interminables histoires d'exploits et d'interactions valeureuses avec d'anciennes civilisations primitives. Il semble aussi avoir une obsession malsaine pour les armes et armures des primitifs, s'assurant constamment qu'on en produise le plus possible."

    prison_blokkat_is_blokknight:99 "§LLe retour du Chat Block-chevalier§! - Ce Chat Block semble aimer se déguiser, racontant d'interminables histoires d'exploits et d'interactions valeureuses avec d'anciennes civilisations primitives. Il semble aussi avoir une obsession malsaine pour les armes et armures des primitifs, s'assurant constamment qu'on en produise le plus possible."

    trait_blokkat_yoru:99 "Vicieusement psychotique"
    trait_blokkat_yoru_desc:99 "Ce Chat Block semble déterminé à accomplir l'annihilation ultime de toutes les formes de vie."

    prison_blokkat_is_yoru:99 "§RVicieusement psychotique§! - Ce Chat Block semble déterminé à accomplir l'annihilation ultime de toutes les formes de vie. Pourquoi ? Peut-être qu'il s'est fait notifier sur le Chat Blockwork, peut-être qu'il a brûlé son chat blocktoast ce matin, ou peut-être... qu'il est simplement fou."

    trait_blokkat_silly:99 "Farfelu"
    trait_blokkat_silly_desc:99 "Ce Chat Block est plein de fantaisie et de joie. Chaque Chat Block sait qu'il ne faut pas défier PIEBLOKK parce que je suis le plus fort ! :3"

    prison_blokkat_is_pieblokk:99 "§CTrès farfelu :3§! - $trait_blokkat_silly_desc$"

    trait_blokkat_megastructure_obession:99 "Obsession des mégastructures"
    trait_blokkat_megastructure_obession_desc:99 "Ce Chat Block montre un grand intérêt pour toutes les formes de mégastructures artificielles, de celles représentées dans les divertissements de science-fiction primitifs jusqu'aux plans incroyablement compliqués de structures éclipsant des galaxies entières."

    prison_blokkat_is_tempestkat:99 "§MObsession des mégastructures§! - $trait_blokkat_megastructure_obession_desc$"
