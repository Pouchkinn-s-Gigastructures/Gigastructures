  #########################################
  ### Mega Deposits ######################
  #########################################

  d_small_natural_tunnel:99 "Tunnel de Borée"
  d_small_natural_tunnel_desc:99 "Un petit tunnel naturel reliant un grand lac situé au milieu d'un des continents de la planète à l'océan. Son existence semble défier toutes les lois de la nature et de la raison, amenant les autochtones à croire qu'il a été créé par les dieux eux-mêmes."


  #########################################
  ### Flavor Deposits #####################
  #########################################

  d_arcane_mineral_generator:99 "Transmutateur arcanique"
  d_arcane_mineral_generator_desc:99 "Un ancien dispositif de fabrication arcanique qui produit des ressources minérales apparemment à partir de rien."

  d_giga_orbital_effects:99 "Réseau de transport systémique"
  d_giga_orbital_effects_desc:99 "L'$name_giga_orbital$ de ce système domine la planification logistique locale."

  d_pcc_origin_blocker:99 "Conduit dégradé"
  d_pcc_origin_blocker_desc:99 "De grandes portions des immenses matrices de traitement de la planète sont actuellement inaccessibles depuis nos installations de recherche en raison de connexions endommagées entre les sous-sections informatiques."

  d_giga_rogue_ai_relay_servers:99 "Matrices de processeurs renégats"
  d_giga_rogue_ai_relay_servers_desc:99 "De vastes matrices de processeurs et de serveurs utilisées par l'IA renégate pour projeter son pouvoir sur le complexe informatique planétaire afin de nous combattre à chaque instant en sabotant les infrastructures et en tentant activement de tuer nos colons."

  d_giga_rogue_ai_corrupt_code:99 "Code corrompu"
  d_giga_rogue_ai_corrupt_code_desc:99 "De grandes parties des banques de données du complexe informatique planétaire sont remplies de code malveillant dangereux, entravant activement nos efforts scientifiques sur cette planète."

  d_ringworld_capital_city:99 "La Grande Capitale"
  d_ringworld_capital_city_desc:99 "Une grande capitale construite sur le monde-anneau. Cet endroit sert de centre névralgique pour le segment du monde-anneau et fournit divers services à la population locale."

  d_interstellar_ringworld_commerce_blocker:99 "Infrastructures abandonnées"
  d_interstellar_ringworld_commerce_blocker_desc:99 "Comme le monde-anneau offre un espace quasi illimité, peu de considération a été accordée au réaménagement des terres, laissant de vastes étendues remplies de bâtiments abandonnés depuis longtemps. Si ces territoires sont défrichés et réaménagés, les entreprises locales pourront se développer considérablement, augmentant la richesse de l'empire."

  d_great_ring_excavated_mountain:99 "Noeud du système d'autoréparation du monde-anneau"
  d_great_ring_excavated_mountain_desc:99 "Un noeud exposé du système automatisé d'autoréparation du monde-anneau. Il génère continuellement la matière nécessaire au maintien en état de fonctionnement de la mégastructure. Et si nous sommes prudents, nous pouvons siphonner une partie de cette matière pour nos propres besoins sans compromettre notre foyer artificiel."

  d_giga_arcane_generator:99 "$d_arcane_generator$"
  d_giga_arcane_generator_desc:99 "$d_arcane_generator_desc$"


  d_decrepit_tunnels_squareworld:99 "$d_decrepit_tunnels_1$"
  d_decrepit_tunnels_squareworld_desc:99 "$d_decrepit_tunnels_1_desc$"

  d_predictable_solar_flares:99 "Éruptions solaires prévisibles"
  d_predictable_solar_flares_desc:99 "L'étoile autour de laquelle orbite notre monde d'origine présente un comportement spécifique précédant une éruption solaire, rendant l'extraction d'énergie nettement plus facile."

  d_giga_decrepit_tunnels_1:99 "$d_decrepit_tunnels_1$"
  d_giga_decrepit_tunnels_1_desc:99 "$d_decrepit_tunnels_1_desc$"

  d_giga_decrepit_tunnels_2:99 "$d_decrepit_tunnels_1$"
  d_giga_decrepit_tunnels_2_desc:99 "$d_decrepit_tunnels_1_desc$"

  d_giga_decrepit_tunnels_3:99 "$d_decrepit_tunnels_1$"
  d_giga_decrepit_tunnels_3_desc:99 "$d_decrepit_tunnels_1_desc$"

  d_ehof_solar_array:99 "Collecteurs solaires immaculés"
  d_ehof_solar_array_desc:99 ""

  d_flusio_arcology_wreck:99 "Mégapoles dévastées"
  d_flusio_arcology_wreck_desc:99 "Cités partiellement ou entièrement détruites lors des combats qui ont eu lieu sur la Flusio-Arcologie."
  d_flusio_arcology_anarchy:99 "Anarchie flusionienne"
  d_flusio_arcology_anarchy_desc:99 "De vastes étendues de Flusion ont sombré dans l'anarchie totale à la suite des dommages collatéraux des combats dévastateurs menés pour déloger le Kaiser de la planète."

  d_flusio_arcology_administration:99 "Administration de la Flusio-Arcologie"
  d_flusio_arcology_administration_desc:99 "Administrer le cauchemar logistique qui entoure Flusion n'est pas une tâche facile. En raison du nombre immense de districts que la Flusio-Arcologie peut accueillir, il faut prendre plus de soin pour la gérer correctement."

  d_flusio_arcology_administration_tooltip:99 "[giga_flusion_administration_mechanics]"

  d_solaktropa_project:99 "Projet Roqualtropa"
  d_solaktropa_project_desc:99 "Le projet Roqualtropa crée de vastes quantités de terres utilisables pour que les Katzens puissent construire, ainsi que d'énormes quantités d'eau pour l'agriculture, au prix d'une perturbation du climat naturel de Flusion."

  d_solaktropa_project_wreck:99 "Épave du Roqualtropa"
  d_solaktropa_project_wreck_desc:99 "La destruction du barrage Roqualtropa a causé des quantités indicibles de dévastation à Flusion et à ses habitants."

  d_katlantropa_project:99 "Projet Katlantropa"
  d_katlantropa_project_desc:99 "Le projet Katlantropa irrigue des zones autrefois désertiques, les rendant propices à l'agriculture et à l'irrigation."

  d_katlantropa_project_wreck:99 "Désertification du Katlantropa"
  d_katlantropa_project_wreck_desc:99 "La destruction du Katlantropa a reconverti des zones autrefois arables en vastes déserts."


  #########################################
  ### Birch Deposits ######################
  #########################################

  d_aeternum_gigantic_fission_reactor:99 "Réacteur à fission colossal"
  d_aeternum_gigantic_fission_reactor_desc:99 "Un étrange réacteur à fission construit par Aeternum dans un passé lointain, fonctionnant grâce à un gigantesque bloc d'uranium et produisant de vastes quantités d'électricité."

  d_exp_civ_primitive_preserve:99 "Réserve de civilisation primitive du Monde de Birch"
  d_exp_civ_primitive_preserve_desc:99 "Une civilisation primitive entière réside sur une portion du Monde de Birch. L'étudier représente un potentiel scientifique incroyable."

  d_exp_civ_space_preserve:99 "Réserve de civilisation spatiale du Monde de Birch"
  d_exp_civ_space_preserve_desc:99 "Une civilisation de l'ère spatiale entière réside sur une portion du Monde de Birch. L'étudier représente un potentiel scientifique incroyable."

  d_exp_civ_fe_preserve:99 "Réserve de civilisation précurseur du Monde de Birch"
  d_exp_civ_fe_preserve_desc:99 "Une ancienne civilisation précurseur entière réside sur une portion du Monde de Birch. L'étudier représente un potentiel scientifique incroyable."

  d_aeternum_decaying_hyperstructure:99 "Hyperstructure en délabrement"
  d_aeternum_decaying_hyperstructure_desc:99 "De vastes étendues de ce Monde de Birch sont tombées en ruine après des milliers d'années de négligence. Les réparer serait sans aucun doute une entreprise colossale, mais cela nous permettrait d'étendre à nouveau la superficie habitable de ce Monde de Birch.\n\nDéfricher ceci nous accordera §G3§! $aeternum_tech_intel$."

