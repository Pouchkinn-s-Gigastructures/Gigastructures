  #########################################
  ### Mega Deposits ######################
  #########################################

  d_small_natural_tunnel:0 "Tunnel de Borée"
  d_small_natural_tunnel_desc:0 "Un petit tunnel naturel reliant un grand lac situé au milieu d'un des continents de la planète à l'océan. Son existence semble défier toutes les lois de la nature et de la raison, amenant les indigènes à croire qu'il a été créé par les dieux eux-mêmes."


  #########################################
  ### Flavor Deposits #####################
  #########################################

  d_arcane_mineral_generator:0 "Transmutateur arcanique"
  d_arcane_mineral_generator_desc:0 "Un ancien appareil de fabrication arcanique qui produit des ressources minérales apparemment à partir de rien."

  d_giga_orbital_effects:0 "Réseau de transport du système"
  d_giga_orbital_effects_desc:0 "L'$name_giga_orbital$ dans ce système domine la planification logistique locale."

  d_pcc_origin_blocker:0 "Conduit détérioré"
  d_pcc_origin_blocker_desc:0 "De grandes portions des immenses réseaux de traitement de la planète sont actuellement inaccessibles depuis nos installations de recherche en raison de connexions endommagées entre les sous-sections de calcul."

  d_giga_rogue_ai_relay_servers:0 "Réseaux de processeurs rebelles"
  d_giga_rogue_ai_relay_servers_desc:0 "De vastes réseaux de processeurs et de serveurs utilisés par l'IA rebelle pour projeter sa puissance sur le complexe informatique planétaire afin de nous combattre à chaque instant en sabotant les infrastructures et en tentant activement de tuer nos colons."

  d_giga_rogue_ai_corrupt_code:0 "Code corrompu"
  d_giga_rogue_ai_corrupt_code_desc:0 "De larges portions des banques de données du complexe informatique planétaire sont remplies de code bloatware dangereux, entravant activement nos efforts scientifiques sur cette planète."

  d_ringworld_capital_city:0 "La grande capitale"
  d_ringworld_capital_city_desc:0 "Une grande ville capitale construite sur le monde-anneau. Cet endroit sert de plaque tournante centrale pour le segment du monde-anneau et fournit divers services à la population locale."

  d_interstellar_ringworld_commerce_blocker:0 "Infrastructure abandonnée"
  d_interstellar_ringworld_commerce_blocker_desc:0 "Comme le monde-anneau offre une quantité presque infinie d'espace, peu de considération a été accordée au réaménagement des terres, conduisant à de vastes étendues remplies de bâtiments abandonnés depuis longtemps. Si ces territoires sont défrichés et réaménagés, les entreprises locales pourront se développer considérablement, augmentant la richesse de l'empire."

  d_great_ring_excavated_mountain:0 "Nœud du système d'auto-réparation du monde-anneau"
  d_great_ring_excavated_mountain_desc:0 "Un nœud exposé du système d'auto-réparation automatisé du monde-anneau. Il génère continuellement la matière nécessaire pour maintenir la mégastructure en état de fonctionnement. Et si nous sommes prudents, nous pouvons siphonner une partie de cette matière pour nos propres besoins sans compromettre notre foyer artificiel."

  d_giga_arcane_generator:0 "$d_arcane_generator$"
  d_giga_arcane_generator_desc:0 "$d_arcane_generator_desc$"


  d_decrepit_tunnels_squareworld:0 "$d_decrepit_tunnels_1$"
  d_decrepit_tunnels_squareworld_desc:0 "$d_decrepit_tunnels_1_desc$"

  d_predictable_solar_flares:0 "Éruptions solaires prévisibles"
  d_predictable_solar_flares_desc:0 "L'étoile autour de laquelle orbite notre monde natal présente un comportement spécifique précédant une éruption solaire, rendant l'extraction d'énergie significativement plus facile."

  d_everfree_forest:0 "Forêt Everfree"
  d_everfree_forest_desc:0 "Une forêt particulière et quasi impénétrable emplie d'énergies apparemment magiques. La défricher serait une tâche aux proportions titanesques, mais étudier son écosystème ésotérique produirait sûrement des données intrigantes."

  d_giga_decrepit_tunnels_1:0 "$d_decrepit_tunnels_1$"
  d_giga_decrepit_tunnels_1_desc:0 "$d_decrepit_tunnels_1_desc$"

  d_giga_decrepit_tunnels_2:0 "$d_decrepit_tunnels_1$"
  d_giga_decrepit_tunnels_2_desc:0 "$d_decrepit_tunnels_1_desc$"

  d_giga_decrepit_tunnels_3:0 "$d_decrepit_tunnels_1$"
  d_giga_decrepit_tunnels_3_desc:0 "$d_decrepit_tunnels_1_desc$"

  d_ehof_solar_array:0 "Collecteurs solaires impeccables"
  d_ehof_solar_array_desc:0 ""

  d_flusio_arcology_wreck:0 "Mégapoles dévastées"
  d_flusio_arcology_wreck_desc:0 "Villes partiellement ou complètement détruites lors des combats qui ont eu lieu sur l'arcologie de Flusion."
  d_flusio_arcology_anarchy:0 "Anarchie flusionienne"
  d_flusio_arcology_anarchy_desc:0 "De vastes étendues de Flusion sont tombées dans l'anarchie complète à la suite des dommages collatéraux des combats dévastateurs pour déloger le Kaiser de la planète."

  d_flusio_arcology_administration:0 "Administration de l'arcologie de Flusion"
  d_flusio_arcology_administration_desc:0 "Administrer le cauchemar logistique qui entoure Flusion n'est pas une tâche facile. En raison du nombre immense de districts que l'arcologie de Flusion peut supporter, plus de soin doit être apporté pour la gérer correctement."

  d_flusio_arcology_administration_tooltip:0 "[giga_flusion_administration_mechanics]"

  d_solaktropa_project:0 "Projet Roqualtropa"
  d_solaktropa_project_desc:0 "Le projet Roqualtropa crée de vastes quantités de terres utilisables pour que les Katzens construisent dessus ainsi que d'énormes quantités d'eau pour l'agriculture, au prix de perturber le climat naturel de Flusion."

  d_solaktropa_project_wreck:0 "Épave de Roqualtropa"
  d_solaktropa_project_wreck_desc:0 "La destruction du barrage de Roqualtropa a causé d'innombrables dévastations à Flusion et à ses habitants."

  d_katlantropa_project:0 "Projet Katlantropa"
  d_katlantropa_project_desc:0 "Le projet Katlantropa irrigue des zones anciennement désertiques, les rendant propices à l'agriculture et à l'irrigation."

  d_katlantropa_project_wreck:0 "Désertification Katlantropa"
  d_katlantropa_project_wreck_desc:0 "La destruction de Katlantropa a reconverti des zones anciennement arables en vastes déserts."


  #########################################
  ### Birch Deposits ######################
  #########################################

  d_aeternum_gigantic_fission_reactor:0 "Réacteur à fission colossal"
  d_aeternum_gigantic_fission_reactor_desc:0 "Un étrange réacteur à fission construit par Aeternum dans un passé lointain, fonctionnant grâce à un gigantesque morceau d'uranium et produisant de vastes quantités d'électricité."

  d_exp_civ_primitive_preserve:0 "Réserve de civilisation primitive du monde de Birch"
  d_exp_civ_primitive_preserve_desc:0 "Une civilisation primitive entière réside sur une partie du monde de Birch. Les étudier représente un potentiel scientifique incroyable."

  d_exp_civ_space_preserve:0 "Réserve de civilisation de l'ère spatiale du monde de Birch"
  d_exp_civ_space_preserve_desc:0 "Une civilisation entière de l'ère spatiale réside sur une partie du monde de Birch. Les étudier représente un potentiel scientifique incroyable."

  d_exp_civ_fe_preserve:0 "Réserve de civilisation précurseur du monde de Birch"
  d_exp_civ_fe_preserve_desc:0 "Une civilisation précurseur ancienne entière réside sur une partie du monde de Birch. Les étudier représente un potentiel scientifique incroyable."

  d_aeternum_decaying_hyperstructure:0 "Hyperstructure en déclin"
  d_aeternum_decaying_hyperstructure_desc:0 "De vastes étendues de ce monde de Birch sont tombées en ruine après des milliers d'années de négligence. Les réparer serait indubitablement une entreprise massive, mais cela nous permettrait d'étendre à nouveau la zone habitable de ce monde de Birch.\n\nDéfricher ceci accordera §G3§! $aeternum_tech_intel$."

