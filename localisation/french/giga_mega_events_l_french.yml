  giga_dialog.1903.title:0 "$name_succ$ opérationnel !"
  giga_dialog.1903.desc:0 "Notre $name_succ$ dans le système [giga_system.GetName] est maintenant opérationnel ! Ses faisceaux tracteurs ont été activés, et l'atmosphère de la géante gazeuse est progressivement récoltée."
  giga_dialog.1903.a:0 "Merveilleux !"
  
  giga_dialog.1904.title:0 "$name_succ$ épuisé"
  giga_dialog.1904.desc:0 "Notre $name_succ_full$ dans le système [giga_system.GetName] a maintenant atteint le noyau rocheux interne de la géante gazeuse. Il ne reste plus d'atmosphère à extraire, et l'ancienne géante gazeuse a été réduite à un petit monde stérile riche en minéraux. La mégastructure elle-même a été démantelée, et le noyau peut maintenant être utilisé de la manière que nous souhaitons."
  giga_dialog.1904.a:0 "Toute chose a une fin."
  
  ########################################################
  ##################### SQUAREWORLD ######################
  ########################################################
  
  giga_dialog.3001.name:0 "Le carré mythique"
  giga_dialog.3001.desc:0 "Dans le système [from.GetName] se trouve une étrange construction. Nos scientifiques sont déconcertés à la vue de cette massive installation orbitale encerclant l'étoile du système. En fait, c'est tellement ridicule qu'on a d'abord cru à une farce, ou à une anomalie dans nos capteurs.\n\nUn $name_ringworld_square$.\n\nDans le système [from.GetName] se trouve un monde-anneau de forme carrée. Bien qu'il semble avoir subi pas mal de dommages dans le passé, il semble toujours être structurellement intact pour l'essentiel. La forme étrange de cette construction défie tout ce que nous savons sur la physique et l'ingénierie, car la gravité aurait dû faire exploser cette chose il y a des millénaires. Pourtant, elle se tient là, oisive, attendant que quelqu'un perce ses mystères.\n\nUne petite station en grande partie abandonnée flotte également silencieusement au-dessus de l'étoile, et nos scientifiques croient qu'elle pourrait contenir des informations utiles sur cette structure particulière.\n\nUn §SProjet spécial§! a été lancé pour enquêter sur cette chose et sur la station afin de comprendre comment elle existe encore."
  giga_dialog.3001.a:0 "Comme c'est singulier."
  
  giga_dialog.3002.name:0 "Les mystères du carré"
  giga_dialog.3002.desc:0 "Après des dizaines d'expéditions et des mois de recherche, nos scientifiques croient avoir finalement percé les mystères de ce Monde-carré.\n\nBien que l'extérieur du Monde-carré soit gravement endommagé, son intérieur est encore en grande partie intact, et la plupart des systèmes internes sont effectivement fonctionnels ! Son armature est principalement constituée de Qubérine, un alliage extrêmement avancé doté d'une électronique auto-réparatrice incroyablement complexe, expliquant ainsi comment il est capable de résister aux forces incroyables exercées sur lui.\n\nNos scientifiques croient qu'il pourrait être possible de réparer cette chose, avec suffisamment de ressources et des technologies suffisamment avancées. Nous avons détecté un certain nombre d'usines de fabrication de Qubérine désactivées au sein du monde-anneau, qui pourraient recommencer à produire de la Qubérine si nous restaurons l'alimentation électrique de ce monde-anneau lors de futures réparations.\n\nLes équipes de recherche ont également conclu que la petite station au-dessus de l'étoile sert de « point d'accès central » aux systèmes internes du Monde-carré. Ils nous encouragent à dépenser quelques crédits d'énergie et alliages pour la réparer et ensuite la réactiver, car cela pourrait nous donner accès à des données inestimables sur le Monde-carré et ses bâtisseurs stockées dans ses vastes archives internes. Ces données pourraient bien être la clé pour réparer cette merveilleuse construction..."
  giga_dialog.3002.a:0 "Merveilleux ! Nous réparerons cette station immédiatement."
  
  giga_dialog.3003.name:0 "Monde-carré restauré !"
  giga_dialog.3003.desc:0 "Nos ingénieurs sont heureux de rapporter qu'une section du Monde-carré en ruine a été réparée avec succès ! L'alimentation a été restaurée aux circuits auxiliaires, et la Qubérine s'écoule des usines automatisées, équipées de convertisseurs avancés d'énergie en matière. La grande quantité de Qubérine dans la structure et le sol a eu l'effet étrange de rendre les plantes un peu trop vertes, mais à part cela, tout semble entièrement nominal."
  giga_dialog.3003.a:0 "Incroyable !"
  
  giga_dialog.3004.name:0 "Le Monde-carré parle"
  giga_dialog.3004.desc:0 "Nouvelles incroyables ! Après avoir réparé et réalimenté la station dans les systèmes du Monde-carré, une ancienne IA dormante hébergée à la fois dans la station et dans le Monde-carré lui-même semble s'être éveillée.\n\nCette IA, dont le nom est §YGaryx§! selon les données récupérées de la station, était apparemment responsable de l'entretien du Monde-carré et de ses vastes systèmes internes. Nos équipes de recherche ont réussi à établir le contact avec elle, et elle est très désireuse de communiquer avec nous."
  giga_dialog.3004.a:0 "À l'écran."
  
  giga_dialog.3005.name:0 "Garyx, gardien du Monde-carré"
  giga_dialog.3005.desc:0 "Ah, des visiteurs ! Merci d'avoir envoyé assez d'énergie à la station pour la sortir de l'hibernation. Cela fait un moment que je n'ai pas parlé à une entité sapiente.\n\nJe suis Garyx, l'intelligence artificielle responsable de l'entretien du Monde-carré et de ses vastes archives de données, et j'ai pris la forme d'un reptilien holographique, car c'est à cela que ressemblaient mes créateurs.\n\nQuoi qu'il en soit, désolé pour l'état déplorable du Monde-carré. J'ai trouvé un documentaire particulièrement intéressant sur la reproduction des reptiliens, et je l'ai étudié pendant les derniers 120 millénaires en utilisant l'alimentation de secours afin de mieux comprendre mes créateurs. Malheureusement, il semble que quelque chose de drastique soit arrivé au Monde-carré entre-temps... Enfin bon.\n\nMaintenant que vous êtes là, et puisque mes créateurs sont apparemment disparus depuis longtemps, vous pouvez avoir la permission d'accéder aux banques de données du Monde-carré, qui sont étonnamment en grande partie intactes."
  
  giga_dialog.3005.a:0 "Qu'y a-t-il dans ces banques de données ?"
  giga_dialog.3005.a.response:0 "Oh, beaucoup de choses. Mes créateurs ont stocké de nombreuses données sur les divers empires et espèces qu'ils connaissaient, leurs connaissances scientifiques, et surtout, leur divinité §BQubey§!.\nIls voulaient préserver tout cela pour que les générations futures puissent en bénéficier, et, eh bien, puisque vous êtes là maintenant, je suppose qu'ils ont réussi dans cette tâche. Dommage qu'ils ne soient plus là pour le voir..."
  
  giga_dialog.3005.b:0 "Quel âge a le Monde-carré ?"
  giga_dialog.3005.b.response:0 "Eh bien, à en juger par la position des étoiles, j'estime que cette chose est cassée depuis environ 120 000 de vos années, mais elle est bien plus ancienne que cela.\nElle a été construite il y a environ 567 000 ans par mes créateurs, et a abrité leur civilisation pendant de nombreux millénaires. Je ne suis pas sûr de ce qui lui est arrivé, car j'étais malheureusement complètement captivé par mes recherches. La possibilité la plus probable est que leur civilisation se soit effondrée par décadence ou ait simplement vieilli et divergé, tout comme de nombreux autres grands empires avant eux."
  
  giga_dialog.3005.c:0 "Qui a construit le Monde-carré, et pourquoi ?"
  giga_dialog.3005.c.response:0 "Mes créateurs l'ont fait. C'était une espèce de §R(DONNÉES CORROMPUES)§!, connue sous le nom de §R(DONNÉES CORROMPUES)§!, et ils régnaient sur un empire assez vaste, le §R(DONNÉES CORROMPUES)§!\n\nIls étaient aussi incroyablement religieux, et vénéraient une divinité qu'ils appelaient §BQubey§!. Cette divinité aurait aidé leur espèce à évoluer pendant des millions d'années, et beaucoup voyaient la perfection des formes géométriques comme la façon dont §BQubey§! manifestait sa présence au monde.\n\nMes créateurs ont finalement découvert une substance incroyable, possédant des propriétés d'auto-réparation inégalées. Ils l'ont baptisée « Qubérine », car ils croyaient que la substance était faite de §BQubey§! lui-même, et ont décidé de l'utiliser pour construire cette magnifique structure géométrique défiant la physique comme moyen à la fois de vénérer et de montrer leur gratitude envers §BQubey§!\n\nIls ont également profité de l'occasion pour stocker autant de données que possible sur leurs avancées scientifiques, la Qubérine, le Monde-carré et §BQubey§!, dans les banques de données, dans l'espoir qu'une future civilisation qui tomberait dessus puisse également apprendre l'existence du tout-puissant §BQubey§!."
  
  giga_dialog.3005.d:0 "Peut-on réparer le Monde-carré d'une façon ou d'une autre ?"
  giga_dialog.3005.d.response:0 "Espérons que oui ! Les archives en grande partie fonctionnelles contiennent beaucoup de données sur la structure interne et externe du Monde-carré. Si vous me donnez quelques dizaines de mois pour tout compiler, je peux donner à vos scientifiques un cache de données contenant toutes les informations nécessaires pour effectuer des réparations étendues sur la mégastructure. J'adorerais voir le Monde-carré restauré à sa gloire d'antan !"
  
  giga_dialog.3005.e:0 "Au revoir."
  giga_dialog.3005.e.response:0 "Puissent les archives bien vous servir, et n'hésitez pas à me contacter à nouveau si vous avez besoin de savoir quoi que ce soit."
  
  giga_dialog.3006.name:0 "Les archives"
  giga_dialog.3006.desc:0 "Peu avant notre déconnexion, §YGaryx§! nous a assurés qu'il nous enverra un cache de données contenant toutes les informations nécessaires pour réparer le Monde-carré dans environ 2 ans.\n\nEn attendant, nous pouvons le contacter à nouveau en « améliorant » la mégastructure du Hub du Monde-carré. Nos scientifiques croient que sa capacité à naviguer facilement dans les banques de données du Monde-carré pourrait grandement contribuer à notre recherche."
  giga_dialog.3006.a:0 "Bien reçu."
  
  giga_dialog.3007.name:0 "Garyx, gardien du Monde-carré"
  giga_dialog.3007.desc:0 "Salutations, encore une fois. J'ai terminé la compilation d'un cache de données contenant toutes les informations nécessaires pour réparer le Monde-carré ! Je vais le transférer immédiatement à vos scientifiques."
  giga_dialog.3007.a:0 "Merveilleux ! Nous ferons bon usage de ce savoir."
  
  giga_dialog.3008.name:0 "Garyx, gardien du Monde-carré"
  giga_dialog.3008.desc:0 "Ah, salutations ! Êtes-vous venus chercher plus de données dans les archives ? Comment puis-je vous aider ?"
  giga_dialog.3008.a:0 "Pouvez-vous aider notre recherche ?"
  giga_dialog.3008.c:0 "Couper la communication."
  
  giga_dialog.3009.name:0 "Garyx, gardien du Monde-carré"
  giga_dialog.3009.desc:0 "Mais bien sûr ! Je peux parcourir les archives du Monde-carré pour trouver des données qui pourraient vous être utiles. Quel type de données souhaitez-vous que je récupère ?"
  giga_dialog.3009.a:0 "£physics_research£ §YRecherche en physique§! générale"
  giga_dialog.3009.a.response:0 "Très bien ! Je vais récupérer des données liées à votre recherche en physique, ce qui vous accordera une §Yaugmentation de 10 %§! de votre vitesse de recherche dans cette catégorie.\n\nSi vous souhaitez que je booste un autre domaine, contactez-moi simplement à nouveau et choisissez une autre option."
  giga_dialog.3009.b:0 "£engineering_research£ §YRecherche en ingénierie§! générale"
  giga_dialog.3009.b.response:0 "Très bien ! Je vais récupérer des données liées à votre recherche en ingénierie, ce qui vous accordera une §Yaugmentation de 10 %§! de votre vitesse de recherche dans cette catégorie.\n\nSi vous souhaitez que je booste un autre domaine, contactez-moi simplement à nouveau et choisissez une autre option."
  giga_dialog.3009.c:0 "£society_research£ §YRecherche en société§! générale"
  giga_dialog.3009.c.response:0 "Très bien ! Je vais récupérer des données liées à votre recherche en société, ce qui vous accordera une §Yaugmentation de 10 %§! de votre vitesse de recherche dans cette catégorie.\n\nSi vous souhaitez que je booste un autre domaine, contactez-moi simplement à nouveau et choisissez une autre option."
  giga_dialog.3009.d:0 "Non, n'aidez pas notre recherche."
  giga_dialog.3009.d.response:0 "Très bien, je vais cesser de vous aider dans votre recherche, si c'est ce que vous voulez..."
  
