  giga_dialog.13701.name:0 "Gestion des mégastructures"
  giga_dialog.13701.desc:0 "La [from.GetName] nouvellement construite dans [fromfrom.GetName] dispose d'options supplémentaires accessibles via un bouton en haut à droite de l'interface de la mégastructure.\n\nSoyez attentif aux autres mégastructures où ce bouton est disponible, car la [from.GetName] n'est pas le seul type de mégastructure à disposer de telles options supplémentaires.\n\nCe message ne sera affiché qu'une seule fois."
  
  giga_repeatables.001.name:0 "Capacité de kilostructures augmentée"
  giga_repeatables.001.desc:0 "Suite à nos avancées en méga-ingénierie, nos ingénieurs ont appliqué des techniques modernes à nos méthodes de construction, nous permettant de construire et d'entretenir un plus grand nombre de kilostructures."
  giga_repeatables.001.a.name:0 "$SPLENDID$"
  giga_kilo_cap_increased:0 "§YLes kilostructures éligibles verront leur capacité augmentée de 2.§!"
  