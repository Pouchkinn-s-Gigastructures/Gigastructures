    giga_dialog.13701.name:99 "Gestion des mégastructures"
    giga_dialog.13701.desc:99 "La [from.GetName] récemment construite dans [fromfrom.GetName] dispose d'options supplémentaires accessibles via un bouton en haut à droite de l'interface de la mégastructure.\n\nSoyez attentif aux autres mégastructures où le bouton est disponible, car la [from.GetName] n'est pas le seul type de mégastructure à disposer de telles options supplémentaires.\n\nCe message ne sera affiché qu'une seule fois."

    giga_repeatables.001.name:99 "Capacité de kilostructure augmentée"
    giga_repeatables.001.desc:99 "Suite à nos avancées en méga-ingénierie, nos ingénieurs ont appliqué des techniques modernes à nos méthodes de construction, nous permettant de construire et d'entretenir un plus grand nombre de kilostructures."
    giga_repeatables.001.a.name:99 "$SPLENDID$"
    giga_kilo_cap_increased:99 "§YLes kilostructures éligibles verront leur capacité augmentée de 2.§!"
