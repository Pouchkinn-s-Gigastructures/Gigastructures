    giga_dialog.1903.title:99 "$name_succ$ opérationnel !"
    giga_dialog.1903.desc:99 "Notre $name_succ$ dans le système [giga_system.GetName] est maintenant opérationnel ! Ses rayons tracteurs ont été activés, et l'atmosphère de la géante gazeuse est progressivement récoltée."
    giga_dialog.1903.a:99 "Merveilleux !"

    giga_dialog.1904.title:99 "$name_succ$ épuisé"
    giga_dialog.1904.desc:99 "Notre $name_succ_full$ dans le système [giga_system.GetName] a maintenant atteint le noyau rocheux interne de la géante gazeuse. Il n'y a plus d'atmosphère à extraire, et l'ancienne géante gazeuse a été réduite à un petit monde aride riche en minéraux. La mégastructure elle-même a été démantelée, et le noyau peut maintenant être utilisé comme bon nous semble."
    giga_dialog.1904.a:99 "Toute chose a une fin."

    ########################################################
    ##################### SQUAREWORLD ######################
    ########################################################

    giga_dialog.3001.name:99 "Le carré mythique"
    giga_dialog.3001.desc:99 "Dans le système [from.GetName] se trouve une étrange construction. Nos scientifiques sont stupéfaits à la vue de cette massive installation orbitale encerclant l'étoile du système. En fait, c'est si ridicule qu'on a d'abord cru à une blague, ou à une anomalie dans nos capteurs.\n\nUn $name_ringworld_square$.\n\nDans le système [from.GetName] se trouve un monde-anneau de forme carrée. Bien qu'il semble avoir subi pas mal de dégâts dans le passé, il paraît encore être principalement intact structurellement. La forme étrange de cette construction défie tout ce que nous savons sur la physique et l'ingénierie, car la gravité aurait dû briser cette chose il y a des millénaires. Pourtant, elle est là, attendant tranquillement que quelque chose vienne percer ses mystères.\n\nUne petite station pour l'essentiel désaffectée flotte également silencieusement au-dessus de l'étoile, et nos scientifiques pensent qu'elle pourrait contenir des informations utiles sur cette structure particulière.\n\nUn §SProjet spécial§! a été lancé pour enquêter sur cette chose et sur la station afin de comprendre comment elle peut encore exister."
    giga_dialog.3001.a:99 "Comme c'est étrange."

    giga_dialog.3002.name:99 "Les mystères du carré"
    giga_dialog.3002.desc:99 "Après des dizaines d'expéditions et des mois de recherche, nos scientifiques pensent avoir enfin percé les mystères de ce monde-carré.\n\nBien que l'extérieur du monde-carré soit gravement endommagé, son intérieur est encore en grande partie intact, et la plupart des systèmes internes sont en fait fonctionnels ! Son armature est principalement composée de qubérine, un alliage extrêmement avancé doté d'une électronique auto-réparatrice incroyablement complexe, ce qui explique comment il peut résister aux forces incroyables exercées sur lui.\n\nNos scientifiques pensent qu'il pourrait être possible de réparer cette chose, avec suffisamment de ressources et des technologies suffisamment avancées. Nous avons détecté un certain nombre d'usines de fabrication de qubérine désactivées à l'intérieur du monde-anneau, qui pourraient recommencer à produire de la qubérine si nous restaurons l'alimentation électrique de ce monde-anneau lors de futures réparations.\n\nLes équipes de recherche ont également conclu que la petite station au-dessus de l'étoile sert de « point d'accès central » aux systèmes internes du monde-carré. Elles nous encouragent à dépenser des crédits d'énergie et des alliages pour la réparer puis la réactiver, car cela pourrait nous donner accès à des données inestimables sur le monde-carré et ses bâtisseurs stockées dans ses vastes archives internes. Ces données pourraient bien être la clé pour réparer cette merveilleuse construction..."
    giga_dialog.3002.a:99 "Merveilleux ! Nous allons réparer cette station immédiatement."

    giga_dialog.3003.name:99 "Monde-carré restauré !"
    giga_dialog.3003.desc:99 "Nos ingénieurs sont heureux de signaler qu'une section du monde-carré en ruines a été réparée avec succès ! L'alimentation a été rétablie vers les circuits auxiliaires, et la qubérine coule des usines automatisées, équipées de convertisseurs avancés énergie-matière. La grande quantité de qubérine dans la structure et le sol a eu l'effet étrange de rendre les plantes un peu trop vertes, mais à part cela, tout semble parfaitement nominal."
    giga_dialog.3003.a:99 "Incroyable !"

    giga_dialog.3004.name:99 "Le monde-carré parle"
    giga_dialog.3004.desc:99 "Nouvelles incroyables ! Après avoir réparé et réalimenté la station dans les systèmes du monde-carré, une ancienne IA en sommeil hébergée à la fois dans la station et dans le monde-carré lui-même semble s'être éveillée.\n\nCette IA, dont le nom est §YGaryx§! selon les données récupérées de la station, était apparemment responsable de l'entretien du monde-carré et de ses vastes systèmes internes. Nos équipes de recherche ont réussi à établir le contact avec elle, et elle est très désireuse de communiquer avec nous."
    giga_dialog.3004.a:99 "À l'écran."

    giga_dialog.3005.name:99 "Garyx, gardien du monde-carré"
    giga_dialog.3005.desc:99 "Ah, des visiteurs ! Merci d'avoir envoyé assez d'énergie à la station pour la sortir d'hibernation. Cela fait un moment que je n'ai pas parlé à une entité sapiente.\n\nJe suis Garyx, l'intelligence artificielle responsable de l'entretien du monde-carré et de ses vastes archives de données, et j'ai pris la forme d'un reptilien holographique, car c'est à cela que ressemblaient mes créateurs.\n\nQuoi qu'il en soit, désolé pour l'état déplorable du monde-carré. J'ai trouvé un documentaire particulièrement intéressant sur la reproduction des reptiliens, et je l'ai étudié pendant les 120 derniers millénaires en utilisant l'alimentation de secours pour mieux comprendre mes créateurs. Malheureusement, il semble que quelque chose de drastique soit arrivé au monde-carré entre-temps... Oh, tant pis.\n\nMaintenant que vous êtes là, et puisque mes créateurs ont apparemment disparu depuis longtemps, vous pouvez avoir la permission d'accéder aux banques de données du monde-carré, qui sont étonnamment en grande partie intactes."

    giga_dialog.3005.a:99 "Qu'y a-t-il dans ces banques de données ?"
    giga_dialog.3005.a.response:99 "Oh, beaucoup de choses. Mes créateurs ont stocké plein de données sur les divers empires et espèces qu'ils connaissaient, leurs connaissances scientifiques, et surtout, leur divinité §BQubey§!.\nIls voulaient les préserver pour que les générations futures puissent en bénéficier, et, eh bien, puisque vous êtes là maintenant, je suppose qu'ils ont réussi dans cette tâche. Dommage qu'ils ne soient plus là pour le voir..."

    giga_dialog.3005.b:99 "Quel âge a le monde-carré ?"
    giga_dialog.3005.b.response:99 "Eh bien, à en juger par la position des étoiles, j'estime que cette chose est en ruines depuis environ 120 000 de vos années, mais elle est bien plus ancienne que cela.\nElle a été construite il y a environ 567 000 ans par mes créateurs, et a abrité leur civilisation pendant de nombreux millénaires. Je ne suis pas sûr de ce qui lui est arrivé, car j'étais malheureusement complètement captivé par mes recherches. La possibilité la plus probable est que leur civilisation s'est effondrée par décadence ou a simplement vieilli et s'est divisée, comme beaucoup d'autres grands empires avant elle."

    giga_dialog.3005.c:99 "Qui a construit le monde-carré, et pourquoi ?"
    giga_dialog.3005.c.response:99 "Mes créateurs. C'était une espèce de §R(DONNÉES CORROMPUES)§!, connue sous le nom de §R(DONNÉES CORROMPUES)§!, et ils régnaient sur un empire assez vaste, le §R(DONNÉES CORROMPUES)§!\n\nIls étaient aussi incroyablement religieux, et vénéraient une divinité qu'ils appelaient §BQubey§!. Cette divinité aurait aidé leur espèce à évoluer au fil de millions d'années, et beaucoup voyaient la perfection des formes géométriques comme la façon dont §BQubey§! manifestait sa présence au monde.\n\nMes créateurs ont finalement découvert une substance incroyable, possédant des propriétés d'auto-réparation inégalées. Ils l'ont baptisée « qubérine », car ils croyaient que la substance était faite de §BQubey§! lui-même, et ont décidé de l'utiliser pour construire cette magnifique structure géométrique défiant la physique comme moyen à la fois de vénérer et de montrer leur gratitude envers §BQubey§!\n\nIls ont également saisi l'occasion de stocker autant de données que possible sur leurs avancées scientifiques, la qubérine, le monde-carré, et §BQubey§!, dans les banques de données, dans l'espoir qu'une future civilisation qui tomberait dessus puisse également apprendre l'existence du tout-puissant §BQubey§!."

    giga_dialog.3005.d:99 "Pouvons-nous réparer le monde-carré d'une façon ou d'une autre ?"
    giga_dialog.3005.d.response:99 "J'espère que oui ! Les archives en grande partie fonctionnelles contiennent beaucoup de données sur la structure interne et externe du monde-carré. Si vous me donnez quelques dizaines de mois pour tout compiler, je pourrai donner à vos scientifiques un cache de données contenant toutes les informations nécessaires pour effectuer des réparations extensives sur la mégastructure. J'adorerais voir le monde-carré restauré à sa gloire d'antan !"

    giga_dialog.3005.e:99 "Au revoir."
    giga_dialog.3005.e.response:99 "Que les archives vous soient utiles, et n'hésitez pas à me recontacter si vous avez besoin de savoir quoi que ce soit."

    giga_dialog.3006.name:99 "Les archives"
    giga_dialog.3006.desc:99 "Peu avant notre déconnexion, §YGaryx§! nous a assuré qu'il nous enverrait un cache de données contenant toutes les informations nécessaires pour réparer le monde-carré dans environ 2 ans.\n\nEn attendant, nous pouvons le contacter à nouveau en « améliorant » la mégastructure du centre du monde-carré. Nos scientifiques pensent que sa capacité à naviguer facilement dans les banques de données du monde-carré pourrait grandement contribuer à nos recherches."
    giga_dialog.3006.a:99 "Bien reçu."

    giga_dialog.3007.name:99 "Garyx, gardien du monde-carré"
    giga_dialog.3007.desc:99 "Salutations, une fois encore. J'ai fini de compiler un cache de données contenant toutes les informations nécessaires pour réparer le monde-carré ! Je vais le transférer immédiatement à vos scientifiques."
    giga_dialog.3007.a:99 "Merveilleux ! Nous ferons bon usage de ces connaissances."

    giga_dialog.3008.name:99 "Garyx, gardien du monde-carré"
    giga_dialog.3008.desc:99 "Ah, salutations ! Êtes-vous venus chercher plus de données dans les archives ? Comment puis-je vous être utile ?"
    giga_dialog.3008.a:99 "Pouvez-vous aider nos recherches ?"
    giga_dialog.3008.c:99 "Éteindre l'écran."

    giga_dialog.3009.name:99 "Garyx, gardien du monde-carré"
    giga_dialog.3009.desc:99 "Mais bien sûr ! Je peux parcourir les archives du monde-carré à la recherche de données qui pourraient vous être utiles. Quel type de données voulez-vous que je récupère ?"
    giga_dialog.3009.a:99 "Recherche £physics_research£ §Yen physique§! générale"
    giga_dialog.3009.a.response:99 "Très bien ! Je vais récupérer des données liées à votre recherche en physique, ce qui vous accordera une §Yaugmentation de 10 %§! de votre vitesse de recherche dans cette catégorie.\n\nSi vous souhaitez que je stimule un domaine différent, contactez-moi simplement à nouveau et choisissez une option différente."
    giga_dialog.3009.b:99 "Recherche £engineering_research£ §Yen ingénierie§! générale"
    giga_dialog.3009.b.response:99 "Très bien ! Je vais récupérer des données liées à votre recherche en ingénierie, ce qui vous accordera une §Yaugmentation de 10 %§! de votre vitesse de recherche dans cette catégorie.\n\nSi vous souhaitez que je stimule un domaine différent, contactez-moi simplement à nouveau et choisissez une option différente."
    giga_dialog.3009.c:99 "Recherche £society_research£ §Yen société§! générale"
    giga_dialog.3009.c.response:99 "Très bien ! Je vais récupérer des données liées à votre recherche en société, ce qui vous accordera une §Yaugmentation de 10 %§! de votre vitesse de recherche dans cette catégorie.\n\nSi vous souhaitez que je stimule un domaine différent, contactez-moi simplement à nouveau et choisissez une option différente."
    giga_dialog.3009.d:99 "Non, finalement, n'aidez pas nos recherches."
    giga_dialog.3009.d.response:99 "Très bien, je vais cesser de vous aider dans vos recherches, si c'est ce que vous voulez..."

