l_french:

    ########################################################
    ##################### DYSON SPHERE #####################
    ########################################################
    giga_dialog.40041.desc:99 "La construction de la sphère de Dyson de [From.From.GetName] progresse, avec l'installation de nouveaux collecteurs solaires avancés qui ont permis d'accroître les bénéfices de la sphère de Dyson.\n\nLes gains énergétiques ont atteint 50 % de la valeur maximale projetée de l'ouvrage achevé."
    giga_dialog.40042.desc:99 "Avec l'ajout d'une nouvelle série de panneaux de collecte solaire, nous avons presque terminé la sphère de Dyson en construction dans le système [From.From.GetName].\n\nLa structure produit désormais 75 % de la puissance maximale projetée pour une étoile de cette taille.\n\nBientôt, toute la puissance de l'étoile elle-même sera à portée de main."

    ########################################################
    ##################### KUGELBLITZ #######################
    ########################################################
    giga_dialog.101.name:99 "Site de $name_kugelblitz$ construit"
    giga_dialog.101.desc:99 "Le chantier de construction d'un $name_kugelblitz$ dans le système [giga_system.GetName] est maintenant terminé. Il abrite le personnel et l'équipement nécessaires à la construction d'un dispositif capable de générer un Kugelblitz artificiel, c'est-à-dire un trou noir composé de rayonnement au lieu de matière ! Nous pourrons injecter de l'énergie et de la matière dans le Kugelblitz, puis l'extraire et la reconvertir en matière si nécessaire, faisant ainsi du Kugelblitz un silo extrêmement efficace !"
    giga_dialog.101.a:99 "Excellent."

    giga_dialog.102.name:99 "$name_kugelblitz$ vide construit"
    giga_dialog.102.desc:99 "Nos ingénieurs ont terminé la construction du grand dispositif capable de générer un Kugelblitz artificiel."
    giga_dialog.102.a:99 "Formidable."

    giga_dialog.103.name:99 "Kugelblitz généré !"
    giga_dialog.103.desc:99 "Notre $name_kugelblitz$ a réussi à générer un Kugelblitz artificiel ! Bien qu'il perde actuellement de l'énergie en raison du rayonnement de Hawking accéléré, il peut désormais stocker de la matière et de l'énergie sous forme de rayonnement pour une utilisation ultérieure !"
    giga_dialog.103.a:99 "Merveilleux !"

    giga_dialog.106.name:99 "Kugelblitz amélioré !"
    giga_dialog.106.desc:99 "Notre $name_kugelblitz$ au-dessus de [giga_planet.GetName] a été amélioré avec succès ! Déjà, les entrepôts ailleurs dans [giga_system_owner.GetName] ont commencé à vider leur contenu et à l'expédier vers [giga_planet.GetName] pour profiter de la capacité accrue de la singularité artificielle."
    giga_dialog.106.a:99 "Un grand exploit."

    giga_dialog.107.name:99 "Le grand entrepôt"
    giga_dialog.107.desc:99 "Notre $name_kugelblitz$ près de [giga_planet.GetName] a été entièrement amélioré selon les dernières avancées en technologie tétradimensionnelle. La singularité artificielle au coeur de la structure a déjà grandi au point de presque dépasser le planétoïde autour duquel elle est basée.\n\nAvec une telle construction, nous pouvons désormais stocker des quantités de matières premières et de produits raffinés qui auraient été considérées comme quasi impossibles auparavant. Les projections de rendement indiquent qu'il faudra plusieurs années avant que le Kugelblitz n'atteigne sa capacité stable."
    giga_dialog.107.a:99 "Vraiment incroyable !"

    giga_dialog.104.name:99 "$name_kugelblitz$ en ruines"
    giga_dialog.104.desc:99 "Notre vaisseau scientifique entrant dans le système [from.GetName] a été accueilli par des vues singulières. Un $name_kugelblitz$ a été repéré en orbite autour de l'une des planètes ! Cette construction incroyablement avancée pourrait abriter une singularité contrôlée, capable de générer de grandes quantités d'énergie. Malheureusement, elle semble être tombée dans un état de délabrement avancé."
    giga_dialog.104.a:99 "Fascinant."

    giga_dialog.105.name:99 "$name_kugelblitz$ réparé !"
    giga_dialog.105.desc:99 "Un $name_kugelblitz$ en ruines a été remis en état de fonctionnement par nos équipes d'ingénieurs ! Lors de la réactivation, la structure a commencé à générer une singularité contrôlée massive, dont nous pouvons extraire de grandes quantités d'énergie, ainsi que stocker de la matière sous forme de rayonnement."
    giga_dialog.105.a:99 "Comment cela fonctionne-t-il ?"

    ########################################################
    #################### PENROSE SPHERE ####################
    ########################################################
    giga_dialog.1207.title:99 "Finalité de la $name_penrose$"
    giga_dialog.1207.a.desc:99 "Maintenant que le cadre de miroirs autour de [giga_system.GetName] est terminé, nous pouvons enfin commencer nos préparatifs pour l'utiliser comme bombe.\n\nNous devrons la laisser accumuler de l'énergie pendant quelques années, puis elle acquerra la capacité d'être détonée. Tout ce qui se trouve dans le système sera détruit, et l'explosion sera si puissante qu'elle se propagera à travers les hyper-lignes. Chaque planète des systèmes voisins sera rendue inhabitable par le flux d'énergie, et chaque planète à deux sauts sera irradiée. Plus important encore, elle enverra une onde de choc à travers le sous-espace, perturbant et réarrangeant les hyper-lignes jusqu'à 4 sauts de distance !"
    giga_dialog.1207.b.desc:99 "Maintenant que le cadre de miroirs autour de [giga_system.GetName] est terminé, nous pouvons enfin commencer nos préparatifs pour le stabiliser et l'utiliser pour la production d'énergie.\n\nSa production sera relativement médiocre (250 £energy£), mais il pourrait être possible de le stabiliser une fois que nous aurons obtenu les technologies appropriées."

    giga_dialog.1207.a:99 "Ce sera un bel instrument de destruction."
    giga_dialog.1207.b:99 "Bientôt, toute sa puissance sera nôtre."

    ###########################################################
    #################### FUSION SUPPRESSOR ####################
    ###########################################################
    giga_dialog.3401.name:99 "Chantier de $name_fusion_suppressor$ construit"
    giga_dialog.3401.desc:99 "Le chantier de construction d'un futur $name_fusion_suppressor$ a été construit avec succès dans le système [giga_system.GetName]. Il abritera l'infrastructure nécessaire pour commencer la construction d'un $name_fusion_suppressor$, capable de modifier les processus mêmes au sein d'une étoile."
    giga_dialog.3401.a:99 "Formidable."

    giga_dialog.3402.name:99 "Modulateurs gravitationnels construits"
    giga_dialog.3402.desc:99 "Nos ingénieurs ont terminé la construction du grand réseau de modulateurs gravitationnels de notre $name_fusion_suppressor$ autour de [giga_system.GetName]. Ces dispositifs imposants sont capables de générer un champ gravitationnel artificiel pour comprimer une étoile entière et modifier ses processus de fusion internes."
    giga_dialog.3402.a:99 "Merveilleux."

    giga_dialog.3403.name:99 "Stabilisateurs stellaires construits"
    giga_dialog.3403.desc:99 "Les stabilisateurs stellaires de notre $name_fusion_suppressor$ autour de [giga_system.GetName] sont maintenant terminés. Ils sont capables de stabiliser l'étoile pendant que les modulateurs gravitationnels génèrent le champ gravitationnel artificiel. Nous pouvons maintenant commencer le processus de compression de l'étoile pour éventuellement la détruire ou la transformer en trou noir."
    giga_dialog.3403.a:99 "Impressionnant."

    giga_dialog.3404.name:99 "Compression stellaire - Phase I"
    giga_dialog.3404.desc:99 "Notre $name_fusion_suppressor$ a commencé avec succès à comprimer [giga_system.GetName]. Les processus de fusion de l'étoile ont été modifiés et un puissant champ gravitationnel a été généré, réduisant le volume apparent de l'étoile. Les nombreux effets que cela a eus sur le plasma stellaire sont étudiés par divers laboratoires au sein du $name_fusion_suppressor$."
    giga_dialog.3404.a:99 "Merveilleux."

    giga_dialog.3405.name:99 "Compression stellaire - Phase II"
    giga_dialog.3405.desc:99 "Le $name_fusion_suppressor$ a de nouveau comprimé [giga_system.GetName] à un volume encore plus petit. Des phénomènes intéressants sont apparus au sein de l'étoile, produisant d'excellents résultats scientifiques, et l'étoile commence à se comporter de manière défiant les lois de la physique. Une compression supplémentaire produira davantage de résultats."
    giga_dialog.3405.a:99 "Formidable."

    giga_dialog.3406.name:99 "Compression stellaire - Étoile à neutrons"
    giga_dialog.3406.desc:99 "Le $name_fusion_suppressor$ a maintenant comprimé [giga_system.GetName] à un point tel que les protons et les électrons du coeur de l'étoile ont fusionné pour devenir des neutrons, transformant le coeur en étoile à neutrons, entourée d'une couche de plasma stellaire exotique.\n\nNous pouvons maintenant conserver l'étoile en l'état, ce qui produira de la recherche en physique et en ingénierie. Alternativement, nous pouvons comprimer davantage l'étoile, la transformant en trou noir artificiel, ce qui produira de la recherche en physique. Enfin, le $name_fusion_suppressor$ peut relâcher toute la compression gravitationnelle et exercer une force répulsive, provoquant l'explosion de l'étoile en supernova par les forces répulsives au sein de son coeur, détruisant le $name_fusion_suppressor$ et déposant une nouvelle ressource stratégique à la surface des planètes de ce système solaire, utilisable pour créer de puissants bâtiments."
    giga_dialog.3406.a:99 "Excellent."

    giga_dialog.3407.name:99 "$name_fusion_suppressor$ démantelé"
    giga_dialog.3407.desc:99 "Le $name_fusion_suppressor$ dans le système [giga_system.GetName] a été démantelé avec succès. Le trou noir qu'il a créé est maintenant utilisable pour d'autres projets."
    giga_dialog.3407.a:99 "Merveilleux."

    giga_dialog.3409.title:99 "Supernova"
    giga_dialog.3409.desc:99 "Le $name_fusion_suppressor$ a relâché tous les champs gravitationnels exercés sur l'étoile et a commencé à appliquer un champ gravitationnel négatif.\nEn quelques secondes, les intenses forces répulsives au sein du coeur de neutrons de l'étoile surmontent le champ gravitationnel naturel, et les énergies bouillonnantes d'une étoile superdense sont soudain libérées.\nL'étoile commence à briller plus intensément et semble pulser pendant quelques secondes, avant que les couches externes de l'étoile ne soient soudainement éjectées à des vitesses relativistes par les forces répulsives. En quelques heures, chaque planète du système est vitrifiée par l'énorme vague d'énergie, les dépouillant de leurs surfaces et atmosphères.\nDes gisements d'iodizium se sont formés sur les planètes désormais en fusion, prêts à être récoltés et utilisés."
    giga_dialog.3409.a:99 "Merveilleux !"

    giga_dialog.3410.title:99 "Trou noir"
    giga_dialog.3410.desc:99 "Le $name_fusion_suppressor$ a intensifié son champ gravitationnel artificiel au maximum. L'étoile s'est effondrée au point où même la lumière ne peut échapper à son attraction gravitationnelle naturelle, la transformant effectivement en trou noir. Les laboratoires de recherche au sein du $name_fusion_suppressor$ ont commencé à étudier le trou noir artificiel, produisant des données scientifiques incroyables."
    giga_dialog.3410.a:99 "Merveilleux !"

    ########################################################
    #################### ALDERSON DISC #####################
    ########################################################

    giga_dialog.2501.title:99 "Spécialisation de la tranche d'Alderson"
    giga_dialog.2501.desc:99 "Le moment est venu de décider quel type de tranche d'Alderson nous voulons améliorer pour ce segment particulier. Le type pourra être modifié ultérieurement une fois le segment terminé, par terraformation."

    giga_dialog.2502.title:99 "Chantier du $name_alderson$ terminé !"
    giga_dialog.2502.desc:99 "Le chantier de construction de notre $name_alderson$ a été achevé dans le système [giga_system.GetName]. Cette plateforme servira de base pour commencer la construction de l'armature colossale de la structure, qui s'étendra jusqu'aux confins de ce système. Il sera également possible de construire des tranches d'Alderson de type complexe informatique planétaire et écuménopole si leurs équivalents planétaires sont déjà débloqués."
    giga_dialog.2502.a:99 "Formidable."

    giga_dialog.2503.title:99 "Armature du $name_alderson$ terminée !"
    giga_dialog.2503.desc:99 "L'armature de notre disque d'Alderson couvrant tout le système est maintenant achevée ! Ce squelette métallique colossal couvre l'intégralité du système et servira de base pour construire les tranches elles-mêmes. Chaque tranche possédera 15 districts, chacun étant 4 fois plus puissant qu'un district de monde-anneau standard. Une fois achevée, cette puissante structure nous permettra certainement de devenir les plus grands bâtisseurs de cette galaxie."
    giga_dialog.2503.a:99 "Mais comment ne s'effondre-t-elle pas sur elle-même ?"
    giga_dialog.2503.a.tooltip:99 "L'ingénierie multidimensionnelle est littéralement un prérequis pour cette chose."

    giga_dialog.2504.title:99 "Tranche d'Alderson terminée !"
    giga_dialog.2504.desc:99 "L'une des tranches de notre $name_alderson$ est enfin terminée ! Cet habitat colossal s'étend sur plusieurs unités astronomiques et fournira des quantités incommensurables d'espace vital pour notre population et nos industries. Nous devrions commencer à la coloniser immédiatement."
    giga_dialog.2504.a:99 "Merveilleux !"

    giga_dialog.2505.title:99 "Complexe informatique d'Alderson terminé !"
    giga_dialog.2505.desc:99 "L'une des tranches de notre $name_alderson$ est enfin terminée ! Cet habitat colossal s'étend sur plusieurs unités astronomiques et fournira des quantités incommensurables d'espace vital pour notre population et nos industries. Cette tranche est entièrement recouverte de couches et de couches d'ordinateurs et de processeurs puissants. Elle pourra fournir à nos chercheurs des quantités quasi illimitées de puissance de calcul, et un accès instantané aux banques de données de connaissances de notre empire. Cette puissante construction nous aidera certainement à percer les mystères de l'univers avec encore plus de facilité qu'auparavant."
    giga_dialog.2505.a:99 "Merveilleux ! Peut-elle faire tourner Crysis ?"
    giga_dialog.2505.a.tooltip:99 "Non."

    giga_dialog.2506.title:99 "Écuménopole d'Alderson terminée !"
    giga_dialog.2506.desc:99 "L'une des tranches de notre $name_alderson$ est enfin terminée ! Cet habitat colossal s'étend sur plusieurs unités astronomiques et fournira des quantités incommensurables d'espace vital pour notre population et nos industries. Cette tranche est entièrement recouverte d'étalement urbano-industriel, offrant des capacités industrielles et un hébergement gargantuesque pour nos citoyens."
    giga_dialog.2506.a:99 "Merveilleux !"

    giga_dialog.25061.title:99 "Alderson de ruche terminé !"
    giga_dialog.25061.desc:99 "L'une des tranches de notre $name_alderson$ est enfin terminée ! Cet habitat colossal s'étend sur plusieurs unités astronomiques et fournira des quantités incommensurables d'espace vital pour notre population et nos industries. Cette tranche entière est un organisme vivant géant, connecté psioniquement à l'Esprit de ruche qui l'a façonné. Tout être n'appartenant pas à la Ruche qui met le pied ici sera attaqué par le terrain lui-même."
    giga_dialog.25061.a:99 "Merveilleux !"

    giga_dialog.25062.title:99 "Alderson machine terminé !"
    giga_dialog.25062.desc:99 "L'une des tranches de notre $name_alderson$ est enfin terminée ! Cet habitat colossal s'étend sur plusieurs unités astronomiques et fournira des quantités incommensurables d'espace vital pour notre population et nos industries. Cette tranche est entièrement recouverte de structures artificielles. L'atmosphère ténue est principalement composée de polluants industriels et n'est pas capable de supporter la vie biologique."
    giga_dialog.25062.a:99 "Merveilleux !"

    giga_dialog.2507.title:99 "$name_alderson$ terminé !"
    giga_dialog.2507.desc:99 "C'est fait ! Dans le système [giga_system.GetName], nous avons réussi à assembler entièrement un disque colossal s'étendant de l'étoile jusqu'aux confins du système. Cette gigastructure gargantuesque éclipse tout ce que nous avons construit auparavant, et témoigne de notre domination ultime sur les lois de la physique et de l'ingénierie."
    giga_dialog.2507.a:99 "Qui pourrait s'opposer à nous maintenant ?"

    ########################################################
    ################# AUTOMATED STRIPMINE ##################
    ########################################################

    giga_dialog.3301.name:99 "Chantier de $name_auto_stripmine$ construit"
    giga_dialog.3301.desc:99 "Nos ingénieurs ont terminé l'assemblage du chantier de construction d'une future $name_auto_stripmine$ près de [giga_system.GetName]. Cette grande plateforme orbitale accueillera tout ce dont nous avons besoin pour construire un vaste complexe minier autour de la planète, la dépouillant finalement de presque tous ses minéraux."
    giga_dialog.3301.a:99 "Excellent."

    giga_dialog.3302.name:99 "Appareil orbital de la $name_auto_stripmine$ construit"
    giga_dialog.3302.desc:99 "L'appareil orbital de notre $name_auto_stripmine$ est maintenant terminé. Cette grande construction se compose de deux puissants rayons tracteurs capables à la fois de tracter de grandes quantités de minéraux extraits, et de bombarder la surface avec de puissants faisceaux d'énergie pour faire fondre les parties de la planète difficiles à exploiter. Il incorpore également un anneau de traitement, afin d'augmenter davantage le rendement en minéraux. Maintenant, nous devons terminer la construction des installations planétaires, composées de millions d'unités de forage robotisées, afin de commencer réellement les opérations d'extraction."
    giga_dialog.3302.a:99 "Merveilleux !"

    giga_dialog.3303.title:99 "Mine planétaire à ciel ouvert opérationnelle"
    giga_dialog.3303.desc:99 "Notre $name_auto_stripmine$ a été activée avec succès ! D'énormes rayons tracteurs orbitaux transportent des tonnes et des tonnes de minéraux, extraits par des millions de foreuses robotisées automatisées collectant les minéraux de la planète dans des milliers de complexes miniers tentaculaires."
    giga_dialog.3303.monster.desc:99 "Notre $name_auto_stripmine$ a été activée avec succès ! D'énormes rayons tracteurs orbitaux transportent des tonnes et des tonnes de minéraux, extraits par des millions de foreuses robotisées automatisées collectant les minéraux de la planète dans des milliers de complexes miniers tentaculaires.\n\nLes anciens habitants de [giga_planet.GetName] n'ont pas réussi à s'échapper à temps lors de l'activation de la structure. Ils seront probablement ramassés comme s'ils n'étaient que des rochers et ajoutés à la production de la $name_auto_stripmine$."
    giga_dialog.3303.a:99 "Production de minéraux nominale."
    giga_dialog.3303.b:99 "Quelle horreur... pour eux."

    giga_dialog.3304.title:99 "La mine planétaire à ciel ouvert a atteint le noyau externe"
    giga_dialog.3304.desc:99 "Nos ingénieurs et scientifiques affectés à la $name_auto_stripmine$ de [giga_planet.GetName] nous informent que les opérations minières ont atteint le noyau externe en fusion de la planète.\nCela signifie que les opérations d'extraction de minéraux cesseront dans quelques années, lorsque nous atteindrons enfin le noyau interne."
    giga_dialog.3304.a:99 "Bien reçu."

    giga_dialog.3305.title:99 "Mine planétaire à ciel ouvert épuisée"
    giga_dialog.3305.desc:99 "La $name_auto_stripmine$ de [giga_planet.GetName] n'a plus de minéraux à extraire. [giga_planet.GetName] a été réduite à un petit noyau en fusion exposé au froid de l'espace. Les minéraux restants du noyau ont été extraits par des techniques de fracturation avancées, ce qui signifie qu'il ne reste que des débris et des matériaux à peine exploitables. L'appareil orbital a été démantelé et un gisement de minéraux est maintenant présent sur le noyau exposé de la planète."
    giga_dialog.3305.a:99 "C'était inévitable."

    giga_dialog.3306.name:99 "La mine planétaire à ciel ouvert a trouvé des ressources"
    giga_dialog.3306.desc.minerals:99 "La $name_auto_stripmine$ de [fromfrom.GetName] a mis au jour des filons de minerai riche assez importants. Ces filons augmenteront le rendement en £minerals£§YMinéraux§! de la $name_auto_stripmine$ en orbite de manière significative.\n\nOn estime qu'ils ne dureront que pendant encore [from.gigas_stripmine_rich_mineral_deposit_length] couches de la planète."
    giga_dialog.3306.desc.alloys:99 "La $name_auto_stripmine$ de [fromfrom.GetName] a découvert une portion de manteau particulièrement dense. Cette section extra-dense de la lithosphère est incroyablement similaire structurellement aux £alloys£§YAlliages§!, nous permettant effectivement d'extraire directement des matériaux raffinés. Malheureusement, excaver un matériau digne de servir de blindage pour des vaisseaux spatiaux n'est pas une tâche simple, et la concentration requise sur le gisement dense ralentira la production de £minerals£§YMinéraux§!.\n\nOn estime que nous pourrons retirer encore [from.gigas_stripmine_alloy_deposit_length] couches de la planète avant que les matériaux denses ne s'épuisent."
    giga_dialog.3306.desc.gas:99 "La $name_auto_stripmine$ de [fromfrom.GetName] a percé de vastes cavernes, remplies d'une forme hautement pressurisée de £exotic_gases£§YGaz exotiques§! ! Les drones à la surface devraient pouvoir extraire ce précieux gaz. Malheureusement, détourner des drones vers la récolte du gaz ralentira la production de £minerals£§YMinéraux§!.\n\nNous estimons qu'il reste [from.gigas_stripmine_gas_deposit_length] couches de la planète avant de ne plus voir ces cavernes."
    giga_dialog.3306.desc.motes:99 "La $name_auto_stripmine$ de [fromfrom.GetName] a découvert un filon de composés hautement volatils. Avec un raffinement mineur, ces matériaux pourraient être utilisés comme substitut aux £volatile_motes£§YParticules volatiles§!. Cette aubaine devrait cependant réduire la production de £minerals£§YMinéraux§! car nous devons ralentir nos opérations minières pour éviter toute ignition accidentelle des composés.\n\nNous prévoyons que les composés s'épuiseront après [from.gigas_stripmine_motes_deposit_length] couches de la planète."
    giga_dialog.3306.desc.crystals:99 "La $name_auto_stripmine$ de [fromfrom.GetName] a localisé une caverne remplie à ras bord de structures cristallines. Une purification et un traitement appropriés pourraient transformer des fragments de ces cristaux en £rare_crystals£§YCristaux rares§! utilisables. La caverne est instable et la nécessité de la démonter soigneusement pour ne pas endommager les cristaux à l'intérieur ralentira malheureusement la production de £minerals£§YMinéraux§!.\n\nOn prévoit que les cavernes seront présentes pendant encore [from.gigas_stripmine_crystal_deposit_length] couches de la planète."
    giga_dialog.3306.desc.tensiles:99 "La $name_auto_stripmine$ de [fromfrom.GetName] a découvert quelque chose de vraiment remarquable : une portion particulière de la planète est « creuse », cette cavité interne résistant aux forces de gravité grâce à un £giga_sr_amb_megaconstruction£§YMatériau supertensile§! naturel. Bien que le vide réduise la production de £minerals£§YMinéraux§! de la structure, la récolte estimée de ce £giga_sr_amb_megaconstruction£§YMatériau supertensile§! naturel est vraiment inestimable pour de futurs projets de mégaconstruction.\n\nOn prévoit que la poche ne durera pas longtemps, ne soutenant l'extraction que pendant environ [from.gigas_stripmine_supertensile_deposit_length] couches de la planète."
    giga_dialog.3306.desc.default:99 "La $name_auto_stripmine$ de [fromfrom.GetName] a localisé une concentration anormale de ressources enfouies profondément sous la surface de la planète. Ces ressources devraient s'avérer inestimables pour augmenter le rendement de la structure, bien qu'elles ne dureront pas éternellement."
    ########################################################
    ######################### SUCC #########################
    ########################################################

    giga_dialog.1901.name:99 "Chantier du $name_succ$ terminé"
    giga_dialog.1901.desc:99 "Le chantier de construction d'un futur $name_succ_full$ dans le système [giga_system.GetName] est terminé ! Sur cet échafaudage, nous construirons un dispositif massif qui récoltera progressivement l'atmosphère de la géante gazeuse et la filtrera en gaz exotiques. Il générera également de l'énergie grâce à des réacteurs à fusion utilisant l'hydrogène présent dans l'atmosphère."
    giga_dialog.1901.a:99 "Combien de temps a-t-il fallu pour trouver cet acronyme ?"
