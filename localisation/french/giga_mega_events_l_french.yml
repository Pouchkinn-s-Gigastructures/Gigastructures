l_french:
  
  ########################################################
  ##################### DYSON SPHERE #####################
  ########################################################
  giga_dialog.40041.desc:0 "Les travaux sur la sphère de Dyson de [From.From.GetName] progressent. L'installation de davantage de collecteurs solaires avancés a augmenté les bénéfices de la sphère de Dyson.\n\nLes gains énergétiques ont atteint 50 % de la valeur maximale projetée de l'ouvrage achevé."
  giga_dialog.40042.desc:0 "Avec l'ajout d'un nouvel ensemble de panneaux de collecte solaire, nous avons presque terminé la sphère de Dyson en construction dans le système [From.From.GetName].\n\nLa structure produit maintenant 75 % de la production maximale projetée pour une étoile de cette taille.\n\nBientôt, la pleine puissance de l'étoile elle-même sera à portée de main."
  
  ########################################################
  ##################### KUGELBLITZ #######################
  ########################################################
  giga_dialog.101.name:0 "Site du $name_kugelblitz$ construit"
  giga_dialog.101.desc:0 "Le site de construction d'un $name_kugelblitz$ dans le système [giga_system.GetName] est maintenant terminé. Il abrite le personnel et l'équipement nécessaires pour construire un dispositif capable de générer un Kugelblitz artificiel, qui est un trou noir composé de rayonnement au lieu de matière ! Nous pourrons injecter de l'énergie et de la matière dans le Kugelblitz, puis l'extraire et la reconvertir en matière si nécessaire, faisant du Kugelblitz un silo très efficace !"
  giga_dialog.101.a:0 "Excellent."
  
  giga_dialog.102.name:0 "$name_kugelblitz$ vide construit"
  giga_dialog.102.desc:0 "Nos ingénieurs ont terminé la construction du grand dispositif capable de générer un Kugelblitz artificiel."
  giga_dialog.102.a:0 "Formidable."
  
  giga_dialog.103.name:0 "Kugelblitz généré !"
  giga_dialog.103.desc:0 "Notre $name_kugelblitz$ a généré avec succès un Kugelblitz artificiel ! Bien qu'il fuie actuellement de l'énergie en raison du rayonnement de Hawking accéléré, il peut maintenant stocker de la matière et de l'énergie sous forme de rayonnement pour une utilisation ultérieure !"
  giga_dialog.103.a:0 "Merveilleux !"
  
  giga_dialog.106.name:0 "Kugelblitz amélioré !"
  giga_dialog.106.desc:0 "Notre $name_kugelblitz$ au-dessus de [giga_planet.GetName] a été amélioré avec succès ! Déjà, les entrepôts ailleurs dans [giga_system_owner.GetName] commencent à vider leur contenu et à l'expédier vers [giga_planet.GetName] pour profiter de la capacité accrue de la singularité artificielle."
  giga_dialog.106.a:0 "Un grand exploit."
  
  giga_dialog.107.name:0 "Le grand entrepôt"
  giga_dialog.107.desc:0 "Notre $name_kugelblitz$ près de [giga_planet.GetName] a été entièrement amélioré aux dernières avancées de la technologie tétradimensionnelle. La singularité artificielle au coeur de la structure a déjà grandi au point de presque dépasser le planétoïde autour duquel elle est basée.\n\nAvec une telle construction, nous pouvons maintenant stocker des quantités de matières premières et de produits raffinés qui auraient auparavant été considérées comme quasi impossibles. Les projections de rendement déclarent qu'il faudra plusieurs années avant que le kugelblitz ne soit rempli à sa capacité stable."
  giga_dialog.107.a:0 "Véritablement incroyable !"
  
  giga_dialog.104.name:0 "$name_kugelblitz$ en ruine"
  giga_dialog.104.desc:0 "Notre vaisseau scientifique entrant dans le système [from.GetName] a été accueilli par des vues singulières. Un $name_kugelblitz$ a été repéré en orbite autour de l'une des planètes ! Cette construction incroyablement avancée pourrait abriter une singularité contrôlée, capable de générer de grandes quantités d'énergie. Malheureusement, il semble être tombé dans un état de délabrement avancé."
  giga_dialog.104.a:0 "Fascinant."
  
  giga_dialog.105.name:0 "$name_kugelblitz$ réparé !"
  giga_dialog.105.desc:0 "Un $name_kugelblitz$ en ruine a été remis en état de marche par nos équipes d'ingénieurs ! Lors de la réactivation, la construction a commencé à générer une singularité contrôlée massive, à partir de laquelle nous pouvons extraire de grandes quantités d'énergie, ainsi que stocker de la matière sous forme de rayonnement."
  giga_dialog.105.a:0 "Comment est-ce même possible ?"
  
  ########################################################
  #################### PENROSE SPHERE ####################
  ########################################################
  giga_dialog.1207.title:0 "Objectif de la $name_penrose$"
  giga_dialog.1207.a.desc:0 "Maintenant que le cadre de miroirs est terminé autour de [giga_system.GetName], nous pouvons enfin commencer nos préparatifs pour l'utiliser comme bombe.\n\nNous devrons la laisser accumuler de l'énergie pendant quelques années, puis elle acquerra la capacité d'être déclenchée. Tout dans le système sera détruit, et l'explosion sera si puissante qu'elle se propagera à travers les hyperlanes. Chaque planète des systèmes voisins sera rendue inhabitable par le flux d'énergie, et chaque planète à deux sauts sera irradiée. Plus important encore, elle enverra une onde de choc à travers le sous-espace, perturbant et réarrangeant les hyperlanes jusqu'à 4 sauts de distance !"
  giga_dialog.1207.b.desc:0 "Maintenant que le cadre de miroirs est terminé autour de [giga_system.GetName], nous pouvons enfin commencer nos préparatifs pour le stabiliser et l'utiliser pour la production d'énergie.\n\nSa production sera relativement médiocre (250 £energy£), mais il pourrait être possible de le stabiliser une fois que nous aurons les technologies appropriées."
  
  giga_dialog.1207.a:0 "Ce sera un bel instrument de destruction."
  giga_dialog.1207.b:0 "Bientôt, sa pleine puissance sera nôtre."
  
  ###########################################################
  #################### FUSION SUPPRESSOR ####################
  ###########################################################
  giga_dialog.3401.name:0 "Site de construction du $name_fusion_suppressor$ achevé"
  giga_dialog.3401.desc:0 "Le site de construction d'un futur $name_fusion_suppressor$ a été construit avec succès dans le système [giga_system.GetName]. Il abritera l'infrastructure nécessaire pour commencer la construction d'un $name_fusion_suppressor$, capable de modifier les processus mêmes au sein d'une étoile."
  giga_dialog.3401.a:0 "Formidable."
  
  giga_dialog.3402.name:0 "Modulateurs gravitationnels construits"
  giga_dialog.3402.desc:0 "Nos ingénieurs ont terminé la construction du grand réseau de modulateurs gravitationnels de notre $name_fusion_suppressor$ autour de [giga_system.GetName]. Ces dispositifs massifs sont capables de générer un champ gravitationnel artificiel pour comprimer une étoile entière et altérer ses processus de fusion internes."
  giga_dialog.3402.a:0 "Merveilleux."
  
  giga_dialog.3403.name:0 "Stabilisateurs stellaires construits"
  giga_dialog.3403.desc:0 "Les stabilisateurs stellaires de notre $name_fusion_suppressor$ autour de [giga_system.GetName] sont maintenant terminés. Ils sont capables de stabiliser l'étoile pendant que les modulateurs gravitationnels génèrent le champ gravitationnel artificiel. Maintenant, nous pouvons commencer le processus réel de compression de l'étoile pour éventuellement la détruire, ou la transformer en trou noir."
  giga_dialog.3403.a:0 "Remarquable."
  
  giga_dialog.3404.name:0 "Compression stellaire — Phase I"
  giga_dialog.3404.desc:0 "Notre $name_fusion_suppressor$ a commencé avec succès à comprimer [giga_system.GetName]. Les processus de fusion de l'étoile ont été altérés et un puissant champ gravitationnel a été généré, réduisant le volume apparent de l'étoile. Les nombreux effets que cela a eu sur le plasma stellaire sont étudiés par divers laboratoires au sein du $name_fusion_suppressor$."
  giga_dialog.3404.a:0 "Merveilleux."
  
  giga_dialog.3405.name:0 "Compression stellaire — Phase II"
  giga_dialog.3405.desc:0 "Le $name_fusion_suppressor$ a de nouveau comprimé [giga_system.GetName] à un volume encore plus petit. Des phénomènes intéressants sont apparus au sein de l'étoile, produisant d'excellents retours scientifiques, et l'étoile commence à se comporter de manière défiant les lois de la physique. Une compression supplémentaire apportera davantage de résultats."
  giga_dialog.3405.a:0 "Formidable."
  
  giga_dialog.3406.name:0 "Compression stellaire — Étoile à neutrons"
  giga_dialog.3406.desc:0 "Le $name_fusion_suppressor$ a maintenant comprimé [giga_system.GetName] à tel point que les protons et les électrons au sein du noyau de l'étoile ont fusionné et sont devenus des neutrons, transformant le noyau en une étoile à neutrons, entourée d'une couche de plasma stellaire exotique.\n\nNous pouvons maintenant garder l'étoile telle quelle, produisant de la recherche en physique et en ingénierie. Alternativement, nous pouvons comprimer davantage l'étoile, la transformant en un trou noir artificiel, produisant de la recherche en physique. Enfin, le $name_fusion_suppressor$ peut libérer toute la compression gravitationnelle et exercer une force répulsive, causant l'explosion du noyau de l'étoile en supernova par les forces répulsives, détruisant le $name_fusion_suppressor$ et déposant une nouvelle ressource stratégique à la surface des planètes de ce système solaire, qui peut être utilisée pour créer des bâtiments puissants."
  giga_dialog.3406.a:0 "Excellent."
  
  giga_dialog.3407.name:0 "$name_fusion_suppressor$ démantelé"
  giga_dialog.3407.desc:0 "Le $name_fusion_suppressor$ dans le système [giga_system.GetName] a été démantelé avec succès. Le trou noir qu'il a créé est maintenant utilisable pour d'autres projets."
  giga_dialog.3407.a:0 "Merveilleux."
  
  giga_dialog.3409.title:0 "Supernova"
  giga_dialog.3409.desc:0 "Le $name_fusion_suppressor$ a libéré tous les champs gravitationnels exercés sur l'étoile et a commencé à appliquer un champ gravitationnel négatif.\nEn quelques secondes, les intenses forces répulsives au sein du noyau de neutrons de l'étoile surmontent le champ gravitationnel naturel, et les énergies bouillonnantes d'une étoile superdense sont soudainement libérées.\nL'étoile commence à briller plus intensément et semble pulser pendant quelques secondes, avant que les couches externes de l'étoile ne soient soudainement éjectées à des vitesses relativistes par les forces répulsives. En quelques heures, chaque planète du système est vitrifiée par l'énorme vague d'énergie, les dépouillant de leurs surfaces et atmosphères.\nDes gisements d'iodizium se sont formés sur les planètes désormais en fusion, prêts à être récoltés et utilisés."
  giga_dialog.3409.a:0 "Merveilleux !"
  
  giga_dialog.3410.title:0 "Trou noir"
  giga_dialog.3410.desc:0 "Le $name_fusion_suppressor$ a intensifié son champ gravitationnel artificiel à son maximum. L'étoile s'est effondrée au point où même la lumière ne peut échapper à son attraction gravitationnelle naturelle, la transformant effectivement en un trou noir. Les laboratoires de recherche au sein du $name_fusion_suppressor$ ont commencé à étudier le trou noir artificiel, produisant des données scientifiques incroyables."
  giga_dialog.3410.a:0 "Merveilleux !"
  
  ########################################################
  #################### ALDERSON DISC #####################
  ########################################################
  
  giga_dialog.2501.title:0 "Spécialisation de la tranche d'Alderson"
  giga_dialog.2501.desc:0 "Le moment est venu de décider quel type de tranche d'Alderson nous voulons développer pour ce segment particulier. Le type peut être changé ultérieurement une fois le segment terminé, via la terraformation."
  
  giga_dialog.2502.title:0 "Site de construction du $name_alderson$ achevé !"
  giga_dialog.2502.desc:0 "Le site de construction de notre $name_alderson$ a été achevé dans le système [giga_system.GetName]. Cette plateforme servira de base pour commencer la construction de l'armature colossale de la structure, qui s'étendra jusqu'aux confins de ce système. Il sera également possible de construire des tranches d'Alderson de calcul planétaire et d'écuménopole si leurs équivalents planétaires sont déjà débloqués."
  giga_dialog.2502.a:0 "Formidable."
  
  giga_dialog.2503.title:0 "Armature du $name_alderson$ achevée !"
  giga_dialog.2503.desc:0 "L'armature de notre disque d'Alderson couvrant tout le système est maintenant terminée ! Ce squelette métallique colossal couvre l'ensemble du système, et sera utilisé comme base pour construire les tranches elles-mêmes. Chaque tranche possédera 15 districts, chacun étant 4 fois plus puissant qu'un district de monde-anneau standard. Une fois achevée, cette puissante structure nous permettra certainement de devenir les plus grands bâtisseurs de cette galaxie."
  giga_dialog.2503.a:0 "Mais comment ne s'effondre-t-elle pas sur elle-même ?"
  giga_dialog.2503.a.tooltip:0 "L'ingénierie multidimensionnelle est littéralement un prérequis pour cette chose."
  
  giga_dialog.2504.title:0 "Tranche d'Alderson achevée !"
  giga_dialog.2504.desc:0 "L'une des tranches de notre $name_alderson$ a finalement été achevée ! Cet habitat colossal s'étend sur plusieurs unités astronomiques, et fournira des quantités inimaginables d'espace de vie pour notre population et nos industries. Nous devrions commencer à la coloniser immédiatement."
  giga_dialog.2504.a:0 "Merveilleux !"
  
  giga_dialog.2505.title:0 "Complexe de calcul d'Alderson achevé !"
  giga_dialog.2505.desc:0 "L'une des tranches de notre $name_alderson$ a finalement été achevée ! Cet habitat colossal s'étend sur plusieurs unités astronomiques, et fournira des quantités inimaginables d'espace de vie pour notre population et nos industries. Cette tranche est entièrement recouverte de couches et de couches d'ordinateurs et de processeurs puissants. Elle pourra fournir à nos chercheurs des quantités de puissance de calcul quasi illimitées, et un accès instantané aux banques de données de connaissances de notre empire. Cette puissante construction nous aidera certainement à percer les mystères de l'univers avec encore plus de facilité qu'auparavant."
  giga_dialog.2505.a:0 "Merveilleux ! Peut-elle faire tourner Crysis ?"
  giga_dialog.2505.a.tooltip:0 "Non."
  
  giga_dialog.2506.title:0 "Écuménopole d'Alderson achevée !"
  giga_dialog.2506.desc:0 "L'une des tranches de notre $name_alderson$ a finalement été achevée ! Cet habitat colossal s'étend sur plusieurs unités astronomiques, et fournira des quantités inimaginables d'espace de vie pour notre population et nos industries. Cette tranche est entièrement recouverte d'étalement urbo-industriel, offrant des capacités industrielles et des logements gigantesques pour nos citoyens."
  giga_dialog.2506.a:0 "Merveilleux !"
  
  giga_dialog.25061.title:0 "Alderson de ruche achevé !"
  giga_dialog.25061.desc:0 "L'une des tranches de notre $name_alderson$ a finalement été achevée ! Cet habitat colossal s'étend sur plusieurs unités astronomiques, et fournira des quantités inimaginables d'espace de vie pour notre population et nos industries. Cette tranche entière est un organisme vivant géant, connecté psioniquement à l'esprit de ruche qui l'a façonné. Tout être ne faisant pas partie de la ruche qui y met le pied sera attaqué par le terrain lui-même."
  giga_dialog.25061.a:0 "Merveilleux !"
  
  giga_dialog.25062.title:0 "Alderson machine achevé !"
  giga_dialog.25062.desc:0 "L'une des tranches de notre $name_alderson$ a finalement été achevée ! Cet habitat colossal s'étend sur plusieurs unités astronomiques, et fournira des quantités inimaginables d'espace de vie pour notre population et nos industries. Cette tranche est entièrement recouverte de structures artificielles. L'atmosphère ténue est principalement composée de polluants industriels et n'est pas capable de soutenir la vie biologique."
  giga_dialog.25062.a:0 "Merveilleux !"
  
  giga_dialog.2507.title:0 "$name_alderson$ achevé !"
  giga_dialog.2507.desc:0 "C'est fait ! Dans le système [giga_system.GetName], nous avons réussi à assembler complètement un disque colossal s'étendant de l'étoile jusqu'aux confins du système. Cette gigastructure gargantuesque éclipse tout ce que nous avons construit auparavant, et témoigne de notre domination ultime sur les lois de la physique et de l'ingénierie."
  giga_dialog.2507.a:0 "Qui pourrait nous résister maintenant ?"
  
  ########################################################
  ################# AUTOMATED STRIPMINE ##################
  ########################################################
  
  giga_dialog.3301.name:0 "Site de construction de la $name_auto_stripmine$ achevé"
  giga_dialog.3301.desc:0 "Nos ingénieurs ont terminé l'assemblage du site de construction d'une future $name_auto_stripmine$ près de [giga_system.GetName]. Cette grande plateforme orbitale accueillera tout ce dont nous avons besoin pour construire un vaste complexe minier autour de la planète, l'exploitant à ciel ouvert pour en extraire presque tous ses minéraux."
  giga_dialog.3301.a:0 "Excellent."
  
  giga_dialog.3302.name:0 "Appareil orbital de la $name_auto_stripmine$ construit"
  giga_dialog.3302.desc:0 "L'appareil orbital de notre $name_auto_stripmine$ est maintenant terminé. Cette grande construction se compose de deux grands faisceaux tracteurs capables à la fois de remonter de grandes quantités de minéraux extraits, et de bombarder la surface avec de grands faisceaux d'énergie afin de faire fondre les parties de la planète difficiles à exploiter. Il intègre également un anneau de traitement, afin d'augmenter encore la production de minéraux. Maintenant, nous devons terminer la construction des installations de surface, constituées de millions d'unités de forage robotiques, afin de réellement commencer les opérations d'exploitation à ciel ouvert."
  giga_dialog.3302.a:0 "Merveilleux !"
  
  giga_dialog.3303.title:0 "Mine planétaire à ciel ouvert opérationnelle"
  giga_dialog.3303.desc:0 "Notre $name_auto_stripmine$ a été activée avec succès ! D'gigantesques faisceaux tracteurs orbitaux téléportent des tonnes et des tonnes de minéraux, extraits par des millions de foreuses robotiques automatisées collectant les minéraux de la planète dans des milliers de vastes complexes miniers."
  giga_dialog.3303.monster.desc:0 "Notre $name_auto_stripmine$ a été activée avec succès ! D'gigantesques faisceaux tracteurs orbitaux téléportent des tonnes et des tonnes de minéraux, extraits par des millions de foreuses robotiques automatisées collectant les minéraux de la planète dans des milliers de vastes complexes miniers.\n\nLes précédents habitants de [giga_planet.GetName] n'ont pas réussi à s'échapper avant l'activation de la structure. Ils seront probablement ramassés comme de simples rochers et ajoutés à la production de la $name_auto_stripmine$."
  giga_dialog.3303.a:0 "Production de minéraux nominale."
  giga_dialog.3303.b:0 "Quelle horreur... pour eux."
  
  giga_dialog.3304.title:0 "La mine planétaire à ciel ouvert a atteint le noyau externe"
  giga_dialog.3304.desc:0 "Nos ingénieurs et scientifiques travaillant sur la $name_auto_stripmine$ de [giga_planet.GetName] nous informent que les opérations minières ont atteint le noyau externe en fusion de la planète.\nCela signifie que les opérations d'extraction de minéraux cesseront dans quelques années, lorsque nous atteindrons finalement le noyau interne."
  giga_dialog.3304.a:0 "Bien reçu."
  
  giga_dialog.3305.title:0 "Mine planétaire à ciel ouvert épuisée"
  giga_dialog.3305.desc:0 "La $name_auto_stripmine$ de [giga_planet.GetName] a épuisé les minéraux à extraire. [giga_planet.GetName] a été réduite à un petit noyau en fusion exposé au froid de l'espace. Les minéraux restants du noyau ont été extraits via des techniques de fracturation hydraulique avancées, ce qui signifie que seuls des débris et des matériaux à peine exploitables subsistent. L'appareil orbital a été démantelé et un gisement de minéraux est maintenant présent sur le noyau exposé de la planète."
  giga_dialog.3305.a:0 "C'était inévitable."
  
  giga_dialog.3306.name:0 "La mine planétaire à ciel ouvert a trouvé des ressources"
  giga_dialog.3306.desc.minerals:0 "La $name_auto_stripmine$ de [fromfrom.GetName] a mis au jour des filons de minerai riche de taille considérable. Ces filons augmenteront le rendement en £minerals£§YMinéraux§! de la $name_auto_stripmine$ en orbite de manière significative.\n\nOn estime qu'ils ne dureront que pendant encore [from.gigas_stripmine_rich_mineral_deposit_length] couches de la planète."
  giga_dialog.3306.desc.alloys:0 "La $name_auto_stripmine$ de [fromfrom.GetName] a découvert une portion de manteau particulièrement dense. Cette section de lithosphère extra-dense est structurellement incroyablement similaire aux £alloys£§YAlliages§!, nous permettant effectivement d'extraire directement des matériaux raffinés. Malheureusement, excaver un matériau digne de servir de blindage pour des vaisseaux spatiaux n'est pas une tâche simple, et la concentration requise sur le gisement dense ralentira la production de £minerals£§YMinéraux§!.\n\nOn estime que nous pouvons retirer encore [from.gigas_stripmine_alloy_deposit_length] couches de la planète avant que les matériaux denses ne s'épuisent."
  giga_dialog.3306.desc.gas:0 "La $name_auto_stripmine$ de [fromfrom.GetName] a percé de vastes cavernes, remplies d'une forme hautement pressurisée de £exotic_gases£§YGaz exotiques§! ! Les drones en surface devraient être capables d'extraire ce gaz précieux. Malheureusement, détourner des drones pour récolter le gaz ralentira la production de £minerals£§YMinéraux§!.\n\nNous estimons avoir encore [from.gigas_stripmine_gas_deposit_length] couches de la planète avant de cesser de voir ces cavernes."
  giga_dialog.3306.desc.motes:0 "La $name_auto_stripmine$ de [fromfrom.GetName] a découvert un filon de composés hautement volatiles. Avec un raffinage mineur, ces matériaux pourraient être utilisés comme substitut aux £volatile_motes£§YParticules volatiles§!. Cette aubaine, cependant, devrait réduire la production de £minerals£§YMinéraux§! car nous devons ralentir nos opérations minières pour éviter toute ignition accidentelle des composés.\n\nNous prédisons que les composés s'épuiseront après [from.gigas_stripmine_motes_deposit_length] couches de la planète."
  giga_dialog.3306.desc.crystals:0 "La $name_auto_stripmine$ de [fromfrom.GetName] a localisé une caverne remplie à ras bord de structures cristallines. Une purification et un traitement appropriés pourraient transformer des fragments de ces cristaux en £rare_crystals£§YCristaux rares§! utilisables. La caverne est instable et la nécessité de la démanteler soigneusement pour ne pas endommager les cristaux à l'intérieur ralentira malheureusement la production de £minerals£§YMinéraux§!.\n\nOn prédit que les cavernes seront présentes pendant encore [from.gigas_stripmine_crystal_deposit_length] couches de la planète."
  giga_dialog.3306.desc.tensiles:0 "La $name_auto_stripmine$ de [fromfrom.GetName] a découvert quelque chose de vraiment remarquable : une portion particulière de la planète est « creuse », cette cavité interne résistant aux forces de gravité grâce à un £giga_sr_amb_megaconstruction£§YMatériau supertensile§! naturel. Bien que le vide réduise la production de £minerals£§YMinéraux§! de la structure, la récolte estimée de ce £giga_sr_amb_megaconstruction£§YMatériau supertensile§! naturel est véritablement inestimable pour d'autres projets de mégaconstruction.\n\nLa poche ne devrait pas durer longtemps, ne soutenant l'exploitation que pour environ [from.gigas_stripmine_supertensile_deposit_length] couches de la planète."
  giga_dialog.3306.desc.default:0 "La $name_auto_stripmine$ de [fromfrom.GetName] a localisé une concentration anormale de ressources enfouies profondément sous la surface de la planète. Ces ressources devraient s'avérer inestimables pour augmenter la production de la structure, bien qu'elles ne dureront pas éternellement."
  ########################################################
  ######################### SUCC #########################
  ########################################################
  
  giga_dialog.1901.name:0 "Site de construction du $name_succ$ achevé"
  giga_dialog.1901.desc:0 "Le site de construction d'un futur $name_succ_full$ dans le système [giga_system.GetName] a été achevé ! Sur cet échafaudage, nous construirons un dispositif massif qui récoltera progressivement l'atmosphère de la géante gazeuse et la filtrera en gaz exotiques. Il générera également de l'énergie grâce à des réacteurs à fusion utilisant l'hydrogène présent dans l'atmosphère."
  giga_dialog.1901.a:0 "Combien de temps a-t-il fallu pour trouver cet acronyme ?"
  # old interstage build Dialogue
