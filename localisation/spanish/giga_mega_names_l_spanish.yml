  ehof_megastructure_ruined_DESC:0 "Una estructura orbital parcialmente construida en grave deterioro. Este $ehof_ehof$ fue una vez utilizado para viajes interestelares."
  ehof_megastructure_ruined_MEGASTRUCTURE_DETAILS:99 "$ehof_megastructure_phase0_MEGASTRUCTURE_DETAILS$"
  
  ehof_megastructure_ruined_origin:0 "$ehof_ehof_abr$ Alpha en Ruinas"
  ehof_megastructure_ruined_origin_DESC:0 "Estructura orbital parcialmente construida en grave deterioro. Este $ehof_ehof$ fue utilizado una vez para viajes interestelares."
  ehof_megastructure_ruined_origin_MEGASTRUCTURE_DETAILS:99 "$ehof_megastructure_ruined_MEGASTRUCTURE_DETAILS$"
  
