  succ_0:0 "Emplazamiento $gc_mega$$name_succ$"
  succ_0_MEGASTRUCTURE_DETAILS:0 "£galwonders£ $giga_list_category_megastructure$ - $giga_list_category_strategic_resource_production$\nExtrae un §YGigante Gaseoso§! para £exotic_gases£ y £volatile_motes£ así como £energy£ - $giga_list_category_eventually_runs_out$\n§LEste aparato extrae la atmósfera de un Gigante Gaseoso para recursos y combustible de fusión.§!" #megalistentry SUCC
  succ_0_DESC:0 "El Emplazamiento para un futuro $name_succ_full$. Alberga al personal necesario y la infraestructura para construir un $name_succ$ alrededor de este Gigante Gaseoso."
  
  succ_0_CONSTRUCTION_INFO_DELAYED:0 "$giga_list_additional_data$ - Elimina §Y1 Tamaño§! del planeta cada §Y2 Años§!. Se agota cuando el planeta alcanza §YTamaño 10§!, dejando un §YMundo Estéril§! con un depósito de §Y£exotic_gases£5 £volatile_motes£5§! detrás.\n\nEste depósito, como todos los depósitos de Recursos Estratégicos, puede ser explotado aún más con un $habitat_0$ o megaestructura de terraformación."
  #Old first stage
  # succ_1:0 "$name_succ$ Orbital Apparatus"
  # succ_1_DESC:0 "This gigantic ring stretches around the Gas Giant, and houses fusion reactors for energy generation, as well as purifying facilities for harvesting exotic gases and volatile motes from the Gas Giant's atmosphere."
  
  succ_1:99 "$name_succ$"
  succ_1_DESC:0 "Un $name_succ_full$ completo y operativo, extrayendo constantemente grandes cantidades de gases de un Gigante Gaseoso. Los reactores de fusión están utilizando el Hidrógeno recolectado para generar vastas cantidades de energía."
  ########################################
  ############## STRIPMINE ###############
  ########################################
  sr_mega_extra_data:99 "Will §Yreveal§! and §Yamplify§! deposits of strategic resources, and §Yamplify§! (but not create) deposits of regular resources."
  
  automated_stripmine_0:0 "Emplazamiento $gc_mega$$name_auto_stripmine$"
  automated_stripmine_0_DESC:0 "El Emplazamiento para un futuro $name_auto_stripmine$. Contiene todo lo necesario para construir el aparato de minería orbital así como las fábricas en el planeta."
  automated_stripmine_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_megastructure$ - $giga_list_category_basic_resource_production$\nExtrae cualquier §YMundo Rocoso§! para £minerals£ §YMinerales§! - $giga_list_category_eventually_runs_out$\n§LLa Mina Automatizada combina mineros robóticos en el planeta con haces de recolección orbital para pelar un planeta y extraer recursos valiosos." #gigalistentry AUTOMATED STRIPMINE
  automated_stripmine_0_CONSTRUCTION_INFO_DELAYED:0 "$giga_list_additional_data$ - Elimina §Y1 Tamaño§! del planeta cada §Y2 Años§!. Se agota cuando el planeta alcanza §YTamaño 2§!, dejando un pequeño núcleo con un depósito de £minerals£§Y20§!. Obtiene recursos adicionales si se construye en un mundo §YChthonian§!, §YDiamante§! o §YOcéano de Etano§! de §YDiversidad Planetaria§!"
  # Old first stage
  # automated_stripmine_1:0 "$name_auto_stripmine$ Orbital Apparatus"
  # automated_stripmine_1_DESC:0 "This large orbital apparatus is equipped with two enormous tractor beams capable of pulling large amounts of minerals into orbit. Those minerals will be extracted by a plethora of automated drilling units on the surface of the planet."
  
  automated_stripmine_1:99 "$name_auto_stripmine$"
  automated_stripmine_1_DESC:0 "Una gran construcción orbital extrayendo grandes cantidades de mineral de un planeta. Los minerales son extraídos por miles y miles de unidades de perforación en la superficie del planeta, desgajándolo capa por capa."
  
  #########################################
  ############## Kugelblitz ###############
  #########################################
  #Deprecated
  # kugelblitz_0:0 "$gc_mega$$name_kugelblitz$ Site"
  # kugelblitz_0_DESC:0 "The construction site for a future $name_kugelblitz$. Houses the personnel necessary to construct this incredibly advanced storage device."
  # kugelblitz_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_megastructure$ - $giga_list_category_storage$\nStores §Y40000§! of each resource and generates £energy£ §YEnergy§!\n§LAn incredibly advanced Kugelblitz-based storage device, which can store energy and matter in the form of radiation." #megalistentry KUGELBLITZ
  
  kugelblitz_0:0 "$gc_kilo$ $name_kugelblitz$ Vacío"
  kugelblitz_0_DESC:0 "Una gran construcción capaz de crear un Kugelblitz artificial para generar y almacenar energía gracias a la Radiación de Hawking acelerada, así como materia. También puede extraer la energía almacenada para usarla."
  kugelblitz_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_megastructure$ - $giga_list_category_storage$\nAlmacena §Y25000§! de cada recurso.\n§LUn dispositivo de almacenamiento basado en Kugelblitz increíblemente avanzado, que puede almacenar energía y materia en forma de radiación." #megalistentry KUGELBLITZ
  
  kugelblitz_1:99 "$name_kugelblitz$"
  kugelblitz_1_DESC:0 "Este constructo alberga un Kugelblitz artificial así como dispositivos capaces de inyectar y extraer energía de él. El Kugelblitz requiere una pequeña cantidad de energía para mantener la singularidad estable y permitir el almacenamiento seguro continuo de materiales."
  
  kugelblitz_2:0 "$name_kugelblitz$ Mejorado"
  kugelblitz_2_DESC:0 "Este constructo alberga un Kugelblitz artificial así como dispositivos capaces de inyectar y extraer energía de él. Los avances en tecnología de super-escala han permitido generar un kugelblitz estabilizado mucho más grande, permitiendo así una mayor cantidad de almacenamiento."
  
  kugelblitz_3:0 "$name_kugelblitz$ Grande"
  kugelblitz_3_DESC:0 "Este constructo alberga un Kugelblitz artificial así como dispositivos capaces de inyectar y extraer energía de él. Utilizando ingeniería tetra-dimensional somos capaces de un aumento aún mayor en la cantidad de almacenamiento viable de un solo kugelblitz generado."
  
  kugelblitz_ruined:0 "$name_kugelblitz$ En Ruinas"
  kugelblitz_ruined_DESC:0 "Un $name_kugelblitz$ En Ruinas. Construido para albergar una singularidad artificial controlada, este constructo ha sufrido daños inmensos en el pasado y ya no está operativo. Aunque difícil, las reparaciones podrían ser posibles."
  kugelblitz_ruined_MEGASTRUCTURE_DETAILS:99 "$kugelblitz_ruined_DESC$"
  
  kugelblitz_restored:99 "$name_kugelblitz$"
  kugelblitz_restored_DESC:99 "$kugelblitz_2_DESC$"
  
  #########################################
  ### Planetary Seeder Nexus ##############
  #########################################
  giga_tech_planetary_seeder_nexus:99 "Large-Scale Extremophile Sustenance"
  giga_tech_planetary_seeder_nexus_desc:99 "Barren worlds, both hot and cold, often feature the basic building blocks of life, merely not in the proper arrangement. However, with the discovery of Cutholoids and Amoebas thriving in the depths of space, there now lies the possibility of creating bespoke artificial 'lifeforms' which, once deposited on lifeless worlds, will be able to accumulate and rearrange these building blocks into various substances suitable for harvest and consumption. As all these would do is shuffle and rearrange scattered molecules into various edible compounds, these would have to be regularly replenished and would not constitute a proper 'biosphere', but could provide a useful supply of materials to our nutrition industries."
  
  planetary_seeder_nexus_0:99 "$gc_kilo$$name_planetary_seeder_nexus$: Organic Biosensors"
  planetary_seeder_nexus_0_DESC:99 "This site will serve as a base to construct an $name_planetary_seeder_nexus$, an orbital bioengineering facility producing various quasi-biological automata able to reprocess scattered organic compounds found within lifeless worlds into edible matter. Large geo-surveying arrays constantly scan nearby worlds and deploy probes to confirm the locations of highly concentrated processable organic compounds."
  planetary_seeder_nexus_0_MEGASTRUCTURE_DETAILS:99 "$giga_list_category_kilostructure$ - $giga_list_category_basic_resource_production$\nGenerates £food£ §YFood§! deposits on system planets.\n§LA station built in orbit of a gas giant, producing biological automata which reprocessed organic compounds into edible matter.§!" #megalistentry PLANETARY SEEDER NEXUS
  planetary_seeder_nexus_0_CONSTRUCTION_INFO_DELAYED:99 "$giga_list_additional_data$ - $planetary_seeder_nexus_1_mod_tooltip$"
  
  planetary_seeder_nexus_1:99 "$name_planetary_seeder_nexus$: Biological Manufactory"
  planetary_seeder_nexus_1_DESC:99 "Nutritious phytoplankton-like lifeforms capable of thriving in subsurface oceans, rocky crusts and gaseous atmospheres are produced in vast quantities and spread through the local system."
  
  planetary_seeder_nexus_2:99 "$name_planetary_seeder_nexus$: Enzyme Plants"
  planetary_seeder_nexus_2_DESC:99 "For worlds that cannot sustain conventional life, advanced plants manufacture enzyme-rich cellular automata capable of incredible feats of molecular chemistry ranging from rearranging the crust and atmosphere of carbon-rich worlds into pillars of crystallised sucrose to producing protein slurry by manipulating hydrocarbons and water."
  
  planetary_seeder_nexus_3:99 "$name_planetary_seeder_nexus$"
  planetary_seeder_nexus_3_DESC:99 "A complete $name_planetary_seeder_nexus$, overseeing the production, deployment and subsequent harvest of specialized enzymes and nutritional lifeforms onto nearly every world in this system."
  
  #########################################
  ### Orbital Artificial Ecosystem ########
  #########################################
  giga_tech_orbital_artificial_eco:0 "Ecosistemas Orbitales"
  giga_tech_orbital_artificial_eco_desc:0 "Crear un ecosistema complejo completamente funcional en órbita de un planeta es todo un desafío, pero esta tecnología permite la construcción de grandes ecosistemas en órbita de un planeta con fines de investigación."
  
  orbital_artificial_eco_0:0 "$gc_kilo$$name_orbital_artificial_eco$: Soporte Vital"
  orbital_artificial_eco_0_DESC:0 "Este sitio servirá como base para construir un $name_orbital_artificial_eco$, que es una gran estructura que alberga un ecosistema completamente artificial en el que podemos experimentar libremente."
  orbital_artificial_eco_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$ - $giga_list_category_science_production$\nGenera depósitos de £society_research£ §YInvestigación Social§! en los planetas del sistema.\n§LUna estación construida para albergar y estudiar un gran número de especies exóticas de flora y fauna.§!" #megalistentry ORBITAL ARTIFICIAL ECOSYSTEM
  orbital_artificial_eco_0_CONSTRUCTION_INFO_DELAYED:99 "$giga_list_additional_data$ - $orbital_eco_arcology_1_mod_tooltip$"
  
  orbital_artificial_eco_1:0 "$name_orbital_artificial_eco$: Banco de Genes"
  orbital_artificial_eco_1_DESC:0 "Un conjunto de brazos externos para almacenar funcionalmente la información genética de todas las especies alojadas dentro del $name_orbital_artificial_eco$ planeado, de modo que si alguna se extingue, pueden ser recuperadas."
  
  orbital_artificial_eco_2:0 "$name_orbital_artificial_eco$: Recintos Exóticos"
  orbital_artificial_eco_2_DESC:0 "Los recintos exóticos albergan una variedad de entornos simulados, así como instalaciones para asegurar que toda la flora y fauna tengan números sostenibles."
  
  orbital_artificial_eco_3:0 "$name_orbital_artificial_eco$: Pruebas Planetarias"
  orbital_artificial_eco_3_DESC:0 "Un $name_orbital_artificial_eco$ completo, lleno de especies importadas, así como fabricadas gracias a la ingeniería genética. Este ecosistema único puede ser modelado y deformado por nuestros científicos a voluntad para estudiar cómo funciona la naturaleza."
  
  orbital_artificial_eco_ruined:0 "Ruinas de $name_orbital_artificial_eco$"
  orbital_artificial_eco_ruined_DESC:0 "Un $name_orbital_artificial_eco$ en ruinas. Solía albergar una gran cantidad de especies bioingenierizadas dentro de entornos controlados, pero ya no. Podría ser posible restaurarlo dado las tecnologías adecuadas."
  orbital_artificial_eco_ruined_MEGASTRUCTURE_DETAILS:99 "$orbital_artificial_eco_ruined_DESC$"
  
  orbital_artificial_eco_restored:99 "$name_orbital_artificial_eco$"
  orbital_artificial_eco_restored_DESC:99 "$orbital_artificial_eco_3_DESC$"
  
  giga_dialog.1003.name:99 "Ruined $name_orbital_artificial_eco$"
  giga_dialog.1003.desc:99 "A ruined $name_orbital_artificial_eco$ has been spotted orbiting a Gas Giant in the [from.GetName] system. It appears to have sustained large amounts of damage, yet the outer frame is still somewhat intact. Our scientists believe it might be feasible to repair it if we possess the proper technologies."
  giga_dialog.1003.a:99 "Interesting."
  #########################################
  ### Macroengineering Test Site ##########
  #########################################
  giga_tech_engineering_test_site:0 "Colosales Instalaciones de Pruebas"
  giga_tech_engineering_test_site_desc:0 "Construir una instalación de pruebas en la órbita de un planeta puede resultar tan difícil como increíblemente mortal. Sin embargo, las aplicaciones potenciales son muy prometedoras."
  
  macro_test_site_0:0 "$gc_kilo$$name_eng_test_site$: Geo-Estabilizador"
  macro_test_site_0_DESC:0 "Un gran aparato diseñado para ayudar a que los desechos congelados del planeta no sean completamente destruidos por el estrés constante de la magnitud de nuestras pruebas de armas planificadas."
  macro_test_site_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$ - $giga_list_category_science_production$\nGenera £engineering_research£ §YInvestigación de Ingeniería§! e incrementa §YHP de Blindaje§! en §Y2.5%§!\n§LUna gran estación orbitando un planeta para realizar libremente experimentos relacionados con la ingeniería.§!" #megalistentry MACROENGINEERING TEST SITE
  macro_test_site_0_CONSTRUCTION_INFO_DELAYED:99 "$giga_list_additional_data$ - $orbital_test_site_1_mod_tooltip$"
  
  macro_test_site_1:0 "$name_eng_test_site$: Bahías de Prueba de Materiales"
  macro_test_site_1_DESC:0 "Las bahías de prueba permiten el movimiento a gran escala de materiales y naves sin terminar a los sitios de prueba en el planeta de abajo, así como a otros planetas dentro del sistema."
  
  macro_test_site_2:0 "$name_eng_test_site$: Simulaciones de Materiales"
  macro_test_site_2_DESC:0 "Las simulaciones de materiales pueden ayudar a mejorar aún más la eficiencia de las pruebas de materiales más prácticas, permitiendo una impresionante variedad de destrucción simulada y devastación planetaria"
  
  macro_test_site_3:0 "$name_eng_test_site$: Campo de Tiro Orbital"
  macro_test_site_3_DESC:0 "Los campos de tiro permiten un bombardeo casi constante del planeta de abajo, así como la entrega de municiones hostiles más lentas a larga distancia a otros planetas en el sistema, aunque son demasiado lentas para ser utilizadas en escenarios de combate."
  
  macro_test_site_ruined:0 "$name_eng_test_site$ En Ruinas"
  macro_test_site_ruined_DESC:0 "Un $name_eng_test_site$ en ruinas, construido hace eones por una raza espacial. Aunque el interior está completamente destrozado, el casco externo está mayormente intacto y podría ser reparado."
  macro_test_site_ruined_MEGASTRUCTURE_DETAILS:99 "$macro_test_site_ruined_DESC$"
  
  macro_test_site_restored:99 "$name_eng_test_site$"
  macro_test_site_restored_DESC:99 "$macro_test_site_3_DESC$"
  
  macro_test_site_1_dismantle:0 "Desmantelar Megaestructura"
  macro_test_site_1_dismantle_DESC:0 "Esta megaestructura será desmantelada y desechada para obtener materiales."
  
  giga_dialog.403.name:0 "$name_eng_test_site$ En Ruinas"
  giga_dialog.403.desc:0 "Nuestra nave científica ha detectado una estación espacial bastante grande orbitando alrededor de un planeta en el sistema [from.GetName]. Tras una investigación más cercana, parece que esta estación espacial es en realidad un $name_eng_test_site$ en ruinas, construido hace mucho tiempo por alguna especie desconocida. Esta estación espacial probablemente sirvió como campo de pruebas para muchos experimentos en el pasado, pero desde entonces ha caído tristemente en ruinas."
  giga_dialog.403.a:0 "Intrigante."
  
  #########################################
  ### Atmospheric Storm Observatory #######
  #########################################
  giga_tech_macro_scale_weather_manipulation:0 "Manipulación Macro-Atmosférica del Clima"
  giga_tech_macro_scale_weather_manipulation_desc:0 "La construcción de una instalación dedicada a crear tormentas masivas dentro de la atmósfera de los gigantes gaseosos podría permitirnos estudiar los efectos mucho mejor que cualquier tormenta natural. Las aplicaciones de tal investigación de tormentas son muy prometedoras."
  
  atmosphere_shredder_0:0 "$gc_kilo$$name_atmosphere_shredder$: Ojo de Tormenta"
  atmosphere_shredder_0_DESC:0 "Una gran instalación de manipulación meteorológica que alberga todos los materiales necesarios para poner en marcha una tormenta experimental en toda la atmósfera. La estructura nos permitirá llevar a cabo diversos experimentos en el propio gigante gaseoso y recopilar valiosos datos de todo el sistema."
  atmosphere_shredder_0_MEGASTRUCTURE_DETAILS:0 "$giga_list_category_kilostructure$ - $giga_list_category_science_production$\nGenera depósitos de £physics_research£ §YInvestigación en Física§! en los planetas del sistema.\n§LUna gran estación que orbita alrededor de un gigante gaseoso provocando una tormenta permanente para el estudio y la experimentación.§!"
  atmosphere_shredder_0_CONSTRUCTION_INFO_DELAYED:99 "$giga_list_additional_data$ - $orbital_atmosphere_shredder_1_mod_tooltip$"
  
  atmosphere_shredder_1:0 "$name_atmosphere_shredder$: Brazos Agitadores"
  atmosphere_shredder_1_DESC:0 "Los colosales Brazos Agitadores permiten amplificar la fuerza de la tormenta planetaria, aumentando aún más el potencial de estudio."
  
  atmosphere_shredder_2:0 "$name_atmosphere_shredder$: Brazos Estabilizadores"
  atmosphere_shredder_2_DESC:0 "Los brazos estabilizadores crearán bolsas de relativa calma en la tormenta, lo que permitirá la recuperación segura de drones y otras máquinas automatizadas enviadas a la tormenta para estudiarla."
  
  atmosphere_shredder_3:0 "$name_atmosphere_shredder$: Anillo de Laboratorio"
  atmosphere_shredder_3_DESC:0 "El anillo laboratorio alberga los sensores menos delicados de la estación. El anillo está destinado a sumergirse en la potencia de la tormenta permitiendo recuperar una gran cantidad de datos."
  
  atmosphere_shredder_complete_name:99 "$name_atmosphere_shredder$"
  
  atmosphere_shredder_ruined:0 "$name_atmosphere_shredder$ En Ruinas"
  atmosphere_shredder_ruined_DESC:0 "Una $name_atmosphere_shredder$ en ruinas, construida hace eones por una raza espacial. Aunque el mecanismo de control de tormentas y los componentes internos están destruidos, el casco externo está casi intacto y podría repararse."
  atmosphere_shredder_ruined_MEGASTRUCTURE_DETAILS:99 "$atmosphere_shredder_ruined_DESC$"
  
  atmosphere_shredder_restored:99 "$name_atmosphere_shredder$"
  atmosphere_shredder_restored_DESC:99 "$atmosphere_shredder_3_DESC$"
  
